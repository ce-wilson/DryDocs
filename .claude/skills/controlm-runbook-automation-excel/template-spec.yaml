      - {name: "Job Name/ SQL Agent Job",                                  source: graph,          example: "POHUB0015_UPD_ORDER_BAL_W_DAT_ONPM_FW"}
      - {name: "Description",                                              source: graph,          example: "Control-M File Watcher for DAT"}
      - {name: "Severity",                                                 source: graph-partial,  example: "P2"}
      - {name: "QR information",                                           source: graph-partial,  example: "OHUB-FW-CTRL-RES"}
      - {name: "Source Distribution List /POC",                            source: graph-partial,  example: "upstream.poc@example.com"}
      - {name: "Source snow queue",                                        source: graph-partial,  example: "External"}
      - {name: "Target Distribution List /POC",                            source: graph,          example: "OHUB_L2_Support@example.com"}
      - {name: "Target snow queue",                                        source: graph,          example: "APP-DAT-ASUP-OHUB"}
      - {name: "File Name for File Watcher (both Token and Data file name with path)", source: graph, example: "/data/etl/ohub_data_warehouse/dropbox/Order_Level_Balance_.dat"}
      - {name: "Compute JSON File (Default/ Parametrized)",                source: graph-partial,  example: "Default"}
      - {name: "Control-M Command Line (other than FW jobs)",              source: graph,          example: "N/A"}
      - {name: "Parameter/YML/Config File Details",                        source: graph-partial,  example: ""}
      - {name: "Nature of file (Full/Delta) or (Consumer/Producer)",       source: graph-partial,  example: "Delta"}
      - {name: "SLO based on ODATE",                                       source: graph-partial,  example: "ODATE + 1 8AM EST"}
