      - {name: "Job Start Time",                                           source: graph,          example: "00:00"}
      - {name: "Avg File/Source availability time",                        source: graph-partial,  example: "N/A"}
      - {name: "Avg Run time",                                             source: graph,          example: ""}
      - {name: "Avg Volume",                                               source: manual,         example: ""}
      - {name: "CYCLIC (Y/N)",                                             source: graph,          example: "N"}
      - {name: "Job Holiday Calendar",                                     source: graph,          example: "N"}
      - {name: "ABI PSET/DPL PIPELINE ID/Kafka",                           source: graph,          example: ""}
      - {name: "Source Dataset GUID",                                      source: graph,          example: ""}
      - {name: "Target Dataset GUID",                                      source: graph,          example: ""}
      - {name: "Source Dataset group/Kafka Cluster",                       source: graph-partial,  example: ""}
      - {name: "Source Entity/Table/Kafka Topic",                          source: graph-partial,  example: ""}
      - {name: "Target Dataset group/Schema",                              source: graph-partial,  example: ""}
      - {name: "Target Entity/Table",                                      source: graph-partial,  example: ""}
      - {name: "Error Table/Entity",                                       source: graph-partial,  example: ""}
      - {name: "Snowflake Schema",                                         source: graph-partial,  example: ""}
      - {name: "Snowflake table",                                          source: graph-partial,  example: ""}
      - {name: "Glue Table",                                               source: graph-partial,  example: ""}
      - {name: "Job Restartable",                                          source: manual,         example: "Yes"}
      - {name: "Manual Intervention needed for restart",                   source: manual,         example: "Yes"}
    # Three example rows — one per job family the source workbook demonstrates.
