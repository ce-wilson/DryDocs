[tool.poetry]
name = "drydocs"
version = "0.3.0"
description = "Production support inventory + data product knowledge graph for D&A batches."
authors = ["Production Support Team"]
readme = "README.md"
packages = [{ include = "drydocs" }, { include = "drydocs_core" }, { include = "drydocs_remediation" }, { include = "drydocs_lineage" }, { include = "drydocs_deepdoc" }, { include = "drydocs_api" }]

[tool.poetry.dependencies]
python = "^3.11"
neo4j = "^5.20"
oracledb = "^2.2"
pandas = "^2.2"
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
typer = "^0.12"
click = ">=8.0,<8.2"
rich = "^13.7"
pyyaml = "^6.0.3"          # runtime: the precedence resolver reads config/*.yaml at load time

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
testcontainers = { version = "^4.5", extras = ["neo4j"] }
ruff = "0.5.7"        # EXACT, caret removed deliberately — J10 stage 0. Formatter
                      # output varies across ruff versions, and the producer and
                      # company sides format INDEPENDENTLY (disjoint histories; the
                      # mechanical commits are regenerated, not ported). A floating
                      # pin would let the two sides converge on different output from
                      # the same config, which is the one thing this design cannot
                      # tolerate. Upgrade in lockstep, via a ported pyproject commit.
                      # Authority: docs/ruff-format-convergence.md
mypy = "^1.10"
pypdf = "^6.14.2"

# drydocs-api wiring (ADR 0005): OPTIONAL so the default install and unit suite
# stay framework-free — the component's handlers are pure. `poetry install --with api`.
[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115"
uvicorn = ">=0.30"
httpx2 = ">=2.9"           # fastapi.testclient transport. starlette >=1.3 tries httpx2, falls back to
                           # httpx with a deprecation warning — so BOTH work and the right one depends on
                           # your starlette. Don't hand-maintain this: test_drydocs_api.py::
                           # test_declared_test_transport_matches_what_starlette_resolves asks the
                           # installed starlette what it actually resolved and fails if this disagrees.

[tool.poetry.scripts]
drydocs = "drydocs.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- ruff: the SHARED contract (J10 stage 0) ---------------------------------
# This block is the only part of the ruff convergence that PORTS. Both repos run
# the same tool, same pinned version, same config — then each formats its own
# tree independently (docs/ruff-format-convergence.md). Changing anything here
# changes the other side's output too, so change it as a ported commit, never
# as a local convenience.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
# per-file-ignores land at stage 4, each with a reason comment. Deliberately
# absent here: stage 0 settles the CONTRACT, it rules on no findings.

[tool.ruff.format]
# Values are ruff's own defaults, written out on purpose. The formatter's
# defaults are not a stable contract across versions, and "we both took the
# default" is not something either side can verify from the repo — an explicit
# block is.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false
# LF, never "auto". `auto` infers the ending from each file, so the same source
# formats differently on a CRLF working tree than on the Linux runner — the
# exact class of OS-dependent output that kept CI red 2026-07-21..07-31 (see
# tests/unit/test_render_determinism.py). .gitattributes normalizes *.sh only;
# this covers *.py.
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration (Docker/testcontainers) is opt-in: deselected by default so the
# CLAUDE.md gates and CI keep unit-suite timing (J9). Run it with:
#   poetry run pytest tests/integration -m integration -q
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: end-to-end tests requiring Docker (testcontainers); opt-in via -m integration",
]
