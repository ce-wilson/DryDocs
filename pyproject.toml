[tool.poetry]
name = "drydocs"
version = "0.3.0"
description = "Production support inventory + data product knowledge graph for D&A batches."
authors = ["Production Support Team"]
readme = "README.md"
packages = [{ include = "drydocs" }, { include = "drydocs_core" }, { include = "drydocs_remediation" }, { include = "drydocs_lineage" }, { include = "drydocs_deepdoc" }, { include = "drydocs_docmeta" }, { include = "drydocs_api" }]

[tool.poetry.dependencies]
python = "^3.11"
neo4j = "^5.20"
oracledb = "^2.2"
pandas = "^2.2"
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
typer = "^0.12"
click = ">=8.0,<8.2"
rich = "^13.7"
pyyaml = "^6.0.3"          # runtime: the precedence resolver reads config/*.yaml at load time

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
testcontainers = { version = "^4.5", extras = ["neo4j"] }
ruff = "0.5.7"        # EXACT, caret removed deliberately — J10 stage 0. Formatter
                      # output varies across ruff versions, and the producer and
                      # company sides format INDEPENDENTLY (disjoint histories; the
                      # mechanical commits are regenerated, not ported). A floating
                      # pin would let the two sides converge on different output from
                      # the same config, which is the one thing this design cannot
                      # tolerate. Upgrade in lockstep, via a ported pyproject commit.
                      # Authority: docs/ruff-format-convergence.md
mypy = "^1.10"
pypdf = "^6.14.2"

# drydocs-api wiring (ADR 0005): OPTIONAL so the default install and unit suite
# stay framework-free — the component's handlers are pure. `poetry install --with api`.
openpyxl = "^3.1.5"
jsonschema = "^4.26.0"
[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115"
uvicorn = ">=0.30"
httpx2 = ">=2.9"           # fastapi.testclient transport. starlette >=1.3 tries httpx2, falls back to
                           # httpx with a deprecation warning — so BOTH work and the right one depends on
                           # your starlette. Don't hand-maintain this: test_drydocs_api.py::
                           # test_declared_test_transport_matches_what_starlette_resolves asks the
                           # installed starlette what it actually resolved and fails if this disagrees.
python-multipart = ">=0.0.9"

# drydocs-remediation XML VALIDATION (optional, mirroring the api group):
# lxml validates emitted <folder>.updated.xml against the acquired .dtd/.xsd —
# it is the VALIDATOR, never the emitter. The minimal-diff emitter is xml_io's
# stdlib byte-splicer, guarded by test_xml_io_imports_are_stdlib_core_and_formats_only
# (lxml collapses multi-line attribute wrapping exactly as ElementTree does, so
# "simplifying" the splicer into it would break the §XML contract).
# `poetry install --with remediation`. See drydocs_remediation/module-requirements.md.
[tool.poetry.group.remediation]
optional = true

[tool.poetry.group.remediation.dependencies]
lxml = ">=5.3"

[tool.poetry.scripts]
drydocs = "drydocs.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- ruff: the SHARED contract (J10 stage 0) ---------------------------------
# This block is the only part of the ruff convergence that PORTS. Both repos run
# the same tool, same pinned version, same config — then each formats its own
# tree independently (docs/ruff-format-convergence.md). Changing anything here
# changes the other side's output too, so change it as a ported commit, never
# as a local convenience.
[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored Anthropic skill scripts (J10 stage 4). Not our code: docx/pptx/xlsx
# ship three near-identical copies of the same office validators, and any fix we
# make here is reverted the next time the skill is re-vendored — so linting them
# buys churn, not quality. They were 177 of the 362 findings that survived the
# formatter, 49% of the residual, and every one of the naming hits among them is
# a required idiom (do_GET/do_POST are BaseHTTPRequestHandler overrides).
# `.claude/skills/groom-backlog` is OURS and deliberately stays in scope.
# Captured experiment records (2026-08-12). The 13 `.py` files under these two
# directories are the scratch scripts the graph-vs-files comparison agents wrote
# DURING the runs; they are kept verbatim as the record of what each track did,
# and the repo has already ruled this class once — "fixing somebody else's
# capture to satisfy a guard is a provenance call, not a formatting one" (port
# ledger step 123, which inboxed the same question as Idea-103 rather than
# editing the captures). Same reasoning as the vendored block above: we do not
# author them, and reformatting them would rewrite evidence to please a linter.
# Nothing imports them — verified before excluding. They were 13 of the 48
# findings and 12 of the 44 unformatted files blocking CI.
# If a future capture lands elsewhere under docs/, widen this to `docs` rather
# than adding a third path — any `.py` under a documentation tree is an artifact.
extend-exclude = [
    ".claude/skills/docx",
    ".claude/skills/pptx",
    ".claude/skills/xlsx",
    ".claude/skills/pdf",
    ".claude/skills/skill-creator",
    "docs/reviews/graph-vs-files-experiment/results",
    "docs/reviews/graph-vs-files-experiment/results-sonnet",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = [
    # The formatter owns layout. What survives `ruff format` is prose inside
    # strings, comments and docstrings, which the formatter never wraps — by
    # design, like Black. Keeping E501 would mean hand-wrapping prose to satisfy
    # a rule the formatter is already the authority on. Ruled 2026-08-01.
    "E501",
    # Every hit is `import xml.etree.ElementTree as ET` — the alias the stdlib's
    # own documentation uses. Renaming makes the code less recognisable, not more.
    "N817",
    # RUF002 (docstrings) and RUF003 (comments) — ambiguous-Unicode in PROSE.
    # Ruled 2026-08-12 after reading every hit: the suggested replacements are
    # wrong here, not merely unnecessary. The characters are deliberate technical
    # notation and the fix would corrupt meaning:
    #   `defect A′` / `defect B′` — established identifiers for two remediation
    #     defects, carried in commit subjects (3ebb66d, d40c9cb) and throughout
    #     drydocs_remediation. Ruff proposes a BACKTICK, giving `defect A``.
    #     CLAUDE.md is explicit that a style pass never renames identifiers.
    #   `⊆` / `∪` — set notation in a comment describing set semantics ("emitted
    #     tokens ⊆ before ∪ introduced"). Ruff proposes capital `U`, which reads
    #     as a word and is actively misleading.
    #   `−` (MINUS SIGN) — arithmetic in prose, "(a) − (b)".
    # RUF001 stays ENFORCED and is the one that matters: ambiguous characters in
    # IDENTIFIERS are a real hazard, where in prose they are typography. That
    # split is the same one docs/ruff-format-convergence.md drew for RUF001/2/3.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Typer's API IS a call in the default: `def cmd(x: str = typer.Option(...))`.
# B008 cannot be satisfied without abandoning the framework's calling convention.
"drydocs/cli.py" = ["B008"]
"drydocs/cli_*.py" = ["B008"]  # S8: the per-domain command modules carry the same Typer convention
# RUF009 flags `span: Span = Span(0, 0)` on XmlNode. The rule exists to catch a
# SHARED MUTABLE default, and `Span` is `@dataclass(frozen=True)` — an immutable
# value object, so one shared instance is correct and a default_factory would
# only allocate per node for no benefit. Ruff does not special-case frozen
# dataclasses, so this is a true-positive rule firing on a safe construction.
"drydocs_remediation/xml_io.py" = ["RUF009"]
# `pytest.importorskip(...)` must run BEFORE the imports it guards, which is
# exactly what E402 flags. The guard is the point: these modules skip cleanly
# when an optional dependency is absent.
"tests/unit/test_seal_attribution.py" = ["E402"]
"tests/unit/test_folder_attribution.py" = ["E402"]
"tests/unit/test_manual_loads.py" = ["E402"]
# N818 wants an `Error` suffix on exception names. `WriteRejected` and
# `Forbidden` have 55 call sites between them across drydocs_api, and these same
# files are cherry-picked onto the company repo's disjoint history — a rename
# buys a suffix and costs a port collision across every one of those sites.
# `raise Forbidden(...)` also reads perfectly well. Revisit if drydocs_api ever
# gets a versioned public API, where the convention would start to earn its keep.
"drydocs_api/guard.py" = ["N818"]
"drydocs_api/handlers.py" = ["N818"]
"scripts/external_vendor_scrape.py" = ["N818"]
# The alias is the point: `__version__ as APP_VERSION` says at the call site
# WHICH package's version this is. N812 would have us keep the bare dunder,
# which is exactly the ambiguity the alias removes.
"drydocs_api/exports.py" = ["N812"]

[tool.ruff.format]
# Values are ruff's own defaults, written out on purpose. The formatter's
# defaults are not a stable contract across versions, and "we both took the
# default" is not something either side can verify from the repo — an explicit
# block is.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false
# LF, never "auto". `auto` infers the ending from each file, so the same source
# formats differently on a CRLF working tree than on the Linux runner — the
# exact class of OS-dependent output that kept CI red 2026-07-21..07-31 (see
# tests/unit/test_render_determinism.py).
#
# This and `.gitattributes` are BOTH required — they close the same gap from
# opposite ends, and either alone leaves `ruff format --check` red on Windows:
#   .gitattributes `*.py text eol=lf` decides what lands ON DISK at checkout,
#   so the tree ruff reads is already LF;
#   this setting decides what ruff WRITES, so `ruff format .` emits identical
#   bytes on Windows and on the Linux runner.
# (Corrected 2026-08-01: this comment used to say .gitattributes normalized
# `*.sh` only. It gained the `*.py` rule at J10 stage 0 — same commit family —
# and the comment was never updated. It sits inside the block the company repo
# holds byte-identical as the shared format contract, so a wrong claim here is
# read by both sides.)
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration (Docker/testcontainers) is opt-in: deselected by default so the
# CLAUDE.md gates and CI keep unit-suite timing (J9). Run it with:
#   poetry run pytest tests/integration -m integration -q
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: end-to-end tests requiring Docker (testcontainers); opt-in via -m integration",
]
