# =============================================================================
# CI — the CLAUDE.md §6 gates as an enforced push guard (backlog J5).
#
# Unit-test scope ONLY: no Neo4j, no Oracle, no network-dependent steps — the
# suite's own skip guards handle the gitignored sample data (test_skip_guard_policy
# enforces that they skip, never fail). The classification test is the automated
# half of the publish boundary (PUBLISH-BOUNDARY.md).
#
# ruff is BLOCKING as of J10 (2026-08-01) — both `ruff check .` and `ruff format
# --check .`. It was advisory from J5 while the repo carried ~757 pre-existing
# findings; J10 cleared them (docs/ruff-format-convergence.md). The version pin
# in pyproject is EXACT and load-bearing: formatter output varies across ruff
# releases, so a floating pin would turn an upgrade into a red build here and a
# spurious cross-repo diff company-side.
# =============================================================================
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels the in-flight run for the older commit —
# only the newest sha runs to completion (Actions-minutes decision, 2026-08-21).
# The session ritual is unaffected: snapshot.ps1's CI check matches on HEAD's
# sha, and HEAD's run is the one cancellation never touches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE INTERPRETER / OS MATRIX (backlog J67, 2026-09-07). One leg blocks; the
  # rest report. Until this existed, `pyproject.toml` declared `python = "^3.11"`
  # and CI proved exactly one point inside that range, on one OS — so the range
  # was an assertion nothing tested, and the two dev machines had already drifted
  # apart underneath it without anything noticing.
  #
  # WHAT IS ACTUALLY RUN, measured rather than assumed, each stamped with its
  # venue (J18): desktop base interpreter CPython 3.14.6, both producer venvs
  # (2026-09-01, recorded on J67); laptop `NewThinkpad` base and venv CPython
  # 3.12.10 on win32 (2026-09-07). The comment that stood here said "3.12 is what
  # both dev machines run" and gave that as the reason for a single version — it
  # is half true now and was already stale when J67 measured it. Both machines are
  # inside `^3.11`; neither is what makes the range safe, because nothing tested
  # its ends.
  #
  # WHY THE RANGE STAYED AND CI GREW, rather than the reverse (J67 (a) asked for
  # one direction): narrowing to what CI proved would have declared `^3.12` and
  # thereby excluded 3.14 — the interpreter the desktop writes every line on. A
  # range that excludes a machine in daily use is a worse falsehood than an
  # untested one, and J67 (d) rules the lock out of scope besides.
  #
  # WHICH LEGS, AND WHY NOT MORE. 3.12 blocking (the status quo, unchanged cost);
  # 3.11 because an untested FLOOR is precisely the assertion this item objects
  # to; 3.14 because it is what the desktop runs; windows-latest because all local
  # work is Windows and the repo already carries `.gitattributes` CRLF rules,
  # `getpass` handling and `VIRTUAL_ENV` behaviour that exist BECAUSE the two
  # platforms differ. 3.13 is deliberately skipped: it is an interior point
  # between two tested ends, and the 2026-08-21 Actions-minutes decision is still
  # a real constraint.
  #
  # ADVISORY FIRST, AND FLIPPING ONE IS A SEPARATE DECISION (J67 (b)). A new leg
  # reports the truth without turning the trunk red on something nobody has
  # triaged. The precedent is J10 stage 5, where a blocking gate nobody watched
  # ran red for 100+ consecutive runs: a gate is only worth blocking on once
  # somebody believes it. `fail-fast: false` so an advisory leg can never cancel
  # the blocking one.
  #
  # NOT COVERED, DELIBERATELY (J67 (e)): `agents/requirements.txt` is a separate
  # interpreter that LEADS this project by declaration (neo4j>=6.2,<7 against the
  # project's 5.x — G110, "may lead, but only by declaration"). No leg here
  # installs it and this matrix does not extend to it. Naming the gap keeps it
  # deliberate instead of discovered again later.
  gates:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            advisory: false
            poetry-cache: ~/.cache/pypoetry
          - os: ubuntu-latest
            python-version: "3.11"
            advisory: true
            poetry-cache: ~/.cache/pypoetry
          - os: ubuntu-latest
            python-version: "3.14"
            advisory: true
            poetry-cache: ~/.cache/pypoetry
          - os: windows-latest
            python-version: "3.12"
            advisory: true
            poetry-cache: ~\AppData\Local\pypoetry\Cache
    name: gates (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.advisory && ', advisory' || '' }})
    steps:
      # FULL HISTORY, ON PURPOSE, AND ONLY HERE (backlog CORE3, 2026-09-07).
      #
      # actions/checkout defaults to depth 1. The J74 commit-message ceiling
      # guard (tests/unit/test_publish_boundary_history_ceiling.py) reads
      # `git log` and, finding a shallow clone, SKIPS loudly rather than count a
      # truncated history and report a false zero. That is the guard behaving
      # correctly — and it meant the guard was inert in the one place it would
      # otherwise run on every push, since the local pre-push suite is a habit
      # and CI is a mechanism. This is the decision to make it run.
      #
      # THE COST, MEASURED rather than assumed (laptop, 2026-09-07): 2,321
      # commits reachable from main; a `--depth 1` clone of this repo produces a
      # 34 MB .git and a full clone 48 MB, so full history costs ~14 MB more per
      # run of this job. Against that: a commit message cannot be corrected after
      # a push without the history rewrite the ceiling exists to avoid, so a
      # miss here is permanent.
      #
      # SCOPED TO `gates` DELIBERATELY. The `web` and `snyk` jobs check out the
      # same tree and read no history at all; giving all three fetch-depth: 0 by
      # reflex would triple the cost for no second reader. If a future guard in
      # another job needs history, it adds this there, with its own reason.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The version comes from the matrix above, which carries the reasoning.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      # The cache PATH is per-OS, from the matrix: Poetry's cache lives under
      # ~/.cache on Linux and %LOCALAPPDATA% on Windows, and pointing the Windows
      # leg at the Linux path would have cached nothing while looking like it
      # cached something. The key already varied by runner.os; it now varies by
      # interpreter too, so four legs cannot share one another's wheels.
      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ${{ matrix.poetry-cache }}
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      # --- the CLAUDE.md §6 gates (blocking) --------------------------------
      - name: Unit test suite
        run: poetry run pytest -q

      - name: CLI imports
        run: poetry run python -c "import drydocs.cli"

      - name: CLI help
        run: poetry run drydocs --help

      # --- named guards (blocking; subsets of the suite, surfaced explicitly)
      - name: Publish-boundary guard (classification)
        run: poetry run pytest tests/unit/test_classification.py -q

      - name: Schema / vocabulary guard
        run: poetry run pytest tests/unit/test_schema.py -q

      # CORE3: surfaced as its own step because a SKIP and a PASS are the same
      # non-failure in a log, and telling them apart is the whole point of the
      # fetch-depth above. `-s` lets the guard's verdict line through (it prints
      # the measured count, the total, and the ceiling) and `-rs` prints the
      # reason if it skips anyway — so this step's output always says which of
      # the two happened, rather than leaving it to be inferred from silence.
      - name: Commit-message history ceiling (J74)
        run: poetry run pytest tests/unit/test_publish_boundary_history_ceiling.py -q -s -rs

      # --- BLOCKING as of J10 stage 5 (2026-08-01) --------------------------
      # Both gates are green on a clean tree; a red here is a real regression,
      # not inherited debt. `format --check` must sit alongside `check` — lint
      # alone would let the tree drift out of formatter agreement silently, and
      # formatter agreement is what keeps cross-repo port collisions content-only.
      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .

  # --- console tests (O80) ---------------------------------------------------
  # BLOCKING, the way ruff is. The console had no automated test of any kind
  # until this job existed: twice a defect reached main and was caught by a
  # person rendering the page (the Z5 map's unplaceable synthetic cities, the O36
  # cascade flattening), and both times the close note recorded that as the
  # lesson. A test that does not run in CI would have changed neither case.
  #
  # A SEPARATE JOB rather than steps in `gates`, because it needs a Node
  # toolchain and a browser that the Python gates have no use for; keeping them
  # apart means a red console test names itself in the checks list instead of
  # hiding inside a job called "gates".
  #
  # NO NEO4J, on purpose. The e2e path signs in and reads a module rendered from
  # a COMMITTED GENERATED ARTIFACT, and the API's driver is created lazily, so
  # the whole path runs without a graph — verified locally against an unreachable
  # bolt URI, which is exactly this runner's condition. A graph-backed assertion
  # would make this job a database test wearing a browser.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # create_app() builds the intake store at import, and the data root has NO
    # default on purpose (G81: an unset variable used to relocate every source
    # drop and every output silently, which is how a write lands on somebody's
    # source data). So the API refuses to boot without it, and this job must say
    # where. A runner-temp path is right for a suite that reads none of it and
    # keeps none of it. Neither variable can be caught locally on a dev machine,
    # where both are set in the user environment — this failure was only ever
    # going to appear here.
    env:
      DRYDOCS_DATA_ROOT: ${{ github.workspace }}/.ci-data
      DRYDOCS_LOGDIR: ${{ github.workspace }}/.ci-logs
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The e2e suite starts drydocs-api as one of its two servers, so this job
      # needs the Python side installed too — the browser is only one of the
      # three processes the path crosses.
      #
      # SINGLE VERSION HERE ON PURPOSE, and outside J67's matrix: the subject of
      # this job is the console, and Python is incidental to it — one process it
      # happens to start. Running the browser suite four times to vary an
      # interpreter it never exercises would buy nothing at four times the cost.
      # The interpreter range is proved by `gates`.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      # --with api, unlike the `gates` job: the e2e suite STARTS drydocs-api, and
      # fastapi/uvicorn live in that optional group. The gates job deliberately
      # installs without it (credentials.py's KDF choice turns on exactly that:
      # a check CI never runs is worse than an older one it does), so this is the
      # one job that needs the group and it says why.
      - name: Install Python dependencies
        working-directory: .
        run: poetry install --with api --no-interaction

      # O70: the committed schema the console's TypeScript client is generated
      # from must match the importable app. This job is the one venue with
      # fastapi installed (--with api), so the guard runs here and not in
      # `gates`; tests/unit/test_openapi_client.py makes the same assertion
      # wherever the group is installed locally.
      - name: Generated API schema is current
        working-directory: .
        run: poetry run python scripts/dump_openapi.py --check

      - name: Install web dependencies
        run: npm ci

      # WEB13 (b): `--max-warnings 0` lives in the npm script, so a local run and
      # a CI run gate identically. Ten fast-refresh advisories existed when this
      # landed; five files carry a scoped waiver in .oxlintrc.json and the count
      # is zero, so any NEW warning is a red build.
      - name: Lint (oxlint, --max-warnings 0)
        run: npm run lint

      # O70: the generated client's whole promise is that an API change the
      # console has not caught up with is a COMPILE error. Vitest does not
      # typecheck and the Playwright run serves the app through esbuild, which
      # strips types, so until this step nothing in CI could see one.
      - name: Typecheck and build (tsc -b, vite build)
        run: npm run build

      # WEB7 (b): the initial chunk is what EVERY persona downloads before
      # anything renders, and until this step nothing measured it — so it grew
      # from nobody deciding to (S8). The number and the ratchet rule live in
      # web/scripts/checkBundleSize.mjs, one place, with the date it was
      # measured; raising it requires writing down what arrived and why it
      # belongs in the entry chunk. This BLOCKS, unlike the advisory step below:
      # a bundle that quietly reacquires 1.2 MB of role-gated code has undone
      # the authorization-boundary split, and a warning would not stop it.
      - name: Initial-chunk size ceiling
        run: npm run bundle:check

      # WEB10 (b): one build for every environment (ADR 0020). The bundle names
      # no host and no port - the console calls the PATHS in web/delivery.json on
      # its own origin and a reverse proxy does the rest. Before this, an unset
      # VITE_API_URL pointed every browser at the user's own machine, silently.
      - name: No deployment coordinate in dist
        run: npm run dist:check

      # WEB13 (a): the ratchet. @vitest/coverage-v8 was declared and never read —
      # the instrument was bought and the numbers went unlooked-at. The floor is
      # 9.8% statements, measured 2026-09-05 (9.89 on the tree that set it), and
      # it only goes UP. Growing the number is O43's seed suites; this is the
      # gate, not the tests.
      - name: Unit tests with the coverage floor (vitest)
        run: npm run test:coverage

      # WEB13 (d): WARN-ONLY, deliberately, and the same posture the snapshot
      # ritual takes with its lint check — report, never block. The finding this
      # closes is not the CVEs (five high, one root, none of them reaching
      # dist/): it is that the count was recorded as three at O34, is five now,
      # and nothing noticed because nothing looked.
      - name: Dependency advisories (npm audit, warn-only)
        run: npm run audit:high || echo "::warning::npm audit reported advisories at high or above — see the log"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (playwright)
        run: npm run test:e2e

      # Traces and screenshots are retained on failure only; uploading them makes
      # a red run diagnosable without reproducing it locally, which for a browser
      # failure is most of the work.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # --- Snyk security scanning (added 2026-07-20, user request) ---------------
  # SCA over the Poetry manifest/lockfile (Snyk reads pyproject.toml/poetry.lock
  # natively — no dependency install needed) + an ADVISORY SAST pass (snyk code,
  # the ruff idiom: surface first, gate later).
  #
  # REQUIRES the SNYK_TOKEN repository secret (Settings > Secrets and variables
  # > Actions) — a USER MANUAL STEP; get the token from https://app.snyk.io
  # (Account settings > API token). Until the secret exists every scan step
  # SKIPS cleanly (env-guard below — secrets are not readable in job-level if),
  # so the job never reds-out a checkout without the secret.
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip note (SNYK_TOKEN not set)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN secret not set — Snyk scan skipped (see the workflow comment for setup)."

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan (blocking at high severity)
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk code scan (SAST, advisory)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test
