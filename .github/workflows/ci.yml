# =============================================================================
# CI — the CLAUDE.md §6 gates as an enforced push guard (backlog J5).
#
# Unit-test scope ONLY: no Neo4j, no Oracle, no network-dependent steps — the
# suite's own skip guards handle the gitignored sample data (test_skip_guard_policy
# enforces that they skip, never fail). The classification test is the automated
# half of the publish boundary (PUBLISH-BOUNDARY.md).
#
# ruff is BLOCKING as of J10 (2026-08-01) — both `ruff check .` and `ruff format
# --check .`. It was advisory from J5 while the repo carried ~757 pre-existing
# findings; J10 cleared them (docs/ruff-format-convergence.md). The version pin
# in pyproject is EXACT and load-bearing: formatter output varies across ruff
# releases, so a floating pin would turn an upgrade into a red build here and a
# spurious cross-repo diff company-side.
# =============================================================================
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels the in-flight run for the older commit —
# only the newest sha runs to completion (Actions-minutes decision, 2026-08-21).
# The session ritual is unaffected: snapshot.ps1's CI check matches on HEAD's
# sha, and HEAD's run is the one cancellation never touches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single version by decision (2026-08-21, Actions-minutes cost): 3.12 is
      # what both dev machines run. pyproject's ^3.11 floor is deliberately
      # untested here — tightening it to ^3.12 would churn poetry.lock instead.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install --no-interaction

      # --- the CLAUDE.md §6 gates (blocking) --------------------------------
      - name: Unit test suite
        run: poetry run pytest -q

      - name: CLI imports
        run: poetry run python -c "import drydocs.cli"

      - name: CLI help
        run: poetry run drydocs --help

      # --- named guards (blocking; subsets of the suite, surfaced explicitly)
      - name: Publish-boundary guard (classification)
        run: poetry run pytest tests/unit/test_classification.py -q

      - name: Schema / vocabulary guard
        run: poetry run pytest tests/unit/test_schema.py -q

      # --- BLOCKING as of J10 stage 5 (2026-08-01) --------------------------
      # Both gates are green on a clean tree; a red here is a real regression,
      # not inherited debt. `format --check` must sit alongside `check` — lint
      # alone would let the tree drift out of formatter agreement silently, and
      # formatter agreement is what keeps cross-repo port collisions content-only.
      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .

  # --- console tests (O80) ---------------------------------------------------
  # BLOCKING, the way ruff is. The console had no automated test of any kind
  # until this job existed: twice a defect reached main and was caught by a
  # person rendering the page (the Z5 map's unplaceable synthetic cities, the O36
  # cascade flattening), and both times the close note recorded that as the
  # lesson. A test that does not run in CI would have changed neither case.
  #
  # A SEPARATE JOB rather than steps in `gates`, because it needs a Node
  # toolchain and a browser that the Python gates have no use for; keeping them
  # apart means a red console test names itself in the checks list instead of
  # hiding inside a job called "gates".
  #
  # NO NEO4J, on purpose. The e2e path signs in and reads a module rendered from
  # a COMMITTED GENERATED ARTIFACT, and the API's driver is created lazily, so
  # the whole path runs without a graph — verified locally against an unreachable
  # bolt URI, which is exactly this runner's condition. A graph-backed assertion
  # would make this job a database test wearing a browser.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The e2e suite starts drydocs-api as one of its two servers, so this job
      # needs the Python side installed too — the browser is only one of the
      # three processes the path crosses.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Python dependencies
        working-directory: .
        run: poetry install --no-interaction

      - name: Install web dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (playwright)
        run: npm run test:e2e

      # Traces and screenshots are retained on failure only; uploading them makes
      # a red run diagnosable without reproducing it locally, which for a browser
      # failure is most of the work.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # --- Snyk security scanning (added 2026-07-20, user request) ---------------
  # SCA over the Poetry manifest/lockfile (Snyk reads pyproject.toml/poetry.lock
  # natively — no dependency install needed) + an ADVISORY SAST pass (snyk code,
  # the ruff idiom: surface first, gate later).
  #
  # REQUIRES the SNYK_TOKEN repository secret (Settings > Secrets and variables
  # > Actions) — a USER MANUAL STEP; get the token from https://app.snyk.io
  # (Account settings > API token). Until the secret exists every scan step
  # SKIPS cleanly (env-guard below — secrets are not readable in job-level if),
  # so the job never reds-out a checkout without the secret.
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip note (SNYK_TOKEN not set)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN secret not set — Snyk scan skipped (see the workflow comment for setup)."

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan (blocking at high severity)
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk code scan (SAST, advisory)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test
