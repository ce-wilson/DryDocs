# =============================================================================
# rua_inventory.conf  —  configuration for rua_inventory.sh
#
# Format:
#   KEY=value        settings (one per line)
#   IGNORE=<glob>    one ignore pattern per line; repeat as many as needed.
#                    Globs are matched against the FULL path (shell case-glob:
#                    * matches any run of chars including '/', ? one char).
# Lines starting with # and blank lines are ignored.
# =============================================================================

# --- settings ----------------------------------------------------------------

# Extra directory roots to inventory beyond the user's $HOME (space-separated).
# $HOME is always scanned. Example: SCAN_ROOTS=/opt/app /data/landing
SCAN_ROOTS=

# Directory-walk depth under each root. 0 = unlimited (use with care + ignores).
MAX_DEPTH=4

# Follow symlinks while walking? (yes/no). 'no' avoids loops + escaping the tree.
FOLLOW_SYMLINKS=no

# Copy profile files (.profile etc.) into the bundle? (yes/no)
COPY_PROFILES=yes

# Copy files matched by the -n name globs into the bundle (tree-mirrored under
# scripts/)? (yes/no). The globs themselves are CLI flags (-n), not config.
COPY_SCRIPTS=yes

# Per-file size cap (bytes) for script copies. A larger file is still LISTED
# in scripts.tsv (with its sha256) but NOT copied — one stray fat file can't
# bloat the bundle. Default 1048576 (1 MiB).
SCRIPT_COPY_MAX_BYTES=1048576

# Heavy `find / -xdev -user <user>` sweep to find ALL objects the user owns
# across the local filesystem (slow; off by default). (yes/no)
OWNERSHIP_SWEEP=no

# --- ignore list -------------------------------------------------------------
# System / volatile / noisy paths that are not part of the user's real inventory.

# system pseudo-filesystems
IGNORE=/proc/*
IGNORE=/sys/*
IGNORE=/dev/*
IGNORE=/run/*

# temp
IGNORE=/tmp/*
IGNORE=/var/tmp/*
IGNORE=*/tmp/*
IGNORE=*/temp/*
IGNORE=*/.tmp/*

# logs
IGNORE=/var/log/*
IGNORE=*/logs/*
IGNORE=*/log/*
IGNORE=*.log

# caches / build / package noise
IGNORE=*/.cache/*
IGNORE=*/.local/share/Trash/*
IGNORE=*/__pycache__/*
IGNORE=*/node_modules/*
IGNORE=*/.git/*
IGNORE=*/.svn/*
IGNORE=*/.venv/*
IGNORE=*/venv/*
IGNORE=*/site-packages/*

# mounts you usually don't want to descend
IGNORE=/mnt/*
IGNORE=/media/*
IGNORE=/proc
IGNORE=/sys
