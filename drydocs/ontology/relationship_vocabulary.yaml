# =============================================================================
# relationship_vocabulary.yaml  —  DryDocs relationship registry
#
# SECTION 0 (node_classifications): every node label in the graph mapped to a
#   CURIE that expands via drydocs/ontology/namespaces.py. All local labels
#   live under dd: (https://drydocs.local/ontology#).
#
# SECTION 1 (prov_matrix): the 9-row decision table. Stable — do not edit.
#   Pick the row whose from_type/to_type matches your node classifications.
#   The neo4j_label in that row is what you use in Cypher, unless a more
#   specific existing label is already established (see local_relationships).
#
# SECTION 2 (local_relationships): one entry per declared relationship.
#   Add here BEFORE writing any Cypher. Status lifecycle:
#     planned    → declared but loader not yet written
#     active     → supplement + loader both exist
#     deprecated → no longer loaded; data kept in graph
#     removed    → data and code both deleted
#
# Fields:
#   id            unique snake_case identifier
#   neo4j_label   the Cypher relationship type
#   role          edge property for disambiguation (null = label is sufficient)
#   from_node     source node label
#   to_node       target node label
#   prov_maps_to  PROV-O / W3C term this maps to (null = local-only)
#   note          plain-English description + any gotchas
#   supplement    schema file where LocalRelationship is declared (null = base PROV-O)
#   loader        cypher file that writes this relationship
#   domain        controlm | seal | catalog | architecture | all
#   status        planned | active | deprecated | removed
#
# Sync history: updated 2026-06-09 from DryDocs Consolidated Documentation
# (Sections 1–4, 6). Corrections applied during that audit:
#   * Membership was documented as "prov:Membership" — no such class exists in
#     PROV-O. Corrected to org:Membership (matches seal_ontology_supplement).
#   * BusinessSegment: doc says org:FormalOrganization; the catalog supplement
#     says org:Organization. Both are valid ORG classes; org:FormalOrganization
#     is the more precise term and is adopted here. Update the supplement
#     comment when convenient.
#   * RUNS_ON (JobFolder→ControlMServer) renamed SCHEDULED_ON; the RUNS_ON
#     label is reassigned to execution-host placement (see m3_runs_on_* below).
#   * Section 4 mermaid edges (develops / owns / stored_in / contains /
#     DEPENDS_ON) pre-date the ontology and are normalized to
#     SCREAMING_SNAKE labels with PROV-O mappings where the matrix allows.
# =============================================================================


# ── SECTION 0: Node classifications ──────────────────────────────────────────
# class       = primary OWL/RDFS class (CURIE resolvable via namespaces.py)
# prov_type   = PROV-O behavioural type used to drive the SECTION 1 matrix
#               (Activity | Entity | Collection | Agent | n/a)
# All dd:* classes must be MERGEd as :OntologyTerm:LocalClass in a supplement.
# ─────────────────────────────────────────────────────────────────────────────
node_classifications:

  # — Control-M (M3, active) —
  - label:      ControlMJob
    class:      "dd:ControlMJob"
    prov_type:  Activity
    note:       "Job definition; acts as a prov:Activity at runtime. ontology_supplement.cypher."

  - label:      ControlMFolder
    class:      "dd:ControlMFolder"
    prov_type:  Collection
    note:       "prov:Collection of jobs. ontology_supplement.cypher."

  - label:      ControlMServer
    class:      "dd:ControlMServer"
    prov_type:  n/a
    note: >
      Local platform/infrastructure class — no W3C equivalent. NOT an Agent:
      edges targeting it cannot use prov:wasAssociatedWith (see p2_deployed_to).
      ontology_supplement.cypher.

  - label:      Condition
    class:      "dd:Condition"
    prov_type:  Entity
    note:       "Named scheduling condition (prov:Entity). ontology_supplement.cypher."

  - label:      JobRun
    class:      "dd:JobRun"
    prov_type:  Activity
    note: >
      Loader-run provenance activity (base ontology). Distinct from
      ControlMJobRun (phase-2 runtime execution) — do not merge the labels.

  # — Control-M phase 2 (planned) —
  - label:      ControlMJobRun
    class:      "dd:ControlMJobRun"
    prov_type:  Activity
    note:       "One actual execution of a ControlMJob, from the Control-M history API."

  - label:      Deployment
    class:      "dd:Deployment"
    prov_type:  Activity
    note:       "CI/CD deployment activity that ships folder XML to a server."

  - label:      Developer
    class:      "prov:Person"
    prov_type:  Agent
    note: >
      Human author from Git blame / change records. Likely the same individual
      as an Employee node (SEAL); reconcile by SID when both feeds are loaded.

  - label:      AppUser
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note:       "Service account / FID that jobs run as (EPV, Run-as-User)."

  - label:      Script
    class:      "dd:Script"
    prov_type:  Entity
    note: >
      Invocable artifact (placement JAR + Task-JSON). prov:Entity; also a
      prov:Plan in the wasAssociatedWith(hadPlan) pattern. Finer software
      typing available via swo: if ever required.

  - label:      ETLProcess
    class:      "dd:ETLProcess"
    prov_type:  Activity
    note:       "AWS-side ingestion/transformation workload (Glue / DPL). obi: offers a data-transformation class if a standards mapping is later required."

  - label:      ExecutionHost
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note: >
      Agent host / ETL cluster entry point. Classified as SoftwareAgent
      (not pure infrastructure) so that AppUser -[:DELEGATES_TO]->
      ExecutionHost can legally map to prov:actedOnBehalfOf, which requires
      Agent → Agent. Local subclass dd:ExecutionHost.

  - label:      DataSource
    class:      "dcat:Dataset"
    prov_type:  Entity
    note:       "Read-side dataset (source zone + Glue database)."

  - label:      DataTarget
    class:      "dcat:Dataset"
    prov_type:  Entity
    note:       "Write-side dataset (target zone / bucket / partitions)."

  # — SEAL (active) —
  - label:      Application
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note:       "SEAL-registered application. seal_ontology_supplement.cypher."

  - label:      Employee
    class:      "prov:Agent"
    prov_type:  Agent
    note:       "Person holding a role membership. seal_ontology_supplement.cypher."

  - label:      Membership
    class:      "org:Membership"
    prov_type:  n/a
    note: >
      CORRECTED: consolidated doc listed "prov:Membership", which does not
      exist in PROV-O. The W3C ORG ontology owns this class (org:Membership),
      matching seal_ontology_supplement.cypher. n-ary relation node, not a
      PROV participant.

  - label:      Role
    class:      "org:Role"
    prov_type:  n/a
    note:       "Named role in a membership. seal_ontology_supplement.cypher."

  - label:      Port
    class:      "dprod:Port"
    prov_type:  Entity
    note:       "Data port (EventProcessing / BatchProcessing). dprod namespace is the EKGF working default pending the corporate IRI."

  # — Catalog (active) —
  - label:      CatalogLOB
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Line of business. catalog_ontology_supplement.cypher."

  - label:      BusinessSegment
    class:      "org:FormalOrganization"
    prov_type:  Agent
    note: >
      Corporate segment. Doc says org:FormalOrganization; supplement comment
      says org:Organization. FormalOrganization (legally-recognized org)
      adopted as the more precise valid term.

  - label:      DevTeam
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Development team. catalog_ontology_supplement.cypher."

  - label:      ProductLine
    class:      "dd:ProductLine"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      Product
    class:      "dd:Product"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      JiraBoard
    class:      "dd:JiraBoard"
    prov_type:  Entity
    note:       "Planning tool artifact; local."

  - label:      AreaProduct
    class:      "dd:AreaProduct"
    prov_type:  Entity
    note:       "Area Product Group / Team of Teams. Intermediate between Product and DevTeam in the PAT hierarchy. catalog_ontology_supplement.cypher."

  # — Architecture flow (Section 4, normalized from pre-ontology diagram) —
  - label:      Code
    class:      "dd:Code"
    prov_type:  Collection
    note:       "Codebase/repo content owned by a DevTeam; prov:Collection of PipelineService members."

  - label:      Bitbucket
    class:      "dd:CodeRepository"
    prov_type:  Entity
    note: >
      Repository hosting location. Candidate prov:Location if STORED_IN is
      ever mapped to prov:atLocation; kept local for now.

  - label:      PipelineService
    class:      "dd:PipelineService"
    prov_type:  Entity
    note:       "Deployable pipeline service definition inside a codebase."

  - label:      Batch
    class:      "dd:Batch"
    prov_type:  Collection
    note:       "Logical batch grouping between Application and Control-M folders."

  - label:      File
    class:      "dd:File"
    prov_type:  Entity
    note:       "File delivered via MFTS agent (fmSubPathId); job input dependency."


# ── SECTION 1: Decision matrix ────────────────────────────────────────────────
# Step 1: classify your source node (Activity / Entity / Agent / Collection).
# Step 2: classify your target node.
# Step 3: read the neo4j_label. Add a `role` property if the same label is
#         used in multiple contexts (e.g., USED {role: "reads_config"}).
# ─────────────────────────────────────────────────────────────────────────────
prov_matrix:

  - from_type:   Activity
    to_type:     Activity
    prov_term:   "prov:wasInformedBy"
    neo4j_label: WAS_INFORMED_BY
    note: >
      One activity's execution depended on outputs produced by another.
      Examples: ControlMJob waiting on a predecessor job's OUT condition.

  - from_type:   Activity
    to_type:     Entity
    prov_term:   "prov:used"
    neo4j_label: USED
    note: >
      Activity consumed / read an entity. Use role= to distinguish multiple
      uses on the same activity (e.g., role: reads_config vs role: reads_input).

  - from_type:   Activity
    to_type:     Entity
    prov_term:   "prov:generated"
    neo4j_label: GENERATED
    note: >
      Activity produced an entity. Inverse of wasGeneratedBy — use this form
      when the natural edge direction is Activity→Entity (e.g., job emits
      an OUT condition). role= distinguishes multiple output types.

  - from_type:   Activity
    to_type:     Agent
    prov_term:   "prov:wasAssociatedWith"
    neo4j_label: WAS_ASSOCIATED_WITH
    note: >
      Activity linked to an agent (person, software system, org unit).
      role= on the edge records the agent's participation type.

  - from_type:   Entity
    to_type:     Activity
    prov_term:   "prov:wasGeneratedBy"
    neo4j_label: WAS_GENERATED_BY
    note: >
      Entity was produced by an activity. Standard provenance direction —
      edge flows Entity→Activity. Already used by BaseLoader for all nodes.

  - from_type:   Entity
    to_type:     Entity
    prov_term:   "prov:wasDerivedFrom"
    neo4j_label: WAS_DERIVED_FROM
    note: >
      Entity was transformed or computed from another entity.
      Examples: a derived dataset, a report generated from raw data.

  - from_type:   Entity
    to_type:     Agent
    prov_term:   "prov:wasAttributedTo"
    neo4j_label: WAS_ATTRIBUTED_TO
    note: >
      Entity ownership or authorship attributed to an agent.
      Examples: a script owned by a team, a dataset attributed to an app.

  - from_type:   Agent
    to_type:     Agent
    prov_term:   "prov:actedOnBehalfOf"
    neo4j_label: ACTED_ON_BEHALF_OF
    note: >
      Agent delegation — one agent acting for another.
      Examples: a service account acting on behalf of an application.

  - from_type:   Collection
    to_type:     any
    prov_term:   "prov:hadMember"
    neo4j_label: HAD_MEMBER
    note: >
      Collection contains a member entity or activity.
      Examples: JobFolder (Collection) contains ControlMJob (Activity).


# ── SECTION 2: Local relationships ───────────────────────────────────────────
# Ordered by domain, then by loader execution order within each domain.
# ─────────────────────────────────────────────────────────────────────────────
local_relationships:

  # ── M3: Control-M ────────────────────────────────────────────────────────

  - id:           m3_scheduled_on
    neo4j_label:  SCHEDULED_ON
    role:         ~
    from_node:    JobFolder
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      Physical hosting — folder is scheduled on a specific Control-M server
      (DATA_CENTER value). No PROV-O equivalent; infrastructure placement.
      Edge carries since + last_seen_at for migration auditability.
      RENAMED from RUNS_ON (see m3_runs_on, deprecated) so the RUNS_ON label
      can be reused for execution-host placement with role properties.

    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       controlm
    status:       active

  - id:           m3_runs_on
    neo4j_label:  RUNS_ON
    role:         ~
    from_node:    JobFolder
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      DEPRECATED 2026-06-09: renamed to SCHEDULED_ON (m3_scheduled_on) per the
      consolidated documentation. RUNS_ON is reassigned to ControlMJob/
      ETLProcess → ExecutionHost (m3_runs_on_agent_host / m3_runs_on_etl_host).
      Migrate existing edges with:
      MATCH (f:JobFolder)-[r:RUNS_ON]->(s:ControlMServer)
      then re-create as SCHEDULED_ON and delete r.
    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       controlm
    status:       deprecated

  - id:           m3_contains_job
    neo4j_label:  CONTAINS_JOB
    role:         ~
    from_node:    JobFolder
    to_node:      ControlMJob
    prov_maps_to: "prov:hadMember"
    note: >
      JobFolder (prov:Collection) contains ControlMJob (prov:Activity).
      Matrix row: Collection → any = HAD_MEMBER. CONTAINS_JOB is kept as
      the label for query clarity; semantics are hadMember.
    supplement:   ontology_supplement.cypher
    loader:       controlm_jobs.cypher
    domain:       controlm
    status:       active

  - id:           m3_requires_in_condition
    neo4j_label:  REQUIRES_IN_CONDITION
    role:         ~
    from_node:    ControlMJob
    to_node:      Condition
    prov_maps_to: "prov:used"
    note: >
      Job requires a named IN condition to be present before execution.
      Matrix row: Activity → Entity = USED. REQUIRES_IN_CONDITION kept for
      domain clarity. Edge carries odate, and_or, parentheses, order_
      for boolean-expression reconstruction.
    supplement:   ontology_supplement.cypher
    loader:       controlm_conditions_in.cypher
    domain:       controlm
    status:       active

  - id:           m3_emits_out_condition
    neo4j_label:  EMITS_OUT_CONDITION
    role:         ~
    from_node:    ControlMJob
    to_node:      Condition
    prov_maps_to: "prov:generated"
    note: >
      Job emits a named OUT condition on completion. SIGN='+' posts the
      condition; SIGN='-' removes it. Matrix row: Activity → Entity =
      GENERATED. EMITS_OUT_CONDITION kept for domain clarity.
    supplement:   ontology_supplement.cypher
    loader:       controlm_conditions_out.cypher
    domain:       controlm
    status:       active

  - id:           m3_was_informed_by
    neo4j_label:  WAS_INFORMED_BY
    role:         ~
    from_node:    ControlMJob
    to_node:      ControlMJob
    prov_maps_to: "prov:wasInformedBy"
    note: >
      Derived dependency edge. Successor job was informed by predecessor
      via a shared OUT→IN condition pair. Direction: (successor)→(predecessor).
      Matrix row: Activity → Activity = WAS_INFORMED_BY. Carries via_condition,
      recursion_level, dependency_path, derived=true. Replaces DEPENDS_ON.
    supplement:   ontology_supplement.cypher
    loader:       controlm_dependencies_derived.cypher
    domain:       controlm
    status:       active

  - id:           m3_depends_on_file
    neo4j_label:  USED
    role:         file_dependency
    from_node:    ControlMJob
    to_node:      File
    prov_maps_to: "prov:used"
    note: >
      Job waits on a file delivered via MFTS agent (fmSubPathId). Normalized
      from the pre-ontology "DEPENDS_ON" edge in the architecture diagram:
      DEPENDS_ON is retired (job→job replaced by WAS_INFORMED_BY; job→file
      is matrix row Activity → Entity = USED with role=file_dependency).
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  # ── M3 phase 2: execution lineage ────────────────────────────────────────

  - id:           p2_deployed_by
    neo4j_label:  DEPLOYED_BY
    role:         ~
    from_node:    Deployment
    to_node:      Developer
    prov_maps_to: "prov:wasAssociatedWith"
    note: >
      Deployment activity associated with the developer who ran it.
      Matrix row: Activity → Agent = WAS_ASSOCIATED_WITH. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_deployed_to
    neo4j_label:  DEPLOYED_TO
    role:         ~
    from_node:    Deployment
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      AUDIT CORRECTION: doc mapped this to prov:wasAssociatedWith, but
      wasAssociatedWith requires an Agent target and ControlMServer is a
      local platform class, not an Agent. Mapping set to null (local infra
      placement, same family as SCHEDULED_ON). If a PROV mapping is required,
      reclassify ControlMServer as prov:SoftwareAgent first. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_deploys_folder
    neo4j_label:  DEPLOYS_FOLDER
    role:         ~
    from_node:    Deployment
    to_node:      JobFolder
    prov_maps_to: "prov:used"
    note: >
      Deployment ships a folder definition. Matrix row: Activity → Entity
      (Collection ⊑ Entity) = USED. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_authored_by
    neo4j_label:  AUTHORED_BY
    role:         ~
    from_node:    JobFolder
    to_node:      Developer
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      Folder authorship. Matrix row: Entity → Agent = WAS_ATTRIBUTED_TO.
      Feed: Folder XML / Git blame.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_instance_of
    neo4j_label:  INSTANCE_OF
    role:         ~
    from_node:    ControlMJobRun
    to_node:      ControlMJob
    prov_maps_to: "prov:wasInfluencedBy"
    note: >
      Runtime execution is an instance of the job definition. Mapped to the
      generic prov:wasInfluencedBy (valid but weak); the tighter PROV pattern
      would treat ControlMJob as a prov:Plan via qualified association.
      Feed: Control-M history API.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_executed_by
    neo4j_label:  EXECUTED_BY
    role:         ~
    from_node:    ControlMJobRun
    to_node:      AppUser
    prov_maps_to: "prov:wasAssociatedWith"
    note: >
      Run executed as a service account (Run-as-User; EPV rows with
      Use Case='CONTROL-M'). Matrix row: Activity → Agent.
      Feed: Control-M history API.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_invokes
    neo4j_label:  INVOKES
    role:         ~
    from_node:    ControlMJob
    to_node:      Script
    prov_maps_to: "prov:used"
    note: >
      Job command line invokes a script/JAR (CMDLINE / MEMNAME; Jar Path +
      Task Json Path). Matrix row: Activity → Entity = USED.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_triggers
    neo4j_label:  TRIGGERS
    role:         ~
    from_node:    Script
    to_node:      ETLProcess
    prov_maps_to: "prov:wasStartedBy"
    note: >
      Script launches the AWS-side ingestion workload. DIRECTION NOTE:
      prov:wasStartedBy flows Activity → Entity (ETLProcess wasStartedBy
      Script); the graph edge runs the INVERSE direction for query
      ergonomics. Treat TRIGGERS as inverse-of wasStartedBy.
      Feed: Informatica / Ab Initio / DPL metadata.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_runs_on_agent_host
    neo4j_label:  RUNS_ON
    role:         agent_host
    from_node:    ControlMJob
    to_node:      ExecutionHost
    prov_maps_to: ~
    note: >
      Job executes on a Control-M agent host (Control_M · Host, e.g.
      PROCO-CDS-UTIL#). Infrastructure placement; no PROV mapping.
      Same label as m3_runs_on_etl_host — role property disambiguates.
      Feed: CMDB / Control-M agent map.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_runs_on_etl_host
    neo4j_label:  RUNS_ON
    role:         etl_host
    from_node:    ETLProcess
    to_node:      ExecutionHost
    prov_maps_to: ~
    note: >
      ETL workload runs on an engine/cluster entry point (Connector ·
      Region / Bucket Name). Infrastructure placement; no PROV mapping.
      Feed: CMDB / ETL engine config.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_reads_from
    neo4j_label:  READS_FROM
    role:         ~
    from_node:    ETLProcess
    to_node:      DataSource
    prov_maps_to: "prov:used"
    note: >
      ETL reads a source dataset (Source Zone + Source Glue Database).
      Matrix row: Activity → Entity = USED. Feed: Informatica / Ab Initio.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_writes_to
    neo4j_label:  WRITES_TO
    role:         ~
    from_node:    ETLProcess
    to_node:      DataTarget
    prov_maps_to: "prov:generated"
    note: >
      ETL writes a target dataset (Target Zone + Glue database / bucket /
      partition keys). Matrix row: Activity → Entity = GENERATED.
      Feed: Informatica / Ab Initio.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_delegates_to
    neo4j_label:  DELEGATES_TO
    role:         ~
    from_node:    AppUser
    to_node:      ExecutionHost
    prov_maps_to: "prov:actedOnBehalfOf"
    note: >
      Service account delegated to a host per environment (EPV FID rows with
      Use Case='AWS'/'DPL'/'CCMS' + Environment). prov:actedOnBehalfOf
      requires Agent → Agent — this is why ExecutionHost is classified
      prov:SoftwareAgent in node_classifications. Edge carries environment.
      Feed: CMDB / IAM.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  # ── SEAL ─────────────────────────────────────────────────────────────────

  - id:           seal_has_port
    neo4j_label:  HAS_PORT
    role:         ~
    from_node:    Application
    to_node:      Port
    prov_maps_to: ~
    note: >
      Application exposes a data port (EventProcessing or BatchProcessing).
      Maps to dprod:hasPort pattern. Port kind is stored as a node property.
      No PROV-O equivalent; structural dprod relationship.
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       seal
    status:       active

  - id:           seal_has_membership
    neo4j_label:  HAS_MEMBERSHIP
    role:         ~
    from_node:    Application
    to_node:      Membership
    prov_maps_to: ~
    note: >
      Application has a role-holder membership record. Maps to
      org:hasMembership. Membership nodes carry valid_from/valid_to
      for temporal role tracking.
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       seal
    status:       active

  - id:           seal_of_role
    neo4j_label:  OF_ROLE
    role:         ~
    from_node:    Membership
    to_node:      Role
    prov_maps_to: ~
    note: >
      Membership is for a specific named role. Maps to org:role property
      in the W3C ORG ontology.
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       seal
    status:       active

  - id:           seal_held_by
    neo4j_label:  HELD_BY
    role:         ~
    from_node:    Membership
    to_node:      Employee
    prov_maps_to: ~
    note: >
