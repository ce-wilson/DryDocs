  # ── Architecture flow (Section 4, converted from pre-ontology diagram) ───
  # Original mermaid labels (develops, owns, stored_in, contains, CONTAINS,
  # DEPENDS_ON) pre-date the ontology; normalized here. Folder→Job "CONTAINS"
  # is already covered by m3_contains_job. Job→File "DEPENDS_ON" is covered
  # by m3_depends_on_file above.

  - id:           arch_develops
    neo4j_label:  DEVELOPS
    role:         ~
    from_node:    DevTeam
    to_node:      Application          # the BusinessApplication concept; key = SEALID
    join_key:     SEALID
    prov_maps_to: ~
    note: >
      DevTeam develops a BusinessApplication (graph label :Application), reconciled by SEALID.
      Confirmed via HITL gate (C3/C4, SME 2026-06-21). DevTeam (Agent) → Application
      (SoftwareAgent): no PROV matrix row fits Agent→Agent ownership (actedOnBehalfOf is
      delegation, not development), so local-only. Cross-source edge (catalog↔SEAL ownership
      reconciliation). Inverse alt: Application -[:WAS_ATTRIBUTED_TO {role: developed_by}]-> DevTeam.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       architecture
    status:       active

  - id:           arch_owns_code
    neo4j_label:  WAS_ATTRIBUTED_TO
    role:         owner
    from_node:    Code
    to_node:      DevTeam
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      Was mermaid "DevTeam -- owns --> Code". Direction INVERTED to match
      the matrix: Entity → Agent = WAS_ATTRIBUTED_TO, role=owner.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       architecture
    status:       planned

  - id:           arch_stored_in
    neo4j_label:  STORED_IN
    role:         ~
    from_node:    Code
    to_node:      Bitbucket
    prov_maps_to: ~
    note: >
      Was mermaid "stored_in". Storage location, not provenance — stays
      local. Candidate prov:atLocation if Bitbucket is ever classified as
      prov:Location.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       architecture
    status:       planned

  - id:           arch_contains_service
    neo4j_label:  CONTAINS_SERVICE
    role:         ~
    from_node:    Code
    to_node:      PipelineService
    prov_maps_to: "prov:hadMember"
    note: >
