# Control-M API-call framework — SAMPLE config (G96, mechanism-only).
#
# COPY, don't edit: the filled copy lives OUTSIDE the repo tree at
#   <DRYDOCS_DATA_ROOT>/controlm-api/controlm_api.cfg
# (or wherever DRYDOCS_CONTROLM_API_CFG points). The sample is committed;
# the filled config NEVER is — no real endpoints, hostnames, or credentials
# in any tracked file, on either side of the port boundary.

[environment]
# Automation API endpoint — placeholder shape from the vendor install doc.
endpoint = https://controlm-em.example.internal:8443/automation-api
environment_name = drydocs
# token | user. The credential itself is NEVER here: authentication is
# delegated to `ctm environment add/set` (stored in ~/.ctm/env.json).
auth = token

[paths]
# Blank = data-root defaults (the convention the wrapper .sh relies on):
#   pull_out_dir  -> <DRYDOCS_DATA_ROOT>/remediation/incoming
#   deploy_in_dir -> <DRYDOCS_DATA_ROOT>/remediation/outgoing
# pull_out_dir =
# deploy_in_dir =

[calls]
# Per-operation call templates. Placeholders: {in} {out} {endpoint}
# {environment} plus any -p KEY=VALUE the wrapper passes. Fill each line
# from syntax VERIFIED on your EM (utility help / the DTDs under
# Default/data/Resource) — see API-CALLS.md for what the corpus grounds
# per operation. An operation left blank is a REPORTED capability gap
# (exit code 3), by design.
# folder_export  = exportdeffolder <verified args> {out}
# folder_deploy  = deffolder <verified args> {in}
# job_export     = exportdefjob <verified args> {out}
# job_deploy     = defjob <verified args> {in}
# job_update     = updatedef <verified args> {in}
# variable_set   = ctmvar <verified args>
# calendar_export = exportdefcal <verified args> {out}
# calendar_deploy = defcal <verified args> {in}
# calendar_copy  = copydefcal <verified args>
