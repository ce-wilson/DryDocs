  - id:           catalog_is_represented_as
    neo4j_label:  IS_REPRESENTED_AS
    inverse_label: "represents"
    role:         ~
    from_node:    CatalogElement
    to_node:      CatalogBusinessTerm
    prov_maps_to: ~
    skos_maps_to: "skos:exactMatch (the element's concept IS the term's sense)"
    note: >
      G34 reservation (2026-08-21). A logical data element is represented by exactly one
      business-term SENSE; an acronym with several senses is several CatalogBusinessTerm
      nodes in scoped schemes, never one node with a list. Shape from
      docs/patterns/data-catalog/enterprise-data-catalog-ontology.md. Both ends Entities /
      concepts — no PROV row (local structural link).
    supplement:   ~
    loader:       ~
    domain:       catalog
    status:       planned

