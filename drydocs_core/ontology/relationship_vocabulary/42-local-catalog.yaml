  - id:           catalog_has_application
    neo4j_label:  HAS_APPLICATION
    inverse_label: "application of"
    role:         ~
    from_node:    Product
    to_node:      BusinessApplication
    prov_maps_to: ~
    note: >
      A structural SUPPORT link: the Product is supported by two or more
      applications (front-end/back-end). 1:many BY DESIGN — the source
      extract's application-id column is multi-valued, so a picker over this
      edge returns a LIST, never a single application. K7 gate §G6
      (seal-app-ref-edge-reshape, 2026-08-03) ruled this COMPANY reading over
      the producer's earlier "a Product owns a set of SEAL-registered
      applications" wording, because the company reading is backed by a live
      extract and loader where the producer's was an unbuilt intention;
      surfaces reconciled at K13. The old WAS_ATTRIBUTED_TO matrix hint fell
      with the ownership reading — both ends are Entities post-K4, so there is
      no PROV row (local structural link, like the sibling catalog hierarchy
      edges). C9 gate (2026-07-18): the pat_product_mapping write REMOVED —
      the team row's seal_ids are TEAM-scoped (they now feed arch_develops)
      and attributing them to the Product conflated two PAT screens. Stays
      planned until a product-scoped extract (PAT "Mapped Applications"
      product tab) is onboarded — the C9 condition, unchanged by §G6; pre-C9
      edges cleaned by migrate_pat_alignment_c9.cypher. Resolves the
      SnapshotWriter references at writer.py:45,67.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       catalog
    status:       planned

  - id:           catalog_has_area_product
    neo4j_label:  HAS_AREA_PRODUCT
    inverse_label: "area product of"
    role:         ~
    from_node:    Product
    to_node:      AreaProduct
    prov_maps_to: ~
    note: >
      Product contains Area Product Groups (Team of Teams). Local catalog hierarchy.
      ACTIVATED at G91 (2026-08-18) — and it had met the bar for some time. This
      file's own lifecycle says active = "supplement + loader both exist": the
      supplement declares it (catalog_ontology_supplement.cypher, the
      #hasAreaProduct LocalRelationship) and area_products.cypher MERGEs it with
      the C22 orphan sweep. It was carried as planned on a DATA gap, which is a
      different axis — the lob-product-team SAMPLE has area_products: 0, while the
      production PAT extract carries the layer (SME, 2026-08-17; counts are Internal
      and stay in the internal twin). K5 §B had already ruled that split: "loader
      entries stay planned; independent lifecycles".
      TWO SIGNED RULINGS STAND BEHIND THE SHAPE: C2+C3 (2026-06-21) resolved
      SUPPORTS range = AreaProduct with Product reached via Product ▸ AreaProduct ▸
      DevTeam, and K5 §B (2026-07-20) made :AreaProduct a first-class attribution
      scope (area_product_owner and tech_partner attach ONLY to it).
    supplement:   catalog_ontology_supplement.cypher
    loader:       area_products.cypher
    domain:       catalog
    status:       active

  - id:           catalog_area_product_has_dev_team
    neo4j_label:  HAS_DEV_TEAM
    inverse_label: "dev team of"
    role:         ~
    from_node:    AreaProduct
    to_node:      DevTeam
    prov_maps_to: ~
    note:         "Area Product Group contains DevTeams. Same label as Product→DevTeam; from_node type distinguishes context in queries."
    supplement:   catalog_ontology_supplement.cypher
    loader:       area_products.cypher
    domain:       catalog
    status:       deprecated
    deprecated_at: 2026-08-18
    deprecation_note: >
      RETIRED at G91 (2026-08-18, §C1d) as REDUNDANT, not as a rejection of
      :AreaProduct — its sibling catalog_has_area_product went ACTIVE in the same
      ruling. The DevTeam↔AreaProduct link is already carried by
      catalog_supports_area_product (DevTeam -[:SUPPORTS]-> AreaProduct, ACTIVE since
      C4 2026-06-21, loader pat_product_mapping.cypher). This entry declared the same
      pair in the opposite direction under a second label, so building it would have
      given one relationship two edges.
      NEVER BUILT, so nothing is deleted and no data moves — the entry and this note
      stay as the audit trail (the never-built deprecate case, gloss amended at
      rua-load-shapes §J). Its named loader area_products.cypher does NOT write it:
      the only HAS_DEV_TEAM writer producer-side is dev_teams.cypher, parented on
      :Product. That file's header claimed otherwise and was corrected in the same
      commit as this ruling.
      IF THE SECOND HOP IS EVER WANTED as a containment fact distinct from support,
      it returns as a NEW proposal through docs/RELATIONSHIP_GUIDE.md, not by
      un-deprecating this row.

  # — Product Cabinet (K5 gate signed off 2026-07-20; ACTIVE via the K6 supplement;
  #   catalog-domain siblings of the seal_qualified_attribution / seal_attribution_had_role
  #   entries where the triples differ (the HAS_DEV_TEAM dual-registration precedent). The
  #   Attribution -[:HAS_AGENT]-> Employee hop is NOT twinned: its triple would duplicate
  #   seal_attribution_has_agent exactly (the C8 schema meta-graph refuses ambiguous
  #   duplicate (from, label, to) triples), so the Cabinet REUSES that entry as shared
  #   qualified-attribution infrastructure — rescoped family-agnostic at the K5 sign-off) —
  - id:           catalog_cabinet_qualified_attribution
    neo4j_label:  QUALIFIED_ATTRIBUTION
    inverse_label: "attribution of"
    role:         ~
    from_node:    "Product | AreaProduct"
    to_node:      Attribution
    prov_maps_to: "prov:qualifiedAttribution"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day).
      Product Cabinet twin of seal_qualified_attribution — same reified PROV pattern, PAT
      scope; Attribution reused as the n-ary node; one per (scope-node, ProductRole) pair;
      area_product_owner AND tech_partner attributions attach only to :AreaProduct (SME
      2026-07-20). The downstream Attribution -[:HAS_AGENT]-> Employee hop REUSES
      seal_attribution_has_agent (see the section comment — duplicate triple, family-agnostic
      infrastructure). Coexists with the collapsed catalog_cabinet_attributed_to simple form
      (gate section C, SME-decided 2026-07-20: both forms load). NO loader yet — blocked
      company-side until a person-level PAT cabinet extract exists.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       catalog
    status:       active

  - id:           catalog_cabinet_attribution_had_role
    neo4j_label:  HAD_ROLE
    inverse_label: "role in"
    role:         ~
    from_node:    Attribution
    to_node:      ProductRole
    prov_maps_to: "prov:hadRole"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day).
      Names which of the product_roles concepts the Attribution grants — EXACTLY the fixed 7,
      NO cto concept (SME 2026-07-20: the two role families are independent; the shared-cto
      mechanics question from the 2026-07-10 §B record is resolved by dropping the sharing
      for now).
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       catalog
    status:       active

  - id:           catalog_cabinet_attributed_to
    neo4j_label:  WAS_ATTRIBUTED_TO
    inverse_label: "attributed with"
    role:         product_cabinet_role_holder
    from_node:    "Product | AreaProduct"
    to_node:      Employee
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day —
      section C decision: "product attributed to employee should be fine"). Simple/collapsed
      form of the Product Cabinet attribution (matrix row Entity -> Agent = wasAttributedTo)
      — catalog-domain twin of seal_app_attributed_to_employee (triples differ: from-node
      Product|AreaProduct vs BusinessApplication — the HAS_DEV_TEAM dual-registration
      precedent). Loads ALONGSIDE the reified catalog_cabinet_qualified_attribution chain,
      a deliberate deviation from the K4 TOM resolution (qualified-only); multi-person roles
      still load the reified form as the carrier. role=product_cabinet_role_holder
      distinguishes this instance on the shared WAS_ATTRIBUTED_TO label (the
      tom_role_holder idiom); the edge names its ProductRole concept as a property. Same
      scope rules as the reified form: area_product_owner and tech_partner rows attach only
      to :AreaProduct. NO loader yet — blocked company-side (person-level cabinet extract).
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       catalog
    status:       active

  - id:           catalog_supports
    neo4j_label:  SUPPORTS
    inverse_label: "supported by"
    role:         ~
    from_node:    DevTeam
    to_node:      Product
    prov_maps_to: ~
    note: >
      NARROWED at the C9 gate (2026-07-18, "PAT reconcile"): written ONLY when the
      team row carries no area_product_id — the sole-assertion fallback of the C5
      same-row rule. When an area-product alignment exists, Product derives via
      Product▸HAS_AREA_PRODUCT▸AreaProduct◂SUPPORTS◂DevTeam and the direct edge is
      a banned join-restatement (m1-verify guard). The sponsored variant
      (sponsored: true, a DIFFERENT product than the alignment chain) is an
      independent fact and always allowed. History: DEPRECATED 2026-06-21 (C4,
      "not modeled") when the unconditional write was superseded by
      catalog_supports_area_product; re-activated fallback-only at C9 after SME
      evidence that PAT asserts Supporting Product in its own column and some
      teams carry no area product. One-time cleanup of pre-C9 edges:
      migrate_pat_alignment_c9.cypher.
    supplement:   catalog_ontology_supplement.cypher
    loader:       pat_product_mapping.cypher
    domain:       catalog
    status:       active

  - id:           catalog_supports_area_product
    neo4j_label:  SUPPORTS
    inverse_label: "supported by"
    role:         ~
    from_node:    DevTeam
    to_node:      AreaProduct
    prov_maps_to: ~
    note: >
      DevTeam is aligned to / supports an AreaProduct (Team-of-Teams). Confirmed via HITL gate
      (C3, SME 2026-06-21) as THE SUPPORTS edge — range is AreaProduct; the DevTeam→Product form
      survives only as the C9 sole-assertion fallback (catalog_supports). Edge carries team_type
      (aligned|flex|dedicated) + sponsored (bool); 'aligned to' = team_type=aligned. C9
      (2026-07-18): sponsored area-product variant added (PAT Sponsoring Area Product column);
      alignment is VOLATILE — each load sweeps the team's stale pat-sourced SUPPORTS edges
      (tracked, never frozen). Agent→Entity has no PROV-O matrix row; local-only.
    supplement:   catalog_ontology_supplement.cypher
    loader:       pat_product_mapping.cypher
    domain:       catalog
    status:       active

  - id:           catalog_dev_team_has_membership
    neo4j_label:  HAS_MEMBERSHIP
    inverse_label: "membership of"
    role:         ~
    from_node:    DevTeam
    to_node:      Membership
    prov_maps_to: ~
    note: >
      DevTeam has a timed role-holder membership. Reuses the org:Membership
      n-ary pattern from SEAL (Application→Membership). PAT-side human roles:
      Tech Partner, Area Tech Partner, Software Engineering Manager,
      Software Engineer, SRE Director, etc.
    supplement:   catalog_ontology_supplement.cypher
    loader:       pat_team_roles.cypher
    domain:       catalog
    status:       deprecated
    deprecated_at: 2026-08-18
    deprecation_note: >
      RE-SHAPED at G91 (2026-08-18, §C1d): the DevTeam leg JOINS THE QUALIFIED-ATTRIBUTION
      PATTERN. It was the last holdout on the reified W3C ORG Membership shape — SEAL moved
      at K4 (2026-07-10 §B/§C) and the PAT product / area-product side at K5 (2026-07-20), so
      one employee reached the graph by two different routes: HAS_AGENT off an :Attribution
      for two families, HELD_BY off a :Membership for this one.
      THIS SUPERSEDES TWO EARLIER CARVE-OUTS, named so the change does not read as an
      oversight. K4's own deprecation note spared this entry — "org: stays for the PAT
      product hierarchy only (e.g. catalog_dev_team_has_membership — SAME labels, different
      vocab id, NOT deprecated)" — and C20 (2026-07-28, constraints.cypher) scoped the K4
      retirement to the SEAL attribution loaders, keeping :Role / :Membership load-bearing
      for the catalog paths. The SME ruled otherwise on 2026-08-18.
      WHY IT COULD NOT SIMPLY ACTIVATE: pat_team_roles.cypher writes a THREE-edge triple
      (HAS_MEMBERSHIP, OF_ROLE, HELD_BY) and only this leg was ever registered — OF_ROLE and
      HELD_BY exist solely as seal_of_role / seal_held_by, both DEPRECATED. That is NOT a
      registration gap: the C8 rule (K5 header block above) says identical triples are
      REUSED, never twinned, and both are identical to the SEAL ones. The defect was that
      the entries to be reused say "no longer loaded" while a loader would write them fresh
      on every run — and the estate is TRUNCATE-AND-RELOAD, so there is no legacy-data
      reading under which that is benign. Anything that should not be loaded does not stay.
      REPLACED BY catalog_dev_team_qualified_attribution + catalog_dev_team_attribution_had_role
      below, both planned. Per G91's acceptance a re-shape enters as a NEW proposal through
      docs/RELATIONSHIP_GUIDE.md, never as an edit of the held entry. Never built, so
      nothing is deleted.

  # — DevTeam staffing, re-shaped onto qualified attribution (G91, 2026-08-18) —
  #   The HAS_AGENT hop is NOT twinned: Attribution -[HAS_AGENT]-> Employee is IDENTICAL to
  #   seal_attribution_has_agent, and the C8 meta-graph refuses ambiguous duplicate
  #   (from, label, to) triples, so this family REUSES that entry as shared
  #   qualified-attribution infrastructure — the same move K5 made for the Product Cabinet.
  #   Only the two triples that DIFFER are registered here.
  - id:           catalog_dev_team_qualified_attribution
    neo4j_label:  QUALIFIED_ATTRIBUTION
    inverse_label: "attribution of"
    role:         ~
    from_node:    DevTeam
    to_node:      Attribution
    prov_maps_to: "prov:qualifiedAttribution"
    note: >
      A DevTeam's staffing as a qualified attribution — the reified hop carrying WHO and
      IN WHICH ROLE, replacing DevTeam -[:HAS_MEMBERSHIP]-> :Membership. Raised at G91
      (2026-08-18) as the re-shape of catalog_dev_team_has_membership; see that entry's
      deprecation_note for the ruling and the two carve-outs it supersedes.
      Triple differs from both existing QUALIFIED_ATTRIBUTION entries
      (BusinessApplication → Attribution seal-side, Product | AreaProduct → Attribution
      cabinet-side), so it registers rather than reuses.
      ACTIVE at G99 (2026-08-18): pat_team_roles.cypher was rewritten onto this shape in
      the same change, so supplement and loader both exist — the bar this file's lifecycle
      sets for active.
    supplement:   catalog_ontology_supplement.cypher
    domain:       catalog
    loader:       pat_team_roles.cypher
    status:       active

  - id:           catalog_dev_team_attribution_had_role
    neo4j_label:  HAD_ROLE
    inverse_label: "role in"
    role:         ~
    from_node:    Attribution
    to_node:      Role
    prov_maps_to: ~
    note: >
      The role leg of a DevTeam staffing attribution. Targets :Role — the org:Role class
      whose canonical rows catalog_ontology_supplement.cypher already seeds and whose keys
      constraints.cypher already carries — rather than minting a third role vocabulary
      beside TOMRole (SEAL) and ProductRole (Product Cabinet). PAT-side team roles are
      ENGINEERING roles (Tech Partner, Area Tech Partner, Software Engineering Manager,
      Software Engineer, SRE Director and siblings), a different register from either.
      Triple differs from both existing HAD_ROLE entries (Attribution → TOMRole,
      Attribution → ProductRole), so it registers rather than reuses — and it gives :Role a
      live purpose again, which the C20 scoped retention had been holding open for the
      Membership shape this ruling retires.
      prov_maps_to is null deliberately: prov:hadRole belongs to the qualified pattern as a
      whole and the sibling entries' supplement already declares it; a second mapping here
      would duplicate it.
      ACTIVE at G99 (2026-08-18) alongside its sibling — the rewritten loader resolves the
      role against the canonical :Role rows the catalog supplement seeds.
    supplement:   catalog_ontology_supplement.cypher
    domain:       catalog
    loader:       pat_team_roles.cypher
    status:       active
