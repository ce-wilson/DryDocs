    from_node:    AppUser
    to_node:      BusinessApplication
    prov_maps_to: ~
    note: >
      The directory's application (SEAL) assignment for a functional id — an
      OWNERSHIP-RECORD fact, as of the extract (gate fid-identity-and-scope
      §C1-§C3, SIGNED 2026-08-19). ASSERTS REGISTRATION, NEVER CONSUMPTION
      (§G1): edge property assignment_kind: 'registration' rides on the data,
      plus as_of (the EXTRACT date, never load date) and origin: 'declared'
      (§B1). Same label as m3_belongs_to_application (ControlMFolder -> Port)
      but a different triple — the C8 identical-triple rule; role
      disambiguates. Target is :BusinessApplication, NOT the BatchProcessing
      Port: ownership record, not batch wiring (§C2). N:1, graph-test only —
      never a schema constraint (§C3, the TOM-roles lesson). NO TRANSITIVE
      READ onto jobs (§G2): the registration and the folder attribution meet
      ON THE JOB and nowhere else. Agent -> Entity, the family with no PROV
      row (reg_uses_software's recorded reasoning). Feeds TierReconcilers.fid
      from the SAME crosswalk (§C4) under the amended K2 scope (fill gaps
      only, never override a confirmed mapping — the G3 amendment).
      NOTHING LOADS: planned until the build item lands (N13
      flips-are-follow-ups).
    supplement:   ~
    loader:       ~
    domain:       business_application
    status:       deprecated
    deprecated_at: 2026-08-21
    superseded_by: business_application_appuser_belongs_to_application
