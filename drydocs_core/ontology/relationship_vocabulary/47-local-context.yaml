
  # ── Context graph (SOSA/SSN — EXPERIMENTAL / early adoption) ───────────────
  # NOT a declared company standard. Declared so the ontology-mapper can carry
  # the `jobrun-observation` map entry through the HITL gate. SOSA edges sit
  # OUTSIDE the PROV matrix (prov_maps_to: ~) and map to a sosa:* term instead.
  # Loaders are intentionally null — no instance data until the gated pilot (E2).

  - id:           sosa_observes
    neo4j_label:  OBSERVES
    inverse_label: "observed by"
    role:         ~
    from_node:    Observation
    to_node:      ControlMJob          # or ControlMFolder — both can act as sosa:FeatureOfInterest
    prov_maps_to: ~
    sosa_maps_to: "sosa:hasFeatureOfInterest"
    note: >
      EXPERIMENTAL. Observation is about a feature of interest (the job/folder).
      Open gate decision: is ControlMJobRun itself the Observation, or a separate
      Observation node? See config/taxonomy-ontology-map.yaml `jobrun-observation`.
    supplement:   sosa_experimental_supplement.cypher
    loader:       ~
    domain:       context
    status:       deprecated
    deprecated_at: 2026-08-21
    superseded_by: context_observes
    deprecation_note: >
      ID MIGRATION ONLY — THE CONCEPT IS UNCHANGED. Gate vocabulary-domains-and-id-policy
      §B3 (SIGNED 2026-08-12) ruled the epoch-tag ids FORCE-migrated onto the
      domain-derived scheme; G87 applies it (2026-08-21). Add-new + deprecate-old, never
      a rename in place: the id is the join key across the taxonomy-ontology-map, the
      generated schema_graph.cypher, the SQLite mirror and the append-only gate log.
      Live entry is `context_observes` below — same shape, same planned status.

  - id:           context_observes
    neo4j_label:  OBSERVES
    inverse_label: "observed by"
    role:         ~
    from_node:    Observation
    to_node:      ControlMJob          # or ControlMFolder — both can act as sosa:FeatureOfInterest
    prov_maps_to: ~
    sosa_maps_to: "sosa:hasFeatureOfInterest"
    note: >
      EXPERIMENTAL. Observation is about a feature of interest (the job/folder).
      Open gate decision: is ControlMJobRun itself the Observation, or a separate
      Observation node? See config/taxonomy-ontology-map.yaml `jobrun-observation`.
      REPLACES sosa_observes at G87 (2026-08-21) — forced id migration under gate
      vocabulary-domains-and-id-policy §B1/§B3 (SIGNED 2026-08-12): the prefix is
      now the entry's own `domain:` field. Same label, direction, planned status
      and semantics; history before 2026-08-21 is filed under the old id.
    supplement:   sosa_experimental_supplement.cypher
    loader:       ~
    domain:       context
    status:       planned

