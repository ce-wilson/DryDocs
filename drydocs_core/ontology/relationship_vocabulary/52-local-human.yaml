  # ── Human (people / org) — the ORG-membership and PROV qualified-attribution family ──
  #
  # Domain `human` was registered at gate vocabulary-domains-and-id-policy §A3
  # (SIGNED 2026-08-12) with NO entries moved; G88 (2026-08-21) does the move.
  # THE RULE that decides what lives here, so the next entry does not guess: an
  # entry whose from_node or to_node is one of Employee | Membership | Role |
  # TOMRole | ProductRole | Attribution — the W3C ORG membership machinery and
  # the PROV qualified-attribution pattern (prov:qualifiedAttribution /
  # prov:agent / prov:hadRole). Edges that merely name an ORG UNIT as a catalog
  # node (Product -> DevTeam, DevTeam -> Product SUPPORTS, DevTeam -> JiraBoard)
  # are the product-catalog hierarchy and stay in `catalog`; the :Employee
  # node spine itself is G74's.
  #
  # PARTITION MOVE ONLY: ids, labels, directions, statuses, notes, loaders and
  # supplements are exactly as they were in 41-local-business-application.yaml
  # and 42-local-catalog.yaml — only `domain:` changed. Deprecated rows moved
  # with their family, as §A1/§A2 did for scheduler/business_application, so
  # the partition is whole. The ids still carry their old seal_/catalog_
  # spellings: their migration is G101 (seal_* -> human_* for the attribution
  # trio; seal_app_attributed_to_employee waits on the seal-tom-attribution-
  # reshape gate per the id-policy gate's §C1c carve-out).
  # Shared-infrastructure note kept from 42: the Attribution -[HAS_AGENT]->
  # Employee hop (seal_attribution_has_agent) is REUSED by the Product Cabinet
  # (K5) and the DevTeam staffing family (G91) — the C8 meta-graph refuses
  # duplicate (from, label, to) triples, so it is registered once, here.

  - id:           seal_has_membership
    neo4j_label:  HAS_MEMBERSHIP
    inverse_label: "membership of"
    role:         ~
    from_node:    BusinessApplication
    to_node:      Membership
    prov_maps_to: ~
    note: >
      Application has a role-holder membership record. Maps to
      org:hasMembership. Membership nodes carry valid_from/valid_to
      for temporal role tracking.
    deprecation_note: >
      DEPRECATED at K4 (2026-07-15; gate 2026-07-10 §C) in favor of the SEAL TOM
      qualified-attribution pattern (seal_qualified_attribution / seal_attribution_has_agent /
      seal_attribution_had_role, now active). org:Membership/org:Role is the wrong pattern
      for SEAL's Technical Operating Model role-holders (a governance model DISTINCT from
      real organizations); org: stays for the PAT product hierarchy only (e.g.
      catalog_dev_team_has_membership — SAME labels, different vocab id, NOT deprecated).
      Existing graph data kept per RELATIONSHIP_GUIDE; loader replacement lands with the
      K4 clause-6 map flips.
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       human
    status:       deprecated
    deprecated_at: 2026-07-15

  - id:           seal_of_role
    neo4j_label:  OF_ROLE
    inverse_label: "role of"
    role:         ~
    from_node:    Membership
    to_node:      Role
    prov_maps_to: ~
    note: >
      Membership is for a specific named role. Maps to org:role property
      in the W3C ORG ontology.
    deprecation_note: >
      DEPRECATED at K4 (2026-07-15; gate 2026-07-10 §C) alongside seal_has_membership /
      seal_held_by — same TOM-vs-PAT reasoning (see seal_has_membership's deprecation_note).
      Replacement: Attribution -[:HAD_ROLE]-> TOMRole (seal_attribution_had_role, active).
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       human
    status:       deprecated
    deprecated_at: 2026-07-15

  - id:           seal_held_by
    neo4j_label:  HELD_BY
    inverse_label: "holds"
    role:         ~
    from_node:    Membership
    to_node:      Employee
    prov_maps_to: ~
    note: >
      Membership is held by an employee. Inverse of org:member /
      org:hasMember. Direction chosen so the membership record is the
      natural starting point for role queries.
    deprecation_note: >
      DEPRECATED at K4 (2026-07-15; gate 2026-07-10 §C) alongside seal_has_membership /
      seal_of_role — same TOM-vs-PAT reasoning (see seal_has_membership's deprecation_note).
      Replacement: Attribution -[:HAS_AGENT]-> Employee (seal_attribution_has_agent, active),
      reached via BusinessApplication -[:QUALIFIED_ATTRIBUTION]-> Attribution.
    supplement:   seal_ontology_supplement.cypher
    loader:       seal_applications.cypher
    domain:       human
    status:       deprecated
    deprecated_at: 2026-07-15

  - id:           seal_app_attributed_to_employee
    neo4j_label:  WAS_ATTRIBUTED_TO
    inverse_label: "attributed with"
    role:         tom_role_holder
    from_node:    BusinessApplication
    to_node:      Employee
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      PROPOSED. Simple/collapsed form of the TOM attribution pattern (matrix row Entity ->
      Agent = wasAttributedTo). Coexists with the qualified/reified form below
      (seal_qualified_attribution / seal_attribution_has_agent / seal_attribution_had_role),
      which carries the specific TOM role. role=tom_role_holder distinguishes this instance
      from arch_owns_code (role=owner) and reg_made_by on the same WAS_ATTRIBUTED_TO label.
      Depends on the proposed :BusinessApplication reclass (SoftwareAgent -> Entity) — does NOT
      type-check under the CURRENT active classification.
    supplement:   ~
    loader:       ~
    domain:       human
    status:       planned

  - id:           seal_qualified_attribution
    neo4j_label:  QUALIFIED_ATTRIBUTION
    inverse_label: "attribution of"
    role:         ~
    from_node:    BusinessApplication
    to_node:      Attribution
    prov_maps_to: "prov:qualifiedAttribution"
    note: >
      ACTIVE (K4, 2026-07-15; gate 2026-07-10 §B). Reified/n-ary form of the TOM attribution
      pattern (Attribution is a PROV Influence node, not itself Activity / Entity / Agent /
      Collection, so no matrix row applies directly). Entry point to Attribution
      -[:HAS_AGENT]-> Employee and Attribution -[:HAD_ROLE]-> TOMRole below. Type-checks
      under the K4 :BusinessApplication reclass (prov:Entity). Multi-person roles load THIS
      form; the simple collapsed edge (seal_app_attributed_to_employee) stays optional/derivable.
    supplement:   seal_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           seal_attribution_has_agent
    neo4j_label:  HAS_AGENT
    inverse_label: "agent of"
    role:         ~
    from_node:    Attribution
    to_node:      Employee
    prov_maps_to: "prov:agent"
    note: >
      ACTIVE (K4, 2026-07-15; gate 2026-07-10 §B). prov:agent inside the qualified-attribution
      reification — names which Employee the Attribution is about. No independent matrix row
      (Attribution is prov_type n/a, same family as seal_held_by's org:member inverse).
      RESCOPED at the K5 sign-off (2026-07-20): serves BOTH attribution families as
      family-agnostic infrastructure — the SEAL TOM chain (seal_qualified_attribution) and
      the Product Cabinet chain (catalog_cabinet_qualified_attribution, planned) — because
      the (Attribution, HAS_AGENT, Employee) triple is registered exactly once (the C8
      schema meta-graph refuses ambiguous duplicate triples).
    supplement:   seal_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           seal_attribution_had_role
    neo4j_label:  HAD_ROLE
    inverse_label: "role in"
    role:         ~
    from_node:    Attribution
    to_node:      TOMRole
    prov_maps_to: "prov:hadRole"
    note: >
      ACTIVE (K4, 2026-07-15; gate 2026-07-10 §B REVISED role set). prov:hadRole inside the
      qualified-attribution reification — names which TOM role the Attribution grants. The
      fixed 7-concept scheme (tom_roles): application_owner | primary_information_owner |
      backup_information_owner | cto | technology_risk_controls |
      design_authority | operate_manager (L1/L2 = a level property on the Attribution, per
      the gate's "one or both" wording). Subsumes the old flat 6: data_owner -> Information
      Owner, risk_compliance_officer -> Technology Risk & Controls; Design Authority is new.
      cto NOT shared with K5 ProductRole (K5 gate 2026-07-20: families independent).
      TOMRole is a skos:Concept, DISTINCT from :Role (org:Role, PAT hierarchy only).
    supplement:   seal_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           seal_appuser_owned_by
    neo4j_label:  OWNED_BY
    inverse_label: "owner of record for"
    role:         fid_owner
    from_node:    AppUser
    to_node:      Employee
    prov_maps_to: ~
    note: >
      The functional id's human OWNER-OF-RECORD — the manager the directory
      names against the account, who RECERTIFIES ANNUALLY (gate
      fid-identity-and-scope Q7, RULED 2026-08-19: owner-of-record, not mere
      attestor). Accountability, NOT a contact point — explicitly not swept
      into the email-dl-contact-point deferral. Ownership arrives natively
      as-of (recertification cadence), so the edge carries as_of like its
      §C1 sibling. THE TWO-HUMAN-OWNERS RULE FINALLY ATTACHES HERE: the SME
      input (every FID carries at least two human owners) becomes a GRAPH
      TEST against this edge — minimum cardinality is never a constraint
      (the TOM-roles lesson); the census keeps accounts_below_owner_minimum
      separate from accounts_with_no_owner_recorded so an unmeasurable
      estate never reads as compliant. Agent -> Agent, but ownership is not
      delegation of action, so no prov:actedOnBehalfOf — null-PROV on the
      recorded local-meaning precedent. NOTHING LOADS: planned until the
      build item lands.
    supplement:   ~
    loader:       ~
    domain:       human
    status:       planned

  # — Product Cabinet (K5 gate signed off 2026-07-20; ACTIVE via the K6 supplement;
  #   catalog-domain siblings of the seal_qualified_attribution / seal_attribution_had_role
  #   entries where the triples differ (the HAS_DEV_TEAM dual-registration precedent). The
  #   Attribution -[:HAS_AGENT]-> Employee hop is NOT twinned: its triple would duplicate
  #   seal_attribution_has_agent exactly (the C8 schema meta-graph refuses ambiguous
  #   duplicate (from, label, to) triples), so the Cabinet REUSES that entry as shared
  #   qualified-attribution infrastructure — rescoped family-agnostic at the K5 sign-off) —
  - id:           catalog_cabinet_qualified_attribution
    neo4j_label:  QUALIFIED_ATTRIBUTION
    inverse_label: "attribution of"
    role:         ~
    from_node:    "Product | AreaProduct"
    to_node:      Attribution
    prov_maps_to: "prov:qualifiedAttribution"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day).
      Product Cabinet twin of seal_qualified_attribution — same reified PROV pattern, PAT
      scope; Attribution reused as the n-ary node; one per (scope-node, ProductRole) pair;
      area_product_owner AND tech_partner attributions attach only to :AreaProduct (SME
      2026-07-20). The downstream Attribution -[:HAS_AGENT]-> Employee hop REUSES
      seal_attribution_has_agent (see the section comment — duplicate triple, family-agnostic
      infrastructure). Coexists with the collapsed catalog_cabinet_attributed_to simple form
      (gate section C, SME-decided 2026-07-20: both forms load). NO loader yet — blocked
      company-side until a person-level PAT cabinet extract exists.
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           catalog_cabinet_attribution_had_role
    neo4j_label:  HAD_ROLE
    inverse_label: "role in"
    role:         ~
    from_node:    Attribution
    to_node:      ProductRole
    prov_maps_to: "prov:hadRole"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day).
      Names which of the product_roles concepts the Attribution grants — EXACTLY the fixed 7,
      NO cto concept (SME 2026-07-20: the two role families are independent; the shared-cto
      mechanics question from the 2026-07-10 §B record is resolved by dropping the sharing
      for now).
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           catalog_cabinet_attributed_to
    neo4j_label:  WAS_ATTRIBUTED_TO
    inverse_label: "attributed with"
    role:         product_cabinet_role_holder
    from_node:    "Product | AreaProduct"
    to_node:      Employee
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day —
      section C decision: "product attributed to employee should be fine"). Simple/collapsed
      form of the Product Cabinet attribution (matrix row Entity -> Agent = wasAttributedTo)
      — catalog-domain twin of seal_app_attributed_to_employee (triples differ: from-node
      Product|AreaProduct vs BusinessApplication — the HAS_DEV_TEAM dual-registration
      precedent). Loads ALONGSIDE the reified catalog_cabinet_qualified_attribution chain,
      a deliberate deviation from the K4 TOM resolution (qualified-only); multi-person roles
      still load the reified form as the carrier. role=product_cabinet_role_holder
      distinguishes this instance on the shared WAS_ATTRIBUTED_TO label (the
      tom_role_holder idiom); the edge names its ProductRole concept as a property. Same
      scope rules as the reified form: area_product_owner and tech_partner rows attach only
      to :AreaProduct. NO loader yet — blocked company-side (person-level cabinet extract).
    supplement:   catalog_ontology_supplement.cypher
    loader:       ~
    domain:       human
    status:       active

  - id:           catalog_dev_team_has_membership
    neo4j_label:  HAS_MEMBERSHIP
    inverse_label: "membership of"
    role:         ~
    from_node:    DevTeam
    to_node:      Membership
    prov_maps_to: ~
    note: >
      DevTeam has a timed role-holder membership. Reuses the org:Membership
      n-ary pattern from SEAL (Application→Membership). PAT-side human roles:
      Tech Partner, Area Tech Partner, Software Engineering Manager,
      Software Engineer, SRE Director, etc.
    supplement:   catalog_ontology_supplement.cypher
    loader:       pat_team_roles.cypher
    domain:       human
    status:       deprecated
    deprecated_at: 2026-08-18
    deprecation_note: >
      RE-SHAPED at G91 (2026-08-18, §C1d): the DevTeam leg JOINS THE QUALIFIED-ATTRIBUTION
      PATTERN. It was the last holdout on the reified W3C ORG Membership shape — SEAL moved
      at K4 (2026-07-10 §B/§C) and the PAT product / area-product side at K5 (2026-07-20), so
      one employee reached the graph by two different routes: HAS_AGENT off an :Attribution
      for two families, HELD_BY off a :Membership for this one.
      THIS SUPERSEDES TWO EARLIER CARVE-OUTS, named so the change does not read as an
      oversight. K4's own deprecation note spared this entry — "org: stays for the PAT
      product hierarchy only (e.g. catalog_dev_team_has_membership — SAME labels, different
      vocab id, NOT deprecated)" — and C20 (2026-07-28, constraints.cypher) scoped the K4
      retirement to the SEAL attribution loaders, keeping :Role / :Membership load-bearing
      for the catalog paths. The SME ruled otherwise on 2026-08-18.
      WHY IT COULD NOT SIMPLY ACTIVATE: pat_team_roles.cypher writes a THREE-edge triple
      (HAS_MEMBERSHIP, OF_ROLE, HELD_BY) and only this leg was ever registered — OF_ROLE and
      HELD_BY exist solely as seal_of_role / seal_held_by, both DEPRECATED. That is NOT a
      registration gap: the C8 rule (K5 header block above) says identical triples are
      REUSED, never twinned, and both are identical to the SEAL ones. The defect was that
      the entries to be reused say "no longer loaded" while a loader would write them fresh
      on every run — and the estate is TRUNCATE-AND-RELOAD, so there is no legacy-data
      reading under which that is benign. Anything that should not be loaded does not stay.
      REPLACED BY catalog_dev_team_qualified_attribution + catalog_dev_team_attribution_had_role
      below, both planned. Per G91's acceptance a re-shape enters as a NEW proposal through
      docs/RELATIONSHIP_GUIDE.md, never as an edit of the held entry. Never built, so
      nothing is deleted.

  # — DevTeam staffing, re-shaped onto qualified attribution (G91, 2026-08-18) —
  #   The HAS_AGENT hop is NOT twinned: Attribution -[HAS_AGENT]-> Employee is IDENTICAL to
  #   seal_attribution_has_agent, and the C8 meta-graph refuses ambiguous duplicate
  #   (from, label, to) triples, so this family REUSES that entry as shared
  #   qualified-attribution infrastructure — the same move K5 made for the Product Cabinet.
  #   Only the two triples that DIFFER are registered here.
  - id:           catalog_dev_team_qualified_attribution
    neo4j_label:  QUALIFIED_ATTRIBUTION
    inverse_label: "attribution of"
    role:         ~
    from_node:    DevTeam
    to_node:      Attribution
    prov_maps_to: "prov:qualifiedAttribution"
    note: >
      A DevTeam's staffing as a qualified attribution — the reified hop carrying WHO and
      IN WHICH ROLE, replacing DevTeam -[:HAS_MEMBERSHIP]-> :Membership. Raised at G91
      (2026-08-18) as the re-shape of catalog_dev_team_has_membership; see that entry's
      deprecation_note for the ruling and the two carve-outs it supersedes.
      Triple differs from both existing QUALIFIED_ATTRIBUTION entries
      (BusinessApplication → Attribution seal-side, Product | AreaProduct → Attribution
      cabinet-side), so it registers rather than reuses.
      ACTIVE at G99 (2026-08-18): pat_team_roles.cypher was rewritten onto this shape in
      the same change, so supplement and loader both exist — the bar this file's lifecycle
      sets for active.
    supplement:   catalog_ontology_supplement.cypher
    domain:       human
    loader:       pat_team_roles.cypher
    status:       active

  - id:           catalog_dev_team_attribution_had_role
    neo4j_label:  HAD_ROLE
    inverse_label: "role in"
    role:         ~
    from_node:    Attribution
    to_node:      Role
    prov_maps_to: ~
    note: >
      The role leg of a DevTeam staffing attribution. Targets :Role — the org:Role class
      whose canonical rows catalog_ontology_supplement.cypher already seeds and whose keys
      constraints.cypher already carries — rather than minting a third role vocabulary
      beside TOMRole (SEAL) and ProductRole (Product Cabinet). PAT-side team roles are
      ENGINEERING roles (Tech Partner, Area Tech Partner, Software Engineering Manager,
      Software Engineer, SRE Director and siblings), a different register from either.
      Triple differs from both existing HAD_ROLE entries (Attribution → TOMRole,
      Attribution → ProductRole), so it registers rather than reuses — and it gives :Role a
      live purpose again, which the C20 scoped retention had been holding open for the
      Membership shape this ruling retires.
      prov_maps_to is null deliberately: prov:hadRole belongs to the qualified pattern as a
      whole and the sibling entries' supplement already declares it; a second mapping here
      would duplicate it.
      ACTIVE at G99 (2026-08-18) alongside its sibling — the rewritten loader resolves the
      role against the canonical :Role rows the catalog supplement seeds.
    supplement:   catalog_ontology_supplement.cypher
    domain:       human
    loader:       pat_team_roles.cypher
    status:       active
