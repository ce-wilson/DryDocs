  # ── Document supersession + currency (Q11, 2026-08-19; gate document-supersession PENDING) ─

  - id:           docs_supersedes
    neo4j_label:  SUPERSEDES
    inverse_label: "superseded by"
    role:         ~
    from_node:    Document
    to_node:      Document
    prov_maps_to: "prov:wasRevisionOf"
    note: >
      THE NEWER document SUPERSEDES the older: (new)-[:SUPERSEDES]->(old), the
      prov:wasRevisionOf direction exactly (a revision derives from what it
      revises), with dct:replaces as the documentation-standard twin recorded
      here rather than in prov_maps_to (one mapping per entry; the dct pair
      dct:replaces / dct:isReplacedBy matches label and inverse_label).
      THE PROBLEM IT MODELS (SME, 2026-07-26): "internally I've seen 2 or 3
      different versions with the same referenced person/team/process, but is
      stale and the only indication is date." QUARANTINING DOES NOT
      DISAMBIGUATE — all versions in one place are still ambiguous; the
      separation protected other corpora, it never said which one is current.
      That is a modeling problem, and this edge is the model.
      CURRENCY IS STRUCTURAL FIRST: current = a Document with NO incoming
      SUPERSEDES edge —
        MATCH (d:Document) WHERE NOT (d)<-[:SUPERSEDES]-(:Document)
      — never captured_at ordering (dates are the failure mode this exists to
      replace). A stamped is_current cache property is the gate's clause B
      choice (index-friendly, but a SECOND encoding of one fact — the §B2
      segment-edge lesson applies verbatim); the structural read stays the
      truth either way.
      PLANNED: no loader writes this until gate document-supersession signs.
      Chains supersede pairwise (v3->v2->v1), never star-shaped v3->v1 — the
      gate confirms transitivity is TRAVERSED, not materialized.
    supplement:   ~
    loader:       ~
    domain:       docs
    status:       planned

  # ── Email → subject assignment (Q10, 2026-08-19; gate email-folder-assignment SIGNED 8/8 2026-08-19) ─

  - id:           docs_email_concerns
    neo4j_label:  CONCERNS
    inverse_label: "concerned by"
    role:         ~
    from_node:    Document
    to_node:      "ControlMFolder | ETLProcess"
    prov_maps_to: ~
    note: >
      A failure/activity email Document is ABOUT a folder or process — the
      SME-assigned (or source-extractable) subject of the incident it reports.
      Two endpoint classes, one meaning, endpoint recorded on the edge — the
      rua-load-shapes §B2 convention. Aboutness, not derivation: no PROV row
      (the docs_describes precedent).
      GATE SIGNED 8/8, 2026-08-19 (email-folder-assignment; gate-log is the
      transcription): CONCERNS confirmed over ASSIGNED_TO (aboutness, not
      workflow — A1); ETLProcess confirmed as the process endpoint class (A2);
      assigned_by (sme | source-signal) + an evidence pointer are REQUIRED on
      every write (A3, O24); and the B1 signal bar is STRUCTURED FIELD ONLY —
      subject/body prose proposes, never performs, and the assumed contract has
      no such field today, so in practice every assignment starts SME-performed.
      TWO FENCES, both confirmed at the gate. (1) ABOUTNESS IS NEVER
      ATTRIBUTION (C1): per the cm_escalation_db correction (2026-08-17) and
      K7 §A1, email evidence SUPPLEMENTS the human folder→application mapping —
      this edge says what an email is about, never who owns anything; traversal
      is legitimate reading, a shortcut edge is not. (2) NEVER GUESSED (B3): an
      email with no extractable subject stays UNASSIGNED (a valid resting
      state); no best-match sweep may drain it — the count is reported, and per
      C2 the assignment is also the retention key, so unassigned is unpurgeable
      by scope.
      PLANNED until the writer build lands (flips-are-follow-ups, N13 §B1 —
      Idea-137 owns the writer, Idea-138 the SME surface whose contract §B2
      ruled). email_extracts.cypher stays test-guarded against ever gaining
      the write — the lexical loader is fenced forever.
    supplement:   ~
    loader:       ~
    domain:       docs
    status:       planned

  # ── Evidence breadcrumb of a derived record (MM2, 2026-08-21; gate data-flow-overview DRAFTED, unsigned) ──

  - id:           docs_evidenced_by
    neo4j_label:  EVIDENCED_BY
    inverse_label: "evidence for"
    role:         ~
    from_node:    DataFlow
    to_node:      "Document | Chunk"
    prov_maps_to: "prov:wasDerivedFrom"
    note: >
      PLANNED (MM2). The breadcrumb from a deepdoc-derived record to whatever
      it was read FROM. PROV reading fixed at the gate (§E confirmation 4):
      the flow RECORD is an Entity derived from its evidence
      (prov:wasDerivedFrom) even though the flow it describes is an Activity —
      recorded so nobody later "corrects" the edge onto prov:used. Two
      endpoint classes, one meaning, endpoint recorded on the edge (the
      rua-load-shapes §B2 / docs_email_concerns convention). Emails already
      ARE Documents (docs_email_concerns, Q10); a log excerpt becomes one when
      MM3 stages it; an issue, a commit or a page when its MM5 connector
      captures it. THE GRAMMAR IS OPEN at gate §E, pre-picking none: E1 a URN
      list on the node (email:<extract-id> · log:<job>/<run>/<lines> ·
      jira:<key> · commit:<sha> · confluence:<page-id> · transcript:<file>),
      E2 this edge for every kind with ingestion first, or E3 both — the URN
      as the breadcrumb identity AND the :Document business key, the edge
      added when the corpus node exists. Whatever is ruled: one URN grammar
      per source kind, transcript files cited by file name, and a fact with NO
      breadcrumb is not written (the evidence-present guard lands with MM10,
      guards first). Domain docs: the edge is about the corpus side, and
      MM6/MM9 extend its from_node to the other derived-record labels the
      method surfaces.
    supplement:   ~
    loader:       ~
    domain:       docs
    status:       planned

