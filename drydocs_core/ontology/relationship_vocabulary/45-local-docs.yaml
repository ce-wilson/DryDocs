
  # ── Docs corpus — lexical graph (Document→Chunk; llm-graph-builder pattern) ─
  # Registered 2026-07-08 for the bmc-docs corpus load (user-directed; only
  # sample Control-M data can reach this DB, so the converted BMC docs are the
  # demonstrable content). ALL FOUR ARE GATE-BOUND: status planned until the
  # bmc-docs-lexical-load gate is SME-accepted (config/gate-prompts/).

  - id:           docs_describes
    neo4j_label:  DESCRIBES
    inverse_label: "described by"
    role:         ~
    from_node:    Document
    to_node:      SoftwareProduct
    prov_maps_to: ~
    note: >
      Document (prov:Entity) is ABOUT a SoftwareProduct — the software-ontology
      hook: dcterms:subject / foaf:primaryTopic pattern, no PROV row (Entity →
      Entity aboutness is not derivation; deliberately NOT wasDerivedFrom).
      Edge carries target_version (the corpus documents SaaS pages applied to
      9.0.21.300). Vendor hop rides the existing MADE_BY (product → brand).
    supplement:   ontology_supplement.cypher
    loader:       bmc_docs.cypher
    domain:       docs
    status:       active    # gate bmc-docs-lexical-load accepted 2026-07-08 (config/gate-log.md)

  - id:           docs_chunk_part_of
    neo4j_label:  PART_OF
    inverse_label: "has part"
    role:         ~
    from_node:    Chunk
    to_node:      Document
    prov_maps_to: ~
    note: >
      Lexical-graph containment (llm-graph-builder pattern): Chunk belongs to
      its Document. dcterms:isPartOf pattern; equivalently the inverse of
      prov:hadMember (Collection reading) — recorded as structural, not PROV,
      to keep the lexical graph distinct from the domain Collections.
    supplement:   ontology_supplement.cypher
    loader:       bmc_docs.cypher
    domain:       docs
    status:       active    # gate bmc-docs-lexical-load accepted 2026-07-08 (config/gate-log.md)

