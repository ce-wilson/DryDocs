      TOMRole/ProductRole, "SME feedback author" is not a multi-valued concept scheme), so
      reification would add a hop with no disambiguating payload. role=feedback_author
      distinguishes this instance on the shared WAS_ATTRIBUTED_TO label (the
      tom_role_holder / developed_by / owner idiom). Gate section C asks the SME to
      confirm collapsed-only is sufficient (vs also registering a reified form for future
      multi-reviewer notes, mirroring the K6 "both forms load" precedent).
    supplement:   ontology_supplement.cypher
    loader:       doc_feedback.cypher
    domain:       docs
    status:       active   # gate doc-traceability-feedback signed off 2026-07-20 (config/gate-log.md)

  # ── Document supersession + currency (Q11, 2026-08-19; gate document-supersession PENDING) ─

  - id:           docs_supersedes
    neo4j_label:  SUPERSEDES
    inverse_label: "superseded by"
    role:         ~
    from_node:    Document
    to_node:      Document
    prov_maps_to: "prov:wasRevisionOf"
    note: >
      THE NEWER document SUPERSEDES the older: (new)-[:SUPERSEDES]->(old), the
      prov:wasRevisionOf direction exactly (a revision derives from what it
      revises), with dct:replaces as the documentation-standard twin recorded
      here rather than in prov_maps_to (one mapping per entry; the dct pair
      dct:replaces / dct:isReplacedBy matches label and inverse_label).
      THE PROBLEM IT MODELS (SME, 2026-07-26): "internally I've seen 2 or 3
      different versions with the same referenced person/team/process, but is
      stale and the only indication is date." QUARANTINING DOES NOT
      DISAMBIGUATE — all versions in one place are still ambiguous; the
      separation protected other corpora, it never said which one is current.
      That is a modeling problem, and this edge is the model.
      CURRENCY IS STRUCTURAL FIRST: current = a Document with NO incoming
      SUPERSEDES edge —
        MATCH (d:Document) WHERE NOT (d)<-[:SUPERSEDES]-(:Document)
      — never captured_at ordering (dates are the failure mode this exists to
      replace). A stamped is_current cache property is the gate's clause B
      choice (index-friendly, but a SECOND encoding of one fact — the §B2
      segment-edge lesson applies verbatim); the structural read stays the
      truth either way.
      PLANNED: no loader writes this until gate document-supersession signs.
      Chains supersede pairwise (v3->v2->v1), never star-shaped v3->v1 — the
      gate confirms transitivity is TRAVERSED, not materialized.
    supplement:   ~
    loader:       ~
    domain:       docs
    status:       planned

  # ── Email → subject assignment (Q10, 2026-08-19; gate email-folder-assignment PENDING) ─

  - id:           docs_email_concerns
    neo4j_label:  CONCERNS
    inverse_label: "concerned by"
    role:         ~
    from_node:    Document
    to_node:      "ControlMFolder | ETLProcess"
    prov_maps_to: ~
    note: >
      A failure/activity email Document is ABOUT a folder or process — the
      SME-assigned (or source-extractable) subject of the incident it reports.
      Two endpoint classes, one meaning, endpoint recorded on the edge — the
      rua-load-shapes §B2 convention. Aboutness, not derivation: no PROV row
      (the docs_describes precedent).
      TWO FENCES, both load-bearing. (1) ABOUTNESS IS NEVER ATTRIBUTION: per
      the cm_escalation_db correction (2026-08-17) and K7 §A1, email evidence
      SUPPLEMENTS the human folder→application mapping — this edge says what an
      email is about, never who owns anything. (2) NEVER GUESSED: an email with
      no extractable subject stays UNASSIGNED (a valid resting state); an
      extraction pass may PROPOSE an assignment, only an SME or an explicit
      source signal performs one (the B3 discipline). Spelling (CONCERNS vs
      ASSIGNED_TO), the process-endpoint class, and the proposal surface are
      the gate's clauses.
      PLANNED: no loader writes this until gate email-folder-assignment signs —
      email_extracts.cypher is test-guarded against ever gaining the write.
    supplement:   ~
    loader:       ~
    domain:       docs
    status:       planned

