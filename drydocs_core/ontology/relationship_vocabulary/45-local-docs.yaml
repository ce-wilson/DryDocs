  - id:           doc_feedback_authored_by
    neo4j_label:  WAS_ATTRIBUTED_TO
    inverse_label: "authored"
    role:         feedback_author
    from_node:    FeedbackNote
    to_node:      Employee
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      ACTIVE (gate doc-traceability-feedback signed off 2026-07-20, C1 — collapsed-only confirmed). FeedbackNote authored by the SME reviewer. Matrix row: Entity → Agent =
      wasAttributedTo — SIMPLE/COLLAPSED form, same precedent as p2_authored_by
      (ControlMFolder → Developer) rather than the K4/K5 qualified/reified Attribution
      pattern (seal_qualified_attribution / catalog_cabinet_qualified_attribution): a
