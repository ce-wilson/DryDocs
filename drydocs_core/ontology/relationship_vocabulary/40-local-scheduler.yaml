  - id:           m3_delegates_to
    neo4j_label:  DELEGATES_TO
    inverse_label: "delegated to by"
    role:         ~
    from_node:    AppUser
    to_node:      ExecutionHost
    prov_maps_to: "prov:actedOnBehalfOf"
    note: >
      Service account delegated to a host per environment (EPV FID rows with
      Use Case='AWS'/'DPL'/'CCMS' + Environment). prov:actedOnBehalfOf
      requires Agent → Agent — this is why ExecutionHost is classified
      prov:SoftwareAgent in node_classifications. Edge carries environment.
      Feed: CMDB / IAM.
      HELD 2026-08-07 (gate rua-load-shapes §A1, SIGNED OFF 28/28): may
      NOT activate while its SUBJECT HAS NO AGREED KEY —
      fid-identity-and-scope (K17, drafted, UNSIGNED) rules :AppUser keyed
      on fid with fid_name a property and name→fid resolution an explicit
      crosswalk step. ControlMJob.run_as carries the tenant NAME, not the
      directory key; activating now would key :AppUser on the name by
      default — the silent split fid §A1 exists to prevent. The rua
      envelope corroborates PRESENCE; it authors no identity. Stays
      planned; re-tick after K17 signs.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       scheduler
    status:       deprecated
    deprecated_at: 2026-08-21
    superseded_by: scheduler_delegates_to
    deprecation_note: >
      ID MIGRATION ONLY — THE CONCEPT IS UNCHANGED. Gate vocabulary-domains-and-id-policy
