      re-pointed from the pre-G9 shape (ETLProcess → DataSource) to the
      two real cases — (1) ETL case: the ETLProcess reads a source dataset
      (Source Zone + Source Glue Database; feed: Informatica / Ab Initio);
      (2) file-ops case: the wrapper script is pure unix file operations
      (move, gzip, …) and the type-correct Activity is the ControlMJob
      itself (Script is prov:Entity and cannot carry prov:used) — the
      writer must resolve the owning job via its INVOKES edge (follow-up,
      IDEAS/backlog). To-node unified on DataAsset (the D1 proxy URN,
      provisioning/02_proxy_constraints.cypher) — the edge direction
      already encodes source-vs-target, so the DataSource label is retired
      (see node_classifications). Matrix row: Activity → Entity = USED.
      ACTIVATED 2026-08-07 (gate rua-load-shapes §A5, SIGNED OFF 28/28;
      applied at G55) WITH THE RESTRICTION RESTATED — the SME changed the
      page's own words: activates for STRUCTURED, LAUNCHER- OR
      REGISTRY-GROUNDED evidence — dataset_flow AND parsed CMD_LINE
      file-ops — but NOT script-body content grep. Both feeds verified at
      the ruling: dpl_mac maps dataset_flow.json inputDatasets/
      outputDatasets to candidates (GUID + version + zone);
      controlm_inventory (G14) parses CMD_LINE MOVE/COPY/COMPRESS into the
      same candidates with counters. Consequence accepted with the
      activation: local_file DataAssets will be numerous and transient —
      one per MOVE operand (§D1/§G1 answer the node-class question).
      Supplement block written at the flip; loader is G23.
    supplement:   ontology_supplement.cypher
