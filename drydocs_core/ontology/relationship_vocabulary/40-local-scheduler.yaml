    role:         ~
    from_node:    ControlMFolder
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      Physical hosting — folder is scheduled on a specific Control-M server
      (DATA_CENTER value). No PROV-O equivalent; infrastructure placement.
      Edge carries since + last_seen_at for migration auditability.
      RENAMED from RUNS_ON (see m3_runs_on, deprecated) so the RUNS_ON label
      can be reused for execution-host placement with role properties.

    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       scheduler
    status:       deprecated
    deprecated_at: 2026-08-21
    superseded_by: scheduler_scheduled_on
    deprecation_note: >
      ID MIGRATION ONLY — THE CONCEPT IS UNCHANGED. Gate vocabulary-domains-and-id-policy
      §B3 (SIGNED 2026-08-12) ruled the epoch-tag ids FORCE-migrated onto the
      domain-derived scheme; G87 applies it (2026-08-21). Add-new + deprecate-old, never
      a rename in place: the id is the join key across the taxonomy-ontology-map, the
      generated schema_graph.cypher, the SQLite mirror and the append-only gate log.
      Live entry is `scheduler_scheduled_on` below — same shape, same active status.
      DATA: edges already in a graph carry r.vocab_id = 'm3_scheduled_on'; loaders write
      'scheduler_scheduled_on' from this date. drydocs/loaders/cypher/migrate_vocab_ids_g87.cypher
      re-stamps the old value (idempotent, one-time per environment).

