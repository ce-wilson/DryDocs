  - id:           m3_depends_on_file
    neo4j_label:  USED
    inverse_label: "used by"
    role:         file_dependency
    from_node:    ControlMJob
    to_node:      File
    prov_maps_to: "prov:used"
    note: >
      Job waits on a file delivered via MFTS agent (fmSubPathId). Normalized
      from the pre-ontology "DEPENDS_ON" edge in the architecture diagram:
      DEPENDS_ON is retired (job→job replaced by WAS_INFORMED_BY; job→file
      is matrix row Activity → Entity = USED with role=file_dependency).
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       scheduler
    status:       deprecated
    deprecated_at: 2026-08-18
    deprecation_note: >
      ID MIGRATION ONLY — THE CONCEPT WAS KEPT, NOT REJECTED. Gate G91 (the held
      planned-entry review, §C1b) ruled this entry KEEP-PLANNED on 2026-08-18, then
      ruled the epoch-tag id retired in the same session. Per the id policy ratified
      at vocabulary-domains-and-id-policy §B1/§B3 an id is NEVER renamed in place — it
      is the join key across the taxonomy-ontology-map, the generated
      schema_graph.cypher, the SQLite mirror and the append-only gate log — so the
      migration is add-new + deprecate-old. The live entry is
      `scheduler_depends_on_file` below, carrying the same shape and the same
      planned status. Nothing was ever loaded here, so no data moves. Done under G91
      rather than G87 because a planned, loaderless, dataless entry migrates for free;
      G87 keeps the remaining epoch-tag ids.

  - id:           scheduler_depends_on_file
    neo4j_label:  USED
    inverse_label: "used by"
    role:         file_dependency
    from_node:    ControlMJob
    to_node:      File
    prov_maps_to: "prov:used"
    note: >
      Job waits on a file delivered via MFTS agent (fmSubPathId). Matrix row
      Activity → Entity = USED with role=file_dependency; the pre-ontology
      "DEPENDS_ON" edge is retired (job→job is WAS_INFORMED_BY).
      REPLACES m3_depends_on_file at G91 (2026-08-18) — id migration under the
      §B1 domain-derived scheme, same shape, same planned status.
      WHY THIS IS NOT A STALE IDEA, recorded because the review that held it read
      the other way: the FileWatcher model is BUILT producer-side except for this
      edge. :File carries a hand-written index (constraints.cypher:140,
      file_arrival on f.arrived_at), the job type is parsed
      (description_tokens.py JobType.FILE_WATCHER), and the watched-path role is
      resolved (paths.py, FILEWATCH|WATCH|FW_ → WATCH_INPUT). What is missing is
      exactly the predicate this entry declares. The FileWatcher METADATA LOADER is
      company-only, which is why nothing writes it here yet.
      SOMETHING ALREADY DEPENDS ON THE RULING: the AutoSys crosswalk flags its
      `d(file)` row as approximate — "may need a FileWatcher-job mapping instead"
      (config/gate-prompts/autosys-crosswalk.yaml:102) — and §115 makes resolving
      or explicitly deferring it a gate condition. Stays planned until a feed is
      profiled; the MFTS fmSubPathId source has not been.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       scheduler
    status:       planned

