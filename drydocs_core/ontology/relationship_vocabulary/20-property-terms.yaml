
# ── SECTION 0b: Property-term bindings ───────────────────────────────────────
# Property-level standard-term bindings — what a node PROPERTY means in
# standard vocabulary. Documentation-grade (crosswalks, future RDF export):
# no edges, no loaders, no renames of the bound property names. First entries
# ruled at gate envelope-property-terms (2026-08-04, M4), which also ruled
# that this section — not a separate file — is where property bindings live
# (the file already carries node_classifications, so it is the ontology
# registry, not literally a relationship list). SOSA explicitly ruled OUT for
# the envelope: authorship provenance is not observation.
# property    = the graph property name (frozen names never renamed here)
# term        = standard-term CURIE, resolvable via namespaces.py expand()
# decided_by  = gate id in config/gate-log.md
# ─────────────────────────────────────────────────────────────────────────────
property_terms:

  # — the source audit envelope (config/audit-fields.yaml, doc 06) —
  - property:   source_created_by
    term:       "dct:creator"
    decided_by: envelope-property-terms
    note:       "Who created the record in the source system. dct:creator does not require personhood — on Control-M this is a team Functional ID, an org-agent creator, which is conformant."

  - property:   source_created_at
    term:       "dct:created"
    decided_by: envelope-property-terms
    note:       "Date the record was created in the source system ('date of creation of the resource')."

  - property:   source_updated_by
    term:       "dct:contributor"
    decided_by: envelope-property-terms
    note:       "Who last changed the record in the source system. NEAREST DCMI term — DCMI defines no 'modifier'; the imprecision is recorded here by ruling (gate §B2) rather than mixing in a PROV edge-shaped reading for one property."

  - property:   source_updated_at
    term:       "dct:modified"
    decided_by: envelope-property-terms
    note:       "Date the record was last changed in the source system ('date on which the resource was changed')."
