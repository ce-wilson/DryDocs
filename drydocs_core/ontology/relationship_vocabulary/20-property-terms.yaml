
# ── SECTION 0b: Property-term bindings ───────────────────────────────────────
# Property-level standard-term bindings — what a node PROPERTY means in
# standard vocabulary. Documentation-grade (crosswalks, future RDF export):
# no edges, no loaders, no renames of the bound property names. First entries
# ruled at gate envelope-property-terms (2026-08-04, M4), which also ruled
# that this section — not a separate file — is where property bindings live
# (the file already carries node_classifications, so it is the ontology
# registry, not literally a relationship list). SOSA explicitly ruled OUT for
# the envelope: authorship provenance is not observation.
# property    = the graph property name (frozen names never renamed here)
# term        = standard-term CURIE, resolvable via namespaces.py expand()
# decided_by  = gate id in config/gate-log.md
# ─────────────────────────────────────────────────────────────────────────────
property_terms:

  # — the source audit envelope (config/audit-fields.yaml, doc 06) —
  - property:   source_created_by
    term:       "dct:creator"
    decided_by: envelope-property-terms
    note:       "Who created the record in the source system. dct:creator does not require personhood — on Control-M this is a team Functional ID, an org-agent creator, which is conformant."

  - property:   source_created_at
    term:       "dct:created"
    decided_by: envelope-property-terms
    note:       "Date the record was created in the source system ('date of creation of the resource')."

  - property:   source_updated_by
    term:       "dct:contributor"
    decided_by: envelope-property-terms
    note:       "Who last changed the record in the source system. NEAREST DCMI term — DCMI defines no 'modifier'; the imprecision is recorded here by ruling (gate §B2) rather than mixing in a PROV edge-shaped reading for one property."

  - property:   source_updated_at
    term:       "dct:modified"
    decided_by: envelope-property-terms
    note:       "Date the record was last changed in the source system ('date on which the resource was changed')."

  # — fix tracking: OUR intervention record (gate remediation-fix-tracking §D1) —
  # A FOURTH AXIS, deliberately not the envelope's. §A1 fences the dct: family to
  # source-system authorship, so these are dd: LOCAL terms with prose definitions
  # rather than borrowed standard ones — §D1 ruled exactly that, and ruled the
  # standard-term binding revisited when an RDF export exists. A prov: qualified-
  # influence reading was offered and left as a note, not taken: these are node
  # properties recording what WE did to a Control-M object, and reaching for a
  # PROV edge shape for three properties would mix two models for no gain today.
  - property:   remediation_fix_id
    term:       "dd:remediationFixId"
    decided_by: remediation-fix-tracking
    note:       "The fix package / Jira reference this node's remediation is tracked under. Local term by ruling (§D1): the standard-term binding is revisited when an RDF export exists. NOT authorship — the dct: family stays the source envelope's (§A1)."

  - property:   remediation_status
    term:       "dd:remediationStatus"
    decided_by: remediation-fix-tracking
    note:       "Where the fix stands: proposed | in_progress | applied | verified (§B2). 'applied' = the dev team imported the updated XML; 'verified' = the equivalence proof re-ran against the re-exported live definition. There is no 'rejected' value — a rejected fix REMOVES all three properties and the package records the rejection."

  - property:   remediation_status_date
    term:       "dd:remediationStatusDate"
    decided_by: remediation-fix-tracking
    note:       "Date of the LAST status transition (§B3). One date, not a per-status set: the full history lives in the fix package, and per-status dates were declined because they invite drift against it."
