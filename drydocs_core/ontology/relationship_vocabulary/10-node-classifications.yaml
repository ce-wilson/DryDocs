# ── SECTION 0: Node classifications ──────────────────────────────────────────
# class       = primary OWL/RDFS class (CURIE resolvable via namespaces.py)
# prov_type   = PROV-O behavioural type used to drive the SECTION 1 matrix
#               (Activity | Entity | Collection | Agent | n/a)
# All dd:* classes must be MERGEd as :OntologyTerm:LocalClass in a supplement.
# ─────────────────────────────────────────────────────────────────────────────
node_classifications:

  # — Control-M (M3, active) —
  - label:      ControlMJob
    class:      "dd:ControlMJob"
    prov_type:  Activity
    note:       "Job definition; acts as a prov:Activity at runtime. ontology_supplement.cypher."

  - label:      ControlMFolder
    class:      "dd:ControlMFolder"
    prov_type:  Collection
    note:       "prov:Collection of jobs. ontology_supplement.cypher."

  - label:      ControlMApplication
    class:      "dd:ControlMApplication"
    prov_type:  Collection
    note: >
      Control-M APPLICATION grouping from the folder HEADER ROW in CM_DEF_VJOB
      (JOB_ID=1) — deliberately NOT the business :BusinessApplication / SEAL concept.
      prov:Collection of ControlMFolder (see m3_contains_folder). Written in
      the FOLDER pass. SME gate controlm-q1q3-phase1 (2026-07-07); entry added
      2026-07-09 to close the node_classifications gap (the edge was
      registered without its node). ontology_supplement.cypher.

  - label:      ControlMServer
    class:      "dd:ControlMServer"
    prov_type:  n/a
    note: >
      Local platform/infrastructure class — no W3C equivalent. NOT an Agent:
      edges targeting it cannot use prov:wasAssociatedWith (see p2_deployed_to).
      ontology_supplement.cypher.

  - label:      Condition
    class:      "dd:Condition"
    prov_type:  Entity
    note:       "Named scheduling condition (prov:Entity). ontology_supplement.cypher."

  - label:      JobRun
    class:      "dd:JobRun"
    prov_type:  Activity
    note: >
      Loader-run provenance activity (base ontology). Distinct from
      ControlMJobRun (phase-2 runtime execution) — do not merge the labels.

  # — Control-M phase 2 (planned) —
  - label:      ControlMJobRun
    class:      "dd:ControlMJobRun"
    prov_type:  Activity
    note: >
      One actual execution of a ControlMJob, from the Control-M history API.
      FCDO alignment registered PLANNED (W2 2026-08-05; crosswalk
      config/crosswalks/fcdo-vocabulary.yaml row 2): when this label builds,
      its properties adopt the OpenLineage-as-PROV Run semantics — run UUID,
      nominalTime (the scheduled time), parent run/job link, errorMessage —
      with START/COMPLETE/FAIL/ABORT as the run-event value set; the same
      build wires the three seeded :OlClass nodes (OL Run / OL Job /
      OL Dataset, ontology.cypher) to ControlMJobRun / ControlMJob /
      DataAsset via MAPS_TO. Scope (user ruling 2026-07-31): our run data is
      batch history — this is name conformance for an event-based mode
      DryDocs does not run, never a mandate to build run-event ingestion.
      Activation rides the ControlMJobRun build and its gate, not this
      registration.

  - label:      Deployment
    class:      "dd:Deployment"
    prov_type:  Activity
    note:       "CI/CD deployment activity that ships folder XML to a server."

  - label:      Developer
    class:      "prov:Person"
    prov_type:  Agent
    note: >
      Human author from Git blame / change records. Likely the same individual
      as an Employee node (SEAL); reconcile by SID when both feeds are loaded.

  - label:      AppUser
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note:       "Service account / FID that jobs run as (EPV, Run-as-User)."

  - label:      Script
    class:      "dd:Script"
    prov_type:  Entity
    note: >
      Invocable artifact (placement JAR + Task-JSON). prov:Entity; also a
      prov:Plan in the wasAssociatedWith(hadPlan) pattern. Finer software
      typing available via swo: if ever required.

  - label:      SourceOccurrence
    class:      "dd:SourceOccurrence"
    prov_type:  Entity
    note: >
      Gate rua-load-shapes §D2 RULED 2026-08-06 (SIGNED OFF 2026-08-07,
      28/28; registered at G55): a REIFIED occurrence record — one
      observation of a logical Script in one source. PLANNED-FIRST; loads
      at G23, never before. The only shape that holds all origins
      UNIFORMLY: the server occurrence's locator is host+path, the repo
      occurrence's is repo+ref+commit — an edge-property shape hung off
      :ExecutionHost cannot carry the repo half, and the gate's premise is
      one file arriving from three sources. Ruled out as graph shape: the
      packed-string staging accumulation (ADR 0001's own words — "a string
      is not queryable"). Properties at minimum: origin (server-extract |
      code-repo | reference-fact), the full locator, sha256 where present
      (§G2 — the version discriminator; hash ABSENCE is a real, counted
      state; scripts get NO version nodes), and mount_root + fstype +
      storage_scope once G56 lands. Standards binding:
      prov:specializationOf — the occurrence specializes the one logical
      Script node (§D1 normalized-absolute-path key).
      ontology_supplement.cypher.

  - label:      ETLProcess
    class:      "dd:ETLProcess"
    prov_type:  Activity
    note:       "AWS-side ingestion/transformation workload (Glue / DPL). obi: offers a data-transformation class if a standards mapping is later required."

  - label:      ExecutionHost
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note: >
      Agent host / ETL cluster entry point. Classified as SoftwareAgent
      (not pure infrastructure) so that AppUser -[:DELEGATES_TO]->
      ExecutionHost can legally map to prov:actedOnBehalfOf, which requires
      Agent → Agent. Local subclass dd:ExecutionHost.

  - label:      ControlMHostGroup
    class:      "dd:ControlMHostGroup"
    prov_type:  Collection
    note: >
      Gate controlm-hosts-topology CONFIRMED 2026-07-09 (config/gate-log.md): a
      Control-M host group / node group (vendor 6.4.01 poster: CMS_NODGRP;
      replica: psgmgr CM_HOSTS) — the load-balancing set of agent hosts a
      job's NODE_ID can resolve to; the group name may itself be a DNS/LB
      alias. Key (data_center, name); members are ExecutionHost nodes.
      Deliberately NOT named "ControlMGroup": CM_DEF_VJOB.GROUP_NAME
      (ControlMJob.group_name) is the application-group concept — a different
      thing entirely; "host group" is the 9.0.x vendor term.

  - label:      ControlMUtility
    class:      "dd:ControlMUtility"
    prov_type:  Entity
    note: >
      CONFIRMED (gate vendor-docs-entity-core §A, drafted 2026-08-22 at Q14 —
      SIGNED OFF 2026-08-22 21/21; stays planned until its build lands). A Control-M command-line utility the vendor
      documents by exact name (exportdefjob, ctmorder, the emdef family) —
      the name-addressable entry point of the vendor-docs entity core, minted
      deterministically from the bmc-docs-controlm-utilities page titles,
      never by an LLM. prov:Entity: jobs USE it (scheduler_invokes_utility,
      Activity -> Entity = prov:used); documents DESCRIBE it
      (docs_describes_utility). Uniqueness key: name (the vendor-canonical
      string); carries family + kind where the title rule derives them,
      unclassified counts reported. Vendor-prefixed label per ADR 0003/0008
      (the ControlMJob/ControlMFolder/ControlMServer family). Deliberately NOT
      a :SoftwareProduct row — the registry classifies what a vendor SHIPS as
      a governed, hand-curated product entry; the gate §A2 lays that
      alternative out for explicit rejection. Bridge to the product:
      docs_utility_part_of (PART_OF -> SoftwareProduct {controlm}).

  - label:      DataSource
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      RETIRED 2026-07-15 (lineage rel vocabulary gate, config/gate-log.md):
      superseded by DataAsset — the READS_FROM edge direction already
      encodes the source role. Kept for audit; no loader ever shipped.
      Was: read-side dataset (source zone + Glue database).

  - label:      DataTarget
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      RETIRED 2026-07-15 (lineage rel vocabulary gate, config/gate-log.md):
      superseded by DataAsset — the WRITES_TO edge direction already
      encodes the target role. Kept for audit; no loader ever shipped.
      Was: write-side dataset (target zone / bucket / partitions).

  - label:      DataAsset
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      Added at the lineage rel vocabulary gate 2026-07-15: the D1 proxy
      shape — a piece of data a process reads or writes (hdfs / s3 /
      hive_table / local_file / Glue table, …), keyed on assetId
      (urn:drydocs:dataasset:{platform}:{namespace}:{name};
      provisioning/02_proxy_constraints.cypher — constrained in all three
      data DBs so the ddall composite joins on it). Replaces the retired
      DataSource / DataTarget pair as the to-node of m3_reads_from /
      m3_writes_to.

  - label:      DataFlow
    class:      "prov:Activity"
    prov_type:  Activity
    note: >
      PLANNED (MM2, 2026-08-21; gate data-flow-overview DRAFTED, unsigned): the
      per-data-flow overview record — one node per <DATAFLOW> value as the DPL
      launcher names it (-dataflow on the command line, DataFlow in the
      task-service request, %%DATAFLOW on the sub-folder), keyed
      flow_id = urn:drydocs:dataflow:controlm:<DATAFLOW>. Reconciles three
      grains that existed unreconciled: the %%DATAFLOW variable fact, the
      designed-never-built :AppDataFlow (docs/patterns/data-catalog/
      lineage-design-top3.md), and the runbook "data series" traversal
      (runbooks.series.v1). Class prov:Activity = the composite activity its
      member jobs realize (the pattern doc's "prov:Activity cluster"). EVERY
      ruling is open at the gate and none is pre-picked: §A the LABEL (this
      spelling vs folding into :AppDataFlow's dataflowUrn) and the KEY
      (firm-wide unique vs per-application, URN gaining an <APP_ID> segment);
      §B the ingest_mode enum (api-pull | file-push | internal-generated |
      unknown, or a richer set) with two fixed rules — NEVER derived from the
      job-name token (R13), and `unknown` is a recorded value with a reason,
      never a default; §C every field badged SOURCE / DERIVED; §D the five
      edges (arch_has_data_flow, arch_orchestrates, arch_fed_by, arch_lands_in,
      docs_evidenced_by); §E the evidence-breadcrumb grammar; §F
      watchers[].load_bearing as SME-ruled with `unruled` the resting state.
      Written ONLY as a deepdoc finding under ADR 0011 clause 1 (:Uncertain +
      reliability + trust, tests/unit/test_uncertain_boundary.py); promotion
      is a gate write, never a label strip. No loader, no taxonomy-ontology-map
      row until §A rules the label. Record: docs/design/
      deepdoc-data-flow-overview.md §2.

  # — SEAL (active) —
  - label:      BusinessApplication
    class:      "prov:Entity"
    dual_class: "dprod:DataProduct"
    prov_type:  Entity
    note: >
      SEAL-registered application (a data-product/asset record). seal_ontology_supplement.cypher.
      RECLASSED + RENAMED (K4, 2026-07-15) per the BusinessApplication entity-reshape gate
      §A + label decision (config/gate-log.md 2026-07-10, SME chad.wilson): was label
      Application, class prov:SoftwareAgent/Agent. The old typing carried three incompatible
      PROV types at once (SoftwareAgent here; dprod:Port children = Entity semantics;
      org:Membership role-holders = Organization semantics). Label :Application →
      :BusinessApplication normalized across vocabulary, schema supplements, loaders,
      constraints (businessapplication_*), and tests in the same K4 change.

  - label:      Employee
    class:      "prov:Agent"
    prov_type:  Agent
    note:       "Person holding a role membership. seal_ontology_supplement.cypher."

  - label:      Membership
    class:      "org:Membership"
    prov_type:  n/a
    note: >
      CORRECTED: consolidated doc listed "prov:Membership", which does not
      exist in PROV-O. The W3C ORG ontology owns this class (org:Membership),
      matching seal_ontology_supplement.cypher. n-ary relation node, not a
      PROV participant.

  - label:      Role
    class:      "org:Role"
    prov_type:  n/a
    note:       "Named role in a membership. seal_ontology_supplement.cypher."

  - label:      Port
    class:      "dprod:Port"
    prov_type:  Entity
    note:       "Application port. Kinds: EventProcessing / BatchProcessing (data ports) + Technology (the infrastructure attachment surface — kind WIDENED at gate server-location-ontology §C2, 2026-08-19; see infra_port_runs_on_server). dprod namespace is the EKGF working default pending the corporate IRI."

  - label:      DistributionList
    class:      "dd:DistributionList"
    dual_class: "vcard:Group"
    prov_type:  Entity
    note: >
      An email distribution list as a contact point. Registered with
      business_application_port_has_contact_point (status: planned) so the edge
      is not declared without its node — the gap closed for ControlMApplication
      on 2026-07-09. Shape per email-dl-contact-point §A1 (keyed on the
      lower-cased SMTP address, display_name + status as properties); the
      captured company standard models the same thing as ex:EmailDistributionList
      with a dlTier enum, and §G3 rules which name and whether dlTier folds into
      `purpose`. NOTHING LOADS until that gate signs: the node class is declared
      here because its edge is, not because anything creates it.

  # — SEAL reshape (ACTIVE at K4, 2026-07-15 — gate 2026-07-10 §B) —
  # (seal_had_primary_source targets :Document — declared ONCE in the docs-corpus section
  # below; the duplicate SEAL-reshape Document entry was merged into it 2026-07-09,
  # tech-debt audit F4 — one label, one classification entry.)

  - label:      Attribution
    class:      "prov:Attribution"
    prov_type:  n/a
    note: >
      ACTIVE (K4, 2026-07-15): reified n-ary node for the SEAL Technical Operating Model (TOM)
      qualified-attribution pattern — BusinessApplication -[:QUALIFIED_ATTRIBUTION]-> Attribution
      -[:HAS_AGENT]-> Employee, Attribution -[:HAD_ROLE]-> TOMRole. Same pattern family as
      org:Membership (n-ary relation node, not itself a PROV participant — prov:Attribution
      rdfs:subClassOf prov:Influence). Supplement: seal_ontology_supplement.cypher. For
      operate_manager the level (L1|L2) is a property on THIS node.

  - label:      TOMRole
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      ACTIVE (K4, 2026-07-15): SEAL Technical Operating Model role vocabulary — skos:Concept
      in scheme tom_roles (SkosConceptScheme), the gate §B REVISED fixed 7: application_owner,
      primary_information_owner, backup_information_owner, cto, technology_risk_controls,
      design_authority, operate_manager (L1/L2 = Attribution property). cto is NOT shared
      with the K5 ProductRole scheme — the K5 gate (signed off 2026-07-20) decided the two
      families are INDEPENDENT, superseding the 2026-07-10 §B "CTO in both families" record
      (rename history in the gate log: the area-product Tech Partner was formerly named
      "CTO" in SEAL; SEAL's CTO now denotes the product-level role). DISTINCT from :Role
      (org:Role, PAT product hierarchy only, e.g. catalog_dev_team_has_membership) AND from
      :ProductRole — do not conflate. Reached via Attribution -[:HAD_ROLE]-> TOMRole
      (prov:hadRole). Supplement: seal_ontology_supplement.cypher.

  # — Subject themes (C34, 2026-08-20; gate dcat-theme-subject-scheme DRAFTED, unsigned) —
  - label:      Theme
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      PLANNED (C34, 2026-08-20): a subject concept in scheme lob-product-team
      (config/taxonomy/lob-product-team.yaml `concept_scheme`, urn:drydocs:scheme:
      lob-product-team) — the dcat:theme target. Registered as its OWN label on the
      TOMRole / ProductRole precedent (a concept per business row, skos:exactMatch to
      the CatalogLOB / ProductLine / Product it stands for) rather than dual-typing
      those org nodes, which are business entities with owners, teams and
      applications. THE GATE MAY COLLAPSE THIS: its §B poses IS-a-Concept vs HAS-a-
      Concept; if the SME rules "is", this label retires unbuilt and HAS_THEME
      re-targets the three tiers directly. Reached via <subject> -[:HAS_THEME]-> Theme
      (dcat:theme); Theme -[:BROADER]-> Theme (skos:broader) follows the parent_*
      links so tagging at Product yields ProductLine and LOB free (§C). Never a
      DevTeam (org unit, not a subject).

  # — Business glossary (G34, 2026-08-21; RESERVATION ONLY — no term defined, no loader) —
  - label:      CatalogBusinessTerm
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      PLANNED (G34, 2026-08-21): a canonical business definition / acronym SENSE, keyed
      term_id, in a skos:ConceptScheme per scope (area | business-domain | technical-domain
      | industry). Shape from docs/patterns/data-catalog/enterprise-data-catalog-ontology.md
      §Business Glossary; the SKOS binding (prefLabel / altLabel / definition / scopeNote /
      does-NOT-mean as a skos:scopeNote) is the Idea-35 requirement MERGED into G34. The
      glossary SCHEMA (this label, its key, its edges, config/glossary/schema.yaml) is
      Internal-Public; the DEFINITIONS are Internal and live in internal/glossary/. First
      content producer: drydocs_deepdoc (epic MM) — only acronyms that correlate to what is
      being ingested; the company runs a dedicated acronym tool for everything else, and this
      label never competes with it. Registered so a port cannot collide on the name.
  - label:      CatalogValidValue
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      PLANNED (G34, 2026-08-21): an allowed enumeration value for a term, keyed value_id
      (pattern §Business Glossary). Reservation only.
  - label:      CatalogElement
    class:      "dd:CatalogElement"
    prov_type:  Entity
    note: >
      PLANNED (G34, 2026-08-21): a logical data element (field-level concept), keyed
      element_id — the thing a business term is REPRESENTED AS. Reservation only; the
      physical CatalogField / CatalogSchema half of the pattern is NOT reserved here.
  - label:      CatalogEncodingInstance
    class:      "dd:CatalogEncodingInstance"
    prov_type:  Entity
    note: >
      PLANNED (G34, 2026-08-21): the code encoding a term's value set is DEFINED FOR,
      keyed encoding_id (pattern §Business Glossary). Reservation only.

  # — Product Cabinet (K5 gate signed off 2026-07-20; supplement landed K6) —
  - label:      ProductRole
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day) —
      Product Cabinet role vocabulary, skos:Concept in scheme product_roles; EXACTLY the
      fixed 7 (area_product_owner, product_owner, product_architect, tech_partner,
      data_owner, data_certifier, analytics_lead), scheme FIXED (the tom_roles precedent —
      new roles require a new gate). NO cto member: the two role families are INDEPENDENT
      (SME 2026-07-20 — the shared-cto concept from the 2026-07-10 gate §B record is
      dropped for now; SEAL's cto stays a TOM role attributed to :BusinessApplication).
      Rename history, carried as a skos:changeNote on the tech_partner concept: in PAT the
      mapping changed slightly — the area-product Tech Partner was formerly named "CTO" in
      SEAL, and SEAL's CTO now denotes the product-level role. Scope: :Product /
      :AreaProduct only, never :BusinessApplication; area_product_owner AND tech_partner
      attach ONLY to :AreaProduct (scope property on the concepts). DISTINCT from :Role
      (org:Role, PAT product hierarchy membership) and from :TOMRole — no shared concepts,
      do not conflate. Supplement: catalog_ontology_supplement.cypher.

  # — Catalog (active) —
  - label:      CatalogLOB
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Line of business. catalog_ontology_supplement.cypher."

  # — Sub-LoB grain (C26, 2026-08-21; RESERVATION ONLY — no loader, no capture column) —
  - label:      CatalogSubLOB
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note: >
      PLANNED (C26, 2026-08-21): the Sub-LoB tier between a line of business and its
      product lines — a real, id-keyed grain at source (SME 2026-08-01: LoB, Sub-LoB,
      Product Line, Product and Area Product EACH carry a numeric id; FCDO capture
      "5-level hierarchy, native IDs at each level") that the producer does not model.
      The COMPANY already builds it as `:SubLOB {sub_lob_id}` ("only CIB and AWM have
      them"); the label is reserved here under the producer's Catalog* convention so
      the name cannot be taken by accident, and WHICH spelling survives is the C27
      gate's LABEL ruling (`:LOB` vs `:CatalogLOB`), which must be settled together
      with the S3 `app_id` KEY ruling — never one without the other. Reached via
      CatalogLOB -[:HAS_SUB_LOB]-> CatalogSubLOB (catalog_has_sub_lob, planned) and
      CatalogSubLOB -[:HAS_PRODUCT_LINE]-> ProductLine (catalog_sub_lob_has_product_line,
      planned). Divergence ledger: .claude/skills/reconcile-port/SKILL.md.

  - label:      OrgChangeEvent
    class:      "org:ChangeEvent"
    prov_type:  Activity
    note: >
      PLANNED (C28, 2026-08-25) — reservation only; the gate may decline it
      (business-layer-org-structure §B2, the one-fact-three-encodings cost).
      Reifies an organizational change (the 2Q2024 segment merge is the worked
      example) as an addressable, dated node with ORIGINAL_ORGANIZATION /
      RESULTING_ORGANIZATION edges. prov_type Activity per the W3C ORG spec's own
      PROV alignment (a change event is something that HAPPENS to organizations,
      not an agent). G98's signed two-edge-type shape already carries the fact;
      this class exists only if the SME rules the event itself worth addressing.

  - label:      Company
    class:      "org:FormalOrganization"
    prov_type:  Agent
    note: >
      The corporate parent of BusinessSegment. Registered 2026-08-17 at gate
      corporate-backbone-vocabulary §A1 (SIGNED 19/19) — the SAME class as its
      own child below, on the same reasoning: org:FormalOrganization is the more
      precise term for a legally-recognized organization, which
      "JPMorgan Chase & Co." is. org:Organization was offered and declined.
      LATE, NOT RETIRED-AND-RESTORED: (:Company) has been MERGEd by
      ontology.cypher since M0 with a live uniqueness constraint
      (constraints.cypher:29), and `git log -S "Company"` over this directory
      returns nothing — it was simply never registered. Exactly the
      ControlMApplication case closed on 2026-07-09 (the edge registered without
      its node), arriving from the other direction: here the NODE was seeded and
      neither it nor its edges were declared.
      §C1 RULED THE CLASS STAYS: one instance is a property of THIS deployment,
      not of the model — another deployment seeds its own. §C2 ruled the instance
      stays SEED DATA in ontology.cypher rather than config-resolved, so a
      consuming deployment inherits this company's name in its bootstrap until
      it edits the file; that cost is accepted on the record, not overlooked.
      §A5 RULED name STAYS THE KEY, and the key is an ABBREVIATION: "JPMC" is
      the short name of JP Morgan Chase, legal_name carries
      "JPMorgan Chase & Co.", and the common name is in the gate log and NOT in
      the graph — A5(ii) was not taken up. ontology.cypher.

  - label:      BusinessSegment
    class:      "org:FormalOrganization"
    prov_type:  Agent
    note: >
      Corporate segment. Doc says org:FormalOrganization; supplement comment
      says org:Organization. FormalOrganization (legally-recognized org)
      adopted as the more precise valid term.

  - label:      ServiceNowGroup
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note: >
      A ServiceNow assignment group — the ITSM support unit technicians belong to.
      Same class as :DevTeam: both are organizational units that hold people in
      roles, and modelling them alike is what lets one :Employee carry PAT, SEAL
      and ITSM roles off one backbone. Registered at G100 (2026-08-18) with the
      staffing edges, never an edge whose node class is unclassified (the
      ControlMApplication lesson, 2026-07-09).
      SOURCED OOTB: ServiceNow ships the group in sys_user_group, its membership in
      sys_user_grmember and the person in sys_user — no custom table is required for
      the producer-side lookup.

  - label:      SnowRole
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      The ITSM support-role register a technician holds within an assignment group —
      the ITSM sibling of TOMRole (SEAL) and ProductRole (Product Cabinet), and a
      skos:Concept for the same reason both of those are.
      A SEPARATE REGISTER ON PURPOSE, not a reuse of :Role: :Role now carries the PAT
      ENGINEERING roles (G91 entry 5), while these are SUPPORT-TIER roles. SME
      direction 2026-08-18: developers map to SENG, production support to ASUP.
      Concepts stay proposed until the ITSM gate signs; nothing loads.

  - label:      DevTeam
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Development team. catalog_ontology_supplement.cypher."

  - label:      ProductLine
    class:      "dd:ProductLine"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      Product
    class:      "dd:Product"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      JiraBoard
    class:      "dd:JiraBoard"
    prov_type:  Entity
    note:       "Planning tool artifact; local."

  - label:      AreaProduct
    class:      "dd:AreaProduct"
    prov_type:  Entity
    note:       "Area Product Group / Team of Teams. Intermediate between Product and DevTeam in the PAT hierarchy. catalog_ontology_supplement.cypher."

  # — Architecture flow (Section 4, normalized from pre-ontology diagram) —
