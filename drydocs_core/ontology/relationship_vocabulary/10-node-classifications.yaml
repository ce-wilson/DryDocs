  # ── Epic U / self-documentation (gate self-documentation-code-graph, SIGNED 2026-07-27)
  - label: Project
    class: "dd:Project"
    prov_type: Collection
    note: >
      A source-code repository loaded into the graph as itself. ONE root per repo
      (gate §B1(a)): (:Project {project_id:'drydocs'}). The snapshot's six scan roots
      (drydocs, drydocs_core, drydocs_deepdoc, drydocs_lineage, drydocs_remediation,
      tests) are a `project` PROPERTY on :CodeModule, NOT sibling Project nodes.
      prov:Collection because it collects its modules. This is the anchor that makes
      "is this our own code?" one hop, and §F2 ruled nothing else may hang off it.
      Reads unambiguously against the PAT :Product/:AreaProduct/:ProductLine labels
      (§F3): those name a BUSINESS product hierarchy, this names a SOFTWARE repo.
  - label: CodeModule
    class: "dd:CodeModule"
    prov_type: Entity
    note: >
      One source FILE, keyed on file_id (repo-relative path, e.g.
      'drydocs_core/models/seal.py'). Gate §C1(a): one file = one module. True
      dotted-module grain was REJECTED — drydocs/loaders/__init__.py IS the package
      `drydocs.loaders`, which is also the directory name, so module-grain collapses
      file identity into package identity across all 15 __init__.py files.
      file_id is the ONLY non-colliding key: `name` collides 15 ways on '__init__.py'
      and `rel_path` collides across the drydocs / drydocs_core roots (§C4).
      MUST NEVER also carry :SoftwareProduct — §F1, enforced as a graph-test because
      Neo4j cannot declare label mutual-exclusion.
      SCOPE (SME ruling 2026-08-06, two parts same day): BINARY ASSETS — images
      (.png/.svg/.webp/...) and, on revisit, fonts (.ttf/.woff/...) — are not
      code-graph content; both snapshot loaders skip them (counted +
      CLI-reported; ASSET_EXTENSIONS_SKIPPED in drydocs/loaders/code_snapshot.py).
      A third asset class would be a new ruling, not a list edit. The snapshot
      artifact still carries them; the graph declines to model them.
  - label: CodeDirectory
    class: "dd:CodeDirectory"
    prov_type: Collection
    note: >
      One source-tree DIRECTORY, keyed on file_id (repo-relative path) — shares
      the CodeModule key space because a path is a dir or a file, never both.
      prov:Collection: it collects its entries (u2_contains_entry). SME RULING
      2026-08-05 (direct in-session instruction): admits the containment tree
      the G33 gate deferred (":Directory nodes and CONTAINS edges are a gate
      decision"). The repo ROOT directory is NOT a CodeDirectory — the tree
      loader maps it onto the existing single :Project node, so gate §B1(a)
      (one root, nothing else hangs off it) holds unchanged.

  # — Infrastructure / server location (Epic Z; gate server-location-ontology SIGNED OFF 12/12, 2026-08-19) —
  - label: Server
    class: "dd:Server"
    prov_type: n/a
    note: >
      RULED at gate server-location-ontology §A1 (SIGNED 2026-08-19): a PHYSICAL/VIRTUAL server from
      the infrastructure site's per-application export (infra:server-export) —
      the INVENTORY backbone. Deliberately distinct from THREE near-neighbors, and
      the distinctions are the point: (1) ExecutionHost is Control-M's VIEW of
      a host (prov:SoftwareAgent, keyed on nodeid; may be an LB alias) — the
      two join ONLY via infra_resolves_to_server's evidence-carrying edge,
      never by minting one node from two sources; (2) ControlMServer is a
      SCHEDULER INSTANCE (P12 …), not hardware; (3) ControlMHostGroup is a
      load-balancing set. Local infrastructure class, no W3C equivalent
      (ControlMServer precedent); prov_type n/a — placement edges carry no
      PROV mapping (the RUNS_ON family precedent). Carries designation
      (PROD | DR — property, not node, ruled §A3) and the os_product /
      os_version pair as plain properties (§A2; the software-registry OS row
      is a recorded follow-up direction, not built).

  - label: DataCenter
    class: "dd:DataCenter"
    prov_type: n/a
    note: >
      RULED at gate server-location-ontology §B1/§B2/§B4 (SIGNED 2026-08-19): a PHYSICAL data
      center/building — functions as the prov:Location target of
      infra_located_in (prov:atLocation). Carries the geography ladder as
      properties (building, city, state, country) plus location_grain, the
      Idea-90 mixed-grain declaration (name the finest level the source
      supplied; imply nothing). NEVER the Control-M "data center": CM_HOSTS.
      DATA_CENTER and the ControlMServer/ControlMHostGroup DC keys are
      SCHEDULING concepts (default-run-time grammar) — the Epic Z standing
      caution fences the two apart, and no crosswalk joins them by field name.
