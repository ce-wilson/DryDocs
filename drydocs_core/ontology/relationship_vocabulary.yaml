# =============================================================================
# relationship_vocabulary.yaml  —  DryDocs relationship registry
#
# SECTION 0 (node_classifications): every node label in the graph mapped to a
#   CURIE that expands via drydocs_core/ontology/namespaces.py. All local labels
#   live under dd: (https://drydocs.local/ontology#).
#
# SECTION 0b (property_terms): property-level standard-term bindings (what a
#   node PROPERTY means — e.g. the audit envelope's dct: bindings, gate
#   envelope-property-terms 2026-08-04). Documentation-grade; no edges.
#
# SECTION 1 (prov_matrix): the 9-row decision table. Stable — do not edit.
#   Pick the row whose from_type/to_type matches your node classifications.
#   The neo4j_label in that row is what you use in Cypher, unless a more
#   specific existing label is already established (see local_relationships).
#
# SECTION 2 (local_relationships): one entry per declared relationship.
#   Add here BEFORE writing any Cypher. Status lifecycle:
#     planned    → declared but loader not yet written
#     active     → supplement + loader both exist
#     deprecated → no longer loaded; data kept in graph
#     removed    → data and code both deleted
#
# Fields:
#   id            unique snake_case identifier
#   neo4j_label   the Cypher relationship type
#   inverse_label target-side display phrasing (SUPPORTS -> "supported by"),
#                 read as "<target> <inverse_label> <source>". PRESENTATIONAL
#                 ONLY (C15, 2026-07-28): changes no direction, type, status,
#                 or semantics; storage stays ONE directed edge; explicitly
#                 not a gate matter. Presence enforced by test_schema.py.
#   role          edge property for disambiguation (null = label is sufficient)
#   from_node     source node label
#   to_node       target node label
#   prov_maps_to  PROV-O term this maps to (null = local-only or non-PROV standard)
#   sosa_maps_to  SOSA/SSN term this maps to (experimental context-graph edges only)
#   note          plain-English description + any gotchas
#   supplement    schema file where LocalRelationship is declared (null = base PROV-O)
#   loader        cypher file that writes this relationship
#   domain        controlm | seal | catalog | architecture | context | all
#   status        planned | active | deprecated | removed
#
# EXPERIMENTAL / early adoption: SOSA/SSN (domain: context) terms are W3C but
# NOT a declared *company* standard. They are seeded only by the opt-in
# sosa_experimental_supplement.cypher and tagged adoption:"experimental" in the
# graph. They use status: planned here until the SME confirms via the gate.
#
# Sync history: updated 2026-06-09 from DryDocs Consolidated Documentation
# (Sections 1–4, 6). Corrections applied during that audit:
#   * Membership was documented as "prov:Membership" — no such class exists in
#     PROV-O. Corrected to org:Membership (matches seal_ontology_supplement).
#   * BusinessSegment: doc says org:FormalOrganization; the catalog supplement
#     says org:Organization. Both are valid ORG classes; org:FormalOrganization
#     is the more precise term and is adopted here. Update the supplement
#     comment when convenient.
#   * RUNS_ON (ControlMFolder→ControlMServer) renamed SCHEDULED_ON; the RUNS_ON
#     label is reassigned to execution-host placement (see m3_runs_on_* below).
#   * Section 4 mermaid edges (develops / owns / stored_in / contains /
#     DEPENDS_ON) pre-date the ontology and are normalized to
#     SCREAMING_SNAKE labels with PROV-O mappings where the matrix allows.
# =============================================================================


# ── SECTION 0: Node classifications ──────────────────────────────────────────
# class       = primary OWL/RDFS class (CURIE resolvable via namespaces.py)
# prov_type   = PROV-O behavioural type used to drive the SECTION 1 matrix
#               (Activity | Entity | Collection | Agent | n/a)
# All dd:* classes must be MERGEd as :OntologyTerm:LocalClass in a supplement.
# ─────────────────────────────────────────────────────────────────────────────
node_classifications:

  # — Control-M (M3, active) —
  - label:      ControlMJob
    class:      "dd:ControlMJob"
    prov_type:  Activity
    note:       "Job definition; acts as a prov:Activity at runtime. ontology_supplement.cypher."

  - label:      ControlMFolder
    class:      "dd:ControlMFolder"
    prov_type:  Collection
    note:       "prov:Collection of jobs. ontology_supplement.cypher."

  - label:      ControlMApplication
    class:      "dd:ControlMApplication"
    prov_type:  Collection
    note: >
      Control-M APPLICATION grouping from the folder HEADER ROW in CM_DEF_VJOB
      (JOB_ID=1) — deliberately NOT the business :BusinessApplication / SEAL concept.
      prov:Collection of ControlMFolder (see m3_contains_folder). Written in
      the FOLDER pass. SME gate controlm-q1q3-phase1 (2026-07-07); entry added
      2026-07-09 to close the node_classifications gap (the edge was
      registered without its node). ontology_supplement.cypher.

  - label:      ControlMServer
    class:      "dd:ControlMServer"
    prov_type:  n/a
    note: >
      Local platform/infrastructure class — no W3C equivalent. NOT an Agent:
      edges targeting it cannot use prov:wasAssociatedWith (see p2_deployed_to).
      ontology_supplement.cypher.

  - label:      Condition
    class:      "dd:Condition"
    prov_type:  Entity
    note:       "Named scheduling condition (prov:Entity). ontology_supplement.cypher."

  - label:      JobRun
    class:      "dd:JobRun"
    prov_type:  Activity
    note: >
      Loader-run provenance activity (base ontology). Distinct from
      ControlMJobRun (phase-2 runtime execution) — do not merge the labels.

  # — Control-M phase 2 (planned) —
  - label:      ControlMJobRun
    class:      "dd:ControlMJobRun"
    prov_type:  Activity
    note:       "One actual execution of a ControlMJob, from the Control-M history API."

  - label:      Deployment
    class:      "dd:Deployment"
    prov_type:  Activity
    note:       "CI/CD deployment activity that ships folder XML to a server."

  - label:      Developer
    class:      "prov:Person"
    prov_type:  Agent
    note: >
      Human author from Git blame / change records. Likely the same individual
      as an Employee node (SEAL); reconcile by SID when both feeds are loaded.

  - label:      AppUser
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note:       "Service account / FID that jobs run as (EPV, Run-as-User)."

  - label:      Script
    class:      "dd:Script"
    prov_type:  Entity
    note: >
      Invocable artifact (placement JAR + Task-JSON). prov:Entity; also a
      prov:Plan in the wasAssociatedWith(hadPlan) pattern. Finer software
      typing available via swo: if ever required.

  - label:      ETLProcess
    class:      "dd:ETLProcess"
    prov_type:  Activity
    note:       "AWS-side ingestion/transformation workload (Glue / DPL). obi: offers a data-transformation class if a standards mapping is later required."

  - label:      ExecutionHost
    class:      "prov:SoftwareAgent"
    prov_type:  Agent
    note: >
      Agent host / ETL cluster entry point. Classified as SoftwareAgent
      (not pure infrastructure) so that AppUser -[:DELEGATES_TO]->
      ExecutionHost can legally map to prov:actedOnBehalfOf, which requires
      Agent → Agent. Local subclass dd:ExecutionHost.

  - label:      ControlMHostGroup
    class:      "dd:ControlMHostGroup"
    prov_type:  Collection
    note: >
      Gate controlm-hosts-topology CONFIRMED 2026-07-09 (config/gate-log.md): a
      Control-M host group / node group (vendor 6.4.01 poster: CMS_NODGRP;
      replica: psgmgr CM_HOSTS) — the load-balancing set of agent hosts a
      job's NODE_ID can resolve to; the group name may itself be a DNS/LB
      alias. Key (data_center, name); members are ExecutionHost nodes.
      Deliberately NOT named "ControlMGroup": CM_DEF_VJOB.GROUP_NAME
      (ControlMJob.group_name) is the application-group concept — a different
      thing entirely; "host group" is the 9.0.x vendor term.

  - label:      DataSource
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      RETIRED 2026-07-15 (lineage rel vocabulary gate, config/gate-log.md):
      superseded by DataAsset — the READS_FROM edge direction already
      encodes the source role. Kept for audit; no loader ever shipped.
      Was: read-side dataset (source zone + Glue database).

  - label:      DataTarget
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      RETIRED 2026-07-15 (lineage rel vocabulary gate, config/gate-log.md):
      superseded by DataAsset — the WRITES_TO edge direction already
      encodes the target role. Kept for audit; no loader ever shipped.
      Was: write-side dataset (target zone / bucket / partitions).

  - label:      DataAsset
    class:      "dcat:Dataset"
    prov_type:  Entity
    note: >
      Added at the lineage rel vocabulary gate 2026-07-15: the D1 proxy
      shape — a piece of data a process reads or writes (hdfs / s3 /
      hive_table / local_file / Glue table, …), keyed on assetId
      (urn:drydocs:dataasset:{platform}:{namespace}:{name};
      provisioning/02_proxy_constraints.cypher — constrained in all three
      data DBs so the ddall composite joins on it). Replaces the retired
      DataSource / DataTarget pair as the to-node of m3_reads_from /
      m3_writes_to.

  # — SEAL (active) —
  - label:      BusinessApplication
    class:      "prov:Entity"
    dual_class: "dprod:DataProduct"
    prov_type:  Entity
    note: >
      SEAL-registered application (a data-product/asset record). seal_ontology_supplement.cypher.
      RECLASSED + RENAMED (K4, 2026-07-15) per the BusinessApplication entity-reshape gate
      §A + label decision (config/gate-log.md 2026-07-10, SME chad.wilson): was label
      Application, class prov:SoftwareAgent/Agent. The old typing carried three incompatible
      PROV types at once (SoftwareAgent here; dprod:Port children = Entity semantics;
      org:Membership role-holders = Organization semantics). Label :Application →
      :BusinessApplication normalized across vocabulary, schema supplements, loaders,
      constraints (businessapplication_*), and tests in the same K4 change.

  - label:      Employee
    class:      "prov:Agent"
    prov_type:  Agent
    note:       "Person holding a role membership. seal_ontology_supplement.cypher."

  - label:      Membership
    class:      "org:Membership"
    prov_type:  n/a
    note: >
      CORRECTED: consolidated doc listed "prov:Membership", which does not
      exist in PROV-O. The W3C ORG ontology owns this class (org:Membership),
      matching seal_ontology_supplement.cypher. n-ary relation node, not a
      PROV participant.

  - label:      Role
    class:      "org:Role"
    prov_type:  n/a
    note:       "Named role in a membership. seal_ontology_supplement.cypher."

  - label:      Port
    class:      "dprod:Port"
    prov_type:  Entity
    note:       "Data port (EventProcessing / BatchProcessing). dprod namespace is the EKGF working default pending the corporate IRI."

  # — SEAL reshape (ACTIVE at K4, 2026-07-15 — gate 2026-07-10 §B) —
  # (seal_had_primary_source targets :Document — declared ONCE in the docs-corpus section
  # below; the duplicate SEAL-reshape Document entry was merged into it 2026-07-09,
  # tech-debt audit F4 — one label, one classification entry.)

  - label:      Attribution
    class:      "prov:Attribution"
    prov_type:  n/a
    note: >
      ACTIVE (K4, 2026-07-15): reified n-ary node for the SEAL Technical Operating Model (TOM)
      qualified-attribution pattern — BusinessApplication -[:QUALIFIED_ATTRIBUTION]-> Attribution
      -[:HAS_AGENT]-> Employee, Attribution -[:HAD_ROLE]-> TOMRole. Same pattern family as
      org:Membership (n-ary relation node, not itself a PROV participant — prov:Attribution
      rdfs:subClassOf prov:Influence). Supplement: seal_ontology_supplement.cypher. For
      operate_manager the level (L1|L2) is a property on THIS node.

  - label:      TOMRole
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      ACTIVE (K4, 2026-07-15): SEAL Technical Operating Model role vocabulary — skos:Concept
      in scheme tom_roles (SkosConceptScheme), the gate §B REVISED fixed 7: application_owner,
      primary_information_owner, backup_information_owner, cto, technology_risk_controls,
      design_authority, operate_manager (L1/L2 = Attribution property). cto is NOT shared
      with the K5 ProductRole scheme — the K5 gate (signed off 2026-07-20) decided the two
      families are INDEPENDENT, superseding the 2026-07-10 §B "CTO in both families" record
      (rename history in the gate log: the area-product Tech Partner was formerly named
      "CTO" in SEAL; SEAL's CTO now denotes the product-level role). DISTINCT from :Role
      (org:Role, PAT product hierarchy only, e.g. catalog_dev_team_has_membership) AND from
      :ProductRole — do not conflate. Reached via Attribution -[:HAD_ROLE]-> TOMRole
      (prov:hadRole). Supplement: seal_ontology_supplement.cypher.

  # — Product Cabinet (K5 gate signed off 2026-07-20; supplement landed K6) —
  - label:      ProductRole
    class:      "skos:Concept"
    prov_type:  n/a
    note: >
      ACTIVE (K6, 2026-07-20; gate product-cabinet-attribution signed off same day) —
      Product Cabinet role vocabulary, skos:Concept in scheme product_roles; EXACTLY the
      fixed 7 (area_product_owner, product_owner, product_architect, tech_partner,
      data_owner, data_certifier, analytics_lead), scheme FIXED (the tom_roles precedent —
      new roles require a new gate). NO cto member: the two role families are INDEPENDENT
      (SME 2026-07-20 — the shared-cto concept from the 2026-07-10 gate §B record is
      dropped for now; SEAL's cto stays a TOM role attributed to :BusinessApplication).
      Rename history, carried as a skos:changeNote on the tech_partner concept: in PAT the
      mapping changed slightly — the area-product Tech Partner was formerly named "CTO" in
      SEAL, and SEAL's CTO now denotes the product-level role. Scope: :Product /
      :AreaProduct only, never :BusinessApplication; area_product_owner AND tech_partner
      attach ONLY to :AreaProduct (scope property on the concepts). DISTINCT from :Role
      (org:Role, PAT product hierarchy membership) and from :TOMRole — no shared concepts,
      do not conflate. Supplement: catalog_ontology_supplement.cypher.

  # — Catalog (active) —
  - label:      CatalogLOB
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Line of business. catalog_ontology_supplement.cypher."

  - label:      BusinessSegment
    class:      "org:FormalOrganization"
    prov_type:  Agent
    note: >
      Corporate segment. Doc says org:FormalOrganization; supplement comment
      says org:Organization. FormalOrganization (legally-recognized org)
      adopted as the more precise valid term.

  - label:      DevTeam
    class:      "org:OrganizationalUnit"
    prov_type:  Agent
    note:       "Development team. catalog_ontology_supplement.cypher."

  - label:      ProductLine
    class:      "dd:ProductLine"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      Product
    class:      "dd:Product"
    prov_type:  Entity
    note:       "Local catalog hierarchy; no W3C equivalent."

  - label:      JiraBoard
    class:      "dd:JiraBoard"
    prov_type:  Entity
    note:       "Planning tool artifact; local."

  - label:      AreaProduct
    class:      "dd:AreaProduct"
    prov_type:  Entity
    note:       "Area Product Group / Team of Teams. Intermediate between Product and DevTeam in the PAT hierarchy. catalog_ontology_supplement.cypher."

  # — Architecture flow (Section 4, normalized from pre-ontology diagram) —
  - label:      Code
    class:      "dd:Code"
    prov_type:  Collection
    note:       "Codebase/repo content owned by a DevTeam; prov:Collection of PipelineService members."

  - label:      Bitbucket
    class:      "dd:CodeRepository"
    prov_type:  Entity
    note: >
      Repository hosting location. Candidate prov:Location if STORED_IN is
      ever mapped to prov:atLocation; kept local for now.

  - label:      PipelineService
    class:      "dd:PipelineService"
    prov_type:  Entity
    note:       "Deployable pipeline service definition inside a codebase."

  - label:      Batch
    class:      "dd:Batch"
    prov_type:  Collection
    note:       "Logical batch grouping between Application and Control-M folders."

  - label:      File
    class:      "dd:File"
    prov_type:  Entity
    note:       "File delivered via MFTS agent (fmSubPathId); job input dependency."

  # — Software registry (plan 07, gated 2026-07-07) —
  - label:      Vendor
    class:      "org:Organization"
    prov_type:  Agent
    note:       "Third-party software company/brand ONLY (ADR 0004). Ids shared with drydocs-icons manifest. registry_ontology_supplement.cypher."

  - label:      SoftwareProduct
    class:      "dd:SoftwareProduct"
    prov_type:  Entity
    note:       "What a Vendor ships (Control-M, Neo4j, Oracle DB). role attribute (orchestrator|data-platform|graph-platform|tool) absorbs the Tier-1/Tier-2 split. registry_ontology_supplement.cypher."

  # — Docs corpus (lexical graph, llm-graph-builder pattern) — GATE-BOUND ————
  - label:      Document
    class:      "prov:Entity"
    prov_type:  Entity
    note: >
      A converted external/internal document (first corpus: bmc-docs, the 26
      converted BMC Control-M pages). Carries source_url + scraped_on +
      trust_default; NOT a source-of-record — the SOURCE-MANIFEST provenance
      model governs. Gate: bmc-docs-lexical-load (accepted 2026-07-08).
      THE single :Document classification (dedupe 2026-07-09, tech-debt audit
      F4): also covers the SEAL-reshape / drydocs-docmeta use — a scraped
      SEAL/PAT source page targeted by seal_had_primary_source
      (prov:hadPrimarySource type-checks Entity -> Entity against this
      entry); that use stays PROPOSED until docmeta is built and gated.
      Lands beside the software registry so DESCRIBES can reach
      :SoftwareProduct in-database.

  - label:      Chunk
    class:      "prov:Entity"
    prov_type:  Entity
    note: >
      A section-level slice of a Document (H2 chunking, deterministic — no
      LLM). Carries provenance tier VERBATIM|GROUNDED|SYNTHESIZED per the
      corpus SOURCE-MANIFEST default rule; SYNTHESIZED chunks are Claude
      inference and never vendor ground truth. Gate: bmc-docs-lexical-load.

  - label:      DocSource
    class:      "prov:Entity"
    prov_type:  Entity
    note: >
      A registered document source (one config/doc-source-registry.yaml entry
      materialized as a node) — DCAT-catalog-shaped: the thing a Document
      belongs to, carrying connector/classification/tier/curation defaults.
      Registered PLANNED at the Q4 docmeta gate (ADR 0006, 2026-07-18); built
      by the docmeta component (plan P4+), nothing loads it today.

  # — Documentation traceability + review feedback (PROPOSED, backlog L7) ——————
  # Registered for the doc-traceability-feedback gate
  # (config/gate-prompts/doc-traceability-feedback.yaml). PRODUCT-PLANE family (SaaS
  # reframe, SME direction 2026-07-20): these classes define the generic documentation
  # ontology — a requirement proposition, an authored document, a review annotation —
  # from ANY registered source. DryDocs' own outline system (docs/design/*.md +
  # docs/design/templates/*.outline.yaml + docs/design/feedback/*.yaml) is SOURCE
  # CONNECTOR #1, the reference implementation ("tenant 0" — the app documenting
  # itself); the Full Circle / incremental-context-loop connectors
  # (SDLC-Docs/extracted/plan-incrementalContextLoop.prompt.md: Jira, Gherkin/BDD, BRD)
  # feed the SAME classes later. Boundary vs the "Docs corpus" block above
  # (Document/Chunk/DocSource): MANAGED vs INGESTED content — DesignDoc/DocSection are
  # authored, rev-tracked, outline-validated, annotatable (lifecycle the platform
  # enforces); Document/Chunk are scraped/uploaded, H2-chunked, trust-tiered (witnessed,
  # not governed). That split is a product boundary, not a temporary convenience — see
  # the gate prompt section A. Gate doc-traceability-feedback SIGNED OFF 2026-07-20 —
  # all six classes ACTIVE; supplement terms in ontology_supplement.cypher (K6-style
  # same-day landing; config/gate-log.md).

  - label:      DesignDoc
    class:      "dd:DesignDoc"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md,
      all 21 confirmations A1-A7/B1-B4/C1-C4/D1-D7). One MANAGED (authored,
      rev-tracked, outline-validated) document from any registered source — the
      product-plane counterpart of the ingested :Document. Carries doc_id, doc_type,
      rev, status, commit, origin (which source connector produced it). Keying is
      SOURCE-NAMESPACED: doc_id alone is unique only within one source/repo, so the
      node key is (origin, doc_id) — never a bare filename stem (single-repo assumption
      rejected at the SaaS reframe). Connector #1: docs/design/<doc_id>.md conforming
      to docs/design/templates/*.outline.yaml (schema drydocs.doc-outline.v1), doc_id =
      filename stem, origin = drydocs-design-docs. Kept DISTINCT from :Document on the
      managed-vs-ingested product boundary (family header above); display label joins
      the SaaS terminology-rename surface (knowledge/upgrade-plans/
      generic-terminology-research.md) — internal label stays stable.

  - label:      DocSection
    class:      "dd:DocSection"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md). One AUTHORED section of a DesignDoc, keyed
      (origin, doc_id, anchor) — the stable anchor id namespace the source connector
      guarantees. Carries anchor, heading, required. Connector #1: the
      `<!-- anchor: id -->` ids (drydocs/doc_outline.py ANCHOR_RE) plus L11
      content-derived subsection ids (`<authored-anchor>--<subsection-slug>`). Distinct
      from :Chunk (ingested/H2-chunked) per the managed-vs-ingested boundary. DocSection
      is the shared target of both traceability (Requirement -[:SPECIFIED_IN]->) and
      review feedback (FeedbackNote -[:ANNOTATES]->).

  - label:      Requirement
    class:      "dd:Requirement"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md). One requirement/capability PROPOSITION from any registered
      source — the graph-side anchor of the traceability star (SPECIFIED_IN /
      IMPLEMENTED_BY / VERIFIED_BY). Carries requirement_id, kind (FR|UC|NFR today —
      use cases fold in as kind=UC until a future BDD gate decides whether Scenario
      splits out), description, matrix_status, origin. The id FORMAT is per-source
      configuration, not a global rule (each source/tenant has its own convention:
      FR-*, REQ-*, Jira keys) — connector #1's pattern is tdd.outline.yaml's
      requirement_id_pattern `^(FR|UC|NFR)-[A-Z0-9]+-\d+$`, currently mode: loose.
      Future connectors per the incremental-context-loop plan: Jira stories, Gherkin
      scenarios, BRD checklist rows ("fill the requirements gaps for context").

  - label:      Component
    class:      "dd:Component"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md). An implementation artifact (file, module, CLI command,
      proc/table) cited by a requirement source as the concrete realization of a
      Requirement. Keying is SOURCE/REPO-NAMESPACED — a bare path string collides the
      moment there are two repos or tenants, so the key is (origin, ref); same-basename
      ambiguity within one origin stays an SME-merge case (the m3_invokes :Script
      precedent). NO existing node class fit (grepped relationship_vocabulary.yaml +
      drydocs_core/schema/*.cypher for Module/Component/Test: none). Nearest existing
      Entity classes rejected: :Script (Control-M job-invocation lineage) and
      :PipelineService (service granularity) — a future gate may fold them under
      Component or vice versa; flagged, not decided, here.

  - label:      TestCase
    class:      "dd:TestCase"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md). One test/verification citation proving a Requirement.
      Carries kind — an OPEN enum (unit|verify|gate|graph-test observed in connector
      #1's matrices; gherkin-scenario, jira-acceptance anticipated from the
      context-loop connectors — deliberately NOT a fixed skos scheme while sources are
      still being onboarded) — plus ref (the literal citation string) and origin.
      Connector #1 spans pytest ids, m1/m3-verify invariant names, graph-tests/*.yaml
      checks, and HITL gate names in one table (docs/design/controlm-ingestion-tdd.md).

  - label:      FeedbackNote
    class:      "dd:FeedbackNote"
    prov_type:  Entity
    note: >
      ACTIVE (L7, gate doc-traceability-feedback signed off 2026-07-20, config/gate-log.md). One anchor-keyed annotation from a REVIEW WORKFLOW — a
      product feature, not a vendor-internal convenience (the HITL loop is tenant 0).
      Carries anchor, note (text), doc_id, doc_rev (the rev the note was taken AGAINST,
      which may trail the DesignDoc's current rev), origin, and lifecycle status
      (open|applied|rejected|superseded — the drydocs-startup-refresh-runbook rev1 ->
      Rev 2 loop is the worked precedent: notes were APPLIED and the doc says so).
      Connector #1: docs/design/feedback/<doc_id>-rev<N>.yaml rows (schema
      drydocs.design_doc.feedback_yaml), doc_rev parsed from the filename. prov:Entity
      per the docs_describes "aboutness" precedent (an annotation is not a derivation
      of its target); W3C Web Annotation (oa:) alignment flagged in gate section D —
      heavier under the SaaS lens (annotation export/interop), still deferred.

  # — Context graph (SOSA/SSN, EXPERIMENTAL / early adoption) ————————————————
  # SOSA/SSN is a W3C standard but NOT a declared *company* standard. These
  # classes are seeded only by the opt-in sosa_experimental_supplement.cypher
  # (never by `drydocs bootstrap`); every graph term carries adoption:
  # "experimental". prov_type below is the natural behavioural fit so the PROV
  # matrix still works if needed, but the SOSA class is primary here. The wiring
  # of these to ControlMJobRun is the open gate decision — see the
  # `jobrun-observation` entry in config/taxonomy-ontology-map.yaml.
  - label:      Observation
    class:      "sosa:Observation"
    prov_type:  Activity
    note:       "EXPERIMENTAL. A single health/run reading about a job/folder. sosa_experimental_supplement.cypher."

  - label:      Sensor
    class:      "sosa:Sensor"
    prov_type:  Agent
    note:       "EXPERIMENTAL. Monitoring source (Control-M history API, health probe). sosa_experimental_supplement.cypher."

  - label:      Result
    class:      "sosa:Result"
    prov_type:  Entity
    note:       "EXPERIMENTAL. Value an observation produced; may carry a dqv:QualityMeasurement. sosa_experimental_supplement.cypher."

  - label:      ObservableProperty
    class:      "sosa:ObservableProperty"
    prov_type:  Entity
    note:       "EXPERIMENTAL. What is observed: run-status, run-duration, exit-status, freshness. sosa_experimental_supplement.cypher."

  # NOTE: ControlMJob and ControlMFolder (declared above as prov:Activity / Collection)
  # ALSO act as sosa:FeatureOfInterest — an orthogonal context-graph role recorded
  # via :CAN_ACT_AS in the supplement. Their primary classification is unchanged.


  # ── Epic U / self-documentation (gate self-documentation-code-graph, SIGNED 2026-07-27)
  - label: Project
    class: "dd:Project"
    prov_type: Collection
    note: >
      A source-code repository loaded into the graph as itself. ONE root per repo
      (gate §B1(a)): (:Project {project_id:'drydocs'}). The snapshot's six scan roots
      (drydocs, drydocs_core, drydocs_deepdoc, drydocs_lineage, drydocs_remediation,
      tests) are a `project` PROPERTY on :CodeModule, NOT sibling Project nodes.
      prov:Collection because it collects its modules. This is the anchor that makes
      "is this our own code?" one hop, and §F2 ruled nothing else may hang off it.
      Reads unambiguously against the PAT :Product/:AreaProduct/:ProductLine labels
      (§F3): those name a BUSINESS product hierarchy, this names a SOFTWARE repo.
  - label: CodeModule
    class: "dd:CodeModule"
    prov_type: Entity
    note: >
      One source FILE, keyed on file_id (repo-relative path, e.g.
      'drydocs_core/models/seal.py'). Gate §C1(a): one file = one module. True
      dotted-module grain was REJECTED — drydocs/loaders/__init__.py IS the package
      `drydocs.loaders`, which is also the directory name, so module-grain collapses
      file identity into package identity across all 15 __init__.py files.
      file_id is the ONLY non-colliding key: `name` collides 15 ways on '__init__.py'
      and `rel_path` collides across the drydocs / drydocs_core roots (§C4).
      MUST NEVER also carry :SoftwareProduct — §F1, enforced as a graph-test because
      Neo4j cannot declare label mutual-exclusion.

# ── SECTION 0b: Property-term bindings ───────────────────────────────────────
# Property-level standard-term bindings — what a node PROPERTY means in
# standard vocabulary. Documentation-grade (crosswalks, future RDF export):
# no edges, no loaders, no renames of the bound property names. First entries
# ruled at gate envelope-property-terms (2026-08-04, M4), which also ruled
# that this section — not a separate file — is where property bindings live
# (the file already carries node_classifications, so it is the ontology
# registry, not literally a relationship list). SOSA explicitly ruled OUT for
# the envelope: authorship provenance is not observation.
# property    = the graph property name (frozen names never renamed here)
# term        = standard-term CURIE, resolvable via namespaces.py expand()
# decided_by  = gate id in config/gate-log.md
# ─────────────────────────────────────────────────────────────────────────────
property_terms:

  # — the source audit envelope (config/audit-fields.yaml, doc 06) —
  - property:   source_created_by
    term:       "dct:creator"
    decided_by: envelope-property-terms
    note:       "Who created the record in the source system. dct:creator does not require personhood — on Control-M this is a team Functional ID, an org-agent creator, which is conformant."

  - property:   source_created_at
    term:       "dct:created"
    decided_by: envelope-property-terms
    note:       "Date the record was created in the source system ('date of creation of the resource')."

  - property:   source_updated_by
    term:       "dct:contributor"
    decided_by: envelope-property-terms
    note:       "Who last changed the record in the source system. NEAREST DCMI term — DCMI defines no 'modifier'; the imprecision is recorded here by ruling (gate §B2) rather than mixing in a PROV edge-shaped reading for one property."

  - property:   source_updated_at
    term:       "dct:modified"
    decided_by: envelope-property-terms
    note:       "Date the record was last changed in the source system ('date on which the resource was changed')."

# ── SECTION 1: Decision matrix ────────────────────────────────────────────────
# Step 1: classify your source node (Activity / Entity / Agent / Collection).
# Step 2: classify your target node.
# Step 3: read the neo4j_label. Add a `role` property if the same label is
#         used in multiple contexts (e.g., USED {role: "reads_config"}).
# ─────────────────────────────────────────────────────────────────────────────
prov_matrix:

  - from_type:   Activity
    to_type:     Activity
    prov_term:   "prov:wasInformedBy"
    neo4j_label: WAS_INFORMED_BY
    note: >
      One activity's execution depended on outputs produced by another.
      Examples: ControlMJob waiting on a predecessor job's OUT condition.

  - from_type:   Activity
    to_type:     Entity
    prov_term:   "prov:used"
    neo4j_label: USED
    note: >
      Activity consumed / read an entity. Use role= to distinguish multiple
      uses on the same activity (e.g., role: reads_config vs role: reads_input).

  - from_type:   Activity
    to_type:     Entity
    prov_term:   "prov:generated"
    neo4j_label: GENERATED
    note: >
      Activity produced an entity. Inverse of wasGeneratedBy — use this form
      when the natural edge direction is Activity→Entity (e.g., job emits
      an OUT condition). role= distinguishes multiple output types.

  - from_type:   Activity
    to_type:     Agent
    prov_term:   "prov:wasAssociatedWith"
    neo4j_label: WAS_ASSOCIATED_WITH
    note: >
      Activity linked to an agent (person, software system, org unit).
      role= on the edge records the agent's participation type.

  - from_type:   Entity
    to_type:     Activity
    prov_term:   "prov:wasGeneratedBy"
    neo4j_label: WAS_GENERATED_BY
    note: >
      Entity was produced by an activity. Standard provenance direction —
      edge flows Entity→Activity. Already used by BaseLoader for all nodes.

  - from_type:   Entity
    to_type:     Entity
    prov_term:   "prov:wasDerivedFrom"
    neo4j_label: WAS_DERIVED_FROM
    note: >
      Entity was transformed or computed from another entity.
      Examples: a derived dataset, a report generated from raw data.

  - from_type:   Entity
    to_type:     Agent
    prov_term:   "prov:wasAttributedTo"
    neo4j_label: WAS_ATTRIBUTED_TO
    note: >
      Entity ownership or authorship attributed to an agent.
      Examples: a script owned by a team, a dataset attributed to an app.

  - from_type:   Agent
    to_type:     Agent
    prov_term:   "prov:actedOnBehalfOf"
    neo4j_label: ACTED_ON_BEHALF_OF
    note: >
      Agent delegation — one agent acting for another.
      Examples: a service account acting on behalf of an application.

  - from_type:   Collection
    to_type:     any
    prov_term:   "prov:hadMember"
    neo4j_label: HAD_MEMBER
    note: >
      Collection contains a member entity or activity.
      Examples: ControlMFolder (Collection) contains ControlMJob (Activity).


# ── SECTION 2: Local relationships ───────────────────────────────────────────
# Ordered by domain, then by loader execution order within each domain.
# ─────────────────────────────────────────────────────────────────────────────
local_relationships:

  # ── M3: Control-M ────────────────────────────────────────────────────────

  - id:           m3_scheduled_on
    neo4j_label:  SCHEDULED_ON
    inverse_label: "schedules"
    role:         ~
    from_node:    ControlMFolder
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      Physical hosting — folder is scheduled on a specific Control-M server
      (DATA_CENTER value). No PROV-O equivalent; infrastructure placement.
      Edge carries since + last_seen_at for migration auditability.
      RENAMED from RUNS_ON (see m3_runs_on, deprecated) so the RUNS_ON label
      can be reused for execution-host placement with role properties.

    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       controlm
    status:       active

  - id:           m3_runs_on
    neo4j_label:  RUNS_ON
    inverse_label: "runs"
    role:         ~
    from_node:    ControlMFolder
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      DEPRECATED 2026-06-09: renamed to SCHEDULED_ON (m3_scheduled_on) per the
      consolidated documentation. RUNS_ON is reassigned to ControlMJob/
      ETLProcess → ExecutionHost (m3_runs_on_agent_host / m3_runs_on_etl_host).
      Migrate existing edges with:
      MATCH (f:ControlMFolder)-[r:RUNS_ON]->(s:ControlMServer)
      then re-create as SCHEDULED_ON and delete r.
    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       controlm
    status:       deprecated

  - id:           m3_contains_job
    neo4j_label:  CONTAINS_JOB
    inverse_label: "contained in"
    role:         ~
    from_node:    ControlMFolder
    to_node:      ControlMJob
    prov_maps_to: "prov:hadMember"
    note: >
      ControlMFolder (prov:Collection) contains ControlMJob (prov:Activity).
      Matrix row: Collection → any = HAD_MEMBER. CONTAINS_JOB is kept as
      the label for query clarity; semantics are hadMember.
    supplement:   ontology_supplement.cypher
    loader:       controlm_jobs.cypher
    domain:       controlm
    status:       active

  - id:           m3_contains_folder
    neo4j_label:  CONTAINS_FOLDER
    inverse_label: "contained in"
    role:         ~
    from_node:    ControlMApplication
    to_node:      ControlMFolder
    prov_maps_to: "prov:hadMember"
    note: >
      ControlMApplication (prov:Collection — the Control-M APPLICATION grouping from
      the folder HEADER ROW in CM_DEF_VJOB (JOB_ID=1), deliberately NOT the business
      :BusinessApplication / SEAL concept) contains ControlMFolder (prov:Collection). Matrix
      row: Collection → any = HAD_MEMBER; symmetric with CONTAINS_JOB one level down.
      SME gate 2026-07-07 (controlm-q1q3-phase1; config/gate-log.md). Loader landed
      in the FOLDER pass, not jobs (load-order definition 2026-07-07): the folders
      extract LEFT JOINs the header row so both field-derived grouping labels
      (ControlMServer, ControlMApplication) exist before the jobs pass runs.
    supplement:   ontology_supplement.cypher
    loader:       controlm_folders.cypher
    domain:       controlm
    status:       active

  - id:           m3_requires_in_condition
    neo4j_label:  REQUIRES_IN_CONDITION
    inverse_label: "required by"
    role:         ~
    from_node:    ControlMJob
    to_node:      Condition
    prov_maps_to: "prov:used"
    note: >
      Job requires a named IN condition to be present before execution.
      Matrix row: Activity → Entity = USED. REQUIRES_IN_CONDITION kept for
      domain clarity. Edge carries odate, and_or, parentheses, order_
      for boolean-expression reconstruction.
    supplement:   ontology_supplement.cypher
    loader:       controlm_conditions_in.cypher
    domain:       controlm
    status:       active

  - id:           m3_emits_out_condition
    neo4j_label:  EMITS_OUT_CONDITION
    inverse_label: "emitted by"
    role:         ~
    from_node:    ControlMJob
    to_node:      Condition
    prov_maps_to: "prov:generated"
    note: >
      Job emits a named OUT condition on completion. SIGN='+' posts the
      condition; SIGN='-' removes it. Matrix row: Activity → Entity =
      GENERATED. EMITS_OUT_CONDITION kept for domain clarity.
    supplement:   ontology_supplement.cypher
    loader:       controlm_conditions_out.cypher
    domain:       controlm
    status:       active

  - id:           m3_was_informed_by
    neo4j_label:  WAS_INFORMED_BY
    inverse_label: "informed"
    role:         ~
    from_node:    ControlMJob
    to_node:      ControlMJob
    prov_maps_to: "prov:wasInformedBy"
    note: >
      Derived dependency edge. Successor job was informed by predecessor
      via a shared OUT→IN condition pair. Direction: (successor)→(predecessor).
      Matrix row: Activity → Activity = WAS_INFORMED_BY. Carries via_condition,
      derived=true. Replaces DEPENDS_ON. DIRECT pairs only since the
      phased-loader port (2026-07-23): transitive reach is a graph traversal,
      not a stored closure — the level/path properties are retired.
    supplement:   ontology_supplement.cypher
    loader:       controlm_dependencies_derived.cypher
    domain:       controlm
    status:       active

  - id:           m3_depends_on_file
    neo4j_label:  USED
    inverse_label: "used by"
    role:         file_dependency
    from_node:    ControlMJob
    to_node:      File
    prov_maps_to: "prov:used"
    note: >
      Job waits on a file delivered via MFTS agent (fmSubPathId). Normalized
      from the pre-ontology "DEPENDS_ON" edge in the architecture diagram:
      DEPENDS_ON is retired (job→job replaced by WAS_INFORMED_BY; job→file
      is matrix row Activity → Entity = USED with role=file_dependency).
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  # ── M3 phase 2: execution lineage ────────────────────────────────────────

  - id:           p2_deployed_by
    neo4j_label:  DEPLOYED_BY
    inverse_label: "deployed"
    role:         ~
    from_node:    Deployment
    to_node:      Developer
    prov_maps_to: "prov:wasAssociatedWith"
    note: >
      Deployment activity associated with the developer who ran it.
      Matrix row: Activity → Agent = WAS_ASSOCIATED_WITH. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_deployed_to
    neo4j_label:  DEPLOYED_TO
    inverse_label: "deployment target of"
    role:         ~
    from_node:    Deployment
    to_node:      ControlMServer
    prov_maps_to: ~
    note: >
      AUDIT CORRECTION: doc mapped this to prov:wasAssociatedWith, but
      wasAssociatedWith requires an Agent target and ControlMServer is a
      local platform class, not an Agent. Mapping set to null (local infra
      placement, same family as SCHEDULED_ON). If a PROV mapping is required,
      reclassify ControlMServer as prov:SoftwareAgent first. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_deploys_folder
    neo4j_label:  DEPLOYS_FOLDER
    inverse_label: "deployed by"
    role:         ~
    from_node:    Deployment
    to_node:      ControlMFolder
    prov_maps_to: "prov:used"
    note: >
      Deployment ships a folder definition. Matrix row: Activity → Entity
      (Collection ⊑ Entity) = USED. Feed: Change/CI-CD.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_authored_by
    neo4j_label:  AUTHORED_BY
    inverse_label: "authored"
    role:         ~
    from_node:    ControlMFolder
    to_node:      Developer
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      Folder authorship. Matrix row: Entity → Agent = WAS_ATTRIBUTED_TO.
      Feed: Folder XML / Git blame.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           p2_instance_of
    neo4j_label:  INSTANCE_OF
    inverse_label: "has instance"
    role:         ~
    from_node:    ControlMJobRun
    to_node:      ControlMJob
    prov_maps_to: "prov:wasInfluencedBy"
    note: >
      Runtime execution is an instance of the job definition. Mapped to the
      generic prov:wasInfluencedBy (valid but weak); the tighter PROV pattern
      would treat ControlMJob as a prov:Plan via qualified association.
      Feed: Control-M history API.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_executed_by
    neo4j_label:  EXECUTED_BY
    inverse_label: "executed"
    role:         ~
    from_node:    ControlMJobRun
    to_node:      AppUser
    prov_maps_to: "prov:wasAssociatedWith"
    note: >
      Run executed as a service account (Run-as-User; EPV rows with
      Use Case='CONTROL-M'). Matrix row: Activity → Agent.
      Feed: Control-M history API.
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_seal_app_ref
    neo4j_label:  WAS_ASSOCIATED_WITH
    inverse_label: "agent for"
    role:         seal_app_ref
    from_node:    ControlMJob
    to_node:      BusinessApplication
    prov_maps_to: "prov:wasAssociatedWith"
    note: >
      Job attribution to its SEAL-registered application. Matrix row:
      Activity → Agent = WAS_ASSOCIATED_WITH. role=seal_app_ref discriminates
      this instance from any future owner/author roles on the same label
      (see the planned WAS_ASSOCIATED_WITH {role:owner} idea in docs/reviews/).
      Feed: STG_APP_FACT semantic facts (fact_type SEAL) via the C3/C4
      variable-normalization stream — NEVER raw job.APPLICATION, which both
      repos' loader comments document as unreliable for SEAL identity.
      Registered 2026-07-01 from the company reconciliation (spec-level on
      both repos at registration). ACTIVATED with the K2 loader build:
      match policy SME-confirmed at gate seal-attribution-match-policy
      (config/gate-log.md, 2026-07-14 — precedence SEAL > FID > APP_NAME >
      ALIAS; one-to-one accept; zero-unmatched surfaced via the JobRun
      coverage stamp + graph-tests/seal-attribution-coverage.yaml;
      deterministic multi-hit tie-break, flagged for audit; manual tier-5
      PIN semantics per config/manual-loads/). K3 RIDER: this shape
      type-checks while :BusinessApplication is still prov:SoftwareAgent — the K4
      reclass re-opens the edge SHAPE at its own follow-up gate (see the
      map entry's type_conflict_note); the confirmed match policy itself
      is shape-agnostic and carries over.
      K7 CLOSE-OUT (gate seal-app-ref-edge-reshape, SIGNED OFF 2026-08-03):
      this JOB-grain edge is SUPERSEDED by m3_belongs_to_application at the
      FOLDER grain (§A1) — no per-job application edge is authored going
      forward. The match policy itself is NOT re-opened (§B3): it DEMOTES to
      a fallback tier for app codes with no steward-defined row, and every
      fallback-derived value is DISCLOSED via the origin flag rather than
      presented as defined.
      DEPRECATED at the K8 build (2026-08-04): the job-grain writer and its
      cypher are retired (drydocs.loaders.seal_attribution keeps only the
      match-policy resolver, feeding the K8 fallback); producer-side the
      migration is the reload itself under wipe-and-rebuild (§F1) — the
      company-side migration of live job edges is theirs (guardrail 6 /
      tracker T23). AUTHORIZED DOWNGRADE: the K7 sign-off's "stays active
      until the K7 build migrates it" clause is this flip's authority.
    supplement:   ~
    loader:       ~
    domain:       controlm
    status:       deprecated

  - id:           m3_belongs_to_application
    neo4j_label:  BELONGS_TO_APPLICATION
    inverse_label: "application for"
    role:         seal_app_ref
    from_node:    ControlMFolder
    to_node:      Port
    prov_maps_to: ~
    note: >
      FOLDER-grain application attribution — the K7 close-out ruling (gate
      seal-app-ref-edge-reshape, SIGNED OFF 2026-08-03) that supersedes the
      job-grain m3_seal_app_ref. Target is the application's BatchProcessing
      :Port, NOT :BusinessApplication (§C1): the app node is already the hub
      for SEAL record semantics — TOM roles, contacts, product links,
      orchestrator edges — so hanging every folder off it concentrates batch
      topology on the one node that can least afford it. The port is the
      batch-facing side; the app node stays a record, not a junction.
      prov_maps_to is deliberately null (§D1 option a): ControlMFolder
      (Collection ⊑ Entity) → Port is an Entity→Entity governance/containment
      fact with no natural PROV verb — the SCHEDULED_ON / reg_uses_software
      precedent. ONE shape everywhere (§D2): loader edge, manual tier-5
      writer, migration target. Folder→application is 1:1 by SME ruling
      (OWNER-NOT-USER: a folder belongs to whoever OWNS it, not whoever USES
      it — a platform team's all-tenants utility folder belongs to the
      platform team), enforced as a GRAPH-TEST because Neo4j cannot declare
      relationship cardinality — the TOM-roles precedent. Jobs INHERIT via
      m3_contains_job; authoring is one steward-defined row per Control-M app
      code, fanned out to folders via m3_contains_folder (§B1). Tier 2
      (shared platform code) resolves per folder with :AreaProduct as a
      ROUTING step, never an edge target — there is no direct mapping of
      batch technical components to area product (SME 2026-08-03).
      ACTIVATED at the K8 build (2026-08-04): loader
      folder_attribution.cypher (app-code defined mapping + the demoted K2
      fallback, origin-flagged per §B3); manual tier-5 pins via
      manual_seal_attribution.cypher (rekeyed to this shape, §D2); the 1:1
      graph-test lives in graph-tests/folder-attribution-coverage.yaml.
    supplement:   ontology_supplement.cypher
    loader:       folder_attribution.cypher
    domain:       controlm
    status:       active

  - id:           m3_invokes
    neo4j_label:  INVOKES
    inverse_label: "invoked by"
    role:         ~
    from_node:    ControlMJob
    to_node:      Script
    prov_maps_to: "prov:used"
    note: >
      Gate CONFIRMED 2026-07-15 (config/gate-log.md); planned = the flip +
      supplement block land with the curated-load build (the K2
      flips-are-follow-ups pattern — drydocs_lineage.writer keeps refusing
      a live load until then). Job command line invokes a script/JAR
      (CMDLINE / MEMNAME; Jar Path + Task Json Path). Matrix row:
      Activity → Entity = USED. Produced today by
      drydocs_lineage.extractors.controlm_inventory (job → invoked
      artifact via the shared core parser); writer MATCHes ControlMJob on
      the NODE KEY, MERGEs Script on path.
      2026-07-16 SME session (gate-log cmdline-lineage-review): cardinality is
      1..n per job (compound if/else commands carry multiple invocations, incl.
      wrapper payloads); Script identity stays PATH-keyed — same-basename
      multi-mount duplicates surface in lineage-review for SME merge, never
      auto-merged. 2026-07-21 (gate-log cmdline-nfr-vetting): payload
      invocations MIGRATE to the distinct m7_uses_artifact label at its
      build — until then this entry keeps the 1..n fold; :Script gains
      script_role {launcher, payload} at the same build (SME-3).
    supplement:   ontology_supplement.cypher
    loader:       ~
    domain:       controlm
    status:       planned

  - id:           m3_triggers
    neo4j_label:  TRIGGERS
    inverse_label: "triggered by"
    role:         ~
    from_node:    Script
    to_node:      ETLProcess
    prov_maps_to: "prov:wasStartedBy"
    note: >
      Gate CONFIRMED 2026-07-15 (config/gate-log.md) — shape validated by
      the SME caveat: the common case is one .ksh wrapper script (the
      INVOKES target) that launches the Informatica / Ab Initio / DPL
      workload, passing the parameters those jobs need on CMD_LINE — so
      TRIGGERS candidates are derivable from the already-ingested command
      line, not only from an ETL metadata feed. (The other wrapper case is
      pure unix file operations — move, gzip — with no ETLProcess; that
      case is m3_reads_from / m3_writes_to with ControlMJob as the
      Activity, never a TRIGGERS edge.) DIRECTION NOTE: prov:wasStartedBy
      flows Activity → Entity (ETLProcess wasStartedBy Script); the graph
      edge runs the INVERSE direction for query ergonomics. Treat TRIGGERS
      as inverse-of wasStartedBy. Feed: CMD_LINE wrapper parameters
      (primary); Informatica / Ab Initio / DPL metadata (enrichment).
      2026-07-16 SME session (gate-log cmdline-lineage-review, run against 6
      live captures): the business-key residual is RESOLVED — ETLProcess
      identity = kind-scoped stable token (Ab Initio pset/graph BASENAME,
      mount paths vary by env and stay properties; DPL -pipeline GUID with
      dataflow + config JSON as properties), implemented extractor-side in
      controlm_inventory._stable_invocation_key. ETLProcess KEEPS its label
      and gains a kind property (etl|utility|notification — utility psets
      exist, e.g. script-exec/send-email). DPL is NOT Ab Initio (own
      invocation_type; java zilo framework originally, -py routes to
      spark/pyspark). Remaining loader blocker: the ETLProcess endpoint
