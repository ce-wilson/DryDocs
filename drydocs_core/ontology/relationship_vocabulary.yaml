  - id:           doc_feedback_authored_by
    neo4j_label:  WAS_ATTRIBUTED_TO
    role:         feedback_author
    from_node:    FeedbackNote
    to_node:      Employee
    prov_maps_to: "prov:wasAttributedTo"
    note: >
      PROPOSED. FeedbackNote authored by the SME reviewer. Matrix row: Entity → Agent =
