      ONLY — batch is what an orchestrator schedules; the EventProcessing/API port is not
      scheduler-driven — pointing at a scheduler technology, SchedulerKind {name: ControlM|
      Autosys|Airflow} seeded in ontology.cypher. from_node is the canonical :Port class
      (kind-discriminated, matching seal_has_port); the batch-only constraint is the kind filter.
