    neo4j_label:  PART_OF
    role:         ~
    from_node:    Chunk
    to_node:      Document
    prov_maps_to: ~
    note: >
      Lexical-graph containment (llm-graph-builder pattern): Chunk belongs to
      its Document. dcterms:isPartOf pattern; equivalently the inverse of
      prov:hadMember (Collection reading) — recorded as structural, not PROV,
      to keep the lexical graph distinct from the domain Collections.
    supplement:   ontology_supplement.cypher
    loader:       bmc_docs.cypher
    domain:       docs
    status:       active    # gate bmc-docs-lexical-load accepted 2026-07-08 (config/gate-log.md)

