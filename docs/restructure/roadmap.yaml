# drydocs.roadmap.v1 — the per-module build-out assessment behind docs/plan/roadmap.html.
#
# WHAT THIS FILE IS: the AUTHORED judgment layer of the roadmap page — per module, how far
# the functionality is built out (stage + prose) and a size estimate for each open/parked
# inbox idea that would land in that module. It deliberately does NOT carry counts: item
# counts, statuses, and open-item titles are read live from backlog.yaml at render time so
# they can never rot here.
#
# WHAT IT IS NOT: a plan with dates. Stages and estimates are relative-size judgments,
# not commitments (user direction 2026-08-07: "a roadmap without target dates").
#
# MAINTENANCE RULES:
#   - Every module in backlog.yaml `modules:` has exactly one entry here — the guard
#     (tests/unit/test_plan_roadmap.py) fails on a missing or unknown module, so
#     registering a module forces a roadmap judgment for it.
#   - `ideas:` cites Idea-N ids from docs/restructure/IDEAS.md. When an idea is groomed,
#     merged, or closed, REMOVE its row here (the backlog item then speaks for itself).
#   - `stage` enum: mature | active | early | steady | parked.
#   - `estimate` enum (relative size, no dates):
#       S  = one focused session
#       M  = a few sessions, one backlog item
#       L  = an epic slice — multiple sessions, usually a HITL gate
#       XL = a multi-epic program
#
# classification: Internal (idea summaries ride along; same boundary as the inbox).

schema: drydocs.roadmap.v1
