- date: '2026-08-04'
  note: |-
    ── Epic X — ddlineage retirement (main, graph-infra) ────────────────────────
    Groomed 2026-08-04 on the user's direction ("create a backlog epic to remove
    it"), immediately after a confirmation pass proved the standing fact: ddlineage
    is provisioned but WRITTEN BY NOTHING. The lineage writer pins DATABASE =
    "drydocs" and raises TrustBoundaryError on anything else (ADR 0002 D2); the
    four specs that once read ddlineage were repointed at G30; the read-set
    allow-list in query_specs.py deliberately excludes it; test_database_names.py
    proves every read target has a writer. The database's only remaining role is
    to exist, empty, on every provisioned host. ADR 0002's residency clarification
    says this topology changes "as an amendment, through the SME gate — not by
    drift" — X1 is that amendment, recording the user's 2026-08-04 in-chat ruling.
    Removal is cheap BY THE ADR'S OWN ACCOUNTING: "ddlineage is empty, so choosing
    it later costs a design, not a data migration" — and recreating it later costs
    one CREATE DATABASE line, while the design question (a :ControlMJob proxy-node
    backbone) was never answered and stays owned by the named revisit trigger.
    Sequencing: X1 (decision record) → X2 (repo sweep) → X3/X4 (live drops, one
    per machine — the G50/G52 venue-pinned precedent; the two machines hold
    independent graphs, so one item cannot close both).
  attached_at: J33
