groom_log:
- date: '2026-08-04'
  note: |-
    ── Epic Y — backlog sharding (main / drydocs-plan) — phase 8 ────────────────
    Groomed 2026-08-04 on the user's direction, un-parking the 2026-08-03 IDEAS
    EPIC entry (kept-parked at the 2026-08-04 weekly groom, un-parked in-chat the
    same day). The trigger class is measured, not hypothetical: agents regex-splice
    a shared 12k-line mutable blob; the company port shipped a duplicate-`summary:`
    key that pyyaml's last-wins parsing hid from test_backlog (phase-1 guard closed
    that class, `c5b689e`, port step 55); and on 2026-08-04 alone the two machines
    hit THREE same-afternoon rebase conflicts (X1-claim/V8, X2-close/V2,
    X3-close/V3) — every one of them in the derived summary/next_ready block that
    sharding removes from storage entirely. Phases here: Y1 design ruling ->
    Y2 the shard build -> Y3 graph vocabulary via the gate -> Y4 the query
    surface. Cross-repo law from the idea entry: BOTH repos must move together at
    Y2 — the port carries the shard as a structure-breaking step, like S5's.
  attached_at: Y1
- date: '2026-08-21'
  note: |-
    ── 2026-08-21 groom (laptop) — Idea-151, the first defect the claim ritual found ──
    Y5: a bare one-key claim commit goes RED in CI because roadmap.html derives item statuses
    and the claim ships no regen, so every correctly-claimed item is red for exactly its
    in-flight life. Idea-151 asked the groom to decide, and it did: option (b), the
    stale-render guards tolerate status-only drift. Option (a) — regen inside the claim
    commit — was rejected because it puts generated files into every claim, recreating the
    shared-line conflict Y2's sharding removed. The ruling and its reason are in the item's
    acceptance.
  attached_at: Y5
- date: '2026-08-28'
  note: |-
    ── 2026-08-28 groom (ui-workstream worktree) ───────────────────────────────
    Y6 the pull rule's "a claim ships no render" is true for claiming an EXISTING item
    and false for one that MINTS a new one, and CLAUDE.md states it without the
    distinction (Idea-198). Y5's tolerance is status-only by design and is NOT widened
    — the guard is right, the instruction is incomplete. Evidence: the O75 claim
    commit 49356d9a, run 33214406376.
  attached_at: Y6
- date: '2026-09-02'
  note: 'Groomed 2026-09-02 from Idea-232. Y7: an item held by an annotation is still called ready, because
    next_ready reads depends_on alone. O26 was pulled on that basis. The fix is a BLESSED hold field in
    drydocs.backlog.v3 plus a HELD render - not a general block-on-any-annotation rule, which would refuse
    items nobody meant to hold.'
