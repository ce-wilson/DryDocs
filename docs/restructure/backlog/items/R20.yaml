acceptance: |
  Two halves, and the second is the one that keeps this fixed.

  (a) **The registered spec is re-grounded.** `explorer.folder-applications.v1` in `drydocs_api/query_specs.py` returns rows against the current schema instead of 0. Ask's test question `how many folders and jobs does each tower support?` routed to it, got nothing, and fell through to schema-grounded Cypher naming `BELONGS_TO_APPLICATION`, `HAS_PORT`, `:Port`, `:SchemaMeta` and `active_state` — vocabulary the graph has moved past, which Neo4j reported as four non-fatal warnings that nobody saw. Every registered spec is audited the same way, not just this one: the deliverable states how many specs were checked and which were stale. Where a spec's SUBJECT no longer exists in the graph, it is retired or marked unavailable rather than silently returning an empty result — a spec that answers "0" when it means "I no longer know how to ask this" is the actual defect.

  (b) **A live vocabulary/spec smoke check.** A test that, against a populated database, asserts every label, relationship type and property named in a registered spec still exists in the live schema — and that SKIPS explicitly, naming the venue, when no database is reachable (per the J18 live-verification rule; the two machines hold independent graphs, so this can never be a silent pass). Drift then fails a check instead of surfacing as an empty answer months later.

  The specs' vocabulary is taken FROM the schema and the relationship-vocabulary registry, never invented here: if the audit finds a spec that needs a term the registry does not carry, that term is not added in this item — it routes through the HITL gate like every other edge-meaning question, and the spec stays marked unavailable until the gate rules.

  `poetry run pytest -q`, ruff clean.
