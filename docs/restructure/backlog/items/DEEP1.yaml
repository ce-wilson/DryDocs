  ## The noqa F401 re-export: RE-EXAMINED, not decided

  It still has a purpose, and it is not the one its comment claimed.

  The comment said "re-exported for the on-failure analysis bodies (G4)" - the
  retired model again, and those bodies do not exist (investigate_failure
  raises). MEASURED: no production code imports parse_command or
  extract_container_command FROM investigate; the only consumer is
  tests/unit/test_lineage_deepdoc_scaffold.py::test_both_components_share_the_core_parser,
  which asserts `investigate.parse_command is core_parser.parse_command`.

  That is not a self-referential guard, which is what it looks like at first. It
  is the executable evidence for ADR 0002 D2 - "they share the
  command-line/lineage parser in drydocs-core" - and for the charter's own
  sentence that the parser is an INPUT to an investigation rather than a rival
  to it. The re-exported names BEING the core objects is what makes that
  checkable at all.

  So: KEPT, and its comment now states the live reason and names the test that
  pins it. Whether the invariant is better expressed without a module-level
  re-export is a real question and NOT this item's to answer - flagged, not
  taken, per the acceptance's "re-examine, not decide".

