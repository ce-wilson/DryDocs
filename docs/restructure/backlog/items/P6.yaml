  that relies on it - the item lists drydocs_core/schema/controlm_folders.cypher, which does
  not exist; the constraint is controlmfolder_id in drydocs_core/schema/constraints.cypher and
  the note sits there, naming the probe, the venue and the date. No identity change is owed;
  the (DATA_CENTER, TABLE_ID) staging key stays as the defensive choice it was. Multi-data-
  center loads are safe to run on this point (clause d). One observation OUTSIDE this item's
  question, inboxed as Idea-274: folder_rows exceeds distinct_table_ids by 10 while zero ids
  span two data centers, so ten TABLE_ID values appear more than once WITHIN one data center -
  the composite (DATA_CENTER, TABLE_ID) staging key would reject those rows, and what a
  duplicate row in CM_DEF_VTAB means (a version, a deleted-and-recreated folder, a view
  artifact) has not been asked.
