id: R23
epic: agentic-qa
title: 'The Ask control token is persisted in cleartext: the R5 in-band handshake writes the drydocs-api
  session token into agents/graph_qa/.adk/session.db once per turn'
type: bug
module: drydocs-agents
phase: 15
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- agents/graph_qa/control.py
- agents/graph_qa/agent.py
- web/src/ask/askApi.ts
- drydocs_api/sessions.py
- docs/decisions/0007-agentic-qa-architecture.md
acceptance: |
  (a) THE VALUE STOPS REACHING DISK: after an Ask run, the `api_token` VALUE appears nowhere in `agents/graph_qa/.adk/session.db`. Either the control part is stripped from the event before ADK persists it, or the value is redacted on write and the live token is held only in process memory for the turn. Observed 2026-08-21 (desktop, session `ask-jdoe4821-wjtacr8x`): the raw bearer token appears verbatim in all three user events in the `events` table, because `askApi.ts` sends it as an in-band message part and ADK writes every part as given.

  (b) A REGRESSION TEST ASSERTS IT — a run (real ADK, or the stubbed runtime the handshake was designed to allow) leaves no `api_token` value in the store. This is the clause that keeps it fixed. `control.py`'s own docstring says the in-band shape was chosen so it is "testable without an ADK runtime", so the test costs little.

  (c) THE HANDSHAKE STILL WORKS — R5's observable behavior is unchanged: the agent still registers each executed Cypher as an ephemeral spec owned by the ASKING session, Open-in-Explorer and Export still work for that user, and a foreign session still 404s.

  (d) THE STORES ALREADY ON DISK ARE PURGED, per machine and J18-tagged. The tokens sitting there stay REPLAYABLE for the life of the API process — `InMemorySessionStore.issue` (drydocs_api/sessions.py) mints `secrets.token_urlsafe(24)` with no expiry, and only `revoke` or a restart ends one — and nothing prunes the store, so they accumulate. The close note names each machine whose `.adk/session.db` was purged. This is disk hygiene, NOT history rewriting: `.adk/` is gitignored (`.gitignore`, the "ADK local runtime state" block), so nothing reached the repo.

  (e) THE CHANNEL SAYS WHAT IT PROMISES: `control.py` states that control parts never reach the LLM — which holds — and says nothing about persistence. That silence is how this shipped. The fixed file states the persistence property beside the LLM one.

  No ontology change and no gate: this is a credential-handling defect in an existing mechanism.
notes: |
  Groomed 2026-08-22 (laptop) from Idea-155, which was filed branch-side on `feat/ui-workstream` as that branch's Idea-151 and re-filed at 155 on main (151 there is the unrelated stale-render entry, groomed to Y5 — R18's notes cite the branch number and are corrected to point here in the same commit as this item).

  p1, above the two siblings that read the same store, because it is a live credential at rest with no expiry: a copy taken from the file replays for the life of the API process. Two things make it worse than a stray log line — the accumulation, and the contradiction one row over. `Envelope` deliberately reduces question text and caller identity to sha256-plus-length so neither is persisted, while the credential beside them is written raw; the repo already decided how it feels about persisting sensitive fields on this path.

  DONE 2026-08-25 (laptop `NewThinkpad`). Fixed at the ONE choke point every session
  service persists through -- `append_event` -- rather than at any single backend, so
  local SQLite, a database URI and the in-memory service are covered identically.
  `graph_qa/control.py` gains the pure rule (`redact_control_text`, `SECRET_CONTROL_FIELDS`,
  `REDACTED_VALUE`), `common/session_redaction.py` the duck-typed `RedactingSessionService`,
  and `serve.py` installs it by replacing the one ADK function `fast_api` calls to build
  the service -- verified patched and idempotent in the agents venv (google-adk 2.3.0).

  THE THING THAT MADE THIS SUBTLE, and the reason clause (c) has its own test: upstream,
  the persisted event's `content` IS the object the agent reads as `ctx.user_content`
  (`Runner._append_user_event` passes it straight through). Redacting in place would have
  taken the token away from the very turn that needs it and Open-in-Explorer would have
  quietly stopped working. So nothing is mutated: an event with nothing secret is returned
  BY IDENTITY, and one with a token is replaced by a deep copy that is written instead.

  (a) VALUE STOPS REACHING DISK -- the field survives, the value does not. A deletion was
  rejected: the R5 trail is read for "did this turn carry control", which a deletion
  silently answers no. `api_url` is deliberately NOT in the secret set -- it is
  configuration, and redacting it would cost readability for no security gain.
  (b) `tests/unit/test_session_redaction.py` -- 14 passed / 1 skipped. J26 PROOF: driving
  the same fixtures through the wrapper with a no-op redactor (the pre-R23 behaviour) puts
  the token in the store; with the real rule it does not. Same fixtures, opposite verdicts.
  It uses a STUB store on purpose -- `agents/` has its own venv and this repo's interpreter
  has no google-adk, so a guard needing a real runtime could not run in CI at all, and the
  defect is "what got written", not "which database wrote it". The one thing a stub cannot
  prove -- that ADK still calls the seam `serve.py` patches -- is its own test, which SKIPS
  where ADK is absent (U26 precedent) instead of passing for being unable to look.
  (c) HANDSHAKE UNCHANGED: `askApi.ts` and `split_question_and_control` are untouched, the
  wire shape is the same, and a test asserts the live event still parses to the real token.
  (d) STORES ON DISK, per machine (J18). LAPTOP `NewThinkpad`: `agents/graph_qa/.adk/session.db`
  inspected -- 4 events, ZERO mentions of `api_token`, file dated 2026-07-23, i.e. it predates
  R5. Nothing to purge here, and that is recorded rather than reported as a purge that
  happened. DESKTOP: STILL OWED -- the 2026-08-21 observation was made there and this session
  cannot reach that filesystem. Carried in the handoff so the next desktop session does it.
  (e) `control.py`'s docstring now states the persistence property beside the LLM one, with
  the two consequences spelled out rather than left to be discovered: the SSE echo carries
  the redacted text, and a RESUMED invocation degrades to "no control" exactly as a
  malformed part does. `graph_qa/README.md` says the same in one paragraph.

  ADR 0007 needed no edit -- it makes no claim about credential persistence, which is
  precisely the silence that let this ship.

  Suite 2399 passed / 10 skipped; ruff check + format clean; `import drydocs.cli` and
  `drydocs --help` pass.

  SIBLINGS in the same store, deliberately NOT merged: R13 (p3) asks whether ADK 2.x offers a partial/non-persisted event mode — its mechanism might incidentally satisfy (a), but this item must not wait on that question; R18 read its evidence out of this same `session.db`. Module drydocs-agents because the fix belongs on the agent side of the handshake (strip or redact before ADK persists), even though the token is minted in drydocs_api and sent by web.
  CLAUSE (d) EXECUTED 2026-08-25 (DESKTOP -- J18, the machine named because an untagged
  'purged' reads as both). agents/graph_qa/.adk/session.db deleted after confirming the
  exposure was real and still present: 12 sessions / 59 events, 10 events carrying
  api_token -- the 2026-08-21 observation, unchanged. Disk hygiene only: .adk/ is
