id: S10
epic: structure-remediation
title: The four :BusinessApplication MERGE loaders refuse to run against a pre-cutover graph, instead
  of minting the silent twin S3 argued about but never guarded
type: bug
module: drydocs-load
phase: 9
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- drydocs/loaders/seal_applications.py
- drydocs/loaders/manual_loads.py
- drydocs/loaders/catalog.py
- drydocs/loaders/software_registry.py
- drydocs/loaders/base.py
- graph-tests/business-application-identity.yaml
