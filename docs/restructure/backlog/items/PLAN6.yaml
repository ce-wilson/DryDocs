id: PLAN6
epic: project-board
title: "A venue wall written in acceptance prose is invisible to lane-handoff --suggest - give items a declared venue the check can read"
type: task
module: drydocs-plan
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- .claude/skills/lane-handoff/scripts/handoff.py
- config/dev-environment.yaml
- docs/restructure/backlog/items/G132.yaml
- tests/unit/test_lane_handoff.py
acceptance: |
  lane-handoff --suggest's V (venue-bound) marker reads only an item's inputs paths, so a
  venue wall written in acceptance PROSE is invisible to it. G132 clause (g) says 'none of which
  exist producer-side' and was still queued to the laptop, which hit the wall on read; the lane
  left it todo rather than claim what only a server-side machine can build.

  (a) The fix is NOT to parse prose. Items gain a declared, machine-readable venue requirement
      (venue: or requires:), additive to the v3 schema, optional, and validated against the
      venue codes config/dev-environment.yaml declares.
  (b) --suggest flags any queued item whose declared venue the receiving machine does not
      declare, and says which requirement failed.
  (c) G132 is the worked example: it carries the declaration, and a --suggest run against a
      machine without the server venue flags it. An item with no declaration behaves exactly as
      today - silence, not a new failure.
  (d) Pinned in tests/unit/test_lane_handoff.py and in the backlog schema guard.
notes: |
  Minted 2026-09-07 from IDEAS.md Idea-264 (Lane B close report, laptop, 2026-09-05).

  Additive schema field, so it does not disturb the 663 items that will never carry it - that
  is why this is sonnet and PLAN5 is fable: PLAN5's outputs question changes how every item is
  read, this one adds an optional field with a validator.

  config/dev-environment.yaml is already the declared-not-inferred venue file (PLAN2 uses its
  edition: key the same way), so the venue vocabulary has a home and this item does not invent
  one.

  DONE 2026-09-08 (desktop, Lane A). (a) Items gain an optional venue: list of codes, additive
  to v3. The vocabulary is a new venues: map in config/dev-environment.yaml - the file that
  already declares rather than infers (PLAN2's edition: key) - where each code carries
  available: (this side's local fact) and what:. Seeded with controlm-server (G132's wall),
  oracle-replica and neo4j; producer declares only neo4j available. The PORT-MANIFEST note on
  that canonical-company row says the KEYS are adopted by hand and available: stays the
  consumer's. (b) handoff.py: load_venues reads the map; declared_venue_flags reads the FIELD
  and never prose, and each flag names the code and the key that failed (not available here,
  or no such code declared); venue_flags, check_queue and cmd_suggest thread a venues map
  (default: this checkout's file), so the V mark and the generate flag now cover it; the
  --suggest header prints which codes this side declares available. (c) G132 carries venue:
  [controlm-server]; --suggest on this desktop marks it V with the named requirement; an item
  with no venue: is silent, as before. (d) tests/unit/test_lane_handoff.py: flag / silence /
  undeclared code, check_queue on both lanes, G132 read from its real file against a synthetic
  map on both sides, load_venues on a file without the section, the --suggest mark and line;
  tests/unit/test_backlog.py: venue: is a list of declared, unrepeated codes (the gates: shape,
  J50); tests/unit/test_dev_environment.py: every code carries a boolean available and a what.
  SKILL.md names the check and what it does not do: the file is committed, so two producer
  machines declare the same set - a per-machine difference stays the author's ruling.
