acceptance: |
  Three back-flow adoptions from the company's chunk-1 apply of port-base-20260901, plus
  one rule for the port workplan. The company holds the transcript; the producer holds the
  mechanisms, which is why these land here.

  (a) scripts/render_port_dispositions.py takes an OPTIONAL HEAD ref. The consumer's HEAD is its
      own tree, so a range on their side classifies tag..tag and never tag..HEAD; they patched
      main()/render() for it and the shape is the one to adopt.
  (b) The fourth guard in tests/unit/test_port_dispositions.py (the APPLY-BY-DISPOSITION section
      above STEP LEDGER in the port-prompt) is producer-only by nature - the company's
      port-prompt copy is retired and carries neither marker - so it SKIPS when the markers are
      absent, with a message saying so, rather than forcing the consumer to drop a test. The
      skip is TRACKED-content-based, never a directory probe.
  (c) scripts/port_rename_check.py spawns one git show per producer file across the whole tree.
      Move it to git cat-file --batch on one pipe: minutes become seconds, and the whole-tree
      look is what RELAY-20 asks for before every clean-add slice. Prove the speed-up with a
      measured before/after on this tree, and prove the OUTPUT is unchanged on the same range.
  (d) THE WORKPLAN RULE: a chunk plan that names a script names the COMMIT the script needs.
      The company was told to run a renderer that landed after their base (J69 at bed22549).
      Chunk 1 should also say: classify with git show <base>:PORT-MANIFEST.yaml, not with the
      consumer's current manifest, and then diff the two manifests - the differences ARE the
      port's own manifest rows. Both rules land in the port-prompt.
notes: |
  Minted 2026-09-07 from IDEAS.md Idea-250 (company session's chunk-1 status, relayed by
  the SME 2026-09-02; the producer holds no transcript, so traceability to their id is
  one-directional).

  The entry's fourth finding RESOLVED itself the same day in the company's favour and is
  recorded here for the record, not as work: the producer's 519 was measured ..HEAD three
  commits past the tag; tag..tag with the manifest at the tag is 516 / 130 / 150 / 4, and their
  123 is 130 minus the seven derived rows. That resolution is exactly why clause (d) exists -
  classifying with the wrong manifest is the mistake that produced the discrepancy.

  First item in the PORT series (module drydocs-port, added at CORE1). Filed
  release-infrastructure / phase 8 with the other port mechanisms (J34, J72).
  DONE 2026-09-08 (desktop, Lane A).
  (a) Was already on main before the claim, at eee64ce3 (2026-09-07, the same day this
      item was minted): main() takes an optional second argument as the head, render()
      takes it too, a third argument is refused, and test_port_dispositions.py pins the
      pass-through. Nothing to adopt beyond recording that the adoption had landed.
  (b) The fourth guard now skips through git ls-files -- docs/port/port-prompt.md (never a
      directory probe), and again when the tracked file carries neither marker (a retired
      stub). This is the case PORT3's guard exists for, and PORT3 had it WRONG: its fixture
      allowance for test_port_dispositions.py said "input to classify()", but the test opens
      the file. The false allowance is removed here, and the PORT3 guard replayed on the
      pre-(b) shape FINDS the citation and reads the post-(b) shape CLEAN - the two items lock.
  (c) scripts/port_rename_check.py reads the producer tree through one git cat-file --batch
      pipe (_blobs), decoding exactly as _git did (UTF-8 replace, then universal newlines).
      Measured on this tree, whole tree, --producer-ref port-base-20260905: 109 s before,
      8 s after; the report output is byte-identical (diff of the two captures is empty).
      tests/unit/test_port_rename_check.py (new, 3 tests) pins per-path equality with git
      show, the missing-object skip, the decode, and that no _git("show", ...) call remains.
  (d) Both rules land in the APPLY BY DISPOSITION section of docs/port/port-prompt.md,
      under the renderer command, which is now the consumer's two-argument form: a chunk
      plan that names a script names the commit the script needs (bed22549 / eee64ce3 /
      df7a57c3 / 6f8c7825, all in port-base-20260908); classify with the manifest AT THE
      BASE (git checkout <base-tag> -- PORT-MANIFEST.yaml is class 1's first take anyway),
      then git diff <pre-apply-tag> <base-tag> -- PORT-MANIFEST.yaml - the rows that differ
      are the port's own manifest rows for the range.
  The item's inputs list docs/port-prompt.md; the file is docs/port/port-prompt.md.
