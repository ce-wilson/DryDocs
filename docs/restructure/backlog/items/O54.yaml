acceptance: |
  A surface row for the canonical load sequence (cli.CANONICAL_LOAD_SEQUENCE with LOAD_PROFILES and SCHEDULED_INGEST_EXCLUSIONS) is in the generated matrix, and it renders `enforced` rather than `unguarded`: today the renderer forces status="unguarded" for ANY row flagged code_resident regardless of its guards, which is now simply wrong — N3/N6 gave that surface real guard tests. The status logic separates "config living in code" (a fact about WHERE it lives) from "nothing guards it" (a fact about whether it is tested), the page's KPI wording is updated to match, and the render stays deterministic with its drift test green.
notes: |
  Groomed 2026-08-07 (pm) from Idea-55. The blocker the entry named — "the registry needs to accept a module path" — was checked at the groom and is NOT the blocker: the renderer only requires the declared path to exist, and drydocs/cli.py does. The real blocker is the unconditional code_resident -> unguarded branch in render_enforcement_matrix.py. Module drydocs-web and epic O because the matrix is the O12 admin surface's generated artifact; the row's SUBJECT living in drydocs/cli.py is the whole point of the row.

  BUILT 2026-09-03 (laptop, Lane B of the 0aeba6fc handoff; wip/O54-laptop).

  THE STATUS LOGIC SEPARATED. surface_status() in scripts/render_enforcement_matrix.py
  decides from the guards and the pending count only; code_resident rides on the row as a
  fact about WHERE, and the docstring's status vocabulary records that until this item
  the unguarded branch also fired for any code-resident row — right for the launcher
  registry the flag was invented for, wrong once N3/N6 guarded the load sequence.

  THE ROW, AND WHERE IT POINTS. The declarations moved to drydocs/cli_shared.py at S8 and
  drydocs/cli.py re-exports them, so the row's file is cli_shared.py (where the config
  LIVES) and the item's input path was right for the tree it was groomed on. A code-
  resident row names its `symbols` — CANONICAL_LOAD_SEQUENCE, LOAD_PROFILES,
  SCHEDULED_INGEST_EXCLUSIONS — and _symbol_source() renders and scans ONLY those module-
  level declarations, read from the syntax tree with each one's leading comment block:
  the whole module would have reported every env read in the CLI as if the load sequence
  referenced it. Consumers: drydocs/cli.py, scripts/ingest.sh (calls load_profile at run
  time), scripts/render_load_map.py. Guards: test_load_sequence_surfaces.py (N6),
  test_load_map_declarations.py and test_load_map_json.py (N3/N4). A fresh build renders
  the row `enforced`, 0 pending, no env refs, 7.4 kB of declarations; the generator
  fails closed on a code-resident row with no symbols or a symbol the module does not
  define.

  THE PAGE'S WORDING. AdminConfigRoute's file node reads "code-resident: <symbols>" in
  the yellow token rather than "the migration argument" in red — red is the "NO GUARD
  TEST" node's alone — and the File cell names the symbols. The route tolerates a
  committed artifact that predates the field.

  GUARDED: four tests in tests/unit/test_enforcement_matrix.py — the row exists in a
  fresh build and renders enforced; its content is the declarations and not the module
  (no `def`, under 12 kB); surface_status ignores residency in both directions; every
  row carries code_resident and symbols. ruff clean; tsc, oxlint, vite build and vitest
  (142) green; full suite 3143 passed with ONE failure that is the render, not the
  renderer: the drift test against the committed JSON.

  THE RENDER IS LANE A'S, NAMED HERE AS THE WRITER: web/src/generated/enforcement-
  matrix.json is a derived render the handoff fences off for Lane A, and it is
  regenerated by the same render_board.py run (which calls render_enforcement_matrix)
  that every Lane B close already needs at merge. So "the drift test green" is true on
  main after the merge and deliberately not on this branch; the committed artifact is
  not touched here, per J43 (nobody merges a render by hand). The G134 branch changed the
  same artifact's input (the doc registry gained a field), so one render at merge covers
  both.

  DETERMINISM: the new content slice is read from the syntax tree in file order and the
  scan regexes are the existing ones; test_render_determinism's write_text rule is met
  by the unchanged writer. No new dependency, no new file.
