acceptance: |
  RIDER ADDED AT G107's CLOSE (2026-08-25). G107's acceptance cited this item as its precedent --
  "exactly as drydocs_remediation does after G93" -- but G93 had not run, so there was nothing to
  copy: remediation opens no run log and logs nothing at all. G107 therefore built the shape FIRST,
  and this item now joins it rather than minting a fifth variant.
  USE drydocs_core.run_log.batch_run_log, the shared context manager G107 added, not a hand-rolled
  open/try/finally. It yields a mutable summary dict, closes on BOTH the success and the failure
  path, re-raises the batch's exception unchanged, and swallows an unwritable log directory so a
  run log can never be the reason a batch fails. Clause (a) below ("a remediation batch opens a
  LoaderRunLog and closes it with its counts") is satisfied by wrapping the batch in that helper
  and filling the summary -- the counts clause is unchanged, only the mechanism is now decided.
  The four already wired are lineage's write_curated and write_rua, docmeta's two connectors, and
  the vendor scrape's capture; remediation is the fifth and last of the cadences Idea-152 named.


  REPRODUCED AT THE GROOM, sample-only (J18): render_handoff() emits Findings, Scope, Change, Equivalence evidence, Acceptance and Rollback -- and not one count of what the run actually processed. The reviewer reading the ticket cannot tell whether the batch examined nine jobs or nine hundred, so "we fixed it" carries no denominator. Meanwhile the extractors already model exactly this (ExtractCoverage.summary() with the G60 prepost_* source split, XmlDefsCoverage, findings counted by rule) -- the pattern exists, the handoff just never reads it. (a) THE COUNTS RIDE THE RUN LOG, NOT THE CONSOLE. A remediation batch opens a LoaderRunLog (drydocs_core/run_log.py) and closes it with its counts in the summary, the same contract the loaders already use; the handoff is rendered FROM that recorded summary. Console output is a view of the run, never its record. (b) NUMBERS ARE RECORDED, NOT RECOMPUTED AT RENDER TIME. HandoffPackage carries the run's counts as data; render_handoff stays a pure deterministic template (the module's existing house rule). A test proves the rendered body reports the recorded numbers even when the finding list handed to the renderer is a subset -- otherwise the explanation silently re-derives a denominator from whatever survived filtering. (c) WHAT THE SECTION CARRIES, at minimum: objects examined, objects changed, findings by rule id and by severity, the ratified / unratified split (a warn-only finding must not inflate a fix count), and anything skipped WITH ITS REASON -- unparseable is counted, never dropped. (d) ABSENCE IS EXPLICIT. A package assembled without a run summary renders the section as not recorded rather than omitting it, so a missing measurement never reads as a clean run. (e) IT DOES NOT RESTATE THE EQUIVALENCE PROOF. proven / compared jobs stay in their own section with the three-valued PASS / DIVERGED / NOT PROVEN verdict; coverage counts what the run looked at, the proof states what it demonstrated, and merging them would let a big denominator read as evidence. Zero graph writes. No new relationship type, no vocabulary entry, no gate.
notes: |
  Groomed 2026-08-12 (targeted groom) from Idea-113, user direction the same day. Verified at the groom: render_handoff has no counts section, and nothing under drydocs_remediation/ imports run_log at all today (drydocs/cli.py is the only LoaderRunLog caller) -- so the batch-side run log is part of this item, not an assumed prerequisite. MODULE: drydocs-remediation, chosen because both change points (jira.py, the batch entry point) are there; drydocs_core/run_log.py is ADOPTED unchanged. If the run-log contract itself needs a field it does not have, that is a drydocs-core follow-up, not this item. WHY IT MATTERS BEYOND TIDINESS: this is the support -> dev handoff of the runbook automation use case. The ticket is where a support engineer's evidence becomes a developer's instruction, and an explanation without counts cannot be audited later against the run that produced it.
