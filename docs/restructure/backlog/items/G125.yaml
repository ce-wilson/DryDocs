id: G125
epic: component-topology
title: 'The automated half of the registry declares no binding: fifteen datasets resolve through
  nothing, seven modules each invent their own precedence, and landing-zones --check reads as
  coverage over half its subject'
type: task
module: config
phase: 6
agent: main
model: sonnet
priority: p2
status: todo
depends_on:
- G124
inputs:
- config/source-registry.yaml
- config/data-zones.yaml
- drydocs_core/landing_zones.py
- drydocs_core/data_root.py
