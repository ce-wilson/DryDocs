acceptance: |
  Every source the system reads is DECLARED with a binding, not only the filesystem ones, and the
  resolution precedence is written once. Implements what G124's ADR rules; if that ADR is ruled
  differently, this acceptance follows the ruling and not this text.

  (a) THE FIFTEEN AUTOMATED DATASETS GET A BINDING (review finding B1, and the amendment to both
  G81 (b) and G109 (a)). `config/source-registry.yaml` carries 15 `acquisition.mode: manual` rows
  that resolve through `drop_dir` and 15 `automated` rows that resolve through NOTHING — their
  system rows carry `locator.service: ~` with a comment saying the real value lives in
  `internal-local/`, and nothing resolves a comment. Per ADR 0017 clause 2 AS AMENDED 2026-08-30
  the binding is one row per CONNECTION CARRIER, inherited by every dataset under it -- NOT per
  origin, which Rev 1 said and the registry disproves: `origin: controlm` spans three systems
  (controlm, drydocs-stg, psgmgr) so a per-origin row cannot bind to one connection, and
  `system: psgmgr` carries three origins (controlm, hr, seal) so keying per origin re-fragments
  the connection the table exists to share. Carrier is the level `system` occupies, so the ten
  psgmgr datasets share one row. TWO QUALIFICATIONS, both from the amended clause: (i) `system`
  is at the right LEVEL carrying the wrong VALUE -- psgmgr is a schema and the database is
  spiderdb, so the proxy holds only while one schema equals one database; record that on the row
  rather than silently relying on it; (ii) the connection is not the only binding -- which READER
  fetches a datapoint is a finer, dataset-grained choice that `adapter:` already carries, and it
  is OUT of scope here (Idea-222, riding N10). A row that
  legitimately has no binding (a crosswalk-only activation with no export feed — `autosys` and the
  other `locator: {}` rows are the candidates) records that reason explicitly, the way
  `data-zones.yaml`'s header records why a write zone has no registry row.

  (b) `drydocs landing-zones --check` STOPS READING AS COVERAGE OVER HALF ITS SUBJECT. G109 fixed
  this once already for the code zones — the command now reports both declarations, 26 zones where
  it used to report 15 — and the automated half is the same defect one level wider: a clean run
  over the rows it knows about, silent about the rows it does not. The command reports the binding
  state of every carrier, and `--check` distinguishes "bound and reachable" from "declared with no
  binding" from "bound to an unset variable". It stays ONE JSON document (the bug G109 caught in
  its own change before it shipped). SHAPE OF THE RESULT (ADR 0017 clause 7): a connection check
  returns a TYPED REPORT, not a boolean -- reachable, plus what it could and could not do, plus
  what to do about it. That is DataHub's TestableSource.test_connection shape, and it is the half
  of a validating form an editor-first operator can still have.

  SCOPE AND DIRECTION OF THE TEST (ADR 0017 clause 7, RULED 2026-08-30 -- three rules, each
  closing a way this check could go back to lying). (i) IT RUNS ONLY FOR BINDINGS CONFIGURED ON
  THIS MACHINE, because that is the only thing testable. A binding whose variables are unset here
  is "not configured on this machine" -- a DISTINCT VERDICT, never a failure. The two machines hold
  different subsets, so scoring another machine's binding red would make the check noise, and
  noise is how the original coverage lie survived. The report names the venue it was produced on
  (J18 as a return value). (ii) IT STARTS AT THE REGISTRATION, NEVER ON THE CONFIG SIDE OF THE
  WALL. Side (A) is .env -- machine-local values and secrets. Nothing tests side (A): no assertion
  that a variable holds a CORRECT host, no probing of credentials. The check begins once something
  is REGISTERED, at side (B), and runs DOWNSTREAM to the configured points as defined --
  connection, then the declared object, then the adapter, then the load surface. (iii) IT STOPS AT
  THE FIRST STAGE NOT YET BUILT and names that stage. "Not built yet" is a THIRD verdict class,
  distinct from both reachable and broken -- most of the registry is mid-lifecycle by design, and
  N12 clause (f) already rules that mode: manual is the expected first state and never a defect, so
  scoring unbuilt stages as failures would be wrong about the majority of rows. The load state the
  walk ends at is the one the load-map surface already renders: the check and the rendered view
  answer with the same fact, never two.

  (c) ONE EXPANSION FUNCTION, NOT SEVEN (finding B4; the amendment to G81 (d)). Today
  `resolve_data_root()` treats an empty string as unset, `resolve_log_dir()` walks two variables
  before its default, `credentials_path()` takes any non-empty override verbatim, and
  `MappingStore.__init__` imports `os` inside the constructor to read one variable. One function
  expands a variable reference, with one error naming the unset variable, and one enumerable list
  of every variable the system reads — `DRYDOCS_DATA_ROOT`, `DRYDOCS_LOGDIR` (plus the legacy
  `SPIDERP_LOGDIR` alias), `DRYDOCS_CONSOLE_CREDENTIALS`, `DRYDOCS_MAPPING_DB`,
  `DRYDOCS_MAPPING_READ`, the Control-M adapter's config variable, and the `NEO4J_*` set. This is
  what makes G81 (d) — an unset root FAILS rather than silently relocating — implementable in one
  place instead of seven. G81 (d)'s behavior does not change; its implementation stops being local
  to one resolver. TWO RIDERS from the amended ADR clause 3: (i) the expander SUBSTITUTES AND
  REFUSES DEFAULTS -- no bash-style `${VAR:-default}`, because a default operator puts G81 (d)'s
  silent relocation back at the syntax level where the one function cannot see it; an unset
  variable is an error naming the variable and the row that wanted it; (ii) the expander is also
  where a resolved value is REGISTERED AS SECRET, since it is the only place that can know, so
  masking is created at expansion rather than bolted on at each print site.

  (d) NO VALUE THAT IS SECRET LANDS IN COMMITTED YAML. The table names variables; it never holds a
  host, service name, SID or credential. Guarded, because this is the publish boundary (CLAUDE.md
  §3) and a guard is the only thing that keeps a convenience commit from putting a real value in a
  committed file. Every new row carries its `classification` — there is no unlabeled default, and
  `tests/unit/test_classification.py` enforces it.

  (e) ONE STALE LOCATOR STRING IS CORRECTED, found while ruling this item rather than by a guard:
  `config/source-registry.yaml` line 201 reads `data_root: "DRYDOCS_DATA_ROOT (default
  ~/data/DryDocs); ..."`. G81 (d) REMOVED that default — the variable is mandatory and an unset
  root now fails naming it. The prose has contradicted the code since 2026-08-23. It is a
  free-text `locator` string, which is why nothing caught it, and that is the argument for (a):
  prose in a locator block is not a declaration.

  (f) THE PROFILE IS REFERENCED, AND THE REFERENCE IS GUARDED (ADR 0017 clause 4 as amended). The
  registry row NAMES its connection profile. A guard fails a row naming a profile that does not
  exist, and reports a profile no row names. This is in acceptance because DataHub ships the same
  shape and omits exactly this: its dataHubConnection declares no relationship to any dataset, so
  a profile nothing references is a profile nothing can audit -- the defect this item exists to
  close, reintroduced one level up.

  (g) THE `$`-PREFIX WRITE GUARD (ADR 0017 clause 6). In any committed YAML, a field whose key is
  credential-shaped (password, token, secret, connection_string, sqlalchemy_uri, plus the
  _password / _token / _key / _connection_string suffixes) must hold a variable REFERENCE -- a
  value beginning with the dollar sign -- or nothing at all. One test. It is the enforcement of a
  rule this repo already states and neither peer product has: an identifier publishes, a
  connection coordinate goes to the internal twin.

  (h) THE BINDING TABLE GETS ITS OWN PORT DISPOSITION (ADR 0017, the ADR 0009 reconciliation as
  ruled 2026-08-30). PORT-MANIFEST.yaml gains a row for the binding table -- `per-entry` with a
  FIELD SPLIT, the WHAT crossing and the WHERE never crossing -- modelled on the row
  config/doc-source-registry.yaml already carries, where producer-owned fields cross on take and
  company-owned fields (explicitly graph_locator and source, "the where") are never overwritten by
  a port. WITHOUT THIS ROW the file inherits the config/** default `canonical-producer` and a port
  carries one machine's binding onto the other side. That is not hypothetical: the default's own
  note records the same omission being caught once already -- "A file of LOCAL infrastructure facts
  does not belong under this default; dev-environment.yaml sat here by omission until the
  2026-07-28 port". Guarded by tests/unit/test_port_reconcile_guards.py, which already proves
  overlay union and verbatim-apply survival for the per-entry rows.

  SCOPE FENCE, so the id work is not started here: this item changes NO dataset id, NO retired-id
  mapping, and NOT `SourceEntry.urn`. ADR 0017 clause 1 as amended rules that un-redacting `[db]`
  or `[schema]` must move together with the URN derivation in one commit, and that pairing rides
  its own SME gate. Bindings only.

  `poetry run pytest -q` green including the classification guard, `drydocs landing-zones --check`
  reporting the full source set, ruff + format clean.
notes: |
  Minted 2026-08-29 (desktop) by G123. It carries TWO of the catalog-substrate review's amendments
  because they are ONE finding at two altitudes, and minting two items for one gap would recreate
  the two-declarations defect G109 closed:

    - the G81 (b) amendment — extend the declaration from the three families the SME named to the
      full ORIGIN set, so the fifteen automated datasets are covered and not only the filesystem
      ones; plus the G81 (d) amendment, one expansion function per B4 rather than one per module;
    - the G109 (a) amendment — "the gap is larger than six: every automated dataset is undeclared
      too. Either widen the clause or record why the automated half is out of scope."

  BOTH RULED FOLLOW-UP, NOT REOPEN, and the reasons are different (full ruling in G123's notes).
  G81's declaration covers every path that EXISTED when it closed and its invariant holds; what the
  amendment asks for is a connection binding, which is not a filesystem path and has no expressible
  base in `data-zones.yaml`. G109 had already ruled its own six-zone premise moved and fixed the
  read surface instead; the automated half was never in its acceptance and needs a mechanism the
  item never had.

  `depends_on: [G124]` so nothing implements an unratified decision — the G104/G105-G109 precedent
  exactly. Module `config` follows G109's reasoning: the deliverable is declaration rows plus a
  derivation rule, and the resolver edits are the consequence of the declaration rather than the
  point. Model sonnet: G124 makes the boundary decision, this executes it against tests.

  WATCH ITEM for whoever pulls it, inherited from G109's groom and still live: each new row needs
  its `classification` per CLAUDE.md §3. A connection binding is operational metadata, so Internal
  is the likely answer, but it is a per-row call and no default exists.

  AMENDED 2026-08-30 to follow ADR 0017 Rev 2, which the acceptance's own opening sentence already
  required ("if that ADR is ruled differently, this acceptance follows the ruling"). Three source
  passes read the cited products rather than a survey of them, and the binding key changed as a
  result: per CARRIER, not per origin. Clause (b) gained the typed-report shape, (c) gained the
  no-defaults and register-at-expansion riders, and (f)/(g) are new -- the profile reference guard
  and the dollar-prefix write guard, both of which exist because a peer product omits them.
  A scope fence was added so the id/URN pairing is not started here; it rides its own gate.
  Evidence: `docs/design/openlineage-substrate-review.md` and
  `docs/design/datahub-substrate-review.md` (Rev 2), plus Ideas 215, 218, 220, 222.
