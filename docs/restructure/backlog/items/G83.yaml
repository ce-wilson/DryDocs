acceptance: |
  REPRODUCED AT THE GROOM, sample-only -- no database, no machine, so anyone can re-run it (J18). Parse the C30-conformant watcher description "DELIVERY_MECHANISM: MFTS_AGENT | USER: <acct> | FTS_ID: FTS2 | REC_ID: <id>,<id> | SOURCE_CONTACT: <dl>" and validate it as JobType.FILE_WATCHER: SEVEN findings come back on a description that is exactly what the ruled standard requires -- unknown_key on FTS_ID and REC_ID (the two tokens C30 introduced) and missing_required_token on ENV, INBOUND_ROUTE, OUTBOUND_ROUTE, EMAIL_DL_L3 and EMAIL_DL_L2 (the four C30 retired or moved to folder scope). TOKEN_REGISTRY still encodes the C29 capture; C30 ruled the set on 2026-08-11 and only the standards page moved. The module's own docstring promises it is "the single source both the parser and the published register read from, so code and document cannot drift" -- that promise is what broke, and a conformance model that reports conformant jobs as defective is worse than no model, because the findings look authoritative. (a) ADD the greenfield tokens: FTS_ID (watcher; vocabulary FTS1/FTS2/FTS6/FTS7 per the SME ruling carried in C30) and REC_ID (watcher; multi-valued on comma, a SOURCE-SYSTEM REFERENCE feeding dprod:inputPort -- explicitly NOT a route id). (b) DO NOT DELETE THE RETIRED ONES. The deployed estate still carries them and this parser's job is to read what is there: ENV-on-a-watcher, INBOUND_ROUTE, OUTBOUND_ROUTE and PDN_SNOW_QUEUE keep their entries plus a LIFECYCLE MARKER naming the ruling that retired them, so a legacy description parses them as a known-retired token instead of as an unregistered key. Deleting them would silently reclassify real estate data as somebody's private C16 team-local annotation, which is the one reading that governance cannot afford. (c) COMPLETENESS BECOMES ERA-AWARE: required_tokens() must not demand a retired token, so a job authored to C30 validates clean while a legacy job still validates against what it was authored to. The existing route-id exemption for non-MFTS_AGENT mechanisms stays as it is. (d) CONTACTS CHANGED CARRIER, they did not vanish. EMAIL_DL_L2 / EMAIL_DL_L3 are folder-scope documentation under C30, and EMAIL_DL_PDN is a THIRD member the FOLDER_VARIABLES table does not carry at all. Register the three at folder carrier under the C30 spellings and record that the folder-variable twins were spelled L2_EMAIL_DL_NM / L3_EMAIL_DL_NM before the rename, so a live extract authored either way still resolves. (e) RE-POINT THE STANDARD-OF-RECORD line in the docstring at the greenfield standard, with the metadata plan named as the earlier capture rather than deleted, and add a test that asserts the registry and the standard agree on the per-job-type set -- so the next ruling cannot land in prose alone. That test is the deliverable; the registry edit is the easy half. WHAT THIS MUST NOT DECIDE, stated in the acceptance so the evidence is not lost with the entries: marking the route pair retired is NOT an answer to whether the real MFT route id is the numeric form or the MFTS_RT_* string (Idea-104, still the SME's). Keep the note that records the two unreconciled shapes on whichever entry survives. Zero graph writes. Every token stays proposed; no relationship-vocabulary entry is ratified and no property term is bound.
notes: |
  Raised at the 2026-08-12 groom (desktop) from a cross-check of C30 (done, 2026-08-11) against the code it ruled -- not from an inbox line. WHY IT IS p1 rather than housekeeping: G68 is in next_ready and its folder-set PROFILE reads this contract, so a census run before this lands reports the retired set as missing on every conformant folder and the two new tokens as unknown; and G67's own conformance fixtures ALREADY emit "FTS_ID: FTS2", which the parser today calls unregistered. The drift is therefore live in the test tree, not hypothetical. WHY IT IS A BUG AND NOT A DESIGN QUESTION: C30 is done and SME-ruled, so nothing here decides anything -- the ruling simply never reached the module. The one judgment call is clause (b), retire-in-place versus delete, and it is made here rather than left open because the parser's stated job is reading a 4000-char field as the estate actually filled it. A greenfield standard governs what gets AUTHORED next; it cannot retroactively unwrite ~240K deployed descriptions. PORT CARE: docs/port-prompt.md records that description_tokens.py is UNION-MERGED, not wholesale -- producer holds parse_description / required_tokens / validate, the company adapter holds parse_tokens / classify_job_role, and the union survives only because the two name sets do not collide. Do not rename an exported symbol here; add to the registry and the completeness rule instead. SIBLING: G84 edits the same module and the same test file. Both are dependency-free; if both are open, claim them together and land one commit (the G75+G76 batch precedent).
