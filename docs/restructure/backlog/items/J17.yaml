notes: |
  Groomed 2026-07-28 from the same-day [chore] inbox line — the drift bit twice that day. Haiku-tier ritual wiring; no semantics. CLOSED 2026-07-28: acceptance option 2 — a default-paths render_board.py run now also runs render_gates (explicit --backlog/--out runs stay board-only, so tests/previews don't rewrite gates.json); snapshot.ps1 inherits the fold via its existing render_board call; CLAUDE.md stale-render line names gates.json. Verified: text-edited backlog + one render -> gates.json in sync, test_gates_json green. DONE 2026-08-12 (desktop). drydocs_lineage/extractors/catalog_crosscheck.py — four READ-ONLY reports, registered in extractors/__init__.py. No graph writes, no edges: attribution is a census and Epic K still owns what it means. THE SHAPE EVERY REPORT SHARES, and the part worth reading: a row that cannot participate in the join is held OUT of the set arithmetic rather than folded into either side. A DPL-origin dataset with no registration_source_ref, a distribution with no URN, an unparseable URN — each gets its OWN counted list. Folding them into catalog_only would report gaps that do not exist; dropping them would hide real defects. That is the G25 counted-AND-listed rule extended one step. The DPL join key comes from CatalogExtract.dpl_refs(), which G42 published for exactly this consumer, rather than being re-derived here -- the rule (the catalog guid is a CATALOG id; the DPL guid lives in registration_source_ref) is not obvious and must have one home, and joining on the wrong one returns a clean-looking zero overlap. ONE DEFECT FOUND IN THIS ITEM'S OWN WORK BY THE J26 DISCIPLINE, worth carrying: the URN parser split from the RIGHT, and the module comment justified it as protecting a dotted db.schema namespace. That reasoning was WRONG -- a dot is not the separator, so left- and right-indexing agree on any well-formed URN, and the injected left-indexed split left the suite green. The real case is a COLON inside platform/namespace, where BOTH readings are wrong (last-two drops db, fields-4-5 drops the table) and neither is detectably so. Now refused as ambiguous and bucketed as unparsed. The test that was supposed to cover it could not tell the two implementations apart -- a guard for a property nobody had tested. 23 tests on synthetic fixtures (no Neo4j, no network, re-runs anywhere per J18); six injected defects each proven to red the suite. Suite 2133 passed / 8 skipped. DONE 2026-08-12 (desktop). config/gate-prompts/snowflake-data-catalog.yaml — drydocs.gate-prompt.v1, Internal-Public, mechanism-only (<CATALOG>/AUTHORITY2 placeholders per the plan). Renders OPEN (77 gates, 16 open) because no gate-log entry is about it yet, which is the correct state for a drafted, unsigned page. Seven sections, 24 confirmations: A one-node-or-two, B cross-authority unification, C the attribution family + SEAL precedence, D the contact-point fold-in, E the layer-4 deferral, F publisher-as-property, G the standing scope/classification/ terminus clauses. Every clause is written as a confirmation TO BE SIGNED — where the plan carries a default (B default-NO, F property-now) the clause says so and asks the SME to confirm or replace it, rather than presenting it as settled. NO taxonomy-ontology-map entries were added, and that is the ruling rather than an omission: clause A decides one node or two, so HAS_DISTRIBUTION cannot be proposed before it. A4 asks explicitly whether that edge enters as status: proposed at this gate or only once a loader is groomed. Proposing it now would pre-decide A, which the acceptance forbids. WHAT G43 BOUGHT THIS PAGE: an evidence pack. Each clause names the report that answers it, and clause B4 carries the trap — the unjoinable bucket is NOT evidence, because reading a no-ref dataset as a miss inflates the apparent gap the default-NO would be weighed against. That connection only exists because G43 measured first. The plan's §Phase-3 forward reference to this exact path (line 166) now resolves; it had been dangling since the plan was written. Suite 2133 passed / 8 skipped; ruff clean; gates.json + board re-rendered.
