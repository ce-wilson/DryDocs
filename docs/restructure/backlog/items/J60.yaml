id: J60
epic: release-infrastructure
title: Module and package docstrings are enforced by nothing — enable ruff's D100/D104 instead of
  writing a bespoke guard, and fill the modules that have no docstring at all
type: chore
module: docs
phase: 8
agent: main
model: sonnet
priority: p3
status: done
depends_on: []
inputs:
- pyproject.toml
- .github/workflows/ci.yml
- docs/reviews/persona-python-architect-idea-181.md
acceptance: |
  (a) THE RULE COMES FROM THE LINTER ALREADY IN THE GATE, NOT FROM A NEW TEST. `[tool.ruff.lint].select` currently reads `["E", "F", "W", "I", "B", "UP", "N", "RUF"]` — no `D` rules at all. Add `D100` (missing docstring in public module) and `D104` (missing docstring in public package) to `select`, with the pydocstyle convention set explicitly so the rest of the `D` family is not switched on by accident. CI already blocks on `ruff check` (J10 stage 5), so the enforcement point is free; a bespoke docstring test would be a second, weaker copy of a check the toolchain ships.

  (b) THE EXISTING EXEMPTIONS SURVIVE. The vendored Anthropic skill scripts and the captured experiment records are already excluded from ruff for recorded reasons; the new rules inherit those exclusions unchanged. Tests and scripts get a per-file-ignore if the first run says they need one, with the reason written next to it in the same style as the existing entries.

  (c) THE MODULES WITH NO DOCSTRING ARE FILLED, NOT IGNORED. The 2026-08-27 measurement found 31 modules with no docstring; re-measure at pull time and report both numbers. Each new docstring says what the module is FOR in one or two sentences of U.S. business-technical English — not a restatement of the filename. Where the module has an obvious governing record (an ADR, a gate, a backlog id), cite it, which is what 214 of the existing docstrings already do; where it does not, do not invent one.

  (d) `ruff check` AND `ruff format --check` BOTH EXIT 0 on the tree as left by this item, verified locally before push, so CI's last two stages are green at the sha that ships this.

  (e) OUT OF SCOPE: function and class docstrings (D101/D102/D103), any date or provenance key inside a docstring, and the YAML header standard — that is J58/J59. This item adds two rules and the prose they demand, nothing else.
notes: |
  DONE on wip/j60-laptop (Lane B, laptop). Two commits, kept separate per the sender:
  the docstrings first, then the ruff config - so the rules never land on a tree they
  would fail.

  (c) RE-MEASURED AT PULL TIME, and both numbers reported as the clause asks. The item
  records 31 modules with no docstring, measured 2026-08-27. At this tree it is 8, and
  every one is D104 (a package) with ZERO D100 (a module). All 31 modules have been given
  docstrings in the intervening fortnight; what was left is the package __init__ files,
  which nobody had thought of as modules. Filling 8 rather than 31 is the real shape of
  the work, and it is the reason the clause said to re-measure.

  Each docstring says what the package is FOR rather than restating its path, and cites a
  governing record where one genuinely exists: ADR 0007 for the four agent packages,
  ADR 0002-A-1 for the drydocs remainder (with the placement test that decides what stays
  on that side), CLAUDE.md section 1 layer 2 for drydocs_core/ontology. The two test
  packages have no governing record and none was invented - they explain instead why they
  are packages at all, which is the part a reader cannot infer.

  (a) The rule comes from the linter already in the gate: D100 and D104 added to
  [tool.ruff.lint].select. No bespoke test was written; CI blocks on `ruff check` already,
  so the enforcement point was free.

  THE CONVENTION IS THE LOAD-BEARING HALF, and clause (a) is right to require it.
  Selecting any D rule without [tool.ruff.lint.pydocstyle].convention switches on a whole
  pydocstyle style guide nobody ruled on. It is pinned to pep257 with the reason beside
  it. D101/D102/D103 stay out per clause (e).

  POSITIVE-CONTROLLED, and the first attempt was WRONG in an instructive way. The probe
  files were named `_probe_mod.py` and `_probe_pkg/`, and ruff reported "All checks
  passed" - which reads as "the rules are not working" and is actually the rules being
  exactly right: D100 and D104 say "public module" and "public package", and a leading
  underscore makes both private. Re-run with public names, both fire from the config:
  D100 on drydocs_core/probemod.py and D104 on drydocs_core/probepkg/__init__.py. Worth
  recording because the failing probe looked like a config defect and was not.

  (b) The existing extend-exclude entries (the vendored Anthropic skill scripts, the two
  captured experiment result trees) are untouched and the new rules inherit them. No
  per-file-ignore was needed for tests or scripts: the first run came back clean, so none
  was added - an ignore nobody needs is the kind of thing that reads as a decision later.

  (d) `ruff check .` and `ruff format --check .` both exit 0 on the tree as left here,
  verified locally before push, so CI's last two stages are green at this sha.

  Groomed 2026-08-28 from Idea-181 (captured 2026-08-27), prescription F4 of its python-architect persona review: enable ruff D100/D104 rather than build a bespoke docstring guard. Filed separately from J58/J59 because the language, the enforcement mechanism and the failure mode are all different — those two are JSON-Schema guards over governed YAML; this one is two lines of lint config plus the writing they oblige.

  Verified before grooming: `select` in `pyproject.toml` carries no `D` rules; the vendored-skill and captured-experiment ruff exclusions exist with their reasons recorded.

  Epic release-infrastructure / module docs / phase 8. `module: docs` rather than a code component because the deliverable is prose about modules plus a lint setting, and it spans every package rather than belonging to one — the same call J50/J52/J54 make. Model sonnet: (c) is writing, not lookup, and a haiku pass would produce filename restatements.

  Priority p3: nothing is broken today. The value is that a module arriving with no docstring stops being invisible, which matters most to the Team Edition reader who has no author to ask.
