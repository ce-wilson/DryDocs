acceptance: |
  (a) product_lines.cypher (parent :CatalogLOB) and area_products.cypher (parent :Product) take the products.cypher shape — OPTIONAL MATCH, an orphan flag written on EVERY run rather than only ON CREATE, and the unresolved parent id KEPT on the node. The defect: a hard MATCH placed AFTER the node MERGE leaves an unparented node still carrying `orphan: false` from ON CREATE, a flag no code path could ever set true. (b) All THREE catalog loaders stop blanking values on a sparse refresh — `SET x.name = row.name` becomes `coalesce(row.name, x.name)`, and the same treatment covers any other enrichment property a partial extract may omit. (c) The question C17 did not answer is answered and recorded: whether the unresolved-parent count is emitted as a `drydocs.loader/unresolved-parent` item in the O28 status envelope (a namespaced type, no new fields — inside the ruled contract, so no gate) or stays a node property only. Loader tests cover a row whose parent is absent and a row whose name is null.
notes: |
  Groomed 2026-08-02 consolidating TWO inbox lines that land on the same files — one pass, one review (the L19 precedent): the 2026-08-01 [bug] parent-join sweep and the [source] company-comparison finding. C17 deliberately did not sweep ("changing four loaders' write behaviour on one item's authority is a drive-by") and inboxed it instead. VERIFIED AT THE GROOM rather than transcribed: the hard MATCH is live at product_lines.cypher:27 and area_products.cypher:22, and the unconditional name SET at products.cypher:28, product_lines.cypher:22 AND area_products.cypher:17 — so (b) covers three files, not the two the inbox line named. product_lines.cypher even carries a comment saying it is "the same silent-miss shape products.cypher just" fixed. The coalesce idiom is borrowed from the company comparison; no code is.
