id: S2
epic: structure-remediation
title: Create drydocs_core/orchestration/ as the parent of controlm/, with the vendor-neutral shell/paths/crosswalk
  surface beside it (ADR 0008, F1)
type: task
module: drydocs-core
phase: 6
agent: main
model: fable
priority: p1
status: done
depends_on:
