acceptance: |
  drydocs_core/orchestration/ exists holding __init__.py, shell.py, paths.py and crosswalk.py, with controlm/ moved beneath it by git mv and its content otherwise unchanged — except the two mixed modules split along the line the ADR draws: commands.py into shell.py (argv/statement parsing, launcher registry) plus controlm/fields.py (PRECMD/POSTCMD/CMD_LINE routing), and paths.py into the neutral canonicalization half and the Control-M {ODATE}/FileWatcher token half. crosswalk.py reads config/crosswalks/*.yaml as the gate-confirmed native→baseline map. Every importer updated, MODULE_MAP.md carries the new core rows, test_module_boundary.py green (core still imports no component), full suite green. NOTHING in the graph changes — no label, no relationship vocabulary entry, no Cypher; :ControlMJob/:ControlMFolder/:ControlMServer stay exactly as they are (ADR 0003 rule 4).
notes: |
  The review measured this before recommending it: ~1,100 of controlm/'s 1,725 lines are irreducibly Control-M (AutoEdit %%NAME|VALUE syntax, variable simulation, folder-name convention), so RENAMING the directory to orchestration/ would put a neutral name on the most vendor-coupled code in the repo — the exact failure ADR 0004 exists to prevent. The real gap is that controlm/ has no parent and no sibling slot, so an AutoSys or Airflow module has nowhere to land. Additive: one git mv, one new package, two file splits. Do the CORE move before the console ships (the API's query specs are where an orchestrator assumption would first become a public contract); the drydocs/loaders/controlm_* + sql/ + cypher/ reshuffle is internal and follows in S5's phase (review §5 Phase 3, F1b).
progress: |
  DONE 2026-08-02 (laptop). One git mv, one new package, two file splits, one new module, 25 importers repointed. Suite 1352 / 7 skipped, ruff + format clean, no graph change of any kind.
  THE ADR WAS WRONG ABOUT ONE THING AND THE BUILD SAYS SO. ADR 0008 classified commands.py as "Mixed" and scheduled its "PRECMD/POSTCMD/CMD_LINE and EMBEDDED_SHELL/UCM field routing" out into controlm/fields.py. Measured here: that routing IS NOT IN THAT FILE. Those field names appear only in the module docstring and two explanatory comments; every executable line was already vendor-neutral. The real routing lives in controlm/variables.py (SHELL_VAR_NAMES + the EMBEDDED_SHELL classification — already vendor-side, which is where rule 1 wants it) and in drydocs/staging.py (component-side, load-cadence, ADR 0002-a §6). Neither moved: S2's acceptance freezes controlm/ apart from the two named splits. So commands.py went to orchestration/shell.py WHOLE, and fields.py is deliberately thin — the field vocabulary, a parse_field router for a caller holding a field NAME, and the UCM container-override extraction, which is the one genuinely Control-M-shaped function commands.py did carry. Inventing routing code to fill a planned module would have been worse than recording that the plan over-estimated the split. ADR action item 2 now carries this correction.
  THE paths.py SPLIT NEEDED A SEAM, NOT A CUT. Neutral and vendor were entangled: build_file_ref calls the canonicalizer, the date-token reader and looks_like_path, and all three carry Control-M vocabulary (?-runs -> {TS16}/{Q<n>}, {ODATE}, the unresolved-%% exclusion, the FILEWATCH role rule). Cutting the file in half would have either duplicated the assembly or left the neutral half importing the vendor — the exact direction rule 1 forbids. So the neutral module owns the FileRef shape and the assembly and gains PathDialect; controlm/paths.py declares the Control-M dialect and re-exports the neutral functions bound to it. Every existing caller gets byte- identical behaviour, and a second orchestrator supplies a dialect instead of forking the module — which is the reusability ADR 0008 was actually buying. NEUTRAL is a real usable dialect (identity canonicalization, no date tokens), not a stub. Ordering preserved deliberately: dialect role rules are checked BEFORE the neutral ones, because FILEWATCH was first in the pre-split list and has to keep beating the generic OUT/LOG hits on names like FW_OUT_DIR.
  crosswalk.py IS THE ITEM'S REAL VALUE. config/crosswalks/*.yaml had been gate-confirmed since 2026-07-14 with NO runtime reader, so `fidelity: no-equivalent` was a warning in prose that nothing could enforce — an unmapped concept could be rendered as the nearest Control-M label and the graph would assert something no gate ruled. resolve() now RAISES NoEquivalentError with no nearest-match fallback, tells the caller when a mapping is `approximate` rather than letting it read as exact, REFUSES a `status: proposed` crosswalk at runtime (a proposed crosswalk is a gate's input, not a mapping), and rejects an unknown fidelity value because a new tier is a gate decision, not a typo. 16 tests over both confirmed crosswalks.
  THE GUARD IS NARROWER THAN THE ADR ASKED, ON PURPOSE. Action item 4 said "nothing outside orchestration/controlm/ imports Control-M-specific modules" — taken literally that fails on its first run, because drydocs/staging.py, drydocs/cli.py and the lineage extractors all import the Control-M parser and are RIGHT to: they ingest Control-M. The enforceable invariant is the WITHIN-CORE direction — the neutral level must never import the vendor — plus a shape guard that fails if drydocs_core/controlm/ reappears at the top level. That pair is what makes a second vendor possible; the literal reading would only have made the suite red.
  Three exception names hit N818. Renamed rather than per-file-ignored: the config layer already uses the Error suffix (UnknownSpecError, UnknownDomainError are exact analogues), and adding a fourth ignore for brand-new code with zero external call sites is the shape of reasoning the B023 commit warned about. The existing N818 ignores rest on 55 call sites and port-collision cost; neither applies here.
  NOT DONE, and named: ADR action item 5 (folder-vs-module naming — web/ <-> drydocs-web, agents/ <-> drydocs-agents, libs/) is a DECISION, not a chore. One of its two options rewrites `module:` on live backlog items, which is governance and outside this acceptance. Item 6 (the drydocs/loaders/ mirror) is phase 3 and now unblocked. Port sequencing (item 7): step 53b added, and it flags that scripts/render_enforcement_matrix.py is a 3-way merge company-side — they carry 4 company-only SURFACES rows, so the launcher-registry consumer change and the new orchestration-crosswalks row must be taken INTO their file, not over it.
