notes: |
  Groomed 2026-07-19 from the same-day [bug] inbox line. The sanitized-mirror attempt was ABORTED at PUBLISH-BOUNDARY enforcement step 3 — nothing was published; the aborted export in the session scratchpad holds the grep-hit evidence. Module=config (classification.yaml is the enforcement surface), phase 8 beside J5's publish-boundary CI guard; fable per the matrix — publish-boundary decisions. p1 because it blocks ANY future public artifact, but not p0 while the repo stays private. The backlog pull loop must SKIP this item until the user supplies the term-list confirmation (the J10 confirm-at-start idiom). MERGED IN 2026-08-05 (desktop, Idea-38 — the parked "internal platform vocabulary in the sample corpus" ruling): that entry is the SAME decision this item's user-gated start asks for, so it rides here rather than opening a second one. It widens the term list the user must rule on beyond the SEALIDs J14/J15 already swept, to FOUR value classes deliberately left untouched by the 2026-07-27 sweep: (1) platform tokens (`HLDM`, `PRARAG`, `svc.hldm`, `/opt/scripts/hldm/`, `host-hldm-01`) — RULED 2026-08-11, SME: AUTHORED FIXTURE NAMES, NO SWEEP OWED. Class (1) is CLOSED; the recorded ruling lives in internal/standards/technology/folder-naming-convention.md beside the J15 realness table, because that table replaced the NUMERIC segments inside these folder names and reading it alone suggests the surrounding tokens were left by oversight. They were not — the ids were the real part and they are gone. A sweep of the tokens was proposed the same day and stopped by the ruling: `PRARAG` sits in ~36 files including the bundled sample corpus, the lineage fixtures and FIVE tests that assert on it literally, so removing an authored name would have rewritten the corpus and broken the parser's own pins. The remaining THREE classes are still user-gated; (2) datacenter codes — and note `knowledge/standards/technology/data-center-naming-convention.md` carries real DC codes AND a real app code, same class and same sibling directory, out of J14's scope by accident of scoping rather than by decision; (3) schema/table/column identifiers (`psgmgr` / `cm_escalation_db` / `EJOBNAME` / `ECOMPONENT`), generalized out of the two J14 files but still present in 6+ tracked files — the controlm-db skill, gate prompts, the taxonomy-ontology map, the remediation TDD; (4) synthetic-sample product NAMES that ECHO real ones ("Home Lending Servicing" in lob-product-team.yaml, paired only with synthetic ids) — the subtlest class, because the ids are clean and the name is not. THE QUESTION IS THE SAME FOR ALL FOUR and is the user's: is platform vocabulary publishable MECHANISM, like the naming grammar, or a value class to synthesize? Once ruled, J15's value-shape guard test grows a rule per class, which is what turns the ruling into something that cannot drift back. ALL FOUR CLASSES NOW RULED — 2026-08-11, recorded in config/gate-log.md ("RECORD: J13 publish-ceiling value classes 2, 3, 4"). (1) platform tokens: AUTHORED, no sweep. (2) data-center codes: SWEPT — SME ruled the position-1 environment letter swaps to a non-production value across 19 tracked files; real inventory moved to internal/standards/technology/data-center-inventory.md; the sanitize rule is now in config/classification.yaml and Scan E in tests/unit/test_publish_boundary_values.py enforces it. (3) schema/table/column ids: NO SWEEP OWED — already covered by the SIGNED N9 source-registry-v2 id grammar, which redacts the database and publishes schema.table; cm_escalation_db reads as a database because of its suffix but is a TABLE inside psgmgr. (4) sample product/LOB names: ruled publishable (assistant's call under the SME's "no preference") — ids are the identity-bearing half, are in-block, and are guarded; names are not policed. TWO THINGS THIS PASS FOUND THAT THE ITEM DID NOT KNOW ABOUT. (a) A FIFTH data center (P045) in a test fixture and the web demo data — the guard's SHAPE scan caught it, the token-list sweep could not have. Third instance of the J15 lesson: enumerate the shape, never the values. (b) Real per-data-center VOLUMETRICS in controlm_staging_ddl.sql — a distinct class, NOT covered by the SME's identifier ruling. The per-DC split was pulled to the internal twin and the totals kept (the sizing rationale rests on totals); FLAGGED for an SME ruling, and reversible. The J15 realness table's parked "string-vocab ruling" on the real job name is DISCHARGED by class 2 — that name was swept in this pass.
