acceptance: |
  Four defect classes C32 observed with no rule to hold them are registered AND detected in one change. The pairing is the item: the registry is the single source for both the validate gate and the greenfield gate, so a detector with no entry emits findings nothing can rank, nothing can turn into a fix, and -- the real problem -- nothing can SIGN OFF on. The entry is the thing that gets ratified. (a) R41 DUPLICATE DECLARATION IN ONE SCOPE -- one name declared twice in the same container with different values. Live: RPATH twice in one folder, a relative path and an absolute one. Severity must-fix, not should-fix: which value wins is an ordinal accident, so the job runs against whichever declaration happens to be last, and the reader of the folder sees both and cannot tell. (b) R42 FOLDER-NAME DELIMITER DRIFT -- one folder set mixing separators between the same positional fields, so a SQL parse splitting on the delimiter returns different field counts per folder. Live: two folders of one set using an underscore where their siblings use a hyphen. This is the rule whose finding must name the PARSE consequence, not the cosmetic one. (c) R43 CARRIER COLLISION -- one name resolved by two different resolvers in one command line: a Control-M %%VAR beside a shell ${VAR}. THE ENTRY MUST RULE WHICH CARRIER OWNS THE NAME BEFORE THE DETECTOR SHIPS, because the greenfield action differs completely by answer -- rename one carrier, or declare the shell export -- and a detector that fires without that ruling produces findings no one can act on. If the ruling is not available, R43 is registered status OPEN with no detector and the item says so; it does NOT ship a detector against an undecided rule. (d) R44 STALE AUTHORED PROVENANCE -- an authored "created by" field that travelled with a copied job, so it names the template's author rather than the job's. Detectable as one value across jobs whose independent audit trail names different users. Advisory severity, and the finding must say what to read INSTEAD (the creation/modification audit fields), since the value is not wrong so much as answering a different question. All four land status PROVISIONAL and emit ratified=False, per the module rule that only ratified rules may change a definition. Each gets its entry in the existing registry shape (check / engine / severity / status / source / greenfield action), a detector in the conformance pass, and a case in the drifted fixture -- with the greenfield fixture still raising ZERO findings, which is the assertion that the standard stays reachable. Suite green, ruff clean, publish-boundary clean.
notes: |
  Raised 2026-08-11 (desktop) at SME request, immediately after C32 listed the four classes and deliberately did not build them. THE REASON THIS IS ITS OWN ITEM RATHER THAN A WIDENING OF G67: G67 shipped R30-R40 as a closed set with a signed-off shape. Adding rules to it means either reopening a done item or quietly growing it, and the second is exactly how a rule set stops matching the registry that is supposed to govern it -- the failure the pairing rule exists to prevent, committed by the change that implements the pairing rule. SCOPE DISCIPLINE, stated because three of these are easy and one is not: R41, R42 and R44 are mechanical and would ratify quickly. R43 is a genuine question about which carrier owns a name, and its answer changes what a fix even looks like. Do not let the three easy ones carry the hard one over the line -- shipping R43 as provisional-with-detector when the ownership question is open would put a finding in front of an SME that has no defensible action attached to it. NOT IN SCOPE: ratifying any of them. That is the HITL gate's, and it wants real findings from a real folder set rather than fixture hits -- which is what G68's profile run produces. The governance walk-through these four are the worked example of lives in drydocs_remediation/overview_readme.md.
