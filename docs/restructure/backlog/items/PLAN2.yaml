acceptance: |
  Gate ontology-domain-registry-and-edition-grain §C1 + §C4 (SIGNED OFF 2026-09-02). PLAN1 made the series the module; this adds the
  OPTIONAL edition segment in front of it and retires the two numeric partition rules.

  (a) GRAMMAR: `[<EDITION>-]<MODULE><n>`, edition first, base edition unprefixed. `LOAD12` is
  producer main; `<code>-LOAD12` is that edition's twelfth load item. SEVEN id-shape sites
  change, not three (review F1, docs/reviews/restructure-design-review-2026-09-02.md): validate.py :67 `_ID_RE` and :68
  `_FILE_RE` (the filename regex today matches `LOAD1` inside `AUTO-LOAD1.yaml` and silently
  DROPS the segment); backlog_store.py `_ID_RE` (natural_id_key sorts an unparsed id after
  every conforming one); the three bare-character extractions in test_backlog.py (:232
  digits, :395-396 and :417 `isalpha()` joins - these do not fail on a segment, they turn
  `AUTO-LOAD1` into series `AUTOLOAD` and STOP GUARDING, which is worse than failing); and
  drydocs/port_preflight.py :88, whose claim-commit pattern `[A-Za-z]+[0-9]+` stops
  recognizing an edition claim and lets the port coverage guard count it as substantive.
  The three test_backlog.py extractions are replaced by ONE parse helper that uses the
  allocator's regex (the test already imports the allocator for the agreement guards at
  :267 and :352), so there is one grammar the test cannot drift from. Every existing id
  parses unchanged - the round-trip guard over all 630+ ids is the first test written.

  (b) BOTH HALVES DECLARED: an edition segment must be a `code` in editions.yaml (CFG2) and a
  module code must be in modules.yaml `series`; an undeclared edition is a typo, not a tenant,
  and fails; an undeclared module code fails as it does today.

  THE VENUE IS DECLARED, NOT INFERRED (review F2 - the most important finding): `.claude/**`
  is canonical-producer, so the company runs THIS allocator, and once the band retires
  nothing tells it which venue it is in - a company session that forgets `--edition` mints
  `LOAD13`, the producer's next id, and nothing refuses it. So the allocator reads the
  venue's edition from config/dev-environment.yaml, key `edition:` - `base` on the producer,
  the company's own code on the company - the file that is already canonical-company
  (PORT-MANIFEST.yaml:322) and already carries a per-side flag for exactly this reason
  (`capability_assert`, and its note: "the divergence lives in the one file already ruled
  per-side"). `--next-id --module <m>` mints in the venue's edition; `--edition <code>`
  overrides DOWNWARD only (a base may mint for an instance it hosts; an instance may not
  mint for its base or for a sibling); a venue whose file declares no `edition:` mints
  nothing and the refusal names the key to set. ADR 0015 D3's "declared, not inferred",
  applied to the allocator's own venue.

  THE IDEA SERIES HAS NO GRAMMAR IN THIS ITEM YET (found 2026-09-03: the company minted
  Idea-10012 in the band during its port retry, and the band retires forward-only). The
  allocator treats `Idea` as its own case (validate.py IDEA_SERIES), outside the module
  codes, so `[<EDITION>-]<MODULE><n>` says nothing about the inbox. Rule it here, one way:
  either `<EDITION>-Idea-<n>` on the same segment rule (an instance's inbox is its own,
  DOC1 says the inbox is instance-owned), or the Idea series stays band-numbered
  forward-only as a deliberate exception written into the band-retirement text. The
  first is consistent; the second is cheaper and leaves one grammar with two shapes.
  Recommend the first; the guard in (e) covers `Idea` ids too.

  (c) RETIRE BOTH PARTITION RULES, FORWARD-ONLY: the DD reserve (git-readme.md:197,
  2026-07-20) and the 10000 band (PRODUCER_BAND_CEILING, 2026-08-18). Neither governs a new
  mint. DD1-DD10, DD10001-DD10003 and G10001-G10003 stay readable and stay in the frozen
  table; the band check in the allocator becomes the edition-segment check of (b); the
  git-readme sentence is retired with a pointer to the gate record; RESERVED_SERIES keeps DD
  refused (it is frozen, like the letters). CLAUDE.md's mint rule and the skill gain the
  `--edition` case.

  THE FROZEN_BAND TABLE IS PLAN3'S, NOT THIS ITEM'S (re-pointed 2026-09-02). It was
  first written here (review F3) and then pulled out, because PLAN1 merged after
  port-base-20260901 and the next roll carries the freeze before this item can land -
  Idea-242's trigger. PLAN3 ships FROZEN_BAND = {"G": 10003, "DD": 10003} with its
  agreement guard on main before that roll; this item's band retirement (above) reads
  FROZEN_BAND as it finds it and retires nothing in it - the six legacy band ids stay
  legal forever, forward-only.

  THE FETCH FAILURE IS SILENT WHEN REMOTE REFS EXIST (review F12): `_git` returns "" on any
  failure, and the two warnings after the fetch (validate.py :360, :368) fire only when
  there are NO remote refs or NONE could be read. A failed fetch on a checkout that has
  refs is neither - the stale refs read fine and the union is silently a day old, which is
  the case the fetch exists to cover. The fetch call alone reports success or failure, and
  a failed fetch prints a third warning: fetch failed, remote refs may be stale, treat the
  number as provisional.

  (d) UNTIL THE COMPANY MINTS ITS EDITION CODE IT MINTS NOTHING NEW - and the allocator's
  refusal message for a band-shaped or DD id says exactly that, naming CFG2's file. Acceptable
  only because the code is one row and one push away (§C4).

  (e) GUARDS in test_backlog.py: round-trip over every current id; edition present =>
  declared; module code present => declared; a base item never carries a segment; the
  allocator refuses an undeclared edition, a DD id, and a band-shaped number, each naming the
  replacement; a venue with no declared `edition:` is refused naming the key; the three
  FROZEN_BAND ids parse and pass. TWO PARSERS, ONE GRAMMAR (review F4): validate.py :67
  accepts uppercase only and no suffix, backlog_store.py :84 accepts any case and an
  optional `[a-z]` suffix, and nothing asserts they agree - the FROZEN_SERIES and ceiling
  constants have agreement guards because the duplication is deliberate; the regex is the
  one duplicated thing without one. Add it: a fixed list of ids, one with a segment, that
  must parse identically in both, and rule the suffix (no item id carries one today).

  Depends on CFG2 (the edition registry the segment validates against).
notes: |
  Minted 2026-09-02 under PLAN1 at gate ontology-domain-registry-and-edition-grain §E1;
  (b)'s Idea half ruled at the rider idea-series-grammar (SIGNED 9/9, 2026-09-05).

  BUILT 2026-09-05 (desktop, Lane A; claimed ca49cd89). 3288 unit tests green (floor 3278),
  ruff clean, CLI import + --help green. Acceptance proof for the rider's D1: `--next-id
  Idea` returned Idea-258 before and after.

  (a) as built - the seven sites: validate.py `_ID_RE` and `_FILE_RE` (the filename regex
  now anchors at a token boundary, so `XMPL-LOAD1.yaml` yields `XMPL-LOAD1` and never
  `LOAD1`); backlog_store.py `_ID_RE` (uppercase only, no suffix, named groups; an unparsed
  id sorts LAST as text with a comment saying so); test_backlog.py's three bare
  `isalpha()`/`isdigit()` joins replaced by ONE `_parse()` over the allocator's regex; and
  drydocs/port/port_preflight.py's three claim patterns, which now admit the `<CODE>-`
  segment (pinned by three new ritual subjects in test_port_preflight.py). The Idea shape
  got the same seven-site treatment the rider's Module line enumerates: `_IDEA_RE`,
  `_IDEA_IN_DIFF_RE`, the short-circuit at :360-364 (retired - `next_idea_id()` replaces
  it), the two render lines, and test_plan_ideas.py's `_HEADER`, `_all_idea_ids` and the
  band guard's parse (which now skips an edition's own inbox: only the base is banded).
  The round-trip guard over every current id was written first and passed unchanged.

  (b) as built. `venue_edition()` reads config/dev-environment.yaml `edition:` and nothing
  else; the producer declares `base` (added in this commit, with the reason in the file's
  own comment - it is canonical-company, so the company's copy carries the company's code
  and a port never overwrites it). `resolve_edition(requested, venue, kind=...)` is the one
  place the downward-only rule lives: a base may `--edition <code>` for a code
  editions.yaml declares; an instance mints for itself only; an undeclared segment is
  refused as "a typo, not a tenant"; a venue whose own declared code is not in the
  registry is refused naming both files. `next_id()` counts max+1 WITHIN the (edition,
  series) pair - `XMPL-LOAD1` starts that edition's LOAD numbers at 1 - and the base stays
  at or below PRODUCER_BAND_CEILING (a band-shaped base number is refused as the retired
  rule's shape). `next_idea_id()` is the rider's one branch: base unprefixed at or below
  the ceiling, counting only unprefixed ids at or below it (so a company idea that lands
  by union-append never jumps the base to 10035); a declared code counts its own; an
  UNDECLARED venue mints band-shaped `Idea-<n>` above the ceiling and may not override.

  (c) as built. The allocator's band check became the edition check above; the DD refusal
  stays and now names the retirement and the replacement; git-readme.md:196-201 is
  rewritten around the retirement with the record cited (the 2026-07-20 incident kept as
  history); CLAUDE.md's mint rule and SKILL.md:50 carry the `--edition` case and the
  undeclared-venue rule; the inbox header's "Allocator bands" section is retitled RETIRED,
  leads with what replaced it, and keeps the old text and its tokens because every id the
  old rule produced is still read by it (test_plan_ideas' documentation guard still holds).
  FROZEN_BAND is read as PLAN3 left it and nothing in it moves. F12: `fetch_remotes()`
  reports success or failure through a new `_git_run()`, and `_report_allocation` prints a
  third warning when the fetch failed on a checkout that has refs - the case the other two
  warnings could not see. The report also prints `venue:` first.

  (d) as built: the item-path refusal for a venue with no `edition:` names the key, both
  files, §C4 and the sentence "the company mints nothing new until it has minted its code".

  (e) as built - nine new guards in test_backlog.py: the two-parser agreement over a fixed
  list of seventeen ids (ten parse, seven refused by BOTH - lowercase, a suffix, a 1- or
  6-letter segment, no number), which RULES the suffix: no item id carries one; the
  round-trip; edition-present => declared and the base carries no segment and every
  series is a module code or a frozen letter; the allocator matrix (base, downward,
  instance-for-itself, undeclared segment, instance-for-base, instance-for-sibling,
  ghost venue, undeclared venue); the Idea path matrix (base ignores band-shaped
  entries, never the gap, declared code, downward, undeclared venue band-shaped from
  10000, undeclared cannot override, the segment in both Idea regexes with the split
  suffix intact); the six FROZEN_BAND ids parse and pass; the venue file declares base.
  The frozen-strays helper now reads the SERIES whatever segment precedes it, so an
  edition id in a frozen letter (`XMPL-G1`) is a stray for every venue, not only the base.

  WHAT THIS CHANGES FOR THE COMPANY WHEN IT PORTS, said plainly: `.claude/**` is
  canonical-producer, so their allocator becomes this one, and until their
  dev-environment.yaml declares `edition: <their code>` it mints no ITEM id (by design,
  §C4/PLAN2 d - CFG2 (c) bars the producer from naming the code, so their edition gate
  runs first) and mints ideas band-shaped (rider C1, exactly the shape their 10009..10034
  already have). The relay is DOC2's; a one-paragraph FIFTEENTH POSTSCRIPT in the ledger
  says it now so the refusal is never a surprise.

  NOT DONE HERE, by the acceptance's own fences: PLAN4 (the edit side; `--mint-pending`
  goes through this `next_idea_id()`), the sharded inbox (ADR 0019), the company's own
  edition code (their gate). Idea-257 (the SME's B1 note) stays parked for grooming.
