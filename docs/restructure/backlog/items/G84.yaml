id: G84
epic: component-topology
title: Teach the description parser the DD1| sentinel — three disjoint description populations, so legacy
  prose stops manufacturing tokens and the compliant marker stops being reported as a defect
type: task
module: drydocs-core
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- drydocs_core/orchestration/controlm/description_tokens.py
- tests/unit/test_description_tokens.py
- knowledge/standards/technology/controlm-guidelines-and-standards.md
- config/gate-prompts/email-dl-contact-point.yaml
- internal/controlm-config/controlm-pipeline-stub-integration-plan.md
acceptance: |
  REPRODUCED AT THE GROOM, sample-only (J18): parse_description ("DD1|DELIVERY_MECHANISM: MFTS_AGENT | FTS_ID: FTS2") returns an unparseable_segment finding FOR THE MARKER ITSELF -- the parser reports the one thing the standard makes mandatory as a defect. And parse_description("NOTE: rerun after 08:00 | contact: ops team") returns two "tokens" (NOTE, contact) with two unknown_key findings, so legacy waterfall prose is indistinguishable from a legitimate C16 team-local annotation. Guidelines section 7.5 specifies the fix; nothing implements it. (a) ONE CONSTANT, ONE PREDICATE. The marker lives in a single module-level constant and the test is startswith at position 0 -- no strip, no substring search. Section 7.5 gives both reasons and both are load-bearing: a description that QUOTES the convention in prose cannot false-positive, and startswith is the cheapest predicate available to a SQL scan over the whole estate. (b) THE PARSE RESULT CARRIES THE POPULATION -- tagged / generator-literal / untagged -- and the token grammar applies only to the tagged one. The marker itself never becomes a token and never becomes a finding. Untagged is not a defect and must not be reported as one: untagged means unread. (c) THE DIGIT IS A VERSION, NOT A TEMPLATE ID. Parse it as a version and report it, so DD1 and a future DD2 are read side by side through a grammar migration. The module must state that the marker MUST NOT select a job template -- TASKTYPE derived plus the registered JOB_ROLE token do that (section 7.2) -- because spending the version slot on template identity leaves the first grammar change with no way to announce itself. (d) COVERAGE, NOT COMPLIANCE: a helper reports tagged / total over a set of descriptions. The measure of this standard is tagged folders divided by folders, a number that grows, NOT "how much of our metadata is wrong", a number that never closes. Fewer than ten folders carry the standard today; that is a sample, not a shortfall, and the acceptance should not pretend otherwise. (e) FOLDER SCOPE IS DOCUMENTED, NOT ENFORCED. Record in the module why folder scope is preferred -- get_description() is generator-owned, so a tagged block on a GENERATED JOB is overwritten at the next regeneration and the tag does not protect it. The parser reads whatever it is given; the note exists so nobody tags jobs and loses the block. THE FENCE, and it is the reason this item is small: this implements a READ gate over free text and ratifies nothing. Exit (d) is recorded at gate email-dl-contact-point as rider section G6 with a written warrant, and THE GATE STILL RULES IT -- so the marker stays in exactly one constant and a different ruling is a one-line change, not a rewrite. Zero graph writes; every token stays proposed.
notes: |
  Raised at the 2026-08-12 groom (desktop) from Idea-105, which the 2026-08-11 SME design session resolved on an exit none of its three recorded ones described. THE PROBLEM IT SOLVES: two things claim the same 4000-char DESCRIPTION field -- the DPL generator's literal, which the stub plan's E1 discriminates on an EXACT match, and the company token standard captured at C29. Adding a token block to a generated object breaks E1; requiring the literal leaves the token block nowhere to go. A versioned sentinel PARTITIONS the field instead of choosing between them: the three populations become disjoint, both readers keep working, and NOTHING ALREADY DEPLOYED MIGRATES -- strictly cheaper than losing the metadata where the estate is densest, invalidating E1 on every generated object, or finding a new carrier the generator stamps. IT ALSO RETIRES C29's PROPOSED GENERATED_BY TOKEN, which is why no item mints one: absence of the tag on a literal-match description already IS the provenance signal, so a token asserting it would be a second carrier for one fact. Verified at the groom that TOKEN_REGISTRY never grew one. CONSUMER: G77 clause (a) registers a THEME token INSIDE this block and now depends on this item for that reason. COMPANY RELAY: their copy of the gate prompt is canonical-company and did not take the producer edits, so RELAY-7 carries the rider across. Nothing in this item ports on its own. SIBLING: G83 edits the same module and the same test file -- if both are open, claim them together and land one commit.
