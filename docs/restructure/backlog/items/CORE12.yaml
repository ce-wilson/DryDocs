  THE MEASUREMENT CHANGED THE QUESTION, so it goes first. The report counted 22 of 34 modules
  imported by components from outside __all__. Re-measured at HEAD: 32 of 39 - the gap widened by
  ten in three days, which is the report's own "compounds fastest" prediction happening while the
  item sat in the backlog. But the number that decided the shape is the other one: EVERY top-level
  module and subpackage in core, 39 of 39, is imported from outside core. There are no internals.
  So this was never "sort the existing modules into public and private" - core has no line AT ALL,
  and every module added to it becomes public by accident. That reframes what a fix is for: not
  tidying today's list, but making the fortieth module a decision instead of an omission.

  THE RULING - the boundary test gains the second axis, backed by a declared registry. Of the three
  shapes the acceptance offered, this is the third, and the reasons the other two lose are concrete
  rather than aesthetic.

  (1) GROW __all__ - rejected on a cost this repo has already paid once. __init__.py EAGERLY
  imports the seven names in __all__, so growing it to 39 makes `import drydocs_core` pull in yaml,
  neo4j and pydantic-settings. The repo guards import order and cost with a subprocess-per-import
  test (tests/unit/test_cli_import_order.py) precisely because that gap shipped a cycle (S13). A
  contract must not be paid for at import time. There is a plain category error underneath it too:
  __all__ governs `from drydocs_core import *`, which nothing in this repo does, so it declares
  names for star-import rather than an import contract between packages.

  (2) MARK INTERNALS BY CONVENTION - rejected because the measurement says there is nothing to
  mark. Zero of core's 39 are internal today. A convention with no members is one nobody learns,
  and it would still leave module 40 public by default, which is the actual defect.

  (3) A DECLARED REGISTRY, DEFAULT-DENY - chosen. PUBLIC_MODULES sits in
  drydocs_core/component_map.py beside CORE_PREFIXES and COMPONENT_GROUPS - the object that already
  holds the other two axes and is already read by three consumers (the boundary test, the
  MODULE_MAP renderer, the Team Edition copier). It is this repo's own idiom for exactly this kind
  of question, where registration IS the act. __all__ stays as it is, a correct star-import
  surface, and __init__.py's docstring now points at the contract so the two are not confused
  again.

  WHAT THE LIST IS NOT - an endorsement that all 39 should be public. It is the contract AS IT
  STANDS, recorded so it can be argued with. Narrowing it is a later item and a real per-module
  decision with the call sites in hand. repo_paths - 31 component call sites, the report's headline
  - is now declared, which is what the acceptance asked for it: the package says it was promised,
  so changing its signature is knowably a breaking change rather than ambiguously one.

  THREE GUARDS, because a default-deny guard that scanned nothing is green - the ADR 0021 disease
