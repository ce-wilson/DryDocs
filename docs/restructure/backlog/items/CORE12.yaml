  # ADR NNNN - What of core is public: a declared registry, not __all__

  ## Context

  drydocs_core is the one package every component may import (ADR 0002-a, enforced by
  tests/unit/test_module_boundary.py). Until CORE12 the guard asked only WHETHER a component may
  import core, never WHICH of its modules - so the answer to the second question was "all of them,
  by omission".

  Measured 2026-09-10: core has 39 top-level modules and subpackages and ALL 39 are imported from
  outside core. __init__.py's __all__ names seven. The most-imported module in the package,
  repo_paths with 31 component call sites, is not among them.

  The consequence is not that the wrong things are public. It is that no refactor of a core module
  can determine what it is allowed to break: changing repo_paths is either a routine internal edit
  or a breaking change to a third of the repo, and nothing in the package says which.

  ## Decision

  D1 - The import contract is drydocs_core.component_map.PUBLIC_MODULES, a declared frozenset of
  module names, grouped by purpose with the reason attached to each group.

  D2 - tests/unit/test_module_boundary.py enforces it DEFAULT-DENY: a component importing
  drydocs_core.<x> where <x> is not declared fails, and the failure names the module and every call
  site. Adding the name is the decision; the guard is what forces someone to take it.

  D3 - __all__ is NOT the contract and is not grown. It is the star-import surface - the seven
  names __init__.py eagerly imports - and it stays correct as that. __init__.py's docstring points
  at D1 so the two are not confused again.

  D4 - The contract is at MODULE granularity. A component reaching a symbol inside a public module
  is inside the contract however deep it goes; the unit of decision is the module, because that is
  the unit a refactor moves.

  D5 - Today's list is the contract AS IT STANDS, not an endorsement. Narrowing it is a later item,
  per module, with the call sites in hand.

  ## Options considered

  A - Grow __all__ to 39 (rejected): __init__.py eagerly imports those names, so the contract would
  be paid at import time, in a repo that already guards import cost with a subprocess-per-import
  test after that gap shipped a cycle. And __all__ governs star-import, which nothing here does.

  B - Mark internals by convention, underscore or otherwise (rejected): zero of 39 are internal
  today, so the convention would have no members, and module 40 would still be public by default -
  the actual defect.

  C - A declared registry with a default-deny guard (chosen).

  D - Do nothing; the invariant holds (rejected, but it is the honest baseline). Slot 10 was asked
  whether a second axis belongs and answered that this is a ruling, not a defect. True - and a
  ruling that is never made is how the count went from 22 to 32 in three days.

  ## Consequences

  - Adding a core module that a component imports now requires adding its name to PUBLIC_MODULES,
    in a group, with a reason. That is the intended friction and the whole value.
  - A core module can be made genuinely internal by leaving it out, and the guard enforces it.
    Nothing is internal today; the mechanism exists for when something should be.
  - The contract is 39 names wide, which is wide. It is honest rather than aspirational, and D5
    leaves narrowing to a later decision rather than smuggling it in here.
  - The Team Edition copier and the MODULE_MAP renderer read component_map.py and are unaffected -
    verified: the renderer reads four other names and MODULE_MAP.md is byte-identical.

  ## Action items (after acceptance)

  1. A narrowing pass - for each of the 39, is it contract or accident? Per module, with call
     sites. Needs a Lane A mint; not CORE12's.
  2. When the first genuinely internal core module appears, leave it out of PUBLIC_MODULES and let
     the guard hold the line. No new mechanism needed.

  For Lane A, not this item: action item 1 needs MINTING. It is the only follow-on and it is
  deliberately not attempted here - narrowing a 39-name contract module by module is a different
  and larger piece of work than declaring it.
