acceptance: |
  (a) A COVERAGE REPORT — its own verb, `drydocs docs-coverage` — prints one row per software-registry product, WHETHER OR NOT it carries a `documentation:` block. A product with no documentation at all is the row this report exists to print: exactly one product of thirteen carries that block today, so the original documentation-block-only scope could not answer "what documentation do we hold for Airflow". Each row states the product's coverage against a ladder whose first match governs (no-corpus | unregistered-corpus | ungated | cross-db-blocked | no-locator | not-loaded | product-node-absent | loaded-no-edge | traversable-until-move | traversable | not-probed), a `blockers` list naming EVERY wall rather than only the governing one, and the currency columns: runtime `versions`, `docs_version`, every runtime version NOT in `current_for`, and a currency of current | drifted | unverified | no-docs. `cross-db-blocked` sits ABOVE every load state in the ladder, so a corpus that cannot reach an edge is never reported as merely `not-loaded`. Exits non-zero on drifted and on unregistered-corpus so a version bump or a broken pointer cannot pass unnoticed in CI — and DELIBERATELY NOT on no-corpus or cross-db-blocked, which are true statements about the world that G32 owns; failing CI on an open design ruling trains people to ignore the verb (the test_software_registry.py known-state-pin precedent). (a2) Two further sections, so nothing is counted only from the product side: one row per doc-source-registry corpus that no product names, and one row per source-registry SYSTEM with no product row — which is where Snowflake appears, being absent from the software registry entirely. (a3) The report must work with the database SWITCHED OFF: the cross-DB determination is arithmetic on two YAML fields, so a pure declaration layer answers "is an edge even POSSIBLE" without Neo4j. Graph probing is an optional injected second layer, and every graph-derived field is None (`not-probed`) when it does not run — never 0, which would be a false claim of absence. (b) The pointer reaches the GRAPH so an agent can traverse from the product it is asked about to the documentation describing it, carrying docs_version + the currency status — via the term Q14's gate confirms (DESCRIBES is already registered for :Document -> :SoftwareProduct; this may need nothing new, which is the cheapest possible answer and should be checked FIRST). Nothing is written until that gate signs. (c) `current_for` is only ever set by a human confirming a capture against a runtime version — never derived by parsing version strings. (d) The two never-silent tails are reported rather than dropped: a corpus no product declares, and a DESCRIBES edge that exists in the graph with no declaration behind it. The second is a live case, not hypothetical — see the notes. (e) The report projects a CLOSED field set — ids, enum states, integer counts, declared classification labels, repo-relative paths already committed in publishable config. It never emits `source:` / `notes:` / `source_url:` free text from either registry, because three corpora are classification Internal and their prose describes internal systems. Those entries are still counted and named by id — dropping them would itself be a silent default — but their prose never reaches the output.
notes: |
  User requirement 2026-07-31: "we do need a pointer to it from the software registry which should contain external-vendor version number, so that when our ingestion process moves to the next major version, we know we need to update the docs." THE CONFIG HALF IS ALREADY BUILT (same session): the `controlm` product in software-registry.yaml carries `documentation: {corpus, docs_version, current_for}` beside its existing `versions:`, and two guards in test_software_registry.py enforce that the corpus id resolves to a real doc-source-registry entry and that the drift is COMPUTABLE (both sides present and typed). The mechanism is deliberately declaration-based: when the estate moves to a new version it lands in `versions:` and is absent from `current_for`, so the gap falls out with no version-string heuristics — because "does 9.0.20 documentation still describe 9.0.21.300?" is a judgement, not a string comparison. The drift-pinning guard asserts the KNOWN state rather than failing on it: drift is a true statement about the world today (9.0.20 docs, 9.0.21.300 runtime), not a code defect, so a red suite would be dishonest. What the test prevents is the drift changing SILENTLY. The operational alarm is this item's report. Home chosen beside `versions:` on the product rather than only on the doc corpus so the comparison is LOCAL — the two numbers a human must compare sit on adjacent lines. ACCEPTANCE WIDENED 2026-08-07 (laptop) at the claim, from the user's question "when we have a tool like Apache Airflow or Snowflake and the internal runs AWS MWAA with its own reference documentation, what connects them all with a Cypher query?". Answering it exposed that (a) was scoped to products CARRYING a `documentation:` block — exactly ONE of thirteen — so the report could not have printed the Airflow row, which is the row the question was about. Widened rather than groomed as a second item: same join, same inputs, same dependency, and two half-reports over one join would grow two status vocabularies that drift. WHAT THE ANSWER TURNED OUT TO BE, recorded because it is the report's subject matter. ONE edge connects them: (:Document)-[:DESCRIBES {target_version}]->(:SoftwareProduct), status active, written by bmc_docs.cypher. There is NO Document->Vendor edge; the vendor hop rides MADE_BY. It resolves for exactly one product — 27 Documents, all controlm. Airflow is a product node with zero docs; SNOWFLAKE IS NOT IN THE SOFTWARE REGISTRY AT ALL. THE FOUR BREAKS, none of which is a bug: (1) the product->corpus pointer is YAML-only — software_registry.py's rows() never reads the `documentation:` block, which is this item's own (b); (2) the doc-source registry has NO graph representation — :DocSource is not a live label and HAS_DOCUMENT is planned with loader ~; (3) the 1016-page vendor-docs corpus is staged and gate-blocked, and vendor_docs.cypher DELIBERATELY writes no DESCRIBES edge because a relationship cannot span Neo4j databases (the Q8 finding) while the registry writes drydocs and ADR 0006 re-targets corpora to dddocs; (4) therefore NO corpus can currently declare its way to a traversable edge — target_db is constrained to {dddocs, ddcontext} by the doc-registry guard and the registry writes drydocs. G32 owns that residency ruling. THE FINDING THAT MAKES THE REPORT WORTH MORE THAN A QUERY: the one working traversal is UNREPRODUCIBLE FROM THE LEDGER. Those 27 edges come from a corpus no product declares, attributed by a hardcoded Python constant (bmc_docs.py SUBJECT_PRODUCT_ID = "controlm"), resident in a database it did not declare (bmc-docs declares dddocs, lives in drydocs). It works BECAUSE OF the residency accident G32 exists to end — so acceptance (d) requires reporting it, and the report must NOT infer the declaration from taxonomy_path, since no file maps a taxonomy path to a product id. (b) IS UNCHANGED AND STILL BLOCKED behind Q14's gate, which is behind G32. The widening touches (a) only. . CLOSED 2026-08-07 (laptop) as a PARTIAL close, said out loud rather than implied. WHAT SHIPPED: `drydocs docs-coverage` + drydocs/docs_coverage.py (555 lines) + 25 tests, commit b297268 — the eleven-state first-match ladder, the `blockers` list naming every wall, the currency columns, the two tail sections (a2), the database-off declaration layer with `not-probed` rather than 0 (a3), the human-only `current_for` (c), both never-silent tails (d) and the closed field set (e). Non-zero on drifted and on unregistered-corpus only, per the acceptance. docs_coverage is classified `load` in test_module_boundary (default-deny) and listed in MODULE_MAP.md. Two follow-on commits from the same session: 0ddf880 emits the doc-governance + product-documentation fields into web/src/generated/software-registry.json and load-map.json, and 9b4cf59 builds the /software console page over them — that page is groomed as its OWN item, O56, because no item had ever claimed it. WHAT DID NOT SHIP, and is the reason this close is qualified: clause (b). No DESCRIBES edge is written from a registry declaration, because the term is Q14's gate to confirm and the residency that makes any such edge possible is G32's ruling to make — target_db is constrained to {dddocs, ddcontext} while the software registry writes drydocs, so today NO corpus can declare its way to a traversable edge. Writing one anyway would be exactly the "invent a relationship during import" failure CLAUDE.md §1 forbids. (b) therefore needs a SUCCESSOR ITEM once G32 rules; the nearest live piece of it — replacing bmc_docs.py's hardcoded SUBJECT_PRODUCT_ID with a `describes_product:` registry field — is parked in the IDEAS.md inbox as Idea-88 rather than groomed, because it touches a loader and a gated corpus behind those same two rulings. WHERE (b) IS NOW TRACKED, added 2026-08-07 on the user's ruling so it is not traceable only by this prose: G32's notes carry a CLOSE CHECKLIST whose first entry is exactly this clause — when that ruling signs, it must either mint (b)'s successor item or record (b) as declined. That puts the pickup on the item that unblocks it rather than on a reader happening to re-open this close note. VENUE (J18): the report is sample-reproducible — `drydocs docs-coverage` runs against the committed YAML with the database OFF and reproduces every declaration-layer row; the graph-probed columns in this session's run were taken on the laptop, `neo4jtest`, `drydocs` DB.
