  DEPENDS ON O80 (done), which bought the vitest runner and proved it. Related: O59, O80, FB-03.

  BUILT 2026-09-03 (laptop, Lane B of the f109280f handoff; wip/O92-laptop). One new file,
  web/src/modules/registry.test.ts, 24 cases, beside the module it guards.

  (a) The full 3x4 matrix of canAccessModule - four designation values (undefined, 'all',
  'sme', 'admin') by three roles - written out cell by cell rather than derived, with a check
  that no cell is missing, that undefined and 'all' agree for every role, and that the
  function is monotone in the role. 'admin' is in the matrix although no module carries it
  today; the file says so.

  (b) THE PIN HAS FIVE ENTRIES, NOT THREE. Acceptance (c) named remediation, software and
  gates; the registry as built also carries access: 'sme' on loadmap (O57) and underhood. All
  five are pinned, as a toEqual on the exact {id: access} map of every module with a
  non-default designation - a subset check would miss a REMOVED designation, which is the
  wrongly-opened direction. (c) Each entry carries the reason recorded where the designation
  was made: O59's delta argument for remediation, FB-03 for the other four. The test checks a
  reason is present; whether it is still true is review's question, as (f) says.

  (d) The file header says what this is not - an authorization test - and why: the server
  re-resolves the role from the token on every call (ADR 0005 decision 3; lib/auth.ts).

  (e) Both silent directions, computed over the real registry through the same filter
  expression the call sites use: the user role sees no designated module (wrongly OPENED)
  and every default module (wrongly CLOSED); steward and admin see every sme module; admin
  sees the whole registry; filtering never reorders, which the Overview spokes depend on.

  (f) VERIFIED: npm run lint exit 0 (three pre-existing fast-refresh warnings, none in the new
  file), npm run build exit 0, vitest 9 files / 117 tests green. The pin verified RED by
  flipping remediation's access to 'all' in the registry - exactly one test fails, the pin,
  23 pass - then the registry restored (git diff --quiet). Full Python suite, ruff check and
  ruff format --check green before the push.

  TWO STALE PREMISES IN THE BODY, recorded and not corrected (inputs are grooming, Lane A's
