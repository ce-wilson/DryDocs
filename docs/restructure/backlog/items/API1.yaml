acceptance: |
  Every QuerySpec shares one `_LIMIT` parameter, default 500, applied as `LIMIT $limit`. A spec
  whose true answer is 900 rows returns 500 and nothing in the response says so; the server
  export re-applies the same bound params, streams exactly 500 rows and registers a provenance
  manifest with `row_count: 500` and no field saying the extract was capped (S1). After this
  item the READ CONTRACT carries completeness.

  (a) Every spec result carries `truncated: bool` and the `limit` that applied. Cheapest
      mechanism, the builder chooses and records: run with `limit + 1` and report whether the
      extra row existed, or return a pre-limit count where the Cypher can afford it.
  (b) The export manifest records `truncated` and the ceiling beside `row_count`. A manifest
      that describes a capped extract says so in the artifact itself, because the manifest is
      the governance record and outlives the screen that produced it.
  (c) The export path can run WITHOUT the display limit, or with a caller-raised one, so the
      other 400 rows are obtainable from the console at all - today no surface can raise it.
  (d) `drydocs_api.schemas` models both fields so the O70 generated client picks them up and
      WEB2 renders them from typed fields, not from a heuristic on `rows.length === limit`.
  (e) Tests: a spec fixture with more rows than the limit yields `truncated: true`; one with
      fewer yields `false`; the export manifest for each records the matching value; the
      OpenAPI drift test (tests/unit/test_openapi_client.py) is regenerated, not hand-edited.
notes: |
  Minted 2026-09-05 by the secondary review of the slot 9 web report (docs/reviews/module-review-sweep-plan-review-2026-09-05.md, part B), from the three-pass lens review of web/ run the same day (report: docs/reviews/modules/web-2026-09-05.md). Every count below was re-measured on main at bcae4d02 before this item was written.

  Covers S1's server half, ranked first across all three passes. The console half is WEB2,
  which depends on this item.

  ADR CANDIDATE: "result completeness is part of the read contract - no export may be labelled
  complete without it." The canvas already solved this for nodes (NODE_CEILING = 300 with a
  TRUNCATED n/N badge and two tests in GraphCanvas / nvl-mapping); this item gives the API the
  same property so every consumer inherits it.

  R15 (todo) is the Ask cousin - exact versus lower-bound labelling on query answers. Same
  principle, different surface; link, do not merge.

  DONE 2026-09-05 (Lane B, laptop). The read contract carries completeness.

  MECHANISM, RECORDED AS CLAUSE (a) ASKS THE BUILDER TO RECORD IT: `limit + 1`.
  The driver is asked for one row past the ceiling and `truncated` is whether that
  row came back. Chosen over the pre-limit `count()` the clause offers as the
  alternative because a count is a second traversal on every read of every frame,
  and it answers a question nobody asked (how many rows exist) where this answers
  the one that is asked (is what I am looking at all of it). One row over is the
  cheapest possible evidence and it is exact, not an estimate.

  THE PROBE ROW IS EVIDENCE, NEVER PAYLOAD. It is dropped in execute_spec before
  the envelope is built, and the export generator stops emitting at the ceiling,
  so no caller and no exported file ever sees row 501. Three tests pin that
  separately at the run, csv and jsonl paths, because "the flag is right but the
  file has an extra row in it" would break the very contract the flag states.

  THE ECHOED PARAMS STILL SAY 500 WHILE THE DRIVER WAS ASKED FOR 501, and that
  split is deliberate: SpecGrid feeds `result.params` straight back into
  `exportSpec`, so an echoed 501 would silently widen every subsequent export by
  one row, once per export, forever. Two existing tests asserted the old
  driver-side value and were UPDATED rather than worked around
  (test_agent_query.py, test_query_specs.py) - they now assert both halves, the
  probe the driver sees and the ceiling the caller is told, which is the pair that
  matters.

  (b) THE MANIFEST CARRIES `truncated` AND `limit` BESIDE `row_count`. The test
  that makes the point exports the same spec twice, once over the ceiling and once
  at exactly 500 rows: identical `row_count`, opposite `truncated`. That is the
  whole finding in two assertions - row_count alone cannot tell a complete answer
  from a cut one, and the manifest is the governance record that outlives the
  screen.

  (c) EXPORT_LIMIT_CEILING = 50_000, RAISABLE PER CALL via a new `ExportBody`
  (a subclass of QueryBody, because raising a grid's limit changes what is on
  screen while raising an export's changes what lands in a filed artifact - two
  different permissions to grant). Omitting it keeps today's behaviour byte for
  byte, so an un-updated caller is unaffected; a test asserts that specifically.

  A CEILING AND NOT "UNBOUNDED", DELIBERATELY. The clause offers either. An
  unbounded export over a result set nobody has counted is the failure the display
  limit was protecting against, relocated rather than fixed - and now that
  `truncated` is in the manifest, an export that hits 50,000 SAYS so, which is the
  property the item was actually buying. Raising the constant is a one-line
  reviewable edit. Over-ceiling and nonsense values (0, negative, a string) are
  REFUSED with 422 and never clamped: a caller who asked for 200,000 and silently
  received 50,000 would be handed exactly the quietly-capped artifact this item
  exists to abolish.

  THE ENVELOPE IS BUILT IN execute_spec, SO THE AGENT TIER INHERITS IT. R9's "the
  same ten keys" is now twelve. This was not incidental - an agent that files a
  500-row answer as the answer is the same defect as a console that does, and
  putting the fields at the route instead would have fixed one and left the other.

  REGISTRY INVARIANT THE MECHANISM RESTS ON, now guarded: `display_limit_param`
  requires BOTH a declared `limit` parameter AND a `$limit` the Cypher actually
  binds. Measured at pull: 43 specs, 39 capped, 0 mismatched. The conjunction is
  not decoration - a spec that declared the parameter without binding it would
  have had every result over 500 rows reported as truncated AND SLICED, the API
  inventing a cap no query applied. test_result_completeness.py holds the registry
  there.

  FOR WEB2 (the console half, which depends on this): read `truncated` and `limit`
  off the typed result. `limit` is null for the four specs that have no ceiling -
  render nothing rather than "0". The boundary case is why clause (d) exists and
  has its own test here: at exactly 500 rows `rows.length === limit` says
  TRUNCATED over a complete answer, and the server knows better because it asked
  for 501 and got 500. Where clause (c) made the ceiling raisable, it is raisable
  on the EXPORT path only; there is no raised-limit grid read.

  GENERATED ARTIFACTS AND THEIR WRITERS (Lane A runs these at merge if the source
  moved - the handoff's third 2026-09-03 lesson):
    web/src/generated/openapi.json  <- poetry run python scripts/dump_openapi.py
    web/src/generated/api.d.ts      <- npm run api:types   (in web/)
  Both regenerated, never hand-edited, and both need DRYDOCS_DATA_ROOT set.

  TWO FINDINGS FOR THE INBOX, both hit in this session:

  1. scripts/dump_openapi.py TRUNCATES ITS OUTPUT BEFORE IT CAN FAIL.
     `write_schema` opens the file "w" and only then calls `render_schema()`
     inside the write expression, so any failure during app construction - an
     unset DRYDOCS_DATA_ROOT is the easy one - leaves web/src/generated/openapi.json
     at ZERO BYTES. Observed here exactly that way, and the next `npm run
     api:types` then died on "Unexpected end of JSON input" pointing at the wrong
     thing. One-line fix: render first, then open. The drift test does catch the
     empty file, so the blast radius is one confusing loop and not a bad commit.

  2. `npm run api:types` NEEDS DRYDOCS_DATA_ROOT and says so only through a
     Python traceback nested inside a Node stack. It is documented in
     dump_openapi.py's own docstring; it is not documented where a web developer
     would look.

