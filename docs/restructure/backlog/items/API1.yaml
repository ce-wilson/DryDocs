id: API1
epic: web-console
title: Result completeness is part of the read contract - every spec result says whether the 500-row ceiling
  capped it, and the export manifest records truncated plus the ceiling instead of filing a capped extract
  as the answer
type: task
module: drydocs-api
phase: 12
agent: main
model: sonnet
priority: p1
status: in_progress
depends_on: []
inputs:
- docs/reviews/modules/web-2026-09-05.md
- drydocs_api/query_specs.py
- drydocs_api/exports.py
- drydocs_api/schemas.py
- tests/unit/test_openapi_client.py
acceptance: |
  Every QuerySpec shares one `_LIMIT` parameter, default 500, applied as `LIMIT $limit`. A spec
  whose true answer is 900 rows returns 500 and nothing in the response says so; the server
  export re-applies the same bound params, streams exactly 500 rows and registers a provenance
  manifest with `row_count: 500` and no field saying the extract was capped (S1). After this
  item the READ CONTRACT carries completeness.

  (a) Every spec result carries `truncated: bool` and the `limit` that applied. Cheapest
      mechanism, the builder chooses and records: run with `limit + 1` and report whether the
      extra row existed, or return a pre-limit count where the Cypher can afford it.
  (b) The export manifest records `truncated` and the ceiling beside `row_count`. A manifest
      that describes a capped extract says so in the artifact itself, because the manifest is
      the governance record and outlives the screen that produced it.
  (c) The export path can run WITHOUT the display limit, or with a caller-raised one, so the
      other 400 rows are obtainable from the console at all - today no surface can raise it.
  (d) `drydocs_api.schemas` models both fields so the O70 generated client picks them up and
      WEB2 renders them from typed fields, not from a heuristic on `rows.length === limit`.
  (e) Tests: a spec fixture with more rows than the limit yields `truncated: true`; one with
      fewer yields `false`; the export manifest for each records the matching value; the
      OpenAPI drift test (tests/unit/test_openapi_client.py) is regenerated, not hand-edited.
notes: |
