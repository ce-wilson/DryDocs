acceptance: |
  Two web build follow-ups from the Lane B stack, both one-liners with a decision attached.

  (a) WEB4's strict tsconfig excludes the playwright and vitest config files from include, so
      they are type-checked by nothing. Widening include is one line; do it, and fix whatever
      the newly type-checked files then report - that fallout, not the one line, is the work.
  (b) WEB13's test:coverage writes web/coverage/ and nothing ignored it: 184 report files rode
      into the WEB13 feat commit and were untracked at the merge with a coverage line added to
      web/.gitignore (aa7e5836). Nothing is left to DO here unless the coverage HTML should be
      published somewhere - which is the decision this clause exists to force. Record the answer
      (published where, or deliberately not published) and close the clause either way.
notes: |
