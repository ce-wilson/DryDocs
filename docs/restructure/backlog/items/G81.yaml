acceptance: |
  INCIDENT, 2026-08-11: the SME's internal folder holding extracted CSV source data was OVERWRITTEN. Recovery is from a backup, so the data is not lost, but the class is live and it fires again the moment the backup is restored to the same place. This is the most severe defect class the repo has produced — every other failure this week was a wrong READ; this one destroyed a source. (a) RECONSTRUCT FIRST, do not guess. Establish what wrote over what, from the code, and record it. The write-capable surface to walk: drydocs_core/data_root.py declares ten-plus path helpers IN PYTHON, several taking create=True so they mkdir, and rua_extracted_dir() names an "extracted" area that a re-run may legitimately rebuild. Reconstruction is part of the deliverable, not a preamble to it — a guard written against a guessed mechanism guards the wrong thing. (b) DECLARE EVERY PATH IN CONFIGURATION, not in code, each carrying a MODE: read (source data the system may NEVER write), write (outputs it owns and may rebuild), scratch (disposable). Three families the SME named, all currently scattered: LOGS (DRYDOCS_LOGDIR, env-only), LOADER INPUT DATA (per source), and REMEDIATION OUTPUT (the greenfield artifact and Jira handoff). Moving the declaration out of Python is the point: today a path is whatever a helper returns, so no reader can enumerate what the system touches, which is why an overlap was invisible until it destroyed something. (c) THE INVARIANT THAT WOULD HAVE PREVENTED IT: no write-mode path may EQUAL OR CONTAIN a read-mode path. Guarded, with the failure naming both paths. This is the whole defect in one sentence and it is mechanically checkable. (d) NO SILENT DEFAULT ROOT. resolve_data_root() falls back to ~/data/DryDocs whenever DRYDOCS_DATA_ROOT is unset or empty, so a missing environment variable silently relocates every read and write to a plausible-looking wrong place — the SAME defect family as G78's fixture-directory default, one layer down. An unset root must FAIL, naming the variable. (e) Any path a create=True helper may build is write-mode BY CONSTRUCTION. A read-mode path must be reachable through a helper that cannot create, cannot clean and cannot write. Ties to ADR 0012: a source declaring acquisition file-drop needs a declared location, and that location is read-mode by definition — so (b) supplies what the ADR's acquisition axis assumes exists. (f) THE DECLARATION COVERS EVERY ORIGIN, NOT ONLY THE FILESYSTEM ONES. Clause (b) names three families the SME named — logs, loader input data, remediation output — and all three are paths. Fifteen of the thirty dataset rows are `acquisition.mode: automated` and have no declared location of any kind, so a declaration that stops at the filesystem leaves half the registry exactly as undeclared as it is today. Bind PER ORIGIN rather than per dataset: `origin@db.schema.table` already splits the connection half from the object half the way OpenLineage's namespace/name split does, so every dataset under one origin inherits one binding and the fifteen rows reduce to roughly six. A filesystem landing zone is then not a separate mechanism — it is an origin whose namespace is a path root, which is what `drop_dir_base` already is one level less general. (g) ONE EXPANSION FUNCTION, NOT SEVEN PRECEDENCE CHAINS. Clause (d) says an unset root must fail rather than silently relocate. That is unimplementable seven times over, and seven is the current count: `resolve_data_root` treats an empty string as unset and falls back silently, `resolve_log_dir` walks two variables before its default, `credentials_path` takes any non-empty override verbatim, `MappingStore.__init__` imports `os` inside the constructor to read one variable, and the Control-M adapter and the `NEO4J_*` set each do their own thing. The committed declaration REFERENCES environment variables by name and never holds a value that is secret — the DataHub recipe pattern — and one expansion function resolves them, raising one error that names the unset variable. That also gives the repo the thing it has never had: a single place that enumerates every environment variable the system reads. `.env.example` currently documents neither of the two roots (G109 clause (d)). (h) THE CONSOLE CREDENTIAL FILE IS THE MODE AXIS'S HARDEST TEST, so it is declared here rather than exempted. `DRYDOCS_CONSOLE_CREDENTIALS` is one of the seven variables above and `internal-local/console-credentials.json` is a path the system both reads and writes: WRITE for one script run by a person at a terminal, READ for the API, and never `scratch` — deleting it destroys the only copy, which is precisely why `drydocs_api/credentials.py` argues at length that it cannot live under `var/`. If the declaration this item lands cannot express a path whose mode differs by writer, it is not expressive enough. The module already makes this argument in prose; this is the item that makes it mechanical.
notes: |
  Raised 2026-08-11 (desktop) from an SME incident report. p0 on IRREVERSIBILITY, which is the axis that separates it from G78: a wrong load is re-runnable, a destroyed source directory is recoverable only as far as the last backup, and if that backup had been stale or absent the loss would be permanent. G78 is louder; this one is worse. SME DIRECTION ON SEQUENCING: the layout must be planned with the ARCHITECT PERSONA, and it must be planned WITH the loader restructure rather than after it — G79 moves loaders between chains and ADR 0012 puts acquisition on the source entry, so both touch exactly the paths this item declares. Doing the declaration afterwards means declaring a layout that was just rearranged. The persona review is docs/reviews/persona-python-architect — a layout question, not a graph-modelling one, so the Python architect rather than the Neo4j architect. SCOPE FENCE: this declares paths and guards the overlap. It does not relocate anyone's data — a config change that silently moved a root would be the same class of defect the item exists to close.

  AMENDED 2026-08-28 (desktop) from `docs/design/catalog-substrate-review.md` findings B3, B4 and L4 — the second-pass survey of DataHub, OpenMetadata, Amundsen, OpenLineage/Marquez and Purview. Clauses (f), (g) and (h) added; nothing in (a) through (e) changes. The survey was run against the catalog products rather than the Python application scaffolds the earlier review read, because a SaaS template has one data source behind one connection string and therefore has nothing to say about this item. What the peers supply is not a library to adopt but three shapes: the connection-versus-object split that makes per-origin binding correct (OpenLineage), scoped keys with a declared fallback so precedence is written once (Amundsen), and committed configuration that REFERENCES a secret's environment variable instead of holding its value (DataHub recipes). Explicitly NOT taken: a secrets-manager plugin interface — one machine and one operator do not need an abstraction over one implementation — and pyhocon, since G104 clause (1) already names pydantic-settings for this shape.
