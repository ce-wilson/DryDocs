acceptance: |
  THIS IS A LAPTOP ITEM by SME assignment — the evidence is a set of DBeaver screenshots held on the laptop, and they are INTERNAL: replica host, database name, schema names, SEAL application ids, configuration-item names and the `x_<scope>_` company scope prefix never enter this repo. Only mechanism is recorded here; anything value-bearing stays company-side. Three deliverables. (1) THE WORKING QUERY, transcribed as MECHANISM into the ServiceNow/TOM material: the join spine is `x_<scope>_cmdb_tom_main` -> `x_<scope>_cmdb_tom_roles` (role -> sys_id, active) -> `cmdb_ci` (parent_id) -> `core_company` -> `cmdb_ci_service_discovered` -> `sys_user_group` (group, and again on assignment_group) -> `cmdb_ci_business_app`, with the CI self-join on `inherited_from_ci`. The columns that matter to DryDocs are named and mapped to our vocabulary: `u_seal_application_id` / `u_seal_deployment_id` (the SEAL join), `correlation_id`, `sys_class_name`, `inheritance` / `inherited_from_ci`, `u_status`, `u_application_state`, `u_external_service`, and the role/group/team names. State which of those the TOM-role gates (G35, seal-tom-attribution-reshape) already assume and which are NEW evidence. (2) THE VIEW INVENTORY as taxonomy: the replica exposes one `V_`-prefixed view per ServiceNow table across several `DW_*_DATA_VIEW` schemas (a common/CMDB one, an ITSM one, and at least two others). Capture the view -> ServiceNow-table naming rule and the schema split; that rule is what keeps `origin: snow` unambiguous while the carrier is Snowflake, and it is currently asserted in a comment with nothing behind it. (3) THE PRECISION QUESTION, which is the point of the item rather than a rider: the sample query is a hand-built REPORT — it filters to one company, one application state set, one SEAL id and one named CI. That is not an ingestion contract. Decide what DryDocs should actually pull, and justify it against the PUBLIC ServiceNow CMDB documentation (the tables are stock ServiceNow, so their canonical columns, `sys_class_name` hierarchy and CI-relationship model are all publicly documented and can be read from the web without touching the estate) — the vendor doc is the baseline, the replica is the instance, and where they disagree the difference is a company extension worth naming. Specifically rule whether the CI-relationship tables (`cmdb_rel_ci` and the `cmdb_rel_*` family visible in the navigator) belong in the pull, since a CMDB without its relationship rows is a node list rather than a graph. Output is an analysis document plus, if warranted, a DRAFT dataset row for the registry under the `snow@[db].[schema].<servicenow_table>` grammar with `confirmed: false`. NO source is activated, no loader is built and no gate is signed inside this item — a real pull scope is a gate decision.
notes: |
  Raised 2026-08-09 (desktop) on SME direction, from DBeaver screenshots of the replica the SME will query. WHY THE LAPTOP: the screenshots live there, and they are Internal — moving them to reach a different session is the wrong direction of travel. CONTEXT THIS ITEM DEPENDS ON, so it is not re-derived: ServiceNow metadata is NOT read from ServiceNow. It is read from an AWS Snowflake REPLICA, which is the same shape as Control-M being read from the Oracle `psgmgr` replica rather than from the orchestrator. So `snowflake` is the CARRIER and `snow` keeps the ORIGIN slot — recorded on both system entries in config/source-registry.yaml 2026-08-09 with guards, after the SME flagged SNOW/Snowflake as an IMPORTANT confusion. The v2 grammar already ruled this ("replica grammar: origin catalog, carrier snowflake"). WHY THE PUBLIC-DOC LEG IS WORTH THE TIME rather than shortcutting to the replica: these are STOCK ServiceNow tables, so the vendor documents the canonical schema publicly. That gives a baseline the estate cannot supply — it tells us which columns are ServiceNow's and which are local extensions (the `u_` prefix and the `x_<scope>_` scoped app are the two local classes visible in the sample), and a column we invent a meaning for because we only ever saw it in one hand-built report is exactly the kind of assumption T10/T13 exist to prevent. Route the vendor lookup through the reference-librarian agent and register what it finds in reference/REGISTRY.yaml, the same way BMC and Oracle are held. RELATIONSHIP TO THE OPEN TOM GATES: G35 (TOM-roles enumeration, in progress) and seal-tom-attribution-reshape both reason about role classes and cardinality from the SEAL side. This item supplies the ServiceNow-side evidence they have been arguing without — the `tom_roles` join and its `active` flag are the live shape of exactly what G35 is trying to enumerate. Feed the findings INTO those gates; do not pre-empt them. EVIDENCE ADDED 2026-08-09 (SME showed the cmdb_rel family live, so clause (3)'s relationship-table question is ANSWERED IN PART before the item starts — do not re-derive these, verify them): (a) THE EDGE TABLE IS REAL AND IS AN EDGE LIST. `cmdb_rel_ci` carries `parent` / `child` / `type`, all sys_id GUIDs, with `type` an FK to `cmdb_rel_type` — which in turn carries `name`, `child_descriptor` and an `end_point` boolean. That is a FORWARD LABEL plus an INVERSE LABEL on the type row, which is the same shape as this repo's own relationship_vocabulary (`neo4j_label` + `inverse_label`). The mapping is therefore close to mechanical rather than interpretive, and the item should say so rather than treating it as open. Also present: `connection_strength` and `percent_outage`, i.e. the CMDB models impact weight on the edge, which we have no equivalent for. (b) THE REPLICA IS NOT A PURE MIRROR, and this is the sharpest correction to the 'stock ServiceNow tables' premise the item is built on. The view carries columns ServiceNow never had: a `dwintel_dl_*` snapshot family (snapshot date, load timestamp, snapshot trim) and a `delete_flag`. Those are CARRIER artifacts of the data-lake replication, not vendor schema — exactly the vendor-baseline-vs-instance difference clause (3) exists to name, now with a concrete first example. (c) `delete_flag` MAKES SOFT DELETES AN INGESTION CONTRACT QUESTION, not a detail: if rows persist in the replica after deletion in ServiceNow, then any pull that ignores the flag ingests dead CIs and dead edges as live ones. Rule it explicitly. The D7 tombstone idiom is the obvious precedent — we already distinguish removed-from-source from never-existed, and this is the same problem arriving from a different source. (d) THE SERVICENOW AUDIT ENVELOPE IS PRESENT: `sys_created_by` / `sys_created_on` / `sys_updated_by` / `sys_updated_on` map cleanly onto the four frozen envelope property names, so a `config/audit-fields.yaml` entry for any snow dataset is a real mapping rather than another stub — unlike most sources ruled at audit-envelope-phase4. `dwintel_dl_snapshot_dt` is replication time and is EXCLUDED under the standing CAPTURE_DATE rule. Note the split: the ServiceNow columns are authorship, the dwintel ones are capture, and only the first kind is envelope. (e) Local extensions visible on this one view: `u_hash`, `u_discovery_source` (the `u_` class) and a company scoped-app data-destruction column (the `x_<scope>_` class). Both classes were predicted by the item; this confirms them on a table we would actually ingest. Mechanism only — GUID values, the scope name, database and host stay company-side. DONE 2026-08-09 (LAPTOP, same day it was raised). Output: knowledge/upgrade-plans/servicenow-replica-evidence.md — the INSTANCE half of a pair with C10's servicenow-cmdb-analysis.md (the vendor-doc BASELINE half), cross-linked both ways. All three clauses delivered. Clause (1): the nine-table join spine and a per-column map marking which columns the TOM gates already assume and which are new. Clause (2): the V_-prefix rule now has evidence behind it (no exception observed) plus the observed view inventory by family, recorded WITH its limits — the navigator was cut at both ends, and V_SYS_USER_GROUP / V_SYS_CHOICE are known present from the query rather than from the tree. Clause (3) ruled: cmdb_rel_ci + cmdb_rel_type ARE in the pull, the other seven cmdb_rel_* views are NOT (they are ServiceNow's own governance and UI machinery for maintaining edges, not the edges), and a three-ring scope is proposed for the gate to rule. FOUR FINDINGS WORTH THE ITEM. (a) The item's own premise needed correcting: these are NOT all stock tables. The two at the centre of what G35 needs — x_<scope>_cmdb_tom_main and tom_roles — are a company SCOPED APP with no vendor baseline at all, so the public-doc leg cannot cover them and G35 is reasoning about a surface the vendor has never described. (b) The SEAL ids sit on cmdb_ci_service_discovered (CSDM Application Service), NOT on cmdb_ci_business_app — and u_seal_deployment_id sits beside u_seal_application_id. The source keys application and deployment separately where DryDocs has one concept, which meets the trigger condition C10's gate-bound candidate #1 was deferred on; that candidate is annotated RE-OPENED rather than acted on. (c) G35 §E4's premise changes: it assumed the inherited-from parent CI is estate data DryDocs does not have, and the parent is cmdb_ci in the SAME replica, so E4 is now a modelling choice rather than an availability constraint. (d) A tension for §B6 — as sampled, the TOM row names a GROUP (sys_user_group), never a person, which is recorded as a limit of one report rather than a conclusion and is open question 1. Also corrected the standing evidence note on cmdb_rel_type: the vendor baseline is parent_descriptor + child_descriptor as TWO columns with name being their "A::B" concatenation, so read the columns and do NOT split name on '::'. Registered ServiceNow in reference/REGISTRY.yaml as a source-platform with the public-docs source_url, and recorded on the snowflake entry the non-obvious fact that Snowflake is already live as the replica CARRIER (the reference/platforms README said "future placeholder"). NOTHING ACTIVATED, as the item required: no source row written to config/source-registry.yaml, no loader, no gate signed. The ring-1 dataset rows are DRAFTED IN THE DOCUMENT with confirmed: false rather than pasted into the registry — deliberate, because the registry is an enforcement surface and the pull scope is a gate decision, so the gate should approve a recommendation instead of striking rows. Six open questions carried, three of them SME-blocking. Suite green (1772 passed); the one red file, test_seal_samples.py, is the uncommitted business-application.yaml work in progress and was proven independent by stashing it.
