id: PORT7
epic: release-infrastructure
title: "The PORT-MANIFEST pyproject.toml row names the [tool.ruff] block producer-canonical, so one lint standard crosses whole instead of stopping at the dependency table"
type: chore
module: drydocs-port
phase: 8
agent: main
model: haiku
priority: p2
status: done
depends_on: []
inputs:
- PORT-MANIFEST.yaml
- pyproject.toml
- .pre-commit-config.yaml
acceptance: |
  The per-entry row for pyproject.toml says "union of dependencies; keep the consumer version
  string" and says nothing about the [tool.ruff] block, so the lint ignore list the producer
  ruled on 2026-08-12 (RUF002 and RUF003, ambiguous Unicode in prose) never crossed and the
  consumer copy carries E501 and N817 only. One lint standard on both sides is the stated
  intent: J62 makes .pre-commit-config.yaml canonical-producer and the ruff pin upgrades in
  lockstep. The row should say so.

  (a) The pyproject.toml entry_rule in PORT-MANIFEST.yaml gains one sentence naming the
      [tool.ruff] block - select, ignore, per-file-ignores and the pin - as producer-canonical
      INSIDE the per-entry file. The dependency table stays per-entry, unchanged.
  (b) A relay line tells the consumer the block now crosses whole, so the next apply replaces
      its ruff block rather than hand-merging it.
  (c) It lands with the next roll alongside PORT6 and PLAN9 - never mid-apply, which would
      change the rule under a session already applying it.
notes: |
  Done 2026-09-08 (base venue, desktop), in three commits. (a) landed in two halves:
  3d1278aa named the [tool.ruff], [tool.ruff.lint], [tool.ruff.lint.per-file-ignores]
  and [tool.ruff.format] tables as crossing WHOLE inside the per-entry file, and
  5637d694 added the half that one missed - the ruff dev-dependency PIN, which the row
  had left under "union of dependencies" where a union has no meaning. (b) is RELAY-45
  in docs/port/port-prompt.md (42338d48, extended with the pin sentence). (c) held:
  the consumer had already merged its port-base-20260905 apply the same day, so this
  landed between rolls and not under a session mid-apply.

  A guard rode with it (test_pyproject_row_carries_the_shared_ruff_contract): nothing
  in this repo can read the far side of a port, so what is checkable is that the row
  still names both halves. Under-specification is how this row failed the first time.

  Groomed 2026-09-08 from IDEAS.md Idea-302 (base venue, desktop). Source is the consumer
  carve-out H close (RELAY-36, third point), transcribed to the machine-local back-flow file.

  The consumer read this as a third instance of the per-entry delta-versus-union defect. It is
  not: no union of the ruff block was ever specified, so none was missed. It is the row being
  under-specified - the same family as the source-registry and dev-environment fall-throughs
  the manifest already records, a file class sitting under a rule that does not cover it.

  module drydocs-port, phase 8. p2, model haiku: one sentence in a manifest row plus a relay
  line, with the judgement already made here.
