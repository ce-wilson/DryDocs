id: AGENT1
epic: agentic-qa
title: "The /ask scope selector is a router hint that filters the spec catalog, and its vendor-corpus option must not ship until a spec searches chunk text"
type: task
module: drydocs-agents
phase: 15
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
