id: MM8
epic: mind-map
title: |-
  R13 in detect.py, plus its second consequence: an internally-fed FileWatcher (watched path = a predecessor's written path) proposes load_bearing=false and a self-asserted TDQ flag — SME-ruled, never auto-applied
type: task
module: drydocs-remediation
phase: 17
agent: main
model: sonnet
priority: p2
status: todo
depends_on:
- MM2
- MM7
inputs:
- internal/remediation/standards-rules-registry.md
- internal/remediation/governance/hlt-naming-standard.md
