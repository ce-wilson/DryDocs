acceptance: |
  The company technology-governance catalog rules one of the web UI's graph-rendering
  dependencies NOT_ALLOWED while the framework it sits on is ALLOWED, and the company user's
  note is that the change is known: the UI will flip to the company data-marketplace
  platform, which is built on the Google ADK. Neither half below is a rewrite.

  (a) THE SCHEMA HALF. The registry gains a per-product governance block - the mechanism the
      company side already uses: an as_of that is MANDATORY when the block is present, ids
      and never names, and absence recorded rather than left blank. The producer has no
      catalog to read, so producer rows carry an empty governance value and the guard checks
      only the shape: present implies as_of. A registry row with a governance block and no
      as_of fails.
  (b) Governance status ANNOTATES; it has no authority over the ledger. Nothing in the
      registry is removed, retired or re-keyed by a governance value, and the guard or a
      comment says so where someone would otherwise be tempted.
  (c) THE NOTE HALF. docs/design/ui-exploration/two-track-ui-plan.md gains a DATED note that the company's target
      UI stack is an ADK-based data-marketplace platform and that the producer's
      ReUI / graph-rendering choice is producer-only. This matters for what the port carries
      under web/, and that consequence is stated in the note.
  (d) The registry now reads governance status on its OWN dependencies, not only on the
      estate it documents - a self-application the item states explicitly, because that is
      the finding.
notes: |
