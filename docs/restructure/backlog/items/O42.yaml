acceptance: |
  Either (a) the code-graph snapshot covers the web/ tree so the .tsx modules and their import edges appear alongside the Python ones — with MODULE_MAP.md gaining a drydocs-web section and the snapshot README recording the widened scan — or (b) a recorded decision that first-party front-end code stays out of the code graph, with the REASON and the inventory that serves instead. Either way the outcome is written down; what is not acceptable is the current silent gap. If (a), the depgraph instrument needs a TS/JS resolver, so size that before committing — the U6 multi-root work is the precedent for what "extend the scanner" actually costs.
notes: |
  Found 2026-07-31 while answering "which React components are part of the UI": the answer had to be assembled with `find`, because nothing inventories them. Verified, not assumed — (1) the latest snapshot's scan list is Python roots only: drydocs,
      drydocs_core, drydocs_api, drydocs_remediation, drydocs_lineage,
      drydocs_deepdoc, tests;
  (2) MODULE_MAP.md has no web/tsx entry, and the modules registry says so
      explicitly — drydocs-web is "not a Python package, so absent from
      MODULE_MAP.md/test_module_boundary.py";
  (3) the software registry is the THIRD-PARTY ledger, so first-party
      components correctly do not belong there (that file's own scope note:
      the catalog long tail stays out).
  So all three plausible homes decline it, each for a defensible reason, and the result is that a 62-component surface — the whole of Epic O — has no inventory any tool can read. That is exactly the class of defect Epic U was created to find in the Python tree; the front end simply was never in the scan. Option (b) is a legitimate answer, not a cop-out: the front end may not earn a graph. But it must be a decision rather than an omission. PARTIALLY ANSWERED 2026-07-31, same session (user directive: "create another sub-ledger for only our UI that links from the first"): config/taxonomy/ui-components.yaml now inventories all 62 components by area, joined to the software registry's `react` product through a RECIPROCAL pointer (ledger -> framework/stack, product -> components), the same shape as `documentation:` on the controlm product. A bidirectional drift guard (tests/unit/test_ui_components.py) fails when a component is added without being registered OR when an entry names a missing file — PROVEN by adding a probe component and watching the suite go red. The inventory half of this item is therefore CLOSED. WHAT REMAINS, and why this item stays open: the ledger records WHAT EXISTS AND WHERE, not what imports what. There are still no import edges for the front end, so questions the Python code graph answers routinely — blast radius, orphan detection, coupling — remain unanswerable for web/. That needs a real TS resolver in the depgraph instrument; size it against the U6 multi-root work before committing. Worth recording as evidence for why the guard was built: the ledger was generated from a `find` whose output truncated at 60 of 62 files, so the first hand-read of the tree silently missed ThinkingLogicPanel and TokenMemoryChart. A machine-checked inventory catches exactly that.
