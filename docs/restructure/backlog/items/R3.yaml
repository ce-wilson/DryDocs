acceptance: |
  Every LLM call appends one JSONL line (run_id, step, model, prompt_tokens, completion_tokens, cost_est, duration_ms, iteration) to DRYDOCS_LOGDIR — never the repo. One :AgentRun node per question (kind 'qa', mirroring :JobRun) carries question sha256 + length ONLY (full text solely in the local ledger), tier, iterations, llm_calls, token totals, context/memory sizes, cypher count, fix retries, specs used, dbs touched, timings, staleness flags — written to the DB the R1 ruling names (never drydocs) via a dedicated writer boundary. A console.agent-runs.v1 QuerySpec returns runs for the admin view. The envelope also RESERVES a hashed caller-identity slot (user_id sha256 + length, mirroring the question-text rule) — ADK 2.0 run_async takes user_id per call; full identity never lands in the graph.
