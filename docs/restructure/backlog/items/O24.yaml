acceptance: |
  A new steward mapping domain (seal-contact-override) joins the /mappings domain strip via the registry (the O13 mechanics): its grid shows the current SEAL operate-manager attributions (L1/L2) with an ORIGIN flag on every row — source (SEAL) vs user override — always visible, never hidden; stewards draft override entries (app seal_id + role/level + corrected holder SID + REQUIRED rationale) that persist in the mapping-store DATABASE TABLE (the file-to-table enhancement: the committed override list is the source the derived var/mapping.db materializes from, so it stays rebuildable); overrides NEVER write the graph and NEVER silently replace the SEAL value — where both exist the surfaces show them side by side; a SOURCE-CORRECTIONS REPORT export (artifact + manifest) lists every override with the SEAL current value, the corrected value, author and rationale, formatted for the application owners who hold the AO privilege to fix SEAL itself. Whether overrides ever influence graph-side attribution (a precedence tier) is explicitly OUT of scope — recorded as a gate question for the ui-write-surface / K-family gates, not decided here. Tests cover the origin flag, the override-store round-trip, and the report content. Full suite green.
notes: |
  Promoted 2026-07-21 pm directly from SME direction in the O20 review chat (the C9 direct-promotion precedent): SEAL Contacts L1/L2 Operate Manager data is known-inaccurate; fixing SEAL requires the application owner (AO privilege) to update it manually, so DryDocs carries the mapping FROM SEAL plus a user override list, flagged by origin, feeding a corrections report — fix-the-source doctrine, not a graph write. The same direction is amended into config/gate-prompts/ui-write-surface.yaml (M2 non-graph-store ratified as the standing pattern; formal sign-off still at the O20 session). Module drydocs-api (domain registry + store + report endpoint); the /mappings screen half rides the existing O13 surface.
