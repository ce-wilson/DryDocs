acceptance: |
  THE CLASS (Idea-142, found live at the 135-170 port): a canonical-producer disposition silently truncates a file the company legitimately EXTENDS — constraints.cypher lost two live company constraints to a wholesale take on 2026-08-20 and was re-dispositioned per-entry the same day. The company's caa0406 report names FIVE more such paths, and the producer manifest has NO row for any of them (verified at the port review). Each gets a row with an entry_rule, or a recorded reason wholesale stays right — never a widened default. (1) drydocs_core/orchestration/controlm/description_tokens.py — the company union-merged its live-load parser (parse_tokens/classify_job_role) into the producer's C30 conformance model (parse_description/validate/required_tokens); rule it per-entry by function today AND inbox the back-flow that splits the two models into separate modules producer-side, after which the row becomes clean-add + a canonical-company sibling (the description_tokens half of the resource_pool G76 pattern). (2) drydocs_remediation/detect.py + __init__.py — per-entry by DETECTOR ID (producer R30-R40, company detect_dpl_findings/dpl_review with DPL-* ids); the shared Finding shape is the contract and the entry_rule says so. (3) tests/unit/test_runbook_currency.py — per-entry on the three exemption lists (HISTORICAL_PATHS carries company T19 reasons, DEFERRED_VERBS company T22, FOREIGN_PATHS emptied company-side); the entry_rule names the retirement trigger: when T19/T22 land company-side the exemptions go, and the row reverts to canonical-producer. (4) config/gate-prompts/email-dl-contact-point.yaml — canonical-company stays, with an explicit evaluate note that producer Section G / the G4 re-pose is SME INTENT crossing INTO a company-canonical file (2026-08-11 ruling): the company applies producer additions to the prompt body; it never takes the file. (5) config/taxonomy/ui-components.yaml — per-entry; the K7-K15 Tier-B hold IS the entry_rule (company = producer minus the held AppCodeCascadePane route; counts 68/29 tracked, never asserted equal). (6) ADDED AT THE SAME REVIEW (2026-08-20, company registry screenshots reviewed; same Idea-142 class, found by resolving the glob): config/doc-source-registry.yaml has NO row and falls to the config/** canonical-producer default. The company row for fcdo-frameworks carries its OWN ratification record (confirmed: true, company gate-log citation 2026-08-19) and will carry `graph_locator` + `captured_at` + `manifest` once their load runs — all COMPANY-owned facts a wholesale take erases at every port; the producer owns trust_default / tier / curation / notes (the producer row is ahead on VERBATIM, the company row still reads GROUNDED + "no connector has run"). Rule it per-entry by id with a FIELD split in the entry_rule: producer fields cross, company fields never do, confirmed + its comment are per-repo (the F4 rule one file over). The source-registry v2 row is the precedent (company-canonical ids + the D2 overlay seam). Guards: test_port_manifest.py well-formedness green; the J16 fall-through guard sees no new default; each new per-entry row's entry_rule is exercised by test_port_reconcile_guards.py where the file shape allows (detector ids and exemption lists are list-shaped — assert no-drop). PORT-MANIFEST `updated:` note records the five rows and cites this item; the port-prompt rolling ledger gets one line. Then close Idea-142.
