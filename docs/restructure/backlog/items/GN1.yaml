acceptance: |
  An ADR settling the naming BEFORE any rename moves, because the alternative is renaming twice. It must carry: (a) THE MOTIVATION IN THE SME'S OWN TERMS -- company jargon entered a repo that was meant to be generic from the start (seal, pat, m1/m3 milestone ids). This is the standalone- generalization goal, not cosmetics, which is why it earns an ADR and an epic rather than a rename commit. (b) THE THREE-AXIS MODEL: the command names the SUBJECT (the data), the source registry entry carries CADENCE and ACQUISITION, and the profile is DERIVED by filtering on cadence. Today all three are collapsed into one LoadStep with hand-assigned profile tuples. (c) THE THREE BANDS: prepare / load / verify. Only the load band is source-keyed; forcing check or bootstrap into a source scheme is the same category error inverted. m1-verify and m3-verify carry the same defect as seal and pat -- milestone ids meaning nothing to a reader -- and are renamed with everything else. (d) THE SAAS QUESTION, ruled not dodged. The SME flagged ServiceNow and Jira as possible exceptions because they are widely known. The ADR should record the counter-argument and the ruling: the subject names the data (cmdb, work-items), the source id names the tool, because the SME's own CSV-to-database argument applies one level up -- if CMDB data later arrives from a different ITSM, load-servicenow is wrong and load-cmdb is still right. (e) DEPRECATION POLICY. CLI verb names are a PUBLIC CONTRACT -- company crons, scripts and the run-drydocs skill call them by name. New names ship with old ones as deprecated aliases for one port cycle, then drop. Precedent exists: cli.py already carries legacy-verb aliasing for supplements. (f) THE SOURCE-ID LAYER IS NOT A UNILATERAL PRODUCER CHANGE, and the ADR must say so or GN2 will discover it the hard way. Registry v2 is a COMPANY-CANONICAL SURFACE per the standing divergence ledger, and retired ids are governed by the D4 refusal list. Renaming pat:* source ids is a cross-repo reconciliation with new retired-id entries, not an edit. The ADR rules which of the three layers move together and which move separately. (g) The alternatives considered and rejected, with reasons -- an ADR that records only the chosen option is a design note wearing a decision's clothes.
notes: |
  Claimed at raise, 2026-08-11 (desktop), SME direction: "I agree with the ADR approach and everything ... the rename may require its own standalone epic, with a frozen change and port." NEW EPIC generic-naming, prefix GN. NOTE ON THE PREFIX: the free single letter was T, and it was NOT taken -- T1-T22 is the cross-repo TRACKER id space cited throughout docs/port-prompt.md, so T-series backlog items would collide semantically with T15/T18/T22. That is the same class of collision that produced the G70 duplicate this morning; declining it cost one letter.
annotations:
  status: '2026-08-11 (desktop): ADR 0012 written + indexed. Clause 5 is the finding the session produced
    rather than restated: the three layers do NOT move together — CLI verbs and LOADER_REGISTRY keys are
    producer-canonical, but source registry ids are COMPANY-CANONICAL under registry v2 with retirement
    governed by the D4 refusal list, so renaming pat:* is a cross-repo reconciliation minting new retired-id
    entries, NOT an edit. A unilateral producer change there forks the registry on identity, which is
    exactly what D4 exists to prevent. Four alternatives recorded with reasons, including the SaaS-exemption
    the SME raised — declined using the SME''s own acquisition-may-change argument applied one level up.'
