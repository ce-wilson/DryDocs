id: G63
epic: component-topology
title: 'Run the repo-manifest data-profile gate: name the repos, bless trusted_ref (the field only a human
  may set), then rule corroboration and the commit-date stub'
type: task
module: drydocs-lineage
phase: 6
agent: main
model: fable
priority: p2
status: todo
depends_on:
- G22
- G24
gates: [repo-manifest-data-profile]
inputs:
- config/gate-prompts/repo-manifest-data-profile.yaml
- config/gate-log.md
- config/source-registry.yaml
