  The gate's follow-up build, N13 flips-are-follow-ups: this commit is the one that flips the two planned entries active. (a) E1 registration: the directory dataset registers on the EXISTING replica system (dataset-on-replica, the E1 reshape; layer human on the dataset row, classification Internal, authority SOR for account identity) with the E2 audit-fields stub; confirmed flips with this build. (b) The pull is the D1 demand-set union, CLASS-GATED FIRST (D2/G7/G8: named census classes excluded before any join; the platform-account curated list lives values-twin under internal/, threshold app_codes >= 10); retired accounts in scope (B5); columns per D3 including the owner-of-record column. (c) The loader writes :AppUser keyed on the directory id (A1, uniqueness constraint), fid_name a property with the name -> id crosswalk an explicit REPORTED step carrying the A3 time qualifier and multi-candidate refusal; joins normalize UPPER on BOTH sides with the raw value retained and fold counts reported (the amended Q6). (d) Edges: seal_appuser_belongs_to_application with as_of (extract date), origin declared, assignment_kind registration (B1/G1); seal_appuser_owned_by per the Q7 ruling, with the two-human-owners GRAPH TEST attached (accounts_below_owner_minimum stays separate from accounts_with_no_owner_recorded). (e) TierReconcilers.fid populates from the SAME crosswalk (C4) under the AMENDED scope (gate-log 2026-08-19 amendment): fill gaps only, never override a confirmed mapping, disagreements reported (G4), never written. (f) Extracts retained as dated snapshots (B3/D4 — Q2 confirmed no history surface exists, so retention is the only transfer record); transfer detection itself (phase 6 diffing) may be deferred to its own item but the retention shape cannot. (g) NO transitive read of registration onto jobs in any loader, QuerySpec, or view (G2). Suite green; e2e against the sample fixtures where the venue allows.
