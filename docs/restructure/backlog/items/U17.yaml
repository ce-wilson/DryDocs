id: U17
epic: self-documentation
title: DesignDoc.commit is the author's claim, not a git fact — say which one the tech-writer persona's
  staleness ranking uses
type: bug
module: docs
phase: 16
agent: main
model: sonnet
priority: p3
status: done
depends_on: []
inputs:
- docs/reviews/code-graph-review-plan.md
- docs/reviews/persona-tech-writer-2026-07.md
- drydocs_core/models/doc_traceability.py
acceptance: |
  The tech-writer persona's staleness ranking states which commit it ranks on — the commit the document CLAIMS to reflect (DesignDoc.commit, an author's assertion transcribed from the doc's own prose) or the commit that last TOUCHED the file (a git fact) — the plan records the rule WITH its reason, the query matches the rule, and the known divergence is used as the worked example: drydocs-startup-refresh-runbook carries a135a6d (2026-07-20) while its last touch is 554a4e8 (2026-07-31, Rev 5). If both readings are wanted, both are surfaced under distinct names; what may not survive is an undefined ranking.
notes: |
  Groomed 2026-08-07 (pm) from Idea-48. Both readings are defensible — which is precisely why the undefined state is the defect — so the item is allowed to pick, provided the reason is written where the next reader finds it. Epic U rather than L: the ranking belongs to the U1-U3 code-graph review personas, even though the :DesignDoc node itself is Epic L infrastructure. DONE 2026-08-09 (desktop): RULED — the re-verify queue ranks on the CLAIM, with the git fact reported beside it and the gap between them named as its own measure. Three names now exist where one word did: claim_lag (cited commit -> HEAD, the ranking key), touch_lag (last-touching commit -> HEAD, reported, never ranked on), citation_lag (cited -> last-touching, the 'edited but never re-verified' measure). WHY THE CLAIM WINS: the mandate is the status of documents joined to the code they CLAIM to describe, and a reader trusts the citation; ranking on touch_lag answers a different question and would hide this unit's own subject, since a doc edited ten times without ever being re-checked ranks as FRESH under it. WORKED EXAMPLE, re-measured at 4ecfca0 rather than copied from the item (the divergence widened a month): drydocs-startup-refresh-runbook cites a135a6d (2026-07-20, squash day), last touched by 180f4ae (2026-08-06) — claim_lag 792, touch_lag 122, citation_lag 670. The two readings put the SAME document at opposite ends of the queue, which is the entire argument for naming the key. The item's Rev-5/554a4e8 figures were the Idea-48-era snapshot and are superseded. citation_lag ratifies the label Run 2 had to invent in-flight ('stale cite, fresh content'). THREE DEGENERATE CASES RULED rather than left to whoever writes the query: no citation -> rank unknown, never fresh, never silently substitute touch_lag; citation unreachable from HEAD -> rank maximum, because an uncheckable claim is worse than one measured far behind; and the trap — a citation can RESOLVE and still not be an ancestor. VERIFIED, and machine-dependent (J18: desktop): all five pre-squash cites Run 2 listed (807e050, ac2ea2e, 97ee81c, 24d6a4b, 0e036ff) resolve as objects here because the local archive/old-history-2026-07-20 tag keeps them alive, and NONE is an ancestor of HEAD — so `git cat-file -t` passes them on this desktop and fails them on a fresh clone, and `rev-list --count` returns a meaningless number across the disjoint history. The check must be `git merge-base --is-ancestor`. No query-pack file exists for Phase 3 (the A1-A6 pack is Phase 1's, in the tech-debt skill; the documentation skill carries no graph queries), so the plan IS the query spec and now names the exact measures and commands. New guard file tests/unit/test_code_graph_review_plan.py (5 tests): the three measures are named, the ranking key is stated, the conflation cannot return, each degenerate case is ruled, the reachability check is ancestry not object existence. All five PROVEN to fail against the original Unit 2 text before being trusted (J26) — and that exercise caught a real defect in the first draft of the conflation guard: it was line-scoped, while the original defect spanned a line break, so it would have passed the very text it exists to catch.
