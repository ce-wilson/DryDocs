acceptance: |
  config/gate-prompts/corporate-backbone-vocabulary.yaml drafts the rulings as confirmations to be SIGNED, never pre-decided. GATE-BOUND: drafting and rendering this page registers nothing. THE FINDING IT EXISTS FOR: (:Company {name:"JPMC"})-[:HAS_BUSINESS_SEGMENT]-> (:BusinessSegment) is MERGEd by ontology.cypher:205-232, carries a uniqueness constraint (constraints.cypher:29), is documented as THE corporate hierarchy across four .claude/skills/data-context-extractor/ files, and is live in the graph — while 10-node-classifications.yaml registers BusinessSegment and CatalogLOB and NOT Company, and no fragment registers HAS_BUSINESS_SEGMENT or its _HISTORICAL twin. NOT a regression: git log -S "Company" over the vocabulary returns nothing, so it is an M0 seed that predates the registry — there is no prior ruling to honour or overturn, which is exactly why it needs one. (a) THE LABEL: does :Company enter 10-node-classifications.yaml, and under which class? BusinessSegment is already org:FormalOrganization / prov Agent, and the note there records that the doc said FormalOrganization while the supplement comment said org:Organization — the same choice recurs here and the clause must state both readings rather than inherit one. (b) THE TWO EDGES: HAS_BUSINESS_SEGMENT and HAS_BUSINESS_SEGMENT_HISTORICAL enter as status: planned per RELATIONSHIP_GUIDE.md. The clause must ask whether the effective-dated pair is TWO edge types or ONE type discriminated by effective_to, because the seed already writes both shapes and the vocabulary would ratify whichever it is told. (c) THE SINGLETON QUESTION, which is why this is not purely clerical: :Company is a one-node class in a repo built to be generic and portable to another company (ADR 0012's standalone-generalization goal). Rule whether the label is right at all, or whether the segment backbone should hang off an existing org class — and if :Company stays, whether "JPMC" is seed data or configuration. (d) THE GUARD, separable from the ruling and buildable WITHOUT it: nothing cross-checks an edge's from_node/to_node against the registered label set — test_taxonomy_ontology_map.py checks label UNIQUENESS and test_yaml_fragments.py checks fragment KEYS, so a wholly absent endpoint raises nothing and RECONCILES_TO passes only because its endpoint happens to be registered. Record that the guard does not wait on this page. (e) PUBLISH BOUNDARY, ruled 2026-08-17 and recorded so it is not re-litigated: the source is External-PUBLIC (config/doc-source-registry.yaml#jpmc-reports — classification: External, public SEC filings / IR PDFs, source_url present), so the JPMC literals in ontology.cypher are publishable. This clause CONFIRMS that reading rather than reopening it; clause (c) is about portability, not sensitivity. NOTHING enters the vocabulary active at this gate, and nothing is transcribed to config/gate-log.md until ticked.
