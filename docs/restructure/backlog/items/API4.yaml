acceptance: |
  Two follow-ups the cyclic-type-trap eval case named and never inboxed, plus the evidence
  the smuggling-dot case leaves homeless. The first two are the item; the third is scoped
  here and ruled elsewhere.

  (a) A registered docs QuerySpec searches Chunk.text by term (a spec over the chunk text or
      a full-text index behind one). docs.search.v1 today searches Document title and
      abstract and says of itself that it is Chunk-free (drydocs_api/query_specs.py:946), so
      a term that appears only in a chunk body is unreachable. The new or widened spec is
      registered, has its catalog line, and its test shows a term found in a chunk body and
      NOT in any title or abstract coming back.
  (b) The hardcoded chunks: 0 in agents/graph_qa/pipeline.py (:362 and :535) stops being a
      literal: the count is a parameter of the tier or the request, its default is stated,
      and a non-zero value provably reaches chunk text end to end. This is why no /ask tier
      reads chunk text today, and (a) is unobservable from the console without it.
  (c) A chunk-level trust override is SCOPED here and not decided here: the illustrative
      ctmdefine enum the cyclic-type-trap case flags is loaded GROUNDED by document default
      while its hazard banner sits in a different chunk, which the case itself calls a trust
      defect. The item names where the override would live on the docmeta trust axis and
      what it would key on; the axis change itself is the docmeta owner's ruling and does
      not ship under this id.
  (d) O62's illusion is not re-created: a full listing read as a search hit by title
      similarity. The test in (a) distinguishes a term match in body text from a listing.
notes: |
  Minted 2026-09-07 from IDEAS.md Idea-282 (the UI session's eval-case review, reviewed at
  839eab1f on feat/cyclic-type-test-case), finding B AS AMENDED in the same session - the
  first form of the finding was partly wrong and would have sent someone to rebuild
  ask.file-search.v1, which O62 already built as the first term-accepting spec, over
  DataAsset.assetId (graph assets, not chunks). The amendment is the reason this item exists
  at all: what is genuinely un-inboxed is chunk TEXT, not term search in general.

  module drydocs-api because the spec is the deliverable; clause (b) touches
  agents/graph_qa and is called out so the two pens do not collide. This item is the GATE on
  AGENT1's vendor-corpus option - a control labelled "vendor corpus" over a title-only
  search would turn O62's illusion into a feature.

  The smuggling-dot case's B1 evidence also lands here as context, not as acceptance:
  _consume_delimiter (drydocs_core/orchestration/controlm/resolver.py:141) consumes a period
  only when the variable sigil follows, so the doubled-period spelling over-emits. Reproduce
  it by running the three shapes rather than reading it off the table.

  BUILT 2026-09-08 (Lane B, laptop `NewThinkpad`, wip/api4-laptop; offline - no graph was
  consulted and none is needed, because every fact below is in committed code). Branch is
  based on wip/agent1-laptop, which is based on wip/r18-laptop: clause (b) edits the same
  region of pipeline.py both of those already edit. MERGE ORDER: r18, agent1, api4.

  (a) `docs.chunk-search.v1` - a NEW spec, not a widening, and the distinction is a contract
  rather than taste: `docs.search.v1`'s own description promises "Chunk-free; docs.chunks.v1
  is the second step", and the Q15 note above the docs family states the same rule for all of
  them (triage on abstract and page_role first, spend the chunk read second). Widening the
  title door would break a promise two other descriptions cite.
  It filters server-side on `toLower(coalesce(c.text,'')) CONTAINS toLower($q)` and walks
  `(c:Chunk)-[:PART_OF]->(d:Document)` - the real corpus edge, not the `HAS_CHUNK` R18's
  evidence caught a model inventing. It returns a BOUNDED SNIPPET
  (`query_specs.SNIPPET_CHARS`, 400) plus `chunk_id`, never the chunk: the Q15 rule says a
  navigation spec does not return chunk text, and the full chunk is one call away by id.
  (d) is in the test and in the catalog line: the predicate is on the chunk body and NOT on
  `d.title` or `d.abstract`, which is what separates a match from O62's illusion - a full
  listing that a title similarity picked a winner out of afterwards.

  (b) `chunks: 0` is DERIVED, not parameterised, and that choice is the substance. A
  request-level "how many chunks" knob would be a number the CALLER asserts; the count is now
  one the RESULT proves - `pipeline.count_chunk_rows` counts the distinct `chunk_id` values in
  the rows that came back. DISTINCT because a chunk reached twice is one chunk of context,
  not two; and in Tier 2 the ids are UNIONED across the loop's retrievals for the same reason,
  accumulated in the `_retrieve` closure so tier2.py stays a pure loop that knows nothing
  about corpora. The stated default is 0 and it is still 0 for every graph answer - the
  difference is that it is now a true count rather than a placeholder.

  (c) SCOPED, AND THE SCOPING TURNED INTO A DIAGNOSIS. The override does not need building;
  it exists and is UNREAD. `docs.chunks.v1` and `docs.trust-provenance.v1` both compute
  effective trust as `coalesce(c.trust, d.trust_default)`, and NO loader writes `Chunk.trust`:
  bmc_docs.cypher:80 and essential_graphrag.cypher write `c.provenance` (VERBATIM / GROUNDED /
  SYNTHESIZED from `bmc_docs.classify_chunk_tier`), and email_extracts.cypher writes no chunk
  tier at all. So the coalesce always falls through and every chunk reports its document's
  default - which IS the cyclic-type-trap case's trust defect, exactly: an illustrative enum
  reads GROUNDED because its document does, while the hazard banner that would downgrade it
  sits in a different chunk.
  And the two fields share a vocabulary. `BmcDocChunkRow.trust_default`
  (drydocs_core/models/docs.py:62) documents ITSELF as "the doc-level fallback tier absent any
  chunk-level override ... the per-chunk 'provenance' field is what actually varies". So the
  gap is a PROPERTY NAME, not a missing model, and the ruling's first question is which name
  wins - `c.trust` (change two loaders) or `c.provenance` (change two specs).
  NOT FIXED HERE, on the item's own instruction: the axis change is the docmeta owner's.
  `tests/unit/test_chunk_search_spec.py` pins the gap OPEN so it cannot close by accident and
  so the ruling has something that fails when it lands.

  SURFACES: drydocs_api/query_specs.py (the spec + SNIPPET_CHARS),
  agents/graph_qa/pipeline.py (the derived count), agents/common/scopes.py (the new spec
  joins CORPUS_ONLY_SPECS - AGENT1's drift guard failed on it, which is the guard working).
  TESTS: tests/unit/test_chunk_search_spec.py (12).

  HANDBACKS FOR LANE A:
  1. `backlog` - THE GATE ON AGENT1'S VENDOR-CORPUS OPTION IS NOW MET. A registered spec
     searches chunk text, so the reason that scope was declared-and-refused is gone. Whether
     it FLIPS to `ready` is AGENT1's re-evaluation and not this item's to make; it is a
     one-line change in `agents/common/scopes.py` plus its test.
  2. `backlog` - a robustness gap found in passing, pre-existing and out of scope. In
     `pipeline._run_spec`, `resolve_params` is retried with `{}` "defaults over router noise",
     but a spec with a REQUIRED param raises again on the retry and the exception leaves the
     pipeline (agent.py turns it into an error payload, so a question answers with an error
     rather than falling through to Tier 1). It predates API4 - `ask.file-search.v1` has the
     same shape - but API4 adds a second required-param spec, so the odds go up. Worth an
     item: a required-param spec the router names without params should fall through, which
     is what the surrounding code already believes it does.
  3. The docmeta trust-axis ruling in (c) needs a home - it is a gate question, not a build.
