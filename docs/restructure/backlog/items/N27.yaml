acceptance: |
  (a) ADD THE SYSTEMS ROWS to config/source-registry.yaml for the three file-transfer platforms
  the research separates: MFTS, FileMover and OneMFT. Each carries the fields the registry already
  requires - no new field shapes - including a classification (there is no unlabeled default) and
  an owner.

  (b) MFTS IS AT MINIMUM A :BusinessApplication: it has a SEAL (89830) and a named support group
  (IP_CFP_ISUP_MFTS). Register the identifiers, never connection coordinates - a SEAL id and a
  support-group name are identifiers, and the internal-twin rule covers host/port/service/creds
  only. Test: could someone connect with this string alone.

  (c) THEY ARE THREE SYSTEMS, NOT ONE UNDER THREE NAMES, and the rows must say so: MFTS is Axway
  SecureTransport 6.0.3 and is DISTINCT from FileMover and OneMFT (research CORRECTION H93). A
  single row with aliases would re-create the homonym the research spent six corrections
  separating.

  (d) DATASETS ARE OUT OF SCOPE. This registers the SYSTEMS. No dataset row, no URN for a route,
  no loader - the route's shape is C44's gate question and registering a dataset here would
  pre-empt it.

  (e) PASS/FAIL: the registry validators pass; the derived load-map render regenerates and the
  committed copy matches (a default-paths render_board.py run refreshes load-map.json and
  load-map.html); the source count in the render moves by three.
notes: |
