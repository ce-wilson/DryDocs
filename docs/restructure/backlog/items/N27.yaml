acceptance: |
  (a) ADD THE SYSTEMS ROWS to config/source-registry.yaml for the three file-transfer platforms
  the research separates: MFTS, FileMover and OneMFT. Each carries the fields the registry already
  requires - no new field shapes - including a classification (there is no unlabeled default) and
  an owner.

  (b) MFTS IS AT MINIMUM A :BusinessApplication: it has a SEAL (89830) and a named support group
  (IP_CFP_ISUP_MFTS). Register the identifiers, never connection coordinates - a SEAL id and a
  support-group name are identifiers, and the internal-twin rule covers host/port/service/creds
  only. Test: could someone connect with this string alone.

  (c) THEY ARE THREE SYSTEMS, NOT ONE UNDER THREE NAMES, and the rows must say so: MFTS is Axway
  SecureTransport 6.0.3 and is DISTINCT from FileMover and OneMFT (research CORRECTION H93). A
  single row with aliases would re-create the homonym the research spent six corrections
  separating.

  (d) DATASETS ARE OUT OF SCOPE. This registers the SYSTEMS. No dataset row, no URN for a route,
  no loader - the route's shape is C44's gate question and registering a dataset here would
  pre-empt it.

  (e) PASS/FAIL: the registry validators pass; the derived load-map render regenerates and the
  committed copy matches (a default-paths render_board.py run refreshes load-map.json and
  load-map.html); the source count in the render moves by three.
notes: |
  Groomed 2026-09-02 from Idea-236 gap 2 (OQ-4), desktop, backlog-groomer fork.

  THE ARGUMENT FOR p1 IS STRUCTURAL, not urgency: Control-M cannot be the source of record for a
  relationship whose other end is unregistered. C44's gate is blocked behind this for the same
  reason, which is why it depends on it. Producer source-registry.yaml confirms there is no
  systems row, no classification and no owner for any of the three today.

  Same class as the registration gaps this session already named; the row is the smallest change
  that unblocks the rest. Related: C42, C43, C44, N26, Idea-236.

  DONE 2026-09-06 (desktop, Lane A, 5c11aaea). Three SYSTEM rows - mfts, filemover, onemft - in
  config/source-registry.yaml, each with a disambiguation sentence naming the other two (the
  snow/snowflake shape), layer technology, classification Internal, binding ~ with a matching
  unbound: entry in config/source-bindings.yaml. locator.source_product points MFTS at the C43
  software-registry product; FileMover and OneMFT carry an empty locator because their vendor is
  unevidenced and C43 left them out on purpose. No dataset, no URN, no loader (d). Render: the
  load-map moved 16 to 19 systems, 40 datasets unchanged; full suite 3470 passed.

  HOW (b) WAS MET, AND THE TENSION IT LEAVES: the acceptance reads as register the SEAL id and the
  support-group name on the row. The row does not carry either value. seal_id is the standing
  placeholder on every committed system row - the D1 amendment to gate source-registry-v2, and
  the shape C43 followed for the same platform three days earlier - and the registry has no owner
  field at all, so the owner is recorded in notes BY POINTER to the research file (H93 for the id,
  H98 for the support group), the pointer-never-the-value idiom the infra row already uses. That
  satisfies the registry's own mechanism for an identifier, and it is deliberately not a ruling on
  whether identifiers may appear in an Internal-Public config file: the 2026-08-29 ruling says the
  twin covers connection coordinates and not identifiers, the signed D1 amendment says seal_id is a
  placeholder regardless, and the un-redaction of identifiers is exactly N23's question (gate
  registry-wiring-readiness, I3 of the identity review). Ruling it there un-redacts all 19 rows at
  once; ruling it here would have amended a signed record from inside a task item. The literal
  values already sit in tracked item files (this one, C42) and in IDEAS.md, which is the same
  question from the other side and is left for N23 too.

  For C44: the other end of the route relationship is now registered, so its dependency is met;
  which of the three platforms serves a given route stays OQ-3/OQ-7 and is the gate's to rule.
