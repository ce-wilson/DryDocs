acceptance: |
  A platform app code can no longer be mistaken for a tier-1 code by either route. (a) DERIVATION: tier comes from the folder name — prefix positions 3-5 matched against the closed platform-code list (six codes; the list lives in the VALUES twin under internal/, the mechanism in the publishable twin) — so a code-level row that carries a SEAL is not read as an application attribution for folders that are merely HOSTED by that platform. A row-level test covers both a platform prefix and an application prefix. (b) AUTHORING: the mapping store gains an explicit platform-declaration entry kind (app_code + declaration + rationale) rather than the current declare-by-absence-of-app_id encoding. The store's app_id-required check STAYS — it is correct for tier-1 rows, and relaxing it would let a blank target through as an ordinary attribution. (c) Folders under a declared platform code that the steward has not resolved per-folder surface as `platform-unresolved` instead of falling through to the K2 fuzzy fallback, which is what K7 §B2 already rules and what the current write path cannot express. No graph-test relaxation: folder-attribution-coverage stays 1:1. Full suite green.
notes: |
  Groomed 2026-08-05 (desktop) from Idea-66 + Idea-69, with Idea-63b and Idea-68 riding as clauses. WHY (a) IS THE BIGGER HALF and was the surprise: this looked like a steward capture exercise until the SME supplied the DAT SRE Framework -> APPCODE table. The platform list is CLOSED AT SIX CODES and positions 3-5 of the folder prefix decide the tier, so tier assignment is MECHANICALLY DERIVABLE — a six-row list plus a name parse, not a data-entry backlog. It also means this item does NOT depend on the SME's owed tier-1/tier-2 enumeration (Idea-28): that enumeration is needed to RESOLVE a tier-2 code's consumers, not to recognize one. THE FAILURE IT PREVENTS IS SILENT AND LOOKS CORRECT. `AOC -> <platform SEAL>` is a TRUE statement about the platform and a false one about the consumer folders it would be stamped on. Both AOC (the datalake / Ab Initio platform) and DCL (the DPL launcher spine) are shared codes whose folders serve many consuming applications, and the only in-file hint of platform-ness is the word "Platform" in `descr` — the untrustworthy column. Nothing is mis-written TODAY only because no producer-side platform code has been authored yet. RIDER (Idea-63b): `descr` is a CORROBORATION signal with a known-imperfect base rate, never a validity test and never a derivation source. If this item compares column 2 to the head of column 3 at all, the output is a REVIEW QUEUE of disagreeing rows for a human — candidate stale renames, decommissioned SEALs, copy-paste — not a pass/fail gate. RIDER (Idea-68), cosmetic and do it here or not at all: "tier" names two things — the K7 row-kind (a STRING enum seal-born|platform|dual-coded) and the K2 match precedence (an INT, 1 SEAL .. 5 manual). The value spaces do not collide, so a `tier` edge property is not ambiguous in practice and this is naming hygiene rather than a correctness risk — but `row_kind` vs `match_tier` is worth renaming BEFORE either surfaces in a QuerySpec, and this item is already in both files. DISAGREEMENT RULE (added at claim, 2026-08-05): clause (a) gives the loader TWO tier signals for an authored code — the name-derived tier and the row's declared kind — and the acceptance did not say which wins when they disagree (e.g. a steward authors a tier-1 row for a code the name parse says is platform). Ruling, on the Idea-63b pattern and the S10 refusal precedent: a disagreement NEVER resolves silently. The name derivation wins for BLOCKING fan-out — a platform-prefixed code never fans out code-level even if its row claims tier-1 — and the disagreeing row lands in the review queue with both signals shown; a human re-authors or the list is corrected. The inverse disagreement (row declares platform, name parse says application) blocks nothing but queues the same way. DONE 2026-08-05 (desktop, 1386faf): (a) built — load_platform_codes (values twin internal/standards/technology/platform-codes.yaml, six codes; missing file = guard inert) + platform_prefix pos3-5 + the resolver guard (blocked fan-out queues a RowKindDisagreement, folders surface platform-unresolved; inverse queues without blocking); row-level tests cover a platform prefix AND an application prefix. (b) built — validate_app_code_row: platform code-level row now REQUIRES the platform's own app_id + rationale (declare-by-absence retired; legacy empty-app_id shape still reads as a declaration in the resolver, defensively); store schema v3. (c) built — declared-code folders already surfaced platform-unresolved; the guard now routes derived-platform codes there too. Idea-68 rider APPLIED: tier -> row_kind end to end (column, CSV header, wire, model, edge property, steward screen); K2 match tiers keep their name (no property surfaces, nothing to rename). Idea-63b rider NOT EXERCISED: no descr comparison was built (the rider is conditional; the review-queue rule stands recorded for whoever builds one). COMPANY-SIDE: header+edge-property renames ride the T23 migration family — their tier-authored rows re-author as row_kind; live r.tier edges migrate with the K8 reload. Suite 1597 green. K19 unblocks.
