id: O84
epic: web-console
title: A demo query naming a label the graph does not have returns success with zero rows -
  generate or guard the gate-ruled labels instead of hand-copying them
type: bug
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- web/src/components/CypherConsole.tsx
- agents/graph_query/agent.py
- config/gate-prompts/self-documentation-code-graph.yaml
- drydocs_core/schema/
acceptance: |
  (a) THE DRIFT IS RECORDED SO THE DETECTION GAP IS THE SUBJECT, not the two strings. The
  console's depgraph components preset and the graph-query agent's default query both named a
  code-file label, a depends-on relationship and a camel-case path property, while the signed
  self-documentation code-graph gate ruled a code-module label - explicitly rejecting the
  code-file option - and an imports relationship, and the loader writes the snake-case property.
  Both call sites were fixed on 2026-08-29; this item closes the reason nothing noticed.

  (b) THE LABELS AND RELATIONSHIP TYPES A FIRST-PARTY DEMO QUERY MAY NAME COME FROM A GENERATED
  ARTIFACT WITH A DRIFT TEST, the shape already used elsewhere in the UI work, OR from a guard
  that fails when a first-party query names a label no schema declares. Choose ONE, implement it,
  and say why the other was not chosen.

  (c) ZERO ROWS FROM A PRESET IS DISTINGUISHABLE FROM A PRESET THAT NAMES NOTHING REAL. A query
  whose labels are unknown fails loudly instead of reporting success with an empty result, which
  is the surface half of the same defect.

  (d) SCOPE FENCE - this does not validate arbitrary user-typed Cypher. First-party presets and
  agent default queries only, and the item says so, so the guard is not later widened into a
  general query validator nobody asked for.

  (e) VERIFIED AGAINST A LIVE GRAPH ONCE, with the venue named (J18), and the unit-side guard
  skipping with a named message where no database is reachable.
notes: |
  BUILT 2026-08-31 (desktop, MSI). The guard is tests/unit/test_first_party_queries.py;
  the surface half is in CypherConsole with web/src/lib/cypher-labels.ts behind it.

  (a) THE DRIFT IS RECORDED IN THE GUARD'S OWN HEADER, and the subject is the detection
  gap rather than the two strings: a ruling that exists only in a gate document and in two
  hand-copied strings has no enforcement point, so the query stayed valid Cypher, the
  database answered it, and the surface reported success with zero rows.

  (b) A GUARD, NOT A GENERATED ARTIFACT, and the reason the other was refused is written
  where the choice lives. The two call sites are in different languages -- a TypeScript
  preset map and a Python default -- so a shared artifact needs two consumers, a build step
  and a drift test of its own: three moving parts to enforce one sentence. The schema files
  already ARE the source of truth. The generated-artifact shape stays right where a VALUE
  must be rendered into a surface (gates.json, load-map.json); here nothing is rendered.

  J66 IS LOAD-BEARING HERE RATHER THAN CEREMONIAL, and the first attempt got it wrong in an
  instructive way. Both source files NAME the rejected label in the comment explaining the
  ruling, so a substring scan would fail on the explanation. The TypeScript side gets a
  local comment stripper (the precedent source_scan's own header sets for a grammar Python
  cannot parse). The Python side reached for source_scan.code_only first and that helper
  strips comments AND STRING LITERALS -- the thing being guarded IS a string literal, so it
  found nothing. Caught immediately by this module's own finds-nothing guard, which exists
  because an extractor that silently returns [] passes forever. It now reads an AST, where
  comments do not exist at all, and a test asserts the rejected name is still present in
  both raw files and absent from everything the extractors return.

  THE GUARD IS PROVEN AGAINST THE DRIFT, not just against today's correct strings: the
  rejected shape is run through the same extraction and the same declared sets, so the
  suite would have failed on 2026-08-29. Without that test, a guard checking nothing and a
  guard checking correct code report identically.

  (c) THE SURFACE HALF. An empty PRESET result now asks the database which labels it has
  and names the missing ones, so "the graph holds no matching data" reads differently from
  "this preset names nothing real". The diagnosis is best-effort: a database that will not
  answer db.labels() must not turn a successful query into an error.

  (d) THE FENCE IS ENFORCED, not just stated. The diagnosis fires only when the query is an
  EXACT match for one of the presets, so an edited preset is user Cypher again and the
  raw-Cypher bench stays a bench. cypher-labels.ts says the same in its header.

  (e) LIVE VERIFICATION, VENUE NAMED (J18): desktop, `neo4jtest` container -- `drydocs`
  reports 80 labels and `neo4j` 50; CodeModule is present in both and CodeFile in neither,
  which is exactly the fact the diagnosis rests on. NOTE ON THE SKIP CLAUSE: the guard
  reads source and schema files only and touches no database, so there is no database for
  it to skip on. Adding a skip branch that can never fire would be worse than saying this.

  VERIFIED: Python suite 2886 passed / 12 skipped, ruff check + format clean, vitest 43
  passed (11 new over the extractor), oxlint unchanged (4 pre-existing warnings), tsc build
  clean.
