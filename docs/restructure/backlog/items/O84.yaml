id: O84
epic: web-console
title: A demo query naming a label the graph does not have returns success with zero rows -
  generate or guard the gate-ruled labels instead of hand-copying them
type: bug
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- web/src/components/CypherConsole.tsx
- agents/graph_query/agent.py
- config/gate-prompts/self-documentation-code-graph.yaml
- drydocs_core/schema/
acceptance: |
  (a) THE DRIFT IS RECORDED SO THE DETECTION GAP IS THE SUBJECT, not the two strings. The
  console's depgraph components preset and the graph-query agent's default query both named a
  code-file label, a depends-on relationship and a camel-case path property, while the signed
  self-documentation code-graph gate ruled a code-module label - explicitly rejecting the
  code-file option - and an imports relationship, and the loader writes the snake-case property.
  Both call sites were fixed on 2026-08-29; this item closes the reason nothing noticed.

  (b) THE LABELS AND RELATIONSHIP TYPES A FIRST-PARTY DEMO QUERY MAY NAME COME FROM A GENERATED
  ARTIFACT WITH A DRIFT TEST, the shape already used elsewhere in the UI work, OR from a guard
  that fails when a first-party query names a label no schema declares. Choose ONE, implement it,
  and say why the other was not chosen.

  (c) ZERO ROWS FROM A PRESET IS DISTINGUISHABLE FROM A PRESET THAT NAMES NOTHING REAL. A query
  whose labels are unknown fails loudly instead of reporting success with an empty result, which
  is the surface half of the same defect.

  (d) SCOPE FENCE - this does not validate arbitrary user-typed Cypher. First-party presets and
  agent default queries only, and the item says so, so the guard is not later widened into a
  general query validator nobody asked for.

  (e) VERIFIED AGAINST A LIVE GRAPH ONCE, with the venue named (J18), and the unit-side guard
  skipping with a named message where no database is reachable.
notes: |
  Groomed 2026-08-30 (desktop, weekly groom) from Idea-202.

  The interesting property, and the reason it is a bug rather than an idea - two call sites
  drifted from a SIGNED gate ruling, the unit suite stayed green, and the surface reported
  success. A ruling that only exists in a gate document and in two hand-copied strings has no
  enforcement point at all.
