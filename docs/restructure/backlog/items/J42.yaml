acceptance: |
  A PORT-TIME check -- not a unit test, because the producer tree cannot see the consumer's -- that reads both repos' SHARDED backlog at the RECORDED PORT BASE, diffs the item-id sets, and FAILS the port report when producer-minus-consumer is non-empty, naming every missing id. THE ID SET IS THE DIRECTORY LISTING: since Y2/ADR 0013 Clause 6 the entry IS the file, so the set is the stem of every docs/restructure/backlog/items/<id>.yaml on each side -- take it from the listing, or from drydocs_core.backlog_store.load_backlog_document(), and NOT by parsing a monolith. THE VACUOUS-GREEN TRAP, which is the whole reason this clause is written out: docs/restructure/backlog.yaml is a TOMBSTONE (sharded 2026-08-20) and has no items[] key at all, so a check aimed at it reads two empty sets, reports "no difference" and passes for being wrong -- exactly the J26 class this item exists to close. The check must therefore FAIL LOUD, not pass, when either side's items directory is absent or empty, and when the id it reads from a filename disagrees with the id inside that file. An explicit allow-list carries ids deliberately not carried across, each with its reason, so that "no difference" and "a difference somebody accepted" are distinguishable in the output rather than both rendering as silence. SCOPE FENCE: this item owns the UNION half only -- never-drop-an-entry. The never-regress-a-status half of the same manifest row is the J16 guard's, which reads the assembled tree through backlog_store.dump_document(); do not re-implement it here. It runs from the reconcile side, where both trees are reachable, and is named in .claude/skills/reconcile-port/SKILL.md and docs/port/port-prompt.md so a session that never opens the manifest still runs it. Proven to FAIL on an injected defect -- one item FILE deleted from the consumer copy -- before it is trusted (J26).
notes: |
  Groomed 2026-08-11 from Idea-96. PORT-MANIFEST.yaml states the union rule unconditionally for docs/restructure/backlog.yaml ("Union the items; NEVER regress a status ... or drop an entry"), and tests/unit/test_backlog.py enforces plenty about the file -- schema, roll-up arithmetic, next_ready, unknown depends_on -- but every one of those checks looks at ONE copy in isolation. The union is a claim about TWO copies and nothing compares them, so a port that quietly under-delivers items leaves both sides internally consistent and green. Textbook J26: a rule written in prose and enforced by nobody. The near miss that makes it worse -- the dependency guard would have caught it only if a surviving item happened to depend on a missing one, so whether the gap is visible at all is luck rather than design. Mechanism only; the numbers and ids from the occurrence stay in the port report, not here.

  REPOINTED AT THE SHARDED GRAIN, 2026-08-23 groom (laptop) -- a correction, not a scope change. This item was written 2026-08-11, nine days before Y2 sharded the backlog, and its acceptance still sent the builder at docs/restructure/backlog.yaml and its items[] key. That file is now a TOMBSTONE, so the check as written would have read two empty sets and PASSED -- an item whose own argument is "a rule written in prose and enforced by nobody" would have shipped a guard that is green for being wrong. Found while verifying which ready items were safely dispatchable, and it was the ONLY open item still pointing at the tombstone (every other citation of that path is in a done item, where it is correct history). The rule itself did not move: PORT-MANIFEST.yaml's row for docs/restructure/backlog/items/*.yaml carries the same promise at file grain ("Never drop a file; never regress a status", F4 ruling 2026-08-20), which is why the repoint is mechanical and needed no ruling. Two things were tightened while repointing, both to keep the guard from passing vacuously again: the empty/absent-directory case must FAIL rather than read as agreement, and the filename-vs-inner-id disagreement is now in scope (the filename IS the id under Clause 6, so a mismatch means the set being diffed is not the set that exists). The status-regression half was fenced OUT explicitly because J16 already owns it -- previously that division was only implicit in the manifest's note.
