acceptance: |
  web/README.md is materially wrong on the security model in four places (A8): it says there
  is no `?as=` parameter (App.tsx has one, DEV-only, requiring VITE_DEV_CONSOLE_SECRET); it says
  nine module routes (registry.ts declares twelve); it says all modules are open to every
  signed-in persona and only /console is role-gated (five modules carry access 'sme' and
  App.tsx gates six routes plus /console, /admin/config and /intake); and its persona table
  carries the three SID-shaped names auth.ts retired on 2026-08-28 for publish-boundary
  reasons. A doc that understates the authorization surface is the doc a company-side reader
  reaches first.

  (a) The README states the model the code implements: the DEV-only `?as=` affordance and its
      secret gate; the module count and each module's access level, read from registry.ts; the
      route gates; the six personas by their current names and roles.
  (b) Where WEB3 lands first, the README describes the derived gate; where it has not, the
      README says the two expressions exist and cites WEB3 - it never describes a state the
      code is not in.
  (c) A test keeps the module count and access table in the README equal to registry.ts
      (rendered from the importable object, J37 style), so the fourth drift does not happen.
notes: |
