acceptance: |
  Phase 1 of the lineage-chain workplan
  (docs/reviews/lineage-chain-extract-load-workplan-2026-09-03.md). The LOAD half.

  (a) THE VERB. `drydocs lineage-load [<artifact>]` in drydocs/cli.py beside
  lineage-extract (the S8 rule LIN1 recorded: component-wiring verbs stay in the root)
  reads a staged artifact LIN1 wrote - by default the NEWEST in the declared
  lineage/staged/ zone, which the sortable artifact name makes derivable without
  opening a file - rebuilds the LineageGraph, runs drydocs_lineage.writer.plan_curated
  and prints the WritePlan (nodes, edges by label, the planned-label refusals, the
  unresolved file-op candidates) - and STOPS. That is the default. `--write` runs
  write_curated against the ground-truth database for the ACTIVE labels only
  (scheduler_invokes, scheduler_uses_artifact, scheduler_reads_from, scheduler_writes_to,
  as signed at G55); a planned label (scheduler_triggers) is still refused by the writer
  and the refusal is printed, never swallowed.

  (b) CURATION IS THE GATE, NOT A FLAG. The confirmed set write_curated takes comes from
  the review surface's confirmations (lineage-review's JSON export), passed as
  `--confirmed <file>`; with no confirmations the write is the empty set and says so.
  Nothing reaches `drydocs` uncurated (the package invariant).
  THE PRODUCER DOES NOT EXIST YET (review 0015fcfa R2, 2026-09-04): lineage-review's
  export is per-FOLDER free text (`{doc, exported, notes: [{folder, note}]}`,
  review.py exportNotes) and plan_curated wants (from, type, to) rel triples, so
  today's export cannot produce the confirmed set. LIN2 closes the gap at the
  smallest honest grain: the review page exports a per-REL decision
  (`{from, type, to, decision}`), the verb reads that shape, and the file format is
  written down in the item. The binding-level curation state
  (docs/reviews/job-etl-binding-second-pass-options-2026-09-04.md section 6-4) is
  the later item that replaces it; LIN2 does not build it.

  (c) THE LOAD NAMES ITS EXTRACT, AND THE PROVENANCE IT WRITES IS WHAT THE EXTRACTOR
  READ. The run log and the written nodes carry the artifact's run id and code_commit,
  so a graph fact traces to the extract, the source files and the code that produced it
  (G107; the provenance-envelope shape). The LIN1 lane review's condition: the sources
  block the load stamps onto the graph is the artifact's sources block - which since the
  review names the file the extractor actually read, discovered or given - and a test
  proves a discovered variables CSV reaches the graph as present, not absent. Retention
  of lineage/staged/ (newest-only, or N) is decided and written down in this item.
  Two LIN1 follow-ups from the 93f4d832 verify pass (laptop) land here because they
  bite at load time: code_commit() reports HEAD on a DIRTY tree, so an artifact
  staged from uncommitted code claims a commit it was not built from - the header
  carries a dirty marker (`<sha>-dirty`, the `git describe` convention) and the load
  prints it; and LINEAGE_INPUT_ZONES in drydocs/cli.py names zone ids as string
  literals with nothing asserting they exist in config/data-zones.yaml or the source
  registry - a typo refuses every input, correctly closed and wrongly - so a unit
  test asserts every id resolves to a declared zone.

  (d) VENUE-TAGGED PROOF. On the desktop, `neo4jtest`, database `drydocs`: the bundled-
  sample artifact from LIN1 loads its ETLProcess / Script / DataAsset nodes and the four
  active edge labels; a second run is idempotent (MERGE, counts unchanged); the graph
  count matches the WritePlan. Recorded in the notes with the venue named (J18).

  (e) GUARDS. plan-only is proven with no database (the unit conftest's non-terminal
  console); the write path is proven behind the testcontainers e2e marker (J9), not in
  the unit suite; the writer's gate-bound refusal has a test that asserts the message.

  (f) NOT IN SCOPE. Activating a planned label (gate-bound). Reload / removed-from-source
  marking for lineage (a later item, on the D7 tombstone pattern).
notes: |
