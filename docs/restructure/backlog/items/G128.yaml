acceptance: |
  (a) THE DESIGN DECISION IS MADE AND WRITTEN DOWN BEFORE ANY RESOLVER MOVES, because taking it
  midway turns the migration into a bisect. Either the resolver-specific errors become subclasses
  of the new unset-variable error - callers and tests keep working, one exception hierarchy - or
  the callers move to the new type, a wider diff and a cleaner end state. Record which, and why.

  (b) THE FOUR NAMED RESOLVERS MOVE ONTO THE ONE EXPANSION FUNCTION. The data-root resolver still
  treats an empty string as unset and raises its own error type; the log-directory resolver still
  walks its variable, then the legacy alias, then a default; the credentials-path resolver still
  takes any non-empty override verbatim; and the mapping store still imports the os module inside
  its constructor to read one variable. The alias field on the declared-variable record already
  covers the legacy chain, so the log-directory case needs no new mechanism.

  (c) RULED BEHAVIOUR IS PRESERVED EXACTLY. An unset data root FAILS naming the variable (G81
  clause d) rather than silently relocating, and no bash-style default operator enters at any
  layer - the expander substitutes and refuses defaults, which is what keeps that ruling
  implementable in one place instead of seven.

  (d) THE GUARD THAT HOLDS THE LINE TODAY STAYS GREEN AND IS NOT WEAKENED TO FIT THE MIGRATION.
  The declared-variable guard reads the importable objects - the environment-name constants plus
  each settings class's prefix and fields - because no grep can see a variable name the prefix
  composes (J37). If the migration needs that test relaxed, stop and say why.

  (e) THE MIGRATION IS VERIFIED AGAINST THE TESTS THAT CATCH THE OLD TYPES BY NAME, since that is
  the actual risk G125 declined. Full suite green, ruff and format clean, and the close note lists
  every exception type whose identity changed.
notes: |
  BUILT 2026-08-30 (desktop, MSI). 17 guards in tests/unit/test_env_refs_migration.py.

  (a) THE DECISION, made and written down before anything moved: SUBCLASS. DataRootNotSetError now
  extends UnsetVariableError. The reason is not diff size -- it is that the specific type is
  LOAD-BEARING at two catch sites, drydocs/cli.py and drydocs/cli_ingest.py, which catch it to
  print the data root's OWN remediation. One flat type would have made an unset NEO4J_PASSWORD
  print advice about the data root: a regression wearing a refactor's clothes. Subclassing keeps
  `except UnsetVariableError` working as the family catch while the specific handler stays
  specific, and both directions are asserted.

  EXCEPTION TYPES WHOSE IDENTITY CHANGED (clause e asks for the list): exactly ONE.
  DataRootNotSetError changed BASE from RuntimeError to UnsetVariableError. No type was renamed,
  removed, or replaced at any call site, so every existing `except` clause still catches what it
  caught. That is the whole point of the (a) ruling.

  (b) WHAT MOVED: resolve_data_root, credentials_path, the log-kinds legacy-alias branch, and the
  three mapping-store call sites. A new non-raising accessor -- resolve_optional(name) ->
  (value, which_name_resolved) -- is what makes the migration possible for resolvers that
  legitimately have a default: expand() raises, which is right for a binding and wrong for a log
  directory called from inside open(). Two functions, ONE declaration list. Returning WHICH name
  answered is what lets the log resolver still emit its DeprecationWarning for the legacy alias.

  TWO CORRECTIONS TO THIS ITEM'S OWN TEXT, both recorded as tests rather than left in prose.
  (1) Clause (b) says MappingStore.__init__ imports os inside its constructor to read one
  variable. It does not, and did not: drydocs_core/mapping_store.py reads NO environment variable
  at all. The three reads live at component call sites (manual_loads, seal_contacts,
  drydocs_api/mappings), which is where the migration went -- and that is the better outcome,
  since core stays free of the lookup entirely. (2) The item inherited "seven resolvers" from
  G125's prose; the migrated set is five modules across core, api and loaders, plus one
  deliberately left alone (below).

  (d) I HIT THE CLAUSE AND OBEYED IT. The first attempt put the declared-list check inside
  log_kinds.resolve_env_override, and it broke
  test_resolve_honors_env_when_set_and_falls_back_when_empty_or_unset, which drives that mechanism
  with a synthetic probe (DRYDOCS_G111_PROBE). Clause (d) says stop and say why rather than relax
  the test. The test was RIGHT and the guard was in the wrong place: that function answers "is this
  NAME set", and a caller naming its own variable is legitimate. What must reference only declared
  variables is a COMMITTED DECLARATION, so the check moved to a test over config/log-kinds.yaml's
  root and every `env:` in config/data-zones.yaml. resolve_env_override keeps its own os.environ
  read, and a guard requires the rationale to stay in its source so the next person does not
  re-add the check and re-break the same test. NO test was weakened.

  A DRIFT RISK THE MIGRATION CREATED AND THEN CLOSED: the legacy alias is now declared TWICE --
  config/log-kinds.yaml's `legacy_env` and the EnvVar `aliases` tuple. A guard asserts the two
  agree, so it is one fact with a check rather than two places kept in step by hand.

  ONE TIGHTENING, named because it is a behavior change however small: credentials_path now treats
  a whitespace-only override as unset. That is what "set" means everywhere else (G111), and the
  disagreement was one of the four G125 catalogued.

  GUARD HYGIENE: the source-reading tests strip comments and string literals before matching,
  because every one of them names the thing it forbids in its own prose. A guard that fails on the
  explanation is a guard that teaches people to stop writing explanations.

  VERIFIED: full suite green (2810 passed), ruff + format clean, root import OK.

  Groomed 2026-08-30 (desktop, weekly groom) from Idea-223.

  This is the rest of G125 clause (c), which shipped the one function, the one error shape and the
  one enumerable list, and deliberately left the resolvers alone - a risk call, recorded in G125's
  own close note as a follow-up rather than discovered later. Depends on G125 for that reason.

  Module drydocs-core because every file it touches is core; sonnet because clause (a) is a
  bounded design choice with a written acceptance rather than a boundary decision.
