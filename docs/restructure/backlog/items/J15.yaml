acceptance: |
  A unit test in the classification/boundary family scans the publishable tree (everything outside internal/ and gitignored paths) for the shapes real identifiers take — bare 5-6 digit ids in taxonomy/sample/knowledge files, and the numeric segment of any string the folder-name parser decomposes — and FAILS when a value falls outside the reserved synthetic block (70001-70099), unless the specific file+value is allowlisted with a recorded reason. It must catch the historical miss: a SEALID embedded inside a Control-M folder-name string (PRARAG-HLDM-<id>-...) that no grep for the field name `seal_id` can see. Runs in the default suite with no live services; green on the tree as left by J14.
notes: |
  Lesson entry 2026-07-27: two sweeps (9d59f53 and the 2026-07-27 one) failed the same way — they searched for the FIELD, not the VALUE, so real ids survived for months inside folder-name strings. Same failure family as the "succeeds loudly, does nothing" session through-line, and the same conclusion as the identity gate's §F2 / the Unity Catalog takeaway: a convention violated twice needs an enforcement point or it rots. depends_on J14 because the test is red today on the two files J14 relocates — landing it first would just document the breach in CI.
