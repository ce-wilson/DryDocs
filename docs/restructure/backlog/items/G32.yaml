acceptance: |
  One ruling through the HITL gate, recorded as an amendment to ADR 0002 and ADR 0006 (amendment notes, not body rewrites — the ADR 0002 banner precedent), fixing: (a) how many document/content databases exist and what each holds; (b) the ddcontext charter, which today says "isolated uncertain / SYNTHESIZED" and cannot honestly describe a VERBATIM-captured email — if unconfirmed content lands there the charter restates to UNCONFIRMED (authority not established, whether captured verbatim or inferred) and drydocs_api/exports.py's WATERMARK_VALUE follows, since it stamps "SYNTHESIZED — unverified" keyed on database name; (c) the target_db column of every doc-source-registry entry; (d) an explicit, recorded acceptance of what a boundary COSTS — see notes; (e) MERGED 2026-07-27: the drydocs-deepdoc CHARTER, which has drifted between ADR 0002 (reactive command-line dependency analysis — what the scaffold implements) and ADR 0006 §1 (a consumer of docmeta's corpus, citing Document/Chunk nodes) — rule whether deepdoc is a parser-driven investigator, a corpus-driven retriever, or both, against the user's stated intent: profile a Confluence space, then search it SEEDED from what the grounded graph already knows, creating no relationship unless the subject is already in the DryDocs graph (the ADR 0002 D1 proxy-node pattern, so the mechanism exists). 01_databases.cypher and provisioning/README.md then match the ruling, and tests/unit/test_database_names.py's read-vs-write guard covers the new set.
notes: |
  Design session 2026-07-26 (after G30). SME direction: THREE databases — structured / unstructured-content / derived — for separation of loads and wipe blast-radius during testing, both of which hold independently of retention. Retention turned out NOT to be an argument either way (see Q10). THE COST, to be accepted explicitly rather than discovered later. `ddall` federates reads but a relationship can NEVER span databases — a composite query is a join on returned values, not an edge walk (see the shape in provisioning/smoke_drydocs_all.cypher: chained `CALL { USE ddall.x }` blocks). So known-shape questions still work, restated as explicit joins, and every QuerySpec is fine. What is lost across the boundary: shortestPath and variable-length paths, all GDS (centrality, community, similarity), and a single vector index over reference AND content chunks — which becomes two index queries plus a client-side rerank, notable because the Essential GraphRAG corpus was ingested to do exactly that kind of retrieval. Also harder: text2cypher (Epic R / ADR 0007) must generate correct USE clauses and business-key joins rather than a plain MATCH. If those matter, the mitigation is a single-database analytical projection, and that should be decided here rather than improvised later. Blocks G31 (the spine cannot be sized until the database set is known) and through it Q9/Q10/Q11. Clause (e) merged at the 2026-07-27 groom from the 2026-07-26 deepdoc-scope inbox entry (user question; NOT covered by the database ruling alone). Rider: the graph-seeded-retrieval shape is the SECOND application of the same idea (first: the 2026-07-23 HR-hierarchy graph-seeded resolution) — name it as a reusable pattern in the ruling instead of re-deriving it. Until (e) is ruled, do not build the deepdoc scaffold against either stale charter. CLOSE CHECKLIST — WORK THESE BEFORE FLIPPING THIS ITEM done. Added 2026-08-07 (laptop) on the user's ruling, because each one is a real consequence of this ruling that has NO item of its own and would otherwise be found only by re-reading prose. (1) Q16 CLAUSE (b) HAS NO SUCCESSOR ITEM. Q16 closed `done` on 2026-08-07 as an explicit PARTIAL: its clause (a) shipped (drydocs docs-coverage), but clause (b) — the product->documentation pointer reaching the GRAPH so an agent can traverse from a product to the docs describing it — did NOT, and is blocked behind Q14 (the term) which is blocked behind THIS item. Its only forward trace today is prose in Q16's close note pointing at Idea-88. So: when this signs, either mint the successor item or record in the sign-off that (b) is declined — do not leave it traceable only by prose. The ruling decides which: if doc corpora land in the registry's database, (b) becomes buildable and DESCRIBES may need nothing new (Q16's own "cheapest possible answer, check FIRST"); if the boundary hardens, (b) is re-scoped as a business-key join and its acceptance changes shape. (2) THE `not queried` LABELS GO STALE THE DAY THIS SIGNS. Two surfaces render "dddocs is not provisioned (G32)" from the declaration — web/src/software/softwareModel.ts (inGraphLabel) and the docs-coverage detail lines. tests/unit/test_load_map_json.py:: test_the_not_queryable_target_db_set_is_pinned pins that set to exactly {dddocs} and WILL FAIL when this ruling lands, which is deliberate: it is the alarm that forces both surfaces to be revisited rather than quietly lying. Treat that failure as a task, not a break. (3) THE ONE WORKING TRAVERSAL DIES OR SURVIVES BY THIS RULING. The 27 live (:Document)-[:DESCRIBES]->(:SoftwareProduct) edges exist ONLY because bmc-docs is loaded in `drydocs` while declaring target_db: dddocs — the residency accident this item exists to end. vendor_docs.cypher already refuses to write that edge for exactly this reason. Say explicitly in the ruling what happens to those 27 edges at the move; docs-coverage reports the state as `traversable-until-move` precisely so it is not mistaken for a durable capability.
