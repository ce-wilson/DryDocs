acceptance: |
  Eight live screenshots of a four-folder set for ONE source of record are captured Internal (values twin) and the MECHANISM they teach lands in the standard, which currently stops at the four ingestion job types and cannot describe what happens after TRUST. Required content: (a) the FAN-OUT flow itself as a mermaid diagram -- one refined dataset splitting into a strategic Snowflake path and two legacy decommissioning paths (Teradata, Oracle), with the stage numbering and the close/dummy jobs that join them; (b) the JOB-TYPE vocabulary extended past FW/PLCT/TRUST to the suffixes actually deployed, each with its role; (c) the grammar correction the set forces -- TARGET PLATFORM and CHANNEL are two axes, not one, proved by a job carrying both, so the 5.4 slot list is wrong as written; (d) LEGACY_NAME registered as a description token, since every job in the set carries its decommissioned predecessor's name in prose and that is the decom crosswalk with no other home; (e) the environment indirection -- a variable whose NAME is composed from another variable, so the resolver cannot resolve it statically -- written up as a supported pattern with its rule, not filed as a defect; (f) the quantitative-resource pools recorded as an INDEPENDENT platform signal, since they name the target platform without parsing a job name. Every defect the set shows is listed with its rule id where one exists and marked NEW where none does. Mechanism-only in knowledge/: synthetic SOR, entity, schema and job names on the C31 conventions; real values stay in the Internal twin. Publish-boundary check clean.
notes: |
  Claimed 2026-08-11 (desktop) on SME direction: "this is an example of data landing and splitting into AWS Snowflake, Teradata (legacy decom path), and Oracle (legacy decom path)". WHY THIS IS NOT MORE OF C30: C30 and C31 modeled the INGESTION half -- watcher, placement, trust -- from a folder that ends where the data lands. This set is what happens next, and it is a different shape: one refined dataset FANS OUT to three targets on two different lifecycles, with the strategic path and the decom paths running side by side in the same estate. A standard that only describes ingestion cannot express "this load is on the way out", which is exactly the fact a support decision needs. ALSO CARRIES A CORRECTION I OWE (do not quietly drop it): C30's rationale for the DOMAIL ruling said the mail destination is "declared nowhere" and deletion therefore costs nothing. TRUE of the DPL-generated folders; FALSE here -- this hand-built Ab Initio folder declares NOTIFY, EMAIL_GRP and EMAIL_GRP_S, all three to one address, and the block would really send. The SME ruling stands unchanged; its REASON has to change from "costless" to "deliberate", and the standard must say so rather than carry an argument the next folder disproves. DONE 2026-08-11 (desktop). Capture at internal/controlm-config/reference/controlm-refined-fanout-capture.md (four folders, five jobs, verbatim commands, folder variables, dependencies, resource pools, authorship). Mechanism landed as guidelines section 6.3 with a mermaid fan-out diagram plus 6.3.1 lifecycle, 6.3.2 resource pools as a second platform signal, 6.3.3 the datacenter-prefix environment indirection; 5.4 grammar corrected to separate PLATFORM from CHANNEL; 7.4 registers LEGACY_NAME; the section 8 rationale and both twins corrected per D1. Twelve defects listed, three of them NEW classes with no rule yet (duplicate declaration in one scope, folder-name delimiter drift, %%VAR-vs-${VAR} carrier collision) plus stale authored provenance -- all inboxed rather than detector-built here, since G67's pass is closed and a rule needs the registry entry first. Two open items added: the LIFECYCLE token (nothing carries "this load is being decommissioned", which is the fact a support decision needs most) and whether a job number identifies the stage or the job when a fan-out puts two targets at 0080. Suite 1881 passed / 5 skipped; publish-boundary check clean (synthetic SOR/entity/legacy prefix in knowledge/, real values Internal).
