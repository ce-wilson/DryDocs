acceptance: |
  Four numbers drift with nothing under them (T1, T2, T7, T8): statement coverage is 7.51
  percent (955 / 12,716) with `@vitest/coverage-v8` declared and no script, CI step or
  threshold; lint emits ten warnings and exits 0 with no `--max-warnings`; the advisory count
  went from three at O34 to five with no audit step to notice; and a dead file and a dead
  dependency sit unflagged. Plus three `eslint-disable-next-line react-hooks/exhaustive-deps`
  lines suppress a rule that has never run - there is no ESLint in the project and
  `.oxlintrc.json` enables only `react/rules-of-hooks` and `react/only-export-components`.

  (a) `test:coverage` script in package.json; the web CI job runs it with a statement floor
      at today's number (7.51, recorded with the date) that only ratchets up. Coverage growth
      itself is O43's work (the seed suites); this item is the gate, not the tests.
  (b) `--max-warnings 0` on the lint step; the ten warnings are fixed or individually waived
      in config with a reason.
  (c) `react-hooks/exhaustive-deps` enabled in oxlint (or the equivalent rule the linter
      offers); the three inert suppressions are deleted and each site's deliberate omission is
      re-expressed as a real, scoped suppression or a fix - never carried as fiction.
  (d) A warn-only `npm audit --audit-level=high` step in the web CI job (report, never block -
      the same posture as the snapshot ritual's lint check), so the count is read every run.
  (e) `src/components/TowerIcon.tsx` and the `clsx` dependency are removed. Optional residue,
      not acceptance: fold src/docs/ and src/docsmod/ into one directory; move
      src/data/mappingsDemo.ts and routes/AppCodeCascadePane.tsx to their feature directories.
notes: |
  Minted 2026-09-05 by the secondary review of the slot 9 web report (docs/reviews/module-review-sweep-plan-review-2026-09-05.md, part B), from the three-pass lens review of web/ run the same day (report: docs/reviews/modules/web-2026-09-05.md). Every count below was re-measured on main at bcae4d02 before this item was written.

  Covers T1, T2, T7, T8 - the tech-debt pass's "cheap ratchet". A7 (test topology inverted) is
  T1 with a measurement attached and is not a separate item; O43 (todo) seeds the suites that
  move the floor. O34 (done) recorded the advisory count as three; it is five now, root
  `@neo4j-nvl/base -> @segment/analytics-next`, none of it reaching dist - the finding is the
  unobserved drift, not the CVEs.

  DONE 2026-09-05 (Lane B, laptop). Four numbers now have something under them.

  A CORRECTION TO THE REVIEW, AND IT CHANGED THE WORK. The report says the three
  `eslint-disable-next-line react-hooks/exhaustive-deps` lines "suppress a rule
  that has never run" and that "the mechanism behind them is fiction", and clause
  (c) follows from that: delete them and re-express each site. THEY ARE NOT
  INERT. oxlint honours eslint-style disable comments, so the moment the rule is
  enabled those three comments work exactly as written — deleting them would have
  turned three deliberate, well-commented dependency omissions into three red
  builds.

  Verified rather than assumed (J76): with `react-hooks/exhaustive-deps: error`
  set and the comment REMOVED, useRouteA11y.ts fails with
  `React Hook useEffect has a missing dependency: 'contentRef.current'`; with the
  comment restored, it passes. So the mechanism was real; only the NAME was
  fiction, because it named a linter this project does not have.

  What landed instead is what clause (c) actually asks for once that is known: the
  rule is enabled, and all three are renamed to `oxlint-disable-next-line`, which
  names the linter that reads them. Each site keeps the comment that explains its
  omission, which was sound all along — the report says so too.

  Also worth carrying: oxlint reports react-hooks/exhaustive-deps BY DEFAULT even
  though .oxlintrc.json never enabled it. It is set to "error" explicitly now
  rather than left implicit, because a rule the config does not mention is a rule
  the next config edit can silently drop.

  (a) `test:coverage` with a statement floor, and the floor is 9.8, NOT the
  report's 7.51. Re-measured at pull: 9.89 (the WEB3/WEB12/WEB1 guards and hook
  tests moved it from 7.51). Setting a ratchet to a stale number would install a
  floor already 2.4 points below the tree, which is a ratchet that ratchets
  nothing. Branch and function floors ride along at 70/50, comfortably under the
  73.3/52.7 measured, because they were the two numbers most likely to slide
  while statements climbed.

  The floor is 9.8 and not 9.89 on purpose: a floor pinned exactly to the measured
  value fails on any refactor that adds one uncovered line, and a floor that fails
  for reasons nobody caused is a floor people lower. Raise it when the measured
  number clears the next half point.

  PROVEN TO GATE, not assumed: `npm run test:coverage` exits 0 today, and the same
  command with the threshold at 99 exits 1. A threshold that was silently ignored
  would have looked identical from the outside, which is exactly how the meter got
  bought and never read in the first place.

  (b) `--max-warnings 0`, and it lives in the npm SCRIPT rather than the CI step,
  so a local `npm run lint` and a CI run gate identically. The ten warnings were
  all `react/only-export-components`, a fast-refresh advisory, across five files
  that co-locate a constant or a hook with a component deliberately
  (tableControls, TrustLegend, RelEdge, HubGlyphs, rightSidebarContext). They are
  WAIVED per file in .oxlintrc.json `overrides`, which is the clause's own second
  option, rather than split into ten files: splitting five deliberate
  co-locations to satisfy an HMR advisory is churn, and the value being bought
  here is that a NEW warning is red. Count is zero and `--max-warnings 0` passes.

  The waiver's reasons live here rather than beside it because .oxlintrc.json is
  JSON and cannot hold a comment. That is a small, real gap — a waiver whose
  reason is one commit message away from invisible.

  (d) `npm audit --audit-level=high` as its own npm script and a CI step that
  reports and never blocks (`|| echo ::warning::`), the same posture the snapshot
  ritual takes with its lint check. The finding is not the CVEs — five high, one
  root (@neo4j-nvl/base -> @segment/analytics-next), none of it reaching dist —
  it is that the count was recorded as three at O34, is five now, and nothing
  noticed because nothing looked.

  (e) TowerIcon.tsx deleted (19 lines, zero importers) and `clsx` removed from
  dependencies (declared, imported nowhere). The ui-components ledger loses its
  row and the pin moves 92 -> 91. Worth naming: noUnusedLocals catches an unused
  local and cannot see an unused MODULE, which is why a dead component shows up in
  a hand-maintained ledger and nowhere else.

  NOT DONE, and it is listed as optional residue rather than acceptance: folding
  src/docs/ and src/docsmod/, and moving mappingsDemo.ts and AppCodeCascadePane.tsx
  to their feature directories. Both are pure moves whose diffs would bury this
  item's five real changes, and AppCodeCascadePane in particular was just rewired
  by WEB1 — moving it in the same burst makes that change unreviewable.

  Gates at close: poetry run pytest -q = 3360 passed, 12 skipped, 1 failed
  (test_plan_roadmap - the expected Lane B close failure). ruff clean. In web/:
  tsc -b exit 0, oxlint --max-warnings 0 exit 0 with ZERO warnings (was ten),
  npm run test:coverage exit 0 at 9.9% statements, vitest 225 tests.
