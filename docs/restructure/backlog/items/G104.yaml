acceptance: |
  A new `docs/decisions/0014-runtime-substrate.md` exists with status **Proposed** — never Accepted, because acceptance is the user's and is recorded in `docs/decisions/README.md` only after they rule. 0014 is the next free number as of this groom. The ADR decides, or explicitly defers with a named trigger, each of the seven clauses Idea-152 raised: (1) one `RuntimeSettings` group on the `DRYDOCS_` prefix (pydantic-settings, the shape `drydocs_core/config.py` already uses) carrying `log_dir`, `log_level`, `log_retention_days`, `data_root` — `.env`-readable, env-overridable, defaults unchanged, with `SPIDERP_*` kept one cycle as deprecated aliases and then dropped from BOTH log families; (2) stdlib `logging.config.dictConfig` driven from that group with NO new runtime dependency — console plus a JSON-lines file sink in `log_dir`, level from settings, `--verbose` still winning, and `run_log.py`'s existing header/summary contract untouched; (3) ONE naming rule for the shared directory, `<kind>.<name>.<YYYYmmdd-HHMMSS>.{log|jsonl}`, with the per-DAY `qa.graph_qa.<YYYYmmdd>.jsonl` ledger either moved onto it or its exception written down; (4) retention as a `drydocs prune-logs` verb mirroring `prune-snapshots` (age + size, dry-run default) rather than a background sweeper thread; (5) every component opening a `LoaderRunLog` per batch; (6) an API request/audit line for every Cypher-executing route, actor hashed the way `:AgentRun` already hashes it; (7) a single declaration of the data-zone map. THE HARD REQUIREMENT: the ADR states in its own text how it reconciles with **ADR 0009 (configuration substrate)**, which already makes git-tracked YAML the settings source of truth — an env-var-and-`.env` settings group is either an exception ADR 0009 permits (say where) or an amendment to it (say so, and say what in 0009 changes). It also records the sister project's own gotcha list as REJECTED alternatives, since Idea-152 captured it as an anti-checklist: level hardcoded with no env override; a Linux-absolute default that breaks on Windows; silent fallback to the local profile on a misconfigured box; one process-start timestamp shared by every file; and an unbounded sweeper registry when the logger factory is called with per-incident names. THE SECOND REQUIREMENT, added 2026-08-28: clause (7)'s data-zone map is decided WITH the catalog-product survey in `docs/design/catalog-substrate-review.md`, not from the application-scaffold corpus alone, and the ADR records three things from it. FIRST, the three-part-key ceiling. DryDocs derives `urn:drydocs:dataset:(carrier,artifact,prod)` — platform, name, environment. DataHub's dataset URN was the same three parts and their own documentation states why it failed: it cannot represent two deployments of one platform inside one environment, so an organization with two instances in production collapses both into one identifier. The fix was a `dataPlatformInstance` aspect and a `platform_instance` recipe parameter, which changes URN generation across every source — a retrofit over everything already ingested. Our committed ids spell that instance coordinate as the `[db]` redaction placeholder, four production Control-M data centers sit behind it, and the two machines hold independent graphs. The ADR RECORDS the ceiling and names the binding table as where an instance coordinate lands when something needs it; it does NOT mint the axis, because adding an id segment before anything needs it buys an id migration with no current benefit. SECOND, the binding is PER ORIGIN and it references environment variables rather than reading them — the shapes G81 clauses (f) and (g) implement, stated here as the decision they implement. THIRD, the console's fresh-clone default is recorded as a DECISION rather than left as behaviour: a clone has no credential file, therefore no accounts, therefore every login is refused and the refusal names the bootstrap script. DataHub ships a working `datahub:datahub` in `user.props` and spends a documentation page warning that deleting the user in the UI does not disable it. Ours is the stronger property and it is the kind a later convenience commit removes without noticing, which is the argument for writing it down. The REJECTED-alternatives requirement extends to this survey the same way it already covers the sister project's gotcha list: OpenMetadata's secrets-manager plugin interface (an abstraction over one implementation, on a one-machine one-operator repo), its derived per-source secret path (restates one Oracle account eight times across the psgmgr views — Purview's named-credential-object shape is taken instead), Amundsen's pyhocon dependency (clause (1) already names pydantic-settings), Marquez's lineage service (no runtime event feed exists here; the naming specification is taken as a grammar and the server is not), and DataHub's `__DATAHUB_TO_FILE_` directive (it writes a credential file from configuration, and the rule keeping writes out of `drydocs_api` says that path stays pointed the other way). Named as OUT of scope: persisting executed Cypher server-side for ask-search — a separate idea whose owning surface is undecided. `docs/decisions/README.md` gains the 0014 row reading Proposed. No code changes in this item.
notes: |
  Groomed 2026-08-21 (laptop) from Idea-152 (prio High, user-confirmed), which carries the 2026-08-20 survey and asked in writing to be groomed into "the ADR; a core item (1-3); a load item (4); per-component items (5); an api item (6); a config item (7)". G104 is the ADR; G105-G109 are those five, each `depends_on` this item so nothing implements an unratified decision.

  EPIC AND PHASE CHOICE, recorded because it was a judgement call rather than an obvious fit: no runtime-substrate epic exists and a groom cannot mint one, so the chain is filed under component-topology / phase 6 — the epic that already owns cross-component structural rulings (ADR 0002's core-vs-component split) and that already holds an ADR-drafting item as precedent (G53, the ADR 0011 shelf plan). A dedicated epic is PROPOSED TO THE USER in the groom report; if they take it these six items change `epic:`, not their ids. Module `docs` follows Y1 and R1 — a decision document is docs work even when its subject is core. Model fable because the ADR decides a boundary (where settings may live at all) against a standing ADR.

  Status stays Proposed on purpose: this item drafts the decision, it does not make it.

  AMENDED 2026-08-28 (desktop) from `docs/design/catalog-substrate-review.md` findings B2, B3, B4 and L1. The amendment is deliberately a REQUIREMENT ON THE ADR rather than new acceptance clauses of its own: this item drafts a decision, so what a survey can change is what the decision must address, never what it concludes. The user still rules. Sequencing note for whoever pulls it — B2 is the clause worth reading the source on before writing, because DataHub's retrofit is the only public account of what this exact key shape costs when it runs out, and the cost lands on data already loaded rather than on the code.
