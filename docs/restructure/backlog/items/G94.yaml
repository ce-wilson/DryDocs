id: G94
epic: component-topology
title: Which standard does a job validate against? A selection resolver on job type, job role and ETL
  engine — and an executable proof that the DD version digit never selects one
type: task
module: drydocs-core
phase: 6
agent: main
model: sonnet
priority: p2
status: in_progress
depends_on:
- G84
inputs:
- drydocs_core/orchestration/controlm/description_tokens.py
- drydocs_core/orchestration/shell.py
- config/launcher-registry.yaml
- knowledge/standards/technology/controlm-guidelines-and-standards.md
- tests/unit/test_description_tokens.py
acceptance: |
  Today the token set is selected by ONE dimension: required_tokens(JobType) over FILE_WATCHER / PUBLISHER / BOTH. User direction 2026-08-12 rules the real selection a DECISION TREE -- a FileWatcher validates against the FileWatcher standard; a COMMAND job selects on its ETL ENGINE FIRST (DPL, Ab Initio, Informatica -- names the launcher registry already classifies as invocation_type DPL / ABINITIO / INFORMATICA) and falls back to a GENERIC standard carrying only the shared tokens (the DevX project key, the EMAIL_DL contacts) when no engine is identified. (a) ONE FUNCTION, ONE ANSWER: a selector takes the derived TASKTYPE, the registered JOB_ROLE token and the launcher classification, and returns a STANDARD IDENTITY plus the token set that identity requires. Selection is separated from validation -- validate() keeps taking what it is given, so the tree can be re-ruled without touching the parser. (b) THE GUARDRAIL BECOMES A TEST, which is the point of the item: guidelines section 7.5 and G84 clause (c) rule the DD digit a grammar VERSION that MUST NOT select a template or a standard. A test asserts that the SAME job under "DD1|" and under a hypothetical "DD2|" selects the SAME standard, so the next person who reaches for the version slot as a selector reds a guard instead of shipping it. (c) THE ENGINE BRANCH IS DECLARED, NOT INVENTED. Per-engine standards get their identity and their branch; the CONTENT of each engine's token set is NOT ruled here -- an engine with no ruled set inherits the generic set and REPORTS that it did, so an unruled engine is visible rather than silently generic. Inventing per-engine required tokens in this item is out of scope and fails it. (d) THE GENERIC SET IS DERIVED, NOT RETYPED: it is the shared subset already carried in the registry (JobType.BOTH plus the FOLDER_VARIABLES entries), so it cannot drift from TOKEN_REGISTRY. (e) UNSELECTABLE IS AN ANSWER. A job whose engine cannot be classified and whose job role is absent returns the generic standard WITH a reason, and coverage counts the reasons -- the adoption-not-compliance measure G84 established. Zero graph writes; every token stays proposed; no relationship-vocabulary entry and no property term is touched. Storage of the selected standard is explicitly NOT here -- see G95.
notes: |
  Groomed 2026-08-12 (targeted groom) from Idea-114, clause 1 (the decision tree). Verified at the groom: config/launcher-registry.yaml already emits DPL / ABINITIO / INFORMATICA invocation types through classify_executable(), so the engine dimension needs no new classifier; JOB_ROLES is already the C30 discriminator set (PUBLISHER / PLACEMENT / TRUST_INGEST); and required_tokens() is currently keyed on JobType alone, which is the gap. depends_on G84 because the selector must read the population and the version the sentinel parse produces, and G84 is where both were built. WHY THIS HALF IS BUILDABLE AND THE OTHER HALF IS NOT: choosing WHICH standard applies is derivable from data the repo already has. Choosing WHERE a standard lives, what its id is, and whether a team may hold its own profile is a contract change to the parse contract -- that is G95, and it goes to the gate first.
