acceptance: |
  Either: one QuerySpec answers a real support question by reading `ddall` across at least two member databases (chained `CALL { USE ddall.x }` value-join per the smoke-file shape), carries the trust_watermark column end to end, and is covered by a test — OR, if G32's ruling makes the composite unnecessary, that is recorded and the consumer-less machinery (WATERMARKED_DATABASES, the export banner path for ddall) is retired. Either outcome closes the item; leaving the machinery built-but-unread does not.
notes: |
  Measured at the G30 close: 22 of 23 QuerySpecs read drydocs, 1 reads ddcontext, ZERO read the composite — the federated watermark machinery is fully built and tested against a surface no spec uses. Same shape as the G30 finding (infrastructure with no consumer), and it gets more expensive to leave alone if G32 adds a third data database. Written AFTER G32 so it targets the ruled database set; it is also the honest end-to-end test of G32's acceptance clause (d), the recorded cost of the database boundary.
