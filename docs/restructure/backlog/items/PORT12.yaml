id: PORT12
epic: release-infrastructure
title: "A commit split across two dispositions ports as a broken half - a canonical-producer caller crosses on its own while the core method it needs waits on a hand-merge, and nothing declares that the two must travel together"
type: task
module: drydocs-port
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- PORT-MANIFEST.yaml
- drydocs/port/port_completeness.py
- drydocs/port/dispositions.py
- tests/unit/test_port_reconcile_guards.py
acceptance: |
  (a) A producer-side check over a roll range reports every SPLIT PAIR: a name that the range
  ADDS to a file the consumer must hand-merge, and that the same range also adds a reference to
  from a file that crosses on its own. The two classes come from the ONE classifier in
  `drydocs/port/dispositions.py`, never a second reading of the manifest: `canonical-producer`
  and `clean-add` cross unattended; `evaluate` (including every path that falls to the default
  through `default_ok`), `per-entry` and `canonical-company` need a hand. `derived` is neither -
  it is regenerated - and `never-port` is excluded, as it already is in the completeness check.
  (b) THE PRECISION IS THE POINT AND IT IS WHAT MAKES THIS BUILDABLE. A check that reported
  every commit touching both `drydocs/**` and `drydocs_core/**` would report most commits in the
  repo and be switched off within a week. The pair is: a symbol DEFINED at module or class scope
  in a hand-merge file inside the range, AND newly REFERENCED from an unattended file inside the
  same range. Both halves are read as code (AST), never as raw substrings over the diff (J66).
  [AMENDED 2026-09-10; was "a new `def` or `class` at module or class scope"] A MODULE-LEVEL
  CONSTANT IS A DEFINITION TOO, and excluding it would have missed the worst instance the sweep
  found. `drydocs/cli_docs.py` imports three constants from `drydocs/docs_coverage.py` at MODULE
  SCOPE, so a hand-merge that dropped them does not fail a verb the way G130 did - it raises
  ImportError while `drydocs/cli.py` is still importing, and every command dies, `drydocs --help`
  included. A def-and-class-only reading would have reported the milder half of the class and
  stayed silent on the severe half. Scope is what matters, not the statement keyword: a local
  inside a function body is reachable from nowhere and is not a definition for this purpose.
  ALSO WHAT MAKES IT PRECISE, learned by measuring rather than by design - the first pass
  reported 404 pairs. A name defined in two modules cannot be attributed to either, so it is
  counted `ambiguous` rather than asserted. A name the using file defines itself resolves
  locally. The test tree is not a definition side, because no production module imports from it.
  And the manifest DEFAULT has TWO ARMS - clean-add when the consumer lacks the file, evaluate
  when both sides have it - so a file the range CREATED arrives whole with its definitions in it
  and is not a split, while only a pre-existing file can take the evaluate arm. That last one is
  the difference between 133 findings and a list somebody will read.
  (c) It REPORTS, never gates. A split commit is legitimate - the dispositions are right and
  `drydocs_core/**` is evaluate-on-collision for a reason the manifest states - so what the
  split owes is a RELAY LINE naming the pair, not a refusal. Three outcomes and no silence
  (ADR 0021): pairs found, checked-clean over a named range, or NOT CHECKED with its reason (an
  unresolvable base is the case `port_preflight` already had).
  (d) THE POSITIVE CONTROL IS G130 AND THE ITEM IS NOT DONE WITHOUT IT. Run over the range that
  carried `01761011`, the check must name `constraints_detail` - defined in
  `drydocs_core/neo4j_client.py` (evaluate) and called from `drydocs/cli_schema.py`
  (canonical-producer) in that one commit. A guard for a defect shape that cannot find the
  instance the shape was drawn from has not been shown to work.
  (e) The roll close runs it and the PORT-REPORT carries its verdict line, on the shape
  `port_completeness_check.py` already uses; the `reconcile-port` skill's close step names it.
  NOT in scope, and each refused for a stated reason. Re-dispositioning
  `drydocs_core/neo4j_client.py` to canonical-producer: that is a ruling about a file both sides
  authored, it needs to know how the company's copy diverges, and it belongs to the port
  boundary rather than inside a guard item - if the answer is yes it is its own row with its own
  reason. Making the check a gate. Extending it to non-Python surfaces. And repairing the
  company's tree, which is theirs and is carried by relay.
notes: |
  Minted 2026-09-10 (Lane A, desktop; pen backlog) from a company-reported bootstrap failure,
  producer-side verified by command the same day.
  WHAT WAS REPORTED: `drydocs bootstrap` on the company instance raised
  `AttributeError: 'Neo4jClient' object has no attribute 'constraints_detail'` at
  `drydocs/cli_schema.py:346`. Their declared constraints were all present - the D8 guard's
  missing list was empty - so this is not a schema defect and no constraint is wrong on either
  side. The crash is in the INVERSE check G130 added, one line later.
  WHAT IS TRUE HERE, by command rather than by inference: `01761011` (G130, 2026-08-30) added
  all three halves of that call chain in ONE commit - `constraints_detail` on the client,
  `undeclared_constraints` in `drydocs_core/schema/constraints.py`, and the caller in
  `drydocs/cli_schema.py`. Producer-side 55 constraints are declared, `config/dev-environment.yaml`
  pins 55, and the constraint guards are green.
  THE MECHANISM, and it is a disposition split rather than a mistake by anyone. Their traceback
  shows the import on the line above SUCCEEDING and the caller running, so their tree holds both
  canonical-producer files and took them wholesale, exactly as the manifest says to. The fourth
  file, `drydocs_core/neo4j_client.py`, resolves through `default_ok` to the DEFAULT, which is
  evaluate-on-collision because both sides authored it - so it waits on a hand-merge, and the
  sixteen-line method did not make it. Three quarters of one commit crossed unattended and the
  quarter the other three need did not.
  WHY THIS IS A CLASS AND NOT AN INCIDENT: the same shape is available to every commit whose
  caller lives under a canonical-producer path and whose callee lives in core. G130 has been in
  every roll since `port-base-20260901`, so the break sat latent for ten days and surfaced only
  when someone ran `bootstrap` against a reachable database - there is no earlier signal,
  because an unreferenced missing method raises nothing until it is called.
  RELATED AND DELIBERATELY SEPARATE: the immediate unblock is one method on their client and
  travels as a relay line, which does not wait on this build. PORT6's completeness check answers
  a different question - whether a PATH ever arrived - and would never have seen this, because
  every path involved is present on both sides. This is about what is INSIDE two files that
  arrived by different routes.
  BUILT AND SWEPT 2026-09-10 (Lane A, desktop; pens backlog, port, adr, gates).
  `drydocs/port/split_pairs.py` with `scripts/port_split_pair_check.py` as its entry point;
  the roll close runs it and the port-prompt's opening sequence carries it as a step that
  REPORTS rather than one of the seven that refuse.
  THE INSTRUMENT TOOK FOUR PASSES AND EACH CORRECTION IS IN THE MODULE, because the next
  person measuring this needs the corrections more than the result. Pass one used `ast.walk`
  for definitions, which descends into function bodies, so three locals in one test file
  reached the report; definitions are module and class scope only. Pass one also counted the
  test tree as a definition side, and a fake client in a test defines `constraints_detail` too,
  which duplicated a true finding. Pass two returned 404 pairs, nearly all of them one name
  meaning two things - `row.description` matching a `description` field defined elsewhere - so
  a name defined in more than one module is now counted `ambiguous` rather than attributed, and
  a name the using file defines itself resolves locally. Pass three was still 133, and the
  lever that mattered was the manifest DEFAULT's two arms: a file the range CREATED reaches a
  consumer that lacks it as a clean-add and carries its definitions with it, while only a
  pre-existing file can take the evaluate arm. That is the difference between a number and a
  list somebody reads.
  THE POSITIVE CONTROL IS PINNED FIRST IN THE TEST FILE, not last, because a detector for a
  defect shape that cannot find the instance the shape was drawn from has not been shown to
  work. It finds G130's `constraints_detail` and nothing else in that commit.
  THE SWEEP, over all seventeen roll ranges: 82 candidate pairs triaged one defining file at a
  time and each claimed break adversarially refuted. 61 were killed - most because the
  definition and its use travelled in the same commit, or the definition predated the range and
  had long since crossed, or both files were hand-merge and travel together. 21 survived.
  THE HEADLINE IS THAT THREE OF THEM HAVE NOT SHIPPED YET. `drydocs/cli_docs.py` is
  canonical-producer and gains a MODULE-SCOPE import of three constants defined in
  `drydocs/docs_coverage.py`, which the consumer hand-merges. That is worse in KIND than G130,
  not merely in degree: G130 raised AttributeError when one verb ran, and this raises
  ImportError while `drydocs/cli.py` is still importing, so every command dies including
  `drydocs --help`. It is in `port-base-20260909..HEAD`, so the ninth roll's relay prevents it
  rather than reporting it after the fact - which is the whole point of the item.
  Acceptance (b) was AMENDED the same day on that finding: it had said a definition was "a new
  `def` or `class`", and a def-and-class-only reading would have reported the milder half of
  the class and stayed silent on the severe half. A module-level constant is a definition.
  RELAY-56 carried the immediate `constraints_detail` fix; RELAY-57 carries the swept list,
  ranked, with the producer's own caveat stated in it: the producer cannot read the consumer's
  tree, so every line is "this pair exists in the range" and never "this is broken on your
  instance".
  WHAT REMAINS OPEN, and it is the item's own fence rather than an omission: every single
  finding defines through `default_ok` or an explicit hand-merge row, which means the root
  cause is that most of `drydocs/**` and `drydocs_core/**` have no manifest row and inherit a
  default whose two arms depend on a tree the producer cannot see. Whether those files should
  be re-dispositioned is a ruling about files both sides authored, needs to know how the
  company's copies diverge, and belongs to the port boundary - PORT13.
