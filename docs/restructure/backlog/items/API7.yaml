id: API7
epic: web-console
title: "The intake write handlers commit before the only ownership check, so a cross-persona mutation lands and the 403 the caller receives is cosmetic - move the check to before the write, not to the return value"
type: task
module: drydocs-api
phase: 12
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- drydocs_api/intake.py
- tests/unit/test_intake_api.py
acceptance: |
  (a) `transition`, `thread_decision` and `add_evidence` authorize the RECORD before they write
  it. The per-record ownership test that today lives only in `get_intake` moves into a shared
  helper called immediately after the record is loaded and BEFORE any mutation or commit - not as
  the handler's return value, which is where it sits now and is why the write survives the
  refusal. `get_intake` keeps its own check for the read path.
  (b) A test per handler that PROVES THE ORDERING rather than the message: a user-tier persona
  acts on another persona's intake, and the assertion is that the record's status, its event log
  and its evidence directory are UNCHANGED after the refusal. Asserting only that Forbidden was
  raised passes today, against the bug.
  (c) The thread-id leak is closed or ruled: `_check_thread` writes matched prior intake ids into
  `thread_of_json` and `_serialize` publishes them as `thread_of`, so a user-tier persona can
  learn another persona's intake id without the queue. Either the field is filtered for a
  user-tier reader, or the exposure is ruled acceptable IN THE FILE with its reason.
  (d) `TRANSITIONS` is re-read once with (a) in place: it grants every non-admin edge to
  `_ANY = ("user","steward","admin")`, which is correct only if ownership is enforced elsewhere.
  With ownership enforced before the write, that grant is sound and the file says so.
notes: |
  Minted 2026-09-10 (Lane A, desktop; pen backlog) from the console-auth-boundary gate, whose
  section B names this defect as the fifth bullet of what the console does today (SME ruling, same
  sitting). A gate that names a defect and mints nothing is how a finding becomes folklore.
  MEASURED, twice. Raised by the 2026-09-09 ultra review (67 agents, 10 dimensions), CONFIRMED by
  an adversarial verifier that drove it rather than reading it - persona `mouse` moved persona
  `neo`'s intake from draft to ontology-reviewed, received Forbidden, and the status had changed
  anyway; the event log carried both actions. Re-verified at HEAD on 2026-09-10 while ruling the
  gate: five `store.conn.commit()` sites, the sole `created_by != session.persona_id` test at
  intake.py:636 inside `get_intake`, and the write handlers calling it as their return value.
  WHY p1 AND WHY IT DID NOT BLOCK THE GATE. The SME ruled it named in section B rather than made a
  precondition of P4, which is right: the blast radius today is a fixed roster of six fictional
  personas whose secrets are machine-local. What makes it p1 rather than p2 is the direction of
  travel - P4 is deferred with onboarding to the identity federation as its trigger, and on the
  day real directory principals sign in, this same ordering is a live cross-user write. Fix it
  while it is cheap and while the only victims are test personas.
  Not a duplicate of API5 (a graph outage answering 500 rather than 503) or API6 (no query
  timeout); this is authorization ordering and shares no code path with either.

  CLOSED 2026-09-10 (Lane B, laptop, wip/api7-laptop). Venue (J18): offline unit suite only - this
  module is framework-free and touches no Neo4j, so the result reproduces from a clean clone on
  either machine. At the WORK commit, before this note existed: 4019 passed / 16 skipped / 0 failed
  against a 4012-passed/0-failed baseline on main, both ruff gates green. At the CLOSE commit:
  4017 passed / 1 failed, and the one failure is
  `test_plan_roadmap.py::test_committed_roadmap_page_matches_its_sources` - the red the handoff
  pre-authorizes for every Lane B close. Verified rather than assumed to be that: stashing THIS
  note alone turns the guard green again, because `sources_fingerprint` normalizes only `status`
  out, so a close that writes notes always moves it. Lane A's render at merge is the fix; Lane B
  does not render.

  (a) `_authorize_record` is the one ownership test, called immediately after the record loads and
  before any mutation in `transition`, `thread_decision` and `add_evidence`; `get_intake` keeps its
  own call for the read path. It also runs BEFORE the state machine and the upload-window test, so
  a refusal stops telling a stranger what status the record is in - that was an unlisted second
  leak, and `test_the_upload_window_no_longer_answers_a_stranger` pins it.

  (b) THE TESTS WERE MEASURED BOTH WAYS, which is the only reason they are worth anything. Against
  HEAD's unfixed intake.py the five defect tests FAIL and the two controls pass; with the fix all
  seven pass. `_snapshot` is the mechanism: it captures the record row, the event log, the evidence
  rows and the evidence DIRECTORY before and after a refused write, so the subject is the store
  rather than the exception. The acceptance was right that `pytest.raises(Forbidden)` alone passes
  against the bug - it does, and that is how this survived two reviews.

  (c) RULED: FILTERED, not accepted-with-a-reason. The deciding fact was found by reading the
  console rather than the API - `IntakeRoute.tsx` `refreshPriors` already GETs each `thread_of` id
  and swallows the 403 as `decision: null`, so a user-tier reader could never resolve a stranger's
  id. The ids were leakable and never usable, which makes filtering strictly better than a ruling.
  `_filter_thread_of` narrows the list to the reader's own intakes on both the get and the list
  path; `thread_flagged` and `thread_decision_required` are untouched, so the reader still learns
  their evidence continues a known thread, just not whose, and a persona bouncing their OWN thread
  a third time still sees both prior decisions - that is the case the feature exists for and it is
  pinned by its own test.

  NOTHING TO REGENERATE, and that was a design constraint rather than an accident. The response
  SHAPE stays `list[str]`, so `drydocs_api/schemas.py` does not move and neither do
  `web/src/generated/openapi.json` or `api.d.ts`. Adding the `thread_of_hidden` count I first
  drafted would have moved all three - and `web/src/**` is the UI session's pen this burst - so the
  count was dropped. Lane A: no `scripts/dump_openapi.py` or `npm run api:types` run rides with
  this merge.

  (d) The `TRANSITIONS` ruling is written above the table: the `_ANY` grants are a ROLE test that
  says nothing about whose record is moving, which is sound now that ownership is enforced before
  the UPDATE. The comment ends by naming what NOT to do - narrowing those tuples to compensate for
  an ownership gap - because that is the plausible wrong fix the next reader will reach for.

  For Lane A, not this item: the console's `refreshPriors` will now render fewer prior-decision
  rows for a user-tier persona, because the ids it used to fetch-and-fail on are no longer sent.
  That is the intended effect and no `.tsx` change is needed; it is noted because the behaviour is
  visible in the UI and the web pen is not this lane's.
