acceptance: |
  When an Ask request fails, the surface runs a STAGED self-diagnosis in place of the single red
  line it shows today, in this order:

  (a) The originating error renders FIRST and VERBATIM — "Failed to fetch" stays "Failed to fetch".
      It is never re-worded, prefixed or "friendlied": that exact string is what the user will paste
      into a search or a support ticket, and the browser's own wording is the honest report of what
      the browser saw.
  (b) A `checking…` state appears immediately and is visibly distinct from both success and failure,
      so a slow probe never looks like a verdict.
  (c) The console pings the ADK agent server (VITE_ADK_URL, default http://localhost:8000 —
      `GET /list-apps` is the cheapest liveness call and needs no session) and renders RED or GREEN.
      Green additionally asserts the `graph_qa` app is in the returned list: a server that is up but
      does not serve this agent is not a green for this page's purpose.
  (d) If the transport is green, the NEXT stage's error is surfaced AS-IS — the worked example is
      `ANTHROPIC_API_KEY is not set (agents/.env)`, which is `providers.ProviderConfigError` text
      raised server-side. Verbatim matters twice here: the string names the exact key AND the exact
      file to put it in, and any paraphrase loses one or both.
  (e) The ladder ends with a `contact DryDocs support` hand-off once the checks stop being
      self-serviceable.

  (f) THE ADMIN PAGE CARRIES A SERVICE-STATUS STRIP AT THE TOP, driven by the SAME probe the
      ladder uses — one implementation, two surfaces. It reports each service the console
      depends on: drydocs-api (:8001), the graph behind it (reachable + which database), the
      ADK agent server (:8000, green only when `graph_qa` is in `/list-apps`), and whether the
      agent's provider is configured. Ask's ladder is the reactive view — it runs because
      something already failed — and the strip is the standing one, answering "is anything
      missing?" before a question is asked rather than after.

      ON DEMAND AND TIMESTAMPED, NOT A LIVE MONITOR. DryDocs is deliberately not a real-time
      system, and the strip must not imply otherwise: it checks when the page loads and when a
      refresh control is pressed, shows `checked HH:MM` beside the verdict, and never polls on
      a timer. A stale-but-dated verdict is honest; a green dot that silently stopped updating
      is the failure this repo keeps refusing elsewhere. This is the same reason the console
      renders committed artifacts rather than live-deriving them.

  THREE RULES THE LADDER MUST NOT BREAK:
  1. NEVER INVENT A GREEN. A probe that could not run renders "not checked", never green and never
     0 — the O56 honesty rule, applied to liveness instead of counts.
  2. The two failures are DIFFERENT and must not collapse into one message: nothing listening on
     :8000 (transport down — the agent service was never started) versus the service up and its
     provider misconfigured. Both printed "the Ask page is broken" before this item; only the second
     is fixable by editing a file.
  3. NO SECRET EVER REACHES THE PAGE. The diagnosis reports that a key is unset — never its value,
     length, prefix or a masked form of it. ADR 0005's reason for VITE_NEO4J_PASSWORD applies to any
     value a bundle could inline.

  A test covers the ladder's STATE MACHINE (error -> checking -> probe verdict -> next error ->
  hand-off) rather than its copy, and the ui-tests.yaml TS-ASK suite — declared but empty today —
  gains its first cases from whatever is actually watched working. The strip is covered by the
  same probe's tests plus a case asserting it renders "not checked" rather than a verdict before
  its first run.
notes: |
  Raised 2026-08-20 from a live failure in the ui-workstream session, and the sequence in the
  acceptance is the debugging path a human actually walked, turned into the page's own behaviour.

  WHAT HAPPENED, because it is the whole argument for the item: the console came up with Neo4j, the
  API and Vite all green, every other view live against the graph. Ask returned "Failed to fetch"
  and nothing else. The cause was a FOURTH service nobody had started — the ADK agent server
  (`cd agents && adk api_server --allow_origins http://localhost:5173`), which only the Ask spoke
  talks to; every other page goes through drydocs-api. Starting it moved the failure to
  "ANTHROPIC_API_KEY is not set (agents/.env)" — a completely different problem with a completely
  different fix, reached only by reading source and grepping .env files.

  "Failed to fetch" is the browser's generic network-error text. It is TRUE and nearly useless: it
  cannot distinguish a service that was never started from a crashed one, a CORS rejection, or a
  wrong VITE_ADK_URL. The console already knows which URL it dialled and can simply ask — which is
  what turns a dead end into a two-line answer.

  THE ADMIN STRIP (clause f) was added 2026-08-20 on the user's direction, with the reason stated
  as a property of the project rather than a preference: "the DryDocs project itself is not meant
  to be realtime intentionally", so the console needs service checks with status at the top of the
  admin page. That framing is what keeps the strip from drifting into a health dashboard — the
  requirement is an ANSWERABLE question ("is anything missing right now?"), not continuous
  monitoring, and the timestamp is what makes the difference visible to the reader. Scoped onto
  this item rather than a new one because it is the same probe: building it twice is how the two
  surfaces would end up disagreeing about what "green" means.

  DELIBERATELY NOT SPECIFIED: whether the ladder renders inline in the answer pane or in a
  collapsible diagnostics panel, and whether it re-runs on demand or once per failure. Both are page
  design and belong with the builder. Same for the strip's placement within
  AdminConfigRoute — "at the top" is the requirement, the exact chrome is not.

  ONE THING TO RULE WHEN BUILDING, not at the groom: `contact DryDocs support` is a placeholder
  string for the producer console, where "support" is the person reading the screen. If it should
  resolve to a real destination it becomes config (the VITE_RUNTIME_VIEW_URL_TEMPLATE precedent —
  unset means no affordance renders), and a company hostname is never committed here.

  Ties to Idea-141 (should agents/ stop carrying its own venv) without depending on it: that entry
  argues the service is easy to forget because it is installed differently from everything else.
  This item makes forgetting it cheap to diagnose rather than preventing the forgetting.

  NOT gate-bound: nothing here touches edge semantics, the ontology, or a graph write. The page
  stays read-only (O20).

  PRE-BUILD CHECK 2026-09-06 (desktop, Lane A, at the WEB8 merge c541b858) - READ BEFORE CLAIMING.
  Two clauses were written before ADR 0020 (WEB10, ACCEPTED 2026-09-05) and name things that no
  longer exist; build to the ADR, not to the clause text:
  * (c) says the console pings the agent server at VITE_ADK_URL, default http://localhost:8000.
    VITE_ADK_URL is RETIRED (ADR 0020 D2). The agent base is the PATH `/agent` on the page's own
    origin; `GET /agent/list-apps` is the liveness call and the `graph_qa`-in-the-list assertion
    stands. web/src/lib/adk.ts already reads the base this way.
  * (f) names the ports (:8001, :8000) as the strip's labels. A production bundle must not carry a
    port or host (web/scripts/checkDistCoordinates.mjs - `npm run dist:check` fails on it, and
    WEB10's guard is what Lane B just met on its own machine). Label the services by NAME
    (drydocs-api, graph, agent server, provider); the ports may appear only in DEV-guarded text.
  * Rule 2's transport-down case is no longer a failed fetch to :8000. Same-origin, the proxy
    answers 502/503/504 when the agent upstream is down, and web/src/lib/reachability.ts already
    tells `unreachable` (this page's own origin) from `upstream-down` (the proxy answered) for the
    API. Reuse that module for the `/agent` prefix rather than writing a second probe - "one
    implementation, two surfaces" (f) then also means one implementation across the two upstreams.
    reachability.ts is a natural input; proposed here, not added.
  The acceptance TEXT is left as written - amending it is the item author's call, and the notes
  above are enough for the builder to meet its intent under the ADR.

  ── CLOSED 2026-09-06, Lane B (laptop), branch wip/O63-laptop from main at 5429f263 ──

  BUILT TO THE PRE-BUILD CHECK, not to the clause text, on all three points it
  raised. (c) pings `/agent/list-apps` on the page's own origin - VITE_ADK_URL is
  retired (ADR 0020 D2) and never appears. (f) labels services by NAME
  (drydocs-api, graph, agent server, agent provider); no port or host reaches the
  bundle, and a test asserts that on the rendered strip as well as on the labels.
  Rule 2's two failures are told apart by reusing reachability.ts's own
  distinction for the `/agent` prefix rather than writing a second probe.

  TWO SERVER ROUTES DID NOT EXIST AND NOW DO.

  * GET /graph-status on drydocs-api. "The API is up" and "the graph behind it is
    there" are different facts and /health only ever answered the first - the API
    serves /health perfectly well with no graph, which is exactly the state that
    presented as a broken page. Steward+admin (matching /docs-verify), no
    parameters, a bare RETURN 1 chosen server-side, so ADR 0005's property holds
    the way it does for the corpus sweep. `database` comes from SPEC_DATABASES,
    the reviewed READ database, not from the nullable Neo4jSettings.database.
    An unreachable graph is a VERDICT, not a 500: LiveRunner is lazy, so a wrong
    NEO4J_URI first throws on this very call. `detail` is the exception CLASS -
    a driver message quotes the URI it dialled, and the class is what actually
    separates an auth failure from a refused connection.
  * GET /drydocs-health on the agent server, added in serve.build_app. ADK owns
    /, /health, /version, /list-apps, /run, /run_sse, /dev-ui* and /apps/* - read
    off the installed vendor file rather than assumed - so the name is free, and
    it is deliberately NOT /health: that one is ADK's and answers for the SERVER,
    which is a different question from whether the agent can reach a model.

  A REAL TRAP FOUND WHILE WIRING THE SECOND ONE. providers.py merges only the
  REPO-ROOT .env at import; agents/.env - the file every ProviderConfigError
  message names - is merged by common.neo4j_tool at ITS import (G131). A probe
  importing providers alone would read a half-loaded environment and report
  ANTHROPIC_API_KEY unset on a machine where a real turn succeeds. A false RED is
  worse than no probe: it sends an operator to edit a file that is already
  correct, which is the same harm this item was raised to remove. provider_check
  imports common.neo4j_tool first and a test asserts that ORDER by parsing the
  file.

  THE HONESTY RULES, AND WHERE THEY BIT.

  1. NEVER INVENT A GREEN - and never invent a RED either, which is the half the
     clause does not say and the probe needed. The states are four: a check whose
     DEPENDENCY is down is `not-checked`, never `down`, because it was never run.
     A provider reported broken because there is no server to ask would
     manufacture the second failure out of the first. An older agent server
     without the probe route is `not-checked` too: it has not FAILED a check, it
     has no check.
  2. The two agent failures stay apart because the probe reads the STATUS, not
     just the throw. adk.listApps() was the obvious reuse and is the wrong tool -
     it throws on a non-2xx before the caller sees the status, and the status is
     exactly what separates "nothing answered on this origin" from "the proxy
     answered 502 for an agent that is not there". A THIRD case joins them: a
     server up but not serving graph_qa, where "start it" is the wrong fix.
  3. No secret reaches the page, asserted server-side against the real error text
     rather than argued (test_service_probe.py). That test RUNS rather than
     skips: providers.py imports only stdlib and python-dotenv, so agents/ on
     sys.path is enough, and a skipped security assertion runs on no machine and
     in no CI job while reading as coverage.

  RULED AT BUILD TIME, as the item asked.
  * `contact DryDocs support` stays a PLAIN STRING with no link. This is the
    producer console, "support" is the person reading the screen, and inventing a
    destination would be inventing a fact. Config on the
    VITE_RUNTIME_VIEW_URL_TEMPLATE precedent if that ever changes.
  * The ladder probes ONCE PER FAILURE with no re-check control - a repeat button
    there would be a second, worse copy of the strip's Re-check, and the reader
    whose turn just failed wants the answer, not an instrument. A new failure
    runs a new probe, which is when the answer could have changed.
  * The ladder is a PURE FUNCTION, `ladderStages(error, probe)`, because the
    acceptance asks for a test of the state MACHINE "rather than its copy" and a
    machine inside JSX can only be tested by rendering it and reading strings
    back. The trap the clauses do not spell out: (d) reads like a sequence of
    fresh requests, but the originating error has already arrived - the ladder
    probes the SERVICES and reinterprets that error, and never silently re-asks
    the person's question.

  ONE PROBE, THREE CONSUMERS. readiness.ts's probeHealth MOVED into
  lib/serviceProbe.ts and is re-exported, so the shell banner, the ladder and the
  strip share one API check instead of two that could disagree. It went DOWN a
