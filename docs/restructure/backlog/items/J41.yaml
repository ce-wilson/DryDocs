id: J41
epic: release-infrastructure
title: 'The port has a mandatory CLOSING sequence and no OPENING one: certify the base before a company
  session starts'
type: task
module: docs
phase: 8
agent: main
model: opus
priority: p1
status: done
depends_on: []
inputs:
- docs/port-prompt.md
- .claude/skills/reconcile-port/SKILL.md
- PORT-MANIFEST.yaml
- scripts/render_board.py
acceptance: |
  An OPENING SEQUENCE in docs/port-prompt.md beside the J35 closing sequence and carrying the same force, listing what the PRODUCER must finish before any company session may start: (1) full tests/unit/ green on the exact commit offered, venue-stamped per J18; (2) ledger rolled through it with coverage verified commit-by-commit; (3) every producer action triggered by company state landed — anything the company would otherwise have to do to a canonical-producer file; (4) renders current; (5) the base tagged port-base-YYYYMMDD and pushed. Plus the ONE-OWNER-PER-PHASE rule: a plan never crosses the repo boundary, and a phase whose owner differs from the one before it ENDS the plan. Backed by scripts/port_preflight.py running all five checks (report-only by default, --tag to create and push), with its ledger-coverage check parsing cited SHAs out of the step ledger and naming any uncited non-ritual commit. reconcile-port SKILL.md step 1 gains the certified-tag check so a company session that never opens port-prompt.md still gets it. Guards in tests/unit/test_port_preflight.py, each proven to FAIL on an injected defect before being trusted (J26).
notes: |
  Raised 2026-08-09 from a port that could not run solo. A company session was handed a thorough 8-phase plan and stopped at Phase 2, which asked it to remove three clean-add rows from PORT-MANIFEST.yaml — a canonical-producer file its own Phase 3c takes wholesale, so the edit would have been reverted in the same session. MORE INSTRUCTION DETAIL COULD NOT HAVE FIXED THAT: the phase was undoable by its assignee. Two more defects rode along, both invisible until the end because acceptance only ran on the applied result: test_bootstrap_guard failed on ANSI colour rather than behaviour (rich honours ambient FORCE_COLOR even under NO_COLOR) and IDEAS.md carried a duplicate Idea-101 from a two-session id collision — verified present at the pinned SHA, so the port would have failed its own zero-fail contract and both would have read as port-introduced. WHAT WENT RIGHT AND MUST NOT BE REGRESSED: the session STOPPED rather than improvising, on its own wait/flag rule. So this is not "the phased approach failed" — it is a plan with one misassigned phase correctly refusing to execute it. Keep the phases and the wait/flag rule; fix the ownership boundary and the uncertified base. The tag also retires the moving-base problem: the base moved 42 -> 45 commits while the session held, and every prompt had to carry an awkward "verify, the producer is still committing".
