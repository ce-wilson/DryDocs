notes: |
  Groomed 2026-08-09 from Idea-91 (persona Run 2, U-arch F4). The package was born 2026-08-04 at Q6 — the same day the U14 baselines were measured — and it already has a MODULE_MAP row and a test_module_boundary entry, so the gap is purely in the metrics scope. Same failure shape as Run 1's drydocs_api census miss, one package generation later: the allow-list is hand-maintained, so every new package is invisible until someone remembers it. Worth recording in the close note whether the list should be DERIVED from the modules registry instead of typed, which is the only fix that stops the third instance. DONE 2026-08-09 (desktop, neo4jtest, drydocs DB, graph loaded at 2d104ef): the allow-list is eight roots in BOTH places (tech-debt SKILL.md A1-A6 pack, code-graph-review-plan.md), and A3/A4/A5 are re-baselined with the old numbers written beside the new. SCOPE WIDENED, necessarily: A1 does NOT use $packages — it hardcodes its own upward-target list, which was missing drydocs_docmeta too, so 'does core import docmeta?' was a question the pack could not ask and A1's baseline of 0 was silence rather than evidence. Re-probed with the eighth root in the list: still 0. MEASUREMENTS, taken both ways on the SAME graph so the eighth root's contribution is separated from tree drift. A3: 29 (seven roots, 08-04) -> 31 (eight roots, 08-09) — but the top-15 is byte-identical at seven and eight roots, so ALL of that move is drift and NONE is the eighth root; docmeta's highest fan-in is connectors/base.py at 7 against a 13 cutoff. A4: 0 -> 0; every docmeta module has at least one importer. A5: 29 (seven roots, 08-04) -> 27 (seven roots, 08-09) -> 29 (eight roots, same graph). THE A5 NUMBER NEEDS ALL THREE READINGS, which is the whole point of the write-them-side-by-side rule: the eight-root figure lands back on 29 by COINCIDENCE — the tree lost two untested modules while the eighth root added exactly two — so quoting 29 -> 29 would report no change across two real movements in opposite directions. The two added are exactly the pair the item predicted: drydocs_docmeta/connectors/filedrop.py and connectors/web.py, now named in the A5 list. A6 aside worth keeping: docmeta is a target only (tests 10 edges, scripts 1) and imports nothing outside itself. ANSWER TO THE OPEN QUESTION the item asked to record — should the list be DERIVED rather than typed: YES, but NOT from the backlog `modules:` registry, which is a LOGICAL component list (drydocs-load/review/plan/docgen all map to the one `drydocs` root, and reference/taxonomy/config/docs are not Python at all). The right source is pyproject.toml [tool.poetry] packages plus the single non-package scan root `tests`. Verified decisive rather than asserted: drydocs_docmeta was added to pyproject in d647171, THE SAME COMMIT THAT CREATED THE PACKAGE, on the same day U14 typed seven roots — so the derivation would have been right from hour zero and ten modules would never have been invisible for five days. Built the cheap half rather than restructuring the queries: two guards in tests/unit/test_code_graph_review_plan.py — the typed scope in both surfaces must equal pyproject's packages + tests, and A1's own hardcoded list must cover every shipped package. Both PROVEN to fail with the eighth root removed (J26). This was the SECOND instance (drydocs_api was the first, at the U2 census); the guard is what stops the third. Related gap NOT fixed here and inboxed instead: Phase 3 unit 3's doc-coverage baseline still reads 'six scan roots' with per-root counts that predate both drydocs_api and drydocs_docmeta — same disease, different table, outside this item's stated surface.
