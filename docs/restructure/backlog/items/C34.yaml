acceptance: |
  THE FINDING THAT SHAPES THIS ITEM, verified before it was raised rather than assumed: the hierarchy the SME proposed for subject classification -- LOB, Product Line, Product -- ALREADY EXISTS as config/taxonomy/lob-product-team.yaml (CatalogLOB > ProductLine > Product > DevTeam, B3, captured 2026-06-20), and the SME's vernacular examples are already ProductLine rows in it. This item does NOT mint a subject vocabulary; it declares the one that exists. (a) THE SKOS DECLARATION -- taxonomy, layer 1, NO gate, lands immediately. The file is a concept scheme in all but name: classification_only, hierarchical via parent_lob / parent_product_line, id-keyed, labelled. Declare it a skos:ConceptScheme with the parent links as skos:broader so dcat:theme has something standards-valid to point at. SKOS is already precedent in this very file, which cites skos:closeMatch for RECONCILES_TO. (b) THE GATE PROMPT, drafted not signed -- dcat:theme is a MEANING edge. It must pose: (b1) RESIDENCY, which BLOCKS the cross-corpus half. The design puts structured and unstructured context in TWO DATABASES, and a Neo4j relationship cannot span databases (Q8 -- the same constraint blocking G32's estate join), so one edge cannot reach one shared Concept from both sides. Three shapes: duplicate the scheme per database with identical concept IRIs; hold the scheme in one and carry the theme on the other as an IRI-valued PROPERTY joined application-side; or single database (ADR 0011). DECIDABLE NOW REGARDLESS, and the prompt says so: make the concept IRI the join key and keep it stable, so the vocabulary is portable whichever way residency rules and no work is stranded. (b2) IS a Product a skos:Concept, or does it HAVE one? ProductLine and Product are business entities with owners, teams and applications; dual-typing them is legal RDF and muddies what the node is. The alternative is a concept per product with skos:exactMatch. Rule it -- do not let a loader decide by accident. (b3) ANNOTATION DEPTH is the real control on grain: annotate at ONE level and derive the rest by skos:broader, so tagging a folder at Product yields its ProductLine and LOB free. That stops a deep vocabulary from multiplying annotations, and it beats capping vocabulary size, which forces a lie the moment the business genuinely has more rows than the cap. (b4) THE CARDINALITY ASK IS PREMATURE AT THE TIER NAMED, and the prompt must say why rather than silently declining. The SME asked for a limit under 5 at the AreaProduct level; lob-product-team.yaml records area_products: 0 and carries a STANDING OPEN QUESTION (area-product-missing) on whether that tier applies outside production PAT at all. Rule the tier before capping it. What CAN be ruled now is the ANNOTATION cap -- how many themes one subject may carry -- enforced as a DETECTOR, not a schema constraint, because a folder carrying six themes is evidence the folder does too much or the tagger hedged, and that is a finding worth reading rather than a write to refuse. (c) UNCLASSIFIED IS FIRST-CLASS, and out-of-scope is a DIFFERENT value from not-yet- classified. External-vendor and unrelated pages are permanently out of scope; an unclassified internal page is pending. Collapsing them makes coverage unmeasurable, because the number stops distinguishing backlog from scope. Same discipline as resource_pool.classify returning unknown with no label and a WARN. No graph writes, no ratification: the scheme declaration ships, the edge is the gate's.
notes: |
  Raised 2026-08-11 from an SME design session that began on Idea-105 and opened a second thread. THE ORIGINAL INTENT: folder-level runbooks are >90% automatable, and the roll-up axis was going to be "Data Series" -- an entity that is not commonly defined. Teams think in source name instead, which is why the existing ProductLine tier fits: it is both the vernacular people already use AND already captured. The roll-up therefore falls out of the concept scheme without Data Series ever being defined, which is the part to protect in review. WHY IT REACHES THE CONTEXT GRAPH (SME observation, and it is right): a theme is a PROJECTION AXIS, so "everything in this subject, right now" becomes a layer-4 slice instead of needing a new entity to hang it on. Themes are multi-valued by nature, so a process serving two subjects appears in both slices with nothing duplicated -- which a single Data Series field could never have done. SCOPE FENCE: declares and drafts. Does not populate real values (Internal), does not write the edge, does not build UI.
  AMENDED 2026-08-20 (user direction, the theme-search ruling). THREE UPDATES: (1) QUESTION (b1) IS ANSWERED BY THE G102 FOLD — the residency blocker was written against the two-database design, and content + structure are ONE database since 2026-08-18, so dcat:theme can be a plain edge to a shared Concept; the prompt should record (b1) as answered-by-fold, not pose it. (2) THE EVIDENCE UPGRADED: the firm's Taxonomy Framework (v21) and its sibling standards are now VERBATIM-captured (the 2026-08-19 live fetch, fcdo-frameworks row) — the scheme declaration can cite the published standard directly instead of a partial transcription. (3) THE CONSUMER IS NAMED: the retrieval capability over this scheme is THEME SEARCH (dcat:theme-scoped retrieval over the standards corpus) — deliberately NOT "context search"; the naming rule and its three-senses census live in config/taxonomy/context-types.yaml's header. Groom the theme-search build as its own item once this gate signs; "context" never appears in its ids.
