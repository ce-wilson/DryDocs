title: Code splitting follows the authorization boundary - React.lazy on the admin and steward routes
  and the Locations tab so about 420 KB of role-gated artifacts stop shipping to every persona, plus a
  bundle-size ceiling in the web CI job
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: in_progress
depends_on: []
inputs:
- docs/reviews/modules/web-2026-09-05.md
- web/vite.config.ts
- web/src/App.tsx
- web/src/routes/AdminConfigRoute.tsx
- web/src/generated/enforcement-matrix.json
- web/src/generated/gates.json
- .github/workflows/ci.yml
- PUBLISH-BOUNDARY.md
acceptance: |
  There is no code splitting - vite.config.ts is three lines, no React.lazy or dynamic import
  exists in web/src, and the build is one 3,676,794-byte chunk. Every generated artifact is a
  static import, so a user-tier persona downloads the full enforcement matrix (275 KB) and the
  gate record (44 KB) for routes it can never open and can read both from devtools; the route
  gate is a render decision, not a delivery decision (A4).

  (a) React.lazy on AdminConfigRoute and the Locations tab, then the steward routes, so the
      role-gated artifacts (about 420 KB raw) load only for a persona whose gate passes. The
      split follows the authorization boundary, not file size - a chunk is admissible to a
      role or it is not.
  (b) A bundle-size ceiling in the web CI job asserts the initial chunk against a recorded
      number and fails when it grows past it (S8); the number is recorded in the job, with the
      date, and ratchets down, never up, without a note.
  (c) The item RECORDS the publish-boundary answer for each generated artifact shipped to the
      browser - which are Internal-Public and safe in any bundle, and which the split exists to
      keep from a role - by citing each artifact's source classification; if any artifact turns
      out to carry Internal values, that is a finding for the HITL gate, not a bundle decision.
  (d) The generation pipeline is unchanged; the drift tests over web/src/generated still pass.
notes: |
