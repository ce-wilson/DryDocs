acceptance: |
  (a) THE ANSWER READS OFF THE LEDGER, NOT A LOGIN. When this parked on 2026-07-14 it needed live queries. Doc 08 Phase 2 (2026-08-25) has since censused all seven psgmgr objects with complete column inventories, so the question — which other CM_ objects carry the derived folder-id-plus-job-id key, as join-upgrade candidates over the weaker scheduling-table and member-name joins — is answerable from `config/source-mappings/psgmgr.yaml` alone. No internal session, no live probe.

  (b) THE KNOWN NEGATIVE IS CARRIED FORWARD, NOT RE-DISCOVERED. CM_AVG_RUN carries no such key; the 2026-07-22 relay proved it. The outcome must state that explicitly rather than leaving a reader to wonder whether it was checked.

  (c) IT LANDS IN THE LEDGER. The result is recorded in the existing column-ledger fields for each object, not in a new document. A new doc for one fact is how doc 08 grew the drift the ledger was built to kill.

  (d) A CANDIDATE IS A CANDIDATE. Naming an object as a join-upgrade candidate does NOT change any loader SQL and must not — an actual join change is a separate item against the loader, with its own coverage evidence.
