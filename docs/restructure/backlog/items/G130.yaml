id: G130
epic: component-topology
title: bootstrap verifies declared-present and never reports live-but-undeclared, which is how a
  retired label's constraint survives a data wipe
type: task
module: graph-infra
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
