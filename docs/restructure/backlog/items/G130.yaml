acceptance: |
  (a) THE COMMAND REPORTS THE OTHER DIRECTION TOO. It already asserts that every declared
  constraint is present; it gains the inverse - the live constraint set minus the parsed
  declarations under the schema tree - reported as a drift WARNING.

  (b) NEVER AN AUTOMATIC DROP. The safety check before each company-side drop was a zero-node
  count and a human decision. This reports, names each undeclared constraint with its label and
  property, and says what a human would need to check before dropping it.

  (c) THE MECHANISM IS IN THE OUTPUT SO THE WARNING IS ACTIONABLE - constraints outlive data
  wipes. Their census recorded 62 constraints at a true-zero node baseline, because the wipe was a
  data delete and not a database drop. A clean graph is not a clean schema, and a retired label's
  constraint silently enforces an old identity rule against any future load that reuses the label.

  (d) THIS IS A MISSING DETECTOR AND NOT A PRODUCER DEFECT TODAY, and the item proves that rather
  than asserting it - the membership constraint was dropped at G99 on 2026-08-18 and the two
  mis-spelled capability and tool labels appear nowhere in the schema tree. Re-verify all three at
  build time and record the verification in the close note.

  (e) IT NEEDS A LIVE GRAPH, SO IT IS NOT A PURE-UNIT ITEM. The test skips with a named message
  when no database is reachable (the U26 precedent) and any live run names its venue - machine,
  container and database (J18).
notes: |
  BUILT 2026-08-30 (desktop, MSI). 12 guards in tests/unit/test_constraint_drift.py.

  (a) THE INVERSE SHIPPED and it reads the whole SCHEMA TREE, not constraints.cypher alone.
  schema_graph.cypher declares one of its own and any supplement may declare more; keying the
  drift report on a single file would have reported those as undeclared and made the warning
  noise on its very first run, which is how an operator learns to ignore a warning. The
  comparison is PURE - it takes the live rows as an argument and the database read lives on the
  client - which is what makes the whole rule unit-testable rather than live-only.

  (d) IT FOUND ONE ON ITS FIRST RUN, so the re-verification is not a formality. Venue: MSI /
  bolt://localhost:7687 / database drydocs (J18). 56 live constraints, 56 declared across the
  tree, ONE live-but-undeclared: `membership_id` on `:Membership` (NODE, UNIQUENESS). All three
  cases re-verified at build time as the clause asks:
    1. membership_id - DROPPED at G99 (2026-08-18), with its last writer rather than ahead of it,
       and constraints.cypher records the reason in its own comment. So it is NOT a producer
       defect - AND it is live residue on THIS desktop exactly as it was on their instance. The
       item predicted "not a producer defect today"; what it did not predict is that this machine
       carries the same residue, which is the detector earning its place immediately.
    2. :AisCapability - zero occurrences anywhere under drydocs_core/schema/.
    3. :AisTool - zero occurrences anywhere under drydocs_core/schema/.

  (b) NEVER AN AUTOMATIC DROP, and it is asserted rather than promised: a guard fails if the
  drift path ever contains DROP CONSTRAINT, and a second guard requires the OUTPUT to say it
  drops nothing. The company-side procedure was a zero-node count AND a human decision; dropping
  a constraint that still guards live data is unrecoverable in a way that leaving one is not.

  (c) THE MECHANISM IS IN THE OUTPUT, guarded by phrase so it cannot be trimmed to a bare list:
  constraints outlive data wipes, a wipe is a data delete and not a database drop, a census at a
  true-zero node baseline still found 62 constraints, and a retired label's key goes on enforcing
  an old identity rule against the next load that reuses the label. Then the three things a human
  checks before dropping one: does the label still appear in the ontology or a loader, does the
  graph hold nodes with it now, is it provisioning's rather than the schema tree's.

  IT IS A WARNING AND NEVER AN EXIT CODE. Undeclared is a STATE - provisioning and older
  experiments legitimately leave constraints behind - and failing bootstrap on one would make the
  operator's next move "skip the check", which is the same shape as the coverage lie G125 closed.
  The live test asserts the detector RUNS and that every row it returns is reportable; it does not
  assert the set is empty.

  (e) THE LIVE HALF SKIPS with a named message where no database is reachable (U26) and names its
  venue where one is. The pure half always runs.

  TWO THINGS THE BUILD CORRECTED IN ITS OWN WORK. (1) The purity guard first matched the TEXT
  `session` and `run(` and failed on its own docstring - the THIRD time in one session that a
  source-reading guard matched its own prose (G128 and G129 were the others). It now walks the
  AST. That recurrence is inboxed as Idea-226: three authors' worth of the same fix, invented from
  scratch each time, and the real cost is that a guard failing on the explanation teaches people
  to stop writing explanations. (2) Two tests in test_bootstrap_guard.py failed because the fake
  client lacked the new method - and they were RIGHT to fail. A double missing a method the
  command calls is a double that no longer models the client, so the DOUBLE was updated and no
  assertion was touched.

  VERIFIED: full suite green (2863 passed), ruff + format clean, root import OK,
  `drydocs bootstrap` run live on this desktop with the drift table rendering.

  Groomed 2026-08-30 (desktop, weekly groom) from Idea-212, which was transcribed from the
