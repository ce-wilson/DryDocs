id: CORE4
epic: release-infrastructure
title: "The skip-guard policy calls every drydocs/data/ reference gitignored, but the sample CSVs under it are tracked - ask git rather than pattern-match the directory"
type: bug
module: drydocs-core
phase: 8
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- tests/unit/test_skip_guard_policy.py
- docs/restructure/backlog/items/J8.yaml
acceptance: |
  The J8 skip-guard policy treats any drydocs/data/ reference as a reference to a
  gitignored asset. The tree/samples under it are FORCE-TRACKED, so the policy flags a test
  that reads a tracked sample as if it read machine-local data, and the fix at Z8 was a real
  existence guard written to satisfy a policy that was measuring the wrong thing. A fake skip
  in place of a real assertion is the cost.

  (a) The policy asks GIT whether the cited path is tracked (git ls-files) instead of
      pattern-matching the directory prefix. A tracked path needs no skip guard; an untracked
      one still does.
  (b) The two cases are distinguished in the failure message, so a future reader sees which of
      the two the file tripped.
  (c) The Z8-era guard written to satisfy the old policy is revisited: if it exists only to
      pass the policy, it is replaced by the real existence assertion the test wanted.
  (d) Fixtures cover both directions - a tracked sample under drydocs/data/ passes with no
      skip, an untracked one under the same prefix still fails without one - and the existing
      glob/manifest-row carve-outs keep working.
notes: |
  Minted 2026-09-07 from IDEAS.md Idea-258 (Lane B close report, laptop, 2026-09-05,
  found while moving the Z8 fixtures).

  The test is tests/unit/test_skip_guard_policy.py (verified on this tree); the entry called it
  'J8's skip guard', which is the item that built it.

  The same instrument-versus-subject error as CORE2, one level up: the policy's instrument (a
  path prefix) does not measure its subject (whether the asset is in the clone).
