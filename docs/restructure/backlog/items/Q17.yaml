acceptance: |
  A decision record lands PROPOSED in docs/decisions/ — never accepted from a groom; the user rules it (the U16 precedent) — stating whether the jpmc-reports corpus reshapes onto the lexical Document-to-Chunk backbone or keeps its DataAsset slice shape, and what each choice costs. It must state: the consumer that now exists (the 2026-08-08 business-layer experiment wanted GraphRAG retrieval over this corpus and could not have it — the registered shape is not the lexical backbone, so no vector retrieval is possible regardless of the database state); what happens to the registry row's graph_locator and its confirmed flag under each choice; whether the newer 2025/2026 editions sitting at the repo root ride the re-ingest; and the precondition, recorded honestly rather than assumed away — ddcontext was probed EMPTY on the desktop (neo4jtest, 2026-08-08), so any re-ingest gates on the provisioning ruling that Idea-49 is parked on. No corpus is re-ingested by this item. RIDER (2026-08-19 groom, from Idea-130): the record also states this corpus's candidacy for the P4 END-TO-END local load. jpmc-reports is External-PUBLIC -- public SEC filings / investor-relations PDFs, source_url present, trust_default VERBATIM -- so it carries NO publish-boundary risk and can exercise the whole P4 path (chunker, embeddings, trust provenance, the :Uncertain routing) without the redaction care an Internal corpus forces. knowledge/upgrade-plans/docmeta-p4-revision-single-db.md names only the BMC corpus for that slot today; whichever way the SHAPE is ruled, the record says whether this corpus is the second candidate for it. The three facts that change that work are already in this item and its registry row: confirmed: false (the flag N9 says a future loader gates on), the :DataAsset-slice shape rather than the lexical backbone, and the removed ingest path.
notes: |
