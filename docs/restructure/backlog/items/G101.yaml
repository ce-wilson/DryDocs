acceptance: |
  THE GAP: gate vocabulary-domains-and-id-policy §A2 renamed the domain seal -> business_application, and §B1 made the id prefix DOMAIN-DERIVED. §B3 then force-migrated the epoch-tag ids by explicit census -- m3_ 21, p2_ 5, m7_ 1, u1_/u2_ 5, g22_ 1, c23_ 4, prov_ 1, sosa_ 4 -- and that census does not contain seal_. So the 10 seal_* ids in 41-local-business-application.yaml are neither epoch-tag (not in §B3) nor conformant to §B1: they carry a domain prefix for a domain that no longer exists under that name. G87 migrates by that census and inherits the omission. This item closes it, and closes it the same way -- ADD-NEW + DEPRECATE-OLD, never a rename in place (§B3: ids are the join key across the taxonomy-ontology-map, the generated schema_graph.cypher, the SQLite mirror and the append-only gate log). SCOPE IS 5 OF THE 10, and the split is the work of this item, not a detail of it: (a) 4 need NOTHING and must be left alone -- seal_requires_scheduler, seal_has_membership, seal_of_role, seal_held_by are already status: deprecated. Add-new + deprecate-old is a no-op on an entry with nothing loading it: minting a replacement id for an edge that has no data invents a row whose only content is that it was never used. They stay as the audit trail their notes make them. (b) 1 is CARVED OUT -- seal_app_attributed_to_employee (planned) is claimed by the open seal-tom-attribution-reshape gate, which §C1c of the id-policy gate already deferred to rather than ruling over. Its id migrates with that gate's outcome or after it, never here. (c) 5 MIGRATE, and their target prefix is decided by WHERE G88 leaves them, which is why this item sits behind G88 and not just G87. seal_has_port and seal_had_primary_source are structural business-application edges and take business_application_*. The attribution family -- seal_qualified_attribution, seal_attribution_has_agent, seal_attribution_had_role -- is exactly the people/org family G88 relocates to domain: human, so it takes human_* IF G88 rules it across. Running this before G88 would mint business_application_* ids and then need a SECOND add-new + deprecate-old cycle on the same three edges the moment the domain moves, which is the double-touch G88's own acceptance exists to avoid. DONE MEANS: each of the 5 has a new domain-derived id, its old entry status deprecated with a note naming the replacement; the structural vocab_id joins repoint -- the qualified_form.vocab_id / C7 entry-level list in 30-mappings-catalog.yaml that names seal_attribution_has_agent, the 20-mappings-seal.yaml entries, the 40-mappings-docs.yaml seal_had_primary_source pointer, and the config/precedence.yaml seal_had_primary_source reference; ontology_supplement.cypher and schema_graph.cypher regenerate; the SQLite mirror rebuilds; web/src/generated/enforcement-matrix.json regenerates; the port guard stays green (no id vanishes). PROSE references do NOT change: gate-prompts/, config/ gate-log.md, docs/reviews/ and the note: fields in 42-local-catalog.yaml, 45-local-docs.yaml and 50-local-itsm.yaml cite the old spellings as PRECEDENT and are history -- rewriting them would edit the record the gate log is append-only to protect.
notes: |
  Raised 2026-08-18 from a prefix census of the vocabulary fragments run against §B3's own enumeration. The census matches the gate exactly on all eight epoch tags (21/5/1/5/1/4/1/4), so the vocabulary has not drifted since 2026-08-12 -- which is what makes the seal_ omission an omission rather than drift. Found while confirming for the user that the m3_ -> scheduler_ rename was already backlogged; it is, as G87, and this is the sibling gap that read of G87 surfaced. WHY p3 AND NOT p2 LIKE G87: G87 is the join-key migration that 42 ids and the lineage writer's hardcoded VOCAB_IDS table depend on, and every new entry written under an epoch tag grows it. This is 5 ids, none of them referenced by drydocs_lineage/model.py or writer.py (checked -- no seal_ pins there), and it cannot start until G87 and G88 land anyway. Small, blocked, and it does not compound. PREFIX IS business_application_*, NOT an abbreviation. The one entry in the fragment that already conforms is business_application_port_has_contact_point, and the whole point of "domain-derived" (§B1) is that the prefix is mechanically the `domain:` field -- an abbreviation makes it a memorised lookup and reintroduces precisely the opacity m3_ had. REJECTED ALTERNATIVE: a short bus_app_* prefix. It is 12 characters cheaper on ids that reach 43 characters, and that is a real cost, but it would (i) contradict §B1 of a SIGNED gate, (ii) make the one already-conformant entry non-conformant, and (iii) break the derivation rule for a saving on a string nobody types -- ids are join keys read by machines, not identifiers typed at a prompt. If the length is genuinely the problem the honest fix is to rename the DOMAIN (fragment filename, all 11 entries' domain: field, the header enum, §A2's ruling) so derivation still holds -- a bigger gate change, not a prefix preference, and not this item. REJECTED ALTERNATIVE: fold into G87. Defensible -- same mechanism, adjacent entries -- and it is the cheaper path if all three run in one sitting. Kept separate because G87's scope is a SIGNED census and quietly widening it past what §B3 enumerated would make the item stop matching the ruling it cites, which is the audit trail. This item names the gap as a gap instead.
