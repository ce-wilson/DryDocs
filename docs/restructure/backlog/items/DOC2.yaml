acceptance: |
  Gate ontology-domain-registry-and-edition-grain §E1 (SIGNED OFF 2026-09-02): a cross-repo convention change is inert until it
  reaches the other side, and the company's allocator only WORKS once it holds an edition
  code. RELAY-24 carries PLAN1 + this gate to the company through the port-prompt, in the
  roll that carries commit 375dd962 (PLAN1 mechanism) and 39b90843 (this gate).

  (a) THE FREEZE HALF, which can go now: the 27 letters frozen at their all-time max
  (FROZEN_SERIES, FROZEN_ON 2026-09-02; the table is the constant, quoted); `--next-id G`
  and `--next-id DD` are refused, each message naming the replacement; the series is the
  module - modules.yaml `series:` arrives canonical-producer, so they inherit the 18 codes;
  `--next-id --module <m>` is the command; codes are three-plus letters precisely so a
  company mint can never be confused with a frozen letter, and none is DD. THE FREEZE HALF
  CARRIES FROZEN_BAND (review F3/F9, docs/reviews/restructure-design-review-2026-09-02.md): the frozen table
  was measured on the producer's tree and admits nothing above G136, so the company's G10001-G10003
  and DD10001-DD10003 fail test_frozen_series_take_no_new_ids the day this half lands.
  FROZEN_BAND = {G: 10003, DD: 10003} (a legacy band id is frozen at the band's own max) is
  PLAN3 - a producer-side change to validate.py and test_backlog.py that ships BEFORE this
  relay rolls, not with PLAN2 (re-pointed 2026-09-02; this item now depends on PLAN3 for
  its freeze half) - a freeze relay that hands the company a red suite is worse than no
  relay. The relay says so, and says the company's six band ids are read and listed, not
  re-minted.

  (b) THE PREFIX HALF, which waits on PLAN2 landing: `[<EDITION>-]<MODULE><n>`; the company
  base is an edition and MINTS ITS OWN CODE at its own gate (CFG2 §C3) - the relay names the
  file and the columns, not the code; both partition rules are retired forward-only (§C4):
  their DD1-DD10 / DD10001-DD10003 / G10001-G10003 stay readable; the band mirror assertion
  the port-prompt asked them to write (steps 160, 273 region) is WITHDRAWN and replaced by
  the edition-segment check; between the roll and the company's code mint the company mints nothing new -
  and that is a MECHANISM, not a request (review F2): the allocator reads the venue's
  edition from config/dev-environment.yaml `edition:` (the company's own canonical-company file),
  refuses to mint while the key is absent, and names the key. The relay tells the company the
  one line to write once its code is minted, and nothing else about the code itself.

  (c) THE TWO-AXES WORDING, verbatim from the 2026-09-02 review, so their agent stops
  conflating repos and checkouts: Axis 1 - repos (producer / company: disjoint histories,
  one-way port; the edition prefix separates THESE). Axis 2 - checkouts (every machine,
  worktree or session is a checkout; the push-before-work claim and the wip/ branch rule
  separate THESE). "Both machines and both repos" meant axis 2 on our side and axis 1
  between us.

  (d) J63 provenance block, the RELAY numbered, the APPLY BY DISPOSITION section updated for
  the new per-entry rows (domains.yaml, editions.yaml) and the CLAUDE.md mint-rule change.
  Idea-237's gate-prompt correction (MM13) rides the same relay.

  Depends on PLAN2 for (b); (a) may ship first if a roll happens before PLAN2 lands, in which
  case the item stays in_progress and (b) is a second relay entry.
