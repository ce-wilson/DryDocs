acceptance: |
  Sections A-E and G are ticked or explicitly deferred with a reason, transcribed to config/gate-log.md under a slug-named heading, and the gate's status flips from awaiting-sme. §A2 is answered FIRST and by the person who compiled the source table — whether a row asserts USAGE or AVAILABILITY — because if it is availability the USES_SOFTWARE label is wrong and §A3 requires the gate to PAUSE and return for a second draft rather than proceed through B-F on the wrong verb. §F (the application-level rollup) stays BLOCKED and is NOT signed here: it depends on K17. Any vocabulary entry confirmed is registered status: planned with its loader build groomed as a follow-up; no loader is built and nothing is loaded inside this item.
notes: |
  Groomed 2026-08-05 (desktop) from the 2026-08-05 IDEAS entries. Sibling of C12/C14 (the other USES_SOFTWARE rulings) — hence epic ontology-mapping, phase 2, not the K-series. model: fable: it registers a new vocabulary entry and rules a MERGE key. THE TWO THINGS THE GATE EXISTS TO PREVENT, both defects in the opening proposal: (1) Neo4j cannot attach a relationship to a relationship, so evidence attaches by property pointer, node-grain edge, or a reified assertion — never as an edge hung off the USES_SOFTWARE edge; (2) the evidence rows are (fid-name, install-path) rows, so writing the app-level edge directly bakes a mutable ownership join into a fact and discards the only grain at which it can later be re-derived. SEPARATELY WORTH KNOWING (corrected 2026-08-05 — an earlier draft of this note called it "a better USES_SOFTWARE source than this email", which overclaimed it): the Control-M SUB-APPLICATION field (PR<Appcode>-<Platform App Code>) declares WHICH PLATFORM an application runs on — documenting the platform is the naming standard's intent — so it is a standards-backed app→platform source at estate scale, good for a first-pass C1 container diagram. It is NOT a substitute for this email: it carries PRODUCT and never VERSION, so it does not touch the fact this gate is about. And it must be deduped to one edge per (application, product) — an app has many sub-applications all naming the same platform, so fanning them in at sub-application grain builds a super node on the product. Inboxed, not in this item; needs two software-registry product rows (DPL, Snowflake — see the correction below) first. MERGED IN 2026-08-05 (desktop, Idea-65's open residue): those TWO PRODUCT ROWS are now this item's prerequisite rather than a floating inbox line, because the gate cannot rule §C on a product vocabulary with holes in it. Two of the six framework codes have no `config/taxonomy/software-registry.yaml` row — DPL (the standing gap `invocation_patterns` already records, now with a name and a framework table behind it) and the SFS/Snowflake row. Registering them is taxonomy capture, reversible, and does not pre-empt any §C ruling: a product row says the product exists, not that any application uses it or at what version. CORRECTED 2026-08-05 (user, in-session): AWS Snowflake is a TARGET DB PLATFORM, not an ETL product — same family as AWS S3, AWS Glue tables, and AWS Iceberg tables. The DAT SRE table's "Snowflake ETL" label names the loads-into-Snowflake JOB FAMILY the SFS code marks, not a software product. So the missing registry row is `snowflake` the data platform (a DBMS-family category, sibling of `oracle-db`), never a "Snowflake ETL" tool row — and any app->platform edge derived from the SFS code reads "loads into Snowflake," not "runs a Snowflake ETL framework."
  DONE 2026-08-09 (desktop, SME in session): gate software-version-context SIGNED OFF for sections A-E and G; F NOT signed, still blocked on fid-identity-and-scope (K17). Full transcription in config/gate-log.md; the prompt's status flipped awaiting-sme -> signed-off with the decision block filled. THE HEADLINE, and it is the reason A2 is asked of the COMPILER rather than reasoned from the document type: A2 ruled USAGE, against this page's own recommendation, which said a readiness review usually inventories availability and cited the K7 OWNER-NOT-USER round as the warning. So A3 did NOT fire, USES_SOFTWARE is the right verb, and no second availability entry is needed. Had the gate reasoned it out instead of asking, it would have paused wrongly. CONFIRMED AS DRAFTED: A1, B1-B4, C1, C2, C4, D1, D3-D5, E1-E4. THREE RULINGS extended or differed from the draft: C3 never pads a missing component (absent is not zero -- 4.3.2 stays three components; version_raw keeps the verbatim token, and ragged comparison is the cost, paid openly); C5 adds an `evidence:` pointer block to the abinitio product row, because C2 correctly forbids observed versions from editing the curated ledger but left a row empty-because-nothing-is-known reading identically to empty-because-unreviewed (a pointer is not a version); D2 takes option (a), the evidence_doc_id property pointer -- (b) rejected as asserting the fid was sourced from the email rather than that THIS version claim was, (c) named as the upgrade path if a recurring feed arrives, with the pointer being what makes that migration mechanical. Q2 answered PARALLEL INSTALLS ARE REAL, which upgrades B2's multi-edge model from provisional to permanent: G3's 1:N holds, no uniqueness constraint, and NO `current` discriminator is needed -- the other answer would have shipped the load with a named gap. Q3 DEFERRED with its consequence stated rather than guessed: a symlinked estate would make install_path a poor MERGE key and move identity to (fid, version), a re-key, so the answer is worth having before the loader is built. PREREQUISITE DELIVERED FIRST (the notes' condition -- the gate cannot rule C on a product vocabulary with holes in it): `snowflake` and `dpl` product rows registered as taxonomy capture. DPL turned out not to be new modeling but a MISSING POINTER -- it was already an ETLProcess `engine` value (abinitio|dpl) while Ab Initio carried both an engine value AND a products: row, and that asymmetry had already cost the 2026-07-27 G26 guard catch, which removed the abinitio-dtlaunch-wrapper pattern row because dtlaunch.sh is the DPL spine and coverage_policy forbids a pattern row without a product id. SME supplied the expansion (DPL = Data Pipeline Library, registered in the acronyms block for the same reason AIS is there) and the mechanism (prepare/ingest/transform/provision pipeline types; Zilo is Spark-based, refining the 2026-07-16 note; EKS/GKP with Hortonworks heritage). versions: [] on dpl is deliberate -- the base image is datapipeline-apache-spark-3.5.1 tagged with the DPL image version, so 3.5.1 is the EMBEDDED SPARK and writing it here would record a dependency's version as the product's. VENDOR MODEL: new `in-house` vendor with NO publisher_url; a placeholder URL was considered and rejected as a value that resolves to nothing and is indistinguishable from a stale link. Guard narrowed to third-party vendors via an explicit allow-list, plus a second guard that a product of an exempt vendor must be type: internal so the exemption cannot launder a missing URL. Both PROVEN to fail on their defect -- and the FIRST proof round was worthless and is recorded as such: the registry file is CRLF, the injection patterns were LF, so neither defect was ever injected and both tests 'passed' against unmodified input. NOTHING LOADED, no loader built; reg_appuser_uses_software registered status: planned. Follow-ups carried out: the adhoc loader build, the C1 pattern rows (now unblocked for DPL), F re-run once K17 signs, and a PORT RELAY -- the producer is canonical for the two product rows, the in-house vendor and the DPL acronym; the SME began the same expansion company-side 2026-08-07 and stopped so the two would match. The relay is deliberately NOT written into docs/port-prompt.md yet: a port is in flight against a fetched head and that file is a hand-merge surface.
