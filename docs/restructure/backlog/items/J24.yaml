acceptance: |
  No surface that would ASSIGN or IMPLEMENT a classification still offers Internal-Confidential as a value: docs/design/ui-exploration/site-plan.md's classification union type drops the fourth member (and its banner rule + the matching wf-admin-config-01.md rule read against the 3-level vocabulary), the two skill reference tables that route material by tier (data-context-extractor/references/platforms.md, controlm-runbook-automation/references/fix-package.md) relabel to Internal keeping the confidential-handling note, and the bmc-docs-example.yaml gate-prompt TEMPLATE stops modelling the retired value. The LIVE implementation goes with them: drydocs_api's CLASSIFICATIONS vocabulary drops the retired member, the two specs still carrying it (ownership.teams.v1, ownership.attributions.v1) relabel to internal, and exports.py's filename-prefix map + banner tuple stop emitting an `INTERNAL-CONFIDENTIAL__` file for a tier that no longer exists. ephemeral_specs.py's EPHEMERAL_CLASSIFICATION is a FAIL-CLOSED CEILING, not a label — it must be re-pointed at the most restrictive SURVIVING level (internal), never simply deleted, and its docstring restated so the ceiling's intent survives the rename. HISTORY is left untouched and named as such in the close note: config/gate-log.md, signed-off gate prompts, `done` backlog close-notes, SDLC-Docs/extracted/ corpus, IDEAS.md audit trail. test_classification.py gains a regression guard that fails if the retired token reappears in an explicit list of live-vocabulary surfaces (the guard names its own scope, so history files can never be swept in by accident). Full suite green.
notes: |
  NOTED 2026-08-01 (C17 session, judgement call left to this item): the history carve-out says "signed-off gate prompts", and an UNSIGNED prompt sits in neither bucket — seal-app-ref-edge-reshape.yaml's header prose still calls its evidence captures Internal-Confidential. It is a description of sensitivity rather than a spec that assigns a tier, so it was left alone rather than swept in during an unrelated item; rule it either way when this item runs, and say which. Groomed 2026-07-31 (weekly groom) as the residual of J23, which closed the same day. J23 deliberately scoped itself to config + the boundary docs + the two tests, and correctly left history alone — but these files are neither: they are specs an agent or a future build READS to decide what tier something gets, so they would re-introduce the fourth value into real code (site-plan's union is a TypeScript enum in waiting). Not a gate: J23's ruling is already recorded (user, 2026-07-31) and this applies it, deciding nothing new. The backlog's own live carrier (M3's acceptance) was fixed inline at this groom, so it is deliberately NOT in this item's scope. .gitignore's two explanatory comments are cheap to reword and may ride along; they assign nothing, so they are not acceptance-bearing. WIDENED 2026-08-01 (found while auditing the registry for O27, NOT a new decision — it applies the same recorded J23 ruling). The drydocs_api surfaces were missed TWICE: J23 scoped itself by an inputs list that omitted them, and this item, groomed expressly to catch J23's leftovers, inherited the same omission — its acceptance sentence already claimed "no surface that would ASSIGN or IMPLEMENT a classification", which the API both does. Worth stating plainly because it corrects this item's own premise: the note below calls these "specs in waiting" and cites site-plan's union as "a TypeScript enum in waiting", but drydocs_api is not waiting — two registered specs carry the retired tier TODAY and a real export of either writes a file prefixed INTERNAL-CONFIDENTIAL__ and a banner naming a level config/classification.yaml no longer defines. That makes this a live user-visible inconsistency, not dormant text. Module stays `docs` (the bulk is still docs/skills/templates) but the closer should expect a live Python slice + test, not a docs-only pass. Root cause worth carrying: the API held a SECOND, independent copy of the classification vocabulary that nothing checks against config — so the regression guard is most valuable if it asserts the two agree, rather than just scanning for a token. CLOSED 2026-08-01 (desktop). Live code first, because that is where the inconsistency was user-visible: drydocs_api CLASSIFICATIONS dropped the retired member, the two specs (ownership.teams.v1, ownership.attributions.v1) relabelled to `internal` — teams.v1's description gained the confidential- handling note it had been carrying implicitly in its tier — and exports.py's prefix map + banner tuple stopped emitting INTERNAL-CONFIDENTIAL__ for a level config no longer defines. A THIRD and FOURTH copy of the vocabulary turned up that neither J23 nor this item's inputs listed: web/src/explorer/ SpecGrid.tsx's isInternal test and web/src/routes/AskRoute.tsx's hardcoded client-side mirror of the ephemeral ceiling — the browser was labelling agent-generated sources with a tier the server had stopped stamping. The ephemeral ceiling was RE-POINTED, not deleted, per the acceptance: EPHEMERAL_CLASSIFICATION = 'internal' with the docstring restated so the RULE ("the most restrictive level the vocabulary currently defines") is what survives, not the value — plus an explicit instruction to re-point in the same commit if a fourth tier ever returns. tests/unit/test_ephemeral_specs.py keeps pinning the export literals on purpose (they prove the ceiling still produces a restricted artifact), so moving it stays a deliberate edit. THE UNSIGNED-PROMPT JUDGEMENT CALL, RULED — and the C17 note that raised it was working from incomplete evidence, which is why the ruling goes the other way: seal-app-ref-edge-reshape.yaml is not only descriptive. Its `Registry ref:` line ASSIGNS a tier to a source-registry entry that does not exist yet ("classification Internal-Confidential company-side"), so a build following it would write a dead value. Swept. The same sweep then had to cover the two OTHER unsigned prompts nobody had listed — email-dl-contact-point.yaml and rua-load-shapes.yaml (both `open`, gate page rendered, session not yet run) — and rua-load-shapes needed care rather than replacement: its clause F1 asks the SME to rule WHICH PROPERTIES are internal-confidential, a question whose premise (two tiers to sort properties between) J23 removed. The clause was NOT re-decided; it carries an explicit "PREMISE CHANGED SINCE DRAFTING (flagged at J24, NOT ruled)" note telling the session to re-frame the output as a confidential-handling note plus an export rule. Signed and recorded prompts were left alone. Scope rule used, stated so the next sweep can reuse it: every occurrence in config/ that is not gate-log.md and not a SIGNED prompt. That is crisper than the inputs list and it caught the three config/taxonomy header comments and two taxonomy-ontology-map lines still naming the retired tier one screen above the `classification:` fields J23 had already corrected. .gitignore's two comments rode along as predicted. DELIBERATELY NOT SWEPT and left as history: config/gate-log.md, the five signed/recorded gate prompts, `done` close-notes in this file, SDLC-Docs/extracted/, IDEAS.md's audit trail, docs/design/* governed renders, docs/whitepaper, knowledge/, internal/, and the prose plan docs — none assign a tier, and rewriting them would falsify the record. GUARD (4 tests): the vocabularies must AGREE (api vs config — the root cause, and the only one of the four that survives the NEXT vocabulary change); every registered spec carries a live level; the ephemeral ceiling names an unpublishable level; and a token scan over an EXPLICIT 13-file list of live surfaces. The scan names its own scope on purpose — a repo-wide version would either fail forever or create pressure to rewrite history to make it pass, so an explicit list can only be too SMALL, which shows up as a missed sweep. It earned its keep immediately, catching two of my own replacement comments whose line-wrap put the J23 marker on the previous line. Suite 1336 green, ruff check + format clean, tsc + vite build clean. NOT DONE, deliberately: .gitignore still names the real org in an adjacent comment (pre-existing, and half-redacting one line while the next keeps the internal domain would be worse than leaving it) — inboxed separately.
