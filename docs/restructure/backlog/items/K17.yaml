  Every section A-G is ticked or explicitly deferred with a reason, transcribed to config/gate-log.md under a slug-named heading (the J28 classifier reads the heading), and the gate's status flips from awaiting-sme. The six open questions Q0-Q6 are answered by the directory owner or recorded as still-open with the consequence of each stated. §G3 produces an explicit ruling on the K2 FID tier — it is a change to a SIGNED gate (seal-attribution-match-policy), so the outcome is either a recorded amendment to that gate or an explicit decision to leave the tier unfilled. Any vocabulary entry the gate confirms is registered status: planned (the K2 flips-are-follow-ups pattern) with its build groomed as a follow-up item; NO loader is built and NO pull is taken inside this item.
notes: |
  Groomed 2026-08-05 (desktop). model: fable — this decides identity keys, edge meaning, and the correction of a signed gate. WHY IT MATTERS BEYOND ITS OWN SCOPE: TierReconcilers.fid (drydocs/loaders/seal_attribution.py) has been an empty dict since the K2 build, so the signed precedence order SEAL > FID > APP_NAME > ALIAS has never had a working second tier. §G, added on live SME evidence 2026-08-05, is why this is not a simple "fill the table" job: a run-as account is REGISTERED to the platform application while its jobs are ATTRIBUTED elsewhere, so filling the tier as originally specified would resolve a job to the account's owning application and CONTRADICT a confirmed app-code mapping. The tier is harmless today only because the table is empty. TWO SME INPUTS RECORDED 2026-08-07 (laptop) — DIRECTION, NOT RULINGS. Neither ticks a clause; both constrain what the session may say, in the D3-SME-INPUT idiom G22 used. (1) EVERY FID CARRIES AT LEAST TWO HUMAN OWNERS. Three consequences. (a) The rule is a GRAPH TEST, never a constraint — minimum cardinality is not expressible in Neo4j, and the gate log already settled this twice ("NEVER a uniqueness constraint - graph-TEST instead (the TOM-roles lesson)"; "Neo4j cannot declare relationship cardinality any more than it could declare the TOM-roles singleton"). (b) IT HAS NOTHING TO ATTACH TO YET: doc 09's phase list models account -> APPLICATION (phase 4, BELONGS_TO_APPLICATION {role: service_account}) and NEVER account -> PERSON, so a rule about human owners has no edge. That gap is this gate's to rule, and it must not be swept into doc 09's standing deferral of CONTACT columns (support owners, teams, mailboxes -> email-dl-contact-point): owner-of-record is the accountability fact the directory exists to assert, not a contact point. (c) The census already MEASURES compliance — accounts_below_owner_minimum, kept separate from accounts_with_no_owner_recorded so an unmeasurable estate is never reported as a compliant one. (2) THE ORACLE TABLE IS AN ALTERNATIVE SOURCE FOR THE FID — and this is a THIRD answer to §Q3, which asks only "is the export the only pull mechanism, or is there an API?". Not an export, not an API: a replica already in scope whose confidential surface is already assessed. The distinction the session must hold: Oracle supplies the FID VALUE (CM_DEF_VJOB.OWNER, which the psgmgr ledger records as "run-as tenant Functional ID (service identity, not a person); also the :run_as scope-bind (exact match)"), but NOT the FID RECORD — it carries no type, no status and no application assignment, which are exactly the columns §D2's clause (c) breaks down by and Q0 compares against. So Oracle can source demand set (i); it CANNOT substitute for the directory extract, and if it did the census would report 100% coverage while measuring nothing. The upside worth recording: sourcing (i) from Oracle means the only thing crossing the boundary is the directory extract filtered to accounts already named, which is the smallest confidential surface available and is the argument doc 09 makes for demand-driven scope in the first place. SME INPUT (2) IS NOW PARTLY FALSIFIED — 2026-08-12, and the correction is the point. It recorded that Oracle supplies the FID VALUE but NOT the FID RECORD, because it 'carries no type, no status and no application assignment'. That is true of CM_DEF_VJOB — the Control-M job table — and was generalized from it to 'Oracle'. `psgmgr.HR_PHONE_EXP` carries ALL THREE: EMP_TYP_CD (type, 'FCT' for functional), EMP_STATUS_CD (status), CALC_LOB_NAME (LOB). So Oracle can source the RECORD as well as the value, the §D2 census runs inside one schema, and Q3 is answered with an option it did not offer. The half that still stands: the directory being reachable says nothing about whether its assignment AGREES with Control-M attribution — Q0/Q4 and the whole §G reading are untouched. THE account->PERSON GAP HAS A COLUMN NOW. Input (1)(b) said the two-human-owners rule 'has nothing to attach to yet' because doc 09 models account->APPLICATION and never account->PERSON. EMP_MGRS_ID is the FID's owner, and the SME states that owner RECERTIFIES ANNUALLY — so ownership arrives already as-of, with a stated cadence, which is exactly §B's subject. Raised as Q7. It must NOT be swept into doc 09's contact-column deferral: a recertifying manager is accountability, not a contact point, and input (1)(b) already drew that line. SEPARATE SURFACE, DO NOT CONFLATE: the SME also showed a FID MANAGEMENT TOOL (not the Oracle table) whose record carries a Seal id + seal status, a functional TYPE of Application|Component, support team/email/queue, and OWNER ROLES drawn from the SAME TOM vocabulary as the G35 register (the SEAL* role codes). Two consequences: the FID record and the application TOM register share a role vocabulary, which G70's register seeding should know; and the support team/email/queue columns are precisely §D3's 'OUT for now' set that belongs to email-dl-contact-point. The tool is a THIRD surface beside the table and the export — its columns are not evidence of what HR_PHONE_EXP projects. SESSION MATERIALS (added 2026-08-19, desktop) — what the gate runner needs IN FRONT OF THEM, and where it physically is. The evidence captures are DESKTOP-LOCAL files under the data root (DRYDOCS_DATA_ROOT, subfolder fid/screenshots/, 15 files as of 2026-08-19) — they carry real account names, folder/job names, a server, paths, emails and SIDs, so they are NOT in this repo and NOT on the laptop; running the gate from another machine means carrying them over or re-capturing. THE ONE TO HAVE OPEN is the folder-variables capture (a live legacy-LOB folder's definition view): one screen is simultaneously the evidence for THREE decisions this gate touches — (1) §G / K25: the job-grain run_as class split, the FileWatcher on the platform account beside a folder default on the application account; (2) the G68 identity census target: the (job type, run_as) pairs the profile should surface; (3) Idea-140: the folder variables (interface name, source-system code, package id) that are the candidate identity-grade parameters for Informatica lineage, since the invoked wrappers are generic. One ruling wearing three hats — the SME should see it once, not be asked three times. ALSO AT HAND: doc 09's "Two sources, two grains" section + its worked example (the repo-safe narration of those captures), the sibling by-application listing captures (the 555/500/209/59 totals), the HR-extract profile capture (the 171-way name), and knowledge/standards/technology/ functional-id-concepts.md for the ownership-role and succession doctrine §B leans on. Everything decision-shaped stays with this gate; the captures are evidence, not exhibits to commit. SESSION SQL (added 2026-08-19, same session): doc 09 now carries five generic psgmgr queries (its "Session SQL" section) that put numbers in front of the gate's measurable halves — S1 the weighted run-as demand set (§D), S2 run-as class x job type (§G/K25), S3 the platform-account breadth signature (the §D/§G recognition question answered by ranking rather than name heuristics), S4 the per-owner application-code spread (the Control-M half of the §Q0/§G5 disagreement join), S5 the personal-vs-service owner-shape triage (§Q5). Run them where the replica lives, counts only; definition grain only, and OWNER is MIXED CASE at rest (corrected in-session 2026-08-19, round 2) so the directory-name join normalizes case on both sides.
