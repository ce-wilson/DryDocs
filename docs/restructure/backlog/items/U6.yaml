notes: |
  Groomed 2026-07-28 from the U1/U2 "one fix, three symptoms" IDEAS line, confirmed live by the graph-navigation benchmark (graph said 0 cross-root drydocs->drydocs_core imports vs grep's true 24). The work splits across two repos: (a)+(b) are import-resolution changes in the EXTERNAL depgraph tool (local at C:/coding/projects/depgraph, own git history — invoked by snapshot.ps1 as python -m depgraph.cli scan); (c) is a one-line target-list edit in snapshot.ps1. Module graph-infra chosen over docs: the snapshot pipeline feeds the graph, it is not process prose. Unblocks U4 (re-sequenced onto this item) and makes graph-first agent navigation safe (see the companion IDEAS line, still inboxed). Verify with tests/integration + the live drydocs db; the IMPORTS caveat (gate D2 — never read an edge as breaks-if-removed) still applies after the fix. CLOSED 2026-07-28 same day (built + verified live): root cause was ONE defect — scan() ran each root in isolation, so absolute imports naming a sibling root (cross-root) OR the file's own package dir (the function-level neo4j_client case) never resolved; ast.walk was never the problem. Fix = shared-namespace extract_many in the depgraph repo (python_imports.py + scan(); 7 regression tests, committed on its feat/controlm-lineage branch) + drydocs_api added to snapshot.ps1 targets. Live acceptance all four clauses: (a) 24 modules / 49 edges drydocs->drydocs_core, matching grep module-for-module; (b) neo4j_client->cypher_split edge present; (c) 11 drydocs_api :CodeModule; (d) orphan re-run = ONLY tests/* files (pytest entry points) — all 24 U1 false positives now have importers. Snapshot drydocs-20260728-0848.json: 205 modules, 370 IMPORTS (was 194/105), still 0 cycles; layering clean (zero drydocs_core->upward edges) — A1 is now answerable from the graph.
