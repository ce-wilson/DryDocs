id: Z8
epic: server-location
title: 'The Z1/Z3 and Z5 sample files were each built correctly and never meet, so the bundled demo can
  only ever fill one of the map''s three dimensions — make the three fixtures interlock'
type: task
module: drydocs-load
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- tests/fixtures/
- config/taxonomy/
- tests/integration/test_server_inventory_e2e.py
acceptance: |
  Running the bundled samples end to end draws a map with all three dimensions populated — servers placed, jobs joined, teams attributed — instead of a correct coverage report over an empty world.

  (a) SERVERS: one gazetteer row. The Z3 export fixture uses the synthetic cities Sampleville and Modelton; the Z5 gazetteer seeded Sampleville and Otherton. Two items independently invented a second synthetic city and picked different names, so 2 of 5 rows resolve to nothing. Adding the missing city is pure classification — no edge meaning, no gate.

  (b) JOBS: the host names must be able to meet. The Control-M sample hosts are host-hldm-02/03 and host-auto-01/02; the server export names srv-synth-01..03 and srv-synth-51/52, so under the signed T1 exact and T2 normalized-short-name tiers those two sets can never join and the resolution pass correctly reports 4 of 4 UNMATCHED. THE TIERS ARE NOT TOUCHED — they are gate-signed and they are not the defect. The fixtures are aligned to each other instead.

  (c) TEAMS: the export names business application 70055 and the graph carries 70051-70053. The technology-port leg is MATCH-only by gate ruling, so it correctly minted nothing and counted apps_unmatched 1. Again the fixture moves, never the ruling.

  (d) THE E2E MOVES WITH THEM. tests/integration/test_server_inventory_e2e.py seeds its own ExecutionHost to prove the T1 tier; its seeded host is updated to the aligned name so the test still proves the tier rather than accidentally proving the fixture.

  (e) THE REPORTING PATH KEEPS ITS OWN COVERAGE. At least one deliberate, commented non-match survives in the fixtures, so the coverage counters are still exercised. The point of this item is that today the samples exercise ONLY the reporting path and never the success path; swapping which one is untested would be no better.

  Cheapest order, and the order to work in: gazetteer row, then host names, then the app id. Verified live with the venue named (machine, container, database): the full chain loads and the Locations tab draws servers, jobs and teams. poetry run pytest -q green.
notes: |
  Groomed 2026-08-28 (ui-workstream worktree) from Idea-193 (2026-08-27, prio proposed Med), found by running the whole Z3 chain on the desktop for the first time (neo4jtest, drydocs DB) to see why the Locations tab drew nothing. The chain itself is fine: constraints applied, the infrastructure supplement verified 6/6, the loader took 5 rows and 0 rejected first try, and its coverage counters reported every gap honestly rather than hiding one. Every gap is in how the three sample files reference each other.

  A CORRECTION FROM THE CAPTURE IS CARRIED FORWARD so it is not re-derived: the T1 tier IS proven by the e2e, which seeds its own matching host. What no sample proves is the DEMO path, where the Control-M sample's hosts meet the server export without a test seeding the join for them.

  Related: the Z5 index defect fixed the same day (ae740be5) was load-bearing here — with it unfixed, all five servers would have been unplaceable and a successful load would still have drawn an empty world.

  Module drydocs-load rather than drydocs-web: every change is to fixture and taxonomy data the loader reads, and the map surface is only where the absence shows.

  CLOSED 2026-09-05 (laptop, Lane B, wip/Z8-laptop). (a) location-gazetteer.yaml gains syn-modelton; Otherton STAYS, because resolve.test.ts and the Z9 drill-down card are written against it and an uncited row in a lookup table costs nothing. (b) + (c) the export fixture now names the Control-M sample's own hosts and application 70002 — the tiers and the MATCH-only app leg were never touched, both being gate-signed and neither being the defect. 70002 rather than one of 70051-70053: (c) named those because the graph carries them, but they arrive from pat and carry no Control-M folder, whereas 70002 comes from the bundled SEAL sample AND owns folder PRARAG-HLDM-70002-PEX-RFND-DLY, whose jobs run on exactly these hosts — one coherent application instead of three unrelated ones, and it satisfies "an application the graph carries" either way. (d) the e2e's seeds moved with the fixture (host-hldm-02 exact, HOST-HLDM-03.corp.example normalized) and a note says what that test does NOT prove: seeding a matching host proves the TIER, and did so equally well when the fixture matched nothing. (e) the AUTO family's hosts stay outside the export for the truest reason a per-application feed can have — that application's file is not bundled — and both halves are pinned by two new tests in tests/unit/test_server_inventory_fixture.py, which is where a comment goes when the artifact is a CSV.

  VERIFIED LIVE — laptop, container neo4jtest, database z8demo (a fresh database: this laptop's drydocs DB still carries the 4 pre-cutover BusinessApplication nodes with null app_id, so it is not a clean venue). Chain: bootstrap, apply-supplements, refresh-catalog/applications/teams, ingest-controlm, load-folder-attribution, load-server-inventory, all on the bundled samples. map.server-locations.v1 5 rows / 5 placeable against the committed gazetteer artifact (was 3 of 5); map.job-locations.v1 11 rows / 11 placeable (was 0); server_resolution matched_exact 2, unmatched 2 (was 0 and 4); inventory_coverage apps_unmatched 0 (was 1). The e2e is green and idempotent on a throwaway EE testcontainer (2 passed). Unit suite 3279 passed.

  TEAMS IS STILL 0 ROWS, AND NOT FOR A REASON THIS ITEM'S INPUTS CAN REACH — handed to Z7, whose inputs do reach it. map.team-locations.v1 needs one application to hold BOTH a DevTeam edge and an attributed folder, and neither leg is there: no folder is attributed to anything (apps with an attributed folder = none), because load-folder-attribution's K2 fallback wants an STG_APP_FACT feed that no sample supplies and the authored store config/overrides/app-code-mappings.csv is header-only, so the verb can only run --no-fallback and reports 8 of 8 folders unmatched; and even once attributed, the pat sample's teams sit on 70051-70053 while every Control-M folder carries 70002 / 70011 / 70012 / 70021 / 70022 / 70031 / 70041, which share nothing. Both fixes live in drydocs/data/samples and config/overrides — Z7's inputs, and Z7's acceptance already names the verb. Note the (c) heading in this item's acceptance reads TEAMS but the export's owning application never feeds the team spec at all: that traversal is app to batch port to folder to job to host to server, and the server's owning application is not on it. What (c) actually fixes is the technology-port leg's apps_unmatched counter, which it does.

  ONE FINDING FOR THE INBOX (Lane B does not write IDEAS.md): the J8 skip-guard policy is file-level and treats any drydocs/data/ reference as a gitignored local asset, but drydocs/data/samples/*.csv are TRACKED inside that ignored tree, so a test that reads a bundled sample is flagged for a guard it does not need. Handled here with a real per-test existence guard rather than a formality — it never fires today and it keeps the file's other assertions running — but the policy could tell tracked paths from untracked ones with git ls-files, the way _is_prose already carves out the mention-versus-read case.
