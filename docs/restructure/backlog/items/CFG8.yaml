acceptance: |
  A drafted page, config/gate-prompts/source-descriptor-axes.yaml, that decides nothing: (a) are
  acquisition, format, authority, layer and access the right five (the TDD's question 1);
  (b) the HOME and DERIVATION of wired with both options at equal weight - a registry field (the
  row is per-entry; the field needs its own per_side_fields entry and the entry_rule names it) or a
  descriptor axis (the descriptor row keys only overrides and synthetic.datasets, so a wired block
  ALSO needs a per_side_fields entry: per-entry is not per-side) - in both cases DECLARED per side
  with a written reason when false, REFUSED otherwise, and derivation offered only behind a
  load-component seam because core cannot see loader registration; B1's single-field alternative
  stated with O90's shipped wiring cross as its evidence; the precedent for a per-side registry fact
  cited (source-registry-v2 D2's per-side loader overlay, ruled 2026-07-31); (c) do axis values reach
  the graph (routed to the ontology gate if yes); (d) informational: xlsx joins format as a
  classification change; (e) the DataHub emission publishes confirmed as a catalog property today, so
  the sign settles what the tag means. It does NOT re-ask whether a catalog is adopted
  (snowflake-data-catalog is that page, deferred). Validator green; its run item exists.
