id: N28
epic: source-column-mappings
title: A manifest records how much a source is trusted and never how the bytes were obtained - add a declared
  capture rung beside the trust axis, with no unlabeled default
type: task
module: config
phase: 11
agent: main
model: fable
priority: p2
status: todo
depends_on: []
inputs:
- config/source-registry.yaml
- config/classification.yaml
- PUBLISH-BOUNDARY.md
acceptance: |
  (a) DECLARE THE VOCABULARY - five rungs, as a declared enum in config, not as prose: (1) a
  machine-readable spec or bulk export, the served document itself byte-for-byte; (2) an
  authenticated API call you make yourself, same data one object at a time; (3) saved HTML or a
  rendered DOM, structure survives as markup and is often incomplete for a single-page app;
  (4) print-to-PDF plus layout-mode text extraction, position survives and semantics do not;
  (5) copy/paste as text, which loses indentation, required markers and anything held in glyph
  position.

  (b) THE FIELD: capture_rung on the source-registry entry (and on a research log's evidence
  slots where those exist), with the SAME default-deny discipline the classification label has -
  no unlabeled default, enforced by the registry's own validator the way
  tests/unit/test_classification.py enforces classification.

  (c) THE AXES ARE ORTHOGONAL AND THE ITEM MUST SAY SO IN THE CONFIG COMMENT: trust
  (VERBATIM/GROUNDED/SYNTHESIZED, in the SOURCE-MANIFEST) says how much interpretation sits
  between the source and the claim; the rung says how the BYTES were obtained. A fact read from a
  served OpenAPI document and the same fact read off a printed rendering can both be VERBATIM
  while one is a single request and the other is a parsing project that silently drops whatever
  did not render.

  (d) THE RUNG IS A PRIOR, NOT A VERDICT - record this beside the enum, because it is the
  non-obvious half. A lower rung can beat a higher one: observed case, a print-to-PDF came back
  text-bearing and looked like the better capture, but the page's central table had rendered as
  an IMAGE, so its rows were absent from the extracted text while the copy/paste of the same page
  preserved every row. Check what a capture CONTAINS before ranking it; the loss is silent when
  the rest of the page extracts cleanly.

  (e) THE OPERATING RULE, one line in the guidance: work DOWN only until something answers, and
  never start below rung 3 without checking above it.

  (f) MIGRATION IS BOUNDED AND STATED: existing entries get a rung where it is KNOWN from their
  own record. Where it is not known, the value is the declared unknown member of the enum, not a
  guess - and unknown is a task rather than a silent gap, which is half the value of the field.

  (g) OUT OF SCOPE: the probe procedure stays prose. Nothing here enforces how a capture is
  attempted, only how it is RECORDED.
notes: |
  Groomed 2026-09-02 from Idea-233 (desktop, backlog-groomer fork). Surfaced 2026-08-31 from a
  company-side research-template review; the transcription is machine-local and Internal, and the
  ladder itself is mechanism carrying nothing company-specific.

  WHAT IT PAYS FOR: the failure it prevents is scraping a rendering when the source was one
  request away, and that failure is invisible after the fact - the transcript of a rung-4 capture
  looks exactly as authoritative as a rung-1 one. Recording the rung makes a finding's cost
  legible without re-deriving its provenance.

  RELATION TO THE STANDING IMAGE RULE, and it is why this is not just method prose: this repo
  already holds that a rendering may inform a reading and may not be the citation. The ladder says
  the same thing with a gradient instead of a boundary, and adds the exception that boundary
  lacks - a rendering is worth capturing when it shows RELATIONSHIPS a flat export only shows as
  columns (which row is a definition and which an execution, which value is an alias and which
  resolved from it). Capture it to understand the export; assert only from the export.

  MODEL fable because (b) is a schema decision on a registry every loader reads, and (f) decides
  what an unlabeled existing entry becomes. Related: N26, J23, the classification layer.
