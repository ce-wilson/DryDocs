acceptance: |
  (a) An ADR (the core report nominates the title "the graph driver seam") that names the three
  driver implementations, what each does that the others do not (read mode, notification capture,
  timeouts), and RULES whether drydocs_api and agents/common/neo4j_tool.py adopt the core client or
  stay separate on purpose. (b) Neo4jClient.run gains a read-access path (execute_read) beside the
  write path, and stops discarding the driver's result summary (the 2026-08-20 four-warnings
  incident is the motivating case). (c) Nothing in the API or the agents changes until the ADR is
  accepted; the ADR's action items own those moves.
