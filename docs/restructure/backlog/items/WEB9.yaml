id: WEB9
epic: web-console
title: Credential propagation to the agent tier - the drydocs-api bearer token leaves the Ask message
  body and rides a header, a short-TTL exchange token or a session id, so no credential lands in an agent
  transcript
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- docs/reviews/modules/web-2026-09-05.md
- web/src/ask/askApi.ts
- web/src/lib/adk.ts
- web/src/lib/auth.ts
- agents/graph_qa/agent.py
- drydocs_api/app.py
acceptance: |
  The Ask spoke sends the console's live drydocs-api bearer token INSIDE a message part
  (`controlPart(apiToken, apiUrl)` -> `{ drydocs_control: { api_token, api_url } }`), cross-origin,
  to an agent server with no authentication of its own, on every turn (S2). Message content is
  what agent frameworks persist, replay and log, so the credential inherits the transcript's
  retention. The requirement - the agent registers ephemeral specs owned by this session - is
  legitimate; the CARRIER is the finding.

  GATE-BOUND. This item drafts the ruling and builds after it:

  (a) An ADR (or a rider on ADR 0005) rules what carries session identity across the origin
      boundary and what may never appear in a transcript, choosing among: an Authorization
      header on the ADK call; a single-use exchange token minted by drydocs-api for the agent
      with a short TTL scoped to ephemeral-spec registration; or the agent holding its own
      credential and the console passing only a session id. The draft states the blast radius
      honestly (short-lived, read-only token) so the ruling is proportionate.
  (b) After the ruling: no credential appears in any message part; a test over askApi asserts
      the request body contains no token, and the agent side reads identity from the ruled
      carrier only.
  (c) Existing persisted ADK sessions that carry a token part are addressed by the ruling
      (purge, expire, or record why not) - the item does not decide this.
notes: |
  Minted 2026-09-05 by the secondary review of the slot 9 web report (docs/reviews/module-review-sweep-plan-review-2026-09-05.md, part B), from the three-pass lens review of web/ run the same day (report: docs/reviews/modules/web-2026-09-05.md). Every count below was re-measured on main at bcae4d02 before this item was written.

  Covers S2 (rank 3). ADR CANDIDATE: "credential propagation to the agent tier." Spans
  drydocs-web and agents/; minted in the WEB series because the console is where the token
  leaves the trust boundary, and the item names the agent-side inputs. Nothing here writes the
  graph, so the gate is the ADR review, not the ontology gate.

  DONE 2026-09-06 (desktop, Lane A). (a) ADR 0019 drafted PROPOSED (41ab34cf) with the three
  carriers costed and the blast radius stated; the user RULED option C the same day (e755274b):
  the agent holds its own credential (the existing DRYDOCS_AGENT_REG_KEY) and the console passes
  only a public session handle. (b) Built on wip/WEB9-desktop (J31, pushed at the first edit)
  and merged --no-ff as one unit (de6cb614): drydocs_api mints Session.session_id beside the
  token and returns it from /login; POST /specs/ephemeral takes owner_session, the store is
  keyed (session_id, ref), run/export map the bearer to its handle after authenticating, and
  the audit actor is the hashed handle on every route so registration and run lines join on
  one value; the agent sends owner_session and reads control.get("session_id"); the console
  stores sessionId, exposes getSessionId and no token accessor at all, and
  controlPart(sessionId, apiUrl) carries {session_id, api_url}. The clause (b) test is
  web/src/ask/askApi.test.ts (no token field or value in the part) plus the redaction suite
  pinning that a session_id part is stored as sent; api_token STAYS in SECRET_CONTROL_FIELDS
  for a stale console build (ADR 0019 D1/D4). (c) Closed by ADR 0019 D4: no further purge, the
  R23 record stands. Verified: 3398 unit passed / 13 skipped (the round-trip guard now skips
  on a branch past its fork point, see 77cae33a), the 9 stub-ADK wiring tests RUN here for the
  first time (the httpx importorskip was stale against the httpx2 the api group ships),
  tsc -b clean, oxlint clean, 338 vitest passed, dump_openapi --check clean. Relay for the next
  roll: control field api_token -> session_id, body owner_token -> owner_session, LoginOut
  gains session_id; docs/port/port-prompt.md still names api_token.
