id: O23
epic: web-console
title: 'HITL gate session: rollup-shape review — define the canonical rollup shape per UI scenario against
  the vocabulary'
type: requirement
module: drydocs-web
phase: 12
agent: main
model: fable
priority: p2
status: todo
depends_on:
- O15
inputs:
- drydocs_core/schema/schema_graph.cypher
- web/src/ownership/demoOwnership.ts
- web/src/ownership/assetSearch.ts
- docs/restructure/03-hitl-sme-flow.md
- config/gate-log.md
acceptance: |
  A HITL gate session defines THE rollup shape for each UI scenario that renders one (ownership K4 rollup, asset-path source→target, mappings attribution views, lineage rollups as they land): for each scenario the gate records the exact node kinds, relationship types, directions, and qualifier properties (role, status active/planned) drawn from the schema_graph vocabulary — no UI may render a relationship type or direction that is not in the vocabulary, and planned-status edges must be visibly marked as planned. Decisions land in config/gate-log.md; every demo/mock dataset in web/src is then reconciled to the ruled shapes (the 2026-07-21 drift found in demoOwnership.ts — HAS_PRODUCT skipping ProductLine, ALIGNED/DEVELOPS invented types, SUPPORTS direction — is the motivating example; a hotfix aligned the mock same day, but the per-scenario ruling is the gate's job, not the hotfix's).
notes: |
  User-requested 2026-07-21: "Rollup Shape review, it needs to be defined for each scenario with HITL gate." The standing rule this gate encodes: mock data may invent VALUES, never RELATIONSHIP SEMANTICS — labels, node kinds, edge types, and directions always reflect current schema state so the demo teaches the true shape.
