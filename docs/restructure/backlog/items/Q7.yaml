id: Q7
epic: docmeta
title: 'Reconcile the doc-source registry against what is actually loaded: per-corpus declared / loaded
  / stale / missing status'
type: task
module: drydocs-load
phase: 14
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- config/doc-source-registry.yaml
- drydocs/cli.py
- drydocs_core/schema/provisioning/01_databases.cypher
- tests/unit/test_doc_registry.py
acceptance: |
  A `drydocs docs-verify` (name at implementer's discretion) reports one row per config/doc-source-registry.yaml entry: the declared target_db, whether that corpus is present in that database, its loaded Document/Chunk counts, and a status of loaded | missing | stale | wrong-db. `stale` = the registry's recorded sha256/captured_at no longer matches what the graph carries (the ADR 0006 §4 gate-preserving freshness rule); `wrong-db` = the corpus is present in a database OTHER than its declared target_db. Exits non-zero on any wrong-db row. Covers every corpus kind the registry admits — scraped web pages, filedrop PDFs, .msg/email extracts — because the check is registry- driven, not per-loader. A unit test drives it against a fake client.
notes: |
  DONE 2026-08-01 (laptop, concurrent with a desktop R-epic session — claimed in a module that session was not touching). `drydocs docs-verify` + drydocs/docs_verify.py (pure; `run(database, cypher, params)` is the only I/O seam) + 16 offline tests. Suite 1330. . THE DESIGN PROBLEM THE ITEM DID NOT KNOW ABOUT: the registry is corpus-keyed and THE GRAPH IS NOT. Only the Q13 vendor-docs loader writes `corpus_id`; bmc_docs identifies pages by repo-relative `path` and essential_graphrag writes one Document whose `doc_id` IS the corpus id. A "registry-driven, not per-loader" check (the acceptance's own words) is therefore impossible unless the registry says HOW to find each corpus — so every entry now carries `graph_locator: {match: corpus_id|doc_id|path_prefix|none, value: ...}`, guarded by a new test_doc_registry case. Teaching the verifier three loader shapes instead would have made it a per-loader registry that rots silently. . SIX STATUSES, NOT THE FOUR NAMED — two live situations cannot be described by loaded|missing|stale|wrong-db, and calling either "missing" would be a FALSE diagnosis: (a) `db-absent` — bmc-docs and bmc-controlm-utilities declare target_db `dddocs`, which schema/provisioning/01_databases.cypher HAS NEVER CREATED (it makes drydocs, ddlineage, ddcontext, ddall). That is not a load failure, it is G32's open topology ruling, so it reports and does not fail. (b) `unshaped` — jpmc-reports loaded as :DataAsset slices, never on the Document->Chunk spine; its documents are not missing, they were never documents. Only wrong-db exits non-zero, per the acceptance. . LIVE RUN — laptop, container `neo4jtest` (localhost:7687), 2026-08-01: 2 db-absent (both dddocs entries) · 1 loaded (essential-graphrag in ddcontext, 1 Document / 43 Chunks) · 2 unshaped. Exit 0. NOTE THE MACHINE: bmc-docs reports "not found in any existing database either" HERE, which is a statement about this laptop's graph, not about the corpus — the two machines hold separate graphs and git syncs neither. . Two accuracy defects in the first cut, both caught by reading the live output rather than the tests: `unshaped` said "no graph_locator declared" for entries that declared `match: none` on purpose (a ruling read as a silence), and `db-absent` short-circuited before probing, so it never reported WHERE the corpus actually is — the more useful half. Both fixed; the second is now the difference between "your target is unprovisioned" and "...and it is sitting in drydocs meanwhile". . Freshness is never silently reported as fresh: the older loaders write no captured_at, and the row says "uncheckable" rather than implying a comparison that did not happen. . User-requested 2026-07-26 ("we'll need to have a registry comparison or status to check if it's loaded into the db... scraped pages - pdf - etc"). The gap is real: doc-source-registry.yaml DECLARES corpora and test_doc_registry.py enforces the declaration's shape, but nothing anywhere checks that a declared corpus was ever actually loaded, or that it landed in the database it declared. The `wrong-db` case is the one worth the non-zero exit — it is the G30 failure class at corpus granularity. MODULE CHOICE: drydocs-load, not drydocs-docmeta, because the verb lives in cli.py beside m1-verify/m3-verify and must work BEFORE the docmeta component exists (Q6). Re-home it to docmeta if that component takes over corpus state. Startable now against the corpora that exist today (bmc-docs, essential- graphrag, jpmc-reports); the multi-DB cases arrive with G32.
