acceptance: |
  A `profile()` over a DefinitionSet (so it runs on anything xml_bridge already stages -- NO new parser) returning ONE JSON-serializable FolderSetProfile that answers "what is in this folder set" for a reader who already knows the process. Four censuses, each carrying WHERE-USED rather than bare distinct values, because the SME's next question is always which jobs: (a) SHAPE -- folders, sub-folders, job counts by type (file watcher / placement / trust / other), and the datasets inferred from the sub-folder ladder; (b) IDENTITY -- distinct FID, RUN_AS, SEAL and application values with the jobs carrying each; (c) VARIABLES -- every declared name by scope with its distinct-value count, reference count, and its R30/R31 state inline, so the census and the defect list are one table and not two the reader has to join by hand; (d) CONTACTS -- every EMAIL_DL_* value and every DOMAIL destination found, split by contact kind (support tier vs Production Delay Notification consumer) and labelled documentation-only, since R40 now deletes the block that would have used them; (e) INVOCATIONS (merged from Idea-140, 2026-08-19) -- distinct invoked script paths derived from cmd_line, each with its JOB FAN-OUT (how many jobs share the wrapper) and, for every SHARED wrapper, which parameters/variables VARY per job -- the identity-grade candidates. Motivation: on the Informatica platform the invoked .ksh wrappers are the same generic few for ALL business applications (SME 2026-08-19), so script-path identity distinguishes nothing, and the G12 wrapper-payload family (Ab Initio/DPL: kind-scoped token, path never identity) likely needs a third kind -- WHICH parameter is the token is a LINEAGE-GATE ruling this census must inform, never make. A wrapper with fan-out 1 is reported too: one-to-one wrappers are the evidence that script-path identity IS sufficient for that kind, which is as decision-relevant as the converse. Then the half the census cannot produce: a SUBSTITUTION SLOT list -- the facts the XML does not carry and only the SME can supply (DEVX_KEY, the MFTS set FTS_ID / REC_ID / USER / DELIVERY_MECHANISM, EMAIL_DL_L2 / L3 / PDN, SOURCE_CONTACT). Each slot names its current value or records it ABSENT, its vocabulary or shape rule from the guidelines page, and the jobs it would apply to. A slot with no current value is "not supplied", NEVER a default: inventing one is how a proposal becomes a wrong fact nobody re-checks. The profile ASSERTS NOTHING about meaning -- it is a census, findings stay detect_all()'s output and ride alongside, and nothing here ratifies or writes a graph (the module's standing invariant). Committed fixtures are synthetic, since real FIDs, SEALs and DLs are Internal. The TRANSPORT is named in the item's commit rather than defaulted, per the O58 precedent: a CLI verb writing a JSON artifact is the recommended first pass, because remediation writes no graph (so QuerySpecs are out by construction) and no upload path exists yet -- but if an API endpoint is chosen instead, the commit body records the choice and its cost against ADR 0005.
notes: |
  Raised 2026-08-11 on SME direction, as the read half of the remediation loop the SME calls the bulk of the project's intent: read the Control-M estate (database primary, XML secondary), map the flow, and the first pass is already enough to generate the Excel runbook -- .claude/skills/controlm-runbook-automation-excel consumes the same facts, so this profile is a feed for it and not a parallel one. WHY A PROFILE AND NOT A REPORT: the SME is assumed to KNOW the process. What they cannot see is what the XML actually says -- which FIDs are in play, which variable names really exist and at what scope, which contacts are carried. Show them that, and they can supply the DEVX_KEY, the MFTS routes and the contacts that get substituted in. That division -- machine reports what IS, SME supplies what is NOT THERE -- is what keeps this out of the guessing that produced the drift C30 documents. Deliberately NOT in scope: emitting corrected XML. XmlDefinitionFormat.dump() still raises pending the vendor schema, and the profile plus the SME's substitutions are a PROPOSAL, which is what the equivalence proof already consumes.
  EVIDENCE RIDER 2026-08-19 (desktop, the K16 two-source session): the identity census (b) should report run_as BY JOB TYPE, not as a flat distinct list. A live legacy-LOB folder shows the FileWatcher job running as the Control-M platform account while the folder default runs as the application account — job-grain class split that a flat run_as census would blur into "two accounts". The FileWatcher x platform-account pairing is the designed pattern; a payload job on the platform account is the finding. K25 owns the cross-application detection; this profile is where the raw (job type, run_as) pairs surface for an SME. MERGED 2026-08-19 (groom): Idea-140's measurement half became census (e) INVOCATIONS -- the wrapper fan-out and per-wrapper varying-parameter census that tells the lineage gate which parameters are identity-grade on a generic-wrapper platform. The informatica-kind RULING itself stays with the lineage gate (G12's inboxed m3_invokes to_node broadening); this item only measures.
