acceptance: |
  A gate prompt in config/gate-prompts/ puts four questions to the SME with evidence drawn from the LOADED layer-1 spine (real counts, real titles): (a) is a documented utility a new :ControlMUtility label, or an instance of the existing software-registry model — inventing a label for convenience is what CLAUDE.md §1 warns against; (b) DOCUMENTS as a new edge vs reusing the registered :Document->:SoftwareProduct DESCRIBES; (c) whether a vendor's own in-page cross-link is an assertion we carry as SEE_ALSO or merely presentation; (d) the layer-3 estate join (job CMD_LINE -> the page describing its utility) recorded as BLOCKED on G32 with the reason stated. Every proposed term is registered `status: planned` in relationship_vocabulary.yaml with a decision-matrix entry; NOTHING is flipped and no loader writes an edge. The SIGN-OFF is a separate SME session — this item only drafts (the G27 precedent).
notes: |
  Layer 2 of the plan. Depends on Q13 so the gate argues from loaded evidence rather than from a proposal — the pattern that made the K2/P2 gates decidable in one sitting. Layer 3 is deliberately NOT its own item: Q8's close note established that a relationship cannot span Neo4j databases, and ADR 0006 re-targets doc corpora to dddocs while the software registry keeps writing drydocs, so the estate join would silently drop every edge. G32 owns that ruling; this item's job is to record the dependency honestly, not to route around it.
  .
  DONE 2026-08-22 (LAPTOP). Drafted config/gate-prompts/vendor-docs-entity-spine.yaml — 5 sections, 20 confirmations; loads via gate_pages.load_gate_spec and RENDERS (50KB), so it is a usable HITL page. Sections A-D map 1:1 to acceptance (a)-(d); drafting decides nothing (G27/W1/U11/N10), the SIGN-OFF is a separate SME session. TWO ACCEPTANCE PREMISES WERE OVERTAKEN BY EVENTS between grooming and this close, recorded per the Q9 overtaken-not-re-done idiom, acceptance text untouched. (1) THE "LOADED layer-1 spine" EVIDENCE PREMISE IS UNMEETABLE — a chicken-and-egg the acceptance could not see: Q13's close records NO LIVE RUN on either machine (registry confirmed: false + the payload desktop-resident), and per G32's Q6 clause (2026-08-18) the corpus's doc-graph gate is UNSIGNED — a backlog sweep this session found no other item owning it, so THIS gate is that gate, and the spine cannot load until the page it argues for signs. Evidence is therefore capture-grain (registry-transcribed real counts/titles: 1016 docs / 1017 TOC nodes, 258 XML topics, the emdef family) plus the live SIBLING corpus, venue-tagged (laptop, neo4jtest, drydocs DB, 2026-08-22 — J18: 27 DESCRIBES->controlm + 1->neo4j, ZERO utilities-spine nodes, 17/17 sample jobs with cmd_line and zero utility invocations). The prompt states this in its own step/§E1 text rather than papering over it. (2) THE (d) PREMISE — "recorded as BLOCKED on G32" — G32 SIGNED 2026-08-18 (32/32), G102 fold executed, dddocs retired at R1: "the fold made the write legal, not ruled". §D records the dissolution and rules the REAL remaining chain: §A/§B rulings, the §E load, and the CMD_LINE->utility derivation (G14 feed pattern under the G32 §E graph-seeded charter). SECTION E ADDED beyond the four questions, deliberately: the enabling layer-1 confirmation (the unsigned doc-graph gate) — without it the gate's own subject can never load; §E4 keeps the flip a groomed follow-up (flips-are-follow-ups; signing authorizes, never performs