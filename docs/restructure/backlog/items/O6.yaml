acceptance: |
  The console renders a REAL C4/graph view of the knowledge graph against the local EE DB — data through the GraphAccess seam with the api adapter as the default path (dev-mode bolt allowed for the bench, per ADR 0005) — replacing the synthesized drill-down SVGs as the live surface (the synthesized pages stay as the no-backend demo); the rendering-library decision (NVL vs successor) is made and recorded in the item notes or a design doc; payload shaping is server-side (O5's C4 endpoint), not duplicated in the browser; the wf-console-01 wireframe's graph-before-Cypher ordering finding is honored. Build + lint green; runtime-verified against the live DB with DOM/screenshot evidence.
notes: |
  Groomed 2026-07-14 — the remaining O1 build; O1 closes when O3 (decision recorded) and this item land (wireframes committed 2026-07-14 via UI-WIP; build/run docs ride O5). Library choice is a tech pick, not a boundary decision — record it, escalate only if it grows one. RENDERING-LIBRARY DECISION (2026-07-15, recorded per acceptance): d3-force (ISC, ~90KB, layout-only, deterministic — fixed-seed LCG random source) + the in-repo SVG idiom (GraphSvg's visual language, dark tokens, DOM-assertable). NVL deferred, NOT blocked: @neo4j-nvl/react 1.2.0 verified React-19-compatible (peer 18||^19), but it is proprietary-licensed + ~1.25MB WebGL canvas — overkill for the server-capped 200-edge payload and opaque to DOM-level CDP assertions. REVISIT TRIGGER: the V5 explorer's C4 zoom ladder or >200-node scenes.
progress: |
  DONE 2026-07-15 (branch feat/o6-live-graph-view, 298fc55): Graph nav view (both roles, ordered BEFORE Console — the wf-console-01 graph-before-Cypher finding; NO Cypher affordance in the view) renders real WAS_INFORMED_BY edges from the live EE drydocs db. Seam grew runNamed(queryId) -> NamedResult carrying the server-routed database (shown in the LIVE tag); graphApi.ts is the REAL adapter (persona login -> bearer, 401 retry, fails loud); bolt.runNamed throws (no browser-side query-registry fork — payload shaping stays server-side in drydocs_api/queries.py per acceptance). VERIFIED: build+lint green, pytest 652 passed, headless-Edge CDP drive 16/16 against the full live stack — DOM node/edge counts equal the API payload (9 jobs/8 edges), live job names asserted in the SVG DOM, O2/O4 role regressions green; screenshots captured. Environment notes: first live EE bootstrap exposed the APOC comment-';' landmine (fixed on main, 8478204) and the sample-data m3-verify nit (inboxed); synthesized tower pages remain the no-backend demo.
