d not know); (c) base.py's half-landed cite made path-explicit and drydocs_lineage/model.py added to the project-tdd traceability matrix, its test cell naming the two REAL test files that import the model (a first draft cited a nonexistent test_lineage_model.py — caught by checking before commit). STILL OPEN — (a), (b), (d), each research-shaped rather than mechanical: (a) the six pre-squash re-cites need per-cite judgment about WHICH reachable commit each pin means; (b) the sdlc DEP regeneration is regenerate-from-tree, not row patching, per the clause's own instruction; (d) the two S3 falsehoods plus the K8 RIDER restatement are rev-bump surfaces on governed docs and deserve an unhurried pass. Touched docs re-rendered; 2214 passed; ruff clean.
