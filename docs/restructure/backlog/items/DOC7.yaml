priority: p3
status: done
depends_on: []
inputs:
- CLAUDE.md
- .claude/skills/lane-handoff/SKILL.md
acceptance: |
  J31 says when to PUSH a wip/<id>-<machine> branch and nothing says when to DELETE the local
  copy, so a build lane accumulates merged branches that no longer exist on origin - twelve on
  the laptop at the 2026-09-07 Lane B close, none of them on the remote. The Lane A close step
  already deletes the REMOTE branch after the no-ff merge (lane-handoff rule 3), so the remote
  is clean and the local tracking branches are the residue. A stale local wip/ branch reads as
  unmerged work to anyone running the J31 pre-release check from that machine: git branch -r is
  clean, git branch is not, and the rule names the remote form only by luck.

  (a) The lane-handoff close for Lane B gains the sentence: after the sender confirms the
      merge, git fetch --prune, then git branch -d each merged wip/ branch. The -d refuses an
      unmerged branch, which IS the check - never -D.
  (b) The J31 paragraph in CLAUDE.md section 0 names the local form beside the remote one: the
      pre-release check reads the remote (git branch -r --list "wip/<id>-*"), and the local
      branch is deleted once the merge is confirmed.
  (c) Both edits are one sentence each. No script: if the sentence turns out to need one, that
      is a separate item minted then.
notes: |
  DONE on wip/j61-laptop (Lane B, laptop), fourth and last of the section 0 cluster.

  (a) The lane-handoff skill's close step gains the sentence for Lane B: after the sender
  confirms the merge, `git fetch --prune`, then `git branch -d` each merged wip/ branch.
  Never -D, and the reason is written beside it - -d REFUSING an unmerged branch is the
  check, so swapping in -D removes the only safety the step has.

  (b) The J31 paragraph in CLAUDE.md section 0 now names the local form beside the remote
  one: the pre-release check reads the REMOTE (git branch -r --list), and the local branch
  is deleted once the merge is confirmed.

  (c) One sentence each, no script.

  EVIDENCE RE-MEASURED ON THIS MACHINE TODAY rather than taken from the item. The groom
  reported twelve stale local branches at the 2026-09-07 Lane B close. Today the laptop
  carries 29 local wip/ branches against 5 on the remote, and those 5 are exactly this
  burst's (g90, j59, load7, core9, j61) - so 24 are residue from closed lanes. The defect
  has roughly doubled in two days, which is what an accumulating residue does and is worth
  more than the original number.

  NOT DONE HERE, deliberately: the 24 stale branches on this laptop are not deleted by
  this item. Lane A has not confirmed the merges for the current burst, and the whole
  point of the new sentence is that deletion follows confirmation - deleting them while
  writing the rule that says to wait for confirmation would be the wrong first
  demonstration of it. They are the receiving session's cleanup at the close the rule now
  describes.

