notes: |
  Groomed 2026-07-30 from the R5 follow-up [idea]: the R5 session's scratchpad stub proved the wiring live without an agents venv — worth owning instead of re-inventing per session. Re-author from the R5 session record if the scratchpad copy is gone; the design (SSE shape + control part + registration) is documented in the R5 close note.

