title: Two idea captures landed below the audit trail with a non-conforming header and were invisible
  to BOTH IDEAS.md guards
type: bug
module: docs
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- tests/unit/test_plan_ideas.py
- docs/restructure/IDEAS.md
- .claude/skills/groom-backlog/SKILL.md
acceptance: |
  (a) THE GAP. `_inbox_entries()` slices `IDEAS.md` from the `## Inbox` heading to the next `## ` heading, so it never sees a capture filed after the audit-trail heading; `_all_idea_ids()` matches the full header grammar, so it never sees a capture that does not carry it. A capture that is both — appended at the end of the file in an ad-hoc shape — is invisible to the header guard AND to the uniqueness guard at once. A new test in `tests/unit/test_plan_ideas.py` fails on that case: any `Idea-<n>`-shaped capture ANYWHERE in the file that does not conform to the header grammar, or that carries the grammar but sits outside the two known sections, is reported by id and line.

  (b) THE UNIQUENESS SCAN SEES THE SAME SET. Whatever loose pattern (a) uses to find candidate captures also feeds `test_idea_ids_are_unique`, so a duplicate number cannot hide behind a malformed header. This is the union-append case the existing docstring already argues for and does not currently cover.

  (c) NO FALSE POSITIVES ON THE FILE'S OWN PROSE. The capture-format section documents the header shape with a literal `Idea-N` example, and the audit trail cites ids inside sentences. The guard distinguishes a CAPTURE from a CITATION and the test says how, in the docstring, rather than leaving the next reader to infer it from the regex.

  (d) GREEN ON THE TREE AS LEFT BY THE 2026-08-27 GROOM, which relocated the two offending entries into the inbox with conforming headers. The guard must be red against the pre-groom shape and green after — state that check in the close note, because a guard that was never observed failing has not been shown to guard anything.
notes: |
  Groomed 2026-08-27, from the groom run itself. Idea-177 and Idea-178 were appended below `## Recently groomed (audit trail)` on 2026-08-26 in the shape `- **Idea-177 (2026-08-26, desktop):** ...`. `poetry run pytest tests/unit/test_plan_ideas.py -q` was 23-passed green over both of them, and this groom found them only because a commit message named an id the inbox scan did not return.

  Second instance, which is why it earns an item rather than a fix in place. Idea-170 records the identical failure company-side (a capture that landed with no id at all, minted only after the user asked where it was) and quotes the existing docstring's own reasoning: "the entry simply does not appear in the scan, which reads as 'nothing to review here' rather than as a formatting slip". That is precisely what happened here, on the producer side, with all four guards green.

  Epic project-board / module docs / phase 8: `test_plan_ideas.py` guards the capture loop that I1-I4 built, and I3 is the groom skill that reads the file. The release-infrastructure lane was the other plausible home and is the wrong one — nothing here is about releasing.
  DONE 2026-09-08 (desktop, Lane A).
  (a) tests/unit/test_plan_ideas.py gains _CANDIDATE, the loose net: a list item whose
      leading bold token opens with an Idea id, backticked or not, so both
      `- **`Idea-177`** ·` and `- **Idea-177 (2026-08-26, desktop):**` are candidates.
      _capture_candidates(text) walks the WHOLE file tracking the `## ` heading each
      candidate sits under; _misfiled_captures(text) holds _HEADER against every catch
      and requires the section to be `## Inbox` or `## Recently groomed (audit trail)`,
      reporting by id and line. test_every_capture_anywhere_conforms_and_sits_in_a_
      capture_section runs it over the live file.
  (b) _all_idea_ids() now returns the ids of that same loose set, so
      test_idea_ids_are_unique (and the band check, which reads the same helper) see a
      capture with a malformed header. The fixture proves it: a second `Idea-2` in the
      ad-hoc shape is reported as a duplicate.
  (c) Capture vs citation is stated in the test docstring and the _CANDIDATE comment: a
      capture is an id at the head of a list item's bold token; a citation is an id
      anywhere else - inside a sentence, in [[...]], after a groom arrow - and is never
      a candidate. The format section's `Idea-N` example has no digits and does not
      match. The fixture carries a [[Idea-1]] citation, an "Idea-2's" inside a sentence
      and the format example, and the guard names none of them.
  (d) Observed RED before green, two ways. test_the_capture_guard_is_red_on_the_pre_
      groom_shape holds a fixture in the c0ae3004 shape (captures appended below the
      audit trail as `- **Idea-N (date, machine):**`, plus a conforming header misfiled
      under a third section) and asserts the exact ids and lines reported. And the
      helpers were run against the real trees: `git show c0ae3004:docs/restructure/
      IDEAS.md` reports Idea-177 at line 5195 and Idea-178 at line 5202 (the two this
      item is about) - and also Idea-165 and Idea-161; `45f4f1e5` (the 2026-08-27 groom)
      reports only Idea-165 and Idea-161.
  THIRD INSTANCE, FOUND BY THE GUARD. Idea-165 and Idea-161 sat in the audit trail with
  status `done (...)`, which is not a status the capture format defines (open, parked,
  groomed, merged, closed); they were groomed into the trail on 2026-08-24 in that shape
  and no guard read the trail's headers. Both now read `closed (...)`, the format's word
  for the same state, dates and machine note kept; docs/plan/ideas.html re-rendered.
  Live file: 309 candidates, 0 misfiled, 0 duplicates.
  Guards: test_plan_ideas (14), test_backlog, test_render_determinism, test_module_boundary,
  test_no_render_parsing, test_source_scan, test_runbook_currency all green; ruff check
  and format --check clean at the 0.5.7 pin.
