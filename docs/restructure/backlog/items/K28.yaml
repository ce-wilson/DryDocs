  (a) THE STALE CLAIM. `drydocs/fid_census.py`'s module docstring opens "Gate ``fid-identity-and-scope`` is DRAFTED AND UNSIGNED". The gate SIGNED OFF 33/33 on 2026-08-19 (config/gate-log.md, K17, which reads done). The docstring states the signed status instead.

  (b) THE REASONING IS KEPT AS HISTORY, NOT DELETED. The sentence exists to explain why the census runs BEFORE the gate — doc 09 section D2's "about two hundred accounts per application" argument. That ordering rationale is still true and still worth reading; it is re-cast as history (the census ran ahead of a gate that has since signed), the same move the K16 company prompt's rider already made about itself. A fix that removes the paragraph loses the reason the module is shaped the way it is.

  (c) THE REST OF THE MODULE IS READ, NOT JUST GREPPED FOR THAT ONE STRING. Any other gate-state, doc-09-phase or K16-status claim in the same file is confirmed against the gate log and doc 09 in the same pass, and the close note lists what was checked and found correct as well as what changed.

  (d) NO BEHAVIOUR CHANGE. Docstrings and comments only — no signature, no field, no test expectation moves. `poetry run pytest tests/unit/test_fid_census.py -q` is green and `ruff format --check` is clean.
