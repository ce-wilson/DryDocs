acceptance: |
  (a) THE RULING IS THE USER'S AND THIS ITEM DOES NOT MAKE IT. PUBLISH-BOUNDARY.md gains
  one sentence saying whether the public push is TIP-ONLY or carries history, and the
  sentence records the choice the user makes. The three options and their consequences are
  in the notes; the item is BLOCKED on that ruling for clause (a) only - clause (b) is
  buildable today either way.

  (b) THE MECHANISM, independent of the ruling: a guard that reads git log --format=%s%b
  for the retired token (read from internal/cdo-reference/README.md, the guard's own
  mapping file - never spelled in the test source, the same way J55 does it) and asserts
  the count against a RECORDED CEILING. Today's measured figure is 34 of 1,816 commits on
  main. A NEW occurrence in a commit message fails; the 34 historical ones do not. It is a
  ceiling, not a sweep.

  (c) SAY IN THE TEST DOCSTRING WHY A CEILING AND NOT ZERO: rewriting history to reach zero
  breaks every reviewed_commit stamp, gate-log sha, port-base tag and PORT-REPORT pin in
  the repo. The number exists to be watched, not driven down.

  (d) J55 IS NOT AMENDED. Its scope - the tracked tree - is correct for a tree guard and
  its docstring already cites 3c2bfcdd naming history as an expected transient survivor.
  This is a second guard on a second surface, and it says so.

  (e) PASS/FAIL: the guard is green at the recorded ceiling, red on a synthetic new
  occurrence (prove it, then remove the synthetic), and PUBLISH-BOUNDARY.md contains the
  word history.
notes: |
  Groomed 2026-09-02 from Idea-240 (desktop, backlog-groomer fork). The idea has a RULING
  half and a MECHANISM half; only the mechanism is groomed here, and the ruling stays in the
  IDEAS inbox as a question for the user - a groom cannot pick between the three.

  THE THREE OPTIONS, recorded so the ruling can be made from this file: (a) the public push
  is TIP-ONLY (squash or orphan commit), history never leaves, one sentence in
  PUBLISH-BOUNDARY.md; (b) the push carries history and the 34 messages are ACCEPTED as an
  allowlisted class with the count and the reason - the acronym in a commit subject
  identifies an org unit, not a person, host or credential, and is arguably below the
  CLAUDE.md section 3 line; (c) history is rewritten with filter-repo on messages only -
  listed to be REJECTED with its reason, not chosen, because it invalidates every sha
  citation in the repo. The idea's own recommendation is (a) if the publish mechanism
  already is tip-only, which is verifiable against the public twin's git rev-list --count,
  otherwise (b).

  PROVENANCE: raised by the company during the D/F apply of port-base-20260826..20260901
  (2026-09-02, relayed session record) - a commit title on their main carries the token, and
  their git rm --cached of the deepdoc scrape removed the blob from the tip while it stays
  reachable in history. They named it a history-rewrite decision, not a tip-level one, and
  left it to the SME. The same decision exists here and had never been written down.

  CLOSED 2026-09-05 (laptop, Lane B, wip/J74-laptop).

  (a) THE RULING IS MADE, BY THE USER, IN SESSION: the public push CARRIES HISTORY, and the 34 are an accepted class. Option (b) of the three. The evidence put in front of the ruling: the count re-measured at 34 of 2,057 commits (the item recorded 34 of 1,816 - the repo grew and the count did not, which is the ceiling behaving before it existed); no public twin remote exists in this clone, only origin = ce-wilson/DryDocs, so there is nothing already published to stay consistent with and the choice was genuinely open; and PUBLISH-BOUNDARY.md's own documented mechanism is a .gitignore for the public remote, which pushes a branch and therefore carries history already. THE ARGUMENT THAT DECIDED IT, and it is not in the item's three options: the published tree CITES SHAS THROUGHOUT - reviewed_commit stamps, the shas inside SIGNED gate-log records, port-base tags, PORT-REPORT pins - so a tip-only push would publish a repo whose every provenance citation dangles. The provenance discipline IS the thing being published; it has to resolve. PUBLISH-BOUNDARY.md now carries that ruling, the 34, the reason they are below the CLAUDE.md section 3 line (the token names an ORG UNIT, never a person, host or credential), and the pointer to the guard.

  (b) THE MECHANISM: tests/unit/test_publish_boundary_history_ceiling.py. Reads git log per commit, counts messages carrying the retired token, asserts against CEILING = 34. The token is never written literally - derived at test time from internal/cdo-reference/README.md, the J55 idiom, so the guard cannot become a place the retired string leaks from. Fail-closed the same way J55 is: internal/ present but the RENAMED note missing is a failure, not a skip, because a guard green and silent on the tree that publishes is worse than no guard.

  AN INSTRUMENT PROBLEM FOUND AND HANDLED (J76 - check the instrument before the subject). CI runs actions/checkout with no fetch-depth, so it clones at depth 1, where git log sees ONE commit and the count comes back near zero: a pass that measured nothing and would sit green forever. The guard detects a shallow clone and SKIPS LOUDLY instead. This is not a weakness of the enforcement point, it is the right one: a commit message cannot be fixed after a push without the very rewrite this ceiling exists to avoid, so the moment to catch it is the pre-push suite on the machine that wrote it. Giving CI fetch-depth: 0 would let it run there too; .github/ is outside this item's inputs and this lane's pens, so that is handed back rather than done.

  A SECOND ASSERTION GUARDS THE GUARD: a ceiling drifting well above the real count silently tolerates new occurrences, so a drop of more than two fails and asks for the number to be re-recorded.

  (c) The docstring says why a ceiling and not zero, in those terms. (d) J55 is untouched, and both files say why they are two guards on two surfaces.

  (e) PROVED, THEN REMOVED. Green at the ceiling. An empty synthetic commit carrying the token - its message built from the token DERIVED at runtime from the mapping file, so the retired string was never typed into any command - took the count to 35 and the guard failed, naming the new sha first in its message. Unwound with git reset --hard back to the exact baseline sha, tree verified clean, guard verified green again. PUBLISH-BOUNDARY.md contains the word history.
