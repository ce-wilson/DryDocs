acceptance: |
  (a) THE RULING IS THE USER'S AND THIS ITEM DOES NOT MAKE IT. PUBLISH-BOUNDARY.md gains
  one sentence saying whether the public push is TIP-ONLY or carries history, and the
  sentence records the choice the user makes. The three options and their consequences are
  in the notes; the item is BLOCKED on that ruling for clause (a) only - clause (b) is
  buildable today either way.

  (b) THE MECHANISM, independent of the ruling: a guard that reads git log --format=%s%b
  for the retired token (read from internal/cdo-reference/README.md, the guard's own
  mapping file - never spelled in the test source, the same way J55 does it) and asserts
  the count against a RECORDED CEILING. Today's measured figure is 34 of 1,816 commits on
  main. A NEW occurrence in a commit message fails; the 34 historical ones do not. It is a
  ceiling, not a sweep.

  (c) SAY IN THE TEST DOCSTRING WHY A CEILING AND NOT ZERO: rewriting history to reach zero
  breaks every reviewed_commit stamp, gate-log sha, port-base tag and PORT-REPORT pin in
  the repo. The number exists to be watched, not driven down.

  (d) J55 IS NOT AMENDED. Its scope - the tracked tree - is correct for a tree guard and
  its docstring already cites 3c2bfcdd naming history as an expected transient survivor.
  This is a second guard on a second surface, and it says so.

  (e) PASS/FAIL: the guard is green at the recorded ceiling, red on a synthetic new
  occurrence (prove it, then remove the synthetic), and PUBLISH-BOUNDARY.md contains the
  word history.
notes: |
  Groomed 2026-09-02 from Idea-240 (desktop, backlog-groomer fork). The idea has a RULING
  half and a MECHANISM half; only the mechanism is groomed here, and the ruling stays in the
  IDEAS inbox as a question for the user - a groom cannot pick between the three.

  THE THREE OPTIONS, recorded so the ruling can be made from this file: (a) the public push
  is TIP-ONLY (squash or orphan commit), history never leaves, one sentence in
  PUBLISH-BOUNDARY.md; (b) the push carries history and the 34 messages are ACCEPTED as an
  allowlisted class with the count and the reason - the acronym in a commit subject
  identifies an org unit, not a person, host or credential, and is arguably below the
  CLAUDE.md section 3 line; (c) history is rewritten with filter-repo on messages only -
  listed to be REJECTED with its reason, not chosen, because it invalidates every sha
  citation in the repo. The idea's own recommendation is (a) if the publish mechanism
  already is tip-only, which is verifiable against the public twin's git rev-list --count,
  otherwise (b).

  PROVENANCE: raised by the company during the D/F apply of port-base-20260826..20260901
  (2026-09-02, relayed session record) - a commit title on their main carries the token, and
  their git rm --cached of the deepdoc scrape removed the blob from the tip while it stays
  reachable in history. They named it a history-rewrite decision, not a tip-level one, and
  left it to the SME. The same decision exists here and had never been written down.
