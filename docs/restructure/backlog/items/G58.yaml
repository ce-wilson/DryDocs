acceptance: |
  The report G22 §E3 named as the usage axis's use case — identifying unused, deprecated code for archival and removal — ships WITH the safety properties the gate ruled, and a test proves each one. (a) COVERAGE IS STATED ON THE REPORT ITSELF, never a footnote. Every run declares its body-copy coverage, and a run over a metadata-only bundle says so in its own output. A test asserts that a report generated from a body-less fixture carries the coverage statement AND that its unreferenced rows read "no CMD_LINE reference" rather than "nothing calls it". (b) THREE DISPOSITIONS, not two, each separately counted: genuinely dead (archive and remove), MISDEPLOYED (relocate, never delete — §E1's caveat that a script may have been deployed to the wrong server), and unreferenced-but-dynamically-called (keep). A test proves the three are distinct buckets and that no candidate is silently absent from all three. (c) THE MISDEPLOYMENT BUCKET IS SCOPE-GATED: emitted only where storage_scope is `local`, because under shared storage every host sees ONE file and the finding is meaningless. Unknown scope suppresses it and COUNTS the suppression (the never-silent house rule). (d) ALREADY-ARCHIVED IS REPORTED, not only deletion candidates: scripts carrying a code-repo occurrence and NO current server-extract occurrence are counted as already archived — the progress measure toward the target state. The inverse (server occurrence, no repo occurrence) is G24's existing never_committed bucket: cross-referenced, never recomputed. (e) NO AXIS PROVES ABSENCE (§H1): every "absent on axis X" row reads as "not observed by feed X", and the active_unknown count appears in the report rather than being dropped. Full suite green.
notes: |
  Groomed 2026-08-07 (laptop) from Idea-80 + Idea-82 on user instruction to groom the two TOGETHER. They are one item rather than two because they turn on the SAME argument: an absence observed by one feed is not an absence in the world. Idea-80 supplies the dispositions and the coverage precondition; Idea-82 supplies the already-archived measure and the reason it needs no new flag. WHY IT IS SEPARATE FROM G23: G23 LOADS the bundle facts; this READS them. Folding the report into the loader is how a deletion-driving output gets built as a loader detail — the same distinction that keeps G55 separate from G23, and for the same reason. WHY (d) COSTS NO NEW VOCABULARY: after G22 §D2 ruled reified occurrence nodes carrying `origin`, "archived" is a SHAPE rather than a status — repo occurrence present, current server occurrence absent. That keeps it DERIVED FROM EVIDENCE rather than declared, the same move §G1 made when it put identity in the business key and made the URN a render, and it stays honest when a file comes back. DryDocs' existing word for the artifact-level fact is the TOMBSTONE (`removed_from_source_at`, the D7 sweep ruled at U13, live on :CodeModule today) — reuse the concept, and note that on :CodeModule it is a TIMESTAMP, not a status. THE SAFETY BAR IS WHY (a) AND (c) ARE ACCEPTANCE CLAUSES RATHER THAN GOOD PRACTICE: the output drives DELETION, so a false positive removes live code. §H2 ruled active=true-but-unreferenced "the most dangerous false positive available" precisely because §E3's blind spot (no body copies, so script-to-script calls are invisible) is exactly what hides the caller. ONE QUESTION DELIBERATELY NOT GROOMED INTO AN ITEM: what to CALL the estate-level end state ("the production server holds only actively used code"). It is a property of the ESTATE, not of any node, so a formal graph-side term would be a vocabulary decision riding the HITL gate — and NOTHING NEEDS ONE YET. Minting an item for a decision no build depends on is how the backlog inflates. Surface it at this build if the report wants a term; the plain-English statement of the goal is L24's job and needs no gate. Explicitly DO NOT reach for the 00-header.yaml lifecycle (planned|active|deprecated|removed): that enum governs vocabulary ENTRIES (edge meanings, i.e. schema) and a script on a server is an INSTANCE — reusing the four words would put `removed` = "deleted an edge definition" and `removed` = "deleted a file off a server" in one repo, the two-things-one-spelling collision §A2 caught on `group` and J32 made a standing rule. HOME: drydocs_lineage/review.py is the lineage SME surface (CLI `drydocs lineage-review`, ported at ADR 0002-C) — the same surface §A3's signed ruling already sends same-basename multi-mount duplicates to for SME merge, so the curation ladder exists. PRIORITY NOTE: Idea-80 carried an agent-PROPOSED `prio? High` that the user never ruled. Filed p2 for coherence with its own dependency chain (G22/G23/G55 are all p2) — it cannot start before G23 regardless. Raise it if the archival drive lands before the rest of the chain. DONE 2026-08-07 (desktop, same session as G23): BUILT as drydocs_lineage/archival.py — archival_report() over the staged LineageGraph, PURE, writes nothing; findings are review material (H2/P5), surfaced as an optional section on the lineage-review page (to_html archival=..., the E3 curation-ladder surface). Every acceptance clause has its test (tests/unit/test_lineage_archival.py, 9 tests): (a) coverage stated ON the report — metadata-only runs say METADATA-ONLY RUN in their own output and dead rows read "no CMD_LINE reference observed", never a nothing-calls-it claim; (b) three distinct buckets (dead / misdeployed / dynamically_called via the who-references split: job-src rels = CMD_LINE feed, script-src rels = body-visible callers) + in_use counted, nothing silently absent; (c) misdeployment emitted ONLY under storage_scope local (all-records-local, conservative), unknown AND shared suppressed and counted; the row notes node_target polymorphism for the SME; (d) already-archived = G24 repo_only CROSS-REFERENCED from the CorroborationReport (never recomputed), never_committed likewise; no corroboration -> "archived-state not observed", not zero; (e) active_unknown passthrough (None = "registry axis not observed on this run"). The estate-level end-state TERM the notes deliberately left unminted stayed unminted — the report needed no term, plain counts suffice (L24 owns the prose goal). Suite 1698/3/5 — the 3 are the Idea-83 rich-ANSI env failures, untouched.
