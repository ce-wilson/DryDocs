  ADR 0018 D4 as amended at acceptance (2026-09-02: "take the hit now, carve that into the
  sole port").

  (a) MOVED, basenames kept, as git renames: drydocs/review/ (graph_verify, review_labels,
  source_mappings, graph_review, sme_notes, gate_pages, fid_census, run_as_detect,
  publishing/), drydocs/plan/ (plan_board, plan_roadmap), drydocs/port/ (port_preflight,
