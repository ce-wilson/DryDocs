id: Q13
epic: docmeta
title: 'STANDALONE repeatable vendor-docs ingestion + loader: capture -> convert -> load a NAVIGABLE spine
  (TOC hierarchy + page_role + abstract), taxonomy only'
type: task
module: drydocs-load
phase: 14
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- knowledge/upgrade-plans/vendor-docs-agent-navigation.md
- config/doc-source-registry.yaml
- drydocs/loaders/bmc_docs.py
- scripts/external_vendor_scrape.py
acceptance: |
  A STANDALONE, REPEATABLE pipeline — its own converter, loader, cypher and `drydocs` verb, NOT a widening of load-bmc-docs (user ruling 2026-07-31: "unique enough to use a stand alone, but repeatable ingestion and loader"). It reads the capture manifest as its contract, so capture / convert / load are three re-runnable stages and re-running any of them is idempotent (MERGE on doc_id; a second full run reports zero net change). The converter strips the Author-it/ExtJS navigation chrome and emits body markdown; the loader writes :Document with doc_id, title, breadcrumb, source_url, sha256, captured_at, a deterministic `abstract` (first paragraph) and a derived `page_role`; the toc.json hierarchy loads as IN_SECTION / SUBSECTION_OF; chunks keep the established (:Chunk)-[:PART_OF]->(:Document) + NEXT_CHUNK shape. A TOC node bearing a fragment (`page` + `anchor` in the manifest) attaches to the EXISTING document as a section — it must NOT mint a second :Document. `page_role` derivation is an explicit title rule, NEVER an LLM, and the run REPORTS its unclassified count rather than defaulting pages silently (the G16 values-decide pattern). Every node carries doc_version and version_verified=false. NO meaning edges — no :ControlMUtility, no DOCUMENTS, no SEE_ALSO (Q14's gate). Counts reported per role.
notes: |
  Layer 1 of knowledge/upgrade-plans/vendor-docs-agent-navigation.md, and the half that needs NO ruling because it only transcribes the publisher's own structure — the taxonomy-before-ontology rule in CLAUDE.md §1. Worth doing alone: hierarchy + role + abstract already beats similarity-search-only, which is all the corpus supports today. STANDALONE, decided 2026-07-31: load-bmc-docs cannot be stretched to cover this and should not be. It consumes hand-written markdown, splits on H2, and infers a provenance TIER from heading text — a heuristic that exists only because that corpus is our lossy paraphrase. This corpus is VERBATIM throughout, so there is no tier to infer, and its real structure (TOC hierarchy, page_role, anchors) has nowhere to go in that loader's model. Two loaders with honest contracts beat one with a mode flag. REPEATABLE means the capture manifest is the contract between stages: scripts/external_vendor_scrape.py already emits it (sha256 per document, page/anchor per TOC node), so a recapture after a version bump re-runs the same convert+load with no code change. MODULE: drydocs-load beside bmc_docs.py, not drydocs-docmeta — the Q7 precedent (it must work BEFORE the docmeta component exists at Q6). The version properties are load-bearing, not bookkeeping: the capture is 9.0.20 (BMC ships NO Utilities book in the trimmed 9.0.21 publication) while the estate runs 9.0.21.300, so the graph must make "the 9.0.20 docs say X, unverified for your estate" the only answer it can produce. The config-side half of that already exists — see Q16. . DONE 2026-08-04 (LAPTOP). The pipeline itself landed 2026-07-31 in 9713118 — converter, loader, cypher, both CLI verbs, 41 offline tests — and the status was never flipped, so the repo went on advertising Q13 in next_ready for four days. This close is the VERIFICATION that flip should have carried, and it found three defects. None of them would fail a test or a load; all three are the "succeeds loudly, does nothing" reporting class this epic hit at G29, G30 and Q8. . (1) THE LOADER COULD NOT REPORT A CHANGE. vendor_docs.cypher had no WAS_GENERATED_BY provenance tail, and BaseLoader derives rows_changed by counting the edges a run attached — so it reported rows_changed=0 on a FIRST load exactly as on a no-op re-run, which makes this item's own idempotence evidence ("a second full run reports zero net change") unfalsifiable. `to_params` had been computing row_checksum all along and nothing read it. Fixed with the delta-only tail (bmc_docs / controlm_folders idiom), placed ABOVE the SUBSECTION_OF block because that block's UNWIND of an empty list drops every row at TOC depth <= 1 from the rest of the statement — the tail-ordering trap bmc_docs.cypher documents, and a test now pins the ordering. . (2) A CAPTURE IS NOT A CORPUS, and the loader wrote the wrong one. It set corpus_id to the CAPTURE id (bmc-controlm-9.0.20-utilities) while this item's own input, config/doc-source-registry.yaml, declares `graph_locator: {match: corpus_id, value: bmc-controlm-utilities}` — so Q7's `docs-verify` would have reported a fully loaded corpus as MISSING. A false negative in the one check built to stop false claims. It survived because nothing has ever run both halves together. Now every row carries BOTH: corpus_id resolved REGISTRY-DRIVEN (the entry naming this capture in its `manifest:` path — never a string transform of the capture id, and an unregistered capture refuses per docmeta invariant 1), and capture_id for which fetch produced the row. A test asserts the loaded id equals what the registry's locator searches for, so the two can no longer drift apart. . (3) doc_id WAS THE BARE TOPIC STEM ("16200"), globally unique across every capture. Author-it reuses topic ids across publications, so loading the already-registered 9.0.21 Parameters tree would have MERGEd onto the 9.0.20 Utilities documents and overwritten doc_version — silently destroying the one distinction this corpus exists to carry. doc_id and section_id are now capture-scoped. "MERGE on doc_id" stays literally true; it is doc_id that got an honest identity. Free to change because nothing is loaded anywhere yet — the build-order argument G31 makes. . Also closed the literal acceptance gap: doc_version + version_verified now ride :Chunk and :DocSection, not only :Document, so a chunk that surfaces alone in a retrieval result still carries the version caveat (Q15 returns chunk-grain rows; this is what lets those rows cite honestly). . NO LIVE RUN — ON EITHER MACHINE, and this is the honest state rather than an untested one (J18). Two independent blocks: the registry entry is `confirmed: false`, so `_gate_loader` refuses the write until an SME gate signs the doc-graph shape; and the 1016-page capture lives in the DESKTOP's data root (DRYDOCS_DATA_ROOT is machine-local and git syncs none of it), so this laptop has no payload to convert. Evidence here is offline and reproducible anywhere: 60 tests over a fixture capture, including two full loads through a recording client proving the checksums are identical across runs — which is precisely the condition under which the new delta-only tail fires zero times. The graph-side count stays unproven until a machine holding the capture runs it post-gate. . Registry entries for the two remaining trees: the 9.0.21 Parameters tree in scripts/external_vendor_scrape.py has NO doc-source-registry entry, so convert refuses it by design rather than inventing a corpus id.
