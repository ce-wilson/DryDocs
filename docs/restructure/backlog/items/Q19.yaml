acceptance: |
  SME direction 2026-08-18: "the accuracy was 100% in the graph, but in practice our own personas are not getting that close based on the last few days of gotchas." The P0 record (verdict Q3, commit 0e036ff era) reports traversal 12/12 WITH TWO DISCLOSED CAVEATS that are now the live question: the author hand-wrote the Cypher (text2cypher stand-in) and the author judged the answers, with 2 adjudication corrections. (a) SAME 12 questions, SAME corpus — bmc-docs, whose id was retained at the 2026-08-18 corpus-id rename precisely so this record stays citable — but the Cypher is generated by an AGENT PERSONA at run time, never hand-written; the persona sees the schema and the question, nothing else. (b) GRADING IS INDEPENDENT of whoever generated the queries (a second session or a mechanical scorer with the original regex ground truths; adjudications recorded, never silently applied — the P0 record's own discipline). (c) PUBLISH THE DELTAS against the original per-question table (recall, tokens, latency), in the same explainer family; a persona score BELOW 12/12 is the expected and honest outcome, not a failure of the run — the point is to measure the gap the stand-in hid. (d) CITE THE MOTIVATING GOTCHAS so the item survives its context: the Idea-128 GitNexus lesson (a tool claiming epistemic `exact` with impactedCount=1 while grep found missed call sites) and the recent persona misses the SME observed. The benchmark's job is to make that gap a NUMBER. (e) SCOPE FENCES: O31 (regenerate benchmarkData.ts from a real harness) is RELATED, NOT a dependency — its own notes say the P0 script is not a reusable harness; do not block on it, and do not build the harness here. And GRADES.md:169's re-run prerequisite belongs to the OTHER experiment (graph-vs-files, code graph) — do not conflate the two.
notes: |
  Direct add 2026-08-18 (SME direction at the corpus-naming plan; the C9 precedent). The original test is the reason bmc-docs kept its name in the id-grammar rename — this item is the other half of that decision: keep the record citable, then re-test its headline claim under honest conditions. DONE 2026-08-19 (desktop, Neo4j 5.26.27, DB drydocs — J18). Persona: a Sonnet subagent in a FRESH context (0 tool uses in its transcript — the isolation held), given the live schema and the 12 question texts only; its Cypher committed verbatim as persona_queries.json. Grading: benchmark_p0_persona.py, mechanical, original regexes unchanged, execute_read so a write attempt fails. RESULT: persona 11/12 MECHANICAL vs the original's 10/12 mechanical (12/12 after its 2 disclosed author adjudications, MD1+PV1) — recall held. THE GAP THE STAND-IN HID IS CONTEXT VOLUME, not recall: 102,060 chars (~25.5k tok) vs 15,354 (~3.8k tok), 6.6x — the persona compensates for not knowing the corpus with breadth (LIMIT 25, OR-chains), spending the token-efficiency headline. Quote ~27x as the hand-written ceiling, with roughly 4x less as the measured persona floor. THE ONE MISS IS THE FINDING: EL2 — the persona found the RIGHT chunk and truncated the answer out of it (left(text,600); 'ctmcreate' first appears at char 891; the original used 1200, sized by an author who knew where the answer was). Adjudication CONSIDERED AND DECLINED, recorded in the write-up: the original's two adjudications corrected a scorer artifact (right content, marker not echoed in output columns); EL2's handed-over context genuinely lacks the answer, and scoring it up would erase the persona behavior this run measures. It is the Idea-128 GitNexus lesson in retrieval form: success-shaped output with the substance absent. Deltas published in the explainer family: docs/design/graph-retrieval-benchmark-persona-rerun.md (+ rendered html). Fences held: no harness built, O31 untouched, GRADES.md's re-run prerequisite left with the other experiment. Delivered on branch feat/q19-persona-benchmark — NOT merged, left for review per the run direction.
