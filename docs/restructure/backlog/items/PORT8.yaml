acceptance: |
  (a) A base-resolves check (git rev-parse --verify) runs first; (b) _git surfaces a non-zero exit
  instead of returning empty stdout; (c) range_commits and added_documents distinguish "no commits"
  from "git failed"; (d) the report renders NOT CHECKED with the git stderr, passed False, beside the
  existing SKIPPED idiom - a local third state now, the ADR 0021 type once accepted; (e) --tag refuses
  on NOT CHECKED; (f) a unit test pins "unknown base -> not certified" and "empty range on a real base
  -> checked-clean"; (g) the reconcile-port checklist gains: the verdict word appears in the
  certification, NOT CHECKED blocks the tag, a re-certification postscript is owed when a tag's
  preflight is re-run after a preflight fix; (h) the fixed preflight is re-run over
  port-base-20260905..port-base-20260908 and the verdict recorded as a postscript to RELAY-46.
  Ships BEFORE the eighth roll.
notes: |
