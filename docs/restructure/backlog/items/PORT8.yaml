  and NOT CERTIFIED names the not-checked checks, so --tag never runs. Four tests pin the helper
  raising, the state's invariant, the unresolvable base (NOT CHECKED twice, never clean) and the
  EMPTY range on a real base (still a clean pass, and the base is resolved before the range is
  read). (g) the reconcile-port checklist carries the three-word verdict and the
  re-certification-postscript rule. (h) re-run over port-base-20260905..port-base-20260908: base
  resolves, 407 commits, 0 uncited, 10 added documents, 0 unresolved - recorded as the third
  postscript to RELAY-46. The interim third state is a field on CheckResult; CORE10 replaces it
