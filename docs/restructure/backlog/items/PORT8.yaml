  DONE 2026-09-09 (Lane A, desktop). (a)-(f) in drydocs/port/port_preflight.py and
  scripts/port_preflight.py: GitError from the helper on a non-zero exit; base_resolves() runs
  first through git rev-parse --verify; range_checks() turns an unresolvable base, or a git
