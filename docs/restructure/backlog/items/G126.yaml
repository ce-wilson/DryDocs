id: G126
epic: component-topology
title: 'The console credential file is an undeclared read-and-write path, and it is the case the
  zone declaration cannot currently express: one mode per zone, and no base outside the data root'
type: bug
module: drydocs-core
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- config/data-zones.yaml
- drydocs_core/data_zones.py
- drydocs_core/data_root.py
- drydocs_api/credentials.py
- scripts/set_console_credential.py
- tests/unit/test_data_zones.py
- docs/reviews/g81-data-path-reconstruction.md
- docs/design/catalog-substrate-review.md
acceptance: |
  `internal-local/console-credentials.json` — the path `DRYDOCS_CONSOLE_CREDENTIALS` overrides — is
  DECLARED, and the declaration is expressive enough to say what it actually is. G81's rule is
  "every path the system reads or writes must be declared in configuration with a mode"; this path
  is neither declared nor expressible today, and it did not exist when G81 closed.

  (a) THE MODE AXIS CARRIES THE DUAL CASE (review finding L4). The file is WRITE for one script run
  by a person (`scripts/set_console_credential.py`), READ for the API (`drydocs_api/credentials.py`,
  which stat-reloads it), and it must never be `scratch` — a disposable credential store is an
  outage. Today a zone gets exactly one of read / write / scratch. Either the axis gains a way to
  say "written by one named actor, read by the system" or the item records why the single-mode axis
  is right and which single mode this file takes. What is NOT acceptable is calling it `write` and
  losing the guarantee that the API cannot write it — the guard forbidding filesystem writes inside
  `drydocs_api` is the reason an endpoint cannot grant itself an account, and a declaration that
  contradicts that guard is worse than no declaration.

  (b) THE BASE AXIS REACHES IT. `config/data-zones.yaml` declares two bases, `data_root` (under
  `DRYDOCS_DATA_ROOT`) and `home`. This path is under neither: it is IN-TREE, under
  `internal-local/`, gitignored, and deliberately not under `var/`. A third base is added, or the
  file records why an in-tree operator-authored path is out of scope for it — with the same rigor
  G109 (e) applied when it ruled the Confluence capture out of the tree rather than granting an
  exception that could never expire.

  (c) THE INVARIANT STILL HOLDS AND IS PROVEN TO. Whatever mode and base this lands on,
  `tests/unit/test_data_zones.py`'s check — no write-mode path may equal, contain, or be contained
  by a read-mode path, in BOTH directions — runs over the new zone, and a test proves it fires on
  an injected overlap involving it. A declaration the invariant does not actually cover is
  decoration.

  (d) NO BEHAVIOR CHANGES AND NO FILE MOVES. G81's scope fence, restated because it applies with
  more force here: the credential file is machine-local with no committed source to rebuild from,
  so a config change that relocated it would destroy the only copy. This declares where the file
  already is. If the right home turns out to be elsewhere, that is a separate item with a migration.

  `poetry run pytest -q` green, ruff + format clean.
notes: |
  Minted 2026-08-29 (desktop) by G123, ruling the L4 half of the catalog-substrate review's G81
  amendment a FOLLOW-UP rather than a reopen. The deciding fact, verified from git rather than
  assumed:

  THE PATH DID NOT EXIST WHEN G81 CLOSED. `drydocs_api/credentials.py` was ADDED on 2026-08-28 by
  `36601a10` (O69, real console authentication). G81 closed on 2026-08-24 at `db2d96b8`. G81's
  declaration could not have covered a file that would not exist for another four days, and its
  reconstruction — which walked the write-capable surface and measured four live overlaps — was
  complete and correct for the tree it walked.

  WHY IT IS STILL WORTH ITS OWN ITEM RATHER THAN A NOTE. L4 is not merely "one more path to add."
  It is the first path that tests G81's declaration at BOTH of its axes and fails at both: the mode
  axis has no dual state, and the base axis has no in-tree option. The review put it exactly right —
  "it is the sharpest test of that item's mode axis; if the declaration G81 lands cannot express
  that, it is not expressive enough." The credentials module already argues the read/write boundary
  in prose (O69's own notes explain why the file sits outside `var/`); this is the chance to make
  it mechanical.

  `type: bug` because an undeclared read-and-write path IS the G81 defect class, not a feature gap —
  the same class, on a file that arrived after the guard was built. p2 rather than G81's p0: the
  irreversibility that made G81 p0 is bounded here (one machine-local file, and no automated writer
  can reach it — the write is a person running a script), so it is a real gap without a live
  destruction path. Module `drydocs-core` because the deliverable is the zone declaration and its
  guard, both of which live there; `drydocs_api` is read-only in this item by construction.

  `depends_on: []` — independent of G124/G125. Those two decide and build the CONNECTION binding
  (a source to a service); this one is a filesystem path in the existing zone declaration. They
  meet only at the shared question of which environment variables the system reads, which G125 (c)
  enumerates and this item does not touch.

  DONE 2026-08-29 (desktop). THE RULING ON (a) IS THAT THE SINGLE-MODE AXIS IS RIGHT AND THE MODE
  IS `read` -- L4's premise is the part that does not survive contact with the declaration. `read`
  in this file has never meant "nobody writes it"; the header defines it as "source data a human
  drops in. The system may NEVER write it." The operator's hand is not the system, so a file
  written by a person at a no-echo prompt and read by the API is not a dual case at all -- it is
  the read case, stated. THE PRECEDENT WAS ALREADY IN THE FILE, one zone above where the new one
  landed: `controlm-api-config` is an operator-authored endpoint-and-credential pointer declared
  `mode: read`, whose note reads "the system consumes it and must never rewrite it, and overwriting
  an operator's credentials config is the same class as overwriting their extract." The second
  enforcer points the same way -- tests/unit/test_mapping_api.py forbids every filesystem write
  primitive inside drydocs_api -- so a `write` declaration would have CONTRADICTED a standing
  guard, which the acceptance named as the one unacceptable outcome. No new mode was invented, and
  inventing one would have weakened the axis to describe a case it already covered.

  (b) THE BASE AXIS GAINS `repo`, SPELLED THE WAY THE OTHER HALF ALREADY SPELLS IT. The two
  declarations join in overlaps(), and landing_zones.py has had BASE_REPO = "repo" since N12 while
  data-zones.yaml had only data_root and home -- so this is adopting a vocabulary, not minting one.
  The in-tree question was NOT waved through on the strength of that: G109 (e) ruled the Confluence
  capture out of the tree because its exception could never expire, and the same test applied here
  gives a different answer for a reason that is recorded rather than asserted. The capture was
  untracked AND unignored, the one state `git clean -fd` removes without -x, and its only rebuild
  was a company-side re-scrape. /internal-local/ is gitignored (.gitignore line 60), so only -fdx
  reaches it, and the system's payload there is rebuilt in one command by the operator who owns it.
  THAT DIFFERENCE IS THE PRICE, AND IT IS CHARGED: zones gain a `rebuild:` field, and a guard fails
  any repo-based zone that declares none. Not a blanket exception -- a stated recovery path, checked.
  A second guard pins the in-tree set to an explicit list, so a NEW in-tree zone is a decision
  someone makes on purpose. G109 found two zones nobody had declared precisely because nothing
  forced that moment.

  (c) THE INVARIANT COVERS IT AND IS PROVEN TO FIRE ON THE NEW BASE. A repo-based read zone
  protects exactly as much as a data_root one, and the injected-overlap test asserts a write nested
  inside one is caught naming both paths. The declared-equals-resolved guard (G111) was WIDENED
  rather than exempted: its independent recomputation had two branches, home and data_root, and a
  repo zone fell silently into the data_root branch and compared the wrong path -- caught by the
  existing test failing, which is the guard doing its job on the first new base it ever saw.
  A THIRD AGREEMENT was added because this zone has no data_root helper to check against:
  credentials_path() -- the module that actually owns the path -- must resolve inside the declared
  zone. Without it the declaration and the code could drift with nothing to notice.

  ONE LIMIT NAMED RATHER THAN HIDDEN, and it cost the zone its `env:` row. DRYDOCS_CONSOLE_CREDENTIALS
  names a FILE; a zone's `env:` override resolves a DIRECTORY, so wiring the two would have made
  the zone resolve to a file path and report "absent" forever -- a declaration that looks live and
  guards nothing. A machine that sets the variable has moved its credentials outside this
  declaration's reach and nothing here can follow, which is the same shape as the runtime leg G81
  recorded. The unset case IS mechanical, which is what the credentials_path() guard above covers.

  ONE OVERCLAIM CAUGHT BY LIVE-TESTING MY OWN CHANGE. The first cut printed "it is rebuildable in
  one command" against a zone the command reported as holding 216 files -- but `rebuild:` recreates
  the CREDENTIAL FILE, not the deepdoc corpus and Confluence scripts sitting beside it. Read
  literally by an operator that sentence invites a `git clean -fdx` that destroys hand-carried
  material. The field is now scoped in the YAML, in the guard's docstring and on the surface, which
  tells the reader to take the file count as "what -fdx would delete", never as "what one command
  restores". The zone is declared to keep the SYSTEM out, not to mark the directory disposable.

  ALSO FIXED BECAUSE IT BECAME FALSE: `drydocs landing-zones` told the reader that "repo zones hold
  TRACKED files, which no clean removes at any strength". True of landing zones, and this item made
  it untrue of data zones. Corrected in place rather than left as a stale reassurance -- a wrong
  safety claim is worse than none.

  `rebuild` also rides the --json surface, guarded: a machine reader that can see `inside_repo` but
  not `rebuild` knows a zone is deletable and nothing about getting it back.

  SCOPE FENCE HELD (d): nothing moved, no behavior changed, drydocs_api is untouched. VERIFIED LIVE
  (J18: desktop, this checkout, DRYDOCS_DATA_ROOT = C:/coding/projects/data/DryDocs) -- `drydocs
  landing-zones` reports 28 zones where it reported 26, the new row reads read/repo, and the
  rebuild and scope lines render. Suite 2742 passed / 9 skipped, ruff + format clean, CLI import
  and --help pass. The enforcement matrix regenerated to pick up the new guards.

  ONE FALSE START WORTH RECORDING, since it is a policy this repo enforces on purpose: the
  injected-overlap fixture first used the real directory name as its path literal, and
  test_skip_guard_policy.py flagged the file as referencing a gitignored asset without a skip
  guard. The policy was RIGHT and the fix was the fixture, not the policy -- a skip guard here
  would have been a lie that let every assertion in the file silently vanish on a fresh clone. The
  fixture is synthetic under tmp_path now and says so.
