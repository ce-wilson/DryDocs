id: Y5
epic: backlog-sharding
title: 'The one-key claim commit goes RED in CI: the pushed-claim protocol and the roadmap stale-render
  guard contradict each other — RULED at the groom as tolerate status-only drift, and this item applies it'
type: bug
module: drydocs-plan
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- tests/unit/test_plan_roadmap.py
- scripts/render_roadmap.py
- scripts/render_board.py
- drydocs/plan_roadmap.py
- docs/restructure/backlog/README.md
- CLAUDE.md
acceptance: |
  A correct one-key claim — flipping one `items/<id>.yaml` to `in_progress`, committing and pushing BEFORE starting work, exactly as the ADR 0013 claim ritual prescribes — no longer turns CI red.

  It does today. First hit 2026-08-20 (laptop), the first post-shard claim: `items/D10.yaml` → `in_progress`, pushed, and `test_plan_roadmap.py::test_committed_roadmap_page_matches_its_sources` failed on CI run 32440366508 because `roadmap.html` derives item STATUSES and the claim commit ships no regen. The close-out commit went green, so the red window is precisely the work interval the claim exists to cover — every correctly-claimed item spends its whole in-flight life with CI red at the claim sha, which trains sessions to read red as noise. That is the exact habit Idea-111 was raised to break, and it cost 100+ consecutive ignored failures last time.

  **THE RULING, made at the 2026-08-21 groom because Idea-151 asked the groom to decide: option (b) — the stale-render guards TOLERATE STATUS-ONLY DRIFT.** Option (a), regenerating renders inside the claim commit, was rejected on a discriminating ground rather than on convenience: it puts `board.html` and `roadmap.html` into every claim commit, so two machines claiming DIFFERENT items collide in generated files — which is the shared-line conflict ADR 0013's sharding was built to remove. Sharding made a claim a one-file edit; a guard must not put it back to three.

  What the item delivers:
  (1) The committed-render guards (`test_plan_roadmap.py::test_committed_roadmap_page_matches_its_sources` and its board/ideas siblings — enumerate them; do not fix one and leave the family inconsistent) compare the committed render against its sources with item `status` NORMALIZED OUT, so a status-only change does not fail them while any other drift still does.
  (2) The tolerance is BOUNDED and proven: a test asserts that a title, module, phase, dependency or new-item change to the backlog still fails the guard. A guard relaxed without that test is a guard deleted.
  (3) Rendered pages therefore may show a stale STATUS between claim and close. That is stated plainly in `docs/restructure/backlog/README.md` — the board is a render, the item file is the claim channel, and CLAUDE.md already says roll-ups are derived — so nobody reads the board as the authority on who holds what.
  (4) The other rule is restated to MATCH rather than left standing as written: CLAUDE.md §0 and the backlog README say a claim is a one-key edit of one item file, committed and pushed, with no render step. Whichever of the two rules is not chosen must be amended in the same commit; the defect here is that both stood as written and contradicted.

  `poetry run pytest -q` green, and a claim-shaped commit (one item file, status only) verified green in CI at its own sha.
notes: |
  Groomed 2026-08-21 (laptop) from Idea-151 (2026-08-20, prio proposed Med), whose closing line — "Groom decides; don't leave both rules standing as written" — is the authority for ruling it here rather than parking it. The ruling and its reason are written into the acceptance so the next session inherits the argument, not just the verdict.

  Epic backlog-sharding / module drydocs-plan / phase 8 by the Y2 precedent: Y2 built the shard, its claim mechanics and its render/validator wiring, and this is the defect that surfaced the first time that ritual ran.

  Scope note for whoever pulls it: the fix is in the GUARDS, not in the renderers. `roadmap.html` and `board.html` keep deriving status and keep being regenerated at session close by `scripts/render_board.py`; only the staleness ASSERTION learns that status-only drift is expected mid-flight.
  DONE 2026-08-21 (desktop). FAMILY ENUMERATED by experiment, not by reading: a status-only flip with
  no render fails exactly ONE committed-render guard -- test_plan_roadmap::test_committed_roadmap_page_
  matches_its_sources. board.html has no test guard (only the ritual's git diff), gates.json / load-map /
  enforcement-matrix / ideas do not derive item status, so the family was already consistent and the
  fix is one guard. (1) MECHANISM: render_roadmap embeds `<!-- sources-fingerprint: sha256 -->` --
  sha256 over roadmap.yaml + the backlog with every item's `status` normalised out + the renderer's own
  source bytes. The guard passes outright on an identical page, passes as STATUS-ONLY DRIFT when the
  committed fingerprint equals the current one, and fails on anything else. (2) BOUNDED, proven by
  test_status_only_drift_is_tolerated_and_nothing_else_is: todo->in_progress and ->done leave the
  fingerprint unchanged; a title, module, phase, depends_on, new-item or roadmap edit changes it; and
  by construction an edit to plan_roadmap.py itself changes it too (a renderer change without regen
  still fails -- the old guard's other job is kept). Proven live on the tree: flipping C27's status
  without rendering -> 11 passed; editing its title -> 1 failed. (3) backlog/README.md states the
  stale-status consequence and why the board is not the authority. (4) CLAUDE.md pull rule amended in
  the same commit: "a claim ships NO render". The claim commit for THIS item (pushed before the fix)
  is the last red claim sha; the next one-key claim after this lands is the CI proof and is recorded
  on that item. Suite 2295 passed.
  CI PROOF 2026-08-21: the first one-key claim after the fix -- ff22f527 `chore(U26,U24): claim --
  in_progress`, one file, status only, no render -- is GREEN at its own sha (snapshot.ps1's verdict:
  `ci: GREEN at HEAD ff22f52`).
