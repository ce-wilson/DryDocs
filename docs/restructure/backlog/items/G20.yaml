acceptance: |
  drydocs_lineage/extractors/rua_inventory.py reads a bundle (tarball or extracted dir) from the G19 landing zone and emits staging records in the controlm_inventory idiom: meta.txt parsed into a provenance envelope carried on every record (schema version, collected_at/by, user, uid, groups, shell, host, fqdn, os/kernel, scan roots — the "metadata as nodes" raw material); directories.tsv -> DataAsset candidates; profiles.tsv + profiles/ -> profile artifacts; scripts.tsv + scripts/ -> script artifacts (optional, v1 bundles accepted); ownership_dirs.tsv consumed when present. v1 AND v2 bundles both parse (fixture per version, synthetic values only); malformed/missing sections are counted, never silently dropped (the coverage house rule). NO graph writes and NO new relationship types — candidates only, refusal semantics unchanged. Full suite green.
notes: |
