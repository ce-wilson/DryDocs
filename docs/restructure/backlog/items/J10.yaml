notes: |
  DONE 2026-08-01 (laptop) — ALL SIX PRODUCER COMMITS ON main. End state met: `ruff check .` exits 0, `ruff format --check .` exits 0 over 266 files, CI blocks on both, suite 1270 passed / 7 skipped unchanged at every stage. Ran on branch fix/j10-ruff-convergence, --no-ff merged (a rebase would have invalidated the stage-3 SHA recorded in .git-blame-ignore-revs). COMPANY SIDE IS NOT STARTED and is not blocked by anything here — the instructions in the plan doc are live; stages 1-3 regenerate there, 0/4/5 port. . Rulings (user, 2026-08-01): timing GO; E501 ignored-with-reason as recommended; keeper set decided per-ORIGIN, which the 2026-07-19 sizing had not anticipated — 177 of the 362 post-format findings (49%) were VENDORED Anthropic skill scripts (.claude/skills/{docx,pptx,xlsx,pdf,skill-creator}, three near-identical copies of the same office validators) and are now an extend-exclude, not a per-file- ignore; .claude/skills/groom-backlog is ours and stays in scope. 30 findings in our own code were FIXED rather than ignored. . Three things execution taught that the plan doc did not know, now recorded there: (1) ruff's F841 unsafe fix leaves DEAD CODE — it strips the assignment target but keeps the call, six times across three files; the diagnosis was right every time, the fix was not. (2) B017 was a REAL TEST DEFECT: pytest.raises(Exception) in test_plan_board.py passes on a typo'd attribute name too, so it never proved what its name claimed; narrowed to FrozenInstanceError. (3) RUF003 was hiding a latent ENCODING BUG — "â†’" in test_query_specs.py, a double-encoded "->"; a blanket RUF00x ignore would have preserved it. Tree sweep found no others. Also: E402's premise in the plan doc was WRONG (it assumed sys.path setup in scripts/; all 6 hits are pytest.importorskip guards in two test modules), and B008 had grown 14 -> 26 while CI was advisory. . The J16 fall-through guard EARNED ITS KEEP: .git-blame-ignore-revs (new in stage 3) had no PORT-MANIFEST disposition and test_port_reconcile_guards.py failed exactly as designed. Now an explicit never-port row — a SHA is the one thing two disjoint histories can never share. . STAGE 0 DONE 2026-07-31 (`f18c88e`) + B023 RULED AND FIXED (`b3b90dc`). Stage 0 = ruff pinned "0.5.7" EXACT, [tool.ruff.format] written out, and `*.py text eol=lf` — the last is NOT optional: `line-ending = "lf"` without it makes `ruff format --check` unsatisfiable on a Windows checkout while passing on the Linux runner. B023's two hits were ONE site (benchmark_p0.py:206), not a live bug (same-iteration call), fixed with `marker=marker` because the failure mode under any later refactor is silently scoring every question against the last marker. STAGES 1-5 ARE NOW UNBLOCKED — the port boundary settled at PORT-REPORT-57914bf4 (merged 2026-08-01). Remaining gate is the user's two open calls (E501 residual policy; keeper set B008/RUF001-3/E402) — see the plan doc's "Open calls". Live baseline re-measured at 3882db5: 1,017 findings, 404 safe + 42 unsafe, 284 of 328 files would reformat. Groomed 2026-07-13 from the 2026-07-11 IDEAS line (found executing J5 — the CI workflow runs ruff ADVISORY because gating would have required this mass fix inside a CI chore). TIMING (user flag preserved): the diff touches every Python file — execute during a port lull, coordinated with the company-port cadence (git-readme.md), never right before a port. Module `docs` chosen per the J5 precedent (release/CI infrastructure work area); the fixes span every Python package, so no single component module fits. AMENDED 2026-07-19 (main session, user-approved approach): adopt ruff format INDEPENDENTLY on both sides — mechanical commits regenerate company-side instead of porting (disjoint histories make this clean; the port pipe uses a git bundle because the repo stays private — see git-readme.md's bundle note). Live baseline re-measured 2026-07-19: 838 findings (was ~757; CI advisory = debt grows), 358 safe-fix + 20 unsafe; ruff format trial (reverted): 203/237 files, E501 337→206 — residual is prose in strings/comments the formatter never wraps. TIMING flag SOFTENED but start stays user-gated: port exposure is now two regenerable commits + the boundary protocol. Confirm at start (plan doc "Open calls"): timing; E501 residual policy (recommendation: ignore-with-reason); keeper set (B008 Typer defaults, RUF001/2/3 prose unicode, E402 scripts) — and B023 x2 reviewed individually as potential real bugs.
