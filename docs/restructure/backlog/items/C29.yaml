acceptance: |
  Three deliverables, none of which decides anything the HITL gate owns. (a) A VERBATIM Internal capture at internal/controlm-config/reference/controlm-job-metadata-standards-capture.md of all 22 gitignored root screenshots (job-req-1..2, job-variable-1..20), following the controlm-pipeline-stub-capture.md precedent in the same directory: header naming classification, capture date and the source filenames, cuts marked with an ellipsis-in-brackets. It carries five parts -- REQ-1..REQ-4; NFR-CTM-001 v2; the File Name Component Standard; MFTS Route IDs / DPROD extension; Source Contact and PDN Downstream -- and MUST mark NFR-CTM-001 section 4 (the canonical variable registry) as NOT CAPTURED rather than papering over the gap, because the screenshots jump from section 3 to section 5 while sections 5 and 8 both depend on it. (b) In the same file, a components-by-job-type breakdown (FileWatcher first, then Publisher, then ETL/cmd, then folder-level) and an ontology-coverage audit with one row per term the documents name, each verdict citing file:line -- the ETL/cmd family resolves BUILT (FACT_REGISTRY at G16, m7_uses_artifact / m3_invokes), the description-token family resolves OBSERVED BUT NOT REGISTERED, and the roughly twenty ex: terms resolve NONE REGISTERED. (c) A sanitized token + variable register in the Internal-Public mechanism twin knowledge/standards/technology/description-field-metadata-plan.md with columns component / token or variable name / carrier / SQL column / ontology term / ontology class / vocabulary / status / notes, plus the file-name component standard, plus a migration row reconciling the C16 prefix governance against the bare spellings the documents actually use; real addresses, accounts, route ids and job names stay in the values twin under internal/. NO relationship-vocabulary writes and NO graph writes -- section 0b and the class question are gate territory. Instead the evidence lands as a rider section on the drafted, still-unsigned config/gate-prompts/email-dl-contact-point.yaml, because that gate's sections C2/C3 recommend the escalation DB and demote the Description field while these documents do the opposite. Publish-boundary check passes: real DL domains, the artifact host, the MFT account and the internal repo host appear ONLY under internal/.
notes: |
  Claimed 2026-08-11 (desktop) from user direction with the screenshots attached. Filed under ontology-mapping / phase 2 rather than taxonomy-capture because the deliverable that matters is the term-by-term ontology verdict and the gate rider, not the hierarchy import; the transcription is the evidence those rest on. The screenshots stay gitignored by the root png rule -- the capture is the durable artifact, which is the whole reason this item exists. Sibling G66 opens the read seam so the DESCRIPTION field this standard depends on can actually be ingested; the two were split so the document work is not blocked behind code review. A collision worth carrying forward and recorded in the capture: the DPL stub integration plan's item E1 uses two literal DESCRIPTION strings as a machine-generated provenance discriminator, and this standard fills the same 4000-char field with tokens -- exact-literal match and token block cannot both hold on a generated object.
