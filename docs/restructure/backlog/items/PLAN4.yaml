acceptance: |
  WHAT THIS IS, AND WHAT IT IS NOT. Two venues (producer, company) groom ONE inbox
  (docs/restructure/IDEAS.md, union-append) and one item set (per-entry item files).
  Nothing today says what a session may do to an entry the OTHER venue owns. "Read-only"
  is the wrong rule and would break the working convention: item notes are appended with
  dated BUILT/Groomed blocks, acceptance has been amended in place with a dated marker
  (LOAD1: "as amended at acceptance (2026-09-02 ...)"), and the company legitimately sets
  status: done on producer items it builds because item files are per-entry and status is
  venue-local by disposition. The rule that survives is about what MERGES AS A UNION and
  what does not. This item is the EDIT side of venue awareness. The MINT side - the Idea
  path's floor/ceiling/venue refusals, next_idea_id() - is PLAN2 (b) under the
  idea-series-grammar rider (its clause (d) already specifies it) and is NOT redone here.

  (a) ONE OWNERSHIP FUNCTION. `owner_of(id) -> venue` in validate.py, one place. Today it
  reads the band: a number above PRODUCER_BAND_CEILING is company-owned, at or below is
  producer-owned, the FROZEN_BAND legacy ids read as company. PLAN2 (b) re-keys it to the
  edition segment when that lands; nothing else in this item knows how ownership is
  spelled. The venue a session RUNS AS is declared, never inferred from a hostname, and
  it is PLAN2's declaration, not a second one: config/dev-environment.yaml `edition:` -
  `base` on the producer, the company's code on the company, no key = undeclared (the
  idea-series-grammar rider C1 defines undeclared the same way). One venue file for the
  mint side and the edit side.

  (b) THE EDIT RULE, for an entry the running venue does not own. On IDEAS.md entries, and
  on the acceptance/notes of an item file owned by the other venue (status on item files
  is venue-local and OUT of scope):
    - the existing text survives VERBATIM as a prefix of the new text - nothing already
      written is modified or removed;
    - anything added is a block stamped `[<venue> <YYYY-MM-DD>]`;
    - the inbox state token (open|parked|groomed|merged|closed) is the OWNER's. A
      non-owner who has the answer appends a stamped `proposed: closed - <why>; see <ref>`
      line and the owner flips the token at its next groom. Reason, stated in the guard's
      message: two sides appending to one entry union-merge by construction; two sides
      editing one token is the conflict IDEAS.md is already the "proven conflict site,
      3x" for.
  Findings, answers, amendments to a gap, a proposed close - all of it lands. Only
  rewriting and token flips are refused.

  (c) THE GUARD IS A DETECTOR WITH A BASE, NOT A TREE ASSERTION. `validate.py
  --check-venue-edits --base <ref>` diffs IDEAS.md and the item files between <ref> and the
  working tree, classifies each changed entry by owner_of, and reports three failure modes
  on entries the running venue does not own: a REWRITE (old text not a prefix of new), an
  UNSTAMPED append, a STATE FLIP. Unit tests prove each is caught and that a stamped
  append, an owner's own token flip, and a status change on an item file all pass - from
  fixtures, not from the live tree, because CI's tree is clean and the check is only
  meaningful against a base. It is wired where it matters: the reconcile-port skill runs
  it with --base at the previous port base, since the company apply is where producer
  entries get edited (and the reverse at back-flow).

  (d) THE PENDING FILE, the pattern that removes the allocator race instead of asking two
  sessions to be careful. A session that captures ideas on a branch or in a worktree
  writes them to docs/restructure/ideas/pending-<branch>.md as headerless candidates -
  the file never contains an `Idea-<n>` header, guarded. At landing, `validate.py
  --mint-pending <file>` allocates N consecutive ids in ONE allocator pass, writes the
  headers into IDEAS.md, and empties the file. Path-scoped extraction already treats such
  a file as a clean-add, which is why it works across a merge. Documented in SKILL.md and
  in the IDEAS.md header beside the band text the capturer already reads.

  (e) RETIRED-IS-NOT-FREE, PINNED. The allocator reads inbox HISTORY (git log --all -p),
  so a number whose header was renumbered away is still taken. A fixture test proves it:
  an IDEAS history where Idea-N was renumbered to Idea-M must not report N as free. This
  is the case the company's hand count got wrong on 2026-09-05 (10006-10008 read as free
  from the live headers; main's 10009-10011 name them as retired).

  (f) SKILL.md:50 CORRECTED. "It refuses the DD-series and the company band by itself" is
  true for ITEMS; the Idea path's refusals arrive with PLAN2 (b). The line says so, and
  the skill gains the edit rule (b) and the pending-file pattern (d) as operating text.

  (g) GUARDED, EVERY DECLARATION. The edit rule and the pending-file rule each name the
  guard that reads them (J68); the detector goes through tests/source_scan.py where it
  reads source (J66). 3278-floor unit suite green; render_board.py leaves no diff.
notes: |
  Minted 2026-09-05 (desktop, Lane A; stub 13333546). p1 because the company is about to
  run the first cross-venue renumber pass with no rule for what it may touch, and the same
  question arrives producer-side the first time a company idea lands here by union-append.
  opus because (b) is a working agreement being turned into a mechanism and the boundary
  cases (amend-in-place precedent, venue-local status) need judgement, not transcription.

  TITLE CORRECTED AT BODY TIME, and why (recorded because I6 says settle the title before
  the stub, and this one was not). The stub's title claimed the mint side too - "the
  allocator enforces the band on ideas as it does on items, both venues can mint". That
  half is already specified by the idea-series-grammar rider, clause (d) (next_idea_id():
  max+1, never the lowest gap; the floor; the venue check) and is PLAN2 (b)'s to build once
  the rider signs. Carrying it here would have been a second item for one mechanism. The
  body and title were pushed together so the trunk never held the two titles apart.

  PROVENANCE. The company's research-tooling landing (2026-09-04/05) found feat/dd_lineage
  had appended Idea-10006..10021 while main independently minted Idea-10009..10017 for
  different content - the SECOND collision on that series (the first was repaired
  2026-08-28 by renumbering, and main's Idea-10009 carries the marker). The company
  correctly did not execute the repair while a second session still held the pen on
  IDEAS.md. The ledger's ELEVENTH POSTSCRIPT carries the producer's one constraint on the
  pass (leave 10018-10021; Idea-10021 is cited here in C44 and Idea-236) and adopts two of
  the company's conclusions: per-file-by-authorship, and the pending-file pen. This item
  makes both a mechanism.

  THE RULING BEHIND (b) is the SME's, 2026-09-05: "if the backlog files were read only,
  they might still need to change - finding more answers, closing, amending old items that
  had gaps." Read-only was the first proposal and was wrong; additive-and-stamped with the
  token reserved is what replaced it, and it is the G87 move (ids are join keys - add and
  deprecate, never rename) applied to entry state.

  RELATED. PLAN2 (b) owns the mint side and re-keys owner_of to the edition segment;
  CFG2 owns the venue declaration PLAN2 reads; test_plan_ideas.py's PORTED_COMPANY_IDS
  presence guard stays as the "look at it once" tripwire and is not replaced by this.

  BUILT 2026-09-05 (desktop, Lane A; claimed 5e90ed02), the same session as PLAN2, on top
  of PLAN2's `next_idea_id()` and `owner_of`-by-segment as the acceptance foresaw. Unit
  suite green, ruff clean.

  (a) as built: `owner_of(id)` in validate.py - a segment names its edition; no segment at
  or below PRODUCER_BAND_CEILING is `base`; no segment above it is BAND_VENUE ("band"), the
  undeclared venue's shape, reported as such and never as the company's name. Items and
  ideas alike, None for the unparseable. `owns(venue, id)` is the one comparison: an
  UNDECLARED venue (None) owns the band. The running venue is `venue_edition()` - PLAN2's
  declaration in config/dev-environment.yaml `edition:`, no second one.

  (b)/(c) as built: `venue_edit_findings_ideas(old, new, venue)` and
  `venue_edit_findings_item(id, old_doc, new_doc, venue)` are pure functions over texts,
  so the fixtures drive them; `check_venue_edits(base_ref)` wires them to `git show` /
  `git ls-tree` of the base against the working tree, and `--check-venue-edits --base
  <ref>` is the CLI (exit 1 with the findings named). Three failure modes on a foreign
  entry: REWRITE (old text not a prefix of new; also a removed entry or a changed header),
  UNSTAMPED (an append with no `[<venue> YYYY-MM-DD]`), STATE FLIP (only the token
  changed, with the message saying why and what to append instead). On item files
  `acceptance` and `notes` follow the append rule, `status` and `annotations` are out of
  scope, any other field changing is a REWRITE. Fixture guards prove each is caught and
  that a stamped `proposed: closed` append, an owner's own flip, an owner's own rewrite,
  an edition running as itself, and an item status change all pass. Wired into the
  reconcile-port skill as step 6 (at the previous port base); run here against
  port-base-20260902 it reports nothing, as it must on a base tree.

  (d) as built: docs/restructure/ideas/pending-<branch>.md, header shape with `Idea-?`,
  appended at the bottom (top = oldest = lowest number). `--mint-pending <file>`
  refuses a file carrying any real id or a non-candidate bullet, allocates every
  candidate consecutively through `next_idea_id()` (one pass; the fixture shows the base,
  an edition and an undeclared venue each landing in their own inbox of numbers), inserts
  at the top of `## Inbox` newest first, and rewrites the file to its header. README in
  the directory; two manifest rows (`pending-*.md` never-port - a candidate that crossed
  would be minted as the other venue's thought; the README canonical-producer); the
  inbox header points at both the pending file and the edit rule beside the retired band
  text. Guard: test_plan_ideas.py refuses a real id in any pending file.

  (e) as built: the fixture is a `git log -p`-shaped history where Idea-10006 became
  Idea-10023; the union keeps 10006 and the allocator answers 10024, never 10006.

  (f) as built: SKILL.md:50 was already corrected at PLAN2 (the Idea path's refusals have
  landed); the skill gains two operating sections, "Editing an entry another venue owns"
  and "Capturing on a branch: the pending file".

  (g): each declaration names its guard (the README, the skill text, the manifest notes,
  the inbox header all point at test_backlog.py / test_plan_ideas.py); the detector reads
  Markdown and YAML, never Python source, so source_scan does not apply and this note says
  so rather than leaving the J66 line to be re-derived.

  NOT DONE HERE: the company's own run of the detector (their reconcile, their venue); the
  sharded inbox's rows (R6); nothing about what a domain or edition does with its inbox
  (Idea-257, parked).
