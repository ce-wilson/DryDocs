acceptance: |
  The catalog divergence between the company gate page (`internal/org/catalog/`, dated 2026-06-25) and the producer catalog ontology is RECORDED in two places a future port cannot miss, and NOTHING is adopted. (a) A divergence-ledger entry in the reconcile-port skill naming all five differences: the `:SubLOB` + `HAS_SUB_LOB` grain we do not model, the widened `HAS_PRODUCT_LINE` range `(:SubLOB|:LOB)`, the label split `:LOB {lob_id, name}` vs our `:CatalogLOB {lob_id, code, name}`, the map-id pair (`sub-lob-org-unit` / `catalog-lob-reconciles-segment` vs our `lob-has-product-line` / `lob-reconciles-to-segment`), and the 5-field `pat_lob_sublob_productline.csv` grain our `lob-product-team.yaml` capture lacks a Sub-LoB Name column for. (b) The divergent relationship shapes are registered `status: planned` in the vocabulary and the catalog mapping file, each carrying the trigger that would confirm it — reserving the NAME so the port cannot collide on it, which is exactly the G34 glossary-scaffold argument, and asserting no meaning (that is what `planned` is for). (c) Two rulings are named in the entry as things the eventual gate must settle TOGETHER, not one at a time: the label ruling (`:LOB` vs `:CatalogLOB`) and the key ruling (the S3 `app_id` rename the company page pre-dates). (d) The two relayable findings are stated as relay items, not producer work: the page's functional-org target "Corporate" is ambiguous against our seeded `:BusinessSegment {code:"Corp"}` and MERGEs a phantom segment if read as a code, and the page's `drydocs/schema/ontology.cypher` path is period-correct for its date (pre-G2 Phase-B relocate), so refresh it only if the prompt is revised. No loader changes, no taxonomy capture rewritten, no map entry flipped to `confirmed`.
