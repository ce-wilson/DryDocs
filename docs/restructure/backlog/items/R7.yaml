acceptance: |
  :Document nodes carry source_url, source_sha256, fetched_at, refresh policy, and a status lifecycle; answers flag citations whose source is stale per policy; rescrape is a QUEUED refresh artifact — auto-runnable for SYNTHESIZED corpora, re-queues HITL curation for CONFIRMED (the doc-source-registry sha256 rule, now code-enforced, never a silent overwrite); a changed sha triggers FULL re-chunk (a test proves position-resume is not used when content changed); "rescrape & re-answer" round-trips in the Ask spoke with both envelopes kept for comparison.
notes: |
  CLAIMED THEN RELEASED 2026-08-01 (desktop) — the claim is withdrawn, not abandoned mid-build: nothing was written, so the item is exactly as it was, plus this finding. A pre-build survey found a HARD dependency the item never recorded. "Rescrape is a QUEUED refresh artifact — AUTO-RUNNABLE for SYNTHESIZED corpora" needs something that can actually refetch, and the producer has NO fetcher: the web + filedrop connectors are Q6's deliverable ("Port A: bkup scrapers -> the producer docmeta component"), Q6 is todo and parked on physical media confirmed absent on both machines, and its web connector is additionally gated on Q12's page-count refusal. Building the queue anyway would ship a queue nothing can drain and an "auto-runnable" path that cannot run — worse than not building it, because the surface would claim a capability that does not exist. Q6 therefore added to depends_on. What is NOT blocked, and why a SPLIT is the obvious alternative for the user to rule rather than for an agent to assume: clauses (a) the :Document freshness fields + status lifecycle, (b) staleness flagging on citations, and (d) full re-chunk on a changed sha are all buildable today against the existing loaders — only the auto-run rescrape and the Ask spoke's round-trip need the fetcher. Splitting freshness-now from rescrape-later would unblock roughly three quarters of this item. One further gap the survey turned up, cheap to fix inside whichever shape wins: `agents/graph_qa/pipeline.py` hardcodes `"chunks": 0` in two places with the comment "doc-chunk retrieval arrives with R7 corpora wiring", so the agent currently has no Document-sourced SourceRecord at all. Clause (b) is still reachable without new retrieval architecture — the O18 docs QuerySpecs already return doc_ids, so a routed docs spec's rows can be joined to Document freshness and stamped onto the existing SourceRecord.fetched_at/stale slots — but the item's inputs name neither the pipeline nor the specs, so whoever builds it should widen them.
