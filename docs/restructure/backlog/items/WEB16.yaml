acceptance: |
  npm run api:types needs DRYDOCS_DATA_ROOT set and says so only as a Python traceback
  buried inside a Node stack: the script shells out to scripts/dump_openapi.py, which imports
  settings that resolve the data root, so an unset root surfaces three layers down. The same
  wall was hit twice - once on API1 and again at the Lane A merge.

  (a) ONE of: the npm script checks the variable first and prints the one-line requirement, or
      the web README's generated-artifacts section names the variable beside the command (it
      names the command today and not the precondition). The first is preferred because it
      fires at the moment of failure.
  (b) Whichever is chosen, an unset DRYDOCS_DATA_ROOT produces a message that names the
      variable, before any traceback.
