id: G74
epic: seal-attribution
title: The :Employee backbone — hierarchy placement (§B7's deferral has no owner) AND the creation policy,
  where the runbook forbids exactly what seal_applications.cypher does
type: task
module: ontology
phase: 9
agent: main
model: fable
priority: p3
status: in_progress
depends_on: []
inputs:
- config/gate-log.md
- drydocs_core/ontology/relationship_vocabulary/10-node-classifications.yaml
- drydocs/loaders/cypher/seal_applications.cypher
acceptance: |
  TWO CLAUSES, one backbone. Per the signed §B7. The TOM load links an Attribution to a PERSON and stops; placing that person in the reporting structure is separate work on a separate cadence. THE DEFERRAL CURRENTLY POINTS AT NOTHING, which is what this item fixes: :Employee is a node class with NO Employee-to-Employee edge anywhere in the relationship vocabulary — no REPORTS_TO, no manager edge — and until this item there was no backlog entry that would create one. Scope: propose the edge and its provenance, route it through docs/RELATIONSHIP_GUIDE.md and the relationship-vocabulary registry as status: planned, and identify the SOURCE that could populate it. DO NOT BUILD A LOADER — the source question is the real one, and the producer-side HR hierarchy direction (two-scope HR supplement, two-pass loader, REPORTS_TO current-state sweep) is company-gated work that this item must not pre-empt. A CLOSER SOURCE MAY EXIST: group-scoped TOM roles resolve to sys_user_group MEMBERS today, which is a people-graph of a different shape — adjacency rather than hierarchy. Say whether that is a route or a distraction. SECOND CLAUSE, ADDED 2026-08-11 (SME, from a desktop session) — RULE THE :Employee CREATION POLICY, BECAUSE THE DOC AND THE CODE CONTRADICT EACH OTHER AND BOTH ARE DEFENSIBLE. The runbook's "backbone-and-enrich" rule, in BOTH v2 and the published v3, states that :Employee is created ONLY by load-employee-roster and that SEAL attaches enrich-only via OPTIONAL MATCH — "a SID not in the roster gets no edge, never a stub". seal_applications.cypher does the OPPOSITE: it MERGEs (e:Employee {employee_id: <owner/CTO/info-owner SID>}) ON CREATE SET e.source = 'SEAL', minting placeholders. DIRECTION LANDED 2026-08-18 (SME in-chat, gate-log RECORD same date): STUB-AND-ENRICH WINS. "The HR database has ~300k; my expectation is that it will be the stub and supplemented with HR data later." The loader behavior is the policy; the runbook text is what must change. What this item still owes: harmonize the runbook (v2 + published v3), rule the stub property idiom (what marks awaiting-enrichment beyond `source`), and clause 1 (REPORTS_TO + its source) in full. pat_team_roles.cypher was flipped to the MERGE-stub idiom in the RECORD's commit. MEASURED STATE (desktop graph, 2026-08-11): 11,464 :Employee nodes, ALL source='SEAL', every one minted by the seal_applications load. They carry employee_id + full_name and NO REPORTS_TO — there is no HR backbone yet. 11,445 are HAS_AGENT targets of ownership attributions; 19 are unattached (likely CTO/info-owner SIDs whose attribution did not land, or delete leftovers). THE MECHANISM IS SOUND AND SELF-RECONCILING, which is why this is a ruling and not a bug: load-employee-roster MERGEs on the SAME key and unconditionally flips source SEAL -> HR (authoritative), so a SID in both is upgraded and gains the REPORTS_TO backbone, a roster-only SID is created fresh as HR, and a SID in SEAL but in no loaded HR subtree STAYS source='SEAL'. That residual is a COVERAGE REPORT, not debris — count the source='SEAL' survivors after a roster load and you have the owners HR did not cover. The placeholders are intentional and keyed to reconcile. RULE ONE OF TWO, and record which: (a) FIX THE DOC to describe the placeholder pattern, keeping the code's behaviour — it preserves the ownership SID and name that would otherwise be LOST whenever the roster is not loaded, and the source flag keeps them cleanly reconcilable; or (b) FIX THE LOADER to OPTIONAL MATCH, if roster-only really is the intent — at the cost of dropping ownership identity when the roster is absent. NOT A MID-LOAD DECISION and not urgent: the graph is safe to run load-employee-roster against as it stands. What is NOT acceptable is leaving a design doc that forbids what the loader does, since the next reader trusts whichever they happen to open. THE RULING HAS A COMPANY-SIDE HALF, VERIFIED PRODUCER-SIDE 2026-08-11 — DO NOT RULE IT HERE ALONE. Only ONE of the three surfaces is producer-side: drydocs/loaders/cypher/seal_applications.cypher DOES mint the placeholders, at lines 145 / 169 / 192, for app_owner_sid, chief_tech_officer_sid and info_owner_sid respectively — checkable from here. The OTHER TWO ARE NOT. There is no employee-roster loader producer-side (no load-employee-roster verb, no roster cypher; the port-prompt already records tests/unit/test_employee_roster.py as company-only, T21), and the "backbone-and-enrich" runbook prose that FORBIDS the stub appears in no producer runbook under docs/design/. So the producer holds the code that mints, and the company holds both the doc that forbids it AND the loader that reconciles it. CONSEQUENCE: the producer can rule what ITS loader should do, but it cannot fix a doc it does not have, and it cannot verify the reconciliation half. Route this ruling through the port rather than landing it one-sided — the same asymmetry class as RELAY-6, and it is the second time this session that a producer-side item turned out to overlap company-only material.
notes: |
  Raised 2026-08-11 at the G35 sign-off, on the SME's instruction that the deferral needed an owner. Deliberately p3 and dependency-free: it blocks nothing and nothing blocks it, and it exists so a correct deferral stops being an omission with better wording. THE SECOND CLAUSE ARRIVED THE SAME DAY and belongs here rather than in its own item because it is the SAME BACKBONE: clause one asks what creates the Employee-to-Employee edge, clause two asks what is allowed to create the :Employee NODE. Ruling the second without the first would settle the node policy while leaving the hierarchy homeless, and ruling the first without the second would build a backbone on top of an unruled creation policy. The doc-vs-code contradiction was found by a desktop session reading the loader against the runbook, and it is the kind that survives because each surface is internally consistent — only reading both together exposes it. MERGED IN 2026-08-12 (groom, desktop) — Idea-73, "where does the employee hierarchy come from, and does it live producer-side at all", filed 2026-08-05 and open since. It is this item's clause one asked from the other end, so it rides here rather than opening a second owner. Three things it adds that the acceptance should carry through the ruling: (1) THERE IS A SECOND WAITING CONSUMER besides §B7 — O44's first column is an ownership-reconciliation view whose MANAGER FILTER is its whole point, so two committed directions currently defer to a structure that does not exist; (2) pat:people-report is NOT the source — it carries TEAMS, not reporting lines, so the closest producer-side people data cannot populate a hierarchy (G82's projection does not change that); (3) the 2026-07-23 producer-session HR-hierarchy direction — single :Employee backbone, two-scope HR supplement, two-pass loader, REPORTS_TO current-state sweep — was written FOR THE COMPANY hr-emp-hierarchy gate, which is the likeliest reason nothing landed here. So the honest outcomes include "the producer records explicitly that both halves are company-side": a deferral pointing at nothing is an omission with better wording, and saying so counts as ruling it.
