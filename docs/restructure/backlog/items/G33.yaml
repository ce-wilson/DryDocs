close_note: |
  BUILT the same day the gate signed. `drydocs load-code-snapshot` (code_snapshot.v1: adapter + cypher + CodeModuleRow + 2 constraints + the ontology_supplement U-section + source-registry/audit-fields/doc-08 ledger entries; u1_* terms flipped active). Loaded LIVE into `drydocs` (desktop, neo4jtest — retro-tagged 2026-08-04 at J18: this untagged claim is the one a laptop-side audit nearly filed as a defect, reading the laptop's graph) and verified: 1 :Project (git provenance on the node), 183 :CodeModule across the six scan-root property values, 183 HAS_MODULE, 98 IMPORTS, 183 IS_ENCODED_IN -> the seeded SwoClass Python (first SWO use); idempotent re-run byte-identical counts; m1-verify carries the §F1 co-labeling graph-test (0). TWO live catches beyond the build notes: (a) the machine's .env targeted the EE home db `neo4j` — realigned to `drydocs` per dev-environment.yaml and today's stray writes cleaned from the home db (pre-existing strays there left for the user); (b) the date-only-name stale-pick — selection now parses the filename timestamp (see the acceptance build note). 21 unit tests; full suite green.
