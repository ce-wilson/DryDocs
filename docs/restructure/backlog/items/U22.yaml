acceptance: |
  THE INCIDENT, 2026-08-13 (desktop, neo4jtest, drydocs DB): every :CodeModule carried `last_seen_at = 2026-08-02T23:06:42Z` from ONE run id -- loaded once on Aug 2, never refreshed, ELEVEN DAYS. The session read A3's top fan-in as 28, which is the Aug-2 value (the tech-debt skill's own baselines run 28 -> 29 on 08-04 -> 31 on 08-09), and it looked current. Same class as G78: not a failed read, a read that SUCCEEDED with the wrong data, sitting underneath every architecture and debt decision. `drydocs load-code-snapshot` repairs it in one command; nothing COMPARES the graph against the snapshot series. (a) THE COMPARISON EXISTS AS CODE, not as a habit: max(:CodeModule.last_seen_at) in the drydocs database against the newest `knowledge/depgraph-snapshots/drydocs-*.json` meta.captured_at, reporting the drift, the run id that last loaded, and WHICH snapshot it compared -- so "the graph is current" is falsifiable rather than assumed. (b) WARN, NOT FAIL -- ruled at this groom, and the reason is the argument CLAUDE.md already makes for snapshot.ps1's CI check: recording repo structure and passing a gate are unrelated jobs, and this check must never block a suite run or a snapshot on a machine with no database. It surfaces where the wrong number was actually consumed -- the tech-debt skill's read path -- and may ALSO ride the session ritual beside the CI check; the item states where it put it and why. (c) THE UNIT-TESTABLE HALF IS THE COMPARISON, not the freshness: a test drives it over fixtures -- fresh, stale, no snapshot on disk, empty graph, database unreachable -- and asserts each verdict, so the mechanism is guarded on a machine with no database. tests/unit/test_code_graph_review_plan.py is the offered home (it already fails when the typed package allow-list and pyproject.toml disagree, so the shape is there); a different home is fine with the reason written down. (d) DATABASE-UNREACHABLE IS A DISTINCT VERDICT, never "fresh". The failure this item exists to stop is a check that reports green because it could not look. OUT OF SCOPE, deliberately: auto-running the load. A stale graph is REPORTED, never silently refreshed -- a check that repairs what it measures can never be trusted to have measured anything. RIDER (2026-08-19 groom, from Idea-127 / R17): the depgraph HTML viewer shows the AGE too. knowledge/depgraph-snapshots/viewer.html already renders the snapshot's commit and branch from the meta header and says nothing about how OLD it is -- the same answer this comparison produces. The viewer displays this item's verdict rather than deriving a second one. R17 owns the ANSWER-side half in drydocs_api and consumes the same verdict.
notes: |
  Groomed 2026-08-13 (targeted groom -- node labels and Cypher loaders) from Idea-117, which explicitly left the warn-vs-fail call to the groom. RULED WARN in clause (b); it is reversible at the item if the builder finds a fail-safe home, but the default must not be a red suite on a laptop with no container running. MODULE graph-infra rather than docs, chosen on SUBJECT and recorded here because both were plausible: the fact under test is the loaded graph's currency against the snapshot series (U15 / U19's family), not the review plan's prose (U13 / U20's). The likely code home straddles them -- a unit test file the docs items also touch -- which is exactly why the subject and not the file decided it. PRIORITY p2, not the entry's High: the condition is repaired by one existing command and was repaired the day it was found, so what is missing is DETECTION rather than capability. U21 is the p1 of the pair because it needs a fix nothing in the repo can do today. Idea-120 (a metrics JSONL beside each snapshot) is NOT this item -- groomed 2026-08-19 as U25 -- a trend ledger answers "is it getting better", this answers "is what I am reading current".
