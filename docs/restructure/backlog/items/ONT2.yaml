acceptance: |
  Gate ontology-domain-registry-and-edition-grain, §B5 rider (SME, in-chat, 2026-09-02):
  "acronyms is a little trickier. it needs common for company, SDLC, technical, then the
  edition specific." That sentence is the design. Acronyms is a DOMAIN (a vocabulary of
  expansions - the O68 acronym surface already renders one, without a domain to live in) with
  a TIER axis, and the tiers are what make it trickier than the other 13.

  (a) MINT `acronyms` as a row in domains.yaml (CFG1) through the §B2 protocol: authority =
  the §B5 rider in the gate record; minted_by = producer; fragment 55-local-acronyms.yaml.
  The fragment's entries are expansions, not edges: id, acronym, expansion, tier, scope note,
  source. The relationship-vocabulary schema gains nothing; an expansion row is a different
  kind of entry and the fragment says so in its header (the 46-local-all precedent for a
  fragment whose entries are not the usual shape). THE EXISTING HOME IS NOT MOVED: the
  `acronyms:` block in config/taxonomy/software-registry.yaml is THE AUTHORITATIVE HOME by
  SME ruling (2026-07-21), rendered by scripts/render_software_registry.py and shown by
  AcronymsPane.tsx (O68), with expansion/source/added required per row
  (test_software_registry.py). The domain row and fragment DECLARE that block as the
  domain's store - `vocabulary_fragment` points at the registry block, not a new file - so
  the ruling stands and nothing is duplicated. If CFG1's guard requires a 4x-/5x- file, the
  fragment is a one-line pointer file and the guard follows the pointer.

  (b) FOUR TIERS, in resolution order, edition-first:
  `edition`   - owned by an edition (minted_by = its code, authority = its gate); the only tier
                an instance may write.
  `technical` - base-common: platform and vendor terms (Control-M, Oracle, Neo4j, DPL, MFTS).
  `sdlc`      - base-common: process and delivery terms (PR, ADR, HITL, SME, CI).
  `company`   - base-common: the estate's own vocabulary (LOB, SEAL, PAT, Area Product).
  Resolution: an edition's expansion wins for its readers; absent one, the three common tiers
  are searched in the order technical -> sdlc -> company, and a term present in two common
  tiers is a guard failure, not a precedence question - the SME places it once.

  (c) THE BASE-COMMON RULE (§B5 i) APPLIES: the three common tiers are base-owned and an
  edition may not override a common expansion, only ADD an edition-tier one; the aggregate
  view resolves every edition's terms against the same three common tiers, which is what
  keeps cross-edition text readable.

  (d) SEED from what exists: the `acronyms:` block already carries every row with
  expansion, source and added-date; this item adds `tier` to each, placed by the SME at a
  short gate (a table, one row per acronym, tier proposed with reason) rather than by the
  implementer. Nothing is invented; the seed is the block's current rows. The retired org
  acronym is NOT a row anywhere (J55).

  (e) PORT: the fragment is per-entry on the tom-role-vocabulary pattern - common-tier rows
  cross whole, edition-tier rows are the edition's own and stay.

  (f) GUARDS: every row names a tier from the four; no acronym appears in two common tiers;
  an edition-tier row carries an edition code that exists in editions.yaml (CFG2, when built;
  skip until then); render_software_registry.py carries `tier` through to the JSON and
  AcronymsPane groups by it; test_software_registry.py's shape test gains the field. The
  surface stays deterministic.

  Depends on CFG1 (the registry). Not in scope: any change to the relationship-vocabulary
  entry schema, any loader, the O68 pane's design beyond grouping by tier.
