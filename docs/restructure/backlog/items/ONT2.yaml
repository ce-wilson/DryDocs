acceptance: |
  Gate ontology-domain-registry-and-edition-grain, §B5 rider (SME, in-chat, 2026-09-02):
  "acronyms is a little trickier. it needs common for company, SDLC, technical, then the
  edition specific." That sentence is the design. Acronyms is a DOMAIN (a vocabulary of
  expansions - the O68 acronym surface already renders one, without a domain to live in) with
  a TIER axis, and the tiers are what make it trickier than the other 13.

  (a) MINT `acronyms` as a row in domains.yaml (CFG1) through the §B2 protocol: authority =
  the §B5 rider in the gate record; minted_by = producer; fragment 55-local-acronyms.yaml -
  ITS OWN STORE. The fragment's entries are expansions, not edges: id, acronym, expansion,
  tier, scope note, source, added. The relationship-vocabulary schema gains nothing; an
  expansion row is a different kind of entry and the fragment says so in its header (the
  46-local-all precedent for a fragment whose entries are not the usual shape).

  THE SOFTWARE-REGISTRY BLOCK WAS A HOLDING PLACE, NOT A HOME (SME, 2026-09-02, superseding
  the 2026-07-21 "authoritative home" ruling - recorded as a rider on the gate). The
  `acronyms:` block in config/taxonomy/software-registry.yaml MIGRATES to the fragment in
  the G87 shape: every row is added to 55-local-acronyms.yaml with its expansion, source and
  added-date intact and a `tier`; the block is then emptied with a comment pointing at the
  fragment and the rider; scripts/render_software_registry.py stops reading it and a
  render step reads the fragment instead; test_software_registry.py's acronym shape test
  moves with the data. Nothing is lost and nothing is duplicated.

  WHY SEPARATE - the MFTS case, which is the SME's example: "MFTS" is TWO facts. As a TERM
  it has an expansion and a tier (this domain). As a PRODUCT it is Axway SecureTransport
  white-labeled internally - a software-registry row with vendor: axway and a white-label
  marker (C43). The term links to the product by name; the two are never stored together,
  because an acronym is not a product and most acronyms (LOB, SEAL, PDN, HITL) have no
  product row at all. The registry holds product identity; the acronyms domain holds
  meaning.

  (b) FOUR TIERS, in resolution order, edition-first:
  `edition`   - owned by an edition (minted_by = its code, authority = its gate); the only tier
                an instance may write.
  `technical` - base-common: platform and vendor terms (Control-M, Oracle, Neo4j, DPL, MFTS).
  `sdlc`      - base-common: process and delivery terms (PR, ADR, HITL, SME, CI).
  `company`   - base-common: the estate's own vocabulary (LOB, SEAL, PAT, Area Product).
  Resolution: an edition's expansion wins for its readers; absent one, the common tiers are
  searched in a fixed order. HOMONYMS ARE THE REAL CASE (review F6, docs/reviews/restructure-design-review-2026-09-02.md):
  acronym pages exist because the same letters carry a technical meaning and a company
  meaning, so the entry KEY is (acronym, tier), uniqueness is one expansion per (acronym,
  tier), and one acronym MAY appear in two common tiers with two expansions. That makes the
  order among the three common tiers a real rule, and it was never ruled: the SME listed
  "company, SDLC, technical, then the edition specific"; the first draft of this item wrote
  technical -> sdlc -> company. Both are defensible (the estate's own meaning first, or the
  vendor's) and the difference decides what a reader sees, so the ORDER IS A QUESTION ON THE
  SEEDING GATE in (d), beside the per-row tier placements - not a default the implementer
  picks.

  (c) THE BASE-COMMON RULE (§B5 i) APPLIES: the three common tiers are base-owned and an
  edition may not override a common expansion, only ADD an edition-tier one; the aggregate
  view resolves every edition's terms against the same three common tiers, which is what
  keeps cross-edition text readable.

  (d) SEED = the migrated block: every row keeps expansion, source and added-date and
  gains `tier`, placed by the SME at a short gate (a table, one row per acronym, tier
  proposed with reason) rather than by the implementer. Nothing is invented. The retired
  org acronym is NOT a row anywhere (J55).

  (e) PORT: the fragment is per-entry on the tom-role-vocabulary pattern - common-tier rows
  cross whole, edition-tier rows are the edition's own and stay.

  (f) GUARDS: every row names a tier from the four; one expansion per (acronym, tier), and
  the same acronym in two tiers is allowed (a homonym, not a duplicate);
  an edition-tier row carries an edition code that exists in editions.yaml (CFG2, when built;
  skip until then); the renderer reads the fragment (J37) and AcronymsPane groups by tier;
  the migrated shape test asserts expansion/source/added/tier on every row; the emptied
  registry block stays empty (a guard, so the holding place does not refill). The surface
  stays deterministic.

  Depends on CFG1 (the registry). Not in scope: any change to the relationship-vocabulary
  entry schema, any loader, the O68 pane's design beyond grouping by tier, and the
  software-registry row shape (C43 carries the white-label marker).
