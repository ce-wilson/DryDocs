acceptance: |
  The build the SIGNED gate email-folder-assignment (config/gate-log.md 2026-08-19, 8/8) authorized and did not build: the writer that lands the assignment edge Q10 registered and fenced. (a) THE EDGE, EXACTLY AS RULED: (:Document)-[:CONCERNS]->(:ControlMFolder | :ETLProcess). The spelling is CONCERNS (§A1 -- ASSIGNED_TO was offered and declined: it names the workflow act rather than the meaning), two endpoint classes with one meaning, and the endpoint CLASS recorded on the edge (§A2, the rua §B2 convention this reuses). (b) NO ANONYMOUS ASSIGNMENT (§A3): every write carries `assigned_by` (sme | source-signal) AND an evidence pointer -- the extract line, or the ruling note. A write missing either is refused, and a test asserts the refusal rather than documenting it. (c) THE §B1 BAR IS STRUCTURAL, not prose: only a folder or process name in a STRUCTURED FIELD of the extract may PERFORM an edge. Mentions anywhere in prose -- body OR subject line -- are candidates surfaced to the SME, never edges. The assumed extract contract (the G47 synthetic samples under drydocs/data/samples/email-extracts/) has no such field, so the source-signal path ships with no live producer: a test asserts an extraction pass over the bundled samples writes ZERO edges. (d) THE FLIP LANDS HERE AND ONLY HERE (N13 §B1 -- the build flips, intent never flips anything): docs_email_concerns in 45-local-docs.yaml goes status: planned -> active in this commit, citing the gate. The map row email-concerns-subject was already flipped to confirmed at the gate and is not re-touched. (e) THE FENCE MOVES, IT DOES NOT LIFT: tests/unit/test_email_extracts.py forbids the tokens CONCERNS / ControlMFolder / ETLProcess / ASSIGNED in the LEXICAL loader's cypher. That fence stays on email_extracts.cypher FOREVER -- the lexical loader never gains the write. This item's new cypher file is exempted BY NAME; widening the check to the directory would discharge the fence instead of moving it. (f) UNASSIGNED IS FIRST-CLASS AND NEVER DECAYS (§B3): no sweep, no best-match backfill, no default. This item exposes the unassigned COUNT on a read path; wiring that count into the pending-source-correction union report is a RIDER ON N14, not scope here -- N14 is still todo and a prose dependency on an unbuilt report would strand this build. (g) THE K7 §A1 FENCE STANDS (§C1): this edge says what an email is ABOUT. It never authors folder-to-application attribution, ownership or support routing, and no derived edge may ever cite a CONCERNS edge as its basis -- traversing email -> folder -> application is legitimate READING. Retention rides the assignment (§C2): nothing here deletes, expires or purges an unassigned email. Vocabulary regenerations that ride a flip (schema graph, enforcement matrix, the SQLite mirror) land in the same commit. Full suite green.
