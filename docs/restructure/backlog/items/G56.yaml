id: G56
epic: component-topology
title: Collector captures the mount table, so shared-vs-local storage is DERIVED instead of declared (bundle
  schema v3)
type: task
module: drydocs-lineage
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
