  drift test in tests/unit, and a browser re-fetch into external/orchestration/bmc-controlm/. The
  claim commit's pen line records it. WEB18 and O59 are the precedent: web items that built their
  own renderer and artifact before the fence existed.
  (d) THE SCRAPE, LOADED FIRST. The 403-blocked fetch list was re-run in a real browser session on
  this desktop (direct fetches still get the 403): defjob, exportdefjob, deffolder, exportdeffolder
  and XML File Rules, all 9.0.21.000, summarized as GROUNDED paraphrase in
  external/orchestration/bmc-controlm/controlm-xml-definition-format.md, which is no longer a stub.
  Two corrections to the stub: the folder utilities are deffolder and exportdeffolder, not
  deftable and exportdeftable; and no captured page documents the VARIABLE NAME + VALUE form that
  our exports and the fix diff edit - defjob documents a form where NAME carries the whole
  expression. SOURCE-MANIFEST.md and module-requirements.md sections 2 and 3 now say so. Still
  missing, and named as gaps: two docs.bmc.com deprecation pages (the capture browser is not
  allowed on that domain; their substance is repeated on every utility page) and the .dtd and .xsd
  files, which sit on the Control-M/EM host.
  BUILT: scripts/render_remediation_lookup.py writes web/src/generated/remediation-lookup.json. For
  every approved change in the fix diff it walks three tiers in config/precedence.yaml order
  (bmc-baseline, internal-standards, lob-product-team). Every citation is a line the renderer found
  in the file it names, under the heading it must sit under; an anchor that matches zero lines or
  two raises. RemediationLookup.tsx renders the chain beside FixDiff on the /remediation Fix diff tab.
  (a) Every citation carries its doc, line and trust tier, plus what it may be cited as, taken from
  the module-requirements section 3 ladder. The renderer refuses SYNTHESIZED in the vendor tier and
  refuses to cite a search-snippet file as anything but a lead; an anti-vacuity test proves both
  refusals, because no live citation exercises them today. For the demo rename: 5 vendor lines
  (name length, no leading digit, the VARIABLE_INC_SEC scope caveat, the undocumented NAME + VALUE
  form, the deprecation window) with one vendor gap (the schema); 3 standards lines (R32, R38, the
  greenfield rationale); and a team gap - the demo folder declares no SEAL, and the ownership chain
  lives in internal/org/, which never goes in a published artifact. No citation reaches internal/.
  (b) Read-only: the drift test fails if the renderer imports neo4j, the graph client or a network
  library. (c) Precomputed material rides the generated-artifact pattern, drift-guarded and
  registered in the default render_board.py run.
  NOT BUILT, and stated rather than implied: no live agent call. This item ships the deterministic
  half. The acceptance makes a live call its own seam and never a QuerySpec; that seam belongs to
  the console's agent tier, which is API and agents code outside this lane's pen. The panel says so
  on screen.
