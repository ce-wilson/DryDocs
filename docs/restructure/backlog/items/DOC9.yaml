id: DOC9
epic: doc-infrastructure
title: "The committed docs/design/*.html renders get a committed-vs-source guard on the roadmap guard's shape, comparing renderer bytes rather than a normalized form"
type: task
module: docs
phase: 10
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- scripts/render_design_doc.py
- tests/unit/test_design_doc.py
- docs/design/
acceptance: |
  The board and the roadmap have test_committed_roadmap_page_matches_its_sources; the design
  docs have only the session ritual. tests/unit/test_design_doc.py pins the RENDERER
  (determinism, one surface per L13, anchors, the rev footer read from the DECLARED rev) but
  never opens a committed .html, and the stale-render check in CLAUDE.md section 0 is a habit.
  Idea-111 already records what a habit-only check costs: Lane B committed four governed design
  renders on wip branches and nothing in CI would have said either way.

  (a) For every docs/design/<stem>.md, the guard renders in memory and compares to the
      committed docs/design/<stem>.html, reporting the stems that DIFFER (all of them, not the
      first).
  (b) The comparison is on the renderer BYTES, never a normalized or whitespace-tolerant form:
      governed renders publish VERBATIM (CLAUDE.md section 6), so a restyled copy must fail.
  (c) The tolerance is settled and stated in the docstring rather than discovered later. Start
      strict - Y5 exists because a claim is a status-only edit that ships no render, and a
      design doc has no equivalent one-key edit. The case to check before committing to strict
      is a .md that changes ONLY its rev: line under the L5 feedback loop; whichever way that
      is ruled, the docstring says why.
  (d) A fixture proves the guard fails on a hand-edited .html and passes on a freshly rendered
      one (J76: the instrument gets a fixture).
notes: |
  Groomed 2026-09-08 from IDEAS.md Idea-285 (base venue, desktop); source is the Lane B close
  report (laptop, 2026-09-07) handed back to the inbox. G127 and V10 are the two items whose
  renders it noticed.

  module docs rather than a drydocs-docs (which is not a module in modules.yaml): the guard
  lives beside tests/unit/test_design_doc.py and the surfaces are docs/design/. phase 10 /
  doc-infrastructure with the rest of Epic L. p2 - a stale governed render breaks HITL feedback
  re-attachment silently, which is the failure the ritual exists to prevent.

  DONE on wip/doc9-laptop (Lane B, laptop, 2026-09-09). Six tests appended to
  tests/unit/test_design_doc.py; all 26 committed pages were byte-identical at the claim,
  so the guard arrives green rather than red-then-fixed.

  (c) RULED STRICT, and the item's own test case is what settled it - in the opposite
  direction from the way it was posed. A .md that changes only its `Rev N` line moves both
  the printed footer and sme_feedback_filename (`<doc>-rev<N>.yaml`), so a stale page at a
  rev bump hands the SME paper whose margin tags and feedback filename name the PREVIOUS
  revision. Feedback attributed to the wrong rev is the exact failure the L5/L6 loop exists
  to prevent, which makes the rev-only edit the WORST case for tolerance rather than the
  candidate for it. Y5's relaxation does not transfer: a claim ships un-rendered because the
  claim protocol REQUIRES it (it is the only channel between the two machines), and a design
  doc has no equivalent one-key edit. The ruling is in the guard's docstring and pinned by
  test_a_rev_bump_alone_is_drift_because_the_tolerance_is_strict.

  (b) BYTES, with one case NAMED but not tolerated. The report says when a difference is CR
  bytes only, because test_render_determinism::test_committed_surfaces_carry_no_cr_byte
  already owns docs/design/*.html for that and a CRLF checkout must not read as a restyle.
  Naming a case is diagnosis; tolerating it would be the normalization the clause forbids.

  IN MEMORY AS ASKED, PLUS A PIN. _fresh_page restates write_doc's two choices (doc_id is the
  .md stem, output is LF), so on its own it could drift from the writer and the guard would
  compare happily against bytes nobody ships. test_the_in_memory_page_is_what_write_doc_commits
  holds the two together on the real Control-M TDD, so the writer cannot move without breaking
  a test first.

  (d) The fixture hand-edit is ONE TRAILING NEWLINE, deliberately. A restyled <style> block
  fails any comparison at all and would prove nothing about (b); only a whitespace-only edit
  distinguishes byte-strict from whitespace-tolerant. Positive control also run on the real
  guard: one appended newline on docs/design/drydocs-core-runbook.html turned
  test_committed_design_pages_match_their_sources red with a readable report, then reverted.

  VERIFIED: full suite 3883 passed / 15 skipped / 0 failed; the J57 family plus
  test_skip_guard_policy and test_never_port_citations, 73 passed; ruff check and
  ruff format --check clean.

  FOR LANE A - A PORT CONSEQUENCE, NOT A MANIFEST WRITE (the `port` pen is Lane A's, so this
  is a note as ruled). tests/** is `evaluate`, so this guard CROSSES. Company-side it will
  demand that every committed docs/design/*.html equals a fresh render of the company's own
  .md - which is precisely what PORT-MANIFEST.yaml already rules: docs/design/** is
  `evaluate`, controlm-ingestion-tdd.md is `canonical-company` and AHEAD of the producer copy,
  and its .html is `disposition: derived` with the note "regenerate consumer-side, never take
  the producer render". So the guard makes that existing disposition executable for the first
  time. The consequence to expect: if any consumer page was ever TAKEN rather than
  regenerated, the first port after this lands goes red on that stem - a true finding, and the
  fix is to run `poetry run python scripts/render_design_doc.py docs/design/*.md` on that
  side, never to relax the guard. Worth a line in the port relay so it is not read as a
  producer defect (J63: absent-here vs not-yet-ported, inverted).

  NOT DONE, deliberately: docs/design/*.html is a derived render on Lane A's fence, and
  nothing needed regenerating anyway. No new tracked path, so no PORT-MANIFEST row to hand
  back. The fixtures live in tmp_path.
