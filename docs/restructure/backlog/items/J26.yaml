acceptance: |
  Every guard that asserts over the TEXT of a committed file is inventoried, and each one either matches STRUCTURALLY (anchored at line start, or parsed) or carries a one-line note saying why a bare substring is correct there. At minimum the named candidates are checked: the render-drift checks, the PORT-MANIFEST walk, and test_database_names.py — whose module-constant guard keys on the exact identifier `DATABASE` and therefore missed a differently named constant (G51 owns that fix; this item owns the class). A regression test proves at least one swept guard now survives a file describing its own mechanism in a comment.
notes: |
  Groomed 2026-08-02 from the 2026-08-01 [chore] line. The instance: test_schema.py::test_constraint_count counted `CREATE CONSTRAINT` ANYWHERE in the file, so documenting a DDL trap in a `//` comment inflated the count and simultaneously false-failed test_constraints_are_idempotent (the comment "has no IF NOT EXISTS"). S3 fixed it by anchoring both at line start, mirroring constraints.py::_DECLARATION_RE, which the bootstrap presence guard already used. The generalisation is the point: a guard that reads prose makes the file unable to explain itself, and this repo's whole doctrine is that the reasoning IS the audit trail. SECOND INSTANCE (merged 2026-08-04 from the G51-tail inbox line): the same day produced a sibling of the same family — test_databases_match_provisioning_script promised "exactly what 01_databases.cypher creates" in its docstring and asserted only yaml ⊆ cypher, so a database added to the DDL and not the config passed green. Made bidirectional at the G51 tail (aa0a0eb) and it FAILED on ['ddschema'] before the config fix — the audit proven, not argued. The sweep's inventory should cover promise-vs-assertion mismatches (docstring says equality, code checks subset), not only substring anchoring. J28 is the third family member (a classifier, kept separate as a bug with a proof case).
