id: O59
epic: web-console
title: 'The /remediation intake surface: an SME reads the folder-set profile (FIDs, variables, emails)
  and supplies the substitutions the XML cannot carry'
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p1
status: done
depends_on:
