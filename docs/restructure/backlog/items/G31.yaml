acceptance: |
  02_proxy_constraints.cypher declares a constrained business key for every class that must be joinable ACROSS the database boundaries G32 rules — at minimum SoftwareProduct.product_id, Vendor.vendor_id, Document.doc_id and ControlMFolder.folder_id alongside the existing DataAsset.assetId and ControlMJob(folder_id, job_id) — its header names every database it must be run against (it currently names only drydocs and ddcontext, omitting ddlineage), and provision.ps1 runs it against each. A test asserts the proxy set covers every class that appears on BOTH sides of a cross-database relationship in the shipped loaders, so adding such a relationship without a proxy key fails.
notes: |
  MEASURED 2026-07-26: 02_proxy_constraints.cypher — the file whose entire job is making cross-database joins possible — declares exactly TWO keys (DataAsset.assetId, ControlMJob NODE KEY) and its header names only drydocs and ddcontext. No SoftwareProduct, no Vendor, no Document, no ControlMFolder, no Employee. ADR 0006's existing plan to re-target the bmc-docs corpus to dddocs already depends on a SoftwareProduct proxy that nobody wrote down; see Q8 for what that omission does at runtime (silently drops every DESCRIBES edge). BUILD ORDER IS THE POINT: spine first, corpora second. The reverse order is how you get a green load that wrote nothing — the pattern this session hit three times. Q9/Q10/Q11 all depend on this item for exactly that reason.
