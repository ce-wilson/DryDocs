- web/src/routes/AskRoute.tsx
- web/src/explorer/SpecGrid.tsx
acceptance: |
  Every route reimplements connect, fetch, guard against unmount, set state: the VITE_API_URL
  literal with its localhost fallback in twelve files beside `apiBaseUrl()` which already does
  it, `useMemo(() => createApiAccess(...))` in sixteen, the hand-rolled `let cancelled = false`
  effect in fourteen (A6, T6). No request has a deadline or a cancel path - zero
  AbortController, zero `signal:` in web/src - so a hung request and a loading one are the same
  screen, navigating away leaves the work running, and the Ask stream cannot be stopped (S5).
  Nothing dedupes: two panes needing one spec run it twice (S6).

  (a) One `useGraphQuery(specId, params)` hook (or equivalent, builder's name) owns the
      transport: it obtains access from one shared provider (no per-route `createApiAccess`),
      passes an AbortController signal and aborts on unmount and on param change, applies a
      deadline (a recorded default, per-call override), dedupes identical in-flight requests,
      and returns a state union - loading | data | empty | error(timeout | aborted | failed).
  (b) The forty preambles are gone: zero `localhost:8001` literals outside `apiBaseUrl()`,
      zero `createApiAccess(` outside the provider, zero `let cancelled = false` in web/src -
      each asserted by a source scan.
  (c) The Ask stream (`runAgentSse`) accepts a signal and the UI has a stop control that aborts
      it; a stopped turn renders as stopped, never as an answer.
  (d) NO RETRY, stated: the hook does not retry, and its module comment records that a read
      console chooses not to and why (a transient 502 must surface, not be papered over) - the
      report's point that a defensible choice should be a stated one.
  (e) A cache is NOT built here unless trivial; the union and the dedupe are what WEB1's seam
      composes with, and a cache with classification-aware invalidation is its own decision.
