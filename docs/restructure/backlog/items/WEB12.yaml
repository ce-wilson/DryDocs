id: WEB12
epic: web-console
title: A useGraphQuery data-layer hook replaces the forty transport preambles - one AbortController per
  request, a deadline, in-flight dedupe, a stated no-retry rule, and a stop control on the Ask stream
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
