  place, and "seal" is a proper noun as a directory name. Target knowledge/org/ follows
  the J14 pattern (sanitized public captures live under knowledge/; verbatim twins
  under internal/ — product-overview.md's verbatim capture is already at
  internal/org/product-overview.md). depends_on K20 is deliberate sequencing, not a
  data dependency: K20's gate-prompt draft cites
  docs/Product/technology_roles_and_responsibilities.md as evidence, so the move runs
  after K20 completes to avoid churning an item mid-draft — K20 itself moves nothing
  (rider recorded in K20's notes). Reference census as of 2026-08-26: zero code
  references to any docs/Product file (py/cypher/sql/js/ps1 trees swept); living prose
  references are exactly the four in acceptance; everything else is dated or generated
  (depgraph snapshots regenerate). SEAL as a TERM stays — the ruled boundary is that
