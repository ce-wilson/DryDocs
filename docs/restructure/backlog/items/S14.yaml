  entry — fold in or narrow, keep the reason's "consumer has the authoritative
  originals internally" sentence); (2) git-readme.md directory table row; (3) both
  knowledge/upgrade-plans/docmeta-component.md T3 source paths; (4) the K5-amendment
  gate prompt drafted by K20 — IF still unsigned, repoint its
  technology_roles_and_responsibilities.md citation; if already SIGNED, leave the
  prompt and gate-log untouched (L25: signed records keep their as-of paths) and note
