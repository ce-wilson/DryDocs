acceptance: |
  A pure test walks the drydocs_core.config settings groups (env_prefix + field names ->
  expected env-var names) and asserts each appears in the committed .env.example, so the
  runtime shape is reproducible from a clean checkout with no value ever committed. Failure
  message names the missing key and the settings group. .env.example updated if names are
  missing today (names only). Full suite + ruff.
notes: |
