  INTROSPECTED (every BaseSettings subclass in drydocs_core.config, env_prefix + field name ->
  expected env var), so a new group or field is covered the moment it exists; pydantic
  properties are excluded by construction. A precondition test pins >= 3 groups each declaring
  an env_prefix (the empty-walk-is-vacuously-green trap, per G81). Failure message names the
  missing key AND its settings group. RED first at e198d634: NEO4J_IMPORT_DIR
