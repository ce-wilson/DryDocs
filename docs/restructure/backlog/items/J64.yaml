id: J64
epic: release-infrastructure
title: A depgraph snapshot scanned before the commit it stamps is a claim about a tree that was
  never scanned - scan after, not before
type: bug
module: graph-infra
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- knowledge/depgraph-snapshots/snapshot.ps1
- knowledge/depgraph-snapshots/README.md
- tests/unit/test_depgraph_snapshots.py
acceptance: |
  (a) THE ORDERING IS ENFORCED IN THE SCRIPT, NOT LEFT TO THE RITUAL'S PROSE. The snapshot stamps
  a git metadata header - commit, full sha, branch, describe, subject and dirty flag - so the scan
  must run against the tree of the commit it stamps. A scan taken before that commit exists makes
  the stamp a claim about a tree nobody scanned.

  (b) THE 2026-08-29 INCIDENT IS THE TEST CASE. A snapshot taken from the pre-merge tree recorded
  a directory that main had renamed on 2026-08-26, tripped the J55 publish-boundary guard, and had
  to be deleted and regenerated against the merge commit. Reproduce the ordering fault once,
  confirm the fix prevents it, and record both in the close note.

  (c) A DIRTY TREE AT SCAN TIME IS REPORTED AS SUCH rather than stamped silently, since the header
  already carries the flag and nothing reads it.

  (d) OUT OF SCOPE, DELIBERATELY - the CADENCE question. Thirty of the last thirty-three rolls
  carried no debt signal at all, and the four candidate directions are a user ruling that stays in
  the inbox. This item changes ordering only and rolls exactly as often as it does today.

  (e) SIBLING DEFECTS IN THE SAME SCRIPT ARE NOT RE-SOLVED HERE - the board refresh skipping
  silently is J65, and the session-close CI verdict's detached-HEAD blindness is U27.
notes: |
  Groomed 2026-08-30 (desktop, weekly groom) from Idea-206, taking ONLY its second clause. The
  entry states in terms that the cadence directions are deliberately not chosen, so grooming them
  would be guessing at a user decision; the ordering half is a plain defect with a reproduction.

  The cadence half stays in the inbox as an open question and is named in the groom report.
  DONE 2026-09-08 (desktop, Lane A).
  (a) Enforced in the script: at the point the header's commit is read, tracked changes
      (Get-WorktreeState.dirty, U15 - untracked paths never count) REFUSE the scan with the
      paths listed and the fix stated (commit - a refreshed stale render is the usual way to
      arrive here - then re-run). New switch -AllowDirty downgrades the refusal to a warning
      for a deliberate mid-work comparison; the header still says dirty=true. README gains
      the paragraph beside the CI-check one; header list gains J64. Guard:
      test_a_dirty_tree_at_scan_time_is_refused_not_stamped in test_depgraph_snapshots.py.
  (b) The fault, reproduced by the record rather than by a destructive re-run: the header
      path read dirty into meta.git and printed nothing, so the 20260805 snapshot was
      committed carrying dirty=true (the U15 comment's own case) and the 2026-08-29
      snapshot scanned from a tree predating main's 08-26 rename sweep named the retired
      directory and was regenerated at 2b06c153. The fix, run live (desktop, PowerShell tool,
      HEAD 4cb966c9, README.md and snapshot.ps1 modified): every refresh step ran, the CI
      line printed, then `Refusing to scan - tracked changes present at scan time - the
      header would name commit 4cb966c9 for a tree that commit does not describe.` with
      the two paths; no file written, the committed drydocs-20260908-1839.json untouched.
      The clean-tree run is the ritual at the end of this sitting.
  (c) Reported: the refusal names the paths; -AllowDirty prints them as a warning and the
      header records dirty=true, which is now a flag that something read.
  (d) Cadence untouched; the script rolls when it is run, as before.
  (e) J65 landed in the commit before this one; U27 follows. Neither re-solved here.
