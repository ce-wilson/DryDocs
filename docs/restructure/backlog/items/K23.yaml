acceptance: |
  A recorded verdict in knowledge/upgrade-plans/servicenow-replica-evidence.md, where open questions 8 and 9 already sit, answering ONE question with evidence rather than plausibility: is the KB-article-to-Deployment-Module link ASSERTED by an author, or DEFAULTED by the form the way transactional records default their module? The check comes FIRST because the defect it looks for would hit KB articles identically to Changes and Incidents, and a graph built on a defaulted foreign key attaches documented fixes to the wrong deployment while looking perfectly populated. On the strength of that verdict, a RECOMMENDATION -- promote the kb_* family from ring 3 to a pull candidate, or leave it in ring 3 with the reason -- routed to the gate that rules the pull scope, never enacted here. NOTHING ACTIVATED: no source row written to config/source-registry.yaml, no loader, no edge. Any edge the recommendation implies is registered status: planned and goes through docs/RELATIONSHIP_GUIDE.md and the HITL gate. AMENDED 2026-08-19 by the export profile below. The ASSERTED-vs-DEFAULTED dichotomy is MOOT for the designed columns, because they are not populated at all -- an empty field is neither asserted nor defaulted. The live question the verdict must now answer is narrower and sharper: given that the only working SEAL link is at APPLICATION grain with 44% coverage and owning-not-subject semantics, does the kb_* family leave ring 3? The original question survives only for u_correlation_id itself: is that value authored per article, or defaulted from the article's owning base/content owner? The illustrative rows suggest the latter, which is exactly the defect this item was written to look for -- arriving on a different field than the one it was aimed at.
notes: |
  Groomed 2026-08-11 from Idea-102's separate thread. The SME called KB articles at deployment grain "more meaningful", and a documented fix attached to the deployment that has the incident is squarely what a production-support knowledge graph is for -- which is why it earns an item rather than a line inside K22. Deliberately an ASSESSMENT and not an ingestion: ring 3 is where the family sits today, and the value of the item is that it is allowed to come back "leave it there" with evidence. EVIDENCE ARRIVED 2026-08-19 (SME screenshots; profiling ran on the SME's own machine against a dated CSV export of the KB view, NOT in this tree -- the file is not present here and these numbers could not be re-derived producer-side, J18). Shapes only per the publish boundary: the view's real db/schema, the SEAL id values, the KB article numbers, the content-owner SID and the support-group names all stay out of this repo. Registry grammar for the object is snow@[db].[schema].v_kb_knowledge. THE HEADLINE, and it lands on K23's premise rather than beside it: EVERY purpose-built SEAL/attribution column is 0-of-200 filled -- u_seal_id, u_do_you_have_seal_id, u_business_application, u_product_owner, u_assignment_group. The designed linkage does not exist in the export. Deployment grain in particular is unreachable: evidence-doc Q7 established that a deployment link shows as the composite app:deployment name (or the CI id), and every populated value here is a BARE app id with no deployment segment. So the SME's "KB articles at deployment grain" premise is not merely unconfirmed -- this export cannot express it. WHAT DOES CARRY A LINK: u_correlation_id, 88 of 200 (44%), 77 distinct values, all numeric and 4-6 digits, i.e. SEAL-shaped at APPLICATION grain. 112 of 200 (56%) have no SEAL link on any field. Secondary signals, none of them a substitute: the KB base field is 100% filled with 15 distinct values (a base grouping, at best a coarse owning-domain proxy, and the top 3 hold 131 of 200); u_content_owner 48% as free text (person / SID / group, so it reaches an app only indirectly via the support group); ownership_group 4.5%. THE CAVEAT THAT DECIDES THE VERDICT: u_correlation_id looks like the OWNING app's SEAL, not the article's SUBJECT SEAL. Two sampled rows cite a different SEAL inside the article title than the one in u_correlation_id. If that generalises, then even the 44% is answering "who owns this article" rather than "what is this article about" -- and an edge built on it would attach documented fixes to the wrong application while looking well populated, which is the K23 defect exactly, one grain up from where the item expected it. NOT SETTLED, and the write-up must say so: whether the 200-article export is the whole KB or a projection (the same completeness doubt as evidence-doc Q9, one level down), and whether the owning-vs-subject reading holds beyond the two sampled rows. A subject-precise mapping would require parsing the SEAL out of the article title or body, which is a different and much weaker capture than a structured foreign key. DIRECTION OF TRAVEL: this evidence points at "leave the kb_* family in ring 3, with the reason recorded" rather than at promotion. The item is NOT closed by it -- the acceptance puts the verdict in knowledge/upgrade-plans/servicenow-replica-evidence.md beside Q8/Q9. VERDICT RECORDED 2026-08-19 as evidence-doc section 11 -- 11.1 why the ASSERTED-vs-DEFAULTED question dissolved, 11.2 what the export does carry, 11.3 the recommendation, 11.4 the surviving use case. Section 7.4's NOT-TAKEN row now points at it, so a reader of the pull scope meets the ruling rather than the deferral. RECOMMENDATION: leave the kb_* family OUT as an attribution source, with the REASON recorded rather than the deferral -- routed to the gate that rules pull scope, not enacted here. Nothing activated: no registry row, no loader, no edge. K23 STAYS OPEN AND ITS SCOPE HAS MOVED (user direction 2026-08-19). The attribution question is answered; what remains is the named use case that keeps the family alive. THE REMEDIATION MODULE searches the existing KB for articles covering the same defect, DOWNLOADS them for reference and archiving, and only then authors a new article. That consumer is untouched by everything the profile found: it wants the article as a DOCUMENT to find, read, cite and retain, not as a node to attach to an application, and the KB SQL that already exists matches on short_description with a body-text fallback while ignoring the SEAL columns entirely. So the 0-of-200 finding does not reach it, the owning-vs-subject caveat does not reach it, and 44% coverage stops being a blocker because the denominator is articles that MATCH THE DEFECT, not articles that carry a key. WHAT THIS ITEM NOW OWES, per section 11.4, none of it settled: the READ PATH (the Snowflake view vs the ServiceNow API vs an offline export -- different freshness and permission consequences); WHERE A DOWNLOADED ARTICLE LANDS, which is a publish-boundary question with a ready answer -- a KB body is company prose, so it belongs in the out-of-repo data root as a DECLARED landing zone (drydocs_core/landing_zones.py) rather than an ad-hoc download directory; whether the archived copy is a CITATION (a convenience) or a SOURCE a fix package quotes (evidence, carrying a retention obligation -- the different ruling, and the one with consequences); and the DUPLICATE TEST, since "search before authoring" implies a bar for "already covered" that a LIKE pattern over short_description is a weak instrument for. MODULE NOTE: the work has moved out of taxonomy and into drydocs-remediation (detect -> transform -> prove -> Jira, ADR 0002-B). Left at module: taxonomy for now because re-homing an item is a groom decision, not a side effect of recording a verdict -- flagged here so the next groom moves it deliberately. QUESTION 3 RULED 2026-08-19 (SME) -- recorded as evidence-doc section 11.5. The articles expected back are RUNBOOKS, FOUND BY CONTROL-M FOLDER, which is what the existing KB SQL already does: it builds its LIKE patterns from the folder/job name. A batch EXTRACTS the runbook, saves it to the fix Jira as a BASELINE, REPLACES it, and captures ACCURACY and STALENESS metrics to gauge cleanup effort and progress. So the archive is a SOURCE, not a citation -- three independent reasons, any one sufficient: it is the before-half of a before/after pair; the original is REPLACED, so the archived copy becomes the only surviving record of what the runbook said; and the metrics are measured against it, so a score that cannot be re-derived from the artifact it scored is an assertion rather than a measurement. THE RETENTION OBLIGATION IS STRONGER THAN THE EMAIL-EXTRACT PRECEDENT. That pair is a system of record because the upstream purges on a 6-18 month cycle; here WE overwrite the upstream ourselves, deliberately, as the last step of the fix. Two ordering rules follow: CAPTURE BEFORE REPLACE, treating a failed capture as a failed step (a batch that replaces a runbook it did not archive has destroyed its own baseline), and the archived copy is IMMUTABLE once written. Question 2 is decided by this rather than open beside it: the archive belongs in the out-of-repo data root as a DECLARED landing zone (drop_dir_base: data_root, guarded by tests/unit/test_landing_zones.py) -- a baseline a port-time git clean can reach is a baseline that disappears without a log. THE METRICS NEED DEFINITION AND ONE IS NEARLY FREE. The cheap reading of staleness is the one the SME already rejected -- Q11's problem statement is that stale versions are distinguishable only BY DATE. A measured staleness is available because G68 profiles a folder set into four where-used censuses (shape, identity/FIDs/run-as/SEAL, variables, contacts), which is a ground truth for the same folder the runbook documents: ACCURACY = of the entities a runbook names, how many still exist and still mean what it says; STALENESS = the drift between the runbook's picture and G68's current one. That also gives cleanup a DENOMINATOR, which is exactly G93's defect on the documentation axis -- so it should ride G93's run-log contract, not grow a second reporting path. HANDS TO Q11, AND SOMEONE SHOULD DECIDE WHETHER TO AMEND THAT PROMPT: the document-supersession gate's clause C asks who ASSERTS supersession -- a capture pipeline OBSERVING a replacement, or an SME RULING two captures are versions of one thing. Remediation is neither: it PERFORMS the replacement, so it does not infer supersession, it KNOWS it, and can name the fix id as the basis. That is the most reliable assertion class the edge will get, and clause C would be ruled without it unless the prompt is amended before signing. NOT amended here -- Q11 is done and its prompt is the deliverable, so touching it is a decision, not a side effect. HANDS TO G68: a candidate FIFTH census -- documentation, i.e. which folders in the set have a runbook, which do not, and how each scores. Proposed to that item, not assumed. STILL OPEN AFTER THIS RULING: the scoring rules (entity existence is tractable, "still means what it says" is a judgement -- rule the tractable subset and say the rest is unscored rather than inventing a similarity number); whether a folder with NO runbook at all is a finding, which is a GAP report rather than a staleness one and is arguably the more valuable output; and the section 11.4 question 4 duplicate/coverage bar, now sharper because a false negative in the LIKE search silently becomes "this folder has no runbook" in that same gap report.
