acceptance: |
  Builds ONLY after ADR 0021 is ACCEPTED (its acceptance is the SME's at sitting 1; the record is
  PROPOSED today). (a) One frozen dataclass in drydocs_core with exactly three states; bool() on it
  raises; every state renders itself as an operator line; NOT_CHECKED carries a reason of at least
  forty characters. (b) A declared registry of probe dotted-names in core, and a unit guard that
  imports each, reads its return annotation through tests/source_scan.py (J66), and fails a
  registered probe that returns a bare bool or is unannotated - with a positive and a negative case,
  and a shrink-only rule (a registered name that no longer resolves fails). (c) First adopters:
  drydocs/port/port_preflight.py replaces its interim third state with the type, and
  drydocs/docs_coverage.py expresses None-for-not-probed through it, behavior unchanged. (d) The
  six precedent sites named in ADR 0021 gain ONE citing comment each and are not rewritten.
  (e) MODULE_MAP.md re-rendered; module boundary and J57 guards green.
