  the module.

  (c) WHAT MUST NOT CHANGE: the gates: [data-flow-overview] edge on MM3 itself stays. The
  evidence-ref grammar MM3 built IS gate territory (section E), so MM3 belongs to this gate -
  it is simply not the item that closes the Output-tab fields.

  (d) THE CROSS-REPO STEP, and it is required for this item to be complete:
  config/gate-prompts/** is canonical-company (PORT-MANIFEST, J51 rows), so the producer edit
