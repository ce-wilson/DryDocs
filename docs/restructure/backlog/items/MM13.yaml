  correction as a RELAY line in the port ledger naming the nine sites and the substitution, so
  the company's signed-or-drafting copy can take it section by section rather than wholesale.

  (e) PASS/FAIL: no occurrence of MM3 in the prompt describes Output-tab/log-substrate work;
  MM7 does; MM3 appears only where the evidence-ref grammar is meant; the relay line exists.
notes: |
  Groomed 2026-09-02 from Idea-237 (desktop, backlog-groomer fork). Found while closing MM3
  (laptop, same day).

  WHY IT IS WORTH AN ITEM AT ALL: a reader who takes the prompt at its word will look for MM3
  to close the Output-tab fields and find a mind-map state file. The prompt says absent until
  MM3 lands and the field says so, which is now a false statement about which item to wait for.

  HOW IT HAPPENED, recorded because the class recurs: the prompt was drafted 2026-08-21 and the
  item numbers shifted at a groom afterwards. Nothing re-points a prompt when a groom renumbers
  around it - the same currency gap I8 reports for depends_on, seen on a different surface.

  The idea filed this as an inbox line rather than a fix precisely because of the
  canonical-company disposition; clause (d) is that concern turned into a step rather than a
  reason not to act.
