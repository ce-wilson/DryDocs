  FILED p2 AGAINST A PROPOSED HIGH, stated per the R15 precedent: this is a presentation defect on a working surface — nothing is unreadable or unreachable, and no data is wrong — so it sits below the correctness defects groomed from the same batch (O64 loses user input, O66 makes a graph unreadable, R20/R21 return wrong answers). Promote it if the console is about to be demonstrated.
