acceptance: |
  In dark mode the shared React controls on the left vertical rail and the Source panel at the bottom right render on the page's DARK panel and background tokens instead of the off-white light-mode surface they use today. The fix is at the token/shared-style level — audit the shared control and source styles and find where they resolve a light surface unconditionally — not a per-page override, because a per-page patch leaves the same defect on every surface that reuses those controls.

  Preserved through the change and each checked explicitly: readable text contrast, borders, focus states (the keyboard ring must not vanish into a dark background — this is the one that gets lost), and the Source panel's affordances.

  Verification is BOTH themes, screenshotted: light mode must be unchanged, since a dark-mode fix that quietly restyles light mode is a second defect. `npm run build` and oxlint clean; `ui-components.yaml` / `ui-tests.yaml` rows touched if the audit moves or renames a shared style.
notes: |
