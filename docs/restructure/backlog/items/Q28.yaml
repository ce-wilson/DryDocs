  ## Close (Lane B, laptop, 2026-09-10) - wip/q28-laptop, stacked on wip/meta2-laptop

  (a) TWO EDITS, ONE COMMIT: the `bmc-docs-controlm-parameters` row and
  `corpus_id="bmc-docs-controlm-parameters"` on the tree, in one commit.
  (b) The dataclass comment is CORRECTED, not merely supplemented: it said
  "conversion refuses rather than guessing", and the refusal is a whole pipeline
  stage earlier - the Q23 join runs in main() before the TOC request, so the
  tree was INERT, not merely unconvertible.
  (c) Field values per the sibling, departing only where the facts differ.
  (d)(e) captured_at carries `not-yet-captured` - a STATE, because the External
  branch of the doc-registry guard requires a TRUTHY captured_at, so `null`
  would have failed and an invented date would have lied. Nothing parses it:
  docs_verify._freshness string-compares it and reports "uncheckable" against an
  empty graph. capture_rung is `unprobed`, NOT the sibling's 3 - inheriting the
  rung would record a capture that never ran, the exact failure G134 added the
  field to expose. confirmed: false with the reason on the row.

