acceptance: |
  For ONE application, three counts are reported (counts ONLY — never a row dump; the output is Internal and lands company-side): (a) total directory rows for that application; (b) |demand set ∩ that application|, where the demand set is the union of run-as owners in the Control-M extract, distinct STG_APP_FACT fact_value rows with fact_type='FID' the K2 resolver currently counts unresolved, and account names in registered adhoc evidence; (c) the breakdown of (a) minus (b) by the directory's own type/status columns. PLUS the §Q0 measurement the gate cannot sign without: of the accounts in the demand set, how many have a directory application assignment that DISAGREES with the Control-M-derived folder attribution, and the by-case split of those disagreements into "different subjects, both correct" vs "stale directory" vs "wrong folder attribution" (§G5). Doc 09's phase table is updated with the real numbers. No pull beyond the demand set; no rows loaded.
notes: |
  Groomed 2026-08-05 (desktop) from the 2026-08-05 IDEAS entries. THIS RUNS BEFORE THE GATE, not after: "about two hundred accounts per application" is the estimate the gate cannot rule on, and the census turns it into "N of ~200, and here is what the other rows are". The §Q0 disagreement breakdown is the part that decides whether the directory is a trustworthy ownership source with expected consumer divergence, or a lagging record needing remediation — a question raised only after the gate was drafted, which is why it sits in a separate item rather than inside the gate page. module: config (a source-scoping measurement, not a loader). Producer-side this repo carries the METHOD; the counts themselves are Internal. PRODUCER HALF DELIVERED 2026-08-07 (laptop), and the item is BLOCKED rather than done because its acceptance asks for real counts this repo structurally cannot produce — it holds no directory extract, which is the whole point of the demand-set pull. Shipped: drydocs/fid_census.py (pure — opens no file, contacts no database, writes nothing; every input injected), tests/unit/test_fid_census.py (14 tests, all synthetic), and docs/k16-fid-census-company-prompt.md following the 2026-08-07 company-pack convention. Doc 09 gains a "The numbers" table with every cell marked pending, and an explicit note that an empty cell means NOT MEASURED, never zero. TWO DESIGN DECISIONS WORTH KNOWING BEFORE THE COUNTS ARRIVE. (1) COUNTS-ONLY IS ENFORCED BY THE RETURN TYPE, not by discipline: FidCensus holds int and dict[str,int] fields only, so a row dump is UNEXPRESSIBLE, and a test pins that structurally. That is what lets the result travel back into this repo at all — a later field carrying account names would leak Internal values into a producer-side artifact. (2) THE §G5 READING IS NEVER COMPUTED. The gate says the three readings are distinguished per case and never globally, with a human ruling each — so the census counts disagreements mechanically and parks every one in `unruled` until an SME ruling is injected. The number still sitting in `unruled` is itself reportable: the never-silent rule applied to the report rather than to a load. THE BLOCKER'S REASON CHANGED 2026-08-12 (SME evidence) — still blocked, much smaller ask. The FID directory is not an external system needing an export or an onboarding: it is `psgmgr.HR_PHONE_EXP`, functional rows `EMP_TYP_CD = 'FCT'`, in the replica ALREADY IN SCOPE and already the Control-M source. So the census is a SINGLE-SCHEMA JOIN — demand set (i) from CM_DEF_VJOB.OWNER against the directory in the same schema — and no new source crosses the boundary. Status stays blocked because the counts are Internal and this repo has no psgmgr access, which is unchanged; what changed is that satisfying it no longer waits on a source onboarding, only on someone running the query company-side. RUN Q6 FIRST (gate fid-identity-and-scope): whether CM_DEF_VJOB.OWNER holds the NAME or the ID decides the join key, and the two keys give different demand sets. Measuring with the wrong one produces a confident wrong number. module: config is kept as the WORK AREA; the code module classifies as drydocs-review in test_module_boundary.py (it loads nothing and configures nothing — it produces the counts an SME rules from, the same reasoning that puts source_mappings there).
  TWO-SOURCE EVIDENCE 2026-08-19 (desktop; SME captures made on the SME machine, moved to the data root fid/screenshots/ per the G42 precedent — J18, shapes only in this repo). The SME establishes TWO pull surfaces, recorded as doc 09's new "Two sources, two grains" section. (A) the HR employee-data custom solution — the FID NAME (no application id in the row) carried as a functional-type HR entry with the MANAGER field repurposed as the account's owner; profiled at 227 rows / 23 cols, every id unique, only 54 distinct names, ONE agent-account name registered 171 separate ways (75%) each to a different manager+cost center — so the grain is (account id, owner), exactly what fid_census.py was built for, and this source answers WHO OWNS, never WHICH APPLICATION. SME clarification 2026-08-19: that 171-way name is the Control-M PLATFORM user (jobs running as Control-M itself), a run_as CLASS the plan had not separated — and it is cross-platform (Informatica carries several such accounts for business-application jobs). Doc 09's two-source section carries the consequence; K25's detector now classifies run_as by class first. (B) the id-owner application searched BY application id — record id / FID / type / purpose / name; measured by-application totals 555, 500, 209, 59 across four captures (the "about two hundred" estimate spans an order of magnitude); SME caveat -- a by-application listing carries ALL environments and ALL subtypes including ids that connect to OTHER applications, app-to-app, and human shared accounts, so census (a) is an upper bound by construction and the gate's §D filters decide the rest. The join between the sources is the NAME (the key §A rules unsafe as identity) — name is the join, id is the identity, and the census can measure the join's lossiness. Census row (a) in doc 09 now carries the four measured totals. ALSO delivered -- knowledge/standards/technology/functional-id-concepts.md, the firm's FID doctrine transcribed generically (identity-not-account, record/legacy ids, id taxonomy, FID-vs-accounts 1-to-many, owner roles, individual vs catalog-role assignment, the succession cascade that rewrites ownership with no FID-side event — the §B3 as-of argument, now sourced). K25 direct-added for the cross-application run_as class. STILL OPEN, why this stays in_progress -- the acceptance's demand-set INTERSECTION counts ((b), the §Q0 disagreement rate) need the census run against a real extract, which remains company-side.
