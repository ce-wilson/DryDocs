     map moves an hour.
  4. `map.runtime-spans.v1` returns nulls for jobs with no timing rather than
     dropping them, on purpose — the count of jobs the map cannot draw is an answer
     to a real question. If a future consumer wants only drawable rows, that is a
     parameter, not a change to the spec's WHERE.

