id: WEB5
epic: web-console
title: An error boundary per route outlet, keyed on pathname - one render throw breaks one panel instead
  of blanking the whole console
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
