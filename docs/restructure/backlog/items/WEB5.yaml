- web/src/layout/Aside.tsx
acceptance: |
  There is no ErrorBoundary and no componentDidCatch in web/src; React 19 unmounts the whole
  tree on an uncaught render error, so one bad row produces a white page with no navigation and
  no way back but a reload (S7).

  (a) One error boundary per route outlet, keyed on pathname so navigation clears it; a render
      throw in one route leaves the shell, the nav and every other route usable.
  (b) The fallback panel shows the error message verbatim (the O63 honesty rule - the exact
      string is what a reader pastes into a ticket) and a retry affordance; it never shows a
      stack trace or any value from the data that threw.
  (c) A vitest renders a route that throws and asserts the shell survives and the panel shows.
