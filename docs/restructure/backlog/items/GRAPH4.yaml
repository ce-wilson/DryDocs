  ## The ruling the conversion turned on

  `without_prose`, not `code_only`, is the right default. `code_only` strips
  string literals and re-joins tokens with single spaces; six of the twenty
  subjects ARE literals (a dict key, embedded Cypher, four UI labels), and
  `code_only` would have made those guards pass on nothing — CORE2's exact
  failure, six of six. `without_prose` removes only comments and docstrings,
  which is precisely J66's defect, and preserves layout character-for-character.
  A blanket "convert to code_only" would have been a regression dressed as a fix.

  ## Note for CLAUDE.md section 6 — Lane A carries this (adr/backlog pen)

  Ruling: source_scan is MANDATORY for a guard whose subject is code, and the
  exception is now a REGISTERED one rather than a matter of judgment. Paste-ready:

    A source-reading guard goes through `tests/source_scan.py`. This is not a
    preference: a guard that reads raw source and asserts a substring is
    registered in `RAW_READ_EXEMPTIONS` in `tests/unit/test_source_scan.py`
    with a reason, or it does not exist. The exemptions are the two honest
    shapes — a guard whose subject IS the prose (an error message, an
    operator-facing string, a comment recording a ruling), and a guard on
    source_scan itself, which cannot use the stripper it is proving exists.
    Choose the stripper by SUBJECT: `without_prose` when the subject is a
    literal (a path, a route, a Cypher statement, an import specifier),
    `code_only` only when a match inside a string literal would be wrong.

