  ## The measurement (Lane B, laptop, 2026-09-10)

  MEASURED, both ways, not asserted. A site is in the class when a read's path
  names a `.py` file AND the text that read produced reaches an `in` / `not in`
  comparison. **19 files, 20 sites** — 18 raw, 1 self-read, 1 already through
  `source_scan`. That reconciles with the report's 18: the report counted at
  2026-09-08 and this is two days and one Lane B burst later.

  Four instrument defects had to be fixed before the number meant anything, and
  they are recorded because each one is a way the NEXT measurement goes wrong
  (J76 — check the instrument before the subject):

  1. `__file__` inside `parents[...]` is a REPO ANCHOR, not a source read.
     Matching it turned an 18-site class into a 60-site one.
  2. `Path(mod.__file__).resolve().parent` is a DIRECTORY anchor — the three
     `test_controlm_api.py` sites read `README.md`/`API-CALLS.md` through it and
     are not in the class at all. **The read's own filename decides**, not its
     anchor's.
  3. The scanner expanded module constants using `ast.get_source_segment`, which
     returns the raw slice — COMMENTS AND ALL. A comment on
     `test_render_determinism.py:194` naming `env_refs.py` made a `.html`/`.json`
     CR-byte check register as a Python-source read. **The instrument built to
     measure J66 fell for J66.** `ast.unparse` reads the code; that is the fix,
     and it is the sharpest single piece of evidence this item produced.
  4. The item's own cited site is spelled `open(mod.__file__).read()`, not
     `read_text()`. A scanner that knows only `read_text` cannot see it.

