acceptance: |
  Every vocabulary consequence G22 ruled is APPLIED, and nothing beyond it. Concretely, per §I1: (a) each entry the gate ACTIVATED goes planned → active WITH its supplement block written (an entry cannot be active without one — that is what active MEANS in 00-header.yaml's lifecycle); (b) each NEW meaning the gate accepted lands as a status: planned entry drafted via ontology-mapper through the RELATIONSHIP_GUIDE registry flow, never active at this build; (c) each entry the gate DECLINED is retired with its status set and a note naming the ruling, the date, and what replaces it. Known member of (c) at groom time, already ruled 2026-08-06: m3_runs_on_etl_host is DECLINED as redundant — ETL placement is the same fact as job placement — and retires pointing at m3_runs_on_agent_host / m3_runs_on_host_group, with ontology_supplement.cypher's documented role enum trimmed from (host_group | agent_host | etl_host) to the two that remain. B2 also rides here: m3_invokes.to_node widens to Script|ETLProcess with the endpoint recorded per edge (B3's verbatim evidence string is what makes the endpoint choice re-checkable). A test asserts no entry is active without a supplement, and no entry the gate declined is left at planned — the state that would silently read as still-a-candidate. NO LOADER IS BUILT here; that is G23.
notes: |
  Groomed 2026-08-06 (laptop) at the G22 session, on the user's instruction to groom the K2/G27 flips-are-follow-ups pattern into an item. WHY IT IS SEPARATE FROM G23: G23 is the curated LOAD (nodes, keys, constraints, provenance envelope); this is the VOCABULARY REGISTRY reaching the state the gate ruled. Doing them together is how a flip gets made silently as a loader detail — the K2 precedent (its FID tier was signed, unbuilt, and wrong for a month) and G27 both exist because the flip and the build were not distinguished. DEPENDS ON G22 BEING SIGNED, not merely opened: the rulings applied here must be final, and §J sign-off is what makes them so. The three partial rulings of 2026-08-06 (A1 HOLD, A2 DECLINED, H3 CONFIRMED) are recorded in config/gate-log.md and will not change, but the rest of the page can still move what this item has to apply. LIFECYCLE QUESTION — RESOLVED 2026-08-07 AT THE G22 §J SIGN-OFF, and the answer is NOT the one this note recommended. Use `deprecated`. The question ("no status describes declared, never built, ruled unnecessary") was already answered by a SIGNED gate: four entries retired never-built sit at deprecated with loader ~ — m3_seal_app_ref, seal_requires_scheduler, and arch_contains_batch + arch_contains_folder, the last two retired at K7 (seal-app-ref-edge-reshape §C2, SIGNED OFF 2026-08-03) with notes reading verbatim "never gated, never loaded". NOTHING in the registry is `removed`. WHY `removed` WAS WRONG, not merely second-best: it means code deleted, so it would license deleting the entry AND the note naming the ruling, which is the whole point of retiring at a gate; it would also split the retired set across two statuses that mean the same thing. The real defect was the one-line GLOSS in 00-header.yaml, amended at the sign-off. A fifth status would additionally have failed tests/unit/test_lineage_writer.py, which pins the vocabulary to the four values. SO FOR (c): m3_runs_on_etl_host lands `deprecated` with a note naming the 2026-08-06 A2 ruling, its date, and the m3_runs_on_agent_host / m3_runs_on_host_group replacements — matching the K7 wording pattern. INPUTS CORRECTED 2026-08-06 (gate rua-load-shapes I1): the list named 40-local-controlm.yaml only, which carries m3_invokes (B2's widening) but none of the rest this gate ruled. Added 43-local-architecture.yaml — C1's WAS_ATTRIBUTED_TO {role: directory_owner} belongs beside its own arch_owns_code precedent there, C2's SOURCES belongs there, and C3's IS_ENCODED_IN already lives there — and 10-node-classifications.yaml, where D2's occurrence NODE class belongs (the same file already holds the :Script and :AppUser labels). An inputs list is what a sub-agent reads, so an unlisted fragment is an unedited fragment. NOTE FOR (b), also from I1: D2 ruled a NODE class, not only an edge, and the supplement discipline is identical — 10-node-classifications.yaml's header requires every dd:* class to be MERGEd as :OntologyTerm:LocalClass in a supplement, so the occurrence class needs label + class + prov_type + its supplement block exactly as an activated relationship does. SECOND INPUTS GAP, found at the §J sign-off and the same class as I1's: tests/unit/test_lineage_writer.py is the TERMINUS IN CODE. test_live_load_is_gate_bound_against_the_real_registry asserts that a live load RAISES GateBoundVocabularyError on m3_invokes, and its own docstring says the test "flips to the execution contract (and gets updated deliberately, not silently)" once the gate activates those entries. The A3/A5 flips here are exactly that event, so the guard's expectation INVERTS at this item — retire it deliberately; do not "fix" the failure by deleting the raises-check, which would remove the terminus that has been holding the line since the vocabulary was declared. tests/unit/ test_schema_graph.py rides along: deprecating m3_runs_on_etl_host drops it from RENDERED_STATUSES ("active", "planned"), so it must leave that test's acceptance-edge set and schema_graph.cypher must be regenerated — the same move the docstring already records for seal_requires_scheduler (C12) and m3_seal_app_ref (K8). DONE 2026-08-07 (desktop, same session as the claim). Applied: (a) m3_invokes (to_node widened Script|ETLProcess per B2, B3 verbatim-evidence noted) + m7_uses_artifact + m3_reads_from/m3_writes_to (A5 restriction restated in both notes) all planned→active with supplement blocks written (ontology_supplement.cypher, INVOKES/USES_ARTIFACT/READS_FROM/WRITES_TO + MAPS_TO anchors); (b) new planned entries arch_owns_directory (C1, build-blocked on K17 in its note), arch_sources (C2, SOURCES prov ~), SourceOccurrence node class (D2, prov:specializationOf binding in note, LocalClass block written per the 10-header rule) + u1_is_encoded_in from_node widened CodeModule|Script (C3; .ksh adapter data was already in code_snapshot.py from the session); (c) m3_runs_on_etl_host deprecated (K7 wording pattern, replacements named) + role enum trimmed to (host_group | agent_host) in the supplement; m3_delegates_to HELD note added (A1/K17). Tests: lineage-writer terminus inverted DELIBERATELY — raises-check retired per-label (m3_triggers still refuses, new companion test), schema_graph acceptance/exclusion sets updated + regenerated, enforcement matrix regenerated, and the two acceptance invariants added to test_yaml_fragments (no-active-without-supplement with the documented CORE_SEEDED exemption; G22 dispositions terminal). NO loader — G23, which this close moves into next_ready.
