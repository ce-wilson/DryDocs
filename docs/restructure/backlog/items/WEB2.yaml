acceptance: |
  (a) SpecGrid renders a TRUNCATED n/N badge whenever the result's `truncated` field (API1) is
      true - the same badge, same wording and same placement the canvas uses for its node
      ceiling, so one vocabulary of completeness serves both surfaces.
  (b) The two server-export buttons stop saying "full" unless the export manifest says
      `truncated: false`; otherwise the label states the ceiling ("first 500 rows") and the
      status line after export says what was exported, including the cap.
  (c) Where API1 made the ceiling raisable, the export path offers it; where it did not, the
      button says so rather than implying completeness.
  (d) A vitest covers the capped and the uncapped case for the grid, mirroring the two canvas
      tests, and asserts the badge is driven by the typed field and not by `rows.length`.
notes: |
