acceptance: |
  Gate ontology-domain-registry-and-edition-grain §C2-§C3 (SIGNED OFF 2026-09-02). The grain is the AREA PRODUCT, with the SME's
  definition as the ruling of record: an Area Product is where two or three applications are
  delivering on the same business topic. That definition - not the Product Catalog tier name -
  is what qualifies a row.

  (a) NEW config/taxonomy/editions.yaml, schema drydocs.editions.v1, on the lob-product-team.yaml
  pattern exactly: classification Internal; a SYNTHETIC publishable sample producer-side (two or
  three invented editions with invented area_product_ids, clearly marked); real rows
  company-side; a per-entry manifest row so a port cannot flatten them (PORT-MANIFEST.yaml:668
  precedent), with the J71 UNNAMED FIELDS clause.

  (b) COLUMNS: `code` (the id segment - 2-5 uppercase letters, unique, never a module code and
  never a frozen letter), `title`, `area_product_id` (the K5 §B key; constraints.cypher:79 makes
  it UNIQUE on :AreaProduct, area_products.cypher loads it - an edition joins to a node the
  graph already holds), `minted_by`, `registered_at`, `authority`, `legacy_band` (nullable; the
  company base records 10000+ here for reading history, nothing else).

  (c) THE COMPANY BASE IS AN EDITION AND MINTS ITS OWN CODE at its own gate, by the §B2
  protocol. The producer does not name it; the synthetic sample must not guess it either.

  (d) BEFORE REAL ROWS: the Area Product list exists today only in a screenshot. Transcribe it
  to a named file under internal-local/ (machine-local, never tracked) and cite THAT file in
  the company-side rows' provenance - the image-provenance rule. Producer-side this item ships
  the sample only.

  (e) GUARD: every `code` is unique across editions.yaml AND absent from modules.yaml `series`
  AND absent from FROZEN_SERIES; every `area_product_id` in a real row resolves against the
  loaded :AreaProduct set when a graph is present (skip, not fail, when it is not - J18).

  Depends on CFG1 only for the shared file conventions; the two registries never share
  (§A2).
notes: |
  BUILT 2026-09-04 (desktop, Lane A; claimed 0d73a80d, step 1b of the intake review's
  sequence, on CFG1 done at 2c744212). config/taxonomy/editions.yaml (schema
  drydocs.editions.v1, classification Internal, classification_only, TWO synthetic rows
  `XMPL` and `SMPL` with invented area_product_ids and `sample: true`) +
  config/schemas/editions.schema.json (S6 family; malformed fixture = a lowercase code)
  + drydocs_core/edition_registry.py (the reader; `code_collisions()` and
  `unresolved_area_products()` as PURE functions - the module series, the frozen set
  and the loaded :AreaProduct set are handed in, core imports neither modules.yaml's
  reader nor the allocator nor a driver) + tests/unit/test_edition_registry.py (13
  guards) + the per-entry PORT-MANIFEST row beside lob-product-team with its UNNAMED
  FIELDS clause (ENTRY_FILES covers it) + the MODULE_MAP row. 3226 unit tests green on
  the desktop.

  (e) as built: every code unique, 2-5 uppercase, never a module series (read from
  modules.yaml through validate.py's own module_series()), never a frozen letter (the
  allocator's FROZEN_SERIES), never DD (refused at load, not only reported); a
  companion proves the check catches each kind. The :AreaProduct resolution runs for
  REAL rows only: producer-side there are none, and the test SKIPS with that reason
  rather than passing quietly; with real rows and no reachable graph it skips with
  "graph unreachable" (J18) - a venue that cannot answer is not one that answered yes.
  The company's suite, which has real rows and a graph, is where it runs green or red.

  ONE FIELD THE ACCEPTANCE DID NOT NAME: `sample: true`. lob-product-team.yaml marks
  its synthetic shape in a header comment; a per-row boolean lets the guard PROVE the
  producer's file carries samples only, and lets the resolution check skip invented ids
  by construction instead of by list. `minted_by` is constrained to the two BASES: an
  edition is declared by a base (B2), so an edition row minted by another edition is
  refused.

  (c) held: the company's code is not named and the sample does not guess it - `XMPL`
  is CFG1's base-owned fixture code (tests/unit/test_domain_registry.py) so the two
  fixtures agree, `SMPL` carries a legacy_band so the field's shape is exercised.
  (d) held: no real row here, so no transcription file was needed; the header says a
  real row cites the named machine-local file, never an image.
