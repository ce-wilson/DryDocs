acceptance: |
  SETTLED AGAINST ADR 0020 at pull (2026-09-07, Lane B) - the item's own 2026-09-06 note
  proposed this and left the edit to the puller. Two changes: the fifth service is named,
  and the CORS sentence is struck. The original text is in git history.

  A committed Compose file brings up the console stack in one command
  (`docker compose up --wait`): Neo4j, drydocs-api on 8001, the ADK agent server on 8000,
  and a REVERSE PROXY that serves the production build and forwards /api and /agent on the
  page's own origin - the fifth service ADR 0020 requires, reading its path map from
  web/delivery.json rather than restating it. Each service declares a health check that is
  the runbook's own success test for that step - the API is healthy when /health answers ok,
  the agent server when it lists exactly its four apps, and the console when it serves the
  page - so a broken dependency surfaces as an unhealthy service instead of a browser error
  three layers away. The runbook's Startup section is updated to offer the one-command path
  alongside the per-process one, and keeps the per-process path, since debugging a single
  service is a real need. No credential is baked into the Compose file or into any image.

  ON PORTS. The old clause read "Ports stay exactly as they are, because the API's CORS
  allow-list names 5173 and 4173 specifically and a drifted port fails as a CORS error that
  reads like an API fault." STRUCK: since WEB10 / ADR 0020 there is no allow-list and the
  browser depends on no port at all - it calls /api and /agent on its own origin. The
  replacement rule is weaker on purpose, because the reason it was strong is gone: the API
  and agent keep 8001 and 8000 so the runbook's Verify step (direct, then through the proxy)
  still works, and the console is published on 4173, the port the runbook already uses for
  the production build - which also leaves 5173 free for `npm run dev` beside the stack.
  A port that moves now is an inconvenience, not a failure that misreports its own cause.
notes: |
  Raised 2026-08-27 from the web-scaffolding review. The reviewed FastAPI template uses
  Compose for exactly this. Our runbook Startup section is four processes with four success
  checks, and a session that starts them by hand gets to discover in the browser which one it
  forgot - the documented Ask failure mode, where a missing agent server on 8000 presents as
  a bare "Failed to fetch" with nothing in the API log, is precisely that shape.
  NOT IN SCOPE: Traefik and automatic HTTPS, which the template ships and we would be adding
  for a deployment that does not exist. This is a local-development convenience, and framing
  it as anything more would invite exactly that scope.
  2026-09-06 (WEB10, ADR 0020) - THE FIFTH SERVICE, AND ONE SENTENCE ABOVE IS NOW STALE.
  ADR 0020 made the console same-origin with its services: the browser calls the PATHS
  /api and /agent on the page's own origin and a reverse proxy forwards them, prefix
  stripped, with dist/ served for everything else. In dev that proxy is Vite itself;
  THIS stack is where the production shape is first exercised, so it gains a serving
  process rather than a second stack being started for it:
  - a reverse proxy (nginx or Caddy) that reads the path map from web/delivery.json -
    the same file vite.config.ts and src/lib/auth.ts read - and forwards /api/* to
    drydocs-api:8001 and /agent/* to the agent server:8000 with the prefix stripped,
    serving web/dist/ (the production build, not the dev server) for every other path;
  - a dead upstream answers 502 from the proxy, which is what the console reads as
    the service behind that path being down (nginx and Caddy do this by default; Vite
    was taught to match in vite.config.ts);
  - /agent/run_sse is a server-sent-events stream, so the proxy disables response
    buffering on that route (nginx proxy_buffering off; Caddy flush_interval -1) or
    the Ask page sees the whole answer at once, at the end;
  - the API's DRYDOCS_RUNTIME_VIEW_URL_TEMPLATE (served on GET /api/config) and the
    agent's DRYDOCS_API_URL are set per environment in the Compose file, never baked
    into the bundle; npm run dist:check is the guard that the bundle carries no
    host:port, and the stack should run it as part of its build step.
  The acceptance sentence 'Ports stay exactly as they are, because the API's CORS
  allow-list names 5173 and 4173 specifically' describes the pre-WEB10 shape: there is
  no allow-list and no port the browser depends on any more. Ports may still stay as
  they are for the runbook's sake, but the reason is gone and the sentence should go
  with it when this item is pulled (proposed here, not edited - the acceptance is the
  puller's to settle against ADR 0020).

  CLOSED 2026-09-07 (Lane B, laptop, wip/O72-laptop). The acceptance above was settled
  first, as this note asked; that edit is in the branch's first commit and NOT in the
  claim commit on main, because the roadmap fingerprint normalises out STATUS and
  nothing else, so an un-rendered acceptance edit on main would have redded the trunk
  for the whole window. The sender's intent - settled at pull, by the puller - is kept.

  VENUE (J18): laptop, Docker Desktop 29.6.1 / Compose v5.3.0 on WSL2. No Neo4j on the
  host was involved; the stack brings up its own.

  WHAT LANDED
  - compose.yaml (repo root, so the one command is `docker compose up --wait` from where
    every other command runs): four long-running services and two init jobs. The init
    jobs are neo4j-plugins, which copies the apoc and GDS jars out of the image into the
    plugins volume - provision.ps1 STEP 1 verbatim, never NEO4J_PLUGINS, which downloads
    at startup and leaves the plugin silently absent when it cannot - and neo4j-provision,
    which applies 01_databases.cypher so the ADR 0002 topology exists rather than the
    home database `neo4j`, where no query surface looks.
  - deploy/{api,agent,console}.Dockerfile plus deploy/render_proxy_config.mjs. Two images
    for Python because agents/ has always had its own interpreter and leads the poetry env
    on the neo4j driver major; the console image is multi-stage, and its build stage runs
    `npm run build` AND `npm run dist:check`, so a type error or a leaked coordinate is a
    failed image rather than a shipped bundle.
  - .dockerignore. This is the publish boundary in image form and it is the file that
    matters most here: a COPY bakes the context into a layer that survives every later
    delete and travels with the image, so the rule deciding what may be pushed decides
    what may enter a build context.
  - tests/unit/test_compose_stack.py, the four silent breakages: a service with no health
    check (--wait quietly reverts to meaning "started"), a literal credential, an agent
    app set that drifts from R14's four, and a restated path map.
  - drydocs_core/component_map.py: deploy/ -> drydocs-web in SURFACE_OWNERS (ADR 0018 D3),
    and MODULE_MAP.md re-rendered via scripts/render_module_map.py in the same commit.

  THE PATH MAP IS RENDERED, NOT RETYPED. nginx cannot read JSON, so the server block is
  generated at image-build time from web/delivery.json - the same file vite.config.ts and
  src/lib/auth.ts read. A hand-written nginx.conf would be a fourth copy of ADR 0020's
  map, and its failure is the worst kind: change delivery.json, dev keeps working because
  Vite re-read it, and the stack forwards nothing - a prefix matching no location falls
  through to the SPA fallback and answers 200 with index.html. A wrong answer that looks
  like a right one.

  VERIFIED LIVE, cold start from empty volumes: `docker compose up --wait` exited 0 in 33
  seconds with all four services healthy and both init jobs exited. Then, THROUGH the
  proxy on 4173 (health checks probe each service directly and prove nothing about the
  prefix strip, which is the single most common way this config breaks):
    /api/health          -> {"status":"ok"}
    /agent/list-apps     -> the four apps
    /mappings            -> 200, the SPA fallback
    /api-notes           -> the SPA page, NOT the API - the location anchoring holds
    POST /api/login      -> the API's own "no console credentials are configured on this
                            machine" message, which is the honest state of THIS laptop
                            (internal-local/ has no console-credentials.json) and proves
                            POST routing as well as GET
  Negative control: `docker compose stop api` -> /api/health answers 502 from nginx while
  the page still serves 200, which is exactly the pair the runbook's troubleshooting table
  distinguishes. After `docker compose start api` the proxy recovered with no restart, so
  the stale-upstream-address worry does not apply here - measured, not assumed.
  Boundary instrument check: inside the api container, /app/internal-local, /app/internal,
  /app/.env and /app/web/.env.local are all ABSENT, while the credential file is present
  under its read-only mount - the secret reaches the container and never a layer. Inside
  neo4j, /plugins holds apoc-2026.05.0-core.jar and neo4j-graph-data-science-2026.05.0.jar,
  version-matched to the server, which closes the failure dev-environment.yaml records.

  TWO INSTRUMENTS WERE WRONG BEFORE THE SUBJECT WAS (J76), both found by running it:
  - The neo4j health check used `RETURN 1`, which the system database REFUSES (42N17,
    "not allowed on the system database"). A perfectly healthy server reported unhealthy
    for ten straight probes. Replaced with SHOW DATABASES, which also proves the DBMS is
    serving rather than merely listening.
  - The console health check used http://localhost/. busybox wget resolves localhost to
    ::1 first and nginx's `listen 80` binds IPv4 only, so the probe got connection refused
    from a healthy nginx. Replaced with 127.0.0.1, which takes the resolver out of the
    instrument. `docker compose up --wait` DID exit 1 naming the unhealthy container while
    this was broken, which is the acceptance working correctly on a false negative.

  Also corrected during the build, because this repo treats a false comment as a defect:
  the renderer claimed its upstreams were overridable while console.Dockerfile declared no
  ARG, so a build-arg could not reach it. ARGs added - and the script now reads them with
  `||` rather than `??`, because an unset ARG expands to the EMPTY STRING, which `??`
  accepts and which would render `proxy_pass /;`.

  HANDBACK TO LANE A - PORT-MANIFEST rows (the `port` pen). Six new tracked paths fall
  through; tests/unit/test_compose_stack.py is already covered by the tests/** row. The
  disposition column is a PROPOSAL; Lane A rules:
    .dockerignore                    canonical-producer  pure mechanism, no side-local value
    deploy/api.Dockerfile            canonical-producer  mechanism
    deploy/agent.Dockerfile          canonical-producer  mechanism
    deploy/console.Dockerfile        canonical-producer  mechanism
    deploy/render_proxy_config.mjs   canonical-producer  mechanism
    compose.yaml                     canonical-company   it carries producer-local container
                                     facts - the image tag it pins against
                                     config/dev-environment.yaml, the `eval` license, the
                                     published host ports - which is the same reason
                                     dev-environment.yaml is canonical-company. Each side
                                     keeps a stack wired to its own container.

