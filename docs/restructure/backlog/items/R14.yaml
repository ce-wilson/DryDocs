acceptance: |
  ADK app discovery (the /list-apps surface) lists only the real agent apps — graph_qa, core_ingest, controlm_fix, graph_query — and not the shared-tools package `common`, by whichever of hiding or restructuring the ADK supports WITHOUT moving the shared tooling out of import reach of the apps that use it (tests/conftest.py closes common.neo4j_tool's driver singleton by module name, so the import path may not silently change); agents/README.md states the convention so the next shared package is not created as an app by accident.
notes: |
  Groomed 2026-08-07 (pm) from Idea-1, the OLDEST entry in the inbox (2026-07-03) — cosmetic, deferred at four grooms, and small enough that carrying it costs more than doing it. Haiku with a hard constraint: the import path is load-bearing for the session-teardown hook, so "restructure" may not mean "move it somewhere the apps cannot import".
  DONE 2026-08-21 (desktop). MECHANISM THE ADK SUPPORTS: `adk api_server` builds its FastAPI app with
  the flat AgentLoader, whose list_agents() returns every non-hidden subdirectory (hence `common`);
  `adk web` uses ADK's own NestedAgentLoader, which lists a directory only when it holds agent.py or
  root_agent.yaml. New agents/serve.py builds the identical API-server app (get_fast_api_app, web=False)
  with the NestedAgentLoader -- nothing moves, `common` stays importable as `common`, and
  tests/conftest.py's close-by-module-name (common.neo4j_tool) is untouched. PROVEN on the installed
  google-adk 2.7.1 in agents/.venv: flat -> ['common', 'controlm_fix', 'core_ingest', 'graph_qa',
  'graph_query']; nested -> the four apps; and serve.build_app(...) served GET /list-apps -> 200
  ['controlm_fix', 'core_ingest', 'graph_qa', 'graph_query'] in-process. agents/README.md: the Run
  block now starts serve.py and states the convention (an APP is a directory with an agent.py; a
  shared package has none and is never an app). Guard: tests/unit/test_agents_app_discovery.py
  re-implements ADK's predicate in the poetry env and holds the list to the four real apps.
