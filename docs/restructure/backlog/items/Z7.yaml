id: Z7
epic: server-location
title: 'Light up the Teams dimension end to end on the bundled samples: folder attribution plus a host
  join the samples make themselves, with no seeded edge'
type: task
module: drydocs-load
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on:
- Z3
- Z5
inputs:
- drydocs/data/samples
- tests/fixtures/server_inventory
- config/taxonomy/location-gazetteer.yaml
- drydocs/loaders
acceptance: |
  Against a local graph loaded only by documented verbs on the bundled synthetic samples — ingest-controlm, load-folder-attribution, load-server-inventory — the QuerySpec map.team-locations.v1 returns at least one row, and every row it returns resolves to a point in the gazetteer, so the console's Teams dimension draws instead of reading as empty. Nothing may be seeded by a test to make that happen: the samples themselves supply the join, which today they cannot, because the Control-M sample hosts and the server-export server names share no value under the signed T1/T2 tiers. The coverage counters keep telling the truth — apps_unmatched, unmatched hosts and unplaceable rows still report real gaps; the change is that the SUCCESS path is exercised as well, not that gaps go quiet. tests/integration/test_server_inventory_e2e.py, which seeds its own matching host today, is updated to the aligned names and stays green, and the existing fixture guards (reserved synthetic app block 70001-70099, one application per file, both PROD and DR designations, no Control-M scheduling-DC grammar in the physical data-center field) all still pass.
notes: |
  Raised 2026-08-27 from Idea-193, after running the whole Z3 chain on the desktop for the
  first time to find out why the Z5 Locations map drew nothing. The chain itself was healthy:
  constraints applied, the infrastructure supplement verified 6 of 6 terms, the loader took 5
  rows and rejected none, and every coverage counter named its own gap without being asked.
  WHAT IS ACTUALLY MISSING is that the sample files do not reference each other. Control-M
  sample hosts are host-hldm-02, host-hldm-03, host-auto-01 and host-auto-02; the server export
  names srv-synth-01 through srv-synth-03 plus srv-synth-51 and srv-synth-52. The signed tiers
  are exact and normalized-short-name, so those two sets can never meet and the resolution pass
  correctly reported 4 of 4 hosts unmatched. Separately the export names application 70055 while
  the graph carries 70051 through 70053, and the gazetteer has no row for the export's second
  synthetic city, so two of five servers cannot be placed even once they load.
  TEAMS NEEDS ONE MORE THING THAN JOBS DOES. The team spec reaches place through the batch port
  — application to port to folder to job to host to server to data center — so it also needs
  BELONGS_TO_APPLICATION edges, which the K8 load-folder-attribution verb writes and which stood
  at zero on this machine. Jobs needs only the host join. Do the host join first and Jobs lights
  up on its own; Teams needs both.
  WHY THIS IS WORTH A TASK RATHER THAN A FIXTURE TWEAK: the bundled samples are the only
  end-to-end demonstration anyone gets without company data, and today, run together, they
  exercise the coverage-reporting path and never the success path. The T1 tier IS proven in
  isolation — the e2e seeds its own matching host and asserts the exact match — but nothing
  proves the demo path, where the samples have to meet on their own. That is the gap this closes.

  CLOSED 2026-09-05 (laptop, Lane B, wip/Z7-laptop). STACKED ON Z8: this item's traversal runs host to server to data center, so the branch was cut from main and wip/Z8-laptop merged into it. Z7's depends_on names Z3 and Z5 and not Z8, so nothing else records the order — merge wip/Z8-laptop first.

  The host join arrived with Z8. What was left was two legs, neither of them a loader defect. THE FOLDER LEG: load-folder-attribution's K2 fallback needs an STG_APP_FACT feed, and no bundled feed existed, so the verb could only run --no-fallback against a header-only authored store and reported 8 of 8 folders unmatched — correctly, and no folder reached any application's batch port. New fixture tests/fixtures/attribution/stg_app_fact__bundled-samples.csv, covering folder 161014's two jobs, both asserting SEAL 70002, which is what §B3's unanimity rule wants. THE TEAM LEG: the pat sample's teams owned 70051-70053 while every folder name carries 70002 and its neighbours, so no application could hold both a DevTeam edge and an attributed folder; T0117 CCB Home Lending Servicing now carries 70002, the team the HLDM folder family reads as belonging to, chosen so that T0100 keeps the no-seal case and T0117's own alignment shape stays untouched.

  TWO PLACEMENT RULINGS, both taken from the repo rather than invented. The fact fixture is NOT in drydocs/data/samples: that tree is gitignored and its tracked CSVs are grandfathered, and drydocs/seal_samples.py states the rule outright — nothing new lands there. It sits beside its sibling stg_app_fact__synthetic.csv instead, and falls to the PORT-MANIFEST tests/** default, so no manifest row is owed. And no demo row went into config/overrides/app-code-mappings.csv: K18 makes a code-level row a steward act carrying an authored_by, so synthetic data in that store would be demo data wearing a production ruling's clothes. The consequence to know about: the demo's attribution step is load-folder-attribution --csv tests/fixtures/attribution/stg_app_fact__bundled-samples.csv, a documented verb over a bundled fixture, but not a --samples-dir run like its neighbours.

  VERIFIED LIVE — laptop, container neo4jtest, database z8demo (a fresh database; this laptop's drydocs DB still carries 4 pre-cutover BusinessApplication nodes with null app_id). Loaded by documented verbs on the bundled samples with nothing seeded by a test: bootstrap, apply-supplements, refresh-catalog/applications/teams, ingest-controlm, load-folder-attribution, load-server-inventory. map.team-locations.v1 returns 1 row — CCB Home Lending Servicing at Sampleville — and it resolves in the committed gazetteer artifact by the console's own two-step lookup; map.job-locations.v1 11 rows and map.server-locations.v1 5 rows, every row placeable. THE COUNTERS STILL TELL THE TRUTH, which was half the acceptance: 7 of 8 folders unmatched, 2 of 4 hosts unmatched, 1 job unresolved at runs_on_resolution, and the one attribution disclosed as attributed_by_origin matched-fallback rather than presented as defined. The e2e was untouched by this item and stays green from Z8. Unit suite 3291 passed, 12 skipped, 1 failed — test_committed_roadmap_page_matches_its_sources, the expected Lane B close failure. ruff check and ruff format --check clean.

  NEW GUARD: tests/unit/test_bundled_demo_interlock.py pins the joins at the file level, before any graph is involved, because a live run tells you the map is empty and never which file drifted. Four assertions: the fact feed names jobs the Control-M sample has, its SEAL facts per folder are unanimous, they point at an application config/taxonomy/business-application.yaml declares, and at least one team owns an application some folder runs for. The fourth fails on the pre-Z7 tree, which is the check that it bites. It deliberately does not assert that gaps are closed — a demo with nothing unmatched would prove less.

  TWO THINGS FOR THE SENDER, since Lane B does not write IDEAS.md. (1) Only one folder can attribute at all: the SEAL capture declares 70001-70003 while the folder names carry 70002, 70011, 70012, 70021, 70022, 70031 and 70041, so six folders could never reach an application even with a fact feed. Adding those applications to config/taxonomy/business-application.yaml and regenerating the SEAL samples would let most of the demo attribute, and is a bigger, separately-worth-it change. (2) The demo's exact verb sequence, including the --csv path above, is not written down anywhere a newcomer would find it; internal/repo-README.md is where it would go, and that is outside this lane's pens.
