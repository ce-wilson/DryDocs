id: J76
epic: release-infrastructure
title: The measurement instrument fails toward a reassuring answer - locale decoding and truncated pipelines
  reported clean where the raw result was not, and one of the three admits a guard
type: task
module: config
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- tests/source_scan.py
- scripts/
