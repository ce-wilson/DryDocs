id: C39
epic: ontology-mapping
title: The gate session queue is inferred from log prose, so a gate drafted under a RECORD entry
  reads as signed off and disappears from the list of sessions still owed
type: task
module: config
phase: 5
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- config/gate-prompts/
- scripts/render_board.py
- web/src/generated/gates.json
- web/src/routes/GatesRoute.tsx
- tests/unit/test_gates_json.py
- tests/unit/test_gate_pages.py
acceptance: |
  The answer to "which gate sessions are still owed" becomes a FIELD READ. Today it is an
  inference over log prose, and the inference is wrong in a direction that hides work.

  (a) THE DEFECT, MEASURED FIRST so the fix is aimed at it. gates.json classifies a prompt by
  the LOG ENTRIES that cite it, not by the absence of a sign-off. A gate whose drafting was
  logged as a `RECORD:` entry therefore classifies `recorded` - and `recorded` is not in
  GatesRoute's OPEN_STATUSES, so it renders under "Signed off". Five prompts say
  "DRAFTED, unsigned" or "still UNSIGNED" in the log entry's own title and are invisible
  anyway: source-connection-and-run-identity, standard-identity-and-carrier,
  tech-partner-attach-level, rua-bundle-data-profile, email-dl-contact-point. Measured
  2026-08-31 at main; re-measure at the build, because the number is the point.

  (b) THE PROMPT FILE DECLARES ITS OWN STATE. A `status:` field on the gate-prompt yaml,
  closed vocabulary, authored by the person who drafts or signs it - not derived. `awaiting-sme`
  is the queue; the others exist so the field can never be a lie of omission. Minimum set to
  design against: awaiting-sme, signed, deferred, superseded. The field is REQUIRED, like every
  other field on a governed ledger, so a new prompt cannot exist without declaring where it sits.

  (c) THE GUARD IS THE POINT, not the field. A test asserts the declaration and the log AGREE:
  a prompt claiming `signed` has a sign-off entry in config/gate-log.md, and a prompt with a
  sign-off entry does not claim `awaiting-sme`. Disagreement fails with both readings printed.
  Without this the field is just a second place to be stale - which is the exact failure this
  item is fixing one level up.

  (d) NOTHING RE-CLASSIFIES A RULING. This item adds a field describing a gate's SESSION state;
  it does not touch what any gate decided, does not edit config/gate-log.md, and does not move
  an entry between statuses. Filling the field is transcription from the log. Where the log is
  genuinely ambiguous - product-cabinet-attribution is recorded-only but its entry flips a map
  entry to confirmed - the field records the ambiguity and the row is raised, never guessed.

  (e) THE SURFACE STOPS BURYING UNSIGNED WORK. GatesRoute buckets by the declared field rather
  than by OPEN_STATUSES, so nothing unsigned renders under "Signed off". A partially-ruled gate
  is the case that proves the bucketing: fid-identity-and-scope has closed sections and an
  unsigned one, and it currently reads as done.

  (f) THE DATE SHOWN IS THE ONE A READER NEEDS. The table already shows a date; make explicit
  WHICH date it is (the log entry's) and show the SIGN-OFF date on a signed row, because that is
  the number that says how old a ruling is. Age is the input to C40 - you cannot decide whether
  a ruling deserves a second look without seeing when it was made.
notes: |
  Minted 2026-08-31. Found while re-deriving the SME gate session list from the repo rather
  than from a hand-kept ledger. The ledger had gone stale - it carries a correction reading
  "this entry's prepped/awaiting state was STALE" about one of its own rows - which is why
  the queue should be derived. The derivation then turned out to under-report, which is why
  it should be declared instead.

  WHY A FIELD BEATS A BETTER INFERENCE. The obvious alternative is to teach the generator to
  read RECORD entries more cleverly - look for "unsigned" in the title, count sections. That
  is a parser for prose whose shape nobody controls, and it fails silently the first time
  someone words an entry differently. A gate's session state is a fact its author knows at
  the moment of writing; asking them to type it is cheaper than inferring it forever, and the
  guard in (c) is what keeps the typed value honest.

  THE COUNT IS THE ARGUMENT. Seventeen gates render as open. The real number is at least
  twenty-two. A queue that under-reports by five does not read as broken - it reads as a
  shorter list, which is the failure mode nobody investigates.

  RELATED, DELIBERATELY SEPARATE: C40 is the revisit axis - what happens to a ruling that is
  already signed and might deserve a second look. This item is only about which sessions have
  never been run. Clause (f) is the seam between them: C40 needs the age of a ruling to be
  visible, and this item is where the date gets named.
