id: CORE2
epic: release-infrastructure
title: "A source-scan absence guard needs a positive control - six of six absence scans were vacuous on first write because the stripper did not match the subject"
type: task
module: drydocs-core
phase: 8
agent: main
model: sonnet
priority: p1
status: in_progress
depends_on: []
inputs:
- tests/source_scan.py
- tests/unit/test_source_scan.py
acceptance: |
  Six of six absence scans across two Lane B bursts were VACUOUS on first write. Each was
  the same mistake: code_only strips string literals, so a guard asserting that a LITERAL is
  absent runs its pattern over a scan the literal was already removed from and passes on
  nothing. without_comments is the stripper for a literal subject. J66 says which helper to
  use; nothing today makes the wrong choice fail, and two of the six were caught only by
  breaking the thing the guard claimed to catch. One case had a comment saying without_comments
  beside code calling code_only.

  (a) tests/source_scan.py grows an absence helper that takes a POSITIVE CONTROL:
      absent(pattern, files, *, positive_control=<snippet>). It runs the chosen stripper over
      the control FIRST and refuses (fails, with a message naming the stripper and the subject)
      when the pattern no longer matches the control - the mutation probe, built in, so a
      stripper/subject mismatch fails on the control and never silently on the tree.
  (b) The refusal is proven by a test that supplies a literal subject with code_only and asserts
      the helper fails on the control, not on the tree.
  (c) Every existing absence guard in tests/unit/ is swept onto the helper. Any that cannot
      supply a control says why, in a comment, next to the call.
  (d) A guard over the guards: an absence-style scan that does not go through the helper is
      listed, so the sweep does not silently un-sweep. Read the code, never the prose (J66) -
      this guard's own explanation must not trip it, which is the failure J66 exists for.
