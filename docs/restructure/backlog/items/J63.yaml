id: J63
epic: release-infrastructure
title: A review run against an un-ported checkout manufactures defects, three times now - make
  every review surface name the tree it ran against
type: chore
module: docs
phase: 8
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- CLAUDE.md
- docs/port/PORT-MANIFEST.yaml
- internal/research/triage-bootstrap-2026-08-28.md
- docs/design/
acceptance: |
  (a) A REVIEW OR TRIAGE ARTIFACT STATES THE TREE IT RAN AGAINST - its commit, its branch, and its
  port base - so that absent here reads as not yet ported rather than broken. That is the whole
  mechanism, and it is provenance rather than method.

  (b) THE THREE INSTANCES ARE RECORDED IN THE CONVENTION SO THE COST IS VISIBLE. The 2026-08-28
  triage reported the refresh verbs as exactly backwards when all three are registered on producer
  main with the older verb as a deprecated alias delegating to them (G79, 2026-08-23); seven of
  the eight commands it called unregistered exist here; and an earlier review recorded six wrong
  facts from a checkout predating the S8, S13, G78 and G79 work. Every observation was correct for
  the tree it ran on; the DEFECT FRAMING was not.

  (c) THE IRONY IS WRITTEN DOWN BECAUSE IT PREVENTS THE WRONG FIX. Reading the importable object
  faithfully (J37) still reports a STALE tree faithfully, so a method rule cannot close this gap.
  Say so explicitly, or the next reviewer will reach for the method rule again.

  (d) WHERE THE STAMP LIVES IS DECIDED ONCE and applied to the surfaces that already exist - the
  research and triage documents, the design reviews, and the port report - rather than invented
  per artifact. Name the surfaces; a convention with no list is a convention nobody applies.

  (e) THE CROSS-REPO HALF IS FENCED AND STATED. Producer cannot make the company's reviews carry
  the stamp. What producer can do is carry it on its own surfaces and say so in the port prompt as
  a description of our practice, never as a request for anything back.

  (f) NO CODE AND NO GUARD IS REQUIRED BY THIS ITEM, but if the stamp is cheap to generate for one
  surface, doing so is in scope; asserting it across all of them is not.
notes: |
  BUILT 2026-08-30 (desktop, MSI). The convention is docs/style/review-provenance.md; the
  generator is scripts/review_stamp.py.

  (a) THE STAMP IS FOUR FIELDS - reviewed_commit, reviewed_branch, reviewed_port_base, venue -
  and the port base is the most recent port-base-* tag REACHABLE FROM HEAD rather than the newest
  tag in the repo, because a tag cut on another branch says nothing about what this tree carries.

  (b) THE THREE INSTANCES ARE IN THE CONVENTION so the cost is visible rather than remembered:
  the 2026-08-28 triage reporting the refresh verbs as backwards (all three registered on producer
  main with the older verb kept as a deprecated alias delegating to them, G79); the same triage
  calling eight commands unregistered when seven exist here; and the earlier review with six wrong
  facts from a checkout predating S8, S13, G78 and G79.

  (c) THE IRONY IS WRITTEN DOWN under its own heading, because without it the next reviewer
  reaches for the method rule again: reading the importable object faithfully (J37) STILL reports
  a stale tree faithfully. The method was never wrong. That is why no method rule closes this and
  why the fix is provenance.

  (d) THE SURFACES ARE NAMED IN A TABLE - design reviews at the front-matter anchor, research and
  triage front matter, docs/reviews front matter, and the port prompt plus each PORT-REPORT - and
  the stamp was APPLIED, not merely specified: all six docs/design/*-review.md files now carry a
  Reviewed at line, each with the commit of that file's own last revision, which is the tree its
  reading was done against. Stated as a proxy on the line itself rather than presented as exact.

  THE TRIAGE DOCUMENT IS THE STAMP'S BEST APPLICATION and is stamped UNRECORDED on purpose. Its
  commit and port base were never written down, and that absence is precisely what let three
  tree-drift observations read as defects. Recording the absence is the half producer can do; the
  note beside it names which three findings are drift.

  A SWEEP WAS CONSIDERED AND REFUSED, with the reason in the convention: back-filling a
  present-day SHA onto a document written against a different tree is the exact failure this
  convention exists to prevent, applied to itself. Existing files are stamped when next revised.

  (e) THE CROSS-REPO HALF IS FENCED. Guardrail 8 already required SHA-stamped citations in the
  PORT-REPORT, so the port surface was the one already solved; what the prompt gains is a
  DESCRIPTION of producer practice that explains why producer documents now carry a SHA line. It
  asks for nothing back, names no artifact the company owes, and says outright that a company-side
  document arriving without a stamp is read exactly as it always was.

  (f) NO GUARD, AND THE ITEM SAYS WHY IN THE CONVENTION ITSELF: a repo-wide assertion would fail
  on every historical document, and the fix for that would be the sweep just refused. If a guard
  is ever wanted it belongs on NEWLY ADDED files only, which is a different item. The generator
  was cheap, so it exists - one surface, per clause (f) - and nothing depends on it.

  It deliberately does NOT re-solve N26 clause (g), which stamps the registry surfaces
  specifically; this is the general convention and that is one application of it.

  VERIFIED: full suite green (2851 passed), ruff + format clean, the six design renders
  regenerated from their sources, and the generator exercised live on this desktop.

  Groomed 2026-08-30 (desktop, weekly groom) from Idea-214, which is tagged as a question but whose
  missing piece is named unambiguously - provenance, not method - so it is groomed as a chore with
  the ruling already implicit in the entry.

  Priority p1 because the failure is recurrent, cross-repo and produces confident wrong findings,
  which is the most expensive kind.
