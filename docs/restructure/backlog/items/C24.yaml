id: C24
epic: ontology-mapping
title: 'The C22 catalog sweep stopped at three files: dev_teams.cypher and catalog_lobs.cypher still blank
  enrichment values on a sparse refresh'
type: bug
module: drydocs-load
phase: 2
agent: main
model: sonnet
priority: p2
status: done
depends_on:
- C22
inputs:
- drydocs/loaders/cypher/catalog_lobs.cypher
- drydocs/loaders/cypher/dev_teams.cypher
- drydocs/loaders/catalog.py
- tests/unit/test_catalog_keying.py
acceptance: |
  Both loaders take the shape C22 ruled for the other three, and the two of them fail DIFFERENTLY, so the fix is not a copy-paste. (a) catalog_lobs.cypher's `SET l.code = row.code, l.name = row.name` becomes coalesce(row.x, l.x). This one loses data TODAY: CatalogLOBRow already declares code and name as `str | None`, so a sparse extract writes null over a stored value on every refresh. (b) dev_teams.cypher's `SET dt.name = row.name` gets the same treatment AND the row model moves with it — DevTeamRow.name is currently required (min_length=1), which C22 ruled is the worse failure mode, because a sparse refresh then rejects the whole row and last_seen_at never advances. name goes optional with ''-to-None normalization while team_id stays required, exactly as ProductLineRow/ProductRow/AreaProductRow were changed at C22. (c) C22's parametrized coalesce pin is EXTENDED to cover both files rather than duplicated, so the next loader added to this family is caught by the same test. Out of scope and deliberately untouched: the RECONCILES_TO edge, the Jira-board and parent-Product FOREACH blocks, and the orphan-flag question — neither loader writes an orphan flag and neither starts here.
notes: |
  Found BY C22 and inboxed rather than swept, per the C17 precedent that a fix outside the acceptance's named file set gets its own item; C22's close note records the hand-off. VERIFIED at the groom (laptop, static read — no database needed): catalog_lobs.cypher:28-29 and dev_teams.cypher:16 carry the unconditional SETs; CatalogLOBRow.code/.name are Optional at drydocs/loaders/catalog.py:166-167 while DevTeamRow.name is required at :238. Why p2 and not p1: the blanking needs a SPARSE extract to fire, and today's catalog extracts are full refreshes — the same reasoning C22 carried. It is still real data loss the moment a partial extract is onboarded, and the fix is small and already designed. BUILT 2026-08-05 (desktop), all three clauses as written. (a) catalog_lobs.cypher coalesces BOTH `code` and `name` — the acceptance named `code` first for the right reason, and `name` had the identical defect one property over, so fixing one and not the other would have left the bug live in the more visible field (`code` is the human-readable LOB handle: AWMCIB, CCB). (b) dev_teams.cypher coalesces `name` and DevTeamRow.name went `str | None` with ''-to-None normalization, team_id still required. (c) The C22 parametrization now runs over FIVE loaders rather than three — extended, not duplicated, which is the clause that makes the sixth loader someone adds get caught without anyone remembering this item existed. Two new tests beyond the parametrization: the `code` coalesce (it has no `name`-shaped sibling in the generic pin) and the DevTeamRow model half, including that a row with no team_id still rejects — optionality must not leak into keying. Suite 1582 passed / 5 skipped. Two pre-existing RUF002/RUF003 lint errors on `×` in K15-era comments were fixed in passing; `ruff check .` is clean.
annotations:
  status: DONE 2026-08-05 (desktop) — coalesce on both files + DevTeamRow.name optional; the C22 pin EXTENDED
    to 5 loaders, not duplicated
