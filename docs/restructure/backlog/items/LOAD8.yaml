id: LOAD8
epic: component-topology
title: "A scoped or sampled load writes a :JobRun indistinguishable from a full one - the run node records its scope binds and row cap, never the raw argv, so a sample cannot pass for the population"
type: task
module: drydocs-load
phase: 6
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- drydocs/loaders/base.py
- drydocs/cli_shared.py
- tests/unit/test_loader_base.py
acceptance: |
  _open_run sets the non-null scope binds from _scope_binds plus the row cap onto :JobRun. It is
  NEVER the raw caller_stamp() or argv string: argv can carry --run-as with a tenant FID, and
  CLAUDE.md section 3 keeps that off a publishable surface - the review says this decision is the
  item's substance. A test loads the bundled samples capped and asserts the run node says so; a
  full load's node says so too (absent is not the same as full). The write is a property, no new
  edge, so no gate.
notes: |
  Minted 2026-09-09 (Lane A mint pass, desktop; pen backlog). load-2026-09-08.md candidate 1 (L1-1, ranked 1). The cheaper fallback (an absent run log made
  visible) is its own item.
