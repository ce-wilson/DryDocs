id: J58
epic: release-infrastructure
title: Governed config YAML has no required identity header — one JSON Schema for the four-key block,
  scoped BY FILE CLASS so template-class files are exempt, with schema coverage sequenced first
type: chore
module: config
phase: 8
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- config/source-mappings/design-docs.yaml
- config/schemas/source-mapping.schema.json
- tests/unit/test_doc_registry.py
- tests/unit/test_gate_pages.py
- docs/reviews/persona-python-architect-idea-181.md
acceptance: |
  (a) THE HEADER IS ONE JSON SCHEMA, NOT N BESPOKE TESTS. The four-key identity block already in use — `schema:` / `source:` / `classification:` / `updated:`, exemplified by `config/source-mappings/design-docs.yaml` — is expressed once as a JSON Schema under `config/schemas/`, alongside the six that already live there, and every guard validates against that one file. Optional `layer:` / `domain:` keys are admitted where the vocabulary domain applies.

  (b) FILE CLASS DECIDES WHO MUST CARRY IT — and the classes are enumerated in the schema's own prose, not inferred by a glob nobody can find. REQUIRED on governed DATA files (source mappings, registries, taxonomy config, gate prompts). FORBIDDEN on template-class files: a hand-maintained date inside a file that a `copier` update three-way MERGES is a guaranteed update conflict, which is the ADR 0015 D4 seam. Any file in neither class is listed explicitly with its reason — a default-deny posture, matching `test_module_boundary.py`'s UNCLASSIFIED rule.

  (c) SCHEMA COVERAGE FIRST, `updated:` COVERAGE SECOND — as two separately-green steps inside this item. `schema:` is the TE-load-bearing key (copier migrations key on it), so it lands and goes green before any `updated:` work starts. The measured 2026-08-27 baseline to close against: of 138 non-backlog tracked YAMLs, 32 carry no `schema:` key and 104 carry no `updated:` key. Re-measure at pull time and report both the found baseline and the closed one; a drifted baseline is expected and is not a reason to skip the measurement.

  (d) GATE PROMPTS GET THE DATE KEY THEY LACK. The 53 gate-prompt specs are already a governed exception with their own enforced header (Module / Source / Registry ref / Classification, via `test_gate_pages`), but carry NO date key at all. Extend their required set with `updated:` under the same schema, and keep `test_gate_pages` as the enforcement point rather than adding a second guard over the same files.

  (e) PRESENCE AND SHAPE ONLY — FRESHNESS IS NOT THIS ITEM. The guard checks that required keys exist and match the schema. It does NOT compare `updated:` against anything; the lying-date problem is J59's, deliberately split because the check that would catch it cannot run in CI (see J59 clause (a)).

  (f) IT RUNS IN THE DEFAULT SUITE with no live services, and it is green on the tree as left by this item — which means every file the new rule covers actually carries the block by the time this closes, not just the ones that already did.
notes: |
  Groomed 2026-08-28 from Idea-181 (captured 2026-08-27, Med; user review request). Split into two items plus a small Python-side chore because the entry's own persona review — `docs/reviews/persona-python-architect-idea-181.md`, run against copier / copier-pdm / ss-python / full-stack-fastapi-template — corrected two of the original prescriptions before grooming, and the corrections change the SEQUENCING, not just the wording. F6 (schema first) is why (c) is ordered. F5 (one JSON Schema) is (a). F1/F2 (copier updates are three-way merges keyed on `.copier-answers.yml` `_commit`, not wholesale rewrites) is why (b) scopes by file class instead of applying the block everywhere. F3 (the git-compare guard is blind in CI) is why freshness left this item entirely and became J59.

  Verified before grooming: `config/schemas/` holds six schemas today, so (a) adds a seventh to an existing pattern rather than inventing a location; `config/gate-prompts/` holds 53 specs.

  Epic release-infrastructure / module config / phase 8 follows J55, the nearest precedent (also `module: config`, also a repo-wide convention given an enforcement point). Model sonnet: the acceptance is written and mechanical.

  The Python-side half of the original entry (module docstring standards) is J60, not this item — different language, different enforcement mechanism, and the persona review's answer there was "use a lint rule the toolchain already ships" rather than "write a guard".

  CLOSED 2026-09-05 (laptop, Lane B, wip/J58-laptop).

  (c) BASELINE RE-MEASURED AT PULL TIME, AND IT HAD DRIFTED, which the clause anticipated. FOUND: 156 non-backlog tracked YAMLs (not 138), of which 16 carried no `schema:` (not 32) and 100 carried no `updated:` (not 104) — plus 18 that are not YAML mappings at all, a category the original measurement did not separate and which turns out to matter, because a list-rooted file cannot hold a header no matter what class it is in. CLOSED: 0 and 0 across every class that requires them. 93 files gained a key; 60 of those were gate prompts gaining `updated:`.

  (a) ONE SCHEMA: config/schemas/identity-header.schema.json, the tenth in a directory that had nine. Every guard validates against it — the acceptance rules out N bespoke per-family assertions and this is what avoids them.

  A CORRECTION THE TREE FORCED, AND IT IS THE MAIN FINDING. The block is four keys but the REQUIRED set is three of them, plus `source` on the family that exists to name one. This is not a softening: config/schemas/data-centers.schema.json, domains.schema.json and editions.schema.json are CLOSED at the top level (additionalProperties: false) and each independently lists exactly schema + classification + updated. Three reviewed family schemas had already settled the question. Requiring `source` universally would have either broken those three outright or forced a fabricated value into ~40 files that have no upstream extract to name — in a repo whose whole discipline is not inventing data. So `source` is REQUIRED on config/source-mappings/** (a field ledger with no source describes nothing) and PERMITTED everywhere else. The reasoning is written into the schema's own prose, with the three closed schemas cited, so nobody re-opens it from the acceptance text alone.

  (b) EIGHT CLASSES, each enumerated in the guard with its reason, DEFAULT-DENY: required · source-describing · gate-prompt · template (updated FORBIDDEN) · fragment · tooling · generated · fixture. Longest-prefix-wins, so a single file can carve itself out of its directory. The default-deny assertion is the part that keeps working after this item closes — a new governed YAML in no class fails as UNCLASSIFIED on arrival, exactly the way test_module_boundary.py treats a new module, so adding the row and deciding whether the file needs a header are the same act. Classes worth naming: FRAGMENT covers the 17 relationship-vocabulary and 7 taxonomy-ontology-map pieces, several of which are YAML LISTS at the root and could never carry a mapping key; TOOLING covers .github/workflows/ci.yml and .pre-commit-config.yaml, whose schemas belong to GitHub and to pre-commit; TEMPLATE is the four *.template.yaml files under the research-probe-discipline skill, and it is the ADR 0015 D4 seam the acceptance names — a session copies them before filling them in, so a date there conflicts on every three-way merge and was never the template's to hold; GENERATED covers the HITL feedback exports and docs/restructure/backlog.yaml, the pre-ADR-0013 TOMBSTONE, where a header claiming currency is the one thing the file must not say.

  (d) THE 60 GATE PROMPTS gained `updated:` and the assertion lives in test_gate_pages.py, NOT in the new guard — one enforcement point per directory, which the clause asks for in as many words and which stops two guards half-enforcing one rule between them.

  (e) PRESENCE AND SHAPE ONLY: nothing compares `updated:` to anything. Freshness is J59's. Worth recording, because it decided the VALUES: every date came from `git log -1 --format=%as` on that file, never from today. A header addition is metadata, not a content change, and stamping 93 files with today's date would have manufactured exactly the lying dates J59 exists to catch. `schema:` values follow the convention every compliant sibling already uses (drydocs.<stem>.v1) and `classification:` comes straight off PUBLISH-BOUNDARY.md's table — Internal under internal/, Internal-Public elsewhere.

  (f) GREEN ON THE TREE AS LEFT. Full suite 3300+ passed, 0 failed except the roadmap render guard, the expected Lane B close failure. ruff clean both ways. Two adjacent guards moved with it: test_config_schemas.py's stray-schema check gained a CROSS_CUTTING map, because a schema shared BY every family has no live-file glob of its own and would otherwise read as an unguarded stray — it is claimed by a TEST instead, and a second assertion checks that named test exists. And web/src/generated/enforcement-matrix.json is regenerated, since it embeds the content of guarded surfaces and a new guard changes it; its writer is scripts/render_enforcement_matrix.py, flagged for Lane A.

  ONE THING HANDED BACK: config/precedence.yaml and relationship-vocabulary.schema.json are the two remaining family schemas with no top-level additionalProperties, so they would accept any stray key. Closing them is a small separate chore and not this item's business.
