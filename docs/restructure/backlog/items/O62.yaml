acceptance: |
  The Ask surface gains a REPORT rendering for the file-name search use case: a user searches a file name (or table) and the result renders as a structured report naming the business application and process associated with it -- and when the chain crosses processes (the captured example: a file-transfer process fed by an event-based application), the report shows the code repos and development teams for BOTH processes, because escalation is the point. The traversal binds via a reviewed read-only drydocs_api QuerySpec (shortest-path from an Application anchor filtered on a fileName property -- the captured example spans ~22 nodes across application / product / dev-team / scheduler folder+job / file-transfer route / pipeline / repo labels), never raw Cypher composed in the browser. The report carries the source -> node-label legend table the captured example shows, so a reader can tell which source system asserted each row. Absence renders honestly: a leg the graph cannot supply renders as "not found via <spec>", never as an empty section that reads as "none exists". Committed fixtures are SYNTHESIZED twins of the captured example's SHAPE -- no real SEAL ids, hosts, or repo URLs from the machine-local transcription. Registered in ui-components.yaml + ui-tests.yaml with coverage pins, both themes, npm run build and oxlint clean.
notes: |
  Groomed 2026-08-17 (targeted groom -- the UI / docs/design/ui-exploration inbox entries only) from Idea-123: the SME supplied a real captured example (screenshot + transcription machine-local at internal-local/ui-examples/, real SEAL ids/hosts/repo URLs -- never committed). This is the concrete output target for the Ask route: report form of the same job -> pipeline -> asset chain O60 draws as a swimlane diagram -- the pair is deliberate, one chain, two presentations. module drydocs-web with the QuerySpec half explicitly in scope the way other O-series frames bind specs; if the spec grows past a straightforward reviewed traversal, splitting a drydocs-api item out is the builder's call to record. Whether this report also becomes an Ask-agent tool answer (the Idea-125 named-verbs direction) is NOT decided here -- this item renders the report; the agent-tool question stays in the inbox.
  OBSERVED 2026-08-21 (desktop, live Ask session `ask-jdoe4821-wjtacr8x`) — a real user ran this
  item's use case against the current surface, so the shape is no longer only the SME's captured
  example. The user asked for a file name, `OS_Job_parameters.htm`, and the answer was correct:
  document `controlm-os-job-parameters`, 16 chunks, GROUNDED/External. HOW it was correct is the
  finding worth pinning to this item: the router chose registered spec `docs.documents.v1`, whose
  Cypher applies NO search filter — it lists every `:Document` with a chunk count — and the answer
  LLM picked the match out of 27 rows by title similarity. So the retrieval was a full-corpus scan
  narrowed by the model, not a search, and `d.source_page` was never read even though the user
  named that property. That works at 27 documents and degrades as the corpus grows, which is a
  direct argument for this item's clause that the traversal binds via a REVIEWED read-only spec:
  the spec has to do the filtering, or the honest-absence clause cannot mean anything either
  (a full listing can never render "not found via <spec>"). No spec in `drydocs_api/query_specs.py`
  currently accepts a search term — `docs.chunks.v1` returns headings without text and takes no
  filter — so a term-accepting doc/file-name spec is a real prerequisite, not an assumed one.
  Two sibling runs in the same session missed entirely, both answering "not ingested" while the
  corpus held the document; that evidence and the per-hop reasoning are recorded on R18, the
  trace item, rather than duplicated here.

  DONE 2026-08-31 (desktop). /ask gains a "File / table report" pane.

  THE PREREQUISITE THE ITEM'S OWN NOTE NAMED WAS REAL, and closing it is the main work.
  No registered spec accepted a search term. `ask.file-search.v1` is the FIRST that does,
  and the note's 2026-08-21 observation is exactly why it had to exist: a live Ask session
  answered a file-name question by routing to `docs.documents.v1`, whose Cypher applies NO
  filter — it lists every :Document and the answer model picked the match out of 27 rows.
  Correct that day, degrading as the corpus grows, and — the sharper problem — A FULL
  LISTING CAN NEVER RENDER "NOT FOUND", so this item's honest-absence clause would have
  been unimplementable on top of it. The filtering had to move into the spec.

  ANCHORED ON THE ASSET, NOT THE APPLICATION, and the deviation is recorded rather than
  quiet. The acceptance describes an Application-anchored shortest path; anchoring there
  means scanning every application to find one whose subtree mentions the term, which is
  the same full-scan defect relocated. A file-name search starts from the file. The legs
  walked are identical either way.

  EVERY HOP IS ONE AN EXISTING SPEC ALREADY WALKS, so the strict vocabulary guard
  (test_query_spec_vocabulary: every label declared, every relationship non-deprecated AND
  with a live writer) is a check rather than an obstacle — READS_FROM/WRITES_TO from
  lineage.hops.v1, CONTAINS_JOB and the seal_app_ref BELONGS_TO_APPLICATION -> :Port <-
  HAS_PORT pattern from explorer.folder-applications.v1, and WAS_ATTRIBUTED_TO
  {role: developed_by} (the R20 correction that replaced a DEVELOPS edge which was never
  registered and made every team read 0).

  THE REPO LEG IS ABSENT BY CONSTRUCTION, and the surface says so DIFFERENTLY from a
  missing one. There is no :CodeRepo label in node_classifications at all — the code graph
  declares :CodeModule and :CodeDirectory, a different subject — so the spec does not ask,
  and the report renders "not modelled: no :CodeRepo label exists in the ontology, so no
  load would supply this". A missing application or dev team renders "not found via
  ask.file-search.v1" instead. Collapsing the two would tell a reader a load might fix
  something that needs an ontology gate. Guarded: the spec must not name a repo.

  ESCALATION IS THE POINT, so both processes render: the demo answer showed two rows for
  one asset (a WRITES_TO process with its application, folder and dev team, and a READS_FROM
  process with none), which is the captured example's shape — the file-transfer leg fed by
  an event-based application.

  SOURCE LEGEND: the column -> node-label -> asserting-system table the captured example
  carries, so a reader can tell which source asserted each row rather than assuming one
  system knows all of it.

  VERIFIED LIVE (J18): this desktop, Chrome vs Vite :5180 (origin supplied with
  DRYDOCS_CORS_ORIGINS) + drydocs-api :8007. THE NOT-FOUND PATH RAN AGAINST THE REAL GRAPH
  and is the half that mattered most: the graph holds ZERO :DataAsset nodes (confirmed by a
  raw-cypher count — the curated lineage load has not run here), so every term returned 0
  rows and the surface rendered the named absence. The FOUND path used rows injected at the
  API boundary (the O81/O86 technique) and rendered both processes, three "not found via"
  legs and the not-modelled repo leg. Said plainly: no row of this report has been rendered
  from real graph data on this machine, because there is none to render.

  GUARD: tests/unit/test_ask_file_search_spec.py pins the property that matters — the spec
  takes a term AND USES it (a spec that accepted one and ignored it would pass every other
  check while reproducing the exact defect), the filter is case-insensitive on BOTH sides
  (one-sided lower-casing turns a real match into a false "not found", the worst answer this
  surface can give), it returns every leg the report renders, it claims no repo, and it
  writes nothing. Ledgers: FileReport registered (39/86); TC-ASK-04 seeded and automated
  (16/39 cases).

  NOT DECIDED HERE, per the item: whether this report also becomes an Ask-agent tool answer
  (the Idea-125 named-verbs direction). This renders the report; the agent-tool question
  stays in the inbox.
