    DATABASE, schema_graph.py, docs_coverage) each with its re-key — invariant: trust signal moves from
    WHERE a query runs to WHAT it matches; (4) dev-environment.yaml databases map = the single switch
    (one map serves both topologies) with two named preconditions (the two spec literals through the map;
    a topology guard for the half-folded case). No provisioning/loader/schema change landed.'
