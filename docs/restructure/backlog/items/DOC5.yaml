  Module is docs (the artifact is an ADR). The alternative filing (doc-infrastructure / 10)
  was the runner-up and is not wrong; nothing downstream depends on which was picked.

  Model fable: an ADR is a decision record that binds later work, which is the boundary case
  the matrix reserves the top tier for.
