acceptance: |
  WEB7 shipped a rule and the guard that enforces it, and the rule outlives the item: the
  lazy-loaded route set IS the gated route set, derived from the one route table both the gate
  and the split read, never kept as a second list. That belongs in an ADR, and the material is
  all in hand.

  (a) A new ADR, status PROPOSED, records the rule: code splitting follows the AUTHORIZATION
      boundary, and the lazy set is DERIVED from the gated set in both directions (a gated
      route left eager fails; a lazy route that is not gated fails too, because shaving bytes
      off an open route is a different decision and must not arrive under this rule's cover).
  (b) It cites WEB7 and the derivation guard BY PATH, plus the CI chunk ceiling (WEB7 clause b)
      as the mechanism that keeps the split from silently reverting.
  (c) It records the publish-boundary trace WEB7 clause (c) produced - every generated artifact
      in the bundle is External, Internal-Public or config/ tier - and states the consequence
      plainly: the split stands on least privilege, not on confidentiality. This is the sentence
      the ADR exists to record, and it deflates the devtools-leak framing of review finding A4.
  (d) It SETTLES, in the same ADR, the one case that declines the rule: /lineage is open to
      every role and imports load-map.json, which pins that artifact in the initial chunk.
      Either it is a stated exception (an open route may carry its own data) or it is a pending
      gate question - the ADR says which, and does not leave it as a footnote.
  (e) The ADR index line lands first, per the repo's ADR numbering convention.
notes: |
