id: G78
epic: component-topology
title: A load step that cannot find its input MUST FAIL — today it silently skips, and a default run loads
  synthetic fixtures while reporting success
type: bug
module: drydocs-load
phase: 6
agent: main
model: opus
priority: p0
status: done
depends_on: []
inputs:
- drydocs/cli.py
- drydocs/loaders/base.py
- config/source-registry.yaml
- tests/unit/test_load_sequence_surfaces.py
acceptance: |
  TWO DEFECTS, one failure. (1) A chain step whose expected input file is absent logs "No sample for ..., skipping" and the run reports SUCCESS. (2) refresh-reference's only input option is --samples-dir, which DEFAULTS to the bundled fixture directory, so a run with no arguments loads synthetic rows into a real graph and calls it done. Together they produce the worst outcome available: not a failed load, a load that SUCCEEDED with the wrong data -- the confidently-wrong-row class promoted to the load. REPRODUCED ON BOTH SIDES, not theorised. Producer: REFRESH_REFERENCE_CHAIN expects seal_application_data__sample.csv and seal_contact_data__sample.csv and NEITHER EXISTS ANYWHERE IN THIS REPO (find returns nothing), so the SEAL half of the reference load has never run on bundled fixtures and nothing has ever said so. Company-side: the same skip dropped dev_teams, and a real-data run silently loaded fixtures instead (SME session 2026-08-11). FIX, in three parts: (a) A missing REQUIRED input FAILS the step, naming the file and the path searched. A step may declare an input optional; optional then means written down, not inferred from a file's absence. (b) Real runs stop defaulting to the fixture directory. Production data must not have to be named *_sample.csv in a directory called samples to be loadable -- that is a semantic contradiction the operator is currently forced into. Implement the interface the TDDs ALREADY DESCRIBE and neither side built: --source <source-id> resolving its location from config/source-registry.yaml, with --samples-dir retained for fixtures only. THE CORRECT BEHAVIOUR IS ALREADY IN THE REPO, ONE VERB AWAY, and this clause is closer to making two commands agree than to designing an interface (SME-confirmed 2026-08-11: "--csv works fine changing to a different path"). `drydocs load <name> --csv <path>` takes an ARBITRARY path -- no directory convention, no filename convention, no fixture default -- and when neither --csv nor --sql is given it PRINTS AND EXITS 2 rather than guessing. It also runs the confirmed-gate before any write. So the defect is not "loaders cannot take a path"; it is that the SEQUENCED chain verb behaves worse than the manual verb beside it. Copy the single-loader contract up into the chain: explicit path or fail, never a plausible default. Do NOT rebuild what `load` already does correctly. (c) The run summary states, per step, WHICH path it read and how many rows it loaded, so "it succeeded" is falsifiable at a glance. (d) COVERAGE RIDER, merged from Idea-119 at the 2026-08-13 groom and scoped to this item's own blast radius: the loaders whose step contract this change touches gain a DIRECT test import. FIVE have none today -- drydocs/loaders/business_segments.py, controlm.py, controlm_dependencies_derived.py, controlm_hosts.py and seal_contacts.py (A5 measured 2026-08-13 at bb9788b6: 31 package modules with no direct test import, of which these five are loaders). A test that imports the loader and exercises the missing-input path satisfies this clause and the guard below at once. NOT a general coverage sweep: five named files, because the tests belong with the fix that touches them. Guard: a test proves a chain step with a missing required input FAILS BY NAME, and that a run against the fixture directory is distinguishable in the summary from a run against a declared source.
notes: |
  Raised 2026-08-11 (desktop) from a company-side diagnosis the SME relayed, then reproduced producer-side. p0 because it is silent, it is live on both machines, and every downstream claim about what the graph contains rests on it. Independent of the naming epic -- this is correctness, that is generalization; do not couple them. THERE IS A WORKING ESCAPE HATCH TODAY, and an operator blocked on this should be told rather than left waiting for the fix: `drydocs load <name> --csv <arbitrary path>` loads a single loader from any location, gated, with no fixture fallback. It is per-loader rather than per-chain, so a full reference load is several invocations, but it is CORRECT where the chain verb is not. That also bounds the item: the contract to copy already exists and is one verb away, so this is two commands being made to agree, not an interface to design. MERGED 2026-08-13 (targeted groom) from Idea-119, whose own proposed disposition was to fold the five untested loaders into this item rather than file a coverage sweep. Read A5 for what it is: a DIRECT-IMPORT proxy, so fixture-driven and subprocess coverage do not show in it. Clause (d) therefore asks for an import-bearing test on the path this item changes, not for proof that a loader was untested in every sense. STANDING DIVERGENCE FOUND WHILE CONFIRMING IT, and it is load-bearing for any shared fixture: the producer convention is DOUBLE underscore (catalog_lobs__sample.csv), the company convention is SINGLE (catalog_lobs_sample.csv) -- confirmed by the SME. The same file therefore cannot serve both sides, and a file copied across is silently skipped rather than rejected. Record it in the port-prompt divergence ledger at this item.
  DONE 2026-08-21 (desktop). New drydocs/chain_inputs.py (load; pure path resolution): a chain's every
  input is resolved BEFORE the first write. (a) A missing REQUIRED file raises MissingChainInputError
  naming step, file and the directory searched, for every missing step at once, with the way out
  (build_seal_samples.py for the generated SEAL fixtures); the verb exits 2 and never opens the graph
  (guarded: the patched _client is not called). Optional = written down on the ChainStep, never
  inferred. (b) refresh-reference has NO default any more: --samples-dir <dir> = FIXTURE run,
  --source <id> (repeatable) = REAL run reading <step>.csv from the source's declared landing zone
  (config/source-registry.yaml acquisition.drop_dir under DRYDOCS_DATA_ROOT, via
  drydocs_core.landing_zones -- the interface ADR 0012 / N12 already declared); steps bound to an
  unselected source are reported NOT SELECTED (an operator's written choice, not a missing file); no
  mode / both modes / unknown source = exit 2 with the declared zones named. `load --csv` untouched --
  its contract was copied up, not rebuilt. ingest-controlm keeps its bundled default because sample
  mode IS its documented mode (the e2e chain and runbooks run it; the real run is --use-oracle, not a
  different directory) but now prints a FIXTURE RUN banner and preflights every stage by name. (c) The
  closing table: step | mode (fixture / source:<id>) | path read | rows | rejected, plus NOT LOADED
  rows with the reason -- a fixture run and a source run are distinguishable at a glance.
  (d) tests/unit/test_chain_inputs.py (14) imports business_segments, controlm (re-export module),
  controlm_dependencies_derived, controlm_hosts and seal_contacts and exercises the missing-input path
  for each loader class. Divergence recorded in the reconcile-port ledger: producer double-underscore
  vs company single-underscore fixture names, and why the resolver must not be loosened back to a
  skip. repo-README + MODULE_MAP updated. Suite 2274 passed. G81 (paths declared in config, the
  overlap invariant, no silent data root) is the sibling one layer down and per its own notes is
  planned with the architect persona alongside G79 -- not picked up here.
  DISCHARGED 2026-08-27 (laptop, G121): the "`load --csv` untouched" caveat above is closed. The
  verb now resolves its path through data_zones.read_zone_containing(): a declared read zone loads
  and the run record names the zone; an undeclared path exits 2 naming landing-zones, unless
  --allow-unzoned is passed, and that override is recorded in the run record and the disk log
  (flag, path, operator). Guarded by tests/unit/test_load_csv_acquisition.py.
