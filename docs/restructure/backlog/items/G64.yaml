  USER-GATED START — the SME convenes the session; the pull loop SKIPS this item until then. The drafted dpl-pipeline-registry-contract page is walked: section A the SME identifies a real pipeline_id.json export (which SEALs, which registry DB, pulled when — Internal, company-side; the run names its venue per J18); section B the agent parses it against the ASSUMED contract and profiles it — per-field census (present / absent / present-but-empty), version and active-flag distributions, and GUID join coverage against the G15/G17 staged pipeline tokens — with zero graph writes; section C closes or re-scopes T13 on that evidence, closes or stands the dpl audit stub, and keeps the active flag the third usage signal G22 ruled it to be. Sign-off transcribed to config/gate-log.md; gates.json + the enforcement matrix regenerate. The registry row's confirmed flag is NOT re-opened.

  RIDER MERGED 2026-09-02 (from Idea-236 gap 4, OQ-18): the session also carries the PARALLEL identity finding from the JOB-MFTS research, because the two are the same shape and the research says they are worth ruling together. A prod MFTS route can be disabled while its CAT twin stays enabled, so route_id alone cannot express identity; (route_id, fts_id) can, and MFT System Environment is already a column in the search export - the same argument this gate makes for (guid, connectorName). OQ-11 rides with it: if a re-provisioned route does not keep its id, route_id fails ADR 0001's business-key test outright. The MFTS RULING itself belongs to C44 at the email-dl-contact-point gate; what this session owes is a consistent answer to the composite-key question, so the two gates do not rule it two different ways.
