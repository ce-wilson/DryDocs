id: I6
epic: project-board
title: There is no id allocator - next free id is a sentence in a skill file and it has failed six
  times; make free mean free across every remote ref
type: task
module: drydocs-plan
phase: 8
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
inputs:
- .claude/skills/groom-backlog/validate.py
- .claude/skills/groom-backlog/SKILL.md
- drydocs_core/backlog_store.py
- tests/unit/test_backlog.py
- docs/restructure/IDEAS.md
- CLAUDE.md
acceptance: |
  (a) NEXT FREE MEANS FREE ACROSS EVERY REMOTE REF, NOT FREE IN MY TREE. The validator gains a
  next-id mode taking an epic letter: it fetches, then reads a tree listing over the remote refs -
  listing only, no checkout, cheap - and returns the next free number in that letter across all of
  them. Verified against the case it would have prevented: on 2026-08-29 one machine's O69 was
  already pushed on a feature branch when the other minted its own, and the second machine never
  looked past its own tree because the rule never said to.

  (b) THE CLAIM PROTOCOL EXTENDS FROM PULLING TO MINTING - mint the id, push the stub, then write
  the body. This generalizes the mechanism that actually worked: ADR numbering survived the same
  day on the same two machines because the decisions index carried a committed, pushed line
  reserving an id for a draft that did not exist yet. It also closes the asymmetry Y6 identified,
  so the two rules are stated together rather than in two places with different shapes.

  (c) A GUARD COMPARES LOCAL ITEM IDS AGAINST THE REMOTE TRUNK and fails when one id carries two
  different titles, skipping with a named message where no remote is reachable (the U26
  precedent). The existing duplicate-id check only fires once both files sit in one checkout,
  which is to say once the collision has already happened and the work is renumbering.

  (d) THE RULE IS STATED ONCE. The skill file, the inbox's entry-header table and CLAUDE.md must
  not each carry their own wording; the two documents point at the command.

  (e) THE BAND GUARD IS UNTOUCHED AND THE ITEM SAYS WHY - bands separate producer from company and
  do not cover two producer machines, which is the gap this closes. This is not a restatement of
  the band note.

  (f) THE RECORD IS WRITTEN INTO THE ITEM SO THE COUNT STAYS AUDITABLE - C19 built twice, K9 built
  twice, a duplicate Idea-101, a duplicate Idea-86, a G70 and G71 pair renumbered to G75 and G76,
  and nineteen ids at once on 2026-08-29. Six incidents, six conventions, zero enforcement points.

  Full suite green; the new mode runs against this repo and its output is recorded in the close
  note.
notes: |
  BUILT 2026-08-30 (desktop, MSI). 7 guards added to tests/unit/test_backlog.py.

  (a) THE ALLOCATOR IS A COMMAND: `python .claude/skills/groom-backlog/validate.py --next-id G`.
  It fetches, then unions THREE sources, and every term is load-bearing -- which was MEASURED
  while building it rather than assumed. (1) the local items directory; (2) every remote ref's
  tree listing via `git ls-tree` -- listing only, no checkout, and the source the O69 collision
  needed; (3) every id ever ADDED under items/ across all refs in history, so a renumbered id
  stays BURNED. Proof that no single term suffices: O79 and O80 sit in the working tree and
  appear in NEITHER history listing, even with rename detection off, because they arrived
  through a re-mint rename; and burned ids appear in history and in no tree at all. Read one
  source and you hand out a taken number.

  THE ANSWER IS MAX+1, NEVER THE LOWEST GAP, and that is a ruling rather than an implementation
  detail. A gap is not evidence a number is free; it is usually evidence it was burned. G70 and
  G71 were forced to G75/G76 because config/gate-log.md cites ids inside SIGNED records, so
  re-issuing G70 would silently re-point a citation inside a signed-off gate. The `--show-ids`
  mode prints the gaps and labels them NOT free, so the reasoning is visible where someone would
  otherwise be tempted.

  IT ANSWERS FOR THE IDEA INBOX TOO (`--next-id Idea`). Not scope creep: clause (d) requires the
  inbox's header table to stop carrying its own wording, and a table cannot point at a command
  that does not answer its question. Same three-term union, because a branch that appended an
  entry to the single IDEAS.md file is invisible to a local read.

  (b) THE CLAIM PROTOCOL NOW COVERS MINTING as well as pulling, stated in CLAUDE.md next to the
  pull rule: mint, push the STUB, then write the body. This generalizes the mechanism that
  already worked -- ADR numbering survived the same day on the same two machines because the
  decisions index carried a committed, pushed line reserving an id for a draft that did not
  exist yet.

  (c) THE REMOTE-TRUNK GUARD compares every local item file against origin/main and fails when
  one id carries two different titles. The existing duplicate-id check only fires once both
  files sit in ONE checkout -- which is to say once the collision has happened and the work is
  renumbering. It SKIPS with a named message where the trunk is not listable (U26 precedent): a
  guard that failed offline is a guard people learn to skip.

  (d) THE RULE IS STATED ONCE. SKILL.md's `id` row and IDEAS.md's header table both now point at
  the command instead of paraphrasing it, and CLAUDE.md carries the mint half of the claim
  protocol with the command beside it.

  (e) THE BAND GUARD IS UNTOUCHED. Bands (producer 1-9999, company 10000+) partition the two
  REPOS and always did their job; they say nothing about two producer MACHINES minting the same
  number inside one band, which is the gap this closes. The allocator enforces the ceiling as a
  refusal rather than restating the rule, and a guard asserts its copy of the constant equals the
  test's -- validate.py duplicates it deliberately because it runs where pytest does not, and a
  duplicated constant without a guard is two facts drifting.

  TWO DEFECTS FOUND IN THIS WORK'S OWN CODE, both fixed and both worth naming. (1) subprocess
  `text=True` decodes with the LOCALE codec, cp1252 on this desktop, and every item file holds em
  dashes -- so `git show` of one raised UnicodeDecodeError inside a reader thread. The allocator
  now decodes UTF-8 explicitly. (2) The idea-history term matched nothing because `git log -p`
  prefixes every line with a diff marker and the header pattern was line-anchored; it reported
  `history=0` beside `local=224`, which is exactly why the per-source counts are PRINTED rather
  than summed away.

  ONE PERFORMANCE FIX with a correctness reason behind it: the trunk guard first compared every
  item with its own `git show` and took 38 seconds. It now reads blob shas from `ls-tree` and
  computes the local sha in-process by git's own object rule, so only genuinely differing files
  are read. 12 seconds, and the check is exact rather than sampled.

  A THIRD DEFECT, FOUND BY CI RATHER THAN BY ME, and the item records it because the shape
  matters. One guard asserted that each of the three sources contributes an id the others miss.
  That is TRUE on this clone and it is the measurement that justifies the union - but it is a
  property of THIS CHECKOUT's git graph, not of the code. CI checks out a different ref set, the
  difference came back empty, and the assertion failed on a machine where nothing was wrong. Same
  class as the Path-sorting bug that held CI red for roughly 180 runs (test_render_determinism.py):
  a test that passes where it was written and fails on the runner is testing the machine. The
  measurement now lives in the docstring as EVIDENCE; what is asserted is the shape - every term is
  in the union, and an AST check that known_ids() still calls all three, which is the risk a set
  comparison cannot see anyway.

  AMENDED 2026-08-30, same day, after the protocol met its first real use. The J66 groom minted a
  stub, refined the title, then pushed the body - and clause (c)'s trunk guard read local-vs-trunk
  as two machines minting one number and went RED until the body landed. The guard is right and the
  INSTRUCTION was incomplete: it compares titles and not bodies, so a title that changes between
  the two pushes is indistinguishable from a collision. The mint rule now says the stub carries the
  FINAL title, in both CLAUDE.md and the skill's id row, and the guard's failure message names both
  causes with their opposite fixes - renumber for a real collision, push the body for a stub in
  flight. Recorded here rather than silently patched because the amendment came from the mechanism
  being used, which is the only way this class of gap surfaces.

  RITUAL MISS, named rather than quietly fixed: CI was not checked after this commit or after J63,
  so the red ran three commits before anyone looked. CLAUDE.md makes checking CI a STEP for exactly
  this reason - the failure was invisible locally, where the suite was green the whole time.

  VERIFIED: full suite green (2851 passed locally, and CI green at the fix), ruff + format clean,
  `--next-id` exercised live on this desktop for the G, N, O and Idea series and refused DD and
  the company band.

  Groomed 2026-08-30 (desktop, weekly groom) from Idea-205a. Priority p1 because the failure rate
  is measured rather than anticipated and every instance cost rework.

  Module drydocs-plan and epic project-board: the allocator is planning infrastructure and the
  validator is the surface that already reads the backlog.

  The entry's own scope fence is kept - the policy question about how two live sessions share one
  working tree stays the user's and is not folded in here.

  AMENDED AGAIN 2026-08-30, from the second real use. The G132/G133 mint pushed a stub with
  final titles - the first amendment's rule, followed correctly - and CI went RED anyway, on
  test_committed_roadmap_page_matches_its_sources rather than the collision guard. The cause is
  the same shape as the first: the mint rule is precise about CLAIMING and silent about a guard
  consequence. The Y5 tolerance that lets a claim ship no render covers STATUS-ONLY drift, and a
  new item is beyond it, so the trunk is red for the whole window between the stub push and the
  body push - by construction, on every mint, not by anyone's mistake. The rule now says the stub
  commit carries the refreshed board and roadmap, in CLAUDE.md and the skill's id row. NOTHING
  ABOUT THE GUARD CHANGES: it is right that a new item stales the page, its message already names
  the fix, and widening it to tolerate stub-shaped items would trade a real staleness check for a
  convenience. Recorded rather than silently patched for the reason the first amendment gives -
  this class of gap only surfaces from the mechanism being used, and twice now it has surfaced on
  the very next use.
