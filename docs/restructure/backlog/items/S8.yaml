  resolve-cmdline-staging and lineage-review (drydocs_lineage) and fid-census (drydocs.fid_census,
  review component). Six per-domain modules, each its own typer.Typer: cli_schema (check, landing-zones,
  bootstrap, bootstrap-schema-graph, verify, reset, sweep-removed), cli_ingest (load, refresh-reference,
  apply-supplements + the legacy per-supplement aliases, load-software-registry, load-batch-orchestrators,
