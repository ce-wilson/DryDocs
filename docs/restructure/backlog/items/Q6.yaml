acceptance: |
  The docmeta component package exists under the name the Q4 gate decided (the modules-registry comment updated if it differs from the drydocs-docmeta working name): cleaner/tokenizer/manifest/registry-models ported from the bkup scrapers per the plan's §5 port table, with web + filedrop connectors; its own COMPONENT_GROUP in tests/unit/test_module_boundary.py + MODULE_MAP row; imports drydocs_core only (components never import each other); Track-1 portable tests cover parse/clean/hash offline (no network); boundary guard + full suite green. The web connector does NOT ship without Q12's page-count refusal — an unguarded bulk scraper is not an acceptable intermediate state (see Q12 for why: the trees in scope enumerate 2k-11k pages). CONNECTOR SHAPE (merged 2026-08-02, from the company-side answer to tracker T21): the two generic connectors are ACQUISITION ONLY — `fetch(source) -> list[RawPage]`, with cleaning and hashing downstream — over a `Connector` protocol plus a `RawPage` model and an unavailable-source error; `web` speaks public http(s) through stdlib urllib with an INJECTABLE TRANSPORT and an SSRF scheme allow-list; `filedrop` reads a file or a directory of md/txt/html through pathlib. The transport injection and the allow-list are NON-NEGOTIABLE, not preferences: the first is what makes the Track-1 offline tests real rather than network-dependent, and the second is the same guardrail Q12 exists to enforce. Reproduction is producer-authored against that protocol shape — never a copy of the other tree's files.
notes: |
  Groomed 2026-07-18 — docmeta plan P3. Module drydocs-docmeta registered at this groom as a WORKING NAME (the drydocs-api precedent) — final at the Q4 gate; this item renames the registry entry if the gate folds it into drydocs-deepdoc. Model fable per the component-boundary precedent (O5/G3). MERGED 2026-08-02 (weekly groom), from the [source->Q6] inbox line: the fetcher already exists company-side, and the split lands exactly where this item needs it — web and filedrop have ZERO internal dependencies, while the confluence connector and the separate scrapers CLI are internal-realm and stay there. Their own base.py designates web+filedrop as the "wired and offline-testable" generic pair, i.e. the boundary this port would have had to draw was drawn by the authors first, which is the strongest available signal that a reproduction is clean. Merged into the acceptance rather than opened as an item because it specifies work Q6 already owns. Unblocks three things at once: Q6 itself, R7 (released unbuilt 2026-08-01 for exactly this missing fetcher) and Q12 behind it. Direction rule stands — back-flow is SANITIZED REPRODUCTION, never a copy. . DONE 2026-08-04 (LAPTOP). PRODUCER-AUTHORED against the shape the T21 answer describes — the bkup repo is not mounted on this machine and the company tree was never read, so every line here was written from the plan's §5 table and the recorded connector contract. The T21 port row is discharged. . PATH: drydocs_docmeta/, NOT the plan's drydocs/docmeta/. That path predates the Phase B relocate; every component created since (remediation, lineage, deepdoc, api) is a top-level package while `drydocs` is the component REMAINDER. Recorded as an amendment note on ADR 0006 rather than a body edit (the ADR 0002 banner precedent) — the confirmed NAME and the separate-component ruling are untouched, only the physical path. . BUILT: connectors/base.py (the `Connector` protocol, `RawPage`, `FetchSource`, `SourceUnavailableError`) + web.py + filedrop.py + cleaner.py + tokenizer.py + manifest.py + registry.py + policy.py; `docmeta` COMPONENT_GROUP, MODULE_MAP row, PORT-MANIFEST row, enforcement-matrix surface row, pyproject package. 46 offline tests — no network, no credentials, no data root (Track-1). . THE TWO NON-NEGOTIABLES ARE TESTED AS BEHAVIOUR, not as presence. The injectable transport is what makes that possible: `test_web_refuses_above_the_ ceiling_without_fetching_anything` asserts the TRANSPORT WAS NEVER CALLED, not merely that an exception was raised — a refusal that still fetched would pass the weaker test. Same for the SSRF allow-list: a run containing one file:// URL fetches NOTHING, including the good URLs before it, because a run that got 300 pages in before hitting it has already done the thing the list exists to stop. . Q12's clause is satisfied by construction rather than by a later item: the ceiling is enforced against the fully resolved location list BEFORE the first request, in the connector itself. See Q12 for the config half. . THREE DELIBERATE DEPARTURES from the plan's sketch, all recorded in the plan: (a) no T4 connector STUBS — a stub that raises is indistinguishable at a call site from a connector that is merely misconfigured, and this epic has spent three items on things that succeed loudly and do nothing; the producer ships the protocol and the company implements against it. (b) freshness.py is not a module yet: its primitive IS manifest.diff(), because the digest and the comparison over digests are one fact; what P5 adds is cadence and a queue. (c) The bkup curation vocabulary and the last_synced_from authority ladder live in registry.py as CODE vocabularies mapped onto the HITL gate positions, not as new ledger fields — they describe a DOCUMENT's state, and the ledger declares SOURCES. Adding columns to the YAML would have been a schema change nobody asked for. . NO GRAPH WRITE. Acquisition only; the load path is P4. The component writes nothing outside DRYDOCS_DATA_ROOT.
