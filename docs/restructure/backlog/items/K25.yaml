id: K25
epic: seal-attribution
title: 'Cross-application run_as: detect and count jobs whose run-as account belongs to a DIFFERENT application
  than the folder that runs them'
type: task
module: config
phase: 9
agent: main
model: sonnet
priority: p2
status: todo
depends_on:
- K16
inputs:
- docs/restructure/09-fid-identity-and-scope.md
- config/gate-prompts/fid-identity-and-scope.yaml
- drydocs/fid_census.py
acceptance: |
  SME direction 2026-08-19, raised with the two-source FID evidence: a job's run_as account can belong to a different application than the folder's own attribution, and that case needs an item of its own rather than a footnote. The gate's §G MALCOLM counterexample already proved one INSTANCE (registered-to-platform, attributed-to-product); this item makes the CLASS measurable. (a) A detection over the census join: for every Control-M run_as owner resolvable through the id-owner listing (doc 09 Source B), compare the FID's application assignment against the folder's confirmed attribution; emit counts by outcome — same application / different application / unresolvable — never a row dump (the K16 discipline; the output is Internal and lands company-side). (b) The different-application bucket is broken down by the gate's §G5 readings (different subjects both correct / stale directory / wrong folder attribution) the same parked-until-ruled way the census handles disagreements: every case starts unruled, a human rules each, and the unruled count is itself reportable. (c) NOTHING is written to the graph and no edge is proposed here — if the SME wants cross-application run_as expressed as an edge or a property, that is a K17-gate amendment, and this item's output is the evidence it would cite. (d) The known-legitimate shared-platform case (the 171-way agent account measured 2026-08-19) is handled as a NAMED expectation, not a finding: a shared platform FID serving many applications' folders is the EXPECTED shape of that account class, so the detector must separate account-class-expected sharing from genuine cross-application anomalies, or the report drowns. SME CLARIFICATION 2026-08-19, and it upgrades (d) from a filter to a CLASSIFICATION: the 171-way name IS the Control-M platform user — the account jobs run as when they run as Control-M itself — and the class is cross-platform (Informatica carries several platform accounts under which business-application jobs run). So the detector's first cut is run_as CLASS (application FID / platform-user account / unresolvable), the platform-user bucket is EXPECTED to disagree with folder attribution by construction and resolves through the platform's own attribution chain instead of the directory, and the by-class counts are themselves a deliverable (how much of the estate runs as the platform is a number nobody has). How a platform account is RECOGNIZED (curated list vs the directory's type/purpose columns) is a K17 §D/§G ruling this item must not preempt — it may propose, with evidence. JOB-GRAIN EVIDENCE 2026-08-19 (SME captures, a live legacy-LOB folder): the class splits INSIDE one folder — the FileWatcher job runs as the platform account while the folder default (the payload jobs) runs as the application's account. So (e) the detector classifies PER JOB, never per folder, and reports run_as class BY JOB TYPE: FileWatcher x platform-account is the designed pattern (file watching is a platform service); the countable anomaly is a PAYLOAD job running as the platform. A folder-grain read would have reported this folder as application-run and missed the split entirely.
notes: |
  Direct add 2026-08-19 (desktop, SME direction at the K16 two-source evidence session). depends_on K16 because the detection runs over the same census join the counts come from — building it before the census has real rows would validate it against nothing. Sonnet: the acceptance is a written pass/fail over a defined join. Priority p2 with K16: this is the measurable half of the §G registration-vs-attribution problem, and the gate's §G3 ruling on the K2 FID tier will want these numbers in front of it.
