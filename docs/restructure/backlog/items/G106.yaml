acceptance: |
  SME RULINGS FOLDED IN 2026-08-25 — read before the original acceptance below.

  (A) THE QA LEDGER IS NOT EXEMPT. It gets 90-day retention like everything else. The acceptance
  below puts the exemption question in the open ("an append-only audit ledger may legitimately be
  exempt, but then the exemption is in the code and in --help"); it is answered NOT-EXEMPT. The
  reason is the same one that sets the API audit window: 90 days of question text is what makes the
  ledger useful for search metrics, where an unbounded ledger is just an audit relic. Note the
  consequence honestly in --help -- the `run` line is the ONLY place full question text lands
  (:AgentRun carries sha256 + length), so sweeping it destroys the only record that turns a hash
  back into words. That is a deliberate 90-day horizon, not an oversight.

  (B) EVERY WINDOW COMES FROM THE DECLARATION, never from a literal or a flag default in this file.
  ADR 0014 clause 4 as amended: `prune-logs` with no arguments does the declared thing and flags are
  one-off overrides. Retention is per kind in config/log-kinds.yaml (G105), so `api` 90, `qa` 90,
  `api-debug` short, `load` its own -- this verb reads them rather than knowing them.

  (C) STILL OPEN, and it must not be silently defaulted: `--max-bytes` has no ruled number. The age
  bound is settled; the size cap is not. Either the SME sets it or this item ships age-only with the
  size bound recorded as deferred and its trigger named. Do not invent a cap -- a size sweep that
  nobody chose is how a retention verb deletes something someone wanted.


  A `drydocs prune-logs` verb in `drydocs/cli.py`, built as a deliberate mirror of the existing `prune-snapshots` so the two read the same at the prompt: DRY-RUN BY DEFAULT (it prints what it would delete and exits non-destructively unless an explicit apply flag is passed), bounded by both age (`--older-than-days`, defaulting to `RuntimeSettings.log_retention_days`) and total size (`--max-bytes`), and reporting a per-file table plus a total. It covers every file family that shares the log directory — the per-run `<kind>.<name>.<ts>.log` files from `run_log.py`, the SQL run logs, and `agents/common/llm_ledger.py`'s JSONL ledger — because the whole point of the finding is that three families share one directory under two naming rules and NONE of them rotate, cap or sweep. The ledger's retention is stated explicitly, whichever way it goes: an append-only audit ledger may legitimately be exempt, but then the exemption is in the code and in `--help`, not in the gap between them. A test drives the verb over a temp directory holding files of both naming shapes and asserts (a) dry-run deletes nothing, (b) the age bound and the size bound each select the expected set, (c) a file the retention policy exempts survives both. NO daemon and no background thread: ADR 0014 rejected the sister project's sweeper for a named reason (its registry grows unbounded when the logger factory is called with per-incident names) and a verb the session ritual can call has no such failure mode. `poetry run pytest -q`, `drydocs --help` showing the verb, ruff clean.
notes: |
  Groomed 2026-08-21 (laptop) from Idea-152 clause (4) — "a load item (4)" in that entry's decomposition. Module drydocs-load because `MODULE_MAP.md:74` places `drydocs/cli.py` there as the entrypoint, which is also where `prune-snapshots` already lives; filing it anywhere else would split two sibling verbs across two modules.

  Depends on G104 only for the retention policy shape (age + size + which families are exempt); the verb itself is mechanical.
