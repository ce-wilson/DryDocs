acceptance: |
  A `.claude/skills/controlm-runbook-automation-SDLC/` skill that emits an outline-conformant SDLC-Runbook .md per application/folder from the graph, proven by the validation that already exists: a document generated for a sample folder passes sdlc-app-runbook.outline.yaml validation with no hand-editing. The skill labels every outline section GRAPH-DERIVED or SME-RESIDUE, the way -excel's template-spec.yaml labels every column — per-workflow blocks (Control-M job, schedule, param file, src-stg-target schema@DB, table grain, task table), the schedule table (trigger files, alert windows) and the SLA table are graph-derived; contacts, vault safes and special-case recovery are named as SME capture with a placeholder shape. Where a query overlaps the -excel skill it is SHARED or cited, never re-written: two skills disagreeing about the same runbook fact is the failure this clause exists to prevent. Committed files stay mechanism-only; a FILLED runbook is Internal and lives in internal/ or internal-local/, the rule -excel already carries. The -excel SKILL.md's forward reference to this sibling resolves once it lands.
notes: |
  Groomed 2026-08-04 (weekly groom). Not a speculative shape — the shipped -excel skill's own frontmatter names it: "a future -SDLC sibling owns the long-form Word/markdown run book". VERIFIED at the groom: both sibling skills exist producer-side (.claude/skills/controlm-runbook-automation/ and .claude/skills/controlm-runbook-automation-excel/, the latter carrying template-spec.yaml + generate_template.py + controlm-runbook-template.xlsx), and the doc type landed the same day at 995eb9a — sdlc-app-runbook.outline.yaml (385 lines), a 631-line worked example, and 32 lines of outline tests. Contract, exemplar and precedent are all in place; the generator is what is missing. Feeds are the ones -excel already uses (the Control-M graph, cm_avg_run, the escalation DB), and -excel's measured coverage — 31 of 35 job columns graph-derivable — is the honest expectation to carry over with one correction: the long form has MORE prose sections, so its SME residue is proportionally LARGER, not smaller. Filed under Epic L because the outline system and its doc types live there. This is a doc GENERATOR and stays distinct from drydocs-docmeta, which ingests documents.

  CLOSED 2026-09-09 (Lane B, laptop, wip/l23-laptop — status-only, no render; Lane A merges). Every acceptance clause has a guard in tests/unit/test_sdlc_runbook_generator.py rather than a claim: conformance is asserted for EVERY bundled sample folder including the retired zero-job one, against a fixture holding only the TRACKED CSVs plus a synthetic SEAL bundle the fixture writes itself, so the suite cannot pass on the machine that generated the untracked seal_*__sample.csv pair and fail in a clone. Coverage on the refund folder: 73 of 99 table rows carry a value from the bundle.

  What the last pass changed, and why it is the part worth reading. Five sections printed a confident answer under a GRAPH-DERIVED heading that no source had supplied — a numbered escalation ladder that was really an alphabetical sort (L1/L2 Operate Manager landing at 7 and 8), every host labeled "Execution host" when node_id can name a host GROUP (host-hldm-01 runs 9 of 17 sample jobs and appears only ever as a grpname), a "Trigger job" that was the lowest-ordered job rather than a trigger, "intermediate" implying a predecessor for jobs that wait only on OTHER folders, and an AND/OR operator dropped on each job's first condition so a source change from AND to OR rendered a byte-identical document. The cover's coverage figure had the same disease twice over: it counted all-unknown rows as filled and then discounted one header per table in aggregate, including the label-less two-column headers that had never been counted. None of these was a crash; all of them read plausibly. The generator now reports the grain it actually has, and says GROUPING is unknown for mixed AND/OR lists because Control-M's parentheses field is empty on every sample row.

  For the ontology, not for this item: the escalation LEVEL is capture because no role vocabulary declares a rank. If TOM role classes ever gain an ordering attribute, this section becomes derivable and section-spec.yaml's tier2-escalation residue is where that is written down.
