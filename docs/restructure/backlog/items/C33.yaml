  why: a divestiture can mean installs are consolidated and re-pointed (paths CHURN) or that
  the estate is frozen with no new installs (paths FREEZE), so Q3 is more open after the
  read, not less. Blocked stands; the unblock is unchanged. What the read DOES change, kept
  here so the SME session has it: (1) the value went UP - the loader's output is a
  migration inventory for a platform being divested, not a version census for its own sake;
  (2) the corpus is a one-shot spreadsheet, so the output is a DATED CENSUS and never a live
  inventory - which gives the SME a sharper Q3 to accept or reject in one sentence: if the
  MERGE key is the census row identity {source, as_of, fid, install_path}, the symlink
  concern only bites on a re-run the corpus cannot produce; (3) the census date and the
  governance-read date are two as_of values and never one field; (4) 'the fid population of
  a divested platform is closed' is a flag-not-build detector candidate (Idea-275, which
  also carries the other ETL platform's DECOMMISSION row, versions empty, no corpus - the
  same shape this item's subject had before the email). The company-side governance
  enrichment of the registry (per-product block, as_of mandatory, ids never names, absence
  recorded, no graph write) is company-owned and does not port; its schema half is
  Idea-276. Which source was asked and what it did not answer is the N24 clause (f)/(g)
  case in the wild: the research question, the server that was read for it, and the
  outcome (irrelevant to Q3, per the probe vocabulary) belong on the record, not inferred.
  UNBLOCKED 2026-09-07 (desktop, SME in session): Q3 ruled as the census key
  {source, as_of, fid, install_path} - RECORD appended under the software-version-context
  gate in config/gate-log.md. B2 sharpened, not re-keyed; the MERGE key may now be written.
  The build follows the acceptance as written; the synthetic-fixture / company-venue split
  for the :Document citation is in the RECORD.
  MERGED 2026-09-07 - IDEAS.md Idea-275, on its own instruction ("do not mint a loader item
  for it: it is a C33 follow-up corpus, and C33's acceptance already forbids a second key").
  The other ETL platform in the software registry - the informatica-powercenter row - is
  DECOMMISSION by end-2027 in the company governance catalog and its row is a name with a
