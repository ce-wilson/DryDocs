acceptance: |
  The gate signed the SHAPE and nothing else: reg_appuser_uses_software is registered status: planned, no loader exists, and the adhoc-sme-email corpus stays confirmed: false for that reason alone. This item builds exactly what sections A-E signed -- the loader itself (MERGE key per section Q3 below, edge properties per B3, as_of from the email's sent date), the :Document minted from the hand-recorded citation, the evidence: block's as_of filled in on the abinitio product row, registration in config/manual-loads/manifest.yaml per E4, and the C1 install-path pattern rows in the invocation_patterns shape. SECTION Q3 IS SETTLED BEFORE THE MERGE KEY IS WRITTEN, not after. The gate deferred it with the consequence stated: if the estate re-points installs by symlink, install_path is a poor key and identity moves to (fid, version), which is a RE-KEY rather than an edit. If Q3 cannot be answered, the item STOPS at that question and says so -- a guessed identity key is the failure the identity gate's D2/C3 exist to prevent. Two things this build must NOT do: write the section F application-level rollup (blocked on K17, and not behind a flag), and auto-append observed versions to the curated versions: list (C2). The vocabulary entry flips planned -> active only if its gate says so; nothing here signs anything.
notes: |
