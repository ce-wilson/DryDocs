  NOT written and no loader exists. Built before the stop, because it does not depend on Q3:
  the §C1 install-path pattern row `abinitio-install-path` in
  config/taxonomy/software-registry.yaml#invocation_patterns (field install_path, named
  version groups, never-pad examples, status proposed). Still owed once Q3 is ruled: the
  loader (key {source, install_path} if paths are stable; (fid, version) if symlinked), the
  :Document citation (needs the email's sent date and digest -- company-side), the
  evidence.as_of on the abinitio row, and the manifest.yaml registration. UNBLOCK = one SME
  sentence answering Q3, logged as a RECORD in config/gate-log.md under the
  software-version-context gate.
  FINDING 2026-09-07 (desktop, Lane A; from the company-side session of the same day, which
  read the company technology-governance catalog through its MCP server for all 16 registry
  products - transcribed to internal-local/research/2026-09-07-c33-governance-catalog-mcp-capture.md, cited
  instead of the images). The subject platform is RESTRICTED with lifecycle DIVEST since
