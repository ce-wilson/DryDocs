  governance-read date stay two as_of values. Also recorded here, and NOT built under this
  id: for a DIVEST or DECOMMISSION platform the fid population is CLOSED, so a fid appearing
  after the census date is a FINDING and not a row - a flag-not-build detector candidate for
  drydocs-remediation, to be inboxed as its own entry when someone wants it built.
