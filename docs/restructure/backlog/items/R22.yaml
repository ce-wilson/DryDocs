id: R22
epic: agentic-qa
title: '"how many towers are there" answers 0 by silently proxying the synthesized UI term Tower onto
  the :TOMRole graph label — give Tower a declared source contract that text2cypher cannot cross'
type: bug
module: drydocs-api
phase: 15
agent: main
model: fable
priority: p1
status: todo
depends_on: []
