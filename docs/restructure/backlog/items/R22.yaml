  Model fable, unlike its two siblings, because the item sits on the taxonomy/ontology boundary: deciding that a term's authority is a UI definition rather than the graph is exactly the kind of call CLAUDE.md routes to the top tier and fences with the gate. Module drydocs-api (the spec registry, verified at this groom) with the definitions half in web/ and config/taxonomy/.

  The console's existing exposure boundary is unchanged and is not part of the fix: it already shows router, generated Cypher, rows, timings and source, and never model prompts or chain-of-thought.
