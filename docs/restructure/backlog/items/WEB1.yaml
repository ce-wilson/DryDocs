  never reach a demo module directly, so the next route added does not.

  Build order: WEB12 (the data-layer hook) first or alongside, or the seam's transport half is
  written twice. O63 (todo) owns the probe's Ask and admin surfaces; this item adds the shell
  mount and must reuse, not fork, that probe.
