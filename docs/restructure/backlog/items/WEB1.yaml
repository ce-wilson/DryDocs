id: WEB1
epic: web-console
title: Provenance of rendered data is a typed union - one useLiveOrDemo seam and one provenance component
  replace the five per-route try-live-else-demo fallbacks, a shell-mount readiness probe answers "is the
  API down" once, and every fallback activation is counted
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p1
status: in_progress
depends_on: []
