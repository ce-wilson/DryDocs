    stage: ~ pending in-repo evidence (update-not-regate); CDO framing is crosswalk context only; NO
    stage-attribution edge declared, not even planned (register-planned-now declined) — the future edge
    enters planned behind its own gate, exactly the acceptance''s condition. Nothing loads the file; the
    UI half stays O38.'
