acceptance: |
  GATE SIGNED OFF 2026-07-27 (config/gate-log.md; 22/22 confirmed, 0 edits) — the map entry business-application-identity is `confirmed` and this item is now BUILD work. REWRITTEN at sign-off: the previous acceptance described the WITHDRAWN v1 shape (app_id + id_authority), a property §B0 deleted — building to it would have written exactly what the gate removed. Phase 1: loaders write app_id ALONGSIDE seal_id from the same row value across all FOUR MERGE sites in ONE atomic change (seal_applications.cypher:19, manual_seal_attribution.cypher:32, pat_product_mapping.cypher:54, software_registry.cypher:52) plus the four key-bearing MATCH sites (batch_port_orchestrator:25, manual_seal_attribution:41, seal_attribution:32, seal_contacts:27) — never loader-by-loader, because a Neo4j uniqueness constraint IGNORES NULLS and a partial cutover SILENTLY DOUBLES the canonical node (§C2). A new uniqueness constraint on app_id is added under a NEW name. The :Port NODE KEY flips here too (§D1(a)): constraints.cypher:44 + seal_applications.cypher:96,100. CRITICAL — `CREATE CONSTRAINT <name> IF NOT EXISTS` matches on the NAME, so redefining port_unique under the same name SUCCEEDS AND DOES NOTHING, leaving the old (parent_seal_id, kind) definition live: DROP it first or take a new name. A graph-tests/ rule asserts app_id = seal_id on every :BusinessApplication (§C3). Existing graphs are REBUILT, not migrated (§C4, wipe-and-rebuild doctrine). Phase 2 (has the deadline — before more console routes land): drydocs_api and web emit app_id ONLY (singular, not a "pair"); web/src/data/mappingsDemo.ts loses app_seal_id and its stray match_method 'seal_var' becomes the real 'seal'. SCOPED OUT per §B2(ii): ATTRIBUTION_TIERS 'SEAL' and match_method 'seal' STAY — they record what Control-M CMDLINEs and docs literally say, and belong to the signed seal-attribution-match-policy gate. Also in scope: write config/source-mappings/seal-extract.yaml (§B1(c)) with the column row `Application ID -> BusinessApplication.app_id` — the source's real field name, NOT "SEALID" (§B5). app_urn is NOT written (§B3, deferred with a trigger); id_authority is NOT written (§B0, withdrawn). Retiring seal_id is NOT in scope (§G3, a separate later gate). Module/file renames are phase 3+ (§G2). ADR 0010 must be amended at S1 — its Option C and rules 2/3 assume the withdrawn shape. Full suite green; graph-verify coverage unchanged.
notes: |
  Why this one is urgent despite scoring 7th on the review's formula: effort is high today and rises every week the console adds a route that reads seal_id. It has already crossed into drydocs_api/query_specs.py and the console demo fixture. The formula measures the fix, not the cost of delay. The argument is the repo's own rule turned on itself: ADR 0003 rule 1 says source-system fields stay verbatim on SOURCE-LABELED nodes, and :BusinessApplication is the canonical node, not a source-labeled one — so a vendor-named key on it is precisely the case that rule excludes. config/taxonomy/business-application.yaml already gets this right at the taxonomy layer (concept: BusinessApplication, source_of_record: SEAL, identifier: SEALID); the graph and API layers did not inherit it. PAT needs NO equivalent work — it never leaked into code (review §4.2, and §6 rule 4 says don't touch it). Sequencing note: the still-open seal-app-ref-edge-reshape v2 gate also touches :BusinessApplication. RESOLVED at §A4 by CARVE-OUT rather than by co-scheduling: everything the identity gate ruled is SEALED except §C1 (the 8-site inventory, stale if the reshape re-targets seal_attribution) and §D2 (the attribution_id shape, judged against today's grain). Those two — and only those — may be re-opened by the reshape. Port sequencing (§G4): this lands BEFORE any other wide structural port, because the company side has seal_id in code the producer cannot see and every additional structural port compounds the conflict.
progress: |
  DONE 2026-08-01 (laptop). Phases 1 + 2 + the ledger, in one commit — the acceptance's "never loader-by-loader" applies to the whole cutover, not just the MERGEs.
  PHASE 1. The MERGE key is now app_id at all four MERGE sites and all four MATCH sites read it; seal_id is written from the SAME row value as a deprecated alias (§G3 owns its retirement). Two of the eight line numbers in the acceptance had DRIFTED since the gate: pat_product_mapping is :64 not :54, batch_port_orchestrator is :42 not :25. The SET of sites was right, which is what mattered — recorded because the next reader will otherwise trust the numbers. Constraints: new businessapplication_app_id (NEW name, as ruled); businessapplication_seal RETAINED; port_unique DROPped and recreated as port_app_key (parent_app_id, kind) — both a drop AND a rename, so an operator reading SHOW CONSTRAINTS sees the change rather than having to diff definitions.
  :Port got NO dual-write, unlike :BusinessApplication. Deliberate and asymmetric: seal_id's alias exists to protect readers, and the gate MEASURED that parent_seal_id has none (zero references in drydocs_api/, graph-tests/, web/src/; cli.py binds ports through HAS_PORT). A NODE KEY property also cannot be null. Writing a dead alias no test protects would have been cargo-culting the shape.
  THE TRAP IS REAL — PROVEN, NOT QUOTED. Live-verified on a scratch database (created and dropped): re-declaring port_app_key with a DIFFERENT key under the SAME name SUCCEEDED and left the original definition live. That is the gate's §D1 warning reproduced, so the DROP above is load-bearing, not belt-and-braces. Same run proved the whole file applies (61 statements, 52 constraints, the three expected present, port_unique gone), the loader shape yields app_id == seal_id with a matching parent_app_id, app_id uniqueness raises ConstraintError on a duplicate, and all five new graph-test cases return zero rows.
  PHASE 2. query_specs.py (6 specs) and mappings.py emit app_id; web/src follows (mappingsDemo.ts, mappingsApi.ts, MappingsRoute.tsx, assetSearch.ts). Column LABELS became "Application ID" — the source's own header, which is neutral, so rule 1 and the evidence rule agree here. tsc + vite build + oxlint clean. The tray localStorage key went v1 -> v2 because TrayEntry.seal_id became app_id: a v1 entry read back under v2 would render a draft with no target application and submit it that way.
  THE BOUNDARY S3 DREW, and why it is not scope-shaving: §E1 rules "a route, a QuerySpec, a column header, a demo fixture" — the WIRE. It does not rule the committed FILE formats, and those cannot follow yet: manual_mappings.py parses `target_key=seal_id=<value>` BY NAME and REFUSES a row without it, so emitting app_id would stop every committed config/manual-loads/*.csv (and the TEMPLATE) from loading; OVERRIDE_HEADER IS the header of config/overrides/seal-contact-overrides.csv, which mapping_store.py ingests by name. Both are aliased at the SELECT / request-field boundary instead, commented at all four sites, and handed to §G3's retirement gate (recorded in ADR 0010 action item 6). The same reasoning keeps the pydantic row-model field names (ManualMappingRow.seal_id, SealAttributionRow.seal_id) as they are — they name what the source/file column is called.
  SCOPED OUT AND VERIFIED SO: ATTRIBUTION_TIERS 'SEAL' and match_method 'seal' are untouched (§B2(ii)). The one fixture change went the OTHER way — mappingsDemo.ts carried match_method: 'seal_var', a value the graph never writes, corrected to the real 'seal'. That is fixing an invented string, not renaming evidence.
  THE LEDGER (§B1(c)): config/source-mappings/seal-extract.yaml, 87 + 5 column rows TRANSCRIBED from models/seal.py and the two loaders' Cypher (generated from the source, not hand-typed), census: pending, both objects sweeping the tail. Registered at the dataset's locator.mapping and removed from test_source_mapping_drift.py's LEDGER_PENDING (8 -> 7). Two honesty notes written INTO the file: (i) only ONE column name is an SME-confirmed source header — `Application ID`, the gate's own row; every other name is the loader's field name, which is DryDocs' belief about the export, and that gap is exactly what let `SEALID` live here for months, so it is labelled rather than smoothed over; (ii) models/seal.py documents the row as PSGMGR.DECO_SEAL_APP_INFO while the registry calls the dataset a csv report — a replica view and a Reports export are different objects with different headers. Recorded UNRESOLVED (it decides what the Phase-2 census profiles), not guessed at.
  Two guards fixed as collateral, both real: test_constraint_count matched the bare string "CREATE CONSTRAINT" anywhere in the file, so documenting the DDL trap in a comment inflated the count AND false-failed test_constraints_are_idempotent; both now anchor at line start, matching the parser the bootstrap presence guard already uses. Inboxed for a wider sweep.
  Suite 1330 passed / 7 skipped. Renders regenerated (the load map caught the ledger count going 10 -> 11 on its own). Doc residual inboxed for L19: two governed design docs assert things this change made false, and both are rev-bump surfaces, so S3 did not edit them.
