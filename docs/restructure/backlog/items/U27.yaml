id: U27
epic: self-documentation
title: 'snapshot.ps1''s CI check asks `gh run list --branch main`, so from any branch HEAD can never
  appear and the verdict degrades to no-run-yet permanently — and the verdict function still has no tests'
type: bug
module: graph-infra
phase: 16
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- knowledge/depgraph-snapshots/snapshot.ps1
- tests/unit/test_depgraph_snapshots.py
- knowledge/depgraph-snapshots/README.md
acceptance: |
  (a) THE BRANCH PIN: the caller asks CI about the branch it is actually on — `git rev-parse --abbrev-ref HEAD` in place of the literal `main` (line 166 at this groom: `gh run list --branch main --limit 10 --json ...`). Today the script fetches main's ten newest runs and matches the LOCAL HEAD sha against them, so from a worktree, an epic slice, an agent fork or any `feat/` branch — exactly the sessions CLAUDE.md tells you to branch for — HEAD is never in the answer and every run takes the yellow "no run yet for HEAD" path until merge. The worked example is the branch this was filed from: CI was GREEN on `feat/ui-workstream` and invisible to a query pinned to `main`. A detached HEAD degrades to something honest (a named skip), never a crash.

  (b) FIVE FIXTURES FOR `Get-CiVerdict`, which its own design comment already claims is "a pure function of (runs, head) so every branch is exercisable without a network" and which has NO tests: green-at-head, failed-at-head-with-an-older-success-in-the-list, in-progress-at-head, no-run-yet-for-head, and EMPTY runs. The empty case is the one that would have caught the 2026-08-20 false GREEN.

  (c) THE TESTS MUST NOT BREAK CI: there is no Pester in this repo and the CI runner's PowerShell availability is not established, so the check SKIPS CLEANLY where no PowerShell is present, with a message naming what is missing (the U26 precedent for `test_probe_instrument.py`'s skip). The mechanism is the implementer's — pytest invoking pwsh with the function dot-sourced, or extracting the verdict so it can be driven directly — the five named cases are the acceptance, not the harness.

  (d) WARN-ONLY IS UNCHANGED (U24 clause d): this reports, it never blocks the snapshot.

  (e) VERIFIED BY RE-RUN, NOT BY READING, with the venue named (J18): one snapshot run FROM A BRANCH whose printed verdict line is quoted in the close note, plus one from the main checkout.
notes: |
  Groomed 2026-08-22 (laptop) from Idea-156. That entry was filed on `feat/ui-workstream` as that branch's Idea-152 and re-filed at 156 on main, because 151 and 152 were both taken there by unrelated entries while the branch sat unmerged — the allocator-band hazard playing out inside one side.

  HALF OF THE ORIGINAL REPORT IS ALREADY FIXED AND IS NOT THIS ITEM. Recorded here only so it is not re-done: defect (1) — `Get-CiVerdict` never enumerating the runs array, so `$mine[0]` was the whole ten-run array and `conclusion -eq "success"` was truthy if ANY recent run passed — landed at 22b8ad7 and properly at 5c0308e / U24, which pins one run object and reads `status` and `conclusion` as scalar strings, with the PS 5.1 ConvertFrom-Json trap written down at the line.

  Module graph-infra / phase 16 / epic self-documentation by the U7, U12, U15, U24, U25 and U26 precedent — every snapshot.ps1 item in this backlog lands there. Sibling of U26 (done) in the same script: that one lost the JSON write from a worktree, this one mis-reports the step immediately before it, and both are invisible from the main checkout. Mechanism only, no gate.

  p2 rather than p3 because the check exists precisely to stop a repeat of Idea-111 (CI red for 100+ consecutive runs while sessions pushed past it), and a check that structurally cannot see branch work is the same failure with a green-looking wrapper.
