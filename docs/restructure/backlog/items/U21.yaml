id: U21
epic: self-documentation
title: IMPORTS edges are never retracted, so fan-in inflates permanently and test debt under-reports —
  the code-snapshot load sweeps nodes but not edges
type: bug
module: drydocs-load
phase: 16
agent: main
model: sonnet
priority: p1
status: in_progress
depends_on: []
