  load-bearing staleness test protects it. (c) The docstring states the residual plainly: an
  import built from a variable stays invisible. (d) MODULE_MAP.md re-rendered. Lane B may take it
  only after the port-preflight fix is on origin (reconcile_before.py is the one drydocs/port file
  it touches).
