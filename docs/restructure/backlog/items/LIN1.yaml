acceptance: |
  Phase 1 of the lineage-chain workplan
  (docs/reviews/lineage-chain-extract-load-workplan-2026-09-03.md). The EXTRACT half.

  (a) THE VERB. `drydocs lineage-extract` lives in a new S8 command module
  `drydocs/cli_lineage.py` (registered by the root like the other six; the import-order
  and registry guards extend to it). It runs the extractors that already exist, in hop
  order, into ONE drydocs_lineage.model.LineageGraph: hop 1 controlm_inventory (jobs CSV
  or the XML export, plus the variables CSV when present - PRECMD/POSTCMD, G60); hop 2a
  dpl_mac (the MAC clone) and dpl_registry (the registry JSON); hop 3 glue_tables (the
  Glue inventory). Every source after hop 1 is OPTIONAL and absent-means-skipped-and-
  COUNTED, never silently absent (G11's house rule); hop 1 is required.

  (b) DECLARED INPUTS ONLY. Every input resolves through the source registry's declared
  acquisition path or a declared read zone (G81, G121): an undeclared path is refused
  with the message naming the row that would declare it. No --csv side door.

  (c) THE ARTIFACT. The staged graph is written ONCE as JSON into a declared WRITE zone
  (a new data-zones row, `lineage/staged/`, mode write) with the per-extractor coverage
  objects beside it and a LoaderRunLog per run (G107). The artifact is what
  lineage-load (LIN2) and lineage-review read; it carries the source paths, the extractor
  versions and the run id, so a load names the extract it came from.

  (d) VENUE-TAGGED PROOF ON THE BUNDLED SAMPLES. Run against drydocs/data/samples: the
  job -> :ETLProcess candidates (kind dpl AND kind abinitio, both spellings of the DPL
  pipeline flag, the wrapper-unwrapped pset) appear in the artifact with INVOKES and
  USES_ARTIFACT candidates and the file-op READS_FROM / WRITES_TO from CMD_LINE and
  PRECMD/POSTCMD. Hops 2a and 3 are proven on the SYNTHETIC fixtures the existing tests
  already use (shape-faithful, value-fake) by pointing the optional sources at them.

  (e) GUARDS. The verb reads the importable objects, never a render (J37); a test runs it
  end to end on the samples in a tmp data root and asserts the coverage counts; the
  module-boundary test still holds (lineage imports only core; the CLI module imports
  lineage, which is the load group's job).

  (f) NOT IN SCOPE. No graph write (LIN2). No new extractor (Ab Initio pset is LIN3, a
  later phase). No key-strength grading (Phase 4).
notes: |
  Minted 2026-09-03 (desktop, allocator; first id in the LIN series - PLAN1: the series
  IS the module). The extractors and the writer have existed for weeks; this is the verb
  that was never built - the only lineage verbs are lineage-review and
  resolve-cmdline-staging, and write_curated is called from no command. Built on the
  desktop because the bundled samples and the cmdline-staging store live here (Lane A).
  Source of the plan: the user's direction of 2026-09-03 after the PEX research capture;
  the research findings that change the KEYS (a literal pipeline id outranks a resolved
  variable, the terminator period, join-key grades) are Phase 4, deliberately after the
  extract and the load exist.

  BUILT 2026-09-03 (desktop, Lane A).

  THE MODULE. drydocs_lineage/staging.py - stage_chain() runs the four extractors in hop
  order into one LineageGraph (hop 1 required, raises StagingError by name; hops 2a/3
  optional, each recorded present / absent-with-reason in a sources block: "no path
  given", "not found", "directory is empty"); the registry cross-check is handed the
  clone's pipeline GUIDs from the MAC walk; write_artifact()/read_artifact() carry the
  graph plus a header (schema drydocs.lineage-staged.v1, run id, captured_at, the
  acquisition, the sources, the extractor names, the per-extractor coverage) with
  sorted keys and LF, byte-identical for the same inputs and clock.

  THE VERB, AND ONE DEVIATION FROM THE ACCEPTANCE. `drydocs lineage-extract` lives in
  drydocs/cli.py beside lineage-review, NOT in a new cli_lineage.py: MODULE_MAP's S8 rule
  says a verb that wires another component stays in the composition root - the only
  ENTRYPOINT_MODULES exemption - and a per-domain command module importing
  drydocs_lineage would need a component_map change for no gain. Options: --jobs,
  --variables, --mac-root, --registry-root, --glue, --out-dir. Defaults: the bundled
  samples for hop 1 (acquisition=bundled-samples), the declared zones for the optional
  hops (asked, and the artifact says where), lineage/staged/ for the artifact. An
  explicit path outside every declared read zone is REFUSED (exit 2, the message names
  the zones) with no override; an --out-dir inside a read zone is refused (G81).

  FOUR ZONES DECLARED (config/data-zones.yaml + data_root helpers): controlm-exports/
  (read - the hand-carried CSV projection route, the shape the company exports from SQL
  Developer), dpl-mac/ (read), glue-inventory/ (read), lineage/staged/ (write). The DPL
  registry already had dpl-registry/ through the source registry. The zone guards pass.

  VERIFIED: desktop, DRYDOCS_DATA_ROOT=C:/coding/projects/data/DryDocs -
  `drydocs lineage-extract` on the bundled samples stages 17 jobs -> 33 processes
  (17 controlm_job, 10 abinitio :ETLProcess, 6 shell_script), 17 INVOKES, the three
  optional hops absent-skipped with their zone paths recorded; artifact in
  lineage/staged/, run log under the log root. Unit: test_lineage_staging.py (9 - both
  DPL flag spellings key one pipeline node and the pset lands as abinitio in one run;
  hop 2a READS_FROM/WRITES_TO on the GUID key with the registry cross-check naming the
  unregistered pipeline; hop 3 placements as properties and no edge; the artifact
  round-trips and is deterministic) and test_cli_lineage_extract.py (6 - the declared
  defaults, the refusal naming controlm-exports/, the zoned run, the read zones read
  when they hold something, the read-zone out-dir refusal). Full suite 3191 passed,
  9 skipped; ruff clean.

  NOT DONE HERE, BY DESIGN: no graph write (LIN2); no Ab Initio pset -> dataset
  extractor (Phase 3); no key ranking or grading (Phase 4). The XML export is not a hop-1
  input yet - controlm_inventory reads the CSV projection; the XML route goes through
  resolve-cmdline-staging today, and joining the two is a later item.

  CI CORRECTION (5c429f05 red on the gates job, fixed the same hour): the bundled
  variables sample (controlm_variables__sample.csv) is MACHINE-LOCAL - drydocs/data/ is
  gitignored and only the named samples are force-tracked; this one never was - so the
  test asserting it present failed on a fresh checkout. The variables sample is now
  optional in the default run (acquisition records bundled-samples-absent), and both
  states are proven locally by running the two test files with the file present and
  moved away. Nothing about hop 1 changes: the variables CSV only adds PRECMD/POSTCMD.

  LANE REVIEW (laptop, reviewed at 0f893f86, range 316cab98..0170ed2c) - the headline
  numbers reproduced on a second venue with no variables sample present (33 / 17 / 10 /
  6, 17 INVOKES), so the desktop evidence is sample-reproducible, not machine-pinned.
  Findings, and what was done with each, all landed in the follow-up commit:

  1. PROVENANCE DEFECT (real, fixed at the seam). With no --variables the extractor
     discovers a variables CSV beside a jobs DIRECTORY - its documented behavior - and
     the artifact recorded the source absent while the graph carried file-op edges
     built from it; an explicit absent --variables fell through to the same discovery.
     G11 inverted, on the company's own route (--jobs <dir under controlm-exports/>).
     ExtractCoverage now reports variables_path (what it actually read); staging hands
     an explicit path over as given (absent = nothing read, no discovery) and records a
     discovered file as present with the note "discovered beside the jobs source".
     Two tests reproduce both entry points.
  2. TWO INSTRUMENTS THAT MEASURED NOTHING (fixed). The determinism test wrote the same
     run id to the same directory twice and compared one file with itself; it now writes
     to two directories. The round-trip test compared counts only and staged no glue
     hop; it now stages every hop and asserts to_dict() equality (kinds, properties,
     rels). A sortable-name test was added.
  3. TWO DEVIATIONS FROM THE ACCEPTANCE, NOW RECORDED. (c) "extractor versions": no
     extractor carries a version and a number nobody bumps is worse than none, so the
     header now carries code_commit (the checkout's HEAD through repo_root, "unknown"
     outside git) - that is what tells two artifacts staged across a parsing change
     apart. (d) the tracked samples show abinitio + INVOKES only; kind dpl, both DPL
     spellings, USES_ARTIFACT and the file ops are proven on synthetic fixtures (here
     and in the pre-existing test_lineage_inventory.py), not on the samples. Nothing
     is untested; the VERIFIED note above described what ran without saying so.
  4. NAMING FOR LIN2 (settled here, not after). Artifacts are now
     lineage-<UTC stamp>-<run id>.json, so a listing sorts chronologically and "the
     newest" is derivable without opening a file; LIN2's acceptance says it loads the
     newest by default. Retention is LIN2's call to record.
  Nits, all taken: HOPS now includes controlm_variables and a test asserts the sources
  block against it; the MAC extractor hands back the clone pipeline GUIDs it parsed
  (MacCoverage.clone_pipeline_guids) instead of staging re-walking the tree; the
  data-zones comment says four; the zone check is PER HOP (LINEAGE_INPUT_ZONES) - a
  jobs CSV under dpl-mac/ is refused as a misfile and the message names the hop's own
  zone - with a test. Also caught by the full suite: the commit anchor climbed to the
  repo root with a bare __file__ (Idea-109 guard) and now goes through repo_root().

