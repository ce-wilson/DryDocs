acceptance: |
  Exactly the shape the two SIGNED records of 2026-09-09 rule (registry-wiring-readiness
  18/18, source-descriptor-axes 13/13), and nothing the drafts proposed that was not signed:
  (a) `wired` joins the axes in config/source-descriptors.yaml as a DECLARED per-side value
      (true | false), never derived: a `wired:` block keyed by dataset id, REQUIRED for every
      registry-home dataset (a missing entry is refused at construction - a new row must
      answer), and a false carries a `reason` of at least forty characters, refused otherwise.
      The 21 loading rows declare true [at build, by command: 13 - see notes]; the 4 wiring holds (cm_hist_vw, oracle:schema-inventory,
      snowflake:schema-inventory, hr_phone_exp) declare false with the reason their YAML
      comment carries today; the 4 semantic holds and cm_escalation_db declare what is true
      of THEIR pipeline. The wiring-fact comments retire in the same commit; comments carrying
      ruling citations (hr_phone_exp's K17/K26 record) stay.
  (b) PORT-MANIFEST.yaml: `per_side_fields` gains `wired` (and its `reason`), never
      overwritten by a port in either direction, in the SAME commit (C3); and the
      source-registry row's entry_rule is amended per E1 so `confirmed` and its stamps CROSS as
      the producer's signed WHAT on shared rows while company-only rows stay theirs.
  (c) require_confirmed() refuses unless confirmed AND wired, reading the descriptor for the
      dataset, and its message names WHICH failed and what clears it - find an SME, or build
      a loader. Every row that loaded before loads after (D1), pinned by a test over the
      registry.
  (d) tests/unit/test_load_map_wiring_key.py::test_the_key_reports_and_never_rules is
      AMENDED by the ruling: it keeps forbidding a wiring field on the registry row and admits
      the descriptor axis; the load map's cross reads the axis instead of deriving it, and the
      DataHub emission carries `wired` as its own tag while the `confirmed` property means the
      semantic ruling only (C2).
  (e) A RELAY for the ninth roll: the axis is per side, the two standing company pins
      (cm_hosts, deftable-xml-export) retire - the company's gate-log records the retirement
      rather than deleting the entries (C4) - and `confirmed` crosses again on shared rows.
  (f) tests/unit/test_source_descriptors.py covers the new axis (declared, required, reason
      length, refusal); the J57 family and the full unit suite green.
notes: |
  Minted 2026-09-09 (Lane A, desktop) FROM the sitting-1 records, as the wiring page's own D2
  requires ("the build is its own backlog item with its own acceptance") - deliberately not in
  the same day's mint pass, because a drafted gate decides nothing and B1/B2/B5 decided this
  shape. Lane A: every input is a config, core or port surface. CORE18 (the data root declared
  once) lands after this so the two do not collide on config/source-descriptors.yaml.
  DONE 2026-09-09 (Lane A, desktop). Built as the two records rule, with one measured
  correction recorded here, in the descriptor header and in RELAY-54: the wiring page's B5
  said the 21 loading rows declare true - 21 is the confirmed count; by command (E3) 13
  registry-home datasets have a loader bound on this side and declare true, and 17 declare
  false with a reason: the 4 wiring holds, the 4 semantic holds, cm_escalation_db, and the 8
  confirmed-but-unbuilt rows (setvar, avg_run, autosys, airflow, rua-bundle, the two dpl
  registries, bitbucket). The value stays DECLARED, and a guard holds the declaration against
  LOADER_REGISTRY (test_wired_declaration_agrees_with_the_tree) so it cannot drift from the
  tree unnoticed - the reader never derives it. UnwiredSourceError subclasses
  UnconfirmedSourceError, so every catch site still catches; the wired half is read for the
  committed registry only, and a fixture registry keeps the confirmed-only gate (pinned).
  Surfaces: the descriptor config and reader; the registry gate; the load-map renderer,
  console model and O90 guard (amended, both read the declared value on registry-home rows
  and keep the loader fallback for doc-ledger rows); the DataHub emitter (wired property and
  its own tag); PORT-MANIFEST per_side_fields wired + the E1 amendment on the source-registry
  entry_rule + the descriptor row; the registry's DATASETS header and four confirmed: comments
  trimmed of their wiring clauses (ruling citations kept); the TDD; RELAY-54 for the ninth
  roll. Left as found, on purpose: hr_phone_exp keeps confirmed: false under N13 (the flag
  flips at K26 close) - with the axis in place the K17 record alone supports the flip, and
  K26 makes it in the same commit as its wired: true.
  HANDED BACK, not built here (one pen per surface): the console model's read of the axis
  is under the code:drydocs-web pen, which the UI-testing session holds. The change for that
  session, twelve lines in web/src/loadmap/loadMapModel.ts: LoadMapSource gains two optional
  fields, wired (boolean) and wired_reason (string or null), absent on doc-ledger rows; and
  wiringState reads the declared value where the row carries one, loader presence where not
  (built = s.wired ?? s.loaders.length > 0), with a dated paragraph under the O90 comment.
  Until it lands the screen derives the same value the print reads, and
  test_wired_declaration_agrees_with_the_tree pins them equal.
  AMENDED the same day, from a red build: the seventeen `wired_reason` strings were carried on
  the load-map row too, and load-map.json sits in the console's INITIAL chunk (WEB7 - laneBasis
  imports it and /lineage is open to every role), so they put the entry chunk 1,999 bytes over
  its ceiling and reddened the web job at 5396ff37. The BOOLEAN travels and the REASON does not:
  no console surface read those strings, they are declared in config/source-descriptors.yaml, and
  a surface that renders them reads the descriptor. The guard pins the split with the reason. The
  remaining headroom - 808 bytes, already past WEB7's margin before CFG13 touched it - is WEB23.
