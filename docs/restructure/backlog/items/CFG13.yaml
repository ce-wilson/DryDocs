id: CFG13
epic: source-column-mappings
title: "The wired axis - a sixth descriptor axis declared per side with a written reason, named in per_side_fields, read by require_confirmed which then says WHICH of confirmed or wired failed, with O90's guard and the J71 entry_rule amended by the ruling"
type: task
module: config
phase: 11
agent: main
model: sonnet
priority: p1
status: done
depends_on: []
gates: [registry-wiring-readiness, source-descriptor-axes]
inputs:
- config/source-descriptors.yaml
- drydocs_core/source_descriptors.py
- drydocs_core/source_registry.py
- config/source-registry.yaml
- PORT-MANIFEST.yaml
- scripts/render_load_map.py
