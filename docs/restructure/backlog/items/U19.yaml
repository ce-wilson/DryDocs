acceptance: |
  The extractor resolves bare-name imports against PER-DIRECTORY sys.path roots (or an explicit alias map), and a fresh snapshot proves it on the two cases that fail today: scripts/render_board.py's seven sibling imports appear as scripts -> scripts IMPORTS edges (zero today), and the agents/ modules that import common.* / graph_qa.* against the agents/ root appear as agents -> agents edges (zero today). The first-party orphan queue is then re-counted and the review plan's 23-item figure is restated with the corrected number, since most of that queue is a false positive of this blind spot. Absolute imports from the same files must keep resolving — the U6 cross-root fix is not regressed. Venue named per J18.
notes: |
  Groomed 2026-08-09 from Idea-92 (persona Run 2, U-arch F1). Consequence, stated plainly: until this lands, only the PACKAGE-scoped metrics are trustworthy and the orphan queue should not be worked from. The fix belongs in the SIBLING depgraph extractor rather than in a producer wrapper — U16 is sizing exactly that in-house-vs-sibling trade, and if this can only be done here as a fourth post-processing wrapper step, that IS the trigger U16 names for forcing the call; say which one it turned out to be in the close note. DONE 2026-08-09 (desktop, neo4jtest, drydocs DB): fixed in the SIBLING extractor, which answers the question U19 was told to answer for U16 — it did NOT have to become a fourth post-processing wrapper step, so the trigger U16 names for forcing the in-house-vs-sibling call did NOT fire, and U16 stays a sizing exercise rather than a forced decision. depgraph 6ee0af6 (main, clean descendant of the a56d2fc pin, PUSHED to origin before the pin bump so the laptop can reach it — a pin naming an unpushed commit is the 2026-08-04 two-machine divergence with extra steps); producer pin bumped in config/dev-environment.yaml. THE RULE IS THE INTERPRETER'S, not a heuristic: walk up from the file while the directory is a package (__init__.py present); the first ancestor that is not is what Python puts on sys.path. That yields the script's own directory for a loose script and the non-package parent for a module inside a package, which is exactly what `python -m pkg.mod` makes importable. DESIGN CHOICE worth the record: the extra root is APPENDED after the project roots, a deliberate departure from Python, which searches the script directory FIRST. Precedence only matters when one name resolves both ways, and there the existing answer is what every committed snapshot was built from — appending makes the change purely additive, so it can create a missing edge and cannot move one that already resolved. Pinned by a test with shared.py present at both locations rather than left to a comment. BOTH ACCEPTANCE CASES VERIFIED IN THE GRAPH: scripts->scripts 0 -> 7 (all seven of render_board.py's sibling imports, plus its cross-root drydocs/plan_board.py edge); agents->agents 0 -> 20, with graph_qa/pipeline.py resolving common/__init__.py, common/specs_catalog.py and three graph_qa siblings. Whole-snapshot edges 830 -> 878 across the bump. NOT REGRESSED, checked rather than assumed: package-scope metrics are identical before and after (A3 top-15 unchanged with base.py 31, A4 0, A5 29), because packages already resolved through the repo root — the blind spot only ever lived outside them; the U6 multi-root and relative-import tests all still pass. ORPHAN QUEUE RESTATED, which was the point: 22 -> 4, with agents/ going 15 -> 0. Roughly four in five of that queue was a scanner artifact, not dead code, which is why the plan carried a do-not-work-from-it warning. All four survivors are subprocess-invoked entry points rather than dead files (knowledge/depgraph-snapshots/filter_ignored.py and probe_instrument.py, both run as scripts by snapshot.ps1; knowledge/upgrade-plans/p0-benchmark/benchmark_p0.py; scripts/extract_office_text.py), so the honest reading is ZERO first-party dead modules. The item cited 23; the plan carried 22 (15+4+3) and 22 is what was restated. Six sibling tests: the three behavioural ones proven to fail with the fix disabled, the three regression/precedence ones pass either way, which is what makes them regression tests (J26). Sibling suite 44 -> 50. Fifth instrument-change marker added to the snapshots README with the measured deltas, per the standing rule that a cross-boundary edge diff is the instrument and not growth.
