acceptance: |
  REPRODUCED AT THE 2026-08-12 GROOM, no database and no company data (J18): a scan of every file in config/gate-prompts/ parsing the leading Qn of each open_questions entry reports exactly one collision in the whole tree -- fid-identity-and-scope.yaml, 9 questions, id Q6 used TWICE. One Q6 is the SME answer landed 2026-08-12 (CM_DEF_VJOB.OWNER holds the NAME, the join normalizes the directory side only); the other is an older, still-open question about whether the directory exposes an application-level roll-up. The gate this page belongs to is K17, which is the next thing walked on this thread, so the ambiguity is about to be written into a sign-off. (a) RENUMBER THE UNANSWERED ENTRY ONLY -- the roll-up question becomes the next free id (Q8; Q7 was raised the same day) and the ANSWERED Q6 keeps its number, because four other files already cite "Q6" by number for the answer and not for the roll-up question: config/source-mappings/psgmgr.yaml (the OWNER column note), config/source-registry.yaml (the psgmgr dataset note), docs/company-prompts/k16-fid-census-company-prompt.md, and backlog item K16's own "RUN Q6 FIRST" line. Verify each of those four still reads correctly after the edit; any citation found pointing at the roll-up question is re-pointed in the same commit. (b) A GUARD so this cannot recur silently: a test in tests/unit/test_gates_json.py (which already iterates config/gate-prompts/*.yaml) fails when any gate page reuses a question id inside open_questions, naming the file and the duplicated id. Guard added FIRST, watched to fail on the current tree, then the renumber turns it green -- the J26 shape. DECIDES NOTHING THE GATE OWNS: no question is answered, closed, or reworded, no edge semantics are touched, and no answer status changes. This is identifier hygiene on a page whose ids are quoted from four other files.
