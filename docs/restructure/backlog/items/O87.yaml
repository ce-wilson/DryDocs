id: O87
epic: web-console
title: The persona picker does not say which seat is the SME — mark it from SME_PERSONA_ID
  so the green chip follows the constant instead of naming Neo
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p3
status: done
depends_on: []
inputs:
- web/src/components/SignIn.tsx
- web/src/lib/auth.ts
- web/src/components/ui/StatusChip.tsx
- tests/unit/test_console_auth.py
acceptance: |
  (a) DERIVED, NEVER NAMED. The picker row for `SME_PERSONA_ID` carries an SME marker in
  the `--green` token. It reads the constant already exported from `web/src/lib/auth.ts`;
  the string "neo" appears nowhere in `SignIn.tsx`. Neo is green because the constant
  currently points at Neo — move the constant and the chip moves with it, with no second
  edit. A hardcoded id would be the whole defect this item exists to avoid.

  (b) THE ROW ALREADY HAS AN IDIOM — REUSE IT, DO NOT REACH FOR StatusChip. Each picker
  row is a 2-column grid whose top-right cell is a role badge (`ROLE_BADGE[p.role]`, a
  bordered uppercase mono span). The SME marker is a sibling of that badge in the same
  visual family. `components/ui/StatusChip.tsx` is the WRONG component here despite the
  name: its required `count` prop makes it a count+label pill ("15 completed"), and a seat
  marker counts nothing. Its token vocabulary is what to borrow — `--green`, theme token
  only, no hex, glyph not emoji (DL-3/DL-5).

  (c) IT MARKS A SEAT, NOT A STATE. Green here means "this is the SME seat", not "the SME
  seat is healthy" — no credential check, no reachability probe, no API call. The picker
  renders before sign-in and must not gain a network dependency. If a readiness indicator
  is wanted later it is a different item against a different surface.

  (d) ROLE STAYS TRUTHFUL ALONGSIDE IT. Neo's role is `user` and the badge keeps saying
  so. O47 ruled SME is WHO a persona is and not a fourth role tier — the marker sits
  beside the role badge and never replaces or overrides it, or `canAccessModule` starts
  disagreeing with what the screen shows.

  (e) ACCESSIBLE, NOT COLOUR-ONLY. The marker carries text (or a `title`/`aria-label`)
  naming the seat, so it survives a monochrome render and a screen reader. A bare green
  dot fails both.

  (f) GUARDED. A test asserts the marker attaches to whichever persona `SME_PERSONA_ID`
  names — parameterized on the constant, not on the literal "neo", so it still passes if
  the SME seat moves and FAILS if someone hardcodes the id back in. The vitest suite,
  `npm run build` and `npm run lint` are green, and `tests/unit/test_console_auth.py`
  still passes.
notes: |
  Minted 2026-08-31 (desktop, ui-workstream worktree) from a console startup session — the
  gap surfaced while documenting the picker for the run-drydocs-console skill.

  WHAT IS TRUE TODAY. `SME_PERSONA_ID = 'neo'` is exported from `web/src/lib/auth.ts` and
  `canAccessIntake` gates `/intake` on it, so the SME seat is fully encoded in behaviour
  and invisible in the UI. The picker shows displayName, id, role badge and the `chip`
  free-text line; Neo's chip happens to read "app-support SME · context intake", which is
  prose a reader must notice and parse rather than a marker they can scan for. Six seats
  are listed and three of them are user-tier and near-identical by design (mouse, tank,
  dozer differ only in identity, per O64's per-persona isolation testing), which is
  exactly the situation a scannable marker helps.

  WHY p3. Nothing is broken and no one is blocked — this is legibility on a dev-facing
  sign-in screen. It is worth doing because the alternative is every new reader learning
  the SME seat from `auth.ts` source, and because the derived-vs-hardcoded distinction in
  (a) is cheap now and annoying to retrofit after someone types the string.

  BUILT 2026-09-03 (laptop, Lane B of the 0aeba6fc handoff; wip/O87-laptop).

  (a) DERIVED. SignIn.tsx imports SME_PERSONA_ID and renders the marker for the row whose
  id equals it; the id is written nowhere in the component, and a test reads the
  component's source to prove that a quoted literal equal to the constant is absent.

  (b) THE ROW'S IDIOM. The top-right grid cell became a flex pair: the marker - the same
  bordered uppercase mono shape as the role badge, painted with the --green token
  through StatusChip's vocabulary (border, text and a 10% color-mix fill; token, never
  hex; a glyph, never an emoji) - and then the role badge. StatusChip itself is not used,
  for the reason the acceptance gives.

  (c) A SEAT, NOT A STATE: nothing is checked, probed or fetched; the picker still
  renders before sign-in with no network dependency, which is also what made the UI
  check below need no API.

  (d) The role badge is untouched beside it: Neo's row still says USER.

  (e) The marker's text is "SME seat" (the diamond glyph is aria-hidden decoration) and
  its title names the seat and the constant, so a monochrome print and a screen reader
  both get it.

  (f) GUARDED by web/src/components/SignIn.test.tsx - the first component test in this
  tree, React Testing Library under jsdom (O80 provisioned both for exactly the moment a
  pure-module test was not enough): the marker attaches to whichever persona
  SME_PERSONA_ID names and to no other, parameterized on the constant; it names the seat
  in text and title and paints with --green; the SME persona's badge still says its real
  role; and the source carries no quoted literal equal to the constant, so hardcoding the
  id back in fails the test. vitest 13 files / 146 tests, tsc -b, oxlint and vite build
  green; tests/unit/test_console_auth.py 63 passed (it reads the credential store and the
  Python personas, not the picker).

  SEEN ON THE PICKER, venue named: laptop, headless Edge 152 against Vite on :5299 with no
  API (the picker renders before sign-in): exactly one marker on the page, on Neo's row,
  reading "◆ SME seat" with the title present, computed colour the --green token, the
  role badge USER intact beside it, six persona buttons, no page errors.

  ONE GUARD ADJUSTED, because the first component test met it: tests/unit/
  test_ui_components.py counted components/SignIn.test.tsx as an unregistered component
  (its scan was every .tsx under the ledger root). The scan now skips vitest's own file
  pattern, {test,spec}.tsx, with the reason beside the rule - a test renders nothing on
  any route and needs no ledger row. Both directions of the drift guard are unchanged for
  real components. Full suite 3139 passed with that in place, plus the roadmap render red
  every Lane B close carries.

  NOT DONE, on purpose: no ui-tests.yaml case. The claim is a component property the
  runner holds entirely, and adding a ledger row would move the automated-share pin for
  a p3 legibility marker; the desktop can groom one in if the ledger should carry it.
