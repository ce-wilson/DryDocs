id: S12
epic: structure-remediation
title: 'Environment-drift guard: the suite fails loudly when the interpreter''s packages disagree with
  poetry.lock'
type: chore
module: drydocs-core
phase: 6
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
inputs:
- tests/conftest.py
- poetry.lock
- poetry.toml
- internal/repo-README.md
- .github/workflows/ci.yml
- pyproject.toml
acceptance: |
  A session-scoped guard in tests/conftest.py reads poetry.lock, and for every locked package that is ALSO installed in the running interpreter, asserts the installed version equals the locked one. Packages absent from the interpreter are skipped, not failed — the lock carries groups and extras a given install legitimately does not select. On drift the guard fails the session ONCE, before any test runs, naming sys.prefix, the count, and the first few offenders as `name locked X, installed Y`; it must also name the usual cause (an inherited VIRTUAL_ENV taking precedence over the in-project venv) and the remedy, because the failure the guard replaces was misread as twenty broken tests. Guard on DRIFT, never on the venv PATH: a path assertion would fail Docker, tox and system-python runs that are correctly provisioned, and would miss a wrong-version install inside the right directory. Proven both ways, and the fixture for the negative case is already on this machine: DryDocs/.venv reports zero drift across 65 installed locked packages and the suite stays green, while the shared sandbox venv reports 16 — including click (locked 8.1.8, installed 8.3.2) and ruff (locked 0.5.7, installed 0.15.11). A unit test drives the comparison function over synthetic lock/installed pairs so the negative case is reproducible off this machine. CI green on both matrix versions — CI installs from the lock, so it has no drift by construction.
notes: |
  Raised 2026-08-18, the follow-up the S11 session's venv note (internal/repo-README.md, PR #3) deliberately left out. The note tells a reader what to do; nothing MAKES the wrong environment announce itself. What it costs today: poetry honours an already-activated VIRTUAL_ENV ahead of the in-project venv poetry.toml pins, so a shell with another environment active runs the suite against that one. Under click >= 8.3 typer 0.12's secondary flags raise TypeError and about twenty CLI tests go red — tests that are not broken. That cost a full investigation cycle during the S11 work, and it is self-concealing: the suite looks broken, CI looks green, and the two disagree for a reason nothing on screen explains. The click case is the CHEAP one. The same venv carries ruff 0.15.11 against the exact 0.5.7 pin that pyproject calls load-bearing (J10 stage 0, authority docs/ruff-format-convergence.md) because formatter output varies across versions. A `ruff format` run from the wrong environment reformats the tree to a different convention and lands a diff CI then blocks — the failure J10 exists to prevent, and the one that ran RED for 100+ consecutive runs between 2026-08-05 and 08-12 without anyone looking. That is the real argument for p2 rather than the p3 its S8/S9 siblings carry: this guard protects a gate that has already failed silently once. Placement is tests/conftest.py, not tests/unit/ — integration runs deserve the same guard, and the file already owns session-scoped concerns (the shared Neo4j driver teardown). REJECTED ALTERNATIVE: assert sys.prefix equals the repo .venv. Simpler to write and wrong — it fails correctly-provisioned runs that are not in-project, and passes a mismatched install that happens to sit in the right folder. Drift is the defect; the path is only its most common cause, and belongs in the failure MESSAGE rather than the assertion. RETRACTED 2026-08-18, and the retraction is EVIDENCE FOR THIS ITEM. These notes previously carried a second finding -- "`poetry run pytest` needs PYTHONPATH=. locally or tests/unit/conftest.py cannot import drydocs_core" -- filed as a separate defect wanting its own backlog item. It is not a defect and there is no second item. Re-run cleanly: with VIRTUAL_ENV and PYTHONPATH both unset, `poetry env info --path` resolves to DryDocs/.venv and `poetry run pytest tests/unit` is 2176 passed / 5 skipped, with `import drydocs_core` succeeding on the bare interpreter -- the package is installed in the project venv, so no PYTHONPATH was ever required. The original ModuleNotFoundError came from poetry resolving to the INHERITED sandbox venv, which has no DryDocs install: the same root cause this item guards, wearing a different mask. Kept rather than deleted because it is the sharpest argument the item has -- the wrong environment did not merely produce twenty false failures, it manufactured a phantom SECOND defect that was written down and nearly scheduled. A guard that names sys.prefix on drift would have closed the question in one line instead.
