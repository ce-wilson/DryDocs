acceptance: |
  A collector-style probe (the bkup-collector precedent: shell collection, Python parsing) takes the distinct job hosts for an application (the Z3 query), runs Linux nslookup against each name that is a load balancer, parses the resolved hostnames, and matches them against the ingested server list — so a job scheduled against an LB name resolves to the physical servers, and therefore the LOCATIONS, it actually runs on. The mechanism is sample-reproducible: tests run against a canned nslookup transcript fixture, never live DNS; the live run is company-side by construction. Output is an evidence file (which hosts resolved where, which did not resolve or did not match — unmatched is reported, not dropped); any graph write goes through the Z2-gated shapes only.
notes: |
  User directive 2026-08-08. This is the piece that turns "the job runs on node X" into "the job runs in city Y" when X is a load-balancer alias. Also the natural module seam for the console: the resolver's OUTPUT feeds the Z5 map panel; the resolver itself stays a collector, not a web dependency.

  CLOSED 2026-09-05 (laptop, Lane B, wip/Z4-laptop). Two halves on the rua precedent — shell collects, Python parses. drydocs_lineage/collect/lb_resolve.sh takes a list of node names, runs nslookup over each, and writes every answer VERBATIM to its own file with a `; query:` line and a meta.txt envelope stamped COLLECTOR_VERSION lb-resolve/v1. drydocs_lineage/extractors/lb_resolution.py parses a bundle and matches the answers against a server list passed in as data, emitting an evidence file. Ships executable (100755, set with git update-index --chmod=+x, since Windows will not set the bit and history carries a commit whose whole subject was restoring it on rua_inventory.sh) and LF-clean, which .gitattributes already pins for the reason that a CRLF shebang breaks execution on the scheduler hosts.

  THE QUESTION THE ITEM DID NOT ANSWER — how does anything know a name is a load balancer? Three options and only one is defensible without a gate. A name-pattern classifier invents a naming convention nobody signed and is the same class of guess the T2 ambiguity guard exists to refuse. A configured list of LB names is machine-local by construction and is the collector's input, not the extractor's knowledge. So: THE COVERAGE REPORT ALREADY NAMES THE CANDIDATES. The UNMATCHED rows of infra.app-job-host-locations.v1 are exactly the hosts T1 and T2 could not place, and that is the collector's input list. The extractor then classifies BY OUTCOME — matched, unmatched (DNS answered, nothing inventoried), unresolved (NXDOMAIN), unreadable — never by what a name looks like. That ruling is written into both files' headers because it is the part a later reader would otherwise re-decide the wrong way.

  OUTPUT IS THE EDGE'S OWN SHAPE. Every matched record carries nodeid, server, match_tier 'dns-resolved' and a match_evidence string, which is what drydocs/loaders/server_resolution.py's docstring already promises T3 will arrive in, so a loader consumes the file unchanged. NOTHING HERE WRITES THE GRAPH: the acceptance says any graph write goes through the Z2-gated shapes only, and that is a separate act with its own verb. Consistent with the item's inputs, which name collect/, extractors/ and tests/fixtures/ and no CLI.

  SAMPLE-REPRODUCIBLE, WHICH IS THE WHOLE ACCEPTANCE — no venue to stamp, because the live run is company-side by construction and never runs here. tests/fixtures/lineage/lb_resolve/ is a canned transcript of six names: an alias fanning out to two inventoried servers behind a CNAME, an alias half-inventoried, an alias resolving to a machine nobody inventoried, an NXDOMAIN, a plain host with an authoritative answer and no banner, and a transcript with no queried name. 22 tests, and most of them guard ONE failure: reading the RESOLVER as the machine a job runs on. An nslookup answer opens with the DNS server's own name and address, so a parser reading top to bottom reports the resolver as the box the batch runs on — it would look like data, place jobs in the wrong city, and nothing downstream could tell. The other three traps each have a test too: an Address: line carrying a #port suffix is the resolver wherever it appears; a `canonical name =` hop is an alias and not a machine; and an authoritative answer has no "Non-authoritative answer:" banner, so finding the answer section by that string alone silently drops every reply in an environment that has its own zone.

  Full suite 3314 passed, 12 skipped, 0 failed; ruff check and ruff format --check clean. No PORT-MANIFEST row is owed — drydocs_lineage/** and tests/** rows already cover every new path.

  ONE THING HANDED BACK: collect/ now holds TWO collectors and a README titled "Run-As-User inventory collector". This collector documents itself in LB-RESOLVE.md beside it rather than pre-empting G132 clause (e), which owns the decision of whether that README becomes a directory index. G132 now has a second reason to make the index, and whoever takes it should route to all of them.
