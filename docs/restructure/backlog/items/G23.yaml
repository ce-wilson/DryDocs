  The lineage writer loads a rua bundle into the graph EXACTLY per the G22 gate rulings: the ruled node set (server / run-as user / script + profile artifacts / directory DataAssets) with the ruled identity keys and constraints, the ruled edges only (activated or newly planned->active per the gate — nothing beyond it), and the meta.txt provenance envelope attached in the ruled form. Idempotent re-load of the same bundle (MERGE on identity keys); a two-source fixture — the SAME logical script arriving as a server-extract occurrence AND a code-repo occurrence — proves single-node merge on the G22 script URN with BOTH source records (origin + path) retained; a testcontainers e2e proves a synthetic v2 bundle round-trips collector-shape -> extractor -> load -> cypher readback. Coverage counters from G20/G21/G24 surface in the load report. Full suite green.
notes: |
  Sequenced after the gate on purpose (K2 -> K4 loader precedent: gate first, build same day after sign-off). Synthetic fixtures only in-repo; real bundles stay in the G19 landing zone. MERGED 2026-08-06 (gate rua-load-shapes D2, an as-built defect the clause exposed): rua_inventory._stage_artifact currently DROPS the second arrival of a staged id — it increments cross_host_collisions and returns, so the second host's origin/sha256/owner/perms/mtime and envelope never land. The two-source fixture in this item's own acceptance CANNOT pass until that is fixed, so the extractor change is a precondition of this item rather than new scope: occurrences must ACCUMULATE as reified records (D2's ruled grain), not first-write-wins. Note also that code_repo.py keeps its occurrences as a newline-packed string property, fine for staging but ruled out as graph shape by ADR 0001 (a string is not queryable) — the load reads the parsed records, never the packed form. DEPENDS_ON G55 ADDED 2026-08-07 (laptop, G22 close-out) — a REAL ordering constraint, not bookkeeping, and verified in code rather than assumed: drydocs_lineage/writer.py::write_curated calls vocabulary_status() and RAISES GateBoundVocabularyError unless the entries it needs are `active`. G55 is what flips them. So this item's own acceptance ("the lineage writer loads a rua bundle into the graph") cannot pass until G55 lands — starting here first walks straight into the guard. G55 first, then this. DONE 2026-08-07 (desktop, same session as G55): BUILT per the signed rulings and nothing beyond them. The D2 extractor precondition fixed first — ProcessNode.occurrences added, _stage_artifact ACCUMULATES (second-host record kept, cross_host_collisions still counts as the D3 ambiguity signal, identical re-stages dedup). plan_rua/write_rua in writer.py: :Script MERGEd on the D1 normalized-absolute-path key (mechanical only; malformed counted, never loaded; URN = render), profiles as script_role=profile (C2), rua_path directory