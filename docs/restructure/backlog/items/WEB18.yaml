acceptance: |
  ModuleTemplate.tsx:51 renders every module header as tagline, a dot, then "backs onto" the
  declared backend; for Explorer (web/src/modules/registry.ts:60) that reads
  "Tower / app drill-down graph - backs onto drydocs". backsOnto: 'drydocs' is CORRECT - the
  tabs do read the graph - but the word Tower beside it invites exactly the inference R22
  exists to prevent: on 2026-08-20 "how many towers" fell through to text2cypher and the
  model proxied a console term onto :TOMRole, crossing from UI taxonomy into the TOM ontology
  unannounced. R22 fixed /ask (answer_declared, agents/graph_qa/pipeline.py:487, answering
  from the declaration with its provenance). The Explorer header never got the fix.

  (a) The header term carries a hover and/or link whose text is SOURCED from
      config/taxonomy/ui-concepts.yaml (schema drydocs.ui-concepts.v1; source
      web/src/data/towers.ts, graph_binding: none, aliases including the CTO spelling;
      guarded by tests/unit/test_ui_concepts.py). It is never hand-written - a second
      definition drifts from the guarded one, which is the whole defect.
  (b) It MAY say the console-side fact: defined in the console, not read from the graph,
      four of them. It MAY NOT assert any ontology binding (Tower to :TOMRole or any other) -
      that is a HITL gate decision and the mapping stays status: planned until the gate
      confirms it. Any binding claim ships VIA THE GATE, never from this item.
  (c) THE OPEN QUESTION IS DECIDED AND RECORDED BEFORE ANYTHING IS BUILT: there is no
      web/src/generated/ui-concepts.json today, so either
      (a-option) a render step emits one - the gates / enforcement-matrix / software-registry
      precedent, drift-guarded, and a page header should not depend on a live request; or
      (b-option) the header calls docs.ui-concepts.v1 at render time - no new file, but a
      request and a failure mode on a page header.
      Precedent favors the render step. It is a render-surface change and therefore the
      render pen's call: the item records which was chosen and why, and if the render step is
      chosen, the generated file is drift-guarded like its siblings.
  (d) Cheap win taken either way: the aliases from ui-concepts.yaml are surfaced in the
      hover. A real acronym LINK waits on PLAN8's term ledger, which is where the target
      would live.
notes: |
  Minted 2026-09-07 from IDEAS.md Idea-277 (the UI session's eval-case review, reviewed at
  839eab1f on feat/cyclic-type-test-case), decision D4 - agreed in session, not built.

  Clause (c) is deliberately left as a decision ON the item rather than groomed into a done
  deal: both options are real, they have different drift and failure profiles, and the choice
  belongs to whoever holds the render pen. Clause (b) is the hard boundary - the ontology
  binding routes through the HITL gate and no hover text may pre-empt it.

  BUILT 2026-09-08 (Lane B, laptop `NewThinkpad`, wip/web18-laptop; offline - no graph and no
  server, the artifact and the component are both testable without either). The branch is
  based on wip/api4-laptop and therefore on the whole lane chain; MERGE ORDER: r18, agent1,
  api4, web18. It is chained for a specific reason rather than by habit: the O42 ledger's
  module-binding COUNTER in tests/unit/test_ui_components.py is a single assertion tuple, R18
  already moved it to 43/107, and a WEB18 branched off main would have moved the same line to
  42/107 - one line, two branches, a guaranteed merge conflict over a number.

  CLAUSE (c) IS DECIDED, AND THE DECISION WAS NOT MINE TO MAKE. The item says the choice
  belongs to the render pen and that pen is Lane A's, so it was ASKED in session on
  2026-09-08 and answered: the RENDER STEP (a-option). Two reasons carried it, both on the
  item already. A page HEADER should not depend on a live request - a provenance hover that
  is empty whenever the API is cold disappears exactly when someone is debugging the thing it
  explains. And an artifact is drift-guarded where a live read is only as current as the last
  deploy. The cost is an edit to scripts/render_board.py, which is the render pen, and that
  edit is handed back below rather than assumed.

  WHAT LANDED. `scripts/render_ui_concepts.py` emits `web/src/generated/ui-concepts.json`
  from config/taxonomy/ui-concepts.yaml and rides the default render_board.py run (the
  J17/J20/N4 one-entry-point idiom - a generated artifact whose regeneration is not wired
  into the one command is one somebody forgets, and its guard then fails for a reason nobody
  caused). `web/src/lib/uiConcepts.ts` looks a term up by declaration and COMPOSES the
  sentence; `TaglineWithProvenance` renders it as an `abbr` on the one word that needs one.

  THE SPLIT IS THE POINT: the WORDING is in TypeScript, every FACT is in the artifact. A
  hand-written "Tower is a console concept, there are four" would be a SECOND definition, and
  a second definition drifting from the guarded one is the entire defect this item closes -
  so a guard asserts no member name, no cardinality and no term literal appears in the
  console consumer. Equally, the artifact composes no sentence: a rendered sentence in a
  generated file is the same second definition wearing a build step.

  CLAUSE (b), THE HARD BOUNDARY, IS GUARDED ON BOTH SIDES. In the data: the artifact carries
  `graph_binding` as declared and a test fails if it ever names a graph label. In the
  renderer: only `graph_binding: none` licenses the "not read from the graph" clause, so any
  value other than `none` makes this surface say LESS rather than more - because a confirmed
  binding is a gate ruling and the sentence for it belongs to whoever writes that ruling. The
  component test asserts the hover never says `TOMRole`, never says "label", and never says
  "maps to" - :TOMRole being the label a model actually proxied Tower onto on 2026-08-20.

  ONE DETAIL WORTH KEEPING: the match is word-boundary anchored, so "Towering" is not a
  Tower. A header is read at a glance and a WRONG provenance note is worse than none - which
  is the same judgement the item makes about hand-written text, applied to matching.

  (d) taken: the aliases ride in the hover, which is what helps the person who typed "CTO
  towers" and got nothing. A real acronym LINK still waits on PLAN8's term ledger.

  SURFACES: scripts/render_ui_concepts.py (new), scripts/render_board.py (the wiring - the
  render pen), web/src/generated/ui-concepts.json (new artifact),
  web/src/lib/uiConcepts.ts (new), web/src/components/ui/TaglineWithProvenance.tsx (new),
  web/src/routes/ModuleTemplate.tsx, config/taxonomy/ui-components.yaml + the O42 counter.
  TESTS: tests/unit/test_ui_concepts_json.py (6) + TaglineWithProvenance.test.tsx (9).

  HANDBACKS FOR LANE A:
  1. `backlog` (the render pen) - scripts/render_board.py gained one import and one call.
     That is the cost clause (c)'s chosen option carries and it was ruled in session, but the
     edit is in Lane A's pen and is named here rather than assumed.
  2. `snapshot`/`backlog` - the new artifact is regenerated by the standard board run, so no
     new step joins the session ritual. Re-running render_board.py at merge is idempotent and
     confirms it.
  3. Explorer is the ONLY header this changes today, because Tower is the only declared
     concept. Every other tagline renders byte-identically. If more concepts are declared the
     surface widens with no code change, which is the property the render step buys.
