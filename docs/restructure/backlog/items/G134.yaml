id: G134
epic: component-topology
title: The document registry records a corpus's trust level but not the rung that produced it, so a
  GROUNDED row cannot say whether anything higher was ever tried
type: task
module: config
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- config/doc-source-registry.yaml
- tests/unit/test_doc_registry.py
- config/classification.yaml
acceptance: |
  (a) THE LADDER IS DECLARED ONCE, IN THE FILE'S HEADER, and it is ordered
  best-to-worst because the rule that matters is "work down only until something
  answers": 1 machine-readable spec or bulk export (OpenAPI, GraphQL
  introspection, a DB catalog) - 2 an authenticated API call you make yourself -
  3 saved HTML or a rendered DOM - 4 print-to-PDF plus layout extraction -
  5 copy/paste text. Rungs 1-2 can yield VERBATIM; 3-4 yield GROUNDED; 5 yields
  GROUNDED and lossy. The ladder does not replace trust_default - it explains it.

  (b) EVERY ROW GAINS A RUNG, AND `unprobed` IS A VALUE. The field records the
  highest rung REACHED, never the highest that exists, so `unprobed` means the
  ladder was never walked and reads as a TASK rather than a limit. A row whose
  trust_default is GROUNDED and whose rung is unprobed is the finding this item
  exists to make visible: today that row is indistinguishable from one where
  rungs 1 and 2 were checked and refused.

  (c) THE FIELD IS REQUIRED AND GUARDED, like every other field on this ledger.
  tests/unit/test_doc_registry.py enforces the existing REQUIRED set; the rung
  joins it, with the vocabulary closed and the trust pairing checked - a row
  claiming VERBATIM at rung 4 or 5 fails, because a layout extraction is not the
  served bytes. A row may be GROUNDED at rung 1 or 2 (a spec can be transcribed
  badly); the constraint is one-directional on purpose.

  (d) THE PROSE THAT ALREADY DOES THIS JOB CONVERTS TO DATA. Two rows carry rung
  history in comments today. `confluence-*` reads "upgraded 2026-08-19 per this
  row's own rule: the direct Confluence fetch ran (company-side; ~50 pages, 0
  failed). Was GROUNDED while the capture was screenshot transcription" - that is
  a rung 5 to rung 2 upgrade written as narrative. Convert those to the field and
  keep the prose as the WHY; the field carries what a guard can read, the comment
  carries what a person needs.

  (e) TWO RULES SHIP WITH THE FIELD OR IT WILL BE FILLED IN WRONG.
  ONE: a blocked agent fetch says nothing about the host. Chat-tool network policy
  is not the machine's network access, and a source recorded `unreachable` on that
  basis is mis-recorded - both DPL hosts were "blocked" for an agent and answered
  immediately from a terminal on the same machine. TWO: rung 1 EXISTING is not
  rung 1 WORKING. The counterexample is already in hand and belongs in the header
  as the reason the field records reached-not-available: a service whose
  documented REST interface is gated for an account while a lower, undocumented
  route still answers. The ladder is walked, not inferred.

  (f) NOTHING IN THIS ITEM RE-CLASSIFIES A CORPUS OR CHANGES A `confirmed:` FLAG.
  Rung is a property of HOW a corpus was captured. Classification is sensitivity
  and stays where config/classification.yaml puts it; trust_default keeps its
  meaning; confirmed stays the gate's. If filling in the field reveals that a
  row's trust_default is wrong for its rung, that is a FINDING recorded in the
  row's notes and raised - never a silent correction, because trust_default is
  what loaders read.
notes: |
  Minted 2026-08-31. The ladder comes from a company-side research pass that
  captured two DPL service specs and wrote up the capture route as a reusable
  framework rather than a one-off. Producer-side the applicable surface is
  config/doc-source-registry.yaml - 13 rows, each already carrying
  trust_default: VERBATIM | GROUNDED | SYNTHESIZED, which is the SAME vocabulary
  the ladder assigns. So this is not a new axis: it is the missing HALF of an axis
  the ledger already has. The registry records the verdict and not the method,
  and the method is what tells a later reader whether the verdict can be improved.

  WHY IT IS WORTH A FIELD RATHER THAN A CONVENTION. The evidence that the
  convention alone does not hold is in the file: the one row that DID improve its
  capture route recorded the improvement in a comment, which no guard reads and no
  census can count. Ask "which corpora could be VERBATIM but are not" today and
  the answer requires reading thirteen comment blocks and inferring.

  THE LESSON THE LADDER ENCODES, which is the part worth keeping even if the field
  shape changes: look for the machine-readable source before building a scraper
  for the human-readable rendering of it. A Swagger UI page always has a spec
  behind it. That was proven the expensive way - a PDF-derived capture of those
  two services needed three captures and four parser-bug fixes to agree with the
  spec, and even then could not recover required-field arrays, enum values or
  $ref links, because the UI inlines references and renders enums as collapsed
  stubs. The spec route was one request.

  DELIBERATELY NOT HERE: the DPL registry field-contract correction. That is G64's
  and it needs its research written up properly first - the findings currently
  live in a session rather than in a log, which is the same gap J63 names for
  reviews. This item touches no DPL row.

  BUILT 2026-09-03 (laptop, Lane B of the 0aeba6fc handoff; wip/G134-laptop).

  (a) THE LADDER, once, twice-shaped on purpose: explained in the header's REQUIRED
  block and declared as DATA under `capture_ladder:` - rungs 1-5 best-to-worst with
  what each can yield, plus `unprobed` - because the guard reads the object, not the
  prose (J37). One refinement the rows forced, written into the header: a PDF or
  file the publisher SERVED as its artifact is rung 1 (an export), while rung 4 is a
  PDF you MADE by printing a rendering. The two published-PDF corpora would
  otherwise have sat on a rung describing a route nobody took.

  (b) TEN ROWS (the body's thirteen counts the three retired ids), each with the
  rung REACHED, from the row's own capture prose: rung 1 x4 - the two served-PDF
  corpora (neo4j-docs-essential-graphrag, jpmc-reports) and the two mail corpora
  whose .msg files are the mail system's export (adhoc-sme-email, ops-email-
  extracts); rung 2 x1 - cdo-frameworks; rung 3 x3 - bmc-docs, bmc-docs-controlm-
  utilities, chase-leadership-scrape; unprobed x2 - seal-pat-scrape (VERBATIM as
  declared intent, no capture) and mwaa-implementation-docs, GROUNDED at unprobed,
  the exact row the item exists to make visible; its comment says the ladder is a
  task there and names Confluence's REST route as rung 2 to try.

  (c) GUARDED, four tests in tests/unit/test_doc_registry.py: the ladder's shape
  and order; the field required with vocabulary = the ladder's keys; VERBATIM may
  not sit at rung 4 or 5 while GROUNDED anywhere is fine (one-directional, as
  ruled); and the unprobed set PINNED so a row joins or leaves it deliberately -
  the pin is what makes "which corpora were never probed" a count instead of a
  reading.

  (d) cdo-frameworks carries capture_rung 2 with its rung 5 -> 2 history beside
  it; the trust_default comment stays as the WHY. The body's `confluence-*` is
  that row under its pre-sanitization name.

  (e) Both rules ride in the header verbatim in intent: a blocked agent fetch says
  nothing about the host, and rung 1 existing is not rung 1 working.

  (f) Nothing re-classified, no trust_default moved, no confirmed flag touched.
  TWO FINDINGS recorded in their rows and raised here, not corrected:
  bmc-docs-controlm-utilities and chase-leadership-scrape both claim VERBATIM at
  rung 3, which the ladder's rule of thumb marks GROUNDED. The utilities scrape
  STORES the served bytes - a real case for VERBATIM the rule of thumb undersells,
  and the guard deliberately does not fail rung 3. The leadership scrape RETAINS a
  transcription of pages it fetched (a rung-5 shape on top of a rung-3 fetch; the
  raw HTML was not kept) - the weaker claim of the two. Both are the SME's call;
  trust_default is what the loaders read. Nothing in scope touches a DPL row.

  VERIFIED: the 99 tests across the registry, classification, corpus-status,
  docs-coverage and source-registry suites pass with the new key (every reader
  goes through dict access); ruff clean; full suite 3143 passed with ONE failure
  that is a render, not a defect - test_enforcement_matrix's regeneration guard,
  because web/src/generated/enforcement-matrix.json embeds this ledger's row and
  render_board.py (which runs render_enforcement_matrix) is Lane A's pen. It clears
  with the same render the roadmap guard needs at merge.
