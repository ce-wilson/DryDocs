id: G133
epic: component-topology
title: api.py calls execute() outside the try that catches FileNotFoundError, so a missing binary breaks
  the documented exit-code contract - and API-CALLS.md records one folder-export path where two exist
type: task
module: drydocs-core
phase: 6
agent: main
model: sonnet
priority: p2
status: done
depends_on: []
inputs:
- drydocs_core/adapters/controlm/api.py
- drydocs_core/adapters/controlm/API-CALLS.md
- drydocs_core/adapters/controlm/README.md
- tests/unit/test_controlm_api.py
acceptance: |
  (a) THE EXIT-CODE HOLE, FIXED AND GUARDED. In api.py the try at line 418 covers
  load_config and plan, and its handler at 421 catches FileNotFoundError - but
  that handler only ever fires for the missing-CONFIG raise at line 253.
  `result = execute(planned)` sits at line 437, OUTSIDE the try, and execute
  reaches subprocess.run through _default_runner (line 361), which raises
  FileNotFoundError when the named binary is not on PATH. So a missing `ctm` or
  `exportdeffolder` produces a traceback and NO JSON on stdout, breaking the
  exit-code contract README.md documents. Fix: execution failure reports through
  the same CallResult/JSON channel as every other outcome, with an exit code the
  README table names. A test drives the CLI entry point with a runner or PATH
  that raises FileNotFoundError and asserts BOTH halves - parseable JSON on
  stdout AND the contracted exit code - because asserting only the exit code
  passes on a traceback that happens to exit non-zero.

  (b) WHICH CODE, DECIDED RATHER THAN DEFAULTED. README.md's contract already
  spends 0-3, with 2 as "config/usage error (bad path, unknown operation,
  missing template parameter)" and 3 as the reported capability gap. A missing
  BINARY is neither a config error nor a capability gap - the operation is
  supported and configured, the host just cannot run it. Say which code it takes
  and record why in the README table in the same change; do not quietly widen
  the meaning of 2.

  (c) API-CALLS.md STOPS IMPLYING ONE FOLDER-EXPORT PATH. The folder_export row
  maps to exportdeffolder (em-xml-utility) with status "Available - XML
  supported-but-deprecated window. Syntax = corpus gap; config template
  required." That is accurate and incomplete: a second transport is in working
  use - the Automation API GET /deploy/jobs?ctm=&folder=&format=XML - and the two
  return DIFFERENT SHAPES. Measured 2026-08-30 on one folder present in both
  exports: the payloads are identical in content (30 JOB, 21 VARIABLE, 1 INCOND,
  1 OUTCOND, 1 RULE_BASED_CALENDAR) and the API copy omits six EM-instance
  attributes (IS_CURRENT_VERSION, VERSION_SERIAL, VERSION_HOST, VERSION_OPCODE,
  MODIFIED, JOBS_IN_GROUP) while carrying REAL_FOLDER_ID=0. The row records that
  both transports exist, which attributes each carries, and that the deploy path
  is DEPLOYABLE-shaped - the zeroed id is correct for an artifact whose id is
  assigned by Control-M on upload, not a defect in the pull.

  (d) NAME WHAT THE SHAPE DIFFERENCE COSTS, IN THIS REPO'S TERMS, so the row is
  useful to the next reader rather than a curiosity. The graph keys folders on
  folder_id (drydocs/loaders/cypher/controlm_folders.cypher MERGE, sourced from
  CM_DEF_VTAB.TABLE_ID), so an API-pulled folder cannot be reconciled to a loaded
  folder by identity - only by name. IS_CURRENT_VERSION is a live filter across
  the loader SQL, so without it "these are the current definitions" is an
  assumption about API behaviour rather than a field that can be tested. What is
  NOT lost: resolve-cmdline-staging joins on (data_center, folder_name, job_name)
  - names, not ids - so the API export is usable for the lineage weld unchanged.

  (e) THE RUNNER SEAM REACHES THE ENTRY POINT. execute() already accepts an
  injectable Runner, but main() calls `execute(planned)` bare, so no test can
  drive the CLI's RUN path - every existing CLI test uses --plan-only, which is
  why (a) went unnoticed. Thread the runner through main (or make the default
  runner the single patch point and say so), so the entry point is testable for
  execution outcomes and not only for planning ones.

  NOT IN SCOPE, AND NAMED SO IT IS NOT SILENTLY ASSUMED: verifying a real call
  against a live Control-M. Nothing producer-side is configured to make one -
  no endpoint, no token, no ctm CLI - so a clause demanding a verified template
  would make this item unclosable here (J18: a live-verification claim names its
  venue). That work is G132 clause (g), on the server where the collector runs.
  Everything above is closable on a machine with no Control-M access at all,
  because (a) tests the binary being ABSENT.
notes: |
  Minted 2026-08-30. Both defects were found alongside a real folder pull, and
  both are verified against this tree at cae680e7: the try/execute line numbers
  are exact, and the API-CALLS.md folder_export row reads as quoted.

  DO NOT TEMPLATE A CALL FROM MEMORY. README.md section 4 and the corpus headers
  say why: every controlm-api-*.md page in external/orchestration/bmc-controlm/
  is flagged SaaS-conceptual and, in two cases, confirmed structurally inaccurate
  and partly SYNTHESIZED. They ground WHICH properties and behaviours exist, not
  syntax. The one grounded default template that ships is api_probe
  (`ctm config servers::get`); start from that probe against the live gateway and
  enumerate the deploy/config services, rather than reconstructing an endpoint
  from a doc page.

  WHY THIS IS NOT G132. That item moves a collector into the repo and is a
  drydocs-lineage change; this one is a drydocs-core adapter defect plus a
  reference correction. They were drafted as one item and split because the api.py
  fix is small, verified and independent of any gate, while the transport question
  needs a live probe. Neither blocks the other.

  WHAT THIS DOES TO THE D11 GATE. Clauses A1/A2 of controlm-definition-precedence
  assume ONE XML feed against ONE replica. There are two XML export paths with
  different attribute sets, and the scriptable one is the one that loses folder
  identity and the version columns. The question stops being "does XML beat the
  replica" and becomes "which XML, and can it still be joined" - which strengthens
  the complementarity reading in that gate's OQ-9 rather than the winner/loser
  framing. Recorded here so the gate session finds it; this item rules nothing.

  BUILT 2026-09-03 (laptop, Lane B of the f109280f handoff; wip/G133-laptop). The
  line numbers in (a) still matched the tree exactly at the claim.

  (a) execute() now wraps the runner call in an OSError catch. subprocess.run raises
  OSError - FileNotFoundError, PermissionError - only when the child cannot be
  STARTED; once it runs, its outcome is a returncode, so the catch cannot mask a
  failed call. The outcome is a CallResult with not_runnable=True, returncode None
  and the OS error in message, printed through the same JSON channel as every other
  result. The guard drives the REAL default runner against a template naming a
  binary no host has, and asserts both halves: json.loads on stdout first (a
  traceback fails there, not at the code), then the exit code.

  (b) EXIT_NOT_RUNNABLE = 4, decided and recorded in the README table with the
  reason: 1 says the tool ran (it never did), 2 says the config is wrong (the
  template is valid and the operation supported), 3 says the capability is missing
  at this version (it is not). Widening 2 would make "fix your config" the advice
  for a host-provisioning problem. The wrapper's `*) fail` arm already covers 4;
  a wrapper that wants to say "install the utility" tests for it. The JSON contract
  gains `not_runnable`, listed in the README key list; a test pins that every code
  the module defines has a README row (reads prose on purpose - the table IS the
  contract, J66's stated exception).

  (c) The folder_export row names both transports and the shape difference, and a
  new "Two folder-export transports" section beside the table carries the measured
  comparison as a two-column table: identical content, the six EM-instance
  attributes present only in the utility export, REAL_FOLDER_ID as the EM holds it
  versus 0, and the reading that the API copy is DEPLOYABLE-shaped - the zero is
  correct for an artifact whose id Control-M assigns on upload. No operation was
  added and nothing was templated from memory: the API path is recorded as grounded
  by a measured pull, not by the corpus, and OPERATIONS is unchanged.

  (d) The cost is named in this repo's terms, every path verified in the tree
  before it was cited: the cypher MERGE on ControlMFolder {folder_id}, sourced from
  TABLE_ID in the folders SQL; IS_CURRENT_VERSION as a live filter in the folders,
  jobs and both conditions loaders; and what is NOT lost - the XML lineage
  extractor keys on (data_center, folder_name, subfolder_path, job_name). One
  precision on the body: the extractor's key carries subfolder_path as well as the
  three names the body lists; still names, not ids, so the conclusion holds. The
  D11 note travels into the reference so the gate session finds it there too.

  (e) main(argv, *, runner=None) threads the runner into execute(). The .sh never
  passes it; a test does, and the entry point's RUN path is now driven both with a
  recording runner (exit 0, argv seen) and a raising one (exit 4). A third test
  keeps ran-and-failed (exit 1, returncode 1), never-started (exit 4, returncode
  None) and not-executable (PermissionError, also 4) distinct from one another.

  VERIFIED: five new tests in test_controlm_api.py, the adapter suite plus the
  source-scan, render-parsing, fence, publish-boundary and module-boundary guards
  green (70), ruff check and ruff format --check clean, full suite 3100 passed
  before the close. No new file, so no MODULE_MAP row; drydocs_core is already a
  core prefix. Not verified, as the body says: any call against a live Control-M.
