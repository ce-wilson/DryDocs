id: WEB8
epic: web-console
title: The typed-client guarantee has no holes - the mappings, intake and corpus routes are modelled in
  drydocs_api.schemas so the fifteen unwrapAs sites retire, and the ADK agent calls get a typed contract
  instead of raw fetch
type: task
module: drydocs-web
phase: 12
agent: main
model: sonnet
priority: p2
status: in_progress
depends_on:
- WEB4
inputs:
- docs/reviews/modules/web-2026-09-05.md
- web/src/lib/apiClient.ts
- web/src/lib/mappingsApi.ts
- web/src/lib/intakeApi.ts
- web/src/lib/corpusStatus.ts
- web/src/lib/adk.ts
- web/src/ask/askApi.ts
- drydocs_api/schemas.py
- tests/unit/test_openapi_client.py
acceptance: |
  The O70 guarantee has two holes. `unwrapAs` in lib/apiClient.ts marks every route
  drydocs_api.schemas has not modelled - fifteen sites outside tests, eight of them in
  mappingsApi (domains, grid, options, changeset, drafts, open drafts, promoted diff,
  corrections), two in intakeApi, one in corpusStatus - and mappings is the one module with
  WRITE surfaces, so a drifted route writes wrong rather than renders wrong (T3). Separately,
  lib/adk.ts talks raw fetch to the agent server with no schema behind it (A2).

  (a) The mappings, intake and corpus-status routes are modelled in `drydocs_api.schemas`; the
      OpenAPI schema and web/src/generated/api.d.ts regenerate; every `unwrapAs` site retires
      and the helper is deleted or its call count asserted at zero by a test.
  (b) The ADK calls get a typed contract: either a schema the agent server publishes and a
      generated client on the same pattern, or a hand-declared TypeScript contract in one
      module with a drift test against a recorded fixture of the server's responses - the
      builder chooses and records why. `askApi.ts` moves from src/ask to src/lib with the other
      API wrappers.
  (c) The drift tests at both ends of the chain (tests/unit/test_openapi_client.py,
      web/src/generated/api.test.ts) pass on the regenerated artifacts.
notes: |
