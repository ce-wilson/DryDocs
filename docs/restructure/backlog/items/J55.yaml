acceptance: |
  (a) THE GUARD. A unit test in the classification/boundary family fails when the retired internal org acronym appears in any git-tracked file outside `internal/`. It reads the retired token from the internal mapping file (`internal/cdo-reference/README.md`, which is where the old-to-new mapping is written ONCE and which never publishes) — the test itself embeds NO literal of the retired string, exactly the J15 rule that lets a boundary guard exist without becoming the leak it protects against.

  (b) THE PUBLISHED-CLONE CASE IS STATED, NOT SILENT. A clone without `internal/` cannot read the token. The guard SKIPS with an explicit reason in that case and never passes silently — a boundary guard that reports green because it could not run is the "succeeds loudly, does nothing" failure this repo has already recorded twice.

  (c) THE SURVIVORS ARE ENUMERATED AND RULED, NOT ASSUMED. The first run lists every remaining hit; each is either fixed or allowlisted with a recorded reason. Commit 3c2bfcdd names the expected survivors — `internal/**` content, git history, the port ledger, and the depgraph snapshot until it rolls — so an allowlist entry outside that set is a real miss from the sweep and is fixed rather than allowlisted.

  (d) IT RUNS IN THE DEFAULT SUITE with no live services and no company data, and it is green on the tree as left by this item.

  (e) OUT OF SCOPE: the cross-repo half of the same finding. The doc-corpus id the two repos JOIN on was renamed by the same sweep, and whether the company's registry row and any loaded graph doc ids still carry the pre-rename string is a PORT-SESSION question handled per-entry under the port-review F-table. This guard governs the producer tree only and rules nothing about their side.
notes: |
  Groomed 2026-08-27 from Idea-178 (captured 2026-08-26, desktop) — the mechanical half only. The entry's operative sentence is that "whoever merges the `hr-bootstrap-loads-config` worktree re-runs the done-gate grep", which is a remembered manual step guarding a boundary; this item turns it into a test, and the worktree merge then just runs the suite.

  Reasoning is J15's, verbatim in kind: a convention violated twice needs an enforcement point or it rots. The sweep at 3c2bfcdd was a one-time blind string pass over 60+ files with nothing behind it, and the entry already names one in-flight worktree that predates it.

  Epic release-infrastructure / module config / phase 8 follows J15, the direct precedent (also `module: config`, also a publish-boundary guard test). depends_on J15 records the lineage; J15 is done, so this is startable now.

