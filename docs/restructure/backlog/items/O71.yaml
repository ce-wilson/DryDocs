acceptance: |
  (a) A GATE PROMPT SPEC EXISTS AND PROPOSES, IT DOES NOT ADOPT. A new spec under `config/gate-prompts/` puts the console's authentication boundary to the SME, in the shape `config/gate-prompts/ui-write-surface.yaml` already uses (the O20 precedent: a page that PROPOSES a boundary and changes nothing by being rendered), and it satisfies whatever `tests/unit/test_gate_pages.py` requires of every spec â€” Module / Source / Registry ref / Classification. AUTH IS A TRUST BOUNDARY: nothing in this item adopts, installs, or wires an auth mechanism. Until the gate signs off, the console's sign-in stays the stub it is today.

  (b) THE QUESTION IS ABOUT PRACTICES, NOT A SCAFFOLD, AND SAYS SO. The ADR's survey already REJECTED the `fastapi/full-stack-fastapi-template` scaffold â€” clone-and-diverge, no update lifecycle, Stripe and multi-org baggage â€” and that rejection stands; the spec must restate it so a reader cannot mistake the gate for a reversal. What is on the table is the template's auth PRACTICES, cited to the register row: OAuth2 password flow, JWT, hashed credentials, a user model, a recovery flow â€” the survey's characterisation was "users-in-a-workspace rows behind JWT". Each practice is a separately tickable confirmation, so declining any subset is a valid sign-off.

  (c) THE PRODUCER-SIDE SEAM IS NAMED AND ITS CURRENT STATE MEASURED. Epic O's `?as=` headless sign-in is a stub sitting exactly where real auth would land. Read what it does today and record it in the spec, so the gate rules against the actual seam rather than a described one. State plainly which console surfaces are read-only today, because that standing state is itself one of the answers the SME may confirm.

  (d) THE REGISTER-ROW AMENDMENT IS DRAFTED, AND COORDINATED RATHER THAN SWEPT. ADR 0015's watched-source register discipline is that a fired trigger opens a backlog item and auto-changes nothing; the row for this source therefore needs an amendment recording that its named trigger â€” "only re-opens if a shared estate console is chartered" â€” has fired, that the charter is the internal ui-workstream's user/login build, and that the disposition is this gate. THE ADR FILE IS ANOTHER SESSION'S IN-FLIGHT DRAFT and is not on `main` as of 2026-08-28 (`docs/decisions/` runs 0014 then 0016). Do not create, re-draft, or overwrite it. If it has landed by the time this item is pulled, amend the row in place; if it has not, the amendment ships as drafted TEXT inside the gate spec with a note naming where it belongs, and the item still closes.

  (e) THE COMPANY SIDE IS NOT DECIDED HERE. Their ui-workstream makes their own call and runs their own gate; producer sign-off is not company sign-off. The spec says so in one line rather than leaving it to be assumed.

  (f) NOTHING IS BUILT. No dependency added, no auth code, no user model, no route change. The deliverable is a gate spec plus a drafted register-row amendment, and the gate SESSION itself is a separate item minted after this one lands.
notes: |
  Groomed 2026-08-28 from Idea-184 (captured 2026-08-27, High). The entry's own instruction was "one item to draft the auth-boundary gate question + the register-row amendment", and this is that item, scoped no wider.

  Epic/module/phase choice, recorded because it was a judgement call: filed under web-console / `drydocs-web` / phase 12 because the entry names the producer-side seam as "the O-epic's `?as=` headless sign-in pattern", which is where any adoption would land and what the gate must rule on. There is no Team Edition epic to file it under yet â€” ADR 0015 is still a draft, and Idea-179 records that a TE epic does not exist â€” so filing it there was not available. If a TE epic is later chartered, this item's register-row half is a candidate to move; the gate half stays with the console either way.

  Model fable: the item frames a TRUST BOUNDARY question, which is the tier's stated trigger. It still decides nothing â€” per the HITL flow (`docs/restructure/03-hitl-sme-flow.md`), the adoption routes through the gate and stays unadopted until confirmed. Acceptance clause (a) is what holds that line.

  Concurrency note, and it is load-bearing rather than courtesy: `docs/decisions/0015-team-edition-template.md` was an uncommitted working file in the shared tree at groom time. Clause (d) is written so this item can be pulled and closed whether or not that draft has landed, and so that a session pulling it cannot resolve the ambiguity by writing the ADR itself.

  DONE 2026-08-31 (desktop). Deliverable is a gate spec plus the register-row amendment.
  Nothing was built, no dependency added, no auth code written — clause (f) held.

  (a) THE SPEC PROPOSES AND DOES NOT ADOPT. `config/gate-prompts/console-auth-boundary.yaml`,
  in the O20 `ui-write-surface.yaml` shape, passing test_gate_pages.py (Module / Source /
  Registry ref / Classification, provenance with the source-vs-derived split). Until it signs
  off the console's authentication is exactly what section B describes.

  (b) THE REJECTION IS RESTATED FIRST, in the file header and again as section A confirmation
  1, quoting the ADR's own grounds — clone-and-diverge with no update lifecycle, and a
  "users-in-a-workspace rows behind JWT next to Stripe" tenancy on a different axis from a
  generated instance with its own databases. A reader who skims cannot mistake this gate for
  a reversal. Each of the five practices is separately tickable, so declining any subset is a
  valid sign-off and declining all of them is the standing state.

  (c) THE SEAM WAS MEASURED, AND THE MEASUREMENT CORRECTS THE ITEM. O71 describes `?as=` as
  "a stub sitting exactly where real auth would land". IT IS NOT, and has not been since O69:
  it is DEV-only (removed from production bundles by import.meta.env.DEV), it performs a REAL
  sign-in through signIn() with VITE_DEV_CONSOLE_SECRET, and it has no default and no
  fallback — unset, it does nothing and the sign-in screen renders. Reading the modules also
  changed the SHAPE of the gate: three of the five practices are already answered. Secrets
  are salted scrypt at OWASP parameters with the parameters stored per-credential; tokens are
  OPAQUE with a TTL from a server-side store; the server re-resolves role per request. So
  "hashed credentials" is a confirmation, not a proposal, and the honest JWT question is
  whether to REPLACE a deliberately revocable token with a stateless one — which is a
  property being kept, not a feature not wanted. P4, a real user model, is the one the
  charter actually presses on, and it is a data model plus a lifecycle rather than a library.
  This is exactly what clause (c) was for: the gate now rules against the actual seam.

  (d) THE ADR HAD LANDED, so the row was amended IN PLACE rather than shipped as drafted text.
  `docs/decisions/0015-team-edition-template.md` is on main (the clause anticipated it might
  not be, as of 2026-08-28). The row records that the trigger FIRED, what fired it, and that
  the disposition is this gate; "What TE takes" still reads *nothing adopted*, and the watch
  stays open. THE RULING IS NOT WRITTEN INTO THE ROW — it lands in config/gate-log.md, and the
  row points at the gate, so the two cannot drift. The ADR was not re-drafted or overwritten.

  (e) The company side is one line in section E: their ui-workstream runs its own gate, and
  producer sign-off is not company sign-off.

  NOT DONE, BY DESIGN: the gate SESSION. This item drafts the question; running it is a
  separate item to mint after this lands, per the item's own clause (f).

  AMENDED 2026-08-31 (user direction, after close): P3 (JWT) no longer carries a
  recommendation. The draft led with "recommended: decline", which is defensible but
  pre-empts the SME on the one practice whose answer depends on a REQUIREMENT nobody has
  stated -- does anything have to verify a console token without asking the issuer? P2 and
  P5's recommendations rest on facts about the producer (no OAuth tooling in use, no mail
  path) and stand. P3 is now put as a trade with both sides costed and no default, with the
  revocability property still stated plainly because it describes what the console has
  today and the SME needs it to rule either way.
