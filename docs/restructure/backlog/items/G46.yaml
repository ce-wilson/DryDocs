acceptance: |
  drydocs_core/controlm/resolver.py exposes resolve_command_line(layers, cmd_line) -> ResolvedCommandLine: builds the scope environment through the SAME machinery resolve_layers uses (guardrail 1 — one resolver, never a second substitution engine) and resolves the command text through the SAME fixed-point pass, returning resolved text + provenance (names substituted with their binding scope, unresolved user names, external %%\\ refs kept verbatim, canonical {ODATE}-class residue distinguished from failures, depth). Verbatim input is never mutated (guardrail 2 — derived beside, never replacement). Tests cover: a launcher line resolving through folder+job scopes, the %%VAR-launcher case (resolution turns an unparseable launcher ref into a parseable path), runtime tokens as expected residue, an unresolved name staying visible and reported, and the concat delimiter inside a command argument. No graph writes.
