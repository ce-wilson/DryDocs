  action items are their build list. Item stays in_progress, gate-bound, until the user rules.
  2026-09-06 DONE. The user ruled option C the same day; ADR 0020 flipped to ACCEPTED
  (617cca63) and the shape was built on wip/WEB10-desktop (e2dc1223 code, 08639e6a
  operator surfaces), merged --no-ff at 96111884. Clause by clause:
  (a) ADR 0020 rules one path-routed reverse proxy: /api -> drydocs-api, /agent -> the
  ADK server, /* -> web/dist/, prefixes stripped; the API base is the PATH /api, read from
  web/delivery.json by vite.config.ts, src/lib/auth.ts and the guard alike. In dev the
  proxy is Vite's own server.proxy / preview.proxy, so the shape is identical everywhere.
  (b) VITE_API_URL, VITE_ADK_URL and VITE_RUNTIME_VIEW_URL_TEMPLATE are retired; every
  localhost:8001 / :8000 literal collapsed into apiBaseUrl() / agentBaseUrl(); upstreams
  are Vite PROCESS env (DRYDOCS_API_UPSTREAM, DRYDOCS_AGENT_UPSTREAM) and never reach the
  bundle - npm run dist:check (web/scripts/checkDistCoordinates.mjs, a CI step) fails the
  build on any host:port in dist/. The non-secret runtime value the browser still needs,
  DRYDOCS_RUNTIME_VIEW_URL_TEMPLATE, is served by GET /api/config (unauthenticated by
  design; PUBLIC_ROUTES in test_console_auth.py says why).
  (c) Same-origin: the API's CORS middleware and DRYDOCS_CORS_ORIGINS are gone, so is
  serve.py --allow_origins, so is the probe's blocked-origin branch; reachability.ts now
  reads two verdicts - unreachable (the fetch threw: the page's own server is gone) and
  upstream-down (the proxy answered 502/503/504). Its O69 -> 2026-08-30 drift is cited
  in tests/unit/test_console_delivery.py as the retired defect class; that file replaces
  test_console_origins.py, and TC-SHELL-07 in config/taxonomy/ui-tests.yaml points at it
  (no new case, so the automated-share pin holds). api_url left the ADR 0019 control
  part; the agent reads DRYDOCS_API_URL itself.
  (d) O72 carries a dated note adding the reverse proxy as the Compose stack's fifth
  service (reads web/delivery.json, serves web/dist/, 502 on a dead upstream, SSE
  buffering off for /agent/run_sse, per-environment template and API URL, dist:check in
