id: S13
epic: structure-remediation
title: 'None of the six S8 command modules can be imported first: `import drydocs.cli_docs` in a fresh
  interpreter raises AttributeError, and the full suite hides it'
type: bug
module: drydocs-load
phase: 6
agent: main
model: sonnet
priority: p2
status: todo
depends_on: []
