acceptance: |
  (a) TWO EDITS, ONE COMMIT: a new row in `config/doc-source-registry.yaml` AND a `documentation:` block (`corpus:` pointing at that row's id) on the `airflow` product row in `config/taxonomy/software-registry.yaml`. They are atomic on purpose — a `documentation.corpus` naming an id the doc registry does not carry lands on `unregistered-corpus`, the ONE rung in `docs_coverage.FAILING`, so splitting the edits turns the suite red between two commits.

  (b) FIELD VALUES, pre-decided at the 2026-08-07 capture and unchanged by the unpark: tier T2 (internal platform), curation `sme-confirm` (fixed per tier, ADR 0006 §4), connector `web`, classification `Internal`, `target_db: drydocs` — the single content database G32/G102 ruled, and now the only value `tests/unit/test_doc_registry.py` admits. The id is CLASS-BASED per the registry's non-vendor grammar: this is our DEPLOYMENT's documentation, not a vendor publication, so the `{vendor}-docs` form must not be used.

  (c) THE POINTER, NEVER THE VALUE: `source:` cites `internal/airflow-reference/mwaa-internal-docs.md`. The real internal MWAA address stays in that file and appears in no tracked config row — the same rule the `airflow` row's own `locator.internal_docs` comment already states in `config/source-registry.yaml`.

  (d) `confirmed: false`, WITH THE REASON ON THE ROW: registration is a DECLARATION. No loader may write from the entry until a gate signs its doc-graph shape, and flipping the flag is a separate follow-up (the Q24 precedent), never this item.

  (e) THE OBSERVABLE: `drydocs docs-coverage` moves the `airflow` product row off `no-corpus`, and the close note quotes the rung it actually lands on (expected `ungated` — registered but not gate-confirmed, which is NOT in `FAILING`). The command still exits 0, and the full unit suite is green.
notes: |
