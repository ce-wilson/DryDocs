# ── Module / work-area registry (item.module must be one of these) ───────────
# Code components mirror MODULE_MAP.md; the rest are repo work areas so that
# non-code requirements still align to something a future phase can pick up.
modules:
  - drydocs-core         # parse/model/config/driver layer (MODULE_MAP.md)
  - drydocs-load         # loaders + cli + snapshots
  - drydocs-review       # graph_verify / review_labels / graph_review / gate_pages / publishing
  - drydocs-plan         # future: the project-board renderer (Epic I)
  - drydocs-docgen       # design-doc outline validation + deterministic render + HITL markup (Epic L; distinct from the planned drydocs-docmeta, which INGESTS docs)
  - drydocs-lineage      # future component (G4)
  - drydocs-deepdoc      # future component (G4)
  - drydocs-remediation  # future component (G3)
  - reference            # reference/ + external/ vendor & standards material
  - taxonomy             # config/taxonomy/ captures
  - ontology             # drydocs/schema/, relationship vocabulary, mappings
  - config               # config/ precedence, registries, crosswalks
  - graph-infra          # Neo4j topology, provisioning, deployment targets
  - docs                 # plans, ADRs, process docs, skills, rituals

