  - id: G28
    epic: component-topology
    title: "Close the multi-database naming drift: code and docs still name drydocs_context / drydocs_all, which provisioning never creates"
    type: bug
    module: graph-infra
    phase: 6
    agent: main
    model: sonnet
    priority: p2
    status: done          # DONE 2026-07-26 — naming drift closed + guard added; the ddlineage residency clause SPLIT OUT to G30
    depends_on: []
    inputs: [drydocs_core/schema/provisioning/01_databases.cypher, drydocs_deepdoc/__init__.py, drydocs_api/routing.py, drydocs_lineage/writer.py, drydocs_api/query_specs.py, MODULE_MAP.md, docs/decisions/0002-component-database-topology.md]
