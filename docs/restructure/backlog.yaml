      class that appears on BOTH sides of a cross-database relationship in the
      shipped loaders, so adding such a relationship without a proxy key fails.
    notes: >
      MEASURED 2026-07-26: 02_proxy_constraints.cypher — the file whose entire job is
      making cross-database joins possible — declares exactly TWO keys
      (DataAsset.assetId, ControlMJob NODE KEY) and its header names only drydocs and
      ddcontext. No SoftwareProduct, no Vendor, no Document, no ControlMFolder,
      no Employee. ADR 0006's existing plan to re-target the bmc-docs corpus to dddocs
      already depends on a SoftwareProduct proxy that nobody wrote down; see Q8 for
      what that omission does at runtime (silently drops every DESCRIBES edge).
      BUILD ORDER IS THE POINT: spine first, corpora second. The reverse order is how
      you get a green load that wrote nothing — the pattern this session hit three
      times. Q9/Q10/Q11 all depend on this item for exactly that reason.

  - id: G32
    epic: component-topology
    title: "Rule the document/content database topology and restate the ddcontext charter: reference vs unstructured content vs derived findings"
    type: task
    module: graph-infra
    phase: 6
    agent: main
    model: fable
    priority: p1
    status: todo
    depends_on: []
    inputs: [docs/decisions/0002-component-database-topology.md, docs/decisions/0006-docmeta-component-and-doc-graph.md, config/doc-source-registry.yaml, config/gate-prompts/, drydocs_api/exports.py, drydocs_core/schema/provisioning/01_databases.cypher]
    acceptance: >
      One ruling through the HITL gate, recorded as an amendment to ADR 0002 and
      ADR 0006 (amendment notes, not body rewrites — the ADR 0002 banner precedent),
      fixing: (a) how many document/content databases exist and what each holds;
      (b) the ddcontext charter, which today says "isolated uncertain / SYNTHESIZED"
      and cannot honestly describe a VERBATIM-captured email — if unconfirmed content
      lands there the charter restates to UNCONFIRMED (authority not established,
      whether captured verbatim or inferred) and drydocs_api/exports.py's
      WATERMARK_VALUE follows, since it stamps "SYNTHESIZED — unverified" keyed on
      database name; (c) the target_db column of every doc-source-registry entry;
      (d) an explicit, recorded acceptance of what a boundary COSTS — see notes;
      (e) MERGED 2026-07-27: the drydocs-deepdoc CHARTER, which has drifted
      between ADR 0002 (reactive command-line dependency analysis — what the
      scaffold implements) and ADR 0006 §1 (a consumer of docmeta's corpus,
      citing Document/Chunk nodes) — rule whether deepdoc is a parser-driven
      investigator, a corpus-driven retriever, or both, against the user's
      stated intent: profile a Confluence space, then search it SEEDED from
      what the grounded graph already knows, creating no relationship unless
      the subject is already in the DryDocs graph (the ADR 0002 D1 proxy-node
      pattern, so the mechanism exists).
      01_databases.cypher and provisioning/README.md then match the ruling, and
      tests/unit/test_database_names.py's read-vs-write guard covers the new set.
    notes: >
      Design session 2026-07-26 (after G30). SME direction: THREE databases —
      structured / unstructured-content / derived — for separation of loads and
      wipe blast-radius during testing, both of which hold independently of
      retention. Retention turned out NOT to be an argument either way (see Q10).
      THE COST, to be accepted explicitly rather than discovered later. `ddall`
      federates reads but a relationship can NEVER span databases — a composite
      query is a join on returned values, not an edge walk (see the shape in
      provisioning/smoke_drydocs_all.cypher: chained `CALL { USE ddall.x }` blocks).
      So known-shape questions still work, restated as explicit joins, and every
      QuerySpec is fine. What is lost across the boundary: shortestPath and
      variable-length paths, all GDS (centrality, community, similarity), and a
      single vector index over reference AND content chunks — which becomes two
      index queries plus a client-side rerank, notable because the Essential
      GraphRAG corpus was ingested to do exactly that kind of retrieval. Also
      harder: text2cypher (Epic R / ADR 0007) must generate correct USE clauses and
      business-key joins rather than a plain MATCH. If those matter, the mitigation
      is a single-database analytical projection, and that should be decided here
      rather than improvised later.
      Blocks G31 (the spine cannot be sized until the database set is known) and
      through it Q9/Q10/Q11.
      Clause (e) merged at the 2026-07-27 groom from the 2026-07-26 deepdoc-scope
      inbox entry (user question; NOT covered by the database ruling alone).
      Rider: the graph-seeded-retrieval shape is the SECOND application of the
      same idea (first: the 2026-07-23 HR-hierarchy graph-seeded resolution) —
      name it as a reusable pattern in the ruling instead of re-deriving it.
      Until (e) is ruled, do not build the deepdoc scaffold against either
      stale charter.

