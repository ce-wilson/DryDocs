      currency signal on :Document is registered `status: planned` in
      relationship_vocabulary.yaml with a decision-matrix entry and a gate-prompt
      spec; a retrieval over a multi-version corpus can return ONLY the current
      version without relying on captured_at ordering alone. No loader writes the
      edge until the HITL gate confirms it.
    notes: >
      User problem statement 2026-07-26: "internally i've seen 2 or 3 different
      versions with the same referenced person/team/process, but is stale and the
      only indication is date."
      The point that decided this is its own item rather than a rider on the
      database question: QUARANTINING DOES NOT DISAMBIGUATE. Putting all three
      versions in an unstructured-content database leaves all three versions
      sitting together, still ambiguous — the separation protects OTHER corpora
      from them, it does not tell you which one is current. That is a modeling
      problem and needs modeling, whatever the topology ends up being. Hence
      depends_on G31 only for where the nodes live, not for the semantics.

  - id: Q12
    epic: docmeta
    title: "Doc-capture scale guardrail: the web connector refuses a bulk scrape above a threshold instead of silently fetching thousands of vendor pages"
    type: task
    module: drydocs-docmeta
    phase: 14
    agent: main
    model: sonnet
    priority: p2
    status: todo
    depends_on: [Q6]
    inputs: [config/doc-source-registry.yaml, knowledge/upgrade-plans/docmeta-component.md]
    acceptance: >
      The web-capture entrypoint resolves its FULL target page list from the
      publisher's own manifest (e.g. the Author-it `toc.json`) BEFORE issuing any
      content request, and prints tree, page count, and estimated bytes + wall-clock
      at the configured delay. It REFUSES to proceed (non-zero exit, count named in
      the message) when the resolved count exceeds a configured threshold unless an
      explicit opt-in flag is passed; the threshold and the per-request delay are
      config values, never hardcoded literals. A `--dry-run` prints the same plan
      and exits 0 having fetched no content. Unit tests drive refusal-above and
      pass-below against a fixture manifest with NO network (the Track-1 portable
      rule). No capture script may land before this guard exists — Q6's acceptance
      carries the same clause.
    notes: >
      User-requested 2026-07-31 after a live feasibility probe of the BMC help
      trees: "stop or warn the user if they try to scan that many with the script."
      The numbers are the argument, and they were measured, not estimated —
      documents.bmc.com publishes a machine-readable `toc.json` per tree, so the
      page count is knowable BEFORE fetching anything, which is exactly what makes
      a pre-flight refusal cheap and a post-hoc abort unnecessary:
      /supportu/INC/ (INCONTROL mainframe) = 10,912 pages ~210 MB raw;
      /supportu/9.0.20/ (distributed, complete) = 3,860 pages ~74 MB;
      /supportu/9.0.21/ (distributed, trimmed — no Utilities book) = 1,965 pages
      ~38 MB. Sampled pages averaged ~19 KB raw / ~6.9 KB extracted text.
      Two distinct harms the guard prevents, both real: hammering a third-party
      vendor site (robots.txt ALLOWS these paths, so politeness is entirely on us —
      there is no server-side backstop), and committing tens of MB of vendor
      copyright into a repo that is private-but-sometimes-published. A THIRD hazard
      motivated the request and belongs in the warning text: the operator can pick
      the wrong tree entirely and not notice. /supportu/INC/ is the INCONTROL
      MAINFRAME family (Control-D, Control-O, Control-M/Tape, JCL Verify) — its
      "Control-M" subtree at 40498.htm is Control-M **for z/OS** administration
      (CTMPLEX/Sysplex, started tasks, user exits, allocated datasets), NOT the
      distributed estate DryDocs models. So the pre-flight summary must name the
      TREE and its top-level books, not just a number — a count alone would not
      have caught this.

  - id: Q13
    epic: docmeta
    title: "STANDALONE repeatable vendor-docs ingestion + loader: capture -> convert -> load a NAVIGABLE spine (TOC hierarchy + page_role + abstract), taxonomy only"
    type: task
    module: drydocs-load
    phase: 14
    agent: main
    model: sonnet
    priority: p2
    status: in_progress   # claimed 2026-08-04 (LAPTOP, pushed before work — user directive "pick up the Q series"). RECONCILIATION, not a fresh build: the pipeline landed 2026-07-31 in 9713118 and the status was never flipped, so this claim covers verifying the built artifact against the RESTATED acceptance and closing the gaps it does not yet meet.
    depends_on: []
    inputs: [knowledge/upgrade-plans/vendor-docs-agent-navigation.md, config/doc-source-registry.yaml, drydocs/loaders/bmc_docs.py, scripts/external_vendor_scrape.py]
    acceptance: >
      A STANDALONE, REPEATABLE pipeline — its own converter, loader, cypher and
      `drydocs` verb, NOT a widening of load-bmc-docs (user ruling 2026-07-31:
      "unique enough to use a stand alone, but repeatable ingestion and loader").
      It reads the capture manifest as its contract, so capture / convert / load
      are three re-runnable stages and re-running any of them is idempotent
      (MERGE on doc_id; a second full run reports zero net change). The
      converter strips the Author-it/ExtJS navigation chrome and emits body
      markdown; the loader writes :Document with doc_id, title, breadcrumb,
      source_url, sha256, captured_at, a deterministic `abstract` (first
      paragraph) and a derived `page_role`; the toc.json hierarchy loads as
      IN_SECTION / SUBSECTION_OF; chunks keep the established
      (:Chunk)-[:PART_OF]->(:Document) + NEXT_CHUNK shape. A TOC node bearing a
      fragment (`page` + `anchor` in the manifest) attaches to the EXISTING
      document as a section — it must NOT mint a second :Document. `page_role`
      derivation is an explicit title rule, NEVER an LLM, and the run REPORTS
      its unclassified count rather than defaulting pages silently (the G16
      values-decide pattern). Every node carries doc_version and
      version_verified=false. NO meaning edges — no :ControlMUtility, no
      DOCUMENTS, no SEE_ALSO (Q14's gate). Counts reported per role.
    notes: >
      Layer 1 of knowledge/upgrade-plans/vendor-docs-agent-navigation.md, and the
      half that needs NO ruling because it only transcribes the publisher's own
      structure — the taxonomy-before-ontology rule in CLAUDE.md §1. Worth doing
      alone: hierarchy + role + abstract already beats similarity-search-only,
      which is all the corpus supports today.
      STANDALONE, decided 2026-07-31: load-bmc-docs cannot be stretched to cover
      this and should not be. It consumes hand-written markdown, splits on H2,
      and infers a provenance TIER from heading text — a heuristic that exists
      only because that corpus is our lossy paraphrase. This corpus is VERBATIM
      throughout, so there is no tier to infer, and its real structure (TOC
      hierarchy, page_role, anchors) has nowhere to go in that loader's model.
      Two loaders with honest contracts beat one with a mode flag.
      REPEATABLE means the capture manifest is the contract between stages:
      scripts/external_vendor_scrape.py already emits it (sha256 per document,
      page/anchor per TOC node), so a recapture after a version bump re-runs the
      same convert+load with no code change.
      MODULE: drydocs-load beside bmc_docs.py, not drydocs-docmeta — the Q7
      precedent (it must work BEFORE the docmeta component exists at Q6).
      The version properties are load-bearing, not bookkeeping: the capture is
      9.0.20 (BMC ships NO Utilities book in the trimmed 9.0.21 publication)
      while the estate runs 9.0.21.300, so the graph must make "the 9.0.20 docs
      say X, unverified for your estate" the only answer it can produce. The
      config-side half of that already exists — see Q16.

  - id: Q14
    epic: docmeta
    title: "Draft the vendor-docs entity-spine gate prompt: is a documented utility a first-class node, and which edge carries it"
    type: task
    module: ontology
    phase: 14
    agent: ontology-mapper
    model: fable
    priority: p2
    status: todo
    depends_on: [Q13]
    inputs: [knowledge/upgrade-plans/vendor-docs-agent-navigation.md, drydocs_core/ontology/relationship_vocabulary.yaml, config/gate-prompts/, docs/RELATIONSHIP_GUIDE.md]
    acceptance: >
      A gate prompt in config/gate-prompts/ puts four questions to the SME with
      evidence drawn from the LOADED layer-1 spine (real counts, real titles):
      (a) is a documented utility a new :ControlMUtility label, or an instance of
      the existing software-registry model — inventing a label for convenience is
      what CLAUDE.md §1 warns against; (b) DOCUMENTS as a new edge vs reusing the
      registered :Document->:SoftwareProduct DESCRIBES; (c) whether a vendor's own
      in-page cross-link is an assertion we carry as SEE_ALSO or merely
      presentation; (d) the layer-3 estate join (job CMD_LINE -> the page
      describing its utility) recorded as BLOCKED on G32 with the reason stated.
      Every proposed term is registered `status: planned` in
      relationship_vocabulary.yaml with a decision-matrix entry; NOTHING is
      flipped and no loader writes an edge. The SIGN-OFF is a separate SME
      session — this item only drafts (the G27 precedent).
    notes: >
      Layer 2 of the plan. Depends on Q13 so the gate argues from loaded evidence
      rather than from a proposal — the pattern that made the K2/P2 gates
      decidable in one sitting.
      Layer 3 is deliberately NOT its own item: Q8's close note established that
      a relationship cannot span Neo4j databases, and ADR 0006 re-targets doc
      corpora to dddocs while the software registry keeps writing drydocs, so the
      estate join would silently drop every edge. G32 owns that ruling; this
      item's job is to record the dependency honestly, not to route around it.

  - id: Q15
    epic: docmeta
    title: "Agent navigation QuerySpecs over the doc spine: name-addressable lookup, section browse, role siblings, search as FALLBACK"
    type: task
    module: drydocs-api
    phase: 14
    agent: main
    model: sonnet
    priority: p2
    status: todo
    depends_on: [Q13]
    inputs: [knowledge/upgrade-plans/vendor-docs-agent-navigation.md, drydocs_api/, web/src/routes/ask/]
    acceptance: >
      Four registered QuerySpecs — docs.utility-lookup.v1 (exact name -> docs
      grouped by page_role), docs.section-browse.v1 (section -> siblings, one
      hop), docs.role-siblings.v1 (doc -> same-subject docs of another role), and
      docs.search.v1 (full-text/vector, explicitly the FALLBACK for "I don't know
      the name"). All four: bounded expansion with no unbounded variable-length
      traversal; every row carries source_url + doc_version + trust so the R5
      citation surface renders provenance; chunk text is NOT returned by default
      — the agent asks for it as a deliberate second step. Proven against the
      loaded corpus, and reachable from /ask without touching /raw-cypher.
    notes: >
      Section 4 of the plan. The point is that an agent usually arrives already
      knowing the noun ("how do I use exportdefjob?"), and a vector search for a
      known exact identifier is both slower and less reliable than an indexed
      exact match — so similarity search is demoted to the fallback path rather
      than being the only door in. Chunk-free by default because agent context is
      the scarce resource: triage on abstract + page_role, spend context on text
      only after choosing.
      Specs over raw Cypher per the R4/R5 design (ephemeral specs + citations
      carrying trust and classification) — this keeps doc answers citable and
      keeps agents off /raw-cypher.

  - id: Q16
    epic: docmeta
    title: "Documentation currency: surface the software-registry -> docs-corpus version drift as a report, and carry the pointer into the graph"
    type: task
    module: drydocs-load
    phase: 14
    agent: main
    model: sonnet
    priority: p2
    status: todo
    depends_on: [Q13]
    inputs: [config/taxonomy/software-registry.yaml, config/doc-source-registry.yaml, tests/unit/test_software_registry.py, drydocs/cli.py]
    acceptance: >
      (a) A REPORT — its own verb or a section of Q7's docs-verify — prints one
      row per software-registry product carrying a `documentation:` block:
      product id, runtime `versions`, `docs_version`, and every runtime version
      NOT in `current_for`, with a status of current | drifted | unverified.
      Exits non-zero on drifted so a version bump cannot pass unnoticed in CI.
      (b) The pointer reaches the GRAPH so an agent can traverse from the product
      it is asked about to the documentation describing it, carrying
      docs_version + the currency status — via the term Q14's gate confirms
      (DESCRIBES is already registered for :Document -> :SoftwareProduct; this
      may need nothing new, which is the cheapest possible answer and should be
      checked FIRST). Nothing is written until that gate signs.
      (c) `current_for` is only ever set by a human confirming a capture against
      a runtime version — never derived by parsing version strings.
    notes: >
      User requirement 2026-07-31: "we do need a pointer to it from the software
      registry which should contain external-vendor version number, so that when
      our ingestion process moves to the next major version, we know we need to
      update the docs."
      THE CONFIG HALF IS ALREADY BUILT (same session): the `controlm` product in
      software-registry.yaml carries `documentation: {corpus, docs_version,
      current_for}` beside its existing `versions:`, and two guards in
      test_software_registry.py enforce that the corpus id resolves to a real
      doc-source-registry entry and that the drift is COMPUTABLE (both sides
      present and typed). The mechanism is deliberately declaration-based:
      when the estate moves to a new version it lands in `versions:` and is
      absent from `current_for`, so the gap falls out with no version-string
      heuristics — because "does 9.0.20 documentation still describe 9.0.21.300?"
      is a judgement, not a string comparison.
      The drift-pinning guard asserts the KNOWN state rather than failing on it:
      drift is a true statement about the world today (9.0.20 docs, 9.0.21.300
      runtime), not a code defect, so a red suite would be dishonest. What the
      test prevents is the drift changing SILENTLY. The operational alarm is
      this item's report.
      Home chosen beside `versions:` on the product rather than only on the doc
      corpus so the comparison is LOCAL — the two numbers a human must compare
      sit on adjacent lines.

