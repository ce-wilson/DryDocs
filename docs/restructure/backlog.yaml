  # ── Epic S — Pre-UI structure remediation (main; ADRs 0008/0009/0010) ──────
  # Source: docs/reviews/architecture-structure-review-2026-07-25.md — a scored
  # /architecture + /tech-debt pass over the tree, run because the console is being
  # built and the API contract + graph property names harden once routes and
  # fixtures depend on them.
  #
  # Grouped as its own epic rather than folded into G (component-topology) because
  # these share ONE review document, ONE phased plan (its §5), and THREE ADRs whose
  # acceptance gates the build items — the board should show that sequencing as a
  # unit. Each item still carries its correct existing plan phase, so the roadmap
  # strip is unaffected.
  #
  # Findings deliberately WITHOUT an item:
  #   F4  / F9 / F10-part  DONE 2026-07-25 (432ea43 boundary-guard fix, bbf29cf gitignore)
  #   F5  drydocs/ 4-component flat namespace — deferred to Phase C by ADR 0002-a-1;
  #       the review's §6 "what NOT to do" says explicitly not to reopen it mid-UI-build
  #   F15 two test roots — tests/ (pytest) and graph-tests/ (YAML acceptance runner)
  #       are two different mechanisms, not duplication; scored lowest, recorded only
  #   F11 depgraph-snapshot retention — a user call about audit history, re-inboxed
  - id: S1
    epic: structure-remediation
    title: "Rule on ADRs 0008 (orchestration parent) / 0009 (config substrate) / 0010 (app_id + id_authority)"
    type: task
    module: docs
    phase: 6
    agent: main
    model: fable
    priority: p1
    status: done
    depends_on: []
    inputs: [docs/reviews/architecture-structure-review-2026-07-25.md, docs/decisions/0008-orchestration-module-boundary.md, docs/decisions/0009-configuration-substrate.md, docs/decisions/0010-internal-source-term-abstraction.md, docs/decisions/README.md]
    acceptance: >
      Each of the three ADRs carries a Status other than Proposed — Accepted,
      Accepted-with-amendments, or Rejected — with the deciding session and date
      recorded in the ADR itself and in docs/decisions/README.md; an amended ADR is
      EDITED to the ruling, not annotated around it. ADR 0010 additionally names the
      HITL gate that owns its property-term binding (S3 runs it): this item authorizes
      the SHAPE, the gate authorizes the graph write. No code moves here — a rejection
      is a valid outcome and closes S2/S4/S5/S6/S7 with it.
    notes: >
      RULED 2026-08-01 (laptop; user ruling "move S1 to accepted"). All three ADRs now carry a
      status and a deciding date, and docs/decisions/README.md matches.
      0008 ACCEPTED as proposed (orchestration parent, no rename) -> unblocks S2.
      0009 ACCEPTED as proposed (git text stays source of truth permanently; mapping.db stays
      derived/gitignored) -> unblocks S4.
      0010 ACCEPTED WITH AMENDMENTS -> unblocks S3.
      .
      WHY 0010 COULD NOT BE ACCEPTED AS WRITTEN, and what changed: its own body carried a
      "PARTIALLY SUPERSEDED - do not build from this ADR as written" banner saying an
      amendment was OWED AT THIS ITEM. The business-application-identity gate had already
      SIGNED OFF 2026-07-27 (22/22, 0 edits) and overruled the ADR's central mechanism, so
      ratifying the text verbatim would have written a WITHDRAWN property (`id_authority`)
      into the decision record as accepted. S1's own acceptance requires an amended ADR to be
      EDITED to the ruling, not annotated around it - so the body was edited: title, Decision
      block, the six rules, the migration table, Option B/C dispositions, Consequences and
      Action items. The banner is replaced by an ACCEPTED-WITH-AMENDMENTS record that keeps
      WHY each thing changed.
      .
      The gate's substance, now in the ADR: the rule is TWO-PART - (i) identity takes a
      neutral name, (ii) evidence/provenance vocabulary KEEPS the source's own term, so
      ATTRIBUTION_TIERS 'SEAL' and match_method 'seal' STAY. This reverses v1 action item 3,
      which told the implementer to reword match_method. `id_authority` withdrawn (one
      permanent registry - the authority is declared once in the taxonomy file plus a
      seal-extract column ledger, which B6 records as DECLARATIVE, not a runtime mapping).
      `app_urn` deferred with a named trigger. Cutover is 8 key-bearing sites (4 MERGE, 4
      MATCH) in ONE atomic change, because a Neo4j uniqueness constraint IGNORES NULLS and a
      partial flip silently DOUBLES the canonical node. :Port follows now, and DROP its
      constraint first - CREATE CONSTRAINT ... IF NOT EXISTS matches on NAME and would no-op.
      .
      Also corrected while editing: the ADR cited config/taxonomy/business-application.yaml as
      the layer that "already got this right", quoting `identifier: SEALID`. Checked the live
      file - it reads `identifier: "Application ID"`, corrected at the gate sign-off, and NOT
      to `app_id`. That is the two-part rule in miniature: the taxonomy entry is evidence so it
      keeps the source's header, while the graph property is identity so it is neutral.
      .
      The sequencing inverted relative to the plan: S1 was created 2026-07-25 to rule the SHAPE
      before its gate authorized the graph write, and the gate ran first (07-27). For 0010 this
      item therefore RECORDED a decision rather than making one. Worth noting as a pattern -
      a decision item ahead of its gate only holds if the gate actually waits.
      .
      Created 2026-07-25 groom from the pre-UI structure review. The R1 precedent:
      a decision item ahead of its build items, so nothing gets groomed into a done
      deal. The review's own recommendations are: 0008 no rename, add a parent;
      0009 keep git YAML as source of truth, widen the derived SQLite read model;
      0010 app_id + id_authority instead of seal_id. S8/S9 deliberately do NOT depend
      on this item — neither needs an ADR ruling to start.

  - id: S2
    epic: structure-remediation
    title: "Create drydocs_core/orchestration/ as the parent of controlm/, with the vendor-neutral shell/paths/crosswalk surface beside it (ADR 0008, F1)"
    type: task
    module: drydocs-core
    phase: 6
    agent: main
    model: fable
    priority: p1
    status: done
    depends_on: [S1]
    inputs: [drydocs_core/controlm/, docs/decisions/0008-orchestration-module-boundary.md, config/crosswalks/, MODULE_MAP.md, tests/unit/test_module_boundary.py]
    acceptance: >
      drydocs_core/orchestration/ exists holding __init__.py, shell.py, paths.py and
      crosswalk.py, with controlm/ moved beneath it by git mv and its content otherwise
      unchanged — except the two mixed modules split along the line the ADR draws:
      commands.py into shell.py (argv/statement parsing, launcher registry) plus
      controlm/fields.py (PRECMD/POSTCMD/CMD_LINE routing), and paths.py into the
      neutral canonicalization half and the Control-M {ODATE}/FileWatcher token half.
      crosswalk.py reads config/crosswalks/*.yaml as the gate-confirmed native→baseline
      map. Every importer updated, MODULE_MAP.md carries the new core rows,
      test_module_boundary.py green (core still imports no component), full suite green.
      NOTHING in the graph changes — no label, no relationship vocabulary entry, no
      Cypher; :ControlMJob/:ControlMFolder/:ControlMServer stay exactly as they are
      (ADR 0003 rule 4).
    notes: >
      The review measured this before recommending it: ~1,100 of controlm/'s 1,725 lines
      are irreducibly Control-M (AutoEdit %%NAME|VALUE syntax, variable simulation,
      folder-name convention), so RENAMING the directory to orchestration/ would put a
      neutral name on the most vendor-coupled code in the repo — the exact failure ADR
      0004 exists to prevent. The real gap is that controlm/ has no parent and no
      sibling slot, so an AutoSys or Airflow module has nowhere to land. Additive:
      one git mv, one new package, two file splits. Do the CORE move before the console
      ships (the API's query specs are where an orchestrator assumption would first
      become a public contract); the drydocs/loaders/controlm_* + sql/ + cypher/
      reshuffle is internal and follows in S5's phase (review §5 Phase 3, F1b).
    progress: >
      DONE 2026-08-02 (laptop). One git mv, one new package, two file splits, one new
      module, 25 importers repointed. Suite 1352 / 7 skipped, ruff + format clean, no
      graph change of any kind.

      THE ADR WAS WRONG ABOUT ONE THING AND THE BUILD SAYS SO. ADR 0008 classified
      commands.py as "Mixed" and scheduled its "PRECMD/POSTCMD/CMD_LINE and
      EMBEDDED_SHELL/UCM field routing" out into controlm/fields.py. Measured here: that
      routing IS NOT IN THAT FILE. Those field names appear only in the module docstring
      and two explanatory comments; every executable line was already vendor-neutral. The
      real routing lives in controlm/variables.py (SHELL_VAR_NAMES + the EMBEDDED_SHELL
      classification — already vendor-side, which is where rule 1 wants it) and in
      drydocs/staging.py (component-side, load-cadence, ADR 0002-a §6). Neither moved:
      S2's acceptance freezes controlm/ apart from the two named splits. So commands.py
      went to orchestration/shell.py WHOLE, and fields.py is deliberately thin — the
      field vocabulary, a parse_field router for a caller holding a field NAME, and the
      UCM container-override extraction, which is the one genuinely Control-M-shaped
      function commands.py did carry. Inventing routing code to fill a planned module
      would have been worse than recording that the plan over-estimated the split.
      ADR action item 2 now carries this correction.

      THE paths.py SPLIT NEEDED A SEAM, NOT A CUT. Neutral and vendor were entangled:
      build_file_ref calls the canonicalizer, the date-token reader and looks_like_path,
      and all three carry Control-M vocabulary (?-runs -> {TS16}/{Q<n>}, {ODATE}, the
      unresolved-%% exclusion, the FILEWATCH role rule). Cutting the file in half would
      have either duplicated the assembly or left the neutral half importing the vendor —
      the exact direction rule 1 forbids. So the neutral module owns the FileRef shape and
      the assembly and gains PathDialect; controlm/paths.py declares the Control-M dialect
      and re-exports the neutral functions bound to it. Every existing caller gets byte-
      identical behaviour, and a second orchestrator supplies a dialect instead of forking
      the module — which is the reusability ADR 0008 was actually buying. NEUTRAL is a
      real usable dialect (identity canonicalization, no date tokens), not a stub.
      Ordering preserved deliberately: dialect role rules are checked BEFORE the neutral
      ones, because FILEWATCH was first in the pre-split list and has to keep beating the
      generic OUT/LOG hits on names like FW_OUT_DIR.

      crosswalk.py IS THE ITEM'S REAL VALUE. config/crosswalks/*.yaml had been
      gate-confirmed since 2026-07-14 with NO runtime reader, so `fidelity: no-equivalent`
      was a warning in prose that nothing could enforce — an unmapped concept could be
      rendered as the nearest Control-M label and the graph would assert something no gate
      ruled. resolve() now RAISES NoEquivalentError with no nearest-match fallback, tells
      the caller when a mapping is `approximate` rather than letting it read as exact,
      REFUSES a `status: proposed` crosswalk at runtime (a proposed crosswalk is a gate's
      input, not a mapping), and rejects an unknown fidelity value because a new tier is a
      gate decision, not a typo. 16 tests over both confirmed crosswalks.

      THE GUARD IS NARROWER THAN THE ADR ASKED, ON PURPOSE. Action item 4 said "nothing
      outside orchestration/controlm/ imports Control-M-specific modules" — taken
      literally that fails on its first run, because drydocs/staging.py, drydocs/cli.py and
      the lineage extractors all import the Control-M parser and are RIGHT to: they ingest
      Control-M. The enforceable invariant is the WITHIN-CORE direction — the neutral level
      must never import the vendor — plus a shape guard that fails if drydocs_core/controlm/
      reappears at the top level. That pair is what makes a second vendor possible; the
      literal reading would only have made the suite red.

      Three exception names hit N818. Renamed rather than per-file-ignored: the config
      layer already uses the Error suffix (UnknownSpecError, UnknownDomainError are exact
      analogues), and adding a fourth ignore for brand-new code with zero external call
      sites is the shape of reasoning the B023 commit warned about. The existing N818
      ignores rest on 55 call sites and port-collision cost; neither applies here.

      NOT DONE, and named: ADR action item 5 (folder-vs-module naming — web/ <-> drydocs-web,
      agents/ <-> drydocs-agents, libs/) is a DECISION, not a chore. One of its two options
      rewrites `module:` on live backlog items, which is governance and outside this
      acceptance. Item 6 (the drydocs/loaders/ mirror) is phase 3 and now unblocked.
      Port sequencing (item 7): step 53b added, and it flags that
      scripts/render_enforcement_matrix.py is a 3-way merge company-side — they carry 4
      company-only SURFACES rows, so the launcher-registry consumer change and the new
      orchestration-crosswalks row must be taken INTO their file, not over it.

