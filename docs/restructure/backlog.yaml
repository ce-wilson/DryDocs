  - id: G30
    epic: component-topology
    title: "Decide where curated lineage lands: the writer pins drydocs while four query specs read the provisioned-but-never-written ddlineage"
    type: task
    module: graph-infra
    phase: 6
    agent: main
    model: sonnet
    priority: p2
    status: done
    depends_on: []
    inputs: [drydocs_lineage/writer.py, drydocs_api/query_specs.py, drydocs_core/schema/provisioning/01_databases.cypher, docs/decisions/0002-component-database-topology.md, docs/decisions/0002-c-depgraph-lineage-rehome.md]
    acceptance: >
      One ruling recorded in writing, then made true in code: either (a)
      drydocs_lineage.writer targets ddlineage — which means its TrustBoundaryError
      allowlist, DATABASE constant and the 0002-C §5 ground-truth-only tests all move
      with it — or (b) the four query_specs rows that declare database="ddlineage" are
      repointed at drydocs, and ddlineage is documented as provisioned-for-later rather
      than live. Whichever wins, a test asserts the writer's target and the specs' target
      AGREE, so a spec can never again read a database nothing writes.
    notes: >
      Split out of G28 at its close (2026-07-26) — G28 bundled this with the naming
      cleanup and they are different kinds of decision: G28 was mechanical drift against
      an already-ruled convention, this one changes WHERE curated lineage data lives.
      Measured: drydocs_lineage/writer.py line 70 pins DATABASE = "drydocs" and refuses
      any other database (TrustBoundaryError, an allowlist — so this is a correctness
      and emptiness problem, not a safety one); drydocs_api/query_specs.py declares
      database="ddlineage" on four specs (lines 417, 540, 565, 589). Those four specs
      therefore query a database that is provisioned by 01_databases.cypher and written
      by nothing. Not urgent — the lineage writer is gate-bound anyway (its vocabulary
      is status: planned, so write_curated refuses a live load until the HITL gate flips
      it), so nothing is silently producing wrong answers today; it would bite on the
      first live curated write. Ties to the lineage live-load gate parked in IDEAS.
      DONE 2026-07-26 — RULED (b): the four specs repoint to `drydocs`; ddlineage stays
      provisioned + composite-aliased but documented as provisioned-for-later. The ruling
      is written up in ADR 0002 as a "Residency clarification" — NOT an amendment, because
      D1/D2 already say drydocs-lineage writes ground truth to `drydocs` and were never
      amended when G1 provisioning added a fourth database two days later. Each half of
      the codebase had followed a different source and both cited one, which is why
      neither looked wrong alone. Three grounds: (1) the stated reason for the DB boundary
      is the TRUST axis, and curated lineage is VERBATIM/GROUNDED — the same tier as the
      main load, so splitting it serves nothing; (2) 0002-C §5 already carries a ticked,
      tested "writes ground truth only" gate; (3) decisive — write_curated MATCHes
      :ControlMJob nodes the M3 load owns in `drydocs` and deliberately never MERGEs them
      (a lineage-created stub would break m3-verify's "every job has a folder"). A
      transaction cannot span databases, so from ddlineage those MATCHes would match
      nothing and every job-endpoint edge would vanish SILENTLY — an unmatched MATCH
      yields zero rows, not an error. Option (a) is therefore a design (a :ControlMJob
      proxy spine in ddlineage), not a constant flip. Deferring is also the cheap
      direction: ddlineage is empty, so choosing it later costs a design, not a migration.
      Named trigger to revisit, as an ADR amendment through the gate: the docmeta gate
      (ADR 0006 §b) adopted `dddocs` on the same component-per-database pattern and
      re-targets the bmc-docs corpus out of `drydocs` — if that proves out and lineage
      grows its own proxy spine, reopen. Guard: two tests in test_database_names.py —
      no query spec may read a database nothing writes (SPEC_DATABASES also dropped
      ddlineage, so pointing a spec there is now a deliberate edit), and the writer's
      target must equal the four specs' target. Verified load-bearing: restoring one spec
      to ddlineage fails 3 tests. Also corrected the user-visible UI copy that named
      ddlineage (module registry `backsOnto`, the Lineage SYNTHESIZED banner, route
      comments) — the honest reason those frames are empty is the vocabulary gate, not
      the database. Suite 928 -> 930.

