  - id: J26
    epic: release-infrastructure
    title: "Guards that read committed text with a bare substring match — sweep the shape that made a file unable to describe its own mechanism"
    type: chore
    module: docs
    phase: 8
    agent: main
    model: sonnet
    priority: p3
    status: done   # closed 2026-08-04 same session (desktop, J-series batch): inventory shipped as tests/unit/test_text_guard_conventions.py's module docstring — ~227 read_text sites classified by FAMILY with a disposition each (yaml/json-parsed and AST scans structural by construction; line-anchored counts structural since S3; PORT-MANIFEST walk structural — yaml rows + glob-to-regex + prefix append-only check; positive prose pins and escape-hatched prose bans noted as correctly-bare). SWEPT at this item: test_schema's label + supplement checks and ontology bare-CREATE ban now read strip_comments() text (closing the commented-out-MERGE false-pass, the G29 lesson), test_controlm_cypher's seven negative-assertion tests route through new _cypher_code/_sql_code helpers, test_catalog_keying's C22 guards extracted + comment-stripped. Regression proofs: products.cypher with the ENTIRE pre-C17 defect quoted verbatim in comments still passes its guards, and the shared _DECLARATION_RE ignores comment-quoted DDL (+3 tests net with J-batch siblings; suite 1427/5). test_database_names verified already-structural (G51 fixed the instance; its docstring cites this item as the class owner). Promise-vs-assertion sub-family covered in the inventory with the G51-tail bidirectional fix as the worked example; J28 closed the fourth family member same batch.
    depends_on: []
    inputs: [tests/unit/test_schema.py, drydocs_core/schema/constraints.py, tests/unit/test_port_reconcile_guards.py, tests/unit/test_database_names.py, scripts/render_board.py, tests/unit/test_text_guard_conventions.py, tests/unit/test_controlm_cypher.py, tests/unit/test_catalog_keying.py]
    acceptance: >
      Every guard that asserts over the TEXT of a committed file is inventoried, and
      each one either matches STRUCTURALLY (anchored at line start, or parsed) or
      carries a one-line note saying why a bare substring is correct there. At
      minimum the named candidates are checked: the render-drift checks, the
      PORT-MANIFEST walk, and test_database_names.py — whose module-constant guard
      keys on the exact identifier `DATABASE` and therefore missed a differently
      named constant (G51 owns that fix; this item owns the class). A regression test
      proves at least one swept guard now survives a file describing its own
      mechanism in a comment.
    notes: >
      Groomed 2026-08-02 from the 2026-08-01 [chore] line. The instance:
      test_schema.py::test_constraint_count counted `CREATE CONSTRAINT` ANYWHERE in
      the file, so documenting a DDL trap in a `//` comment inflated the count and
      simultaneously false-failed test_constraints_are_idempotent (the comment "has
      no IF NOT EXISTS"). S3 fixed it by anchoring both at line start, mirroring
      constraints.py::_DECLARATION_RE, which the bootstrap presence guard already
      used. The generalisation is the point: a guard that reads prose makes the file
      unable to explain itself, and this repo's whole doctrine is that the reasoning
      IS the audit trail.
      SECOND INSTANCE (merged 2026-08-04 from the G51-tail inbox line): the same
      day produced a sibling of the same family —
      test_databases_match_provisioning_script promised "exactly what
      01_databases.cypher creates" in its docstring and asserted only yaml ⊆
      cypher, so a database added to the DDL and not the config passed green. Made
      bidirectional at the G51 tail (aa0a0eb) and it FAILED on ['ddschema'] before
      the config fix — the audit proven, not argued. The sweep's inventory should
      cover promise-vs-assertion mismatches (docstring says equality, code checks
      subset), not only substring anchoring. J28 is the third family member (a
      classifier, kept separate as a bug with a proof case).

