    acceptance: >
      A `drydocs load-code-snapshot` verb reads the newest
      knowledge/depgraph-snapshots/*.json (schema depgraph-machine-first/v1) and
      MERGEs it idempotently into `drydocs`, so it survives the wipe-and-rebuild
