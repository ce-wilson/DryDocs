      layer (concept: BusinessApplication, source_of_record: SEAL, identifier: SEALID);
      the graph and API layers did not inherit it. PAT needs NO equivalent work — it
      never leaked into code (review §4.2, and §6 rule 4 says don't touch it).
      Sequencing note: the still-open seal-app-ref-edge-reshape v2 gate also touches
      :BusinessApplication. RESOLVED at §A4 by CARVE-OUT rather than by co-scheduling:
      everything the identity gate ruled is SEALED except §C1 (the 8-site inventory,
      stale if the reshape re-targets seal_attribution) and §D2 (the attribution_id
      shape, judged against today's grain). Those two — and only those — may be
      re-opened by the reshape. Port sequencing (§G4): this lands BEFORE any other wide
      structural port, because the company side has seal_id in code the producer cannot
      see and every additional structural port compounds the conflict.
    progress: >
      DONE 2026-08-01 (laptop). Phases 1 + 2 + the ledger, in one commit — the acceptance's
      "never loader-by-loader" applies to the whole cutover, not just the MERGEs.

      PHASE 1. The MERGE key is now app_id at all four MERGE sites and all four MATCH sites
      read it; seal_id is written from the SAME row value as a deprecated alias (§G3 owns its
      retirement). Two of the eight line numbers in the acceptance had DRIFTED since the gate:
      pat_product_mapping is :64 not :54, batch_port_orchestrator is :42 not :25. The SET of
      sites was right, which is what mattered — recorded because the next reader will otherwise
      trust the numbers. Constraints: new businessapplication_app_id (NEW name, as ruled);
      businessapplication_seal RETAINED; port_unique DROPped and recreated as port_app_key
      (parent_app_id, kind) — both a drop AND a rename, so an operator reading SHOW CONSTRAINTS
      sees the change rather than having to diff definitions.

      :Port got NO dual-write, unlike :BusinessApplication. Deliberate and asymmetric: seal_id's
      alias exists to protect readers, and the gate MEASURED that parent_seal_id has none
      (zero references in drydocs_api/, graph-tests/, web/src/; cli.py binds ports through
      HAS_PORT). A NODE KEY property also cannot be null. Writing a dead alias no test protects
      would have been cargo-culting the shape.

      THE TRAP IS REAL — PROVEN, NOT QUOTED. Live-verified on a scratch database (created and
      dropped): re-declaring port_app_key with a DIFFERENT key under the SAME name SUCCEEDED
      and left the original definition live. That is the gate's §D1 warning reproduced, so the
      DROP above is load-bearing, not belt-and-braces. Same run proved the whole file applies
      (61 statements, 52 constraints, the three expected present, port_unique gone), the loader
      shape yields app_id == seal_id with a matching parent_app_id, app_id uniqueness raises
      ConstraintError on a duplicate, and all five new graph-test cases return zero rows.

      PHASE 2. query_specs.py (6 specs) and mappings.py emit app_id; web/src follows
      (mappingsDemo.ts, mappingsApi.ts, MappingsRoute.tsx, assetSearch.ts). Column LABELS became
      "Application ID" — the source's own header, which is neutral, so rule 1 and the evidence
      rule agree here. tsc + vite build + oxlint clean. The tray localStorage key went v1 -> v2
      because TrayEntry.seal_id became app_id: a v1 entry read back under v2 would render a
      draft with no target application and submit it that way.

      THE BOUNDARY S3 DREW, and why it is not scope-shaving: §E1 rules "a route, a QuerySpec, a
      column header, a demo fixture" — the WIRE. It does not rule the committed FILE formats, and
      those cannot follow yet: manual_mappings.py parses `target_key=seal_id=<value>` BY NAME and
      REFUSES a row without it, so emitting app_id would stop every committed
      config/manual-loads/*.csv (and the TEMPLATE) from loading; OVERRIDE_HEADER IS the header of
      config/overrides/seal-contact-overrides.csv, which mapping_store.py ingests by name. Both
      are aliased at the SELECT / request-field boundary instead, commented at all four sites,
      and handed to §G3's retirement gate (recorded in ADR 0010 action item 6). The same reasoning
      keeps the pydantic row-model field names (ManualMappingRow.seal_id, SealAttributionRow.seal_id)
      as they are — they name what the source/file column is called.

      SCOPED OUT AND VERIFIED SO: ATTRIBUTION_TIERS 'SEAL' and match_method 'seal' are untouched
      (§B2(ii)). The one fixture change went the OTHER way — mappingsDemo.ts carried
      match_method: 'seal_var', a value the graph never writes, corrected to the real 'seal'.
      That is fixing an invented string, not renaming evidence.

      THE LEDGER (§B1(c)): config/source-mappings/seal-extract.yaml, 87 + 5 column rows
      TRANSCRIBED from models/seal.py and the two loaders' Cypher (generated from the source, not
      hand-typed), census: pending, both objects sweeping the tail. Registered at the dataset's
      locator.mapping and removed from test_source_mapping_drift.py's LEDGER_PENDING (8 -> 7).
      Two honesty notes written INTO the file: (i) only ONE column name is an SME-confirmed source
      header — `Application ID`, the gate's own row; every other name is the loader's field name,
      which is DryDocs' belief about the export, and that gap is exactly what let `SEALID` live
      here for months, so it is labelled rather than smoothed over; (ii) models/seal.py documents
      the row as PSGMGR.DECO_SEAL_APP_INFO while the registry calls the dataset a csv report — a
      replica view and a Reports export are different objects with different headers. Recorded
      UNRESOLVED (it decides what the Phase-2 census profiles), not guessed at.

      Two guards fixed as collateral, both real: test_constraint_count matched the bare string
      "CREATE CONSTRAINT" anywhere in the file, so documenting the DDL trap in a comment inflated
      the count AND false-failed test_constraints_are_idempotent; both now anchor at line start,
      matching the parser the bootstrap presence guard already uses. Inboxed for a wider sweep.

      Suite 1330 passed / 7 skipped. Renders regenerated (the load map caught the ledger count
