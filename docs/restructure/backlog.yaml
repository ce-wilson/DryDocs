  - id: J28
    epic: release-infrastructure
    title: "A gate with only partial rulings renders as CLOSED: render_gates.py classifies a prompt by any log entry that mentions its slug, never by whether its own sign-off was recorded"
    type: bug
    module: docs
    phase: 8
    agent: main
    model: sonnet
    priority: p2
    status: done   # closed 2026-08-04 same session (desktop, J-series batch): the classifier now decides by HEADING IDENTITY — an entry accounts for a prompt only when the slug appears in the entry's SLUGIFIED heading (prose headings like "SEAL attribution match policy gate" still match) and the heading does not say PARTIAL; body citations populate prompt_files for display but never close a gate; a prompt may also self-declare via a `# SIGNED OFF ...`/`# DEFERRED ...` marker line (the F1/F2 crosswalk prompts got the markers their siblings already carried — the log's prose headings predate the slug convention, and 13/17-confirmation full acceptances are on the gate-log record). PROOF CASE OVERTAKEN BY EVENTS, recorded honestly: seal-app-ref-edge-reshape was SIGNED at K7 2026-08-03 (heading-named, 24/24) AFTER this item was groomed, so it correctly does NOT render open — the mechanism is pinned instead on its exact pre-K7 three-entry pattern as a fixture test, plus a live pin that an open row for it now means the classifier regressed. The fix's LIVE catches: software-usage-patterns (a genuinely awaiting gate hidden behind a mini-gate citation — the current-day incarnation of the bug) and seal-tom-attribution-reshape (own entry explicitly PENDING, body-cited by K3's sign-off) both render open with the new "sign-off not recorded" title. gates.json 41→43 rows, 8→10 open; render deterministic (test_render_determinism untouched and green); +3 tests.
    depends_on: []
    inputs: [scripts/render_gates.py, tests/unit/test_gates_json.py, config/gate-log.md, web/src/generated/gates.json, config/gate-prompts/]
    acceptance: >
      A gate prompt whose sign-off has never been recorded renders as OPEN even when
      gate-log entries mention its slug. render_gates.py stops deciding "matched" by a
      bare substring scan of the section body (line 84 today) and distinguishes an
      entry that SIGNS a gate from one that merely CITES its prompt file: at minimum a
      partial-ruling entry and a different gate's sign-off entry must both leave the
      cited prompt in the open list. seal-app-ref-edge-reshape is the proof case — it
      must appear among the prompt-only/open rows after the fix, and does not today.
      A regression test in test_gates_json.py pins that case, gates.json and the board
      regenerate, and the render stays deterministic (test_render_determinism.py).
    notes: >
      Found 2026-08-03 while reviewing the Application ↔ Control-M attribution thread
      on user request. Three gate-log entries mention the slug — 2026-07-23
      (recorded), 2026-07-27 (a DIFFERENT gate's sign-off that cites the file), and
      2026-08-01 (PARTIAL RULING, recorded) — so the prompt counts as matched and is
      never emitted as prompt-only. The board therefore showed nothing open while that
      same 2026-08-01 entry says in as many words that the gate as a whole is still
      unsigned. Six weeks of governance work was invisible on the surface built to
      make it visible, and it took a manual read of the gate log to find.
      SAME FAMILY AS J26 — a guard or classifier that reads committed text with a bare
      substring match and promises more than it checks — and the same shape as the two
      found on 2026-08-03 (test_database_names.py keyed on the literal identifier
      DATABASE; test_databases_match_provisioning_script asserting a subset while its
      docstring promised equality). Kept separate from J26 because this one is a BUG
      with a named proof case, not an inventory sweep; fold it into J26 only if that
      lands first.

