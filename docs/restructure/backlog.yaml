    inputs: [drydocs_lineage/extractors/rua_inventory.py, drydocs_lineage/model.py, config/source-registry.yaml, tests/unit/test_lineage_inventory.py]
    acceptance: >
      A code-repo source seam emits script-artifact staging records in the
      SAME shape as G20's server-extract records, differing only in the
      provenance origin: origin=code-repo with repo + branch + commit +
      path (vs origin=server-extract with host + path + mtime). Driven by
      SYNTHETIC fixtures modeled on the observed shapes (a repo file
      listing/manifest and job-definition XML carrying script paths via
      folder VARIABLEs — mechanism-only; real Bitbucket access stays
      company-side behind this seam). A corroboration report joins the two
      origins on CONTENT HASH (compute the git blob hash of each server
      file and sweep ALL refs in one pass — git rev-list --all --objects —
      never branch guesswork; path-tail matching only as fallback until
      the G22 URN is ruled) into verdict buckets — found-at-refs (WITH
      the matching refs + commit dates: names the de-facto current
      branch mechanically), behind (only older commits match = running
      code ahead of everything committed), never-committed (the observed
      failure mode: production code absent from the repo), and repo-only
      — per-team hash drift IS the "clean branch" signal. The trust flag
      is a nullable per-repo trusted_ref field on the source-registry
      entry (the human-blessed intent line; null = server-extract-only
      truth — covers the stale-main case: main exists but dead, real
      code scattered across feature branches; the sweep names the
      candidate ref, a human blesses it), never inferred. NO graph
      writes, no new relationship types; unmatched records counted,
      never dropped. Full suite green.
    notes: >
      Groomed 2026-07-21 from the SME-chat evidence (mechanism-only): a
      script running in production was not findable in the code repo —
      code-fetch tooling keys on pipeline-id, which that job family
      lacks. The repo is a valid source ONLY where the team keeps a clean
      branch (the trust flag); production servers always have the latest
      RUNNING code — but "what calls it / is it used" stays the reference
      graph's question (G21/G16 facts), never this seam's. Amended same
      day from the stale-repo use case (team migrated to GitHub in sync,
