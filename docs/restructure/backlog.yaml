# =============================================================================
# backlog.yaml — the machine-readable backlog agents pull from.
#
# This is the SOURCE OF TRUTH for work items. 02-backlog.md is the human-readable
# view of the same items; IDEAS.md is the low-friction inbox that feeds this file.
#
# HOW AN AGENT PULLS WORK:
#   1. Find the next item with status: todo whose every depends_on id is status: done.
#   2. Set it status: in_progress (commit that change).
#   3. Do exactly that item — stay inside the named agent's layer. Anything ambiguous
#      goes to the HITL gate (docs/restructure/03-hitl-sme-flow.md), not auto-decided.
#   4. Meet the `acceptance` test, then set status: done.
#
# STATUS lifecycle (mirrors relationship_vocabulary.yaml's idiom on purpose):
#   todo | in_progress | blocked | done
#
# FIELDS:
#   id          stable short id (matches 02-backlog.md)
#   epic        grouping
#   agent       which sub-agent owns it (.claude/agents/) or "main" for the Opus session
#   model       suggested model tier
#   priority    p0 (blocker) | p1 | p2 | p3
#   status      todo | in_progress | blocked | done
#   depends_on  list of ids that must be `done` first ([] = startable now)
#   inputs      files/paths/registry keys the agent needs
#   acceptance  the pass/fail test for "done"
#   notes       optional
# =============================================================================

