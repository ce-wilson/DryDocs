  - id: C17
    epic: ontology-mapping
    title: "PAT grain keying: the Product LINE grain is name-only at source while :ProductLine is id-keyed — decide picker-1 resolution, and reconcile the unqualified area_product_id + the third (name-only) sponsoring form"
    type: task
    module: drydocs-load
    phase: 2
    agent: main
    model: fable
    priority: p2
    status: done   # 2026-08-01 (desktop) — §a/§b/§c ruled + built; gate as a whole still unsigned
    depends_on: [C9]
    inputs: [drydocs/loaders/catalog.py, drydocs/loaders/cypher/pat_product_mapping.cypher, drydocs/loaders/cypher/products.cypher, config/gate-prompts/seal-app-ref-edge-reshape.yaml, config/source-registry.yaml, config/gate-log.md]
    acceptance: >
      The keying asymmetry is resolved in writing, not assumed. (a) Picker-1
      resolution is ruled at the seal-app-ref-edge-reshape §G6-RIDER: either a
      product-line-scoped extract supplies product_line_id, or the resolver maps
      name -> id against the loaded :ProductLine set and REPORTS ambiguity
      (counts always reported, never silent) — a name must not become the
      de-facto key. (b) It is recorded which source column feeds
      area_product_id (Supporting vs Sponsoring), given the team report splits
      them and the member report does not — qualification is report-specific.
      (c) The third sponsoring form (Sponsoring Product Line, name-only) is
      either modeled or explicitly ruled out of scope, closing C9 §d's two-form
      coverage. (d) Whatever is decided lands in the row model + cypher + a test,
      and the gate-log carries the outcome. Full suite green.
    notes: >
      CLOSED 2026-08-01 — the item's premise was WRONG, and the SME fact that
      corrected it is what closed it. C17 read the PAT team report's name-only
      Product Line column as a property of the SOURCE; the user supplied the
      decisive fact in-chat — LoB, Sub-LoB, Product Line, Product and Area
      Product EACH carry a numeric id at source — so it is a property of the
      REPORT. §a therefore rules option (a) outright (a product-line-scoped
      extract supplies the id); name -> id resolution is NOT the mechanism, only
      a bounded migration path that must report ambiguity counts. Corroborated
      independently by internal/fcdo-reference ("native IDs at each level") and
      the company's own 5-field pat_lob_sublob_productline.csv. §b RECORDED:
      area_product_id is the SUPPORTING area product, sponsored_area_product_id
      the Sponsoring one; the two are co-populated, so cypher §3a/§3b firing
      independently is correct — the field name stays unqualified because the
      qualification is report-specific (the member report has one unqualified
      column), and the description carries the join. §c RULED OUT OF SCOPE:
      Sponsoring Product Line stays unmodelled while it is name-only, since
      modelling it means keying a :ProductLine on a name.
      THE FACT EXPOSED A LIVE DEFECT the rider never asked about: our node keys
      are strings, pydantic v2 does not coerce int -> str, and every catalog id
      field was a bare str — so a numerically typed read of the real feed
      rejects EVERY catalog row, not some (verified against the shipped models
      before the fix). attribution.py already carried this coercion for the
      Control-M keys; the catalog loaders never got it. _catalog_id refuses a
      fractional id rather than rounding, and normalizes integral floats (a
      nullable numeric column via pandas arrives float64, where a blind str()
      keys '12345.0' and MERGEs a duplicate beside the real node).
      COROLLARY APPLIED: having ruled the join is by id, the id join must not
      fail silently either. products.cypher hard-MATCHed the parent AFTER the
      Product MERGE, leaving an unparented Product with orphan:false from ON
      CREATE — a flag no code path could set true. Now OPTIONAL MATCH + a
      per-run flag + orphan_parent_product_line_id. The identical shape in
      product_lines/area_products was left alone and INBOXED: changing four
      loaders on one item's authority is a drive-by.
      NOT DECIDED: the Sub-LoB grain the same fact reveals (we model none) is an
      ontology decision belonging to the parked company-catalog back-flow item.
      Gate-log carries a PARTIAL RULING entry — the seal-app-ref-edge-reshape
      gate as a whole remains unsigned. Suite 1296.
      Filed 2026-07-27 from an SME review of the source report structure
      (captures Internal-Confidential — held OUT of the repo; structure only).
      The Team Details Report carries ID+Name for Product, Supporting Area
      Product, Sponsoring Area Product and Sponsoring Product, but Product Line
      and Sponsoring Product Line are NAME-ONLY. :ProductLine is keyed on
      product_line_id (required, min_length=1) and products.cypher MATCHes
      parent_product_line_id — so this extract cannot join product lines by key.
      That is precisely the FIRST dropdown of the §G6 mapping cascade, which
      makes it a build dependency for the steward screen, not a modeling nicety.
      The two sponsoring ID columns appear CO-POPULATED rather than exclusive —
      cypher §3a/§3b already fire independently, so the loader is right; confirm
      the model intends both. Depends on C9 because it re-opens that gate's §d
      coverage question with the source structure now visible.

