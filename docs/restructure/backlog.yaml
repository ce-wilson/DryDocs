# =============================================================================
# backlog.yaml — the machine-readable backlog agents pull from.
#
# This is the SOURCE OF TRUTH for work items. 02-backlog.md is the human-readable
# view of the same items (superseded by the rendered board once I2 lands);
# IDEAS.md is the inbox that feeds this file.
#
# HOW AN AGENT PULLS WORK:
#   1. Find the next item with status: todo whose every depends_on id is status: done.
#   2. Set it status: in_progress, commit, and PUSH that change BEFORE starting work — not at
#      close. This file's status is the only claim channel between concurrent sessions on the
#      two machines and git is the only sync layer, so a local-only claim is invisible to the
#      other machine (2026-07-28: two sessions independently built C19 ten minutes apart).
#   3. Do exactly that item — stay inside the named agent's layer. Anything ambiguous
#      goes to the HITL gate (docs/restructure/03-hitl-sme-flow.md), not auto-decided.
#   4. Meet the `acceptance` test, then set status: done.
#   5. LIVE-VERIFICATION CLAIMS name their venue (J18). A close note that says
#      "verified live" names the machine + container + database it ran on (e.g.
#      "desktop, neo4jtest, drydocs DB") — the two machines hold INDEPENDENT graphs,
#      so an untagged claim invites the other machine's audit to read ITS graph and
#      file the difference as a defect (nearly happened to G33, desktop-built,
#      audited from the laptop). Prefer sample-reproducible evidence
#      ("ingest-controlm on the bundled samples reproduces X") over machine-pinned
#      claims — a reader can re-run those anywhere. Worked examples: P5 (tagged at
#      close), P3 and G33 (retro-tagged 2026-08-04).
#
# STATUS lifecycle (mirrors relationship_vocabulary.yaml's idiom on purpose):
#   todo | in_progress | blocked | done
#
# FIELDS (v2 — validated by tests/unit/test_backlog.py):
#   id          stable short id (matches 02-backlog.md). Epic-letter series = PRODUCER-
#               allocated; the DD-series (DD1, DD2, …) is RESERVED for company-side-only
#               items and is never allocated here (user decision 2026-07-20, first
#               bundle-port reconcile — see git-readme.md §backlog id allocation)
#   title       REQUIRED plain-English one-liner — never rely on the id/codename alone
#   type        requirement (future capability ask) | task | chore | bug
#   module      which module/work area it lands in — must be in `modules:` below
#   phase       which plan phase it belongs to — must be an id in `plan.phases` below
#   epic        grouping
#   agent       which sub-agent owns it (.claude/agents/) or "main" for the Opus session
#   model       suggested model tier (haiku | sonnet | opus)
#   priority    p0 (blocker) | p1 | p2 | p3
#   status      todo | in_progress | blocked | done
#   depends_on  list of ids that must be `done` first ([] = startable now)
#   inputs      files/paths/registry keys the agent needs
#   acceptance  the pass/fail test for "done"
#   notes       optional
#
# The `summary:` roll-up and `next_ready:` list at the bottom are COMPUTED views —
# test_backlog.py fails if they drift from the items, so update them with any status change.
# =============================================================================

