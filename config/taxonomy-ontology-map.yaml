  # ---- SEAL ontology reshape — GATE-BOUND (2026-07-08 review) --------------
  # Nothing in this block is applied. The :BusinessApplication node stays classed prov:SoftwareAgent
  # (status: active in relationship_vocabulary.yaml#node_classifications) until the SME
  # confirms; see config/gate-prompts/seal-tom-attribution-reshape.yaml and the review
  # write-ups (knowledge/upgrade-plans/docmeta-component.md, git-readme.md,
  # docs/restructure/IDEAS.md 2026-07-08 [question] entry).

  - id: application-as-dataproduct
    taxonomy:
      source: seal-extract
      element: "BusinessApplication (SEAL-registered) is a data-product/asset record, not a software agent"
    ontology:
      from_node: BusinessApplication               # CURRENT (active): prov:SoftwareAgent — see node_classifications
      to_node: ~                            # node reclassification, not an edge
      current_class: "prov:SoftwareAgent"
      proposed_class: "prov:Entity / dprod:DataProduct"
      prov_type_from: Agent
      proposed_prov_type: Entity
      matrix_row: "n/a — node reclassification, not a matrix edge"
      rationale: >
        :BusinessApplication currently carries three incompatible PROV types on one node: SoftwareAgent
        (node_classifications), dprod:Port children (Entity semantics, seal_has_port — active),
        and org:Membership/org:Role role-holders (Organization semantics,
        seal_has_membership/seal_of_role/seal_held_by — active, C2). A SEAL application is a
        data-product/asset, not an Agent and not an Organization — prov:Entity / dprod:DataProduct
        is the precise fit, and it is also the type prov:hadPrimarySource (Entity -> Entity)
        requires of the source-of-record edge (seal-doc-source-of-record below).
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:Entity)", "DPROD/EKGF (dprod:DataProduct)"]
    vocab_id: ~                             # node reclass, not an edge — see relationship_vocabulary.yaml node_classifications#Application proposed_reclass
    status: proposed
    proposed_at: 2026-07-08
    open_questions:
      - "Reclassing :BusinessApplication breaks the current Agent-target assumption used by both seal_app_attributed_to_employee's simple form and the K1/K2 job->app edge (m3_seal_app_ref / job-seal-app-ref) — both must be re-shaped in the same gate decision (see the type_conflict_note / proposed_reshape on job-seal-app-ref above)."
      - "Any other edge that currently assumes :BusinessApplication is an Agent (e.g. arch_develops DevTeam->Application / dev-team-develops-app, C3 — Agent->Agent local, no PROV row either way) needs a re-check once this reclass is confirmed — flagged for the SME, not resolved here; those edges are NOT expected to break (no PROV matrix row was in use), but the SME should confirm."

  - id: seal-tom-attribution
    taxonomy:
      source: seal-extract
      element: "SEAL Technical Operating Model (TOM) role-holders (cto, application_owner, information_owner, data_owner, operate_manager, risk_compliance_officer) attributed to the BusinessApplication asset"
    ontology:
      from_node: BusinessApplication                # PROPOSED class: prov:Entity / dprod:DataProduct
      to_node: Employee                      # prov:Agent
      prov_type_from: Entity                 # after the proposed reclass
      prov_type_to: Agent
      matrix_row: "Entity -> Agent = prov:wasAttributedTo (simple form)"
      neo4j_label: WAS_ATTRIBUTED_TO
      role: tom_role_holder
      prov_maps_to: "prov:wasAttributedTo"
      qualified_form:
        pattern: "Application -[:QUALIFIED_ATTRIBUTION]-> (:Attribution) -[:HAS_AGENT]-> Employee ; (:Attribution) -[:HAD_ROLE]-> TOMRole"
        prov_maps_to: ["prov:qualifiedAttribution", "prov:agent", "prov:hadRole"]
        role_vocabulary: "TOMRole (skos:Concept) — 6 concepts: cto, application_owner, information_owner, data_owner, operate_manager, risk_compliance_officer, in a shared skos:ConceptScheme. DISTINCT from :Role (org:Role, PAT hierarchy only)."
      vocab_id: [seal_app_attributed_to_employee, seal_qualified_attribution, seal_attribution_has_agent, seal_attribution_had_role]
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:wasAttributedTo, prov:qualifiedAttribution, prov:agent, prov:hadRole)", "SKOS (skos:Concept)"]
    status: proposed
    depends_on: application-as-dataproduct
    proposed_at: 2026-07-08
    note: >
      Replaces org:Membership/org:Role for SEAL's TOM role-holders ONLY — org: stays for the PAT
      product hierarchy (DevTeam etc., real organizations; catalog_dev_team_has_membership and the
      C2 seal_* membership edges are a DIFFERENT governance concept mistakenly sharing the org:
      pattern). Proposes deprecating seal_has_membership / seal_of_role / seal_held_by (currently
      status: active — NOT flipped here; see their proposed_deprecation notes in
      relationship_vocabulary.yaml). seal_has_port is KEPT (dprod:Port structural edge, unrelated
      to this reshape).
    open_questions:
      - "Confirm the 6 TOM roles are exhaustive/stable, or if the SME wants the skos:Concept scheme open-ended for future roles."
      - "Confirm whether the simple wasAttributedTo edge (role=tom_role_holder) is written alongside the qualified form on every load, or only the qualified form (simple form omitted) — affects loader design once this is confirmed."

  - id: seal-doc-source-of-record
