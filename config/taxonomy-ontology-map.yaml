  - id: job-runtime-stats-supplement
    taxonomy:
      source: controlm-psgmgr
      element: "CM_AVG_RUN row supplies avg/median start+run timing for a job (join ctlm_id = folder_id.job_id where present — SME edit 2026-07-14; fallback SCHED_TABLE + JOB_MEM_NAME = JOB_NAME)"
    ontology:
      from_node: ControlMJob                    # prov:Activity — properties land here
      to_node: ~                                # no target node — property supplement, not an edge
      prov_type_from: Activity
      prov_type_to: "n/a (no edge)"
      matrix_row: "no matrix row — node-property supplement (opt-in supplement pattern)"
      neo4j_label: ~
      property_targets:
        - "ControlMJob.avg_start_time (normalized from the >24h clock; + start_next_day flag)"
        - "ControlMJob.avg_run_time / min_run_time / max_run_time / run_time_std_dev (seconds)"
        - "ControlMJob.dow_median_start_time / dow_median_run_time (derived in Python from SAMPLES_*)"
        - "ControlMFolder.window_start / window_end (derived folder rollup — min job start .. max job end; the maintenance-window primitive)"
      prov_maps_to: ~
    precedence_authority: bmc-baseline
    vocab_id: ~                             # deliberately none — property supplement, no edge terms
    status: confirmed
    confirmed_by: chad.wilson
    confirmed_on: 2026-07-14                # gate SIGNED OFF, 1 SME edit (§B ctlm_id join upgrade)
