    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:qualifiedAttribution, prov:agent, prov:hadRole)", "SKOS (skos:Concept, skos:inScheme)", "W3C ORG (org:reportsTo — cited for the deferred cross-family reporting edges, gate section D)"]
    capture: config/taxonomy/lob-product-team.yaml
    vocab_id: [catalog_cabinet_qualified_attribution, seal_attribution_has_agent, catalog_cabinet_attribution_had_role, catalog_cabinet_attributed_to]   # entry-level C7 field; mirrors ontology.qualified_form.vocab_id + the collapsed form
    status: confirmed
    proposed_at: 2026-07-19
    confirmed_by: chad.wilson   # SME, in-session chat gate — §F sign-off
    confirmed_on: 2026-07-20    # gate product-cabinet-attribution signed off (config/gate-log.md)
    gate_spec: config/gate-prompts/product-cabinet-attribution.yaml
    note: >
