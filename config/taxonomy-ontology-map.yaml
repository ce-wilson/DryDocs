      source: "seal:app-extract"
      element: "A BatchProcessing data port requires a scheduler technology (which orchestrator runs its batch)"
    ontology:
      from_node: Port                       # as registered; the pre-gate HOIST direction was absorbed by the reg_uses_software landing (that edge is app-level already), so no reshape ever applied
      to_node: SchedulerKind                # RETIRED TARGET — deprecated at C12 (seeds retired in ontology.cypher; the scheduler_kind constraint was then REMOVED 2026-07-23 in the C13 leftover sweep — pre-C13 graphs are wiped and rebuilt from bootstrap, so nothing creates or holds the label). The fact lands on the ACTIVE registry edge (:BusinessApplication)-[:USES_SOFTWARE {source: 'batch-port'}]->(:SoftwareProduct {role: orchestrator}) — reg_uses_software
      prov_type_from: Entity                # dprod port (Entity semantics)
      prov_type_to: ~                        # moot — the entry retired before a target class was ever settled
      matrix_row: "n/a — infrastructure/capability placement, no PROV row (same family as SCHEDULED_ON)"
      neo4j_label: REQUIRES_SCHEDULER
      role: ~
      prov_maps_to: ~
    precedence_authority: bmc-baseline
    vocab_id: seal_requires_scheduler
    source_evidence: "README.md:263 + docs/history/LoadPlanV3.md:82,393 (documented as a post-load edge); never wired — the vocab entry stayed planned until its 2026-07-21 deprecation."
    status: rejected                         # SUPERSEDED, not repudiated: C12 platforms-taxonomy gate (SIGNED OFF 2026-07-21 pm, B1; config/gate-log.md) ruled the orchestrator fact lands on reg_uses_software {source: 'batch-port'} — this proposed edge is never loaded; kept for audit (the rejected lifecycle). Loader migration = backlog C14.
    confirmed_by: chad.wilson                # who/when the closure was ruled (the gate sign-off)
    confirmed_on: 2026-07-21
    capture: "waived — retirement closure, no new taxonomy to capture: the orchestrator fact is already captured by config/taxonomy/platforms.yaml seed rows (software_registry_ref) + config/taxonomy/software-registry.yaml"
    gate_spec: config/gate-prompts/platforms-taxonomy.yaml
    provenance_note: "Registered per backlog C6 (2026-07-09) to close the README/LoadPlanV3-vs-vocab drift. Edge meaning ⇒ HITL gate; not auto-decided. CLOSED at C12 (2026-07-21): superseded by reg_uses_software; resolutions below."
    open_questions:                          # ALL CLOSED at C12 (2026-07-21) — kept as the question-by-question audit record
      - "RESOLVED (1) Attach point: the reg_uses_software landing is app-level ((:BusinessApplication)-[:USES_SOFTWARE]->) — the pre-gate HOIST direction is satisfied by the landing edge itself; no :Port reshape ever applied. Batch-only survives as the source value: source: 'batch-port' names the batch port as where the fact comes from."
      - "RESOLVED (2) Target: the ACTIVE registry edge (:BusinessApplication)-[:USES_SOFTWARE {source: 'batch-port'}]->(:SoftwareProduct {role: orchestrator}) — meaning carried by the target's role (SME: role over class; 'Orchestration' = the intended highest classification level; capability node layer NOT adopted; supersedes the C11-capture USES_TOOL/:AisTool retarget — Ais* removed both sides, acronym only in software-registry.yaml#acronyms). Zero new edge or node types."
      - "RESOLVED (3) Null-PROV: B4 confirmed reg_uses_software's existing LOCAL no-PROV Agent→Entity typing covers the migrated fact unchanged (the SCHEDULED_ON null-PROV family) — no weak prov:used / prov:wasInfluencedBy adopted."

  # ---- SEAL ontology reshape — SIGNED OFF 2026-07-10 (K3), APPLIED at K4 ----
  # Gate config/gate-prompts/seal-tom-attribution-reshape.yaml, sign-off in
  # config/gate-log.md (2026-07-10). K4 (2026-07-15) applied the reclass + label
  # normalization (:BusinessApplication), the qualified-attribution loaders, and
  # the membership deprecations. seal-doc-source-of-record stays confirmed-only
  # until drydocs-docmeta ships a Document loader.

  - id: application-as-dataproduct
    taxonomy:
      source: "seal:app-extract"
      element: "BusinessApplication (SEAL-registered) is a data-product/asset record, not a software agent"
    ontology:
      from_node: BusinessApplication               # CURRENT (active): prov:SoftwareAgent — see node_classifications
      to_node: ~                            # node reclassification, not an edge
      current_class: "prov:SoftwareAgent"
      proposed_class: "prov:Entity / dprod:DataProduct"
      prov_type_from: Agent
      proposed_prov_type: Entity
      matrix_row: "n/a — node reclassification, not a matrix edge"
      rationale: >
        :BusinessApplication currently carries three incompatible PROV types on one node: SoftwareAgent
        (node_classifications), dprod:Port children (Entity semantics, seal_has_port — active),
        and org:Membership/org:Role role-holders (Organization semantics,
        seal_has_membership/seal_of_role/seal_held_by — active, C2). A SEAL application is a
        data-product/asset, not an Agent and not an Organization — prov:Entity / dprod:DataProduct
        is the precise fit, and it is also the type prov:hadPrimarySource (Entity -> Entity)
        requires of the source-of-record edge (seal-doc-source-of-record below).
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:Entity)", "DPROD/EKGF (dprod:DataProduct)"]
    vocab_id: ~                             # node reclass, not an edge — see relationship_vocabulary.yaml node_classifications#BusinessApplication (reclass APPLIED)
    capture: config/taxonomy/business-application.yaml
    status: applied
    proposed_at: 2026-07-08
    confirmed_by: SME
    confirmed_on: 2026-07-10                # gate §A + label decision (gate-log)
    applied_on: 2026-07-15                  # K4 clause 1 — reclass + :BusinessApplication label across schema/loaders/tests
    resolved_questions:
      - "K1/K2 job->app edge reshape: DEFERRED by the gate (§F) to a K2 follow-up gate — the standing rider on m3_seal_app_ref / job-seal-app-ref, unchanged by K4."
      - "arch_develops re-check: resolved by gate §E — flipped to (:BusinessApplication)-[:WAS_ATTRIBUTED_TO {role: developed_by}]->(:DevTeam) at K4 clause 5."

  - id: seal-tom-attribution
    taxonomy:
      source: "seal:app-extract"
      element: "SEAL Technical Operating Model (TOM) role-holders (gate §B revised fixed 7: application_owner, primary_information_owner, backup_information_owner, cto, technology_risk_controls, design_authority, operate_manager L1/L2) attributed to the BusinessApplication asset"
    ontology:
      from_node: BusinessApplication                # PROPOSED class: prov:Entity / dprod:DataProduct
      to_node: Employee                      # prov:Agent
      prov_type_from: Entity                 # after the proposed reclass
      prov_type_to: Agent
      matrix_row: "Entity -> Agent = prov:wasAttributedTo (simple form)"
      neo4j_label: WAS_ATTRIBUTED_TO
      role: tom_role_holder
      prov_maps_to: "prov:wasAttributedTo"
      qualified_form:
        pattern: "BusinessApplication -[:QUALIFIED_ATTRIBUTION]-> (:Attribution) -[:HAS_AGENT]-> Employee ; (:Attribution) -[:HAD_ROLE]-> TOMRole"
        prov_maps_to: ["prov:qualifiedAttribution", "prov:agent", "prov:hadRole"]
        role_vocabulary: "TOMRole (skos:Concept) — the gate §B REVISED fixed 7 in scheme tom_roles: application_owner, primary_information_owner, backup_information_owner, cto (shared with the K5 ProductRole scheme), technology_risk_controls, design_authority, operate_manager (L1/L2 = level property on the Attribution). DISTINCT from :Role (org:Role, PAT hierarchy only)."
      vocab_id: [seal_qualified_attribution, seal_attribution_has_agent, seal_attribution_had_role]   # seal_app_attributed_to_employee stays planned (simple form optional/derivable, gate §B)
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:wasAttributedTo, prov:qualifiedAttribution, prov:agent, prov:hadRole)", "SKOS (skos:Concept)"]
    capture: >
      waived — the role vocabulary is the tom_roles SkosConceptScheme seeded by
      drydocs_core/schema/seal_ontology_supplement.cypher; its source taxonomy is the gate §B
      fixed set (config/gate-log.md 2026-07-10), not a config/taxonomy/ capture file.
    status: applied
    depends_on: application-as-dataproduct
    proposed_at: 2026-07-08
    confirmed_by: SME
    confirmed_on: 2026-07-10                # gate §B (role model REVISED into two families) + §C
    applied_on: 2026-07-15                  # K4 clauses 2+3+6 — scheme/supplement active; loaders seal_applications.cypher + seal_contacts.cypher write the qualified form
    note: >
      Replaces org:Membership/org:Role for SEAL's TOM role-holders ONLY — org: stays for the PAT
      product hierarchy (DevTeam etc., real organizations; catalog_dev_team_has_membership is a
      DIFFERENT governance concept sharing the org: pattern). seal_has_membership / seal_of_role /
      seal_held_by DEPRECATED at K4 clause 3 (deprecated_at 2026-07-15). seal_has_port KEPT
      (dprod:Port structural edge, unrelated). Contact roles outside the fixed 7 load with
      unmapped_role=true + role_source_name preserved — surfaced, never guessed (loader comment).
    resolved_questions:
      - "Role set: gate §B fixed the REVISED 7 (subsumes the old flat 6; Design Authority new); the scheme is fixed, not open-ended — new roles need a new gate."
      - "Simple vs qualified form: only the QUALIFIED form is loaded (multi-person roles require it); the simple wasAttributedTo stays optional/derivable — seal_app_attributed_to_employee remains status: planned."

  - id: seal-doc-source-of-record
    taxonomy:
      source: seal-pat-scrape           # future drydocs-docmeta component source id — NOT yet registered in config/source-registry.yaml
      element: "SEAL/PAT scraped documentation page is the source of record for an extracted Application fact/record"
    ontology:
      from_node: BusinessApplication                # PROPOSED class: prov:Entity / dprod:DataProduct
      to_node: Document                      # prov:Entity — scraped SEAL/PAT page (drydocs-docmeta, planned)
      prov_type_from: Entity
      prov_type_to: Entity
      matrix_row: "Entity -> Entity = prov:wasDerivedFrom family (prov:hadPrimarySource is a sub-property)"
      neo4j_label: HAD_PRIMARY_SOURCE
      prov_maps_to: "prov:hadPrimarySource"
      vocab_id: seal_had_primary_source
    precedence_authority: lob-product-team    # SEAL/PAT precedence wired into the live chain at K4 clause 7 — see config/precedence.yaml
    standards_cited: ["PROV-O (prov:hadPrimarySource, sub-property of prov:wasDerivedFrom)"]
    capture: >
      waived — the source (seal-pat-scrape) is not yet registered in config/source-registry.yaml;
      registration + capture arrive with the drydocs-docmeta component gate.
    status: confirmed                       # gate §D CONFIRMED; applied waits on the docmeta Document loader (applied = a loader wrote the graph)
    depends_on: application-as-dataproduct
    proposed_at: 2026-07-08
    confirmed_by: SME
    confirmed_on: 2026-07-10                # §D also promoted drydocs-docmeta from parked to REQUIRED
    source_of_record_mechanism: >
      Two linked mechanisms, both proposed: (1) register SEAL/PAT as the authoritative
      precedence source for internal product/business identity in config/precedence.yaml (a
      documented proposed_additions entry, NOT wired into the live order:/active: chain — see
      that file); (2) every fact/record extracted from a scraped page carries this
      hadPrimarySource edge back to the Document it was extracted from. Trust axis
      (VERBATIM/GROUNDED/SYNTHESIZED) and classification (Internal-Public / Internal) are
      carried on the Document/Chunk nodes themselves, per
      knowledge/upgrade-plans/docmeta-component.md — out of scope for this entry.
    open_questions:
      - "The drydocs-docmeta component (Document/Chunk nodes, scraper, loader) does not exist yet — this mapping type-checks against the PROPOSED node_classifications entries only (Application reclass + the new Document classification); it cannot be loaded until docmeta itself is built and separately gated."
      - "Does every extracted Application fact get its own hadPrimarySource edge (fact-level granularity), or one edge per Application node against its primary source page (node-level granularity)? Affects loader design once docmeta lands."

  # ---- K5: Product Cabinet attribution model (CONFIRMED — gate signed off 2026-07-20) ----
