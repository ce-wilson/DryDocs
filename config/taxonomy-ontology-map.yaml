      source: seal-pat-scrape           # future drydocs-docmeta component source id — NOT yet registered in config/source-registry.yaml
      element: "SEAL/PAT scraped documentation page is the source of record for an extracted Application fact/record"
    ontology:
      from_node: BusinessApplication                # PROPOSED class: prov:Entity / dprod:DataProduct
      to_node: Document                      # prov:Entity — scraped SEAL/PAT page (drydocs-docmeta, planned)
      prov_type_from: Entity
      prov_type_to: Entity
      matrix_row: "Entity -> Entity = prov:wasDerivedFrom family (prov:hadPrimarySource is a sub-property)"
      neo4j_label: HAD_PRIMARY_SOURCE
