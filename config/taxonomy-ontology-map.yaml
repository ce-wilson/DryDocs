# =============================================================================
# config/taxonomy-ontology-map.yaml — the HITL-confirmed bridge.
#
# THE central artifact of the configuration layer. Each entry says:
#   "this imported TAXONOMY element  →  apply THIS ONTOLOGY rule."
#
# Lifecycle of every entry:
#   proposed   → ontology-mapper drafted it from the PROV matrix
#   confirmed  → SME approved via the guided gate (docs/restructure/03-hitl-sme-flow.md)
#   applied    → a loader has written it to the graph
#   rejected   → SME declined; kept for audit, never loaded
#
# A taxonomy NEVER becomes graph edges until its mapping is `confirmed`.
# This is the fix for the POC drift (relationships that ignored taxonomy/ontology).
# =============================================================================

schema: drydocs.taxonomy-ontology-map.v1
updated: 2026-06-20

mappings:

  # ---- Example: a confirmed orchestration mapping (already live) -----------
  - id: job-contains
    taxonomy:
      source: controlm-psgmgr
      element: "Folder contains Job"      # raw classification from the import
    ontology:
      from_node: JobFolder                 # prov:Collection
      to_node: ControlMJob                 # prov:Activity
      prov_type_from: Collection
      prov_type_to: Activity
      matrix_row: "Collection → any = prov:hadMember"
      neo4j_label: CONTAINS_JOB            # domain alias mapping to hadMember
      prov_maps_to: "prov:hadMember"
    precedence_authority: bmc-baseline
    status: applied
    confirmed_by: "(seed)"
    confirmed_on: 2026-06-09

  # ---- C1: Control-M edges (reuse ACTIVE vocabulary terms — batch-confirm) --
  # Source taxonomy: config/taxonomy/controlm.yaml. Each reuses an existing
  # `status: active` entry in relationship_vocabulary.yaml (the mature M3 model),
  # so the matrix row + node classifications are already confirmed — no new terms.

  - id: folder-scheduled-on
    taxonomy:
      source: controlm-psgmgr
      element: "Folder is scheduled on a Control-M server (data center)"
    ontology:
      from_node: JobFolder                 # prov:Collection
      to_node: ControlMServer              # local Platform — NOT an Agent
      prov_type_from: Collection
      prov_type_to: "n/a (infrastructure)"
      matrix_row: "no PROV row — infrastructure placement"
      neo4j_label: SCHEDULED_ON
      prov_maps_to: ~                       # null on purpose: ControlMServer is not an Agent
    precedence_authority: bmc-baseline
    reuses_vocab: m3_scheduled_on (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: job-requires-in-condition
    taxonomy:
      source: controlm-psgmgr
      element: "Job requires a named IN condition before it runs"
    ontology:
      from_node: ControlMJob               # prov:Activity
      to_node: Condition                   # prov:Entity
      prov_type_from: Activity
      prov_type_to: Entity
      matrix_row: "Activity → Entity = prov:used"
      neo4j_label: REQUIRES_IN_CONDITION   # domain alias mapping to prov:used
      prov_maps_to: "prov:used"
    precedence_authority: bmc-baseline
    reuses_vocab: m3_requires_in_condition (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: job-emits-out-condition
    taxonomy:
      source: controlm-psgmgr
      element: "Job emits a named OUT condition on completion (SIGN +/-)"
    ontology:
      from_node: ControlMJob               # prov:Activity
      to_node: Condition                   # prov:Entity
      prov_type_from: Activity
      prov_type_to: Entity
      matrix_row: "Activity → Entity = prov:generated"
      neo4j_label: EMITS_OUT_CONDITION     # domain alias mapping to prov:generated
      prov_maps_to: "prov:generated"
    precedence_authority: bmc-baseline
    reuses_vocab: m3_emits_out_condition (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: job-was-informed-by
    taxonomy:
      source: controlm-psgmgr
      element: "Successor job depends on predecessor via shared OUT→IN condition (derived)"
    ontology:
      from_node: ControlMJob               # prov:Activity (successor)
      to_node: ControlMJob                 # prov:Activity (predecessor)
      prov_type_from: Activity
      prov_type_to: Activity
      matrix_row: "Activity → Activity = prov:wasInformedBy"
      neo4j_label: WAS_INFORMED_BY         # replaces the retired DEPENDS_ON
      prov_maps_to: "prov:wasInformedBy"
    precedence_authority: bmc-baseline
    reuses_vocab: m3_was_informed_by (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  # ---- Example: a PROPOSED mapping awaiting the SME gate -------------------
  - id: oracle-schema-asset
    taxonomy:
      source: oracle-schemas
      element: "Schema contains Table (script reads/writes Table)"
    ontology:
      from_node: ControlMJob               # or Script (prov:Entity/Plan)
      to_node: DataAsset                   # prov:Entity (dcat:Dataset)
      prov_type_from: Activity
      prov_type_to: Entity
      matrix_row: "Activity → Entity = prov:used / prov:generated"
      neo4j_label: USED                    # GENERATED for outputs
      prov_maps_to: "prov:used"
    precedence_authority: internal-standards   # naming normalized by knowledge/standards
    status: proposed                       # <-- SME must confirm before load
    open_questions:
      - "Is the script the Activity, or the ControlMJob? (affects from_node)"
      - "Real schema/table names are confidential → resolve in internal/, not here."

  # ---- Example: a PROPOSED context-graph (SOSA/SSN) mapping ----------------
  - id: jobrun-observation
    taxonomy:
      source: controlm-psgmgr
      element: "Job execution produced a run with a status at a time"
    ontology:
      from_node: ControlMJobRun            # planned execution node
      to_node: ControlMJob                 # the feature of interest
      pattern: "SOSA observation"
      sosa_mapping:
        feature_of_interest: ControlMJob
        observed_property: "run-status | run-duration | freshness"
        result_time: "resultTime"
      neo4j_label: OBSERVES                 # now registered: sosa_observes (status planned)
      sosa_maps_to: "sosa:hasFeatureOfInterest"
      prov_maps_to: ~                       # SOSA, not PROV — record separately
    precedence_authority: bmc-baseline
    adoption: experimental                  # SOSA/SSN is W3C but NOT a declared company standard
    status: proposed
    resolved:
      - "sosa:* terms now registered in relationship_vocabulary.yaml + sosa_experimental_supplement.cypher (sosa_observes/has_result/made_by_sensor/observed_property), all status planned / adoption experimental."
    open_questions:
      - "Source of run history: Control-M history API vs psgmgr? (gates the loader)"
      - "Is ControlMJobRun itself the sosa:Observation, or a separate Observation node observing it? (modelling choice — confirm at gate before E2 loader)"

  # ---- C2: BusinessApplication / SEAL edges (reuse ACTIVE vocab — batch) ----
  # Source taxonomy: config/taxonomy/business-application.yaml. Concept =
  # BusinessApplication (graph label :Application); SEAL = source of record; key = SEALID.
  # All reuse active seal_* vocabulary terms (DPROD + W3C ORG).

  - id: app-has-port
    taxonomy: { source: seal-extract, element: "BusinessApplication exposes a data Port (Event/Batch)" }
    ontology:
      from_node: BusinessApplication       # prov:SoftwareAgent (label :Application)
      to_node: Port                         # dprod:Port (prov:Entity)
      matrix_row: "structural dprod relationship (no PROV row)"
      neo4j_label: HAS_PORT
      prov_maps_to: ~                        # dprod:hasPort pattern, not PROV
    precedence_authority: lob-product-team
    reuses_vocab: seal_has_port (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: app-has-membership
    taxonomy: { source: seal-extract, element: "BusinessApplication has a role-holder membership" }
    ontology:
      from_node: BusinessApplication
      to_node: Membership                   # org:Membership (n-ary)
      matrix_row: "org:hasMembership (no PROV row)"
      neo4j_label: HAS_MEMBERSHIP
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: seal_has_membership (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: membership-of-role
    taxonomy: { source: seal-extract, element: "Membership is for a named Role" }
    ontology:
      from_node: Membership
      to_node: Role                          # org:Role
      matrix_row: "org:role (no PROV row)"
      neo4j_label: OF_ROLE
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: seal_of_role (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: membership-held-by
    taxonomy: { source: seal-extract, element: "Membership is held by an Employee (by SID)" }
    ontology:
      from_node: Membership
      to_node: Employee                      # prov:Agent; referenced by SID
      matrix_row: "inverse org:member (no PROV row)"
      neo4j_label: HELD_BY
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: seal_held_by (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  # ---- C3: LOB→Product→Team edges (reuse ACTIVE vocab — batch) --------------
  # Source taxonomy: config/taxonomy/lob-product-team.yaml.

  - id: lob-has-product-line
    taxonomy: { source: catalog-pat, element: "LOB contains ProductLine" }
    ontology:
      from_node: CatalogLOB
      to_node: ProductLine
      matrix_row: "local catalog hierarchy (no PROV row)"
      neo4j_label: HAS_PRODUCT_LINE
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: catalog_has_product_line (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: product-line-has-product
    taxonomy: { source: catalog-pat, element: "ProductLine contains Product" }
    ontology:
      from_node: ProductLine
      to_node: Product
      matrix_row: "local catalog hierarchy (no PROV row)"
      neo4j_label: HAS_PRODUCT
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: catalog_has_product (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: product-has-dev-team
    taxonomy: { source: catalog-pat, element: "Product has owning DevTeam" }
    ontology:
      from_node: Product
      to_node: DevTeam
      matrix_row: "local organizational linkage (no PROV row)"
      neo4j_label: HAS_DEV_TEAM
      prov_maps_to: ~
    precedence_authority: lob-product-team
    reuses_vocab: catalog_has_dev_team (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  - id: lob-reconciles-to-segment
    taxonomy: { source: catalog-pat, element: "LOB reconciles to a corporate BusinessSegment (confidence)" }
    ontology:
      from_node: CatalogLOB
      to_node: BusinessSegment
      matrix_row: "skos:closeMatch (approximate; no PROV row)"
      neo4j_label: RECONCILES_TO
      prov_maps_to: ~                        # carries confidence 0.0–1.0; not 1:1 (AWMCIB=0.5)
    precedence_authority: lob-product-team
    reuses_vocab: catalog_reconciles_to (active)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21

  # ---- C3 DECISION: resolve the SUPPORTS range ambiguity -------------------
  # NOT in the current sample (no AreaProduct / SUPPORTS rows), but the vocabulary has
  # SUPPORTS with range "Product OR AreaProduct" (free-text union) — consolidated-plan E.2.
  - id: dev-team-supports
    taxonomy: { source: catalog-pat, element: "DevTeam is aligned to / supports an AreaProduct (team_type, sponsored)" }
    ontology:
      from_node: DevTeam                     # org:OrganizationalUnit (Agent)
      to_node: AreaProduct                   # RESOLVED: range = AreaProduct (Team-of-Teams)
      matrix_row: "Agent → Entity — no PROV row; local"
      neo4j_label: SUPPORTS
      prov_maps_to: ~
      edge_properties: { team_type: "aligned | flex | dedicated", sponsored: bool }   # 'aligned to' = team_type aligned
    precedence_authority: lob-product-team
    reuses_vocab: catalog_supports_area_product (planned -> set active in C4)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21
    decision_resolved: >
      SME 2026-06-21: SUPPORTS targets AreaProduct (not Product). Product is reached via the
      hierarchy (Product ▸ AreaProduct ▸ DevTeam), so a DevTeam→Product SUPPORTS edge is dropped
      in favor of DevTeam→AreaProduct. "aligned to" is captured by team_type=aligned on the edge.
      C4: set catalog_supports_area_product active; deprecate catalog_supports (DevTeam→Product).

  - id: dev-team-develops-app
    taxonomy: { source: catalog-pat, element: "DevTeam develops a BusinessApplication (joined by SEALID)" }
    ontology:
      from_node: DevTeam                     # org:OrganizationalUnit (Agent)
      to_node: BusinessApplication           # prov:SoftwareAgent (label :Application); key = SEALID
      join_key: SEALID                        # reconcile catalog DevTeam <-> SEAL app by SEALID
      matrix_row: "Agent → Agent — no PROV fit (actedOnBehalfOf = delegation, not development); local"
      neo4j_label: DEVELOPS
      prov_maps_to: ~                          # alt inverse: Application WAS_ATTRIBUTED_TO DevTeam (Entity→Agent)
    precedence_authority: lob-product-team
    reuses_vocab: arch_develops (planned -> set active in C4)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21
    note: >
      SME 2026-06-21: DevTeam DEVELOPS BusinessApplication, reconciled by SEALID. Cross-source
      edge (lob-product-team taxonomy -> business-application taxonomy); the join (which team
      builds which app) comes from catalog<->SEAL ownership reconciliation.

# Counts the gate reports to the SME each run.
summary:
  applied: 1          # job-contains
  confirmed: 14       # C1 (4) + C2 (4) + C3 (6: 4 hierarchy + SUPPORTS→AreaProduct + DEVELOPS→app)
  proposed: 2         # oracle-schema-asset, jobrun-observation
  rejected: 0
