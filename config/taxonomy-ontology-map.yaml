  - id: product-cabinet-attribution
    taxonomy:
      source: catalog-pat
      element: "Product Cabinet role-holders (Area Product Owner, Product Owner, Product Architect, Tech Partner, Data Owner, Data Certifier, Analytics Lead — exactly the fixed 7; NO shared cto, per the 2026-07-20 in-session SME answers) attributed to the Product / AreaProduct PAT hierarchy nodes (2026-07-10 gate §B split, backlog K5)"
    ontology:
      from_node: "Product | AreaProduct"    # dd:Product / dd:AreaProduct (local catalog hierarchy; prov:Entity)
      to_node: Employee                     # prov:Agent
      prov_type_from: Entity
      prov_type_to: Agent
      matrix_row: "Entity -> Agent = prov:wasAttributedTo (BOTH forms — the qualified/reified chain AND the simple collapsed WAS_ATTRIBUTED_TO edge; gate section C open question DECIDED 2026-07-20 by the SME in-session, deviating from the K4 qualified-only resolution)"
      qualified_form:
        pattern: "(Product|AreaProduct) -[:QUALIFIED_ATTRIBUTION]-> (:Attribution) -[:HAS_AGENT]-> Employee ; (:Attribution) -[:HAD_ROLE]-> ProductRole"
        prov_maps_to: ["prov:qualifiedAttribution", "prov:agent", "prov:hadRole"]
        role_vocabulary: "ProductRole (skos:Concept) — EXACTLY the fixed 7 in scheme product_roles: area_product_owner, product_owner, product_architect, tech_partner, data_owner, data_certifier, analytics_lead. Scheme FIXED (the tom_roles precedent — new roles require a new gate) and NO cto member: the families are independent (SME 2026-07-20; rename history as a skos:changeNote on tech_partner — formerly named 'CTO' in SEAL, whose CTO now denotes the product-level role). Scope: :Product / :AreaProduct only, never :BusinessApplication; area_product_owner AND tech_partner attach ONLY to :AreaProduct. DISTINCT from :Role (org:Role, PAT hierarchy membership) and from :TOMRole — no shared concepts."
