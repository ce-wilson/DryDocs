  # ---- C3 DECISION: resolve the SUPPORTS range ambiguity -------------------
  # NOT in the current sample (no AreaProduct / SUPPORTS rows), but the vocabulary has
  # SUPPORTS with range "Product OR AreaProduct" (free-text union) — consolidated-plan E.2.
  - id: dev-team-supports
    taxonomy: { source: catalog-pat, element: "DevTeam is aligned to / supports an AreaProduct (team_type, sponsored)" }
    ontology:
      from_node: DevTeam                     # org:OrganizationalUnit (Agent)
      to_node: AreaProduct                   # RESOLVED: range = AreaProduct (Team-of-Teams)
      matrix_row: "Agent → Entity — no PROV row; local"
      neo4j_label: SUPPORTS
      prov_maps_to: ~
      edge_properties: { team_type: "aligned | flex | dedicated", sponsored: bool }   # 'aligned to' = team_type aligned
    precedence_authority: lob-product-team
    reuses_vocab: catalog_supports_area_product (planned -> set active in C4)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21
    decision_resolved: >
      SME 2026-06-21: SUPPORTS targets AreaProduct (not Product). Product is reached via the
      hierarchy (Product ▸ AreaProduct ▸ DevTeam), so a DevTeam→Product SUPPORTS edge is dropped
      in favor of DevTeam→AreaProduct. "aligned to" is captured by team_type=aligned on the edge.
      C4: set catalog_supports_area_product active; deprecate catalog_supports (DevTeam→Product).

  - id: dev-team-develops-app
    taxonomy: { source: catalog-pat, element: "DevTeam develops a BusinessApplication (joined by SEALID)" }
    ontology:
      from_node: DevTeam                     # org:OrganizationalUnit (Agent)
      to_node: BusinessApplication           # prov:SoftwareAgent (label :Application); key = SEALID
      join_key: SEALID                        # reconcile catalog DevTeam <-> SEAL app by SEALID
      matrix_row: "Agent → Agent — no PROV fit (actedOnBehalfOf = delegation, not development); local"
      neo4j_label: DEVELOPS
      prov_maps_to: ~                          # alt inverse: Application WAS_ATTRIBUTED_TO DevTeam (Entity→Agent)
    precedence_authority: lob-product-team
    reuses_vocab: arch_develops (planned -> set active in C4)
    status: confirmed
    confirmed_by: SME
    confirmed_on: 2026-06-21
    note: >
      SME 2026-06-21: DevTeam DEVELOPS BusinessApplication, reconciled by SEALID. Cross-source
      edge (lob-product-team taxonomy -> business-application taxonomy); the join (which team
      builds which app) comes from catalog<->SEAL ownership reconciliation.

