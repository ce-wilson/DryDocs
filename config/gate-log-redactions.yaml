# =============================================================================
# config/gate-log-redactions.yaml — publish-boundary redactions of signed gate-log text
# =============================================================================
# The reconcile guard for config/gate-log.md is append-only by line: every pre-merge
# line must survive, in order. A publish-boundary redaction (CLAUDE.md section 3) is
# the ONE legitimate in-place edit of a signed record — a company-internal name has
# to leave the tracked text, and a postscript cannot remove anything — so each one is
# DECLARED here and the guard lists it as ruled instead of failing on it. A declared
# replacement that is no longer in the live file is STALE and fails the guard.
#
# Ruled by the SME 2026-09-08 (RELAY-47). Reader: drydocs/port/gate_log_redactions.py.
# One row per redacted line. `replacement` is the line AS IT NOW READS, exactly
# (leading spaces included); the removed text is never quoted here — quoting it
# would put the name back. `reason` is `publish-boundary` only: anything else is a
# rider under the record (L25), never an edit of it.
#
# Canonical-producer (PORT-MANIFEST.yaml): a redaction is a producer ruling about
# producer text, and the consumer's guard reads this same file.
#
# EACH ROW DECLARES WHOSE ACT IT WAS (`side:`, PORT11, 2026-09-10), and the stale
# rule above is scoped to that side. A publish-boundary redaction is a PRODUCER-venue
# action, because the producer is the side that publishes; company-side there is no
# publish boundary, and the redacted string is a company-internal name in a private
# repo, which is the venue entitled to hold it. So a consumer keeping the true name is
# not out of date - the row describes an edit that side did not make and should not
# make - and only the OWNING side's declaration can go stale. On that side the check
# is exactly as strict as it was before this field existed, which is the clause that
# makes the registry safe to have.
# The vocabulary is closed (`producer`, `company`) and an undeclared value is refused:
# a redaction whose owner is a guess has a stale check that is a guess.
# WHICH SIDE A CHECKOUT IS runs on `side:` in config/dev-environment.yaml - declared,
# never inferred, in the file already ruled canonical-company so each side answers for
# itself. A checkout that has not answered is NOT CHECKED, never assumed producer.
# Owed to the company by name at the close of port-base-20260908.
schema: drydocs.gate-log-redactions.v1
classification: Internal-Public
