# =============================================================================
# config/taxonomy/lob-product-team.yaml  —  org taxonomy (B3)
#
# PURE CLASSIFICATION ONLY: CatalogLOB ▸ ProductLine ▸ Product ▸ DevTeam.
# No meaning edges — RECONCILES_TO (LOB→segment), SUPPORTS, ownership are ontology (C3).
#
# Built from the SYNTHETIC sample (publishable shape). SOURCE (catalog-pat) is
# Internal (confidential material): real team names/rosters are NOT authoritative here — keyed by id;
# production confidential values live in internal/. Captured 2026-06-20.
#
# This is the lowest precedence authority for object *meaning* but the SOLE authority for
# *ownership/business context* (config/precedence.yaml: lob-product-team).
# =============================================================================

taxonomy: lob-product-team
domain: business
taxonomy_path_root: business/lob
source: pat                        # config/source-registry.yaml v2 SYSTEM id (the capture spans both PAT datasets: pat:product-catalog + pat:people-report)
authority: lob-product-team
classification: Internal               # confidential handling: real rosters (J23 collapse)
classification_only: true

nodes:

  # CatalogLOB — top of the org hierarchy. reconciles_to_segment is a meaning edge (deferred).
  lobs:
    - { id: LOB001, code: CCB,    name: Consumer & Community Banking, reconciles_to_segment: CCB, confidence: 1.0 }
    - { id: LOB002, code: AWM,    name: Asset & Wealth Management,      reconciles_to_segment: AWM, confidence: 1.0 }   # C26 2026-08-21: was AWMCIB @0.5 (legacy combined code); the company catalog page shows AWM and CIB as SEPARATE LoBs, each an exact match
    - { id: LOB006, code: CIB,    name: Commercial & Investment Bank,   reconciles_to_segment: CIB, confidence: 1.0 }   # C26 2026-08-21: the other half of the former AWMCIB row
    - { id: LOB003, code: CT,     name: Corporate Technology, reconciles_to_segment: Corp, confidence: 1.0 }
    - { id: LOB004, code: HR,     name: Human Resources (Other Corporate), reconciles_to_segment: Corp, confidence: 1.0 }
    - { id: LOB005, code: ET,     name: Enterprise Technology, reconciles_to_segment: Corp, confidence: 1.0 }

  # ProductLine — child of a LOB.
  product_lines:
    - { id: PL_AUTO, name: Auto,                parent_lob: LOB001 }
    - { id: PL_HL,   name: Home Lending,        parent_lob: LOB001 }
    - { id: PL_CARD, name: Card,                parent_lob: LOB001 }
    - { id: PL_RISK, name: Risk Published Data, parent_lob: LOB001 }
    - { id: PL_DAT,  name: Data & Analytics,    parent_lob: LOB001 }

  # Product — child of a ProductLine.
  products:
    - { id: PROD_AUTO_05, name: Auto Risk,              parent_product_line: PL_AUTO }
    - { id: PROD_AUTO_07, name: Auto Onboarding,        parent_product_line: PL_AUTO }
    - { id: PROD_HL_12,   name: Home Lending Servicing, parent_product_line: PL_HL }
    - { id: PROD_CARD_03, name: Card Risk,              parent_product_line: PL_CARD }
    - { id: PROD_DAT_01,  name: Account Core,           parent_product_line: PL_DAT }
    - { id: PROD_RISK_01, name: Risk Published Data,    parent_product_line: PL_RISK }

  # DevTeam — child of a Product (+ jira board). Names synthetic; real rosters -> internal/.
  dev_teams:
    - { id: T0042, name: CCB Auto Risk Pod,           jira_board: JIRA-AUTO,      parent_product: PROD_AUTO_05 }
    - { id: T0099, name: CCB Auto Onboarding,         jira_board: JIRA-ONBOARD,   parent_product: PROD_AUTO_07 }
    - { id: T0100, name: CCB Card Risk,               jira_board: JIRA-CARDRISK,  parent_product: PROD_CARD_03 }
    - { id: T0117, name: CCB Home Lending Servicing,  jira_board: JIRA-HLSERVICE, parent_product: PROD_HL_12 }
    - { id: T0250, name: DAT Account Core,            jira_board: JIRA-DAT-AC,    parent_product: PROD_DAT_01 }
    - { id: T0299, name: Risk Published Data,         jira_board: JIRA-RPD,       parent_product: PROD_RISK_01 }

counts:
  lobs: 5
  product_lines: 5      # all under LOB001 (CCB) in this sample
  products: 6
  dev_teams: 6
  area_products: 0      # not in sample (see OQ)

open_questions:
  - id: area-product-missing
    note: >
      The ontology has Product ▸ AreaProduct ▸ DevTeam, but this sample is Product ▸ DevTeam
      direct (no AreaProduct rows). SME: confirm whether the AreaProduct (Team-of-Teams) layer
      applies here or only in production PAT data.
      C34 (2026-08-20): the dcat-theme gate's §D1 DEFERS a cardinality cap on this tier until
      it is ruled — rule the tier, and the cap (config/gate-prompts/dcat-theme-subject-scheme.yaml)
      follows.
  - id: business-segment
    note: >
      reconciles_to_segment (CCB/AWM/Corp) references BusinessSegment with a confidence, but no
      segment nodes are sampled. RECONCILES_TO is a meaning edge (skos:closeMatch) -> ontology (C3).
      The former LOB002 AWMCIB row (confidence 0.5, "splits across segments") was split at
      C26 (2026-08-21) into LOB002 AWM and LOB006 CIB, both 1.0 -- the company catalog gate
      page lists them as separate LoBs with exact matches. Taxonomy capture fix; reversible.
  - id: confidential-rosters
    note: "Team names here are synthetic. Production rosters/people are confidential -> internal/."

# -----------------------------------------------------------------------------
# SKOS concept scheme (C34 (a), 2026-08-20 — taxonomy, layer 1, no gate).
# The tree above IS a concept scheme in all but name: classification_only, id-keyed,
# labelled, hierarchical via parent_lob / parent_product_line / parent_product. This
# block declares that, so dcat:theme has something standards-valid to point at. It
# adds NO edge and NO meaning — skos:broader is the parent link the rows already
# carry, read as a SKOS relation; whether a Product IS a skos:Concept or HAS one, how
# deep a subject is annotated, and the annotation cap are the GATE's
# (config/gate-prompts/dcat-theme-subject-scheme.yaml). SKOS is already precedent
# in this file (RECONCILES_TO is skos:closeMatch, open question business-segment)
# and in the vocabulary (10-node-classifications.yaml: skos:Concept classes).
# Standard cited VERBATIM: the firm's Taxonomy Framework in the fcdo-frameworks
# corpus (config/doc-source-registry.yaml, trust VERBATIM since 2026-08-19) — cite
# the registry row, never the page.
# -----------------------------------------------------------------------------
concept_scheme:
  rdf_type: skos:ConceptScheme
  uri: urn:drydocs:scheme:lob-product-team      # the stable join key — portable whichever
                                                 # residency rules (answered-by-fold, 2026-08-18)
  pref_label: "Line of business / product line / product"
  notation_from: code                            # skos:notation = `code` where present, else `id`
  top_concepts: lobs                             # skos:hasTopConcept = every row under nodes.lobs
  concept_tiers:                                 # every row in these lists is a candidate skos:Concept;
    - { tier: lobs,          broader: ~ }        # tier membership is data, the Concept-vs-HAS question
    - { tier: product_lines, broader: parent_lob }            # is ruled at the gate (§B)
    - { tier: products,      broader: parent_product_line }
  not_concepts: [dev_teams]                      # org:OrganizationalUnit, never a subject
  broader_is: "the parent_* link, read as skos:broader; transitive closure gives LOB from Product for free (§C annotation depth)"
  in_scheme_of: "dcat:theme targets (gate-bound: the edge is the gate's, this declaration is not)"
  standard: fcdo-frameworks                      # doc-source-registry id; Taxonomy Framework, VERBATIM
