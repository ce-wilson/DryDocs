  # --- C25 prerequisite rows (2026-08-09) -----------------------------------
  # Both registered as TAXONOMY CAPTURE: a product row says the product exists,
  # never that any application uses it or at what version, so neither row
  # pre-empts a §C ruling in gate software-version-context.
  - id: snowflake
    vendor: snowflake
    name: Snowflake
    category: DBMS - Cloud Data Platform
    role: data-platform
    type: commercial
    versions: []                  # continuously released; no estate pin known
