# =============================================================================
# config/taxonomy/software-registry.yaml — third-party software registry.
#
# The LEDGER for plan 07 / ADR 0004: Vendor = the brand/company ONLY;
# SoftwareProduct = what a vendor ships, with role absorbing the Tier-1/Tier-2
# split. The graph is the lookup (loader: drydocs/loaders/software_registry.py
# MERGEs :Vendor, :SoftwareProduct, MADE_BY, and DryDocs' own USES_SOFTWARE
# edges); this file is the source of truth.
#
# Field set (SME-gated 2026-07-07): product name, publisher, publisherURL,
# category, version-if-known. Company governance columns (owner SIDs, gspcId,
# sealId, support/EOL dates) are Phase-4 material — internal/-side only, never
# here. Drivers/utilities/etc. (the catalog long tail) stay out by design.
#
# Vendor ids match drydocs-icons/manifest.json where an icon exists.
# Guarded by tests/unit/test_software_registry.py.
# =============================================================================

schema: drydocs.software-registry.v1
classification: Internal-Public
updated: 2026-07-21
adr: docs/decisions/0004-software-registry-vendor-terminology.md

# Historical company acronyms — THE AUTHORITATIVE HOME (SME ruling 2026-07-21
# pm): the 'Ais*' class family (:AisCapability / :AisTool, company 06-29 gate)
# is REMOVED on both sides; the Ais spelling goes away everywhere else. The
# expansion lives on THIS registry because it is the file that carries the
# vendor/publisher URLs — the durable home for "what did that name mean".
# Note 'Streaming' was itself a misnomer: the AIS folder also carried ETL and
# managed file transfer. Company-side status (screenshot channel, 2026-07-21
# pm): their copy is an explicitly PROVISIONAL gloss on the source-registry
# entry for their internal AIS engineering-docs portal (root path
# /docs/ais/{orchestration,etl,file-transfer}/ — corroborates the 3 capability
# areas), with a PORT-MANIFEST canonical-producer row directing "overwrite
# with the producer's authoritative expansion at next cherrypick" — i.e. THIS
# field. CAVEAT for the next port: their gloss sits in source-registry.yaml,
# ours here — the expansion must be carried across files, not same-file
# overwritten (inboxed in IDEAS.md).
acronyms:
  AIS: "Application Integration Streaming"

