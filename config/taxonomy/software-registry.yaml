# =============================================================================
# config/taxonomy/software-registry.yaml — third-party software registry.
#
# The LEDGER for plan 07 / ADR 0004: Vendor = the brand/company ONLY;
# SoftwareProduct = what a vendor ships, with role absorbing the Tier-1/Tier-2
# split. The graph is the lookup (loader: drydocs/loaders/software_registry.py
# MERGEs :Vendor, :SoftwareProduct, MADE_BY, and DryDocs' own USES_SOFTWARE
# edges); this file is the source of truth.
#
# Field set (SME-gated 2026-07-07): product name, publisher, publisherURL,
# category, version-if-known. Company governance columns (owner SIDs, gspcId,
# support/EOL dates) are Phase-4 material — internal/-side only, never here.
# Drivers/utilities/etc. (the catalog long tail) stay out by design.
# AMENDED 2026-08-18 (SME direction): `seal_id` moves INTO the schema as an
# OPTIONAL per-product field — the business-application registration id for the
# deployed instance of the product. THE FIELD is in-schema; real VALUES are not:
# producer-side it carries the `[seal-id]` placeholder (the source-registry
# systems-block convention) and the company copy reconciles it at port time,
# exactly the drydocs_application_id pattern below. It loads as a NODE PROPERTY
# on :SoftwareProduct only — a registration REFERENCE, never attribution (J32),
# and deliberately NOT an edge: USES_SOFTWARE is unchanged, and any future
# :SoftwareProduct -> :BusinessApplication join is an ontology decision through
# the gate (the data-catalog clause-F "property now, org join later" pattern).
# Scan A (test_publish_boundary_values) already covers config/taxonomy/, so a
# real-looking id here fails the boundary guard without a new one.
#
# Vendor ids match drydocs-icons/manifest.json where an icon exists — the SOFT
# LINK for UI rendering (user directive 2026-07-31): by-id convention, with an
# optional per-vendor `icon:` override where the two ids differ (abinitio ->
# ab-initio). scripts/render_software_registry.py joins this file to the icon
# manifest and emits web/src/generated/software-registry.json (+ copies the
# display assets to web/public/vendor-icons/) on every default board render;
# vendors with no icon are REPORTED in the json (vendors_without_icons), never
# silently dropped, and never an error — the link is soft by design.
# Guarded by tests/unit/test_software_registry.py + test_software_registry_json.py.
# =============================================================================

schema: drydocs.software-registry.v1
classification: Internal-Public
updated: 2026-07-21
adr: docs/decisions/0004-software-registry-vendor-terminology.md

# Historical company acronyms — THE AUTHORITATIVE HOME (SME ruling 2026-07-21
# pm): the 'Ais*' class family (:AisCapability / :AisTool, company 06-29 gate)
# is REMOVED on both sides; the Ais spelling goes away everywhere else. The
# expansion lives on THIS registry because it is the file that carries the
# vendor/publisher URLs — the durable home for "what did that name mean".
#
# SHAPE CHANGED 2026-08-27 (O68 clause d), from `TERM: "expansion"` to a mapping
# per term. The reason is the whole point of the item: each entry's why/when
# already existed, but it lived in a YAML COMMENT, and a comment is readable by
# a person and invisible to every tool. The console could therefore render three
# fully-sourced acronyms and a newly-added one indistinguishably. `source` and
# `added` are REQUIRED on every entry and guarded by
# tests/unit/test_software_registry.py::test_acronyms_shape_and_provenance —
# an entry cannot be added without saying where it came from.
#
# `note` is OPTIONAL and carries a caveat the expansion alone would lose.
#
# WHAT STAYS A COMMENT, deliberately: the AIS port caveat, because it is about
# how two REPOSITORIES reconcile rather than about the term. Company-side their
# copy is an explicitly PROVISIONAL gloss on the source-registry entry for their
# internal AIS engineering-docs portal (root path
# /docs/ais/{orchestration,etl,file-transfer}/ — corroborates the 3 capability
# areas), with a PORT-MANIFEST canonical-producer row directing "overwrite with
# the producer's authoritative expansion at next cherrypick" — i.e. THIS field.
# CAVEAT for the next port: their gloss sits in source-registry.yaml, ours here
# — the expansion must be carried across files, not same-file overwritten
# (inboxed in IDEAS.md).
acronyms:
  AIS:
    expansion: "Application Integration Streaming"
    source: "SME ruling 2026-07-21 (pm) — corroborated by the 3 capability areas of the internal AIS engineering-docs portal"
    added: 2026-07-21
    note: >-
      'Streaming' was itself a misnomer: the AIS folder also carried ETL and
      managed file transfer.
  DPL:
    expansion: "Data Pipeline Library"
    source: "SME-supplied 2026-08-09, from the internal DPL documentation site (C25 prerequisite)"
    added: 2026-08-09
    note: >-
      The internal application registration exists and is deliberately NOT
      transcribed — a registration id is Internal (PUBLISH-BOUNDARY.md), and
      drydocs_application_id below already establishes the producer-side
      placeholder pattern the company copy reconciles at port time.
  SNOW:
    expansion: "ServiceNow — the ITSM/CMDB platform. NOT Snowflake."
    source: "SME flag 2026-08-09, marked IMPORTANT"
    added: 2026-08-09
    note: >-
      THE CONFUSION IS CONCRETE, not theoretical: Snowflake can hold ServiceNow
      data, at which point both names describe the same rows. The v2 grammar
      already settles it — `origin` is the SYSTEM OF RECORD and Snowflake is
      then the CARRIER (config/source-registry.yaml, and the retired-id ledger's
      "origin catalog, carrier snowflake"). The `snowflake` PRODUCT row below
      carries the same caveat.

# Reserved Application id for DryDocs itself (no SEAL id producer-side; the
# company copy reconciles this to the real SEAL id at port time).
drydocs_application_id: DRYDOCS-SELF

