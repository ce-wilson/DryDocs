    stack: [backend, web-console]  # the DATABASE is backend; the JS driver
                                   # (neo4j-driver, web/package.json) also ships in
                                   # the console for the ADR 0005 dev-mode bolt
                                   # adapter — one product, two stacks. Registering
                                   # the driver as its OWN product would hit this
                                   # file's "drivers stay out" scope rule.

  - id: neo4j-nvl
    vendor: neo4j
    name: Neo4j Visualization Library
    category: Graph Visualization
    role: tool
    type: commercial
    versions: ["1.2.1"]           # @neo4j-nvl/base + @neo4j-nvl/react
    used_by_drydocs: true
    stack: [web-console]
    # LICENSE: THERE IS NO IDENTIFIER TO RECORD, and that is the record. Both
    # packages declare `"license": "SEE LICENSE IN 'LICENSE.txt'"` — not an SPDX
    # id — and LICENSE.txt is three lines of proprietary terms, quoted here in
    # substance because the constraint is not on copying the code but on WHAT THE
    # CODE MAY TALK TO: NVL "may only be used with (i) the Aura software as a
    # service offering ... or (ii) the proprietary commercial graph database
    # products developed by Neo4j ... subject to the Neo4j Subscription
    # Agreement."
    #
    # O81 step (1) made a license mismatch a stop-and-report, and it fired: the
    # item anticipated recording an identifier, and there is none. REPORTED AND
    # RULED 2026-08-31 (user, in-session): the license is available internally and
    # Aura is available for testing if needed, which satisfies limb (i)/(ii). That
    # reaffirms the 2026-08-27 SME ruling with the actual terms in hand rather
    # than the survey's summary of them.
    #
    # WHAT THIS COSTS, recorded so it is not rediscovered: the condition binds the
    # DEPLOYMENT, so any environment running this console against a Neo4j that is
    # neither Aura nor subscription-licensed is outside the grant. That matters
    # for the standalone-template goal, where an adopter inherits the condition.
    # react-force-graph (MIT, 1.48.2) remains the recorded fallback if that ever
    # becomes the binding constraint.
    license_note: "proprietary — Neo4j, Inc. License Agreement for NVL; no SPDX id declared; usable only with Aura or subscription-licensed Neo4j"

  - id: neo4j-bloom
    vendor: neo4j
    name: Neo4j Bloom
    category: BI - Graph Analytics/Visualization
    role: tool
    type: commercial
    versions: ["2.x"]
    used_by_drydocs: false        # separate catalog product; company-side usage TBD

  - id: controlm
    vendor: bmc
    name: Control-M
    category: Workload Automation
    role: orchestrator
    type: commercial
    versions: ["9.0.21.300"]      # company runtime — known
    used_by_drydocs: true         # the baseline orchestration source we ingest
    stack: [source]               # ingested FROM, not built ON
    # The worked example for the 2026-08-18 seal_id field (header note): the
    # deployed Control-M instance has a company registration; the value here is
    # the placeholder, reconciled company-side at port.
    seal_id: "[seal-id]"
    # Which captured vendor documentation describes this product, and for which
    # RUNTIME versions a human has confirmed it still applies. The point of
    # keeping this beside `versions:` is that the drift is then local and
    # obvious: when the estate moves to a new version, it lands in `versions:`
    # and is absent from `current_for`, which is the signal that the docs need
    # recapturing. `current_for` is an explicit human assertion — never derived
    # by parsing version strings, because "does 9.0.20 documentation still
    # describe 9.0.21.300?" is a judgement, not a string comparison.
    documentation:
      corpus: bmc-docs-controlm-utilities   # -> config/doc-source-registry.yaml id
      docs_version: "9.0.20"           # the VENDOR DOC version captured
      current_for: []                  # EMPTY = unverified. Known drift TODAY: the
                                       # capture is 9.0.20 (BMC ships no Utilities
                                       # book in the trimmed 9.0.21 publication)
                                       # while the runtime is 9.0.21.300.
      # Documentation versions BMC publishes for this product, newest first —
      # transcribed from the site's own version picker and PROBED 2026-07-31.
      # Pre-populated so a version bump is a lookup, not a re-investigation.
      #
      #   access: open       200 to our client; capturable.
      #           forbidden  403 to a plain HTTP client. These are EXACTLY the
      #                      paths documents.bmc.com/robots.txt does not Allow —
      #                      perfect correlation, so it is deliberate vendor
      #                      policy, not a transport fault. They render normally
      #                      in a browser. We do NOT work around it.
      #   enumerable: publishes help/Main_help/en-US/toc.json, which is what
      #           scripts/external_vendor_scrape.py needs to size and bound a
      #           capture. `unknown` where access is forbidden — unprobeable.
      #
      # THE CONSEQUENCE WORTH KNOWING: documentation for the estate's exact
      # runtime (9.0.21.300) EXISTS but is not retrievable programmatically. So
      # "just recapture at the right version" is not currently an option, and
      # the 9.0.20 capture stands as the best enumerable source. Revisit if BMC
      # widens robots.txt or the content moves.
      available_versions:
        - {version: "SaaS",       path: "controlm-saas", access: open,      enumerable: false}
        - {version: "9.0.22",     path: "9.0.22",        access: forbidden, enumerable: unknown}
        - {version: "9.0.21.300", path: "9.0.21.300",    access: forbidden, enumerable: unknown}  # ESTATE RUNTIME
        - {version: "9.0.21.200", path: "9.0.21.200",    access: forbidden, enumerable: unknown}
        - {version: "9.0.21.100", path: "9.0.21.100",    access: forbidden, enumerable: unknown}
        - {version: "9.0.21",     path: "9.0.21",        access: open,      enumerable: true}   # trimmed: no Utilities book
        - {version: "9.0.20",     path: "9.0.20",        access: open,      enumerable: true}   # CAPTURED (bmc-controlm-utilities)
        - {version: "9.0.19",     path: "9.0.19",        access: open,      enumerable: true}

