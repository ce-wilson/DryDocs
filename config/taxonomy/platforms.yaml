# ── The company-confirmed model (2026-06-29 AIS gate; captured 2026-07-21) ───
# PROVENANCE ONLY as of the 2026-07-21 pm SME rulings (kept verbatim; do not
# edit): the Ais* class family recorded below is being REMOVED on both sides.
# AIS = "Application Integration Streaming" (company acronym; 'Streaming' is
# itself a misnomer — the folder also carried ETL + managed file transfer).
# The expansion survives ONLY as the acronyms note in software-registry.yaml
# (the file with the publisher URLs). See reconciliation below for the
# superseding direction.
company_confirmed:
  classes:
    - label: AisCapability
      maps_to: "skos:Concept"
      key: capability_id
      meaning: "The capability AREA — the roll-up level (coarse), NOT a fine-grained scheduling mode."
    - label: AisTool
      maps_to: "prov:SoftwareAgent (swo:Software)"
      key: tool_id
      meaning: >
        The concrete tool/product. Spelled AisTool (with the s), not AiTool.
        Deliberately NOT :Platform — the deployed layer stays :ControlMServer
        (confirms the producer Q3 Option-B direction by built practice).
  capability_vocabulary: [orchestration, etl, file-transfer]   # 3 areas, seeded
  tools:
    count: 7
    public_vendors:                    # publishable (Q5): public products/vendors
      - "Control-M (BMC)"
      - "AutoSys (Broadcom)"
      - "AWS EventBridge Scheduler (AWS)"
      - "Ab Initio"
      - "Informatica"
    internal: "2 internally-built managed-file-transfer tools — names HELD company-side (internal/; the ccb-twin convention). Mechanism note: internal tools EXIST in the taxonomy, refining Q5 — the vocabulary is publishable except internally-built tool values."
    note: "Apache Airflow is NOT in the company tool list — the AWS leg runs EventBridge Scheduler + Glue (the DPL world), so the producer's airflow row below is a crosswalk placeholder (F2), not a company-confirmed tool."
  relationships:
    - label: IN_CAPABILITY
      shape: "(:AisTool)-[:IN_CAPABILITY]->(:AisCapability)"
      maps_to: "skos:broader (no PROV row)"
      seeded: "yes — 7 edges from the tool list"
    - label: USES_TOOL
      shape: "(:BusinessApplication)-[:USES_TOOL]->(:AisTool)"   # company says app-level ('Application'); producer normalized the label to :BusinessApplication at K4
      maps_to: "Agent -> Agent (no PROV row)"
      seeded: "declared only — app->tool edges come from a loader migrating the batch-port orchestrator string via an app-uses-tool map (e.g. 'autosys' -> USES_TOOL -> :AisTool{AutoSys})"
      note: "This IS the REQUIRES_SCHEDULER retarget: one app-level edge, renamed. Matches the producer Q2 direction (ONE edge, hoisted to :BusinessApplication); the rename REQUIRES_SCHEDULER -> USES_TOOL is a gate call."
  scheduler_kind: "DEPRECATED company-side 2026-06-29 (deprecated=true, kept for audit) — superseded by AisCapability{orchestration} + AisTool. Producer still seeds it in ontology.cypher; the deprecation lands with the producer gate."
  unresolved: >
    AisTool <-> software-registry (:SoftwareProduct/:Vendor): company AisTool
    carries only a vendor STRING — no edge to the registry nodes — while
    software-registry.yaml independently models the same tools as
    :SoftwareProduct (role: orchestrator) with :Vendor + MADE_BY and a
    PARALLEL app edge USES_SOFTWARE. Two overlapping "app uses orchestrator"
    models. Open on BOTH sides — this is the real remaining gate question (Q4).

# ── Reconciliation questions (updated at the C11 capture; rulings 2026-07-21 pm) ─
reconciliation:
  target: >
    Retire :SchedulerKind INTO the software-registry model (SME rulings
    2026-07-21 pm, in-chat): NO new classes — :SoftwareProduct {role:
    orchestrator} is the target and the ACTIVE registry edge
    (:BusinessApplication)-[:USES_SOFTWARE]->(:SoftwareProduct) is the app
    edge; the Ais* family is REMOVED (see Q6). Supersedes the 2026-07-09
    'replace with :AisCapability + :AisTool' target and the 06-29 company
    build (kept above as provenance). The gate formally confirms.
  open_questions:
    - "Q1 What do the classes represent? ANSWERED BY THE COMPANY SHAPE (captured above): :AisCapability = the capability AREA (skos:Concept; orchestration/etl/file-transfer), :AisTool = the concrete product (prov:SoftwareAgent). Granularity conflict RESOLVED pre-gate — SME RULING 2026-07-21 (in-chat, same day as the capture): the producer 'batch scheduling'/'event scheduling' seed is WITHDRAWN — it was the SME's original SUB-NODE design under :BusinessApplication to avoid super-nodes (a graph-shape device, not capability semantics) and is not needed here; the batch-vs-event split already lives on the SEAL port kind (BatchProcessing/EventProcessing). The company areas stand as the proposed capability vocabulary; the gate formally confirms. FOLLOW-UP RULING same day: producer rows carry NO capability value — plain role: orchestrator (the software-registry vocabulary) suffices; whether the producer adopts the :AisCapability node layer at all folds into Q4. CLOSED 2026-07-21 pm: the capability NODE layer is NOT adopted — SME: the registry role value (role: orchestrator) makes more sense than a tool-class node; 'Orchestration' was the intended HIGHEST classification level, and the role vocabulary carries it."
    - "Q2 REQUIRES_SCHEDULER retarget — one edge or two? SME DIRECTION 2026-07-21 (ONE edge, hoisted to :BusinessApplication) NOW CORROBORATED by the company shape: (:BusinessApplication)-[:USES_TOOL]->(:AisTool), one app-level edge, with the tool classified separately via IN_CAPABILITY (skos:broader). Remaining gate calls: adopt the USES_TOOL rename (vs keep REQUIRES_SCHEDULER) and confirm the no-PROV Agent->Agent typing. CLOSED 2026-07-21 pm: USES_TOOL is retired with the Ais* family — the app→orchestrator edge is the ACTIVE registry edge (:BusinessApplication)-[:USES_SOFTWARE]->(:SoftwareProduct), meaning carried by the target's role: orchestrator; the batch-port orchestrator migration lands as USES_SOFTWARE {source: 'batch-port'} (distinct from the plan-07 'controlm-cmdline' detections on the same edge type). seal_requires_scheduler (planned, never wired) RETIRES at the gate instead of reshaping — zero new edge types."
    - "Q3 Deployed-instance layer? SME DIRECTION 2026-07-21 (RETIRE :Scheduler unbuilt — :ControlMServer is the deployed layer) CORROBORATED by built practice: company AisTool is deliberately NOT :Platform. Gate formally confirms."
    - "Q4 Relation to software-registry.yaml — THE remaining open question, unresolved on BOTH sides: producer direction says distinct view + software_registry_ref cross-reference; company built NO cross-reference at all (vendor string only) and has the same question open. Gate must pick: edge (:AisTool)-[?]->(:SoftwareProduct), property ref, or merge; resolve the USES_TOOL vs USES_SOFTWARE app-edge overlap; AND (SME ruling 2026-07-21) decide whether the producer adopts the :AisCapability node layer at all — the capability area 'orchestration' duplicates the registry role 'orchestrator', so the layer may collapse into the registry role producer-side. DIRECTION SUPERSEDED 2026-07-21 pm: MERGE — no distinct tool view survives; the registry :SoftwareProduct IS the concrete-tool class (closes what had been the one open design decision, B3); the earlier distinct-view + cross-reference direction is withdrawn, and software_registry_ref on the seed rows below now carries the proposed link."
    - "Q6 Naming/acronym (NEW 2026-07-21 pm, RULED): AIS = 'Application Integration Streaming' — a company acronym whose 'Streaming' leg was itself inaccurate (the folder also carried ETL + file transfer). RULING: the Ais* spelling is removed EVERYWHERE on both sides (company-side note in flight via a parallel session); the expansion is preserved ONLY as the acronyms note field in software-registry.yaml (the registry with the publisher URLs). The producer's Integration* rename counter-proposal was REJECTED (SME: 'integration' is vague — any tool codes for integration); no replacement class family is needed because Q1/Q2/Q4 dissolve the classes into the registry model. COMPANY-SIDE DONE 2026-07-21 pm (screenshot channel): their acronym gloss landed on the source-registry entry for their internal AIS engineering-docs portal (docs root /docs/ais/{orchestration,etl,file-transfer}/ — corroborates the 3 areas), marked PROVISIONAL + a PORT-MANIFEST canonical-producer row deferring to the producer's authoritative expansion (software-registry.yaml#acronyms) at next cherrypick. Port caveat: different files on the two sides — carry the expansion across, don't rely on same-file overwrite. Their 06-29 gate-log audit gap remains open company-side (they offered to backfill the entry — pending)."
    - "Q5 Publishability? SME DIRECTION 2026-07-21 (external public vendors -> publishable) REFINED by the capture: the company taxonomy also contains internally-built tools (2 managed-file-transfer products) — those VALUES stay internal/ (ccb-twin convention); the class model and public-vendor values remain publishable; deployed-instance data stays internal/ regardless."

