schema: drydocs.platforms.v1
classification: Internal-Public       # mechanism + public-vendor values only; internal tool names + deployed instances -> internal/
status: captured                      # was: placeholder (2026-07-09 .. 2026-07-21)
confirmed: true                       # platforms-taxonomy gate SIGNED OFF 2026-07-21 pm (C12; config/gate-log.md) — 3/3 as recommended; build follow-ups = C13/C14
updated: 2026-07-24                   # superseded 06-29 company capture excised (Q6 ruling follow-through); rulings compressed below

# ── C12 rulings record (2026-07-21 pm; canonical prose in config/gate-log.md) ─
# Q1 CLOSED — no capability node layer: the registry role value
#    (role: orchestrator) carries the classification; "Orchestration" was the
#    intended highest classification level.
# Q2 CLOSED — the app→orchestrator edge is the ACTIVE registry edge
#    (:BusinessApplication)-[:USES_SOFTWARE {source: 'batch-port'}]->
#    (:SoftwareProduct {role: orchestrator}) — vocabulary reg_uses_software;
#    seal_requires_scheduler RETIRED at the gate; zero new edge or node types.
# Q3 CLOSED — :Scheduler retired UNBUILT; :ControlMServer is the deployed layer.
# Q4 CLOSED — MERGE: the registry :SoftwareProduct IS the concrete-tool class;
#    no distinct tool view survives; software_registry_ref carries the link.
# Q5 CLOSED — class model + public-vendor values publishable; internally-built
#    tool VALUES (2 managed-file-transfer products) and deployed-instance data
#    stay internal/ (the ccb-twin convention).
# Q6 CLOSED — the company class-family spelling is removed on both sides; the
#    acronym expansion survives only in software-registry.yaml#acronyms (the
#    durable "what did that name mean" home, alongside the publisher URLs).
#    The producer rename counter-proposal was REJECTED (no replacement class
#    family needed — Q1/Q2/Q4 dissolve the classes into the registry model).
# SchedulerKind — retired: seeds commented out of ontology.cypher 2026-07-21
#    (C12/C13); the company keeps its copies deprecated=true, audit-kept.
# Company tool-list note (kept for the crosswalk): Apache Airflow was NOT in
#    the company tool list — their AWS leg runs EventBridge Scheduler + Glue —
#    so the airflow row below is the F2 crosswalk placeholder (B5 ruling).

# ── Producer seed rows (the :SchedulerKind migration seed / crosswalk) ────────
# Rows carry role: orchestrator (the software-registry role vocabulary) and the
# gate-confirmed software_registry_ref, consumed by the batch-port orchestrator
# crosswalk (C14). current_class records the pre-migration source class
# (seeds retired 2026-07-21 — see the rulings record above).
platforms:
  - id: controlm
    label: "BMC Control-M"
    current_class: SchedulerKind        # pre-migration source class (retired)
    scheduler_kind: ControlM
    phase_supported: 1
    role: orchestrator                  # software-registry role vocabulary — the SME-ruled producer designation
    software_registry_ref: controlm     # CONFIRMED at the C12 gate (2026-07-21 pm)
  - id: autosys
    label: "CA Autosys"
    current_class: SchedulerKind
    scheduler_kind: Autosys
    phase_supported: 2
    role: orchestrator
    software_registry_ref: autosys      # CONFIRMED at the C12 gate (2026-07-21 pm; registry row 'Broadcom Workload Automation' carries the vendor-label truth)
  - id: airflow
    label: "Apache Airflow"
    current_class: SchedulerKind
    scheduler_kind: Airflow
    phase_supported: 2
    role: orchestrator
    software_registry_ref: airflow      # B5 RULED at the C12 gate (2026-07-21 pm): row STAYS as the F2 crosswalk placeholder; NOT a company-confirmed tool
