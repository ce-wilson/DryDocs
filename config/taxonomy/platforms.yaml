# =============================================================================
# config/taxonomy/platforms.yaml — platform / execution-technology taxonomy.
#
# PLACEHOLDER (status: placeholder, confirmed: false). Created 2026-07-09 as the
# reconciliation surface for the "platform" layer — the *what runs it* technology
# taxonomy that today is split across three half-models:
#   1. :SchedulerKind — placeholder vocab {ControlM, Autosys, Airflow}, seeded in
#      drydocs_core/schema/ontology.cypher + the scheduler_kind constraint. SLATED FOR
#      DEPRECATION -> :AisCapability + :AiTool (user 2026-07-09).
#   2. :Scheduler {kind, instance} — a *deployed* scheduler instance
#      (docs/history/LoadPlanV3.md; not yet built), vs the SchedulerKind classifier.
#   3. config/taxonomy/software-registry.yaml — third-party :Vendor /
#      :SoftwareProduct ledger (plan-07 / ADR 0004); orchestrators live there too.
#
# This file does NOT decide the model — it HOLDS the reconciliation until the SME
# defines :AisCapability + :AiTool at the HITL gate (docs/restructure/
# 03-hitl-sme-flow.md). Nothing here is loaded; no vocabulary is activated;
# ontology/node-meaning => the gate, never auto-decided.
#
# Related: config/taxonomy-ontology-map.yaml#requires-scheduler (to_node
# provisional), drydocs_core/ontology/relationship_vocabulary.yaml#seal_requires_scheduler
# (planned), backlog C6, docs/restructure/IDEAS.md (SchedulerKind-deprecation capture).
# =============================================================================

schema: drydocs.platforms.v1          # DRAFT — shape not yet finalized
classification: Internal-Public       # design/mechanism only; real platform INSTANCES/values -> internal/
status: placeholder
confirmed: false
updated: 2026-07-21                    # ais_capability partial seed (user-supplied; C11)

# ── What this taxonomy must reconcile (all OPEN — SME / HITL gate) ────────────
reconciliation:
  target: "Replace :SchedulerKind with :AisCapability + :AiTool (user 2026-07-09)."
  open_questions:
    - "What does :AisCapability represent (a capability, e.g. 'batch scheduling') and :AiTool (the concrete tool, e.g. Control-M / Autosys / Airflow)?"
    - "How does the app batch port's REQUIRES_SCHEDULER re-target — one edge (:Port -> :AiTool) or two (:Port -> :AisCapability and :AiTool -[:PROVIDES]-> :AisCapability)? SME DIRECTION 2026-07-21 (in-chat, pre-gate): ONE edge, and it attaches at :BusinessApplication (hoisted from the batch :Port) — README.md:263's reading wins. Recorded as the proposed seed answer; the gate session formally confirms + re-shapes the registered entries."
    - "Does :Scheduler {kind, instance} (a deployed instance, LoadPlanV3) fold into :AiTool, or stay a separate instance layer beneath it?"
    - "Relation to software-registry.yaml: is an :AiTool the SAME node as a :SoftwareProduct (e.g. BMC Control-M), or a distinct platform view over it? SME DIRECTION 2026-07-21 (in-chat, pre-gate): a DISTINCT platform view — :AiTool is NOT the same node as :SoftwareProduct; software_registry_ref stays the cross-reference between the two. How the view relates structurally (edge vs property ref) is decided at the gate."
    - "Classification: are 'AIS' / :AisCapability / :AiTool internal code-names? If so, real instances/values stay in internal/ (PUBLISH-BOUNDARY.md)."

# ── Seed: what is known today (the current :SchedulerKind placeholder vocab) ──
# Public orchestrator tool names, already seeded in ontology.cypher as
# :SchedulerKind. Carried here as the migration seed. The ai_tool /
# software_registry_ref mappings are TBD — do NOT invent them; they are
# resolved at the gate once :AisCapability + :AiTool are defined.
# ais_capability: user-supplied PROPOSED seed (SME, 2026-07-21 — C11 partial
# capture): controlm + autosys = "batch scheduling"; airflow deliberately left
# TBD (not named by the SME). Proposed only — the platforms gate confirms.
platforms:
  - id: controlm
    label: "BMC Control-M"
    current_class: SchedulerKind        # today
    scheduler_kind: ControlM
    phase_supported: 1
    software_registry_ref: ~            # TBD — reconcile to the real vendor/product id at the gate
    ais_capability: "batch scheduling"  # PROPOSED — user-supplied 2026-07-21 (C11 partial seed); gate confirms
    ai_tool: ~                          # TBD (gate)
  - id: autosys
    label: "CA Autosys"
    current_class: SchedulerKind
    scheduler_kind: Autosys
    phase_supported: 2
    software_registry_ref: ~
    ais_capability: "batch scheduling"  # PROPOSED — user-supplied 2026-07-21 (C11 partial seed); gate confirms
    ai_tool: ~
  - id: airflow
    label: "Apache Airflow"
    current_class: SchedulerKind
    scheduler_kind: Airflow
    phase_supported: 2
    software_registry_ref: ~
    ais_capability: ~
    ai_tool: ~
