# =============================================================================
# config/taxonomy/business-application.yaml  —  Business Application taxonomy (B2)
#
# GENERIC CONCEPT: BusinessApplication. SEAL is the SOURCE OF RECORD (the
# authoritative registry); the unique identifier is the SEALID (= app_id). The
# concept is deliberately decoupled from the vendor system — SEAL is one source
# of record for it, not the concept itself.
#
# PURE CLASSIFICATION ONLY: BusinessApplication ▸ Port; Membership ▸ Role ▸ Employee.
# No meaning edges (ownership/attribution semantics) — those are ontology (C2).
#
# Built from a SYNTHETIC sample (publishable shape). The SOURCE (seal-extract) is
# Internal (confidential material): in production, real names/emails/SIDs are NOT written here —
# referenced by SID/SEALID; real rosters live in internal/. Captured 2026-06-20.
#
# SANITIZED 2026-07-27 (p0 publish-boundary fix). Until this date the three sample
# rows below carried REAL SEALIDs and REAL application names while the header claimed
# they were synthetic — verified against the SEAL portal by the SME. They have been
# replaced with values from the RESERVED SYNTHETIC BLOCK 70001-70099, which SEAL does
# not issue. The same real ids were embedded inside Control-M folder-name strings
# (e.g. the numeric segment of PRARAG-HLDM-<sealid>-...), which is why the earlier
# sample cleanup (9d59f53, "samples now synthetic-only") missed them: it searched for
# the seal_id COLUMN, not for the value inside a composite string.
#
# RULE for anything added here: ids come from 70001-70099 and names are invented.
# If you need a real id/name to make a point, the file belongs in internal/.
# =============================================================================

schema: drydocs.business-application.v1
updated: 2026-08-26

taxonomy: business-application
domain: business
taxonomy_path_root: business/application
concept: BusinessApplication           # generic node concept (graph label :BusinessApplication — normalized at K4, 2026-07-15)
source: "seal:app-extract"             # config/source-registry.yaml v2 dataset id
source_of_record: SEAL                 # authoritative registry for BusinessApplication
identifier: "Application ID"           # the SOURCE's own field name for the unique id (= app_id).
                                       # CORRECTED 2026-07-27 at the business-application-identity
                                       # gate (§B4/§B5): this said `SEALID`, which the source does
                                       # not use — SEAL's portal and Reports export both call the
                                       # field `Application ID`, and `SEALID` appears nowhere in
                                       # code, SQL or Cypher. It was repo vernacular recorded as if
                                       # it were the source's term. The ECOSYSTEM term (SEAL /
                                       # SEAL_ID, as used in Control-M CMDLINEs and internal docs)
                                       # is a different axis and lives in the evidence vocabulary —
                                       # ATTRIBUTION_TIERS / match_method — per the §B2 two-part rule.
authority: lob-product-team            # config/precedence.yaml tier 3
classification: Internal               # config/classification.yaml; confidential handling (J23 collapse)
classification_only: true

nodes:

  # BusinessApplication — keyed by SEALID. Each exposes the SEAL two-port model.
  # info_classification is SEAL's OWN sensitivity label (correlates with our axis — see OQ).
  # batch_orchestrator (added 2026-07-21, backlog C14) is the SEAL-declared batch-port
  # orchestrator STRING (synthetic values here, matching the sample) — pure classification;
  # the MEANING edge it migrates to (USES_SOFTWARE {source: 'batch-port'} -> the registry
  # :SoftwareProduct) was gated at C12 (platforms-taxonomy, config/gate-log.md 2026-07-21)
  # and is written only by the batch_port_orchestrator loader via the platforms.yaml
  # seed-row crosswalk (software_registry_ref). Absent field = no declaration (skipped).
  business_applications:
    - sealid: 70001
      name: Schema Inspection Toolkit
      short_name: schema-inspect
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70002
      name: Retail Advice Reporting & Analytics
      short_name: RET-ADV-R&A
      state: Operate
      lob: CCB
      info_classification: Highly Confidential
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70003
      name: Consumer Servicing Reporting & Analytics
      short_name: CONS-SERV-R&A
      state: Operate
      lob: CCB
      info_classification: Highly Confidential
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM

    # --- DEMO PLUMBING (LOAD4, 2026-09-07) — NOT part of the G35 shape design --
    # The five below exist for ONE reason: the bundled Control-M folder names
    # carry application ids this capture had never declared. The capture said
    # 70001-70003 and the sample folders said 70002, 70011, 70012, 70021, 70022,
    # 70031 and 70041 — authored apart, so only ONE folder in the whole demo could
    # ever reach an application, and the coverage counters reported 7 of 8
    # unattributed as if that were a finding rather than a fixture defect.
    #
    # WHY THE CAPTURE GREW INSTEAD OF THE FOLDERS NARROWING (LOAD4 (a) asked for
    # one direction, chosen and written down): narrowing the folder names onto
    # 70001-70003 would have rewritten about twenty files — this file's sibling
    # taxonomy rows, four sample CSVs, server-location.yaml's worked comment, and
    # the WORKED EXAMPLES of two design docs, where
    # `--folder 'PRARAG-HLDM-70011-PEX%'` is the running illustration of prefix
    # matching selecting both 70011 folders. Those design pages are governed
    # renders. Growing the capture is additive instead: the three shapes below are
    # untouched, byte for byte.
    #
    # These five are deliberately UNIFORM and deliberately DULL. 70001 FULL,
    # 70002 WIDE and 70003 MINIMAL are the G35 gate walk's sample and carry its
    # role-cardinality cases; these five carry the smallest membership block that
    # still generates a row (drydocs/seal_samples.py builds application rows FROM
    # the memberships, so an application with none is invisible to the generated
    # SEAL sample and would not have fixed anything). Do not read a fourth shape
    # into them, and do not use them for a role rule.
    #
    # 70041 IS ABSENT ON PURPOSE — see the deliberate-gap note under `counts`.
    - sealid: 70011
      name: Trusted Exposure Load
      short_name: TRUST-EXP-LD
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70012
      name: Provisioning Exposure Feed
      short_name: PROV-EXP-FD
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70021
      name: Auto Refund Processing
      short_name: AUTO-RFND
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70022
      name: Auto Trusted Load
      short_name: AUTO-TRUST
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM
    - sealid: 70031
      name: Account Reconciliation
      short_name: ACCT-RECON
      state: Operate
      lob: CCB
      info_classification: Internal
      ports: [EventProcessing, BatchProcessing]
      batch_orchestrator: ControlM

  # Port — the two-port classification (DPROD). Structural: every BusinessApplication has both.
  ports:
    - kind: EventProcessing
    - kind: BatchProcessing

  # Employee — the people the memberships point at. INVENTED NAMES, supplied by the SME
  # on 2026-08-06 so the sample can be demonstrated end to end; SIDs are synthetic and
  # follow the file's existing K###### shape. Real rosters live in internal/ and are
  # referenced by SID — this block does NOT change that rule, it gives the synthetic
  # sample the one thing it lacked: a person who is recognisably the SAME person in two
  # places. That is what makes the multi-role and multi-application shapes below legible,
  # and what a reconciliation surface (backlog O44) needs to draw anything at all.
  employees:
    - { sid: K123456, name: Agent Smith }
    - { sid: K234567, name: Lana Wachowski }
    - { sid: K345678, name: Lilly Wachowski }
    - { sid: K456789, name: Agent Brown }
    - { sid: K567890, name: Joel Silver }
    - { sid: K678901, name: Agent Jones }
    - { sid: K789012, name: Spoon Boy }

  # Membership ▸ Role ▸ Employee (n-ary). Keyed (sealid, role, sid). Employees referenced by
  # SID only — real names/emails are confidential (synthetic in the sample) -> internal/.
  #
  # REBUILT 2026-08-06 from the SME's role list (13 classes; the register that was
  # derived from it here was deleted at G70 — see tom-role-vocabulary.yaml).
  # SIDs are now PERSON-scoped rather than app-scoped: the earlier K/L/M-per-application
  # pattern implied 15 different people and made every cross-application question
  # unaskable. The four role/SID pairs the SME set on 70001 are preserved exactly.
  #
  # The three applications are deliberately DIFFERENT SHAPES, because a sample where every
  # app looks the same cannot exercise the rules being written about it at gate G35:
  #   70001 FULL      — all 13 classes present. Carries the two cases the gate turns on:
  #                     one person (Agent Brown) holding L1 Operate Manager, L2 Operate
  #                     Manager AND Operate Manager, which is the config/gate-log.md:882
  #                     case and the one the seal.py:143 coercion silently collapses; and
  #                     one person (Joel Silver) holding three DIFFERENT classes (§B1b).
  #   70002 WIDE      — FOUR holders of Backup Information Owner, the observed shape that
  #                     §B1 rules normal rather than anomalous, plus L1/L2 Operate Manager
  #                     held by two different people.
  #   70003 MINIMAL   — the core classes only, no optional ones. An application with
  #                     legitimately absent optional roles, so §C4's presence check has a
  #                     negative case to be correct about instead of only positive ones.
  memberships:
    - sealid: 70001
      roles:
        - { role: Application Owner, sid: K123456 }
        - { role: Primary Information Owner, sid: K567890 }
        - { role: Backup Information Owner, sid: K678901 }
        - { role: Chief Technology Officer, sid: K345678 }
        - { role: Chief Business Technologist, sid: K123456 }
        - { role: Design Authority, sid: K234567 }
        - { role: Deployment Owner, sid: K567890 }
        - { role: Deployment Information Owner, sid: K567890 }
        - { role: Application Module Owner, sid: K789012 }
        - { role: L1 Operate Manager, sid: K456789 }
        - { role: L2 Operate Manager, sid: K456789 }
        - { role: Operate Manager, sid: K456789 }
        - { role: Site Reliability Engineer, sid: K789012 }
        - { role: Backup Application Owner, sid: K678901 }
    - sealid: 70002
      roles:
        - { role: Application Owner, sid: K567890 }
        - { role: Primary Information Owner, sid: K234567 }
        - { role: Backup Information Owner, sid: K123456 }
        - { role: Backup Information Owner, sid: K456789 }
        - { role: Backup Information Owner, sid: K678901 }
        - { role: Backup Information Owner, sid: K789012 }
        - { role: Chief Technology Officer, sid: K345678 }
        - { role: Design Authority, sid: K234567 }
        - { role: L1 Operate Manager, sid: K456789 }
        - { role: L2 Operate Manager, sid: K678901 }
        - { role: Site Reliability Engineer, sid: K789012 }
        - { role: Backup Application Owner, sid: K123456 }
    - sealid: 70003
      roles:
        - { role: Application Owner, sid: K123456 }
        - { role: Primary Information Owner, sid: K567890 }
        - { role: Backup Information Owner, sid: K678901 }
        - { role: Chief Technology Officer, sid: K345678 }
        - { role: Design Authority, sid: K234567 }
        - { role: L2 Operate Manager, sid: K456789 }

    # DEMO PLUMBING (LOAD4) — the five applications added above. Three roles each,
    # identical shape, existing SIDs. The three are not an arbitrary minimum: they
    # are EXACTLY seal_samples.EMBEDDED_ROLES, the trio DECO_SEAL_APP_INFO carries
    # inline (Application Owner / Primary Information Owner / Chief Technology
    # Officer), and test_seal_samples::test_every_application_row_carries_all_
    # three_inline_contacts refuses a row missing any of them. A shorter block does
    # not generate a usable application row, which is what the bundled folders need
    # to attribute to. Not a fourth G35 shape; see the note beside the declarations.
    - sealid: 70011
      roles:
        - { role: Application Owner, sid: K123456 }
        - { role: Primary Information Owner, sid: K567890 }
        - { role: Chief Technology Officer, sid: K345678 }
    - sealid: 70012
      roles:
        - { role: Application Owner, sid: K123456 }
        - { role: Primary Information Owner, sid: K567890 }
        - { role: Chief Technology Officer, sid: K345678 }
    - sealid: 70021
      roles:
        - { role: Application Owner, sid: K234567 }
        - { role: Primary Information Owner, sid: K678901 }
        - { role: Chief Technology Officer, sid: K345678 }
    - sealid: 70022
      roles:
        - { role: Application Owner, sid: K234567 }
        - { role: Primary Information Owner, sid: K678901 }
        - { role: Chief Technology Officer, sid: K345678 }
    - sealid: 70031
      roles:
        - { role: Application Owner, sid: K789012 }
        - { role: Primary Information Owner, sid: K123456 }
        - { role: Chief Technology Officer, sid: K345678 }

  # THE ROLE REGISTER THAT STOOD HERE WAS DELETED AT G70 — not moved, not
  # reinterpreted (gate tom-roles-enumeration-and-cardinality §F3: a new
  # declared file won, and "leaving both is the one outcome to refuse"). It
  # was §A8's fourth divergent role list, read by no code, and §A1b measured
  # it drifting twice inside a single gate with the full suite green. The
  # DECLARED vocabulary — both registers, scope/type/required/active, the
  # retirement state — is config/taxonomy/tom-role-vocabulary.yaml, read by
  # drydocs_core.ontology.tom_role_vocabulary and drift-guarded by
  # tests/unit/test_tom_role_vocabulary.py.
  #
  # The MEMBERSHIPS above deliberately REMAIN: they are the synthetic SAMPLE
  # the G35 gate walk was built on (the three deliberately different
  # application shapes), not a vocabulary declaration — the deleted list was
  # DERIVED from them, which is why deleting the list alone would not have
  # survived a regeneration (§H4). The guard that replaces the derivation:
  # every membership role name must canonicalize into the declared
  # vocabulary, so this file can never quietly grow a fifteenth name the
  # register does not carry.

# THE ONE FOLDER LEFT UNRESOLVABLE ON PURPOSE (LOAD4 (b)/(d), 2026-09-07).
# Application 70041 is NOT declared here and is not an oversight. The bundled
# folder `PRRPDG-RPD-70041-RISK-RETIRED` is status=R with an empty
# user_daily — a RETIRED folder naming an application the registry no longer
# carries is the real unattributed shape, and a demo whose every folder resolves
# proves less than one that shows a genuine gap. The guard that keeps this honest
# rather than accidental is
# tests/unit/test_bundled_demo_interlock.py::test_every_folder_names_an_application_the_capture_carries,
# whose DELIBERATE_GAPS constant names 70041 and nothing else — so the next id
# that drifts out of this capture fails instead of joining the gap quietly.
# Separately and NOT closed by LOAD4: 2 of the 4 sample hosts stay unresolved
# (tests/unit/test_server_inventory_fixture.py), the same idea one join over.

counts:
  business_applications: 8  # 3 (the G35 shapes) + 5 (LOAD4 demo plumbing)
  ports_per_app: 2          # EventProcessing + BatchProcessing
  memberships: 47           # 14 (70001 full) + 12 (70002 wide) + 6 (70003 minimal)
                            # + 15 (the five LOAD4 applications, 3 roles each)
  distinct_roles: 14        # distinct role names observed in the memberships sample (the SME's
                            # 13-class list + CBT); every one canonicalizes into the DECLARED
                            # vocabulary (tom-role-vocabulary.yaml) — guarded, see the note above
  distinct_employees: 7     # by SID. WAS 15, and the drop is the POINT: SIDs are now
                            # person-scoped, so the same seven people recur across roles and
                            # across applications. 31 memberships over 7 people is what makes
                            # the multi-role and multi-application shapes visible at all.

open_questions:
  - id: two-port-derivation
    note: >
      The EventProcessing/BatchProcessing ports are the SEAL two-port model (DPROD). The sample
      extract has no explicit port column — ports are treated as structural (every app has both).
      SME: confirm whether some BusinessApplications are single-port.
  - id: info-classification-correlation
    note: >
      SEAL's own info_classification (Internal / Highly Confidential) correlates with our
      sensitivity axis (config/classification.yaml). Candidate to seed a per-application
      classification at ontology time. Flag for C2.
  - id: source-of-record
    note: >
      SEAL is the source of record for BusinessApplication, keyed by SEALID. Other systems
      (Control-M job APPLICATION column, catalog) reference apps; reconcile to SEALID, do not
      mint new app identities. (Reconciliation is a meaning edge -> ontology.)
