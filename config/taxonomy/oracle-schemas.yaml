nodes:

  # Schema — top of the data hierarchy. Real owner/schema names -> internal/schemas/ by id.
  schemas:
    - { id: SCHEMA_001, name_ref: "internal/schemas/#schema-001", tables: [TBL_001_A, TBL_001_B] }   # template

  # Table — child of a Schema. Maps to DataAsset at ontology time.
  tables:
    - { id: TBL_001_A, schema: SCHEMA_001, name_ref: "internal/schemas/#tbl-001-a" }   # template
    - { id: TBL_001_B, schema: SCHEMA_001, name_ref: "internal/schemas/#tbl-001-b" }   # template

  # Script — executable artifacts (Control-M job scripts) that read/write Oracle objects.
  scripts:
    - { id: SCRIPT_001, name_ref: "internal/schemas/#script-001" }   # template

