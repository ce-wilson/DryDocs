  # not the grid - it wraps TruncationBadge and the four-line conditional that
  # was about to be written five more times. Renders NOTHING on a complete
  # result, so the badge stays a thing a reader notices.
  - { id: CompletenessNotice,      area: ui-primitive, path: components/ui/CompletenessNotice.tsx }
  - { id: ResizableSplit,          area: ui-primitive, path: components/ui/ResizableSplit.tsx }
  - { id: StatusChip,              area: ui-primitive, path: components/ui/StatusChip.tsx }
