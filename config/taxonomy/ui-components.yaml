  - { id: LineageRoute,            area: route,        path: routes/LineageRoute.tsx,                     module: lineage,    module_evidence: route-name }
  - { id: LoadsRoute,              area: route,        path: routes/LoadsRoute.tsx,                       module: loads,      module_evidence: route-name }
