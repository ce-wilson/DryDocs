  - { id: RouteAccessGate,         area: layout,       path: layout/RouteAccessGate.tsx }
  # WEB5: one render throw breaks one panel, not the console.
  - { id: RouteErrorBoundary,      area: layout,       path: layout/RouteErrorBoundary.tsx }
  - { id: Shell,                   area: layout,       path: layout/Shell.tsx }
  # WEB1: readiness + the fallback count, in the shell so the signal sits
  # OUTSIDE the surfaces doing the fabricating.
  - { id: SystemBanner,            area: layout,       path: layout/SystemBanner.tsx }
  - { id: rightSidebarContext,     area: layout,       path: layout/rightSidebarContext.tsx }
  - { id: FeedbackLayer,           area: layout,       path: feedback/FeedbackLayer.tsx }   # O89 the L5 screen loop: an annotate control per anchored block, mounted beside main

  # --- route (26) ---
