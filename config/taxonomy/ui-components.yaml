# =============================================================================
# config/taxonomy/ui-components.yaml — FIRST-PARTY UI component ledger.
#
# The sub-ledger of config/taxonomy/software-registry.yaml. That file is the
# THIRD-PARTY register (what we are built ON); this one is the FIRST-PARTY
# inventory (what we BUILT) for the one stack that has no other home.
#
# THE LINK: `framework: react` and `stack: web-console` below join to
# software-registry.yaml, whose `react` product carries the reciprocal
# `components:` pointer back to this file. Same shape as the `documentation:`
# pointer on the controlm product — a registry entry naming the ledger that
# details it.
#
# WHY THIS FILE EXISTS (backlog O42): the 62 components under web/src were in
# no machine-readable inventory. The code-graph snapshot scans PYTHON roots
# only; MODULE_MAP.md omits drydocs-web by construction ("not a Python
# package"); and the software registry correctly declines first-party code.
# All three plausible homes declined it, so the whole of Epic O was invisible
# to tooling. This is the cheap answer — a maintained ledger with a drift
# guard — rather than teaching the depgraph scanner TypeScript.
#
# THE GUARD IS THE POINT: tests/unit/test_ui_components.py checks the ledger
# against the filesystem in BOTH directions, so a new component that is never
# registered fails the suite, and an entry whose file was deleted or moved
# fails too. An inventory nobody is forced to update rots into fiction.
#
# NOT a dependency graph: this records WHAT EXISTS and WHERE, not what imports
# what. Import edges would need a real TS resolver (still open in O42).
#
# `module` / `module_evidence` (2026-07-31) — the one idea worth borrowing from
# the Miller software-development-process model (the uploaded notebook): its
# real leverage is not the file labels but the JOIN UP from a UI element to the
# FEATURE it serves, which is what makes "what does changing this affect?"
# answerable. Our equivalent of its :Feature/:Area layer already exists as
# web/src/modules/registry.ts, so the binding is a lookup rather than a new
# vocabulary.
# DERIVED FROM EVIDENCE ONLY, never guessed — `directory` (the component lives
# under a module-named folder), `route-name` (a route whose name IS a module
# id), or `route-dir`. 26 of 62 bind that way. The other 36 carry NO module key
# on purpose: shell, ui primitives and shared components serve many modules or
# none, and inventing a binding for them would be exactly the silent default
# this repo keeps refusing. Assigning those properly means reading imports —
# i.e. the TS resolver, i.e. O42.
# =============================================================================

schema: drydocs.ui-component-registry.v1
classification: Internal-Public
updated: 2026-08-07

# --- join keys back to the third-party registry ------------------------------
framework: react              # -> software-registry.yaml products[].id
stack: web-console            # -> software-registry.yaml products[].stack
root: web/src
extension: .tsx
# SCOPE CAVEAT: .tsx only. 25 plain .ts files under web/src — including
# modules/registry.ts, which this file's `module` column JOINS TO — are NOT
# inventoried here. Components are the thing O42 raised, but a ledger that
# silently omits the file it depends on is worth saying out loud. Widening to
# .ts is a one-line change plus 25 rows; it waits on O42's disposition so the
# scan boundary is decided once rather than twice.

areas:
  - { id: entry,         title: "Application entry points (bootstrap + top-level composition)" }
  - { id: layout,        title: "The shell: header, sidebars, toolbar, right-sidebar slot" }
  - { id: route,         title: "One per addressable view — real routes, not display toggles (site-plan §1)" }
  - { id: ui-primitive,  title: "Hand-rolled ReUI/shadcn-style primitives (copied-in, not an npm dependency)" }
  - { id: component,     title: "Shared cross-module components" }
  - { id: icon,          title: "Icon glyph sets" }
  - { id: ask,           title: "Ask module panes" }
  - { id: explorer,      title: "Explorer module panes" }
  - { id: lineage,       title: "Lineage module panes" }
  - { id: loads,         title: "Loads module panes" }
  - { id: loadmap,       title: "Load map module panes" }
  - { id: ownership,     title: "Ownership module panes" }
  - { id: underhood,     title: "/under-the-hood benchmark showcase" }
  - { id: software,      title: "Software registry / documentation-coverage panes" }
  - { id: remediation,   title: "Remediation module panes (the fix-diff working session)" }
  - { id: docs,          title: "Docs module panes (the corpus reconciliation surface)" }

components:
