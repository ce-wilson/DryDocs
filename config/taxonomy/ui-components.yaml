  - { id: AssetPathRoute,          area: route,        path: routes/AssetPathRoute.tsx }
  - { id: ConsoleRoute,            area: route,        path: routes/ConsoleRoute.tsx }
  - { id: DocsRoute,               area: route,        path: routes/DocsRoute.tsx,                        module: docs,       module_evidence: route-name }
  - { id: DomainGridTable,        area: route,        path: routes/DomainGridTable.tsx }
  - { id: SoftwareRoute,           area: route,        path: routes/SoftwareRoute.tsx,                    module: software,   module_evidence: route-name }
