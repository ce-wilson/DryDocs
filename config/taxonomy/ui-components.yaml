  # consumer (Z6's runtime map is the next). MapGlyphs is its icon set, kept
  # beside it rather than in components/icons/ because the three glyphs mean
  # nothing outside a map legend.
  - { id: LocationMap,             area: component,    path: components/map/LocationMap.tsx }
  # Z6: the same map core with one axis added — a run window read against the
  # world clock. UNBOUND for LocationMap's own reason: it takes its access and
  # its registry as props and the Explorer tab is only its first consumer.
  # RuntimeSpanPanel is the FETCHING half, split off so the map can be rendered
