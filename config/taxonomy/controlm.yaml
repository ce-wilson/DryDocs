      loaders/tests use; the intended larger fixture can't be regenerated without psgmgr). The
      stale README m3-verify expected-output block was reconciled to the actual sample —
      8 folders / 13 jobs / 15 conditions (7 distinct names) / 10 derived deps. RESIDUAL (for SME):
      the sample is REDUCED — folders 161020 and 160501 are active but jobless, so the m3-verify
