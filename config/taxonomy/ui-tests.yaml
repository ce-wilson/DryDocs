# =============================================================================
# config/taxonomy/ui-tests.yaml — UI test cases, keyed to console modules.
#
# WHY THIS EXISTS: adopted from the Process/Testing domains of the Miller
# software-development-process model (uploaded notebook, 2026-07-31), on the
# user's condition — "if this framework works internally use it". It does, but
# only the SHAPE: TestSuite -> TestCase, and TestSuite -> Feature. Our :Feature
# layer already exists as web/src/modules/registry.ts, so the join is a lookup.
#
# THE PAYOFF CHAIN, which is the model's headline query realized on our data:
#
#   component --module--> module <--module-- suite --> cases to run
#
# Change LineageGraphPane, and its ui-components.yaml `module: lineage` binding
# leads to the lineage suite and the cases worth re-running. The notebook does
# this as MATCH (css)--(vw:MvcView) MATCH (vw)-[*1..3]-(feature:Feature); we do
# it as two ledger joins, no graph required.
#
# NOT REUSING graph-tests/ ON PURPOSE. That format (drydocs.graph-tests.v1) is
# excellent and stays the precedent for STRUCTURE — but its cases are Cypher
# with empty/nonempty/equals assertions against a live graph. A UI case is
# "click this, see that". Same spirit, different assertion surface, so this is
# a sibling schema rather than a strained reuse.
#
# EXECUTION IS MIXED, AS OF O80 (2026-08-31). A runner landed — Vitest for pure
# modules, Playwright for the browser path — so the mode flipped exactly as this
# header said it would: PER CASE, via `automated_by`, not per file. A case with
# `automated_by` is run by that file in CI; a case without one is still a
# checklist a human works through, and most of them are.
#
# WHAT THIS DOES NOT CLAIM. Five cases are automated out of twenty-four. The
# ledger's job is unchanged — it stops implying every case is unautomatable, and
# it must not start implying the opposite. The first four were chosen because
# each had already escaped into main and been caught by a person looking (O80's
# evidence); the fifth arrived with the surface it guards (O81).
#
# SEEDED FROM VERIFIED BEHAVIOUR, NOT INVENTED. Every case below cites a
# backlog close note recording something that was actually observed working.
# Those observations are currently trapped in commit messages, where they
# cannot be re-run; this file is where they become durable. A case with no
# `source` is a case nobody has ever seen pass.
#
# COVERAGE IS PARTIAL AND SAYS SO: 9 of 13 areas seeded (3 of 12 when this file
# was written). The rest are declared with `cases: []` so the gap is a visible
# number rather than an absence, and the guard pins it.
# =============================================================================

schema: drydocs.ui-tests.v1
classification: Internal-Public
updated: 2026-08-31

# --- joins -------------------------------------------------------------------
component_ledger: config/taxonomy/ui-components.yaml   # component -> module
module_registry: web/src/modules/registry.ts           # the canonical module ids
execution: mixed                                       # per-case; see automated_by

# --- runners (O80) -----------------------------------------------------------
# Named here so `automated_by` can cite one and the guard can check the file
# exists. Both run in CI's `web` job and block a merge the way ruff does.
runners:
  vitest: web/vitest.config.ts        # pure modules, no browser
  playwright: web/playwright.config.ts  # the browser path, against real servers

suites:
  # ---------------------------------------------------------------------------
  - id: TS-SHELL
    module: shell               # not a registry module: the frame every module renders in
    description: >
      Cross-module shell behaviour — theming, layout cascade, and the chrome
      that is shared by every route. A regression here shows up everywhere at
      once, which is why it is its own suite rather than repeated per module.
    cases:
      - id: TC-SHELL-01
        description: Tailwind utilities are not out-cascaded by the global reset
        steps:
          - Open any module route.
          - Inspect a component that sets padding via a Tailwind utility class.
        expect: >
          The utility wins. Preflight's reset is retained for box-sizing only —
          an unlayered `* { padding: 0 }` out-cascades layered Tailwind
          utilities and silently flattens spacing across the whole console.
        source: "O36 close note — root cause found and fixed 2026-07-29"

      - id: TC-SHELL-02
        description: Both themes render correctly
        steps:
          - Load the console in light theme, then toggle to dark.
        expect: >
          Both themes render without unstyled or invisible elements. The
          viewer's system preference is the default and the manual toggle wins
          over it (site-plan §2).
        source: "O35-O41 close note — both themes screenshot-checked 2026-07-29"

      - id: TC-SHELL-03
        description: Radius tokens are consistent
        steps:
          - Compare corner radii across cards, chips and panels.
        expect: "Radii come from tokens; `lg` is collapsed onto `md` (10px)."
        source: "O37 close note — App.css/index.css radii tokenized"

      - id: TC-SHELL-04
        description: React Flow chrome themes with the page — dark mode reaches the controls rail and the attribution
        steps:
          - Open any graph canvas (/ownership, /explorer, /lineage) in dark mode.
          - Check the zoom rail at bottom-left and the attribution chip at bottom-right.
          - Tab to a zoom-rail button and confirm the focus ring.
          - Switch to light mode and re-check both.
        expect: >
          Rail buttons sit on the --panel/--panel2 tokens (dark #121e2e, light
          white), the attribution background is transparent, and the keyboard
          ring (2px --blue-br outline) is visible against the dark panel. The
          theming rides the library's own --xy-* custom properties set on
          .react-flow (index.css) — direct rules on the library's classes LOSE
          the cascade to @xyflow/react/dist/style.css, which component modules
          import later than index.css, so its light defaults (#fefefe buttons)
          win in BOTH themes and light mode masks the defect. Any future
          React Flow chrome styling goes through the variables, never direct
          rules.
        source: "O65 fix 2026-08-21 — laptop, headless Chrome vs Vite :5199: computed-style probes (btn bg #121e2e dark / white light, attribution transparent) + keyboard-Tab focus-ring probe + screenshots both themes"

      - id: TC-SHELL-05
        description: A valid secret signs in and the shell replaces the sign-in screen
        steps:
          - Open the console signed out.
          - Choose a persona, enter its secret, submit.
        expect: >
          The sign-in heading goes away and the module nav renders. The secret is
          checked by drydocs-api, not by the browser — so this exercises all three
          processes (browser, Vite, API) and fails if any of them is misconfigured.
        source: "O80 build 2026-08-31 — desktop, Playwright/Chromium against Vite :5273 + drydocs-api :8011, no graph"
        automated_by: web/e2e/console.spec.ts

      - id: TC-SHELL-06
        description: A wrong secret is refused and the console stays signed out
        steps:
          - Open the console signed out.
          - Choose a persona, enter an incorrect secret, submit.
        expect: >
          The sign-in screen stays up and no module nav appears. The refusal is the
          SERVER's — this is the one case in the ledger whose verdict the client
          does not decide — and without it the case above would pass against a
          login that accepted anything.
        source: "O80 build 2026-08-31 — desktop, Playwright/Chromium; API returned 401"
        automated_by: web/e2e/console.spec.ts

  # ---------------------------------------------------------------------------
  - id: TS-LOADS
    module: loads
    description: Loader run timeline, stat tiles and their filter interaction.
    cases:
      - id: TC-LOADS-01
        description: Stat tiles filter the timeline when clicked
        steps:
          - Open /loads.
          - Note the run count shown in the timeline.
          - Click the "Failed" stat tile.
        expect: >
          The timeline filters to failed runs only and the visible count drops
          accordingly (observed 4 -> 1 on the sample data). Clicking again
          clears the filter.
        source: "O40 close note — click-to-filter live on loads, 4->1 verified"

      - id: TC-LOADS-02
        description: Run status uses the shared status vocabulary
        steps:
          - Open /loads and compare status chips against the Explorer inspector.
        expect: >
          Both surfaces render the same status vocabulary through StatusChip —
          Ready / Failed / Processing / Pending / Not Scheduled — with no
          module-local spelling.
        source: "O41 close note — status-vocab map adopted inspector + loads"

  # ---------------------------------------------------------------------------
  - id: TS-SOFTWARE
    module: software
    description: >
      The /software ledger: vendor -> product -> corpus -> graph, with gate state
      and the withheld-edge ruling visible per row. SEEDED WITH ONE CASE ONLY,
      deliberately: that is the one behaviour actually watched at the Q16 build,
      and a case nobody has seen pass does not belong here. The declared-vs-loaded
      and independent-chip behaviours are asserted Python-side instead
      (tests/unit/test_docs_coverage.py), which is where the same status ladder
      lives; re-seed here from in-browser observation when the page is next opened.
    cases:
      - id: TC-SOFTWARE-01
        description: Vendor icons resolve, and the near-miss fails SILENTLY rather than loudly
        steps:
          - Serve the console (npm run dev) and request /vendor-icons/neo4j.svg.
          - Request the same path RELATIVE to the route: /software/vendor-icons/neo4j.svg.
        expect: >
          The absolute path returns 200 image/svg+xml. The relative path returns
          200 text/html - the SPA index fallback, NOT a 404. That is the whole
          point of the case: render_software_registry.py writes `asset` WITHOUT a
          leading slash, so an <img> using it verbatim on /software silently
          receives HTML with a 200 status and renders broken, producing NO failed
          request and NO console error. VendorIcon.tsx therefore prepends the
          slash. A future refactor that "simplifies" that away will look fine in
          the network tab and be wrong on screen.
        source: "Q16 build 2026-08-07 - verified against the Vite dev server (curl, both paths)"

      - id: TC-SOFTWARE-02
        description: The SNOW gloss renders WHOLE - the case that validates the layout
        steps:
          - Open /software and select the Acronyms tab.
          - Read the SNOW row end to end, in dark and in light.
        expect: >-
          The full sentence "ServiceNow - the ITSM/CMDB platform. NOT Snowflake."
          renders with no truncation, no ellipsis and no tooltip, and its note
          wraps onto a second line beneath it rather than clipping. The warning
          IS the entry - an ellipsis here deletes the only thing it exists to
          say. AIS and DPL are two words each and look fine under any layout,
          so a design checked only against them proves nothing.
        source: "O68 build 2026-08-27 - watched in Chrome against the Vite dev server, dark and light"

      - id: TC-SOFTWARE-03
        description: A date never breaks across two lines
        steps:
          - Open the Acronyms tab at a normal desktop width.
          - Read the Added column.
        expect: >-
          Each date renders on ONE line. Found failing at the first build: the
          expansion column took all the slack, squeezed Added, and 2026-07-21
          broke after the hyphen into two lines. Fixed with table-fixed plus a
          colgroup and whitespace-nowrap, so long glosses grow in LINES instead
          of stealing width from the narrow columns.
        source: "O68 build 2026-08-27 - observed broken, fixed, re-observed in Chrome"

      - id: TC-SOFTWARE-04
        description: Add drafts an ARTIFACT and writes nothing
        steps:
          - Acronyms tab -> "Add an acronym...".
          - Type a term that already exists (try lower-case "snow").
          - Replace it with a new term, fill expansion, source and rationale, draft it.
          - Press "Download YAML snippet".
        expect: >-
          The duplicate is caught case-insensitively - "snow" is normalized to
          SNOW, the warning names it, and the draft button stays disabled. The
          button is also disabled until expansion, source AND rationale are all
          non-empty. A valid draft lands in a tray; downloading yields a YAML
          snippet carrying the drafter, the date, the per-entry rationale as a
          comment, and a paste-ready block - and NOTHING is written server-side.
          The registry is authored through git (gate ui-write-surface, O20).
        source: "O68 build 2026-08-27 - drafted MFT in Chrome; the blob was captured and round-tripped through yaml.safe_load and the renderer's validator, which accepted it unchanged"

      - id: TC-SOFTWARE-05
        description: Every acronym shows its provenance, and one with none cannot exist
        steps:
          - Read the Source and Added columns on every row.
          - Try adding an entry to the registry with no `source:` and re-render.
        expect: >-
          Every row states who said so and when. The provenance used to live in
          a YAML COMMENT - visible to a reader, invisible to every tool - so the
          page could have shown three sourced entries and a fourth with nothing,
          indistinguishable. O68 clause (d) made it structured, and the renderer
          now REFUSES an entry missing expansion, source or added
          (tests/unit/test_software_registry.py::test_acronym_without_provenance_is_rejected).
        source: "O68 build 2026-08-27 - guard written and run; page columns read in Chrome"

  # ---------------------------------------------------------------------------
  - id: TS-LOADMAP
    module: loadmap
    description: >
      The /load-map console lens on the generated load-map.json (O57): the
      registry sources, systems, canonical sequence, retired ids, and BOTH
      declared defect lists. Seeded from in-browser observation at the build
      itself rather than from a commit message, which is the whole point of
      this ledger.
    cases:
      - id: TC-LOADMAP-01
        description: Every collection in the JSON reaches the page, and the counts match it
        steps:
          - Open /load-map as a steward or admin persona.
          - Read the six stat tiles.
          - Compare each against web/src/generated/load-map.json.
        expect: >
          The tiles report sources / systems / sequence steps / retired ids /
          ad-hoc commands / declared defects, and every number equals the length
          of its array in the committed JSON (observed 30 / 16 / 19 / 17 / 2 / 4).
          The numbers are NOT hard-coded anywhere - tests/unit/test_load_map_console.py
          recomputes them from the JSON, so a regenerated file moves the page
          and the guard together.
        source: "O57 build 2026-08-20 - desktop, Vite dev server, ?as=asmith7734, screenshot in the close"

      - id: TC-LOADMAP-02
        description: The two defect lists render as defects instead of being dropped
        steps:
          - Open /load-map and select the Defects tab.
        expect: >
          Both generator-computed lists appear with their WRITTEN REASONS in
          full - "Loaders with no registry source" (observed 1: manual_seal_attribution.v1)
          and "Map entries whose source is unregistered" (observed 3, incl.
          dl-contact-point carrying the N8 no-feed-by-design exemption). The
          reason text is rendered, not truncated: an exemption that cannot be
          read cannot be argued with.
        source: "O57 build 2026-08-20 - desktop, Vite dev server, Defects tab screenshot in the close"

      - id: TC-LOADMAP-03
        description: The page and /software partition the file with no overlap and no gap
        steps:
          - Note the source count on /load-map.
          - Note the corpus count on /software's Corpora tab.
          - Add them and compare with the length of `sources` in load-map.json.
        expect: >
          The two sum to the full array (observed 30 + 8 = 38). Both filter on
          the same `home` key in opposite directions, so no row can appear on
          both pages or on neither.
        source: "O57 build 2026-08-20 - desktop, counts read off both pages; the sum is pinned Python-side"

  # ---------------------------------------------------------------------------
  - id: TS-OWNERSHIP
    module: ownership
    description: >
      SEAL->PAT->team rollup + asset search. Seeded at O66 (2026-08-21), the
      relationship-label readability fix — in-browser verification on the fix
      itself, per the ledger's seeding rule.
    cases:
      - id: TC-OWNERSHIP-01
        description: Every relationship name on the K4 rollup is readable, in both themes
        steps:
          - Open /ownership (Rollup (K4 shape) view) in dark mode, then light.
          - Read every relationship name along the left-to-right chain.
        expect: >
          All eight names (HAS_PRODUCT_LINE, HAS_PRODUCT, HAS_AREA_PRODUCT
          (planned), SUPPORTS, WAS_ATTRIBUTED_TO (developed_by), both
          QUALIFIED_ATTRIBUTIONs, HAD_ROLE) render as overlay chips ON TOP of
          the layout — the shared RelEdge component (components/RelEdge.tsx),
          which the explorer and lineage canvases also use, with an explicit
          zIndex above the node layer. Built-in SVG labels paint UNDER nodes
          and clipped there before the fix. Left-to-right direction and
          arrowheads preserved; the EXAMPLE DATA · ILLUSTRATIVE banner is
          untouched; edge MEANING is K4's gate-confirmed shape and never moves
          with a rendering pass.
        source: "O66 fix 2026-08-21 — laptop, headless Chrome vs Vite :5199, both themes screenshot-checked (chips z-index 10 probed on all three graph canvases)"

      - id: TC-OWNERSHIP-02
        description: The relationship chips and the node names are readable AT THE SAME TIME — neither is painted over the other
        steps:
          - Open /ownership (Rollup (K4 shape) view) in dark mode, then light.
          - Read every relationship name AND every node name, at the default view and again after the canvas Fit control.
        expect: >
          Both halves of the picture survive. O66 put the chips above the node
          layer and thereby moved the damage rather than removing it: the chips
          then covered the node names (BusinessApplication rendered as
          inessApplication). The cause is GEOMETRY — ownership's column pitch
          (185-220px) is close to the node width (max-w-56 = 224px), so a chip
          drawn at the path midpoint lands inside a neighbouring box, and any
          z-index pass only chooses which text is destroyed. RelEdge now
          measures its own chip, reads the real node rects from the ReactFlow
          store, and walks the chip out along the edge's perpendicular to the
          first position that intersects nothing; a midpoint that is already
          clear does not move, which is why the bezier canvases are unchanged.
          Check the six names O77 pinned: LOB-R (synthetic), Ledger Services
          (line), Ledger Analytics, Data Platforms (ToT), Team Nightowl, and
          the BusinessApplication kind line. Direction, arrowheads and the
          EXAMPLE DATA banner are untouched — edge MEANING is K4's
          gate-confirmed shape and never moves with a rendering pass.
        source: "O77 fix 2026-08-28 — desktop, Chrome vs Vite :4173 against drydocs-api :8002, both themes. Measured, not eyeballed: a DOM probe of chip rects against node rects reported 7 of 8 chips colliding over 2516px2 before the fix and 0 chips / 0px2 after, holding through Fit and in both themes; /lineage (7 chips) and /explorer (5 chips) re-probed at 0 collisions for regression."

  # --- declared, not yet seeded ----------------------------------------------
  # Present so the coverage gap is a number, not an absence. Seed each from
  # verified behaviour when that module is next worked on — never by inventing
  # cases that nobody has watched pass.
  - id: TS-EXPLORER
    module: explorer
    description: >
      Explorer tower/app drill-down + inspector, and the location map it renders
      (web/src/components/map). Seeded at O80 by the unit runner rather than by a
      browser case — the defect below was in a PURE module, which is why no
      Python guard could see it and why a unit test is the right shape for it.
    cases:
      - id: TC-EXPLORER-01
        description: Every location row is either placed on the map or reported as unplaceable
        steps:
          - Resolve a set of rows covering each failure mode (no country, unknown
            country, no city, unknown city) plus the two synthetic fixture cities.
        expect: >
          Nothing vanishes: each row is either a placed site or an entry in
          `unplaceable` carrying its reason, and placed + unplaceable equals the
          input count. The synthetic cities in particular MUST place — they carry
          a country alias rather than a numeric id, and keying the index on one
          while looking up with the other made the one class of row that exists so
          an empty graph still draws something the only class that could not be
          drawn. A missing dot reads as "nothing there", which is a different and
          worse claim than "we could not place this".
        source: "Z5 defect, found by rendering the tab 2026-08-27; locked in by unit tests at O80 2026-08-31"
        automated_by: web/src/components/map/resolve.test.ts
  - { id: TS-LINEAGE,     module: lineage,     description: "Lineage source->target DAG canvas.", cases: [] }
  - id: TS-RUNBOOKS
    module: runbooks
    description: >
      Data-series provisioning chain views. Seeded at O81 by the NVL series
      canvas — the first case here asserts what the canvas may DRAW, which is a
      claim about the graph rather than about pixels, so it is unit-testable.
    cases:
      - id: TC-RUNBOOKS-01
        description: The series canvas draws only the hops its spec walked
        steps:
          - Open /runbooks and select the Series graph tab.
          - Compare the drawn hops against runbooks.series.v1's own Cypher.
        expect: >
          Job -INVOKES-> ETL process, and process -WRITES_TO-> asset where the
          row landed one. Nothing else: the canvas rebuilds the pattern the
          reviewed spec walked and never a hop it did not. The job edge reads
          INVOKES, not TRIGGERS — G89 moved the spec onto the edge a loader may
          actually write, and the picture follows the spec. Zero rows renders the
          honest empty state, which is the expected result until the curated
          lineage load runs.
        source: "O81 build 2026-08-31 — desktop; mapper unit-tested, canvas rendered against the live API"
        automated_by: web/src/lib/nvl-mapping.test.ts
  - { id: TS-REMEDIATION, module: remediation, description: "Finding -> fix-batch flow.", cases: [] }
  - { id: TS-DOCS,        module: docs,        description: "Document->Chunk corpus map (Q13/Q15 will extend this).", cases: [] }
  - id: TS-GATES
    module: gates
    description: >
      Gate dependency graph + gate log, rendered read-only from the generated
      gates.json (O19). Seeded at O80 because this page is the console's one
      module that renders entirely from a committed artifact, which makes it the
      only module a browser test can assert against with no graph running.
    cases:
      - id: TC-GATES-01
        description: The page reports the gate record's own count
        steps:
          - Sign in and open /gates from the module nav.
          - Read the count in the table hint.
        expect: >
          The count equals the length of `gates` in web/src/generated/gates.json.
          The assertion is COMPUTED from that artifact rather than pinned to a
          number, so grooming the gate record moves the page and the test together
          and only a page that stopped reading the artifact fails.
        source: "O80 build 2026-08-31 — desktop, Playwright/Chromium; 108 gates at the build"
        automated_by: web/e2e/console.spec.ts
  - { id: TS-UNDERHOOD,   module: underhood,   description: "Benchmark showcase surfaces.", cases: [] }

  # ---------------------------------------------------------------------------
  - id: TS-ASK
    module: ask
    description: >
      Agent Q&A spoke: streamed steps, citations, metrics chip. Seeded at O64
      (2026-08-21), the last-turn persistence fix. VERIFICATION CAVEAT, stated
      because source rows must not overclaim: the completed turn in these runs
      was SEEDED into browser-local storage (the agent stack was not run
      end-to-end on the verifying machine); the write site was verified by
      code-read plus the failed-ask negative case, which left storage
      untouched. An end-to-end completed-ask run upgrades these sources when
      the stack is next up.
    cases:
      - id: TC-ASK-01
        description: The last completed turn survives navigating away and back
        steps:
          - Complete a turn on /ask (or seed drydocs.ask.last-turn.v1.<personaId>).
          - Navigate to /explorer via the aside (SPA navigation, no reload).
          - Navigate back to /ask the same way.
        expect: >
          The question as asked and the answer as returned render instead of
          the empty panel — AskRoute unmounts on route change and previously
          lost the turn (the reported data-loss defect). One completed turn
          per persona, browser-local storage for this phase. A restored turn's
          explore-ref still offers Open in Explorer, and a dead ref degrades
          VISIBLY (SpecGrid's unavailable notice + empty state) while the turn
          itself keeps rendering.
        source: "O64 verification 2026-08-21 — laptop, headless-Chrome harness vs Vite :5199, agent stack down: restoredOnLoad / restoredAfterSpaNav / expiredRefDegradesVisibly all true, screenshots in the close"
      - id: TC-ASK-02
        description: In-progress and failed turns are never persisted
        steps:
          - With the agent stack down, ask any question and watch it fail.
          - Inspect drydocs.ask.last-turn.v1.<personaId>; navigate away and back.
        expect: >
          The failure renders honestly in-session, storage still holds only
          the prior COMPLETED turn, and after navigation the failed turn is
          gone while the completed one is restored — a spinner no request is
          behind and a stale error re-presented as current are both worse
          than the empty panel.
        source: "O64 verification 2026-08-21 — laptop, headless-Chrome harness vs Vite :5199: failedTurnShown / failedTurnNotPersisted / failedTurnGoneAfterNav / completedTurnBackAfterNav all true"
      - id: TC-ASK-03
        description: Switching persona shows that persona's turn, or nothing
        steps:
          - With a turn stored for one persona only, open /ask as the other persona.
          - Switch back to the first.
        expect: >
          The second persona gets the empty ask panel (never the first's
          turn); the first gets their own turn back. Storage is keyed per
          persona; an in-place persona swap (?as=) re-derives the list on
          render, and a sign-out/sign-in remount re-reads storage.
        source: "O64 verification 2026-08-21 — laptop, headless-Chrome harness vs Vite :5199: otherPersonaSeesNothing / ownerPersonaSeesTheirTurn true, jdoe4821-empty screenshot in the close"
