      (defined by the SYNTHETIC fixtures, adjust when a real sample validates it
      — the dpl_mac discipline)"), and the gate page's own provenance block
      records the same ("field contract ASSUMED until a real export validates").
      REVISIT TRIGGER IS A NAMED TRACKER, not a hope: T13 (docs/port-prompt.md) —
      "DPL registry field contract validated vs a REAL per-SEAL export
      (pipeline_id.json/dataset_id.json)", status pending (producer belief, as of
      2026-08-01). A real Swagger export may well carry createdBy /
      lastModifiedBy; until one parses, claiming either an envelope OR its
      permanent absence would be a guess. Stub is the state that says so.
      PRECEDENT, verified rather than taken on the page's word: autosys:export
      and airflow:dag-export are both confirmed: true from signed crosswalk gates
      while their audit entries read that native audit columns are unknowable
      until a live export exists — confirmed source, stub envelope, loader
