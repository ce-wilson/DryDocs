  - id: "exec-hosts:rua-bundle"
    status: stub                             # RULED stub: meta.txt is a CAPTURE envelope, not authorship (gate rua-load-shapes §D4, 2026-08-06)
    notes: >
      Ruled 2026-08-06 (gate rua-load-shapes §D4, SME). The bundle carries no
      source-authorship columns at all. meta.txt is a COLLECTION envelope —
      collected_at/collected_by are excluded under the standing CAPTURE_DATE
      rule (replication time, never authorship; gate controlm-q1q3-phase1), and
      the remaining keys (user/uid/groups/shell/host/fqdn/os/kernel/scan_roots)
      describe the CAPTURE RUN, not the artifact's author.
      The two per-file candidates were considered and BOTH rejected: mtime is
      when the inode was last written on that host, which a deployment cp
      resets, so it is a DEPLOY timestamp — §E1 of the same gate ruled that
      presence is a deployment fact and nothing more, and mtime inherits that
      limit exactly; owner is an ACL fact and not the changer (it is the §C1
      directory_owner input, never source_updated_by). Both stay PLAIN
      PROPERTIES, the same disposition AUTHOR has on the Control-M entry.
      Revisit trigger: none foreseen from this source — a bundle can only ever
      report filesystem metadata. Authorship for these scripts lives on the
      code-repo side (bitbucket:repo-objects-manifest), whose own entry is a
      §J precondition and is NOT ruled by §D4.

  - id: "bitbucket:repo-objects-manifest"
    status: stub                             # RULED stub: the manifest is a POINTER into git history, and its one date is a ref-tip fact (gate rua-load-shapes §J, 2026-08-07)
    notes: >
      Ruled 2026-08-07 (gate rua-load-shapes §J, SME) — the entry §D4 named as a
      sign-off precondition and deliberately left unruled there.
      The manifest contract carries repo / ref / commit / commit_date / path /
      blob_sha and NO author field of any kind (a `git rev-list --all --objects`
      sweep plus ref tips returns object ids, never authorship).
      THE ONE DATE IS NOT WHAT IT LOOKS LIKE, and that is this ruling's
      substance: a manifest row is one (ref-tip, path) pair, so `commit_date` is
      the TIP's date — code_repo.corroborate() ranks refs by it to name
      candidate_ref mechanically. It records when the BRANCH last moved, not when
      the FILE changed, so source_updated_at would assert a change date belonging
      to some unrelated commit that happened to touch another file. That is
      precisely the mtime error §D4 rejected on the rua side, arriving through a
      different column.
      WHY THE REASON DIFFERS FROM THE repo:* STUBS IT RESEMBLES
      (repo:software-registry / repo:design-docs / repo:depgraph-snapshot): for
      OUR OWN repo, "git IS the audit trail" is true AND reachable — git blame
      answers who and when. Here the envelope lives in a Bitbucket/GitHub repo
      DryDocs never holds; the manifest is deliberately a POINTER across the
      company boundary, so the envelope exists but is OUT OF REACH rather than
      absent. Same status, different reason, and the difference is what makes the
      revisit trigger real.
      REVISIT TRIGGER (unlike the rua entry, this one is foreseeable): the
      manifest contract is OURS to specify. If the company tooling adds author /
      author_date columns — or resolves the per-path LAST-TOUCHING commit rather
      than the ref tip — the envelope becomes available and this entry is
      re-gated.

