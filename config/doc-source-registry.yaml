  - id: adhoc-sme-email
    classification: Internal              # real threads carry named individuals, internal addresses, SEAL ids, functional ids
    source: "SME-compiled email threads and their attachments, saved company-side under internal/ — one :Document per email, never a corpus per email"
    connector: email
    manifest: ~                           # no capture manifest — there is no connector; each Document records its own custodian + digest (gate §D4)
    trust_default: VERBATIM               # the document is the SME's own words, stored as sent
    tier: T4
    curation: sme-confirm                 # T4 ladder (ADR 0006 §4)
    target_db: drydocs                  # G102 fold (was ddcontext — folded 2026-08-18; content realm is now the one database)
    refresh: manual
    taxonomy_path: ~
    graph_locator:                        # nothing has loaded — no connector exists; locator lands with the first citation write
      match: none
      value: ~
    confirmed: false                      # SHAPE signed 2026-08-09; stays false because no loader exists — see the reason note below
    notes: >
      THE LANDING ZONE for one-time evidence that arrives as email: a fact
      an SME compiled by hand, for a review, with no system of record behind
      it and no pipeline planned. Registering one corpus (rather than one per
      email) keeps the ledger a ledger instead of an inbox.
      GATE SIGNED 2026-08-09 (software-version-context §D1–§D5; C25,
      config/gate-log.md). Everything §D proposed was confirmed as drafted, so
      the shape below is now RULED rather than proposed. `confirmed:` stays
      false for a DIFFERENT reason than before: it no longer means "awaiting
      the SME", it means no loader exists — the gate authorized the shape and
      explicitly built nothing. The flip belongs to the adhoc loader's own
      build, not to this gate.
      §D2 RULED (a): evidence attaches to each version edge by PROPERTY
      POINTER, `evidence_doc_id`. Not a node-grain HAD_PRIMARY_SOURCE edge —
      that would assert the fid was sourced from the email, not that a
      particular VERSION claim was. Reification (:SoftwareUsage) is the named
      upgrade path if a recurring version feed ever arrives; the pointer is
      what makes that migration mechanical.
      SHAPE (gate software-version-context §D4, RULED): CITATION-ONLY —
      one :Document carrying doc_id / subject / sent_at / custodian /
      source_digest / corpus_id, with NO body text and NO :Chunk chain. The
      body carries named individuals and internal addresses, and there is no
      email connector to refetch it reproducibly; the Document→Chunk backbone
      stays available without rework if one is ever built. Raw messages and
      attachments live company-side under internal/, never in this repo.
      TRUST IS SPLIT, and the split is the point: the DOCUMENT is VERBATIM;
      FACTS DERIVED FROM IT are GROUNDED at best — these attachments are
      hand-compiled tables. KNOWN DEFECT, first instance (2026-08-04): a
      software-version table labeled a column "FID" while populating it with
      functional-id NAMES. The evidence is never edited (a corrected copy of
      an evidence document is no longer evidence); the correction is a
      MAPPING applied at load, recorded here so the next reader of that
      attachment does not repeat the misreading. See gate
      fid-identity-and-scope §F.
      SIBLING — RECONCILE BEFORE BUILDING Q10 (flagged by the user 2026-08-05,
      after this entry was registered without the cross-reference): backlog
      Q10 plans a SECOND email corpus — the failure/activity emails (.msg +
      Copilot JSON extracts) — and its acceptance is worded "a
      doc-source-registry entry declares the email corpus", singular. Whoever
      builds Q10 will find THIS entry already here and must decide EXTEND vs
      ADD rather than discover the question at build time. They are currently
      registered as two because four properties differ, not because nobody
      looked: (1) SHAPE — this one is citation-only, Q10's loads the ACTIVE
      lexical Document->Chunk backbone; (2) CADENCE — one-off SME evidence with no
      pipeline, vs a recurring operational feed with an extraction step;
      (3) RETENTION — Q10's file-server extracts become the ONLY copy after the
      6-18 month Outlook purge, so that corpus carries a backup obligation this
      one does not; (4) ASSIGNMENT — Q10 needs an email->folder/process edge
      through its own gate, this one attaches to a version fact by pointer.
      If the SME rules them one corpus, this entry folds into Q10's and the
      shape difference becomes a per-Document property — which is why the fold
      is cheap TODAY and expensive after either has loaded.

  - id: ops-email-extracts
    classification: Internal              # failure/incident email: real names, folder names, incident detail (confidential handling — the J23 collapsed tier; note per CLAUDE.md §3)
    source: "DRYDOCS_DATA_ROOT/email-extracts/ — Copilot JSON extracts beside their original .msg files, mirrored from the file-server pair (real coordinates internal-twin only)"
    connector: email
    manifest: ~                           # no capture manifest — the extract file IS the record; each Document carries msg_path + extract_path as citations
    trust_default: VERBATIM               # the extract is the sender's own words as extracted
    tier: T4
    curation: sme-confirm                 # T4 ladder (ADR 0006 §4)
    target_db: drydocs
    refresh: manual
    taxonomy_path: ~
    graph_locator:                        # the loader stamps corpus_id on :Document and :Chunk
      match: corpus_id
      value: ops-email-extracts
    confirmed: true                       # Q10 (2026-08-19): pure REUSE of the ACTIVE docs_* lexical vocabulary — the Q2/essential-graphrag covering-gate precedent (bmc-docs-lexical-load), carried per N9. The ASSIGNMENT edge is separately gated (email-folder-assignment) and stays planned.
    notes: >
      Q10 (SME source 2026-07-26): "we get emails that reference a failure or
      activity and I've extracted those as json files and save the original
      msg format... it may require an SME assigning it to a particular folder
      or process if it's not extractable from the email."
      RETENTION, AND WHY THE SOURCE PAIR MATTERS: Outlook purges at 6-18
      months, but the extracts are deliberately preserved on the file server
      until the PROCESS OR PROJECT retires — after ~18 months the file server
      holds the ONLY copy and becomes a SYSTEM OF RECORD with a backup
      obligation, not a cache. Purge is therefore project/process-scoped (a
      property-scoped delete keyed on the assignment once it exists), NEVER a
      database drop — the reason retention was no argument for a separate
      database, and unchanged by the G102 fold.
      UNASSIGNED IS A VALID RESTING STATE: an email whose folder/process is not
      extractable loads without an assignment — never rejected, never guessed.
      The assignment edge (docs_email_concerns, CONCERNS ->
      ControlMFolder | ETLProcess) is status: planned behind gate
      email-folder-assignment; and per the cm_escalation_db correction
      (2026-08-17), email evidence SUPPLEMENTS the human folder mapping — an
      assignment is aboutness, never attribution (K7 §A1 fence).
      The extract contract is ASSUMED from the synthetic samples
      (drydocs/data/samples/email-extracts/, the G47 precedent) — confirm
      against a real extract before treating field semantics as estate truth.

