# ---------------------------------------------------------------------------
# Retired corpus ids (the source-registry v2 D4 semantics, imported at the
# 2026-08-18 id-grammar rename): a retired string can NEVER be re-minted with
# a different meaning. Loaders bound to a retired id do not resolve.
retired:
  - id: bmc-controlm-utilities
    replaced_by: ["bmc-docs-controlm-utilities"]
    reason: "id-grammar rename (vendor-docs sibling form); never loaded, so no graph value carried the old string"
  - id: essential-graphrag
    replaced_by: ["neo4j-docs-essential-graphrag"]
    reason: "id-grammar rename; RETIRED AS A REGISTRY ID ONLY — the string stays LIVE in the graph as the Document's doc_id business key and in the loader's DOC_ID constant"
