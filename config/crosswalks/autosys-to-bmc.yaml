# =============================================================================
# config/crosswalks/autosys-to-bmc.yaml
#
# AutoSys (CA / Broadcom Workload Automation) -> BMC Control-M baseline crosswalk.
#
# BMC Control-M is the canonical orchestrator (config/precedence.yaml, authority 1,
# id bmc-baseline). AutoSys is NOT a new set of graph concepts: every row below maps
# a native AutoSys term onto an EXISTING baseline concept / DryDocs node. Any AutoSys
# concept with no baseline equivalent is flagged `fidelity: no-equivalent` and must be
# routed to `ontology-mapper` (never invented here) per CLAUDE.md "Onboarding a new
# orchestrator" and external/orchestration/autosys/README.md's drift warning.
#
# STOP AT THE GATE: this whole file is `status: proposed`. Nothing here authorizes a
# graph write. The row set becomes usable only after it passes the HITL gate
# (docs/restructure/03-hitl-sme-flow.md; gate spec:
# config/gate-prompts/autosys-crosswalk.yaml) and `config/source-registry.yaml`
# source id `autosys-export` is flipped to `confirmed: true`.
#
# classification: External — public AutoSys/CA-Broadcom object-model concepts (JIL
# grammar) only. No company data, no real job/box/machine names.
# =============================================================================

schema: drydocs.crosswalk.v1
updated: 2026-07-14                     # row 6 demoted exact -> approximate (machine: polymorphism)
id: autosys-to-bmc
orchestrator: autosys
baseline: bmc-controlm
classification: External
source_registry_ref: autosys-export     # config/source-registry.yaml id
narrative_ref: external/orchestration/autosys/README.md
gate_spec: config/gate-prompts/autosys-crosswalk.yaml
status: confirmed                       # gate autosys-crosswalk SIGNED OFF 2026-07-14 (config/gate-log.md)

rows:
  - n: 1
    native: "Job (`insert_job: <name> job_type: c`)"
    baseline: Job
    node: ControlMJob
    fidelity: exact
    status: confirmed
    note: "An AutoSys command/script job is a 1:1 match to a Control-M command/script job."

  - n: 2
    native: "Box job (`insert_job: <name> job_type: box`)"
    baseline: "Folder / SMART Table grouping"
    node: "ControlMFolder (Collection)"
    fidelity: approximate
    status: confirmed
    note: >
      A box groups jobs and can itself carry conditions/status like a job (box-in-box
      nesting); the baseline Folder is a pure container (a SMART Table folder can
      self-schedule but the semantics are not identical). Map box -> Folder; do NOT
      invent :AutoSysBox (CLAUDE.md onboarding guardrail; README.md line 25-26).

  - n: 3
    native: "`condition:` attribute — s(job) / f(job) / n(job) status predicate"
    baseline: "IN condition"
    node: "REQUIRES_IN_CONDITION -> Condition"
    fidelity: exact
    status: confirmed
    note: "Status-predicate dependency maps directly onto Control-M IN-condition semantics."

  - n: 4
    native: "`condition:` — d(file) file-existence predicate"
    baseline: "IN condition (file-watch variant)"
    node: "REQUIRES_IN_CONDITION -> Condition"
    fidelity: approximate
    status: confirmed
    note: >
      AutoSys file-trigger jobs are typically a distinct job_type (f/w watcher) rather
      than a plain condition predicate. Baseline equivalent is a Control-M File Watcher
      job type, not just Condition. FLAG for SME: may need a second mapped baseline
      concept (FileWatcher job), not only Condition.

  - n: 5
    native: "Job success feeding a downstream job's `condition:` predicate"
    baseline: "OUT condition / producer-consumer dependency"
    node: "EMITS_OUT_CONDITION / WAS_INFORMED_BY"
    fidelity: approximate
    status: confirmed
    note: >
      AutoSys models dependency mostly consumer-side (pull: condition predicates
      reference the upstream job by name), whereas Control-M pairs an explicit OUT
      condition on the producer with an IN condition on the consumer (push+pull). The
      downstream WAS_INFORMED_BY edge is still derivable by resolving each predicate to
      its producing job, but there is no native AutoSys OUT-condition object to read.

  - n: 6
    native: "`machine:` attribute"
    baseline: "execution host / agent — OR virtual machine (load-balanced host set)"
    node: "ExecutionHost (real machine) / ControlMHostGroup -[:CONTAINS_HOST]-> ExecutionHost (virtual machine)"
    fidelity: approximate
    status: confirmed
    note: >
      Demoted from exact (2026-07-14, SME wording review): machine: is polymorphic —
      it names either a real machine (1-hop, ExecutionHost) or an AutoSys virtual
      machine that load-balances across real machines (1-to-many). That is the same
      group-vs-host resolution the baseline models as Job -[:RUNS_ON
      {role: host_group}]-> ControlMHostGroup -[:CONTAINS_HOST]-> ExecutionHost
      (gate controlm-hosts-topology, signed off 2026-07-09). A live export must
      discriminate virtual vs real per machine: value — mirror the baseline's
      group-match-wins resolution.

  - n: 7
    native: "`owner:` attribute"
    baseline: "run-as user"
    node: AppUser
    fidelity: exact
    status: confirmed
    note: "Functional/service run-as identity, same semantics as Control-M OWNER."

  - n: 8
    native: "Calendar (`insert_calendar`, `run_calendar:` / `exclude_calendar:`)"
    baseline: "calendar (scheduling)"
    node: "job schedule properties (calendar resolution — see knowledge/standards/)"
    fidelity: approximate
    status: confirmed
    note: >
      Both vendors support named calendars with include/exclude semantics, but holiday
      shift and cyclic-date resolution rules differ per vendor grammar. Needs a
      dedicated calendar-resolution note before load, not a 1:1 field copy.

  - n: 9
    native: "Job status model (SU / FA / RU / OH / OI / IN / QU / TE / ...)"
    baseline: "job status model (SCHEDULED / EXECUTING / ENDED-OK / ENDED-NOT-OK / ...)"
    node: "ControlMJob status property"
    fidelity: approximate
    status: confirmed
    note: >
      State machines are conceptually parallel (running / success / failure / held)
      but the specific status vocabularies do not line up 1:1 (e.g. AutoSys "OH" on
      hold vs Control-M held-by-user flags). Needs an explicit value-mapping table at
      implementation time; not asserted here.

  - n: 10
    native: "Global / box-scoped variables (`profile:`, `export:` box vars)"
    baseline: "no-equivalent as a single concept"
    node: "n/a"
    fidelity: no-equivalent
    status: confirmed
    note: >
      AutoSys global variables are a box-/instance-scoped substitution mechanism.
      Control-M variables (SETVAR) use a different resolution model entirely
      (folder/job table-scoped — already the subject of the C3/C4 variable-
      normalization stream, docs/controlm/controlm-staging-ingestion-flow.md). Do not collapse
      these into one concept; any proposed variable-graph treatment routes through
      ontology-mapper, not this crosswalk.

  - n: 11
    native: "`n_retrys:` / `alarm_if_fail:` / `alarm_if_terminated:`"
    baseline: "job retry / alert properties"
    node: "ControlMJob property (no dedicated node)"
    fidelity: approximate
    status: confirmed
    note: >
      Both vendors expose retry-count and alerting flags as job properties; naming and
      threshold semantics differ and were not verified against a live AutoSys export
      (source is still a placeholder — external/orchestration/autosys/README.md).

# Fidelity gaps carried forward to the gate for explicit SME sign-off.
no_equivalent_flags:
  - row: 10
    concept: "Global / box-scoped variables"
    disposition: "Do not model as a graph concept via this crosswalk; route to ontology-mapper if a variable-graph need emerges."
open_questions:
  - row: 4
    question: "Does the file-watch job_type (f/w) need its own baseline mapping (FileWatcher job) instead of folding into Condition?"
  - row: 6
    question: "Which machine: values name AutoSys virtual machines (load-balanced host sets, 1-to-many) vs real machines? Needs the live export's insert_machine definitions — JIL docs alone cannot resolve it."
  - row: 9
    question: "What is the authoritative AutoSys status vocabulary to map against Control-M's? (needs a live export, not JIL docs alone)"
