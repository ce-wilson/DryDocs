# =============================================================================
# config/source-descriptors.yaml — THE REGISTRATION DESCRIPTOR (PoC,
# feat/source-registration-poc, 2026-09-09).
#
# WHAT THIS FILE IS. config/source-registry.yaml says WHAT a source is (system
# and dataset rows, ruled at gate source-registry-v2). config/source-bindings.yaml
# says HOW TO REACH its carrier. This file says how a dataset is REGISTERED as a
# catalog asset: five finite axes per dataset, every value drawn from a closed
# list declared below, so the same registry produces the same asset set on every
# run. Nothing here is prose a reader has to interpret — a consumer reads the
# axis value, never a comment.
#
# THE FIVE AXES. Each has a DERIVATION from the registry and an OVERRIDE table;
# the reader applies the override when a row names the dataset, the derivation
# otherwise, and refuses a value outside the axis. The derivation is written
# down so a registry edit moves the descriptor for free and an override is the
# only way to disagree with it.
#
#   acquisition  manual | automated       <- dataset acquisition.mode
#   format       csv | ascii | json | archive | db
#                                         <- acquisition.format for manual rows,
#                                            acquisition.via (db) for automated
#   authority    primary | replica        <- SOR -> primary, ADS -> replica;
#                                            a derived store has no authority
#                                            and is marked replica (it copies)
#   layer        human | business | data | technology
#                                         <- the system row's layer; the
#                                            override table moves the ONE
#                                            dataset whose subject is people
#   access       fid | human | repo       <- the credential class that reads it:
#                                            a bound carrier is read by a
#                                            functional id, a manual drop by a
#                                            person, a repo-based zone by the
#                                            checkout itself
#
# THE SYNTHETIC SECTION. Which datasets get a generated stand-in, under which
# file name in the loader's landing zone, with a fixed seed. Every generated row
# carries the `record_origin` column set to `sample`, so a fixture can never be
# mistaken for a production capture (publish boundary, CLAUDE.md §3). Themed on
# the Neo4j Matrix sample graph — names, never facts.
#
# THE DATAHUB SECTION. How the assets are emitted: the platform per system, the
# environment, the tag prefix and a FIXED observation timestamp, so the emitted
# MCP file is byte-stable across runs (determinism is a test, not a hope).
#
# THE SIXTH AXIS, `wired` (registry-wiring-readiness SIGNED 18/18 and source-descriptor-axes
# SIGNED 13/13, one sitting, 2026-09-09; the build is CFG13). Is the pipeline that reads this
# dataset BUILT on THIS side - a fact about one tree, DECLARED here per dataset and never
# derived (core cannot see loader registration, and a declared value with a reason is the
# smaller mechanism - axes page B4): `true`, or `{value: false, reason: <forty characters or
# more>}`. REQUIRED for every registry-home dataset: a missing entry, an unknown id, a bare
# false or a short reason is refused at construction, so a new row must answer before its
# first read. PER SIDE at the port (PORT-MANIFEST.yaml `per_side_fields` names `wired`) -
# per-entry is not per-side, and what is built on one tree says nothing about the other.
# `confirmed` on the registry row stays the SEMANTIC ruling only, and crosses again as the
# producer's signed WHAT on shared rows (wiring page E1). require_confirmed() refuses unless
# BOTH hold and says which failed. The load map's wiring cross and the DataHub emission READ
# this block; the guard is tests/unit/test_load_map_wiring_key.py. Counted by command at the
# build (wiring page E3), never carried: the sitting's B5 said the 21 confirmed rows declare
# true - by command, 13 rows have a loader bound and declare true, 17 declare false with
# their reason.
#
# Reader: drydocs_core/source_descriptors.py. Guard: tests/unit/test_source_descriptors.py.
# =============================================================================
schema: drydocs.source-descriptors.v1
classification: Internal-Public
updated: 2026-09-09

axes:
  acquisition: [manual, automated]
  format: [csv, ascii, json, archive, db]
  authority: [primary, replica]
  layer: [human, business, data, technology]
  access: [fid, human, repo]
  wired: [true, false]              # the sixth axis - declared per side in the wired: block below

# The authority map: registry vocabulary -> descriptor vocabulary.
authority_map:
  SOR: primary
  ADS: replica
  derived: replica

# Dataset overrides. Key = registry dataset id; value = any subset of the axes.
# Every id here must exist in the registry and every value must be on its axis.
overrides:
  "hr@[db].psgmgr.hr_phone_exp":
    layer: human            # the subject is people, whatever carrier holds it
  "pat:people-report":
    layer: human            # people and their team roles

# The wired block: one entry per registry-home dataset, keyed by id (see the header). A
# true is bare; a false is a mapping with its reason. Declared for THIS side's tree.
wired:
  "controlm@[db].psgmgr.cm_def_vtab": true
  "controlm@[db].psgmgr.cm_def_vjob": true
  "controlm@[db].psgmgr.cm_def_lnki_p_vw": true
  "controlm@[db].psgmgr.cm_def_lnko_p_vw": true
  "controlm@[db].psgmgr.cm_def_setvar_vw":
    value: false
    reason: "no loader in LOADER_REGISTRY binds this id on this side; the meaning is signed (controlm-q1q3-phase1, the C3/C4 normalization gates) and the loader for the variable view is not built"
  "controlm@[db].psgmgr.cm_hosts": true
  "controlm@[db].psgmgr.cm_avg_run":
    value: false
    reason: "no loader in LOADER_REGISTRY binds this id on this side; the meaning is signed (controlm-avg-run-supplement, 2026-07-14) and the P4 run-stats loader exists company-side only, a back-flow candidate here"
  "controlm@[db].psgmgr.cm_hist_vw":
    value: false
    reason: "no extractor or loader is built; the run-history feed is planned (jobrun-observation mapping, status proposed)"
  "hr@[db].psgmgr.hr_phone_exp":
    value: false
    reason: "no loader is built; the meaning is signed (K17, 2026-08-19, 33/33) and the build is K26 - this entry flips there, in the same commit as the flag (N13)"
  "seal@[db].psgmgr.cm_escalation_db":
    value: false
    reason: "no extractor or loader, by design; registered as the replica GRAMMAR's worked example (the id shape) for a future feed"
  "controlm:deftable-xml-export":
    value: false
    reason: "the G47 extractor stages only and no loader is bound; the precedence ruling against the psgmgr replica datasets (D11, controlm-definition-precedence, armed 2026-09-07) is open"
  "autosys:export":
    value: false
    reason: "the crosswalk is signed (autosys-crosswalk, 2026-07-14); the loader is unbuilt and separately gated, and no AutoSys export is ingested on this side"
  "airflow:dag-export":
    value: false
    reason: "the crosswalk is signed (airflow-crosswalk, 2026-07-14); the loader is unbuilt and separately gated, and no Airflow DAG export is ingested on this side"
  "seal:app-extract": true
  "pat:product-catalog": true
  "pat:people-report": true
  "snow:cmdb-ci-classes":
    value: false
    reason: "no loader is built; the class export is a header-only sampled capture and no gate has ruled its meaning yet"
  "repo:software-registry": true
  "repo:depgraph-snapshot": true
  "repo:design-docs": true
  "exec-hosts:rua-bundle":
    value: false
    reason: "the G20 extractor stages only; the curated load is G23 and the adapter stays unset - G22 (2026-08-07) is authority to load, not a loader"
  "dpl:pipeline-registry":
    value: false
    reason: "the G25 extractor stages only and no loader is bound; the field contract is still assumed (T13) and the drop is a hand-exported Swagger file"
  "dpl:dataset-registry":
    value: false
    reason: "the G25 extractor stages only and no loader is bound - the same condition as its sibling dpl:pipeline-registry"
  "catalog@[db].[schema].datasets_v":
    value: false
    reason: "the G42 extractor stages only and no loader is bound; the activation gate snowflake-data-catalog is DEFERRED (2026-09-07) to the Logical Container trigger"
  "catalog@[db].[schema].distributions_v":
    value: false
    reason: "the G42 extractor stages only and no loader is bound - the same activation condition as the datasets view"
  "bitbucket:repo-objects-manifest":
    value: false
    reason: "the G24 extractor stages and corroborates only; no loader is bound (G22 ruled identity and grain, not a loader)"
  "oracle:schema-inventory":
    value: false
    reason: "no extractor or loader; the ingestion pipeline is planned (see backlog) and no gate has ruled the per-schema split"
  "snowflake:schema-inventory":
    value: false
    reason: "no extractor or loader; an expansion placeholder with no pipeline planned yet on this side"
  "controlm@[db].drydocs_stg.stg_app_fact": true
  "infra:server-export": true

datahub:
  env: PROD
  tag_prefix: drydocs
  # ISO-8601 UTC, applied as systemMetadata.lastObserved on every aspect; fixed
  # so two runs over one registry emit one file.
  observed_at: "2026-09-09T00:00:00Z"
  # DataHub dataPlatform per SYSTEM row. Unlisted systems fall to `default`.
  platforms:
    default: file
    psgmgr: oracle
    oracle: oracle
    drydocs-stg: oracle
    snowflake: snowflake
    catalog: snowflake
    repo: git
    bitbucket: git
    seal: file
    pat: file
    snow: file
    infra: file
  # DataHub Lite sink (a DuckDB file) — path relative to DRYDOCS_DATA_ROOT.
  lite_file: datahub/drydocs-lite.duckdb

synthetic:
  seed: 1999                  # the year the first film released; any int works
  theme: matrix
  record_origin_field: record_origin
  record_origin_value: sample
  # The gzip bundle checked into the repo (never-port). Extracted on demand;
  # tests skip when it is absent.
  bundle: drydocs/data/samples/synthetic-sources.json.gz
  # DuckDB file the extracted CSVs are loaded into — relative to DRYDOCS_DATA_ROOT.
  duckdb_file: synthetic/drydocs-synthetic.duckdb
  # Row counts, one knob per generated table.
  rows:
    applications: 12
    contacts_per_application: 2
    teams: 6
    roles_per_team: 2
    servers_per_application: 2
    folders: 4
    jobs_per_folder: 5
    hosts: 6
    ci_classes: 8
  # Which datasets are generated, and the files each produces. `file` is the
  # SOURCE-mode name the loader reads (chain step name + .csv); a db-carried
  # dataset gets a CSV MIRROR under `mirror_dir` (relative to DRYDOCS_DATA_ROOT)
  # instead of a landing zone, because a replica table has no drop directory.
  mirror_dir: psgmgr-mirror
  datasets:
    "pat:product-catalog":
      files: [catalog_lobs.csv, product_lines.csv, products.csv, pat_product_mapping.csv]
    "pat:people-report":
      files: [dev_teams.csv, pat_team_roles.csv]
    "seal:app-extract":
      files: [seal_applications.csv, seal_contacts.csv]
    "infra:server-export":
      files: [server_inventory.csv]
    "snow:cmdb-ci-classes":
      files: [cmdb_ci_classes.csv]
    "controlm@[db].psgmgr.cm_def_vtab":
      files: [controlm_folders.csv]
    "controlm@[db].psgmgr.cm_def_vjob":
      files: [controlm_jobs.csv]
    "controlm@[db].psgmgr.cm_def_lnki_p_vw":
      files: [controlm_conditions_in.csv, controlm_dependencies.csv]
    "controlm@[db].psgmgr.cm_def_lnko_p_vw":
      files: [controlm_conditions_out.csv]
    "controlm@[db].psgmgr.cm_hosts":
      files: [controlm_hosts.csv]
