  # STAGING-ONLY until the controlm-avg-run-supplement gate confirms the
  # landing: timing PROPERTIES onto existing :ControlMJob nodes + derived
  # folder windows — NO new labels/edges (opt-in supplement pattern). Use
  # case: maintenance-window planning + TDQ-failure ETA (critical-path).
  # ---------------------------------------------------------------------------
  - name: CM_AVG_RUN
    kind: table
    profile:
      profiled_on: ~
      via: >
