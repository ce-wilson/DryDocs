      - {name: TABLE_ID, disposition: projected, origin: source, target: "staging:folder_id",
         note: "join key to CM_DEF_VJOB/CM_DEF_VTAB context; the raw SQL Developer export mislabels this column TABLE_NAME (drydocs_core/models/controlm.py ControlMVariableRow handles both aliases)"}
