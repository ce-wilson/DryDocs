  - name: CM_DEF_SETVAR_VW
    kind: view
    profile:
      profiled_on: ~
      via: "sql/controlm_variables.sql header + docs/restructure/06a (object name CONFIRMED 2026-07-10 against live psgmgr; full controlm-db skill column census still pending)"
      column_count: ~
      census: pending
    note: >
      Object name confirmed 2026-07-10 (psgmgr.CM_DEF_SETVAR_VW); full column
      census still pending the controlm-db skill profile (doc 08 Phase 2). The
      extract also joins CM_DEF_VJOB (TABLE_ID, JOB_ID) and CM_DEF_VTAB (TABLE_ID)
