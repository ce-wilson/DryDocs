  - name: CM_DEF_LNKI_P_VW
    kind: view
    profile:
      profiled_on: 2026-08-24
      via: >
        Read-only catalog census (ALL_TAB_COLUMNS + row count), live psgmgr,
        internal session 2026-08-24 — conclusions transcribed producer-side,
        no data values read. 12 columns — all 12 dispositioned
        below, sweep empty (06a's DDL check holds exactly); 1,293,560 rows at
        census time. Probe sql/adhoc/profile_cm_def_objects.sql is company-side
        (not present here). Prior basis kept: sql/controlm_conditions_in.sql
        header + docs/restructure/06a DDL check.
      column_count: 12
      census: complete
    columns:
      - {name: TABLE_ID, disposition: projected, origin: source, target: "Condition.folder_id"}
      - {name: JOB_ID, disposition: projected, origin: source, target: "staging:job_id",
         note: "join key to MATCH the owning :ControlMJob (folder_id, job_id); not stored as a Condition/edge property"}
      - {name: VERSION_SERIAL, disposition: projected, origin: source, target: "Condition.version_serial",
         note: "current-version filter is already applied at SQL ingest (gate §Q1) — the loaded value is always the current definition"}
      - {name: CONDITION, disposition: projected, origin: source, target: "Condition.name", note: "node-key component with folder_id"}
      - {name: ODATE, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.odate", note: "operational date"}
      - {name: AND_OR, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.and_or",
         note: "boolean operator between adjacent IN conditions"}
      - {name: PARENTHESES, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.parentheses",
         note: "expression grouping marker"}
      - {name: ORDER_, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.order_",
         note: "evaluation order within the IN-condition expression"}
      - {name: ISN_, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.isn"}
      - {name: VERSION_OPCODE, disposition: projected, origin: source, target: "REQUIRES_IN_CONDITION.version_opcode"}
      - {name: IS_CURRENT_VERSION, disposition: projected, origin: source, target: "staging:is_current_version",
         note: "the WHERE-clause filter (= '1'); selected in the extract but NOT persisted onto the :Condition node or REQUIRES_IN_CONDITION edge in controlm_conditions_in.cypher — current-version is already guaranteed at SQL ingest (gate §Q1)"}
      - {name: CAPTURE_DATE, disposition: projected, origin: source, target: "Condition.last_capture_date",
         note: "SQL column CAPTURE_DATE lands as the graph property last_capture_date"}
    default_disposition:
      disposition: excluded
      reason: scope
      count: 0
      note: >
        06a's DDL check found exactly these twelve columns (all confirmed
        selected); this sweep is defensive only, in case the live view carries
        columns added since that check.

