  # ---------------------------------------------------------------------------
  # CM_HOSTS (host-group membership) — replica of the BMC node-group structure
  # (vendor 6.4.01 poster: CMS_NODGRP; agent identity CMS_NODID/CMR_NODES is
  # NOT replicated). Added 2026-07-09 via the add-source-object walkthrough.
  # Extract: sql/controlm_hosts.sql; probes: sql/adhoc/profile_cm_hosts.sql.
  # LOADED as of the P3 build (2026-07-27): loader controlm_hosts.v1 →
  # :ControlMHostGroup / :ExecutionHost / CONTAINS_HOST, then the derived
  # RUNS_ON {role: host_group | agent_host} resolution pass
  # (runs_on_resolution.v1 — group match wins, UNMATCHED = coverage).
  # DEFINED_ON still does NOT load: the DC value-domain verification (probe
  # P3) + the 22-DC-vs-production scope call are open gate-log residuals.
  # Use case: server-patching / maintenance-window planning.
  # ---------------------------------------------------------------------------
  - name: CM_HOSTS
    kind: table
    profile:
      profiled_on: 2026-08-24
      via: >
        Read-only catalog census (ALL_TAB_COLUMNS + row count), live psgmgr,
        internal session 2026-08-24 — conclusions transcribed producer-side,
        no data values read. Real TABLE, 5 columns (all
        nullable) — exactly the 5 dispositioned below, sweep empty; 13,745 rows
        at census time. The catalog half ran from a scratch census file rather
        than sql/adhoc/profile_cm_hosts.sql, whose remaining probes return real
        host/group names: catalog-only keeps the census at the same no-data-values
        bar as the CM_DEF_* objects. EARLIER PASS, still true: internal SQL
        Developer 2026-07-09 — 22 distinct DATA_CENTERs / 5,396 GRPNAMEs / 8,161
        NODEIDs. STILL OWED: the definition-side probes in
        sql/adhoc/profile_cm_hosts.sql (grain, participation domain, DC
        value-domain match, NODE_ID resolution census) — a catalog census is not
        those.
      column_count: 5
      census: complete
    note: >
      Gate controlm-hosts-topology CONFIRMED 2026-07-09 (config/gate-log.md;
      spec config/gate-prompts/controlm-hosts-topology.yaml); hosts loader +
      RUNS_ON resolution pass BUILT 2026-07-27 (backlog P3). Still open
      (gate-log residuals): P3 DC value-domain check (gates DEFINED_ON), P4
      resolution census transcription, P2a participation domain, DC scope
      call. Object is NOT versioned (no IS_CURRENT_VERSION/VERSION_SERIAL)
      and has no USER_DAILY; grain assumed (DATA_CENTER, GRPNAME, NODEID)
      pending the dup probe.
    columns:
      - {name: DATA_CENTER, disposition: projected, origin: source, target: ControlMHostGroup.data_center,
         note: "long-form DC name (<Pnnn>-E<hhmm>-<suffix>, default-time encoding); 22 distinct incl. non-production; ControlMHostGroup key part — the DEFINED_ON join to ControlMServer stays unloaded pending the DC value-domain probe + scope call"}
      - {name: GRPNAME, disposition: projected, origin: source, target: ControlMHostGroup.name,
         note: "host-group name (5,396 distinct); may itself be a DNS/LB alias (contains dots); ControlMHostGroup key part; NOT the CM_DEF_VJOB.GROUP_NAME application-group concept; also the group-wins match target for CM_DEF_VJOB.NODE_ID (2-hop RUNS_ON {role: host_group})"}
      - {name: NODEID, disposition: projected, origin: source, target: ExecutionHost.nodeid,
         note: "member agent host FQDN (8,161 distinct); ExecutionHost node key (constraint executionhost_nodeid); also the direct-match target for hard-coded CM_DEF_VJOB.NODE_ID values (1-hop RUNS_ON {role: agent_host})"}
      - {name: PARTICIPATION_TYPE, disposition: projected, origin: source, target: CONTAINS_HOST.participation_type,
         note: "VARCHAR2(1); observed 'P' only so far — full value domain + BMC semantics pending probe P2a; rides the membership edge"}
      - {name: CAPTURE_DATE, disposition: projected, origin: source, target: CONTAINS_HOST.last_capture_date,
         note: "replication timestamp — never authorship; snapshot-uniformity probe pending (P5); lands as last_capture_date on the membership edge"}
    default_disposition:
      disposition: excluded
      reason: scope
      count: 0
      note: >
        The column view shows exactly these five columns; this sweep is
        defensive only, in case the live table carries columns added since
        that check.

  # ---------------------------------------------------------------------------
  # CM_AVG_RUN (runtime statistics) — per-job avg/min/max start+run times plus
  # RAW per-run sample arrays (~20 runs). Name verified live (SME query
  # 2026-07-07/09). Added 2026-07-09 via the add-source-object walkthrough.
  # Extract: sql/controlm_avg_run.sql; probes: sql/adhoc/profile_cm_avg_run.sql.
  # STAGING-ONLY until the controlm-avg-run-supplement gate confirms the
  # landing: timing PROPERTIES onto existing :ControlMJob nodes + derived
  # folder windows — NO new labels/edges (opt-in supplement pattern). Use
  # case: maintenance-window planning + TDQ-failure ETA (critical-path).
  # ---------------------------------------------------------------------------
  - name: CM_AVG_RUN
    kind: table
    profile:
      profiled_on: 2026-07-22
      via: >
        P0 probe census, live psgmgr (internal SQL Developer run 2026-07-22,
        conclusions transcribed — sql/adhoc/profile_cm_avg_run.sql carries
        the per-probe record). Real TABLE, 26 columns, ALL nullable: the 14
        projected below PLUS 12 UNPROJECTED discovered by the census —
        STAT_CAL_CTM VARCHAR2(20), STAT_CAL VARCHAR2(30), STAT_PERIOD
        VARCHAR2(1) (the leading grain-discriminator candidate), LAST_UPDATED
        DATE, AVG_CPU_TIME NUMBER, SAMPLES_JOB_ID/SAMPLES_CPU_TIME/
        SAMPLES_AGENT_ELAPSED_TIME/SAMPLES_FIRST_START_TIME VARCHAR2(4000),
        AVG_AGENT_ELAPSED_TIME NUMBER, STD_DEV_START_TIME NUMBER,
        AVG_ALL_START_TIME VARCHAR2(6). AVG_START_TIME is VARCHAR2(6) — a
        STRING (safe TO_NUMBER conversion required; the P3a probe was fixed
        for exactly this). SAMPLES_* are VARCHAR2(4000), not CLOB. NO ctlm_id
        column exists on this table. Whether any unprojected column joins the
        extract (STAT_PERIOD for dedupe especially) = the supplement-loader
        build decision (HITL residual).
      column_count: 26
      census: complete
    note: >
      Graph landing is PROPOSED ONLY pending gate controlm-avg-run-supplement
      (config/gate-prompts/controlm-avg-run-supplement.yaml) — every column
      lands staging-only until then. Join to jobs is the WEAK key
      (SCHED_TABLE, JOB_MEM_NAME = JOB_NAME), never MEMNAME, never
      TABLE_ID/JOB_ID; -CYC/-DLY twin folders each carry rows; supplement
      pass MATCHes existing job nodes, never MERGEs. PROBE FINDINGS
      2026-07-22: 169,639 rows / 14 DCs; grain (DC, SCHED_TABLE,
      JOB_MEM_NAME) NOT unique (dups 2–49 — dedupe rule = HITL residual);
      join coverage stats→jobs 85.7%, jobs→stats 29.6% (partial enrichment
      by construction); run-time outliers to ~2.65 y (sanity cap = HITL
      residual); each folder carries a SELF row (JOB_MEM_NAME = folder,
      NODE_GROUP null) the loader must separate.
    columns:
      - {name: DATA_CENTER, disposition: projected, origin: source, target: "staging:data_center",
         note: "long-form DC name — same domain as CM_HOSTS (probe P6 confirms vs CM_DEF_VTAB)"}
      - {name: INSTANCE_NAME, disposition: projected, origin: source, target: "staging:instance_name",
         note: "P2b ANSWERED 2026-07-22: exactly ONE value across all 14 DCs — identifies the reporting EM/CTM instance, never the DC; constant, so never a key part"}
      - {name: SCHED_TABLE, disposition: projected, origin: source, target: "staging:sched_table",
         note: "folder name; join-key part; also the :folder_filter scope-bind target"}
      - {name: JOB_MEM_NAME, disposition: projected, origin: source, target: "staging:job_mem_name",
         note: "= CM_DEF_VJOB.JOB_NAME (SME 2026-07-07) — the supplement join key with SCHED_TABLE; MEMNAME is never a key"}
      - {name: NODE_GROUP, disposition: projected, origin: source, target: "staging:node_group",
         note: "runtime host-group placement — cross-validates the definition-side RUNS_ON resolution (gate controlm-hosts-topology); probe P5 classifies GROUP/DIRECT_HOST/UNMATCHED"}
      - {name: DSN, disposition: projected, origin: source, target: "staging:dsn",
         note: "P3b ANSWERED 2026-07-22: always null (0/169,639) — disposition flips to excluded WITH the supplement-loader build (extract + ledger change together, one coherent commit), not before"}
      - {name: AVG_START_TIME, disposition: projected, origin: source, target: "staging:avg_start_time",
         note: "Control-M >24h post-midnight clock (293502 ≈ 05:35:02 next day) — normalized in Python to time-of-day + next_day flag; proposed ControlMJob.avg_start_time"}
      - {name: AVG_RUN_TIME, disposition: projected, origin: source, target: "staging:avg_run_time",
         note: "seconds; proposed ControlMJob.avg_run_time; FileWatcher rows = watch/wait duration, flagged not blended"}
      - {name: MIN_RUN_TIME, disposition: projected, origin: source, target: "staging:min_run_time", note: "seconds"}
      - {name: MAX_RUN_TIME, disposition: projected, origin: source, target: "staging:max_run_time", note: "seconds"}
      - {name: STD_DEV, disposition: projected, origin: source, target: "staging:std_dev",
         note: "run-time spread; large values flag unstable-runtime jobs for window planning"}
      - {name: SAMPLES_RUN_TIME, disposition: projected, origin: source, target: "staging:samples_run_time",
         note: "raw comma array of per-run seconds (~20) — day-of-week medians computed in Python; probe P7 checks parseability/length"}
      - {name: SAMPLES_START_TIME, disposition: projected, origin: source, target: "staging:samples_start_time",
         note: "raw comma array of <ts>:<odate> pairs — start-time medians per day-of-week; probe P7"}
      - {name: CAPTURE_DATE, disposition: projected, origin: source, target: "staging:capture_date",
         note: "replication timestamp — never authorship; P8 ANSWERED 2026-07-22: single snapshot date, no history → refresh = FULL-REPLACE"}
    default_disposition:
      disposition: excluded
      reason: scope
      count: 12
      note: >
        The defensive sweep turned out to be LOAD-BEARING: the 2026-07-22 P0
        census found 26 columns — the grid had hidden 12 (enumerated by name
        in profile.via above: the STAT_CAL*/STAT_PERIOD trio, LAST_UPDATED,
        CPU/agent-elapsed aggregates + sample arrays, STD_DEV_START_TIME,
        AVG_ALL_START_TIME, SAMPLES_FIRST_START_TIME, SAMPLES_JOB_ID). All 12
        swept excluded/scope AT census time (14 explicit + 12 swept = 26).
        Promoting any of them (STAT_PERIOD for the grain dedupe especially)
        = a BY-NAME disposition row at the supplement-loader build — never a
        silent widening of this sweep (doc 08 §Risks).
