# =============================================================================
# config/source-mappings/psgmgr.yaml — the column ledger for the psgmgr
# CARRIER (config/source-registry.yaml v2 system id `psgmgr`). One ledger for
# the whole replica DB: each OBJECT below is its own v2 DATASET row
# (controlm@[db].psgmgr.<object>), and every one of those rows points its
# locator.mapping here. (Renamed from controlm-psgmgr.yaml at the N9 build —
# the flat source id retired with the v2 split.)
#
# THE LEDGER: per source OBJECT (a psgmgr CM_ table/view), one row per column
# recording its DISPOSITION — projected (lands in staging/graph) | filter-only
# (WHERE clause only) | excluded (deliberate no, with a reason) | deferred
# (named future use) — plus WHERE it lands (`target: Label.property` or
# `staging:<field>`). A `default_disposition` sweeps the long tail of the 100+
# column source tables so this file stays writable; the Phase-1 coverage test
# (not yet built) reconciles the swept count against a real column census.
#
# THIS IS PHASE 0 (transcription, no new gate): every disposition below is
# TRANSCRIBED from already-decided sources — never invented:
#   - the five drydocs/loaders/sql/controlm_*.sql projections (the SELECT
#     lists + their header-comment scope rules) and the matching
#     drydocs/loaders/cypher/controlm_*.cypher SET clauses (what actually
#     lands as a node/edge property vs. stays in the staging batch dict)
#   - the controlm-q1q3-phase1 gate (config/gate-prompts/controlm-q1q3-phase1.yaml)
#     and docs/restructure/06a-controlm-source-er-review.md §SME resolutions
#   - config/audit-fields.yaml (the source_created_*/source_updated_* envelope
#     mapping for CM_DEF_VJOB / CM_DEF_VTAB)
#
# DOC 08 PHASE 2 IS DONE for this ledger: all 7 objects carry a real catalog
# census (`census: complete`, 2026-07-22 CM_AVG_RUN + 2026-08-24 the other six),
# run read-only against live psgmgr in an internal session and transcribed here —
# so `column_count` is now an inventory count and every sweep carries its frozen
# `count:`. What is NOT done: per-column DATA profiling (null rates, distinct
# counts, value domains), and the CM_HOSTS definition-side probes. Column names are
# vendor-schema mechanism (no data values) — classification: Internal-Public,
# even though the real source (config/source-registry.yaml) is classification:
# Internal. Typed accessor: drydocs/review/source_mappings.py.
#
# Guarded (doc 08 Phase 1, BUILT 2026-07-11 — N2): coverage/census reconciliation
# (census_failures; pending census = nothing to reconcile, a recorded census must
# balance explicit rows + the sweep's frozen count:), SQL drift guard (loader
# SELECT lists set-equal the projected columns per object, union across files),
# and the source-registry confirmed-source ledger test —
# tests/unit/test_source_mapping_drift.py.
# =============================================================================
schema: drydocs.source-mapping.v1
source: psgmgr                # v2 SYSTEM id (carrier scope) — objects below map 1:1 to controlm@[db].psgmgr.* dataset rows
classification: Internal-Public
updated: 2026-08-24

objects:
  # ---------------------------------------------------------------------------
  # CM_DEF_VTAB (folders) — replicated copy of dtsremgr.DEF_VTAB. Per
  # drydocs_core/models/controlm.py: "a table, not a view, despite the family name."
  # Loader: drydocs/loaders/controlm_folders.py + sql/controlm_folders.sql +
  # cypher/controlm_folders.cypher.
  # ---------------------------------------------------------------------------
  - name: CM_DEF_VTAB
    kind: table
    profile:
      profiled_on: 2026-08-24
      via: >
        Read-only catalog census (ALL_TAB_COLUMNS + row count), live psgmgr,
        internal session 2026-08-24 — conclusions transcribed producer-side,
        no data values read. Real TABLE, 26 columns — the 10
        dispositioned below + 16 swept; 76,364 rows at census time. Probe
        sql/adhoc/profile_cm_def_objects.sql is company-side (not present here).
        Prior basis kept: sql/controlm_folders.sql header + docs/restructure/06a.
      column_count: 26
      census: complete
    note: >
      APPLICATION (the :ControlMApplication grouping) is NOT a native CM_DEF_VTAB
      column — CM_DEF_VTAB carries no APPLICATION column at all. It comes from the
      folder HEADER ROW on CM_DEF_VJOB (JOB_ID=1, TASK_TYPE=SMART Table) via the
      LEFT JOIN in controlm_folders.sql; see that column's entry under the
      CM_DEF_VJOB object below (gate controlm-q1q3-phase1 §Q3).
    columns:
      - {name: TABLE_ID, disposition: projected, origin: source, target: "ControlMFolder.folder_id"}
      - {name: SCHED_TABLE, disposition: projected, origin: source, target: "ControlMFolder.sched_table",
         note: "folder name; also the :folder_filter scope-bind (LIKE) target shared across all five psgmgr extracts; source of the parsed environment/lob/app_code/folder_type properties (folder_name.py)"}
      - {name: DATA_CENTER, disposition: projected, origin: source, target: "ControlMServer.name",
         note: "Control-M server code (P12/P14/P32/P33); one :ControlMServer node per unique value"}
      - {name: USER_DAILY, disposition: projected, origin: source, target: "ControlMFolder.user_daily",
         note: "the WHERE-clause active-scheduling filter (USER_DAILY IS NOT NULL) reused as the join-scope gate across all five psgmgr extracts; also derives ControlMFolder.active — a phase-1 READABILITY choice, not a semantic active/inactive claim (manual-order folders run in production too)",
         decided_by: controlm-q1q3-phase1}
      - {name: TABLE_STATUS, disposition: projected, origin: source, target: "ControlMFolder.table_status",
         note: "VARCHAR2(1) folder lifecycle status code; BMC definition still to confirm (06a)"}
      - {name: TABLE_TYPE, disposition: projected, origin: source, target: "ControlMFolder.table_type",
         note: "folder type code (Smart Folder / Sub-Folder / etc.)"}
      - {name: INSTANCE_NAME, disposition: projected, origin: source, target: "ControlMFolder.instance_name"}
      - {name: LAST_UPDATED, disposition: projected, origin: source, target: "ControlMFolder.last_updated",
         note: "audit: source-updated-at; also lands as ControlMFolder.source_updated_at (config/audit-fields.yaml — CM_DEF_VTAB has no creation columns, updated-side only)"}
      - {name: LAST_UPDATED_USER, disposition: projected, origin: source, target: "ControlMFolder.last_updated_user",
         note: "audit: source-updated-by; also lands as ControlMFolder.source_updated_by (audit-fields.yaml); also the :developer_sid scope-bind target at folder grain (last editor of the folder)"}
      - {name: CAPTURE_DATE, disposition: projected, origin: source, target: "ControlMFolder.capture_date",
         note: "replication timestamp — never authorship; excluded from the audit envelope (audit-fields.yaml)"}
    default_disposition:
      disposition: excluded
      reason: scope
      count: 16
      note: >
        Phase-1 inventory+lineage projection (06a). Named exclusions from the SQL
        header: the folder-level soft-delete columns (TBL_DELETION_*) are
        intentionally omitted — soft-deletes are out of scope for M3. Sweeps
        every other unprojected CM_DEF_VTAB column; surface on request.

  # ---------------------------------------------------------------------------
  # CM_DEF_VJOB (jobs) — replicated copy of dtsremgr.DEF_VJOB. 100+ columns on
  # the live table; ~30 projected for the inventory+lineage use case (06a).
  # Loader: drydocs/loaders/controlm_jobs.py + sql/controlm_jobs.sql +
  # cypher/controlm_jobs.cypher.
  # ---------------------------------------------------------------------------
  - name: CM_DEF_VJOB
    kind: table
    profile:
      profiled_on: 2026-08-24
      via: >
        Read-only catalog census (ALL_TAB_COLUMNS + row count), live psgmgr,
        internal session 2026-08-24 — conclusions transcribed producer-side,
        no data values read. Real TABLE — this ledger recorded
        kind: view until the census; corrected 2026-08-24 (the family name is
        misleading, the same trap drydocs_core/models/controlm.py already flags
        for CM_DEF_VTAB). 121 columns — the 33 dispositioned below + 88 swept;
        1,089,358 rows at census time (ALL versions, ALL data centers — the
        extract's IS_CURRENT_VERSION='Y' + USER_DAILY scope cuts this to roughly
        240k). Probe sql/adhoc/profile_cm_def_objects.sql is company-side (not
        present here). Prior basis kept: sql/controlm_jobs.sql header +
        docs/restructure/06a.
      column_count: 121
      census: complete
    columns:
      - {name: JOB_ID, disposition: projected, origin: source, target: "ControlMJob.job_id",
         note: "folder-scoped (same JOB_ID recurs across folders); JOB_ID=1 = the folder header/SMART-Table row (gate Q3)"}
      - {name: VERSION_SERIAL, disposition: projected, origin: source, target: "ControlMJob.version_serial",
         note: "edit-history counter; captured as a PROPERTY, not part of node identity — the node key is (folder_id, job_id)"}
      - {name: TABLE_ID, disposition: projected, origin: source, target: "ControlMJob.folder_id",
         note: "FK to ControlMFolder.folder_id"}
      - {name: JOB_NAME, disposition: projected, origin: source, target: "ControlMJob.job_name",
         note: "= JOB_MEM_NAME join key in cm_avg_run (planned runtime supplement)"}
      - {name: PARENT_TABLE, disposition: projected, origin: source, target: "ControlMJob.parent_table",
         note: "denormalized folder name kept for query convenience; NOT a relationship key (CONTAINS_JOB keys on folder_id)"}
      - {name: APPLICATION, disposition: projected, origin: source, target: "ControlMJob.application",
         note: "the Control-M APPLICATION grouping — NOT the SEAL business :BusinessApplication; on the folder-header row (JOB_ID=1) the same value ALSO lands as ControlMApplication.name via controlm_folders.sql's LEFT JOIN (gate controlm-q1q3-phase1 §Q3, :ControlMApplication:Collection)",
         decided_by: controlm-q1q3-phase1}
      - {name: GROUP_NAME, disposition: projected, origin: source, target: "ControlMJob.group_name"}
      - {name: TASK_TYPE, disposition: projected, origin: source, target: "ControlMJob.task_type",
         note: "Job / Smart Folder / etc.; TASK_TYPE = SMART Table marks the folder-header row"}
      - {name: CYCLIC, disposition: projected, origin: source, target: "ControlMJob.cyclic", note: "Y/N flag"}
      - {name: CYCLIC_TYPE, disposition: projected, origin: source, target: "ControlMJob.cyclic_type",
         note: "1-char type code; NOT used for condition matching in the canonical recursive-dependency SQL"}
      - {name: JOB_ORDER, disposition: projected, origin: source, target: "ControlMJob.job_order"}
      - {name: OWNER, disposition: projected, origin: source, target: "ControlMJob.owner",
         note: "run-as tenant account NAME (service identity, not a person) — NOT the functional id. This note used to read 'Functional ID' and that was the trap: gate rua-load-shapes A1 (RULED 2026-08-06) already says run_as carries the linux TENANT NAME, not the directory key, and the SME confirmed it 2026-08-12. The id lives in psgmgr.HR_PHONE_EXP.EMP_ID; this column joins to that table's EMP_LAST_NAME. CASE, CORRECTED 2026-08-19 (K17 session round 2, replica evidence): stored MIXED CASE at rest — the 2026-08-12 ALL-UPPER note recorded the normalization PLAN as a storage fact. Joins to the directory normalize BOTH sides: UPPER(HR_PHONE_EXP.EMP_LAST_NAME) = UPPER(OWNER); the index consequence is owned by K16. The _scope_binds() upper-cased exact-match bind is therefore a DEFECT for lower-stored owners (silent zero rows — the very trap it claimed to close); the fix rides K16, and the raw value is always retained where stored (fold counts stay reportable)."}
      - {name: AUTHOR, disposition: projected, origin: source, target: "ControlMJob.author",
         note: "authoring SID; distinct person from OWNER/CREATION_USER/CHANGE_USERID per 06a; also a :developer_sid scope-bind candidate"}
      - {name: NODE_ID, disposition: projected, origin: source, target: "ControlMJob.node_id", note: "target host or agent"}
      - {name: CMD_LINE, disposition: projected, origin: source, target: "ControlMJob.cmd_line",
         note: "Phase-3 USES_SOFTWARE signal (plan-07)"}
      - {name: DESCRIPTION, disposition: projected, origin: source, target: "ControlMJob.description"}
      - {name: MEMNAME, disposition: projected, origin: source, target: "ControlMJob.memname",
         note: "DEMOTED to informational only — may duplicate JOB_NAME or hold junk; never a key/join (cm_avg_run.JOB_MEM_NAME joins on JOB_NAME, not MEMNAME)",
         decided_by: controlm-q1q3-phase1}
      - {name: PRIORITY, disposition: projected, origin: source, target: "ControlMJob.priority"}
      - {name: CRITICAL, disposition: projected, origin: source, target: "ControlMJob.critical"}
      - {name: ACTIVE_FROM, disposition: projected, origin: source, target: "ControlMJob.active_from"}
      - {name: ACTIVE_TILL, disposition: projected, origin: source, target: "ControlMJob.active_till"}
      - {name: END_FOLDER, disposition: projected, origin: source, target: "ControlMJob.end_folder", note: "Y/N — last job in folder"}
      - {name: IS_CURRENT_VERSION, disposition: projected, origin: source, target: "ControlMJob.is_current_version",
         note: "the WHERE-clause active-version filter (= 'Y'; VARCHAR2(1), string literal); domain RESOLVED 'Y' 2026-07-15 (D4 — finalized company ingestion TDD, live-verified), closing the gate §Q2 probe",
         decided_by: controlm-q1q3-phase1,
         derived_also: {target: "ControlMJob.active", rule: "IS_CURRENT_VERSION = 'Y'"}}
      - {name: VERSION_OPCODE, disposition: projected, origin: source, target: "ControlMJob.version_opcode"}
      - {name: VERSION_TIMESTAMP, disposition: projected, origin: source, target: "ControlMJob.version_timestamp",
         note: "current-version duplicate of CHANGE_DATE — kept as a plain (non-envelope) audit property, string not datetime (config/audit-fields.yaml, gate §Q2)",
         decided_by: controlm-q1q3-phase1}
      - {name: VERSION_USER, disposition: projected, origin: source, target: "ControlMJob.version_user",
         note: "current-version duplicate of CHANGE_USERID — kept as a plain (non-envelope) audit property (config/audit-fields.yaml, gate §Q2)",
         decided_by: controlm-q1q3-phase1}
      - {name: INSTANCE_NAME, disposition: projected, origin: source, target: "ControlMJob.instance_name"}
      - {name: CAPTURE_DATE, disposition: projected, origin: source, target: "ControlMJob.capture_date",
         note: "replication timestamp — never authorship"}
      - {name: CREATION_USER, disposition: projected, origin: source, target: "ControlMJob.source_created_by",
         note: "SOURCE AUDIT ENVELOPE (config/audit-fields.yaml). Derived employee_sid (strip trailing 'p') approved at the gate but NOT YET BUILT in this loader — PROPOSED only (project-memory: decided-but-unbuilt derived_also).",
         decided_by: controlm-q1q3-phase1,
         derived_also: {target: "ControlMJob.employee_sid", rule: "strip trailing 'p'"}}
      - {name: CREATION_DATE, disposition: projected, origin: source, target: "ControlMJob.source_created_at",
         note: "SOURCE AUDIT ENVELOPE (config/audit-fields.yaml)", decided_by: controlm-q1q3-phase1}
      - {name: CHANGE_USERID, disposition: projected, origin: source, target: "ControlMJob.source_updated_by",
         note: "SOURCE AUDIT ENVELOPE (config/audit-fields.yaml); also a :developer_sid scope-bind candidate",
         decided_by: controlm-q1q3-phase1}
      - {name: CHANGE_DATE, disposition: projected, origin: source, target: "ControlMJob.source_updated_at",
         note: "SOURCE AUDIT ENVELOPE (config/audit-fields.yaml)", decided_by: controlm-q1q3-phase1}
      - {name: APPL_TYPE, disposition: projected, origin: source, target: "staging:appl_type",
         note: "OS / FileWatch / AIAWSWLK / plugin job type; surfaced only via controlm_variables.sql (not selected by controlm_jobs.sql itself); variables stay staging-only for now — node-vs-property deferred (gate controlm-q1q3-phase1 §Q3)"}
    default_disposition:
      disposition: excluded
      reason: scope
      count: 88
      note: >
        Phase-1 inventory+lineage projection (06a/SQL header): schedule-detail
        columns (DAY_STR, INTERVAL_SEQUENCE, MONTH_1..MONTH_12, etc.) and every
        other unprojected CM_DEF_VJOB column (100+ total on the live table) —
        surface later when a use case demands it.

  # ---------------------------------------------------------------------------
  # CM_DEF_LNKI_P_VW (IN conditions) — wraps dtsremgr.DEF_LNKI_P. Schema
