# =============================================================================
# config/precedence.yaml — source-of-truth ordering for the configuration layer.
#
# When sources disagree about what something IS, resolve top-down. The first
# authority that has an opinion wins; lower authorities become aliases
# (skos:closeMatch / recorded note), never silent overrides.
#
# Edit `order:` to change which authority is consulted first. The HITL gate
# surfaces every conflict this file resolves so the SME can confirm.
# =============================================================================

schema: drydocs.precedence.v1
updated: 2026-06-20

# The ordered authority chain. Lower index = higher authority.
order:
  - id: bmc-baseline
    authority: 1
    role: orchestration-vendor-baseline
    governs: [Folder, Job, Condition, dependency, calendar, execution-host, run-as-user]
    source: external/orchestration/bmc-controlm/
    rationale: >
      BMC Control-M is the canonical orchestrator. Its object semantics are ground truth;
      other orchestrators (AutoSys, Airflow) crosswalk TO these concepts.

  - id: internal-standards
    authority: 2
    role: company-convention
    governs: [naming, data-center-codes, folder-naming, calendar-resolution, description-fields]
    source: knowledge/standards/
    rationale: >
      Company conventions that refine the baseline for our environment. They normalize and
      disambiguate baseline values but do not redefine baseline concepts.

  - id: lob-product-team
    authority: 3
    role: org-taxonomy
    governs: [ownership, business-context, LOB, ProductLine, Product, AreaProduct, DevTeam]
    source: internal/org/        # confidential rosters live here
    rationale: >
      The org taxonomy assigns ownership and business context. Lowest authority for object
      *meaning*, but the sole authority for *who owns it* — used to attach context, not to
      redefine orchestration objects.

# How conflicts are recorded when a lower authority disagrees with a higher one.
conflict_policy:
  winner: highest-authority
  loser_disposition: alias        # record as skos:closeMatch / note on the edge or node
  require_sme_confirmation: true  # the guided gate shows every conflict before it is applied
  never: silent-drop

# Toggle which authorities are active (e.g. disable a feed during onboarding).
active:
  bmc-baseline: true
  internal-standards: true
  lob-product-team: true

# =============================================================================
# PROPOSED addition (GATE-BOUND, 2026-07-08 review) — NOT part of the live chain above.
# drydocs_core/precedence.py#PrecedenceResolver reads ONLY `order:` / `active:` / `conflict_policy:`
# above; this block is a separate top-level key and is therefore INERT to the resolver — adding
# it here does not change is_active()/rank() for bmc-baseline / internal-standards /
# lob-product-team, and does not affect tests/unit/test_precedence.py. Wiring this into the live
# `order:`/`active:` chain (with an explicit `authority:` number) is a SEPARATE, later step, done
# only after the SME confirms at the gate.
# =============================================================================
proposed_additions:
  - id: seal-pat-source-of-record
    role: internal-source-of-record
    governs: [internal-product-identity, internal-business-identity, application-fact-provenance]
    source: "drydocs-docmeta scraped SEAL/PAT corpus (planned component; see knowledge/upgrade-plans/docmeta-component.md)"
    rationale: >
      PROPOSED 2026-07-08 review: register SEAL/PAT scraped documentation as the authoritative
      source for internal product/business IDENTITY — when a scraped SEAL/PAT fact conflicts
      with the catalog/PAT taxonomy on what an internal application/product IS (not who owns
      it), SEAL/PAT wins once this is activated. Distinct from, and narrower than,
      lob-product-team (which governs ownership/business-context, not fact identity). This is
      one of two linked source-of-record mechanisms — the other is `prov:hadPrimarySource` on
      every extracted fact (see config/taxonomy-ontology-map.yaml#seal-doc-source-of-record and
      drydocs_core/ontology/relationship_vocabulary.yaml#seal_had_primary_source, both
      status: planned/proposed).
    status: proposed
    gate_prompt: config/gate-prompts/seal-tom-attribution-reshape.yaml
    activation_note: >
      NOT wired into the live `order:`/`active:` chain the resolver reads. Activating this
      authority is a separate, later change: append an entry to `order:` above with an explicit
      `authority:` number (placement relative to the existing 3 authorities is itself an open
      question for the SME) and add it to `active:` — only after gate confirmation, never as a
      side effect of confirming this proposed_additions block alone.
