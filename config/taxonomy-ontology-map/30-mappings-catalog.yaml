  # ---- K13: catalog_has_application — the §G6 support reading (K7 gate) -----
  # SEMANTICS confirmed at the K7 close-out gate (seal-app-ref-edge-reshape,
  # signed 24/24, 2026-08-03, §G6). LOADING still waits on the product-scoped
  # extract — the C9 condition, unchanged by this entry. Company-side the edge
  # is ACTIVE (live extract + loader); this entry is the producer's back-flow
  # adoption of the ruled reading (backlog K13), not new build.
  - id: product-has-application
    taxonomy: { source: "pat:product-catalog", element: "Product is supported by its Mapped Applications (product-scoped tab; extract NOT onboarded producer-side)" }
    ontology:
      from_node: Product                     # dd:Product (prov:Entity)
      to_node: BusinessApplication           # prov:Entity / dprod:DataProduct (K4 reclass)
      matrix_row: "local catalog hierarchy (no PROV row — both ends Entities post-K4)"
      neo4j_label: HAS_APPLICATION
      prov_maps_to: ~
    precedence_authority: lob-product-team
    vocab_id: catalog_has_application
    capture: "waived — the product-scoped Mapped Applications extract is not onboarded producer-side (the C9 condition); the semantics were ruled at the K7 gate from the company's live extract (evidence index: internal/pat-evidence/README.md)"
    status: confirmed
    confirmed_by: chad.wilson
    confirmed_on: 2026-08-03
    decision_resolved: >
      K7 gate §G6 (2026-08-03): the COMPANY reading — a structural SUPPORT link,
      a Product supported by 2 or more applications (front-end/back-end) — NOT
      the producer's "a Product owns a set of SEAL-registered applications".
      Chosen because the company reading is backed by a live extract and loader
      where the producer's was an unbuilt intention. The edge is 1:many BY
      DESIGN (the extract's application-id column is multi-valued), so the K11
      cascade picker returns a LIST, never a single application. The vocabulary
      entry stays status: planned until the product-scoped extract is onboarded
      here (C9 condition unchanged); K13 reconciled the semantics only.

