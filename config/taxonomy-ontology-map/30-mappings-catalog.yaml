  - id: dev-team-supports
    taxonomy: { source: "pat:people-report", element: "DevTeam is aligned to / supports an AreaProduct (team_type, sponsored)" }   # alignment is VOLATILE, swept from the team report per load (C9)
    ontology:
      from_node: DevTeam                     # org:OrganizationalUnit (Agent)
      to_node: AreaProduct                   # RESOLVED: range = AreaProduct (Team-of-Teams)
      matrix_row: "Agent → Entity — no PROV row; local"
      neo4j_label: SUPPORTS
      prov_maps_to: ~
