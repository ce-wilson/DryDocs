  # ---- Email Distribution Lists as contact points (PROPOSED 2026-07-22) ----
  # User direction 2026-07-22: DL is only configured in Outlook (no feed), appears in
  # runbooks, extractable from emails; membership/usage belong to the context graph.
  # Gate config/gate-prompts/email-dl-contact-point.yaml carries the full options
  # analysis (class, edges, store-as-source, layer-4 boundary).

  - id: dl-contact-point
    taxonomy:
      source: outlook-dl                       # NOT yet in config/source-registry.yaml — no machine feed exists; registration is a gate §E follow-through (the seal-pat-scrape precedent)
      element: "An email Distribution List is the contact/notification channel for an application/team — defined only in Outlook/Exchange, witnessed in runbooks and emails"
    ontology:
      from_node: "BusinessApplication | DevTeam | AreaProduct"
      to_node: DistributionList                # NEW class — candidate dd:DistributionList aligned vcard:Group (prov_type Entity, RECOMMENDED) vs prov:Agent (gate section A)
      prov_type_from: "Entity (BusinessApplication) | Agent (DevTeam)"
      prov_type_to: Entity
      matrix_row: "no PROV row — contact-point placement; dcat:contactPoint pattern (range vcard:Kind), the reg_uses_software no-PROV precedent"
      neo4j_label: HAS_CONTACT_POINT           # candidate label; plus (:ControlMJob|:ControlMFolder)-[:NOTIFIES {origin}]-> for INTENDED routing (gate sections B2/C)
      prov_maps_to: ~
      edge_properties: { purpose: "escalation | notification | approval | general (open-but-governed)", origin: "defined | escalation-db | extracted-runbook | extracted-jira | extracted-email" }
    precedence_authority: internal-standards   # DL contact rows: steward-defined = source of record (no feed); NOTIFIES rows: escalation-db special-instructions is the candidate authoritative source (gate C2) — store demotes to override-until-fixed there
    source_evidence: >
      operational reality: runbooks + email threads carry DL addresses; Outlook holds the
      definition; no extract exists. SME landscape (2026-07-22 amendment): downstream
      notification config has NO authoritative surface today — greenfield intent was the
      Control-M job Description field; better candidate = CM_ESCALATION_DB
      special-instructions VARCHAR2(4000) in psgmgr (EJOBNAME join, SEAL via ECOMPONENT —
      support-team editable, DB-ingestible, i.e. a FIXABLE source); de facto truth =
      runbooks, Jira sign-offs, email threads. Extraction (runbook corpus, Jira, email
      headers) + wired evidence (DO-MAIL/SHOUT, notification-kind send-email psets)
      produce CANDIDATE store rows only — steward confirms, loader loads (gate sections C/D).
    status: proposed
    proposed_at: 2026-07-22
    gate_spec: config/gate-prompts/email-dl-contact-point.yaml
    source_exemption: >
      N8 ruling 2026-08-06 — NO FEED BY DESIGN, deliberately unregistered. The
      DL is defined only in Outlook/Exchange; no extract exists and none is
      planned (the gate's store-as-source discussion: HAS_CONTACT_POINT rows
      are steward-authored in the O24 store, which IS the source). Registering
      `outlook-dl` would fabricate a machine feed the source_evidence above
      explicitly says does not exist. The load-map render displays this reason
      (the SOURCELESS_LOADERS written-reason idiom); if the email-dl gate ever
      rules for extraction-fed candidate rows, that ruling replaces this
      exemption with a real registration.
    open_questions:
      - "Class: vcard:Group-aligned Entity (recommended — a channel record, not an accountable party) vs prov:Agent (only if NOTIFIES must be PROV-mapped) — gate section A."
      - "NOTIFIES authoring surface (gate section C, the 2026-07-22 SME amendment): escalation-db special-instructions keyed convention [recommended — shares the description-metadata plan's template discipline so the two 4000-char conventions don't fork] vs job Description field [demoted to per-job exception carrier] vs extraction-only [rejected as end state]; grain follows the attribution close-out (folder preferred, per-job exceptions)."
      - "Intended-vs-wired split: NOTIFIES is authored from the C surface; DO-MAIL/SHOUT + notification-pset extraction is corroboration — mismatches surface to the steward, never auto-resolve (gate B2)."
      - "Store posture differs per leg: HAS_CONTACT_POINT = store-as-source (no feed exists, the seal-app-ref-edge-reshape §E2 scoping); NOTIFIES = ordinary O24 override-until-fixed once the escalation-db convention lands (gate D1/D2)."
      - "Membership + email-observed usage = layer-4 context only (SOSA experimental family or store metadata), never ontology-core — gate section E; inherits sosa adoption: experimental."
      - "Local-db posture: synthetic fixture DLs only in neo4jtest; real rows company-side, Internal — confidential material (escalation-db rows Internal too)."


  # ---- BusinessApplication identity property contract (CONFIRMED 2026-07-27 — gate business-application-identity) ----
  # NOT an edge mapping: a PROPERTY BINDING on the canonical :BusinessApplication node
  # (property-supplement shape — job-runtime-stats-supplement precedent, 2026-07-14).
  # No relationship_vocabulary.yaml term is created or changed; no edge is touched.
  # The gate ruled the NAME the canonical node's identity value is written under, and
  # the cutover discipline the eight key-bearing loader sites share.

  - id: business-application-identity
    taxonomy:
      source: "seal:app-extract"
      element: "SEAL application row supplies the business application's identity value. The SOURCE calls the field `Application ID` (SME-confirmed 2026-07-27 from the Reports export header — NOT 'SEALID', which was repo vernacular and appears nowhere in code, SQL or Cypher). The row model field was already neutral: SealApplicationRow.app_id."
    ontology:
      from_node: BusinessApplication            # prov:Entity — the property lands here
      to_node: ~                                # no target node — property binding, not an edge
      prov_type_from: Entity
      prov_type_to: "n/a (no edge)"
      matrix_row: "no matrix row — node-property binding (property-supplement pattern)"
      neo4j_label: ~
      property_targets:
        - "BusinessApplication.app_id (the canonical identity key — replaces seal_id as the MERGE key across 8 sites; seal_id retained as a deprecated alias through phase 3, its retirement is a SEPARATE later gate per §G3)"
        - "Port.parent_app_id (the NODE KEY follows in the same change — §D1(a); constraints.cypher:44 port_unique must be DROPped or renamed first, because CREATE CONSTRAINT ... IF NOT EXISTS matches on the NAME and would otherwise succeed while doing nothing)"
      prov_maps_to: ~
      not_written:
        - "id_authority — WITHDRAWN v2. §B0 ruled a second issuing authority will not happen, so it would be a constant column on every node. The authority is recorded ONCE in config/taxonomy/business-application.yaml (source_of_record: SEAL)."
        - "app_urn — DEFERRED with a named trigger (§B3): the phase where a second authority actually appears. §B0 confirms that trigger will not fire; the URN form stays documented in docs/patterns/data-catalog/enterprise-data-catalog-ontology.md."
    precedence_authority: lob-product-team
    vocab_id: ~                             # deliberately none — property binding, no edge terms
    vocab_id_reason: "node-property binding, not an edge — no relationship_vocabulary.yaml term exists or is needed. §A1 explicitly scopes edge work out, and §E1/§B2(ii) scope out the SEAL match-tier vocabulary, which belongs to the signed seal-attribution-match-policy gate (2026-07-14)."
    capture: config/taxonomy/business-application.yaml
    capture_note: >
      The taxonomy file already classified the concept (concept: BusinessApplication,
      source_of_record: SEAL, classification_only: true), so no new capture was needed —
      but its `identifier:` field was CORRECTED at this sign-off: it recorded SEALID, a
      name the source does not use. The source calls the field `Application ID` (§B4/§B5).
    naming_rule: >
      TWO-PART, ruled at §B2 (the session's load-bearing correction). (i) IDENTITY —
      canonical nodes take neutral property names; registry-named properties are permitted
      only on source-labeled nodes (ADR 0003 rule 1). (ii) EVIDENCE — provenance and match
      vocabulary KEEPS the source's own term, because it records what another system
      literally wrote. ATTRIBUTION_TIERS 'SEAL' and match_method 'seal' therefore STAY:
      SEAL's portal calls the field `Application ID`, but Control-M CMDLINEs and internal
      documentation refer to it as SEAL / SEAL_ID, so the tier name is fidelity to the
      source, not drift. Renaming it would make the graph misdescribe its own evidence.
    status: confirmed
    confirmed_by: chad.wilson
    confirmed_on: 2026-07-27                # gate SIGNED OFF, 22/22 confirmations, 0 edits, 0 rejections
    gate_spec: config/gate-prompts/business-application-identity.yaml
    reopenable_by: >
      seal-app-ref-edge-reshape v2 — but ONLY §C1 (the 8-site inventory, which goes stale if
      the reshape re-targets seal_attribution) and §D2 (whose "leave it" is judged against
      today's attribution grain). §A4 carve-out: every other item ruled here is SEALED.

  # ---- G44: catalog producedby_app_id → application attribution (PROPOSED) ----
