  # ---- SEAL ontology reshape — SIGNED OFF 2026-07-10 (K3), APPLIED at K4 ----
  # Gate config/gate-prompts/seal-tom-attribution-reshape.yaml, sign-off in
  # config/gate-log.md (2026-07-10). K4 (2026-07-15) applied the reclass + label
  # normalization (:BusinessApplication), the qualified-attribution loaders, and
  # the membership deprecations. seal-doc-source-of-record stays confirmed-only
  # until drydocs-docmeta ships a Document loader.

  - id: application-as-dataproduct
    taxonomy:
      source: "seal:app-extract"
      element: "BusinessApplication (SEAL-registered) is a data-product/asset record, not a software agent"
    ontology:
      from_node: BusinessApplication               # CURRENT (active): prov:SoftwareAgent — see node_classifications
      to_node: ~                            # node reclassification, not an edge
      current_class: "prov:SoftwareAgent"
      proposed_class: "prov:Entity / dprod:DataProduct"
      prov_type_from: Agent
      proposed_prov_type: Entity
      matrix_row: "n/a — node reclassification, not a matrix edge"
      rationale: >
        :BusinessApplication currently carries three incompatible PROV types on one node: SoftwareAgent
        (node_classifications), dprod:Port children (Entity semantics, seal_has_port — active),
        and org:Membership/org:Role role-holders (Organization semantics,
        seal_has_membership/seal_of_role/seal_held_by — active, C2). A SEAL application is a
        data-product/asset, not an Agent and not an Organization — prov:Entity / dprod:DataProduct
        is the precise fit, and it is also the type prov:hadPrimarySource (Entity -> Entity)
        requires of the source-of-record edge (seal-doc-source-of-record below).
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:Entity)", "DPROD/EKGF (dprod:DataProduct)"]
    vocab_id: ~                             # node reclass, not an edge — see relationship_vocabulary.yaml node_classifications#BusinessApplication (reclass APPLIED)
    capture: config/taxonomy/business-application.yaml
    status: applied
    proposed_at: 2026-07-08
    confirmed_by: SME
    confirmed_on: 2026-07-10                # gate §A + label decision (gate-log)
    applied_on: 2026-07-15                  # K4 clause 1 — reclass + :BusinessApplication label across schema/loaders/tests
    resolved_questions:
      - "K1/K2 job->app edge reshape: DEFERRED by the gate (§F) to a K2 follow-up gate — the standing rider on m3_seal_app_ref / job-seal-app-ref, unchanged by K4."
      - "arch_develops re-check: resolved by gate §E — flipped to (:BusinessApplication)-[:WAS_ATTRIBUTED_TO {role: developed_by}]->(:DevTeam) at K4 clause 5."

  - id: seal-tom-attribution
    taxonomy:
      source: "seal:app-extract"
      element: "SEAL Technical Operating Model (TOM) role-holders (gate §B revised fixed 7: application_owner, primary_information_owner, backup_information_owner, cto, technology_risk_controls, design_authority, operate_manager L1/L2) attributed to the BusinessApplication asset"
    ontology:
      from_node: BusinessApplication                # PROPOSED class: prov:Entity / dprod:DataProduct
      to_node: Employee                      # prov:Agent
      prov_type_from: Entity                 # after the proposed reclass
      prov_type_to: Agent
      matrix_row: "Entity -> Agent = prov:wasAttributedTo (simple form)"
      neo4j_label: WAS_ATTRIBUTED_TO
      role: tom_role_holder
      prov_maps_to: "prov:wasAttributedTo"
      qualified_form:
        pattern: "BusinessApplication -[:QUALIFIED_ATTRIBUTION]-> (:Attribution) -[:HAS_AGENT]-> Employee ; (:Attribution) -[:HAD_ROLE]-> TOMRole"
        prov_maps_to: ["prov:qualifiedAttribution", "prov:agent", "prov:hadRole"]
        role_vocabulary: "TOMRole (skos:Concept) — the gate §B REVISED fixed 7 in scheme tom_roles: application_owner, primary_information_owner, backup_information_owner, cto (shared with the K5 ProductRole scheme), technology_risk_controls, design_authority, operate_manager (L1/L2 = level property on the Attribution). DISTINCT from :Role (org:Role, PAT hierarchy only)."
      vocab_id: [human_qualified_attribution, human_attribution_has_agent, human_attribution_had_role]   # seal_app_attributed_to_employee stays planned (simple form optional/derivable, gate §B)
    precedence_authority: lob-product-team
    standards_cited: ["PROV-O (prov:wasAttributedTo, prov:qualifiedAttribution, prov:agent, prov:hadRole)", "SKOS (skos:Concept)"]
    capture: >
      waived — the role vocabulary is the tom_roles SkosConceptScheme seeded by
      drydocs_core/schema/seal_ontology_supplement.cypher; its source taxonomy is the gate §B
      fixed set (config/gate-log.md 2026-07-10), not a config/taxonomy/ capture file.
    status: applied
    depends_on: application-as-dataproduct
    proposed_at: 2026-07-08
    confirmed_by: SME
    confirmed_on: 2026-07-10                # gate §B (role model REVISED into two families) + §C
    applied_on: 2026-07-15                  # K4 clauses 2+3+6 — scheme/supplement active; loaders seal_applications.cypher + seal_contacts.cypher write the qualified form
    note: >
      Replaces org:Membership/org:Role for SEAL's TOM role-holders ONLY — org: stays for the PAT
      product hierarchy (DevTeam etc., real organizations; catalog_dev_team_has_membership is a
      DIFFERENT governance concept sharing the org: pattern). seal_has_membership / seal_of_role /
      seal_held_by DEPRECATED at K4 clause 3 (deprecated_at 2026-07-15). seal_has_port KEPT
      (dprod:Port structural edge, unrelated). Contact roles outside the fixed 7 load with
      unmapped_role=true + role_source_name preserved — surfaced, never guessed (loader comment).
    resolved_questions:
      - "Role set: gate §B fixed the REVISED 7 (subsumes the old flat 6; Design Authority new); the scheme is fixed, not open-ended — new roles need a new gate."
      - "Simple vs qualified form: only the QUALIFIED form is loaded (multi-person roles require it); the simple wasAttributedTo stays optional/derivable — seal_app_attributed_to_employee remains status: planned."

