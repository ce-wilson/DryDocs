# GATE ontology-domain-registry-and-edition-grain — DRAFTED 2026-09-02 (C41 clause e).
# UNSIGNED. Nothing is minted, registered or renamed until this signs.
#
# The item-series half of C41 was ruled on 2026-09-02 (RECORD "the backlog series is the
# MODULE", PLAN1): item ids take the module code, the 27 letters are frozen, no id moves.
# That is NOT reopened here. What this gate rules is what PLAN1 left standing: the two
# other axes — ONTOLOGY DOMAINS as minted, registered objects, and the EDITION as a
# declared segment on an id — and the ADR 0015 amendment the second one depends on.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: ontology-domain-registry-and-edition-grain
title: >-
  SME Gate — the two remaining axes: an ontology domain is a MINTED object with a registry
  and a minting authority, and an edition is a DECLARED segment on an id keyed to a real
  Area Product — plus the ADR 0015 D2 amendment that gives an instance a backlog to mint into
step: >-
  C41 clause (e), drafted 2026-09-02, after PLAN1 settled the item-series axis and removed
  C41's former gate (schema-identifier-publish-ceiling-teams-edition, which asked whether
  psgmgr is public vocabulary and never asked these questions). Read with the RECORD at
  config/gate-log.md "2026-09-02 — the backlog series is the MODULE". Everything here is
  a ruling C41 may not pre-empt; the SME gave two of the answers in-chat on 2026-09-01
  ("the company base needs to mint the domain — registered, tracked, part of the ADR";
  "requirements and code need to be separate labels in a graph") and this prompt puts
  them where a build can cite them.
summary: >-
  (a) TWO AXES REMAIN, and they are different kinds of thing. A DOMAIN is a partition of
  the relationship vocabulary — 13 exist, each registered by a signed gate, sharded into
  fragments 40-52 (S5); today they are declared in a comment block in 00-header.yaml and
  nowhere else, so "registered" means "someone edited the comment." An EDITION is a tenant
  — a generated Team Edition instance (ADR 0015, PROPOSED 2026-08-27) or the company base
  — and today tenancy in the id space is a NUMERIC BAND (producer 1-9999, company 10000+)
  that encodes identity in digits nothing can read, with a second, older rule (the DD
  reserve, git-readme.md:197) still live beside it. (b) WHAT PLAN1 CHANGED FOR THIS GATE.
  The domain registry was going to supply the backlog series prefix; the module does that
  now. So a domain no longer needs a `series` column, and the only reason a domain could
  exist WITHOUT a vocabulary fragment — to be a backlog topic — is gone. The prompt says so
  and recommends the narrower registry. (c) THE ONE SPLIT THE PRODUCT TURNS ON. The 2018
  genesis document separates code, requirements and test cases; today code is a facet of
  `architecture` (24 entries) and requirements sit in `docs` (20 entries), so the join the
  product exists to make spans two domains that declare nothing to each other. The
  external precedent (spec-kit, spec-driven development) is NOT yet registered in
  reference/REGISTRY.yaml; B4 says what can be ruled without it and what waits. (d) THE
  EDITION GRAIN IS A RULING, NOT A DEFAULT: Area Product (about twenty, SME-reported, no
  transcription file yet), DevTeam (46), or application (84) — change it later and every
  code re-mints. (e) NOTHING RENUMBERS. Ids freeze under PLAN1; the edition segment is
  optional and the base edition has none, so every existing id parses unchanged.

