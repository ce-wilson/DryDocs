sections:
  - title: "A. What is NOT being asked — reaffirmation"
    confirmations:
      - "The SCAFFOLD stays rejected. fastapi/full-stack-fastapi-template is not adopted, vendored, or partially copied, and this gate does not re-open that survey. The register row keeps its verdict; only its trigger state changes."
      - "This gate rules on PRACTICES the survey described, evaluated on their own merits against what the console already does. A practice is judged by whether the producer needs it, never by whether the template ships it."
      - "Declining every practice below is a valid sign-off. The console authenticates today and would continue to; nothing here is a gap being patched."
  - title: "B. What the console does TODAY — confirm the measurement"
    confirmations:
      - "Sign-in proves a secret to drydocs-api, which verifies it against a salted scrypt hash (OWASP parameters, stored per-credential so old hashes still verify) and issues an opaque bearer token with a TTL from a server-side session store. The browser holds the token and its expiry; the secret is sent once and stored nowhere."
      - "Roles are re-resolved server-side from the token on every request. The role in the browser's session blob drives which nav entries render and nothing else, so editing it grants nothing (ADR 0005 decision 3)."
      - "Accounts are a FIXED roster of six deliberately fictional identities, with secrets in a machine-local credential file that is absent on a fresh clone (every login is then refused). There is no account creation, no directory, and no recovery path."
      - "The ?as= affordance is DEV-only, removed from production bundles, and performs a real sign-in with a secret supplied by the dev shell — it is not a bypass. If the SME expected a stub here, that expectation predates O69."
  - title: "C. The five practices — rule each"
    confirmations:
      - "P1 hashed credentials: CONFIRM the current mechanism (salted scrypt at OWASP parameters) as the standing one, or rule a change. Nothing is being proposed — this row exists so the status quo is a recorded decision rather than an assumption nobody checked."
      - "P2 OAuth2 password flow: adopt or DECLINE (recommended decline). It changes the shape of the login request and nothing about who may sign in; its value is interop with OAuth tooling, which the producer does not use today."
      - "P3 JWT in place of the opaque token: ADOPT or DECLINE — this page makes no recommendation, deliberately. The two properties are both real and they trade against each other: the opaque token is revocable server-side (sign-out and expiry are enforced by the session store), and a JWT is verifiable without asking the issuer, which is what a second service or an edge proxy needs. Choosing costs the other, or costs a denylist to keep both. THE DECIDING QUESTION IS A REQUIREMENT, not a preference: does anything have to verify a console token without the issuer? Nobody has stated one — if the answer is still no at the session, declining is the low-cost answer and should be recorded as such rather than as a rejection of JWT."
      - "P4 a user model: adopt / decline / DEFER WITH A NAMED TRIGGER. This is the one the charter actually presses on — a shared estate console needs accounts that outlive one machine's credential file. It is a data model, a storage decision and a lifecycle (create, disable, rotate), so adopting it means scoping those, not installing a library. If deferred, name the trigger here so the deferral is re-openable the way the register row was."
      - "P5 a recovery flow: adopt or DECLINE (recommended decline). It presupposes P4 and a mail path the producer does not have, so it is decided WITH P4 rather than independently."
  - title: "D. The register-row amendment — drafted here, applied at sign-off"
    confirmations:
      - "The ADR 0015 register row for fastapi/full-stack-fastapi-template is amended to record that its trigger HAS FIRED, what fired it (the internal ui-workstream's user/login build — the chartered shared estate console the row anticipated), and that the disposition is this gate. The row's 'What TE takes' column is unchanged: still nothing adopted."
      - "The amendment records the FIRING, never the outcome. Whatever this gate rules is transcribed to config/gate-log.md, which is the record of record; the register row points at the gate rather than restating it, so the two cannot drift."
      - "This preserves ADR 0015's own discipline — a fired trigger opens a backlog item and auto-changes nothing. The row is not deleted, and the watch is not closed: a rejected scaffold with a fired trigger is still worth watching."
  - title: "E. Boundaries recorded at sign-off"
    confirmations:
      - "NOTHING IS BUILT BY THIS PAGE. No dependency added, no auth code, no user model, no route change. Any adopted practice becomes its own backlog item with its own acceptance test, and a practice that touches stored credentials or session lifetime carries its own security review."
      - "THE COMPANY SIDE IS NOT DECIDED HERE. Their ui-workstream makes its own call and runs its own gate; producer sign-off is not company sign-off."
      - "Until this gate signs off, the console's authentication is unchanged — the mechanism described in section B is what ships."
  - title: "F. Sign-off"
    confirmations:
      - "SME sign-off recorded here and transcribed to config/gate-log.md with the date and the per-practice rulings, including any DEFER and its named trigger."
