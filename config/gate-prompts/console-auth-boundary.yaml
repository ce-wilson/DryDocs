# SME gate-prompt spec — the console's AUTHENTICATION boundary (backlog O71).
#
# GATE-BOUND, and the wording matters here more than usual: this page PROPOSES.
# Nothing is adopted, installed, or wired by rendering it. Authentication is a
# trust boundary, so until this gate signs off the console keeps exactly the
# mechanism it has today — which is described, not assumed, in section A.
#
# WHY THIS GATE EXISTS NOW: ADR 0015's watched-source register carries a row for
# fastapi/full-stack-fastapi-template whose named trigger is "only re-opens if a
# shared estate console is chartered". That trigger HAS FIRED — the internal
# ui-workstream's user/login build is that charter. The register's discipline is
# that a fired trigger opens a backlog item and auto-changes nothing, which is
# this item, and this page is its output.
#
# WHAT IS *NOT* ON THE TABLE, stated first because a reader who skims will
# otherwise mistake this gate for a reversal: the SCAFFOLD was surveyed on
# 2026-08-27 and REJECTED on evidence, and that rejection STANDS. It is not
# re-opened here, not partially, not conditionally. See section A confirmation 2.
#
# Drafted 2026-08-31 by the ui-workstream session that pulled O71. Mechanism
# only — no real ids, secrets, or company values anywhere on this page.
#
# AMENDED 2026-08-31 (user direction, pre-sign-off) — P3 (JWT) NO LONGER CARRIES
# A RECOMMENDATION. The draft led with "recommended: decline", which put the
# page's thumb on a scale the SME is here to hold: unlike P2 and P5, whose
# recommendations rest on facts about the producer (no OAuth tooling in use, no
# mail path), the JWT question turns on a REQUIREMENT nobody has stated yet —
# whether anything must verify a token without asking the issuer. With that
# unstated, a recommendation is a preference wearing an argument's clothes. So
# P3 is now put as a trade with both sides costed and NO default; the
# revocability property is still stated plainly, because it is a fact about what
# the console has today and the SME needs it to rule either way. The other four
# recommendations stand as drafted.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: console-auth-boundary
title: "SME Gate — the console's authentication boundary: which of the surveyed auth PRACTICES the console adopts, now that the ADR 0015 watched-source trigger has fired"
step: "Pre-decision gate for backlog O71 — opened by the fired watch trigger on the fastapi/full-stack-fastapi-template register row (ADR 0015, Sources & tooling watch)"
summary: >
  THE QUESTION IS ABOUT PRACTICES, NOT A SCAFFOLD. ADR 0015 surveyed the
  SaaS-scaffold option and rejected it on evidence: copier-native templates ship
  no auth, and the templates that DO ship auth are clone-and-diverge repos with
  no update lifecycle, whose "teams" means users-in-a-workspace rows behind JWT
  next to Stripe — a different axis from a generated instance with its own
  databases, so adoption would inherit a users/orgs/billing model to rip out
  while gaining nothing. THAT VERDICT STANDS AND IS NOT RE-OPENED. What this gate
  rules is narrower: of the auth PRACTICES the survey characterised, which does
  the producer console adopt, decline, or has it already answered?

  AND THREE OF THE FIVE ARE ALREADY ANSWERED, which is why this page measures
  before it asks (O71 clause c). The console's sign-in has not been a stub since
  O69: a secret is proved to drydocs-api, which verifies it against a salted
  scrypt hash at OWASP parameters and issues an OPAQUE bearer token with a TTL
  from a server-side session store; the browser holds the token and never the
  secret, and the server re-resolves the real role from the token on every call
  (ADR 0005 decision 3). So "hashed credentials" is not a proposal — it is the
  status quo, and the honest question about JWT is whether to REPLACE a
  deliberately revocable opaque token with a stateless one — put below as a
  trade with no recommendation, because the answer depends on a requirement the
  producer has not stated rather than on anything already decided.

  Each practice below is separately tickable. DECLINING ANY SUBSET IS A VALID
  SIGN-OFF, and declining ALL of them is the standing state — the console works
  as shipped. Nothing here is applied until ticked and transcribed to
  config/gate-log.md.
meta:
  Module: "drydocs-web + drydocs-api (the console sign-in and the API that verifies it)"
  Source: "docs/decisions/0015-team-edition-template.md (the Sources & tooling watch register row and the Scaffold-substrate rejection) + docs/decisions/0005-browser-neo4j-access-path.md decision 3 (the server re-resolves role) + web/src/lib/auth.ts + web/src/App.tsx (the ?as= seam) + drydocs_api/credentials.py + drydocs_api/sessions.py"
  Registry ref: "no source-registry change — the watched row is an ADR 0015 register entry, and its amendment ships with this gate (see section D)"
  Classification: "Internal-Public (this page, mechanism only — no secrets, no ids, no company values)"
  Taxonomy: "n/a — no taxonomy capture is touched by this gate"
  Ontology map: "n/a — no vocabulary entries are proposed. If an adopted practice later needs a graph shape (a user model as nodes, say), THAT shape gets its own ontology gate first"
  Source of record: "docs/restructure/backlog/items/O71.yaml · config/gate-log.md (transcription target) · docs/restructure/03-hitl-sme-flow.md (the flow this gate follows)"

mapping:
  - n: 1
    element: "The scaffold verdict — reaffirmation, not a re-opening"
    target: "fastapi/full-stack-fastapi-template is NOT adopted as a scaffold. The 2026-08-27 survey's grounds stand: clone-and-diverge with no update lifecycle, and a users/orgs/billing model on a different tenancy axis from TE's generated-instance-per-team"
    edge: "verdict reaffirmation  [PROPOSED — the default that survives if every practice below is declined]"
  - n: 2
    element: "P1 — hashed credentials"
    target: "ALREADY IN PLACE, not a proposal: salted hashlib.scrypt at OWASP parameters (N=2^14, r=8, p=5), parameters stored WITH each hash so an old hash still verifies under its own. Confirm as the standing mechanism"
    edge: "already implemented  [CONFIRM — or rule a change]"
  - n: 3
    element: "P2 — OAuth2 password flow (the template's login shape)"
    target: "RECOMMENDED: decline. The console posts JSON to /login and receives a token; the OAuth2 password grant adds a form-encoded contract and a spec-shaped vocabulary while changing nothing about who may sign in. It buys interop with OAuth tooling the producer does not use"
    edge: "candidate practice  [OPEN — SME rules adopt / decline]"
  - n: 4
    element: "P3 — JWT in place of the opaque server-side token"
    target: "NO RECOMMENDATION — the trade, both sides costed, because the answer turns on a requirement nobody has stated. KEEPING the opaque token keeps REVOCABILITY: sign-out and expiry are enforced server-side by the session store, and a token can be dropped mid-life. ADOPTING a JWT buys verification WITHOUT asking the issuer — the thing that matters when a second service, an edge proxy, or an offline consumer must check a token itself — and costs key management plus, if revocation is still required, a denylist that reintroduces the server-side state. The deciding question is therefore: does anything have to verify a token without the issuer? If yes, JWT; if no, the opaque token is doing the job"
    edge: "candidate practice  [OPEN — SME rules adopt / decline]"
  - n: 5
    element: "P4 — a user model (persistent accounts, rather than a fixed roster)"
    target: "THE GENUINELY OPEN ONE. Today PERSONAS is a hardcoded roster of six deliberately fictional identities in web/src/lib/auth.ts, with secrets in a machine-local credential file. A shared estate console needs accounts that outlive a machine — which is a data model, a storage decision, and a lifecycle (create/disable/rotate), not a library choice"
    edge: "candidate practice  [OPEN — SME rules adopt / decline / defer with a named trigger]"
  - n: 6
    element: "P5 — a credential recovery flow"
    target: "RECOMMENDED: decline for now, and note the dependency rather than the preference — recovery presupposes P4 (an account to recover, and an identity to prove) and a mail path the producer does not have. If P4 is declined or deferred, this is decided with it"
    edge: "candidate practice  [OPEN — depends on P4]"
  - n: 7
    element: "The ?as= seam — what it is TODAY"
    target: "MEASURED, not described from memory (O71 clause c): a DEV-ONLY affordance in web/src/App.tsx, removed from production bundles by the import.meta.env.DEV constant. Since O69 it performs a REAL sign-in — it calls signIn() with VITE_DEV_CONSOLE_SECRET and has no default and no fallback, so with the variable unset it does nothing and the sign-in screen renders. It is a verification convenience, NOT a bypass, and the item's own description of it as 'a stub sitting where real auth would land' is out of date"
    edge: "current state  [FOR INFORMATION — corrects the item's framing]"

