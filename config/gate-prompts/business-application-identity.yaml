# SME gate-prompt spec — BusinessApplication IDENTITY: does the canonical node's key
# carry the registry's name, or a neutral one?
#
# REVISED v2 2026-07-25 — SME PREMISE CORRECTION, same session, before the gate ran:
# "a second authority issuing app ids should not happen." That single fact removes the
# ONLY argument for the qualified-reference shape. v1 proposed app_id + id_authority
# (+ conditionally app_urn); with the dual-registry case ruled out, `id_authority` is a
# constant column on every node. It is WITHDRAWN in v2 — kept visible below rather than
# deleted, because the reasoning is the audit trail.
#
# `app_urn` is NOT withdrawn: v1's §B3 already deferred it to "when a second authority
# actually appears", so B0 only confirms that trigger will not fire. The distinction is
# deliberate and the SME made it explicitly — id_authority was to be written on EVERY
# node in phase 1; app_urn was always conditional. A deferral with a named trigger is a
# more honest record than "impossible", because "should not happen" is org intent.
#
# The revision makes the change SMALLER and, under the case that CAN still happen,
# strictly better: if the registry is renamed, a neutral `app_id` needs no data change
# at all (the property name is already generic and `source_of_record` is recorded once
# in config/taxonomy/business-application.yaml), whereas `id_authority` on every node
# would have needed migrating across all of them. Record the authority ONCE, in config.
#
# Raised by ADR 0010 (docs/decisions/0010-internal-source-term-abstraction.md), itself
# from the pre-UI structure review (docs/reviews/architecture-structure-review-2026-07-25.md
# §4.2, finding F2). Groomed as backlog S3, gated by S1. ADR 0010 must be AMENDED at S1
# to match this ruling — its Option C and rules 2/3 assume the withdrawn shape.
#
# GATE-BOUND: this page PROPOSES. No property is written, no constraint is created, no
# loader or QuerySpec changes, and the taxonomy-ontology-map entry stays `proposed`
# until §H is signed.
#
# WHY A GATE AT ALL, when this is "just a property rename": (1) it changes the MERGE
# KEY of a canonical node written by FOUR independent loaders — get that wrong and the
# graph silently doubles (§C); (2) it changes the NODE KEY of :Port (§D); (3) it changes
# the API/console contract (§E). Property-term bindings route through the gate per
# CLAUDE.md phase 11. It is NOT an edge decision — no relationship_vocabulary.yaml term
# is created, and the map entry takes the property-supplement shape (to_node: ~,
# vocab_id: ~) precedented by job-runtime-stats-supplement (2026-07-14).
#
# EXTENDED v3 2026-07-25 — SME raised a THIRD axis the first two obscured: "another
# system may have a slightly different field name for the same thing... if this were
# SaaS we would have a mapping for app_id to xyz_id". That is not id_authority (which
# registry issued the VALUE — per-node data, dead under B0); it is the SOURCE FIELD NAME
# (what each system CALLS the field — per-source config). The repo already has that
# mechanism, test-guarded, in config/source-mappings/<source>.yaml — it was simply never
# written for seal-extract, which is why SEALID -> seal_id ended up hardcoded in Cypher.
# New B1(c) + B5 propose writing that ledger; B6 records the honest limit (the ledger is
# declarative + guard-reconciled today, NOT a runtime mapping the loaders read).
#
# CORRECTED v3.1 2026-07-27 — three defects found by walking the page with the SME, fixed
# BEFORE §H can sign. None changes the proposal; all three were the page misdescribing the
# repo, which is exactly the failure a gate exists to catch:
#   (1) §D2 counted THREE attribution_id sites; there are FOUR. seal_contacts.cypher:53 was
#       missing, and it is the only one where the role segment is DATA (row.role_name) not a
#       literal — the site any re-shaping would break first.
#   (2) §D2 option (b) offered "re-form it from id_authority" — a property §B0 WITHDREW in
#       v2. The page was offering a choice built on something it had already deleted.
#   (3) §F1 said the registry name survives in "exactly four places"; CONSTRAINT NAMES are a
#       fifth (constraints.cypher:36 `businessapplication_seal`) — neither config nor a
#       filename, and the most operator-visible of the five.
# EXTENDED v3.2 2026-07-27 — SME correction that reshapes §B2, plus two more defects it
# exposed. The SME's words: "in SEAL it's application_id; other applications and processes
# refer to it as SEAL or SEAL_ID, such as control-m job cmd lines, documentation, etc" —
# and, separately, "early on I called it SEAL_ID."
#   THREE NAMES, THREE LAYERS: the SEAL portal calls the field `Application ID`; the wider
#   ecosystem (Control-M CMDLINEs, docs) says SEAL / SEAL_ID; the graph says `seal_id`,
#   which was a DryDocs-era coinage, not an inherited source term. Note `SEALID` appears
#   NOWHERE in code, SQL or Cypher — only in prose — while the row model was already `app_id`.
#   CONSEQUENCE: §B2's rule is TWO-PART. Canonical node properties go neutral (identity);
#   evidence/provenance vocabulary keeps the source's own term, because it records what
#   another system literally wrote. SME ruled the carve-out 2026-07-27.
#   (4) §E1 said "match_method: 'seal_var' is reworded" — 'seal_var' is a demo-fixture
#       string, not the contract, and the real tier vocabulary is owned by a SIGNED gate
#       that §A1 declares unchanged. E1 contradicted A1; now narrowed.
#   (5) §E1 and mapping n:7 both still said "the NEUTRAL PAIR" / "app_id + id_authority" —
#       another §B0 withdrawal leftover, same class as defect (2).
#
# Sections corrected in place with the superseded text kept visible, per this file's rule
# that the reasoning IS the audit trail.
#
# Mechanism-only. The one id shown (70001) is a synthetic sample value from the
# reserved 70001-70099 block committed in config/taxonomy/business-application.yaml.
#
# NOTE 2026-07-27: this line previously cited a different id and asserted it was
# synthetic. It was not — that file's three sample rows carried REAL SEALIDs and REAL
# application names under a header claiming they were synthetic, and this page
# repeated the claim. Sanitized as a p0 publish-boundary fix before §H could sign;
# §B4 cites that file as the single record of authority, so signing on top of the
# mislabel would have propagated it further.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: business-application-identity
title: "SME Gate — BusinessApplication identity: rename the canonical key seal_id -> app_id, or keep it?"
step: "Rules the property contract for the canonical :BusinessApplication node before the console hardens against it — and the MERGE-key cutover that four loaders share"
summary: >
  :BusinessApplication is the CANONICAL node — deliberately named for the concept, not
  for the registry (K4 normalized :Application -> :BusinessApplication, 2026-07-15). Its
  key is nonetheless `seal_id`, the name of the internal registry of record. ADR 0003
  rule 1 says source-system fields stay verbatim on SOURCE-LABELED nodes, which is why
  :ControlMJob may carry Control-M's own field names — the canonical node is precisely
  the case that rule excludes. config/taxonomy/business-application.yaml already got
  this right at the taxonomy layer (concept: BusinessApplication, source_of_record:
  SEAL, identifier: SEALID "= app_id"); the graph did not inherit it. The row model did:
  SealApplicationRow.app_id is ALREADY the field name, and seal_applications.cypher
  writes `MERGE (a:BusinessApplication {seal_id: row.app_id})` — so the registry name is
  introduced AT THE GRAPH LAYER ONLY, by one Cypher clause, over a value that is already
  neutral everywhere else.
  v2 PROPOSAL (post SME premise correction): rename the property to `app_id` and stop
  there. The authority stays recorded ONCE, where it already is — `source_of_record:
  SEAL` in the taxonomy file — rather than on every node. Two drivers survive the
  correction and neither depends on a second registry: consistency with the repo's own
  ADR 0003 rule, and the console contract, which is being built against this key right
  now and should not leak an internal tool name to every viewer. Timing is the argument
  for doing it now; the shape is deliberately the smallest one that answers the ask.
meta:
  Module: "drydocs-core/schema (constraints + seal supplement) · drydocs/loaders (4 MERGE sites) · drydocs_api/query_specs.py · web/src"
  Source: "seal-extract — the internal registry of record for business applications; issues the SEALID. Concept/label already decoupled per ADR 0003 + K4"
  Registry ref: "seal-extract — confirmed (config/source-registry.yaml); this gate changes NO source, only the property name the loader writes"
  Classification: "Internal-Confidential (real SEALIDs + rosters, internal/) · this page Internal-Public (mechanism only; the one id shown is the committed synthetic sample)"
  Taxonomy: "config/taxonomy/business-application.yaml — concept: BusinessApplication, source_of_record: SEAL, identifier: SEALID (= app_id), classification_only: true"
  Ontology map: "NEW entry business-application-identity (proposed at this gate) — property-supplement shape, no edge; precedent job-runtime-stats-supplement (confirmed 2026-07-14)"
  Vocabulary: "NONE — no relationship_vocabulary.yaml term is created or changed. This is a node-property binding, not an edge"
  Related gates: "seal-app-ref-edge-reshape v2 (OPEN — also touches :BusinessApplication; run together or the second re-opens the first) · seal-attribution-match-policy (2026-07-14, NOT re-opened) · seal-tom-attribution-reshape (2026-07-10)"
  Company impact: "seal_id almost certainly appears in company-side code the producer cannot see; port-sequenced through docs/port-prompt.md before any other wide structural port"
mapping:
  - n: 1
    element: "BusinessApplication identity VALUE"
    target: ":BusinessApplication.app_id — the id itself, neutral property name (today: seal_id)"
    edge: "node property  [PROPOSED — §B]"
  - n: 2
    element: "BusinessApplication identity AUTHORITY  [WITHDRAWN v2]"
    target: "was :BusinessApplication.id_authority — WITHDRAWN: the SME ruled a second issuing authority will not happen, so this is a constant on every node. The authority stays in config/taxonomy/business-application.yaml (source_of_record: SEAL), recorded once"
    edge: "withdrawn  [SME premise correction 2026-07-25]"
  - n: 3
    element: "Canonical URN form  [DEFERRED — unchanged by v2]"
    target: ":BusinessApplication.app_urn = urn:dd:businessapplication:<authority>:<value> — NOT written; v1's §B3 already deferred it to the phase where a second authority actually appears, and B0 says that trigger will not fire. Deliberately DEFERRED-with-a-trigger, not declared impossible"
    edge: "not written  [deferred, trigger named in §B3]"
  - n: 4
    element: "MERGE key shared by FOUR loaders"
    target: "seal_applications · manual_seal_attribution · pat_product_mapping · software_registry all MERGE :BusinessApplication on seal_id today"
    edge: "cutover discipline  [DECISION — §C]"
  - n: 5
    element: ":Port foreign key"
    target: ":Port NODE KEY is (parent_seal_id, kind) — a registry-named FK to the app, on a canonical child node"
    edge: "dependent key  [DECISION — §D1]"
  - n: 6
    element: "Attribution composite id"
    target: "attribution_id = app_id + '|SEAL|' + role + '|' + sid — the authority is embedded in a STRING key"
    edge: "dependent key  [DECISION — §D2]"
  - n: 7
    element: "External contract (API + console)"
    target: "drydocs_api/query_specs.py and web/ emit app_id only (NOT 'app_id + id_authority' — §B0 withdrew the second, corrected 2026-07-27); mappingsDemo.ts app_seal_id renamed and its stray 'seal_var' corrected to the real 'seal'. The SEAL match-tier vocabulary is SCOPED OUT — §B2(ii), and it belongs to a signed gate"
    edge: "surface contract  [PROPOSED — §E]"
provenance:
  - label: "BusinessApplication (canonical node — identity properties under decision)"
    source_object: "seal-extract application rows (Internal-Confidential; synthetic publishable shape in config/taxonomy/business-application.yaml)"
    key: "TODAY: seal_id, UNIQUE constraint businessapplication_seal (constraints.cypher:36). PROPOSED: app_id, with id_authority alongside"
    loader: "drydocs/loaders/cypher/seal_applications.cypher:19 (primary) + 3 further MERGE sites, see §C"
    properties:
      - name: app_id
        origin: source
        from: "SealApplicationRow.app_id — the row model field is ALREADY named app_id (drydocs_core/models/seal.py:192)"
        note: "the value does not change and no new plumbing is needed; only the property name the Cypher writes it under. This is the single strongest argument that the change is cheap TODAY"
      - name: id_authority
        origin: derived
        from: "WITHDRAWN v2 — was: constant 'SEAL', from the taxonomy's source_of_record"
        note: "v1 flagged the honest caveat that with one registry this is a constant column, and that its entire value lay in a dual-registry transition. The SME ruled that case out on 2026-07-25, so the caveat decided it: WITHDRAWN. The authority is recorded once in config, not per node — which is also cheaper under a registry RENAME, the case that can still happen"
      - name: app_urn
        origin: derived
        from: "urn:dd:businessapplication:<lower(authority)>:<app_id> — NOT WRITTEN; deferred in v1 §B3 and still deferred in v2"
        note: "v2 leaves this exactly as v1 had it. The distinction from id_authority is deliberate: id_authority was to be written on EVERY node in phase 1, which B0 kills; app_urn was already gated behind 'when a second authority actually appears', so B0 only confirms the trigger will not fire. Deferred-with-a-trigger is the honest record — 'should not happen' is org intent, not a guarantee. The URN form stays documented in docs/patterns/data-catalog/enterprise-data-catalog-ontology.md"
      - name: seal_id
        origin: source
        from: "the same row value, under today's name"
        note: "RETAINED throughout phases 1-3 as a deprecated alias; its retirement is explicitly NOT this gate (§G3)"
  - label: "Port (canonical child — dependent key)"
    source_object: "derived from the same seal-extract row: every app exposes the two-port model"
    key: "NODE KEY (parent_seal_id, kind) — constraints.cypher:44"
    loader: "drydocs/loaders/cypher/seal_applications.cypher:96,100"
    properties:
      - name: parent_seal_id
        origin: source
        from: "row.app_id — again, the row field is already neutral; the Cypher renames it on write"
        note: "a NODE KEY cannot be changed additively the way a plain property can: both keys exist during any transition window, and the constraint must be created then dropped. §D1 decides whether it follows app_id now, later, or never"
sections:
  - title: "A. Scope — what this gate does and does NOT re-open"
    confirmations:
      - "A1: this gate rules the IDENTITY PROPERTY CONTRACT of :BusinessApplication and nothing else. It creates no relationship-vocabulary term, changes no edge, and re-opens no signed attribution ruling (seal-attribution-match-policy 2026-07-14 and seal-tom-attribution-reshape 2026-07-10 both stand unchanged)."
      - "A2: PAT terminology is OUT OF SCOPE and stays untouched — audited at ADR 0010 and found essentially absent from code, labels, and property names (it landed as :Product/:AreaProduct/:ProductLine/:CatalogLOB). NOTE the one crossover §C names: the PAT LOADER writes the SEAL-keyed node, so PAT is affected by the cutover even though PAT's own terms are not."
      - "A3: Employee.seal_sid / seal_holder_sid are OUT OF SCOPE. They name a PERSON identifier that happens to be sourced from SEAL — arguably a different call, and deliberately deferred rather than swept in."
      - "A4: the open seal-app-ref-edge-reshape v2 gate also touches :BusinessApplication (attribution grain, app-code defined mapping). If both are ruled in one session, say so here; otherwise the later one re-opens the earlier one's node."
  - title: "B. The identity shape — the core ruling (RESHAPED v2)"
    confirmations:
      - "B0 [premise, SME-ruled 2026-07-25]: a SECOND AUTHORITY ISSUING APP IDS WILL NOT HAPPEN. SEAL is and remains the single issuing registry for BusinessApplication identity. Everything below follows from this; confirm it explicitly, because it is the load-bearing fact and v1 of this spec assumed the opposite."
      - "B1 [pick one — RESHAPED by B0, extended v3]: (a) app_id alone — rename the property, add nothing. (b) keep seal_id — do nothing [leaves a registry name on the canonical node that ADR 0003 says must not carry one]. (c) app_id PLUS a declared source-field ledger — the graph property is the generic app_id, and the SOURCE system's own field name (SEALID) is declared in config/source-mappings/seal-extract.yaml as `target: BusinessApplication.app_id`, exactly as controlm-psgmgr.yaml already declares TABLE_ID -> ControlMFolder.folder_id [AGENT RECOMMENDATION v3 — see B5]. NOTE: v1's option app_id + id_authority is WITHDRAWN, not rejected on merit — B0 removed its only justification."
      - "B2 [RESHAPED 2026-07-27 — the SME ruled the rule is TWO-PART, not one]: whichever wins, the RULE generalizes — but it has two halves and v3 stated only the first. (i) IDENTITY: canonical nodes take neutral property names; registry-named properties are permitted only on source-labeled nodes (ADR 0003 rule 1). (ii) EVIDENCE: provenance and match vocabulary KEEPS THE SOURCE'S OWN TERM. WHY THE SECOND HALF EXISTS — the SME's correction: SEAL's portal calls the field 'Application ID', but the wider ecosystem (Control-M job command lines, internal documentation, other systems) refers to it as SEAL / SEAL_ID. So when the graph records HOW an attribution was matched, 'SEAL' names a real cross-system referencing convention — what another system literally wrote — not the authority behind the value. Renaming that would not be a cleanup; it would make the graph misdescribe its own source. Confirm BOTH halves, not just this instance — otherwise the next canonical node repeats (i), and the next reviewer 'tidies' (ii) into a defect."
      - "B3 [UNCHANGED from v1 — confirm as written]: app_urn is NOT written now; it stays deferred to the phase where a second authority actually appears. v1 already said this, and B0 only confirms the trigger will not fire — so this is a deferral with a named trigger, NOT a declaration that it can never happen. Kept deliberately separate from the withdrawn id_authority: that one was to be written on every node in phase 1, this one was always conditional. The URN form stays documented in the data-catalog pattern."
      - "B4 [the check B0 makes necessary]: with the authority no longer on the node, WHERE is it recorded? Confirm: exactly once, in config/taxonomy/business-application.yaml (source_of_record: SEAL, identifier: SEALID), which already says it today. A registry RENAME — the case that CAN still happen — then costs one config edit and NO data migration, which is strictly cheaper than the withdrawn shape would have been."
      - "B5 [NEW v3 — the SME's SaaS question: 'another system may have a slightly different field name for the same thing; if this were SaaS we would map app_id to xyz_id']. This is a THIRD axis, distinct from both withdrawn properties: id_authority asked WHICH REGISTRY ISSUED THE VALUE (per-node data, dead under B0); this asks WHAT EACH SOURCE CALLS THE FIELD (per-source CONFIG, very much alive). The mechanism ALREADY EXISTS and is test-guarded: config/source-mappings/<source>.yaml carries one row per source column with `target: Label.property` — controlm-psgmgr.yaml declares `{name: TABLE_ID, target: ControlMFolder.folder_id}` today, reconciled by tests/unit/test_source_mapping_drift.py. There is NO seal-extract.yaml ledger — only controlm-psgmgr and design-docs have one — and that omission is precisely why SEALID -> seal_id was hardcoded in Cypher instead of declared as a mapping. Confirm: option B1(c) writes that missing ledger, making the generic name canonical in the graph and the company-specific name a declared, drift-guarded config value — which is where a different tenant would put xyz_id."
      - "B6 [the honest limit of B5 — do not let this be oversold]: the column ledger is TODAY a DECLARATIVE record reconciled by guards, NOT a runtime mapping layer. Verified: nothing outside tests and scripts/render_enforcement_matrix.py imports drydocs/source_mappings.py — the loaders still hardcode the mapping in their SQL and Cypher, and the test asserts the two agree. So B1(c) buys: the mapping is written down once, in the place the repo already uses for it, and drifts loudly instead of silently. It does NOT yet buy: point a new tenant at a different field name and have the loader follow. Making the ledger LOAD-BEARING (loaders read target: from config instead of hardcoding it) is a real build, not a config edit — recorded as direction, scoped OUT of this gate, and the natural first step of the parked SEAL/PAT generic-terminology line (knowledge/upgrade-plans/generic-terminology-research.md, whose §Decision item 3 is this exact identity-property question)."
  - title: "C. The MERGE-key cutover — the hazard that makes this a gate"
    confirmations:
      - "C1: the SME is shown, and acknowledges, that FOUR loaders MERGE :BusinessApplication on seal_id today — seal_applications.cypher:19 (primary), manual_seal_attribution.cypher:32 (manual tier-5), pat_product_mapping.cypher:54 (PAT), software_registry.cypher:52 (registry). Three MATCH sites follow (batch_port_orchestrator, seal_attribution, seal_contacts)."
      - "C2 [the ruling]: the MERGE key flips in ONE atomic change across all four sites, never loader-by-loader. RATIONALE — a Neo4j uniqueness constraint IGNORES NULLS, so the existing businessapplication_seal constraint would NOT stop a loader that MERGEs on app_id from creating a SECOND node for an app that already exists keyed by seal_id. A partial cutover silently doubles the canonical node instead of failing. Confirm, or name the alternative discipline you want."
      - "C3: during phases 1-3 both properties are written by the same loader from the same row value, and a graph-tests/ rule asserts app_id = seal_id on every :BusinessApplication. A drift between them fails the acceptance run rather than being discovered in the console."
      - "C4: existing loaded graphs are handled by REBUILD, not migration — the wipe-and-rebuild doctrine ruled 2026-07-23 (folder property diet). Confirm that applies here too, or name the backfill."
  - title: "D. Dependent keys — what else carries the registry name"
    confirmations:
      - "D1 [pick one]: :Port NODE KEY (parent_seal_id, kind) — (a) follows to parent_app_id in the same change [consistent; but a NODE KEY cannot be added additively, so this needs create-then-drop and is the one genuinely awkward step], (b) follows in a later phase [AGENT RECOMMENDATION — it is an internal FK with no API or console exposure, so it carries none of the timing pressure that argues for §B; splitting it keeps the risky constraint work out of the phase that has to land before the console], (c) stays as-is permanently [then the neutral-name rule has a visible exception on a canonical child node]."
      - "D2 [CORRECTED 2026-07-27 — the site count and option (b) were both wrong in v3]: attribution_id embeds the authority in a STRING key — app_id + '|SEAL|' + role + '|' + sid. FOUR sites, not three: seal_applications.cypher:124,147,170 (role is a LITERAL — application_owner / cto / primary_information_owner) and seal_contacts.cypher:53 (role is DATA — row.role_name). The fourth is the one that matters: it is the only site where the role segment comes from the source, so any re-shaping of the key has to hold for values nobody has enumerated. Rule: (a) leave it — it is an opaque composite, not a queried property; or (b) drop the '|SEAL|' segment, leaving a 3-part app_id|role|sid key. AGENT RECOMMENDATION: (a), and record WHY, so the next reviewer does not read it as an oversight. NOTE the 4-part shape may not be NARROWED past that: drop the sid and two L1 Operate Managers on one app collide; drop the role and one person holding three accountable roles collides. Both are the normal case, not the edge case. [VOID: v3's option (b) read 're-form it from id_authority so the literal disappears' — id_authority is the property B0 WITHDREW, so the page was offering a choice built on something it had already deleted. Replaced above with the alternative that can actually be built.]"
  - title: "E. External surface contract — the part that is free today"
    confirmations:
      - "E1 [CORRECTED + NARROWED 2026-07-27 — v3 overreached into a signed gate, and still said 'pair']: drydocs_api and web/ expose the NEUTRAL IDENTITY PROPERTY ONLY — app_id. ('NEUTRAL PAIR' was an id_authority leftover; §B0 withdrew the second element, so there is no pair — same defect class as §D2's void option (b).) No seal_id in a route, a QuerySpec, a column header, or a demo fixture: web/src/data/mappingsDemo.ts loses app_seal_id. SCOPED OUT by §B2(ii) — the EVIDENCE vocabulary. v3 said \"match_method: 'seal_var' is reworded\", which was wrong twice over: (1) 'seal_var' is not the contract, it is a single demo-fixture string at web/src/data/mappingsDemo.ts:77 — the real contract is drydocs/loaders/seal_attribution.py:54-60, MATCH_METHOD_BY_TIER = {SEAL: 'seal', FID: 'fid', APP_NAME: 'app_name', ALIAS: 'alias'} over ATTRIBUTION_TIERS = ('SEAL','FID','APP_NAME','ALIAS'); and (2) those tier names were SIGNED at seal-attribution-match-policy (2026-07-14), which §A1 of this very page declares UNCHANGED — so E1 as written contradicted A1 and would have silently re-opened a signed gate. The tier vocabulary and match_method values STAY. Only the fixture's app_seal_id and its stray 'seal_var' value are corrected, the latter to the real 'seal'. This is the rule that costs nothing today and is unaffordable once routes and fixtures depend on it."
      - "E2: E1 stands EVEN IF §B rules (c) keep-seal_id — in that case the API maps seal_id to a neutral app_id in its projection layer. The console contract should not leak an internal registry name to every viewer regardless of what the graph stores. Confirm or reject this separability."
      - "E3: 22 seal_id references live in drydocs_api/query_specs.py and 14 in drydocs_api/mappings.py — the API is already the second-largest holder after the attribution loader. E1 is therefore a real diff, not a formality."
  - title: "F. Where the registry name still lives (RESHAPED v2)"
    confirmations:
      - "F1 [replaces the withdrawn id_authority vocabulary; extended v3; CORRECTED 2026-07-27 — the list was one short]: after this gate the string 'SEAL'/'SEALID' survives in the repo in exactly FIVE legitimate places — (1) config/taxonomy/business-application.yaml (source_of_record + identifier, the single record of authority), (2) config/source-registry.yaml (the seal-extract source entry), (3) config/source-mappings/seal-extract.yaml (the field-name ledger, if B1(c) signs — the SEALID column declaring `target: BusinessApplication.app_id`), (4) module/file names (seal_applications.py and kin, whose rename is phase 3+ and lowest value per §G2), and (5) CONSTRAINT NAMES — constraints.cypher:36 is named `businessapplication_seal`, which is neither config nor a filename and so fell through v3's four-way split. It is the most OPERATOR-VISIBLE survivor of the five: it prints in `SHOW CONSTRAINTS` and in the text of every uniqueness-violation error, so an operator who never opens the repo still reads the registry name. Confirm whether constraint names follow app_id or are scoped out; either is defensible, but v3 did not ask. Confirm the list is complete and intended; anything ELSE naming the registry after this gate is drift, and all five are CONFIG, filenames or schema-object names — none is graph data."
      - "F2: the durable home for what 'SEAL' MEANS is a CatalogBusinessTerm-shaped glossary (docs/patterns/data-catalog/enterprise-data-catalog-ontology.md) — the same conclusion the reopened gate-log Q6 acronym question is circling, and the Unity Catalog note's takeaway 2 (a controlled vocabulary needs an enforcement point or it rots). Recorded as DIRECTION only; the glossary is not built, is not gated, and this gate does NOT depend on it. B0 makes it LESS urgent, not more — with one permanent authority there is no id space to disambiguate, only a term to define."
