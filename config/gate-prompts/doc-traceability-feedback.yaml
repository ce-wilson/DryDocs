# SME gate-prompt spec — Documentation traceability + review-feedback model
# (backlog L7). Drafted by the ontology-mapper 2026-07-20; AMENDED same day per SME
# direction (the SaaS reframe): the six classes are PRODUCT-PLANE ontology — generic
# documentation/traceability concepts from ANY registered source — with DryDocs' own
# outline system as source connector #1 ("tenant 0", the app documenting itself), and
# the Full Circle / incremental-context-loop connectors (Jira, Gherkin/BDD, BRD —
# SDLC-Docs/extracted/plan-incrementalContextLoop.prompt.md) feeding the SAME classes
# later. Amendments: source-agnostic class definitions + origin discriminator;
# managed-vs-ingested content boundary as the Document/Chunk-split rationale;
# source-namespaced keying; FeedbackNote lifecycle status; per-source requirement-id
# config; Jira-board configuration caveat (section D).
# SIGNED OFF 2026-07-20 (SME in-chat session, chad.wilson) — ALL 21 confirmations
# (A1-A7, B1-B4, C1-C4, D1-D7) confirmed as recommended, 0 edited, 0 rejected;
# transcribed to config/gate-log.md same day. Effect: map entry confirmed; the six
# node classes + six relationship entries ACTIVE; supplement terms landed in
# ontology_supplement.cypher same day; connector-#1 loader (load-doc-traceability)
# follows under the same L7 item.
# Historical note — the pre-sign-off framing of this page read: the six new node_classifications
# entries (DesignDoc, DocSection, Requirement, Component, TestCase, FeedbackNote) and the six
# new relationship_vocabulary.yaml entries (doc_section_part_of,
# doc_requirement_specified_in, doc_requirement_implemented_by, doc_requirement_verified_by,
# doc_feedback_annotates, doc_feedback_authored_by) stay status: planned; the
# doc-traceability-feedback map entry (config/taxonomy-ontology-map.yaml) stays
# status: proposed. No supplement block, no loader, no graph write until this gate is run and
# signed off, and a separate K-numbered follow-up lands the supplement + loader (same
# lifecycle as every prior gate in this file). Mechanism-only: the worked examples below cite
# only already-committed sample content (docs/design/controlm-ingestion-tdd.md,
# docs/design/feedback/drydocs-startup-refresh-runbook-rev1.yaml) — no confidential data.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: doc-traceability-feedback
title: "SME Gate — Design-doc traceability matrix + anchor-keyed feedback model (DesignDoc / DocSection / Requirement / Component / TestCase / FeedbackNote)"
step: "Pre-activation gate for backlog L7 — models the TDD requirements traceability matrix (docs/design/templates/tdd.outline.yaml) and the anchor-keyed SME feedback loop (docs/design/feedback/README.md) as DryDocs graph edges"
summary: >
  Backlog L7, reframed at SME direction (2026-07-20): define the PRODUCT-PLANE documentation
  ontology — "what specifies what, what implements it, what proves it, and what did the
  reviewer say about it" — validated on DryDocs' own docs as source connector #1 (tenant 0,
  the SaaS app documenting itself), with the Full Circle / incremental-context-loop
  connectors (Jira, Gherkin/BDD, BRD) feeding the same classes for customers later. This
  page proposes: (a) six new SOURCE-AGNOSTIC node classes — DesignDoc (a managed/authored
  document), DocSection (an authored anchor within it), Requirement (a requirement
  proposition, kind FR|UC|NFR), Component (the artifact that implements it), TestCase (the
  proof), and FeedbackNote (one anchor-keyed review annotation with lifecycle status) —
  none of which had an existing equivalent anywhere in relationship_vocabulary.yaml or
  drydocs_core/schema/*.cypher (grepped for Module/Component/Test: nothing found; see
  section A), all keyed with a source/origin namespace (no single-repo assumption); (b) a
  structural containment edge (DocSection -[:PART_OF]-> DesignDoc, section B); (c) three
  traceability edges radiating off Requirement — SPECIFIED_IN (design-section),
  IMPLEMENTED_BY (component/module), VERIFIED_BY (test/verify) — one PROV-grounded
  (hadPrimarySource), two local with Ramesh & Jarke reference-model backing (section B);
  (d) the review-feedback loop — FeedbackNote -[:ANNOTATES]-> DocSection plus authorship
  attribution to the reviewing Employee, rev correlation, and lifecycle status (section C);
  (e) the open items that need an SME call but are not proposed one way or the other here,
  including the Jira-board configuration caveat (section D). No graph write happens until
  every confirmation below is ticked and logged to config/gate-log.md.
meta:
  Module: "drydocs-core (ontology)"
  Source: "docs/design/templates/tdd.outline.yaml (schema drydocs.doc-outline.v1, the traceability-matrix block definition) + docs/design/feedback/README.md (schema drydocs.docgen.design_doc.feedback_yaml) + the worked examples docs/design/controlm-ingestion-tdd.md and docs/design/feedback/drydocs-startup-refresh-runbook-rev1.yaml"
  Registry ref: "No config/source-registry.yaml entry — design docs are repo-native content (docs/design/), not an external/ingested source; see capture disposition below"
  Classification: "Internal-Public (this page, mechanism only, and the tdd.outline.yaml template itself) · an individual design doc or feedback file inherits its OWN classification per docs/design/feedback/README.md ('keep confidential notes in internal/') — never assumed Internal-Public by default"
  Taxonomy: "None — no config/taxonomy/ capture file exists for design-doc structure (the classification source is the outline/feedback schema files themselves, not a config/taxonomy/ import). See capture disposition in the map entry."
  Ontology map: "config/taxonomy-ontology-map.yaml #doc-traceability-feedback (status: proposed) + drydocs_core/ontology/relationship_vocabulary.yaml (6 new node_classifications entries + 6 new local_relationships entries, all status: planned)"
  Source of record: "docs/restructure/backlog.yaml L7 · docs/design/templates/tdd.outline.yaml traceability: block · docs/design/feedback/README.md"

mapping:
  - n: 1
    element: "Six new node classes — DesignDoc, DocSection, Requirement, Component, TestCase, FeedbackNote"
    target: "node_classifications entries in relationship_vocabulary.yaml, all prov:Entity, all status: planned (registration only, not an edge)"
    edge: "node_classifications registration, not an edge  [PROPOSED — not a matrix row]"
  - n: 2
    element: "DocSection structural containment — recommended shape"
    target: "(:DocSection)-[:PART_OF]->(:DesignDoc)"
    edge: "structural containment, no PROV row (docs_chunk_part_of precedent)  [PROPOSED — doc_section_part_of]"
  - n: 3
    element: "Requirement -> design-section anchor (traceability-matrix column 2)"
    target: "(:Requirement)-[:SPECIFIED_IN]->(:DocSection)"
    edge: "prov:hadPrimarySource (prov:wasDerivedFrom family)  [PROPOSED — doc_requirement_specified_in]"
  - n: 4
    element: "Requirement -> component/module (traceability-matrix column 3)"
    target: "(:Requirement)-[:IMPLEMENTED_BY]->(:Component)"
    edge: "no PROV/standards row — local  [PROPOSED — doc_requirement_implemented_by]"
  - n: 5
    element: "Requirement -> test/verify (traceability-matrix column 4)"
    target: "(:Requirement)-[:VERIFIED_BY]->(:TestCase)"
    edge: "no PROV/standards row — local  [PROPOSED — doc_requirement_verified_by]"
  - n: 6
    element: "FeedbackNote -> the DocSection it annotates"
    target: "(:FeedbackNote)-[:ANNOTATES]->(:DocSection)"
    edge: "Entity -> Entity aboutness, no PROV row (docs_describes precedent)  [PROPOSED — doc_feedback_annotates]"
  - n: 7
    element: "FeedbackNote authorship — SME attribution, collapsed form"
    target: "(:FeedbackNote)-[:WAS_ATTRIBUTED_TO {role: feedback_author}]->(:Employee)"
    edge: "prov:wasAttributedTo (p2_authored_by precedent, NOT the K4/K5 reified pattern)  [PROPOSED — doc_feedback_authored_by]"

provenance:
  - label: "node_classifications#DesignDoc / #DocSection / #Requirement / #Component / #TestCase / #FeedbackNote (relationship_vocabulary.yaml)"
    source_object: "docs/design/templates/tdd.outline.yaml (sections/subsections, traceability: block) + docs/design/feedback/README.md (feedback_yaml format) + drydocs/docgen/doc_outline.py (ANCHOR_RE, feedback_anchor_valid)"
    key: "SOURCE-NAMESPACED throughout (SaaS reframe — no single-repo assumption): DesignDoc (origin, doc_id) ; DocSection (origin, doc_id, anchor) ; Requirement (origin, requirement_id) ; Component (origin, ref) — same-basename ambiguity within one origin stays an SME-merge case ; TestCase (origin, ref) ; FeedbackNote has no independent key (one per anchor per feedback-file row within its origin). Connector #1 sets origin = drydocs-design-docs, doc_id = filename stem"
    loader: "~ (none yet — proposal only, no loader exists)"
    properties:
      - {name: doc_id / doc_type / rev / status / commit, origin: source, from: "the doc's own front-matter anchor (docs/design/templates/tdd.outline.yaml anchor: front-matter)", note: "DesignDoc node properties"}
      - {name: anchor / heading / required, origin: source, from: "tdd.outline.yaml sections[].anchor/heading/required, or an L11 derived subsection anchor", note: "DocSection node properties"}
      - {name: requirement_id / kind / description / matrix_status / origin, origin: source, from: "one traceability-matrix table row (docs/design/controlm-ingestion-tdd.md anchor: traceability-matrix); kind = the id prefix (FR|UC|NFR) under connector #1", note: "Requirement node properties; id FORMAT is per-source configuration (connector #1: tdd.outline.yaml pattern, mode: loose today) — see section D"}
      - {name: anchor / note / doc_id / doc_rev / status / origin, origin: source, from: "docs/design/feedback/<doc-id>-rev<N>.yaml, one row of `notes:`", note: "FeedbackNote node properties; doc_rev parsed from the filename's <N>; status = review lifecycle (open|applied|rejected|superseded) — see section C"}
  - label: "(:Requirement)-[:SPECIFIED_IN|IMPLEMENTED_BY|VERIFIED_BY]->(...) — the traceability-matrix row, fanned out"
    source_object: "One markdown table row under the traceability-matrix anchor (docs/design/templates/tdd.outline.yaml traceability: block; worked example docs/design/controlm-ingestion-tdd.md rows FR-CMI-001..007, NFR-CMI-001)"
    key: "the row's requirement id (loose format today) + the design-section / component / test cell text"
    loader: "~ (none yet — proposal only, no loader exists)"
    properties:
      - {name: design_section_cell, origin: source, from: "matrix column 'design-section anchor' — must cite a known outline anchor (drydocs/docgen/doc_outline.py check())", note: "resolves to the SPECIFIED_IN target DocSection"}
      - {name: component_cell, origin: source, from: "matrix column 'component/module' — free-text file/module/CLI-command citation", note: "resolves to the IMPLEMENTED_BY target Component; Component identity keying is an open question, section D"}
      - {name: test_cell, origin: source, from: "matrix column 'test/verify' — free-text pytest id / m3-verify check / gate name / graph-tests file", note: "resolves to the VERIFIED_BY target TestCase; heterogeneous citation kinds, section D"}

sections:
  - title: "A. Node classes — product-plane, source-agnostic: DesignDoc, DocSection, Requirement, Component, TestCase, FeedbackNote"
    confirmations:
      - "PRODUCT-PLANE FRAMING (the SaaS reframe, SME direction 2026-07-20): all six classes are defined SOURCE-AGNOSTIC — generic documentation/traceability concepts carrying an `origin` discriminator property — with DryDocs' own outline system registered as source connector #1 (tenant 0, the app documenting itself) and the Full Circle / incremental-context-loop connectors (Jira, Gherkin/BDD, BRD — SDLC-Docs/extracted/plan-incrementalContextLoop.prompt.md) feeding the SAME classes later. Confirm the product-plane definitions (the original doc-system-private scoping was rejected in review: a future connector would either misuse a class defined as 'a TDD matrix row' or mint parallel classes)."
      - "KEYING is source-namespaced everywhere: DesignDoc (origin, doc_id); DocSection (origin, doc_id, anchor); Requirement (origin, requirement_id); Component/TestCase (origin, ref). A bare filename stem or path string collides across repos/tenants — the single-repo assumption is rejected. Connector #1 sets origin = drydocs-design-docs. Confirm the namespaced keys."
      - "Requirement folds use cases in via a `kind` property (FR|UC|NFR — connector #1 derives it from the id prefix) rather than a separate UseCase class, even though the feasibility memo (SDLC-Docs/extracted/feasibility-memo-context-sufficiency.md) treats use cases as their own missing proposition. RATIONALE: in BDD a Gherkin scenario is simultaneously the use case AND the test, so splitting UseCase out NOW would prejudge the future BDD-connector gate. Confirm kind-folding for now, with Scenario's disposition explicitly deferred to that gate."
      - "All six are new node classes (prov:Entity). NO existing Module/Component/Test/TestCase node class was found anywhere in relationship_vocabulary.yaml or drydocs_core/schema/*.cypher (grepped both) — confirm this is still true at gate time (a component build elsewhere in the meantime would change the recommendation for Component/TestCase specifically)."
      - "Component was considered against two existing near-miss Entity classes and REJECTED as a reuse target: :Script (Control-M job-invoked artifact — CMDLINE/MEMNAME/Jar-Path lineage, m3_invokes/m3_triggers; a different domain, job-invocation not requirement-implementation) and :PipelineService (deployable pipeline service definition inside a :Code codebase — service granularity, not an arbitrary file/module/CLI-command citation like `oracle_adapter.py` or `cli.ingest_controlm`). Confirm Component as its own class, or direct a reuse/fold instead."
      - "DesignDoc and DocSection are kept SEPARATE from the existing docs-corpus :Document / :Chunk labels on a PRODUCT BOUNDARY — MANAGED vs INGESTED content: DesignDoc/DocSection are authored, rev-tracked, outline-validated, annotatable (lifecycle guarantees the platform enforces); :Document/:Chunk are scraped/uploaded, deterministically H2-chunked, trust-tiered (VERBATIM/GROUNDED/SYNTHESIZED — witnessed, not governed). A customer estate will have BOTH planes, so the split is deliberate product architecture, not a temporary modeling convenience (this upgrades the draft's defensive 'don't import corpus semantics' rationale). RECOMMENDATION: confirm the two families as distinct planes; a shared supertype/interface can come later if a real cross-plane query need emerges. Display labels join the SaaS terminology-rename surface (knowledge/upgrade-plans/generic-terminology-research.md — Salesforce pattern: stable internal ids, per-tenant display labels); internal labels do NOT change."
      - "TestCase's Test/verify citations are HETEROGENEOUS in the one worked example alone: a pytest test id, an `m3-verify` invariant name, an HITL gate name (`seal-attribution-match-policy`), and a `graph-tests/*.yaml` file reference — all in docs/design/controlm-ingestion-tdd.md's single table; the context-loop connectors will add more (gherkin-scenario, jira-acceptance anticipated). Confirm a `kind` property as an OPEN enum (unit|verify|gate|graph-test today) is the right way to carry this, vs a differently-shaped node per kind (open in section D)."
  - title: "B. Structural + traceability edges — the containment shape and the standards grounding"
    confirmations:
      - "DocSection containment — RECOMMENDATION: (:DocSection)-[:PART_OF]->(:DesignDoc), the SAME label as docs_chunk_part_of (Chunk -> Document) but a NEW vocabulary entry (from/to differ — C8-clean). ALTERNATIVE, not registered: reclass DesignDoc as prov:Collection and use a CONTAINS_SECTION label (matrix row Collection -> any = prov:hadMember), mirroring the m3 folder/job family (CONTAINS_JOB / CONTAINS_FOLDER). RATIONALE for the recommendation: a design doc's outline sections are AUTHORED and ORDERED (the tdd.outline.yaml sections list, plus the FIRST_CHUNK/NEXT_CHUNK-style reading-order precedent already established for the docs corpus), not an open unordered collection of members the way a Control-M folder holds an arbitrary set of jobs — the Document/Chunk analogy is closer than the Folder/Job analogy. Confirm PART_OF, or direct the CONTAINS_SECTION/Collection shape instead."
      - "Requirement -[:SPECIFIED_IN]-> DocSection — RECOMMENDATION: ground it in prov:hadPrimarySource (a sub-property of prov:wasDerivedFrom), reusing the EXACT pattern already active for seal_had_primary_source (BusinessApplication -> Document — 'this record's specification is sourced from that document'). Confirm this reading of 'specified in' as a primary-sourcing relation, or direct a different PROV term / a local-only mapping instead."
      - "Requirement -[:IMPLEMENTED_BY]-> Component and Requirement -[:VERIFIED_BY]-> TestCase — RECOMMENDATION: local (prov_maps_to: ~), same disposition as docs_first_chunk / docs_next_chunk (structural/local edges with no standard-term fit). PROV-O has no requirement-realization or requirement-verification property, and none of ORG/DPROD/SOSA/DCAT/SKOS models this relation either. The naming IS research-grounded: the Ramesh & Jarke requirements-traceability reference models (SDLC-Docs/extracted/ref-models-for-req-traceability.json, the empirical model behind commercial traceability tools) use Satisfies/Allocated-to and Verifies as core link types — IMPLEMENTED_BY and VERIFIED_BY are those relations with the stored direction flipped to read off Requirement (the star center). Confirm no DECLARED standards term is being missed, accepting research-grounded local terms."
      - "All three Requirement-outbound edges are modeled as a STAR off Requirement (Requirement -> DocSection, Requirement -> Component, Requirement -> TestCase), mirroring the traceability-matrix table's own shape (one row = one requirement with three correlated cells), rather than a linear chain (DocSection -> Component -> TestCase). Confirm the star shape is the right read of the matrix semantics."
  - title: "C. Feedback attribution shape — qualified vs collapsed, and rev correlation"
    confirmations:
      - "FeedbackNote authorship — RECOMMENDATION: the SIMPLE/COLLAPSED form, (:FeedbackNote)-[:WAS_ATTRIBUTED_TO {role: feedback_author}]->(:Employee), the SAME shape as p2_authored_by (ControlMFolder -> Developer), NOT the K4/K5 qualified/reified Attribution pattern (BusinessApplication/Product -[:QUALIFIED_ATTRIBUTION]-> Attribution -[:HAS_AGENT]-> Employee, -[:HAD_ROLE]-> a role concept scheme). RATIONALE: the K4/K5 reified pattern exists to carry a NAMED ROLE from a fixed concept scheme (TOMRole / ProductRole) alongside the agent, because the same application/product can have several role-holders in DIFFERENT named roles simultaneously. A FeedbackNote has exactly one author and no role to qualify — 'SME feedback author' is not a multi-valued concept scheme — so reification would add a hop with no disambiguating payload. Confirm the collapsed form is sufficient, or direct registering a reified form now for a future multi-reviewer-per-note case (not observed in either worked example)."
      - "Rev correlation — RECOMMENDATION: doc_rev as a plain property on FeedbackNote (and, by extension, comparable against DesignDoc.rev at query time to detect a note that has gone stale against a newer doc rev), parsed straight from the feedback-file name's `<N>` in `<doc-id>-rev<N>.yaml`. ALTERNATIVE, not proposed: a separate `:DesignDocRevision` node per rev, with a PROV-style wasRevisionOf chain and FeedbackNote pointing at the specific revision node instead of a property. RATIONALE for the recommendation: the outline/feedback format tracks Rev as a front-matter field on the CURRENT doc, not as first-class per-rev nodes (no prior rev's markdown is retained in the repo once superseded — Rev 1/2 content for controlm-ingestion-tdd.md is git-history only, not a separate committed artifact), so a property-based staleness check costs nothing extra to load and matches how the doc itself already tracks Rev. Confirm the property approach, or direct the Revision-node shape if per-rev graph history turns out to matter for a real use case."
      - "NOTE LIFECYCLE (added at the SaaS reframe): FeedbackNote carries a review-workflow `status` property — open|applied|rejected|superseded. The worked precedent already exists in connector #1: the drydocs-startup-refresh-runbook rev1 notes were APPLIED in Rev 2 and the doc's own 'What changed in Rev 2' block says so — the draft modeled the note but not its disposition, which a customer review workflow (and our own 'which feedback is still unaddressed' query) needs. Collapsed attribution is unaffected (multi-reviewer = multiple notes, one author each). Confirm the status property and its enum."
      - "Confirm the FeedbackNote -> DocSection -> Requirement correlation path is acceptable as a MIXED-DIRECTION traversal — (:FeedbackNote)-[:ANNOTATES]->(:DocSection)<-[:SPECIFIED_IN]-(:Requirement) — rather than requiring a directly-stored FeedbackNote -> Requirement edge. The reverse-direction read on SPECIFIED_IN already has a documented precedent (m3_was_informed_by / m3_triggers both note a 'logical vs stored direction' distinction) — but a direct FeedbackNote -[:ABOUT_REQUIREMENT]-> Requirement shortcut edge was NOT proposed here (it would restate the ANNOTATES + SPECIFIED_IN chain, close to a same-row join-restatement even though the two edges don't share one source row — flagged for the SME to weigh in either way)."
  - title: "D. Open items — flagged, not decided here"
    confirmations:
      - "Component identity/keying RESIDUAL: the SaaS reframe resolves the cross-repo half (keys are (origin, ref) — section A), but WITHIN one origin two artifacts can still share a basename (the same ambiguity m3_invokes documents for :Script — 'same-basename multi-mount duplicates surface in lineage-review for SME merge, never auto-merged'). Proposed disposition: same SME-merge idiom, never auto-merged. Confirm, or direct a stricter ref convention (repo-relative path) for connector #1."
      - "TestCase.kind enum (unit|verify|gate|graph-test) — proposed as a free property, not gated to a fixed list the way TOMRole/ProductRole are fixed skos:Concept schemes. Confirm free-text is fine for now, or direct a fixed enum (and if fixed, whether it needs its own skos:ConceptScheme like the role families)."
      - "precedence_authority for this whole family: config/precedence.yaml's four declared authorities (bmc-baseline, internal-standards, seal-pat-source-of-record, lob-product-team) don't explicitly `govern` design docs, requirements, or feedback. `internal-standards` was used as the closest fit in the map entry, but this is NOT a proposal to add a new authority — flagged only, mirroring how seal-pat-source-of-record itself started as a flagged gap before becoming a registered authority."
      - "ANNOTATES as a local label: the W3C Web Annotation model (`oa:hasTarget`) is the standards-precise term for 'a note targets a section of a document', but `oa:` is not in drydocs_core/ontology/namespaces.py and is not a declared company standard. Not proposed for adoption here — flagged as a candidate for a future namespaces.py addition if annotation modeling grows beyond this one use."
      - "Requirement id enforcement, reframed PER-SOURCE (replaces the draft's global loose/strict timing question): each source/tenant has its own id convention (FR-*, REQ-*, Jira keys), so the id pattern and its enforcement mode belong in per-source connector CONFIGURATION, not a global rule — graph ingestion mirrors each source's configured mode at load time. Connector #1's config is tdd.outline.yaml's requirement_id_pattern + mode (loose today, strict later). The config surface itself is backlog O12's admin-configuration page scope (read-only view; edits stay gate-bound). Confirm the per-source config disposition."
      - "JIRA-BOARD CONFIGURATION CAVEAT (SME direction 2026-07-20): each BusinessApplication or DevTeam MAY have a Jira board, and the association KEYS OFF THE JIRA PROJECT NAME. This is the join key the future Jira connector (incremental-context-loop plan) uses to attach Jira-sourced Requirements/TestCases to the ownership graph — so the board-to-owner mapping must be captured as per-tenant CONFIGURATION (backlog O12 scope, alongside the per-source id patterns) BEFORE that connector's gate. No edge is proposed here (a JiraBoard/JiraProject node class + its association edge are that future gate's business); this caveat only reserves the key and records where the config lives. Confirm the caveat as recorded."
      - "LINKAGE, on the record: this gate is the seed of the PRODUCT-plane documentation ontology — connector #1 = the DryDocs outline system (tenant 0); planned connectors = SDLC-Docs/extracted/plan-incrementalContextLoop.prompt.md (Jira, Gherkin/BDD, BRD — 'fill the requirements gaps for context'); display-label configurability = knowledge/upgrade-plans/generic-terminology-research.md; SME config surfaces = backlog O12. L7 was groomed p3 as dogfooding — under this framing it carries product-ontology weight; whether that re-tiers L7 or seeds a productization epic is the SME's parked plan decision, NOT decided by signing this gate."
