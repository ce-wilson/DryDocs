sections:
  - title: "A. The attach level — product or area-product"
    confirmations:
      - "A1. THE CONFLICT, RULED. K5 §B signed tech_partner as AreaProduct-only and the supplement seeds scope = 'AreaProduct'. Against that: the SME's catalog placement (2026-08-06, Product level) and the company role guidance ('Accountable technology leader for a product'), which also defines Area Tech Partner separately. K5's stated basis was the rename history — the one reading under which two roles collapse into one. Rule the attach level. AGENT RECOMMENDATION: PRODUCT — the only two estate voices in evidence (SME + company guidance) agree against the signed record, and the signed record's basis is the conflation §B2 names rather than an independent observation."
      - "A2. THE SCOPE VALUE THAT FOLLOWS. If A1 rules Product: (option 1) scope = 'Product' strictly — correct IF §B admits area_tech_partner, since the area-level holding then has its own concept; (option 2) scope unset, i.e. Product-or-AreaProduct like the other five — correct only IF §B rejects a separate concept, so one concept must legally attach at both levels. The overlap clause ('may also assume... based on product size') is about a PERSON holding both roles, not about one concept spanning both classes — it argues for option 1 plus §B admission, not for option 2. Confirm the pairing rule: the scope value is decided BY the §B outcome, not independently of it."

  - title: "B. Area Tech Partner — an eighth concept in a scheme fixed at seven"
    confirmations:
      - "B1. ADMIT, FOLD, OR DEFER. The scheme's fixed: true means new roles require a gate — this page is that gate, so the fixed rule is being exercised, not broken. (a) ADMIT area_tech_partner as the eighth concept, scope 'AreaProduct', on the role doc's separately-defined responsibilities (domain strategy + people management vs product technology accountability) — the second worked example, after G35's 7-vs-9, of a fixed scheme catching up with the estate. (b) FOLD: one tech_partner concept, level read from the attach node (Product = product-level, AreaProduct = area-level) — cheapest, but it erases a distinction the company's own guidance draws, and SKOS-wise two responsibility sets under one prefLabel is the shape G35 §G9 just unwound for Operate Manager. (c) DEFER until a person-level cabinet extract shows Area Tech Partner as a distinct accountable holding — the evidence today is guidance prose, not an attribution row; but note the dcat gate's §D1 deferral logic no longer applies as precedent, since G91 resolved that the AreaProduct TIER exists in production. AGENT RECOMMENDATION: (a) — the guidance defines two roles; modeling one guarantees the next cabinet extract repeats this gate."
      - "B2. THE CONFLATION, RECORDED WITH ITS CAUSE. Whatever A1/B1 decide, the amendment records WHY the signed record read differently: the rename history plus the may-also-assume overlap made two roles look like one at K5. Confirm that the gate-log ruling names the cause — a correction with a mechanism is a precedent; a bare flip is just churn (the G35 §G9 correction-attached pattern)."

  - title: "C. The consequence, restated — and the guard that would have caught it"
    confirmations:
      - "C1. THE MEASUREMENT, CORRECTED. Idea-75's 'no rows and no loader' was accurate on 2026-08-06 and is half-stale now: G91 activated catalog_has_area_product (loader area_products.cypher) on 2026-08-18 and production PAT carries the layer; the sample's area_products: 0 is a data gap with independent lifecycles (K5 §B's own words). What remains true: NO Product Cabinet attribution loader exists on either side, so nothing writes any of the 7 concepts today — and the seed still places tech_partner on the one class the producer sample cannot exercise. Confirm the corrected statement of consequence, so this amendment rests on current facts rather than on the groomed snapshot."
      - "C2. THE SEEDED-CONCEPT-REACHABILITY GUARD. Twice now a signed concept sat unreachable with nothing noticing: technology_risk_controls (G35 §A2, Individual scope — no group to map to) and tech_partner-per-Idea-75 (attach class then unloadable). Proposed: a graph-test/QA check — every seeded concept with a scope property must name a node class that is loadable (an active loader or sample rows for the attach class), WARN-tier, run where the supplement-drift checks run. A graph-test, not a database constraint (G35 (c): Neo4j cannot declare a count over a traversal). Confirm grooming it as a follow-up item at sign-off — the item is the deliverable; the check's exact tier and home are the builder's call."

  - title: "D. The change_note re-read — what the CTO rename history describes now"
    confirmations:
      - "D1. THE NOTE'S TWO HALVES. Signed text: 'this area-product role was formerly named CTO in SEAL; SEAL's CTO now denotes the product-level role.' If A1 rules Product, the halves collapse — the note calls its own concept area-product while its second half assigns the CTO name to the product level, i.e. plausibly the SAME role. Rule what the note becomes: rewritten on tech_partner to record the actual history (formerly CTO in SEAL; attach level corrected at this gate, with the K5 reading and its cause per §B2) — and if §B admits area_tech_partner, rule WHICH concept inherits the rename history, since 'the area-product role formerly named CTO' may have been describing the area role all along. The note is skos:changeNote — history accretes, it is never silently deleted."
      - "D2. THE ALIAS FENCE, RESTATED SO IT CANNOT BE RE-LITIGATED HERE. G35 §A6 ruled the SEAL-side contact-extract alias 'tech partner' -> 'CTO' STAYS. That is a TOM-family extract-name fact about :BusinessApplication attribution and is UNAFFECTED by anything this page decides — both rulings are true at once (Idea-75 says exactly this). Confirm the fence."

  - title: "E. Scope fence and landing mechanics"
    confirmations:
      - "E1. UNTOUCHED, BY NAME: the TOM role family and everything G35 signed; the three attribution forms (catalog_cabinet_qualified_attribution, catalog_cabinet_attribution_had_role, catalog_cabinet_attributed_to — all active, shapes unchanged); the other five ProductRole concepts; area_product_owner's AreaProduct-only scope; the attribution_id 4-part shape and the match-policy tiers. Confirm the fence."
      - "E2. HOW THE RULING LANDS. Nothing is edited at draft. At sign-off: the supplement edit (p4 scope + change_note, plus the area_tech_partner seed if §B admits it) lands as its own logged change and a supplement re-apply refreshes already-loaded graphs (the K5 sign-off-corrections precedent); the map entry product-cabinet-attribution takes an AMENDMENT note recording this gate's date and outcome (H4 — same source, same subgraph, never a second entry); the C2 guard item is groomed. Confirm the landing list — it is the build's checklist, so sign-off inherits it as obligations rather than discovering them."
