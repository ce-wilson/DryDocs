# AMENDMENT GATE, AND DRAFTING DECIDES NOTHING: this page RE-OPENS one clause of
# a SIGNED ruling (product-cabinet-attribution / K5, 2026-07-20) on the G35
# model — a signed gate is re-opened through a gate, never by an edit. K5 stays
# signed, the supplement stays unedited, and the ProductRole scheme stays
# exactly the fixed 7 until the SME signs this page (the G27/W1/N10/G61
# precedent).
#
# WHAT MOVED SINCE THE ITEM WAS GROOMED, stated up front because one of the
# item's four questions was written against a premise that is now partly wrong
# (the G35 2026-08-10 header is the model for saying so):
#   * Idea-75 (2026-08-06) measured tech_partner as "scoped to a node class
#     that has no rows and no loader" — a signed concept nothing can write, the
#     technology_risk_controls failure mode (G35 §A2) reproduced. On 2026-08-18
#     G91 ACTIVATED catalog_has_area_product with a real loader
#     (area_products.cypher + the C22 orphan sweep), and the SME confirmed
#     (2026-08-17) that the production PAT extract carries the AreaProduct
#     layer — the sample's area_products: 0 is a DATA gap, not a model gap.
#     §C1 restates the consequence against current facts: tech_partner's
#     SPECIAL exposure is gone; its MISPLACEMENT is not.
#   * The catalog_cabinet_* attribution entries K5 left planned went ACTIVE
#     when the K6 supplement landed. The fence (§E) names them untouched.
# The attach-level CONFLICT — the item's core — is unchanged by any of this.
#
# SCOPE FENCE — what this page may NOT touch (§E makes it a confirmation):
#   * the TOM role family and everything G35 signed (2026-08-11), including the
#     §A6 alias ruling this page explicitly does not disturb;
#   * the three attribution forms (reified chain + collapsed twin), all active;
#   * the other five ProductRole concepts and area_product_owner's
#     AreaProduct-only scope;
#   * the attribution_id shape and the match-policy tiers (their own fences).
#
# Mechanism and role names only. Role names are public-tier throughout the repo
# (catalog_ontology_supplement.cypher, config/taxonomy/). The role-doc quotes
# are responsibility prose from a captured company guidance document already
# tracked at Internal-Public. No SEAL ids, no application names, no person
# names, no SIDs. Production-PAT counts stay in the internal twin (G91's own
# handling) and are not reproduced here.
# classification: Internal-Public
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: tech-partner-attach-level
title: "SME Gate — the Tech Partner attach level: product or area-product, whether Area Tech Partner is its own concept, and what the CTO rename note describes after the correction"
step: "Amendment to product-cabinet-attribution §B (K5, signed 2026-07-20) — before any Product Cabinet loader is built against the scheme, so the first attribution rows land on the right node class"
summary: >
  Rules four coupled things about the Product Cabinet role scheme's
  tech_partner concept. (a) THE ATTACH LEVEL: K5 §B signed "area_product_owner
  AND tech_partner attach ONLY to :AreaProduct", but the SME (in-chat,
  2026-08-06) placed Tech Partner in the ProductCatalog-Product hierarchy at
  the PRODUCT level, and the company's own role guidance agrees — it defines
  Tech Partner as the accountable technology leader FOR A PRODUCT and lists
  Area Tech Partner as a SEPARATE role that owns the technical strategy for
  the domain. K5's stated basis for the AreaProduct scope was the rename
  history, which is exactly where two roles can look like one. (b) WHETHER
  AREA TECH PARTNER GETS ITS OWN CONCEPT in a scheme K5 fixed at exactly 7 —
  the second worked example, after G35's 7-vs-9, of what a FIXED scheme costs
  when the estate holds more classes than the signature; the alternatives
  (one concept whose level is read from the attach node, or deferral until a
  cabinet extract shows the role as a distinct holding) are laid out with
  costs. (c) THE CONSEQUENCE, RESTATED AGAINST CURRENT FACTS: G91 activated
  the AreaProduct hop after the item was groomed, so the "no rows and no
  loader" measurement is stale — what remains true is that no Product Cabinet
  loader exists on either side, and the seed placed a concept on a class the
  producer sample cannot exercise; §C asks for the seeded-concept-reachability
  guard that would have surfaced both this and G35 §A2 at seed time. (d) THE
  CHANGE_NOTE RE-READ: if tech_partner is product-level, the signed note's two
  halves ("this area-product role was formerly named 'CTO' in SEAL; SEAL's CTO
  now denotes the product-level role") may be describing one level, and the
  rename history may belong to whichever concept §B admits. Confirming this
  page authorizes NO graph write; the supplement edit, the scheme change and
  the map-entry amendment land afterwards as their own logged change, with a
  re-apply refreshing already-loaded graphs (the K5 sign-off-corrections
  precedent).

