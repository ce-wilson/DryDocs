# SME gate-prompt spec — whether a second UI track (Salt DS) opens at all, and if it does,
# the five rulings the Idea-192 PoC left open (backlog WEB24 drafts AND runs this page).
# GATE-BOUND AND DECIDES NOTHING: drafting a page is not a ruling (the G27/W1/U11 precedent).
# The locked single-track stack (docs/design/ui-exploration/site-plan.md section 1) and its
# pin (tests/unit/test_software_registry.py::test_web_console_stack_matches_the_locked_site_plan)
# change ONLY on a signed record, and even then only through the follow-up item the record names.
# Section A is asked FIRST: sections B and C are moot unless A1 opens a track.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
updated: 2026-09-11

id: salt-ds-second-track
title: "SME Gate — does a second UI track (Salt DS) open, and if it does: provider shape, status vocabulary, grids, brand and version policy"
step: "The Idea-192 PoC (/lab/salt-poc on branch wip/idea-192-desktop) renders /load-map three ways over the same committed artifact: as it ships, on Salt's own theme, and on Salt with the DryDocs tokens. It answered the four questions a cost estimate was blocked on and raised five rulings in their place. Findings: docs/design/ui-exploration/salt-ds-poc.md. Nothing changes before this page signs, and the PoC code stays off main until A1 has an answer."
summary: >
  Section A asks the one question everything else waits on: does a second UI track open at all,
  given the locked single-track stack and the 2026-08-27 ruling that Salt is preferred
  company-side and not mandated. Section B asks the five rulings the PoC left open, each with
  the measurement behind it: provider shape, status vocabulary, grids, brand against Kept
  Orbit, and version policy. Section C names what follows a ruling. Section D fences what this
  page does not ask.
meta:
  Module: "drydocs-web (web/src, the console's component layer). No graph, ontology, loader or data-source surface is touched"
  Source: "docs/design/ui-exploration/salt-ds-poc.md (the PoC findings, measured 2026-09-11) · branch wip/idea-192-desktop (the PoC code: web/src/routes/SaltPocRoute.tsx and .css, not on main by WEB24 clause f) · docs/design/ui-exploration/site-plan.md section 1 · docs/design/ui-exploration/ui-conventions.md section 1 · docs/design/ui-exploration/kept-orbit-philosophy.md · config/taxonomy/software-registry.yaml (stack: web-console) · upstream https://github.com/jpmorganchase/salt-ds.git (Apache-2.0), read at commit deb1ee156"
  Precedent: "site-plan.md decision 2026-07-17 (one track; Salt DS dropped) · user ruling 2026-08-27 recorded on Idea-192 (Salt preferred company-side, NOT mandated) · O81 (2026-08-31) — NVL joined the locked stack by AMENDING the site-plan row once a requirement existed, the shape any adoption here would take · G27/W1/U11 — a drafted prompt decides nothing"
  Registry ref: "no config/source-registry.yaml row — this gate binds no data source. The one register it can move is config/taxonomy/software-registry.yaml (stack: web-console), and only through a follow-up item after a signed A1 (i)"
  Classification: "Internal-Public — mechanism and public-package facts only: a public Apache-2.0 library, its published npm versions, and sizes and styles measured in the producer's own console. No company application, host or value"
  Source of record: "backlog WEB24 (draft and run) · config/gate-log.md (transcription target; the lane drafts the record and Lane A appends it) · WEB25 (the next measurable unit; depends on WEB24)"

