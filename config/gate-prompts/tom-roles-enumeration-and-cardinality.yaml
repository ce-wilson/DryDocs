sections:
  - title: "A. The role enumeration — four lists, no two of which agree"
    confirmations:
      - "A0 CONTEXT: this section RE-OPENS §B of a gate SIGNED on 2026-07-10 and APPLIED at K4 on 2026-07-15 (the scheme's map entry is status: applied, not proposed). That is the correct route for changing a signed ruling, and it is understood that everything downstream of §B — the supplement seed, both loaders, the map entry's role_vocabulary text, the vocabulary fragment, and NODE_QUICK_REFERENCE.md — is currently CONSISTENT WITH THE SIGNED SEVEN and will need amending together, not piecemeal."
      - "A1 THE FOUR LISTS, as they stand on 2026-08-06: (i) the SIGNED SCHEME — 7 concepts in drydocs_core/schema/seal_ontology_supplement.cypher:176-198; (ii) the PYTHON ENUM — 10 source names in drydocs_core/models/seal.py:87-108 (SealRole), which is what a contact row is validated against; (iii) the LOADER CROSSWALK — 4 names mapped in drydocs/loaders/cypher/seal_contacts.cypher:41-46, everything else falling to ELSE null; (iv) the TAXONOMY CAPTURE — 13 names in config/taxonomy/business-application.yaml, rebuilt the same day from the SME's list (§A1c). Confirm the divergence is understood as the actual state, not as an artefact of this page."
      - "A1b THE CAPTURE MOVED TWICE DURING THE WALK, and the movement is recorded rather than absorbed. Until 2026-08-06 it listed 6 names, carried Chief Business Technologist and Risk Manager, and carried neither CTO nor Application Owner — the state §A was originally written against. That day the SME first re-pointed the 70001 membership block (6 -> 8 names), then supplied the full list (§A1c) and the capture was rebuilt wholesale to 13. TWO THINGS THE WALK MUST NOT MISREAD. (1) The capture now AGREES with the SME's list exactly, and that agreement is not corroboration — it is a transcription. The capture is downstream of the list, so it cannot be cited as a second surface confirming it, and §A is still ruled against ONE stated enumeration plus three disagreeing code surfaces. (2) The capture is the only one of the four lists a person can edit without a test noticing (§A8), which is precisely why it could move twice inside one gate while nothing failed. Confirm the divergence is being ruled against the SOURCES, not against this file."
      - "A1c THE SME SUPPLIED A THIRTEEN-CLASS LIST ON 2026-08-06 (recorded verbatim in substance under sme_direction / role-enumeration-supplied). It is the first time the enumeration has been STATED rather than reconstructed from four disagreeing surfaces, and it is what §A should be ruled against — the surfaces, including the capture, are then reconciled TO it. Read carefully it does three things and declines a fourth. It CONFIRMS §A5 in passing, since L1, L2 and bare Operate Manager all appear as peers. It SETTLES §A3b's parenthetical: every acronym is written in \"Name (ABBREV)\" form and the four classes lacking a common acronym carry no bracket, so the brackets are a listing convention and the role name is the long form. It ADDS four classes that exist nowhere in the repo — Deployment Owner, Deployment Information Owner, Application Module Owner, Site Reliability Engineer — in no scheme, no enum, no crosswalk, no prior capture. And it DID NOT dispose of Chief Business Technologist or Risk Manager, both of which were absent from it — an absence from a list is not a retirement, and both remained live in the SealRole enum and flagged unmapped on every load. CBT was then RULED SEPARATELY THE SAME DAY (see G10): a class in its own right, optional, deliberately unmapped, and restored to the capture — so the observed vocabulary is 14, the stated list 13. RISK MANAGER IS THE ONE STILL UNRULED (G12), and it is the one whose absence costs something, because §A2 pairs it with the orphan concept technology_risk_controls. Confirm the list is the enumeration §A rules on, and rule that last absence explicitly rather than letting silence do it."
      - "A1d WHAT TODAY'S CODE DOES TO THAT LIST, MEASURED 2026-08-06 through the real validation path with no database: of the rebuilt capture's 31 memberships, FIVE are rejected with `unrecognised SEAL role` — Deployment Owner, Deployment Information Owner, Application Module Owner and Site Reliability Engineer (twice) — because canonicalize_role returns None for each. So FOUR OF THE SME'S THIRTEEN CLASSES CANNOT BE LOADED AT ALL, which turns §A3 from a question about a hypothetical unknown name into a question about a third of the stated vocabulary. Three further rows were renamed in flight — 'Chief Technology Officer' -> 'CTO', an alias behaving correctly — and a fourth, 'Operate Manager' -> 'L2 Operate Manager', was §A4's coercion and has since been FIXED (same day, see §A4). Netted out on application 70001: 13 source rows, 9 validate, and 8 distinct attribution_id as first measured, now 9 with the coercion gone. Four rows are still lost at the door and that number is untouched by the fix — it is §A3's question, not §A4's. Confirm these numbers are the baseline the follow-up is measured against: FOUR CLASSES UNLOADABLE, zero merged."
      - "A2 ORPHAN CONCEPT: `technology_risk_controls` is seeded in the scheme and is a member in good standing of the signed 7, and NOTHING WRITES IT. It appears in no crosswalk branch and in no literal at any loader site, so no Attribution can ever reach it. Conversely the source name that plausibly means the same thing — `Risk Manager` — has no concept and is flagged unmapped on every load. Rule whether these are the same role class under two names (crosswalk `Risk Manager` -> technology_risk_controls) or two different things (in which case the enumeration is short by one and technology_risk_controls needs a source that produces it)."
      - "A3 THE FLAG IS HALF-WIRED: seal_contacts.cypher's header states the K4 policy — role names outside the scheme are LOADED and flagged unmapped_role=true, 'surfaced for review, never guessed'. That holds only for names the Python enum already knows. `SealContactRow.role_name` is typed `SealRole` and its validator raises `unrecognised SEAL role` (drydocs_core/models/seal.py:461-467), so a genuinely NEW role name — exactly what a 7-to-9 registry drift produces — is rejected at validation and never reaches the Cypher that would have flagged it. The flag can only ever fire for the three known-but-unmapped names (Chief Business Technologist, Backup Application Owner, Risk Manager). Confirm the intended behaviour on an unknown name: hard-refuse the row, or admit it flagged."
      - "A3b A WORKED EXAMPLE ARRIVED ON 2026-08-06, from the SME's own hand: the re-pointed capture (§A1b) writes the role as `Chief Technology Officer(CTO)`. canonicalize_role is an exact lowercased dict lookup (drydocs_core/models/seal.py:159) against _ROLE_CANONICAL, which holds `chief technology officer` but not the parenthesised form — no punctuation stripping, no substring match. So that exact string returns None and the row dies at validation with `unrecognised SEAL role`, never reaching the loader that would have flagged it. It costs nothing here because the taxonomy capture is read by no code (§A8); through the contact extract it would silently cost a row. Two questions, and the order matters. FIRST: is `Chief Technology Officer(CTO)` how the SOURCE writes the name? If yes it is EVIDENCE and, by the identity gate's §B2 two-part rule, the source's term is kept and the fix is an ALIAS — never a rename of the source string to suit the canonicalizer. SECOND, whichever way that lands: confirm the canonicalizer should normalise punctuation and whitespace before lookup rather than depending on an alias per typographic variant, since an alias table that must anticipate every bracketing is the same fixed-vocabulary failure §F rules against."
      - "A4 FIXED 2026-08-06, ahead of sign-off and on explicit SME instruction (\"this should not be a coercion\"). What follows is kept in the past tense because the gate log needs the defect on the record, not just its repair — and because §A5's ruling is what made the correct target knowable. THE CHANGE: SealRole gained OPERATE_MANAGER = \"Operate Manager\" and the alias was re-pointed to it. Two lines rather than one, because deleting the bad alias alone would have left the bare name with no admissible value, and an unrecognised name does not get flagged — it kills the row (§A3). Now the row validates, keys its own attribution_id, and arrives flagged unmapped_role=true because the Cypher crosswalk still has no branch for it. NOTHING ONTOLOGICAL MOVED: the scheme keeps its 7 concepts, the crosswalk its 4 branches, and creating the three concepts remains §A's ruling to make. Measured on the bundled sample, application 70001 went from 13 rows -> 9 validating -> 8 attributions to 13 -> 9 -> 9. Guarded by tests/unit/test_seal_roles.py (new; the module had none), which pins the invariant rather than the instance: no alias may resolve to a canonical name asserting a level the alias does not itself name."
      - "A4 [AS FOUND] THE SILENT COERCION DESTROYS A REAL ROLE HOLDING — the sharpest instance of the seven-vs-nine question, and a live data-loss defect rather than a modelling preference. drydocs_core/models/seal.py:143 maps `\"operate manager\": \"L2 Operate Manager\"`, so a bare Operate Manager row — the THIRD value the live registry shows — is rewritten to L2 before any loader sees it. Because the SAME PERSON holds all three on one application (config/gate-log.md:882, the SME screenshots that pinned identity gate §D2), the rewritten row produces an attribution_id IDENTICAL to the genuine L2 row, and the loader's MERGE folds them into one node. Three source holdings become two, with no flag. REPRODUCED 2026-08-05 through the real validation path, no database needed: rows ['L1 Operate Manager','L2 Operate Manager','Operate Manager'] for one app and one sid yield 2 distinct attribution_id values from 3 rows. This is the exact collapse §D2 refused to allow into the KEY — it is happening one layer upstream, in the validator, for one of the three."
      - "A4b AND THE SURVIVING ROW IS ORDER-DEPENDENT: seal_contacts.cypher MERGEs on attribution_id then SETs role_source_name, so which of the two colliding rows wins depends on batch order. Worse, role_source_name does not hold what the field ledger promises. config/source-mappings/seal-extract.yaml records role_name as \"EVIDENCE — kept verbatim\" (citing identity gate §B2(ii), the evidence-vocabulary rule), but SealContactRow.role_name is typed SealRole, so what reaches the graph is the CANONICALIZED enum value and the raw source string is discarded at validation. Confirm that verbatim means verbatim — which requires the raw string to survive alongside the canonical one, not instead of it."
      - "A8 NONE OF IT IS CONFIGURABLE — this is the finding that makes the SME's declaration-timing direction (see sme_direction) a build, not a setting. The vocabulary is hardcoded across FOUR surfaces in THREE languages: (i) the SealRole enum, 10 admissible source names, drydocs_core/models/seal.py:87-108; (ii) the _ROLE_CANONICAL alias map, seal.py:112-150; (iii) the concept crosswalk, a 4-branch Cypher CASE at seal_contacts.cypher:41-46; (iv) the concept scheme itself, 7 MERGE statements at seal_ontology_supplement.cypher:176-198. The ONLY role list that lives in YAML — config/taxonomy/business-application.yaml `roles:` — is read by NO CODE: batch_port_orchestrator.py opens that file for applications and ports and never touches `roles:`, which is why it could drift to a fourth different list without any test noticing. It then DID, on 2026-08-06, mid-gate and TWICE (§A1b): 6 names to 8, then a wholesale rebuild to 13, with the full suite passing unchanged both times. The claim is demonstrated rather than argued — and note what the second rebuild also proves, since it added four role classes the code cannot load at all (§A1d) without a single test objecting. Adding one role today is a Python edit plus a Cypher edit plus a supplement edit plus a schema re-run. Confirm the target: the role vocabulary becomes DATA (config-declared, or admitted at load per §G), read by one surface that all four current ones defer to."
      - "A5 THE OPERATE MANAGER SPLIT — CONFIRMED BY THE SME 2026-08-05: \"three separate role classes, not one concept with a level.\" L1 Operate Manager, L2 Operate Manager and Operate Manager are THREE role classes. Consequences, all of which follow mechanically and none of which is applied by this page: `operate_manager` splits into three concepts; the `level` property on the Attribution is RETIRED as a role discriminator (the class carries the distinction); `c7.levels = 'L1,L2'` in the supplement is retired with it; mapping row 2 resolves to SPLIT; and §A4's coercion is resolved in the only direction that survives the split — a bare Operate Manager row maps to the BARE class, never to L2. Note the collapse stops as a side effect: once the three names reach the loader intact, the role segment of attribution_id distinguishes them and the §D2 three-holding case keys three distinct nodes."
      - "A5b WHAT THE SPLIT SETTLES ABOUT THE COUNT, AND WHAT IT DOES NOT: the arithmetic now closes exactly — the signed 7 with operate_manager split into 3 IS 9, matching the live registry. That makes the SECOND arithmetic (7 + Backup Application Owner + Chief Business Technologist = 9) the losing reading. But it does NOT dispose of those three extract names. Chief Business Technologist, Backup Application Owner and Risk Manager are real values in the contact extract, in the SealRole enum and (two of them) in the taxonomy capture, and if the registry's nine are the nine above then none of the three is among them. Rule each: a role class outside the accountable nine, an alias of one of the nine (§A2 asks exactly this of Risk Manager ↔ technology_risk_controls, and the closed arithmetic makes that pairing the likeliest reading, since otherwise one concept has no source and one source has no concept), or not a TOM contact role at all."
      - "A5c THE BARE CLASS NEEDS A DEFINITION, NOT JUST AN ID: three classes require three concept ids and three meanings. The ids are a naming choice for the follow-up (e.g. operate_manager_l1 / operate_manager_l2 / operate_manager). The MEANING of the bare class is an SME fact and the page has none — whether it is an unlevelled or cross-level Operate Manager, a legacy value predating the L1/L2 split, or a distinct accountability. It matters beyond tidiness: §B4 must say whether the bare class is required or optional and what its cardinality is, and a class nobody can define cannot carry a completeness rule."
      - "A6 RULED 2026-08-06 — THE ALIAS STAYS. SME: \"leave the product catalog role 'Tech Partner' maps to seal contact 'Chief Technology Officer (CTO)'.\" So `\"tech partner\": \"CTO\"` (drydocs_core/models/seal.py) is CONFIRMED as a deliberate name crosswalk, not a stale leftover, and no change is made. What it asserts is narrow and worth stating that way: the two families use DIFFERENT NAMES FOR THE SAME ACCOUNTABLE PERSON, and a contact row that says Tech Partner means the SEAL CTO contact. K5's own rename history is the corroboration — the area-product Tech Partner was FORMERLY named CTO in SEAL."
      - "A6b THE PAGE OVERSTATED THIS, and the correction is why the ruling is safe rather than a concession. §A6 originally read that a Tech Partner row \"becomes a TOM `cto` Attribution on a BusinessApplication — the exact shape K5 forbids.\" Verified 2026-08-06: it does not. seal_contacts.cypher mints HAD_ROLE only when the crosswalk returns non-null (line 75, \"never mint concepts here\"), and the crosswalk has FOUR branches — Backup Information Owner, Design Authority, L1 and L2 Operate Manager. `cto` is not among them. So a contact-side Tech Partner row produces an Attribution carrying role_source_name 'CTO' and unmapped_role=true, with NO concept edge of any kind. The `cto` concept is reached only from seal_applications.cypher, via the DECO row's own chief_tech_officer_sid, which is a BusinessApplication field and never a Product Cabinet one. K5's boundary was never crossed. Confirm the corrected reading, because the original wording is in the committed history and a later reader will meet it."
      - "A6c WHAT STAYS OPEN AFTER THE RULING, stated so it is not mistaken for closed: the alias makes 'Tech Partner' and 'CTO' indistinguishable downstream — role_source_name records 'CTO' for both, so the graph cannot answer which term the source actually used. That collides with the identity gate's §B2 evidence rule (the source's own term is kept) and with §A4b, which asks the same question about the canonicalizer generally. If the two names are genuinely one role the loss is harmless; if a Product Cabinet Tech Partner ever appears in the CONTACT extract it is now unrecoverable. Confirm which risk is accepted."
      - "A7 SCHEME DISCIPLINE — SME DIRECTION 2026-08-05 answers this: OPEN, WITH DECLARATION. The tom_roles scheme is currently FIXED (new members require a new gate — the precedent the SME set for product_roles on 2026-07-20), and the direction 'the roles can either be declared up front or during the load' supersedes that for this scheme. Confirm the supersession explicitly, because it is a deliberate divergence between the two role families: product_roles stays FIXED, tom_roles becomes OPEN. That asymmetry is defensible — the Product Cabinet is a governance construct DryDocs mirrors, while the TOM contact set is an operating-model surface that demonstrably grows (Backup Application Owner arrived 2026-05-18) — but it must be RECORDED as a choice, or the next reviewer will read one of the two schemes as drift from the other. §G specifies the mechanism."
  - title: "B. Required vs optional — presence, not counts"
    confirmations:
      - "B0 THE ORGANIZING SPLIT — SME DIRECTION 2026-08-05: a business application has a SHORT LIST OF REQUIRED CONTACTS and an EXTENDED LIST OF OPTIONAL ROLES. This is the primary structure, and it does not exist in the model in any form today — not on the TOMRole concept, not in the loaders, not in the taxonomy capture, not in a test. Confirm `required` becomes an attribute of the role class, alongside the cardinality in B3."
      - "B1 CARDINALITY IS ONE-OR-MORE, FOR EVERY ROLE — SME DIRECTION 2026-08-05: \"the count can be one or more.\" No role class carries an upper bound of one. This is SIMPLER than the page's first draft, which assumed some classes were effectively singleton and needed constraining: they are not, and the observed four holders of Backup Information Owner are the normal shape rather than the exception. Confirm the consequence — `required` and `cardinality` are NOT two views of one thing. REQUIRED is about PRESENCE (a required class must have at least one holder; an optional class may have none), and cardinality's upper bound is unbounded in both cases. The only per-class fact §B4 still needs is required-vs-optional."
      - "B1b ONE PERSON, SEVERAL ROLE CLASSES IS NORMAL — SME DIRECTION: 'the same person can be used in all 3'. This is the other axis and must not be confused with B1. B1 is many PEOPLE in one role class; B1b is one PERSON across many role classes. Identity gate §D2 pinned the 4-part attribution_id because BOTH occur — drop the sid and B1's four collapse, drop the role and B1b's three collapse. Confirm both axes are open by default and that neither is constrained without an explicit per-class rule."
      - "B2 IT WAS ALREADY HALF-RULED AND NEVER MODELLED: the signed §B wording carries cardinality in prose — 'Backup Information Owner (1-2 persons)' and 'Operate Manager L1 / L2 (one or both; 1-3 persons for 24h / 2-3 locations)'. None of it reached a file. Confirm the ruling here is that same fact finally given somewhere to live — and note the 1-2 in that prose is contradicted by the four-holder case in B1, so the numbers need restating, not just relocating."
      - "B3 WHERE IT LIVES: `required` becomes an attribute of the TOMRole concept, seeded with the enumeration in §A. Cardinality needs no per-class attribute at all now that B1 rules it one-or-more everywhere — the rule is a property of the MODEL, recorded once on the scheme, not repeated on nine concepts. Confirm the location; required-ness as loader configuration is rejected because it would put the completeness rule somewhere the completeness REPORT cannot cite."
      - "B4 THE VALUES: after B1, the SME supplies exactly ONE fact per role class — REQUIRED or OPTIONAL. §G puts each class on its own line for that ruling. Nothing else is per-class: no minimum beyond the presence rule, no maximum, no observed-count reconciliation. The four holders of Backup Information Owner and the 1-3 Operate Managers of the signed prose stop being numbers to model and become simply what the data says."
      - "B5 A MISSING REQUIRED CONTACT IS A FINDING, NOT A FAILURE — SME DIRECTION: 'the load should FLAG if one is missing or not readable, but should LOAD THE REST'. Today the code does the inverse on both counts: an unreadable role name raises ValidationError and kills THAT ROW (§A3), while a missing required contact is invisible because nothing checks per-application completeness at all. Confirm the target behaviour — the load NEVER fails a row for an unrecognised role, and EVERY application missing a required contact appears on a report. The two halves are one rule: whatever cannot be read must still be visible."
      - "B6 A ROLE HOLDING ALWAYS NAMES A PERSON — SME DIRECTION 2026-08-05: \"the only known is that they will map to someone.\" Every attribution that exists resolves to an Employee; there is no unassigned-but-present holding. Confirm this as an INVARIANT the load may rely on, which makes an Attribution with no HAS_AGENT a defect rather than a legitimate state — and note the loader cannot currently produce one (employee_sid is a required field on the row model), so the invariant is already true and this records WHY rather than changing anything."
      - "B6b A COUNTER-EXAMPLE ARRIVED BEFORE THE INVARIANT WAS RELIED ON (K21, 2026-08-09), and it is better met now than after a loader depends on it. §B6 records the SME direction that every holding resolves to a PERSON, and reasons the invariant is already true because employee_sid is a required field. That is true OF THE SEAL SURFACE. On the SERVICENOW surface, as sampled, the TOM row names a GROUP — `tom_main.group` resolves to `sys_user_group`, and no person table is joined anywhere in the SME's query. STATED AS A LIMIT, NOT A REFUTATION: one report proves what that report selected, not what the table can hold, and whether `tom_main` also carries a user column is carried as an open question. Confirm the scope of the invariant: is 'always names a person' a rule about the SEAL extract (in which case it holds and §D3's discriminator is what keeps it honest once a second surface loads), or a rule about TOM accountability generally (in which case the ServiceNow surface contradicts it and one of the two has to give)?"
      - "B6c IF THE GROUP READING SURVIVES, THE PROV SHAPE STILL DOES — worth saying so the question is not heard as an objection to the model. prov:agent admits an ORGANIZATION as readily as a PERSON, so (:Attribution)-[:HAS_AGENT]->(...) type-checks either way; what would widen is the TARGET NODE CLASS, from :Employee alone to :Employee or a group/team class. The knock-on is §B6's other clause: 'an Attribution with no HAS_AGENT is a defect' stays true, but 'every Attribution reaches an :Employee' would not. Confirm which of the two statements is the invariant the verify layer should test."
      - "B7 HIERARCHY PLACEMENT IS A LATER PASS — SME DIRECTION: \"if a person is in the role, create the relationship to the employee hierarchy in a later pass.\" This gate's load links the ATTRIBUTION to the PERSON and stops there; placing that person in the reporting structure is separate work on a separate cadence. Confirm the boundary — and confirm it knowing the hand-off target DOES NOT EXIST producer-side: :Employee is a node class with NO Employee-to-Employee edge anywhere in the relationship vocabulary, no REPORTS_TO, and no backlog item that would create one. The direction is right, and it currently defers to nothing, so the deferral needs an owner or it is just an omission with better wording."
  - title: "C. Presence is a graph-test, never a database constraint"
    confirmations:
      - "C0 THIS SECTION NARROWED ON 2026-08-05. It was drafted to rule how a SINGLETON limit would be enforced. §B1 removed the premise: the count is one-or-more for every role, so there is no upper bound anywhere and no singleton rule to enforce. What survives is the PRESENCE check — a required class with zero holders — plus the reasoning in C1-C3, which is retained deliberately: it is the record of why no constraint is added and why the key is not narrowed, and without it the next reviewer re-proposes both."
      - "C1 NEO4J CANNOT EXPRESS A PER-TRAVERSAL COUNT: there is no declarative form for \"at most one Attribution per (application, role class)\", nor for \"at least one\". Uniqueness applies to a property or property set on a node or relationship, never to a count over a traversal. Confirm the constraint route is closed on platform grounds rather than preference — this holds for the presence rule exactly as it held for the singleton rule it replaces."
      - "C2 WHAT THE ONE EXISTING CONSTRAINT ACTUALLY SAYS: drydocs_core/schema/constraints.cypher:99 declares attribution_id UNIQUE, and attribution_id is app_id|SEAL|role|sid. Because the sid is IN the key, that constraint positively PERMITS N holders per (app, role) — which is now exactly right, and worth confirming as CORRECT-AS-IS rather than merely tolerated. The trap it sets is unchanged: a reviewer seeing a uniqueness constraint on Attribution may assume a limit is enforced somewhere. Nothing limits anything."
      - "C3 THE TEMPTING WRONG FIX IS REFUSED, AND NOW ON TWO GROUNDS: re-keying the Attribution to (app_id, role) without the sid would make MERGE collapse duplicate holders. Before §B1 that was wrong because it hid evidence; after §B1 it is wrong because it would destroy the NORMAL CASE — multiple holders are the expected shape, not an anomaly to dedupe. It is barred anyway by identity gate §D2, which pinned the 4-part key for these facts. Confirm the key is untouched by this gate."
      - "C4 THE FORM OF THE CHECK: a REQUIRED class with zero holders on an application is REPORTED by a graph-test in the verify layer — a query returning the offending (app, role) rows — never refused at write time. This is §B5's flag-but-load rule given a mechanism. Note what is NOT a finding after §B1: any number of holders, in any class. The check counts to one and stops."
      - "C5 THE PRECEDENT: same shape as the existing unmapped_role treatment — load it, flag it, float it to the top of the review surface (ownership.attributions.v1 already orders unmapped rows first). Confirm the presence check joins that surface rather than opening a new one, so an operator reads one page for \"what is wrong with this application's contacts\" rather than three."
      - "C6 THE CHECK NEEDS A DENOMINATOR: \"every application missing a required contact\" presumes a known set of applications to check. Confirm the scope — every :BusinessApplication in the graph, or only those the contact extract covered. The difference is not cosmetic: an application the extract never mentioned would report as missing ALL required contacts, which is a capture gap wearing the costume of a roster gap, and the two need different responses."
  - title: "D. Roster disagreement — which surface said so"
    confirmations:
      - "D1 THE FINDING: SEAL's own Application Contacts view and the ServiceNow TOM Accountable view return DIFFERENT COUNTS for the same application. Both are legitimate reads of the same operating model. Nothing in DryDocs today records which one an attribution came from — Attribution.source is the literal string 'SEAL' at both loader sites regardless."
      - "D2 THE CONSEQUENCE IF NOT RULED: a count difference is unattributable. An operator asking 'why does this app show five Operate Managers' cannot tell whether that is one roster with five people, two rosters disagreeing, or a stale capture — and neither can a graph-test, which makes §C4's check ambiguous exactly where it fires."
      - "D2b THE CONSUMER NOW EXISTS ON PAPER: backlog O44 (groomed 2026-08-05 from SME direction in the same session) is a four-column reconciliation ALLUVIAL diagram — employee hierarchy | SEAL/TOM contacts | ServiceNow queues and technicians | PAT structure — carrying a ribbon between a person's appearance in each column, and TERMINATING that ribbon where the counterpart is absent. That pane is where a roster disagreement becomes VISIBLE rather than inferred, and it is the thing §D3's discriminator is FOR. Confirm the discriminator is specified with that consumer in mind: a value an operator can read as \"SEAL says X, ServiceNow says Y\", not an internal provenance stamp. In an alluvial diagram a disagreement renders as a ribbon that STOPS, so the discriminator has to distinguish \"this surface did not assert it\" from \"this surface was never read\" — a diagram cannot draw the difference the data does not carry. Note O44 depends_on this gate, and that neither of the two surfaces §D1 compares is ingested today — the SEAL side loads, the ServiceNow side does not (inboxed 2026-08-05)."
      - "D3 THE PROPOSAL: a surface discriminator on the Attribution (mapping row 5) naming which view produced it, so disagreement becomes a readable fact. Confirm, or rule that one surface is authoritative and the other is not ingested at all — which is a cleaner answer if it is true, and the SME is the only one who can say whether it is."
      - "D4 PRECEDENCE, IF BOTH ARE INGESTED: config/precedence.yaml must gain the SEAL-view-vs-ServiceNow-view order, or the resolver has no rule when they disagree about the same (app, role, person). Confirm whether that ordering is decided here or deferred — deferring is acceptable, silently having no rule is not."
      - "D5 THE SERVICENOW SIDE IS NOW SPECIFIED, NOT JUST NAMED (K21, 2026-08-09). When this section was drafted, 'the ServiceNow TOM Accountable view' was a description; the shape is now evidence. The row is anchored on the TOM assignment itself and carries its own record number; the role resolves through a `tom_roles` LOOKUP TABLE carrying an `active` flag; the holder resolves to a `sys_user_group`; the subject is reached by `parent_id` -> `cmdb_ci`; and the assignment mode and its parent pointer ride on the same row (§E). §D3 can therefore be ruled against a real shape. Confirm the discriminator is specified knowing this — the two surfaces do not merely differ in COUNT, they differ in SHAPE, and a discriminator that only records 'which view' loses that."
      - "D5b THE DIFFERENCE IS BIGGER THAN A COUNT, and it is the reason D3 matters more than the page first implied: the SEAL side attributes to a PERSON (employee_sid is a required field on the row model) while the ServiceNow side, as sampled, attributes to a GROUP. So a disagreement between them may not be two rosters listing different people — it may be two rosters describing different KINDS of holder. §B6b carries the open question; §D3's discriminator is what would let an operator see which case they are looking at. Confirm the two sections are ruled with that coupling in view."
  - title: "E. Inheritance — modelled, or explicitly not"
    confirmations:
      - "E1 THE FINDING: the ServiceNow view carries an assignment mode — Inherited / Overridden / (empty) — plus an 'Inherited from CI' parent pointer. DryDocs models attribution as a FLAT ASSERTION with no way to distinguish an assignment set on this application from one inherited from a parent configuration item."
      - "E1b CONFIRMED AS DATA, AND THE VALUES ARE NAMED — SME 2026-08-10, via the K21 replica evidence. `inheritance` and `inherited_from_ci` are COLUMNS ON EVERY TOM ROW, not a UI affordance, so the distinction is carried in the data the loader already reads and then discards. The mode takes two values: INHERITED, in which case the CI comes from the AREA PRODUCT, and OVERRIDDEN, meaning it was changed by hand. ONE CORRECTION TO THIS PAGE RIDES HERE — AND IT WAS ITSELF CORRECTED ON 2026-08-11, so read the resolved version. This clause originally challenged §E1's THIRD value, '(empty)', as uncorroborated and asked the walk to confirm or drop it. IT IS REAL, AND IT IS THE MOST IMPORTANT OF THE THREE: blank means DIRECT — the origin row, defined on this CI itself or fed in by a named feed — and it is the state every inherited copy ultimately points back to. §E1 was right as drafted; the challenge was wrong and is withdrawn. Nothing is dropped. See §E1d for the resolved three-state model."
      - "E1c WHY THE VALUES ARE NOT LOOKUP-ABLE, and it matters for every fact on this page: NEITHER value appears in the public ServiceNow documentation, because the TOM tables are not stock ServiceNow. They are a COMPANY SCOPED APPLICATION (`x_<scope>_cmdb_tom_main` / `_tom_roles`) with no vendor baseline at all (K21 §3.1). The rest of the CMDB — cmdb_ci, cmdb_rel_ci, cmdb_rel_type — is stock and publicly documented, so the usual 'check the vendor doc' move works there and CANNOT work here. Every TOM fact is an SME fact or an instance measurement. Confirm that is understood, because it changes what evidence this gate is entitled to rely on."
      - "E1d THE MECHANISM, RESOLVED — SME 2026-08-11, and it settles §E3's premise before §E3 is ruled. `Inheritance` IS NOT A TYPED FIELD; IT IS COMPUTED. The TOM engine walks the CI PARENT CHAIN UPWARD and copies each role's assignment down to child CIs, and every row records its origin through TWO lineage references: `inherited_from_ci` (the ancestor CI owning the original assignment) and `inherited_from` (the ancestor's specific TOM ROW that was copied). THE THREE STATES: blank = DIRECT, an origin row defined on this CI or fed by a named feed, with both lineage fields empty; INHERITED, copied from the NEAREST ancestor holding that role, both lineage fields populated; OVERRIDDEN, inherited and then locally edited to a different group or person, recorded on the CI where the edit was made. THE RULE THAT MAKES IT NON-TRIVIAL: a child always inherits the ancestor's CURRENT value, EVEN WHEN THAT VALUE IS ITSELF AN OVERRIDE — so overrides propagate downward and the effective holder at a deployment can differ from the definition at the top of the chain, with the lineage fields recording where the divergence was introduced. Confirm this is the model §E3 rules on."
      - "E1e AND IT IS ONE MECHANISM, NOT TWO — which retires an inconsistency this page carried. §E5 states the parent is the AREA PRODUCT (SME 2026-08-10); the 2026-08-11 evidence shows deployments inheriting from the BUSINESS APPLICATION. Both are the SAME walk: 'copy from the nearest ancestor holding the role', applied repeatedly up an N-LEVEL chain. One observed deployment shows all three behaviours at once — most roles inherited from the application one rung up, Service Owner Team inherited from the CI ABOVE the application where it is Direct and passing straight through, and the two Deployment* roles Direct on the deployment itself. Confirm §E5 is read as naming ONE RUNG OF A WALK rather than THE parent, because a model built for a fixed two-level relation will not represent the pass-through case at all."
      - "E1f THE LOAD CONSEQUENCE, which §E3's two options do not currently distinguish: ONLY TWO OF THE THREE STATES ARE ASSERTIONS. Direct and Overridden rows are AUTHORED — somebody decided them. Inherited rows are DERIVED COPIES carrying pointers to their origin. So a load has a third option §E3 does not list: pull the AUTHORED rows only and treat inheritance as the computation it is, rather than materialising derived facts as though they were asserted. THE CAVEAT THAT DECIDES IT, and it is the first real conflict between this gate and the ServiceNow pull scope: reconstructing an inherited holder needs the ANCESTOR chain, and ancestors sit ABOVE the ~200 applications DryDocs supports — including CIs owned by teams it does not. So either the pull widens to take ancestor CIs for their TOM rows alone, or inherited rows are materialised and flagged derived. Rule which; both are defensible and the difference is not cosmetic."
      - "E1g TWO SMALLER CONSEQUENCES, recorded so §D is not designed around a gap that is already filled. (1) `u_source` ON DIRECT ROWS NAMES THE FEED that produced them, which is very close to what §D3 proposes to INVENT — check whether the ServiceNow side already carries the surface discriminator before designing one. (2) PART OF §D2's ROSTER PUZZLE IS ANSWERED BY STRUCTURE: where a holder difference is an inheritance artefact, the lineage fields say so outright — the holder differs because an override was made at a named CI. That does not replace §D3, but it means some disagreements already carry their own explanation."
      - "E2 WHY IT INTERACTS WITH §B AND §C: an inherited holder and a directly-asserted holder in the same role class may be the reason a class looks multi-holder when the operating model says singleton. If inheritance is not modelled, §C4's graph-test will report violations that are not violations, and the first response to a noisy check is to weaken it."
      - "E3 THE RULING: either (i) model it — an assertion_mode property plus an inherited-from pointer (mapping row 6), which makes the override relationship legible and lets the cardinality check count direct assertions only; or (ii) declare it OUT OF SCOPE and record that DryDocs deliberately flattens inheritance, so the next reviewer meets a decision rather than an omission. Both are acceptable answers; leaving it unstated is not, because the data already carries the distinction and the loaders already discard it."
      - "E4 [AS DRAFTED — THE PREMISE IS FALSE, see E5; kept because it is in the committed history and a later reader will meet it] IF (i): the inherited-from parent is a CI in another system's hierarchy, not a BusinessApplication DryDocs holds. Confirm whether the pointer is a foreign reference recorded as a property, or a modelled node — the former is available now, the latter is a dependency on estate data DryDocs does not have."
      - "E5 THE PARENT IS THE AREA PRODUCT, AND DRYDOCS ALREADY MODELS IT — SME 2026-08-10. This is the sharpest correction the K21 evidence makes to this page. §E4 was drafted on the assumption that the inherited-from parent is estate data we do not hold, and it treated the modelled-node option as blocked on acquiring that data. It is not blocked. When `inheritance` = Inherited the CI comes from the AREA PRODUCT, and `:AreaProduct` is an EXISTING DryDocs node class — gated and signed at K6 (product-cabinet-attribution, 2026-07-20), already carrying area_product_owner and tech_partner. So E3's option (i) can be a REAL EDGE to a node that already exists, not a foreign key stored as a string. Confirm the corrected premise before ruling E3, because the two options are no longer 'cheap property versus expensive dependency' — they are now closer in cost, which makes the choice a modelling judgement rather than a resourcing one."
      - "E5b THE BOUNDARY THAT MUST RIDE WITH E5, stated so the ruling cannot be misread later: what inherits is the ASSIGNMENT'S CI, NOT the role vocabulary. K6 ruled the Product Cabinet family (product_roles, scoped to :Product / :AreaProduct) and the TOM family (tom_roles, on :BusinessApplication) INDEPENDENT, with 'do not conflate' explicit in the node classification and no shared concepts. Nothing in E5 merges them, and nothing here reopens K5 or K6. The claim is narrow: a TOM assignment recorded on an application may have been SET AT the area product and flowed down, which is a provenance fact about that assignment. Confirm the boundary explicitly — an inheritance edge pointing at :AreaProduct is exactly the shape a future reader would mistake for a shared role hierarchy."
      - "E5c AND IT GIVES §D SOMETHING §D CANNOT GET ON ITS OWN: an inherited assignment and a directly-asserted one are different KINDS of fact, and §D2 warns that a count difference today is unattributable. If assertion_mode is modelled, part of a roster disagreement becomes explainable without any surface discriminator at all — 'SEAL shows three, ServiceNow shows five, two of the five are inherited' is a complete answer. Confirm whether §E and §D are ruled together for that reason; they were drafted as independent sections and the evidence has coupled them."
  - title: "F. Declaration timing — up front, or during the load"
    confirmations:
      - "F1 THE DIRECTION: roles may be DECLARED UP FRONT (a config-declared vocabulary) or DURING THE LOAD (a name the source presents that DryDocs admits and records). Both routes end at the same place — the role class exists, carrying its `required` flag and its cardinality — and differ only in when and by whom it was named. Confirm both routes are wanted; up-front-only is simpler and would be a reasonable narrowing if the SME prefers it."
      - "F2 WHAT AN AT-LOAD DECLARATION MUST CARRY: a role class admitted during a load has no `required` flag and no cardinality — nobody has ruled them. Confirm the default: it is OPTIONAL and multi-holder (the safe direction, since presuming REQUIRED would raise false completeness findings against every application, and presuming SINGLETON would raise false cardinality findings). It is also marked as UNDECLARED so it appears on a review surface — the unmapped_role precedent (§C5), not a silent admission."
      - "F3 WHERE THE DECLARED VOCABULARY LIVES: a config file under config/taxonomy/ is the natural home, and the honest note is that config/taxonomy/business-application.yaml ALREADY has a `roles:` list which NOTHING READS (§A8). Confirm whether the declared vocabulary extends that list into the real source — which retires an orphaned file and its drift in one move — or takes a new file, leaving the old list to be deleted rather than reinterpreted. Leaving both is the one outcome to refuse."
      - "F4 THE ADMISSION GATE MOVES: SealRole (a Python enum) stops being the admission list, because an enum cannot admit a name declared at load. Confirm the enum is retired as the gate and either deleted or demoted to a convenience alias set — and note that _ROLE_CANONICAL survives EITHER WAY, since alias tolerance ('l2 ops manager', 'bio') is a separate concern from vocabulary membership, and it is where the §A4 and §A6 defects actually live."
      - "F5 THE SCHEME DIVERGENCE IS DELIBERATE (see §A7): tom_roles becomes OPEN, product_roles stays FIXED. Confirm, and confirm it is recorded as a skos:changeNote or equivalent on the scheme itself rather than only in the gate log — the two schemes sit side by side in the same supplement file, and a reader comparing them needs the reason in the same place as the difference."
      - "F6 THE TARGET ALREADY EXISTS ON THE OTHER SIDE OF THE FENCE — a worked example rather than an argument (K21, 2026-08-09). §A8's finding is that DryDocs' role vocabulary is hardcoded across four surfaces in three languages, and §F1's direction is that it should become DATA. ServiceNow's TOM app already does exactly that: `x_<scope>_cmdb_tom_roles` is a TABLE, one row per role class, keyed by sys_id, joined from the assignment row by reference. Adding a role there is an INSERT. That is the shape §F1 is asking for, running in the system this data comes from, which makes the target concrete rather than aspirational. Confirm the direction with the example in view."
      - "F6b AND IT CARRIES A COLUMN THIS PAGE HAS NOT CONSIDERED: `tom_roles` has an `active` FLAG, and the SME's own query filters on it (`resp.active = TRUE`). So role classes are not merely ADDED over time — they are RETIRED, and the source distinguishes a live class from a withdrawn one. DryDocs has no equivalent: a TOMRole concept, once seeded, has no lifecycle at all. This bears directly on §A2 and §G5 (technology_risk_controls, a seeded concept nothing can write) and on §G12 (Risk Manager, dropped from the capture) — both are questions about RETIREMENT that the page currently has to answer by deleting from a signed scheme, which §G5 rightly calls a ruling in itself. Confirm whether the declared vocabulary gains an active/retired flag alongside `required`, so retirement becomes a state rather than a deletion."
  - title: "G. The role register — every class ruled on its own line"
    confirmations:
      - "G0 HOW TO USE THIS SECTION — SME DIRECTION 2026-08-05: each role is listed INDEPENDENTLY, one tick per class, rather than ruled in blocks. Each line asks ONE thing after §B1: is this class REQUIRED (the application must carry at least one holder) or OPTIONAL (it may carry none)? Cardinality is not asked — §B1 already ruled it one-or-more for every class. A class left unticked is a class NOT ruled — the register is deliberately unable to express a silent default."
      - "G0b THE REGISTER GREW ON 2026-08-06 when the SME supplied the thirteen-class list (§A1c). Numbering is NOT reflowed — ids are referenced from open_questions and from the risks, and renumbering a register mid-walk is how a ruling ends up attached to the wrong class. So: G1-G9 are the nine accountable classes as the page originally reconstructed them; G10-G12 are the three extract names with no concept; G13-G16 are the four classes the SME's list ADDS, which exist in no scheme, no enum, no crosswalk and no prior capture. Three lines are now in tension with the list and say so on their own line — G5 (technology_risk_controls, absent from it), G10 (Chief Business Technologist, absent) and G12 (Risk Manager, absent). Sixteen ids, and the SME's list has thirteen members: the gap is exactly those three, and closing it is §A2 and §A5b's work, not arithmetic."
      - "G0c THE ONE PARTIAL ANSWER ALREADY GIVEN, recorded where it landed rather than generalised: the SME's list carries the note \"these are optional\" positioned immediately after Deployment Owner, Deployment Information Owner and Application Module Owner. Read positionally that marks G13, G14 and G15 OPTIONAL. Confirm the reading — a note attached by position is exactly the kind of thing that should be said out loud once rather than assumed forever — and note it says nothing about the other ten, which still need their own line."
      - "G0d THE THREE DEPLOYMENT/MODULE LINES MAY SHARE ONE SUBJECT, AND IT NOW HAS A NAME (K21, SME 2026-08-10). G13, G14 and G15 were added by the SME's thirteen-class list, exist in no scheme or crosswalk, and G15 in particular asks the gate to CONFIRM THE SUBJECT before required-ness can be ruled — because a module owner plausibly owns a PART of an application and DryDocs has no module grain. The subject is identifiable: the ServiceNow CI class is the DEPLOYMENT MODULE. It is named `app_id:deployment_id`, carries its OWN unique CI id, and sits one level below the application in the CI chain — `Business Application [Instantiates] Deployment Module`, inverse `[Instance of]`, with `[Contained by] area product` above. 'Deployment' and 'module' are ONE THING in this estate, which is why G13/G14/G15 plausibly resolve TOGETHER against one grain rather than one line at a time. OFFERED AS THE READING TO CONFIRM, NOT AS A FACT: the SME named the CI class, not the three roles' subjects, and G14's own line already asks whether it belongs to the Information Owner family or is independent."
      - "G0d-RIDER [K22 PROPOSAL, added 2026-08-26 — a rider routed via this gate, NOT a gate of its own, because nothing here changes an attribution subject (L25 riders-not-edits; the signed G0d above is unchanged). Registered status: planned — 10-node-classifications DeploymentModule (PROPOSED) + 41-local-business-application business_application_instantiates_deployment_module; nothing loads, nothing flips active, and if this gate does not sit again the drafted rider IS the deliverable]: CAPTURE THE DEPLOYMENT MODULE CI CLASS — the identifier the source carries and we discard. Five things, in order. (1) ALREADY RULED AND NOT REOPENED: one application, many deployments is SME-confirmed, and everything DryDocs maps is off the APPLICATION — :BusinessApplication stays the attribution subject and seal-tom-attribution-reshape's subject does NOT move. This captures an identifier; it does not re-home attribution. (2) THE KEY, which is why the item exists at all: each Deployment Module CI carries its OWN unique CI id, so the CI ID IS THE BUSINESS KEY and app_id(seal_id):deployment_id is a HUMAN-READABLE NAME. A loader keying on a bare deployment_id MERGEs distinct deployments together — the identity gate's D2/C3 failure on a new axis — so the proposal states the key explicitly and REFUSES the composite-name-as-key reading. (3) THE CI TOPOLOGY as the SME gave it (2026-08-10, K21): Business Application [Instantiates] Deployment Module, inverse [Instance of], and above it [Contained by] area product — the parent is a node DryDocs already holds (\u00a7E5). 'Deployment' and 'module' are ONE thing. (4) THE LABEL: adopt the CONCEPT and pick our own stable name — :DeploymentModule — C10's standing advice, proven TWICE on this instance: the vendor's own class label moved (Application Service -> Service Instance at Yokohama), and this instance's inverse label ([Instance of]) already differs from the one the public material uses ([Instantiated by]). The label is not the identity. (5) THE CORRECTION CARRIED rather than quietly dropped: the module-reference-is-a-form-default finding applies to TRANSACTIONAL records — a Change, an Incident or a KB article must name a deployment module and people accept the default. The CI ITSELF IS REAL, with its own id, its own place in the chain and KB articles attached. So the GRAIN IS SOUND, and only the COUNTING OF TRANSACTIONS PER MODULE is not. (An earlier reading of G15 — that it needed no grain — would have discarded a real CI class on the strength of a defaulted foreign key; that near-miss is why clause (5) is in the acceptance, not a note.)"
      - "G0e WHAT G0d DOES NOT AUTHORIZE, because the temptation is obvious: it does NOT create a deployment grain in DryDocs. The SME also ruled that EVERYTHING MAPPED IS OFF THE APPLICATION (2026-08-09), so this gate's attribution subject does not move and the identity gate's 4-part key is untouched. If G13-G15 are ruled REQUIRED or OPTIONAL as application-level roles, that is coherent — the role NAMES a deployment concern while the accountability still attaches to the application. If instead the SME rules that these three genuinely attribute to a DEPLOYMENT, that is a new node class, a new key and a re-keying question, and it belongs to its own gate rather than to a register line here. Confirm which, because the register cannot express the second."
      - "G0f AND ONE CORRECTION TO A READING THAT NEARLY LANDED HERE: the SME's remark that modules 'aren't used as intended' was first taken to mean the module grain carries no reliable meaning, which would have ruled G15 by declaring its subject unreal. The 2026-08-10 clarification reverses that. The Deployment Module CI is real — own id, own place in the chain, KB articles attached to it. What is defaulted is the module reference on TRANSACTIONAL records: a Change, an Incident and a KB article must each name a deployment module, ServiceNow defaults it, and people generally accept the default. So the GRAIN is sound and only the COUNTING OF TRANSACTIONS per module is not. G15 must be ruled on the grain, never on the transaction data."
      - "G1 APPLICATION OWNER (`application_owner`) — written today by seal_applications.cypher from the DECO row's app_owner_sid, as a literal concept id. REQUIRED or OPTIONAL?"
      - "G2 PRIMARY INFORMATION OWNER (`primary_information_owner`) — written today by seal_applications.cypher from the DECO row's info_owner_sid, as a literal. The signed §B recorded it as replacing the old flat `data_owner`. REQUIRED or OPTIONAL?"
      - "G3 BACKUP INFORMATION OWNER (`backup_information_owner`) — written today via the contact-extract crosswalk. The class with four observed holders on one application; after §B1 that is simply what the data says, not an anomaly. REQUIRED or OPTIONAL?"
      - "G4 CTO (`cto`) — written today by seal_applications.cypher from the DECO row's chief_tech_officer_sid, as a literal. K5 (2026-07-20) confirmed this concept belongs to the TOM family only; the shared-cto with the Product Cabinet was dropped. REQUIRED or OPTIONAL?"
      - "G5 TECHNOLOGY RISK & CONTROLS (`technology_risk_controls`) — SEEDED BUT NEVER WRITTEN (§A2): it is a member of the signed seven and no crosswalk branch or loader literal can reach it. It is also ABSENT from the SME's 2026-08-06 list, so it is now a concept with neither a source nor a sponsor. Ruling it REQUIRED would put every application in breach on the first run of §C4's check, because nothing can supply a holder. Resolve §A2 first — if Risk Manager (G12) crosswalks here, this class has a source and can be ruled; if not, the honest outcomes are that it gains a source or that it is REMOVED from the scheme, and removal from a signed scheme is itself a ruling this gate must make rather than let attrition make."
      - "G6 DESIGN AUTHORITY (`design_authority`) — written today via the contact-extract crosswalk. Added by the SME at the 2026-07-10 revision (\"Design Authority is new\"). REQUIRED or OPTIONAL?"
      - "G7 L1 OPERATE MANAGER — a class in its own right per the §A5 confirmation. Written today as `operate_manager` with level='L1'; after the split it takes its own concept id and the level property retires. REQUIRED or OPTIONAL?"
      - "G8 L2 OPERATE MANAGER — a class in its own right per §A5. Same shape as G7. The signed §B prose said \"one or both\" of L1/L2, which after §B1 is a question about REQUIRED-ness rather than about counts: if either may be absent, neither is required — or the requirement is on the PAIR, which the model as ruled cannot express (see G8b)."
      - "G8b IF THE REQUIREMENT IS \"L1 OR L2, AT LEAST ONE\": say so explicitly, because it is the one shape §B's per-class required flag CANNOT hold. A required-ness that spans two classes is a rule about a GROUP, and it would need either a group concept or a bespoke check. Confirm whether that rule exists — the signed prose hints at it and the page does not want to invent it."
      - "G9 OPERATE MANAGER (bare) — a class in its own right per §A5, and the one with NO DEFINITION (§A5c). As of 2026-08-06 it is ADMISSIBLE as a source name and its rows load flagged unmapped_role=true (§A4), so the data stopped being destroyed while the class stayed undefined — that is deliberate, and the two facts are independent. It still cannot be ruled required or optional until it is known what it means. This line is expected to stay unticked until that definition arrives; that is the register working, not a gap in it."
      - "G10 CHIEF BUSINESS TECHNOLOGIST (CBT) — DISPOSED AND RULED 2026-08-06. SME: \"add optional role: Chief Business Technologist (CBT) but do not create a cypher relationship mapping for it, in case it appears.\" So it is a ROLE CLASS IN ITS OWN RIGHT — not an alias of Chief Technology Officer (G4) — and it is OPTIONAL. This is the first line of the register answered outright, and it answers the disposition and the required-ness together. IT REQUIRED NO CODE CHANGE, which is the interesting part: CBT is already admissible (SealRole, plus the `cbt` alias) and no Cypher branch exists for it, so a CBT row already loads and arrives flagged unmapped_role=true. The ruling turns an accident into an intention — the K4 policy used ON PURPOSE, recording a name the source may emit without minting a concept for it. The taxonomy capture was updated to carry CBT and Chief Technology Officer on the SAME application, held by different people, so the sample states they are two classes rather than leaving it to be inferred."
      - "G11 BACKUP APPLICATION OWNER — in the extract and the enum, no concept, flagged unmapped. Recorded in drydocs_core/models/seal.py as effective 2026-05-18, so it POSTDATES the ruling that fixed the scheme at seven — the first worked example of what a FIXED scheme costs, and the reason §F rules the vocabulary open. DISPOSITION FIRST, then required or optional."
      - "G12 RISK MANAGER — in the extract and the enum, no concept, flagged unmapped, and as of 2026-08-06 NO LONGER IN THE TAXONOMY CAPTURE either: it is absent from the SME's thirteen-class list and the rebuilt capture dropped it. §A2 asks whether it IS `technology_risk_controls` (G5) under the source's own name. The absence makes that pairing MORE urgent rather than moot, because if the two are one class then the list is missing risk accountability entirely, and if they are not then both a concept and a source name are now unaccounted for. Resolve the pairing, then rule once — and rule the absence explicitly, since dropping a class from a capture is not the same act as retiring it from the vocabulary."
      - "G13 DEPLOYMENT OWNER — NEW on 2026-08-06 (§A1c). Exists in no scheme, no enum, no crosswalk and no prior capture, so it has no concept id, no crosswalk branch and no alias: today the row is REJECTED at validation, not flagged (§A1d measured it). Marked OPTIONAL by the positional note at G0c — confirm. A definition is also needed, on the same grounds as §A5c. SUBJECT CANDIDATE (2026-08-10): the Deployment Module CI — see §G0d/§G0e, and note the SME confirmed one application carries MANY deployments, so a per-application flag on this class is a statement about the application, not about any one deployment."
      - "G14 DEPLOYMENT INFORMATION OWNER — NEW on 2026-08-06, same standing as G13 and rejected today for the same reason. The name pairs with Primary/Backup Information Owner (G2/G3) but scopes to deployment rather than to the application, so confirm whether it belongs to the Information Owner family or is independent — it changes whether an operator looking for \"who owns the information\" should find one answer or two. THE SCOPE IT NAMES IS REAL (2026-08-10): the Deployment Module is a genuine CI class, so \"scopes to deployment\" is no longer a hypothesis about the name — it is the subject candidate at G0d. That SHARPENS the family question rather than settling it: if this class attributes to the application like G2/G3, the three form one family at one grain; if it attributes to a deployment, it is a different grain wearing a similar name, and G0e says that is its own gate."
      - "G15 APPLICATION MODULE OWNER — NEW on 2026-08-06, rejected today. This is the first role in the set whose subject may not be the APPLICATION: a module owner plausibly owns a PART of an application, and DryDocs has no module grain to attribute to. Confirm the subject before required-ness — if it is genuinely per-module, a per-application required flag cannot express it and the class needs a home this gate does not have. THE SUBJECT IS NOW IDENTIFIABLE (2026-08-10): the module is the DEPLOYMENT MODULE CI, named `app_id:deployment_id` with its own CI id, `[Instance of]` the application — see §G0d, and §G0e for what that does and does not authorize. Rule the subject on this line first, then required-ness."
      - "G16 SITE RELIABILITY ENGINEER (SRE) — NEW on 2026-08-06, rejected today. It sits with the Operate Manager family in the SME's ordering, which suggests an operational rather than accountable role, and that distinction matters: §B's required/optional split is about ACCOUNTABILITY for an application, and a staffing role that happens to be recorded on the same extract is a different kind of fact. Confirm which it is, then rule."
  - title: "H. Sign-off"
    confirmations:
      - "H1 Sections A-H are reviewed and the direction is correct, OR amended by explicit SME edits recorded in config/gate-log.md. NOTE §A5 was CONFIRMED IN ADVANCE OF THE WALK (2026-08-05, the Operate Manager split) and its consequence APPLIED on 2026-08-06 — both now carry a standalone RECORD entry in config/gate-log.md dated 2026-08-06, so the sign-off entry states what was decided AT the walk rather than re-claiming what was already decided before it."
      - "H1b THE CLAUSE ALMOST WENT UNRECORDED, and the mechanism is worth fixing rather than just noting. §A5 was confirmed on 2026-08-05 and lived ONLY in this file — committed, dated and attributable in git, and absent from config/gate-log.md, which is the durable source of record. It surfaced a day later because the SME asked whether it had been confirmed, not because anything reported it. The general defect: a CONFIRMED CLAUSE inside an UNSIGNED gate has no home in a log organised by sign-off, so any gate walked across more than one sitting can leave rulings stranded in a draft. Confirm the interim convention used here — a RECORD entry per confirmed-and-applied clause, on the existing G51/X1 idiom — and whether that becomes the standing rule for multi-sitting gates."
      - "H1c THE PAGE WAS REVISED ON 2026-08-10 AND THE WALK SHOULD KNOW WHICH CLAUSES ARE NEW, because reviewing a revised page as if it were the original is how a correction gets ticked without being read. NEW OR CHANGED, all from the K21 ServiceNow evidence and the SME statements on it: §E1b and §E1c (the inheritance values are named; the TOM tables have no vendor baseline), §E5/§E5b/§E5c (the parent is the AREA PRODUCT, a node DryDocs already holds — §E4's premise was FALSE and is kept struck for the record; plus the K6 boundary and the §D coupling), §D5/§D5b (the ServiceNow side is specified, and the two surfaces differ in KIND of holder rather than only in count), §B6b/§B6c (the group-versus-person counter-example, and why the PROV shape survives it either way), §G0d/§G0e/§G0f (the Deployment Module subject for G13-G15, what it does NOT authorize, and the correction to a reading that nearly ruled §G15 on transaction data), §G13/§G14/§G15 line updates, §F6/§F6b (the vocabulary-as-data target already running on the ServiceNow side, including a retirement flag DryDocs has no equivalent for), mapping rows 5 and 6, one new open question (tom-subject-class) and one new risk (the replica caveat). Confirm the revision is understood as EVIDENCE ARRIVING, not as scope creep: no new ruling is requested that was not already requested on 2026-08-05."
      - "H1d TWO CORRECTIONS ARE ON THE RECORD RATHER THAN QUIETLY FIXED, on the §A4 precedent that a gate log needs the defect and not just its repair. (1) §E4 reasoned from a premise that is false, and the false version is retained above its correction. (2) The SME's remark that modules 'aren't used as intended' was first read as meaning the module grain is unreal, which would have ruled §G15 by dissolving its subject; the 2026-08-10 clarification reverses it — the Deployment Module CI is real and only the TRANSACTIONAL reference to it is defaulted. Confirm both readings as corrected, because both wrong versions are in the committed history."
      - "H2 NOTHING IS APPLIED BY TICKING BOXES HERE and no graph write is authorized. The tom_roles scheme keeps its 7 concepts, seal_contacts.cypher keeps its 4-branch crosswalk, and #seal-tom-attribution stays status: applied describing the fixed 7. Every correction is a SEPARATE, logged follow-up after this entry is transcribed. ONE EXCEPTION, taken on explicit SME instruction and logged as its own RECORD on 2026-08-06: drydocs_core/models/seal.py now carries an eleventh enum member (OPERATE_MANAGER) and its bare-Operate-Manager alias points at it instead of L2 (§A4). That was a data-loss fix, not a vocabulary ruling — the enum is the SOURCE-NAME admission list, no concept was created, and the affected rows now arrive flagged unmapped rather than merged. The OTHER contested alias, Tech Partner -> CTO (§A6), is UNCHANGED and still live."
      - "H3 THE FOLLOW-UP SET IS AGREED AS ONE UNIT (they cannot land piecemeal without leaving the surfaces mutually inconsistent). EXISTING surfaces to amend: the supplement's scheme seed; both loader crosswalks; the SealRole enum and _ROLE_CANONICAL aliases; the map entry's role_vocabulary text in config/taxonomy-ontology-map/20-mappings-seal.yaml; the vocabulary fragment 41-local-seal.yaml; NODE_QUICK_REFERENCE.md; config/taxonomy/business-application.yaml's `roles:` list (which G35's acceptance names explicitly); and the seal-extract field ledger's \"kept verbatim\" claim (§A4b). NEW surfaces the SME direction creates: the declared role vocabulary and its reader (§F3); the `required` + cardinality attributes on the concept (§B3); the per-application REQUIRED-CONTACT COMPLETENESS REPORT (§B5), which has no counterpart today; and the cardinality graph-test (§C4)."
      - "H4 THE TAXONOMY CAPTURE IS RECONCILED to whatever §A rules — config/taxonomy/business-application.yaml lists 13 role names (6, then 8, then 13 across 2026-08-06; §A1b) agreeing with neither the scheme nor the loader, and it is the file a future importer would treat as the source shape. Two things ride with the reconciliation. Its `roles:` list is DERIVED — the union of the names in `memberships` — so reconciling the list without reconciling the membership blocks that produce it would not survive the next regeneration. And the reconciliation should decide whether this file keeps a role list AT ALL: §F3 asks whether the declared vocabulary extends it or takes a new file, and if a new file wins, the honest outcome here is deletion rather than a fourth divergent list kept in step by hand."
      - "H5 MIGRATION IS ACKNOWLEDGED, not discovered later: because seal_contacts.cypher:55 builds attribution_id from the SOURCE role name while seal_applications.cypher uses literal concept ids, any renaming in §A re-keys every contact-side Attribution and orphans the old nodes, while the three DECO-side ones are unaffected. Confirm the follow-up carries a migration step, or that the graph is rebuilt from source rather than migrated."
      - "H6 Safe to transcribe this decision into config/gate-log.md as an AMENDMENT to the 2026-07-10 entry (not a replacement — the original ruling stays readable, the amendment states what changed and why), and only once transcribed, to begin the follow-up work."

open_questions:
  - id: tom-subject-class
    status: "RAISED 2026-08-10 by the K21 evidence. Settled by one query, not by a ruling — but §B, §D and §G all read differently depending on the answer, so it should be run BEFORE the walk rather than during it."
    note: >
      IS THE TOM ROW'S SUBJECT A BUSINESS APPLICATION CI OR A DEPLOYMENT MODULE CI?
      `tom_main.parent_id` resolves to `cmdb_ci`, the base class table, and the SME's
      query joins BOTH `cmdb_ci_business_app` AND `cmdb_ci_service_discovered` on that
      same sys_id — defensively, so only the CI's actual class returns non-null. The
      sample therefore does not reveal which one hit. It matters because the two
      readings point opposite ways: the SEAL identifiers come off
      `cmdb_ci_service_discovered`, which would put the assignment at DEPLOYMENT grain
      in the SOURCE, while the SME has ruled that everything mapped is off the
      APPLICATION. Both can be true at once — a source may record finer than the
      operating model uses it — and that is the likeliest answer, but it should be
      established rather than assumed, because §G0e's fork (are G13-G15
      application-level roles that NAME a deployment concern, or genuine
      deployment-level attributions?) turns on it.
      THE QUERY: count TOM rows grouped by `cmdb_ci.sys_class_name`. One row of output
      per class present, and the answer is whichever classes actually appear.
  - id: which-roles-are-required
    status: "MECHANISM BUILT 2026-08-05 (§G, the role register); 3 of 16 lines answered 2026-08-06 by the positional 'these are optional' note (G13-G15, §G0c); the other thirteen still outstanding."
    note: >
      THE FACT THIS PAGE STILL LACKS, now with somewhere to put it. The SME's
      direction gives the RULE — a short required list, an extended optional list,
      flag-but-load — and not the MEMBERSHIP, and §G now asks for it one class at a
      time. Nothing in the repo can supply it: `required` does not exist as a
      concept anywhere, so there is no stale value to check against and no drift to
      reconcile. Three of the twelve register lines cannot even be asked yet — G5
      (a concept with no source), G9 (a class with no definition) and G12 (possibly
      the same class as G5) — so the register is expected to come back partly
      unticked, and that is the register working.
  - id: group-level-requiredness
    note: >
      Raised by §G8b and genuinely unresolved. The signed §B prose says Operate
      Manager "L1 / L2 (one or both)", which after the §A5 split reads as a
      requirement on the PAIR — at least one of two classes — and a per-class
      required flag cannot express it. Either the requirement is per-class after all
      (each independently optional, the pair unenforced), or the model needs a group
      concept for this one case. The page refuses to invent the second on its own.
  - id: employee-hierarchy-has-no-owner
    note: >
      §B7. The SME deferred hierarchy placement to a later pass, which is right —
      and the later pass does not exist producer-side. No REPORTS_TO, no
      Employee-to-Employee edge in the relationship vocabulary, no backlog item. A
      deferral that points at nothing is an omission with better wording, so this
      needs either an item raised or an explicit "company-side owns it" note. The
      2026-07-23 producer-session HR-hierarchy direction was written for the COMPANY
      gate, which is probably why nothing landed here.
  - id: new-classes-have-no-definitions
    note: >
      OPENED 2026-08-06 by the SME's list (§A1c). Deployment Owner, Deployment
      Information Owner, Application Module Owner and Site Reliability Engineer are
      named and nothing more — no definition, no source field, no crosswalk, and today
      no ability to load (§A1d). Each carries its own question at G13-G16, and two of
      them are structural rather than editorial: Application Module Owner may attribute
      to a MODULE, a grain DryDocs does not have, and Site Reliability Engineer may be
      a staffing fact rather than an accountability, which is a different kind of
      statement from everything else in §B. Naming a class is not the same as being
      able to hold one.
  - id: which-nine
    status: "SUPERSEDED 2026-08-06 — the count is now thirteen, stated rather than derived (§A1c). The nine-vs-seven reasoning is kept because the follow-up will be read against it, and because the split it settled is still the reason three Operate Manager classes appear in the SME's list."
    note: >
      Two arithmetics reached nine from the signed seven: splitting operate_manager
      into three, or adding Backup Application Owner and Chief Business
      Technologist. The SME confirmed the FIRST ("three separate role classes, not
      one concept with a level"), which closes the count exactly at nine and retires
      the level property. What it does NOT do is dispose of the three extract names
      the second arithmetic would have used — see §A5b, which now owns that
      residue, and §A2, whose Risk Manager ↔ technology_risk_controls pairing became
      the likeliest reading precisely BECAUSE the count now closes without it.
  - id: what-the-bare-class-means
    note: >
      OPENED by the answer, not closed by it (§A5c). Three classes need three
      meanings, and the page has no definition for the bare Operate Manager —
      unlevelled, cross-level, legacy pre-split, or a distinct accountability. §B4
      cannot state its required-ness or cardinality without one, and a class nobody
      can define cannot carry a completeness rule. The concept IDS are a naming
      choice for the follow-up; the MEANING is an SME fact.
  - id: cbt-vs-cto
    status: >
      ANSWERED 2026-08-06 — TWO CLASSES. The SME restored Chief Business Technologist
      as an optional role in its own right (G10), which settles it as a distinct class
      rather than a naming variant of Chief Technology Officer. The reasoning below is
      kept because the Tech Partner half of it was ruled the same day in the OPPOSITE
      direction — that pair IS one role under two names (§A6) — and the two rulings
      together are the useful record: a shared name history is evidence, not proof,
      and it went each way once.
    note: >
      Chief Business Technologist is in the enum, in the taxonomy capture, and in the
      contact extract, and has no concept. CTO is a concept and is loaded from the DECO
      row. The SME's 2026-08-06 list carries Chief Technology Officer and NOT Chief
      Business Technologist, which leans toward "one role, two names" and stops short
      of saying it — the source still emits CBT, so an omission from the list cannot
      by itself retire a name the loader will keep meeting (G10).
      Whether CBT is a distinct role class or a
      naming variant of the same accountable person is an SME fact nobody in the repo
      has. K5's rename history — the area-product Tech Partner was formerly named CTO in
      SEAL — proves this family of names has moved before.
  - id: risk-manager-vs-technology-risk-controls
    note: >
      §A2's pair. If they are the same class, the fix is one crosswalk branch and the
      count stays 7. If they are different, the signed set was short by one at the time
      it was signed, which is worth knowing independently of the 7-vs-9 question.
  - id: backup-application-owner-effective-date
    note: >
      drydocs_core/models/seal.py:92-93 records that Backup Application Owner "became
      effective 2026-05-18" — a role class the operating model added AFTER the ruling
      that fixed the scheme at seven (which was signed 2026-07-10, so it post-dates the
      role). Whether the scheme simply missed it, or whether it was deliberately
      excluded, changes whether §A5's answer is a correction or a catch-up. It is also
      the first worked example of what "the scheme is FIXED, new roles require a new
      gate" costs in practice.
  - id: roster-precedence
    note: >
      §D4. If both surfaces are ingested, precedence.yaml needs an order. Deferring is
      acceptable; the page asks only that the deferral be explicit.

risks:
  - id: the-servicenow-evidence-is-second-hand-through-a-replica
    status: "OPEN — raised 2026-08-10 with the evidence it qualifies. Not a reason to discount §D, §E or §G0d; a reason to know what they rest on."
    note: >
      EVERY SERVICENOW FACT ON THIS PAGE COMES FROM A REPLICA, NOT FROM SERVICENOW.
      The estate reads ServiceNow through a Snowflake copy — the same shape as
      Control-M through the Oracle psgmgr replica, and the same shape this repo
      already trusts elsewhere — so the pattern is familiar and accepted. Two
      qualifications ride with it anyway, because they were measured rather than
      assumed (K21 §3.1, §3.3).
      FIRST, THE COPY IS NOT A PURE MIRROR. The views carry columns ServiceNow never
      had — a data-lake snapshot family and a `delete_flag` — so a column's presence
      does not make it vendor schema, and a soft-deleted row may or may not be
      visible depending on how the view was built. None of the §E or §G0d findings
      depend on those columns, but a LOADER built from this page would.
      SECOND, AND UNRESOLVED: the SME counted the relationship-type vocabulary at 54
      and reports that is FEWER than an older extract from the same estate. Three
      readings survive — genuine retirement, a different source for the old extract,
      or A FILTERED OR STALE VIEW. The third would mean row counts on the replica are
      not source truth anywhere, which does not change any RULING on this page (they
      are all about shape, not counts) but would undermine anything later built on
      counts — including §C4's completeness report, which is a count by construction.
      K21 open question 9 carries the test that settles it from inside the replica: a
      LEFT JOIN from the edge view to the type view, counting rows whose type does
      not resolve. Non-zero proves incompleteness with no external baseline needed.
      WHY IT IS FILED AS A RISK RATHER THAN A BLOCKER: every §D/§E/§G0d finding is
      about SHAPE — which columns exist, what their values mean, how the CI chain is
      wired — and shape survives a partial copy. Counts do not. Rule shape here;
      treat any count drawn from the replica as provisional until the test runs.
  - id: coercion-is-losing-data-now
    status: >
      CLOSED 2026-08-06 — fixed on SME instruction ahead of sign-off, exactly as this
      note proposed. Kept in full because the reasoning is the precedent: a defect
      whose correct repair does not depend on the open ruling should be repaired
      while the ruling is open, and the gate then rules the model around a stopped
      bleed rather than around a running one. Also kept because the CLASS of defect
      is not closed — §A6's Tech Partner -> CTO alias is still live and is the same
      shape (an alias asserting something the source did not say), and it is still
      waiting on a confirmation this page has not had.
    note: >
      HIGHEST, and it is not a risk of the ruling — it is a risk of the ruling being
      SLOW. §A4 destroys a real role holding on every load that carries the bare
      Operate Manager value, silently, and the collapse is order-dependent (§A4b).
      Nothing about fixing seal.py:143 depends on how §A5 resolves: whether the
      three become three classes or stay one concept with a level, the coercion is
      wrong either way. If the walk is going to take more than one sitting, that one
      line is worth pulling out as its own logged fix ahead of the gate, with the
      gate then ruling the model around an already-stopped bleed.
      STRENGTHENED 2026-08-05 by the §A5 confirmation: with three classes ruled, the
      correct target for the bare name is KNOWN (its own class), so the fix no longer
      waits on anything this gate has left to decide. The interim form is a one-line
      change — stop rewriting the bare name to L2 — which halts the collapse
      immediately and leaves the row flagged unmapped until the class exists. That
      is strictly better than today: a flagged row is visible, a merged one is gone.
  - id: piecemeal-application
    note: >
      HIGHEST. Seven surfaces currently agree with each other and with the signed seven.
      A ruling applied to some of them leaves the repo in a state where the scheme, the
      enum, the crosswalk and the docs each describe a different vocabulary — which is
      the condition this gate exists to end, reproduced with fresher numbers. F3 lists
      the set; it lands together or not at all.
  - id: renaming-orphans-attributions
    note: >
      Two attribution_id key shapes live under one uniqueness constraint (see the
      provenance block and F5). Renaming a source role name silently orphans every
      contact-side Attribution that carried it, and leaves the DECO-side three intact —
      so a partial rename produces a graph where some history survives and some does
      not, with nothing marking the difference.
  - id: signing-b-without-a
    note: >
      Cardinality (§B) is meaningless until the classes are enumerated (§A) — a per-class
      attribute needs classes. Signing §B alone would seed cardinality onto a vocabulary
      that §A then changes.
  - id: noisy-check-gets-weakened
    note: >
      §E2's failure mode. A singleton graph-test that fires on inherited holders will be
      read as broken and softened, and a softened check is worse than none because it
      still looks like coverage. If §E rules inheritance out of scope, §C4's check must
      say in its own text that it counts assertions and not people.
  - id: reopening-a-signed-gate-as-a-precedent
    note: >
      This is the second signed ruling to be amended rather than left standing (K5
      superseded the 2026-07-10 shared-cto record on 2026-07-20). The supplement's
      `REMOVE c4.shared_with` is the worked example of how an unwind stays idempotent on
      already-loaded graphs. Whatever §A rules should follow that pattern rather than
      inventing a second one.
