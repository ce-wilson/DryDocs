# ---------------------------------------------------------------------------
# SME direction received 2026-08-05, IN-CHAT, before the walk. Recorded verbatim
# in substance so the walk confirms a written position rather than re-deriving
# it. Worked into §A5, §A7, §B and the new §G. NOT a sign-off — nothing here is
# ticked, and §F still governs.
# ---------------------------------------------------------------------------
sme_direction:
  received: 2026-08-05
  channel: "in-chat, producer session (laptop), during the G35 draft"
  statements:
    - id: required-set
      said: >
        Business applications have a SHORT LIST of REQUIRED contacts. The load
        should FLAG if one is missing or not readable, but should LOAD THE REST.
      changes: >
        Introduces a distinction the model does not have in any form. It also
        inverts the current failure mode twice over: today an unreadable role
        name raises ValidationError and kills THAT ROW, while a missing required
        contact is invisible because nothing checks per-application completeness.
        The direction asks for the opposite of both — never fail a row for being
        unreadable, always report an absent required contact.
      still_needed: "WHICH roles are on the required list. The rule is recorded; the membership is an SME fact."
    - id: optional-set-cardinality
      said: >
        There is an EXTENDED LIST of OPTIONAL roles that can be 1 role to many,
        and the same person can be used in all 3.
      changes: >
        Confirms §B's premise — cardinality is per role class, not global — and
        supplies the shape: required classes are the constrained ones, optional
        classes are openly multi-holder. Also confirms that one PERSON across
        several role classes is normal, which is the other half of what identity
        gate §D2 pinned the 4-part key for.
      reading_confirmed: >
        CONFIRMED BY THE SME 2026-08-05, in the same session, in response to the
        flag: "three separate role classes, not one concept with a level." So
        "all 3" IS the three Operate Manager classes (L1, L2, bare) — the case
        config/gate-log.md:882 records from the live registry, one person holding
        all three on one application. §A5 is ANSWERED and mapping row 2 resolves
        to the SPLIT. This is a CONFIRMED CLAUSE inside an UNSIGNED gate: §G2
        still governs, nothing is applied, and no graph write is authorized.
    - id: register-and-count
      said: >
        Make sure each role is listed independently in the gate review, and the
        count can be one or more.
      changes: >
        Two things. (1) The review FORM: each role class gets its own line and its
        own tick — §G, the role register — rather than being ruled in blocks, so a
        class cannot be carried along by its neighbours and an unruled class stays
        visibly unruled. (2) It REMOVES a question the page was built around:
        cardinality has no upper bound anywhere, so there is no singleton limit to
        model or enforce. §C narrowed from "how do we enforce a singleton" to "how
        do we report an absent required contact", and §B4 reduced to ONE fact per
        class — required or optional.
    - id: holder-and-hierarchy
      said: >
        The only known is that they will map to someone, so if a person is in the
        role, create the relationship to the employee hierarchy in a later pass.
      changes: >
        Sets an invariant and a scope boundary. The invariant (§B6): an attribution
        always resolves to an Employee — already true, since employee_sid is a
        required field, so this records WHY rather than changing behaviour. The
        boundary (§B7): this load links the attribution to the PERSON and stops;
        placing that person in the reporting structure is a later pass.
      still_needed: >
        The later pass has NO producer-side home. :Employee is a node class with no
        Employee-to-Employee edge anywhere in the relationship vocabulary — no
        REPORTS_TO, nothing — and no backlog item would create one. The deferral is
        correct and currently points at nothing; it needs an owner.
    - id: operate-manager-is-not-a-coercion
      received: 2026-08-06
      said: >
        This should not be a coercion, "Operate Manager -> L2 Operate Manager".
        L1 Operate Manager, L2 Operate Manager, Operate Manager are 3 separate
        roles that could be distinct individuals or the same.
      changes: >
        The third statement of §A5 and the first one phrased as an instruction about
        the CODE rather than about the model, so it was applied. It also states the
        cardinality fact in the same breath — "distinct individuals or the same" is
        §B1 and §B1b together, and it is why the 4-part attribution_id has to keep
        both the role and the sid.
      applied: >
        drydocs_core/models/seal.py, 2026-08-06. TWO lines, because deleting the bad
        alias on its own would have been a different kind of data loss: with no
        admissible value for the bare name, canonicalize_role returns None and the
        Pydantic validator kills the ROW (§A3). So SealRole gained
        OPERATE_MANAGER = "Operate Manager" and the alias was re-pointed to it. The
        row now validates, reaches the loader intact, keys its own attribution_id,
        and — because the Cypher crosswalk still has no branch for it — arrives
        flagged unmapped_role=true. That is the K4 policy working as designed:
        loaded, surfaced for review, never guessed.
      scope: >
        NO ONTOLOGY CHANGE. The enum is the admission list for SOURCE NAMES, not the
        concept scheme: tom_roles still holds its 7 concepts, seal_contacts.cypher
        still has its 4-branch crosswalk, and no :TOMRole was created. §H2 is intact
        — what changed is that a name the source emits is now recorded instead of
        rewritten. Creating the three concepts is still §A's ruling to make.
      measured: >
        Re-run on the bundled sample after the fix: application 70001 goes from
        13 rows -> 9 validating -> 8 attribution_id to 13 -> 9 -> 9. Zero merged.
        The three Operate Manager classes key
        70001|SEAL|{L1 Operate Manager, L2 Operate Manager, Operate Manager}|K456789.
      guarded_by: >
        tests/unit/test_seal_roles.py, NEW — the module had no tests at all, which is
        how the alias survived long enough to be found by reading. Beyond pinning the
        three classes it asserts the INVARIANT the defect violated: no alias may
        resolve to a canonical name asserting a level the alias does not itself name.
        A future "ops manager" -> L2 fails that test rather than silently merging.
    - id: tech-partner-alias-kept-and-cbt-restored
      received: 2026-08-06
      said: >
        Leave the product catalog role 'Tech Partner' maps to seal contact 'Chief
        Technology Officer (CTO)'. Make one update for SEAL, add optional role:
        Chief Business Technologist (CBT) but do not create a cypher relationship
        mapping for it, in case it appears.
      changes: >
        TWO RULINGS, and between them they dispose of §A6 and the whole of G10 — the
        first register line answered outright. (1) The `"tech partner": "CTO"` alias
        STAYS, confirmed as a deliberate crosswalk: the two families use different
        names for the same accountable person. (2) CBT is a role class in its own
        right, not an alias of Chief Technology Officer, and it is OPTIONAL —
        admissible so a row is never refused, and deliberately left out of the
        concept crosswalk so it arrives flagged for review.
      applied: >
        config/taxonomy/business-application.yaml only. NEITHER RULING NEEDED A CODE
        CHANGE, which is worth stating rather than passing over: the Tech Partner
        alias already exists, and CBT is already admissible (SealRole plus its `cbt`
        alias) with no Cypher branch, so a CBT row already loads flagged
        unmapped_role=true. The instruction turns an accident into an intention. The
        capture now carries CBT and Chief Technology Officer on the SAME application,
        held by different people, so the sample states they are two classes instead
        of leaving it to be inferred.
      corrected: >
        The ruling exposed an OVERSTATEMENT in this page, corrected at §A6b. §A6 had
        claimed a Tech Partner row "becomes a TOM `cto` Attribution on a
        BusinessApplication — the exact shape K5 forbids". Verified: it does not.
        seal_contacts.cypher mints HAD_ROLE only when the crosswalk returns non-null
        and `cto` is not one of its four branches, so the row produces an Attribution
        with role_source_name 'CTO' and NO concept edge. The `cto` concept is reached
        only from the DECO application row's own field. K5's boundary was never
        crossed, which makes "leave it" a safer ruling than the page implied.
      still_needed: >
        §A6c. The alias makes 'Tech Partner' and 'CTO' indistinguishable downstream —
        role_source_name records 'CTO' for both — which collides with the identity
        gate's §B2 evidence rule and with §A4b's question about the canonicalizer
        generally. Harmless if the two names are genuinely one role; unrecoverable if
        a Product Cabinet Tech Partner ever lands in the CONTACT extract.
    - id: role-enumeration-supplied
      received: 2026-08-06
      said: >
        Role: Application Owner (AO), Primary Information Owner (PIO), Backup
        Information Owner (BIO), Chief Technology Officer (CTO), Design Authority
        (DA), Deployment Owner, Deployment Information Owner, Application Module
        Owner — "Note these are optional, add synthetic examples for these" — L1
        Operate Manager, L2 Operate Manager, Operate Manager, Site Reliability
        Engineer (SRE), Backup Application Owner (BAO).
      changes: >
        THIRTEEN CLASSES, and it is the first time the enumeration §A asks for has
        been stated as a list rather than inferred from four disagreeing surfaces.
        It confirms §A5 in passing — L1, L2 and bare Operate Manager are all three
        present as peers — and it settles §A3b's parenthetical: every acronym is
        written "Name (ABBREV)" and the four classes without a common acronym carry
        no parenthesis, so the brackets are a listing convention and the role name is
        the long form. FOUR CLASSES ARE NEW to the repo entirely — Deployment Owner,
        Deployment Information Owner, Application Module Owner, Site Reliability
        Engineer — appearing in no scheme, no enum, no crosswalk and no prior
        capture. TWO NAMES ARE ABSENT — Chief Business Technologist and Risk Manager
        — which bears directly on §A2 and §A5b but is NOT read here as a retirement:
        both are still live in the SealRole enum and still flagged unmapped on every
        load, and an absence from a list offered as an enumeration is not the same
        statement as "this class does not exist".
      applied_to: >
        config/taxonomy/business-application.yaml only, as a TAXONOMY capture
        (2026-08-06, reversible by construction and ruling nothing). The synthetic
        sample was rebuilt around it with SME-supplied invented names, deliberately
        carrying the two shapes this gate turns on: one person holding all three
        Operate Manager classes on one application, and four holders of Backup
        Information Owner on another. Nothing in the scheme, the loaders or the enum
        was touched — §H2 still governs.
      measured: >
        RUN THROUGH THE REAL VALIDATION PATH 2026-08-06, no database: of the capture's
        31 memberships, FIVE are rejected outright with `unrecognised SEAL role`
        (Deployment Owner, Deployment Information Owner, Application Module Owner, and
        Site Reliability Engineer twice) because canonicalize_role returns None — so
        four of the SME's thirteen classes cannot be loaded at all today, and §A3's
        "hard-refuse or admit flagged" question is no longer hypothetical. A further
        four rows are silently RENAMED: three "Chief Technology Officer" -> "CTO"
        (benign, an alias doing its job) and one "Operate Manager" -> "L2 Operate
        Manager" (§A4's coercion). On application 70001 that is 13 source rows -> 9
        validating -> 8 distinct attribution_id: four lost to validation and one
        merged into a holding that was already there.
      still_needed: >
        WHICH of the thirteen are required. The note "these are optional" travels by
        position with Deployment Owner, Deployment Information Owner and Application
        Module Owner, which is a partial answer to §B4 and is recorded as such rather
        than generalised — §G asks the remaining ten one line at a time. Also
        outstanding: a definition for each of the four new classes, on the same
        grounds §A5c demands one for the bare Operate Manager.
    - id: declaration-timing
      said: >
        The roles can either be declared up front or during the load.
      changes: >
        Answers §A7 (fixed scheme vs open-ended) in favour of OPEN WITH
        DECLARATION, and retires the hardcoded SealRole enum as the admission
        gate. Neither route is possible today: see §A8 — the vocabulary is not
        configurable at all, and the one role list that lives in YAML is read by
        no code.
    - id: deployment-grain-and-the-ci-chain
      received: "2026-08-09, extended 2026-08-10"
      said: >
        One application, multiple deployments is correct — the identifier reads as
        app_id(seal_id):deployment_id. Everything that we map is off the APPLICATION.
        Modules are referenced by default for changes but in practice are not used as
        intended — in ServiceNow the CI must default to a deployment module for
        Changes, Incidents and KB, and people generally accept the default. The CI
        relationships run: Business Application [Instantiates] Deployment Module,
        upstream [Instance of] application [Contained by] area product; each
        Deployment Module carries its own unique CI id. On the TOM row, `inheritance`
        is either Inherited — in which case the CI comes from the AREA PRODUCT — or
        Overridden, meaning changed by hand. There are KB articles linked to the
        deployment module.
      changes: >
        FOUR things, touching four different sections. (1) §E stops being guesswork:
        both `inheritance` values are named and the parent is identified, which is
        what §E1 asserted from description and §E3 asks the SME to rule. (2) §E4's
        premise is FALSE — see §E5. (3) §G13/§G14/§G15 gain a named subject, the
        Deployment Module, which §G15 explicitly asked for before required-ness could
        be ruled; §G0d proposes they share it. (4) The mapping grain is CONFIRMED as
        the APPLICATION, so this gate's attribution subject does not move and the
        identity gate's 4-part key survives untouched — the one outcome that would
        have re-keyed every Attribution is ruled out.
      reading_confirmed: >
        The module remark was first read as "the module grain carries no reliable
        meaning, so no grain is needed." The SME corrected that on 2026-08-10 and the
        correction is the operative version: the DEPLOYMENT MODULE CI IS REAL — own
        unique CI id, a place in the relationship chain, KB articles attached. What
        is defaulted is the module reference on TRANSACTIONAL records (Changes,
        Incidents, KB). So the grain is sound and only the counting of transactions
        per module is not. Recorded because the first reading would have discarded a
        real CI class on the strength of a defaulted foreign key — and §G15 would
        have been ruled on it.
      still_needed: >
        Whether the TOM row's subject is a Business Application CI or a Deployment
        Module CI. `tom_main.parent_id` resolves to `cmdb_ci` and the sample query
        joins BOTH class tables on that sys_id defensively, so the evidence does not
        say which one hit — yet the SEAL ids come off `cmdb_ci_service_discovered`.
        Both can be true, since the source may record finer than the operating model
        uses it, and one GROUP BY cmdb_ci.sys_class_name settles it. Carried as open
        question tom-subject-class.
      scope: >
        NO ONTOLOGY CHANGE and K6 is NOT reopened. What inherits is the ASSIGNMENT'S
        CI, not the role vocabulary: K6 ruled the Product Cabinet and TOM role
        families INDEPENDENT ("do not conflate"), and nothing here shares a concept
        between them. §E5 states this on its own line so the finding cannot be read
        as merging the two schemes.

mapping:
