# SME gate-prompt spec — the TOM role enumeration + cardinality (backlog G35).
# DRAFTED 2026-08-05, awaiting SME.
#
# This gate RE-OPENS §B of a SIGNED ruling (seal-tom-attribution-reshape,
# 2026-07-10, applied at K4 on 2026-07-15). That is deliberate and is the whole
# reason the item exists: the signed §B fixed the TOM role vocabulary at SEVEN
# concepts, and the live registry the SME reviewed on 2026-07-27 shows NINE
# distinct accountable role classes. A signed gate is re-opened through a gate,
# never by an edit.
#
# SCOPE FENCE — what this page may NOT touch, because §A1 of the
# business-application-identity gate (SIGNED 2026-07-27) declares them unchanged:
#   * the attribution_id 4-part shape (app_id|SEAL|role|sid) — §D2 pinned it
#     PRECISELY because of the cardinality facts this page is about. It stays.
#   * the ATTRIBUTION_TIERS / match_method evidence vocabulary (signed
#     seal-attribution-match-policy, 2026-07-14).
#   * the Product Cabinet family and its product_roles scheme (K5, signed
#     2026-07-20) — except where a TOM-side surface reaches ACROSS that boundary,
#     which §A6 below reports as a defect rather than reopening K5.
#
# Mechanism, role names and counts only. Role names are already public-tier
# throughout the repo (config/taxonomy/business-application.yaml,
# drydocs_core/models/seal.py). No real SEAL ids, no application names, no
# employee names, no SIDs — the taxonomy capture's SIDs are synthetic and are not
# reproduced here. The live-registry evidence is SME screenshots (Internal); only
# the SHAPE of the finding is recorded, never a value.
# classification: Internal-Public
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: tom-roles-enumeration-and-cardinality
title: "SME Gate — the TOM role enumeration (7 signed vs 9 live) and cardinality as a per-role-class attribute"
step: "Amendment to seal-tom-attribution-reshape §B (2026-07-10) — before any further attribution loading, and before the taxonomy capture's divergent roles: list is reconciled"
summary: >
  Rules five coupled things about SEAL Technical Operating Model role
  attribution: (a) the ROLE ENUMERATION, where the signed fixed 7 is contradicted
  by a live registry showing 9 — with L1 Operate manager, L2 Operate manager and
  Operate Manager appearing as three separate concepts rather than one concept
  with a level attribute; (b) CARDINALITY as a per-role-class attribute rather
  than a global singleton rule, since one application legitimately carries four
  people in Backup Information Owner while other classes are effectively
  singleton; (c) that the singleton rule, where it applies, is a GRAPH-TEST and
  not a database constraint, because Neo4j cannot declare "at most one per (app,
  role)"; (d) the ROSTER DISAGREEMENT, where SEAL's own Application Contacts view
  and the ServiceNow TOM Accountable view return different counts for the same
  application and nothing in the model records which surface an attribution came
  from; and (e) whether INHERITANCE is modelled at all, since the ServiceNow view
  carries Inherited / Overridden / (empty) plus an "Inherited from CI" parent
  while DryDocs models attribution as a flat assertion.
  The enumeration question is not academic drift. FOUR role lists are live in the
  repo right now and no two of them agree: the signed scheme has 7 concepts, the
  Python enum has 10 source names, the loader crosswalk maps 4 of those names, and
  the taxonomy capture lists 6. The measurable consequences are in §A: one signed
  concept that nothing can ever write, three source names permanently flagged
  unmapped, one silent coercion that asserts a level the source never stated, and
  one crosswalk entry that carries a Product Cabinet role name across a family
  boundary K5 declared independent. Confirming this gate authorizes NO graph
  write; the corrections land afterwards as their own logged changes.
meta:
  Module: "drydocs-core (ontology) · drydocs-load (seal_contacts / seal_applications loaders) · drydocs-api (the two attribution QuerySpecs)"
  Source: "SEAL Technical Operating Model contact extract (source id seal-extract) — the DECO application row (three embedded contacts) plus the long-format contact extract (everything else). Live-registry evidence is SME screenshots reviewed 2026-07-27 (Internal; shape only, no values)"
  Registry ref: "config/source-registry.yaml — seal-extract (existing, confirmed) · config/source-mappings/seal-extract.yaml (the field-name ledger; its inline note at lines 205-206 already enumerates the contact-extract roles)"
  Classification: "Internal-Public (role names, counts and mechanism only). Role names are already public-tier in config/taxonomy/business-application.yaml and drydocs_core/models/seal.py; the taxonomy capture's SIDs are synthetic and are not reproduced here. The live registry itself is Internal — only the SHAPE of the finding is recorded"
  Taxonomy: "config/taxonomy/business-application.yaml — the `roles:` list (6 names), itself divergent from both the signed scheme and the loader"
  Ontology map: "config/taxonomy-ontology-map/20-mappings-seal.yaml #seal-tom-attribution — status: applied (confirmed 2026-07-10, applied 2026-07-15 at K4). Its role_vocabulary field states the fixed 7 and is one of the surfaces any ruling here must update"
  Precedence: "The signed 2026-07-10 §B ruling is the standing rule this AMENDS. The identity gate's §A1 fence (2026-07-27) and the K5 Product Cabinet ruling (2026-07-20) are NOT reopened — see the scope fence in this file's header"
  Source of record: "config/gate-log.md 2026-07-10 (the signed §B two-family revision) · docs/restructure/backlog.yaml G35 · drydocs_core/schema/seal_ontology_supplement.cypher:176-198 (the scheme as seeded)"

mapping:
  - n: 1
    element: "TOMRole concept scheme `tom_roles` — CURRENT: the fixed 7 (application_owner, primary_information_owner, backup_information_owner, cto, technology_risk_controls, design_authority, operate_manager)"
    target: "the enumeration the SME rules in §A — 7 kept, or 9, or another number; and whether the scheme stays FIXED (new members require a new gate, the 2026-07-20 precedent) or becomes open-ended"
    edge: "skos:Concept members of skos:ConceptScheme tom_roles  [RE-OPENED — the scheme is currently `applied`, not proposed]"
  - n: 2
    element: "Operate Manager level — CURRENT: ONE concept `operate_manager` with c7.levels = 'L1,L2' and the level carried as a property on the Attribution node"
    target: "either UNCHANGED (one concept + level property) or SPLIT into distinct concepts, which is what the live registry's three separate values imply"
    edge: "(:Attribution {level})-[:HAD_ROLE]->(:TOMRole {id:'operate_manager'})  [RE-OPENED]"
  - n: 3
    element: "Cardinality per role class — CURRENT: not modelled anywhere. The signed §B prose says 'Backup Information Owner (1-2 persons)' and 'Operate Manager L1/L2 (one or both; 1-3 persons for 24h / 2-3 locations)', and none of that reached a file"
    target: "a per-concept attribute on the TOMRole node (e.g. min_holders / max_holders, or a cardinality note), seeded from whatever §B rules"
    edge: "property on :TOMRole, not an edge  [PROPOSED — new]"
  - n: 4
    element: "The singleton rule where it applies — CURRENT: expressible only as the existing attribution_id uniqueness constraint, which by construction permits N holders per (app, role)"
    target: "a GRAPH-TEST in the verify layer that REPORTS violations, never a database constraint that refuses them"
    edge: "no edge; a check  [PROPOSED — new, §C]"
  - n: 5
    element: "Which roster surface an attribution came from — CURRENT: not recorded. Attribution.source is the literal 'SEAL' at both loader sites regardless of which view produced the row"
    target: "a surface/view discriminator on the Attribution, so a count difference between SEAL Application Contacts and the ServiceNow TOM Accountable view is a readable fact rather than an unexplained mismatch"
    edge: "property on :Attribution  [PROPOSED — new, §D]"
  - n: 6
    element: "Inheritance — CURRENT: not modelled. Every attribution is a flat direct assertion; there is no way to say an assignment was inherited from a parent CI rather than set on this application"
    target: "either explicitly OUT OF SCOPE (recorded as a known non-capability), or an assertion_mode property plus an inherited-from pointer"
    edge: "property on :Attribution (+ a possible parent edge)  [PROPOSED — new, §E]"

provenance:
  - label: ":TOMRole (skos:Concept) — the scheme as it exists today"
    source_object: "gate seal-tom-attribution-reshape §B (2026-07-10), seeded by drydocs_core/schema/seal_ontology_supplement.cypher:176-198"
    key: "TOMRole.id (concept id) — 7 members, each IN_SCHEME the tom_roles SkosConceptScheme"
    loader: "drydocs_core/schema/seal_ontology_supplement.cypher (schema supplement, not a data loader)"
    properties:
