# SME gate-prompt spec — the TOM role enumeration + cardinality (backlog G35).
# DRAFTED 2026-08-05, awaiting SME.
#
# This gate RE-OPENS §B of a SIGNED ruling (seal-tom-attribution-reshape,
# 2026-07-10, applied at K4 on 2026-07-15). That is deliberate and is the whole
# reason the item exists: the signed §B fixed the TOM role vocabulary at SEVEN
# concepts, and the live registry the SME reviewed on 2026-07-27 shows NINE
# distinct accountable role classes. A signed gate is re-opened through a gate,
# never by an edit.
#
# SCOPE FENCE — what this page may NOT touch, because §A1 of the
# business-application-identity gate (SIGNED 2026-07-27) declares them unchanged:
#   * the attribution_id 4-part shape (app_id|SEAL|role|sid) — §D2 pinned it
#     PRECISELY because of the cardinality facts this page is about. It stays.
#   * the ATTRIBUTION_TIERS / match_method evidence vocabulary (signed
#     seal-attribution-match-policy, 2026-07-14).
#   * the Product Cabinet family and its product_roles scheme (K5, signed
#     2026-07-20) — except where a TOM-side surface reaches ACROSS that boundary,
#     which §A6 below reports as a defect rather than reopening K5.
#
# Mechanism, role names and counts only. Role names are already public-tier
# throughout the repo (config/taxonomy/business-application.yaml,
# drydocs_core/models/seal.py). No real SEAL ids, no application names, no
# employee names, no SIDs — the taxonomy capture's SIDs are synthetic and are not
# reproduced here. The live-registry evidence is SME screenshots (Internal); only
# the SHAPE of the finding is recorded, never a value.
# classification: Internal-Public
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: tom-roles-enumeration-and-cardinality
title: "SME Gate — the TOM role enumeration (7 signed vs 9 live) and cardinality as a per-role-class attribute"
step: "Amendment to seal-tom-attribution-reshape §B (2026-07-10) — before any further attribution loading, and before the taxonomy capture's divergent roles: list is reconciled"
summary: >
  Rules five coupled things about SEAL Technical Operating Model role
  attribution: (a) the ROLE ENUMERATION, where the signed fixed 7 is contradicted
  by a live registry showing 9 — with L1 Operate manager, L2 Operate manager and
  Operate Manager appearing as three separate concepts rather than one concept
  with a level attribute; (b) CARDINALITY as a per-role-class attribute rather
  than a global singleton rule, since one application legitimately carries four
  people in Backup Information Owner while other classes are effectively
  singleton; (c) that the singleton rule, where it applies, is a GRAPH-TEST and
  not a database constraint, because Neo4j cannot declare "at most one per (app,
  role)"; (d) the ROSTER DISAGREEMENT, where SEAL's own Application Contacts view
  and the ServiceNow TOM Accountable view return different counts for the same
  application and nothing in the model records which surface an attribution came
  from; and (e) whether INHERITANCE is modelled at all, since the ServiceNow view
  carries Inherited / Overridden / (empty) plus an "Inherited from CI" parent
  while DryDocs models attribution as a flat assertion.
  The enumeration question is not academic drift. FOUR role lists are live in the
  repo right now and no two of them agree: the signed scheme has 7 concepts, the
  Python enum has 10 source names, the loader crosswalk maps 4 of those names, and
  the taxonomy capture lists 6. The measurable consequences are in §A: one signed
  concept that nothing can ever write, three source names permanently flagged
  unmapped, one silent coercion that DESTROYS a real role holding, and one
  crosswalk entry that carries a Product Cabinet role name across a family
  boundary K5 declared independent. NONE of the four lists is configurable —
  they are hardcoded across three languages, and the only role list that lives in
  YAML is read by no code at all. Confirming this gate authorizes NO graph write;
  the corrections land afterwards as their own logged changes.
  SME DIRECTION RECEIVED 2026-08-05, before the walk — recorded in `sme_direction`
  below and worked into §A, §B and the new §F. It reshapes the page: the split is
  REQUIRED vs OPTIONAL contacts, a missing required contact is FLAGGED while the
  rest of the load proceeds, optional roles are 1-to-many with one person allowed
  to hold several, and the role vocabulary may be declared up front OR during the
  load. Three of those four are reversals of what the code does today.
