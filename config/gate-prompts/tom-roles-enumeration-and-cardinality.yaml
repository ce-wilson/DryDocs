# ---------------------------------------------------------------------------
# SME direction received 2026-08-05, IN-CHAT, before the walk. Recorded verbatim
# in substance so the walk confirms a written position rather than re-deriving
# it. Worked into §A5, §A7, §B and the new §G. NOT a sign-off — nothing here is
# ticked, and §F still governs.
# ---------------------------------------------------------------------------
sme_direction:
  received: 2026-08-05
  channel: "in-chat, producer session (laptop), during the G35 draft"
  statements:
    - id: required-set
      said: >
        Business applications have a SHORT LIST of REQUIRED contacts. The load
        should FLAG if one is missing or not readable, but should LOAD THE REST.
      changes: >
        Introduces a distinction the model does not have in any form. It also
        inverts the current failure mode twice over: today an unreadable role
        name raises ValidationError and kills THAT ROW, while a missing required
        contact is invisible because nothing checks per-application completeness.
        The direction asks for the opposite of both — never fail a row for being
        unreadable, always report an absent required contact.
      still_needed: "WHICH roles are on the required list. The rule is recorded; the membership is an SME fact."
    - id: optional-set-cardinality
      said: >
        There is an EXTENDED LIST of OPTIONAL roles that can be 1 role to many,
        and the same person can be used in all 3.
      changes: >
        Confirms §B's premise — cardinality is per role class, not global — and
        supplies the shape: required classes are the constrained ones, optional
        classes are openly multi-holder. Also confirms that one PERSON across
        several role classes is normal, which is the other half of what identity
        gate §D2 pinned the 4-part key for.
      reading_confirmed: >
        CONFIRMED BY THE SME 2026-08-05, in the same session, in response to the
        flag: "three separate role classes, not one concept with a level." So
        "all 3" IS the three Operate Manager classes (L1, L2, bare) — the case
        config/gate-log.md:882 records from the live registry, one person holding
        all three on one application. §A5 is ANSWERED and mapping row 2 resolves
        to the SPLIT. This is a CONFIRMED CLAUSE inside an UNSIGNED gate: §G2
        still governs, nothing is applied, and no graph write is authorized.
    - id: register-and-count
      said: >
        Make sure each role is listed independently in the gate review, and the
        count can be one or more.
      changes: >
        Two things. (1) The review FORM: each role class gets its own line and its
        own tick — §G, the role register — rather than being ruled in blocks, so a
        class cannot be carried along by its neighbours and an unruled class stays
        visibly unruled. (2) It REMOVES a question the page was built around:
        cardinality has no upper bound anywhere, so there is no singleton limit to
        model or enforce. §C narrowed from "how do we enforce a singleton" to "how
        do we report an absent required contact", and §B4 reduced to ONE fact per
        class — required or optional.
    - id: holder-and-hierarchy
      said: >
        The only known is that they will map to someone, so if a person is in the
        role, create the relationship to the employee hierarchy in a later pass.
      changes: >
        Sets an invariant and a scope boundary. The invariant (§B6): an attribution
        always resolves to an Employee — already true, since employee_sid is a
        required field, so this records WHY rather than changing behaviour. The
        boundary (§B7): this load links the attribution to the PERSON and stops;
        placing that person in the reporting structure is a later pass.
      still_needed: >
        The later pass has NO producer-side home. :Employee is a node class with no
        Employee-to-Employee edge anywhere in the relationship vocabulary — no
        REPORTS_TO, nothing — and no backlog item would create one. The deferral is
        correct and currently points at nothing; it needs an owner.
    - id: role-enumeration-supplied
      received: 2026-08-06
      said: >
        Role: Application Owner (AO), Primary Information Owner (PIO), Backup
        Information Owner (BIO), Chief Technology Officer (CTO), Design Authority
        (DA), Deployment Owner, Deployment Information Owner, Application Module
        Owner — "Note these are optional, add synthetic examples for these" — L1
        Operate Manager, L2 Operate Manager, Operate Manager, Site Reliability
        Engineer (SRE), Backup Application Owner (BAO).
      changes: >
        THIRTEEN CLASSES, and it is the first time the enumeration §A asks for has
        been stated as a list rather than inferred from four disagreeing surfaces.
        It confirms §A5 in passing — L1, L2 and bare Operate Manager are all three
        present as peers — and it settles §A3b's parenthetical: every acronym is
        written "Name (ABBREV)" and the four classes without a common acronym carry
        no parenthesis, so the brackets are a listing convention and the role name is
        the long form. FOUR CLASSES ARE NEW to the repo entirely — Deployment Owner,
        Deployment Information Owner, Application Module Owner, Site Reliability
        Engineer — appearing in no scheme, no enum, no crosswalk and no prior
        capture. TWO NAMES ARE ABSENT — Chief Business Technologist and Risk Manager
        — which bears directly on §A2 and §A5b but is NOT read here as a retirement:
        both are still live in the SealRole enum and still flagged unmapped on every
        load, and an absence from a list offered as an enumeration is not the same
        statement as "this class does not exist".
      applied_to: >
        config/taxonomy/business-application.yaml only, as a TAXONOMY capture
        (2026-08-06, reversible by construction and ruling nothing). The synthetic
        sample was rebuilt around it with SME-supplied invented names, deliberately
        carrying the two shapes this gate turns on: one person holding all three
        Operate Manager classes on one application, and four holders of Backup
        Information Owner on another. Nothing in the scheme, the loaders or the enum
        was touched — §H2 still governs.
      measured: >
        RUN THROUGH THE REAL VALIDATION PATH 2026-08-06, no database: of the capture's
        31 memberships, FIVE are rejected outright with `unrecognised SEAL role`
        (Deployment Owner, Deployment Information Owner, Application Module Owner, and
        Site Reliability Engineer twice) because canonicalize_role returns None — so
        four of the SME's thirteen classes cannot be loaded at all today, and §A3's
        "hard-refuse or admit flagged" question is no longer hypothetical. A further
        four rows are silently RENAMED: three "Chief Technology Officer" -> "CTO"
        (benign, an alias doing its job) and one "Operate Manager" -> "L2 Operate
        Manager" (§A4's coercion). On application 70001 that is 13 source rows -> 9
        validating -> 8 distinct attribution_id: four lost to validation and one
        merged into a holding that was already there.
      still_needed: >
        WHICH of the thirteen are required. The note "these are optional" travels by
        position with Deployment Owner, Deployment Information Owner and Application
        Module Owner, which is a partial answer to §B4 and is recorded as such rather
        than generalised — §G asks the remaining ten one line at a time. Also
        outstanding: a definition for each of the four new classes, on the same
        grounds §A5c demands one for the bare Operate Manager.
    - id: declaration-timing
      said: >
        The roles can either be declared up front or during the load.
      changes: >
        Answers §A7 (fixed scheme vs open-ended) in favour of OPEN WITH
        DECLARATION, and retires the hardcoded SealRole enum as the admission
        gate. Neither route is possible today: see §A8 — the vocabulary is not
        configurable at all, and the one role list that lives in YAML is read by
        no code.

mapping:
  - n: 1
    element: "TOMRole concept scheme `tom_roles` — CURRENT: the fixed 7 (application_owner, primary_information_owner, backup_information_owner, cto, technology_risk_controls, design_authority, operate_manager)"
    target: "the enumeration the SME rules in §A — 7 kept, or 9, or another number; and whether the scheme stays FIXED (new members require a new gate, the 2026-07-20 precedent) or becomes open-ended"
    edge: "skos:Concept members of skos:ConceptScheme tom_roles  [RE-OPENED — the scheme is currently `applied`, not proposed]"
  - n: 2
    element: "Operate Manager level — CURRENT: ONE concept `operate_manager` with c7.levels = 'L1,L2' and the level carried as a property on the Attribution node"
    target: "SPLIT into three concepts — L1, L2 and bare — per the SME confirmation of 2026-08-05 (\"three separate role classes, not one concept with a level\"). The `level` property and c7.levels retire with it; the class carries the distinction"
    edge: "(:Attribution)-[:HAD_ROLE]->(:TOMRole) against three ids instead of one  [RESOLVED — SPLIT, confirmed 2026-08-05; not yet applied]"
  - n: 3
    element: "Cardinality per role class — CURRENT: not modelled anywhere. The signed §B prose says 'Backup Information Owner (1-2 persons)' and 'Operate Manager L1/L2 (one or both; 1-3 persons for 24h / 2-3 locations)', and none of that reached a file"
    target: "a per-concept attribute on the TOMRole node (e.g. min_holders / max_holders, or a cardinality note), seeded from whatever §B rules"
    edge: "property on :TOMRole, not an edge  [PROPOSED — new]"
  - n: 4
    element: "The singleton rule where it applies — CURRENT: expressible only as the existing attribution_id uniqueness constraint, which by construction permits N holders per (app, role)"
    target: "a GRAPH-TEST in the verify layer that REPORTS violations, never a database constraint that refuses them"
    edge: "no edge; a check  [PROPOSED — new, §C]"
  - n: 5
    element: "Which roster surface an attribution came from — CURRENT: not recorded. Attribution.source is the literal 'SEAL' at both loader sites regardless of which view produced the row"
    target: "a surface/view discriminator on the Attribution, so a count difference between SEAL Application Contacts and the ServiceNow TOM Accountable view is a readable fact rather than an unexplained mismatch"
    edge: "property on :Attribution  [PROPOSED — new, §D]"
  - n: 6
    element: "Inheritance — CURRENT: not modelled. Every attribution is a flat direct assertion; there is no way to say an assignment was inherited from a parent CI rather than set on this application"
    target: "either explicitly OUT OF SCOPE (recorded as a known non-capability), or an assertion_mode property plus an inherited-from pointer"
    edge: "property on :Attribution (+ a possible parent edge)  [PROPOSED — new, §E]"
  - n: 7
    element: "Employee hierarchy placement — CURRENT: nothing. :Employee is a node class (prov:Agent) with NO Employee-to-Employee edge anywhere in the relationship vocabulary; there is no REPORTS_TO, no manager edge, and no producer-side backlog item that would create one"
    target: "OUT OF SCOPE for the contact load by SME direction 2026-08-05 — the attribution links the person, a LATER PASS places that person in the hierarchy. Recorded here because the hand-off target does not yet exist"
    edge: "deliberately NOT this gate's edge  [SCOPE BOUNDARY — see §B7]"

