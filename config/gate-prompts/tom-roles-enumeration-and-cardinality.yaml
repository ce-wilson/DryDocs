  - label: ":TOMRole (skos:Concept) — the scheme as it exists today"
    source_object: "gate seal-tom-attribution-reshape §B (2026-07-10), seeded by drydocs_core/schema/seal_ontology_supplement.cypher:176-198"
    key: "TOMRole.id (concept id) — 7 members, each IN_SCHEME the tom_roles SkosConceptScheme"
    loader: "drydocs_core/schema/seal_ontology_supplement.cypher (schema supplement, not a data loader)"
    properties:
      - {name: id, origin: source, from: "gate §B revised set, transcribed to config/gate-log.md 2026-07-10", note: "application_owner, primary_information_owner, backup_information_owner, cto, technology_risk_controls, design_authority, operate_manager"}
      - {name: pref_label, origin: source, from: "the gate §B wording", note: "the human label; NOT the same string as the source role name the extract emits — that divergence is the subject of §A"}
      - {name: levels, origin: derived, from: "the §B wording 'Operate Manager L1 / L2 (one or both)'", note: "c7.levels = 'L1,L2' on operate_manager ONLY. This is the single place the seven-vs-nine question is currently answered, and it answers it in favour of seven"}
      - {name: shared_with, origin: derived, from: "the 2026-07-10 §B 'CTO is in BOTH families' record, SUPERSEDED by K5 on 2026-07-20", note: "actively REMOVEd from cto by the supplement so already-loaded graphs lose the stale stamp — an idempotent correction, and the precedent for how a superseded gate fact gets unwound"}
