      - {name: unmapped_role, origin: derived, from: "seal_contacts.cypher:65 — true when the crosswalk returned null", note: "the K4 'surfaced for review, never guessed' flag. §A3 reports that it is only half-wired: the Pydantic model rejects genuinely unknown names before this line can ever see them"}
      - {name: source, origin: source, from: "literal 'SEAL' at both loader sites", note: "the same constant regardless of which SEAL/ServiceNow surface produced the row — the gap §D is about"}
