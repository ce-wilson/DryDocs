    target: "a GRAPH-TEST in the verify layer that REPORTS violations, never a database constraint that refuses them"
    edge: "no edge; a check  [PROPOSED — new, §C]"
  - n: 5
    element: "Which roster surface an attribution came from — CURRENT: not recorded. Attribution.source is the literal 'SEAL' at both loader sites regardless of which view produced the row"
    target: "a surface/view discriminator on the Attribution, so a count difference between SEAL Application Contacts and the ServiceNow TOM Accountable view is a readable fact rather than an unexplained mismatch"
    edge: "property on :Attribution  [PROPOSED — new, §D]"
    evidence_2026_08_10: >
      The ServiceNow side is now SPECIFIED rather than named (K21 §1.1). Its row is
      anchored on x_<scope>_cmdb_tom_main, resolves its role through a tom_roles
      lookup carrying an `active` flag, names a sys_user_group as holder, points at
      its subject via parent_id -> cmdb_ci, and carries its own record number. So the
      discriminator has two concrete values to distinguish, not two labels — and §D3
      can be ruled on shape rather than on description.
  - n: 6
    element: "Inheritance — CURRENT: not modelled. Every attribution is a flat direct assertion; there is no way to say an assignment was inherited from a parent CI rather than set on this application"
    target: "either explicitly OUT OF SCOPE (recorded as a known non-capability), or an assertion_mode property plus an inherited-from pointer — and after 2026-08-10 the pointer may be a MODELLED EDGE, because the parent is a node DryDocs already holds"
    edge: "property on :Attribution (+ a parent edge to :AreaProduct, now available)  [PROPOSED — new, §E]"
    evidence_2026_08_10: >
      SME: `inheritance` takes exactly two values — Inherited, in which case the CI
      comes from the AREA PRODUCT, or Overridden, meaning set by hand. The page's
      third value, "(empty)", is not corroborated by the evidence and should be
      confirmed or dropped at the walk (§E1b). Neither value appears in the public
      ServiceNow documentation, which is consistent with the TOM tables being a
      company scoped app with no vendor baseline at all (K21 §3.1) — so every fact
      about them is an SME fact or an instance fact, never a vendor one.
