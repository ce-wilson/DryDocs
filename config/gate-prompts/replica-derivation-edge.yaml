# GATE replica-derivation-edge — DRAFTED 2026-09-01 by C38 (Idea-219). UNSIGNED.
# Nothing here is ruled. reg_derived_from stays status: planned until sign-off.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: replica-derivation-edge
title: >-
  SME Gate — replica-ness is recorded three times and as no edge: does a typed derivation
  relationship get minted, is the sibling shape rejected knowingly, and is the derivation kind
  kept redundantly as a property
step: >-
  C38 (Idea-219), drafted 2026-09-01 — BEFORE any loader or supplement exists. The candidate
  reg_derived_from is registered status: planned only; nothing loads and no entry flips active
  until these sections are ruled.
summary: >-
  Rules whether a replica's origin becomes traversable. (a) THE GAP: a replica says so three times
  and all three spellings are ATTRIBUTES — the id shape where origin differs from system
  (controlm@[db].psgmgr.* is Control-M data on the psgmgr carrier; snow@[db].[schema].* is
  ServiceNow data on the Snowflake carrier), the authority field reading ADS rather than SOR (12
  rows against 17), and prose in notes. None is traversable, so no query can walk from a replica to
  its origin. (b) THE CANDIDATE is a typed derivation edge on DataHub's D-04 precedent — a typed
  lineage edge with a COPY kind, released 2020-05-21 and patchable one edge at a time. (c) THE
  ANTI-PATTERN IS THE LOAD-BEARING HALF: a sibling-style construct asserts these are the same
  thing, and DataHub's SiblingGraphService ACTIVELY DELETES any lineage relationship between two
  siblings from the merged read path, which is the default — so modelling replica-ness as aliasing
  destroys the fact being recorded. The SME must reject that shape knowingly rather than by
  omission. (d) D-04's SECOND HALF asks whether the derivation kind is also kept as an edge
  property, because the lineage type does not survive traversal on any of their four read paths.
  Evidence is cited by anchor, never summarized.

