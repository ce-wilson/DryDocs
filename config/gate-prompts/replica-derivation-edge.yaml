sections:
  - title: A. The gap — three spellings, no edge, and whether traversal is even wanted
    confirmations:
      - "A1. THE THREE CURRENT SPELLINGS, as the as-built state: (1) the id shape, where `origin` differs from `system` — `controlm@[db].psgmgr.<table>` is Control-M data on the psgmgr carrier, `snow@[db].[schema].<table>` is ServiceNow data on the Snowflake carrier; (2) `authority: ADS`, an authorized distribution rather than `SOR` — 12 rows against 17 at this commit; (3) prose in the row's `notes`. All three are ATTRIBUTES and none is traversable. Confirm the gap, or name a fourth spelling."
      - "A2. THE PRIOR QUESTION, asked before any edge is minted: is TRAVERSAL actually wanted? A reporting-only need — list the replicas and their origins — is already answered by the three attributes. Minting an edge is justified only by a traversal the attributes cannot serve. Name that traversal, or close this gate without minting."

  - title: B. The candidate shape, direction and grain
    confirmations:
      - "B1. A TYPED DERIVATION EDGE on the D-04 precedent: DataAsset -> DataAsset, neo4j_label DERIVED_FROM, prov:wasDerivedFrom (matrix row Entity -> Entity). Confirm the shape and the endpoints, or re-draw."
      - "B2. DIRECTION replica -> origin, inverse phrasing `source of`. Confirm, or invert."
      - "B3. GRAIN is the DATASET pair, not the system pair: psgmgr carries ten Control-M objects, which is ten edges and not one. Confirm, or rule the system-grain alternative and say what happens when one carrier holds two origins — psgmgr already holds Control-M AND HR."

  - title: C. The anti-pattern — rejected knowingly, not by omission
    confirmations:
      - "C1. THE SIBLING SHAPE IS THE TRAP AND IS THE LOAD-BEARING HALF OF THIS GATE. A sibling-style construct asserts these are the same thing. DataHub's SiblingGraphService ACTIVELY DELETES any lineage relationship between two siblings from the merged read path, which is the DEFAULT path — so modelling replica-ness as aliasing DESTROYS THE FACT BEING RECORDED. Confirm the sibling shape is REJECTED, and that the rejection is recorded as knowing rather than incidental."
      - "C2. THE SAME-AS FAMILY (owl:sameAs, skos:exactMatch) inherits C1's defect for the same reason — it asserts identity where the fact is derivation. Confirm the family is out, or name the exception and why it escapes C1."

  - title: D. Recording the HOW — redundantly, or not at all
    confirmations:
      - "D1. D-04's SECOND HALF: the lineage TYPE does not survive graph traversal on any of DataHub's four read paths, so the derivation KIND may need keeping redundantly as an edge PROPERTY. Rule whether the how is recorded twice. The redundancy is a hedge against traversal loss and it costs a property on every edge; declining is a legitimate ruling."
      - "D2. IF YES, THE VALUE SET. Candidate: copy | replica | extract. Two cautions the SME should have: `copy` and `replica` are near-synonyms and one may be redundant, and `extract` is the TRANSFORMING case which may not belong on a derivation edge at all. Rule the enum as a closed set or an explicit seed."

  - title: E. Fence
    confirmations:
      - "E1. NOTHING LOADS ON SIGN-OFF ALONE. The entry flips planned -> active WITH its supplement and loader in the same change (flips-are-follow-ups, N13). Confirm."
      - "E2. OUT OF SCOPE HERE: whether the three attribute spellings become REDUNDANT once an edge exists. Deduplicating them is a registry change fenced by registry-wiring-readiness clause D2, and this gate does not touch the `authority` field, the id grammar, or the `notes` prose. Confirm the fence."
