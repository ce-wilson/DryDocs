sections:
  - title: "A. The artifact-not-in-SCM flag — name, shape, attachment, and what it licenses"
    confirmations:
      - "A1. THE SHAPE IS TRI-STATE, NOT BOOLEAN: proposed property `scm_status` on :Script with values tracked | deployed-only | unknown, DEFAULT unknown. A boolean cannot distinguish 'checked and absent' from 'never checked', and collapsing those two is how an unverified script reads as a verified-missing one. `unknown` is a value the load-map discipline already stands behind (unmatched is reported, not dropped). The alternative — a bare `artifact_not_in_scm: true` flag written only on the bad cases — is laid out for explicit rejection: it makes absence-of-flag ambiguous, which is the same defect one level up. Rule the name and the value set."
      - "A2. NO ANONYMOUS ASSERTIONS (O24/A3), AND AS-OF (K17): `deployed-only` is a CLAIM ABOUT A SEARCH, so the flag carries its basis — proposed companions scm_checked_at (date) and scm_search_scope (what was searched: which SCM roots/orgs). An SCM absence is true AS OF the search that established it and within the scope that was searched — a later import or an unsearched repo can falsify it, which is why the date and scope are part of the assertion, not decoration. Confirm the companion properties ride with the flag or name a leaner basis shape."
      - "A3. IT ATTACHES TO :Script, NOT to the job and NOT to the edge: the artifact is the thing that is absent. A job-level flag would smear one script's status across every job that invokes it; an edge-level flag would fork the status per invocation. Confirm the attachment."
      - "A4. WHAT A CONSUMER MAY CONCLUDE from deployed-only — stated on the term so the first consumer does not invent it: (may) the running artifact has no reviewable source; change-management and remediation flows must treat it as unreviewable (a fix package cannot cite a repo); it is a governance finding worth surfacing. (may NOT) that the script is unmanaged or orphaned — it may live in an unsearched repo (that is what scm_search_scope bounds); and NEVER a deletion or cleanup candidate on this evidence alone. Confirm both lists, or amend."
      - "A5. NOT :Uncertain — deliberately argued rather than assumed: the deepdoc :Uncertain discipline marks findings whose TRUTH is unestablished. deployed-only is a GROUNDED observation (the search ran; its scope and date are on the node) with a bounded conclusion. Blurring grounded-negative-evidence into :Uncertain would teach consumers to discount exactly the flag §A4 wants acted on. Confirm the trust framing."

  - title: "B. Script identity where no pipeline id exists — path as the fallback key"
    confirmations:
      - "B1. THE STANDING NOTE THIS SECTION MUST EITHER AMEND OR OBEY: the lineage model's own rule says path is 'kept as node PROPERTIES, never identity' — written when GUID-keyed DPL pipelines were the only first-class code objects, and :Script carries NO uniqueness constraint today. Non-DPL payloads (python/shell reached by the CMDLINE chain) have no GUID at all, so today they have NO identity key whatsoever — two loads can mint two nodes for one script. PROPOSED: the resolved, normalized path IS the identity fallback for kind: payload scripts, amending the standing note from 'never identity' to 'never identity WHERE A GUID EXISTS'. Rule it — and if declined, name what else keys a GUID-less script, because 'nothing' is the current answer and it cannot survive a second load."
      - "B2. THE GUID-vs-PATH BOUNDARY AS THE KIND DISCRIMINATOR — confirm what already operates: G97 built exactly this split (GUID-keyed targets stay :ETLProcess on INVOKES; path-shaped payloads land :Script on USES_ARTIFACT), resolving its one real collision in favour of the boundary (a DPL pipeline reached through a launcher is an :ETLProcess, full stop). This clause asks the SME to RATIFY the boundary as the ruled discriminator — has-a-GUID means pipeline-class identity, path-only means Script — so the build stops running ahead of its ruling. If re-drawn, G97's bucket counts are the named re-verification."
      - "B3. NORMALIZATION AND STORAGE SCOPE, the two hazards that make naive path identity wrong: (1) one script, many spellings — %%VAR-resolved prefixes, symlinks, relative forms; identity must be the RESOLVED, normalized path (the CMDLINE resolution chain already produces it) or the key shatters per spelling. (2) one path, many machines — G56 now DERIVES shared-vs-local from the mount table: a shared-mount path is ONE artifact across N hosts, a local path is per-host. PROPOSED key shape: (storage_scope, normalized_path), collapsing to path alone on shared storage. The path-only alternative (simpler, wrong on local storage where two hosts' /opt/x.py are different files) is laid out for explicit rejection. Rule the key shape."
      - "B4. CONTENT IS A PROPERTY, NEVER THE KEY: where bundle evidence supplies a content hash (the rua collector), it lands as a property for drift detection — same path, changed content is a VERSION fact, not a new identity. Hash-as-identity is rejected in the prompt body because it inverts the operator question (operators ask 'what runs at this path', never 'where does this hash run'). Confirm."
      - "B5. THE CONSTRAINT CONSEQUENCE, stated so sign-off knows its blast radius: ruling B1+B3 implies a uniqueness constraint on :Script over the ruled key — a constraints.cypher addition, an EXPECTED_CONSTRAINTS bump, and a backfill question for any Script nodes already minted without it (the S3 null-ignoring-uniqueness lesson: MERGE on a new key beside old unkeyed nodes creates twins). The migration is a groomed follow-up, never performed at sign-off. Confirm the reading."

  - title: "C. Scope fence"
    confirmations:
      - "C1. THE ANTI-PATTERN IS NOT RE-RULED: _FW-really-API and design principle 8 (intent from resolved flow; flag the name-token disagreement) stand as signed at cmdline-nfr-vetting. This page rules only the two gaps that case exposed."
      - "C2. THE DECLARED-PROVENANCE CARRIER IS OUT: the description-field metadata plan owns how a job DECLARES its provenance going forward; this page rules only what the graph asserts when nothing was declared. The two must not be merged — one is authoring policy, the other is observed-estate modelling."
      - "C3. FLIPS ARE FOLLOW-UPS, and for property terms the M4 rule is stricter: signing authorizes; the §0b property-term bindings are REGISTERED at sign-off (decided_by names this gate), the constraint/backfill migration is a groomed follow-up, and no loader writes any of it until then. The two map rows stay proposed until this page signs."
