# SME gate-prompt spec — the two Script provenance gaps (backlog G61). GATE-BOUND
# AND DECIDES NOTHING: drafting a prompt is not an ontology change (the
# G27/W1/N10 precedent). Nothing is written to the graph until sign-off, no
# loader changes, and the property-term bindings this page proposes land in the
# vocabulary's section 0b AT SIGN-OFF, not before — the envelope-property-terms
# (M4) precedent: `decided_by` names a signed gate, so a binding cannot precede
# its gate. The two map rows ARE the pre-gate registration (status: proposed).
#
# THE LIVE CASE both gaps come from (cmdline-nfr-vetting, SIGNED 4/4
# 2026-07-21; Idea-21): a file-watcher-shaped job whose .tok is produced by an
# UPSTREAM API-call job writing the file locally — the name and the type lie.
# The anti-pattern itself is ALREADY CODIFIED (_FW-really-API + design
# principle 8: intent from resolved flow, flag the name-token disagreement) and
# is NOT re-ruled here. What that case left OPEN is what this page puts to the
# SME: (a) the flag for a payload script deployed on the execution host but
# absent from source control, and (b) Script identity where no pipeline id
# exists.
#
# TIMING NOTE, because both of tonight's closes feed this page: G97 (the m7
# payload build) made the GUID-vs-path boundary OPERATIONAL — GUID-keyed DPL
# targets stay :ETLProcess on INVOKES, path-shaped payloads land :Script on
# USES_ARTIFACT — and G56's mount-table capture is what makes path identity
# DECIDABLE on shared storage. Section B rules the policy those builds are
# already running on.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: script-provenance-gaps
title: "SME Gate — Script provenance gaps: the not-in-source-control flag, and path-keyed identity where no pipeline id exists"
step: "The FW-really-API live case surfaced two gaps the signed anti-pattern does not cover: a payload script that RUNS on the execution host but cannot be found in source control (the code search finds only the XML variable reference), and Script identity for non-DPL jobs, which carry no pipeline-id key at all. Both are keying/meaning decisions, so they route through this gate rather than through a build. G97 and G56 (closed 2026-08-25) made both questions concrete: the GUID-vs-path boundary now operates in the payload build, and mount capture makes shared-vs-local storage a derived fact."
summary: >
  Section A rules the artifact-not-in-SCM flag: a tri-state scm_status on
  :Script (tracked | deployed-only | unknown) rather than a boolean — because
  "checked and absent" and "never checked" must never share a value — carried
  with the search that established it (no anonymous assertions, as-of the
  search date), and with what a consumer MAY and MAY NOT conclude stated on
  the term itself. Section B rules identity: whether the resolved, normalized
  PATH is the identity fallback for scripts that have no GUID, whether the
  GUID-vs-path boundary is confirmed as the kind discriminator it already
  operationally is after G97, and what storage scope (G56's derived
  shared-vs-local) does to the key shape. Section C fences scope: the
  anti-pattern stays as signed, the description-field metadata plan remains
  the declared-provenance carrier, and every binding lands at sign-off.

