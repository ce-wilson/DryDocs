sections:
  - title: "A. The connection block on SYSTEM rows — references, never values"
    confirmations:
      - "A1. THE BLOCK: a SYSTEM row may carry `connection:` with exactly three children — `settings_group:` (the drydocs_core.config settings class / env prefix that reaches this system, e.g. the Oracle group for the replica DB), `secret_refs:` (the LIST OF ENV-VAR NAMES the connection requires — names only, values never, the DataHub ${SECRET_NAME} convention adapted to ADR 0014), and `restricted_record:` (the stable id/path of the Section-B record holding the citable coordinates). Confirm the three-child shape, or re-draw it."
      - "A2. NAMES-ONLY IS GUARDED, NOT TRUSTED: a test asserts every name in any `secret_refs:` list appears in the committed `.env.example` (so the shape is reproducible from a clean checkout) AND that no `connection:` child carries a value-shaped string (host:port, URI, account number classes). The schema stays shape-only per S6; enforcement is the test. Confirm."
      - "A3. THE JOIN IS ONE-DIRECTIONAL BY DESIGN: the registry points at the settings group; drydocs_core/config.py never reads the registry (settings stay importable with no YAML in reach — the ADR 0014 clause). Confirm the direction."
      - "A4. `locator.service: ~` ROWS MIGRATE: every SYSTEM row whose locator nulls a connection field with a twin-pointing comment gains a `connection:` block at the build, and the comment idiom retires. Rows with no reachable connection (pure file-drop systems) carry NO block — absence means nothing to connect to, never 'not yet filled in.' Confirm."
  - title: "B. The restricted connection record — the term that carries the risk"
    confirmations:
      - "B1. THE TERM: the credential-adjacent record class (endpoint, cluster, account, server version, login identities, capture clock — the citable coordinates a profile needs) is named RESTRICTED CONNECTION RECORD. It replaces the connection/values sense of 'internal twin' ONLY; the other four senses of 'twin' in this repo are named untouched. Confirm the term (SME pre-selected it 2026-08-28; this clause makes the selection a signed fact)."
      - "B2. THE MARKER: config/classification.yaml's Internal level gains `handling: restricted` as a per-entry note class (the J23 collapse precedent — a marker on Internal, never a fourth tier). A restricted connection record is always Internal + restricted; restricted never appears on External or Internal-Public entries, and a guard says so. Confirm."
      - "B3. THE SPLIT THE TERM ENFORCES: coordinates (citable, restricted record) versus credentials (passwords, tokens, key material — NEVER in git on any side, env-reference only per Section A). A restricted connection record carrying a credential-class field is a defect the sweep's guard catches, not a judgment call. Confirm the two-class split."
      - "B4. THE SWEEP is dated-correction-in-place: gate-log's ~15 'internal twin' entries get dated correction notes, never rewrites; config comments, PUBLISH-BOUNDARY.md, the two module headers, and the two test failure messages re-word at the build. Sweep scope = the grep classes named in provenance, run at the build and again at acceptance. Confirm."
  - title: "C. The dated acquisition — since, history, and one vocabulary"
    confirmations:
      - "C1. `acquisition.since:` — the dated field N14 clause (b) proposed: when the CURRENT route began. Required on every dataset row at the build (backfilled from git history where derivable, else the registration date with a note). Confirm."
      - "C2. THE TRANSITION HISTORY: a manual-to-automated flip (N13's SIGNED ruling — built on here, never re-asked) leaves the prior route ON THE ROW as a dated `acquisition_history:` entry (route, since, until, reason) — the registry v2 add-new-plus-retire-old idiom applied to routes. The manual era stays on the record; Idea-132's 'no field to flip' case becomes the worked example. Confirm the history shape."
      - "C3. ONE VOCABULARY: ADR 0012 proposed five acquisition values (file-drop/db-pull/api-pull/repo/scrape) that were never reconciled with N12's built mode/via pair. RULE IT HERE: the proposal is mode/via STAYS the stored shape, and the ADR 0012 five-value list becomes the DERIVED display vocabulary (mode+via+format map onto it deterministically). Whatever the ruling, no third vocabulary may leave this session. Confirm or re-draw."
  - title: "D. Run input identity — the :JobRun envelope learns what it read"
    confirmations:
      - "D1. DATASET ID: `_open_run` records the source-registry DATASET id on the :JobRun (alongside, never replacing, the N16 source_label carrier — they answer different questions). SOURCELESS_LOADERS rows record their declared written reason instead. Confirm."
      - "D2. INPUT PATH, zone-relative: the run records the input as `<zone-id>/<relative-path>` — shape-safe by the same rule test_drop_dir_stays_inside_the_landing_zone_convention enforces; the real machine path stays in the disk log only. Confirm."
      - "D3. INPUT DIGEST: a per-run sha256 of the input artifact (file digest for file routes; for db routes the extract watermark/row-count pair, digest where the adapter can stream one). This is the M3/M4 envelope family — additive properties, LoadSummary and the run-log header gain the same fields so graph and disk records agree. Confirm."
      - "D4. THE CLAIM IT BUYS, stated so acceptance can test it: after the build, 'this graph state came from this input' is answerable from the graph alone for every route that has an input artifact — the round-trip proof in the plan's verification section. Confirm the acceptance shape."
  - title: "E. Declare-or-refuse — the standing acquisition rule"
    confirmations:
      - "E1. THE RULE: every acquisition route is DECLARED (registry acquisition block + landing/data zones) or the CLI refuses. The rule is ratified here as standing policy; the `load --csv` closure itself builds as a plain defect and does not wait for this gate. Confirm the rule."
      - "E2. THE RECORDED OVERRIDE: an explicit override flag may accept an undeclared input, and when it does, the run record AND the disk log both say so (flag name, path shape, operator) — a declared escape hatch, never a silent side door. Refusing an override entirely is also a valid ruling; say which. Confirm."
  - title: "F. Fence, riders, and the transcribe gate"
    confirmations:
      - "F1. FENCED OUT: N14 (union report) and N15 (agreement detection) build exactly as minted; N13's flip ruling and N12's mode/via semantics are untouched; nothing in this page moves any row's `confirmed` state. Confirm the fence."
      - "F2. RIDER, RECORDED NOT RULED: profiling sessions as a TYPED run against a registered source (the OpenMetadata profiler-pipeline analog) — so an SME review status cites a run id instead of a chat transcript — rides to the profiling-sync-packet protocol as a candidate, with this clause as its pointer. Confirm the rider parks there."
      - "F3. Safe to transcribe into config/gate-log.md."
