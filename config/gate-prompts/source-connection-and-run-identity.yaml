# SME gate-prompt spec — connection-by-reference + run input identity (the
# source-registry two-issue redesign; plan approved 2026-08-28). GATE-BOUND AND
# DECIDES NOTHING: drafting a prompt is not a schema change (the G27/W1/U11/N10
# precedent). No registry field lands, no envelope property is written, and the
# SIGN-OFF is a separate SME session.
#
# WHY THIS PAGE EXISTS: the DPL/Chronicle registration session (company-side,
# 2026-08-27) exposed that registering a DB-backed system of record has no
# typed mechanism — the committed row's whole answer is `locator.service: ~`
# plus a prose comment pointing at "the internal twin," a term the SME ruled
# does not carry the risk implications. Separately, the :JobRun record cannot
# identify its input (no dataset id, no input path, no digest), so
# "this graph state came from this file" is not answerable from the graph.
#
# EXTERNAL MODELS, cited not adopted: DataHub (committed recipe; credentials
# only as ${SECRET_NAME} references) and OpenMetadata (the Service entity owns
# the connection; secrets are references resolved at runtime; the ingestion
# pipeline is a first-class entity with typed runs and run history). Both draw
# the same line this page proposes: connection SHAPE is declarable
# configuration; credentials exist only as named references. Neither has
# classification tiers, a publish boundary, or a confirmation gate — those
# stay DryDocs mechanisms and this page does not import any tool.
#
# BUILT-ON, NEVER RE-ASKED (L25): N12's acquisition block (mode/via/format/
# drop_dir/drop_dir_base) and its clause (f) ruling that `mode: manual` is
# never a defect; N13's signed lifecycle-flip ruling; N16's source_label
# carrier enum; ADR 0014's env split (per-machine operational facts to the
# environment, domain meaning to committed YAML); the S6 rule that the JSON
# Schema stays shape-only and ENFORCEMENT IS THE TEST.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: source-connection-and-run-identity
title: "SME Gate — source connection by reference, the restricted connection record, and run input identity"
step: "Registering a DB-backed source today nulls the connection field and points at prose; the run record cannot name its input. This page puts six sections to the SME: the connection block on SYSTEM rows (references, never values), the restricted-connection-record term and handling marker, the acquisition.since field and transition history, the :JobRun input-identity envelope, declare-or-refuse as a standing acquisition rule, and the fence. Nothing lands until sign-off; the --csv defect closure and the S13 import fix build independently as plain bugs."
summary: >
  Section A proposes a typed `connection:` block on SYSTEM rows — a settings
  group, secret REFERENCES by env-var name, and a pointer to the restricted
  connection record — so a committed row documents a DB-backed source
  completely while carrying no value. Section B ratifies the term "restricted
  connection record" for the credential-adjacent record class (replacing the
  connection/values sense of "internal twin" only) plus a
  `handling: restricted` marker on the Internal level. Section C adds the
  dated `acquisition.since:` field and the recorded manual-to-automated
  transition history on top of N13's signed flip ruling, and reconciles ADR
  0012's five-value acquisition vocabulary with N12's mode/via so no third
  vocabulary exists. Section D adds input identity to the :JobRun envelope
  (dataset id, zone-relative path, input sha256) so reproducibility is
  answerable from the graph. Section E ratifies declare-or-refuse for every
  acquisition route with a recorded override. Section F fences N13/N14/N15
  and parks the profiler-as-typed-run idea as a rider.
