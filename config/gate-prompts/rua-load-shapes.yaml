      - "F2 CONFIRMED 2026-08-06, WITH TWO RESTATEMENTS the page needs because it was drafted before source-registry v2. (1) CLASSIFICATION LIVES ON THE SYSTEM ROW, not the dataset row — v2's D1 split (signed 2026-07-31) put connection/locator/classification/SDLC on systems and gate/crosswalk/authority/confirmed on datasets, so a dataset inherits its system's level. (2) THE IDS THIS CLAUSE NAMES ARE RETIRED: rua-server-extract and code-repo were replaced under the v2 born-here grammar by exec-hosts:rua-bundle and bitbucket:repo-objects-manifest, and the D4 refusal list refuses the old strings outright. VERIFIED IN PLACE AT THE RULING, so this clause confirms state rather than requesting it: exec-hosts, bitbucket and dpl all carry classification: Internal — the only registrable level for this material since J23 — each with a confidential-handling NOTE on the entry, which is exactly the F1 output shape; and bitbucket:repo-objects-manifest carries confirmed: false with THIS GATE named as the activation condition. Nothing flips until §J. [superseded page text follows]"
