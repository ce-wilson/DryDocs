sections:
  - title: "A. Activation scope — which planned vocabulary these facts may turn on (clause a)"
    confirmations:
      - "A1 RULED 2026-08-06 — HOLD, pending K17. m3_delegates_to may NOT activate yet, because its SUBJECT HAS NO AGREED KEY. ControlMJob.run_as carries the linux TENANT NAME — the functional-id NAME, not the directory key — and fid-identity-and-scope §A1/§A2 rules :AppUser keyed on `fid`, with `fid_name` a property and the name->fid resolution an explicit crosswalk step whose miss rate is a first-class number. That gate is DRAFTED AND UNSIGNED (K17, which the K16 census precedes). No AppUser constraint is deployed today, so activating here would key :AppUser on the NAME by default — precisely the silent split §A1 exists to prevent — and §A3 leaves name-reuse-after-retirement unresolved. SME DIRECTION carried from 2026-08-05: the run-as account may be REGISTERED to a different application than the job's Control-M app code. Registration is not attribution (J32, the standing rule now in docs/RELATIONSHIP_GUIDE.md); no transitive read job->account->application is permitted (fid §G2); the K2 FID tier is MIS-SPECIFIED rather than merely unimplemented, harmless today only because the table is empty (fid §G3); and a disagreement is a first-class FINDING with three readings distinguished per case, never globally (fid §G4/§G5). The rua envelope corroborates PRESENCE; it authors no identity. Re-tick after K17 signs."
      - "A2 RULED 2026-08-06 — DECLINED as redundant (SME). ETL placement is THE SAME FACT as job placement, so m3_runs_on_etl_host would be a synonym splitting the answer to -where does this run- across two labels. The job side is already built and ACTIVE (P3, 2026-07-27): CM_DEF_VJOB.NODE_ID x CM_HOSTS.GRPNAME -> RUNS_ON {role: host_group}, the 2-hop case where Control-M's in-application load balancer spreads the run across the group's members; else CM_DEF_VJOB.NODE_ID x CM_HOSTS.NODEID -> RUNS_ON {role: agent_host}, the 1-hop hard-coded case; with the P4 census counting any NODE_ID that matches BOTH. COLUMN CORRECTION recorded at the session, because it nearly reached this page wrong: the join is NODE_ID, NEVER GROUP_NAME. psgmgr CM_DEF_VJOB.GROUP_NAME is the vendor APPLGROUP — the APPLICATION group (schema-crosswalk §COL) — which is the exact collision gate controlm-hosts-topology named the class ControlMHostGroup to avoid (signed 2026-07-09; guarded in controlm_hosts.cypher:8 and ontology_supplement.cypher:104). Two different fields, both spellable as -group-: J32's read-the-field's-job rule, third observed instance. FOLLOW-UP BUILD, not this gate (I1): m3_runs_on_etl_host goes planned -> deprecated pointing at m3_runs_on_agent_host / m3_runs_on_host_group, and ontology_supplement.cypher trims its documented role enum from (host_group | agent_host | etl_host)."
      - "A3 RULED 2026-08-06 — ACTIVATE (endpoint shape decided first: B2). m3_invokes activates for reference facts, its to_node widened to Script|ETLProcess per B2. Feed verified present at the ruling, not assumed: CMD_LINE invocation facts from controlm_inventory (G14, done), the G39/G40 interim staging seam (both done), and G16 SCRIPT_PATH facts (done). TWO SIGNED RULINGS RIDE IN WITH IT and are not re-opened here: cardinality is 1..n per job (compound if/else command lines carry multiple invocations) per gate cmdline-lineage-review 2026-07-16; and :Script identity stays PATH-KEYED, with same-basename multi-mount duplicates surfacing in lineage-review for SME MERGE and NEVER auto-merged. That second one CONSTRAINS D1: the URN this gate rules must render that path key or amend a signed ruling — it cannot quietly replace it."
      - "A4 RULED 2026-08-06 — ACTIVATE, AND DELIBERATELY IN THE SAME BREATH AS A3. m7_uses_artifact activates. Feed verified and specific: FACT_REGISTRY carries ETL_ARTIFACT_URI / ETL_ARTIFACT_KIND / ETL_ARTIFACT_SHA plus ETL_PLATFORM / ETL_PLATFORM_FLAGS, with alias rollups (ARTIFACT_URI -> ETL_ARTIFACT_URI) under the aliases-suggest-values-decide contract — never the variable NAME alone, per the 2,384-variable gap analysis that found names lie. WHY TOGETHER WITH A3 AND NOT AFTER IT: the m3_invokes entry says payload invocations MIGRATE off it onto this label at this entry's build. Activate A3 alone and payloads land in the 1..n INVOKES fold first, so the migration then has to move edges ALREADY IN THE GRAPH instead of routing them correctly on first load. Activating both means the launcher/payload split is right from the start. Riders already SME-ruled at cmdline-nfr-vetting 2026-07-21 (SME-3) come with it: :Script gains script_role {launcher, payload} plus platform / artifact_uri / artifact_kind / platform_flags / script_path. NOTED FOR §G2: ETL_ARTIFACT_SHA is a CONTENT HASH arriving on the variable, so a DPL-managed artifact can be hash-BEARING even where the rua listing is hash-absent — a corroboration path G2 as drafted does not anticipate."
      - "A5 RULED 2026-08-06 — ACTIVATE, WITH THE RESTRICTION RESTATED (the SME changed the page's own words here rather than ticking them). New wording: m3_reads_from / m3_writes_to activate for STRUCTURED, LAUNCHER- OR REGISTRY-GROUNDED evidence — dataset_flow AND parsed CMD_LINE file-ops — but NOT script-body content grep. WHY THE RESTATEMENT: the drafted -never parsed prose- read as excluding the CMD_LINE feed, and a SIGNED gate already put that case here. The m3_triggers note (gate confirmed 2026-07-15) says the other wrapper case is pure unix file operations, move and gzip, with no ETLProcess, and that case is m3_reads_from / m3_writes_to with ControlMJob as the Activity. Excluding file-ops would have left a signed case with nowhere to land. Both feeds verified: dpl_mac maps dataset_flow.json inputDatasets/outputDatasets to READS_FROM/WRITES_TO candidates (GUID + version + zone), and controlm_inventory (G14, done) parses CMD_LINE MOVE/COPY/COMPRESS into the same candidates with counters for non-dataflow ops and missing operands. CONSEQUENCE ACCEPTED WITH THE ACTIVATION, and it lands on D1/G1: local_file DataAssets will be numerous and transient — one per MOVE operand — so whether they are the same node class as registered datasets is a real question this activation creates and those clauses must answer."
      - "A6 CONFIRMED 2026-08-06: anything NOT ticked above stays planned and candidate-side — declining an activation here is a normal outcome, not a failure. EXERCISED THE SAME DAY, which is the useful part: A2 was DECLINED as redundant and A1 HELD on an unsigned identity, and neither is a gap in the gate. Of the six candidates the acceptance named, one (ControlMJob RUNS_ON ExecutionHost) was already active before the session, three activate, one is declined and one is held."
  - title: "B. Rider R2 — the m3_invokes endpoint question (decide before A3)"
    confirmations:
      - "B2 CHOSEN 2026-08-06 (SME) — to_node broadens to Script|ETLProcess. One edge meaning, two endpoint classes, the endpoint recorded per edge. Three reasons on the record: the union-endpoint precedent already exists in this same vocabulary (m3_reads_from / m3_writes_to take ETLProcess | ControlMJob as from_node); G12 is DONE and already lands INVOKES directly on an :ETLProcess for the abioncloud wrapper-payload expansion, so B1 would mean re-modeling working code; and B1 splits one question — what does this job call — across two labels chosen by what the callee happens to be, making it a two-query answer permanently. B1 is therefore NOT CHOSEN. This unblocks A3. FOLLOW-UP BUILD per I1: the m3_invokes entry's to_node widens at its build, not here."
      - "B1 NOT CHOSEN [superseded by B2 above]: to_node stays Script only; wrapper-payload cases where the call lands directly on a managed process (no script hop — the G12-implemented expansion, 2026-07-19 finding) are modeled as INVOKES->Script absent + a separate job->ETLProcess edge. [choose]"
      - "B2 [the chosen option, text as drafted]: to_node broadens to Script|ETLProcess (the m3_reads_from precedent for union endpoints) so INVOKES lands on whichever the evidence names — one edge meaning, two endpoint classes, endpoint recorded per edge."
      - "B3 CONFIRMED 2026-08-06: the raw evidence string (command line / variable form) is kept verbatim on the edge or occurrence record — the derivation is always re-checkable. Confirmed under B2, and it carries MORE weight there than it would have under B1: when one label can land on two endpoint classes, the verbatim evidence is the only way to re-check that the class was chosen correctly."
  - title: "C. New edge meanings the bundles imply — planned-first, never invented at load (clause b + rider R1)"
    confirmations:
      - "C1 RULED 2026-08-06 — THAT SHAPE. (:DataAsset)-[:WAS_ATTRIBUTED_TO {role: 'directory_owner'}]->(:AppUser), drafted by ontology-mapper as status: planned. Entity -> Agent is the matrix row, and role-discrimination on this shared label is the house pattern — five entries already use it (arch_develops, arch_owns_code, the catalog, docs and seal instances), several active. PRECEDENT CORRECTION for the record: arch_owns_code, the entry the page cites, is ITSELF status: planned with loader: ~ and has never loaded anything. The shape is right; the load-bearing precedent is the role-discriminated label, not that entry, and -per the arch_owns_code precedent- should not be read as -per a working pattern-. BLOCKED AT BUILD, NOT AT RULING: the to_node is the :AppUser whose key A1 just held on K17. C1 lands planned today and CANNOT be built before K17 signs — recorded here explicitly so G55 and G23 do not walk into it. IDENTITY SUB-RULING, taken on the recommendation stated at the session: directories.tsv carries owner as a bare unix account name that may be a service account OR a person, so a directory owner resolves to :AppUser ONLY on a known functional-id match; everything else stages UNRESOLVED AND COUNTED per the never-silent house rule, never guessed onto an Agent. [superseded page text follows]"
      - "C1 [as drafted]: run-as user owns home/directory DataAssets — PROPOSED as WAS_ATTRIBUTED_TO {role: 'directory_owner'} (the arch_owns_code ownership-as-attribution precedent) rather than a new relationship type; ontology-mapper drafts the entry status: planned. [that shape / a new dedicated type / decline]"
      - "C2 RULED 2026-08-06 — TWO PARTS, both as recommended. (i) FROM_NODE: a profile is a :Script carrying script_role: profile — the cheapest honest answer. A profile IS a shell script file: it has a path, an extension and content. This reuses the script_role discriminator A4 brought in (launcher | payload, now extended to a third value), mints NO new node class, and inherits C3's SWO typing for free. (ii) EDGE: dot-sourcing gets its own LOCAL type, SOURCES, with prov_maps_to: ~ — because the Entity -> Entity matrix row is prov:wasDerivedFrom, -transformed or computed from another entity-, and sourcing is NOT derivation; mapping it there would assert something false. Precedent for a local label with no PROV row exists and is ACTIVE: m3_scheduled_on carries prov_maps_to: ~ with -No PROV-O equivalent; infrastructure placement- in its note. m3_invokes is reused ONLY for actual execution from a profile, never for inclusion. G21 DID THE HARD PART AND LEFT THE NAMING HERE ON PURPOSE: rua_code_ops.py stages dependency candidates with needs_vocabulary: True, writes NO relationships, and separates the verbs itself — _SOURCE_VERBS = {'.', 'source'} annotated -shell inclusion verbs, never an invocation- and -a profile is environment inclusion, not a gated Activity, so the edge MEANING is the G22 gate's-. Both entries land status: planned via ontology-mapper. [superseded page text follows]"
      - "C2 [as drafted]: profile sources/invokes script (G21's flagged dependency candidates) — PROPOSED as its own entry (candidate spellings: SOURCES for dot-sourcing, INVOKES reuse for execution); ontology-mapper drafts status: planned with the from_node = the profile's node class ruled here too (Script? a :Profile subclass? the cheapest honest answer wins). [rule shape / decline]"
      - "C3 RULED 2026-08-06 — ADOPT, plus one addition the session made. (:Script)-[:IS_ENCODED_IN]->(SwoClass) derived from the path extension, the G33 §E1(b) adapter pointed at the second software-artifact class. CHEAPER THAN THE PAGE DESCRIBES: EXTENSION_LANGUAGE_IRI ALREADY carries .sh -> SWO_0000124 and .sql -> SWO_0000126 beside .py, and the 2026-08-05 ruling added a parallel EXTENSION_MEDIA_TYPE_IRI layer under the same discipline, so this is -point the existing adapter at :Script too-, not -build a binding-. THE ADDITION: .ksh binds to the SAME Shell term as .sh (SWO_0000124) — SME ruling, .ksh is a PEER of .sh and not a separate language. It is not cosmetic: the signed m3_triggers note names the .ksh wrapper as the COMMON case in this estate (one .ksh wrapper script launching the Informatica / Ab Initio / DPL workload), so leaving it out left the most frequent extension in the estate unbound and merely CLI-reported. APPLIED at this session in drydocs/loaders/code_snapshot.py with a test asserting the two extensions resolve to the SAME iri, so they cannot drift apart later — an adapter-data addition that stands alone and improves :CodeModule typing today, independent of whether :Script ever loads. The IS_ENCODED_IN EDGE itself still rides G55. Boundary CONFIRMED as pre-ruled: run_as / J.OWNER is Agent territory (PROV/ORG), never an SWO binding. [superseded page text follows]"
      - "C3 [as drafted, rider R1]: when clause-D lands :Script nodes, (:Script)-[:IS_ENCODED_IN]->(SwoClass) derived from the path extension — the G33 §E1(b) adapter applied verbatim to the second software-artifact class (.sh -> Shell, .sql -> SQL; binds two of the three seeded-but-unused SWO terms). Boundary CONFIRMED as pre-ruled: run_as/J.OWNER is Agent territory (PROV/ORG), never an SWO binding. [adopt / decline]"
  - title: "D. Script identity + dedup — one file, one node, every occurrence recorded (clause c)"
    confirmations:
      - "D1 RULED 2026-08-06 — THE SEGMENTS ARE THE NORMALIZED ABSOLUTE PATH, and the question was already answered by a SIGNED gate rather than open. cmdline-lineage-review (2026-07-16) §c: -Script identity stays PATH-keyed; duplicates surface, never auto-merge-, with the live case recorded as -one logical .ksh at two mounts- and same-basename multi-path Scripts flagging in lineage-review for SME merge via the curation ladder. That retires BASENAME as a candidate outright, and G2 placed the content hash on occurrence records this same session (identity must survive edits), so the path is the only surviving candidate. URN: urn:drydocs:script:{normalized-abs-path} — the SAME grammar G1 stated for unmanaged assets, so D1 and G1 land as one grammar rather than two. NORMALIZATION IS MECHANICAL ONLY: collapse duplicate slashes, strip the trailing slash, count-and-reject relative or ..-bearing paths as malformed. NO symlink resolution and NO case folding — POSIX paths are case-sensitive and nothing on the capture side ever resolved a link, so both would be guesses dressed up as normalization. THE CROSS-HOST CASE IS THE ONE THING §c DOES NOT COVER, and the D-amendment already chose the answer: §c is same-basename at DIFFERENT paths, the amendment is the SAME path on N hosts. Keep ONE node and suppress the CLAIM rather than re-key — the path stays the key, and storage_scope local-or-unknown means the node carries identity-unconfirmed-across-hosts with no corroboration asserted. Putting the honesty in the claim layer keeps A3's signed path key intact instead of quietly amending it, which is exactly what A3's own transcription warned against. [superseded page text follows]"
      - "D1 [as drafted]: a logical script gets ONE DryDocs URN extending the D1 grammar — urn:drydocs:script:{segments} — and the SAME file arriving from the server extract (G20), the code repo (G24), or reference facts (G21/G16) MERGEs to that one node; duplicate nodes/labels are a defect by definition. THE SESSION RULES THE SEGMENTS (candidates: basename? path-normalized logical name? content-hash-free — identity must survive edits, hash is the VERSION axis per clause G)."
      - "D2 RULED 2026-08-06 — REIFIED OCCURRENCE RECORDS as their own node class, planned-first; AND THE CLAUSE EXPOSED A LIVE AS-BUILT DEFECT. THE DEFECT, verified at the ruling: rua_inventory._stage_artifact, on a SECOND arrival of the same staged id, increments cross_host_collisions and DROPS THE RECORD — first-write-wins, so the second host's origin, sha256, owner, perms, mtime and envelope never land at all. D2 was drafted against -squashed into node properties that overwrite each other-; the actual behaviour is WORSE than the failure the clause names, because the second observation is not overwritten, it is discarded, and a discarded observation cannot be recovered by any later loader. The repo side DOES keep its occurrences, but as a PACKED STRING — code_repo.py accumulates ref|commit|commit_date|blob_sha newline-delimited into one occurrences property, parsed back by corroborate(). Acceptable as staging; ruled out as graph shape by ADR 0001's own words, -a string is not queryable-. THE GRAIN: a reified occurrence NODE, drafted status: planned via ontology-mapper with its entry in 10-node-classifications.yaml. It is the ONLY shape that holds both origins UNIFORMLY — the server occurrence's locator is host+path, the repo occurrence's is repo+ref+commit, so an edge-property shape hung off :ExecutionHost cannot carry the repo half at all, and the whole premise of this gate is one file arriving from three sources. Standards binding: prov:specializationOf, the term ADR 0001 already cites. WHY THIS DOES NOT CONTRADICT THE D-AMENDMENT'S DEFERRAL of the storage-locus node: that one was deferred as -an entity with no source-, and occurrences have a source in EVERY bundle — every listing row IS one. The deferral reason does not transfer. Occurrence properties carry at minimum: origin (server-extract | code-repo | reference-fact), the full locator, sha256 where present (G2), and mount_root + fstype + storage_scope once G56 lands. THE EXTRACTOR FIX IS A PRECONDITION OF G23's OWN ACCEPTANCE, not new scope: that item already demands a two-source fixture proving single-node merge, and it cannot pass while the extractor drops the second occurrence — merged there rather than groomed as a new item. [superseded page text follows]"
      - "D2 [as drafted]: every source occurrence is recorded WITH origin (server-extract | code-repo) and its full locator — host+path for the extract, repo+branch+commit+path for the repo — as occurrence records (properties vs child nodes: rule the grain here), never squashed into node properties that overwrite each other."
      - "D3 RULED 2026-08-06 — THREE PARTS: the host half resolves to FQDN, the AppUser half is HELD, and the counter means ambiguity rather than duplication. (i) THE MATCH IS rua_fqdn -> ExecutionHost.nodeid, NOT rua_host. config/source-mappings/psgmgr.yaml records NODEID as -member agent host FQDN (8,161 distinct); ExecutionHost node key (constraint executionhost_nodeid)-, so the deployed key already holds fully-qualified names and the bare hostname would simply fail to match. The envelope stamps BOTH spellings, so honouring this costs nothing. Where rua_fqdn is ABSENT or unqualified the record stages UNRESOLVED AND COUNTED, never matched on the bare hostname — a prefix match across domains is precisely the guess the never-silent house rule forbids, and the failure mode is binding a script to the WRONG SERVER, which is worse than not binding it. P3's executionhost_nodeid UNIQUE constraint stands as the key and rua mints no second host identity, which is what the SME's nodeid-is-the-real-server-name input already implied. (ii) THE AppUser HALF IS HELD, behind A1/K17, exactly as C1's to_node is — whether the key is (user, uid) or user-only cannot be ruled while the :AppUser key itself is unsettled, and ruling it here would re-create the silent split fid-identity-and-scope §A1 exists to prevent. (iii) WHAT cross_host_collisions MEANS: NOT -two scripts- and NOT -deployed twice-. It is the AMBIGUITY SIGNAL — one file seen N times under shared storage, or N genuinely different files under local storage, undecidable without fstype (G56) or a content hash (absent BY CONTRACT in the metadata-only listings, premise 2). It is the review-queue feed, which is what it was built as. NAMING FOLLOW-UP, deliberately not ruled here: -collision- implies conflict while the counter measures repetition, so any rename rides G55/G23 rather than the gate. [superseded page text follows]"
      - "D3 [as drafted]: identity keys for the adjacent nodes are ruled in the same breath: ExecutionHost by fqdn (or nodeid where Control-M-known — reconcile with the P3 executionhost_nodeid constraint), AppUser by (user, uid) vs user-only. Evidence feed already live: the coverage counter for same-id-on-different-hosts (cross_host_collisions) was built as THIS gate's review item — rule what a collision MEANS (one logical script deployed twice vs two scripts sharing a name). [rule each]"
      - "D-AMENDMENT — SME DIRECTION 2026-08-06, recorded as direction. D1, D2 and D4 REMAIN UNTICKED; this constrains what they may say, it does not rule them. THE CAVEAT: a deployment path may be SHARED — the SME's case is roughly 20 VSI hosts against one shared filesystem — in which case the same path on N hosts is ONE FILE SEEN N TIMES, not N deployments. NOT DERIVABLE FROM ANY BUNDLE WE HOLD: the collector captures no mount table (no findmnt, no /proc/mounts, no df); the envelope carries scan_roots but never which filesystem a root sits on, and the ownership sweep's -xdev stays on one filesystem without recording which. WHY IT REACHES IDENTITY AND NOT ONLY SEMANTICS: path-keying merges same-path-across-hosts into one node, which is CORRECT under shared storage and AMBIGUOUS under local storage, where two hosts may hold genuinely different content at the same path — two artifacts sharing a path, which a merge would then report as drift. Content hash is the only discriminator and the metadata-only listings (premise 2) carry none, so with scope unknown AND no hash the case is undecidable from data. THE CONSEQUENCE THAT MATTERS: G2 drift detection and the G24 corroboration both assume occurrences are INDEPENDENT observations, and N views of one file are ONE observation — compare them and they always agree, manufacturing confidence rather than establishing it. So storage_scope UNKNOWN MUST NOT DEFAULT TO INDEPENDENT: it suppresses the corroboration claim and counts the node identity-unconfirmed-across-hosts, which is the review queue. CORRECTION TO THE SESSION'S OWN EARLIER READING: cross_host_collisions was recommended as a measure of DEPLOYMENT breadth; under shared storage it measures MOUNT breadth, a different fact. SHAPE THE AMENDMENT ADDS: occurrences carry mount_root + fstype + storage_scope (local | shared | unknown), and a storage-locus NODE is DEFERRED, not declined — minting it now would create an entity with no source, since no bundle carries a storage inventory; carrying mount_root from the start makes promoting it later cheap, and un-minting a node class is not."
      - "D-AMENDMENT COLLECTOR WORKAROUND — SME DIRECTION 2026-08-06: capture the mount table in the collector so the fact becomes DERIVED rather than declared. Refinements taken at the session: (1) lsblk CANNOT answer it — server:/path is an NFS mount spec and NFS is not a block device, so it never appears in lsblk; the mount table is the only source (findmnt -rn -o SOURCE,TARGET,FSTYPE,OPTIONS, with /proc/mounts as the no-findmnt fallback; both read-only, no privilege change to the collector's safety story). (2) /etc/fstab is configured INTENT, not actual state — autofs, systemd and manual mounts are mounted without appearing there, and stale lines appear without being mounted; capture actual state, fstab only if the intent/actual delta is wanted. (3) THE CORRECTION THAT CHANGES THE ANSWER: -on the SAN- does not mean shared. Twenty hosts each with their OWN LUN from one array is twenty separate filesystems and twenty files that genuinely drift; twenty hosts mounting ONE NFS export is one file seen twenty times. Sharing follows from FSTYPE (nfs/nfs4/cifs shared; xfs/ext4 on a LUN single-host unless gfs2/ocfs2 clustered), never from the array — so the type column the SME named is the load-bearing one and lsblk alone would actively mislead. (4) T14 CAVEAT WITHDRAWN on SME correction: nothing has been loaded yet and the company-side twin collector is NOT present, so a schema bump costs no convergence debt — this is the cheapest possible moment. Groomed as its own build item; NOT edited at the gate, because the collector runs on production hosts."
      - "D3 SME INPUT 2026-08-06 — answers the question the session asked; D3 ITSELF STAYS UNRULED. CM_HOSTS.NODEID IS THE REAL SERVER NAME. Consequences for the ruling still to be made: the rua envelope's captured host meets :ExecutionHost on `nodeid` DIRECTLY, so the deployed executionhost_nodeid UNIQUE constraint (P3) stands as the key and rua needs no second host identity; and the not-replicated CMS_MACHINE_MAP (NODEID -> HOSTNAME + DOMAIN_NAME) is NOT on the critical path after all — the join that looked blocked is available. What D3 must still rule: the SPELLING on each side (bare hostname vs fqdn, since the envelope stamps both rua_host and rua_fqdn), the AppUser half (blocked behind A1/K17), and what cross_host_collisions MEANS."
      - "D4 RULED 2026-08-06 — STUB, ruled here rather than deferred to the envelope gate. THE DECIDING ARGUMENT: deferring and ruling produce IDENTICAL LOAD BEHAVIOUR, because audit-fields.yaml's own rule is that loaders must not write envelope properties for stub sources. Ruling is therefore strictly better — same behaviour, and the REASON gets recorded instead of being re-derived at a later gate. THE REASON IS STANDING LAW ALREADY: meta.txt is a CAPTURE envelope, not an authorship one, and collected_at / collected_by fall under the CAPTURE_DATE rule signed at controlm-q1q3-phase1 — -replication time, never authorship-. The per-file candidates fail too. mtime is when the inode was last written ON THAT HOST, which a deployment cp resets, making it a DEPLOY timestamp — and E1 ruled this same session that presence is a deployment fact and nothing more, so mtime inherits exactly that limit. owner is an ACL fact and not the changer; it is C1's directory_owner input, never source_updated_by. Both stay PLAIN PROPERTIES, exactly as the Control-M entry keeps AUTHOR as -a plain property, not envelope-. THE AS-BUILT SPLIT IS CONFIRMED AS BUILT: 12 envelope keys stamped on every staged record, the full meta.txt retained un-stamped in coverage.meta — nothing is lost, and nothing unratified is stamped. APPLIED at this session as the exec-hosts:rua-bundle entry in config/audit-fields.yaml: documentary only (a stub writes nothing), and it matches the audit-envelope-phase4 precedent where four ruled stubs landed the same day as their gate. §J PRECONDITION FOUND AND RECORDED, verified against the guard rather than assumed: tests/unit/test_audit_fields.py::test_every_confirmed_source_has_an_entry requires every confirmed: true registry source to hold an audit-fields entry, and exec-hosts:rua-bundle, bitbucket:repo-objects-manifest, dpl:pipeline-registry and dpl:dataset-registry are ALL confirmed: false today. Flipping them at §J without entries FAILS THE SUITE. D4's authority covers