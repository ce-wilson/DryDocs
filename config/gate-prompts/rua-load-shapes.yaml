  - title: "G. GUID vs URN + the version axis (clause f)"
    confirmations:
      - "G1 RULED 2026-08-06 — BOTH, NOT EITHER: the drafted -URN segment vs keyed property- is a FALSE DICHOTOMY and is retired. The registry GUID sits as a KEYED PROPERTY — it IS the business key (ADR 0001: -node identity is always a business key, never a URL-, and that ADR seeds ontology terms carrying the IRI as a PROPERTY) — and the URN is a DETERMINISTIC RENDER that includes it. Identity does not live in the URN at all: source-registry v2 §D3, signed 2026-07-31, already ruled the URN -derived deterministically, a render, never a hand-maintained field-. THE SPLIT IS MANAGED-VS-UNMANAGED, not pipelines-vs-anything: MANAGED (registry-known) assets key on the GUID alone with version and zone as PROPERTIES, and render a GUID-bearing URN; UNMANAGED assets fall back to the grammar-built URN from path/name — urn:drydocs:script:{normalized-abs-path}, publishable per F1, and urn:drydocs:dataasset:{platform}:{namespace}:{name}. ALREADY THE CODE'S OWN ASSUMPTION, waiting on exactly this clause — dpl_mac.py: -identity = dataset GUID alone (version/zone are properties), pending the G22 clause-f GUID-vs-URN-. THE name#GUID COMPOSITE IS NEVER STORED AS A UNIT, ANYWHERE (SME question answered at the session): it is a promotion-clone FOLDER-NAMING convention on disk that parse_clone_folder DECOMPOSES into name + guid + kind, keeping the parts and discarding the whole; the folder CASING is the kind discriminator (lowercase pipeline, UPPERCASE dataset, mixed ambiguous — counted, never guessed). The direction also runs opposite to -folder naming follows the URN-: the folder name is one SOURCE of the GUID, and the URN is rendered FROM the GUID afterwards. THREE DIFFERENT #-BEARING STRINGS, recorded because conflating them is the live risk: <name>#<guid> is a folder locator on disk (not identity); proc#dpl:{GUID} is the LINEAGE STAGING node id (staging only, never the graph key); urn:drydocs:... is the rendered graph-side name. [superseded page text follows]"
