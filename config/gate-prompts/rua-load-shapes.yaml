      - "D4 [as drafted]: the meta.txt provenance envelope lands per the provenance-audit-fields plan (docs 06/06a): the per-source audit envelope shape, not ad-hoc properties — or defers to that plan's own gate if the SME prefers one envelope ruling for everything. AS-BUILT INPUT (2026-07-28): the extractor already stamps a fixed rua_* property set from the envelope on every staged record (see provenance) and keeps the rest in coverage un-stamped — confirm that split, reshape it, or fold it into the envelope plan. [rule / defer to the envelope gate]"
