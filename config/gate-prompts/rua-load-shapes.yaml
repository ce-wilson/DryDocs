      - "G2 RULED 2026-08-06 — CONFIRMED, AND THE NO-VERSION-NODES CLAUSE IS SCOPED TO SCRIPTS (SME). Confirmed as drafted for scripts: the content hash rides on source-occurrence records as the version discriminator, same URN + different hashes = drift and is queryable, and hash ABSENCE is a real state — metadata-only listing occurrences stage hash-absent with the absence counted, drift compares only among hash-BEARING occurrences, and a URN whose occurrences are all hash-absent is uncorroborable-yet, which is a coverage fact rather than an error. SCRIPTS GET NO VERSION NODES. WHY THE SCOPING WAS NECESSARY: left blanket, this clause would have SILENTLY OVERRIDDEN a codified ADR. ADR 0001's second LPG rule says -Versioned external objects are distinct nodes keyed by (object, versionId), linked WAS_DERIVED_FROM to the predecessor (prov:specializationOf). Never smuggle a version into a URL string — a string is not queryable.- THE DISTINCTION THAT RESOLVES IT: a content hash is a FINGERPRINT, not a source-assigned version. Nobody issues a versionId for a script, so hash-on-occurrence is right and no version node appears. DPL-managed pipelines and datasets DO carry an explicit version field from the registry (G25 stages pipelineId + version + active), so they ARE versioned external objects in the ADR's sense and continue to follow ADR 0001 rule 2 — untouched by this clause. TWO AMENDMENTS THE CLAUSE WAS DRAFTED WITHOUT: (1) ETL_ARTIFACT_SHA is a content hash arriving on the VARIABLE (A4, ruled the same day), so a DPL-managed artifact can be hash-BEARING even where the rua listing is hash-absent — a second corroboration route for exactly the metadata-only bundles premise 2 describes. (2) DRIFT COMPARISON MUST CHECK storage_scope FIRST (the D-amendment): N views of one shared file always agree, so comparing them reports corroboration that was never observed. The scope check is a PRECONDITION of drift detection, not a footnote to it. [superseded page text follows]"
      - "G2 [as drafted]: the CONTENT HASH rides on source-occurrence records as the VERSION discriminator — same URN + different hashes = drift, queryable (the G24 corroboration made concrete). HASH ABSENCE IS A REAL STATE, not an error: metadata-only listing occurrences (the scripts.csv fallback, premise 2) stage hash-absent with the absence counted; drift detection compares only among hash-bearing occurrences, and a URN whose occurrences are ALL hash-absent is simply uncorroborable-yet (a coverage fact). Versions do NOT become their own nodes unless ruled otherwise HERE. [confirm / rule version nodes]"
  - title: "H. The three-signal usage ruling (clause g)"
    confirmations:
      - "H1 CONFIRMED 2026-08-06, with three additions the clause was drafted without. CONFIRMS WHAT THE CODE WAS ALREADY WRITTEN AGAINST, the G1 shape a second time: dpl_registry.py's own docstring says the active flag is -a THIRD usage signal (beside referenced and present-on-server), staged only: any conflation with used is a G22 clause-(f)/(g) ruling, never decided here-. VERIFIED CLEAN AT THE RULING rather than assumed: NO used property exists anywhere in the codebase, so H1 confirms a state that already holds and requests no cleanup. (i) EACH AXIS IS THREE-VALUED, NOT TWO. The registry flag normalizes bool / ACTIVE / INACTIVE / Y / N to true or false, and ANY OTHER SPELLING STAYS EMPTY AND IS COUNTED (active_unknown). Under the house rule set at the D-amendment — unknown must not default to the convenient value — an empty flag reads as NEITHER active NOR inactive, and that constrains H2 directly. (ii) NO AXIS CAN PROVE ABSENCE; all three are POSITIVE-ONLY observations, each bounded by a DIFFERENT coverage limit. Referenced is bounded by BODY-COPY coverage (E3's named blind spot: the metadata-only listings of premise 2 carry no bodies, so script-to-script calls are structurally invisible). Present-on-server is bounded by SCAN_ROOTS — a script outside the scanned roots is absent-from-BUNDLE, never absent-from-server. Registry-active is bounded by WHICH SEALS WERE EXPORTED, and G25's own note makes the registry a BACKUP DISCOVERY SOURCE rather than a census, because the promotion clone's main may lag. So -absent on axis X- always means -not observed by feed X-, and never -does not exist-. (iii) WHY THAT MATTERS HERE AND NOT ONLY IN E3: it makes E3's flagged-never-auto-judged a STRUCTURAL property of the three axes rather than a cautious choice someone could later optimize away. [superseded page text follows]"
