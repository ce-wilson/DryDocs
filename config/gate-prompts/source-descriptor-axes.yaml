# SME gate-prompt spec — the registration descriptor's axes, and the home of the wiring
# fact (backlog CFG8 drafts; CFG9 runs it in the SAME sitting as registry-wiring-readiness).
# GATE-BOUND AND DECIDES NOTHING: drafting a page is not a ruling (the G27/W1/U11 precedent).
# config/source-descriptors.yaml, config/source-registry.yaml and their readers change ONLY
# when this page signs - and the `wired` BUILD item is minted from the signed record, never
# before it, because clauses B1, B2 and B5 of the wiring page decide its shape.
# A SEPARATE page on purpose: registry-wiring-readiness clause D3 refuses fold-ins ("any
# change to what an SME gate page itself looks like ... is a separate item - say so and it
# gets one"). Held in one sitting with it because they rule one subject.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
updated: 2026-09-09

id: source-descriptor-axes
title: "SME Gate — the five registration axes, the home and derivation of the wiring fact, and whether axis values ever reach the graph"
step: "config/source-descriptors.yaml (fcc3c8bb, 2026-09-09) gives every registry-home dataset five values on closed axes, each DERIVED from the registry, OVERRIDDEN per dataset, REFUSED when off its axis - a consumer reads a value and never interprets a comment. Its TDD left three SME questions open. Beside them sits the wiring page's question B (a second field?), which this page restates in the descriptor idiom so the SME rules the SHAPE once. Nothing changes before both pages sign."
summary: >
  Section A asks the SME to confirm the five axes as the closed set, or to name the sixth.
  Section B is the one that matters: WHERE the wiring fact lives (a registry field, or a
  sixth descriptor axis), HOW it is decided (declared per side with a written reason, or
  derived), with both homes stated at equal weight, the guard that forbids a field today
  named, and the precedent for a per-side registry fact cited. Section C asks whether axis
  values ever become graph properties and what the catalog tag `confirmed` means. Section D
  fences what this page does not ask.
meta:
  Module: "config (config/source-descriptors.yaml, config/source-registry.yaml and their schemas) plus drydocs_core/source_descriptors.py; no ontology or graph surface is touched"
  Source: "config/source-descriptors.yaml (5 axes, 2 overrides, 10 synthetic datasets) · config/source-registry.yaml (19 systems / 30 datasets, 21 confirmed / 9 not, counted by command at 9da9d617) · docs/design/source-registration-tdd.md Rev 3 §HITL gate · config/gate-prompts/registry-wiring-readiness.yaml (clauses B1-B5, C1-C4) · PORT-MANIFEST.yaml (the source-registry per-entry row, the descriptor per-entry row, the per_side_fields block) · tests/unit/test_load_map_wiring_key.py (test_the_key_reports_and_never_rules)"
  Precedent: "source-registry-v2 D2 (SIGNED 2026-07-31) — the per-side loader-to-source overlay, per-repo config wins · O90 (done 2026-08-31) — the confirmed-by-loaders cross rendered as a pure function with NO new field · ADR 0017 (ACCEPTED 2026-08-30) — the WHAT crosses, the WHERE never does · J71 (2026-09-01) — `confirmed` and its stamps are SIDE-ruled fields on the registry row · G27/W1/U11 — a drafted prompt decides nothing"
  Registry ref: "no axis value and no row changes at this gate; the descriptor's MECHANISM (derive, override, refuse) is what is on the table, and the wiring fact's HOME"
  Classification: "Internal-Public — mechanism only. Axis vocabulary, derivation rules and field names; no connection coordinate, no company row, no value"
  Vocabulary: "no relationship vocabulary is involved - the descriptor is layer 1 (taxonomy) by its own TDD; section C asks whether that stays true"
  Source of record: "backlog CFG8 (draft) and CFG9 (run) · config/gate-log.md (transcription target) · registry-wiring-readiness (the sibling page, same sitting)"

mapping:
  - n: 1
    element: "A registry-home dataset"
    target: "five values: acquisition, format, authority, layer, access - each on a closed list"
    edge: "section A: are these the right five; derive -> override -> refuse is the mechanism, not a proposal"
  - n: 2
    element: "The wiring fact - is the pipeline that reads this row BUILT on this side"
    target: "TODAY: a YAML comment beside `confirmed: false` on 4 of 9 held rows, and a derived cross on the load map (O90); NEVER a field"
    edge: "section B: a registry field or a sixth axis; declared or derived; per side in either home"
  - n: 3
    element: "The same fact, viewed from the port"
    target: "per side and never crossing, in whichever home - a per_side_fields entry names it"
    edge: "section B5: per-entry is NOT per-side, so the home alone does not settle the disposition"
  - n: 4
    element: "The five axis values, viewed from the graph and the catalog"
    target: "not node properties today; published as catalog custom properties and tags by the DataHub emission"
    edge: "section C: taxonomy that stays off the graph, or an ontology question routed to its gate"

