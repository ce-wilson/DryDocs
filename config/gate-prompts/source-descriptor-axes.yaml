sections:
  - title: "A. The five axes - confirm the closed set, or name the sixth"
    confirmations:
      - "A1. THE FIVE ARE THE RIGHT FIVE. acquisition (manual | automated), format (csv | ascii | json | archive | db), authority (primary | replica), layer (human | business | data | technology), access (fid | human | repo). Each is implied by a registry field today and each changes what an operator does. Confirm the set, or name what is missing - the TDD's own economics line: cheap now, expensive once values are tagged in a catalog."
      - "A2. THE MECHANISM IS THE PROPOSAL, NOT THE VALUES. Derive from the registry row, override per dataset, refuse a value off its axis - and validate the override table at construction so a config that disagrees with the registry fails immediately. Confirm that this discipline is what a 'declared, never inferred' fact means in this repo, so section B can ask where the wiring fact lives without re-arguing how it is decided."
      - "A3. A DIFFERENT CUT OF `access` IS A REASONABLE DISAGREEMENT. Today it names the credential CLASS that reads a dataset (functional id, a person, the checkout itself) and never a credential. The wiring page's N24 rider asks about the access PATH and the principal behind it; if the SME reads those as one axis, say so here, so N24 widens this one rather than minting a second vocabulary for one fact."
  - title: "B. The wiring fact - its home and its derivation, both options at equal weight"
    confirmations:
      - "B1. HOME (i): A FIELD ON THE REGISTRY ROW, `wired: true | false`. The row is per-entry (J68/J71) and `confirmed` beside it is already side-ruled, so a field is the SMALLER conceptual change - one file says what the row is and whether this side reads it. Costs: a schema change in config/schemas/source-registry.schema.json and a 30-row migration (B5 of the wiring page decides required-vs-optional); a per_side_fields entry naming `wired` and its reason; and the retirement, BY THIS RULING, of test_the_key_reports_and_never_rules, which forbids exactly this field until the gate signs."
      - "B2. HOME (ii): A SIXTH DESCRIPTOR AXIS IN config/source-descriptors.yaml. The registry stays the WHAT, the descriptor says how the dataset is REGISTERED here - and a declared-per-side value is registration state. Costs: the same per_side_fields entry (per-entry is not per-side - provenance above); a reader change in drydocs_core/source_descriptors.py; and the load-map cross and the DataHub emission then read the axis rather than the comment. Neither home is pre-picked; rule one."
      - "B3. DECLARED, WITH A WRITTEN REASON WHEN FALSE (proposed default). In either home the value is DECLARED per side and a false carries a reason of at least forty characters, refused otherwise - the SOURCELESS_LOADERS idiom, and the wiring page's B4. A bare false is a fact; a false with a reason is a decision someone can re-read and reverse."
      - "B4. DERIVED IS OFFERED ONLY BEHIND A SEAM, AND SAID SO. 'Wired = an adapter is set AND a loader is registered for the id' is computable - O90 computes it - but NOT in drydocs_core: loader registration and SOURCELESS_LOADERS live in the load component (drydocs/cli_shared.py), and core imports nothing from any component. A derived value therefore lives in the load component or behind a core seam the load component fills. Rule declared (B3) or derived-behind-a-seam; do not rule derived-in-core, which cannot be built."
      - "B5. THE SINGLE-FIELD ALTERNATIVE, STATED WITH ITS EVIDENCE. The wiring page's B1 offers keeping one flag plus a required hold_reason. O90's cross is the shipped evidence that the fact can be RENDERED without a field. What a field adds over the cross is a queryable, portable, testable value with a reason - and the port outcome named in provenance: semantics travel again, wiring stays per side. Confirm that outcome is wanted; if the cross suffices, say so and only the wiring page's clause C remains."
  - title: "C. Axis values, the graph, and the catalog tag"
    confirmations:
      - "C1. DO AXIS VALUES EVER BECOME NODE PROPERTIES? They are taxonomy, so they could. Nothing writes them today. A yes here is an ONTOLOGY decision and is routed to the ontology gate in the normal way - this page records the intent, never the edge."
      - "C2. WHAT THE CATALOG TAG `confirmed` MEANS. The DataHub emission publishes `confirmed` and `derived` as custom properties beside the five axes today - the overloaded flag, exported before its meaning was split. Rule what a catalog reader should read `confirmed` as once section B signs (semantic only, with wiring beside it as its own tag), so the emitted property is not ambiguous for every already-tagged asset."
  - title: "D. Fence - what this page does NOT ask"
    confirmations:
      - "D1. NOT ASKED: whether a catalog product is adopted. config/gate-prompts/snowflake-data-catalog.yaml is that page, DEFERRED 2026-09-07 to the Logical Container trigger; ADR 0017 rules the BINDING substrate and leaves the catalog open. Nothing here reopens either."
      - "D2. NOT RULED: `xlsx` joining the format axis. A classification change (layer 1, the TDD's own rule) that CFG10 makes after this page signs; named in provenance for information."
      - "D3. NOTHING IS APPLIED BY DRAFTING. The `wired` build item is minted FROM the signed record with the signed name, home, polarity and required-versus-optional - never before, because the wiring page's B1, B2 and B5 decide its shape. Both pages are canonical-company at the port; the company's copies win, and the ruling reaches it as a relay line."
