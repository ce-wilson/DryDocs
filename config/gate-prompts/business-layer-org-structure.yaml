# SME gate-prompt spec — the business-layer org structure (backlog C28). GATE-BOUND
# AND DECIDES NOTHING: drafting a prompt is not an ontology change (the
# G27/W1/U11/N10 precedent). Every term this page proposes sits at
# `status: planned` in the relationship vocabulary and `status: proposed` in the
# taxonomy-ontology map; no loader writes an edge, nothing flips, and the
# SIGN-OFF is a separate SME session.
#
# OVERTAKEN PREMISES, recorded per the Q9/Q14 idiom rather than papered over:
# C28 was groomed 2026-08-09; gate `corporate-backbone-vocabulary` (G98) then
# SIGNED 19/19 on 2026-08-17 and settled part of this page's original ground —
# `:Company` registered org:FormalOrganization (§A1), the 2Q2024 segment reorg
# expressed as TWO effective-dated edge types (§B1, with its recorded §B2 cost),
# and the `corporate` domain minted (§B3). NOTHING here re-opens a signed
# clause (L25 riders-not-edits): §B below asks whether a ChangeEvent node adds
# value ON TOP of the signed shape, never whether the signed shape was right.
#
# EVIDENCE BASE is public-source only (annual-report material + one public
# profile page), applied by hand in
# internal/context-graph-analysis/business-layer-location-experiment.md
# (2026-08-08) — which is why this page stays Internal-Public. One evidence
# correction made at drafting: the experiment cites the "2026 edition" of the
# annual report; that file is a byte-identical mislabeled copy of the 2024
# edition (sha256-verified 2026-08-25), so citations below say 2024, with the
# 2025 edition as corroboration where checked.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: business-layer-org-structure
title: "SME Gate — the business-layer org structure: what class a segment is, whether a re-org is a node, and one dating idiom instead of two"
step: "The business-layer experiment (2026-08-08) proved the W3C ORG ontology produces a coherent org view from public sources alone — org units, an effective-dated reorg, a legal-entity split the prose blurs. G98 then signed the corporate backbone (Company, two dated segment edges). This page puts the four questions that remain OPEN after both: the segment's ORG class, reifying the reorg event, converging on one as-of idiom, and the legal-entity layer. Location is explicitly out of scope — it rides Z2."
summary: >
  Section A puts the class question G98 did not ask: :BusinessSegment is
  registered org:FormalOrganization — the same class as :Company — but the
  source's own words ("managed on an LOB basis") describe management units of
  one legal firm, which is org:OrganizationalUnit, the class :DevTeam,
  :ServiceNowGroup, :CatalogLOB and :CatalogSubLOB already carry. Section B asks
  whether the 2Q2024 segment merge, already carried by G98's two dated edge
  types, should ALSO be reified as an org:ChangeEvent node — with the
  one-fact-three-encodings cost stated against it in G98's own §B2 terms.
  Section C converges the repo's two effective-dating idioms (K17's
  as-of-assertion for FID ownership; G98's effective_from/effective_to edge
  dating) into one ruled choice for org membership. Section D rules the
  legal-entity layer the experiment surfaced (the Firm is not the bank;
  eight subsidiaries at country grain) and adopts the claim-vs-site rule —
  an aggregate presence claim is never exploded into structure. Section E
  fences scope.

