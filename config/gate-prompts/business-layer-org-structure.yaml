sections:
  - title: "A. The segment's ORG class — unit of the Firm, or a second legal organization"
    confirmations:
      - "A1. THE QUESTION G98 DID NOT ASK: :BusinessSegment is registered `org:FormalOrganization` (10-node-classifications.yaml — adopted as 'the more precise valid term' over a doc/supplement disagreement, BEFORE the business-layer experiment ran). That makes a reportable segment the same class as :Company itself. The source's own words cut the other way: 'the Firm is managed on an LOB basis' (2024 annual report p104) describes CCB/CIB/AWM/Corporate as MANAGEMENT UNITS of one legal firm — org:OrganizationalUnit, 'an organization such as a department or support unit which is part of some larger FormalOrganization'. Segments are not separately incorporated; they are how the Firm reports. PROPOSED: :BusinessSegment re-classes to org:OrganizationalUnit. Confirm or keep FormalOrganization, and record the reason either way."
      - "A2. THE CONSISTENCY ARGUMENT, laid out rather than implied: org:OrganizationalUnit is already the registered class for :DevTeam, :ServiceNowGroup, :CatalogLOB and :CatalogSubLOB — every 'unit that holds people/work inside the Firm' the repo models. Ruling A1 for OrganizationalUnit makes the whole internal hierarchy one class family with :Company as the single FormalOrganization anchor; ruling it for FormalOrganization leaves segments class-identical to the legal firm while their own sub-tiers (CatalogLOB downward) are units. Neither is wrong in isolation — confirm WHICH reading the repo standardizes on."
      - "A3. NO NEW LABEL EITHER WAY (the CLAUDE.md §1 warning, both edges of it): the experiment confirms the annual report's org units ARE the LOB layer the repo already holds — the label set (:Company, :BusinessSegment, :CatalogLOB, ...) does not grow from this section. A1 is a CLASS annotation question, not a label question. Confirm that no org-unit label is minted."
      - "A4. IF A1 RE-CLASSES: the change is a one-line class edit plus the schema-graph re-render, and prov_type Agent is UNCHANGED (an OrganizationalUnit is still a PROV agent). The edge-level prov_maps_to on the two G98 segment edges stays null per that gate's own recorded reasoning (org:hasUnit carries no effective-dating; the m3_belongs_to_application decline-a-weak-mapping precedent). Confirm the blast radius reading."

  - title: "B. The reorg as a node — reify org:ChangeEvent, or decline the third encoding"
    confirmations:
      - "B1. WHAT IS ALREADY SIGNED AND NOT RE-OPENED: G98 §B1 carries the 2Q2024 reorg as TWO effective-dated edge types (HAS_BUSINESS_SEGMENT open-ended, HAS_BUSINESS_SEGMENT_HISTORICAL closed at 2024-03-31), and §B2 records the cost — currency encoded twice, guarded by a graph-test. The reorg is ALREADY additive: nothing was rewritten when CIB absorbed CB. This section asks a strictly NEW question on top."
      - "B2. THE PROPOSAL: reify the merge itself as an :OrgChangeEvent node (class org:ChangeEvent, PROV alignment prov:Activity) with ORIGINAL_ORGANIZATION edges to the former CIB and CB segments and a RESULTING_ORGANIZATION edge to the merged CIB, effective 2024-04-01. What reification buys: the EVENT becomes addressable — 'what happened in 2Q2024' is a node with a date, not an inference over two edge families' date fields; future re-orgs accumulate as history the same way. What it costs, in G98 §B2's own terms: the same fact would then live in THREE encodings (two edge types, their date fields, and the event node), and every new encoding is a new way for the graph to disagree with itself. Rule adopt or decline — and if declined, record that a future re-org richer than a two-into-one merge (a split, a transfer) is the named re-arm trigger, since dated edges express those poorly."
      - "B3. THE WORKED EXAMPLE IS ALSO A VOCABULARY FACT: the same 2Q2024 event renamed the CIB acronym's expansion (Corporate & Investment Bank -> Commercial & Investment Bank; the glossary's CIB sense carries the 2025 report's spelling). If B2 adopts, the ChangeEvent node is the natural anchor for that does_not_mean/alt_label history; if B2 declines, the glossary carries it alone. Confirm which surface owns the rename story."

  - title: "C. One effective-dating idiom — as-of assertion or dated edges, ruled once"
    confirmations:
      - "C1. THE REPO NOW HAS TWO DATING IDIOMS AND NO RULE FOR WHICH APPLIES WHEN: (1) the K17 as-of-assertion (fid-identity-and-scope, SIGNED 33/33): ownership is an AS-OF fact — the assertion carries the date it was true, and a later assertion supersedes without deleting; (2) the G98 dated-edge shape: effective_from/effective_to properties, currency also encoded in the type name. Both are signed; neither names its scope. PROPOSED RULE: as-of assertion for facts SOURCED FROM A DATED CAPTURE (a report edition, an extract run — the fact is 'true as of the source's date'); dated edges for STRUCTURAL currency the graph itself must answer ('which segments exist NOW'). Confirm the rule or re-draw the line — what this section must not end with is a third idiom."
      - "C2. ORG MEMBERSHIP SPECIFICALLY: person/team membership in org units already rides :Membership (org:Membership, the K4/G70 machinery) — this section adds NO membership edge. What it rules is only the DATING SHAPE a future org-membership loader uses, per C1's rule. Confirm that reading, so the section cannot be misread as a new membership model."
      - "C3. THE SOURCE-GRAIN COROLLARY, adopted as a standing rule for this corpus: an annual-report fact is true AS OF the edition's fiscal year and never fresher; a loader that writes org facts from jpmc-reports stamps the edition it read (the doc-source-registry captured_at discipline). The experiment found the registry's captured_at (2026-06-30, 2024 edition) already lags the newest local edition — the stamp is what makes that visible instead of silent. Confirm."

  - title: "D. The legal-entity layer, and the claim-vs-site rule"
    confirmations:
      - "D1. THE FIRM IS NOT THE BANK, and the prose blurs what the ontology forces apart: the annual report names the national bank subsidiary ('headquartered in Columbus') as a distinct legal entity under the Firm; the public profile adds eight subsidiaries at country grain, one carrying a lifecycle state (inactive). Today the repo has ONE :Company node and no sub-organization shape at all. PROPOSED: corporate_has_sub_organization (HAS_SUB_ORGANIZATION, Company -> Company, org:hasSubOrganization) registered planned — the RESERVATION deliberately reuses :Company for both endpoints, and WHETHER a distinct :LegalEntity label is warranted is this clause's question, with the C26 lesson applied (reserving a label the ruling then rejects guards nothing; the label question is asked FIRST, the reservation follows the answer)."
      - "D2. LIFECYCLE IS A PROPERTY, NEVER A DELETION: the inactive subsidiary stays a node with a status — the same audit-kept discipline as retired: true on :BusinessSegment (G98 §B4 named that property's modelling as separate work; this clause inherits, not re-rules, it). Confirm."
      - "D3. THE CLAIM-VS-SITE RULE, adopted as a standing load rule for this corpus: an enumerable site ('regional headquarters in London') is structure; an aggregate presence claim ('177 locations in the U.S.', '100+ markets') is a MEASUREMENT about the org and is never exploded into fake site nodes — the business-layer twin of the load-map's 'unmatched is reported, not dropped'. Any future jpmc-reports loader carries this rule in its spec. Confirm the rule here so the Z2 location gate inherits it settled."

  - title: "E. Scope fence"
    confirmations:
      - "E1. LOCATION IS OUT — every site, address, and geography-grain question rides the Z2 gate (the experiment's grain findings are Z2 evidence, not this page's). This page rules org STRUCTURE only."
      - "E2. THE CORPUS RESHAPE IS OUT — whether jpmc-reports moves onto the lexical Document->Chunk backbone (making real GraphRAG possible) is the registry's named P4+ decision with its own trail (Idea-49, the empty-venue finding). Nothing here depends on it: this page's evidence is the hand-applied experiment, not a graph query."
      - "E3. FLIPS ARE FOLLOW-UPS: signing this page authorizes; it performs nothing. Every planned/proposed registration stays exactly there until a groomed build item flips it with a loader behind it."
