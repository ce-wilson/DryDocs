# GATE idea-series-grammar — DRAFTED 2026-09-04. A RIDER to
# ontology-domain-registry-and-edition-grain (SIGNED 2026-09-02, 14/14), on the C40 shape:
# the signed gate ruled the ITEM id grammar and retired both partition rules; it never
# ruled the Idea series (the words Idea, IDEAS.md and inbox appear in neither the prompt
# nor the record — review 2f9ebfc7 G2). PLAN2 found the gap and named it as an open
# question in its own acceptance; a build item is the wrong venue for a grammar ruling,
# so the question comes here and PLAN2 (b) implements what signs.
# UPDATED 2026-09-05 before the SME session: DOC1 landed (B2's contingency removed);
# C1 names the venue file so "undeclared" cannot be read as the producer; the company's
# 2026-09-05 renumber pass (Idea-10022..10033, by report) is recorded as the exact shape
# C1 sanctions and as the proof that a dated retirement was the wrong instrument (G3).
# UNSIGNED. Nothing changes in the allocator until this signs. Mechanism only: the
# company's ids are cited by number as reported, never with their bodies.
classification: Internal-Public
