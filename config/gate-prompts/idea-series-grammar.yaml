sections:
  - title: A. What is settled, and what this rider may not touch
    confirmations:
      - "A1. THE ITEM GRAMMAR IS NOT REOPENED. `[<EDITION>-]<MODULE><n>` stands as signed (C1); the 27 letters stay frozen; both partition rules stay retired forward-only (C4); no id of any kind moves. This rider adds the Idea series to a ruling that was silent on it and nothing else."
      - "A2. THE COMPANY'S IDEAS ARE THEIRS. Company ideas never cross (port-prompt.md); the producer cites Idea-10012, 10015..10017 and 10021 by number as reported and holds no body. Nothing here classifies, moves or renumbers a company id; the company applies the signed clause through its own gate, as with every ruling. The company's own 2026-09-05 renumber pass (10006..10017 -> 10022..10033, 10018..10021 kept) is theirs and is not re-ruled here; the producer's one constraint on it is in the port ledger, ELEVENTH POSTSCRIPT."

  - title: B. The grammar
    confirmations:
      - "B1. THE IDEA SERIES TAKES THE SAME SEGMENT AS AN ITEM: `[<EDITION>-]Idea-<n>`, edition first, base edition unprefixed. `Idea-255` is producer main; `<code>-Idea-1` is that edition's first idea. One grammar, two id kinds (`<MODULE><n>` and `Idea-<n>`), one segment rule — PLAN2's recommendation, taken because the alternative (band-numbered Idea as a written exception) is one grammar with two shapes and a standing tax at every id-shape site. Every existing Idea id parses unchanged."
      - "B2. THE INBOX IS INSTANCE-OWNED, which is what gives the segment a meaning. An edition's inbox is its own capture surface — DOC1 (done, 5803d091) amended ADR 0015 D2 to say so, and PLAN2 (b) cites that amendment; the cross-estate view is a query over the ideas, never a sort over their ids."

  - title: C. The carve-out — a capture surface never refuses a capture
    confirmations:
      - "C1. A VENUE WITH NO DECLARED `edition:` MAY STILL MINT AN IDEA. UNDECLARED MEANS: config/dev-environment.yaml (PLAN2's venue file, canonical-company) carries no `edition:` key. The producer is NOT undeclared — it declares `base` and mints unprefixed `Idea-<n>` at or below 9999 as it always has; a venue that declares a code mints `<code>-Idea-<n>`. PLAN2's venue rule (mint nothing, name the key) applies to ITEM ids only. For an Idea, an undeclared venue mints band-shaped — `Idea-<n>`, n above 9999 — until it declares its code, and the id it gets is stable from then on (never re-prefixed when the code arrives). The company's 10022..10033 of 2026-09-05 is exactly this shape, minted before this clause signed, and is read as legitimate under it. The refusal that names CFG2 fires for item ids alone. Reason: between PLAN2 porting and the company's own edition gate the company has NO other channel (every item route is refused: DD reserved, letters frozen, ceiling), and that window is real — CFG2 (c) bars the producer from naming their code, so their gate must run first. Refusing a capture loses the thought; refusing an item mint only delays work."
      - "C2. ONE BRANCH, NOT TWO RULES (G3). 'A declared venue mints prefixed; an undeclared venue mints band-shaped' is a single branch in `next_idea_id()`. The band on the Idea path is therefore ADDED here as the undeclared-venue shape — it was never enforced in code for ideas — and it ends per venue on the day that venue declares its code, not by a retirement date."

  - title: D. The mechanism the ruling buys
    confirmations:
      - "D1. THE IDEA BRANCH GOES THROUGH `next_idea_id()` AND GETS THE THREE RULES IT SKIPS TODAY: max+1 across local, every remote ref and history (never the lowest gap — a gap is a burned id), the floor, and the venue check of C1. The short-circuit at validate.py:360-364 retires; `_IDEA_RE` / `_IDEA_IN_DIFF_RE` and the guard's `_HEADER` learn the optional segment (the seven Idea-shape sites, G5). `--next-id Idea` returns the same number before and after on the producer, which is the acceptance's proof. PLAN4 (d)'s `--mint-pending` allocates N consecutive ids through the SAME `next_idea_id()` — one allocator, one pass, no second code path."
      - "D2. THE BAND GUARD ON THE PRODUCER'S INBOX STAYS AS IS (test_plan_ideas.py:153-171, PORTED_COMPANY_IDS hand-maintained): a five-digit Idea in the producer file is still a company entry that landed here and gets looked at once. It is a guard over one file, never the allocator's rule."

  - title: E. Fence
    confirmations:
      - "E1. NOT RULED HERE: the sharded inbox (ADR 0019, the intake review's pass 2 — its own decision, and it does not land while a port range containing IDEAS.md is mid-apply); the idea-to-item join fields; dedupe. This rider decides the id's SHAPE and who may mint one, nothing about the file the id lives in. Also not ruled here: what a session may do to an entry ANOTHER venue owns — that is PLAN4 (additive and stamped, the state token the owner's), a working agreement rather than a grammar, and it needs no gate."
