id: idea-series-grammar
title: >-
  SME Gate (rider) — the Idea series takes the same edition segment as an item id, and a
  venue with no declared edition may still capture an idea: the carve-out that keeps the
  company's last open channel open between PLAN2 porting and its own edition gate
step: >-
  Rider drafted 2026-09-04 from the intake review (docs/reviews/ideas-to-backlog-intake-
  review-2026-09-03.md, G1 blocking, G2 blocking, G3, G5), after the signed record
  "ontology-domain-registry-and-edition-grain" (config/gate-log.md, 2026-09-02) settled
  `[<EDITION>-]<MODULE><n>` for items. Blocks PLAN2 clause (b) only; CFG1, CFG2 and DOC1
  are unaffected and proceed.
summary: >-
  (a) THE GAP. The allocator treats `Idea` as its own case (validate.py IDEA_SERIES): the
  `--next-id Idea` path reads the inbox headers and mints `Idea-<highest+1>` without ever
  calling next_id(), so none of the three refusals that shut every company ITEM route
  (DD reserved, 27 letters frozen, the 9999 ceiling) touches it. That is how Idea-10012
  came to exist company-side, and it is also the ONLY channel the company has left: every
  sanctioned item mint is refused there. (b) THE GRAMMAR QUESTION. Signed C1 rules
  `[<EDITION>-]<MODULE><n>` for items. Either the Idea series takes the same segment
  (`<EDITION>-Idea-<n>`, base edition unprefixed — one grammar, two id kinds) or it stays
  band-numbered as a written exception (one grammar with two shapes, a standing tax).
  PLAN2 recommends the first; this rider asks the SME to rule it. (c) THE CARVE-OUT, which
  is the part that matters more than the grammar. PLAN2's venue rule — "a venue whose file
  declares no `edition:` mints nothing and the refusal names the key to set" — applied
  uniformly to Idea would leave the company with NO channel at all between PLAN2 porting
  and its own edition gate, and that window is not short: CFG2 (c) bars the producer from
  naming the company's code, so the company must run its own gate first. The inbox is a
  capture surface, not a commitment surface; refusing a capture loses the thought, refusing
  an item mint only delays work. (d) THE MECHANISM the ruling buys: the Idea branch routes
  through a `next_idea_id()` that finally applies the three rules it skips today (max+1,
  never the lowest gap; the floor; the venue check), so "Idea-10017 is the last band idea"
  becomes a mechanism instead of a claim about timing (G3) — and the claim has already
  failed as a claim: the company minted Idea-10022 by allocator on 2026-09-04 and
  renumbered twelve colliding branch ideas to 10022..10033 on 2026-09-05, all band-shaped,
  all legitimate captures. A rule that ends per venue (C2) survives that; a date does not.
  (e) NOTHING RENUMBERS. Every
  existing Idea id parses unchanged; the segment is optional and the base has none.

