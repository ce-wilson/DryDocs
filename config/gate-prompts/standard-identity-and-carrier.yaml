  Source: "drydocs_core/orchestration/controlm/description_tokens.py (TOKEN_REGISTRY docstring + the §7.5 sentinel contract + the C16 unknown-keys rule) · knowledge/standards/technology/controlm-guidelines-and-standards.md §7.5 · user direction 2026-08-12 (Idea-114 clause 2, transcribed in IDEAS.md) · config/launcher-registry.yaml (the G26 precedent header) · ADR 0009 rules 1/2/5 · ADR 0014's per-machine-vs-domain line (accepted 2026-08-25)"
  Precedent: "G27/W1/N10/G61 — a drafted prompt decides nothing · G26 launcher-registry — code-as-data moved to schema-pinned, test-guarded config, 'adding a rule is a config edit plus a test run' · ADR 0009 rule 5 — propose in the DB, land in git · the alias episode (2026-08-25) — company-local values in a canonical-producer config file are overwritten wholesale at port · G84(c)/§7.5 — the DD digit is a grammar VERSION · C16 — a bare team-local key is legal, preserved verbatim, never load-bearing · G16 — aliases suggest, values decide"
  Registry ref: "no source-registry or doc-source-registry flag moves; the standards themselves are knowledge/standards/ documents and the estate evidence arrives through surfaces already registered"
