# SME gate-prompt spec — standard IDENTITY and its carrier (backlog G95).
# GATE-BOUND AND DECIDES NOTHING: drafting a prompt is not a contract change
# (the G27/W1/N10/G61 precedent). Nothing is written to the graph, no config
# family is created, and TOKEN_REGISTRY is not touched until the SME signs.
#
# WHAT THIS PAGE PROPOSES, STATED UP FRONT BECAUSE IT IS UNUSUAL: no vocabulary
# term, no node class, no property term — identity and carrier are CONFIG-layer
# questions about a registry/profile store, not ontology bindings. There is
# therefore nothing to register `planned`; the pre-gate record is this file
# plus its gate-log stub, and saying so explicitly beats a map row minted into
# the wrong layer to satisfy the letter of a rule (the stretching-a-wrong-label
# failure CLAUDE.md §1 names).
#
# THE USER DIRECTION THIS PUTS TO THE GATE (2026-08-12, Idea-114 clause 2):
# a config table (SQLite was floated) keyed by a standard id, holding a
# validation profile BY TEAM, platform/product hierarchy later. The direction
# is honored by being ASKED WITH ITS COSTS VISIBLE, not by being pre-adopted —
# two ADRs accepted since the direction was given (0009's rule 1 standing;
# 0014's per-machine-vs-domain line, 2026-08-25) bear directly on the carrier
# and are laid out in §B.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: standard-identity-and-carrier
title: "SME Gate — standard identity and its carrier: a stable id for a validation standard, where per-team profiles live, and the fence that keeps the DD digit out of it"
step: "G84 built adoption measurement and G94 will build the selector (TASKTYPE + JOB_ROLE + launcher classification -> a standard identity plus its token set) — but 'a standard identity' does not exist yet: today the per-job-type sets are code-as-data in TOKEN_REGISTRY, whose own docstring calls itself the single source both the parser and the published register read from. Giving a standard an id outside that module is a CONTRACT CHANGE, and storing per-team profiles is a governance surface. Four questions, evidence attached, nothing pre-picked."
summary: >
  Section A rules identity: whether a standard gets a stable id at all, its
  shape, and — said plainly — that an id outside TOKEN_REGISTRY changes what
  the registry-vs-standard agreement test guards, from a two-way code-vs-
  document check into a three-way one. Section B lays the carriers side by
  side without pre-picking: versioned YAML under config/ on the
  launcher-registry precedent, SQLite as primary (which collides with ADR
  0009 rule 1 and must be ruled as an exception or rejected on it), and
  0009's own hybrid — YAML source of truth with mapping.db as the derived
  read model, which is the shape the floated 'config table' can have without
  breaching anything. The port cost is stated from this week's live lesson:
  real team data in a canonical-producer file evaporates at the next port.
  Section C ratifies the §7.5/G84 fence explicitly — the DD digit is a
  grammar version and must never select a standard — because a per-team
  registry is exactly the pressure that would break it. Section D rules the
  divergence policy: adding a team-local token is the C16 case the parser
  already preserves; RELAXING a company-required token is a governance
  decision, and the page asks whether it is permitted at all and who
  ratifies it. Section E fences scope.

meta:
