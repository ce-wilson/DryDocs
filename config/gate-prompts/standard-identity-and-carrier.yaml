sections:
  - title: "A. Identity — does a standard get a stable id, and what does that do to the contract"
    confirmations:
      - "A1. DOES A STANDARD GET AN ID AT ALL? Today 'the FileWatcher standard' has no name a row can reference — required_tokens(JobType) IS the standard, anonymously. G94's selector must return 'a STANDARD IDENTITY plus the token set that identity requires', so something must be referenceable. The alternative to minting ids — the selector returns only token sets and identity stays implicit in code — is laid out for explicit rejection: it makes per-team profiles unaddressable (a profile must say WHICH standard it profiles) and adoption reporting unattributable. Confirm that standards get stable ids."
      - "A2. THE SHAPE: proposed `<domain>.<subject>.v<N>` (controlm.filewatcher.v1, controlm.engine-dpl.v1, controlm.generic.v1) — dot-separated like the registry's dataset grammar, versioned like the supplements, with v-bumps for CONTENT changes to a standard (a required token added or removed) and NOT for grammar-version changes (that is the DD digit's job and §C's fence). The id is OPAQUE to selection: G94 selects on TASKTYPE + JOB_ROLE + launcher classification and RETURNS an id, never parses one. Rule the shape, or amend it — what must survive any amendment is versioning-by-content and opacity-to-selection."
      - "A3. THE CONTRACT CHANGE, SAID PLAINLY (the acceptance requires this): TOKEN_REGISTRY's docstring claims it is 'the single source both the parser and the published register read from, so code and document cannot drift', guarded by the registry-vs-standard agreement test. An id living OUTSIDE that module means the agreement test stops guarding a two-way fact (code == document) and must start guarding a THREE-way one (code == document == carrier): every standard id the carrier names must resolve to a token set derivable from TOKEN_REGISTRY, and every TOKEN_REGISTRY job-type set must be reachable from some standard id — both directions, the D3 endpoint-guard lesson. Confirm that the agreement test's new obligation is part of this ruling, so the build inherits it as a requirement rather than discovering it."
      - "A4. WHAT AN ID IS NOT: not a graph node (no :Standard label is proposed — if the graph ever needs one, that is an ontology gate with its own page), not a selector input (§C), and not a team property (a team HOLDS a profile AGAINST a standard id; the id itself is company-level). Confirm the three negatives so the id cannot scope-creep at build time."

  - title: "B. The carrier — laid side by side, costs at review time and at port time, nothing pre-picked"
    confirmations:
      - "B1. CANDIDATE 1 — VERSIONED YAML UNDER config/ (the launcher-registry precedent): schema-pinned (drydocs.standards-registry.v1), test-guarded, teams add profile rows without a code change — the exact move G26 already made once, whose header says adding a rule became 'a config edit plus a test run'. Review cost: a profile change is a YAML diff a gate session can read (ADR 0009's own argument — 'a row-level DB delta is not something a domain expert signs off on; a YAML hunk is'). Port cost: see B4, which is REAL and stated. Rule for or against."
      - "B2. CANDIDATE 2 — SQLITE AS PRIMARY (the floated table): real constraints, concurrent edits, natural UI backing. STATED COLLISION, not implied: ADR 0009 rule 1 says git text is the source of truth PERMANENTLY and 'this is not a stepping stone to a database'; ADR 0014's accepted line says a value an SME would want to see change is a domain fact and lives git-side — and a validation profile is precisely such a value. Choosing this candidate therefore means re-opening a rule 0009 states as permanent, through 0009's own amendment path, with the four load-bearing mechanisms it protects (gate diffs, port ranges, per-file classification, deterministic renders) each answered. The page does not forbid it; it prices it. Rule for or against."
      - "B3. CANDIDATE 3 — 0009'S OWN HYBRID: YAML under config/ as source of truth, materialized into var/mapping.db as a DERIVED read model (rule 2's existing pattern), with any future UI editing through the draft table and landing as a YAML diff (rule 5: propose in the DB, land in git). This is the shape the floated 'config table' can have WITHOUT breaching anything — the SME gets the table, the gate keeps its diff, the port keeps its range. Rule whether this is the intended reading of the 2026-08-12 direction."
      - "B4. THE PORT DISPOSITION IS PART OF THE RULING, NOT AN AFTERTHOUGHT — this week's live lesson (the alias episode): config/** is canonical-producer, and company-local values in such a file are overwritten WHOLESALE at the next port. A BY-TEAM profile is company data by definition. So whichever carrier wins, the ruling names where team rows live: split files (producer ships the standards + a generic profile as canonical-producer; team profiles in a canonical-company sibling the port never touches — the dev-environment.yaml pattern), a per-entry disposition with an id-keyed merge rule, or the J34 overlay seam. Rule the disposition WITH the carrier."
      - "B5. THE HIERARCHY IS DECLARED FUTURE, NOT BUILT: the direction names 'a platform/product hierarchy later'. The ruling here fixes only the KEY GRAIN a profile binds to (proposed: team, the direction's own word, with the standard id as the other half of the key), and requires the carrier schema to version so a later platform/product level is an additive schema bump, not a re-key. Confirm the grain and the additive-evolution requirement."

  - title: "C. The fence — the DD digit must not select a standard, ratified because this registry is the pressure that would break it"
    confirmations:
      - "C1. RATIFY §7.5/G84 EXPLICITLY: the DD digit is a grammar VERSION — DD1 and a future DD2 are read side by side through a migration — and it MUST NOT select a template or a standard. Selection rides TASKTYPE + the registered JOB_ROLE token + the launcher classification (G94's tree), and a standard id therefore needs its OWN carrier, which is this page's whole subject. The fence is already code (the _SENTINEL regex comment) and will be a test (G94(b): the same job under DD1| and DD2| selects the SAME standard). This clause makes it a RULING, so the test enforces something signed rather than something assumed."
      - "C2. WHY RATIFICATION IS NEEDED NOW rather than left implicit: a per-team registry is exactly the pressure that would break the fence — the first team that wants 'our jobs are DD2 and DD2 means our template' has a carrier to write it in. The fence's meaning after this page: a team profile may KEY on (team, standard id) and NOTHING else; grammar version appears nowhere in any profile key or selector input. Confirm, and confirm that a carrier schema which even PERMITS a grammar-version column fails review."

  - title: "D. Divergence policy — what a team profile may change"
    confirmations:
      - "D1. ADDING IS ALREADY LEGAL AND STAYS SO: a team-local token is the C16 case — the parser preserves an unknown key within a structured block verbatim, never load-bearing, never dropped (parse rule 5). A team profile listing its OWN additional tokens changes nothing about that contract; it merely declares what the team expects of itself. Confirm that ADD requires no ratification beyond the profile row existing."
      - "D2. RELAXING IS THE GOVERNANCE QUESTION, asked rather than assumed: may a team profile mark a COMPANY-REQUIRED token as not-required-for-us? Three positions laid out — (1) FORBIDDEN: profiles may only add; a company-required token is required everywhere, and a team that cannot comply carries a FINDING, not an exemption (the G16 'report and carry on' discipline); (2) PERMITTED WITH RATIFICATION: a relaxation is itself a gate-logged ruling, per team per token, with the gate-log entry id carried IN the profile row (no anonymous exemptions — the O24/A3 rule applied to governance); (3) PERMITTED RECORDED-ONLY: the row says so and nobody signs. The page recommends AGAINST (3) in its own text — an unratified exemption is how a company standard stops being one — and asks the SME to rule between (1) and (2)."
      - "D3. WHOEVER RATIFIES, THE RECORD IS APPEND-ONLY: a relaxation later withdrawn is a new row superseding the old (the status-never-regresses discipline), never an edit — so 'was this ever exempt, and when' stays answerable. Confirm the append-only rule for profile history regardless of the D2 outcome."

  - title: "E. Scope fence"
    confirmations:
      - "E1. NOTHING IS REGISTERED, AND THAT IS A DECISION: no vocabulary term, node class, property term or map row rides this page — identity and carrier are config-layer. The pre-gate record is this file plus its gate-log stub. If the gate rules that standards ALSO warrant graph presence (:Standard nodes, VALIDATES_AGAINST edges), that is a NEW ontology gate with its own page — named here so the omission cannot read as forgotten."
      - "E2. G94 BUILDS REGARDLESS: the selector (selection separated from validation) does not depend on this page — it can return interim identities derived from its own branches until the carrier exists. What G94 may NOT do is invent the carrier; storage is explicitly out of its scope and inside this page's."
      - "E3. FLIPS ARE FOLLOW-UPS: signing authorizes. The carrier file/schema, the agreement test's three-way extension (§A3), and any migration are groomed build items after sign-off; TOKEN_REGISTRY is untouched until then, and its every entry stays proposed exactly as its header says today."
