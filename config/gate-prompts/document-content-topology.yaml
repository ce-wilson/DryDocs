# SME gate-prompt spec — document/content database topology + the ddcontext
# charter (backlog G32). DRAFTED 2026-08-05. REFRESHED 2026-08-12.
#
# This gate rules a BOUNDARY, not an ontology term: how many content databases
# exist, what each holds, and what the walls between them cost. It authorizes no
# graph write. Everything it decides lands afterwards as amendment notes on
# ADR 0002 and ADR 0006 (the ADR 0002 banner precedent — amendments, never body
# rewrites), plus 01_databases.cypher, provisioning/README.md, the doc-source
# registry's target_db column, and test_database_names.py.
#
# REFRESH 2026-08-12 — THREE THINGS THE SME RULED AHEAD OF THE WALK, in session.
# They are recorded here as settled, not re-asked; the sections below are
# rewritten around them rather than still arguing for the superseded proposal.
#   R1 (was Q5, and it decides §A) — `dddocs` is REJECTED as a name and the
#      third database with it. `drydocs` is the original; the `dd*` names are
#      its extensions, so `dddocs` reads as an extension while holding what
#      belongs in the original. Captured vendor/estate content stays in
#      `drydocs`. The name is retired from the registry and from
#      cli.DOC_SWEEP_DATABASES — the draft's own §A already named retirement as
#      the alternative branch, so this is the branch it offered, taken.
#   R2 (was Q2) — bmc-docs is RELOADED FROM SOURCE, not moved. Caveat the SME
#      attached: there are TWO bmc sets, and they are not interchangeable —
#      `bmc-docs` (26 pages converted to markdown, in the repo tree) and
#      `bmc-docs-controlm-utilities` (the full scrape, 1016 documents / 6.0 MB, held
#      outside the repo tree). §C carries what that means for each.
#   R3 (was close-checklist item 3) — the 27 live DESCRIBES edges are DELETED,
#      not preserved through a migration. Under R1 the reload re-establishes
#      them legitimately, so nothing is lost by deleting the residue.
# Also refreshed: the registry has grown from 6 corpora to 7 since the draft
# (`seal-pat-scrape`, registered as a stub by the N8 ruling 2026-08-06).
#
# SECOND REFRESH, same day — THE COUNT REOPENS DOWNWARD, and a sixth section.
# R1 settled that there is no THIRD database. It did not settle that there are
# two. The SME raised the fold to ONE on retrieval grounds: an agent that cannot
# see captured context beside the structured graph in a single vector search may
# not be able to answer the question at all. That argument is NOT the one
# ADR 0002 D1 weighed when it rejected single-DB, and it is not the trigger
# ADR 0011 (single-database contingency, PLANNED 2026-08-10) was written for
# either — 0011 plans the fold for Enterprise becoming unavailable. §A now
# carries ONE and TWO as live options with the fold costed; §F is new and rules
# the consequence nobody would find until after the fold: there are TWO trust
# vocabularies in this repo, they mean different things, and one of them is
# already governing a trust boundary inside a single database today.
#
# Mechanism + database names only. The one company-adjacent id here
# (jpmc-reports) is classification External in the registry: public SEC filings
# with a public source_url. classification: Internal-Public.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: document-content-topology
title: "SME Gate — the document/content database topology, and what ddcontext is actually for"
step: "ADR 0002 D1 amendment + ADR 0006 charter amendment — before G31 sizes the proxy-node spine"
summary: >
  Rules four coupled things the current topology leaves undecided or states
  falsely. Three of the draft's five open questions were ruled in session on
  2026-08-12 and are recorded in `meta` as settled, which changes the shape of
  what is left: with `dddocs` rejected (R1) there are TWO content-bearing
  databases, not three, and the draft's recommended fix for the false watermark
  is no longer available.
  What remains to rule: (a) the database COUNT — two, or the fold to one that
  the SME raised on retrieval grounds — and the `dddocs` name retired either
  way; (b) the ddcontext charter and the watermark, which can no longer be made
  true by moving data because ddcontext keeps two VERBATIM corpora permanently;
  (c) the target_db of all seven doc-source-registry rows; (d) an explicit
  acceptance of what a boundary COSTS, now conditional on (a); (e) the
  drydocs-deepdoc charter, which has drifted between two ADRs that describe
  different products; and (f) the reconciliation of the two trust vocabularies
  the repo already carries — `origin` on authored mappings and `:Uncertain` on
  derived findings — which measure different things and would be conflated the
  first time someone writes a "trusted content" filter.
  The trigger for (b) is not theoretical. `drydocs_api` stamps every ddcontext
  read with the literal string "SYNTHESIZED — unverified", keyed on database
  name; two of the four corpora that stay there are VERBATIM captures. The API
  is making a false provenance claim about material it captured word for word,
  on the export path, today. Confirming this gate authorizes NO graph write and
  moves no data — it fixes the charter and the target column, and the reload
  follows as its own work.
meta:
  Module: "graph-infra"
  Source: "ADR 0002 (component database topology, D1/D2) + ADR 0006 (docmeta component and doc graph, §1) + ADR 0011 (single-database contingency, PLANNED 2026-08-10 — §A's fold option executes its clause 1 for a reason 0011 does not consider); live state read 2026-08-05, re-read 2026-08-12 from config/doc-source-registry.yaml, config/dev-environment.yaml, drydocs_api/query_specs.py, drydocs_api/exports.py, drydocs_core/mapping_store.py and drydocs/loaders/folder_attribution.py"
  Ruled pre-walk: "R1 `dddocs` rejected — two content databases, name retired (settles the draft's Q5 and decides §A) · R2 bmc-docs reloaded from source, with the two-bmc-sets caveat (settles Q2) · R3 the 27 DESCRIBES edges are deleted, not migrated. SME, in session, 2026-08-12"
  Registry ref: "config/doc-source-registry.yaml — 7 corpora (6 at the draft; seal-pat-scrape added 2026-08-06 by N8), target_db split dddocs×3 / ddcontext×4; `dddocs` appears in no provisioning script and in no SHOW DATABASES, and under R1 never will"
  Classification: "Internal-Public (database names, charters and mechanism only; no credentials, no host facts, no company values). jpmc-reports is registry-classification External — public SEC filings with a public source_url"
  Precedence: "ADR 0002 D1 is the standing rule this amends. The SME design session of 2026-07-26 directed three databases for load separation and wipe blast-radius; R1 supersedes that count on naming grounds and this gate records the supersession explicitly rather than letting the two directions coexist"
  Blast radius: "G31 (the proxy-node spine cannot be sized until the database set is known) and through it Q9/Q10/Q11; G38 (the federated read proof); Q16 clause (b), which has no successor item and is decided by §C"

# The database set being ratified, one row per database. R1 applied.
mapping:
  - n: 1
    element: "drydocs — STRUCTURED GROUND TRUTH *and* CAPTURED VENDOR/ESTATE CONTENT"
    target: "the loaded estate graph (folders, jobs, conditions, apps, teams) PLUS the Document -> Chunk lexical graph for every vendor/estate corpus: bmc-docs, bmc-docs-controlm-utilities, seal-pat-scrape"
    edge: "SCOPE WIDENED  [R1 — no new database; the corpora that declared `dddocs` resolve here, which is where bmc-docs already physically sits]"
  - n: 2
    element: "ddcontext — the EXTENSION: reference/experiment/SME content + derived findings"
    target: "neo4j-docs-essential-graphrag, fcdo-frameworks, adhoc-sme-email, jpmc-reports — plus the derived findings (drydocs-deepdoc output) it was originally chartered for"
    edge: "CHARTER RESTATED  [PROPOSED — §B: it holds a permanent MIX of captured content and derived findings, so a watermark keyed on database name can never be true for it]"
  - n: 3
    element: "dddocs — RETIRED"
    target: "nothing. The name is removed from config/doc-source-registry.yaml, from drydocs/cli.py DOC_SWEEP_DATABASES, and from the comment in tests/unit/test_database_names.py"
    edge: "NAME RETIRED  [R1 — it has never been provisioned and now never will be; it cannot stay a name with nothing behind it]"
  - n: 4
    element: "ddschema — schema meta-graph"
    target: "unchanged and OUT OF SCOPE here (G51): describes the schema, not the estate; deliberately not a ddall constituent"
    edge: "—  [NO CHANGE — listed so the ruling's database count is unambiguous]"
  - n: 5
    element: "ddall — composite"
    target: "read-only federation over drydocs + ddcontext. Gains no new constituent under R1"
    edge: "—  [NO CHANGE to membership; but see §B, its watermark is a live latent defect, and §D, a composite read is a join on returned values, never an edge walk]"

provenance:
  - label: ":Document / :Chunk  [EXISTING node classes — the lexical graph ADR 0006 defines]"
    source_object: "captured corpora declared in config/doc-source-registry.yaml (7 today: bmc-docs, bmc-docs-controlm-utilities, neo4j-docs-essential-graphrag, fcdo-frameworks, seal-pat-scrape, adhoc-sme-email, jpmc-reports)"
    key: "doc id / chunk id from the capture manifest — a business key, so a corpus survives a rebuild and re-links (ADR 0002 D1 proxy-node pattern)"
    loader: "drydocs load-bmc-docs, load-vendor-docs, load-essential-graphrag (CANONICAL_LOAD_SEQUENCE steps — verbs are the ADR 0012 public contract and did NOT rename with the corpus ids)"
    properties:
      - name: "text / title / captured_at / source_url"
        origin: source
      - name: "trust_default (VERBATIM | GROUNDED) — declared per corpus in the registry, NOT inferred from where it is stored"
        origin: source
      - name: "target_db — today a REGISTRY DECLARATION that names a non-existent database on 3 of 7 rows (see §C)"
        origin: derived
  - label: ":Finding  [the derived-findings class ddcontext is chartered for — no loader exists yet]"
    source_object: "drydocs-deepdoc output; nothing writes this today, which is why the charter could drift unnoticed"
    key: "to be ruled with the deepdoc charter (§E) — the D1 proxy-node rule says a business key, never an internal node id"
    loader: "not built; §E rules what it would be before the scaffold is written"
    properties:
      - name: "the finding text and its confidence"
        origin: derived
      - name: "the grounded subject it was seeded FROM (§E: no relationship unless the subject already exists in the grounded graph)"
        origin: source

sections:
  - id: A
    title: "HOW MANY CONTENT DATABASES — R1 killed the third, and the SME reopened the count downward to ONE"
    body: >
      R1 settles the count and the name together. `drydocs` is the original
      database and the `dd*` names are its extensions, so a `dddocs` sitting
      beside `ddcontext` and `ddschema` reads as an extension while holding
      exactly what the original is for: the vendor and estate material the
      structured graph is described BY. The draft proposed provisioning it; the
      draft also named the alternative — "rejecting this means retiring the name
      from the registry and cli.DOC_SWEEP_DATABASES instead; it cannot stay a
      name with nothing behind it". That is the branch taken.
      What this supersedes, said plainly so it is not rediscovered as a
      contradiction: the 2026-07-26 design session directed THREE databases on
      two grounds, load separation and wipe blast-radius during testing. R1
      overrides the count. Both grounds survive at reduced strength — a corpus
      reload is still a separate load, and a content wipe is still scoped by
      corpus_id rather than by database. Whether that is enough is the one thing
      §A asks the SME to look at squarely before confirming, because it is the
      argument being traded away.
      Worth being explicit about one thing the split does NOT do: it does not
      separate by TRUST. `drydocs` holds VERBATIM and GROUNDED corpora together,
      because both are captured content and trust is a property of the SOURCE,
      declared per row in the registry. Storing by trust tier is what produced
      the current problem (§B).
      ---
      A-FOLD — THE COUNT REOPENS DOWNWARD, and this is the live choice. R1
      settled that there is no THIRD database. It did not settle that there are
      two. The SME's argument for ONE is a RETRIEVAL argument, and it is not the
      argument ADR 0002 D1 weighed: if a vector search cannot see captured
      context beside the structured graph, the agent may not be able to answer
      the question. D1 optimized for trust isolation when the product was a load
      pipeline; the product is now an agent answering support questions, and
      that failure is silent and constant where the isolation failure is loud
      and rare. Same facts, different objective.
      THE INSTRUMENT IS A LABEL, NOT A PROPERTY, and it marks the EXCEPTION, not
      every node. Three reasons, in order of weight: (1) Neo4j vector indexes are
      created on a (label, property) pair, so a label is what lets you choose one
      index over everything or one per realm — a property cannot scope an index
      at all, which is the exact capability being bought; (2) a property on every
      node must be written by every loader — around twenty surfaces to change and
      twenty to forget — whereas ADR 0011's shape applies one label at the single
      uncertain write boundary and ground-truth loaders change NOT AT ALL;
      (3) labels are natively scanned, properties need their own index. Ground
      truth is the default; context carries the mark.
      WHAT THE FOLD COSTS, priced against the live tree rather than estimated:
      NEARLY FREE, and the timing is unusually good — drydocs_deepdoc/writer.py
      is a 17-line docstring stub. The contract is declared ("every written
      node/edge carries reliability and trust; a finding without stamps is a
      contract violation") and NOTHING is implemented, so the label discipline is
      built in before the first uncertain write ever happens. No migration, no
      backfill, no dual-write window.
      MODERATE and mechanical — 30 QuerySpecs (28 targeting drydocs, 2 targeting
      ddcontext) need the ground-truth exclusion, which ADR 0011 already says to
      generate STRUCTURALLY into the registry rather than hand-editing 30
      queries; the three clause-1 guards (spec exclusion, writer boundary, a
      live audit spec counting :Uncertain nodes reachable from ground-truth
      traversals, expected 0); and the watermark re-key, because with one
      database WATERMARKED_DATABASES has no subject at all — the fold FORCES
      §B-DURABLE rather than merely recommending it. One regression to price
      honestly: docs-verify's `wrong-db` status loses its subject and must be
      re-pointed at the realm label or that observability is simply gone.
      AVOIDABLE — ADR 0011's hardest clause (clause 2: ddschema's exemplar nodes
      carry real labels like :ControlMJob deliberately WITHOUT key properties, so
      drydocs' NODE KEYs would reject them) fires ONLY if ddschema folds in too.
      It is separately chartered (G51) and deliberately not a ddall constituent.
      Leave it out and clause 2 never fires. That is the single largest cost
      reduction available and it should be taken deliberately, not by omission.
      IRREDUCIBLE, in ADR 0011's own words — today a transaction literally cannot
      span databases; folded down, every protection is a check that must run and
      pass. The guarantee moves from physics back to discipline. A bug that both
      mislabels and slips the writer guard corrupts ground truth silently until
      the audit fires. §F is where that risk is weighed against the fact that the
      repo ALREADY runs exactly this mechanism, in production, for its most
      governed edges.
      THE ALTERNATIVE that keeps write-time physics is §D's analytical
      projection: two authoritative databases plus one combined store rebuilt for
      GDS and whole-corpus vector search, authoritative for nothing. For
      retrieval, non-authoritative is arguably fine — you retrieve, then cite
      back to the authoritative node by business key, which is the D1 proxy-node
      pattern again. It costs a rebuild pipeline that does not exist, double
      storage, and staleness in an operational support tool.
    confirmations:
      - "THE COUNT: either TWO content-bearing databases (drydocs + ddcontext) or the FOLD TO ONE. Rule it here; §B, §C and §D all change shape with the answer."
      - "`dddocs` is RETIRED under either outcome — removed from the registry's target_db column, from cli.DOC_SWEEP_DATABASES, and from the test_database_names.py comment. No CREATE DATABASE, no ddall constituent."
      - "The 2026-07-26 three-database direction is SUPERSEDED on naming grounds, and the load-separation / blast-radius arguments are accepted as satisfied by corpus-level scoping instead."
      - "The split — at whatever count — is by KIND, never by trust tier. Trust stays a per-source property in the registry."
      - "IF THE FOLD: the instrument is a LABEL applied at the single uncertain write boundary, marking the exception; NOT a property on every node. A property cannot scope a vector index, which is the capability the fold exists to buy."
      - "IF THE FOLD: ddschema stays its own database, so ADR 0011 clause 2 (exemplar labels vs NODE KEYs) never fires. Taken deliberately, recorded as taken."
      - "IF THE FOLD: ADR 0011's three clause-1 guards are a HARD PRECONDITION of the fold, not a follow-up item, and the physics-to-discipline loss is accepted explicitly (see §F)."
      - "IF THE FOLD: docs-verify's `wrong-db` check is re-pointed at the realm label rather than silently retired with its subject."
  - id: B
    title: "THE ddcontext CHARTER — the watermark makes a false claim today, and R1 removes the fix the draft recommended"
    body: >
      ADR 0002 charters `drydocs_context` as the "isolated uncertain" graph at
      trust SYNTHESIZED / unverified, and the API implements that literally:
      `drydocs_api.query_specs.WATERMARKED_DATABASES` is {ddcontext, ddall}, and
      `exports.WATERMARK_VALUE` is the string "SYNTHESIZED — unverified", stamped
      onto every exported row of a watermarked spec.
      Measured against the registry, ddcontext holds four corpora and NOT ONE of
      them is synthesized: neo4j-docs-essential-graphrag GROUNDED, fcdo-frameworks GROUNDED
      (activated by SME ruling 2026-08-05), adhoc-sme-email VERBATIM,
      jpmc-reports VERBATIM. So an export of an SME email captured word for word
      is stamped as machine-synthesized and unverified. That is a false
      provenance claim on an outward-facing surface, and it is the strongest
      single argument in this gate.
      A SECOND, LATENT instance of the same defect: `ddall` is watermarked too,
      so any future federated spec is stamped SYNTHESIZED even when every row it
      returns came from `drydocs` ground truth. It is latent only because no
      QuerySpec targets ddall yet (26 target drydocs, 2 target ddcontext) — G38
      would create the first one and trip it.
      HERE IS WHAT R1 CHANGED. The draft recommended FIX THE DATA: move captured
      content out, leave ddcontext genuinely synthesized-only, and the existing
      watermark becomes true with no code change. Under R1 that is no longer
      available. The four corpora above STAY in ddcontext, two of them VERBATIM,
      and derived findings will land beside them. ddcontext is now a permanent
      MIX, which means a watermark keyed on database name can never be true for
      it. Only two honest options remain, and they are not equivalent:
      B-NOW — restate the charter to UNCONFIRMED (authority not established,
      whether captured verbatim or inferred) and change WATERMARK_VALUE to
      match. One string, one ADR amendment note, no data moves, no export-path
      change. It is honest about every row it stamps, at the cost of saying
      less.
      B-DURABLE — stop keying the watermark on DATABASE NAME at all and key it
      on the source's declared trust_default. Honest per row rather than per
      database. This is the real fix: keying trust on storage location is the
      root cause of both instances above. It is also materially larger, because
      the export path must know which corpus each row came from, which it does
      not today.
      RECOMMENDED: take B-NOW at this gate — it ends a live false claim in one
      change — and commission B-DURABLE as its own backlog item in the same
      breath, so the cheap fix does not become the permanent one.
      IF §A FOLDS TO ONE DATABASE, this section simplifies and hardens at the
      same time: WATERMARKED_DATABASES has no subject left, so B-NOW is not
      available even as a stopgap and B-DURABLE becomes MANDATORY. That is a
      point in the fold's favour worth naming — it forces the honest fix instead
      of permitting the cheap one.
    confirmations:
      - "The current state is a DEFECT, not a modelling preference: verbatim-captured material is exported stamped 'SYNTHESIZED — unverified'."
      - "R1 is accepted as removing the fix-the-data option: ddcontext keeps four captured corpora permanently, so its charter must change rather than its contents."
      - "B-NOW: the charter restates to UNCONFIRMED and exports.WATERMARK_VALUE follows. ADR 0002 D1 gets an amendment note recording that ddcontext is a mixed database by ruling, not by accident."
      - "The ddall watermark is a second, LATENT instance — a federated read of pure ground truth would be stamped. Fix it in the same change rather than waiting for G38 to trip it."
      - "B-DURABLE is commissioned as its own backlog item now (watermark keyed on the source's trust_default, not the database name), rather than left as direction in a gate log."
  - id: C
    title: "target_db, ROW BY ROW — all seven rows, and the two bmc sets are not the same job"
    body: >
      `config/doc-source-registry.yaml` declares a target_db per corpus. Read
      against the provisioned set (config/dev-environment.yaml: drydocs,
      ddcontext, ddall, ddschema), three rows name `dddocs`, which has never been
      created and under R1 never will be. The comment on `cli.DOC_SWEEP_DATABASES`
      admits the gap in passing — "the registry admits dddocs | ddcontext as
      targets, but a corpus can only be found in a database that EXISTS — and
      `drydocs` is where the bmc-docs corpus actually lives today". So for
      bmc-docs the registry states one database, the sweep expects another, and
      the data sits in a third. R1 collapses all three onto the third.
      PROPOSED END STATE, all seven rows:
      to `drydocs` — bmc-docs (GROUNDED, T1), bmc-docs-controlm-utilities (VERBATIM,
      T1), seal-pat-scrape (VERBATIM, T2, stub);
      unchanged in `ddcontext` — neo4j-docs-essential-graphrag (GROUNDED, T1),
      fcdo-frameworks (GROUNDED, T4), adhoc-sme-email (VERBATIM, T4),
      jpmc-reports (VERBATIM, T1).
      THE TWO BMC SETS, per R2's caveat, because "reload from source" means a
      different amount of work for each and the difference is not visible from
      the registry column:
      `bmc-docs` is the ORIGINAL, 26 pages converted to markdown and committed
      IN the repo at external/orchestration/bmc-controlm/. Its source is
      therefore reproducible on any machine from a clean checkout, which is what
      makes reload-rather-than-move safe. It is the corpus that is loaded today,
      and the one whose target column is currently a lie.
      `bmc-docs-controlm-utilities` is the SECOND, LARGER set: the book scraped in
      total, 1016 documents / 1017 TOC nodes / 6.0 MB, held OUTSIDE the repo tree
      under DRYDOCS_DATA_ROOT. It has never been loaded (`confirmed: false` — no
      loader may write from it until a gate signs the doc-graph shape), so there
      is nothing to migrate and nothing to delete. What it needs is different:
      its capture is machine-local, so re-targeting it to `drydocs` is a
      declaration that only becomes real on a machine that holds the capture.
      Say so in the ruling rather than discovering it at the first load on the
      other machine (J18: the two graphs are independent).
      R3 APPLIED — THE 27 EDGES. The 27 live
      (:Document)-[:DESCRIBES]->(:SoftwareProduct) edges are DELETED, not
      preserved. They are residue from the residency accident, and deleting them
      is safe precisely because R1 makes them legal: bmc_docs.cypher still writes
      DESCRIBES (MATCH-only on :SoftwareProduct, never MERGE), so the reload
      re-establishes them in the same database, under the ruled shape, with
      fresh provenance. Note the asymmetry, since the draft blurred it:
      vendor_docs.cypher — the loader for the OTHER bmc set — deliberately
      writes no DESCRIBES edge at all, and that is unchanged by this ruling.
      The downstream consequence is that docs_coverage's TRAVERSABLE_UNTIL_MOVE
      status has no subject any more: the move never happens, so bmc-docs is
      simply TRAVERSABLE. That status was invented to stop a temporary
      capability being read as durable; it should be retired with the ruling,
      not left as a rung nothing can reach.
    confirmations:
      - "Three rows re-target to `drydocs` (bmc-docs, bmc-docs-controlm-utilities, seal-pat-scrape); four stay in `ddcontext`. No row anywhere names `dddocs`."
      - "R2: bmc-docs is a RELOAD FROM SOURCE out of the repo tree, not a move — and the 27 DESCRIBES edges are deleted first (R3), then re-established by that reload."
      - "bmc-docs-controlm-utilities has never loaded and needs no migration; its re-target is a declaration that only becomes real on a machine holding the DRYDOCS_DATA_ROOT capture. Recorded, not assumed."
      - "cli.DOC_SWEEP_DATABASES is rewritten to (drydocs, ddcontext) and its comment admitting the mismatch is removed, because the mismatch is gone."
      - "docs_coverage's `traversable-until-move` status is retired from the ladder; bmc-docs reports `traversable`."
  - id: D
    title: "WHAT THE ONE REMAINING BOUNDARY COSTS — accepted explicitly here, not discovered later"
    body: >
      A database boundary in Neo4j is absolute: a relationship can NEVER span
      databases. `ddall` federates READS, but a composite query is a join on
      returned values, not an edge walk — the shape is the chained
      `CALL { USE ddall.x }` blocks in provisioning/smoke_drydocs_all.cypher.
      R1 MOVES THE WALL rather than removing it, and moving it is genuinely
      good news for one side and no news at all for the other. Vendor and estate
      content now sits WITH the structured graph, so
      (:Document)-[:DESCRIBES]->(:SoftwareProduct) is an ordinary edge again,
      GDS and path queries work across documentation and estate together, and a
      single vector index can span vendor docs and the graph they describe. That
      is the capability the three-database proposal would have spent.
      What is still LOST, across the drydocs↔ddcontext wall: shortestPath and
      variable-length paths; all of GDS (centrality, community detection,
      similarity); and a single vector index spanning drydocs content AND the
      ddcontext corpora, which becomes two index queries plus a client-side
      rerank. That last one deserves a straight look before signing, and R1 did
      NOT soften it: neo4j-docs-essential-graphrag is the corpus ingested specifically to
      test cross-corpus retrieval, and it is on the far side of the wall. The
      cost the draft flagged as most likely to be waved through is the one cost
      R1 leaves exactly where it was.
      What gets HARDER: text2cypher (Epic R / ADR 0007) must generate correct
      USE clauses and business-key joins rather than a plain MATCH whenever a
      question crosses into ddcontext — a materially larger generation problem,
      though now confined to a narrower class of question than under three
      databases.
      If those costs matter, the mitigation is a single-database ANALYTICAL
      PROJECTION — one combined database rebuilt from the others for GDS and
      whole-corpus vector search, authoritative for nothing. The right time to
      decide that is now, as part of accepting the cost, rather than improvising
      it the first time a query cannot be written.
      EVERYTHING IN THIS SECTION IS CONDITIONAL ON §A ANSWERING "TWO". If the
      fold lands there is no boundary left to price: relationships span
      everything, GDS and path queries work over content and estate together,
      one vector index covers every chunk, and the analytical projection is moot
      because the live store already is one. §D then collapses to a single
      confirmation — that the cost being accepted is §F's, not this one's.
    confirmations:
      - "Accepted: no relationship can span drydocs and ddcontext, and ddall reads are joins on returned values, not edge walks."
      - "Accepted as GAINED by R1: vendor/estate documentation and the structured graph share a database, so DESCRIBES, path queries, GDS and a single vector index work across them."
      - "Accepted as still LOST: whole-corpus vector search including neo4j-docs-essential-graphrag becomes two index queries plus a client-side rerank — the corpus ingested for that retrieval shape is on the far side of the remaining wall."
      - "Accepted: text2cypher (Epic R / ADR 0007) must emit USE clauses and business-key joins for any question reaching ddcontext."
      - "The analytical-projection mitigation is ruled NOW — either commissioned as a backlog item, or explicitly declined with the note that a later need reopens this ADR."
  - id: E
    title: "THE drydocs-deepdoc CHARTER — two ADRs describe two different products"
    body: >
      ADR 0002 charters deepdoc as REACTIVE command-line dependency analysis, run
      when a failure needs more documentation than exists — which is what the
      scaffold implements. ADR 0006 §1 describes it as a CONSUMER of docmeta's
      corpus, citing Document/Chunk nodes. Those are different products, and the
      drift has been load-bearing: it is why the scaffold has not been built.
      The user's stated intent is narrower and clearer than either: profile a
      Confluence space, then search it SEEDED from what the grounded graph
      already knows — creating NO relationship unless the subject is already in
      the DryDocs graph. That constraint is the ADR 0002 D1 proxy-node pattern,
      so the mechanism already exists and needs no invention.
      RECOMMENDED: rule deepdoc a CORPUS-DRIVEN RETRIEVER whose seeds come from
      the grounded graph, and keep the parser-driven path as a separate input
      rather than a rival definition. The two are not in conflict once the
      seeding rule is the charter: a command line is just another seed.
      R1 CHANGES THE CONCRETE TEST. The draft's test was "deepdoc writes
      ddcontext and reads dddocs", which was how the three-way split earned its
      keep. Under two databases deepdoc writes ddcontext and reads BOTH — the
      vendor/estate content in drydocs and the reference corpora beside it in
      ddcontext. That makes deepdoc the first real consumer of the federated
      read, and therefore the first thing to feel §D's cost. Rule it knowing
      that, because it also makes deepdoc the natural forcing function for G38.
      RIDER, worth naming rather than re-deriving a third time: graph-seeded
      retrieval is now the SECOND application of one idea — the first was the
      2026-07-23 HR-hierarchy graph-seeded resolution. Name it as a reusable
      pattern in the ruling so the next instance cites it instead of
      rediscovering it.
    confirmations:
      - "deepdoc is a corpus-driven retriever seeded from the grounded graph; the parser-driven command-line path is an input to it, not a competing definition."
      - "The hard constraint is chartered: NO relationship is created unless its subject already exists in the grounded graph (ADR 0002 D1 proxy-node pattern)."
      - "deepdoc writes ddcontext and reads across BOTH databases — making it the first real consumer of the ddall federated read, and the first to pay §D's cost."
      - "GRAPH-SEEDED RETRIEVAL is named as a reusable pattern, citing both instances (2026-07-23 HR hierarchy; this one)."
  - id: F
    title: "THE TWO TRUST VOCABULARIES — `origin` measures authority, `:Uncertain` measures confidence, and one of them already governs a trust boundary inside a single database"
    body: >
      This section exists because the SME asked a question §A–§E could not
      answer: we map KNOWN relationships, so how are the TEMPORARY ones flagged —
      the manual pin of a folder to a SEAL app, or a support team to a SEAL app?
      The answer turns out to decide how much risk the §A fold actually carries.
      WHAT ALREADY EXISTS, and it is not thin. Every authored attribution carries
      an `origin` from a four-value enum, CHECK-constrained in
      drydocs_core/mapping_store.py and ruled at K7 §B3:
      `manual-pin` (a human pinned it — the automated write is EXCLUDED for that
      folder, and a derived match that disagrees surfaces as a PIN-CONFLICT),
      `override` (authored, overriding a source value), `defined` (authored in
      config/overrides/app-code-mappings.csv), and `matched-fallback` (derived by
      the K2 match policy, tiers SEAL > FID > APP_NAME > ALIAS). Precedence is
      explicit in drydocs/loaders/folder_attribution.py — manual-pin 3, override
      2, defined 1. Riding with it: `match_method` on the edge, a `rationale`
      REQUIRED on anything that is not `defined`, and `authored_by` /
      `authored_on`. K7 stated the presentation rule as a principle: attribution
      is NEVER presented without its origin.
      THE TEMPORARINESS IS ENFORCED AT THE DOOR, which is the part worth
      noticing. A manual CSV is loadable ONLY if registered in
      config/manual-loads/manifest.yaml with a named `replaces_with` AUTOMATION
      PATH and a loadable status. A manual mapping has to name the automation
      that will retire it. Retirement is a human act. So the provisional joins
      are not merely flagged — they are admitted on condition that their own
      successor is named.
      TWO AXES, NOT ONE, and this is what the gate must rule. `origin` measures
      AUTHORITY — who asserted it — and on that axis `manual-pin` is the HIGHEST
      standing: a human beats derivation. `:Uncertain` (ADR 0011 clause 1)
      measures CONFIDENCE — machine-derived, unverified — and is the lowest.
      They are genuinely orthogonal, and conflating them INVERTS the answer for
      the most governed edges in the graph: a "trusted content" filter that reads
      the confidence axis while meaning the authority axis would discard exactly
      the assertions a human deliberately pinned. That is the failure this
      section exists to prevent, and it is the kind that is found after the fold,
      not before it.
      THE PRECEDENT, and it is the strongest argument available for §A's fold.
      Manual pins live inside `drydocs`, in ground truth, and always have. They
      were NEVER protected by the database wall — the wall separates derived and
      reference content from structured fact; it has never separated ASSERTED
      from OBSERVED within the structured graph. Which means this repo already
      governs a trust distinction inside a single database, by per-assertion
      provenance plus a precedence ladder plus a required rationale plus a guard
      that refuses the write without them. Shipped, tested, and applied to the
      highest-stakes join in the graph. That reframes ADR 0002 D1's objection to
      single-DB — "commingles trust; one bad query promotes noise" — because for
      this class the answer was never a boundary. It was per-edge origin. The
      fold would EXTEND a proven mechanism, not invent one. It does not make the
      irreducible loss in §A go away; it means the mechanism replacing physics is
      already running rather than being designed under duress.
      AND THE RETRIEVAL CASE, concretely, because this is where the SME's
      question and the fold meet. A pin's `rationale` is one sentence. The thing
      that JUSTIFIES it — the SME email, the Confluence page, the escalation
      thread — is a captured corpus sitting in ddcontext, on the far side of the
      wall. So today an agent asked "who owns this folder, and why do we think
      so?" retrieves the pin and its origin flag but cannot traverse to the
      evidence. It gets the assertion without the reason, which for a PROVISIONAL
      mapping is the half that matters. That is the use case §A's fold buys, and
      it is worth more than the generic cross-corpus argument in §D.
    confirmations:
      - "TWO trust axes are named and kept distinct: `origin` = AUTHORITY (who asserted it), `:Uncertain` = CONFIDENCE (machine-derived, unverified). Neither is renamed into the other, and neither is collapsed into a single 'trust' flag."
      - "`:Uncertain` NEVER applies to an authored mapping, however provisional — a manual-pin is a human act at the HIGHEST precedence, not an uncertain one."
      - "Every guard, QuerySpec filter and console surface states WHICH axis it reads. A 'trusted content' filter that reads confidence while meaning authority would discard exactly the assertions a human pinned."
      - "The existing origin enum + the manifest `replaces_with` admission rule are accepted as the PRECEDENT that per-assertion trust governance works inside one database — the mechanism §A's fold would extend, not invent."
      - "Recorded as a named use case: an agent must be able to reach a provisional mapping AND the evidence justifying it in ONE retrieval. This is the concrete form of §A's retrieval argument."

open_questions:
  - "Q1 — does anything besides deepdoc ever write ddcontext? Under R1 the answer matters less than it did: ddcontext is no longer an empty database waiting for a loader, it holds four corpora today. The question narrows to whether derived findings need their own label discipline to stay distinguishable from captured content now that they share a database — which is the mixed-database consequence §B is accepting."
  - "Q3 — does the analytical projection (§D) subsume the vector-search cost, or is a cross-corpus vector index needed on the live path? The answer changes whether the projection is a batch convenience or a serving component, which is a much larger commitment. R1 did not touch this."
  - "Q4 — fcdo-frameworks was activated by SME ruling on 2026-08-05 and lands in ddcontext, whose watermark misdescribes it. Under R1 it STAYS there, so the clock the draft started has not stopped: it is now §B-NOW that has to land, not a data move. A week has passed since the draft."
  - "Q6 (NEW, created by R1) — does bmc_docs.cypher's DESCRIBES write stay as it is? It was never withdrawn; only vendor_docs.cypher refuses the edge. R1 makes the write unambiguously legal, so the question is whether the OTHER corpus should now get it too, or whether vendor_docs.cypher's refusal was about corpus shape rather than residency."
  - "Q7 (NEW, created by R1) — Q16 clause (b), the product->documentation pointer reaching the graph, closed as an explicit partial on 2026-08-07 with no successor item and is traceable only by prose. R1 makes it CHEAPER, not harder: the corpora and the products now share a database, so DESCRIBES may already be the whole answer (Q16's own 'cheapest possible answer, check FIRST'). Either mint the successor item at sign-off or record the decline — do not leave it in prose."
  - "Q8 (NEW, superseding the draft's Q5) — the naming logic R1 states ('drydocs is the original, dd* are extensions') is worth recording as a RULE in the ADR amendment, not just as this one rejection. It is the test the next proposed database has to pass."
  - "Q9 (NEW, §F) — does the `origin` enum extend beyond attribution? It is CHECK-constrained on the mapping store's app-code rows today. The support-team -> SEAL edge the SME named is written by the PAT loader with `source: 'pat'` and no origin flag, so the two provisional-mapping classes are not governed the same way. Rule whether origin is the general authority vocabulary or an attribution-local one — the answer decides whether §F's confirmation 3 covers one surface or several."
  - "Q10 (NEW, §A fold) — if the fold lands, ADR 0011 flips from PLANNED-contingency to EXECUTED-by-choice, for a trigger it does not contain. Amend 0011 with the retrieval rationale rather than letting the record say Enterprise became unavailable, which would be false."

risks:
  - "Signing §B without §A/§C is still the worst outcome available: the charter would be restated while the target column keeps naming a database that does not exist. These three sections are one decision wearing three headings — the gate log should record them together or not at all."
  - "B-NOW is a cheap fix to a live false claim, and cheap fixes to live claims are exactly the ones that become permanent. If B-DURABLE is not commissioned in the same sign-off, the watermark stays keyed on database name indefinitely and the root cause survives the gate that named it."
  - "The vector-search cost (§D) is the one most likely to be waved through, and R1's good news makes that MORE likely, not less: it is easy to read 'the wall moved' as 'the wall went away'. neo4j-docs-essential-graphrag is still on the far side."
  - "`dddocs` currently appears in cli.DOC_SWEEP_DATABASES, so docs-verify reports it as db-absent rather than raising. That graceful degradation has been HIDING the gap: the config has named a non-existent database for weeks without a single failure. Whatever is ruled, the guard should fail loudly on an unprovisioned target_db rather than reporting it as merely absent."
  - "Clause (e) has blocked the deepdoc scaffold. Ruling it unblocks work, which means a wrong ruling here gets built on quickly rather than sitting inert."
  - "R3 deletes 27 live edges on the strength of the reload re-creating them. If the reload is deferred after the delete, the graph spends that window with a capability it had before the gate — sequence the two in one session, on each machine, rather than across sessions."
  - "§A's fold is a ONE-WAY DOOR in practice. Splitting a database later means re-homing loaded corpora and every edge that grew across the former wall; the two-database outcome can always fold later, at the same cost it would cost now. Asymmetric reversibility belongs in the decision, not discovered after it."
  - "§F's two axes are the failure most likely to be found LATE, because nothing breaks when they are conflated — a filter reading the wrong axis returns a plausible, smaller answer. If the fold lands without §F's confirmation 3 (every filter states which axis it reads), the first 'trusted content' query silently drops every human-pinned mapping, which are the assertions with the highest standing in the graph."
  - "tests/unit/test_load_map_json.py::test_the_not_queryable_target_db_set_is_pinned pins the not-queryable set to exactly {dddocs} and WILL FAIL when this signs. That is deliberate: it is the alarm forcing web/src/software/softwareModel.ts (inGraphLabel) and the docs-coverage detail lines to be revisited rather than left saying 'not provisioned (G32)'. Under R1 the not-queryable set becomes EMPTY. Treat the failure as a task, not a break."

