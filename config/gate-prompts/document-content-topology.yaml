# SME gate-prompt spec — document/content database topology + the ddcontext
# charter (backlog G32). DRAFTED 2026-08-05, awaiting SME.
#
# This gate rules a BOUNDARY, not an ontology term: how many content databases
# exist, what each holds, and what the walls between them cost. It authorizes no
# graph write. Everything it decides lands afterwards as amendment notes on
# ADR 0002 and ADR 0006 (the ADR 0002 banner precedent — amendments, never body
# rewrites), plus 01_databases.cypher, provisioning/README.md, the doc-source
# registry's target_db column, and test_database_names.py.
#
# Mechanism + database names only. The one company-adjacent id here
# (jpmc-reports) is classification External in the registry: public SEC filings
# with a public source_url. classification: Internal-Public.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: document-content-topology
title: "SME Gate — the document/content database topology, and what ddcontext is actually for"
step: "ADR 0002 D1 amendment + ADR 0006 charter amendment — before G31 sizes the proxy-node spine"
summary: >
  Rules five coupled things the current topology leaves undecided or states
  falsely: (a) how many document/content databases exist and what each holds;
  (b) the ddcontext charter, which today says "isolated uncertain / SYNTHESIZED"
  while holding four corpora of which NONE is synthesized; (c) the target_db of
  every doc-source-registry row, two of which name a database that has never been
  provisioned; (d) an explicit acceptance of what a database boundary COSTS,
  recorded now rather than discovered when a query cannot be written; and (e) the
  drydocs-deepdoc charter, which has drifted between two ADRs that describe
  different products.
  The trigger for (b) is not theoretical. `drydocs_api` stamps every ddcontext
  read with the literal string "SYNTHESIZED — unverified", keyed on database name;
  two of the four corpora there are VERBATIM captures. The API is making a false
  provenance claim about material it captured word for word, on the export path,
  today. Confirming this gate authorizes NO graph write and moves no data — it
  fixes the charter and the target column, and the moves follow as their own work.
meta:
  Module: "graph-infra"
  Source: "ADR 0002 (component database topology, D1/D2) + ADR 0006 (docmeta component and doc graph, §1); live state read 2026-08-05 from config/doc-source-registry.yaml, config/dev-environment.yaml, drydocs_api/query_specs.py and drydocs_api/exports.py"
  Registry ref: "config/doc-source-registry.yaml — 6 corpora, target_db split dddocs×2 / ddcontext×4; `dddocs` appears in no provisioning script and in no SHOW DATABASES"
  Classification: "Internal-Public (database names, charters and mechanism only; no credentials, no host facts, no company values). jpmc-reports is registry-classification External — public SEC filings with a public source_url"
  Precedence: "ADR 0002 D1 is the standing rule this amends; the SME design session of 2026-07-26 already DIRECTED three databases (structured / unstructured-content / derived) for load separation and wipe blast-radius — this gate ratifies and names them rather than reopening that"
  Blast radius: "G31 (the proxy-node spine cannot be sized until the database set is known) and through it Q9/Q10/Q11; G38 (the federated read proof)"

# The three-way split being ratified, one row per database.
mapping:
  - n: 1
    element: "drydocs — STRUCTURED ground truth"
    target: "unchanged: the loaded estate graph (folders, jobs, conditions, apps, teams). Every write the main load makes"
    edge: "—  [NO CHANGE — restated only so the three-way split is legible in one place]"
  - n: 2
    element: "dddocs — UNSTRUCTURED CONTENT (proposed)"
    target: "Document -> Chunk lexical graphs for every captured corpus, whatever its trust tier: VERBATIM captures and GROUNDED extractions alike"
    edge: "CREATE DATABASE  [PROPOSED — the name already exists in the registry and in cli.DOC_SWEEP_DATABASES but has NEVER been provisioned; this gate either makes it real or retires the name]"
  - n: 3
    element: "ddcontext — DERIVED findings"
    target: "narrowed to what the SYNTHESIZED watermark already asserts: machine-derived, unverified findings (drydocs-deepdoc output). Holds no captured corpus"
    edge: "CHARTER NARROWED  [PROPOSED — after the move it holds zero doc corpora, which is what makes its watermark true]"
  - n: 4
    element: "ddschema — schema meta-graph"
    target: "unchanged and OUT OF SCOPE here (G51): describes the schema, not the estate; deliberately not a ddall constituent"
    edge: "—  [NO CHANGE — listed so the ruling's database count is unambiguous]"
  - n: 5
    element: "ddall — composite"
    target: "read-only federation. Gains dddocs as a constituent if row 2 is confirmed"
    edge: "ALIAS ADDED  [PROPOSED — and see §D: a composite read is a join on returned values, never an edge walk]"

provenance:
  - label: ":Document / :Chunk  [EXISTING node classes — the lexical graph ADR 0006 defines]"
    source_object: "captured corpora declared in config/doc-source-registry.yaml (6 today: bmc-docs, bmc-controlm-utilities, essential-graphrag, fcdo-frameworks, adhoc-sme-email, jpmc-reports)"
    key: "doc id / chunk id from the capture manifest — a business key, so a corpus survives a rebuild and re-links (ADR 0002 D1 proxy-node pattern)"
    loader: "drydocs load-bmc-docs, load-vendor-docs, load-essential-graphrag (CANONICAL_LOAD_SEQUENCE steps)"
    properties:
      - name: "text / title / captured_at / source_url"
        origin: source
      - name: "trust_default (VERBATIM | GROUNDED) — declared per corpus in the registry, NOT inferred from where it is stored"
        origin: source
      - name: "target_db — today a REGISTRY DECLARATION that does not match reality for 2 of 6 rows (see §C)"
        origin: derived
  - label: ":Finding  [the derived-findings class ddcontext is chartered for — no loader exists yet]"
    source_object: "drydocs-deepdoc output; nothing writes this today, which is why the charter could drift unnoticed"
    key: "to be ruled with the deepdoc charter (§E) — the D1 proxy-node rule says a business key, never an internal node id"
    loader: "not built; §E rules what it would be before the scaffold is written"
    properties:
      - name: "the finding text and its confidence"
        origin: derived
      - name: "the grounded subject it was seeded FROM (§E: no relationship unless the subject already exists in the grounded graph)"
        origin: source

sections:
  - id: A
    title: "HOW MANY CONTENT DATABASES, and what each one holds"
    body: >
      The 2026-07-26 design session already directed THREE — structured,
      unstructured-content, derived — on two grounds that hold independently of
      each other: separation of loads, and wipe blast-radius during testing
      (retention turned out NOT to be an argument either way, per Q10). This gate
      does not reopen that count; it names the three and writes down what each
      holds, because the CURRENT state has a fourth name floating in the config
      with no database behind it.
      The proposal is rows 1-3 of the mapping above: `drydocs` keeps structured
      ground truth, a newly provisioned `dddocs` holds every captured corpus, and
      `ddcontext` narrows to derived findings only. `ddschema` and `ddall` are
      unchanged and named only so the count is unambiguous.
      Worth being explicit about one thing the split does NOT do: it does not
      separate by TRUST. `dddocs` holds VERBATIM and GROUNDED corpora together,
      because both are captured content and trust is a property of the SOURCE,
      declared per row in the registry. Storing by trust tier is what produced the
      current problem (§B).
    confirmations:
      - "Three content-bearing databases: drydocs (structured), dddocs (captured content), ddcontext (derived findings). ddschema and ddall unchanged."
      - "`dddocs` is provisioned for real — CREATE DATABASE in 01_databases.cypher, added to the ddall composite, covered by test_database_names.py. (Rejecting this means retiring the name from the registry and cli.DOC_SWEEP_DATABASES instead; it cannot stay a name with nothing behind it.)"
      - "The split is by KIND (structured / captured content / derived), never by trust tier. Trust stays a per-source property in the registry."
  - id: B
    title: "THE ddcontext CHARTER — the watermark currently makes a false claim, and this is the live defect"
    body: >
      ADR 0002 charters `drydocs_context` as the "isolated uncertain" graph at
      trust SYNTHESIZED / unverified, and the API implements that literally:
      `drydocs_api.query_specs.WATERMARKED_DATABASES` is {ddcontext, ddall}, and
      `exports.WATERMARK_VALUE` is the string "SYNTHESIZED — unverified", stamped
      onto every exported row of a watermarked spec.
      Measured against the registry on 2026-08-05, ddcontext holds four corpora
      and NOT ONE of them is synthesized: essential-graphrag GROUNDED,
      fcdo-frameworks GROUNDED (activated by SME ruling the same day),
      adhoc-sme-email VERBATIM, jpmc-reports VERBATIM. So an export of an SME
      email that was captured word for word is stamped as machine-synthesized and
      unverified. That is a false provenance claim on an outward-facing surface,
      and it is the strongest single argument in this gate.
      A SECOND, LATENT instance of the same defect: `ddall` is watermarked too, so
      any future federated spec is stamped SYNTHESIZED even when every row it
      returns came from `drydocs` ground truth. It is latent only because no
      QuerySpec targets ddall yet (26 target drydocs, 2 target ddcontext) — G38
      would create the first one and trip it.
      Two ways to stop lying, and they are not equivalent. FIX THE DATA (§A: move
      captured content to dddocs, leaving ddcontext genuinely synthesized-only) —
      the charter then becomes true and the watermark can stay exactly as it is.
      Or FIX THE LABEL (restate the charter to UNCONFIRMED, meaning authority not
      established whether captured verbatim or inferred, and change
      WATERMARK_VALUE to match) — cheaper, no data moves, but it keeps content and
      findings commingled, which is what §A's load-separation and blast-radius
      arguments were about.
      RECOMMENDED: fix the data, and additionally stop keying the watermark on
      DATABASE NAME. Keying trust on storage location is the root cause of both
      instances above; the honest key is the source's own declared trust_default.
      That is a bigger change than this gate needs, so it is offered as a separate
      confirmation rather than bundled.
    confirmations:
      - "The current state is a DEFECT, not a modelling preference: verbatim-captured material is exported stamped 'SYNTHESIZED — unverified'."
      - "Fix by moving the data (§A), not by weakening the charter: after the move ddcontext holds derived findings only, and its existing watermark becomes true."
      - "The ddall watermark is a second, LATENT instance — a federated read of pure ground truth would be stamped synthesized. Fix it in the same change rather than waiting for G38 to trip it."
      - "SEPARATE and optional: stop keying the watermark on database name at all, and key it on the source's declared trust_default. Confirm as direction, to be built as its own backlog item."
  - id: C
    title: "target_db, ROW BY ROW — two rows name a database that does not exist"
    body: >
      `config/doc-source-registry.yaml` declares a target_db per corpus. Read
      against the provisioned set (config/dev-environment.yaml: drydocs,
      ddcontext, ddall, ddschema), two rows name `dddocs`, which has never been
      created. The comment on `cli.DOC_SWEEP_DATABASES` admits this in passing —
      "the registry admits dddocs | ddcontext as targets, but a corpus can only be
      found in a database that EXISTS — and `drydocs` is where the bmc-docs corpus
      actually lives today". So for bmc-docs the registry states one database, the
      sweep expects another, and the data sits in a third.
      Confirming §A makes the column honest rather than aspirational. Proposed
      end state, all six rows to `dddocs`, because all six are captured content:
      bmc-docs (GROUNDED, T1), bmc-controlm-utilities (VERBATIM, T1),
      essential-graphrag (GROUNDED, T1), fcdo-frameworks (GROUNDED, T4),
      adhoc-sme-email (VERBATIM, T4), jpmc-reports (VERBATIM, T1).
      The consequence is worth stating plainly because it is the point: ddcontext
      would then hold ZERO doc corpora. That is not an emptying-out, it is the
      charter being enforced — derived findings are what it was always for, and
      nothing has written one yet.
    confirmations:
      - "All six registry rows target dddocs; ddcontext's target_db count goes to zero."
      - "bmc-docs is a MIGRATION, not a re-label: the corpus physically lives in `drydocs` today and has to be moved and verified, not just re-pointed in the registry."
      - "cli.DOC_SWEEP_DATABASES is rewritten from the ruling rather than left to drift, and its comment admitting the mismatch is removed because the mismatch is gone."
  - id: D
    title: "WHAT THE BOUNDARY COSTS — accepted explicitly here, not discovered later"
    body: >
      A database boundary in Neo4j is absolute: a relationship can NEVER span
      databases. `ddall` federates READS, but a composite query is a join on
      returned values, not an edge walk — the shape is the chained
      `CALL { USE ddall.x }` blocks in provisioning/smoke_drydocs_all.cypher.
      What still works: every known-shape question, restated as an explicit join.
      Every existing QuerySpec is fine.
      What is LOST across the boundary: shortestPath and variable-length paths; all
      of GDS (centrality, community detection, similarity); and a single vector
      index spanning reference AND content chunks, which becomes two index queries
      plus a client-side rerank. That last one deserves a straight look before
      signing — the essential-graphrag corpus was ingested to do exactly that kind
      of retrieval, so this gate makes an already-ingested experiment harder on
      purpose.
      What gets HARDER: text2cypher (Epic R / ADR 0007) must generate correct USE
      clauses and business-key joins rather than a plain MATCH — a materially
      larger generation problem than single-database Cypher.
      If those costs matter, the mitigation is a single-database ANALYTICAL
      PROJECTION — one combined database rebuilt from the others for GDS and
      whole-corpus vector search, authoritative for nothing. The right time to
      decide that is now, as part of accepting the cost, rather than improvising it
      the first time a query cannot be written.
    confirmations:
      - "Accepted: no relationship can span these databases, and ddall reads are joins on returned values, not edge walks."
      - "Accepted: shortestPath, variable-length paths and all GDS stop working across the boundary."
      - "Accepted: whole-corpus vector search becomes two index queries plus a client-side rerank — including for essential-graphrag, which was ingested for that retrieval shape."
      - "Accepted: text2cypher (Epic R / ADR 0007) must emit USE clauses and business-key joins."
      - "The analytical-projection mitigation is ruled NOW — either commissioned as a backlog item, or explicitly declined with the note that a later need reopens this ADR."
  - id: E
    title: "THE drydocs-deepdoc CHARTER — two ADRs describe two different products"
    body: >
      ADR 0002 charters deepdoc as REACTIVE command-line dependency analysis, run
      when a failure needs more documentation than exists — which is what the
      scaffold implements. ADR 0006 §1 describes it as a CONSUMER of docmeta's
      corpus, citing Document/Chunk nodes. Those are different products, and the
      drift has been load-bearing: it is why the scaffold has not been built.
      The user's stated intent is narrower and clearer than either: profile a
      Confluence space, then search it SEEDED from what the grounded graph already
      knows — creating NO relationship unless the subject is already in the DryDocs
      graph. That constraint is the ADR 0002 D1 proxy-node pattern, so the
      mechanism already exists and needs no invention.
      RECOMMENDED: rule deepdoc a CORPUS-DRIVEN RETRIEVER whose seeds come from the
      grounded graph, and keep the parser-driven path as a separate input rather
      than a rival definition. The two are not in conflict once the seeding rule is
      the charter: a command line is just another seed.
      RIDER, worth naming rather than re-deriving a third time: graph-seeded
      retrieval is now the SECOND application of one idea — the first was the
      2026-07-23 HR-hierarchy graph-seeded resolution. Name it as a reusable
      pattern in the ruling so the next instance cites it instead of rediscovering
      it.
    confirmations:
      - "deepdoc is a corpus-driven retriever seeded from the grounded graph; the parser-driven command-line path is an input to it, not a competing definition."
      - "The hard constraint is chartered: NO relationship is created unless its subject already exists in the grounded graph (ADR 0002 D1 proxy-node pattern)."
      - "deepdoc writes to ddcontext (derived findings) and reads dddocs (content) — which is the concrete test that §A's three-way split is the right one."
      - "GRAPH-SEEDED RETRIEVAL is named as a reusable pattern, citing both instances (2026-07-23 HR hierarchy; this one)."

open_questions:
  - "Q1 — does anything besides deepdoc ever write ddcontext? If the honest answer is no, the database is empty until the deepdoc scaffold is built, and the SME may prefer to provision it later rather than run an empty database through every provisioning cycle. Deferring costs nothing except an ADR note saying so; provisioning early costs a database nobody reads."
  - "Q2 — the bmc-docs migration (§C) needs a venue and a method: it is a live corpus in `drydocs` on both machines, and the two graphs are independent (J18). Re-load from source into dddocs is cleaner than a move, IF the corpus is reproducible from external/orchestration/bmc-controlm/. Confirm that it is before choosing."
  - "Q3 — does the analytical projection (§D) subsume the vector-search cost, or is a cross-corpus vector index needed on the live path? The answer changes whether the projection is a batch convenience or a serving component, which is a much larger commitment."
  - "Q4 — fcdo-frameworks was activated by SME ruling on 2026-08-05, hours before this draft, and lands in ddcontext under the current registry. If this gate is not signed soon it will be loaded into the database whose watermark misdescribes it. Not a blocker for the gate, but it sets the clock."
  - "Q5 — should `dddocs` be the name at all? It is the name the registry already carries, so it costs nothing, but it reads as a sibling of ddschema/ddcontext while holding something quite different. Alternatives: ddcontent, ddcorpus. Naming is cheap now and expensive after provisioning."

risks:
  - "Signing §B without §A/§C is the worst outcome available: the charter would be restated to match data that then moves anyway, and the false watermark stays live in the meantime. These three sections are one decision wearing three headings — the gate log should record them together or not at all."
  - "The vector-search cost (§D) is the one most likely to be waved through and regretted. essential-graphrag exists specifically to test cross-corpus retrieval, and this ruling makes that two queries and a rerank. If that experiment matters, the analytical projection is not optional and should be commissioned in the same breath."
  - "`dddocs` currently appears in cli.DOC_SWEEP_DATABASES, so docs-verify already reports it as db-absent rather than raising. That is a graceful degradation which has been HIDING the gap: the config has named a non-existent database for weeks without a single failure. Whatever is ruled, the guard should fail loudly on an unprovisioned target_db rather than reporting it as merely absent."
  - "Clause (e) has blocked the deepdoc scaffold. Ruling it unblocks work, which means a wrong ruling here gets built on quickly rather than sitting inert."
  - "Migrating bmc-docs (§C) is the only step in this gate that touches live data on two independent machines. Every other consequence is config and DDL."

status: awaiting-sme
drafted: 2026-08-05
unblocks:
  - "G31 — the proxy-node spine cannot be sized until the database set is known"
  - "G38 — the ddall federated read proof (and it would trip the latent ddall watermark defect, §B)"
  - "Q9 / Q10 / Q11 — the corpus re-file, email ingest and supersession items, all behind G31"
  - "the drydocs-deepdoc scaffold, blocked on clause (e) since 2026-07-27"
