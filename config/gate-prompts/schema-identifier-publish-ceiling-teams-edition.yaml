# GATE schema-identifier-publish-ceiling-teams-edition — DRAFTED 2026-09-01 (J70 clause a).
# UNSIGNED. Nothing is swept, renamed or redacted until this signs.
#
# This does NOT assert that J13 class 3 was wrong. It asks whether a CONDITION
# inside the ruling it defers to still holds for a product that ships outside
# this company.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: schema-identifier-publish-ceiling-teams-edition
title: >-
  SME Gate — the signed grammar publishes a schema name when it is "established public
  vocabulary": does that condition still hold for psgmgr once Teams Edition ships the tree
  outside this company, and if not, what is the mechanism
step: >-
  J70 clause (a), drafted 2026-09-01, and it exists BECAUSE the request was declined as an
  edit. The SME asked for psgmgr to be redacted; J13 class 3 (2026-08-11) had already ruled
  no sweep was owed. Reversing a signed ruling is a gate decision and never an item's, so the
  request is put here instead of applied. Nothing is renamed until this signs.
summary: >-
  (a) WHAT IS ACTUALLY AT ISSUE — not the ruling, a CONDITION inside it. J13 class 3 does not
  itself decide anything; it defers to the SIGNED N9 source-registry-v2 grammar (§Q1), which
  publishes `{origin}@{db}.{schema}.{table}` with the database redacted to `[db]` and "the
  schema kept WHEN IT IS ESTABLISHED PUBLIC VOCABULARY — and it names `psgmgr` as exactly
  that." The clause is conditional. So the question is not "was 2026-08-11 wrong" (it was
  right on what it had) but "is psgmgr still established public vocabulary for a tree that
  leaves this company." (b) WHAT CHANGED — ADR 0015 Team Edition (PROPOSED 2026-08-27):
  copier-templated per-team instances generated from a cherry-picked base, plus the standing
  standalone-template goal. A schema name that is ordinary vocabulary INSIDE the estate is a
  local coinage OUTSIDE it. That is new evidence postdating the ruling, which is the only
  legitimate reason to reopen a signed one. (c) THE MOTIVE IS GENERALIZATION, NOT SECRECY,
  and the distinction is load-bearing — see §B2. (d) THE MECHANISM IS NOT A FIND-AND-REPLACE:
  242 tracked files, several of them tests pinning the literal, and this repo renames a
  registered id through a retired-ids row and a `replaces:` field.

