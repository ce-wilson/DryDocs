    signed ruling needs a declared way to be looked at again, and this is its first exercise.
  Registry ref: >-
    Affected id shapes: controlm@[db].psgmgr.<table>, seal@[db].psgmgr.cm_escalation_db, and
    every dataset row whose schema segment is psgmgr. 17 retired ids already exist; the
    `replaces:` field and the retired-ids block are the rename mechanism.
  Classification: >-
    Internal-Public — mechanism only. This prompt names psgmgr because the SIGNED grammar
    publishes it today; if §B rules otherwise the prompt is itself in scope of the ruling.
  Counts: >-
