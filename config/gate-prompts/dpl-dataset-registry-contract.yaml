# SME gate-prompt spec — dpl dataset-registry contract (backlog id: at next
# groom). DRAFTED 2026-08-07, UNSIGNED. The sibling of
# dpl-pipeline-registry-contract, same two-step shape, run separately because
# the artifacts differ (dataset_id.json vs pipeline_id.json), the ASSUMED
# contract differs, and the join target differs — datasets join the G17 MAC
# dataset_flow evidence and the catalog registration views, not the launcher
# tokens. The SME identifies a real export (HITL, Internal), the agent
# profiles it, the rulings close or re-scope the contract and its audit stub.
# GATE-BOUND: this page PROPOSES; rendering it builds, flips, and stamps
# nothing. Mechanism-only: GUIDs, SEAL ids and registry URLs stay company-side.
# AMENDED 2026-09-07 (producer, pre-session, from the transcription of a company-side §B
# profile run against the live registry; [SME-REPORTED] - the profile itself is company-
# internal and never lands here). Three things the drafted page assumed turned out wrong on
# the data, so the page is corrected BEFORE the session rather than re-asked at it: (1) the
# registry's `zone` is NOT a RAW/TRUSTED/REFINED lake layer - it is a multi-valued enum that
# is a lake layer for object-store rows and a database technology for the rest, a minority
# of its keys are in use, two in-use keys are unregistered, and the only registered
# "refined" key is a typo matching no row; B3 is restated on that axis and C1-a/C1-c carry
# the rulings. The payload `zone` in dataset_flow.json (gate dpl-dataset-identity-zone) is
# a DIFFERENT field with the same spelling - J32 applies. (2) `version_id` is not semver:
# suffixed, date-styled, two-component and case-variant forms all occur - C1-b. (3) the
# audit identities are MIXED - overwhelmingly person-shaped, with a small set of service
# identities including reverse-hydrate process names - so the pipeline sibling's "person,
# not service principal" reading does not carry to datasets - C2-a. A fourth spelling of
# the owner-application field was also seen (a different token, not a different case), so
# the sibling's case-insensitivity fix does not cover it - named under C1-a. Counts stay
# company-side (estate volumetrics are fenced); this page carries the shape only.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
updated: 2026-09-07

id: dpl-dataset-registry-contract
title: "SME Gate — dpl dataset-registry contract: identify a real export (HITL, Internal), profile it against the ASSUMED contract (agent), then rule the contract, the audit stub, and discovery precedence"
step: "Follows rua-load-shapes (G22, signed 2026-08-07). The registry row dpl:dataset-registry is confirmed: true under the same activation as its pipeline sibling, and carries the same ASSUMED-contract caveat — plus its own: the clone-lag ruling (SME 2026-07-23) that the BULK export is the backup discovery source when per-SEAL pulls lag."
summary: >
  Two steps, in order. (1) HITL, INTERNAL: the SME identifies the source data
  — a real dataset_id.json export (which SEALs, per-SEAL API or bulk export,
  pulled when). Real values recorded company-side / in internal/, never on
  this page; the run names its venue (J18). (2) AGENT: parse and profile it —
  field census against the ASSUMED contract, createdBy/lastModifiedBy
  evidence for the audit stub, and GUID join coverage against the G17
  dataset_flow READS/WRITES candidates (with system-type and lake-layer
  distribution) and the
  catalog registration views' dpl_dataset identities. Zero graph writes.
  Section C consumes the profile: contract confirmed or amended, audit stub
  closed or standing, and per-SEAL-vs-bulk discovery precedence ruled in
  config/precedence.yaml terms.
