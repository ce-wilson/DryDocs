  Module: "drydocs_lineage (G25 extractor: dpl_registry.py, dataset leg) — taxonomy-first staging; no loader exists and none is built here"
  Source: "dpl:dataset-registry (source-registry, confirmed: true at G22) — per-SEAL dataset_id.json Swagger exports; bulk export = backup discovery (clone-lag caveat, SME 2026-07-23)"
  Precedent: "G22 §G GUID-as-business-key with urn:drydocs:dataasset fallback for unmanaged assets; audit-envelope-phase4 (dpl stub ruled ASSUMED-contract, revisit = a real export parsing = THIS gate); G41 (DPL-registered catalog rows land on the same dpl_dataset identity; other origins stay their own); A5's accepted consequence (numerous transient local_file DataAssets are NOT this registry's population)"
  Registry ref: "adapter stays ~; confirmed stays true — this gate validates the CONTRACT; its only writes are config/audit-fields and config/precedence entries"
