# SME gate-prompt spec — the DPL dataset identity / zone rider (backlog G136).
# DRAFTED 2026-08-31, UNSIGNED. A decision RIDER on rua-load-shapes §G1
# (SIGNED 2026-08-07), raised because that clause and the code it ruled on
# share ONE unexamined premise about what the payload field `zone` carries.
# The clause is not disputed on its merits and nothing here re-opens the
# medallion stage vocabulary (SIGNED 6/6, 2026-08-19).
# GATE-BOUND: this page PROPOSES; rendering it builds, flips and stamps
# nothing. Mechanism-only: GUIDs, SEAL ids, bucket names, Glue database names
# and connector names stay company-side (PUBLISH-BOUNDARY.md).
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: dpl-dataset-identity-zone
title: "SME Gate — the DPL dataset identity rider: `zone` names a storage technology, not a medallion layer, so a GUID-only key makes one pipeline read and write the same DataAsset"
step: "Decision rider from G136 on rua-load-shapes §G1 (SIGNED 2026-08-07), which ruled managed assets key on the GUID alone with `version` and `zone` as properties. It decides what identifies a MAC dataset endpoint, and therefore whether the G17 READS_FROM / WRITES_TO candidates can carry a raw-to-trusted-to-refined chain at all."
summary: >
  §G1 is a good ruling reached from a premise nobody had checked. It says
  managed assets key on the GUID alone "with version and zone as properties",
  and it says so because the code already assumed it — the sign-off quotes
  dpl_mac.py's own comment back as corroboration. Neither the clause nor the
  comment had seen a real flow payload. The company-side G64 session reports
  that in the payload `zone` is a STORAGE TECHNOLOGY carried identically on
  raw, trusted and refined endpoints, and that the layer lives in
  `connectorName` / `glueDatabaseName` instead. If that holds, the same dataset
  GUID at the same version appears as BOTH the input and the output of a
  raw-to-trusted pipeline, the two collapse onto one node, and chaining
  pipelines by "A's output GUID is B's input GUID" matches A to itself.
  Section A confirms the payload reading. Section B rules identity. Section C
  rules what happens to the candidates already staged under the old key.
  Zero graph writes.
