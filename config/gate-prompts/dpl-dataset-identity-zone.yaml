  Precedent: "rua-load-shapes §G1 (SIGNED 2026-08-07): identity is a business key, the URN is a render, managed assets key on the GUID alone. ADR 0001: node identity is always a business key, never a URL. medallion-stage-vocabulary (SIGNED 6/6, 2026-08-19) §B1: zones are physical residency, stages are logical; §C1: no stage-attribution edge exists, not even planned. J32: two things, one spelling"
  Registry ref: "no registry flag moves. Both dpl rows stay confirmed: true and adapter: ~; this rider decides a KEY, and its only writes are to dpl_mac.py and, if §C rules so, the staged candidates"
  Classification: "Internal-Public page. The payload field NAMES are mechanism and appear here; their VALUES (bucket names, Glue database names, connector names, GUIDs, SEAL ids) are Internal and stay company-side"
  Source of record: "config/gate-log.md (transcription target) · docs/restructure/03-hitl-sme-flow.md · backlog G136"

