sections:
  - title: "A. The payload reading — confirm the premise before touching the key"
    confirmations:
      - "A1 [confirm]: in the MAC flow payload, `zone` carries a STORAGE TECHNOLOGY and carries the same value on raw, trusted and refined endpoints alike — it is not the medallion layer and not the `zone_prefix` of the signed stage capture. Company-side evidence (the G64 session); this page carries the reading, never the values. [confirmed / corrected / not yet evidenced]"
      - "A2 [confirm]: the layer, where it is recoverable at all, lives in `connectorName` / `glueDatabaseName` rather than in `zone`. If it is recoverable in neither, say so — an unrecoverable layer is a finding, and it changes B1's options rather than blocking them. [named / unrecoverable]"
      - "A3 [scope]: this rider re-opens NOTHING in medallion-stage-vocabulary. §B1 already ruled zones physical and stages logical, which a storage-technology field sits comfortably inside; §C1's no-stage-edge fence is untouched. Confirm that reading, so the sign-off cannot later be read as amending a signed vocabulary. [confirm]"
  - title: "B. Identity — what keys a MAC dataset endpoint"
    confirmations:
      - "B1 [rule]: the business key for a managed DPL dataset endpoint. THE CONSEQUENCE, stated so the options are compared against it rather than in the abstract: under a GUID-only key the raw-to-trusted pipeline reads and writes ONE node, and pipeline-to-pipeline lineage derived as 'A's output GUID is B's input GUID' matches A to itself. Options: (i) GUID ALONE STANDS and the hop is modelled some other way — the reading and the writing are distinguished on the EDGE, never on the node; (ii) THE KEY GAINS A RESIDENCY COMPONENT, (guid, connectorName) or whatever A2 named, so the same dataset at two layers is two nodes; (iii) THE KEY STANDS AND THE CHAIN IS NOT DERIVED HERE — the registry-derived lineage is declared out of scope until its own gate. Each option states what it costs the URN render that §G1 made derived-from-the-key. [ruled]"
      - "B2 [rule]: whether B1 AMENDS §G1 or SCOPES it. §G1 ruled managed assets generally; if B1 takes option (ii) it can either amend that general clause or carve the DPL dataset endpoint out of it as a named exception. Amend-vs-carve is a real choice with a real cost either way — a general rule with one stated exception is honest; a general rule quietly false on its largest population is not. [amend / carve out]"
      - "B3 [confirm]: whichever way B1 goes, `version` stays a property rather than a key component, unless the SME rules otherwise here. The G64 census reports the pipeline and dataset version fields under different names and different types (an integer on one half, a semantic-version string on the other), which is a CONTRACT question owned by G64 clause C1 — flagged so B1 is not decided on a version model that C1 may change. [confirm / defer to C1]"
  - title: "C. What happens to what is already staged"
    confirmations:
      - "C1 [rule]: the disposition of READS_FROM / WRITES_TO candidates already staged under the GUID-only key. Nothing has loaded — the curated-load gate still refuses a live write — so this is about the staged working set and the tests pinning it, never about graph repair. Options: re-stage under the new key, annotate in place as pending, or leave standing with the limit recorded on the seam. Deleting is not offered: a candidate is evidence of what a feed said. [ruled]"
      - "C2 [rule]: what the seam REPORTS when it stages one GUID as both an input and an output of the same pipeline. Today that is silent — the two merge onto one node and no counter fires. Whether or not B1 changes the key, the collision is a fact the run should state, in the never-silent house rule's terms. [ruled]"
      - "C3 [record]: tracker T10 (MAC field contract validated vs a REAL DPL export) is where the rest of this payload's contract belongs. Record whether A1/A2 discharge any part of it or whether it stands whole — the same split G64 made between a profile and a ruling. [recorded]"
