      - {name: zone, origin: source, from: "dataset_flow.json inputDatasets/outputDatasets entries", note: "staged verbatim as a property named `zone`. The ASSUMED FIELD CONTRACT in dpl_mac.py's header defines the field; no real payload has validated it (tracker T10, pending)"}
