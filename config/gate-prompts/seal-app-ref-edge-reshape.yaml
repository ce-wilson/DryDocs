# SME gate-prompt spec — the Application ↔ Control-M attribution CLOSE-OUT gate.
# REVISED v2 2026-07-22 (user direction: "close out the mapping for any relationships
# that need to be defined or manually overwritten until fixed — the application to
# Control-M folders"). v1 (prepped 2026-07-15) framed only the K3 §F job-edge SHAPE
# question; the 2026-07-22 SME grain-correction (docs/restructure/IDEAS.md, top inbox
# item) superseded that framing: attribution grain is FOLDER-level, authored by the
# Control-M APP CODE as a DEFINED mapping with steward overrides — the shape question
# survives as section D. GATE-BOUND: this page PROPOSES; no vocabulary re-shape, no
# map flip, no loader change, no graph write until §H is signed. The K2 match POLICY
# (signed off 2026-07-14) is NOT re-opened — it demotes to fallback tier, unchanged
# internally. Mechanism-only: no real folder/job/SEAL values (the two declared tier-1
# code examples live in the IDEAS.md inbox note, cited — not restated — here).
#
# REVISED v3 2026-07-27 — COMPANION section G added (sign-off moves G→H; every existing
# confirmation id A1–F2 is unchanged, and the external citations of §B / §C1 / §E2 still
# resolve). Folds in the SME orchestrator-mapping direction of the same date: the
# app→orchestrator USES_SOFTWARE edge is AUTHORED by a confirmed folder/entity mapping
# rather than derived from the SEAL declaration, Port.active is SME-declared then
# confirmed by that mapping, orchestrator cardinality is 1:N, and the mapping act is a
# steward UI cascade. Evidence basis for §G6 is a company-side session reviewed
# 2026-07-27 (screenshots) plus the source system's own report headers — STRUCTURE ONLY:
# those captures carry real application ids, SIDs, names and team/LoB values and are
# Internal and confidential material, so nothing from them is transcribed here or anywhere in the
# publishable tree (PUBLISH-BOUNDARY.md; the sealid-in-strings lesson).
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: seal-app-ref-edge-reshape
title: "SME Gate — Application↔Control-M attribution close-out: folder grain, app-code defined mapping (tier 1/2), edge shape, steward overrides until source-fixed"
step: "Closes out the K3 §F deferral + the 2026-07-22 grain correction in one ruling: what the authoritative application↔folder mapping IS, who authors it, and how wrong source values are overridden until fixed"
summary: >
  Today the only application attribution is the ACTIVE job-level K2 edge
  (:ControlMJob)-[:WAS_ASSOCIATED_WITH {role: seal_app_ref}]->(:BusinessApplication),
  written by fuzzy MATCHING (SEAL > FID > APP_NAME > ALIAS) — and it carries two
  standing defects. (1) SHAPE: K4 reclassed :BusinessApplication to prov:Entity /
  dprod:DataProduct, so Activity→Agent wasAssociatedWith no longer type-checks
  (the K3 §F rider). (2) GRAIN + AUTHORSHIP (SME 2026-07-22): attribution was
  never meant to be job-level or matched — the graph grain is FOLDER-level
  (jobs inherit via CONTAINS_JOB), and the mapping should be DEFINED, keyed by
  the Control-M APP CODE (:ControlMApplication, already tied to folders via
  CONTAINS_FOLDER), in two tiers: seal-born codes map 1:1 to a BusinessApplication;
  shared platform codes map 1:many to AreaProducts. Where the defined value is
  missing or the source value is wrong, a STEWARD OVERRIDE row (the O24
  origin-flagged pattern) carries the correction until it is fixed in the source
  system — and because the defined mapping has NO machine feed, this gate must
  also rule the standing open question of whether steward rows may feed the
  graph (they are the only possible source here). Until §H signs, the active
  K2 shape stands with its documented rider and the UI keeps deriving the
  folder→app crosswalk through job edges (explorer.folder-applications.v1).
  COMPANION §G (v3, 2026-07-27) attaches the ACT that performs the mapping:
  the steward picks the orchestrator FIRST — that choice authors the
  app→orchestrator USES_SOFTWARE edge — then filters that orchestrator's
  folders/entities, and the approved mapping is what CONFIRMS an SME-declared
  Port.active. §G shares §A–§F's grain and §E3's write path; it is not a
  second gate, and it cannot sign without §C1 (the two must agree, §G5).
meta:
  Module: "drydocs-load · seal_attribution loader + manual tier-5 writer (K2) · mapping store (O13/O24) · drydocs_api/mappings.py"
  Source: "STG_APP_FACT (fact_type SEAL) demotes to fallback; NEW authoring source = the steward-defined app-code mapping (config/overrides/ CSV → mapping.db domain — no source system exists for it)"
  Registry ref: "stg-app-fact — confirmed, unchanged; the defined-mapping store needs its own source-registry entry at build (classification Internal — confidential material — company-side, mechanism-only here)"
  Classification: "Internal (real code→SEAL rows) · this page Internal-Public (mechanism only)"
  Vocabulary: "m3_seal_app_ref (active, rider) · m3_contains_folder (active — the app-code→folder tie) · arch_contains_batch/arch_contains_folder (planned :Batch bridge — candidate for retirement at this gate, section D) · §G adds: reg_uses_software (active — the orchestrator edge, authorship under decision G1/G2) · seal_has_port (active — Port.active activation semantics, G4) · catalog_has_application (PLANNED producer-side with no loader, ACTIVE company-side with one — the §G6 back-flow)"
  Ontology map: "config/taxonomy-ontology-map.yaml job-seal-app-ref (confirmed, type_conflict_note) + app-code-defined-mapping (proposed 2026-07-22, this gate's entry)"
  Related gates: "seal-tom-attribution-reshape §F (2026-07-10, deferred here) · seal-attribution-match-policy (2026-07-14, NOT re-opened — demoted to fallback) · ui-write-surface (2026-07-21 — O24 override store ratified; its open override-vs-precedence question is scoped HERE, section E)"
  Company impact: "T1 live load re-run after migration; company enumerates its real tier-1/tier-2 code rows at its own gate"
mapping:
  - n: 1
    element: "Attribution GRAIN"
    target: "folder-level: (:ControlMFolder)-[edge §D]->(application target §C); jobs INHERIT via CONTAINS_JOB — the K2 job edge migrates (n:6)"
    edge: "grain correction  [PROPOSED — SME model 2026-07-22]"
  - n: 2
    element: "Authoring KEY"
    target: ":ControlMApplication app code (folder-header grouping; CONTAINS_FOLDER already ties codes to folders, so folder edges DERIVE from one app-code row)"
    edge: "defined mapping, not matching  [PROPOSED]"
  - n: 3
    element: "Tier 1 — seal-born app code"
    target: "code created FOR one SEAL → direct code→BusinessApplication row (1:1); enumerate these first (two declared examples in the IDEAS.md inbox note)"
    edge: "defined-mapping tier  [PROPOSED]"
  - n: 4
    element: "Tier 2 — shared platform code"
    target: "code is a platform (e.g. the DPL launcher spine) → code→AreaProduct rows (1:many); per-folder resolution stays open and surfaces to the steward — NEVER auto-picked. Makes the empty AreaProduct layer load-bearing (lob-product-team.yaml OQ area-product-missing)"
    edge: "defined-mapping tier  [PROPOSED]"
  - n: 5
    element: "K2 fuzzy match policy (SEAL > FID > APP_NAME > ALIAS)"
    target: "DEMOTED to fallback for codes with no defined row; internal policy unchanged (2026-07-14 sign-off not re-opened); manual tier-5 pins unchanged"
    edge: "precedence within attribution  [PROPOSED]"
  - n: 6
    element: "Migration of live K2 job edges"
    target: "idempotent migrate cypher (migrate_develops precedent): job edges re-derive from folder edges or are re-written at the new grain; ALL properties kept; company re-runs T1 after"
    edge: "—  [follow-up commit, §F]"
  - n: 7
    element: "Orchestrator AUTHORSHIP (companion §G)"
    target: "the confirmed mapping act authors (:BusinessApplication)-[:USES_SOFTWARE]->(:SoftwareProduct {role: orchestrator}); the SEAL-declared batch_orchestrator string demotes to prefill; cardinality 1:N (modernization), so no uniqueness constraint"
    edge: "reg_uses_software — authorship + cardinality  [PROPOSED — SME direction 2026-07-27]"
  - n: 8
    element: "Port ACTIVATION (companion §G)"
    target: "Port.active is SME-DECLARED then CONFIRMED by the folder relationship — two states, not a boolean; today created false by seal_applications.cypher and never written true or read anywhere, so this act is its first writer"
    edge: "seal_has_port — activation semantics  [PROPOSED — SME direction 2026-07-27]"
provenance:
  - label: "application↔folder attribution (grain + shape under decision)"
    source_object: "NEW: steward-defined app-code mapping rows (no source system — the store IS the source of record until Control-M folder variables carry the value); FALLBACK: STG_APP_FACT (fact_type SEAL) via the K2 stream"
    key: "app_code (:ControlMApplication, per data center) → seal_id (tier 1) | area_product id (tier 2); folder edges derived via CONTAINS_FOLDER"
    loader: "drydocs/loaders/seal_attribution.py + .cypher (re-targeted at build) · mapping store ingest (O24 file-to-table pattern)"
    properties:
      - {name: grain, origin: derived, from: "SME 2026-07-22 (IDEAS.md top inbox item)", note: "folder→app; jobs inherit — corrects the K2 job-level grain"}
      - {name: authoring_key, origin: source, from: "CM_DEF_VJOB folder-header APPLICATION (:ControlMApplication)", note: "pos3-5 of the folder name is the bare app_code (folder_name.py); the property-diet rider on folder nodes is a SEPARATE decision, not this gate"}
      - {name: tier, origin: derived, from: "defined-mapping row kind: seal-born (1:1) | platform (1:many)", note: "explorer.controlm-app-codes.v1 already DERIVES the two patterns read-only from observed cardinality — this gate makes the authoritative rows"}
      - {name: origin_flag, origin: derived, from: "O24 pattern: every surfaced value flags defined | matched-fallback | override | manual-pin", note: "no silent replacement — side-by-side with the source value where one exists"}

sections:
  - title: "A. Grain — folder, not job"
    confirmations:
      - "A1: the attribution grain is FOLDER-level — (:ControlMFolder) carries the application edge; jobs inherit through CONTAINS_JOB and no per-job application edge is authored going forward (mapping n:1). The K2 job-level model is corrected, not extended."
      - "A2: the UI crosswalk (explorer.folder-applications.v1, currently derived through job edges) re-binds to the gated folder edge at build; until then it keeps deriving and says so."
  - title: "B. Authoring — the app-code DEFINED mapping replaces matching as primary"
    confirmations:
      - "B1: the authoring key is the Control-M APP CODE (:ControlMApplication). One defined row attributes every folder under that code via CONTAINS_FOLDER (mapping n:2)."
      - "B2: tier 1 (seal-born, 1:1 code→BusinessApplication) and tier 2 (platform, 1:many code→AreaProduct) are the two row kinds (mapping n:3–4). A folder under a tier-2/unresolved code SURFACES to the steward — never auto-picked."
      - "B3: the confirmed K2 match policy demotes to FALLBACK for codes with no defined row; its internals (one-to-one accept, coverage stamp, deterministic triage, tier-5 manual pins) are NOT re-opened (mapping n:5)."
  - title: "C. Target — what a tier-1 row points at"
    confirmations:
      - "C1 [pick one]: (a) the :BusinessApplication node directly [simplest; the app IS the attribution target] — or (b) the application's Batch :Port (dprod:Port, kind=BatchProcessing) [the SME phrase 'folder → batch :Port'; keeps batch attribution on the batch-facing port and leaves the app node to SEAL-record semantics; requires ports loaded for every attributed app]. Tier-2 rows target :AreaProduct either way."
      - "C2: the never-gated :Batch bridge from the pre-ontology architecture diagram (arch_contains_batch / arch_contains_folder, both planned, no loader) is RETIRED at this gate unless the SME names a live use for a distinct :Batch node — the defined mapping supersedes its role."
  - title: "D. Edge shape + PROV term (the surviving K3 §F question)"
    confirmations:
      - "D1 [pick one]: (a) LOCAL domain edge, prov_maps_to: ~ [AGENT RECOMMENDATION — 'folder belongs to this application' is a governance/containment fact; ControlMFolder (Collection⊑Entity) → app-as-Entity has no natural PROV verb; SCHEDULED_ON / reg_uses_software precedent; keeps app records out of PROV lineage walks]. Candidate label: ATTRIBUTED_TO_APPLICATION (or BELONGS_TO_APPLICATION — name at the gate). (b) prov:used — type-checks (Entity is a legal used target only from an Activity, so this forces keeping some job-side edge; disfavored). Role/props kept: role=seal_app_ref, first_seen_at, source, match_method(=defined|fallback-tier), last_seen_at."
      - "D2: whichever shape signs applies EVERYWHERE — loader edge, manual tier-5 writer (SUPPORTED_SHAPE), migration target. One shape."
  - title: "E. Steward overrides — 'manually overwritten until fixed'"
    confirmations:
      - "E1: mechanics reuse the O24 origin-flagged store verbatim: committed CSV in config/overrides/ (mechanism-only here; real rows company-side) → mapping.db table → /mappings console domain (steward persona); every surface shows ORIGIN; corrections feed the source-corrections report addressed to whoever owns the source fix (folder naming/variable in Control-M, or the SEAL record)."
      - "E2 [the precedence ruling — the ui-write-surface open question, scoped to THIS domain only]: DEFINED-mapping rows are graph-loadable source of record (there is no machine feed to defer to — refusing store-to-graph here means the mapping cannot exist). OVERRIDE rows (a per-folder exception where the code-derived value is wrong) load ONLY while status=active and carry origin=override on the edge; when the source system is fixed the row flips to corrected-in-source (kept for audit) and the derived value resumes. Confirm, edit, or reject this scoping — the GENERAL override-vs-precedence question for other domains (e.g. seal-contact-override) stays OPEN and is not decided here."
      - "E3: store rows never write the graph directly — the loader remains the only graph writer, ingesting confirmed store state (the 'loader stays the only graph writer' invariant from O20 is unchanged)."
  - title: "F. Migration + follow-through"
    confirmations:
      - "F1: live K2 job edges migrate idempotently to the ruled grain/shape, preserving every property; the company re-runs its T1 load after (edges MERGE idempotently)."
      - "F2: one logged change on sign-off: vocabulary entries registered/re-shaped (folder edge, tier-2 edge, :Batch retirement per C2); map entries app-code-defined-mapping + job-seal-app-ref updated; new mapping-store domain + K2_SHAPE update in drydocs_api/mappings.py; manual-loads template rekeyed to app_code; explorer specs re-bound; drift guards green; transcription to config/gate-log.md; gates.json regenerated."
  - title: "G. COMPANION (v3, 2026-07-27) — the mapping ACT: orchestrator authorship, port activation, and the Product→Application cascade"
    confirmations:
      - "G1 [the act is ORCHESTRATOR-FIRST]: the steward picks the orchestrator (Control-M | AutoSys | future) BEFORE the folder/entity filter, and THAT choice is what authors (:BusinessApplication)-[:USES_SOFTWARE]->(:SoftwareProduct {role: orchestrator}) — the edge is created BY the confirmed mapping, never derived from a declaration (mapping n:7). Sections A–F above are Control-M-shaped; this generalizes the ACT so AutoSys drops in as a sibling domain without re-opening the grain ruling. Confirm that the orchestrator edge is authored here, and that the entity filter is scoped to the picked orchestrator."
      - "G2 [the SEAL-declared string demotes to PREFILL]: batch_port_orchestrator (C14) today writes USES_SOFTWARE {source: 'batch-port'} straight from the SEAL batch_orchestrator string via the platforms.yaml crosswalk, with NO SME confirmation anywhere in the path. Under G1 that string PREFILLS the picker and the confirmed mapping is the authority — the same demotion B3 applies to K2 matching, and the same correction already made when HAS_APPLICATION stopped being written from the PAT team row's application ids (mis-attribution, cleaned by migrate_pat_alignment_c9.cypher — the precedent to copy). RULE the existing edges: re-sourced on confirmation, or kept with origin=declared until a confirmation supersedes them?"
      - "G3 [orchestrator cardinality is 1:N — SME direction 2026-07-27]: an application may use MORE THAN ONE orchestrator — 1:1 today, 1:2 / 1:3 as platforms are modernized and workloads move off the incumbent. Three consequences: (a) NEVER a uniqueness constraint on the orchestrator edge — the TOM-roles lesson, a cardinality rule is a graph-TEST not a constraint; (b) the DECLARED side is structurally 1:1 today (batch_orchestrator_raw is a scalar property and the adapter yields one row per app from one taxonomy field) and must become multi-valued before G2 can prefill honestly; (c) mid-migration is a NORMAL state, not a conflict — the UI and every coverage report must show N orchestrators without flagging drift."
      - "G4 [port activation — SME direction 2026-07-27]: Port.active is SME-DECLARED, then CONFIRMED when the relationship to the folders is created. That is TWO states, not a boolean flip. Confirm the property shape (active + active_state declared|confirmed + declared_by/at + confirmed_by/at/run_id, or a separate state property) and confirm that a declared-but-unconfirmed port is visibly distinct from a confirmed one on every surface. THE TWO SIDES DIFFER HERE — read G4-RIDER before answering."
      - "G4-RIDER [corrected 2026-07-27 from the company initial-load runbook — this ruling is NOT greenfield]: producer-side both ports are created active=false (seal_applications.cypher, ON CREATE SET) and nothing writes true or reads the flag. COMPANY-SIDE THERE IS ALREADY A WRITER: the app-code link step marks the :BusinessApplication's BatchProcessing port active when Control-M app codes are joined to SEAL applications, which runs only after both the application nodes and the Control-M jobs exist. Three consequences the gate must answer rather than assume. (a) There IS legacy state to migrate company-side — §F cannot treat this as greenfield. (b) Activation is currently DERIVED from the app-code link, so the SME's declared-then-confirmed model is a CHANGE to live behaviour, not a formalization of it: rule what happens to ports already active by derivation — grandfathered as confirmed, or re-declared? (c) The company already separates the two acts exactly as G1 proposes — the app-code step marks the port and explicitly does NOT write the orchestrator edge, leaving that to the C14 loader — which is corroboration for G1, and means the split is the established shape rather than a new one."
      - "G5 [G4 and C1 must sign CONSISTENTLY]: if C1 signs (b) — the folder attaches to the BatchProcessing :Port — then 'the relationship to the folders is created' IS that edge, and confirmation is derivable with no separate trigger, which is close to what the company already does through the app-code link (G4-RIDER). If C1 signs (a) — the folder attaches to the app node — then NOTHING touches the port and the confirmation trigger must be named explicitly, AND the company's existing derivation has to be re-pointed or retired. Also rule the EVENT port: it has no Control-M analogue, so name its confirming evidence or rule it declared-only until an event source is onboarded."
      - "G6 [the cascade's third picker is a BACK-FLOW, not a build]: the act is Product Line → Product → Business Application → [orchestrator, G1] → filter of available folders → folder (matched on the internal folder naming-convention pattern) → SME check/approval + notes capturing SME user and date. The third picker traverses (:Product)-[:HAS_APPLICATION]->(:BusinessApplication) [SME-named 2026-07-27]. PRODUCER-SIDE that is catalog_has_application — status: planned, loader: ~ — held there by the C9 note 'stays planned until a product-scoped extract is onboarded'. COMPANY-SIDE that precondition is ALREADY MET: a product-scoped extract feeds a dedicated loader and the edge is ACTIVE in the schema graph (reviewed 2026-07-27). So this is a divergence/back-flow item, not new build. Two riders: (i) the two sides word the SEMANTICS differently — producer 'Product owns a set of SEAL-registered applications' vs company 'a structural SUPPORT link: a Product is supported by 2+ applications, front-end/back-end' — rule ONE reading, because the picker means a different thing under each; (ii) the edge is 1:many BY DESIGN on both sides (the source extract's application-id column is multi-valued), so the picker returns a LIST, never a single application."
      - "G6-RIDER [the FIRST picker is the one without a key — added 2026-07-27 after reviewing the source report structure]: the cascade's Product and Area-Product grains are ID-keyed at source, but the PRODUCT LINE grain is NAME-ONLY — the team extract carries Product Line and Sponsoring Product Line as names with no id column, while Product / Supporting Area Product / Sponsoring Area Product / Sponsoring Product all carry ids. Our :ProductLine node key is product_line_id (REQUIRED), so this extract cannot feed product lines by key at all. RULE how picker 1 resolves: (a) a product-line-scoped extract supplies the id before the screen ships, or (b) the picker resolves name -> id against the already-loaded :ProductLine set and REPORTS ambiguity rather than guessing (the coverage-policy rule). Do NOT let a name become the de-facto key — renames and near-duplicates would silently re-point a confirmed mapping, which is the one failure this whole gate exists to prevent. Two related source facts to confirm while the SME is here: area_product_id in the row model is UNQUALIFIED though the report splits Supporting from Sponsoring (and a sibling report carries a plain unqualified Area Product, so the qualification is report-specific), and Sponsoring Product Line is a THIRD sponsoring form beyond C9 §d's two — name-only and unmodeled."
      - "G6-RIDER-RESOLVED [SME-answered 2026-08-01, built as C17 — this rider is CLOSED; the rest of §G is not]: the SME supplied the decisive source fact — on the company side LoB, Sub-LoB, Product Line, Product and Area Product EACH carry a numeric ID field. So the rider's premise was a REPORT artifact, not a source limitation: the product-line grain is id-keyed at source and the team report simply does not project the column. Option (a) therefore wins outright — a product-line-scoped extract supplies product_line_id before the screen ships — and option (b), name -> id resolution, is NOT adopted as the mechanism; it survives only as a bounded migration path for extracts already captured without the column, and even then must report ambiguity counts rather than pick. Corroborated independently by internal/fcdo-reference (the PAT-catalog artifact described as a 5-level hierarchy with 'native IDs at each level') and by the company's own 5-field pat_lob_sublob_productline.csv, which is an extract AT that grain. Two riders answered with it: area_product_id in the row model is the SUPPORTING area product (Sponsoring rides sponsored_area_product_id; the two are co-populated, so cypher 3a/3b firing independently is correct), and Sponsoring Product Line — the third sponsoring form — is ruled OUT OF SCOPE while it is name-only, becoming modellable the day the extract carries a sponsoring product-line ID. NOT decided here: the unmodelled :SubLOB grain the same SME fact reveals (we model no Sub-LOB at all) is an ontology decision and stays with the parked company-catalog back-flow item."
      - "G7 [write path unchanged]: E3 applies verbatim — the screen drafts a mapping-store row and the LOADER stays the only graph writer. The SME check/approval + notes/user/date ARE the O13 mandatory-rationale and lifecycle chips (draft → submitted → gated → loaded); they become the confirmed edge's provenance (origin, confirmed_by, confirmed_at), which is also what satisfies G4's confirmation stamp. Define 'available folders' for the filter: unmapped only, naming-pattern match, or both."
  - title: "H. Sign-off"
    confirmations:
      - "SME sign-off recorded here and transcribed to config/gate-log.md with per-item outcomes (A1–A2, B1–B3, C1–C2, D1–D2, E1–E3, F1–F2, G1–G7 incl. G4-RIDER and G6-RIDER)."
