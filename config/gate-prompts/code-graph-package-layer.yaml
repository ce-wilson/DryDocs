        note: "loaded as a FACT, not used as a filter. This is the §C3 precedent applied ('load what the scanner concluded; a later query disagreeing is itself a signal') and it is what makes the namespace-package case VISIBLE rather than silently dropped"
      - name: distribution
        origin: derived
        from: "membership in pyproject.toml [tool.poetry] packages — SIX: drydocs, drydocs_core, drydocs_remediation, drydocs_lineage, drydocs_deepdoc, drydocs_api"
