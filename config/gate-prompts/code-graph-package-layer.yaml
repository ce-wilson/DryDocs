      - name: project
        origin: source
        from: "node.project of its children — one of the SEVEN scan roots"
        note: "carried for the same reason :CodeModule carries it, and because §C5's second-project-tree trigger applies identically to a package key. This gate does NOT resolve C5 and must not make it worse"
  - label: "CodeModule (EXISTING — what changes, and what does not)"
    source_object: "the `nodes` array — 238 in the newest snapshot; 210 currently in the graph (loaded at commit f76dbb1, 2026-07-28)"
