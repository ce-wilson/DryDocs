    loader: "code_snapshot (same)"
    properties:
      - name: file_id
        origin: source
        from: "node.file_id — unchanged, still the IMPORTS join key"
        note: "explicitly restated so the re-open cannot be read as touching it: all 376 IMPORTS edges and all 210 file nodes survive every option on this page"
