  - n: 1
    element: "Package level"
    target: "(:CodePackage) between :Project and :CodeModule — the level the parent gate called 'most faithful' at §B1(c) and declined on cost"
    edge: "new node class  [DECISION — §C1]"
  - n: 2
    element: "Package IDENTITY — the hard one"
    target: "how a package is recognised OFFLINE. __init__.py presence is UNSOUND: drydocs_core/schema has none and is a live PEP 420 namespace package"
    edge: "derivation rule  [DECISION — §C2]"
  - n: 3
    element: "Package NESTING"
    target: "(:CodePackage)-[:HAS_PACKAGE]->(:CodePackage) — depth reaches 3 today (drydocs_core/orchestration/controlm). Without it, S2's parent/child act is unrepresentable"
    edge: "new edge  [DECISION — §C3]"
  - n: 4
    element: "__init__.py identity"
    target: "16 nodes that are packages wearing file identity. Proposed: keep the file node, ADD (:CodeModule)-[:DEFINES_PACKAGE]->(:CodePackage)"
    edge: "new edge  [DECISION — §D2]"
  - n: 5
    element: "HAS_MODULE re-pointing"
    target: "u1_has_module from_node changes Project -> CodePackage under §C1(b). The registry entry at relationship_vocabulary.yaml:2226 is REVISED, not added"
    edge: "vocabulary change  [DECISION — §E1]"
  - n: 6
    element: "tests/ — 45% of the graph"
    target: "107 of 238 files are tests/unit. `tests` is NOT a poetry package and its root has no __init__.py; tests/unit and tests/integration ARE packages"
    edge: "scope rule  [DECISION — §F1]"
  - n: 7
    element: "Scan-root drift"
    target: "the parent gate ruled on SIX scan roots; there are SEVEN (drydocs_api is absent from its §B1 text). Roots went 2 -> 7 across 101 snapshots"
