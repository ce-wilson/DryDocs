# SME gate-prompt spec — CODE GRAPH, LEVEL TWO: does the PACKAGE become a node?
#
# REVISED v2 2026-08-02 — THE SCANNER CHANGED UNDER THIS PAGE, same day it was drafted.
# SME direction: "update the scanner to pull all files, so that we can create the tree.
# the old dep snapshots can be removed this was the intent." Acted on immediately, so
# several facts below are now HISTORY rather than current state. Read this block first;
# every section still stands, but three of them are answered differently now.
#
#   WHAT CHANGED IN THE ARTIFACT. snapshot.ps1 now scans the WHOLE REPO by default
#   (the roots list moved behind -CodeOnly). One snapshot survives — the 101-file dated
#   series and both tree one-offs were removed, which is what the direction's "this was
#   the intent" refers to. The artifact went 238 .py nodes -> 1457 files + 251
#   DIRECTORIES + 1956 CONTAINS, with import edges 376 -> 458. New U9 post-processing
#   step drops git-ignored paths (649 of them, mostly .ruff_cache): depgraph excludes
#   .git and .venv but knows nothing about .gitignore, and build caches are not the
#   project.
#
#   §G1 IS REVERSED, by direction. The loader refused `meta.tree: true`; every snapshot
#   is now tree-shaped, so that ruling would refuse all input. It refused loudly rather
#   than loading nothing, which is the one thing that ruling got permanently right. The
#   half that SURVIVES is the `meta`-present assertion — the headerless one-offs would
#   pass a truthiness test on meta.tree, so it stays POSITIVE.
#
#   §G3 IS PARTLY OVERTAKEN. Directory structure was ruled out as "a second capability";
#   the artifact now carries it. It is NOT yet in the graph: the loader SKIPS kind:'dir'
#   nodes and counts them, because :Directory is a new node class and CONTAINS a new edge
#   type, and neither may be invented by a loader (CLAUDE.md §6). §C1/§C3 are therefore
#   still live decisions — but they get EASIER, because the tree no longer has to be
#   derived from path strings. §C2 in particular is now mostly moot for identification
#   (directories are nodes in the artifact) and survives only as "WHICH directories are
#   packages", where §B2's namespace-package finding still bites.
#
#   TWO DEFECTS FOUND AND FIXED WHILE SWITCHING MODES, both live-verified:
#   (1) KEY FORK. The tree scan's project segment is the REPOSITORY, not a package, so
#       file_id came through as 'drydocs/drydocs/cli.py' against the roots scan's
#       'drydocs/cli.py'. Loaded raw it produced TWO nodes for one file, side by side,
#       neither swept — silently breaking §C2's ruled key and every stored reference to
#       it. The adapter now strips the project prefix in tree mode, so a mode switch
#       merges instead of forking.
#   (2) `project` LOST ITS MEANING. It was "the scan root, one of six" — a concept that
#       existed only because the scanner took a hand-maintained root list. Whole-repo
#       scanning has no scan roots, and the raw field reads 'drydocs' for every node.
#       It now carries the first path segment, with repo-root files as '.' rather than
#       being labelled a scan root named after themselves. This is exactly §B1's drift
#       argument arriving: the hand-maintained list is gone, and what replaces it is a
#       path segment, which is NOT a package — which is what §C exists to fix.
#
# RE-OPENS exactly three confirmations of self-documentation-code-graph (SIGNED OFF
# 2026-07-27, 36/36): §B1 (one root, scan roots as a property), §B2 (the HAS_MODULE
# name) and §C4 (__init__.py loads as an ordinary node). NOTHING ELSE from that gate
# is re-opened — §A2 target database, §C1/§C2 file-grain and the file_id key, §D1/§D2
# IMPORTS and its limits, §E1 the SWO binding, §F1 the :SoftwareProduct collision rule,
# §G1 the meta.tree discriminator, §H1-§H6 mechanics all STAND. This page is additive:
# it proposes a level ABOVE the file, and does not touch the file level that works.
#
# WHY RE-OPEN A GATE THAT SIGNED CLEAN. Not drift, and not a defect in the ruling —
# the original gate NAMED this cost in writing and took it deliberately. §C1: "Accepted
# cost of (a), recorded not hidden: the label says 'module' while the thing is a file."
# §B1 offered option (c) — "TWO LEVELS — one :Project umbrella plus six :CodePackage
# children" — described it as "most faithful", and declined it on COST (a fifth new
# class, growing §F's collision surface), not on correctness. A recorded, accepted cost
# that is later felt is precisely what a re-open is for. The trigger was an SME reading
# of the live graph on 2026-08-02: "this relationship :HAS_MODULE is overused ... I
# thought module described the next highest group under the project."
#
# *** THE PART THE SME SHOULD READ FIRST ***
# The re-opening question was posed with an inverted vocabulary, and the correction
# MATTERS because it changes what is being asked for:
#
#   "every .py including .init can't be a module can it?"  —  IN PYTHON, IT CAN.
#   A module is what `import` binds; drydocs/cli.py IS the module drydocs.cli. So
#   :CodeModule on 210 files is NOT a category error and §C1 does not need revisiting.
#   The level the question points at — drydocs, drydocs_api, drydocs_lineage — is the
#   PACKAGE (a module carrying __path__). Packages are also modules, which is why the
#   word felt overloaded; but the missing level has its own name, and it is not "module".
#   THE ONE PLACE THE MODEL IS FACTUALLY WRONG is __init__.py: drydocs/__init__.py is
#   not a module named __init__ — executing it IS the package drydocs, whose __name__
#   is "drydocs". Sixteen nodes sit as flat peers of cli.py while being packages. §D.
#
# AND THE KILL-ARGUMENT FROM §C1 DOES NOT APPLY HERE. That argument ("true module-grain
# collapses file identity into package identity fifteen times over and loses the ability
# to say 'this file imports X'") killed REPLACING file nodes with dotted-module nodes.
# This page proposes no such replacement. Every file node, every file_id, and all 376
# IMPORTS edges survive untouched; a level is ADDED above them. §C1's argument is silent
# on that, and §D3 below is where the one lossy variant is offered and recommended against.
#
# FOUR PREMISE FINDINGS, all from opening the artifacts while drafting (§B). Two of them
# reshaped this page rather than decorating it: the scan roots have drifted 6 -> 7 since
# the ruling was written, and `__init__.py` presence is NOT a sound package test — one
# live, production-imported package in this repo has no __init__.py at all.
#
# Mechanism-only, and for the same reason as the parent gate: every value on this page is
# our own repo-relative path. There is no company data in a code snapshot.
classification: Internal-Public
schema: drydocs.gate-prompt.v1
id: code-graph-package-layer
title: "SME Gate — Code graph level two: does the PACKAGE become a node, how is a package identified when __init__.py is not a sound test, and what does HAS_MODULE mean once there are two levels"
step: "Re-opens self-documentation-code-graph §B1/§B2/§C4 only — adds a package level above the file level, rules how packages are identified offline, and settles the edge naming before a second orchestrator or a second project tree makes it expensive"
summary: >
  The code subgraph is live and flat: ONE (:Project {project_id:'drydocs'}) with 210
  HAS_MODULE edges to 210 file nodes, no exceptions, plus 376 IMPORTS. The file level
  is correct and this gate leaves it alone. What is missing is the level between them —
  the PACKAGE — and its absence now costs three concrete things.
  (1) THE EDGE CARRIES NO INFORMATION. HAS_MODULE is TOTAL: every :CodeModule has one,
  from the same source node. §F2 justified it as the one-hop "is this our own code?"
  test, but `MATCH (m:CodeModule)` answers that in ZERO hops. An edge that is total and
  1:1 with a label conveys exactly what the label conveys, while occupying a name that
  promises structure. It only begins to partition anything under the §B3 second-root
  scenario, which has not happened.
  (2) THE GRAPH CANNOT EXPRESS WHAT THE CODE JUST DID. S2 (ADR 0008, 2026-08-01) created
  drydocs_core/orchestration/ for the express purpose of being a PARENT to controlm/ so a
  second orchestrator has somewhere to land. In the graph those are eight sibling files
  and four sibling files with no relationship whatsoever. The single most deliberate
  structural act of the week is invisible.
  (3) SIXTEEN NODES ARE MISTYPED. __init__.py is not a module; it is what makes its
  DIRECTORY a package.
  WHAT IS GENUINELY HARD is not whether to add the level but HOW TO IDENTIFY ONE OFFLINE
  (§C2): __init__.py presence is unsound (drydocs_core/schema is a live PEP 420 namespace
  package with none, imported by drydocs/cli.py), "any directory with a .py" wrongly
  promotes the tests/ root, and importability is correct but would execute imports at scan
  time, destroying the offline+deterministic property §H1 guarded. §C2 is the real decision
  on this page; everything else follows from it.
