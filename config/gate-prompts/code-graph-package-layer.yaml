provenance:
  - label: "CodePackage (NEW node — proposed §C1(b))"
    source_object: "knowledge/depgraph-snapshots/drydocs-*.json — DERIVED from the `nodes` array; the artifact carries NO package record of its own. Optionally pyproject.toml [tool.poetry] packages under §C2(c)"
    key: "PROPOSED package_id = the directory path, repo-relative ('drydocs_core/orchestration/controlm'). Chosen to mirror §C2's file_id reasoning: structural, deterministic, already the prefix of every file_id it contains"
    loader: "code_snapshot (EXTENDED — no new verb; the same `drydocs load-code-snapshot` run)"
    properties:
      - name: package_id
        origin: derived
        from: "os.path.dirname(node.file_id) over the nodes array — 20 distinct values in drydocs-20260802.json"
        note: "NOT a filesystem walk. It is derived from files the scan already emitted, which is what keeps §H1's offline+deterministic property intact and keeps §G3 (no directory structure) distinguishable — an empty directory can never appear here"
      - name: import_name
        origin: derived
        from: "package_id with '/' -> '.' — 'drydocs_core.orchestration.controlm'"
        note: "the dotted name Python actually binds. §C1's kill-argument was about REPLACING file identity with this; carrying it as a package property costs nothing and loses nothing"
      - name: has_init
