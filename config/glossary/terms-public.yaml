- acronym: DRY
  senses:
  - term_id: urn:drydocs:term:technical-domain:DRY:1
    scope: technical-domain
    pref_label: Don't Repeat Yourself
    alt_labels:
    - DRY principle
    definition: 'Software-engineering principle (Hunt & Thomas, The Pragmatic Programmer): every piece
      of knowledge has a single, unambiguous, authoritative representation within a system. The name DryDocs
      takes its first syllable from it — one ledger per fact, derived views never hand-maintained.

      '
    does_not_mean: []
    correlates_to:
    - project-name
    evidence_ref:
    - standard:https://en.wikipedia.org/wiki/Don%27t_repeat_yourself
    confidence: confirmed
    confirmed_by: user
    confirmed_on: 2026-08-21
