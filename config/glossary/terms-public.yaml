# Business glossary — PUBLIC terms (Internal-Public / External sources). Shape: schema.yaml (drydocs.glossary.v1).
# Only senses whose expansion and source are public belong here; everything company-specific goes to
# internal/glossary/terms.yaml. First entry added 2026-08-21 by user ruling (the scaffold G34 defined none).
#
# BULK ADDITION 2026-08-25 (user direction: "scan it for acronyms with a goal of adding them to our
# list"): the glossary section of the JPMorgan Chase 2025 Annual Report — a PUBLIC External source —
# extracted mechanically (pypdf over the Glossary of Terms and Acronyms pages) and added as
# confidence: candidate, one sense each. NOTHING here is SME-confirmed; a candidate sense is a
# starting point for decoding a token, never an assertion about what a DryDocs surface means.
# Org-unit acronyms (AWM, BWM, CB, CCB, CIB, JPMS*) carry scope business-domain; the rest industry.
# The source PDF is local and gitignored; the citation names the public document, not the file.
#
# SECOND PASS 2026-08-25 (user direction: "one more pass for the CCB sections in 2024 -- Home & Auto
# lending terms"): the 2025 glossary already carried the home-lending core (ARM, CLTV, FHA, HELOC,
# LGD, LTV, MBS, MSR, PD, REO, VA). Four additions from the 2024 report: TDR (formally defined
# there, deliberately dropped from the 2025 glossary), UPB and GSE (defined/expanded inline in the
# body, never in either glossary), and FICO (heavily used, NEVER expanded -- a brand name; flagged
# as such in its definition). GPCC (general purpose credit card) also surfaced in the CCB pages but
# is card lending, outside the home-and-auto ask -- noted here so the exclusion reads as a decision.
# Fannie Mae / Ginnie Mae ARE in the report glossaries but as PHRASE keys, not acronyms (no FNMA/
# GNMA entries exist), so they stay out of an acronym-keyed list.
#
# THIRD PASS 2026-08-25 (user direction: the CCB Credit Cards space + add GPCC): GPCC lands with its
# 2024 footnote definition (excludes private label and Commercial Card). The card sweep also exposed
# an EXTRACTION MISS in the first pass: six glossary entries sit mid-line after PDF text-join and the
# line-start anchor never saw them -- FDM (the SUCCESSOR to TDR, which pairs with the TDR entry
# above), GAAP, LTD, VaR, GSE(s) and CROs. Four added, GSE's sense upgraded to the glossary's own
# definition, CROs skipped as a plural variant of the existing CRO. Card-context terms surveyed and
# deliberately NOT added: ACH/RTP/ATM (payments rails, not card lending), CAGR (chart metric), SAR
# (Hong Kong Special Administrative Region in this report, not suspicious-activity-report).
