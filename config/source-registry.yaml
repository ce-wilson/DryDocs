# =============================================================================
# config/source-registry.yaml — every data-pipeline source, declared once.
#
# Each entry binds a SOURCE to: its orchestrator (Tier-2 vendor), its adapter,
# the taxonomy it feeds, and its crosswalk-confirmation state. Loaders and the
# `pipeline-config` agent read this; nothing loads until `confirmed: true`.
#
# REQUIRED on every entry (enforced by tests/unit/test_classification.py):
#   classification — one of config/classification.yaml levels (sensitivity / publish tier)
#   source         — the system/path the data comes from
#   (External sources additionally need source_url + captured_at)
# =============================================================================

schema: drydocs.source-registry.v1
updated: 2026-07-09

sources:
  # ---- Orchestration metadata (Tier-2 vendors) -----------------------------
  - id: controlm-psgmgr
    classification: Internal            # operational scheduling metadata; not for public GitHub
    source: "oracle:psgmgr.CM_* objects"
    kind: orchestration
    orchestrator: bmc-controlm          # baseline — no crosswalk needed
    adapter: oracle                     # OracleAdapter over psgmgr.* views
    # locator — granular source coordinates (SEAL app → platform → service →
    # schema → objects). Mechanism committed here; REAL values (SEAL id, DB
    # service/TNS name) are Internal-Confidential and live only in the
    # internal/ twin + connection env (internal-local/) — the publish
    # boundary is why a public "test Oracle container" is never needed.
    locator:
      application: ~                    # SEAL id of the owning application — internal/ twin only
      source_product: controlm          # what the data IS  — config/taxonomy/software-registry.yaml product id
      platform: oracle-db               # what CARRIES it   — software-registry product id (the replica's DB)
      service: ~                        # DB service/TNS — connection env (internal-local/), never committed
      schema: psgmgr                    # established public vocabulary
      mapping: config/source-mappings/controlm-psgmgr.yaml   # object/column ledger
    feeds_taxonomy: [folders, jobs, conditions, dependencies, variables, hosts, runtime_stats]
    confirmed: true
    notes: >
      Live. The canonical structural-lineage feed. See README §Control-M
      lineage. CM_HOSTS (host-group membership) added 2026-07-09 via the
      add-source-object walkthrough; gate controlm-hosts-topology SME-confirmed
      same day (config/gate-log.md) — staging-only until the hosts loader +
      RUNS_ON resolution pass ship (P3/P4 residual verifications first).
      CM_AVG_RUN (runtime stats) added 2026-07-09 same walkthrough — gate
      controlm-avg-run-supplement AWAITING SME; property supplement onto
      :ControlMJob, no new vocabulary.

