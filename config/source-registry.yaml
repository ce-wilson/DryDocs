  # ---- Internal reference data (Tier-3 confidential) -----------------------
  - id: seal-extract
    classification: Internal-Confidential   # real applications, ownership, employees, SEAL ids
    source: "SEAL extract (internal)"
    kind: internal
    orchestrator: ~
    adapter: csv                        # CsvAdapter (samples) / internal extract in prod
    feeds_taxonomy: [applications, ports, memberships, roles, employees]
    confirmed: true
    notes: "Live. SEAL applications + ownership."

  - id: catalog-pat
    classification: Internal-Confidential   # real LOB→Product→Team rosters, team names, SEAL ids
    source: "PAT/Catalog extract (internal): catalog hierarchy + the PAT team report"
    kind: internal
    orchestrator: ~
    adapter: csv
    locator:
      source_product: pat                 # the Product Agility Tool (internal catalog UI)
      extract: ~                          # real report path/export coordinates — internal/ twin only
      mapping: ~                          # team report: team_id, lob, seal_ids (1..n), jira board,
                                          # team_type/relationship, status, agile framework — REAL
                                          # rows (SEAL ids, team names, rosters) never committed here
    feeds_taxonomy: [lob, product_lines, products, area_products, dev_teams, team_applications]
    confirmed: true
    notes: >
      Live. LOB→Product→Team catalog (lowest precedence authority). C9 gate
      (2026-07-18): the PAT team report added as the team_applications feed —
      team-scoped seal_ids populate the ACTIVE arch_develops edge; alignment
      (supporting area product, else product) is VOLATILE and relationship-typed
      (dedicated|aligned|flex), swept per team on each load; sponsoring product/
      area-product are distinct sponsored:true edges. SME evidence held
      in-session (screenshots, Internal-Confidential — not committed).

  # ---- Reference ledgers (repo-committed, publishable) ----------------------
  - id: software-registry
    classification: Internal-Public     # DryDocs' own stack only; no company catalog rows
    source: "config/taxonomy/software-registry.yaml"
    kind: reference
    orchestrator: ~
    adapter: yaml                       # RegistryYamlAdapter (flattens vendors/products)
    feeds_taxonomy: [vendors, software_products]
    confirmed: true                     # SME gate 2026-07-07 (ADR 0004; config/gate-log.md)
    notes: "Third-party software registry (plan 07). Vendor = brand only; graph is the lookup."

  # ---- Docs corpora (converted documentation → lexical graph) ---------------
  - id: bmc-docs
    classification: External             # public BMC documentation, converted; cite source_url per doc
    source: "external/orchestration/bmc-controlm/controlm-*.md (26 converted BMC pages; SOURCE-MANIFEST.md = provenance model)"
    source_url: "https://documents.bmc.com/ (per-doc URLs in each file header)"
    captured_at: 2026-06-11
    kind: docs
    orchestrator: ~
    adapter: markdown                    # BmcDocsAdapter (H2 chunking, manifest tier rule)
    feeds_taxonomy: [documents, chunks]
    confirmed: true                      # gate bmc-docs-lexical-load SME-accepted 2026-07-08 (config/gate-log.md)
    gate_spec: config/gate-prompts/bmc-docs-lexical-load.yaml
    notes: >
      The converted BMC docs corpus loaded as the llm-graph-builder LEXICAL graph
      (Document -> Chunk chains) with per-chunk provenance tier
      VERBATIM|GROUNDED|SYNTHESIZED per the SOURCE-MANIFEST default rule —
      SYNTHESIZED chunks are Claude inference, never vendor ground truth (the
      two-corpus rule). Software-ontology hook: (Document)-[:DESCRIBES
      {target_version}]->(SoftwareProduct controlm); load ORDER: the software
      registry loads first (DESCRIBES MATCHes the product, never MERGEs it).
      NOT a source-of-record (the XML-format acquisition stub tracks the real
      9.0.21.300 config SoR). User-directed 2026-07-08: the local EE DB carries
      only sample Control-M data, so this corpus is the demonstrable content.

  - id: essential-graphrag
    classification: External             # published Manning/Neo4j-sponsored ebook; the PDF is LOCAL-ONLY (gitignored) — cite source_url, never commit
    source: "Essential-GraphRAG.pdf (repo root, gitignored local copy of the published ebook; Bratanič & Hane, Manning 2025, 179 PDF pages)"
    source_url: "https://www.manning.com/books/essential-graphrag"
    captured_at: 2026-07-14
    kind: docs
    orchestrator: ~
    adapter: pdf                         # EssentialGraphragAdapter (pdf-lexical-v1: deterministic chapter/section chunking via pypdf)
    feeds_taxonomy: [documents, chunks]
    confirmed: true                      # Q2 groom decision 2026-07-16 (user-directed experiment): pure REUSE of the ACTIVE docs_* lexical vocabulary — no new edge meaning, so the covering gate is bmc-docs-lexical-load (2026-07-08); no new gate session required
    notes: >
      The Q2 experiment corpus (backlog Q2, Epic Q / phase 14): the Essential
      GraphRAG ebook loaded as a Document -> Chunk lexical graph for
      agent-traversal testing, feeding the docmeta P0 benchmark verdict
      (traversal arm). Target DB = ddcontext (execution decision recorded in
      backlog Q2 notes: experiment/reference content stays out of the
      ground-truth drydocs DB; matches the user's "our own unstructured
      context graph" phrasing and the jpmc-reports ddcontext precedent).
      Every chunk is tier GROUNDED (pdf-extract-grounded-v1: pypdf extraction
      is mechanical but lossy). The bmc_docs DESCRIBES hook is deliberately
      omitted — the book describes a methodology, not a registry
      SoftwareProduct, and ddcontext carries no product nodes. Pattern notes
      mined from the same book: reference/research/essential-graphrag-notes.md (Q1).

  - id: design-docs
    classification: Internal-Public      # repo-native authored design docs; an individual doc self-declares its own class (the startup runbook says Internal in its front-matter) — the graph carries structure + text as committed, nothing beyond what the repo already holds
    source: "docs/design/*.md (drydocs.doc-outline.v1 anchors + traceability matrices) + docs/design/feedback/<doc-id>-rev<N>.yaml (drydocs.design_doc.feedback_yaml)"
    kind: docs
    orchestrator: ~
    adapter: markdown                    # DesignDocSectionsAdapter / TraceabilityMatrixAdapter / DesignDocFeedbackAdapter (drydocs/loaders/doc_traceability.py)
    locator:
      mapping: config/source-mappings/design-docs.yaml   # field ledger (three parse streams)
    feeds_taxonomy: [design_docs, doc_sections, requirements, components, test_cases, feedback_notes]
    confirmed: true                      # gate doc-traceability-feedback signed off 2026-07-20 (config/gate-log.md; all 21 confirmations)
    gate_spec: config/gate-prompts/doc-traceability-feedback.yaml
    notes: >
      L7 connector #1 ("tenant 0" — the SaaS app documenting itself): the
      PRODUCT-PLANE documentation ontology validated on DryDocs' own Epic L
      artifacts. Three-pass load (`drydocs load-doc-traceability`): sections ->
      matrix star (SPECIFIED_IN / IMPLEMENTED_BY / VERIFIED_BY off
      :Requirement) -> feedback notes (ANNOTATES + lifecycle status +
      attribution only when the author resolves to a real :Employee). Keys are
      source-namespaced (origin = drydocs-design-docs). Future connectors
      (Jira, Gherkin/BDD, BRD — the incremental-context-loop plan) register as
      their OWN source entries feeding the same classes, each through its own
      gate.

