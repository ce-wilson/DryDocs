    kind: orchestration
    orchestrator: airflow
    adapter: ~
    feeds_taxonomy: [folders, jobs, conditions, dependencies]
    confirmed: true                     # gate airflow-crosswalk SIGNED OFF 2026-07-14 (config/gate-log.md); loader still unbuilt + separately gated
    crosswalk: config/crosswalks/airflow-to-bmc.yaml
