  # ---- Staging semantic-fact streams (C3/C4 variable normalization) --------
  - id: stg-app-fact
    classification: Internal             # mechanism-only entry; no real SEAL/FID/app-name values here
    source: "oracle:DRYDOCS_STG.STG_APP_FACT (Python normalizer output over CM_DEF_SETVAR_VW)"
    kind: staging
    orchestrator: ~                      # not an orchestration vendor — a staging table fed by the C3/C4 variable-normalization stream
    adapter: oracle
    feeds_taxonomy: [applications]       # semantic facts attribute a ControlMJob to an Application (SEAL)
    confirmed: true                      # gate seal-attribution-match-policy SIGNED OFF 24/24 (2026-07-14, config/gate-log.md) — the entry's own activation condition
    gate_spec: config/gate-prompts/seal-attribution-match-policy.yaml
    loader: drydocs/loaders/seal_attribution.py   # built with the flip (K2); cypher seal_attribution.cypher
    notes: >
      Registered per K1's flag (docs/restructure/backlog.yaml Epic K): job.APPLICATION
      (CM_DEF_VJOB) is NOT reliable SEAL identity — the SEAL-attribution feed is this
      table's semantic facts instead. Rows carry fact_type in {SEAL, FID, APP_NAME,
      ALIAS, ...} + fact_value, one row per (run, job, fact_type) — see
      docs/controlm-staging-ingestion-flow.md (STG_APP_FACT ER block) and
      docs/reviews/sdlc-oracle-ingestion.md §FR-OI-007. Feeds the now-ACTIVE
      m3_seal_app_ref mapping (WAS_ASSOCIATED_WITH, role seal_app_ref,
      drydocs_core/ontology/relationship_vocabulary.yaml) and the confirmed
      taxonomy-ontology-map.yaml entry (job-seal-app-ref). Mechanism-only
      here — no real SEAL id / FID / application-name values, column/fact-type names
      only. ACTIVATED 2026-07-14 with the K2 loader build: the match-policy gate
      (SEAL-fact precedence; one-to-one accepted, zero-unmatched surfaced, multi-hit
      deterministic triage; manual tier-5 PIN) was SME-confirmed and logged that day —
      exactly the activation condition this entry carried since K1. Extract:
      drydocs/loaders/sql/controlm_app_facts.sql (ORDER BY = the tie-break contract).
