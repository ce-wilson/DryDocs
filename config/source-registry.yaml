# =============================================================================
# config/source-registry.yaml — every data-pipeline source, declared once.
#
# Each entry binds a SOURCE to: its orchestrator (Tier-2 vendor), its adapter,
# the taxonomy it feeds, and its crosswalk-confirmation state. Loaders and the
# `pipeline-config` agent read this; nothing loads until `confirmed: true`.
#
# REQUIRED on every entry (enforced by tests/unit/test_classification.py):
#   classification — one of config/classification.yaml levels (sensitivity / publish tier)
#   source         — the system/path the data comes from
#   (External sources additionally need source_url + captured_at)
# =============================================================================

schema: drydocs.source-registry.v1
updated: 2026-06-20

sources:
  # ---- Orchestration metadata (Tier-2 vendors) -----------------------------
  - id: controlm-psgmgr
    classification: Internal            # operational scheduling metadata; not for public GitHub
    source: "oracle:psgmgr.CM_DEF_* views"
    kind: orchestration
    orchestrator: bmc-controlm          # baseline — no crosswalk needed
    adapter: oracle                     # OracleAdapter over psgmgr.* views
    feeds_taxonomy: [folders, jobs, conditions, dependencies, variables]
    confirmed: true
    notes: "Live. The canonical structural-lineage feed. See README §Control-M lineage."

  - id: autosys-export
    classification: Internal
    source: "autosys export (TBD)"
    kind: orchestration
    orchestrator: autosys
    adapter: ~                          # TBD
    feeds_taxonomy: [folders, jobs, conditions, dependencies]
    confirmed: false                    # placeholder — crosswalk not SME-confirmed (stopped at HITL gate)
    crosswalk: config/crosswalks/autosys-to-bmc.yaml
    gate_spec: config/gate-prompts/autosys-crosswalk.yaml
    notes: >
      Placeholder. 11-row draft crosswalk to bmc-controlm (config/crosswalks/autosys-to-bmc.yaml)
      is status: proposed, stopped at the HITL gate — SME not yet run. See
      external/orchestration/autosys/README.md for the narrative summary. Activate
      (confirmed: true) only after the gate spec above is SME-confirmed and logged in
      config/gate-log.md.

  - id: airflow-mwaa
    classification: Internal
    source: "MWAA DAG export (TBD)"
    kind: orchestration
    orchestrator: airflow
    adapter: ~
    feeds_taxonomy: [folders, jobs, conditions, dependencies]
    confirmed: false                    # placeholder — crosswalk not SME-confirmed (stopped at HITL gate)
    crosswalk: config/crosswalks/airflow-to-bmc.yaml
    gate_spec: config/gate-prompts/airflow-crosswalk.yaml
    notes: >
      Placeholder. 12-row draft crosswalk to bmc-controlm (config/crosswalks/airflow-to-bmc.yaml)
      is status: proposed, stopped at the HITL gate — SME not yet run. See
      external/orchestration/airflow/README.md for the narrative summary. Activate
      (confirmed: true) only after the gate spec above is SME-confirmed and logged in
      config/gate-log.md.

  # ---- Internal reference data (Tier-3 confidential) -----------------------
  - id: seal-extract
    classification: Internal-Confidential   # real applications, ownership, employees, SEAL ids
    source: "SEAL extract (internal)"
    kind: internal
    orchestrator: ~
    adapter: csv                        # CsvAdapter (samples) / internal extract in prod
    feeds_taxonomy: [applications, ports, memberships, roles, employees]
    confirmed: true
    notes: "Live. SEAL applications + ownership."

  - id: catalog-pat
    classification: Internal-Confidential   # real LOB→Product→Team rosters, team names
    source: "PAT/Catalog extract (internal)"
    kind: internal
    orchestrator: ~
    adapter: csv
    feeds_taxonomy: [lob, product_lines, products, area_products, dev_teams]
    confirmed: true
    notes: "Live. LOB→Product→Team catalog (lowest precedence authority)."

  # ---- Reference ledgers (repo-committed, publishable) ----------------------
  - id: software-registry
    classification: Internal-Public     # DryDocs' own stack only; no company catalog rows
    source: "config/taxonomy/software-registry.yaml"
    kind: reference
    orchestrator: ~
    adapter: yaml                       # RegistryYamlAdapter (flattens vendors/products)
    feeds_taxonomy: [vendors, software_products]
    confirmed: true                     # SME gate 2026-07-07 (ADR 0004; config/gate-log.md)
    notes: "Third-party software registry (plan 07). Vendor = brand only; graph is the lookup."

  # ---- Data platforms (sources of DataAsset/lineage) -----------------------
  - id: oracle-schemas
    classification: Internal-Confidential   # real schema/table/object names
    source: "oracle:<schema> (internal)"
    kind: data-platform
    orchestrator: ~
    adapter: oracle
    feeds_taxonomy: [schemas, tables, scripts]
    confirmed: false                    # ingestion pipeline planned (see backlog)
    notes: "Oracle DB schemas/scripts as taxonomy → DataAsset. Real names are confidential."

  - id: snowflake
    classification: Internal-Confidential
    source: "snowflake (TBD)"
    kind: data-platform
    orchestrator: ~
    adapter: ~
    feeds_taxonomy: [schemas, tables]
    confirmed: false
    notes: "Expansion placeholder."

  # ---- Staging semantic-fact streams (C3/C4 variable normalization) --------
  - id: stg-app-fact
    classification: Internal             # mechanism-only entry; no real SEAL/FID/app-name values here
    source: "oracle:DRYDOCS_STG.STG_APP_FACT (Python normalizer output over CM_DEF_SETVAR)"
    kind: staging
    orchestrator: ~                      # not an orchestration vendor — a staging table fed by the C3/C4 variable-normalization stream
    adapter: oracle
    feeds_taxonomy: [applications]       # semantic facts attribute a ControlMJob to an Application (SEAL)
    confirmed: false                     # registered per K1 flag — not yet SME-confirmed; no loader exists yet (see K2)
    notes: >
      Registered per K1's flag (docs/restructure/backlog.yaml Epic K): job.APPLICATION
      (CM_DEF_VJOB) is NOT reliable SEAL identity — the SEAL-attribution feed is this
      table's semantic facts instead. Rows carry fact_type in {SEAL, FID, APP_NAME,
      ALIAS, ...} + fact_value, one row per (run, job, fact_type) — see
      docs/controlm-staging-ingestion-flow.md (STG_APP_FACT ER block) and
      docs/reviews/sdlc-oracle-ingestion.md §FR-OI-007. Feeds the planned
      m3_seal_app_ref mapping (WAS_ASSOCIATED_WITH, role seal_app_ref,
      drydocs/ontology/relationship_vocabulary.yaml, status: planned) and the
      corresponding taxonomy-ontology-map.yaml entry (status: proposed). Mechanism-only
      here — no real SEAL id / FID / application-name values, column/fact-type names
      only. Activate (confirmed: true) only after the K2 match-policy gate (SEAL-fact
      precedence; one-to-one accepted, zero-unmatched surfaced, multi-hit triage) is
      SME-confirmed via the HITL gate and logged in config/gate-log.md — see
      docs/restructure/03-hitl-sme-flow.md.
