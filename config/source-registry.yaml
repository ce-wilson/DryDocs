    derived: true                       # Q3 ruling: derived store — @ grammar for visibility, authority omitted (not SOR/ADS; FCDO SOC checked, doesn't fit)
    feeds_taxonomy: [applications]      # semantic facts attribute a ControlMJob to an Application (SEAL)
    adapter: oracle
    acquisition:                        # N12 (2026-08-18): how the data arrives
      mode: automated
      via: db                           # the row's own id names the qualified object
    gate_spec: config/gate-prompts/seal-attribution-match-policy.yaml
    loader: drydocs/loaders/folder_attribution.py   # K8 folder-grain loader; cypher folder_attribution.cypher (the K2 job-grain writer retired 2026-08-04)
    confirmed: true                     # gate seal-attribution-match-policy SIGNED OFF 24/24 (2026-07-14) — transfers per Q6
    replaces: stg-app-fact
    notes: >
      Python normalizer output over CM_DEF_SETVAR_VW (K1: job.APPLICATION is
      NOT reliable SEAL identity — this table's semantic facts are the feed
      instead). Rows carry fact_type in {SEAL, FID, APP_NAME, ALIAS, ...}.
      Since K8 (gate seal-app-ref-edge-reshape §B3) this feed is the demoted
      FALLBACK behind the app-code defined mapping
      (config/overrides/app-code-mappings.csv): it feeds the ACTIVE
      scheduler_belongs_to_application folder edge with origin=matched-fallback.
      Mechanism-only here — no real SEAL/FID/app-name values. Extract:
      drydocs/loaders/sql/controlm_app_facts.sql (ORDER BY = tie-break
      contract).

  # ---- Infrastructure server inventory (Epic Z) -------------------------------
  - id: "infra:server-export"
    system: infra
    origin: infra
    artifact: server-export
    artifact_kind: file
    taxonomy_category: Infrastructure
    asset_type: dcat:Dataset
    authority: SOR                      # caveat on the system row: SOR-vs-ADS (site-vs-CMDB provenance) is a Z2 gate question
    feeds_taxonomy: [servers, locations]   # deliberately NOT `hosts` — that is the Control-M side of a join Z2 has not ruled
    adapter: csv                        # drydocs/loaders/server_inventory.py (Z3; CsvAdapter — the export is a hand download)
    acquisition:                        # how the data arrives (N12)
      mode: manual
      format: csv                       # expected; if the site hands another format, widen the enum at the first real drop (the `archive` precedent)
      drop_dir: internal/server-inventory/
      drop_dir_base: repo               # TRACKED in-tree zone — the real exports commit under internal/ (PUBLISH-BOUNDARY.md: raw extracts live there, excluded from any public push), which is what survives git clean
      # pulled PER BUSINESS APPLICATION from the site UI: the application list is
      # filtered on prod, and each download's rows carry BOTH prod and DR servers.
      # One file per application — that grain is the contract, never merged.
    gate_spec: config/gate-prompts/server-location-ontology.yaml
    loader: drydocs/loaders/server_inventory.py   # + the server_resolution.v1 derived pass (the tiered ExecutionHost join)
    confirmed: true                     # gate server-location-ontology SIGNED OFF 12/12 (2026-08-19) + the Z3 build the same day (N13: the build's commit flips)
    notes: >
      Per-application server export. FIELD CONTRACT (enumerated with the
      hierarchy capture, config/taxonomy/server-location.yaml): server name;
      OS product + version (e.g. RHEL x.x — version context ties to the
      software registry per the C25 ruling; no OS row exists there yet, an
      open question parked for Z2); rack; data-center/building; city; state;
      country; prod/DR designation; owning business application. STANDING
      CAUTION (verbatim from the Epic Z groom): the export's
      data-center/location field is NOT the Control-M field of the same name
      — the Control-M "DC" is a SCHEDULING concept (its name encodes the
      default run time, e.g. T032-E0700-DMA), while this source carries
      PHYSICAL geography (rack, building, city/state/country). Never join or
      crosswalk the two by field name. Server name is the join key to
      Control-M nodes, but the JOIN RULE is a Z2 decision, not an import-time
      invention. Sanitized sample:
      tests/fixtures/server_inventory/synthetic-server-export.csv.

