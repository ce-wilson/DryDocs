    locator:
      data_root: "DRYDOCS_DATA_ROOT (default ~/data/DryDocs); catalog/ = view exports, catalog/screenshots/ = evidence captures (Internal-Confidential, never in-tree even gitignored)"
      resolver: drydocs_core/data_root.py # catalog_dir() (the G19 shared helper)
      mapping: docs/generic-snowflake-data-catalog-ingestion-plan.md   # the mapping ledger (field contract §2, identity model §3)
    feeds_taxonomy: [datasets, distributions]
    confirmed: false                      # gate snowflake-data-catalog (plan §5 questions a-f; prompt not yet drafted) is the activation condition; NOTHING writes the graph before it
    notes: >
      G42 registration — THE POINTER, NEVER THE DATA: exports carry real
      dataset/distribution GUIDs, producing application ids, contact emails,
      and physical coordinates (db/schema/table, HDFS paths, S3 buckets/ARNs)
