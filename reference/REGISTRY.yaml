# =============================================================================
# reference/REGISTRY.yaml — the single index of external source platforms.
#
# Tier 1 = "platforms you build WITH" (graph platform, ontology standards, research).
# Orchestration vendors you "ingest FROM" are Tier 2 — see
# external/orchestration/README.md (kept separate on purpose).
#
# Agents: consult the relevant entry BEFORE writing code that touches a platform.
# `reference-librarian` keeps this file current. Every entry is PUBLIC knowledge
# (safe when the repo is published).
# =============================================================================

schema: drydocs.reference-registry.v1
updated: 2026-08-28           # catalog/lineage peer products registered (datahub, openmetadata, amundsen, openlineage, microsoft-purview) — the second-pass survey behind docs/design/catalog-substrate-review.md
classification: External       # ALL reference material is External (public) — see config/classification.yaml
verified: 2026-06-21           # A1: local mirrors (../llm-graph-builder, ../sdw-sosa-ssn) + all platform/standard docs resolve; no stale entries

platforms:
  - id: neo4j
    role: graph-platform
    summary: >
      The graph database DryDocs is built on. Primary reference is the neo4j-skills
      plugin (cypher, modeling, import, document-import, graphrag, vector-index,
      gds, aura-*, security, query-tuning, kafka, spark). Use those skills first.
    skills_prefix: "neo4j-skills:"
    repos:
      - https://github.com/neo4j/neo4j
      - https://github.com/neo4j/neo4j-graphrag-python
      - https://github.com/neo4j/graph-data-science
      - https://github.com/neo4j-labs/llm-graph-builder   # mirrored locally: ../llm-graph-builder
    local_mirror: ../llm-graph-builder
    docs: reference/platforms/neo4j/README.md

  - id: oracle
    role: data-platform-source
    summary: >
      Source system of record for Control-M metadata (psgmgr replicated views) and
      DRYDOCS_STG staging. Reference is the Oracle `db` skill (SQL/PLSQL/SQLcl/ORDS).
    skills_prefix: "db:"
    docs: reference/platforms/README.md

  - id: servicenow
    role: source-platform          # SaaS ITSM / CMDB — we ingest FROM it, never build ON it
    summary: >
      The CMDB/CSDM system of record for configuration items, CI relationships and the
      company TOM (Technical Operating Model) accountability model. Reached through a
      Snowflake replica, never queried directly — same shape as Control-M through psgmgr.
      PUBLIC DOCS ARE THE BASELINE for stock tables (cmdb_ci, cmdb_rel_ci, cmdb_rel_type,
      cmdb_ci_service_discovered = CSDM "Application Service", cmdb_ci_business_app):
      the vendor documents the canonical schema, so a replica column that is NOT in the
      vendor doc is a company extension (`u_` columns, `x_<scope>_` scoped apps) or a
      carrier artifact (data-lake `dwintel_dl_*`, `delete_flag`) — and naming which is
      the point. NOT covered by the vendor doc at all: the `x_<scope>_cmdb_tom_*` tables,
      which are a company scoped application with no vendor baseline.
    source_url: https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/
    docs: knowledge/upgrade-plans/servicenow-replica-evidence.md   # instance evidence (K21)
    also: knowledge/upgrade-plans/servicenow-cmdb-analysis.md      # vendor doc-set analysis (C10)
    manifest: external/ServiceNow/README.md                        # the downloaded Now Create asset set
    verified: 2026-08-09           # K21 — cmdb_rel_ci/cmdb_rel_type field docs re-read from the public docs

  - id: snowflake
    role: data-platform-source
    status: placeholder            # expansion target — DryDocs INGESTS nothing from it yet
    summary: >
      Future data platform for DryDocs' own use. Neo4j graph-analytics-on-Snowflake reference
      available via neo4j-skills:neo4j-snowflake-graph-analytics-skill when activated.
      NON-OBVIOUS FACT, recorded so it is not re-derived (SME 2026-08-09): Snowflake is ALREADY
      LIVE in the estate as the CARRIER of the ServiceNow replica DryDocs will read. It holds
      the origin/carrier slot that Oracle `psgmgr` holds for Control-M, so a snow dataset is
      `snow@[db].[schema].<servicenow_table>` — origin `snow`, carrier snowflake. And note the
      trap that bit once already: system id `snow` is SERVICENOW, not Snowflake.
    docs: reference/platforms/README.md

  - id: git
    role: source-control-platform
    summary: >
      Repos as reference sources: code provenance (authorship → :Developer), and the
      external repos mirrored under the sandbox root used as modeling references.
    repos:
      - https://github.com/ce-wilson/DryDocs     # this project (target)

standards:
  - id: prov-o
    iri: http://www.w3.org/ns/prov#
    role: provenance-ontology
    why: "Core ontology — every node carries provenance; the 9-row decision matrix is PROV-O."
    docs: reference/standards/prov-o/README.md
  - id: w3c-org
    iri: http://www.w3.org/ns/org#
    role: organization-ontology
    why: "Membership / Role / OrganizationalUnit — SEAL + PAT (LOB→Product→Team)."
    docs: reference/standards/w3c-org/README.md
  - id: dprod-ekgf
    iri: https://ekgf.github.io/dprod/
    role: data-product-ontology
    why: "Data product Ports (EventProcessing / BatchProcessing)."
    docs: reference/standards/dprod-ekgf/README.md
  - id: sosa-ssn
    iri: http://www.w3.org/ns/sosa/
    role: observation-temporal-ontology
    adoption: experimental        # W3C standard, NOT a declared company standard; opt-in supplement only, pending HITL gate (Epic E)
    why: >
      Spatio-Temporal Data on the Web (SOSA/SSN). Feeds the CONTEXT-graph layer:
      Observation / Sensor / Result / phenomenonTime patterns for "what matters right
      now" (job-run health, freshness, temporal state).
    local_mirror: ../sdw-sosa-ssn
    docs: reference/standards/sosa-ssn/README.md
  - id: dcat
    iri: http://www.w3.org/ns/dcat#
    role: dataset-catalog-ontology
    why: "DataSource / DataTarget datasets; data-catalog crosswalk."
    docs: reference/standards/dcat/README.md
  - id: skos
    iri: http://www.w3.org/2004/02/skos/core#
    role: concept-scheme-ontology
    why: "closeMatch / broader / narrower for taxonomy reconciliation (e.g. LOB→segment)."
    docs: reference/standards/README.md
  - id: dcmi-terms
    iri: http://purl.org/dc/terms/
    role: metadata-terms-vocabulary
    why: "Property-level authorship bindings for the source audit envelope (dct:creator/created/contributor/modified; gate envelope-property-terms, M4)."
    docs: reference/standards/dcmi-terms/README.md

research:
  docs: reference/research/README.md
  note: >
    Academic papers and public implementations backing modeling decisions; cite in ADRs
    under docs/. RULE (L28): when an ADR cites an external work, that work gets an entry
    HERE — so the citation resolves to a paper, a license and a verified link rather than
    a bare repo name. `entries` carries the works with a full write-up in
    reference/research/; the README table is the wider reading list.
  entries:
    - id: kgot
      role: agent-architecture-reference
      title: "Affordable AI Assistants with Knowledge Graph of Thoughts"
      authors: "Besta, M.; Paleari, L.; Jiang, J.H.A.; Gerstenberger, R.; Wu, Y.; Hannesson, J.G.; Iff, P.; Kubicek, A.; Nyczyk, P.; Khimey, D.; Blach, N.; Zhang, H.; Zhang, T.; Ma, P.; Kwaśniewski, G.; Copik, M.; Niewiadomski, H.; Hoefler, T."
      year: 2025
      paper: https://arxiv.org/abs/2504.02670
      doi: 10.48550/arXiv.2504.02670
      source_url: https://github.com/spcl/knowledge-graph-of-thoughts
      publisher: "SPCL (Scalable Parallel Computing Lab), ETH Zurich"
      license: "BSD-3-Clause, (c) 2025 ETH Zurich"   # no KGoT code is vendored here — design only
      cited_by:
        - docs/decisions/0007-agentic-qa-architecture.md   # analyzed by name as one of two reference architectures
        - agents/graph_qa/task_graph.py                    # ADOPTED — task-scoped working memory, NetworkX shape
        - agents/common/llm_ledger.py                      # ADOPTED — the collect_stats per-call cost ledger
        - agents/graph_qa/providers.py                     # REJECTED — their hardcoded-tool-model trap
        - agents/graph_qa/schema_context.py                # REJECTED — their whole-graph-state injection
      why: >
        The reference architecture behind ADR 0007's agent tier, and the reason layer 4
        got ruled rather than improvised: KGoT's task graph IS the context graph
        CLAUDE.md defers, so its residency went to the R1 gate (in-process only,
        2026-07-23). Adopted in part — task graph, cost ledger, bounded escalation,
        fix-Cypher loop, majority vote, forced-solve. Rejected in part — the INSERT
        branch collides with the O20 zero-write ruling and whole-graph prompting cannot
        survive a persistent KG.
      docs: reference/research/knowledge-graph-of-thoughts.md
      verified: 2026-08-10           # L28 — citation, arXiv id and license read from the repo

    - id: databricks-unity-catalog
      role: data-catalog-governance-reference
      title: "Databricks Unity Catalog — governance and semantic layer"
      source_url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
      publisher: Databricks
      license: "public vendor documentation (cite, do not paste)"
      why: >
        The only public build putting glossary, domain grouping, controlled tags and
        enforcement in ONE governed object model — the shape docs/patterns/data-catalog/
        already describes. Tool pattern to borrow, not a standard to seed.
      docs: reference/research/databricks-unity-catalog.md
      verified: 2026-07-25

    - id: essential-graphrag
      role: retrieval-patterns-reference
      title: "Essential GraphRAG — Knowledge Graph-Enhanced RAG"
      authors: "Bratanič, T.; Hane, O."
      year: 2025
      publisher: Manning
      source_url: https://www.manning.com/books/essential-graphrag
      license: "commercial book — cite, never commit the PDF (gitignored at repo root)"
      why: >
        Worked lexical-graph and graph-retrieval patterns; input to the docmeta P0
        benchmark verdict and the agent-traversal experiment (backlog Q1/Q2).
      docs: reference/research/essential-graphrag-notes.md
      verified: 2026-07-16

    # ── Catalog / lineage peer products (2026-08-28 second-pass survey) ──────
    # Registered as ONE group because they were read for one question and are
    # cited by one document: how a catalog binds a declared source to a real
    # connection, and how its console bootstraps a first login. Individual ids
    # so a later citation can name the one it means.

    - id: datahub
      role: data-catalog-substrate-reference
      title: "DataHub — metadata platform (ingestion recipes, URNs, JaaS console auth)"
      publisher: "DataHub Project (originally LinkedIn)"
      source_url: https://docs.datahub.com/docs/platform-instances
      repos:
        - https://github.com/datahub-project/datahub
      license: "Apache-2.0 (no DataHub code vendored here — design only)"
      why: >
        The three-part dataset URN (platform, name, env) is the same shape DryDocs
        derives, and DataHub had to RETROFIT platform_instance when one environment
        held two deployments of one platform. Also the source of the committed-config
        pattern that references env vars instead of holding secrets, and of the
        default-credential lesson (user.props ships a working datahub:datahub that
        deleting the UI user does not disable).
      docs: docs/design/catalog-substrate-review.md
      verified: 2026-08-28

    - id: openmetadata
      role: data-catalog-substrate-reference
      title: "OpenMetadata — service connections and the secrets-manager abstraction"
      publisher: "Collate / OpenMetadata community"
      source_url: https://docs.open-metadata.org/latest/deployment/secrets-manager
      repos:
        - https://github.com/open-metadata/OpenMetadata
      license: "Apache-2.0 (design only)"
      why: >
        The DERIVED secret path — a service's password lives at a location computed
        from its type and name, so the secret reference cannot drift from the
        registration. One of the two published answers to the locator.service hole
        in config/source-registry.yaml; the other is Purview's named-object shape,
        which the review recommends instead for this estate.
      docs: docs/design/catalog-substrate-review.md
      verified: 2026-08-28

    - id: amundsen
      role: data-catalog-substrate-reference
      title: "Amundsen databuilder — scoped configuration for extractors"
      publisher: "Amundsen (LF AI & Data)"
      source_url: https://github.com/amundsen-io/amundsen/tree/main/databuilder
      license: "Apache-2.0 (design only)"
      why: >
        Configuration keys namespaced by the component that reads them, composed with
        a declared fallback chain — one mechanism supplying precedence instead of
        seven modules each writing their own. Adopted as a SHAPE; its pyhocon
        dependency is explicitly not taken (the repo already uses pydantic-settings).
      docs: docs/design/catalog-substrate-review.md
      verified: 2026-08-28

    - id: openlineage
      role: lineage-naming-reference
      title: "OpenLineage naming conventions (and Marquez, its reference server)"
      publisher: "OpenLineage (LF AI & Data)"
      source_url: https://openlineage.io/docs/spec/naming/
      repos:
        - https://github.com/OpenLineage/OpenLineage
        - https://github.com/MarquezProject/marquez
      license: "Apache-2.0 (design only)"
      why: >
        The namespace-and-name split — namespace is the CONNECTION (varies per
        machine, may carry a secret), name is the OBJECT (stable, safe to commit).
        DryDocs' origin@db.schema.table grammar is already isomorphic to it, which is
        why a per-ORIGIN binding table suffices and a per-dataset one is not needed.
        Marquez itself is not taken: there is no runtime lineage service here.
      docs: docs/design/catalog-substrate-review.md
      verified: 2026-08-28

    - id: microsoft-purview
      role: data-catalog-substrate-reference
      title: "Microsoft Purview Data Map — credentials for scans"
      publisher: Microsoft
      source_url: https://learn.microsoft.com/en-us/purview/data-map-data-scan-credentials
      license: "public vendor documentation (cite, do not paste)"
      why: >
        Credential as a FIRST-CLASS object, created and rotated separately from the
        sources that reference it by name. The recommended shape for DryDocs, because
        one Oracle account reads eight psgmgr views — a per-source derived path would
        restate the same secret eight times. Collibra, Alation and Atlan were checked
        at the same time and dropped as duplicates of this shape.
      docs: docs/design/catalog-substrate-review.md
      verified: 2026-08-28
