                      # 2026-08-01: +docs/next-session-handoff.md and
                      # +docs/next-internal-session.md, both never-port. The SECOND
                      # instance of the docs/port/** failure mode — producer-local
                      # session material falling to `docs/*.md` -> default clean-add.
                      # The internal-session checklist had been imported by two prior
                      # ports and was caught only because the copies had not yet
                      # diverged. The rule, not the files, is the residual: `docs/*.md`
                      # still defaults to port, so a third session file would fall
                      # through the same way. Inverting it (name the content, default
                      # the rest to never-port) is deliberately NOT done here.
                      # 2026-07-29: +docs/plan/load-map.html (canonical-company derived
                      # render, the board.html rule) — the J16 coverage guard caught the
                      # new N5 file the day it shipped, exactly as designed.
                      # 2026-07-28 (J16): the FALL-THROUGH question, asked for the first
                      # time. 398 of 1415 tracked paths matched no row and took `default:`
                      # in silence. Four gaps became real rows — docs/restructure/backlog.yaml
                      # (per-entry; a blind checkout of the plan deletes one side's work),
                      # docs/plan/board.html (derived, regenerate), docs/design/** and
