# =============================================================================
# PORT-MANIFEST.yaml — machine-readable port dispositions
# (producer ce-wilson/DryDocs → company <org>/DryDocs; disjoint histories)
#
# THE AUTHORITY for how each path resolves during a port. The narrative around
# these rules lives in git-readme.md + docs/port/port-prompt.md + the reconcile-port
# skill — those documents explain WHY; this file is WHAT, and it is what the
# consumer-side reconcile run should read mechanically. Rows are id-free and
# ordinal-free on purpose (the port-prompt step-number coupling is retired as
# the authority; steps remain as narrative).
#
# Matching: first row whose glob matches the path wins (top-down). `**` spans
# path separators, `*` and `?` stay within one segment. Paths not matching any
# row take the DEFAULT: clean-add if absent on the consumer, evaluate if both
# sides created it (the disjoint-history rule — git cannot auto-merge without a
# merge-base) — and taking the default is only legitimate when the path is
# listed in `default_ok:` at the bottom of this file with a reason (J16).
#
# dispositions:
#   clean-add          path absent on consumer — applies untouched
#   canonical-producer collision: take the PRODUCER version wholesale, no hand-merge
#   canonical-company  collision: KEEP THE CONSUMER version; producer copy is a
#                      sanitized public template or the consumer is simply ahead/wired
#   union-append       collision: merge additively (append-only audit files) — never
#                      drop either side's entries
#   per-entry          collision resolves INSIDE the file, entry by entry — the
#                      entry_rule is mandatory and path-level checkout is FORBIDDEN
#   derived            the file is a DETERMINISTIC RENDER: take NEITHER side's copy —
#                      REGENERATE it from the reconciled tree (guardrail 5), then commit
#                      the refresh. Keeping a stale consumer render is as wrong as taking
#                      the producer's. (J43, 2026-08-26 — decided across ALL derived rows
#                      at once; splitting one row from the board.html precedent is refused.
#                      Settles the naming question the roadmap.html row had inboxed: these
#                      rows carried canonical-company, which was a poor fit for a render
#                      with no authored consumer content to be canonical about.)
#   evaluate           collision: hand-merge per the reconcile-port collision ledger
#   never-port         must not cross the boundary in either direction (values,
#                      credentials, gitignored data)
#
# Guarded by tests/unit/test_port_manifest.py (well-formedness) and
# tests/unit/test_port_reconcile_guards.py (entry_rules as code; the J16
# fall-through guard — no tracked path may resolve to `default:` in silence).
# Born from
# docs/reviews/tech-debt-port-boundary.md (2026-07-09, remediation Phase 1);
# sequencing rule recorded there: this manifest lands BEFORE the ADR 0002
# Phase B package split, so the rename wave is a path-column diff here, not a
# prose rewrite.
# =============================================================================
schema: drydocs.port-manifest.v1
classification: Internal-Public
updated: 2026-08-20   # 2026-08-20 (J51): six PER-ENTRY rows for canonical-producer paths the
                      # company legitimately EXTENDS (Idea-142's class): description_tokens
                      # (per function), detect.py + __init__ (per detector id), test_runbook_
                      # currency (per exemption table, retirement trigger named), email-dl-
