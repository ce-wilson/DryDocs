      stale carried copies — one missing row cost a cleared slice, an exposed second
      failure and a red trunk. Without this row the file fell to the `scripts/**`
      default_ok (evaluate on collision), which says nothing about what travels with it.
      THE TRIPLES THAT EXIST TODAY (read from the SURFACES constant by import at
      2026-09-08, never from a render — J37; 26 rows, 24 under
      config/): source-registry = config/source-registry.yaml; loader-source-overlay =
