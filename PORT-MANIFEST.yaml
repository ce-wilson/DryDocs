      to its own estate — are kept, never dropped by a take. `CONFIG_EXEMPT` is a
      set: union it. The renderer's mechanism (the scan, the status decision, the
      residency fact, the JSON shape) is producer-owned and crosses whole.
      UNNAMED FIELDS: a field on a SURFACES row this rule does not name is producer
      mechanism and crosses with the row; the company adds no fields of its own here.
    note: >
      J75 (2026-09-08). ONE COUPLING, THREE FILES: a config surface, its SURFACES row
      here, and `web/src/generated/enforcement-matrix.json`. A port slice carries all
