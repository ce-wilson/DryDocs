# =============================================================================
# default_ok — paths that take the `default:` above ON PURPOSE (J16, 2026-07-28)
#
# The inverse question nobody had asked: which tracked paths match NO row? 398
# of 1415 did, and "deliberately default" was indistinguishable from "nobody
# thought about it" — which is how knowledge/depgraph-snapshots/*.json and
# docs/port/** each spent months instructing the consumer to port the
# producer's port INSTRUCTIONS as payload, found by accident, one at a time.
#
# Every entry below is BEHAVIOR-PRESERVING: it records why `default:` is the
# right resolution, it does not change one. A tracked path matching neither a
# row nor an entry here now FAILS
# tests/unit/test_port_reconcile_guards.py::test_no_tracked_path_falls_through_silently
# — so the next such path gets a decision instead of a silence.
#
# `reason` is mandatory. Prefer a narrow pattern: a broad subtree entry excuses
# every future file under it, which is the failure mode this block exists to end.
# =============================================================================
default_ok:
  - path: "git-readme.md"
    reason: >
      THE STANDING DECISION, written down here for the first time (it lived only
      in the idea inbox): git-readme.md is deliberately uncovered. It is the WHY
      guide for the cross-repo model itself — the document that explains what a
      port IS — so both sides benefit from holding their own copy, and neither
      side's is wrong. Note the contrast with docs/port/** (never-port): those
      DIRECT a specific port and are not its payload; this one describes the
      model and is nobody's payload.

  # ---- repo identity + toolchain -------------------------------------------
  - path: "README.md"
    reason: "each repo's own front door; on collision the default's `evaluate` is right — never a blind checkout"
  - path: "CHANGELOG.md"
    reason: "per-repo release record, like the pyproject version string that is already per-entry — the two histories are disjoint and neither side's entries are the other's"
  - path: "VERSIONING.md"
    reason: "states this repo's release cadence; consumer's cadence is its own (same reasoning as CHANGELOG.md)"
  - path: "LICENSE"
    reason: "repo-level legal identity — a company fork's licensing is a company decision, never carried by a port"
  - path: ".gitignore"
    reason: "both sides accumulate their own ignore lines (consumer ignores company-specific data paths); union by hand on collision, never checkout"
  - path: ".gitattributes"
    reason: "same accumulate-and-union shape as .gitignore"
  - path: ".editorconfig"
    reason: "editor line-ending/charset policy (2026-08-13, with the * text=auto eol=lf attributes rule) — same accumulate-and-union shape as .gitignore; consumer may carry its own additions"
  - path: ".env.example"
    reason: >-
      key-name template only, no values (PUBLISH-BOUNDARY). GENERATED since G129
      (2026-08-30) from DECLARED_VARIABLES in drydocs_core/env_refs.py, so the
      consumer's own keys (Kerberos/RAC) now belong in the DECLARATION, not in this
      file: an edit here is overwritten by the next render, and a key added here alone
      is a key no binding may reference. Still per-entry, still union on collision —
      union the DECLARATIONS, then re-run scripts/render_env_example.py
  - path: "poetry.lock"
    reason: "DERIVED from pyproject.toml, which is per-entry — taking the producer's lock against a merged pyproject yields an inconsistent pair. Re-lock after the merge instead"
  - path: "poetry.toml"
    reason: "local venv preference; per-machine, not per-project content"

  # ---- producer-authored code the default already resolves correctly --------
  - path: "agents/**"
    reason: "the ADK agent package — producer-authored, but agents/.env.example and provider wiring are environment-specific, so evaluate-on-collision beats take-producer"
  - path: "drydocs/**"
    reason: "the drydocs remainder (ADR 0002-A-1) — the rows above already pin every file with a real disposition (back-flow, never-port, cli.py); what is left is ordinary producer code where evaluate-on-collision is correct"
  - path: "drydocs_api/**"
    reason: "the thin read API (ADR 0005) — producer-authored; consumer QuerySpecs legitimately differ, so hand-merge on collision"
  - path: "drydocs_core/**"
    reason: "core package minus the schema/**, controlm/**, ontology and models rows above — the two explicit models rows set the precedent that evaluate-on-collision is the right default here"
  - path: "drydocs_deepdoc/**"
    reason: "SYNTHESIZED-tier investigation writer (ddcontext); producer-authored, no consumer wiring"
  - path: "drydocs_docmeta/**"
    reason: >
      document-corpus ingestion (ADR 0006, Q6) — producer-authored, and
      evaluate-on-collision rather than take-producer for a specific reason
      named in the docmeta plan §6: the T4 connectors (confluence, sharepoint,
      teams, email) are Canonical-COMPANY. The producer ships the protocol in
      connectors/base.py and the two generic connectors that have zero internal
      dependencies; the consumer's wired Confluence internals win on collision,
      the same rule as drydocs-review. Take the producer's STRUCTURE, keep your
      connector internals.
  - path: "drydocs_lineage/**"
    reason: "cross-platform lineage extractors; producer-authored, but collectors carry site-specific inventory config (rua_inventory.conf) — evaluate, do not checkout"
  - path: "scripts/**"
    reason: "render + ingest scripts; producer-authored tooling where a collision means both sides edited it and a hand-merge is right"
  - path: "libs/**"
    reason: "standalone drop-in modules; the one with a port hazard (oracle_kerberos) has its own row above"

  # ---- tests ----------------------------------------------------------------
  - path: "tests/**"
    reason: >
      the suite is producer-authored, but consumer expectations legitimately
      diverge (test_schema.py's constraint count is the standing example, and
      has its own row) — so evaluate-on-collision is exactly right, and the
      four rows above pin the exceptions that must NOT be re-derived.

  # ---- docs -----------------------------------------------------------------
  - path: "docs/*.md"
    reason: >
      what is LEFT loose at the docs root after S9 (2026-08-21) grouped the rest:
      RELATIONSHIP_GUIDE.md (a top-level index CLAUDE.md cites by that path),
      oracle-sql-logging.md, ruff-format-convergence.md and
      generic-snowflake-data-catalog-ingestion-plan.md. F13 named only the
      `controlm-*` / `port-*` families, and those now have directory rows of their
      own (`docs/port/**`, `docs/company-prompts/**`, `docs/controlm/**`). The
      never-port session material (next-session-handoff, next-internal-session)
      keeps its explicit rows ABOVE this entry. Evaluate-on-collision stays right
      for the remainder.
  - path: "docs/controlm/**"
    reason: >
      Control-M flow/status/plan notes, grouped here by S9 out of the docs root.
      Producer-authored working notes about the shared ingestion model — the
      consumer legitimately holds its own status for the same subject, so
      evaluate-on-collision is right and a blanket take-producer would overwrite it.
  - path: "docs/decisions/**"
    reason: "ADRs — a decision record is append-only-ish history for the repo that made it; both sides may hold the same ADR number for different decisions, so never checkout. J40 (2026-08-26) names the LIVE instance: company docmeta ADR = 0005 while producer 0005 = browser access and producer docmeta = 0006 — each numbering canonical on its own side, nothing renumbered (G87: ids are join keys), cross-repo citations by TITLE + side, never bare number. Full decision: the J40 entry in docs/port/port-prompt.md"
  - path: "docs/reviews/**"
    reason: "point-in-time review records (tech-debt, code-graph plans) — historical artifacts of the side that ran the review"
  - path: "docs/patterns/**"
    reason: "reusable pattern write-ups; producer-authored reference prose with no consumer wiring"
  - path: "docs/history/**"
    reason: "superseded planning docs kept for provenance — by definition nobody's live content"
  - path: "docs/whitepaper/**"
    reason: "outward-facing non-governed doc (CLAUDE.md §6) — editorial treatment applies, and each side's audience differs"
  - path: "docs/overview/**"
    reason: "outward-facing executive overview; same audience-differs reasoning as the whitepaper"
  - path: "drydocs-icons/**"
    reason: "vendor/product icon assets (svg/png/webp). External marks reproduced for UI use; binary, no merge semantics — clean-add is the only sensible resolution"
  - path: "knowledge/org/**"
    reason: "product/role reference prose captured producer-side (relocated from docs/Product/** at S14, 2026-08-27; same entry, new home); consumer has the authoritative originals internally"
  - path: "knowledge/**"
    reason: "Internal-Public design prose + upgrade plans (the depgraph-snapshots rows above are the exception). Producer-authored thinking; a collision means both sides wrote on the topic and both texts matter"
  - path: "internal/**"
    reason: >
      Internal-tier operational metadata. Precedent is already set by the
      internal/remediation/** and internal/context-graph-analysis/** rows:
      Internal content is fine on the PRIVATE company remote and never in a
      public mirror. Applies to internal/pat-evidence/*.png too — screenshots
      of internal evidence, which is exactly why they must never reach a public
      mirror (PUBLISH-BOUNDARY.md is what enforces that, not this manifest).
  - path: "external/ServiceNow/**"
    reason: "vendor reference stub; the populated vendor trees under external/orchestration/** have their own canonical-producer row"
  - path: "external/geo/**"
    reason: >
      Z5 (2026-08-22): the vendored Natural Earth / world-atlas country TopoJSON
      that scripts/render_world_map.py projects into the committed map asset.
      Evaluate-on-collision is right and take-producer would be no better: the
      file is a byte-identical redistribution of a published npm package at a
      pinned edition, so if both sides hold it they hold the SAME bytes, and if
      they diverge somebody deliberately moved editions and that is a decision to
      look at rather than overwrite. Unlike the vendor PDFs under
      external/orchestration/**, this one is COMMITTED rather than gitignored —
      Natural Earth is public domain and world-atlas is ISC, so a
      private-but-sometimes-published repo may carry it (see that directory's
      SOURCE-MANIFEST.md).

# =============================================================================
# row_may_match_nothing — rows that match NO path on this side, ON PURPOSE
# (Phase C prerequisite, 2026-08-12)
#
# The mirror of `default_ok`. That block answers "which paths match no row";
# this one answers the inverse nobody had asked: **which rows match no path**.
# A row whose glob matches nothing is unenforced, and it fails SILENTLY — the
# paths it was written to govern fall through to whatever broader row catches
# them next, which is usually the generic `evaluate` row, i.e. the wrong
# disposition with no error anywhere.
#
# This is not hypothetical. It has happened twice:
#   * `drydocs_core/controlm/**` (canonical-producer) pointed at a path that had
#     not existed since the S2 / ADR 0008 relocate under `orchestration/`. The
#     ENTIRE orchestration package silently fell through to the generic
#     `drydocs_core/**` evaluate-on-collision row for months, caught by hand at
#     G75/G76 on 2026-08-11.
#   * The Phase B relocate (ADR 0002-a-1) got this right only because the rows
#     were re-pathed in the SAME commit as the move — the "path-column diff"
#     discipline. Nothing enforced that; it was remembered.
#
# Phase C (the deferred 4-component split of the `drydocs` remainder, ADR
# 0002-a-1 "Revisit at Phase C") is the largest rename wave still ahead. This
# guard is its prerequisite: after Phase C moves files, every row left pointing
# at a pre-split path fails the suite instead of rotting quietly.
#
# `reason` is mandatory. A row belongs here only when matching nothing is the
# INTENDED state — a company-only path, a side-local overlay slot, a gitignored
# zone, or a one-time cross-side migration instruction. If a row matches nothing
# because the files MOVED, the fix is to re-path the row, not to allowlist it.
#
# Guarded by tests/unit/test_port_reconcile_guards.py::
#   test_no_manifest_row_matches_nothing (and its well-formedness twin).
# =============================================================================
row_may_match_nothing:
  # ---- side-local by construction ------------------------------------------
  - path: "drydocs/docmeta/**"
    reason: >
      J40: a COMPANY-ONLY package path, protected by its canonical-company row so a
      deletion sweep or verbatim take can never silently remove it — producer-side the
      glob matches nothing by construction, which is the row doing its job.
  - path: "drydocs/scrapers/**"
    reason: >
      J40: same as drydocs/docmeta/** — company-only capability, row exists to protect,
      matches nothing producer-side by construction.
  - path: "docs/lane-*-handoff.md"
    reason: >
      the per-burst handoff retires itself when its queue empties (lane-handoff, 2026-09-02),
      so between bursts the glob matches nothing on purpose - the row is the tripwire that
      keeps a live one from crossing at a roll that happens to catch it mid-burst.
  - path: "docs/next-internal-session.md"
    reason: >
      RETIRED 2026-08-25 — the file is deleted producer-side (audit + the Idea-174
      re-home in the retirement commit) but its never-port row is KEPT DELIBERATELY
      as the re-import tripwire: two prior ports imported this file by accident,
      a company copy may still exist, and dropping the row is exactly how it would
      fall through a future default again. A row that matches nothing here is the
      row doing its job.
  - path: "PORT-MANIFEST.*.yaml"
    reason: >
      the J34 overlay slots. Each side tracks its OWN overlay and the other side's
      is absent by design (that absence is the whole point of the seam — a
      verbatim take of this file cannot drop rows that were never in it), so this
      row matches nothing on whichever side has not created its overlay yet.
  - path: "internal-local/**"
    reason: "gitignored local zone — never tracked on either side, so it can never appear in the guard's population by construction"

  # ---- company-only modules the producer will never hold --------------------
  - path: "drydocs/cli_consumer.py"
    reason: >
      S16: the consumer's command module. The producer never ships one - the discovery
      seam in drydocs/cli.py is the point - so the canonical-company row matches nothing
      here by construction, and the guard would otherwise report it as a dead row.
  - path: "drydocs/locations.py"
    reason: "never-port company-only module (real site/data-center values); producer-side absence is the intended state, not rot"
  - path: "drydocs/seal_deployments.py"
    reason: "never-port company-only module (real SEAL deployment values); producer-side absence is the intended state, not rot"
  - path: "drydocs/controlm_app_codes.py"
    reason: "never-port company-only module (real app-code vocabulary); producer-side absence is the intended state, not rot"

  # ---- one-time cross-side migration instruction ---------------------------
  - path: "docs/design/controlm-ingestion-tdd.print.html"
    reason: >
      DELIBERATELY zero-match producer-side and the row still has work to do: the
      producer retired the .print.html at L13 (2026-07-18) when the render series
      collapsed to one .html with @media print, and the row's note carries the
      consumer's one-time instruction — DELETE the company-side twin at the next
      port, then regenerate the single .html. RETIRE THIS ENTRY (and its row) once
      a PORT-REPORT records that deletion; until then a zero match is correct.
