                      # Y2 shard (ADR 0013) and the F4 per-repo-status ruling.
                      # 2026-08-09 (J34): the OVERLAY SEAM — side-local rows live in a
                      # separate include file the J16 guard UNIONS with this manifest
                      # (`overlay:` block below). GRAMMAR DECISION, recorded here per the
                      # item's acceptance: include FILE over marked section — the include
                      # is the D2 loader-source-overlay precedent (the mechanism ports,
                      # the contents never do), and a marked section dies by construction
                      # the moment a verbatim take replaces this file, which is exactly
                      # the failure being closed (PORT-REPORT-a14a8028: the take dropped
                      # the company default_ok block — 89 company-only paths fell through
                      # their own guard). UNION SEMANTICS: overlay rows append AFTER this
                      # file's rows (first match wins, so this file's dispositions keep
                      # precedence — an overlay adds coverage, never overrides authority;
                      # a duplicate path is a guard error, not a silent loser); overlay
                      # default_ok entries union, reasons mandatory. The grammar also
                      # expresses a PRODUCER-LOCAL overlay (Idea-41): both sides get one
                      # slot each, so producer-local rows (the dev-environment.yaml
                      # class) have a home that never crosses. What this seam does NOT
                      # do: choose config/dev-environment.yaml's disposition — per-entry
                      # vs contract-plus-local-overlay is the user's J16 decision, not a
                      # grammar default. Guard: test_port_reconcile_guards.py (overlay
                      # union + verbatim-apply survival proof).
                      # 2026-08-03 (L22): +docs/style/** canonical-producer — the J16
                      # guard caught both new style files the session they shipped,
