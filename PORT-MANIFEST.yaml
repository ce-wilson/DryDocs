# =============================================================================
# PORT-MANIFEST.yaml — machine-readable port dispositions
# (producer ce-wilson/DryDocs → company <org>/DryDocs; disjoint histories)
#
# THE AUTHORITY for how each path resolves during a port. The narrative around
# these rules lives in git-readme.md + docs/port-prompt.md + the reconcile-port
# skill — those documents explain WHY; this file is WHAT, and it is what the
# consumer-side reconcile run should read mechanically. Rows are id-free and
# ordinal-free on purpose (the port-prompt step-number coupling is retired as
# the authority; steps remain as narrative).
#
# Matching: first row whose glob matches the path wins (top-down). `**` spans
# path separators, `*` and `?` stay within one segment. Paths not matching any
# row take the DEFAULT: clean-add if absent on the consumer, evaluate if both
# sides created it (the disjoint-history rule — git cannot auto-merge without a
# merge-base) — and taking the default is only legitimate when the path is
# listed in `default_ok:` at the bottom of this file with a reason (J16).
#
# dispositions:
#   clean-add          path absent on consumer — applies untouched
#   canonical-producer collision: take the PRODUCER version wholesale, no hand-merge
#   canonical-company  collision: KEEP THE CONSUMER version; producer copy is a
#                      sanitized public template or the consumer is simply ahead/wired
#   union-append       collision: merge additively (append-only audit files) — never
#                      drop either side's entries
#   per-entry          collision resolves INSIDE the file, entry by entry — the
#                      entry_rule is mandatory and path-level checkout is FORBIDDEN
#   evaluate           collision: hand-merge per the reconcile-port collision ledger
#   never-port         must not cross the boundary in either direction (values,
#                      credentials, gitignored data)
#
# Guarded by tests/unit/test_port_manifest.py (well-formedness) and
# tests/unit/test_port_reconcile_guards.py (entry_rules as code; the J16
# fall-through guard — no tracked path may resolve to `default:` in silence).
# Born from
# docs/reviews/tech-debt-port-boundary.md (2026-07-09, remediation Phase 1);
# sequencing rule recorded there: this manifest lands BEFORE the ADR 0002
# Phase B package split, so the rename wave is a path-column diff here, not a
# prose rewrite.
# =============================================================================
schema: drydocs.port-manifest.v1
classification: Internal-Public
updated: 2026-07-29   # 2026-07-29: +docs/plan/load-map.html (canonical-company derived
                      # render, the board.html rule) — the J16 coverage guard caught the
                      # new N5 file the day it shipped, exactly as designed.
                      # 2026-07-28 (J16): the FALL-THROUGH question, asked for the first
                      # time. 398 of 1415 tracked paths matched no row and took `default:`
                      # in silence. Four gaps became real rows — docs/restructure/backlog.yaml
                      # (per-entry; a blind checkout of the plan deletes one side's work),
                      # docs/plan/board.html (derived, regenerate), docs/design/** and
                      # libs/oracle_kerberos/** (evaluate + the warning notes) — and the
                      # rest became `default_ok:` entries that record WHY the default is
                      # right. A new uncovered path now fails the suite.
                      # 2026-07-27 (step 46): knowledge/depgraph-snapshots/*.json is now an
                      # EXPLICIT never-port row with the tooling split out as canonical-producer.
                      # It had NO row and therefore fell to `default:` = clean-add — i.e. the
                      # manifest said PORT THEM while every port excluded them by planner
                      # judgment. Also refreshed the stale test_schema.py count note.
                      # 2026-07-14   # Phase B relocate (ADR 0002-a-1): core paths now drydocs_core/*;
                      # the remainder keeps the drydocs/ name (thin variant). Renamed-path
                      # rows below were the promised "path-column diff, not a prose rewrite".
                      # 2026-07-10, later: drydocs_remediation/** + internal/remediation/**
                      # rows added (G3 remediation component stream).
                      # 2026-07-14 (step 31): web/** + UI-WIP/** canonical-producer,
                      # .github/** evaluate, config/manual-loads/manifest.yaml per-entry.
                      # 2026-07-15 (step 34): docs/design/controlm-ingestion-tdd.{md,html,
                      # print.html} canonical-company — consumer's TDD is finalized/ahead.
direction: "producer -> company (one-way; back-flow only as sanitized reproduction)"
default: "clean-add when absent on consumer; evaluate when both sides created the path"

rows:
  # ---- per-entry files (checkout of the whole file is FORBIDDEN) ------------
  - path: "drydocs_core/ontology/relationship_vocabulary.yaml"
    disposition: per-entry
    entry_rule: >
      id-keyed (local_relationships[].id, node_classifications[].label). NEVER
      downgrade a consumer entry whose status is active (or a node class a live
      loader depends on) to the producer's planned/deprecated — EXCEPT gate-authorized
      deprecations carrying a deprecated_at + gate cite (K4 2026-07-15:
      seal_has_membership / seal_of_role / seal_held_by — take the producer's
      deprecated status; the gate outcome IS the authority). Back-flow-origin
      ids (m3_seal_app_ref and successors) are consumer-canonical once promoted.
    note: "guarded producer-side by test_schema.py + test_taxonomy_ontology_map.py"
  - path: "config/taxonomy-ontology-map.yaml"
    disposition: per-entry
    entry_rule: >
      id-keyed (mappings[].id). NEVER downgrade confirmed/applied ->
      proposed; summary block is COMPUTED (recount after any merge —
      test_taxonomy_ontology_map.py enforces); union new entries from both sides.
    note: "the central HITL contract; gate decisions must never regress via a port"
  - path: "pyproject.toml"
    disposition: per-entry
    entry_rule: >
      union of dependencies; KEEP the consumer's version string (per-repo
      release cadence); producer v* release tags never cherry-pick.
  - path: "docs/restructure/backlog.yaml"
    disposition: per-entry
    entry_rule: >
      id-keyed (items[].id). Both sides run their own plan against OVERLAPPING
      ids, so a path-level checkout silently deletes one side's work — the same
      hazard the taxonomy-ontology-map row exists for. Union the items; NEVER
      regress a status (done -> in_progress/todo) or drop an entry; when both
      sides hold the same id, keep the one that is FURTHER ALONG and fold the
      other's notes in. The `summary` block (counts, next_ready) is COMPUTED —
      recount after any merge (test_backlog.py enforces), never hand-merge it.
    note: >
      had NO row until 2026-07-28 (J16) — the machine-readable source of truth
      for what is done was resolving to `default:`, i.e. the manifest was
      telling the consumer that a blind checkout of the producer's plan was an
      acceptable resolution. Human view is docs/plan/board.html (its own row).
  - path: "config/manual-loads/manifest.yaml"
    disposition: per-entry
    entry_rule: >
      files[] is a UNION keyed by file path: producer ships mechanism + policy
      text + empty lists; consumer accumulates its own entries (real CSVs live
      under internal/) — consumer entries NEVER come from, or are removed by, a
      port. Policy/README/template text is producer-canonical (step 31).
    note: "tier-5 manual-CSV mechanism (gate seal-attribution-match-policy, 2026-07-14)"

  # ---- append-only audit files ----------------------------------------------
  - path: "config/gate-log.md"
    disposition: union-append
    note: "chronological union of both sides' gate records; dropping either side's entries is an audit violation"
  - path: "docs/restructure/IDEAS.md"
    disposition: union-append
    note: "inbox + audit trail; both sides append — merge is the union (proven conflict site, 3x on 2026-07-09)"

  # ---- consumer-canonical (drydocs-review back-flow stream + wiring) --------
  - path: "drydocs/graph_review.py"
    disposition: canonical-company
    note: "producer copy = sanitized public template; consumer's carries real wiring"
  - path: "drydocs/graph_verify.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/review_labels.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/sme_notes.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/gate_pages.py"
    disposition: canonical-company
    note: "back-flow rule; generic mechanism deltas (meta-card/provenance standard) fold in WITH their tests, or decline both together — logged"
  - path: "drydocs/publishing/**"
    disposition: canonical-company
    note: "consumer's carries the real Confluence connector; producer's is the abstracted template"
  - path: "config/review-labels.yaml"
    disposition: canonical-company
    note: "real labels consumer-side"
  - path: "config/gate-prompts/**"
    disposition: canonical-company
    note: "consumer's real gate specs win; producer specs are prep/templates — new producer specs that don't collide are clean-adds"
  - path: "config/dev-environment.yaml"
    disposition: canonical-company
    entry_rule: >
      Each side keeps its OWN file — every value in it is a local fact (Neo4j
      container name, host ports, and since U7 the depgraph sibling repo path +
      expected_commit). New producer KEYS/SECTIONS are ADAPTED BY HAND, never
      adopted: surface the structural delta in the PORT-REPORT and let the
      consumer fill in its own values. NEVER port a remote/URL value across —
      the company's depgraph fork remote is a GHE name (PUBLISH-BOUNDARY).
    note: >
      Back-flow landed 2026-07-28 from PORT-REPORT-94132c80, which resolved the
      step-48 caveat exactly this way. It was previously covered only by
      `config/**` = canonical-producer, i.e. the manifest said "take the
      producer's copy wholesale" for a file of producer-LOCAL infrastructure —
      and the L16 runbook's Appendix A is a RENDER of it, so a blind take would
      have propagated producer container names and ports into consumer
      documentation, the precise drift Appendix A was restated to prevent. The
      consumer runs its own depgraph fork at a different remote, so its
      `depgraph:` block can never equal the producer's. Live example for the
      next port: producer `33cfc68` adds a `plugins:` block + `plugins_volume`
      here (APOC/GDS as a mounted volume) — structure to adapt, values to
      decide locally, NOT a file to check out.
  - path: "graph-tests/**"
    disposition: canonical-company
    note: "consumer's real acceptance suites win; seed twins follow producer renames as deliberate consumer commits"
  - path: "docs/design/controlm-ingestion-tdd.md"
    disposition: canonical-company
    note: >
      the consumer's TDD is FINALIZED (2026-07-15) and ahead — carries the SPIDERP §7f
      audit chain + live-verified content; the producer copy is the mirror. Producer-side
      corrections that originated FROM the finalized doc (e.g. the D4 IS_CURRENT_VERSION
      'Y' fix, step 34) are already present consumer-side by construction.
  - path: "docs/design/controlm-ingestion-tdd.html"
    disposition: canonical-company
    note: "render of the above — regenerate consumer-side, never take the producer render"
  - path: "docs/design/controlm-ingestion-tdd.print.html"
    disposition: canonical-company
    note: >
      RETIRED producer-side (L13, 2026-07-18): the render series collapsed to the single
      .html (screen + @media print). At the next port, DELETE the consumer-side twin and
      regenerate the single .html consumer-side — never take a producer render.
  - path: "docs/plan/load-map.html"
    disposition: canonical-company
    note: >
      DERIVED — the N5 human load-map surface, a deterministic render of the
      consumer's OWN source registry + N3 loader declarations + ledgers + map
      (scripts/render_load_map.py, rides the default board render). Same rule
      as board.html directly below: regenerate from the reconciled tree; taking
      the producer's render ships the producer's sources as the consumer's map.
      (Row added 2026-07-29 when the J16 coverage guard caught the new file —
      the .json twin rides web/** and regenerates under guardrail 5.)
  - path: "docs/plan/board.html"
    disposition: canonical-company
    note: >
      DERIVED — a deterministic render of docs/restructure/backlog.yaml
      (scripts/render_board.py). Keep the consumer's copy through the port, then
      REGENERATE it from the merged backlog; taking the producer's render ships
      the producer's plan as the consumer's board. Same rule as the design-doc
      renders. Had no row until 2026-07-28 (J16).
  - path: "drydocs_core/adapters/oracle_adapter.py"
    disposition: canonical-company
    note: >
      PORT-FROZEN: consumer is Kerberos/thick with real connection config; producer is
      thin-only. Phase B relocate interaction: APPLY the rename (drydocs/adapters/ ->
      drydocs_core/adapters/) but keep the CONSUMER's file content at the new path.

  # ---- producer-canonical (take wholesale on collision) ---------------------
  - path: "drydocs_core/controlm/**"
    disposition: canonical-producer
    note: "the normalization package (Phases A/B/C) is authored producer-side"
  - path: "drydocs/staging.py"
    disposition: canonical-producer
    note: "the load-cadence staging bundle builder — relocated OUT of controlm/ in Phase B (0002-a §6 borderline); stays in the drydocs remainder"
  - path: "drydocs_remediation/**"
    disposition: canonical-producer
    note: "the remediation component (G3/0002-B): producer-authored mechanism; rule VALUES + Jira REST + live corroboration queries stay company-side and never flow back"
  - path: "internal/remediation/**"
    disposition: canonical-producer
    note: >
      spinoff doc port + real M0 artifacts (Internal — never in any PUBLIC mirror; fine on
      the private company remote). Producer-authored files take producer on collision;
      company-side ADDITIONS here (e.g. the G10 landings per the README §HELD) are
      company-only files — they never collide and never flow back.
  - path: "internal/context-graph-analysis/**"
    disposition: canonical-producer
    note: >
      producer-authored analysis of the company incubator's context-graph (2026-07-23) —
      Internal: fine on the private company remote, NEVER in any PUBLIC mirror. Source
      screenshots stay producer-local (gitignored); company has the real repos anyway.
  - path: "knowledge/standards/**"
    disposition: canonical-producer
  - path: "drydocs/loaders/**"
    disposition: canonical-producer
    note: "Control-M loaders/SQL/DDL/cypher incl. base.py (provenance diet) — producer-authored"
  - path: "drydocs_core/schema/**"
    disposition: canonical-producer
    note: "supplements + constraints; consumer evaluates constraint-count deltas via its own test_schema expectations"
  - path: "tests/unit/test_variable_*.py"
    disposition: canonical-producer
    note: "carry the sample skipif guards — re-deriving them caused divergence in a prior port"
  - path: "tests/unit/test_module_boundary.py"
    disposition: canonical-producer
    note: "carries ENTRYPOINT_MODULES exemption + default-deny — the settled boundary resolution"
  - path: "tests/unit/test_taxonomy_ontology_map.py"
    disposition: canonical-producer
    note: "the map guard (2026-07-09); consumer's map content differs, the guard is content-agnostic"
  - path: "tests/unit/test_port_manifest.py"
    disposition: canonical-producer
  - path: "PORT-MANIFEST.yaml"
    disposition: canonical-producer
    note: "this file — the producer maintains the dispositions; consumer proposes changes via back-flow notes"
  - path: "MODULE_MAP.md"
    disposition: canonical-producer
  - path: "CLAUDE.md"
    disposition: canonical-producer
  - path: "PUBLISH-BOUNDARY.md"
    disposition: canonical-producer
  - path: "reference/**"
    disposition: canonical-producer
  - path: "external/orchestration/**"
    disposition: canonical-producer
  - path: "docs/restructure/0*.md"
    disposition: canonical-producer
    note: "conceptual model / plan / HITL flow docs"
  - path: ".claude/**"
    disposition: canonical-producer
    note: "agents + skills are producer-maintained tooling; consumer-local skills live under other names"
  - path: "web/**"
    disposition: canonical-producer
    note: "drydocs-web module (JS/TS, Epic O; step 31) — node_modules/dist gitignored; .env.example only, VITE_* values NEVER committed (Vite inlines them into the bundle)"
  - path: "UI-WIP/**"
    disposition: canonical-producer
    note: "web-console design record (wireframes, nav flow, dark landing mock; step 31) — static reference material"
  - path: "config/**"
    disposition: canonical-producer
    note: "configuration layer default — the per-entry/canonical-company/union rows ABOVE override for the map, gate-prompts, review-labels, gate-log, dev-environment (first match wins). A file of LOCAL infrastructure facts does not belong under this default; dev-environment.yaml sat here by omission until the 2026-07-28 port"

  # ---- integration points (hand-merge per the reconcile-port ledger) --------
  - path: "drydocs/cli.py"
    disposition: evaluate
    note: "composition root; both sides add commands — merge per collision ledger (keep consumer verbs, add producer verbs)"
  - path: ".github/**"
    disposition: evaluate
    note: "J5 CI (step 31): the publish-boundary guard is producer-remote-specific and GHE Actions runners/policies are consumer-side — keep consumer workflows, adapt rather than adopt"
  - path: "drydocs_core/models/__init__.py"
    disposition: evaluate
    note: "union of row-model exports from both sides (path moved from drydocs/models/ in Phase B)"
  - path: "drydocs_core/models/controlm.py"
    disposition: evaluate
    note: "keep consumer-only rows (e.g. ControlMQuantitativeRow), add producer rows (path moved in Phase B)"
  - path: "tests/unit/test_schema.py"
    disposition: evaluate
    note: "consumer EXPECTED_CONSTRAINTS is ahead (superset: base + snow-support supplements). Producer was 47 at the step-45 head and is 49 at 78ba7fd (+2 from the P3 hosts loader, step 46e). Counts drift EVERY port — trust the live test files over this note (66acea8 lesson); keep consumer count, take producer drift-guard logic, and raise the consumer number only for genuinely new active edges that ship their own supplement block"
  - path: "tests/unit/test_controlm_cypher.py"
    disposition: evaluate
    note: "consumer scope_key condition-key variant wins"
  - path: "docs/design/**"
    disposition: evaluate
    note: >
      design docs + their governed renders. Deliberately NOT canonical-producer:
      the controlm-ingestion-tdd rows above are the precedent — a doc the
      consumer FINALIZES becomes its own canonical-company row, and a blanket
      take-producer would overwrite the next one before anybody noticed. Check
      whether the consumer's copy is ahead first; renders are regenerated from
      the resolved .md, never taken. (Row added 2026-07-28, J16.)
  - path: "libs/oracle_kerberos/**"
    disposition: evaluate
    note: >
      READ THIS BEFORE ASSUMING: the PORT-FROZEN rule on
      drydocs_core/adapters/oracle_adapter.py does NOT extend here. Everything
      identifying lives in the gitignored oracle_kerberos_connection.txt, so
      the tracked module is sanitized producer mechanism (placeholders only) —
      but the consumer may have adapted it for its own FID/RAC realities, so
      hand-merge rather than checkout either way. (Row added 2026-07-28, J16.)

  # ---- never cross the boundary ---------------------------------------------
  - path: "drydocs/locations.py"
    disposition: never-port
    note: "consumer-only DSN/server values — at most a bare schema may cross, never the values"
  - path: "drydocs/seal_deployments.py"
    disposition: never-port
    note: "real SEAL IDs — consumer-only"
  - path: "drydocs/controlm_app_codes.py"
    disposition: never-port
    note: "real app-code values — consumer-only"
  - path: "drydocs/data/**"
    disposition: never-port
    note: "gitignored samples; Track-1 tests skip without them by design"
  - path: "internal-local/**"
    disposition: never-port
    note: "gitignored; travels by hand only, never by git"
  - path: "docs/port-*.md"
    disposition: never-port
    note: "PRODUCER-SIDE PORT CONTROL DOCS — the rolling port prompt, its step archive,
      and the per-stream hand-off packs (port-T12-*, port-step46-*). These direct the
      port; they are not its payload. They fell to `default:` = clean-add until
      2026-07-27, which is why step 43 needed a prose 'do NOT re-add the T12 session
      materials' workaround — that instruction is now a manifest row. Hand-off packs are
      PASTED into the executing session, never committed company-side. The company's own
      PORT-REPORT-<date>.md is a company artifact and is likewise not producer content."

  # depgraph snapshots: the OUTPUTS never cross, the TOOLING does. Order matters —
  # the *.json row must stay ABOVE the directory row (first match wins).
  - path: "knowledge/depgraph-snapshots/*.json"
    disposition: never-port
    note: "per-repo drift artifacts — each carries a git-commit `meta` header that is
      meaningless across the two disjoint mains, and the two sides' graphs differ by
      design. Also catches tree-original.json / tree-this-version.json, which embed a
      producer-local abs_path. Every port had been excluding these by planner judgment
      with NO row to point at; added 2026-07-27 after the step-46 port re-derived the
      same call from scratch."
  - path: "knowledge/depgraph-snapshots/**"
    disposition: canonical-producer
    note: "README.md + snapshot.ps1 + viewer.html — the snapshot tooling and its
      documentation DO port; only the *.json outputs above are held back"

# =============================================================================
# default_ok — paths that take the `default:` above ON PURPOSE (J16, 2026-07-28)
#
# The inverse question nobody had asked: which tracked paths match NO row? 398
# of 1415 did, and "deliberately default" was indistinguishable from "nobody
# thought about it" — which is how knowledge/depgraph-snapshots/*.json and
# docs/port-*.md each spent months instructing the consumer to port the
# producer's port INSTRUCTIONS as payload, found by accident, one at a time.
#
# Every entry below is BEHAVIOR-PRESERVING: it records why `default:` is the
# right resolution, it does not change one. A tracked path matching neither a
# row nor an entry here now FAILS
# tests/unit/test_port_reconcile_guards.py::test_no_tracked_path_falls_through_silently
# — so the next such path gets a decision instead of a silence.
#
# `reason` is mandatory. Prefer a narrow pattern: a broad subtree entry excuses
# every future file under it, which is the failure mode this block exists to end.
# =============================================================================
default_ok:
  - path: "git-readme.md"
    reason: >
      THE STANDING DECISION, written down here for the first time (it lived only
      in the idea inbox): git-readme.md is deliberately uncovered. It is the WHY
      guide for the cross-repo model itself — the document that explains what a
      port IS — so both sides benefit from holding their own copy, and neither
      side's is wrong. Note the contrast with docs/port-*.md (never-port): those
      DIRECT a specific port and are not its payload; this one describes the
      model and is nobody's payload.

  # ---- repo identity + toolchain -------------------------------------------
  - path: "README.md"
    reason: "each repo's own front door; on collision the default's `evaluate` is right — never a blind checkout"
  - path: "CHANGELOG.md"
    reason: "per-repo release record, like the pyproject version string that is already per-entry — the two histories are disjoint and neither side's entries are the other's"
  - path: "VERSIONING.md"
    reason: "states this repo's release cadence; consumer's cadence is its own (same reasoning as CHANGELOG.md)"
  - path: "LICENSE"
    reason: "repo-level legal identity — a company fork's licensing is a company decision, never carried by a port"
  - path: ".gitignore"
    reason: "both sides accumulate their own ignore lines (consumer ignores company-specific data paths); union by hand on collision, never checkout"
  - path: ".gitattributes"
    reason: "same accumulate-and-union shape as .gitignore"
  - path: ".env.example"
    reason: "key-name template only, no values (PUBLISH-BOUNDARY). Consumer adds its own keys (Kerberos/RAC), so union on collision"
  - path: "poetry.lock"
    reason: "DERIVED from pyproject.toml, which is per-entry — taking the producer's lock against a merged pyproject yields an inconsistent pair. Re-lock after the merge instead"
  - path: "poetry.toml"
    reason: "local venv preference; per-machine, not per-project content"

  # ---- producer-authored code the default already resolves correctly --------
  - path: "agents/**"
    reason: "the ADK agent package — producer-authored, but agents/.env.example and provider wiring are environment-specific, so evaluate-on-collision beats take-producer"
  - path: "drydocs/**"
    reason: "the drydocs remainder (ADR 0002-A-1) — the rows above already pin every file with a real disposition (back-flow, never-port, cli.py); what is left is ordinary producer code where evaluate-on-collision is correct"
  - path: "drydocs_api/**"
    reason: "the thin read API (ADR 0005) — producer-authored; consumer QuerySpecs legitimately differ, so hand-merge on collision"
  - path: "drydocs_core/**"
    reason: "core package minus the schema/**, controlm/**, ontology and models rows above — the two explicit models rows set the precedent that evaluate-on-collision is the right default here"
  - path: "drydocs_deepdoc/**"
    reason: "SYNTHESIZED-tier investigation writer (ddcontext); producer-authored, no consumer wiring"
  - path: "drydocs_lineage/**"
    reason: "cross-platform lineage extractors; producer-authored, but collectors carry site-specific inventory config (rua_inventory.conf) — evaluate, do not checkout"
  - path: "scripts/**"
    reason: "render + ingest scripts; producer-authored tooling where a collision means both sides edited it and a hand-merge is right"
  - path: "libs/**"
    reason: "standalone drop-in modules; the one with a port hazard (oracle_kerberos) has its own row above"

  # ---- tests ----------------------------------------------------------------
  - path: "tests/**"
    reason: >
      the suite is producer-authored, but consumer expectations legitimately
      diverge (test_schema.py's constraint count is the standing example, and
      has its own row) — so evaluate-on-collision is exactly right, and the
      four rows above pin the exceptions that must NOT be re-derived.

  # ---- docs -----------------------------------------------------------------
  - path: "docs/*.md"
    reason: "loose repo-root docs (RELATIONSHIP_GUIDE, the Control-M flow/status notes). S9 will move most of these into subdirectory homes; revisit the pattern then"
  - path: "docs/decisions/**"
    reason: "ADRs — a decision record is append-only-ish history for the repo that made it; both sides may hold the same ADR number for different decisions, so never checkout"
  - path: "docs/reviews/**"
    reason: "point-in-time review records (tech-debt, code-graph plans) — historical artifacts of the side that ran the review"
  - path: "docs/patterns/**"
    reason: "reusable pattern write-ups; producer-authored reference prose with no consumer wiring"
  - path: "docs/history/**"
    reason: "superseded planning docs kept for provenance — by definition nobody's live content"
  - path: "docs/whitepaper/**"
    reason: "outward-facing non-governed doc (CLAUDE.md §6) — editorial treatment applies, and each side's audience differs"
  - path: "docs/overview/**"
    reason: "outward-facing executive overview; same audience-differs reasoning as the whitepaper"
  - path: "docs/Product/**"
    reason: "product/role reference prose captured producer-side; consumer has the authoritative originals internally"
  - path: "SDLC-Docs/**"
    reason: "extracted SDLC method docs (BDD/SDD howto, FCD requirements) — external method material, not DryDocs content"

  # ---- assets + knowledge ---------------------------------------------------
  - path: "drydocs-icons/**"
    reason: "vendor/product icon assets (svg/png/webp). External marks reproduced for UI use; binary, no merge semantics — clean-add is the only sensible resolution"
  - path: "knowledge/**"
    reason: "Internal-Public design prose + upgrade plans (the depgraph-snapshots rows above are the exception). Producer-authored thinking; a collision means both sides wrote on the topic and both texts matter"
  - path: "internal/**"
    reason: >
      Internal-tier operational metadata. Precedent is already set by the
      internal/remediation/** and internal/context-graph-analysis/** rows:
      Internal content is fine on the PRIVATE company remote and never in a
      public mirror. Applies to internal/pat-evidence/*.png too — screenshots
      of internal evidence, which is exactly why they must never reach a public
      mirror (PUBLISH-BOUNDARY.md is what enforces that, not this manifest).
  - path: "external/ServiceNow/**"
    reason: "vendor reference stub; the populated vendor trees under external/orchestration/** have their own canonical-producer row"
