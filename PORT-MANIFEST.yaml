direction: "producer -> company (one-way; back-flow only as sanitized reproduction)"
default: "clean-add when absent on consumer; evaluate when both sides created the path"

# ---- the overlay seam (J34, 2026-08-09) -------------------------------------
# Each side may keep ONE side-local overlay file. The J16 fall-through guard
# unions an overlay's rows (appended AFTER this file's rows) and default_ok
# entries (reasons mandatory) with this manifest — so a producer-manifest-
# verbatim apply structurally CANNOT drop a company-only row: the row is not in
# the file being replaced. An overlay path duplicating a row here is a guard
# error. The files are never-port (row below): side-local by definition.
# Company session: move your 89 company-only default_ok paths (PORT-REPORT-*.md,
# docs/build_*, docs/site/*, docs/prompts/*, settings.json, …) into
# PORT-MANIFEST.company.yaml ONCE — after that, taking this file wholesale is
# safe and the re-append-after-every-port ritual retires.
overlay:
  files:
    - path: "PORT-MANIFEST.company.yaml"
      side: company     # company-tracked; absent producer-side by design
    - path: "PORT-MANIFEST.producer.yaml"
      side: producer    # reserved producer slot (Idea-41); absent until needed

rows:
  # ---- per-entry files (checkout of the whole file is FORBIDDEN) ------------
  - path: "drydocs_core/ontology/relationship_vocabulary/**"
    disposition: per-entry
    gate_bound: config/gate-log.md   # J43: entries here ACTIVATE only by signed gate.
                                     # "identical to base" and "per-entry equivalent" are
                                     # BOTH insufficient tests for a gate-bound file,
                                     # because status and id-set parity is not
                                     # field-and-gate parity. The reconcile-time check
                                     # (test_port_reconcile_guards: unsigned_activations)
                                     # refuses to activate an entry whose cited gate is
                                     # unsigned ON THE RECEIVING SIDE'S gate-log.
    entry_rule: >
      S5 (2026-08-04): the registry is a fragment DIRECTORY — per-domain files
      merged in sorted-filename order by drydocs_core/yaml_fragments.py; apply
      this split shape on the consumer rather than resolving it as a conflict
      (entries are unchanged, grouped by their existing domain field; read the
      merged document, never a fragment alone).
      id-keyed (local_relationships[].id, node_classifications[].label). NEVER
      downgrade a consumer entry whose status is active (or a node class a live
      loader depends on) to the producer's planned/deprecated — EXCEPT gate-authorized
      deprecations carrying a deprecated_at + gate cite (K4 2026-07-15:
      seal_has_membership / seal_of_role / seal_held_by — take the producer's
      deprecated status; the gate outcome IS the authority). Back-flow-origin
      ids (m3_seal_app_ref and successors) are consumer-canonical once promoted.
    note: "guarded producer-side by test_schema.py + test_taxonomy_ontology_map.py"
  - path: "config/taxonomy-ontology-map/**"
    disposition: per-entry
    gate_bound: config/gate-log.md   # J43: same rule as the vocabulary row above —
                                     # confirmed/applied entries exist only by signed
                                     # gate, and the receiving side's gate-log is the
                                     # authority the reconcile check reads.
    entry_rule: >
      S5 (2026-08-04): fragment DIRECTORY, same shape and rule as the
      relationship_vocabulary row above — apply the split, merge per entry.
      id-keyed (mappings[].id). NEVER downgrade confirmed/applied ->
      proposed; summary block is COMPUTED (recount after any merge —
      test_taxonomy_ontology_map.py enforces); union new entries from both sides.
    note: "the central HITL contract; gate decisions must never regress via a port"
  - path: "pyproject.toml"
    disposition: per-entry
    entry_rule: >
      union of dependencies; KEEP the consumer's version string (per-repo
      release cadence); producer v* release tags never cherry-pick.
  - path: ".pre-commit-config.yaml"
    disposition: canonical-producer
    note: >
      J62 (2026-09-03). The two commands CI blocks on, as commit-time hooks. Its rev
      IS pyproject's exact ruff pin (0.5.7, J10 stage 0) and your pin is the same by
      J10, so the hooks belong on both sides at the same standard. Take it whole; the
      only thing that ever changes here is the rev, which moves WITH the pin
      (tests/unit/test_precommit_config.py fails when they differ). Nothing installs
      it for you - `pre-commit install` once per clone, as the file's header says.
  # ---- the backlog: sharded 2026-08-20 (Y2, ADR 0013) ---------------------------
  # One item per file. Rows are ordered most-specific first; backlog.yaml itself is
  # now a TOMBSTONE and the ONE-TIME split sequence rides its row.
  - path: "docs/restructure/backlog/items/*.yaml"
    disposition: per-entry
    entry_rule: >
      THE ENTRY IS THE FILE (ADR 0013 Clause 6): one id, one path, so disjoint ids
      are ordinary git adds/modifications and need no hand-merge. The same id on
      both sides is one small conflict resolved by the CROSS-REPO rule (Clause 4,
      F4 ruling 2026-08-20): the CONSUMER's `status` stands — a port never writes
      status, because the same id names the same work with two independent
      completions (the company runs its own gates, loads, suite) — and the
      producer's status + date fold into `notes` as information. Never drop a
      file; never regress a status. `annotations:` (harvested monolith comments)
      is informational and unions by key. No roll-up lives here to recount.
    note: >
      replaces the per-entry rule that governed backlog.yaml's items[] for the
      same overlapping-id hazard (both sides plan against the same id space).
      The J16 guard's before/after status-regression check reads the ASSEMBLED
      tree through drydocs_core.backlog_store.dump_document().
  - path: "docs/restructure/backlog/epics/*.yaml"
    disposition: union-append
    note: >
      `groom_log` is an audit trail both sides append to; `title`/`letter`/`order`
      are producer-canonical (the company's epics are the producer's epics). A
      company-only epic file is a clean-add.
  - path: "docs/restructure/backlog/plan.yaml"
    disposition: per-entry
    entry_rule: "plan.phases keyed by id — union; phase `status` is per-repo like item status."
  - path: "docs/restructure/backlog/modules.yaml"
    disposition: per-entry
    entry_rule: "modules[] is a UNION of names; never drop one — test_runbook_coverage reads it as the census."
  - path: "docs/restructure/backlog/README.md"
    disposition: canonical-producer
    note: "prose about the mechanism; no side-local facts"
  - path: "docs/restructure/backlog.yaml"
    disposition: per-entry
    entry_rule: >
      ONE-TIME SEQUENCE at the first port whose range contains the Y2 commit
      (ADR 0013 Clause 6), in this order, never spliced into a range already
      mid-apply: (1) per-entry UNION the consumer's monolith with the producer's
      LAST monolith state under the old rule — id-keyed items[], never drop an
      entry, consumer `status` stands, producer status + date fold into notes;
      (2) run the PORTED `scripts/shard_backlog.py --date <today>` on that union —
      company-only items survive by construction, they were in the input; (3) the
      proof must pass (entry-level deep equality, plan/modules identical, derived
      summary == the union's stored summary); (4) `--tombstone`. After that this
      file is the tombstone on both sides and is canonical-producer in effect (a
      pointer); the rows above govern every later port. If a range is mid-apply
      when Y2 lands, finish it on the monolith and make the split the FIRST step
      of the NEXT range.
    note: >
      had NO row until 2026-07-28 (J16) — the machine-readable source of truth
      for what is done was resolving to `default:`. Sharded 2026-08-20 (Y2): the
      stored summary/next_ready block that every same-day rebase collided on is
      gone; roll-ups are render output. Human view is docs/plan/board.html (its
      own row).
  - path: "config/manual-loads/manifest.yaml"
    disposition: per-entry
    entry_rule: >
      files[] is a UNION keyed by file path: producer ships mechanism + policy
      text + empty lists; consumer accumulates its own entries (real CSVs live
      under internal/) — consumer entries NEVER come from, or are removed by, a
      port. Policy/README/template text is producer-canonical (step 31).
    note: "tier-5 manual-CSV mechanism (gate seal-attribution-match-policy, 2026-07-14)"
  - path: "config/audit-fields.yaml"
    disposition: per-entry
    entry_rule: >
      Keyed by source id. UNION: producer additions + company-only
      confirmed-source entries (9 of them at PORT-REPORT-5417ef10) — company
      entries never come from, or are removed by, a port. Mechanism/policy
      prose is producer-canonical.
      UNNAMED FIELDS: producer-owned by default, because this file is a policy
      declaration and its fields describe the POLICY rather than either estate —
      with one exception that is not a default at all: `status` is per-repo, since
      each side's entry records what THAT side has confirmed, and `decided_by`
      travels with the `status` it justifies. `notes` and `objects` are producer
      mechanism and cross. (J71, 2026-09-01.)
    note: >
      Relay #2 of PORT-REPORT-5417ef10 (2026-08-07): sat under the blanket
      `config/**` = canonical-producer by omission — third instance of the
      "company is ahead in a config file the manifest treats as
      producer-owned" pattern (backlog.yaml at J16, dev-environment.yaml at
      the 2026-07-28 port).

  # ---- append-only audit files ----------------------------------------------
  - path: "config/gate-log.md"
    disposition: union-append
    note: "chronological union of both sides' gate records; dropping either side's entries is an audit violation"
  - path: "docs/restructure/IDEAS.md"
    disposition: union-append
    note: "inbox + audit trail; both sides append — merge is the union (proven conflict site, 3x on 2026-07-09)"

  # ---- consumer-canonical (drydocs-review back-flow stream + wiring) --------
  - path: "drydocs/review/graph_review.py"
    disposition: canonical-company
    note: "producer copy = sanitized public template; consumer's carries real wiring"
  - path: "drydocs/review/graph_verify.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/review/review_labels.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/review/sme_notes.py"
    disposition: canonical-company
    note: "same back-flow rule"
  - path: "drydocs/review/gate_pages.py"
    disposition: canonical-company
    note: "back-flow rule; generic mechanism deltas (meta-card/provenance standard) fold in WITH their tests, or decline both together — logged"
  - path: "drydocs/review/publishing/**"
    disposition: canonical-company
    note: "consumer's carries the real Confluence connector; producer's is the abstracted template"
  - path: "config/review-labels.yaml"
    disposition: canonical-company
    note: "real labels consumer-side"
  # ---- machine-pair and eval working files: never cross (2026-09-02) ----------
  - path: "docs/lane-*-handoff.md"
    disposition: never-port
    note: >
      lane-handoff (2026-09-02): the per-burst queue one PRODUCER machine hands another.
      It retires itself when its queue empties and it names the producer's two machines'
      surfaces - a working file of one machine pair, never a port artifact. Without this
      row it fell to docs/** default: clean-add when absent, which is how the 08-27
      handoff would have crossed had a roll caught it live.
  - path: ".claude/skills/*-workspace/**"
    disposition: never-port
    note: >
      skill EVAL workspaces (lane-handoff-workspace/iteration-N/review.html and its kin):
      run transcripts and grader output embedded in a review page - producer working
      state under a canonical-producer tree, which is exactly the class of file a
      wholesale take of .claude/** would carry. The runs never cross; nor, since the user's
      ruling later the same day, does the lane-handoff skill itself (its own never-port row
      sits above the .claude/** glob) - lanes are producer-only tooling.
